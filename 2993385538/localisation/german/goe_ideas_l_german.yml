AFG_republic_idea:	"Die neue Republik"
AFG_republic_idea_desc:	"Unsere neue Republik wird unserem Volk mehr Freiheit und Gleichheit bieten als alles bisher Dagewesene. Mit der größeren Stabilität können wir uns nun der Entwicklung von Bildung und Wirtschaft zuwenden."
