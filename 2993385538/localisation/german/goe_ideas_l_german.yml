idea_RAJ_military_into_the_workforce:	"Militär in der Arbeitswelt"
idea_RAJ_military_into_the_workforce_desc:	"Ein großer Teil der Menschen, die zuvor beim Militär beschäftigt waren, hat nun eine Stelle in der zivilen Wirtschaft gefunden."
