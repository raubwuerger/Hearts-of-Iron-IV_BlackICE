PER_anglo_iranian_oil_ns:	"Anglo-Iranische Ölgesellschaft"
PER_anglo_iranian_oil_ns_desc:	"Die AIOC, die offiziell als Anglo-Persian Oil Company bekannt ist, wurde 1909 von [ENG.GetNameDef] nach der Entdeckung eines Ölfeldes von beträchtlicher Größe in Masjed Soleiman gegründet. Viele in [PER.GetNameDefCap] sind der Meinung, dass dieses Unternehmen die Ressourcen und Arbeitskräfte unseres Landes ausnutzt und die vielen Versprechen, die es gemacht hat, nicht erfüllt hat."
PER_rural_feudalism_ns:	"Ländlicher Feudalismus"
PER_rural_feudalism_ns_desc:	"Der Feudalismus ist ein veraltetes System zur Strukturierung der Gesellschaft durch den Besitz von Land im Austausch gegen Dienstleistungen und Arbeit. Obwohl es ein mittelalterliches Konzept ist, wird es in vielen ländlichen Regionen von [PER.GetNameDef] noch immer praktiziert."
PER_lingering_islamic_beliefs:	"Fortbestehende islamische Glaubensvorstellungen"
PER_islamic_traditions_ns:	"Islamische Traditionen"
PER_islamic_traditions_ns_desc:	"Traditionell folgt der Iran dem Islam schon seit Generationen. Er gilt als Staatsreligion und ist die Religion, der die Mehrheit der Bevölkerung folgt. Es gibt in der Regierung einige, die Religion und Staat säkularisieren wollen, aber das ist eine gewaltige Aufgabe und wird auf viel Widerstand stoßen."
PER_secularized_state_idea:	"Der säkularisierte Staat"
PER_secularized_state_idea_desc:	"Unter der Pahlavi-Dynastie wurde verordnet, dass [PER.GetNameDef] sich modernisieren muss, um mit den anderen großen Nationen der Welt mithalten zu können. Dazu gehört die Trennung von Religion und Staat. Die Menschen können den Islam weiterhin praktizieren, aber er wird keinen Einfluss mehr auf die Politik unseres Landes haben."
PER_unification_initiative_idea:	"Initiative zur Wiedervereinigung"
PER_unification_initiative_idea_desc:	"Es ist kein Geheimnis, dass unsere Nation teilweise zersplittert ist. Unsere Herrschaft wird durch mögliche Rebellionen der Kurden und Aserbaidschaner sowie innerhalb unserer eigenen Regierung bedroht. Die Vereinigungsinitiative wird dazu dienen, diese Bedrohungen auszulöschen und unsere Hegemonie über [PER.GetNameDef] zu sichern."
PER_azerbaijan_resistance_idea:	"Aserbaidschanischer Widerstand"
PER_azerbaijan_resistance_idea_desc:	"[PER.GetNameDefCap] umfasst einige Gebiete, die einst zum aserbaidschanischen Volk gehörten. Daher gibt es eine bedeutende Diaspora von Menschen, die mit unserer Herrschaft unzufrieden sind. In den Jahren zuvor konnte unsere Regierung eine Reihe von Aufständen in dieser Region von [PER.GetNameDef] niederschlagen, aber die rebellische Stimmung bleibt."
PER_kurdistan_resistance_idea:	"Kurdischer Widerstand"
PER_kurdistan_resistance_idea_desc:	"[PER.GetNameDefCap] umfasst einige Gebiete, die einst zum kurdischen Volk gehörten. Daher gibt es eine bedeutende Diaspora von Menschen, die mit unserer Herrschaft unzufrieden sind. In den Jahren zuvor konnte unsere Regierung eine Reihe von Aufständen in dieser Region von [PER.GetNameDef] niederschlagen, aber die rebellische Stimmung bleibt."
PER_modernizing_iran_idea:	"Die Modernisierungsinitiative"
PER_modernizing_iran_idea_desc:	"Die Modernisierung von [PER.GetNameDef] ist entscheidend, wenn wir Seite an Seite mit den großen Nationen dieser Welt stehen wollen. Die Durchführung dieser Initiative ist ein Zeichen dafür, dass wir uns der Verbesserung der Infrastruktur unserer großen Nation widmen und uns verpflichten, das Leben ihrer Bürger zu verbessern."
PER_adult_literacy_idea:	"Alphabetisierungskampagne für Erwachsene"
PER_adult_literacy_idea_desc:	"Die Alphabetisierung in der eigenen Sprache ist einer der wichtigsten Wege, auf denen sich Menschen befreit und gestärkt fühlen können. Nachdem wir eine landesweite Kampagne finanziert haben, um Erwachsene wieder in Bildungsprogramme einzubinden, sollten wir für eine gewisse Zeit einen Anstieg der Entwicklung von [PER.GetNameDef] sehen."
PER_trans_iranian_railway_idea:	"Bau der Transiranischen Eisenbahn"
PER_trans_iranian_railway_idea_desc:	"Die Transiranische Eisenbahn wird eine unserer größten Errungenschaften im Bereich der Technik in unserem Land sein. Indem wir unsere Anstrengungen auf den Bau dieser inneriranischen Eisenbahnlinie konzentrieren, werden wir in der Lage sein, unsere Mobilisierungsbemühungen in Kriegszeiten zu erhöhen."
PER_feat_of_engineering_idea:	"Meisterleistung der Ingenieurskunst"
PER_feat_of_engineering_idea_desc:	"Endlich haben wir die Transiranische Eisenbahn fertiggestellt. Wir haben es geschafft, diese wichtige Lebensader durch unser zerklüftetes Terrain zu schlängeln, um sicherzustellen, dass unsere Städte gut miteinander verbunden bleiben. Wir sollten stolz auf dieses schöne Beispiel der [PER.GetAdjective] Ingenieurskunst sein."
PER_white_revolution_idea:	"Startschuss für die Weiße Revolution"
PER_white_revolution_idea_desc:	"Aggressive Reformen sind notwendig, um die Modernisierung unseres Landes zu beschleunigen. Die Weiße Revolution oder die Revolution des Schahs und des Volkes soll dazu dienen, [PER.GetNameDef] an die Seite der großen Nationen im Westen zu bringen."
PER_price_stabilization_idea:	"Preisstabilisierung"
PER_price_stabilization_idea_desc:	"Zu lange haben die Besitzer von Fabriken und großen Handelsketten unangemessen von ihren Arbeitern und Kunden profitiert. Wir sollten uns um eine Stabilisierung der Preise im gesamten [PER.GetNameDef] bemühen, um die Preise für Waren landesweit zu fixieren."
PER_food_for_all_idea:	"Nahrung für alle [PER.GetAdjective]"
PER_food_for_all_idea_desc:	"Hungersnöte sind in unserem Land schon viel zu lange ein Thema. Mit einem neuen Programm, das sicherstellt, dass alle unsere Bürger Zugang zu Grundnahrungsmitteln haben, können wir vermeiden, jemals wieder in eine solche dunkle Grube des Leidens zu fallen."
PER_tehran_power_grid_idea:	"Erweitertes Teheraner Stromnetz"
PER_tehran_power_grid_idea_desc:	"Mit der Errichtung einer neuen Reihe von Kraftwerken in Teheran setzen wir die Modernisierung unseres Landes durch eine höhere Stromabdeckung fort."
PER_metropolitan_iran_idea:	"[PER.GetAdjective] Metropole"
PER_metropolitan_iran_idea_desc:	"Es ist uns gelungen, die [PER.GetAdjective] Metropole über die Grenzen Teherans hinaus zu erweitern. Unsere Städte wachsen und gedeihen dank unserer großen Modernisierungsanstrengungen. Dies ist wahrlich ein glorreicher Tag!"
PER_oil_baron_idea:	"[PER.GetAdjective] Ölbaron"
PER_oil_baron_idea_desc:	"Unser Land schwimmt geradezu im Öl, vor allem nach den Anstrengungen, die wir unternommen haben, um den [ENG.GetAdjective] Einfluss auf unsere Ressourcen zu beseitigen. Was machen wir dann mit all dem Öl? Wir horten es für uns selbst."
PER_future_of_war_idea:	"Die Zukunft des Krieges"
PER_future_of_war_idea_desc:	"Es lässt sich nicht leugnen, dass der Panzer ein Symbol für die Zukunft der Kriegsführung ist. Indem wir unsere Ressourcen in die Entwicklung unserer Panzertechnologie gesteckt haben, haben wir uns erfolgreich auf die Teilnahme an einem modernen Krieg vorbereitet."
PER_military_excellency_idea:	"[PER.GetAdjective] Militärische Exzellenz"
PER_military_excellency_idea_desc:	"Wir haben uns letztendlich entschieden, bei unserem stehenden Heer auf eine rigide und professionelle Ausbildung zu setzen. Am Ende des Tages werden gut disziplinierte Truppen die Schlacht gewinnen. Qualität geht vor Quantität!"
PER_foreign_retraining_idea:	"Initiative zur Umschulung von Ausländern"
PER_foreign_retraining_idea_desc:	"Indem wir ausländische Offiziere um die Ausbildung unserer Truppen gebeten haben, haben wir die ersten Schritte unternommen, um unsere derzeit schlecht ausgebildete und desorganisierte Armee zu verbessern."
PER_motorization_investments_idea:	"Investitionen in die Motorisierung"
PER_motorization_investments_idea_desc:	"Die Investitionen, die wir in die Entwicklung unserer Motorwaffenindustrie getätigt haben, werden sich auszahlen, wenn unsere Truppen mit Geschwindigkeit und Präzision über die Schlachtfelder fliegen."
PER_desert_training_idea:	"Spezialisiertes Wüstentraining"
PER_desert_training_idea_desc:	"Nach vielen langen Übungen und Märschen über die sandigen Ebenen haben wir endlich ein effektives Trainingsprogramm entwickelt, das unseren Truppen eine bessere Überlebenschance auf den Wüstenschlachtfeldern gibt."
PER_conscription_idea:	"Jeder Mann dient"
PER_conscription_idea_desc:	"Verzweifelte Zeiten haben verzweifelte Maßnahmen erfordert. Wir können zwar nicht die Zeit und die Ressourcen aufwenden, um eine vollwertige Armee zu schaffen, aber wir können dafür sorgen, dass jeder Mann, der dazu in der Lage ist, zu den Waffen greifen und für sein Land kämpfen kann."
PER_special_units_division_idea:	"Abteilung für Spezialeinheiten"
PER_special_units_division_idea_desc:	"Unsere Streitkräfte wurden jetzt durch eine Abteilung für Spezialeinheiten ergänzt. Jetzt können wir unsere Streitkräfte so ausbauen, dass wir neue Einheiten ins Feld führen und den Weg für die Schaffung eines Spionageprogramms ebnen können."
PER_savak_idea_no_lar:	"SAVAK gegründet"
PER_savak_idea_no_lar_desc:	"SAVAK ist die Spezialagentur und Geheimpolizei, die [PER.GetNameDef] dient. Ermutigt durch den persischen Löwen auf dem Logo arbeiten unsere Beamten unermüdlich, um die nationale Sicherheit unseres großen Landes zu gewährleisten."
PER_savak_lar:	"$PER_savak_idea_no_lar$"
PER_savak_lar_desc:	"$PER_savak_idea_no_lar_desc$"
PER_fund_state_intelligence_idea:	"Staatliche Nachrichtendienste finanzieren"
PER_fund_state_intellignece_idea_desc:	"Um unsere Fähigkeit zu verbessern, die Sicherheit des Staates zu überwachen, haben wir unsere Ressourcen in die Einrichtung einer größeren Kontrolle über unser staatliches Geheimdienstprogramm gesteckt."
PER_transfer_officer_idea_lar:	"Zum Geheimdienst versetzte Beamte"
PER_transfer_officer_idea_lar_desc:	"Da unser Nachrichtendienst wächst, haben wir die Notwendigkeit erkannt, einige neue Beamte in seine Reihen zu versetzen. Dies hat die Produktivität der Abteilung erhöht und wird die Sicherheit unserer Nation gewährleisten."
PER_transfer_officer_idea_no_lar:	"$PER_transfer_officer_idea_lar$"
PER_transfer_officer_idea_no_lar_desc:	"$PER_transfer_officer_idea_lar_desc$"
PER_airforce_modifier:	"Die iranische Luftwaffe"
PER_airforce_modifier_desc:	"Die iranische Luftwaffe war nie unsere oberste Priorität, aber wir glauben, dass es an der Zeit ist, Zeit und Ressourcen in die Perfektionierung unserer Abteilung und die Ausbildung unserer Piloten zu investieren. Wir werden der Welt zeigen, wie sehr wir die Kontrolle über den Luftraum erringen können."
PER_coastal_fortifications_idea:	"Initiative zur Küstenbefestigung"
PER_coastal_fortifications_idea_desc:	"Unsere Marine war nicht immer unsere stärkste Kraft. Um [PER.GetNameDef] vor einer Invasion der Marine zu schützen, müssen wir die Initiative zur Küstenbefestigung ergreifen, um sicherzustellen, dass unsere Küsten für die Dauer eines Konflikts sicher bleiben."
PER_state_local_defensive_dynamic_modifier:	"Lokale Verteidigungsmaßnahmen"
PER_legacy_of_greatness_modifier:	"Das Erbe der Großartigkeit"
PER_legacy_of_greatness_modifier_desc:	"Die Pahlavi-Dynastie hat sich als königliche Familie etabliert, die dazu bestimmt ist, [PER.GetNameDef] zu Größe und darüber hinaus zu führen. Auch wenn ihre Reformen bei einigen unpopulär sind, besteht kein Zweifel daran, dass der radikale Wandel, den sie dem Land bringen, die Sichtweise der übrigen Welt auf uns von nun an beeinflussen wird."
PER_state_atheism_idea:	"Vollständige Säkularisierung"
PER_state_atheism_idea_desc:	"Unser ultimatives Ziel ist es, den Nationen im Westen nachzueifern und [PER.GetNameDef] in die Moderne zu bringen. Wir dürfen uns nicht länger von religiösen Doktrinen aufhalten lassen. Auch wenn es den Klerus unserer Nation verärgern mag, ist es zum Wohle von [PER.GetNameDef], dass wir den Atheismus unter unseren Bürgern fördern."
PER_venerated_islam_idea:	"Der Islam wird verehrt"
PER_venerated_islam_idea_desc:	"Trotz unserer anfänglichen Ansicht, Staat und Religion zu trennen, können wir den Willen des Volkes nicht länger ignorieren. Der Islam ist seit vielen Jahren ein wichtiger Teil der [PER.GetAdjective] Kultur, und wir wären dumm, wenn wir uns von diesen Traditionen lossagen würden."
PER_old_ways_idea:	"Der wiederbelebte Zoroastrismus"
PER_old_ways_idea_desc:	"Der Zoroastrismus ist eine der ältesten monotheistischen Religionen der Welt und wurde im 6. Jahrhundert v. Chr. im alten Persien gegründet. Da diese Religion für die Kultur der alten persischen Reiche von entscheidender Bedeutung war, haben wir sie wiederbelebt, in der Hoffnung, dass sie das Bild des vergangenen Glanzes aufrechterhalten wird, das wir anstreben."
PER_imperial_expansionism_idea:	"Imperialer Expansionismus"
PER_imperial_expansionism_idea_desc:	"Für uns ist die Zeit gekommen, der Welt zu zeigen, wie fähig [PER.GetNameDef] ist. Wir haben die Fabriken angeheizt, wir haben das Volk mobilisiert. Bald ziehen wir in den Krieg, um Ruhm und Größe zu erlangen!"
PER_war_plan_darius_idea:	"Kriegsplan Dareios"
PER_war_plan_darius_idea_desc:	"Dareios der Große war der dritte König der Könige des Achämenidenreiches. Während er das Reich auf seinem territorialen Höhepunkt regierte, war er derjenige, der den persischen Einfluss bis in das Indus-Tal im heutigen Pakistan ausdehnte. Lassen Sie uns seine expansionistischen Ideale aufgreifen und gegen unsere Feinde im Osten vorgehen!"
PER_paying_for_baluchistan_idea:	"Bezahlen für Belutschistan"
PER_paying_for_baluchistan_idea_desc:	"Leider war [RAJ.GetNameDef] nicht bereit, dieses Gebiet ohne einen Preis zu geben. Wir werden ein Jahr lang unsere Schulden abbezahlen müssen."
PER_sold_baluchistan_idea:	"Belutschistan verkauft"
PER_sold_baluchistan_idea_desc:	"Als [PER.GetNameDef] die Gebiete von Belutschistan forderte, konnten wir ihnen für die Mühe etwas Geld abpressen. Wir werden die Zahlungen etwa ein Jahr lang erhalten."
PER_war_plan_xerxes_idea:	"Kriegsplan Xerxes"
PER_war_plan_xerxes_idea_desc:	"Xerxes der Große war der vierte König der Könige des Achämenidenreiches. Er ist vor allem für seine Invasion Griechenlands im Jahr 480 v. Chr. bekannt. Während diese mit einer persischen Niederlage endete, werden wir dieses Mal die Sieger sein. Lassen Sie uns in der Ägäis einmarschieren und die türkische Halbinsel zurückerobern."
PER_war_plan_cambyses_idea:	"Kriegsplan Kambyses"
PER_war_plan_cambyses_idea_desc:	"Cambyses II. war der zweite König der Könige des Achämenidenreiches. Er regierte ab 530 v. Chr. und seine Herrschaft war geprägt von seinen Eroberungen in Nordafrika, insbesondere in Ägypten, wo er Pharao wurde. Auf seinen Spuren müssen wir uns nach Westen begeben und versuchen, seine ehemaligen Gebiete zurückzuerobern."
PER_persepolis_idea:	"Persepolis wiederaufgebaut"
PER_persepolis_idea_desc:	"Als Zeichen unserer Macht als neue imperiale Macht haben wir die zeremonielle Hauptstadt des Achämenidenreiches erfolgreich wieder aufgebaut. Persepolis wird für immer als ein Symbol für [PER.GetAdjective] Exzellenz stehen."
PER_celebration_idea:	"Boom nach den Feierlichkeiten"
PER_celebration_idea_desc:	"Die Feier des alten persischen Reiches war ein Erfolg, und als solcher haben wir einen massiven Aufschwung in der Wirtschaft des Landes erlebt. Mit dem zunehmenden Tourismus und dem Handel, den wir durch unsere neu geknüpften Freundschaften aufgebaut haben, sollten wir in der Lage sein, das Hochgefühl einer solch opulenten Veranstaltung für das nächste Jahr zu nutzen."
PER_spoils_of_war_idea:	"Kriegsbeute"
PER_spoils_of_war_idea_desc:	"Nachdem wir unseren Verbündeten erfolgreich in ihrem Krieg geholfen haben, konnten wir uns als direkte Folge des Konflikts unsere eigenen Gebiete sichern. Es ist an der Zeit, dass wir diese Ländereien in unseren eigenen wachsenden Einflussbereich usurpieren."
PER_rapid_appeasement_idea:	"Schnelles Appeasement"
PER_rapid_appeasement_idea_desc:	"Um eine mögliche islamische Revolution einzudämmen, haben wir Reparationen angeboten, um die Opposition zu beschwichtigen. Dies sollte dazu beitragen, unser Land eine Zeit lang stabil zu halten, auch wenn es unsere Entwicklung verlangsamt."
PER_opposition_modifier:	"Zunehmende Opposition"
PER_opposition_modifier_desc:	"Da die Verachtung für das Pahlavi-Regime wächst, schließen sich immer mehr Menschen zusammen, um sich gegen die derzeitige Regierung zu stellen. Wenn diese Entwicklung weiter anhält, könnte das Land einer unruhigen Zukunft entgegensehen."
PER_constitutional_shah:	"Reza Schah Pahlavi"
PER_constitutional_shah_desc:	"Obwohl er das Gesicht des unglaublichen Wandels in [PER.GetNameDef] war, ist Reza Shah Pahlavi nun auf die Position eines konstitutionellen Monarchen zurückgestuft worden. Er ist jetzt nicht mehr als eine Galionsfigur, während unsere neue Regierung die Kontrolle über das Land übernimmt."
PER_aid_communists_cw:	"Internationale Solidarität"
PER_aid_communists_cw_desc:	"Jetzt, da wir uns von den Fesseln des Imperialismus befreit haben, müssen wir bereit sein, anderen Nationen in der Welt, die noch immer unter dem kolonialen Joch leiden, Hilfe zukommen zu lassen."
PER_communist_industrialization_idea:	"Rasche Industrialisierung"
PER_communist_industrialization_idea_desc:	"Unsere neue sozialistische Regierung muss die Industrialisierung rasch vorantreiben, wenn wir den Test der Zeit bestehen wollen. Schließlich sind wir jetzt wahrscheinlich zu einer Bedrohung für diejenigen geworden, die den Aufstieg des Proletariats fürchten."
PER_iranian_radio_idea:	"Nationales iranisches Radio"
PER_iranian_radio_idea_desc:	"Unser nationales Radiosystem wird dazu beitragen, die Meinung des Staates zu Themen zu verbreiten, über die sich die Öffentlichkeit nicht ganz einig ist."
PER_the_new_economy_idea:	"Die neue Wirtschaft"
PER_the_new_economy_idea_desc:	"Unsere neue Wirtschaft ist auf die Bedürfnisse unserer Bevölkerung ausgerichtet, anstatt den Markttrends zu folgen. Schließlich wollen wir den Schaden vermeiden, den der Kapitalismus bei unserer Arbeiterklasse angerichtet hat."
KUR_resistance_modifier:	"Kurdischer Widerstand"
KUR_resistance_modifier_desc:	"Trotz unserer Bemühungen ist das kurdische Volk in [PER.GetNameDef] unruhig und wütend geworden. Langsam aber sicher beginnen sie, gegen uns zu rebellieren."
PER_resistance_modifier:	"Zellen des Widerstands"
PER_resistance_modifier_desc:	"Diese Region wird von Widerstandszellen geplagt, die von [PER.GetNameDef] orchestriert werden."
PER_promoting_resistance_here:	"Förderung des Widerstands hier"
PER_gulf_hegemony_idea:	"Hegemonie am Golf"
PER_gulf_hegemony_idea_desc:	"Durch sorgfältiges Manövrieren haben wir uns schließlich als Hauptmacht in der Golfregion etabliert. "
PER_restoring_the_nation_idea:	"Wiederherstellung der Nation"
PER_restoring_the_nation_idea_desc:	"Durch die Umstrukturierung der Regierung haben wir Instabilität und Spaltung in unserer Nation verursacht. Wir müssen die Stabilität und Einheit unserer Nation wiederherstellen, bevor wir mit unseren Plänen fortfahren können."
PER_fascism_sway_the_rich_idea:	"Beeinflussung der Elite"
PER_fascism_sway_the_rich_idea_desc:	"Damit unsere neue Regierung gedeihen kann, müssen wir die Kontrolle über das Land behalten. Wir müssen so viele iranische Eliten wie möglich davon überzeugen, sich auf unsere Seite zu stellen, um sicherzustellen, dass unser Einfluss im Iran stark bleibt."
PER_invite_foreign_investors:	"Ausländische Investitionen"
PER_invite_foreign_investors_desc:	"Indem wir anderen Demokratien in der ganzen Welt die Hand gereicht haben, konnten wir unsere aufstrebende Wirtschaft ankurbeln und ihr Ressourcen zuführen."
PER_resist_gharbzadegi_idea:	"Widerstand gegen Gharbzadegi"
PER_resist_gharbzadegi_idea_desc:	"Die übermäßige Verwestlichung ist eine Plage für unsere große Nation. Anstatt uns den Launen derer zu beugen, die unsere Region seit Jahrhunderten kolonialisiert haben, sollten wir daran arbeiten, ein demokratisches System zu schaffen, das auf eigenen Füßen stehen kann."
PER_stand_with_giants_modifier:	"Sich mit Giganten messen"
PER_stand_with_giants_modifier_desc:	"Seit seinem Aufstieg an die Macht wollte Reza Shah Pahlavi [PER.GetNameDef] modernisieren und mit den anderen großen Nationen der Welt gleichziehen. Dies ist der Beginn vieler neuer sozialer, wirtschaftlicher und politischer Reformen in [PER.GetNameDef] und wird sich zwangsläufig in dieser Richtung weiterentwickeln."
PER_persian_german_trade_idea:	"Persisch-Deutsche Handelskammer"
PER_persian_german_trade_idea_desc:	"Eine Organisation, die gegründet wurde, um positive Handelsbeziehungen zwischen [PER.GetNameDef] und [GER.GetNameDef] zu fördern und die kontinuierliche Modernisierung unserer Industrie nach dem Vorbild einer der bedeutendsten Industriemächte der Welt sicherzustellen."
PER_trial_fifty_three_idea:	"Das Verfahren gegen die dreiundfünfzig Personen eingeleitet"
PER_trial_fifty_three_idea_desc:	"Nachdem wir dreiundfünfzig Iraner wegen ihrer Beteiligung an kommunistischen politischen Aktivitäten verhaftet hatten, konnten wir sie wegen ihrer regierungsfeindlichen Gesinnung vor Gericht stellen. Wir konnten nicht zulassen, dass eine solche Dissidenz in einer für unser Land so kritischen Zeit Fuß fassen konnte."
PER_homeland_not_fall_idea:	"Unser Kampfgeist"
PER_homeland_not_fall_idea_desc:	"Es ist an der Zeit, unseren Kampfgeist unter Beweis zu stellen und denen, die unsere Heimat bedrohen, standhaft entgegenzutreten. Versammeln Sie die Truppen, glauben Sie an Ihre Brüder und machen Sie sich bereit, für die Zukunft unseres Landes zu kämpfen. [PER.GetNameDefCap] wird nicht an diese Kriegstreiber fallen! Schicken Sie sie mit eingezogenem Schwanz in die Flucht!"
PER_preemtive_strike_idea:	"Zuerst zuschlagen"
PER_preemtive_strike_idea_desc:	"Wir haben keine Zeit, auf eine Invasion zu warten! Wir müssen unbedingt zuschlagen, solange das Eisen heiß ist, und dafür sorgen, dass wir einige Pufferstaaten zwischen uns und den größeren Nationen schaffen können, die es wagen, unsere Souveränität zu bedrohen!"
PER_compliant_subject_idea:	"Nachgiebiges Subjekt"
PER_compliant_subject_idea_desc:	"Gegen eine Macht wie [ROOT.OVERLORD.GetNameDef] gibt es keinen Sieg zu erringen. Stattdessen müssen wir unsere Rolle als Untertan spielen und zeigen, dass wir es wert sind, ein mächtiger Vasall zu sein."
PER_anti_soviet_idea:	"Antisowjetische Gefühle"
PER_anti_soviet_idea_desc:	"Nachdem wir während der Invasion im Iran unser Territorium erobert haben, ist es an der Zeit, dass wir uns an diesen Kriegstreibern rächen und uns das zurückholen, was uns rechtmäßig gehört. Wir werden nicht aufhören, bis unser ehemaliges Territorium wieder uns gehört."
PER_azadi_idea:	"Der Geist von Azadi"
PER_azadi_idea_desc:	"Azadi, oder 'Freiheit' auf Persisch, wird unser Schlachtruf sein, wenn wir versuchen, uns gegen die Kräfte zu erheben, die unser Land besetzen. Wir werden uns nicht ihrem Willen beugen, sondern für unsere Freiheit kämpfen, ganz gleich, wie lange es dauern mag."
PER_offensive_tactics_modifier:	"Offensiv-Taktik"
PER_offensive_tactics_modifier_desc:	"Die einzige Möglichkeit, wie wir [PER.GetNameDef] schützen können, ist, sofort in die Offensive zu gehen. Mit diesen neuen Taktiken werden wir in einer guten Position sein, um unseren Feind zurückzudrängen!"
PER_defensive_maneuvers_modifier:	"Defensive Manöver"
PER_defensive_maneuvers_modifier_desc:	"Unsere Verteidigung muss so unbeweglich sein wie ein Gebirge, wenn wir den Feind davon abhalten wollen, unsere Städte zu bedrohen. Unsere neu eingeführten Verteidigungsmanöver werden die feindlichen Kräfte hoffentlich in Schach halten!"
PER_enemy_war_reparations_idea:	"Kriegsreparationen"
PER_enemy_war_reparations_idea_desc:	"Aufgrund des Scheiterns unserer Operation in [PER.GetNameDef] müssen wir nun für die hohen Kosten unserer Invasion aufkommen. Obwohl dies nicht ideal ist, sollten wir in der Lage sein, unsere Reparationen innerhalb von zwei Jahren abzuschließen."
