AFG_placated_graduates_desc:	"Durch die Ausweitung des öffentlichen Dienstes ist es uns gelungen, einen Großteil der arbeitslosen Hochschulabsolventen aufzufangen, die sich sonst radikalisiert hätten."
AFG_expanded_education:	"Erweitertes Bildungswesen"
AFG_expanded_education_desc:	"Ein erhöhtes Bildungsbudget hat zu einem Anstieg der Lehrmöglichkeiten in einer stark erweiterten Bildungseinrichtung geführt."
AFG_communist_graduates:	"Kommunistische Absolventen"
AFG_communist_graduates_desc:	"Eine beträchtliche Anzahl von Hochschulabsolventen hat sich nach ihrem Abschluss radikalisiert, weil es keine Beschäftigungsmöglichkeiten gibt, die ihre erworbenen Fähigkeiten nutzen."
