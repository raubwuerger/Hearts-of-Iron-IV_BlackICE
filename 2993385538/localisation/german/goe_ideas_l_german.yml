IRQ_royal_army_modifier_KUR:	"Kurdische Armee"
IRQ_royal_army_modifier_desc:	"Die irakische Armee wurde 1921 unter den wachsamen Augen des [ENG.GetAdjective] gegründet und dient als Abschreckung gegen Aggressionen aus den Nachbarstaaten. Die hochrangigen Offiziere des Militärs sehnen sich jedoch nach einer Gelegenheit, ihre Streitkräfte zu erweitern und zu modernisieren, um die Nachbarn nicht nur abzuschrecken, sondern sie zu beherrschen."
