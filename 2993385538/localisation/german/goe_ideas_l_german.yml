AFG_mohammad_zahir_shah_ns:	"König Zahir Shah"
AFG_mohammad_zahir_shah_ns_desc:	"König Zahir Shah bestieg den Thron nach dem Tod seines Vaters im Jahr 1933. Aufgrund seines jungen Alters und des Fehlens einer eigenen politischen Basis haben jedoch die Onkel des Königs die tatsächliche Macht in der Regierung inne, so dass er kaum mehr als eine Galionsfigur ist. Zahir Shah wird sich entscheiden müssen, ob er abwarten oder seine Onkel schnell aus dem Amt jagen will, wenn er seine eigene Agenda verfolgen will."
AFG_mohammad_zahir_shah_ns_upgrade_1:	"$AFG_mohammad_zahir_shah_ns$"
AFG_mohammad_zahir_shah_ns_upgrade_1_desc:	"$AFG_mohammad_zahir_shah_ns_desc$"
AFG_mohammad_zahir_shah_ns_negative:	"$AFG_mohammad_zahir_shah_ns$"
AFG_mohammad_zahir_shah_ns_negative_desc:	"$AFG_mohammad_zahir_shah_ns_desc$ $AFG_mohammad_zahir_shah_ns_desc$"
AFG_subsistence_economy_modifier:	"Subsistenzwirtschaft"
AFG_subsistence_economy_modifier_desc:	"Die Mehrheit der Bevölkerung lebt auf dem Lande und produziert gerade genug Nahrung für sich und ihre Familien, um die harten Wintermonate zu überstehen. Sie haben wenig Interesse daran, ihre Lebensweise zu ändern, um ausufernden, gewinnbringenden Industrien Platz zu machen, und es ist unwahrscheinlich, dass sie diese Einstellung ändern werden, egal wer in Kabul die Macht hat."
AFG_pashtunwali:	"Pashtunwali"
AFG_pashtunwali_desc:	"Die Paschtunen stellen den größten und politisch mächtigsten Teil der Bevölkerung dar. Ein großer Teil der Paschtunen lebt nach dem traditionellen Kodex der Ethik und der Regeln, die als Paschtunwali bekannt sind. Dies hat es für Regierungen schwierig gemacht, ihre Macht zu erhalten, geschweige denn Reformen durchzuführen, wenn sie mit dem traditionellen Kodex in Konflikt zu geraten drohen."
AFG_concessions_pashtunwali:	"Paschtunische Demokratie"
AFG_economic_regionalism:	"Wirtschaftlicher Regionalismus"
AFG_economic_regionalism_desc:	"Den verschiedenen Regionen Afghanistans mangelt es an einem starken Zusammenhalt mit der nationalen Regierung oder Wirtschaft, da es an geeigneter Infrastruktur fehlt. Dies erschwert die Teilung der wirtschaftlichen Lasten oder Gewinne außerhalb der jeweiligen Regionen und trägt zu ihrer anhaltenden Isolation bei."
AFG_turkish_military_mission:	"Türkische Militärmission"
AFG_turkish_military_mission_desc:	"Seit 1933 helfen türkische Militärangehörige bei der Ausbildung der nächsten Generation von afghanischen Soldaten. Vielleicht könnte diese Vereinbarung mit der Zeit erweitert werden, um unsere großen Nationen einander näher zu bringen."
