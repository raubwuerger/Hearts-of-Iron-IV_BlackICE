IRQ_anglo_iraqi_treaty:	"Anglo-irakischer Vertrag"
IRQ_anglo_iraqi_treaty_desc:	"Obwohl 1930 neu verhandelt, bleibt der anglo-irakische Vertrag ein einseitiges Abkommen, das den Irak de facto zu einem Klientelstaat des britischen Empire macht. Der Vertrag räumt den Briten Vorzugsrechte an den irakischen Ölvorkommen ein und erlaubt ihnen die Nutzung von Militäreinrichtungen im ganzen Land. Dies sorgt weiterhin für massiven Unmut unter der irakischen Bevölkerung, die sich nach echter Unabhängigkeit sehnt. Jede Regierung, die an die Macht kommt, wird sich entscheiden müssen, ob sie den Vertrag neu verhandelt oder ihn zerreißt und den Zorn des britischen Militärs riskiert."
IRQ_agrarian_society:	"Landwirtschaftliche Gesellschaft"
IRQ_agrarian_society_desc:	"Die irakische Industrie dreht sich um den Agrarsektor, und die konservative Führung in der Region hat kein Interesse an der Entwicklung und Industrialisierung des Landes gehabt. Um die Probleme in diesem Land zu lösen, müssen Zeit und Mühe aufgewendet werden."
