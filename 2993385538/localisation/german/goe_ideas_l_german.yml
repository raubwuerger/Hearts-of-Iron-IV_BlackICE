IRQ_al_muthanna_club_idea:	"Al-Muthanna Vereine"
IRQ_al_muthanna_club_idea_desc:	"Die Al-Muthanna Clubs sind eine starke Kraft in der irakischen Gesellschaft, die den arabischen Nationalismus und antiimperialistische Gefühle fördert. Während sie die irakische Jugend zu Einigkeit und Stolz inspirieren, besteht die Gefahr, dass ihre radikale Rhetorik und ihr Einfluss auf die Politik die Spaltung vertiefen und den fragilen Staat destabilisieren."
