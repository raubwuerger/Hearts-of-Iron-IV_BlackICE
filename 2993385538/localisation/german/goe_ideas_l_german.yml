AFG_counter_elite_on_the_rise_desc:	"Die jüngsten politischen Reformen haben eine Flut unkonventioneller Denker in Wissenschaft und Politik hervorgebracht, die ihre Ideen umsetzen."
IRQ_golden_square:	"Das Goldene Quadrat"
IRQ_golden_square_desc:	"Das Goldene Quadrat, eine Clique hochrangiger irakischer Militäroffiziere, bleibt eine Bedrohung für die Stabilität des Landes. Sie sympathisieren mit den antibritischen Regimes in Europa und hoffen darauf, dass sie helfen können, das Joch des britischen Einflusses abzuschütteln, wenn sich die Gelegenheit ergibt."
