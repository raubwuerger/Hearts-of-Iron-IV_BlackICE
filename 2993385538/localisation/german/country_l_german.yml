NAVY_EXPERIENCE_DESC:0	"Wenn deine Schiffe im Kampf und in §HMarineübungen§! eingesetzt werden, erhältst du Marineerfahrung. Bestimmte §HNationale Schwerpunkte§! geben zusätzliche Erfahrung und einige §HMinister§! können die gewonnene Erfahrung erhöhen.\n\nMarineerfahrung wird verwendet, um bessere Varianten bestehender Schiffe zu entwickeln."
