INDUSTRIAL_CAPACITY_DESC:1	"Fabriken bilden die Grundlage der §Hindustriellen Kapazität§! des Landes. §HMilitärfabriken§! stellen Ausrüstung für die Armee und die Luftwaffe her, während §HMarinewerften§! Schiffe für die Marine bauen und reparieren. §HZivile Fabriken§! errichten und reparieren Gebäude und Infrastruktur sowie erleichtern den Handel. \n\n§YWerkzeugmaschinen§! werden benötigt, damit Fabriken mit voller Effizienz laufen können. Sie werden automatisch aus Ersatzteilen hergestellt £resources_strip|4 §YWolfram§!. Unterhalb von §Y50§! Fabriken ist unsere Industrie §Gklein genug, um ohne Werkzeuge zu funktionieren§!."
