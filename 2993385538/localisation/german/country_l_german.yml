AIR_EXPERIENCE_DESC:0	"Wenn Ihre Flugzeuge den Feind in Missionen angreifen oder in §HPilotenübungen§! üben, sammeln Sie Lufterfahrung. Das bedeutet, dass Sie Lufterfahrung gewinnen können, wenn Ihre §HLuftgeschwader§! in den Kampf ziehen oder wenn Sie §HLeih und Pacht§! Ausrüstung an die Kriege Ihrer Verbündeten verleasen.\nBestimmte §HNational Focuses§! geben zusätzliche Erfahrung und einige §HMinister§! können die gewonnene Erfahrung erhöhen.\n\nLufterfahrung wird verwendet, um bessere Varianten von bestehenden Flugzeugen zu entwickeln."
COMMAND_POWER:0	"Befehlsgewalt"
COMMAND_POWER_DESC:0	"§HBefehlsgewalt§! wird für verschiedene militärische Operationen und die Beförderung von Generälen verwendet. Sie kann für einmalige Operationen ausgegeben oder für kontinuierliche Operationen eingesetzt werden. Das Wachstum und die maximale Kapazität der §HBefehlsgewalt§! kann durch verschiedene Doktrinen und Nationalgeister erhöht werden."
