NATIONAL_UNITY_DESC:0	"Nationale Einheit steht für die Bereitschaft der Bevölkerung an der Spitze, einen Krieg bis zum Ende zu führen. Je höher dieser Wert ist, desto länger werden sie weiterkämpfen, bevor sie eine Kapitulation in Betracht ziehen."
STABILITY_DESC:0	"Eine hohe Stabilität erleichtert die Durchsetzung politischer Veränderungen und trägt zum reibungslosen Funktionieren der Wirtschaft bei."
WAR_SUPPORT_DESC:0	"Kriegsunterstützung steht für die Bereitschaft des Volkes, einen Krieg bis zum Ende zu führen. Die Verabschiedung vieler Gesetze und die effektive Vorbereitung des Volkes auf einen Krieg erfordern eine hohe Kriegsunterstützung."
