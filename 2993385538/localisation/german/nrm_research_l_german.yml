nrm_carrier_convoy_desc:0	""
nrm_integrated_convoy_defence:0	"Integrierte Konvoiverteidigung"
nrm_submarine_tactics_early_desc:0	"Die Schulung unserer U-Boot-Besatzungen in der Positionierung ihres Bootes ermöglicht es ihnen, im günstigsten Moment Schaden anzurichten, nämlich wenn sich die Begleitschiffe in einiger Entfernung befinden. Eine überlegene Positionierung bedeutet auch, dass unsere U-Boote nach einem erfolgreichen Angriff mit größerer Wahrscheinlichkeit entkommen können."
nrm_submarine_offensive_operations:0	"Priorität für offensive U-Boot-Operationen"
nrm_submarine_offensive_operations_desc:0	"Wenn wir unseren U-Booten erlauben, unabhängig vom Rest der Flotte zu operieren, können sie ihre Tarnkappeneigenschaften optimal nutzen. U-Boote, die unabhängig operieren, haben zudem eine höhere Chance, nach einem Hinterhalt auf einen Konvoi zu entkommen."
nrm_submarine_fleet_operations:0	"Priorität für U-Boot-Flottenoperationen"
nrm_submarine_fleet_operations_desc:0	"Durch die Integration unserer U-Boote in unsere Überwasserflotten können diese als äußerst leistungsfähige Aufklärungs- und Erkundungsmittel eingesetzt werden, die Informationen über die Positionen feindlicher Schiffe liefern und potenzielle Ziele beschatten, bis die Überwasserflotte eintrifft."
nrm_submarine_raiding_improved_desc:0	"Indem wir die Unabhängigkeit der U-Boote von der Überwasserflotte weiter betonen, können wir unseren U-Boot-Kapitänen ein hohes Maß an Autonomie beim Angriff auf feindliche Schiffe gewähren. Wir werden ihnen nicht vorschreiben, wie sie ihre Arbeit zu erledigen haben, sondern ihnen lediglich sagen, dass sie losziehen und Ergebnisse erzielen sollen."
nrm_submarine_scouting:0	"Aufklärer der U-Boot-Flotte"
nrm_submarine_scouting_desc:0	"Indem wir unseren U-Boot-Kapitänen ein gewisses Maß an Autonomie gewähren, während sie weiterhin in die Überwasserflotten integriert sind, können sie bei der Aufklärung und der Suche nach feindlichen Schiffen Eigeninitiative zeigen."
nrm_submarine_tactics_improved:0	"Verbesserte U-Boot-Taktiken"
nrm_submarine_unrestricted_desc:0	"Durch den Verzicht auf die veralteten "Prisenregeln" können unsere U-Boote feindliche Handelsschiffe mit ihren Torpedos angreifen, während sie noch unter Wasser sind und ohne Vorwarnung. Dadurch wird die Wahrscheinlichkeit, dass die von unseren U-Booten gelegten Hinterhalte zu Abschüssen führen, erheblich gesteigert."
nrm_submarine_wolfpack:0	"Wolfsrudel-Taktik"
nrm_submarine_wolfpack_desc:0	"Wenn eines unserer U-Boote einen Konvoi entdeckt, greift es diesen nicht sofort an. Es kontaktiert andere U-Boote in der Umgebung und beschattet den Konvoi. Bei Einbruch der Dämmerung, sobald alle kontaktierten U-Boote eingetroffen sind, beginnt der Angriff. Dadurch werden die Feuerkraft und die Hinterhaltseigenschaften unserer U-Boote zu einem tödlichen Ergebnis gebündelt."
nrm_submarine_tactics_advanced:0	"Fortgeschrittene U-Boot-Taktiken"
nrm_submarine_tactics_advanced_desc:0	"Die Entfernung von Kommandanten, die als nicht aggressiv genug gelten, oder von solchen, die beharrlich Fehler begehen oder vor einem Kampf zurückschrecken, wird dazu führen, dass unsere Boote ein Ziel mit größerer Wahrscheinlichkeit bis zum erfolgreichen Abschuss verfolgen werden."
