nrm_naval_aviation:0	"Marinefliegerei"
nrm_naval_aviation_desc:0	"Mit dem Einzug von Flugzeugen, die schwerer als Luft sind, in die Kriegsführung ist es an der Zeit, dass wir uns damit befassen, wie dies zu unserem Vorteil in der Marine genutzt werden kann. Die Entwicklung von Schiffen, die speziell für den Einsatz von Flugzeugen ausgelegt sind, ist für jede Marinefliegereinheit ein Muss."
nrm_carrier_independent:0	"Unabhängige Flugzeugträgeroperationen"
nrm_carrier_independent_desc:0	"Der Einsatz dieser neuen Technologie als neuer Eckpfeiler unserer Flotten wird es uns ermöglichen, die auf hoher See verfügbare Luftmacht in vollem Umfang zu nutzen, einschließlich in den Bereichen Aufklärung, Angriff und Luftüberlegenheit."
nrm_carrier_integrated_desc:0	"Unsere trägergestützten Flugzeuge sollen zur Unterstützung unserer bestehenden Großkampfschiffe eingesetzt werden, indem sie diese vor feindlichen Flugzeugen und Schiffen schützen."
nrm_carrier_development:0	"Entwicklung von Flugzeugträger-Taktiken"
nrm_carrier_offensive_desc:0	"Durch den Einsatz unserer Flugzeugträger in einer offensiven Rolle können wir deren Schlagkraft maximieren. Dies bedeutet, dass unsere Flugzeuge hauptsächlich in einer direkten Offensivrolle eingesetzt werden, um feindliche Schiffe anzugreifen."
nrm_carrier_scouting:0	"Aufklärungsrolle des Flugzeugträgers"
nrm_carrier_defensive_desc:0	""
nrm_carrier_support:0	"Trägerunterstützungsgruppe"
