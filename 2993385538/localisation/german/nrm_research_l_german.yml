semimodern_naval_radar:0	"Verbessertes Zentimeterwellen-Marineradar"
early_fire_control_system:0	"Frühes Feuerleitsystem"
semimodern_fire_control_system_desc:0	"Ein großer und komplexer mechanischer Rechner, der eine Vielzahl von Eingaben sowohl zum Ziel und zum schießenden Schiff als auch zu Wetterbedingungen und Seegang verarbeitet und sehr genaue ballistische Berechnungen ermöglicht."
modern_fire_control_system:0	"Fortschrittliches Flugabwehr-Feuerleitsystem"
modern_fire_control_system_desc:0	"Ein spezielles Computersystem zur Berechnung von Feuerlösungen für den Flugabwehrbereich."
