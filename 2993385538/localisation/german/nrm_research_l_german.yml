advanced_ship_hull_carrier_escort_desc:	"Geleitschiffe erhalten jetzt verstärkte Rümpfe, erweiterte Flugzeugkapazitäten und fortschrittliche Radarleitsysteme, die eine größere Effektivität bei der Flottenunterstützung, der Konvoiverteidigung und der U-Bootabwehr gewährleisten."
early_ship_hull_cruiser_desc:	"Die neuesten Kreuzer kombinieren leichte Panzerung, schnell feuernde Geschütze und moderate Geschwindigkeit, um Aufklärungs-, Handelsangriffs- und Flottenunterstützungsaufgaben zu erfüllen. Ihre Feuerkraft reicht zwar nicht aus, um gegen große Schiffe zu bestehen, aber ihre Vielseitigkeit bei Flottenaktionen und unabhängigen Operationen erweist sich als wertvoll."
improved_ship_hull_cruiser_desc:	"Die neuen Kreuzer zeichnen sich durch eine verbesserte Rumpfform, eine bessere Unterteilung und verbesserte Antriebssysteme aus, so dass sie mit höherer Geschwindigkeit und größerer Treibstoffeffizienz operieren können. Diese Schiffe werden das Rückgrat moderner Seestreitkräfte bilden und sich bei Flottenangriffen und beim Schutz des Handels auszeichnen."
advanced_ship_hull_cruiser_desc:	"Kreuzer verfügen jetzt über eine radargesteuerte Feuerleitanlage, eine verbesserte Panzerung und eine verbesserte Flugabwehrbewaffnung, die sie sowohl bei Flottenangriffen als auch bei eigenständigen Raubzügen überlebensfähiger und tödlicher macht."
 
