early_ship_hull_carrier_desc:	"Marinestrategen rüsten große Schiffsrümpfe zu den ersten speziellen Flugzeugträgern um, was begrenzte, aber effektive Luftoperationen auf See ermöglicht. Obwohl diese Schiffe noch anfällig und im Versuchsstadium sind, werden sie den Seestreitkräften wichtige Aufklärungs- und Angriffsfähigkeiten bieten."
basic_ship_hull_carrier_short:0	"Trägerrumpf (Umbau)"
improved_ship_hull_carrier:0	"Trägerrumpf (verbessert)"
improved_ship_hull_carrier_desc:0	"Spezialisierte Flugzeugträger werden nun mit verstärkten Stahlflugdecks, effizienteren Flugzeugabfertigungssystemen und größeren Luftflügeln gebaut. Diese Träger werden einen bedeutenden strategischen Vorteil bieten und als mobile Luftstützpunkte dienen, die in der Lage sind, Langstreckenangriffe durchzuführen und die Flotte zu verteidigen."
advanced_ship_hull_carrier_short:0	"Trägerrumpf (fortgeschritten)"
advanced_ship_hull_carrier_super:0	"Großer Flugzeugträgerrumpf"
advanced_ship_hull_carrier_super_desc:0	"Die Schiffsbautechnik hat mit dem Bau großer Flottenflugzeugträger ihren Höhepunkt erreicht. Diese sind darauf ausgelegt, größere und modernere Flugzeuge aufzunehmen und gleichzeitig längere Einsätze zu ermöglichen. Mit stark verstärkten Flugdecks, hochmodernen Radarsystemen und erweiterter Automatisierung garantieren diese Schiffe die Luftüberlegenheit über den Meeren."
improved_ship_hull_carrier_escort_desc:	"Kleinere, kostengünstigere Begleitträger gehen nun in Produktion; sie sind für den Konvoischutz und die U-Boot-Bekämpfung konzipiert. Obwohl ihre Luftkapazität und Panzerung minimal sind, spielen sie eine entscheidende Rolle bei der Ausweitung der Luftsicherung über weite Meeresgebiete."
basic_ship_hull_submarine:0	"U-Boot-Rumpf (verbessert)"
basic_ship_hull_submarine_short:0	"U-Boot-Rumpf (verbessert)"
basic_ship_hull_submarine_desc:0	""
advanced_ship_hull_submarine:0	"U-Boot-Rumpf (fortgeschritten)"
advanced_ship_hull_submarine_short:0	"U-Boot-Rumpf (fortgeschritten)"
advanced_ship_hull_submarine_desc:0	""
early_ship_hull_light:0	"Zerstörer-Rumpf (früh)"
early_ship_hull_light_desc:0	"Die neuesten Zerstörerentwürfe legen den Schwerpunkt auf Geschwindigkeit, Torpedobewaffnung und Flottenschutz, um eine schnelle Reaktion auf feindliche Torpedoboote zu gewährleisten. Diesen Schiffen fehlen zwar fortschrittliche Feuerleitsysteme und Luftabwehrfähigkeiten, doch sie bieten die für Hochgeschwindigkeitsgefechte und Begleitaufgaben erforderliche Wendigkeit."
basic_ship_hull_light:0	"Zerstörer-Rumpf (verbessert)"
early_ship_hull_heavy:0	"Rumpf eines Großkampfschiffs (frühe Version)"
early_ship_hull_heavy_short:0	"Rumpf eines Großkampfschiffs (frühe Version)"
early_ship_hull_heavy_desc:0	"Schiffbauingenieure konstruieren neue Schlachtschiffe im Dreadnought-Stil, die sich durch großkalibrige Geschütze, dicke Panzerung und große Reichweite auszeichnen. Diese Kriegsschiffe werden die Seeherrschaft neu definieren, da sie in direkten Gefechten jede bisherige Generation von Großkampfschiffen an Feuerkraft übertreffen."
basic_ship_hull_cruiser_desc:	"Bei Kreuzerentwürfen liegt der Schwerpunkt nun auf größerer Reichweite, verbesserter Feuerleitung und besser geschützten Geschütztürmen, wodurch sie sowohl bei Flottengefechten als auch bei Überfalloperationen äußerst effektiv sind. Diese neuen Schiffe sind schneller und widerstandsfähiger und in der Lage, kleinere Schiffe zu bekämpfen, während sie gleichzeitig direkte Gefechte mit Schlachtschiffen vermeiden."
advanced_ship_hull_cruiser:	"Kreuzer (fortgeschritten)"
large_cruiser_hull:0	"Große Kreuzer"
large_cruiser_hull_short:0	"Große Kreuzer"
large_cruiser_hull_desc:0	""
improved_ship_hull_heavy_desc:	"Eine neue Generation von Schlachtschiffen verfügt über eine schnellere Geschützturmrotation, verbesserte Entfernungsmessoptiken und eine überlegene Kompartimentierung, um Torpedoschäden standzuhalten. Auch die Flugabwehrbewaffnung wird verstärkt, um sicherzustellen, dass Schlachtschiffe gegenüber aufkommenden Bedrohungen aus der Luft weiterhin einsatzfähig bleiben."
improved_depth_charges_2:0	"Verbesserter Wasserbombenwerfer"
improved_depth_charges_2_desc:0	"Eine verbesserte Vorrichtung zum Abfeuern von Wasserbomben für ein angreifendes Schiff, die eine effektivere Bekämpfung von U-Booten ermöglicht."
improved_sonar_2:0	"Verbessertes Hydrofon & Frühsonar"
improved_sonar_2_desc:0	"Zusätzlich zum Hydrofon kann dieses System durch den Einsatz modulierter Schallwellen Peilung und Entfernung zu einem Ziel genau messen."
improved_sonar_3:0	"Verbessertes Hydrofon & Sonar"
improved_sonar_3_desc:0	"Durch Verfeinerungen am Sonarsystem kann dieses die Position des Ziels genauer bestimmen."
improved_sonar_4:0	"Fortgeschrittenes Hydrofon & Sonar"
improved_sonar_4_desc:0	"Die Kombination aus fortschrittlichen Hydrophonen und Sonar ermöglicht es diesem System, Ziele mit hoher Genauigkeit zu erkennen und zu verfolgen."
airplane_launcher_desc:0	"Eine Bordkatapultanlage ermöglicht den Einsatz von Aufklärungsflugzeugen, mit denen die Suchfähigkeiten des Schiffes erweitert werden können."
open_hangar_desc:0	"Die Nutzung eines offenen Hangars ermöglicht einen effizienteren Flugbetrieb, da Flugzeuge im Hangar aufgewärmt werden können und die leichtere Konstruktion den Einbau größerer Hangars erlaubt."
advanced_hangar:0	"Offener Hangar & gepanzertes Flugdeck"
super_heavy_armor_plates:0	"Produktion superschwerer Panzerung"
super_heavy_armor_plates_desc:0	"Der Bau von Schlachtschiffpanzerung, die eine bestimmte Dicke überschreitet, erfordert noch spezialisiertere Anlagen und Verfahren. \n Schaltet ~400 mm, ~425 mm und ~450 mm Gürtelpanzerung frei."
super_heavy_armor_plates_2:0	"Produktion superschwerer Panzerung (fortgeschritten)"
basic_carrier_armor_scheme:0	"Verbessertes Panzerungskonzept für Flugzeugträger"
basic_carrier_armor_scheme_desc:0	"Ein Panzerungskonzept, das die bei Großkampfschiffen übliche Trennung zwischen Gürtel- und Deckpanzerung nachahmt und einen gewissen Schutz vor Splitter und kleinkalibrigen Geschützen bietet."
advanced_carrier_armor_scheme:0	"Fortgeschrittenes Panzerungskonzept für Flugzeugträger"
advanced_carrier_armor_scheme_desc:0	"Weitere Verfeinerungen der Panzerungskonzepte ermöglichen es uns, die lebenswichtigen Teile des Schiffes noch effizienter zu schützen."
advanced_engine:0	"Fortschrittliche Dampfturbine"
advanced_engine_desc:0	"Fortschrittliche Hochdruck-Dampfturbinen haben die Effizienz und Leistung der Schiffsmaschinen weiter gesteigert."
large_diesel:0	"Große Dieselmotoren"
large_diesel_desc:0	"Während Dieselmotoren bereits seit einiger Zeit in U-Booten und kleinen Wasserfahrzeugen zum Einsatz kommen, ermöglichen jüngste Entwicklungen den Einbau großer, effizienter Dieselmotoren für den Schiffsantrieb."
improved_diesel:0	"Verbesserter Dieselmotor"
improved_diesel_desc:0	"Fortschrittlichere Dieselmotoren ermöglichen einen leichteren, leistungsstärkeren und effizienteren Dieselantrieb für Schiffe."
early_sub_diesel:0	"U-Boot-Motoren"
improved_sub_diesel_desc:0	"Weitere Verfeinerungen im Design von U-Boot-Motoren ermöglichen höhere Geschwindigkeiten und längere Betriebszeiten unter Wasser."
advanced_sub_diesel:0	"Fortschrittlicher U-Boot-Motor"
improved_carrier_airgroup_search_desc:0	"Neuere Aufklärungsflugzeuge verfügen über eine größere Reichweite, bessere Kameras und die ersten rudimentären Radargeräte, was die Zielverfolgung und die Informationsbeschaffung für Flottenoperationen erheblich verbessert."
advanced_carrier_airgroup_search:0	"Fortschrittliches Suchflugzeug für Flugzeugträger"
carrier_airgroup_asw_desc:0	""
advanced_carrier_asw_search:0	"Fortschrittliches ASW-Flugzeug für Flugzeugträger"
advanced_carrier_asw_search_desc:0	""
improved_sub_torpedo_launcher:0	"Große U-Boot-Torpedos"
advanced_sub_torpedo_launcher_desc:0	"Entwicklungen in der Torpedotechnologie ermöglichen eine größere Reichweite und leistungsstärkere Sprengköpfe."
modern_sub_torpedo_launcher:0	"Fortschrittliche U-Boot-Torpedos"
advanced_heavy_ship_torpedo_launcher:0	"Verbesserte schwere Torpedos"
modern_heavy_ship_torpedo_launcher:0	"Fortschrittliche schwere Torpedos"
modern_heavy_ship_torpedo_launcher_desc:0	"Fortschrittliche Torpedomotoren und Sprengstoffmischungen erhöhen die Durchschlagskraft von Torpedos weiter."
improved_magnetic_detonator_desc:0	"Verbesserungen am magnetischen Zünder führen zu zuverlässigeren Ergebnissen und einem breiteren Einsatz."
improved_homing_torpedo:0	"Zielsuch-Torpedo"
improved_homing_torpedo_desc:0	"Ausgestattet mit einem akustischen Detektor kann der Torpedo die größte Geräuschquelle vor sich anpeilen – in der Regel das Ziel."
