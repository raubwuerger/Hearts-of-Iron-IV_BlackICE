torpedo_cruiser_advanced:0	"Torpedokreuzer-Rumpf (fortgeschritten)"
nrm_mahanian_concepts:0	"Konzepte der Mahan-Doktrin"
nrm_mahanian_concepts_desc:0	"Unsere Marine sollte den von Admiral Mahan (USN) festgelegten Konzepten folgen. Große Großkampfschiffe, die für den Kampf gegen die Hauptkampftruppe des Feindes gebaut wurden, sind der Weg, den Feind zu besiegen. Die Konzentration der Streitkräfte und der Anzahl der Großkampfschiffe an einem Ort ist der richtige Weg."
nrm_jeune_ecole_concepts:0	"Konzepte der Jeune École"
nrm_commerce_warfare_desc:0	"Indem wir unsere Schiffe über ein größeres Gebiet verteilen, erhöhen wir die Wahrscheinlichkeit, feindliche Konvois aufzuspüren und anzugreifen."
nrm_battlefleet_concentration:0	"Konzentration der Kampfflotte"
nrm_fleet_formation:0	"Flottenformationen"
nrm_fleet_formation_desc:0	"Die Ausbildung unserer Kapitäne in der Einhaltung festgelegter Flottenformationen ermöglicht es unseren Flotten, ihre Bewegungen und Gefechte effizienter zu koordinieren. Dies geht jedoch zu Lasten der Tatsache, dass unsere Großkampfschiffe für den Feind leichter zu finden sind."
nrm_fleet_coordination_desc:0	"Die Untersuchung vergangener und aktueller Schlachten ermöglicht es uns, unsere Flottenbewegungen und Operationen zu verfeinern, wodurch unsere Flotten im Kampf effektiver werden."
