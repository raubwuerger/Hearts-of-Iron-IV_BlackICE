nrm_carrier_strike:0	"Verbesserte Angriffstaktiken"
nrm_carrier_strike_desc:0	""
nrm_carrier_defence_desc:0	""
nrm_carrier_operations_advanced:0	"Fortgeschrittene Flugzeugträgeroperationen"
nrm_carrier_deck_operations_desc:0	"Die Entwicklung neuer Deckausrüstung für unsere Flugzeugträgerbesatzungen wird die Geschwindigkeit, mit der ein Flugzeug nach einem Einsatz wieder startbereit gemacht werden kann, weiter erhöhen. Verbesserte Deckaufzüge werden es uns zudem ermöglichen, mehr Flugzeuge an Bord des Schiffes unterzubringen."
