advanced_heavy_shell:0	"Superschwere panzerbrechende Granate"
advanced_heavy_shell_desc:0	"Durch eine weitere Erhöhung des Gewichts unserer Granaten können wir deren Wirksamkeit gegen gepanzerte Ziele weiter verbessern."
basic_submarine_snorkel_desc:0	"Ein revolutionäres Luftansaugsystem ermöglicht es U-Booten, ihre Dieselmotoren im getauchten Zustand zu betreiben, wodurch ihre Gefährdung durch feindliche Flugzeuge und Patrouillenschiffe erheblich verringert wird. Obwohl noch in den Kinderschuhen, erhöht diese Innovation die Überlebensfähigkeit eines U-Boots erheblich. "
improved_submarine_snorkel:0	"Verbesserter Schnorchel"
improved_submarine_snorkel_desc:0	"Weitere Verfeinerungen der Schnorcheltechnologie verbessern die Luftströmeffizienz, verringern die Radarerkennbarkeit und integrieren leisere Belüftungssysteme, wodurch U-Boote über längere Zeit unter Wasser bleiben können, während ihre akustische Signatur minimiert wird."
damage_control_4:0	"Systematische Schadensbekämpfung"
mtg_transport_2:0	"Umgerüstete Amphibienfahrzeuge"
mtg_transport_2_desc:0	"Durch eine Reihe von Änderungen an bestehenden Fracht- und Passagierschiffen können wir diese effizienter für amphibische Operationen einsetzen."
advanced_decimetric_radar_desc:0	"Weiterentwicklungen des Dezimeterradars ermöglichen erste Anwendungen in der Feuerleitung an Bord von Schiffen."
