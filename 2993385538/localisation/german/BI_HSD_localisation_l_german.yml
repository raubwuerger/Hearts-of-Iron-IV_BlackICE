DD_le_hardi:	"Le Hardi Klasse"
DD_le_hardi_desc:0	"Deutlich größer und schneller als die Zerstörer der L'Adroit Klasse, wurden sie als Geleitschutz für die neuen Schlachtschiffe der Dunkerque Klasse konzipiert."
DL_desaix:	"Desaix Klasse"
DL_desaix_desc:0	"Entwürfe für eine neue Generation schwerer Zerstörer, die schnelle Schlachtschiffe einer Atlantiküberfalltruppe eskortieren sollten."
TB_le_fier:	"Le Fier Klasse"
TB_le_fier_desc:0	"Deutlich schwerer und stärker als die vorangegangenen Torpedoboote der Melpomene Klasse, ausgestattet mit Zweizweck-Hauptgeschützen."
E_elan:	"Élan Klasse"
E_elan_desc:0	"Ursprünglich als Minenjäger konzipiert, wurden die Schiffe dieser Klasse nie in dieser Rolle eingesetzt, sondern dienten hauptsächlich als Geleitschiffe."
E_chamois:	"Chamois Klasse"
E_chamois_desc:0	"Diese als Minensuchschaluppen konzipierten Schiffe ähnelten dem Design der Élan Klasse, wurden aber tatsächlich als U-Boot-Bekämpfungsschiffe, Konvoi-Eskorten und Patrouillenschiffe eingesetzt."
SS_roland_morillot:	"Roland-Morillot Klasse"
SS_roland_morillot_desc:0	"Große ozeanische U-Boote, eine verbesserte Version der Redoutable Klasse."
SM_emeraude:	"Emeraude Klasse"
SM_emeraude_desc:0	"Eine vergrößerte und verbesserte Version der Minenleger der Saphir Klasse."
SSc_phenix:	"Phénix Klasse"
SSc_phenix_desc:	"Küstennahe Weiterentwicklung der U-Boote der Aurore Klasse."
