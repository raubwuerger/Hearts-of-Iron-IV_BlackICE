turkey.20.d:0	"Der deutsche Botschafter in der Türkei Franz von Papen und der türkische Außenminister ükrü Saracolu unterzeichneten am 18. Juni 1941 in Ankara den deutsch-türkischen Freundschaftsvertrag (Türkisch-Deutscher Freundschaftsvertrag, türk: Türk-Alman Dostluk Pakt) am 18. Juni 1941 in Ankara. Noch am selben Tag trat er in Kraft. Der Vertrag hatte eine Laufzeit von zehn Jahren."
