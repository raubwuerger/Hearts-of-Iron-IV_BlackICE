vichy.2.d:	"Vor dem Treffen des Führers mit [SPA.GetLeader] treffen deutsche Gesandte in Vichy zu einer ruhigen, aber angespannten Gesprächsserie ein. Das Thema? Französischer Kolonialbesitz, vor allem in Nordafrika - und wie viel Berlin bereit ist zu „teilen“, um die spanische Diplomatie abzuschmieren.\nMarschall [VIC.GetLeader] empfängt die Deutschen mit sichtlichem Widerwillen. Seine Minister wehren sich vehement gegen jede Abtretung von französischem Territorium, egal wie gering der Anspruch auch sein mag. „Frankreich mag besiegt sein“, murmelt ein Beamter hinter vorgehaltener Hand, „aber wir sind noch nicht so weit, dass wir wie Wild zerlegt werden können.“\nBerlin gibt unterdessen sorgfältig verschleierte Erklärungen über die Einheit der Achsenmächte, die Neuordnung der Nachkriegsordnung und die „vorübergehende Verwaltung“ von Protektoraten ab. Die Implikation ist klar: Wenn Frankreich nicht kooperiert, kann Deutschland trotzdem handeln."

