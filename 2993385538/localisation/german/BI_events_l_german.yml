soviet.301.t:0	"Die Sowjets schlagen zuerst zu!"
soviet.301.a:0	"Wir müssen unsere Grenzen sichern!"
soviet.302.t:0	"Die Bolschewiken marschieren ein!"
soviet.302.desc:0	"Die Sowjets haben unser Abkommen gebrochen und sind bei uns eingefallen! Überall an unserer Grenze beschießen sowjetische Geschütze unsere Stellungen, und ihre Horden von Panzern und Männern überrennen unsere Soldaten. Wir müssen sie zurücktreiben in die trostlosen Steppen, aus denen sie gekommen sind!"
soviet.302.a:0	"Für das Vaterland!"
soviet.304.t:0	"Die Sowjets fallen ein!"
soviet.304.desc:0	"Ein dunkler Tag in der Tat! Die Sowjets haben beschlossen, dass wir nicht länger über unsere eigene politische Zukunft entscheiden können, und starten eine Großoffensive gegen uns! Obwohl unsere Männer tapfer sind und wir über ein hervorragendes Verteidigungsgebiet verfügen, ist nicht abzusehen, ob wir dem Ansturm der Roten Armee standhalten können. Wir sollten um Hilfe bitten! \n\nDie Deutschen und die Achsenmächte wären am ehesten dazu bereit, da sie unsere Ölfelder dringend benötigen. Es ist jedoch nicht abzusehen, welchen Preis die Deutschen für unsere Hilfe verlangen werden. \n\n Andererseits würden die Alliierten uns nicht zu ihren Untertanen machen, aber sie sind viel weiter weg und nicht so stark wie die Achsenmächte."
soviet.304.a:0	"Fragt die Achsenmächte!"
soviet.304.b:0	"Fragt die Alliierten!"
soviet.304.c:0	"Fragt unsere Balkan-Nachbarn!"
soviet.305.t:0	"Rumänien bittet um Hilfe!"
soviet.305.desc:0	"Es ist eine dringende Nachricht aus Bukarest eingetroffen! Die Rumänen stehen unter direktem Beschuss der Sowjets, die Rumänien in einen weiteren kommunistischen Satelliten verwandeln wollen. Nicht nur die rumänische Souveränität steht auf dem Spiel, sondern auch die rumänischen Ölfelder, die von unglaublichem Wert sein könnten. Wir würden jedoch sofort in einen Krieg mit der Sowjetunion verwickelt werden, so dass diese Entscheidung nicht leichtfertig getroffen werden kann."
soviet.305.b:0	"Wir können sie nicht retten..."
soviet.309.desc:0	"Es ist eine Nachricht aus Großbritannien eingetroffen, die besagt, dass sie uns nicht gegen die Sowjets helfen können oder wollen."
soviet.309.b:0	"Wir sind ganz allein..."
soviet.310.t:0	"Intervention der Achsenmächte"
soviet.310.desc:0	"Die faschistischen Schweine haben sich in unseren Krieg mit Rumänien eingemischt! In der Hoffnung, die rumänischen Ölfelder zu schützen, bombardieren die Truppen der Achsenmächte bereits unsere Stellungen entlang unserer Westgrenze. Zweifellos werden auch die rumänischen Streitkräfte bald massiv unterstützt werden. Es stellt sich nun die Frage, ob unsere Ansprüche einen Krieg mit der Achse wert sind. Wenn wir einen Waffenstillstand als Gegenleistung für die Norddobrudscha anbieten, werden die Deutschen die Rumänen vielleicht dazu zwingen, zuzustimmen, so dass wir das meiste von dem, was wir wollten, bekommen können. Wir können jedoch sicher sein, dass Deutschland sehr nervös sein wird, wenn unsere Truppen so nahe an seinen wertvollen Ölfeldern stehen..."
soviet.310.a:0	"Lasst die Faschisten kommen!"
soviet.311.t:0	"Alliierte Intervention!"
soviet.311.desc:0	"Die Kapitalisten des Westens haben sich in unseren Krieg eingemischt! Wir können innerhalb weniger Tage mit einer militärischen Antwort der Alliierten rechnen. Die Frage ist: Reicht das aus, um unseren Krieg zu beenden? Die Alliierten sind jetzt schwach, aber das wird in Zukunft vielleicht nicht immer der Fall sein. Außerdem ist ihre Wirtschafts- und Seemacht überwältigend und könnte sich auf lange Sicht als zu stark für uns erweisen. Wenn wir vielleicht einen Waffenstillstand als Gegenleistung für Norddobrudscha anbieten, könnten wir das meiste von dem bekommen, was wir wollen, ohne einen größeren Konflikt zu führen."
soviet.311.a:0	"Wen interessiert das schon?"
soviet.315.t:0	"Haltet die Linie!"
soviet.315.desc:0	"Unsere glorreichen Truppen kämpfen wie Dämonen, um die feindlichen Angriffe abzuwehren. Sie könnten uns Zeit verschaffen, um mehr Reserven aufzubringen."
soviet.315.a:0	"Zu den Waffen Kameraden !"
