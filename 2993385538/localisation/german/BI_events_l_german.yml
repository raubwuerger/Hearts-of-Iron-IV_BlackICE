vbnm.1.d:0	"[ITA.GetName] sieht eine Möglichkeit, seinen Einfluss im nationalistischen Spanien auszuweiten, und erwägt den Verkauf einiger älterer Marineschiffe (vier Zerstörer und zwei U-Boote), um die Spanier in ihrer Sache zu unterstützen."
