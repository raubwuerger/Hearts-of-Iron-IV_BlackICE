ireland.5.t:0	"Notstandsarmee"
ireland.5.d:0	"Bei Ausbruch des Krieges im September 1939 wurden die Verteidigungsstreitkräfte mit einer Stärke von weniger als 20000 Mann mobilisiert. Es begann eine Rekrutierungskampagne, und es wurde schnell eine schlagkräftige Truppe aufgebaut. Im April/Mai 1941 erreichte die Stärke der Notstandsarmee einen Höchststand von fast 41.000 Mann, und im Juni 1943 erreichte die lokale Verteidigungstruppe eine Stärke von 106.000 Mann. Im Zuge der Mobilisierung wurden zwei Divisionen und zwei unabhängige Brigaden gebildet. Die erste Division unter Generalmajor M. J. Costello hatte ihr Hauptquartier in Cork, während die zweite Division unter Generalmajor Hugo McNeill ihr Hauptquartier in Carton House, Maynooth, hatte."
ireland.5.a:0	"Tops"
ireland.6.d:0	"Die unabhängigen 5 und 8 Brigaden waren in Curragh bzw. Rineanna stationiert."
ireland.6.a:0	"Sehr gut"
ireland.8.t:0	"Verfassungsreferendum"
ireland.8.b:0	"Sicherlich können wir im Commonwealth besser geschützt werden"
ireland.9.t:0	"Irland wird unabhängig"
ireland.9.d:0	"In einem wenig überraschenden Schritt hat Irland heute bekannt gegeben, dass es nicht länger England als Dominion unterstellt sein wird. Gleichzeitig hat es sich von allen formellen Bündnissen mit den Commonwealth-Nationen distanziert. England hatte keine andere Wahl, als den Schritt zu akzeptieren, nicht zuletzt aufgrund des 1922 geschlossenen Vertrags."
ireland.9.b:0	"Vielleicht sind wir ohne sie besser dran"
ireland.10.t:0	"Christ-König-Kathedrale, Mullingar"
ireland.11.d:0	"Eine Bronzestatue des britischen Königs Georg II. auf dem St. Stephen's Green in Dublin wurde von Unbekannten in Stücke gesprengt. Es besteht der dringende Verdacht, dass es sich um die IRA handelt."
ireland.12.d:0	"Tomás Óg Mac Curtain, ein Mitglied der IRA-Exekutive und Sohn des berühmten Tomás Mac Curtain, hat Detective John Roche angeschossen und tödlich verwundet."
ireland.12.a:0	"Verschont sein Leben zu Ehren seines Vaters"
ireland.12.b:0	"Er wird dafür hängen"
ireland.13.d:0	"Am 24. März 1936 wurde Vizeadmiral Henry Boyle Townshend Somerville erschossen, als vier Männer in sein Haus eindrangen und einen Revolver abfeuerten. Der Stabschef der IRA, Tom Barry, war an der Schießerei beteiligt."
ireland.13.a:0	"Das Chaos geht weiter"
ireland.15.d:0	"Irland hatte die größte Veränderung seiner Regierung und Souveränität seit seiner Unterwerfung durch die Normannen im 12. Jahrhundert erlebt. Nachdem es den Unabhängigkeitskrieg (1919–1921) gekämpft und gewonnen hatte, hatte Irland den Herrschaftsstatus erlangt Großbritannien. Allerdings waren nicht alle irischen Republikaner mit einem solchen Friedensabkommen zufrieden und wünschten sich eine vollständige irische Republik – so unmöglich dies in der Praxis auch gewesen sein mag.\n Von 1922 bis 1923 kam es zu einem erbitterten Bürgerkrieg. Brüder und Freunde hatten sich gegeneinander gewandt und ein Großteil der Infrastruktur des Landes wurde durch die Kämpfe zerstört. Die republikanischen Militanten unter Éamon de Valera hatten den Pseudonym Irish Republican Army (IRA) beibehalten und waren nach Niederlagen in Dublin geflohen, um zu kämpfen ein Guerillakrieg im Süden des Landes. Die Nationalarmee unter der Regierung des Freistaats wurde von ehemaligen Freunden von de Valera wie dem großen Michael Collins angeführt – letzterer wurde in seiner Heimatstadt Cork ermordet.\n Die Die Spaltung in der irischen Politik und Gesellschaft blieb bis heute im Jahr 1936 bestehen, wobei die vertragsfeindliche Partei Fianna Fáil unter de Valera und die vertragsfreundliche Partei Fine Gael unter William T. Cosgrave weiterhin uneins waren.\n Sie haben gewonnen Während des Bürgerkriegs hatte die vertragsfreundliche Partei, die früher Cumann na nGaedhael hieß, jetzt aber umbenannt wurde, die Macht übernommen. Doch angesichts der schlechten wirtschaftlichen Lage infolge der Zerstörungen des Bürgerkriegs und des Wall-Street-Crashs wurde die Partei bei den Wahlen von 1932 abgewählt. Fianna Fáil unter de Valera hatte die Macht übernommen – und was für eine neue Veränderung die Partei nach Irland gebracht hatte .\n Nachdem der anglo-irische Handelskrieg als Ergebnis fragwürdiger wirtschaftlicher Entscheidungen begann und eine weitere tiefe Abspaltung von Großbritannien zur Folge hatte, ist das Land noch immer von Problemen geplagt. Da die irische republikanische Armee, die in den 1930er Jahren von de Valera im Stich gelassen wurde, verschiedene Regierungsinstitutionen angriff und gelegentlich britische Städte bombardierte, bleibt die Autorität der Regierung über überzeugte Republikaner unklar.\n Wird Fianna Fáil den notwendigen Wandel herbeiführen, um Irland zu bringen? in die moderne Welt? Wie wird es gegenüber der IRA und der britischen Regierung fair sein? Und die größte Frage von allen: Wie wird Irland in die zunehmenden Spannungen in Europa und der Welt passen?"
ireland.15.c:0	"Was ist mit Nordirland?"
ireland.15.e:0	"Okay!"
ireland.15.f:0	"Der Unabhängigkeitskrieg brach im Januar 1919 nach dem Soloheadbeg-Hinterhalt in der Grafschaft Tipperary aus. Am selben Tag erklärte ein selbsternanntes republikanisches Parlament, Dáil Éireann, die Unabhängigkeit Irlands und gründete ein irisches Parlament Regierung unter Éamon de Valera, Präsident der Exekutive. Es folgte ein blutiger Guerillakrieg, der von tödlichen Hinterhalten, einem effektiven irischen Geheimdienst unter Michael Collins und schockierenden Repressalien durch britische Streitkräfte geprägt war – darunter die Massenerschießung von Zivilisten in Dublin und das Niederbrennen der Innenstadt von Cork Stadt. Solche Aktionen stärkten nur die Entschlossenheit des irischen Volkes gegen die rücksichtslosen britischen Oberherren.\n Die britischen Geheimdienstnetzwerke in Dublin wurden durch die Aktionen von Michael Collins, dem irischen Geheimdienstdirektor, und vielen tausend im Land stationierten britischen Truppen erheblich behindert Ohne irgendeine Lösung der Situation wurde im Juli 1921 der Waffenstillstand unterzeichnet, der den Krieg beendete.\n Die folgenden Verhandlungen mit Großbritannien waren für Irland kein großer Erfolg. Angesichts der Gefahr eines größeren Krieges unterzeichneten die irischen Delegierten in London einen Kompromissfrieden: Irland würde eine Herrschaft unter britischer Herrschaft werden und alle irischen Beamten würden dem britischen Monarchen den Treueid schwören."
news.3138.d:0	"Deutsche Bomber haben die nordirische Stadt Belfast in drei Angriffen angegriffen, die nun als "Belfast Blitz" bezeichnet werden. Etwa 1000 Menschen sind dabei ums Leben gekommen, weitere 1500 wurden verletzt. Südirische Feuerwehrleute haben sich in den Kampf eingeschaltet, um ihren irischen Brüdern zu helfen. Die offizielle Erklärung der Republik lautet, dass "die Menschen in Belfast auch Iren sind". "
news.3138.a:0	"Was für eine Schande"
news.3137.t:0	"Irland verbündet sich mit der Achse"
news.3137.b:0	"Das wird uns stärker machen!"
news.3137.c:0	"Ein dunkler Tag für das Empire..."
news.3137.e:0	"Willkommen Eire!"
news.3139.d:0	"Die IRA überfiel das Magazine Fort in Dublin. Obwohl es ihnen gelungen war, vor allem irische Munition zu beschlagnahmen, wurde diese kurz darauf zurückerobert, und viele IRA-Freiwillige wurden gefasst und verhaftet. Viele hochrangige IRA-Mitglieder wurden hingerichtet, und der Oireachtas wurde mit Notstandsbefugnissen ausgestattet, um diese Krise zu bewältigen."
news.3139.a:0	"Ein Sieg für Irland!"
news.3133.a:0	"Endlich!"
news.3134.d:	"Die Kapitulation des Vereinigten Königreichs war ein Schock für die Republik Irland. Selbst nach der Besetzung Londons machte sich Irland weiterhin Illusionen über den Zustand der Streitkräfte Ihrer Majestät, so dass es auf den Zusammenbruch Großbritanniens völlig unvorbereitet war. Innerhalb weniger Stunden nach der Kapitulation Großbritanniens wurden beide Kammern des irischen Parlaments zu einer Dringlichkeitssitzung einberufen, um über den Status Nordirlands zu beraten. Nur zwei Stunden nach Beginn der Dringlichkeitssitzung wurden Truppenbewegungen in ganz Irland gemeldet. Sechs Stunden nach Beginn der Dringlichkeitssitzung marschierten irische Truppen in Nordirland ein, ohne auf Widerstand zu stoßen. Die schwachen und kläglichen Proteste Großbritanniens wurden ignoriert, als die irische Flagge über Belfast gehisst wurde."
news.3134.a:	"Das Empire bricht zusammen"
 
