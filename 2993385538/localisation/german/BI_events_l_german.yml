BICE_britain.16.t:0	"Der Altmark-Zwischenfall"
BICE_britain.16.d:0	"Der deutsche Tanker Altmark war auf dem Rückweg nach Deutschland und hatte 299 gefangene britische Seeleute an Bord.  Nachdem er von dem Zerstörer HMS Cossack abgefangen worden war, suchte die Altmark Zuflucht im Jøssingfjord in Südwestnorwegen, doch die Cossack folgte ihr. In dem darauf folgenden Gefecht enterten die Briten das Schiff und überwältigten nach einigen Nahkämpfen mit Bajonetten und der letzten aufgezeichneten Aktion der Royal Naval mit dem Entermesser die Schiffsbesatzung und stiegen dann in den Laderaum hinab.  Einer der freigelassenen Gefangenen gab an, dass sie von der Aktion erst erfuhren, als sie den Ruf "Any Englishmen here" von der Entermannschaft hörten.  Als die Gefangenen zurückriefen, lautete die Antwort: "Nun, die Marine ist da!\", was zu Jubel führte."
BICE_britain.16.a:0	"Wir heißen unsere Matrosen zu Hause willkommen!"
BICE_britain.17.t:0	"Verhaftung von Sympathisanten der Faschisten"
BICE_britain.17.d:0	"Ab dem 22. Mai begannen die Behörden, prominente Faschisten gemäß der Defence Regulation 18B zu internieren, darunter Mosley und 780 Mitglieder der BUF.  Die British Union of Fascist wird aufgelöst."
BICE_britain.17.b:0	"Kein Bedarf"
BICE_britain.18.t:0	"Blut, Mühsal, Tränen, Schweiß"
BICE_britain.18.a:0	"Inspirierende Rede"
BICE_britain.19.b:0	"Vergessen Sie es"
BICE_britain.20.t:0	"Niemals aufgeben"
BICE_britain.20.d:0	"Wir werden weder nachlassen noch versagen. Wir werden bis zum Ende weitermachen. Wir werden in Frankreich und auf den Meeren und Ozeanen kämpfen"
BICE_britain.21.t:0	"Unsere schönste Stunde"
BICE_britain.21.d:0	"Die Schlacht um Frankreich ist vorbei.  Die Schlacht um Britannien wird bald beginnen.  Von dieser Schlacht hängt das Überleben der christlichen Zivilisation ab Die ganze Wut und Macht des Feindes muss sich sehr bald gegen uns richten.  Hitler weiß, dass er uns auf dieser Insel brechen muss, sonst verliert er den Krieg. Lasst uns daher unsere Pflicht erfüllen und uns so verhalten, dass, wenn das britische Empire und sein Commonwealth tausend Jahre überdauern, die Menschen immer noch sagen werden: "Dies war ihre beste Stunde"."
BICE_britain.22.t:0	"So viel geschuldet für so wenige"
BICE_britain.22.d:0	"Die Dankbarkeit aller Menschen auf unserer Insel, in unserem Empire und in der ganzen Welt, mit Ausnahme derjenigen, die sich schuldig gemacht haben, gilt den britischen Fliegern, die, unerschrocken von allen Widrigkeiten, unermüdlich in ihrer ständigen Herausforderung und Todesgefahr, durch ihr Können und ihre Hingabe das Blatt des Weltkrieges wenden. Niemals auf dem Gebiet der menschlichen Konflikte haben so viele so wenigen so viel zu verdanken."
BICE_britain.22.a:0	"Danken Sie der RAF"
BICE_britain.23.t:0	"U-110"
BICE_britain.25.a:0	"Mach mit!"
BICE_britain.26.a:0	"Ausgezeichnet"
alantic_charter:0	"Altantische Charta"
BICE_britain.27.t:0	"Die Bevin Boys"
BICE_britain.27.d:0	"Das Programm wurde nach Ernest Bevin benannt, einem ehemaligen Gewerkschaftsfunktionär und späteren Politiker der britischen Labour-Partei, der in der Koalitionsregierung zu Kriegszeiten Minister für Arbeit und Nationaldienst war.  Zu Beginn des Krieges unterschätzte die Regierung den Wert erfahrener Bergleute und verpflichtete sie zu den Streitkräften. Bis Mitte 1943 hatten die Bergwerke 36.000 Arbeiter verloren, die in der Regel nicht ersetzt wurden, weil es keine sauberere Arbeit gab.  Es wurde offensichtlich, dass die Bergleute ersetzt werden mussten. Die Regierung appellierte an die wehrpflichtigen Männer, freiwillig in den Bergwerken zu arbeiten, aber nur wenige meldeten sich und der Mangel hielt an."
BICE_britain.28.d:0	"Bildung der 71st Eagles Squadron"
BICE_britain.29.d:0	"Okay"
BICE_britain.120.t:0	"Niemals aufgeben"
BICE_britain.120.d:0	"Wir werden nicht nachlassen noch versagen. Wir werden bis zum Ende weitermachen. Wir werden in Frankreich und auf den Meeren und Ozeanen kämpfen"
BICE_britain.120.a:0	"Die Geister erheben sich"
BICE_britain.121.t:0	"Unsere letzte Stunde"
BICE_britain.121.d:0	"Die Schlacht um Frankreich ist vorbei. Die Schlacht um Großbritannien steht kurz bevor.  Von dieser Schlacht hängt das Überleben der christlichen Zivilisation ab. Die ganze Wut und Macht des Feindes muss sich sehr bald gegen uns richten.  Hitler weiß, dass er uns auf dieser Insel brechen muss, sonst verliert er den Krieg. Lasst uns daher unsere Pflicht erfüllen und uns so verhalten, dass, wenn das britische Empire und sein Commonwealth tausend Jahre überdauern, die Menschen immer noch sagen werden: Dies war ihre beste Stunde."
BICE_britain.121.a:0	"Wir sind bereit!"
BICE_britain.122.t:0	"So viel ist so wenigen zu verdanken"
BICE_britain.122.a:0	"Danken Sie der RAF"
BICE_britain.123.t:0	"U-110"
BICE_britain.123.a:0	"Ausgezeichnet"
BICE_britain.125.t:0	"Gesetz über den Nationaldienst (Nr. 2)"
BICE_britain.125.d:0	"Alle Männer und Frauen im Alter von 18 bis 60 Jahren sind nun zu irgendeiner Form des Nationaldienstes verpflichtet, einschließlich des Militärdienstes für Männer unter 51 Jahren und unverheiratete Frauen zwischen 20 und 30 Jahren.  Die erste militärische Registrierung von 18-Jährigen findet statt.  Die Liste der reservierten Berufe wird abgeschafft."
BICE_britain.125.a:0	"Mach mit!"
BICE_britain.126.d:0	"Premierminister Churchill und Präsident Roosevelt treffen sich an einem Ankerplatz in Neufundland und erarbeiten die Atlantik-Charta.  Die Charta bringt \"das Recht aller Völker zum Ausdruck, die Regierungsform zu wählen, unter der sie leben wollen.\""
BICE_britain.126.a:0	"Ausgezeichnet"
BICE_britain.127.d:0	"Das Programm wurde nach Ernest Bevin benannt, einem ehemaligen Gewerkschaftsfunktionär und späteren Politiker der britischen Labour-Partei, der in der Koalitionsregierung während des Krieges Minister für Arbeit und Nationaldienst war.  Zu Beginn des Krieges unterschätzte die Regierung den Wert erfahrener Bergleute und verpflichtete sie zu den Streitkräften.  Bis Mitte 1943 hatten die Kohlebergwerke 36.000 Arbeiter verloren, die im Allgemeinen nicht ersetzt wurden, weil es sauberere Arbeit gab.  Es wurde deutlich, dass die Bergleute ersetzt werden mussten. Die Regierung appellierte an die wehrpflichtigen Männer, freiwillig in den Bergwerken zu arbeiten, aber nur wenige meldeten sich, so dass der Mangel weiter anhielt."
BICE_britain.127.a:0	"Zu den Kohlebergwerken"
BICE_britain.127.b:0	"Zu den Streitkräften"
BICE_britain.128.t:0	"Die 71 Eagles Squadron wird gegründet"
BICE_britain.130.a:0	"Schön brav"
BICE_britain.42.a:0	"Anker wiegen"
BICE_britain.43.t:0	"Achtung Kommando!"
BICE_britain.43.d:0	"Wir werden von diesen lästigen britischen Kommandoschweinen überfallen."
BICE_britain.43.a:0	"Tötet sie!"
