italy.35.desc:0	"Nach einem erbitterten Kampf haben spanische Truppen, unterstützt und ausgerüstet von italienischen Streitkräften, den Felsen eingenommen und ihn als rechtmäßiges spanisches Territorium beansprucht."

italy.35.c:0	"Dies war eindeutig eine Kriegshandlung!"
