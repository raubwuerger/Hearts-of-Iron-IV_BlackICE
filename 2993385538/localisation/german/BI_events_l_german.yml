worldnews.10.t:0	"Nobelpreise 1938"
worldnews.10.d:0	"Als am 10. Dezember 1938 in der Stockholmer Konzerthalle die Nobelpreise 1938 verliehen wurden, waren nur zwei Nobelpreisträger anwesend: Pearl Buck, die Literaturnobelpreisträgerin, und Enrico Fermi, der Physiknobelpreisträger. Der schwedische König Gustav V. überreichte den Preisträgern ihre Nobel-Diplome und Medaillen.\n Der Friedensnobelpreis 1938 wurde dem Office international Nansen pour les Réfugiés (Nansen Internationales Büro für Flüchtlinge) verliehen.\n Der Nobelpreis für Physik 1938 wurde Enrico Fermi "für seine Nachweise der Existenz neuer radioaktiver Elemente, die durch Neutronenbestrahlung erzeugt werden, und für seine damit zusammenhängende Entdeckung von Kernreaktionen, die durch langsame Neutronen ausgelöst werden" verliehen. Nach der Entgegennahme des Preises in Stockholm entschied sich Fermi, nicht nach Italien zurückzukehren (Gerüchten zufolge geschah dies aufgrund der neuen Rassengesetze in Italien, die seine jüdische Frau bedrohten) und zog stattdessen nach New York City. Anscheinend beantragte er dort eine dauerhafte Aufenthaltsgenehmigung, was italienische Beamte in Rage brachte, die Fermi als Verräter bezeichneten.\n Der Literaturnobelpreis 1938 wurde Pearl Buck "für ihre reichhaltigen und wahrhaft epischen Beschreibungen des bäuerlichen Lebens in China und für ihre biografischen Meisterwerke" verliehen. \n Das Komitee hielt sowohl die Preise für Chemie als auch für Physiologie oder Medizin zurück, da keine der diesjährigen Nominierungen die im Testament von Alfred Nobel festgelegten Kriterien erfüllte."
worldnews.10.ita:0	"Italien wurde erneut in den Rücken gestochen!"
worldnews.10.usa:0	"Glückwunsch an Pearl S. Buck"
worldnews.10.bel:0	"Glückwunsch an Corneille Heymans"
worldnews.11.t:0	"Krieg überschattet Nobelpreisverleihung"
worldnews.11.d:0	"Adolf Hitler, der von dem schwedischen Politiker E.G.C. Brandt für den Friedensnobelpreis nominiert wurde, weil er "die Brüderlichkeit der Nationen und die weltweite Abrüstung gefördert" hat, wird wahrscheinlich in diesem Leben keinen Preis mehr erhalten. Das Nobelpreiskomitee hat entschieden, dass in diesem Jahr niemand sonst eines Friedenspreises würdig ist - verständlich, da in Europa seit einigen Monaten wieder Krieg herrscht.\n Der Nobelpreis für Physiologie oder Medizin 1939 wurde Gerhard Domagk 'für die Entdeckung der antibakteriellen Wirkung von Prontosil' verliehen.'\n Der Nobelpreis für Chemie 1939 wurde zu gleichen Teilen zwischen Adolf Friedrich Johann Butenandt 'für seine Arbeiten über Sexualhormone' und Leopold Ruzicka 'für seine Arbeiten über Polymethylene und höhere Terpene' aufgeteilt. Der Nobelpreis für Literatur 1939 wurde Frans Eemil Sillanpää "für sein tiefes Verständnis für die bäuerliche Bevölkerung seines Landes und die exquisite Kunst, mit der er ihre Lebensweise und ihre Beziehung zur Natur dargestellt hat", verliehen. Der Nobelpreis für Physik 1939 ging an Ernest Orlando Lawrence "für die Erfindung und Entwicklung des Zyklotrons und für die damit erzielten Ergebnisse, insbesondere im Hinblick auf künstliche radioaktive Elemente." Zum ersten Mal seit seiner Einführung im Jahr 1901 gab es kein Bankett und keine Feierlichkeiten. Hoffen wir auf ein besseres nächstes Jahr!"
worldnews.11.usa:0	"Glückwunsch an Ernest Lawrence"
worldnews.11.swi:0	"Herzlichen Glückwunsch an Leopold Ružička"
