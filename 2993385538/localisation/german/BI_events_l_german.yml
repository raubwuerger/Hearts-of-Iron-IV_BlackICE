germany.290.t:0	"Konvertiere 1. L-Div in 6. Pz-Div"
germany.291.t:0	"Umwandlung der 2. L-Div in 7. Pz-Div"
germany.291.d:0	"Nach Abschluss des Überfalls auf Polen veranlasste die begrenzte Wirksamkeit der leichten Divisionen das Oberkommando der Wehrmacht, die vier leichten Divisionen zu vollwertigen Panzerdivisionen umzugestalten. Im Oktober 1939 wurde aus der 2. leichten Division die 7. Panzerdivision, eine der zehn einzigen deutschen Panzerdivisionen. Sie bestand aus 218 Panzern in drei Bataillonen, zwei Gewehrregimentern, einem Motorradbataillon, einem Pionierbataillon und einem Panzerabwehrbataillon. Der frisch beförderte General Erwin Rommel, der während der Invasion Polens in Hitlers Stab gedient hatte, konnte durch eine Intervention Hitlers das Kommando über die Division erhalten. Nachdem er am 10. Februar 1940 das Kommando übernommen hatte, ließ Rommel seine Einheit schnell die Manöver üben, die sie im bevorstehenden Feldzug brauchen würde.\n!!!!!! WICHTIG FÜR DEN SPIELER !!!!!!  Öffnen Sie das Fenster Rekrutieren und Aufstellen und öffnen Sie die Vorlage 'L-Div 2 vz.38'.\nSUPPORT CHANGE TO:\nDIV HQ, Korps Artillery, Engineer, Recon Mot, Support Anti-Tank, Maintenance Comp., Logistics-Comp. und ein Field Hospital.\nKampfänderung zu:\n1st Regiment: 1 Btl Tschechische Pz38 + 1 Btl Pz II + 1 Btl Pz IV; 2. Regiment: 1 Btl Tschechische Pz38; 3. Regiment: 3 Btl Mot Inf.; 4. Regiment: 3 Btl. Mot. Inf. + 1 Btl Mech.Inf; 5. Regiment: 3 Btl Artillerie(mot.) + 1 Btl Panzerabwehr.\nUmbenennen der Vorlage in 'Pz-Div 7' und der Einheit auf der Karte in '7. Panzer-Division'.\nJetzt können Sie das Ereignis abschließen. XP werden gewonnen, wenn nötig."
germany.291.b:0	"Form 7. Panzer-Division AI"
germany.291.c:0	"Kein Bedarf"
germany.292.t:0	"Umwandlung 3. L-Div in 8. Pz-Div"
germany.292.c:0	"Nicht nötig"
germany.301.t:0	"Wilhelm III. stirbt"
germany.301.desc:0	"Nach einem langen, erfüllten Leben ist Kaiser Wilhelm III. heute früh an den Folgen eines Herzinfarkts gestorben. Diese schreckliche Nachricht erfüllt unsere Herzen mit Trauer. Sein Sohn, Kronprinz Louis Ferdinand, hat sich jedoch als vielversprechender Nachfolger seines Vaters erwiesen."
germany.302.t:0	"Wer wird Kaiser?"
germany.302.desc:0	"Mit der Wiederherstellung der Hohenzollernmonarchie ist es an der Zeit zu entscheiden, wer auf dem Thron sitzen wird; keine leichte Aufgabe. Auf der einen Seite haben wir Kronprinz Wilhelm, der als ältester Sohn Wilhelms II. eigentlich der rechtmäßige Erbe des deutschen Throns ist. Andererseits ist der Große Krieg noch immer schwer in den Köpfen der Menschen verankert. Der Kronprinz hat sich in der Schlacht von Verdun nicht mit Ruhm bekleckert und ist ziemlich unbeliebt. Dennoch wäre er für eine stärkere, zentralisiertere Monarchie, die der Regierung mehr Macht einräumt. Andererseits ist sein Sohn Prinz Louis Ferdinand, ein aufgeweckter und beliebter junger Mann, ebenfalls eine geeignete Wahl. Er ist kompromissbereiter gegenüber den demokratischen Parteien und steht nicht unter dem Eindruck des Ersten Weltkriegs. Allerdings könnte er es anfangs schwer haben, sein Amt auszuüben. \n\nWer soll das Deutsche Reich regieren?"
germany.302.a:0	"Der Kronprinz ist der rechtmäßige Erbe."
germany.303.desc:0	"Jetzt, wo der Kaiser gewählt ist, müssen wir entscheiden, wer Kanzler werden soll. Diese Frage hängt davon ab, was der Kaiser am meisten braucht: politischen Einfluss, Popularität, ein moderneres Aussehen oder Macht für sich selbst. \n\nFranz von Papen ist zwar aufgrund seiner Verachtung für das Bürgertum und seiner Wirtschaftspolitik zutiefst unpopulär, aber er ist ein überzeugter Monarchist und verfügt über sehr gute Verbindungen zur Elite. Paul von Lettow-Vorbeck, der Held des Ersten Weltkriegs, ist aufgrund seiner großen Beliebtheit beim Volk ebenfalls ein guter Kandidat. Seine Fähigkeiten in den verrauchten Räumen der Politik werden jedoch möglicherweise nicht mit seinen Fähigkeiten auf dem Schlachtfeld mithalten können. \n\nHans-Jürgen von Blumenthal, als dritte Option, ist ein aufstrebender Stern am rechten Rand. Er ist eine wichtige Kraft innerhalb der Deutschnationalen Volkspartei und wird oft als die Zukunft der monarchistischen Bewegung angesehen. Er könnte sehr nützlich sein, sollte er die ersten Jahre überleben. \n\nSchließlich könnten wir das Amt einfach ganz abschaffen und die gesamte Autorität auf dem Thron zentralisieren."
germany.303.d:0	"Wir brauchen Macht: Kein Kanzler nötig!"
germany.304.t:0	"Die Zukunft Polens"
germany.304.a:0	"Fordern Sie Poznan"
germany.304.b:0	"Ein zuverlässigeres Warschau ist die Antwort"
germany.305.t:0	"Deutschland fordert Poznan!"
germany.305.b:0	"Wir haben keine andere Wahl..."
germany.307.t:0	"Polen lehnt unser Ultimatum ab!"
germany.307.desc:0	"Wie erwartet hat Warschau unsere Forderungen zurückgewiesen und sie als unverschämt gierig bezeichnet, die nur darauf abzielten, sie zu verärgern. Vielleicht haben sie Recht, aber jetzt sind wir in der Lage, entweder unser Ultimatum zu erfüllen oder einen Rückzieher zu machen. Wir werden unser Gesicht verlieren, wenn wir jetzt nachgeben, aber wir würden auch einen Krieg vermeiden, auf den wir vielleicht nicht vorbereitet sind. In der Tat ist es höchst unwahrscheinlich, dass die Alliierten uns erlauben werden, in Polen einzumarschieren und es zu zerstören und damit das Gleichgewicht der Kräfte in Europa zu stören."
germany.307.b:0	"Wir können jetzt keinen Krieg riskieren..."
germany.308.t:0	"Die Frage von Südtirol"
germany.308.desc:0	"Mal sehen, ob Italien bereit ist, die Region Südtirol abzutreten?"
germany.309.t:0	"Deutsche fordern Südtirol"
germany.310.t:0	"Italien stimmt zu!"
germany.310.desc:0	"Südtirol ist nun Teil der deutschen Nation."
germany.311.t:0	"Italien weigert sich!"
germany.311.desc:0	"Italien hat sich geweigert, Südtirol zu übergeben. Was sollen wir jetzt tun?"
germany.311.a:0	"Wir sollten nachgeben"
germany.312.desc:0	"Als Reparationsleistung für unser Verhalten in Belgien während des Ersten Weltkriegs wurde Eupen-Malmedy von Deutschland übernommen und unseren nordwestlichen Nachbarn zugesprochen. Um alle Deutschen unter unsere Fahne zu bringen, müssen wir dieses Gebiet zurückfordern. \n\n Wir haben zwei Möglichkeiten: Wir können ein Referendum abhalten und den Staat über sein eigenes Schicksal entscheiden lassen, oder wir können mit einer Invasion drohen und die rasche Rückgabe des Gebiets fordern. Letzteres würde mit ziemlicher Sicherheit die Alliierten verärgern und könnte einen allgemeinen europäischen Konflikt auslösen. Vielleicht ist es also klüger, unsere Ziele an der Wahlurne zu erreichen, als mit dem Gewehrlauf."
germany.313.desc:0	"Die Deutschen, die eine ihrer Meinung nach bestehende Ungerechtigkeit während des Friedensprozesses nach dem Ersten Weltkrieg wiedergutmachen wollen, möchten in Eupen-Malmedy ein Referendum abhalten und den Staat entscheiden lassen, ob er zu Deutschland zurückkehren oder belgisch bleiben will. Wir haben keine Daten darüber, wie die Bevölkerung von Eupen-Malmedy abstimmen würde, so dass es schwer zu sagen ist, welche Seite gewinnen würde.\n\n Aber wenn wir es nicht riskieren wollen, wäre es besser, dies jetzt abzulehnen und Deutschland in den Augen der internationalen Gemeinschaft zum Aggressor werden zu lassen, als dass wir ein gegen uns gerichtetes Ergebnis riskieren. Aber auch auf diesem Weg könnten wir gegen ein wütendes Deutschland allein dastehen, so dass keiner der beiden Wege verlockend ist."
germany.313.a:0	"Mögen die Stimmen zu unseren Gunsten ausfallen"
germany.314.t:0	"Belgien stimmt einem Referendum zu"
germany.314.desc:0	"In Anerkennung des angeborenen Rechts auf Selbstbestimmung haben die Belgier zugestimmt, Eupen-Malmedy über seine Zukunft entscheiden zu lassen. Hoffen wir, dass sie für Deutschland stimmen!"
germany.314.a:0	"Halten Sie das Referendum ab"
germany.315.a:0	"Abstimmen macht Spaß!"
germany.316.b:0	"Ergebnisse ablehnen"
germany.316.c:0	"An die Majestäten appellieren"
germany.317.desc:0	"Die Ergebnisse sind da: Eupen-Malmedy will belgisch bleiben. Wir verstehen nicht, wie es dazu kommen konnte, aber wenn wir den internationalen Zorn vermeiden wollen, müssen wir das Ergebnis akzeptieren. Wenn es uns aber mehr darum geht, die rechtmäßigen deutschen Gebiete zurückzuerobern, dann sollten wir ein Ultimatum stellen und mit einer sofortigen Invasion drohen, wenn sie nicht akzeptieren! Dies könnte jedoch einen neuen großen Krieg in Europa auslösen..."
germany.317.a:0	"Ergebnisse akzeptieren"
germany.317.b:0	"Das ist rechtmäßiges deutsches Gebiet!"
germany.318.a:0	"Willkommen zurück!"
germany.320.desc:0	"Nachdem wir die Sowjets dazu gebracht haben, uns bei der Eroberung Polens zu helfen, müssen wir uns nun an unsere Verbündeten in der Tschechoslowakei wenden. Nachdem wir ihnen Zugeständnisse versprochen haben, wenn sie sich an unserer Invasion beteiligen, erwarten sie von uns, dass wir ihnen Südpolen überlassen. Allerdings haben wir hier die gleiche Chance wie bei den Sowjets, nämlich die, dass wir wieder unsere gesamte Beute behalten können. Belohnen wir unsere Verbündeten oder behalten wir ganz Polen für Deutschland?"
germany.320.a:0	"Sie sind würdige Verbündete und verdienen eine Entschädigung."
germany.321.t:0	"MR-Pakt: Einschließlich der Tschechen"
germany.321.desc:0	"Da unser neues Abkommen mit der Sowjetunion so gut wie abgeschlossen ist, müssen wir nun die geopolitischen Folgen dieses Abkommens bedenken. Genauer gesagt, unser Bündnis mit der Tschechoslowakei. Prag wird mit ziemlicher Sicherheit den Wunsch haben, in den Pakt einbezogen zu werden, um die südlichen polnischen Staaten zu erhalten. Ihnen eine solche Möglichkeit zu verweigern, würde sie sehr verärgern und könnte dazu führen, dass sie unser Bündnis verlassen und ihre Industrie und ihre große Armee mitnehmen. Es gibt jedoch keine Garantie, dass die Sowjets ihrer Aufnahme zustimmen werden, so dass wir gezwungen sein könnten, die Tschechoslowaken trotzdem auszuschließen."
germany.321.a:0	"Ja, sie könnten sehr nützlich sein."
germany.322.desc:0	"Die deutsche Delegation hat eine neue Bestimmung zu unserem gerade abgeschlossenen Pakt angeboten. Sie möchten ihre tschechoslowakischen Verbündeten in die Teilung Polens einbeziehen. \n\n"
germany.323.desc:0	"Unsere Delegation hat die Sowjets erfolgreich davon überzeugt, dass es im Interesse aller ist, die Tschechoslowakei in den neuen Pakt einzubeziehen. Die Tschechen erhalten Krakau und Stanislawow und möglicherweise auch Lwow, wenn sie es schnell genug erobern können. Das wird die Regierung in Prag sehr erfreuen!"
germany.323.a:0	"Die Tschechen werden hocherfreut sein"
germany.324.desc:0	"Die Deutschen sind mit einer schockierenden Wendung der Ereignisse zu uns gekommen: Sie haben mit den Sowjets ein bisher undenkbares Abkommen zur Teilung Polens geschlossen! \nNoch dazu haben sie es erfolgreich geschafft, uns in das Abkommen einzubeziehen, indem sie uns mehrere polnische Staaten im Süden zugestanden haben! \n\nWenn wir an ihrer Seite kämpfen, werden wir Krakau und Stanislawow gewinnen. Und wenn unsere Armee erfolgreich genug ist, könnten wir möglicherweise auch Lwow gewinnen! Es zahlt sich aus, so wunderbare Verbündete wie die in Berlin zu haben!"
germany.324.a:0	"Eine große Chance liegt vor uns!"
germany.325.t:0	"Die Sowjets lehnen das tschechische Angebot ab"
germany.326.t:0	"Molotow-Ribbentrop-Pakt: Unser Beitritt"
germany.327.desc:0	"In einem Akt der Überlegenheit haben uns die Deutschen dreist über ihren neuen Pakt mit den Kommunisten im Osten informiert und Polen zwischen ihnen aufgeteilt! Außerdem haben sie jeden Vorschlag, uns in eine solche Teilung einzubeziehen, rundweg abgelehnt! Dies ist wahrscheinlich nur ein Vorzeichen für die Zukunft, und wir werden möglicherweise nur sehr wenig von einer fortgesetzten Beziehung zu Berlin profitieren. Würden wir uns jedoch von ihnen abwenden und möglicherweise gegen sie arbeiten, könnten wir uns sehr schnell mit einem überlegenen Feind konfrontiert sehen. \n\nWas sollen wir tun?"
germany.327.a:0	"Wir haben keine andere Wahl, als dies zu akzeptieren..."
germany.328.t:0	"Die Tschechoslowaken fordern die Aufnahme!"
germany.328.desc:0	"Nicht unerwartet ist Prag verärgert über unsere Entscheidung, sie von unserer neuen Vereinbarung mit den Sowjets auszuschließen. Sie drohen damit, unser Bündnis zu verlassen und sich für ihre eigenen Interessen einzusetzen, wobei sie Andeutungen machen, dass diese Interessen mit den unseren in Konflikt stehen könnten. Obwohl wir ihre Drohungen sicherlich ignorieren oder sogar daraus Kapital schlagen könnten, wenn sie es durchziehen, müssen wir auch die industrielle und militärische Macht berücksichtigen, die die Tschechoslowaken in die Achse einbringen. Es mag klüger sein, unserem Hund einen Knochen zuzuwerfen, als ihn gänzlich zu verschmähen."
germany.328.a:0	"Bieten Sie ihnen Krakau und vage Aussagen über zukünftige Gewinne an."
germany.329.desc:0	"Vielleicht haben die Deutschen erkannt, dass sie nicht so voreilig sein sollten, uns so schwer zu beleidigen, und sind zurückgekommen und haben uns den Staat Krakau als Gegenleistung für unsere weitere Treue angeboten. Sie haben auch vage Aussagen über mögliche Gebietserwerbungen in zukünftigen Kriegen im Osten gemacht, aber wir ignorieren diese Nettigkeiten am besten erst einmal und konzentrieren uns auf die konkreten Dinge. \n\nKrakau wäre besser als nichts, und wir würden für künftige Zugeständnisse in Frage kommen, aber es ist offensichtlich, dass wir in dieser Beziehung nicht als Gleichberechtigte behandelt werden. Wir können immer noch unseren eigenen Weg ohne Deutschland gehen, aber auch hier riskieren wir, in ihr Fadenkreuz zu geraten, wenn wir das tun."
germany.330.desc:0	"Die Deutschen haben unsere berechtigten Forderungen nach einem Platz am Tisch für Polen abgelehnt und uns stattdessen mit Konsequenzen gedroht! \n\nIn der Tat hat ihre Delegation schmerzlich deutlich gemacht, dass Deutschland möglicherweise drastische Maßnahmen ergreifen muss, wenn wir die Achse verlassen würden. \n\nWir sollten uns keine Illusionen darüber machen, welche Art von "drastischen Maßnahmen" Berlin im Sinn hat. Wir müssen auf einen künftigen Konflikt mit Deutschland vorbereitet sein, wenn wir unsere Drohung wahr machen. Aber vielleicht ist es an der Zeit, sich zu entscheiden, und dies könnte unsere beste Chance sein, unser Schicksal in die Hand zu nehmen, mit oder ohne die Deutschen."
germany.330.a:0	"Sollen sie doch versuchen, uns aufzuhalten!"
germany.331.t:0	"Die Tschechoslowaken verlassen die Achsenmächte!"
germany.331.desc:0	"Die gierigen Narren in Prag haben unser Bündnis verlassen! Verärgert über unsere Entscheidung, sie von jeglicher polnischen Beute auszuschließen, können sie nur noch als potentielle Bedrohung für unsere zukünftigen Pläne betrachtet werden. Es wäre ein schwerer Fehler, sie lange Zeit zu ignorieren."
germany.331.a:0	"Wir werden uns mit diesen Emporkömmlingen befassen!"
germany.332.a:0	"Gut"
germany.333.b:0	"Wir wagen es nicht, Deutschland zu drohen."
germany.334.t:0	"Die Tschechoslowaken fordern eine Entschädigung"
germany.334.a:0	"Biete Krakau und Stanislawow"
germany.334.b:0	"Lasst sie gehen, wenn sie es wagen!"
germany.335.t:0	"Deutschland bietet einen Kompromiss an"
germany.335.b:0	"Wir werden solche Beleidigungen nicht einfach hinnehmen!"
germany.337.t:0	"Die Tschechoslowaken lehnen unser Angebot ab!"
germany.337.desc:0	"In einem der erstaunlichsten Ereignisse der letzten Zeit haben die Deutschen in ihrer unendlichen Weisheit beschlossen, unseren Pakt zugunsten einer Beschwichtigung der tschechoslowakischen Ambitionen in Polen aufzukündigen! Offenbar ist Prag für Berlin wichtiger als wir selbst! Sie werden den Tag bereuen, an dem sie uns für so ein unbedeutendes Land verschmäht haben!"
germany.338.t:0	"Das Sudetenland mit Gewalt nehmen?"
germany.338.desc:0	"Es scheint, dass die Sudetendeutsche Krise nicht diplomatisch, sondern mit Waffengewalt gelöst werden wird. Wir haben zwar einen rechtmäßigen Anspruch auf das Gebiet, aber wenn wir versuchen würden, die gewaltigen Befestigungen zu durchbrechen, die gegen uns errichtet wurden, könnten wir uns dabei selbst ruinieren."
germany.338.a:0	"Das Glück ist mit den Mutigen!"
germany.340.desc:0	"Danzig. Danzig und der polnische Korridor sind eines unserer dringendsten Anliegen, um die rechtmäßigen Grenzen Deutschlands wiederherzustellen. Die Polen sind jedoch nicht bereit, dieses Gebiet freiwillig aufzugeben, da sie es als ihren einzigen Zugang zur Ostsee und zur Außenwelt betrachten. Dies wird eine unserer bisher härtesten Forderungen sein, wenn wir dies diplomatisch durchsetzen wollen. \n\n Wir haben mehrere Möglichkeiten: Wir können den Polen einfach mit Danzig drohen, um sie vielleicht zum Einlenken zu bewegen. Außerdem könnten wir einen Tausch der Slowakei gegen Danzig anbieten, obwohl die Slowaken unter unserer Kontrolle nützlicher sein könnten. Schließlich könnten wir versuchen, die Polen zu beeinflussen und sie in unsere Einflussphäre zu bringen, wodurch sich das Problem vorerst erübrigen würde. \n\n Wofür auch immer wir uns entscheiden, wir müssen auf die Konsequenzen einer polnischen Weigerung vorbereitet sein."
germany.341.t:0	"Deutschland fordert Eupen-Malmedy!"
germany.341.desc:0	"Die Deutschen weigern sich, den Status quo zu akzeptieren und stellen stattdessen ein Ultimatum: Eupen-Malmedy oder Krieg! Wir hätten nicht gedacht, dass die Deutschen einen so kleinen Staat für so wichtig halten, aber sie scheinen gewillt zu sein, einen Flächenbrand in diesem Gebiet auszulösen. Vielleicht wäre es sowohl in unserem als auch im Interesse der Welt, wenn wir es ihnen überlassen würden. Man weiß jedoch nicht, was sie als Nächstes tun werden, wenn sie glauben, dass sie ohne Konsequenzen drohen können. Vielleicht können wir dies nutzen, um die alliierten Mächte dazu zu bewegen, sich der deutschen Aggression zu widersetzen!"
germany.341.b:0	"Dies ist belgisches Gebiet!"
germany.342.t:0	"Belgien nimmt an!"
germany.342.desc:0	"Da die Belgier wissen, dass Widerstand zwecklos ist, haben sie Eupen-Malmedy an uns abgetreten!\n\nDies hätte für alle Beteiligten viel weniger schmerzhaft sein können. Die Belgier sind sich nämlich sicher, dass sie jede internationale Aktion gegen uns unterstützen werden, und die Alliierten sind jetzt wachsamer denn je. Wir müssen in Zukunft vorsichtig vorgehen und uns davor hüten, zu viele Drohungen gegenüber kleineren Nachbarn auszusprechen."
germany.343.desc:0	"Trotz unserer nicht gerade subtilen Andeutungen, dass wir es mit Gewalt an uns reißen würden, haben die Belgier unser Ultimatum für Eupen-Malmedy abgelehnt!\n\nWenn es uns wirklich um die Wiedervereinigung unserer verlorenen deutschen Gebiete geht, dann sollten wir einen solchen Affront nicht einfach hinnehmen! Allerdings könnte dies einen viel größeren Krieg auslösen, denn die alliierten Großmächte werden uns sicher nicht erlauben, in einen so kleinen und wehrlosen Nachbarn einzumarschieren... oder doch?"
germany.344.desc:0	"Wenden wir uns noch einmal unserer westlichen Grenze und unserem größten Rivalen zu: Frankreich. Das Land Elsass-Lothringen, auch bekannt als Elsass-Lothringen, ist dank unserer Niederlage im Großen Krieg derzeit in französischer Hand. Wenn wir wirklich alle deutschen Gebiete zurückgewinnen wollen, müssen wir diese Region irgendwie zurückgewinnen. Dies wird mit ziemlicher Sicherheit zu einem Krieg führen, da die Franzosen mit ziemlicher Sicherheit niemals das aufgeben werden, was sie als rechtmäßiges französisches Gebiet betrachten. Vielleicht können wir sie mit immenser militärischer Macht von dieser Vorstellung abbringen, aber selbst dann würden sie eher im Kampf sterben, als es uns bereitwillig zu überlassen. \n\nAber vielleicht ist ein Krieg genau das, was wir wollen..."
germany.344.a:0	"Dies ist deutsches Gebiet!"
germany.345.t:0	"Deutschland fordert Elsass-Lothringen"
germany.345.desc:0	"Wieder einmal müssen wir uns mit unserer deutschen Grenze auseinandersetzen. Die Deutschen verlangen, dass wir Elsass-Lothringen an sie abtreten. Warum sie es überhaupt wagen, eine so lächerliche Forderung zu stellen, ist für uns unbegreiflich. Elsass-Lothringen ist französisches Hoheitsgebiet! Wenn wir uns einer deutschen Invasion nicht widersetzen könnten oder immenser diplomatischer Druck ausgeübt würde, könnten wir einen solchen Vorschlag vielleicht sogar in Betracht ziehen. Aber das steht noch nicht fest..."
germany.345.a:0	"Wir werden es NIEMALS zurückgeben!"
germany.346.desc:0	"Wie der Rest der Welt sind auch wir fassungslos, als wir erfahren, dass die Franzosen unsere Forderungen für Elsass-Lothringen akzeptiert haben! Vielleicht aus Angst vor unserer militärischen Macht oder weil sie verstanden haben, dass das Gebiet rechtmäßig in deutsche Hände gehört, hat die französische Entscheidung, das Gebiet aufzugeben, unsere Grenzprobleme mit unserem westlichen Rivalen vorerst gelöst."
germany.347.desc:0	"Frankreich hat unseren Vorschlag für Elsass-Lothringen abgelehnt. Was soll unser nächster Schritt sein?"
germany.347.a:0	"Dann werden wir es mit Gewalt nehmen!"
germany.348.t:0	"Das Sudetenland"
germany.348.desc:0	"Ich verlange weder, dass Deutschland dreieinhalb Millionen Franzosen unterdrücken darf, noch verlange ich, dass dreieinhalb Millionen Engländer uns ausgeliefert werden. Vielmehr verlange ich einfach, dass die Unterdrückung von dreieinhalb Millionen Deutschen in der Tschechoslowakei aufhört und dass an ihre Stelle das unveräußerliche Recht auf Selbstbestimmung tritt.' \n\n Wie ich heute schon in einer Rede gehört habe, sind unsere Regierung und auch unser Volk der Meinung, dass das Sudetenland rechtmäßig zu Deutschland gehört. Daher haben wir mehrere Möglichkeiten, seine rechtmäßige Rückgabe zu erwirken: Wir können es auf diplomatischem Wege zurückfordern, versuchen, die Tschechoslowakei in unseren Einflussbereich zu bringen, oder es mit Gewalt an uns reißen. Jede dieser Optionen hat ihre Vor- und Nachteile, aber wir müssen in jedem Fall die internationale Meinung berücksichtigen, damit wir nicht in einem Krieg enden, den wir nicht wollen."
germany.348.a:0	"Verlangen Sie das Sudetenland"
germany.349.desc:0	"Ich verlange weder, dass Deutschland dreieinhalb Millionen Franzosen unterdrücken darf, noch verlange ich, dass dreieinhalb Millionen Engländer unserer Gnade ausgeliefert werden. Vielmehr fordere ich lediglich, dass die Unterdrückung von dreieinhalb Millionen Deutschen im österreichisch-ungarischen Sudetenland aufhört und dass an ihre Stelle das unveräußerliche Recht auf Selbstbestimmung tritt.' \n\nWie ich heute in einer Rede gehört habe, sind unsere Regierung und auch unser Volk der Meinung, dass das Sudetenland rechtmäßig zu Deutschland gehört. \n\nUnglücklicherweise haben wir es hier nicht nur mit der Tschechoslowakei zu tun, sondern mit einem wiedererstandenen Österreich-Ungarn. Eine Invasion unseres neu geschmiedeten südlichen Nachbarn ist weniger appetitlich als zuvor, daher sollten wir diplomatische Möglichkeiten ausloten, bevor wir militärische Gewalt anwenden. Wir könnten einfach die Rückgabe der Region fordern, aber vielleicht können wir den Deal versüßen, indem wir im Gegenzug Südpolen anbieten? Es gibt auch die Möglichkeit, eine engere Beziehung zu diesem Machtzentrum auf dem Balkan aufzubauen, und schließlich gibt es natürlich die militärische Option."
germany.350.d_2:0	"Die deutschen Forderungen nach dem Sudetenland in Österreich-Ungarn, in dem eine große Anzahl ethnischer Deutscher lebt, haben sich zugespitzt. Hitler hat seine Truppen entlang der österreichisch-ungarischen Grenze positioniert, um sich auf einen Angriff vorzubereiten. Da wir bereits bewiesen haben, dass wir den deutschen Expansionismus nicht hinnehmen werden, haben wir nun einen weiteren Verbündeten im Krieg gegen Deutschland."
germany.350.a:0	"Die Österreich-Ungarn sind auf sich allein gestellt."
germany.351.d:0	"Die deutschen Forderungen nach dem Sudetenland in Österreich-Ungarn, in dem eine beträchtliche Anzahl ethnischer Deutscher lebt, haben sich zugespitzt. Hitler hat entlang der österreichisch-ungarischen Grenze Truppen aufgestellt, um einen Angriff vorzubereiten. In München finden Gespräche zwischen Großbritannien, Frankreich, Italien und Deutschland statt, in der Hoffnung, ein friedliches Ende der Sudetenkrise auszuhandeln.\nDie Briten haben deutlich gemacht, dass sie nicht die Absicht haben, wegen eines 'Streits in einem weit entfernten Land' in den Krieg zu ziehen. Sollten wir ihrem Beispiel folgen, oder werden wir unsere Verpflichtungen gegenüber Österreich-Ungarn erfüllen, indem wir ihnen Unterstützung anbieten?"
germany.351.a:0	"Überlassen wir die Österreich-Ungarn ihrem Schicksal."
germany.351.b:0	"Die Briten sollen verdammt sein! Frankreich unterstützt seine Freunde!"
germany.352.b:0	"Frankreich sollte sich aus der Sache heraushalten."
germany.354.d:0	"Die deutschen Forderungen nach unserem Gebiet im Sudetenland werden immer feindseliger, und jetzt sammeln sich ihre Streitkräfte an unserer Grenze! In München findet eine Konferenz statt, auf der die europäischen Staats- und Regierungschefs über die Zukunft Österreich-Ungarns beraten, aber wir sind nicht eingeladen worden. \n\nGlücklicherweise sieht es so aus, als würden die Alliierten zu ihren früheren Unterstützungsversprechen stehen. Sie haben Hitler mit Krieg gedroht, sollten unsere Grenzen auch nur im Geringsten verletzt werden. Trotzdem müssen wir uns auf einen bevorstehenden deutschen Angriff vorbereiten."
germany.354.a:0	"Gut so! Sollen sie doch kommen!"
germany.355.a:0	"Vive la France!"
germany.356.t:0	"Das Münchner Diktat"
germany.356.d:0	"Die deutschen Forderungen nach unserem Territorium im Sudetenland werden immer feindseliger, und jetzt sammeln sich ihre Kräfte entlang unserer Grenze! In München findet eine Konferenz statt, auf der die europäischen Staats- und Regierungschefs über die Zukunft Österreich-Ungarns beraten, aber wir sind nicht eingeladen worden. Sowohl die Briten als auch die Franzosen haben ihre früheren Zusagen, uns gegen die deutsche Aggression zu unterstützen, zurückgenommen. Ihre Diplomaten haben deutlich gemacht, dass wir, wenn wir uns entscheiden, den Deutschen zu widerstehen, dies auf eigene Faust tun müssen. Vielleicht haben wir keine andere Wahl, als das Sudetenland aufzugeben..."
germany.357.d:0	"In München haben Gespräche zwischen den Staats- und Regierungschefs Deutschlands, Großbritanniens, Frankreichs und Italiens stattgefunden, um die Zukunft des Sudetenlandes zu erörtern. Sowohl die Briten als auch ihre Verbündeten haben unsere rechtmäßigen Ansprüche auf das Sudetenland zurückgewiesen und uns mit Krieg gedroht, falls wir die österreichisch-ungarische Grenze "verletzen"! Es wurde ein Plan für die Invasion Österreich-Ungarns ausgearbeitet, der jedoch wahrscheinlich einen allgemeinen europäischen Krieg auslösen wird. Wir müssen sicherstellen, dass wir darauf vorbereitet sind."
germany.359.d:0	"In München haben Gespräche zwischen den Staats- und Regierungschefs Deutschlands, Großbritanniens, Frankreichs und Italiens stattgefunden, um die Zukunft der Tschechoslowakei zu erörtern. Sowohl die Briten als auch die Franzosen haben unsere Ansprüche auf das Sudetenland als legitim anerkannt, und ihre früheren Angebote zur Unterstützung Österreich-Ungarns wurden zurückgenommen. \n\nTrotz der Hoffnungslosigkeit ihrer Lage weigern sich die starrköpfigen Österreich-Ungarn, ihr Gebiet aufzugeben! Wir werden es mit Gewalt einnehmen müssen. Es wurde ein Invasionsplan vorbereitet, der dieses Relikt der Geschichte vom Angesicht der Erde tilgen wird!"
germany.359.a:0	"Die Österreich-Ungarn müssen vernichtet werden."
germany.360.a:0	"Dies ist ein historischer Tag für Deutschland."
germany.361.t:0	"MR-Pakt: Einbindung Österreich-Ungarns"
germany.361.desc:0	"Nachdem unser neues Abkommen mit der Sowjetunion so gut wie abgeschlossen ist, müssen wir nun die geopolitischen Folgen dieses Abkommens bedenken. Insbesondere unser Verhältnis zu Österreich-Ungarn. Sie werden mit ziemlicher Sicherheit wünschen, in den Pakt einbezogen zu werden, um die südpolnischen Staaten zu erhalten. Ihnen eine solche Möglichkeit zu verweigern, würde sie sehr verärgern und könnte zu künftigen Problemen mit ihnen führen, wobei sie ihre Industrie und ihre große Armee gegen uns einsetzen könnten. Es gibt jedoch keine Garantie, dass die Sowjets ihrer Aufnahme zustimmen werden, so dass wir gezwungen sein könnten, sie trotzdem auszuschließen."
germany.362.t:0	"Deutschland will Österreich-Ungarn einbeziehen"
germany.363.t:0	"Die Sowjets stimmen der neuen Teilung zu"
germany.363.desc:0	"Unsere Delegation hat die Sowjets erfolgreich davon überzeugt, dass es im Interesse aller ist, Österreich-Ungarn in den neuen Pakt einzubeziehen. Sie erhalten Krakau, Lwow und Stanislawow."
germany.364.t:0	"Molotow-Ribbentrop-Pakt: Unsere Eingliederung"
germany.364.desc:0	"Die Deutschen sind mit einer schockierenden Wendung der Ereignisse zu uns gekommen: Sie haben mit den Sowjets ein bisher undenkbares Abkommen zur Teilung Polens geschlossen! \nNoch dazu haben sie es geschafft, uns in das Abkommen einzubeziehen, indem sie uns mehrere polnische Staaten im Süden zugestanden haben! \n\nSollten die Deutschen ihren Teil der Abmachung einhalten, werden wir Krakau, Lwow und Stanislawow schon bald in unseren Händen halten."
germany.364.a:0	"Eine große Chance liegt vor uns!"
germany.365.a:0	"Wir werden diesen Pakt nicht aufs Spiel setzen."
germany.366.a:0	"Eine unglückliche Wendung der Ereignisse"
germany.367.t:0	"Molotow-Ribbentrop-Pakt: Unser Ausschluss"
germany.367.a:0	"Wir haben keine andere Wahl, als dies zu akzeptieren..."
germany.367.b:0	"Wir verlangen, einbezogen zu werden!"
germany.368.t:0	"Die Österreich-Ungarn fordern Einbeziehung!"
germany.368.b:0	"Lasst sie gehen, wenn sie es wagen!"
germany.369.b:0	"Was für ein beleidigendes Angebot. Gehen Sie!"
germany.370.t:0	"Deutschland droht mit Konsequenzen"
germany.370.a:0	"Sollen sie doch versuchen, uns aufzuhalten!"
germany.370.b:0	"Ziehen wir uns zurück, wagen wir es nicht, Deutschland zu verärgern."
germany.371.t:0	"Die Österreichisch-Ungarischen verlassen die Achse!"
germany.372.t:0	"Die Österreich-Ungarn werden Krakau einnehmen"
germany.373.desc:0	"Die Gier der Deutschen scheint keine Grenzen zu kennen. Obwohl sie ganz Österreich in ihr Reich aufgenommen haben, verlangen sie nun, dass wir ihnen Slowenien überlassen. Slowenien ist für das Überleben oder den Wohlstand unserer Nation nicht von entscheidender Bedeutung, so dass sich ein möglicher Krieg mit Deutschland um diesen Staat vielleicht nicht lohnt. Man weiß jedoch nicht, wo die Deutschen aufhören werden, wenn sich ihnen niemand entgegenstellt."
germany.373.a:0	"Wir haben keine Wahl..."
germany.374.t:0	"Slowenien: Forderung akzeptiert"
germany.374.desc:0	"In Anerkennung ihrer Lage haben die Österreich-Ungarn richtigerweise beschlossen, unsere Forderung zu akzeptieren und treten hiermit Slowenien an uns ab."
germany.374.a:0	"Ausgezeichnet!"
germany.375.a:0	"Dann werden wir es uns mit Gewalt nehmen!"
germany.377.a:0	"Dummköpfe!"
germany.379.t:0	"Anschluss: Österreich bittet um Hilfe!"
germany.379.a:0	"Wir stehen an ihrer Seite!"
germany.379.b:0	"Wir können ihnen jetzt nicht helfen..."
germany.380.t:0	"Anschluss: Verbündete verweigern Hilfe!"
germany.380.b:0	"Kämpft weiter!"
germany.381.b:0	"Und trotzdem einmarschieren!"
germany.382.t:0	"Die Deutschen planen eine Invasion in Österreich!"
germany.382.a:0	"Zu den Waffen!"
germany.383.t:0	"Die Deutschen planen die Invasion Österreichs!"
germany.383.desc:0	"Unsere britischen Verbündeten informieren uns, dass die Deutschen trotz aller Warnungen ihre Invasionsvorbereitungen in Österreich fortsetzen! Wenn sie es wagen, den Sprung zu wagen, werden wir es sein, die siegreich bleiben!"
germany.384.desc:0	"Angesichts der Aussicht, an zwei verschiedenen Fronten zu kämpfen, haben die Deutschen in weiser Voraussicht beschlossen, ihre Vorbereitungen für einen Einmarsch in Österreich einzustellen! Dies beweist nur, dass ausgewogene Koalitionen die Kriegstreiber tatsächlich aufhalten können!"
germany.385.a:0	"Fordern Sie den Staat auf jeden Fall!"
germany.385.b:0	"Ziehen Sie sich zurück, bevor es zu weit geht..."
germany.392.d:0	"Am 11. Februar 1941 landeten die ersten deutschen Einheiten in Tripolis, und Rommel stieß am folgenden Tag dazu. Kurz darauf trafen die ersten Aufklärungseinheiten ein, nämlich die Panzeraufklärungsabteilung 3 und die Panzerjägerabteilung 39. Beide Einheiten wurden an die Fronten verlegt, und schließlich trafen ab dem 30. März die ersten Einheiten der 15. Panzerdivision in Tripolis ein (I. Flak 18, bald gefolgt von der Panzerjägerabteilung 33 und dem Großteil des Kradschützen-Bataillons 15). Das Afrikakorps wurde gebildet und erreichte bald darauf seine Einsatzstärke von etwa 33.500 Soldaten mit über 11.000 Fahrzeugen."
germany.392.a:0	"Lassen Sie die 15. Pz-Div in Tripolis eintreffen"
germany.393.t:0	"Umbenennung/Umrüstung der 5. L-Div. in 21. Pz.-Div."
germany.393.b:0	"Stellen Sie die 21. Pz-Div in Tripolis"
germany.401.t:0	"Infanterie-Regiment(mot.) Großdeutschland"
germany.401.d:0	"Das Regiment wurde im September 1939 reorganisiert und nahm nicht am "Fall Weiss" (dem Überfall auf Polen) teil, was den Stolz des Regiments, das den Namen der Nation auf dem Ärmel trug, verletzte. Im Mai 1940 wurde das Regiment jedoch der Panzergruppe Kleist von Generalfeldmarschall Ewald von Kleist unterstellt und nahm ab dem Beginn des Falles Gelb, dem Einmarsch in den Westen, am 10. Mai 1940 an den Kämpfen teil."
germany.402.t:0	"Infanterie-Division Großdeutschland"
germany.402.d:0	"Am 1. April 1942 wurde das Regiment in der Nähe von Orel neu aufgestellt und zur Infanterie-Division Großdeutschland (mot.) erweitert. Das bestehende Regiment wurde in Infanterie-Regiment Großdeutschland 1 umbenannt und in der Division durch das in Berlin aufgestellte Infanterie-Regiment Großdeutschland 2 ergänzt. Unterstützungseinheiten in Form eines Panzerbataillons, eines Sturmgeschützbataillons und verstärkter Flak-, Artillerie- und Pioniereinheiten wurden mit der Aufwertung zur Division hinzugefügt."
germany.402.a:0	"Aufstellung der Inf.-Div. Großdeutschland"
germany.403.d:0	"Im Juni 1943 wurde die Division durch die Hinzufügung von Schützenpanzern und einer Kompanie Tiger-Panzer in Panzergrenadier-Division Großdeutschland umbenannt, und Großdeutschland 1 wurde in Panzergrenadier-Regiment Großdeutschland umbenannt. Das Pendant in der Division erhielt die Bezeichnung "Panzerfüsilier-Regiment Großdeutschland". Die neu ausgerüstete Division wurde dem XLVIII. Panzerkorps unterstellt, das Teil der Vierten Panzerarmee war, und nahm an der Schlacht bei Kursk teil. Während der Aufbauphase rüstete eine Brigade von zwei Bataillonen mit den neuen Panther-Panzern aus, die von technischen Problemen geplagt wurden und mit Motorbränden und mechanischen Pannen zu kämpfen hatten, bevor sie das Schlachtfeld erreichten. Am 7. Juli waren nur noch 80 der 300 Panzer der Division kampffähig. Nach der Absage der Kursk-Offensive wurde die Division wieder der Heeresgruppe Mitte unterstellt und nahm ihre Rolle als mobile Reserve wieder auf."
germany.404.a:0	"Ändern Sie die Art in Art.(mot.)"
