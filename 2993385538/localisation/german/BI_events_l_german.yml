kmt.152.d:0	"Die [From.GetAdjective]-Regierung hat sich trotz des großzügigen Angebots geweigert, Hongkong zurückzugeben, und wird nun den "Strafschnaps" kosten müssen..."
kmt.152.a:0	"Niemand soll sich gegen das Mutterland stellen!"
kmt.153.t:0	"[From.GetName] Akzeptiert"
kmt.154.t:0	"[From.GetName] Abgelehnt"
kmt.156.d:0	"[From.GetName] hat irgendwie Beweise dafür gefunden, dass wir hinter dem kürzlich gescheiterten Staatsstreich in Hongkong stecken, und sie haben uns öffentlich denunziert!"
kmt.156.a:0	"Wir werden uns revanchieren, wir werden den Handel mit ihnen einstellen!"
kmt.156.b:0	"Eine neue Chance für uns, Hongkong zu erobern!"
