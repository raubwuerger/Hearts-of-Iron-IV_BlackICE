operation.90.t:0	"Französisches Militärisches Unbehagen"
operation.90.d:0	"Nach den Verheerungen und Verlusten des Ersten Weltkriegs wollen die Franzosen nicht noch einmal in einen langwierigen Konflikt hineingezogen werden. Viele ihrer Männer sind kriegsmüde und die Führung des Landes ist defätistisch. Es wird einiger Anstrengungen bedürfen, um dieses Unbehagen zu beseitigen."
