canada.4.d:0	"Im Juni 1937 traf der kanadische Premierminister Mackenzie King als einziger nordamerikanischer Regierungschef mit dem deutschen Bundeskanzler Adolf Hitler zusammen.  Ziel des Besuchs war es, die zunehmende Aggressivität Deutschlands zu beurteilen. King unterstützte wie die meisten anderen europäischen und nordamerikanischen Staats- und Regierungschefs die Politik des "Appeasement" gegenüber der deutschen Aggression."
canada.4.a:0	"Appeasement wird funktionieren."
canada.4.b:0	"Dieser Mann ist böse."
canada.5.d:0	"Ab dem 17. Mai 1939 bereisten König Georg VI. und seine königliche Gemahlin Königin Elisabeth Kanada, die Vereinigten Staaten und das Dominion Neufundland.  Die Royals besuchten jede Provinz und zogen in jeder neuen Stadt eine große Menschenmenge an."
canada.6.a:0	"Weitermachen."
canada.7.t:0	"Ram-Prototyp fertiggestellt"
canada.7.d:0	"Im Juni 1941 war ein funktionsfähiger Prototyp des Ram I fertig, und die Produktion begann im November. Innerhalb von drei Monaten wurde die Produktion auf den Ram II umgestellt, der die größere 6-Pfünder-Kanone verwendete."
canada.7.a:0	"Ausgezeichnet"
canada.8.d:0	"1943 beschlossen die Alliierten, gepanzerte Einheiten auf der Grundlage des amerikanischen Sherman zu standardisieren. Die Montreal Locomotive Works begannen mit der Produktion des Grizzly, eines M4A1 Sherman mit einigen Modifikationen."
canada.9.a:0	"Das ist etwas besser"
bicecanada.1.d:0	"Bis 1941 gab es genügend Freiwillige für fünf Übersee-Divisionen. In der Zwischenzeit übten die Konservativen Druck auf King aus, dem Generalgouverneur die Einführung der Wehrpflicht in Übersee zu empfehlen. Im April 1942 wurde eine Volksabstimmung über die Frage durchgeführt: Sind Sie dafür, die Regierung von allen Verpflichtungen zu entbinden, die sich aus früheren Verpflichtungen ergeben, die die Methoden zur Beschaffung von Männern für den Militärdienst einschränken? Die Volksabstimmung wurde von den meisten englischen Kanadiern sowie von der verbotenen Kommunistischen Partei Kanadas unterstützt, die Tim-Buck-Komitees gründete, um für ein Ja zu werben. In ganz Kanada sprachen sich 64,5 % der Wähler für die Wehrpflicht aus, wobei die englischen Kanadier zu 83 % dafür stimmten. Bei den Frankokanadiern fand der Vorschlag kaum Unterstützung, vor allem in Quebec, wo Gruppen, die sich gegen die Wehrpflicht aussprachen (darunter eine Gruppe unter der Führung von Henri Bourassa, dem schärfsten Gegner der Wehrpflicht im Jahr 1917), 72,9 % der Wähler davon überzeugten, die Volksabstimmung abzulehnen. Die Regierung verabschiedete daraufhin den Gesetzentwurf 80, mit dem die Abschnitte des NRMA aufgehoben wurden, die keine Wehrpflicht in Übersee vorsahen. Viele Kanadier waren jedoch immer noch gegen die sofortige Einberufung; in Montreal kam es zu einigen Unruhen, die jedoch nicht das Ausmaß der Unruhen von 1917 und 1918 erreichten. Selbst in Toronto, einer Region, in der die Wehrpflicht stark befürwortet wurde, unterlag der Konservative Arthur Meighen in einer Nachwahl, nachdem er versprochen hatte, sich für die Einführung der Wehrpflicht einzusetzen."
bicecanada.1.a:0	"Zeit, seinen Mann zu stehen!"
 ##### Hatay ""
hatay.1.d:0	"Die Türken stehen kurz davor, die südtürkische Stadt Hatay an der östlichen Mittelmeerküste zu annektieren, die zu unserem Mandatsgebiet Syrien gehört. Sollen wir sie gewähren lassen, oder werden wir uns doch wehren?"
 ##### Hatay
hatay.2.d:0	"Frankreich hat unsere Forderungen akzeptiert und Hatay ist nun wieder türkisch!"
hatay.3.t:0	"Die Abtretung von Hatay - Antrag abgelehnt"
hatay.3.d:0	"Im letzten Moment hat Frankreich unsere Pläne in Hatay durchkreuzt!"
hatay.3.a:0	"Das ist schlecht..."
