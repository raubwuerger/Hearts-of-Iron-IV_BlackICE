HQ_commands.382.d:0	"Platziert die historischen Kommando-HQs auf der Karte. Bitte beachten Sie, dass diese Einheiten nur zur Veranschaulichung dienen. Ihr müsst nur genügend HQ-Ausrüstung bauen, um die HQ-Kommandoboni zu erhalten. "
