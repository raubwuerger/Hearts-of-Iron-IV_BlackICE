BHU_aftermath_of_the_visit_to_india_desc:0	"Zum ersten Mal seit Jahren stattete der König Indien einen Besuch ab. Dieses Ereignis zementierte die Modernisierungsbewegung des Landes und bestätigte gleichzeitig die politische Lage des Königreichs."
