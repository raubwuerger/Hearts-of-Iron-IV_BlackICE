france.7.t:	"Europas beste Athleten messen sich in Paris!"
france.7.d:	"Die Leichtathletik-Europameisterschaften 1938 sind gerade in Paris, Frankreich, zu Ende gegangen und waren ein spektakuläres Schaufenster für die besten Athleten des Kontinents. Tausende von Zuschauern versammelten sich im Stade Olympique de Colombes, um zu sehen, wie die Rekorde gebrochen und der Nationalstolz zur Schau gestellt wurde, und der Wettbewerb war härter denn je. Inmitten zunehmender politischer Spannungen in ganz Europa war die Veranstaltung ein seltener Moment der Einheit, der Athleten aus dem ganzen Kontinent zusammenbrachte, um in den Disziplinen Leichtathletik, Springen und Werfen gegeneinander anzutreten.\nAls dominierende Kräfte unter den herausragenden Leistungen erwiesen sich Italien, Schweden und Finnland, die sich in verschiedenen Disziplinen mehrere Goldmedaillen sicherten. Die finnischen Langstreckenläufer, die für ihre Ausdauer und Disziplin bekannt sind, setzten die langjährige Tradition ihres Landes fort, während Deutschland und das Vereinigte Königreich ebenfalls starke Leistungen erbrachten und ihre Position als globale Kraftzentren der Leichtathletik untermauerten. Trotz des Schattens der internationalen Instabilität, der sich über Europa gelegt hat, ging die Veranstaltung ohne Zwischenfälle zu Ende, was beweist, dass Sport immer noch ein starkes Symbol für Frieden und Wettbewerb sein kann. Die Ergebnisse dieser Meisterschaften werden zweifellos nationalistische Gefühle in den teilnehmenden Nationen schüren, da die Regierungen den Propagandawert sportlicher Erfolge erkennen. Da die weltweiten Spannungen zunehmen, bleibt die Frage: Wird der nächste große Wettkampf auf der Bahn oder auf dem Schlachtfeld ausgetragen?\n§BResults§!:\n §B1§!. Deutschland - 12 Gold, 12 Silber, 8 Bronze (All Around Powerhouse)\n §B2§!. Finnland - 5 Gold, 3 Silber, 3 Bronze (weiterhin Dominanz im Langstreckenlauf)\n §B3§!. Großbritannien - 4 Gold, 3 Silber, 1 Bronze (Vorherrschaft im Hürdenlauf und in der Staffel)\n §B4§!. Schweden - 3 Gold, 5 Silber, 5 Bronze (Überragend im Springen und Speerwurf)\n §B5§!. Italien - 2 Gold, 2 Silber, 1 Bronze (dominierte Sprint und Feld)"
france.7.a:	"Selbst der Sport kann nicht mehr von dem aufziehenden Sturm ablenken."
france.7.ger:	"Der deutsche Athlet beweist einmal mehr seine Überlegenheit!"
