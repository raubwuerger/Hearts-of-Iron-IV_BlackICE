france.70.d:0	"Die Schlacht von Madagaskar war die britische Kampagne zur Einnahme des von Vichy-Frankreich kontrollierten Madagaskars während des Krieges. Sie begann mit der Operation Ironclad, der Einnahme des Hafens von Diego Suarez an der Nordspitze der Insel, am 5. Mai 1942. Die Alliierten eroberten schließlich ohne großen Widerstand die Hauptstadt Tananarive und anschließend die Stadt Ambalavao. Die letzte größere Aktion fand am 18. Oktober in Andramanalina statt. Am 6. November wurde in Ambalavao ein Waffenstillstand unterzeichnet, und am 8. November 1942 kapitulierte Annet in der Nähe von Ihosy im Süden der Insel."
france.70.a:0	"Sehr gut"

portugal.7.d:0	"Nach den jüngsten Erfolgen in China hat das japanische Kaiserreich ein Auge auf unsere Kolonie Macau geworfen. Mit der Androhung militärischer Maßnahmen hat [FROM.GetAdjective] die Übergabe der Kolonie gefordert."
portugal.7.a:0	"Wir können nicht hoffen, gegen sie zu bestehen"
portugal.7.b:0	"Wir werden nicht nachgeben!"
portugal.8.d:0	"Portugal hat unseren Forderungen zugestimmt und wird die Überführung der Kolonie Macau in unser Reich einleiten"
portugal.8.a:0	"Ausgezeichnet"
portugal.9.t:0	"Portugal weigert sich"
portugal.9.d:0	"In einem dreisten Akt des Trotzes haben die Portugiesen unsere Forderungen abgelehnt."
portugal.9.a:0	"Wir können eine solche Beleidigung nicht unbeantwortet lassen"
portugal.13.t:0	"Portugal bricht die diplomatischen Beziehungen zur Tschechoslowakei ab"
portugal.13.d:0	"Portugal hat die diplomatischen Beziehungen zur Tschechoslowakei wegen eines Streits über die Wiederbewaffnung abgebrochen. Zu den Spannungen kam es, weil die Tschechoslowakei nicht bereit war, Waffen an Portugal zu liefern, das sich selbst aufrüsten wollte. Dies führte zum Abbruch der diplomatischen Beziehungen zwischen den beiden Ländern. Beide Seiten beschuldigten die jeweils andere Seite, frühere Vereinbarungen gebrochen zu haben."
portugal.13.a:0	"Diese Beleidigung kann nicht ignoriert werden"
portugal.13.c:0	"Besorgniserregend"
