tblra.23.t:0	"Paul Van Zeeland wird der Veruntreuung beschuldigt!"
tblra.23.d:0	"Der Abgeordnete Gustaaf Sap hat den Premierminister der Veruntreuung beschuldigt, als er bei der Nationalbank arbeitete. Auch nach dem Dementi Van Zeelands setzt dieser Skandal die Regierung stark unter Druck. Die Dreierkoalition würde den Schock vorerst noch verkraften."
tblra.23.a:0	"Sicherer wäre es, zurückzutreten."
tblra.24.t:0	"Politische Agitation bedroht die Regierung!"
tblra.24.d:0	"Als die Bedrohung durch die Rexisten weniger bedrohlich erschien, nahm die politische Rivalität wieder zu. Der Finanzminister Henri De Man versuchte, die linken Flügel der katholischen Partei und der liberalen Partei mit der sozialistischen Partei zu vereinen, um eine neue Steuer zu erlassen, die die höheren sozialen Schichten betraf. De Man trat daraufhin zurück \"aus gesundheitlichen Gründen\". Dieses Projekt bringt die parlamentarische Mehrheit erneut ins Wanken. Es muss eine neue Koalition gebildet werden, ohne die Katholiken."
tblra.25.t:0	"Politische Unruhe bedroht die Regierung (erneut)!"
tblra.25.d:0	"König Leopold III. hat sich geweigert, die Ernennung von Dr. Adriaan Martens, der im Ersten Weltkrieg mit den deutschen kaiserlichen Streitkräften kollaboriert hat, zum Leiter der Flämischen Akademie für Medizin zu unterzeichnen. Der Vorschlag hätte zunächst vom Ministerrat gebilligt werden müssen. Es stellte sich jedoch heraus, dass dies nicht der Fall war und dass jemand seinen Namen auf den königlichen Auftrag gesetzt hatte. Der Skandal führte zum Rücktritt der gesamten Regierung."
tblra.26.t:0	"Der König und die Regierung sind sich einig, um das Land zu verteidigen, Hubert Pierlot wurde als Premierminister bestätigt!"
tblra.26.d:0	"Um die gegenwärtige Situation zu meistern und die Einheit des Landes zu gewährleisten, wurde die Regierungskoalition erweitert, um alle demokratischen Parteien des Landes mit Hubert Pierlot als Premierminister einzubeziehen."
tblra.27.d:0	"Um der plötzlichen Aggression unseres Landes zu begegnen, wurde die Regierungskoalition erweitert, um alle demokratischen Parteien des Landes mit Hubert Pierlot als Premierminister einzubeziehen."
tblra.27.a:0	"Wir hoffen, dass wir eines Tages in Frieden leben werden."
tblra.28.t:0	"Belgisches Ultimatum"
tblra.28.d:0	"Die belgische revolutionäre Regierung will unserem Land die Einsetzung einer kommunistischen Regierung aufzwingen."
tblra.28.a:0	"Akzeptieren Sie"
tblra.38.t:0	"Die Wahlkampagne 1936 beginnt!"
tblra.38.d:0	"Die zunehmenden politischen Aktivitäten zeigen deutlich, dass die Wahlen kurz bevorstehen. In einigen Monaten, Ende Mai, wird das belgische Volk zur Wahl gebeten. Hinter den Kulissen verhandeln einige Parteien bereits über Wahlvereinbarungen, um nach dem Wahltag eine neue Koalition bilden zu können. Werden die neuen populistischen Bewegungen wie Rex, Verdinaso und die VNV den traditionellen Parteien einen Teil ihrer Stimmen wegnehmen?"
tblra.38.a:0	"Wir werden ein großes Treffen organisieren!"
tblra.39.t:0	"Demokratische Union zerbrochen!"
tblra.41.d:0	"In einem politischen Manöver, das mit der Demission der POB-Vertreter im Jahr 1935 vergleichbar ist, treten die Brüsseler Rexisten-Vertreter alle gleichzeitig zurück und erzwingen die Durchführung von Teilwahlen. Um der Bedrohung durch die Rexisten und insbesondere der Nachricht von der Kandidatur von Léon Degrelle persönlich zu begegnen, beschloss der Premierminister, gegen ihn zu kandidieren. Er wird von allen anderen Parteien unterstützt, auch von den Kommunisten."
tblra.42.t:0	"Die 1919 geraubten deutschen Gebiete."
tblra.43.t:0	"Léon Degrelle verkündet den Anbruch des Thiois-Reiches"
tblra.43.d:0	"In einer langen Rede, in der er den Wert der Nation und ihrer Armee lobte, verkündete Léon Degrelle, dass mit der Vollendung der Union mit den Niederlanden eine neue Ära für die nun wiedervereinigten Niederländischen Länder begonnen habe. Um diesen Wandel zu verdeutlichen, wird das Land nun den Namen Thiois Empire tragen. In einem Aufruf zur Wiederbelebung des Geistes von Kaiser Karl V. forderte er die Wiedervereinigung des alten "burgundischen Kreises" zu dieser neuen politischen Einheit."
tblra.49.d:0	"Zu Beginn der Invasion wurden belgische Faschisten von der Regierung inhaftiert, weil man befürchtete, dass sie mit dem Feind kollaborieren könnten. Diese politischen Gefangenen wurden aus der Reichweite der feindlichen Truppen verlegt und schließlich nach Frankreich gebracht, wo sie von französischen Soldaten bewacht wurden. Gestern Abend töteten betrunkene Soldaten, die durch die Kapitulation der belgischen Armee frustriert waren, ihre Gefangenen und beendeten das Leben eines der wichtigsten flämischen Faschistenführer: Joris Van Severen."
tblra.49.a:0	"Ein Opfer unter Tausenden in diesem Krieg."
tblra.51.t:0	"Nordfrankreich befreit"
tblra.51.d:0	"Jetzt, da der Norden wieder frei ist, müssen die Städte ihren wahren Namen wiederfinden. De Gaulle wurde in Lille geboren, nicht in Ri-je-zelle."
tblra.51.a:0	"La France retrouve son individible unité."
tblra.52.t:0	"Die alten FT-17"
tblra.52.d:0	"14 Renault Ft, die seit Jahren nicht mehr eingesetzt wurden, befinden sich noch in unseren Reserven. Sie sind Überbleibsel der 49 Panzer, die nach dem Ende des Ersten Weltkriegs von Frankreich gekauft wurden und von denen jeder weiß, dass sie veraltet sind. Manche meinen, es wäre eine gute Idee, sie an die Gendarmerie zu verschenken."
tblra.52.a:0	"Schenken Sie sie vorerst der Gendarmerie"
tblra.53.t:0	"Das Artilleriedepot"
tblra.53.a:0	"Wir müssen sie unseren Divisionen zuweisen."
tblra.54.t:0	"Das Artilleriedepot - Die schwedischen Geschütze"
tblra.54.a:0	"Wir müssen sie unseren Divisionen zuweisen."
tblra.55.t:0	"Hubert Pierlot zurückgetreten"
tblra.56.t:0	"Verschiffung von Katanga-Uran gestoppt"
tblra.56.d:0	"Da Belgien die Kontrolle über Katanga verloren hat oder unsere Zusammenarbeit mit der belgischen Regierung abgebrochen wurde, haben wir keinen Zugang mehr zu dem wertvollen Katanga-Uran."
tblra.56.a:0	"Wir müssen ohne es weitermachen."
tblra.57.t:0	"Versand von Katanga-Uran erhalten"
tblra.57.d:0	"Aufgrund unserer Zusammenarbeit mit der belgischen Regierung, die die Uranminen von Katanga kontrolliert, haben wir eine Lieferung dieses wertvollen Minerals erhalten."
tblra.58.d:0	"Der Führer der belgischen kommunistischen Partei wurde von den deutschen Streitkräften verhaftet und in der Festung von Breendonck in Gewahrsam genommen"
tblra.58.a:0	"Ein weiteres Opfer des Faschismus"
tblra.59.t:0	"Julien Lahaut verhaftet"
tblra.59.d:0	"Der Vorsitzende der belgischen kommunistischen Partei wurde von den deutschen Streitkräften verhaftet und in der Festung Breendonck in Gewahrsam genommen"
tblra.62.t:0	"Leopold III. kapituliert"
tblra.63.t:0	"Karl wird Prinzregent"
tblra.64.t:0	"Die demokratische Union ist zerbrochen!"
tblra.64.d:0	"Aufgrund der Entwicklung der politischen Situation in Belgien ist die politische Union, die den Krieg befürwortet hat, nun aufgelöst."
tblra.news.1.d:0	"Die niederländische Regierung akzeptierte die Bedingungen des belgischen Ultimatums und öffnete sich damit einem starken kommunistischen Einfluss."
tblra.news.1.a:0	"Tolle Neuigkeiten!"
tblra.news.2.d:0	"Die holländische Regierung hat das belgische Ultimatum zurückgewiesen und erklärt, dass sie sich diesen lächerlichen Forderungen nicht beugen wird. Die niederländische Regierung fügte hinzu, dass sie bereit sei, ihr letztes Stück Land gegen Wasser oder andere Eindringlinge zu verteidigen."
tblra.news.2.a:0	"Die Niederländer stehen gegen Aggression!"
tblra.news.2.b:0	"Unsere niederländischen Verbündeten werden uns brauchen, lasst uns bereit sein."
tblra.news.2.c:0	"Das wird den Lauf der Geschichte nicht aufhalten!"
tblra.news.2.e:0	"Besorgniserregend!"
tblra.news.3.t:0	"Die niederländische Regierung bittet um die Hilfe der Alliierten!"
tblra.news.3.d:0	"Die niederländische Regierung hat die belgischen Forderungen zurückgewiesen und die Alliierten um militärischen Beistand im Falle einer belgischen Aggression gebeten."
tblra.news.3.b:0	"Die Feinde unserer Feinde sind (fast) meine Freunde."
tblra.news.3.c:0	"Das wird den Lauf der Geschichte nicht aufhalten!"
tblra.news.43.t:0	"Léon Degrelle proklamiert das Reich Thiois"
tblra.news.43.d:0	"In einer langen Rede, in der er den Wert der Nation und ihrer Armee lobte, verkündete Léon Degrelle, dass mit der Vollendung der Union mit den Niederlanden eine neue Ära für die nun wiedervereinigten Niederländischen Länder begonnen habe. Um diesen Wandel zu verdeutlichen, wird das Land nun den Namen Thiois Empire tragen. In einem Aufruf zur Wiederbelebung des Geistes von Kaiser Karl V. forderte er die Wiedervereinigung des alten "burgundischen Kreises" zu dieser neuen politischen Einheit."
tblra.news.43.c:0	"Wir werden unsere Landkarten ändern müssen."
tblra.news.44.t:0	"Joris Van Severen proklamiert den Dietsche Rijk"
tblra.news.44.d:0	"In einer langen Rede, in der er den Wert der Nation und ihrer Armee lobte, verkündete Joris Van Severen, dass mit der Vollendung der Union mit den Niederlanden eine neue Ära für die nun wiedervereinigten Niederländischen Länder begonnen habe. Um diesen Wandel zu verdeutlichen, wird das Land nun den Namen Dietsche Rijk tragen. In einem Aufruf zur Wiederherstellung der Einheit der niederländischen Sprache rief er dazu auf, alle Erben der Niederländer in dieser neuen politischen Einheit zu vereinen."

tblra.news.44.b:0	"Nach dem Land, das es nicht gibt, das Reich, das es nicht gibt!"
bel_cityfall.1.t:0	"Der Fall von Berlin"
bel_cityfall.1.d:0	"Siegreiche belgische Soldaten marschieren nach erbitterten Kämpfen um das Brandenburger Tor, den Reichstag und die Reichskanzlei durch die Straßen Berlins.\n\nDie belgische Flagge weht nun über dem Reichstag. In der Zwischenzeit werden Spezialteams ausgesandt, um die Stadt zu durchsuchen und jeden deutschen Beamten, der in der belagerten Stadt gefangen ist, gefangen zu nehmen."
bel_cityfall.1.a:0	"Der belgische Löwe brüllt wieder!"
bel_cityfall.1.b:0	"Der belgische Löwe brüllt wieder!"
bel_cityfall.3.d:0	"Siegreiche belgische Soldaten marschieren durch die Straßen Moskaus, nachdem der größte Teil des Tages von heftigen Kämpfen geprägt war. Die belgischen Bataillone beziehen Stellung rund um den Roten Platz und in den beschädigten Gebäuden des Kremls. Wie durch ein Wunder überstanden die Türme der Basilika das Artilleriefeuer, ebenso wie der Turm des Brüsseler Rathauses im Jahr 1695."
bel_cityfall.3.c:0	"Belgier? Hier?"
bel_cityfall.4.a:0	"Der belgische Löwe brüllt wieder!"
bel_cityfall.4.b:0	"Der belgische Löwe brüllt wieder!"
bel_cityfall.5-2.d:0	"Siegreiche belgische Soldaten marschierten heute Morgen die Champs Elysées entlang. Belgische Bataillone bezogen Stellung rund um den Eifelturm, das Hotel Matignon und den Palais du Luxembourg. Während sich die Franzosen zurückziehen, nutzten einige belgische Offiziere die Gelegenheit, den Louvre zu besuchen, auch wenn fast alles evakuiert wurde. In der Zwischenzeit gab der Oberbefehlshaber der belgischen Streitkräfte eine Proklamation heraus, in der er den Parisern mitteilte, dass sie die vorrückende Armee nicht fürchten müssten, da sie sich menschlich verhalten würden. Er verkündete auch, dass dieser historische Sieg das Ende der französischen Vorherrschaft über Flandern bedeute, das in den letzten drei Jahrhunderten von den imperialistischen Franzosen erobert und unterdrückt wurde."
bel_cityfall.5.b:0	"Der belgische Löwe brüllt wieder!"

bel_cityfall.6.c:0	"Sie können nicht einmal richtig zählen, und sie schlagen uns?"
bel_cityfall.7.t:0	"Der Fall von Jerusalem"
bel_cityfall.7.d:0	"Die siegreichen belgischen Soldaten sind heute Morgen in die Altstadt von Jerusalem eingezogen. Die Bataillone haben auf dem Tempelberg und am Heiligen Grab Stellung bezogen. Während sich die britischen Streitkräfte zurückziehen, haben belgische Offiziere das Heilige Grab betreten, um vor dem Grab Christi zu beten und Godefroy von Bouillon, dem Eroberer Jerusalems während des ersten Kreuzzugs, ihren Respekt zu erweisen. Léon Degrelle begrüßte diesen großen Sieg als Zeichen dafür, dass Gott im Kampf der heiligen europäischen Zivilisation gegen die jüdisch-bolschewistische plutokratische Barbarei auf seiner Seite war."
bel_cityfall.7.a:0	"Der belgische Löwe brüllt wieder!"
bel_cityfall.7.b:0	"Deus Vult!"
bel_cityfall.7.c:0	"Ein Gegenangriff wird unumgänglich sein!"
 ## France New ## "Fertigstellung der Nord-Süd-Eisenbahn in Indochina"
france.5.d:0	"Die am 2. Oktober 1936 vollständig eingeweihte, 1726 km lange Eisenbahnstrecke sollte das Rückgrat des vietnamesischen Eisenbahnsystems bilden. Mit dem Bau der ersten Abschnitte der Nord-Süd-Eisenbahn wurde 1899 begonnen, und sie sollte während des Krieges intensiv genutzt werden."
france.5.a:0	"Endlich!"
france.6.d:0	""
france.6.a:0	"sich verstecken und wichtige Ziele angreifen"
france.32.d:0	"Die Volksfront gewinnt die Parlamentswahlen und erhält die Mehrheit im Parlament. Das Bündnis linker Bewegungen, darunter die Kommunistische Partei Frankreichs (PCF), die Französische Sektion der Arbeiterinternationale (SFIO) und die Radikale und Sozialistische Partei, kündigt die Bildung einer Regierung unter der Leitung des SFIO-Führers Léon Blum an. Die Franzosen hoffen, dass die Regierung Blum soziale Reformen durchführen wird, um die derzeitige politische Krise zu beenden."
france.32.a:0	"Mit der Front ist alles möglich!"
france.33.t:0	"Der Hoare-Laval-Pakt"
france.33.a:0	"Pierre Laval muss zurücktreten."
france.34.d:0	"Die Einführung der 40-Stunden-Woche erwies sich angesichts der ebenfalls um 46 % gestiegenen Inflation als äußerst ineffizient, da sich die Industrie nur schwer darauf einstellen konnte. Die wirtschaftliche Verwirrung behindert die Wiederaufrüstungsbemühungen, und die rasche Zunahme der deutschen Rüstung zwingt Blum, die sozialen Reformprogramme aufzugeben, auf die sich die Volksfront stark verlassen hatte. Léon Blum tritt zurück, da das Parlament ihm die Mittel zur Lösung der Wirtschaftskrise verweigert."
france.34.a:0	"Edouard Daladier und die Radikalen werden eine neue Regierung bilden"
france.35.t:0	"Inflation!"
france.35.d:0	"1936 erholt sich Frankreich nur langsam von der Wirtschaftskrise, die das Land 1931 getroffen hatte. Die instabile politische Lage, die hohe Arbeitslosigkeit und das Haushaltsdefizit stellen für die Regierung bereits eine Herausforderung dar. Leider führt die schnelle Deflation zu einer Überbewertung des Frankens. Sie provoziert eine Wirtschaftskrise und zwei Drittel der Exporte brechen ein. Mit der allgemeinen Kapitalflucht und dem Widerstand einiger Arbeitgeber ist die Situation alarmierend und die Enttäuschung der Arbeiterklasse über die Politik ist bereits groß."
france.35.a:0	"Wir müssen die Wirtschaft schnell reformieren"
 ## France New ##
france.37.a:0	"Wir brauchen ihre Hilfe nicht, um die Nation zu führen"
france.38.a:0	"Sozialisten und Kommunisten werden zusammenstehen!"
france.39.a:0	"Camille Chautemps wird die neue Regierung führen"
france.40.t:0	"Belgien und Luxemburg einladen"
france.40.d:0	"Um das mögliche Wiederaufleben des aggressiven Expansionismus der alten Mittelmächte einzudämmen, hat Frankreich Belgien und Luxemburg aufgefordert, sich den Alliierten anzuschließen, um Hitlers Ambitionen zu stoppen."
france.40.a:0	"Wir müssen die Benelux-Staaten schützen."
france.40.b:0	"Wir wollen keinen Ärger mit Hitler bekommen."
france.41.t:0	"Großbritannien akzeptiert das Bündnis"
france.41.d:0	"Großbritannien befürwortet unsere Bemühungen und hat die Einladung Belgiens und Luxemburgs in das Bündnis angenommen."
france.41.a:0	"Gerne können wir uns wieder vor Deutschland schützen."
france.42.t:0	"Großbritannien lehnt das Bündnis ab"
france.42.d:0	"Trotz unserer Bemühungen, den Alliierten Unterstützung anzubieten, ist unser jüngster Versuch, einer der Nationen die Hand zu reichen, auf Skepsis gestoßen. Großbritannien hat sich geweigert, Belgien und Luxemburg in das Bündnis aufzunehmen."
france.43.a:0	"Der Militärstab gibt die Führung an Pétain ab."
france.44.t:0	"Referendum der Nationalisten"
france.45.b:0	"Wir geben unser Land nie kampflos her!"
france.46.t:0	"Belgien nimmt an"
france.46.d:0	"Belgien hat unserer Forderung nachgegeben und uns Wallonien überlassen."
france.46.a:0	"Die Wallonen sind jetzt Franzosen."
france.47.t:0	"Belgien weigert sich"
france.47.d:0	"Belgien weigert sich, auf unsere Forderung einzugehen und ist bereit zu kämpfen."
france.47.a:0	"Sie wissen, welche Konsequenzen das hat."
france.48.d:0	"Frankreich hat einen Plan, die Schweiz in zwei Teile zu teilen, wobei wir den östlichen Teil bekommen sollen. Sollen wir das akzeptieren?"
france.48.a:0	"Ja, wir müssen dieses Land von der Landkarte streichen!"
france.49.t:0	"Deutschland nimmt an"
france.49.d:0	"Hitler akzeptiert deinen Plan, die Schweiz in zwei Hälften zu teilen, und behauptet, dass Europa nun sowohl von Franzosen als auch von Deutschen regiert wird!"
france.53.t:0	"Union sacrée"
france.53.d:0	"Die Union sacrée war ein politischer Waffenstillstand in Frankreich während des Ersten Weltkriegs, um die Regierung zu einigen und in Kriegszeiten Solidarität zu schaffen. In diesen unruhigen Zeiten hat die Regierung angekündigt, eine Vereinbarung mit den verschiedenen politischen Bewegungen getroffen zu haben. Sie legen ihre Streitigkeiten beiseite und kämpfen für die Zukunft Frankreichs."
france.53.a:0	"Vive la France!"
france.54.d:0	"Die Abgeordnetenkammer wählt Reynaud zum Premierminister, aber nur mit einer einzigen Stimme, da sich die meisten Mitglieder seiner eigenen Partei enthalten. Die neue Regierung ist besonders instabil; viele Vertreter der Rechten fordern, dass Reynaud nicht Deutschland, sondern die Sowjetunion angreift. Die Kammer zwingt auch Daladier, den Reynaud persönlich für die Schwäche Frankreichs verantwortlich macht, Reynauds Minister für Landesverteidigung und Krieg zu werden."
france.55.t:0	"Wiederherstellung der Monarchie"
france.55.d:0	"Heute hat Papst Pius XI. Heinrich VII. als König des Königreichs Frankreich inthronisiert. Das neue Staatsoberhaupt kündigt an, dass er das Land in diesen unsicheren Zeiten führen wird."
france.55.a:0	"Vive le Roi!"
france.56.t:0	"Einladung an die französische Fraktion"
france.56.d:0	"In dem Bestreben, ein neues Bündnis zu stärken und das mögliche Wiederaufleben des aggressiven Expansionismus der alten Mittelmächte einzudämmen, hat Frankreich darum gebeten, dass wir uns ihm in einem Bündnis anschließen, das diese Nationen zusammenführen soll."
france.58.a:0	"Sie könnten bereits ein Ziel sein, soweit sie wissen!"
france.59.a:0	"Der Nord-Osten ist nun sicher."
france.60.a:0	"Maurice Thorez wird die Nation führen."
france.61.t:0	"Abkommen über wirtschaftliche Zusammenarbeit"
france.61.d:0	"Um eine perfekte militärische Zusammenarbeit zu gewährleisten, müssen wir einige wirtschaftliche und logistische Vereinbarungen mit dem Vereinigten Königreich treffen. Welche Maßnahmen müssen die Alliierten nach der Unterzeichnung des Abkommens vorrangig ergreifen?"
france.61.a:0	"Austausch neuer elektronischer und industrieller Technologien"
france.61.b:0	"Koordinierung unserer militärischen Logistik und Pläne"
france.61.c:0	"Verhängung von Wirtschaftssanktionen gegen Deutschland"
france.62.t:0	"Ernennung eines Materialdesigners"
france.62.d:0	"Um den Bedarf an Ausrüstung für unsere Armee zu decken, können wir einen Materialdesigner einstellen. Was sollen wir wählen?"
france.62.a:0	"MAB"
france.62.b:0	"APX"
france.63.d:0	"Um den Bedarf an Ausrüstung für unsere Armee zu decken, können wir einen Panzerdesigner einstellen. Was sollen wir wählen?"
france.63.b:0	"Berlier"
france.73.t:0	"Philippe Pétain"
france.73.d:0	"Er ist besser"
france.73.a:0	"Er ist besser"
france.77.t:0	"Charles de Gaulle"
france.77.d:0	"Er ist besser"
france.77.a:0	"Er ist besser"
#### Nicaragua Events  ""
nicaragua.1.d:0	 "Nicaragua reichte beim Völkerbund eine formelle Beschwerde bezüglich der Behandlung der Nicaraguaner durch Honduras und des anhaltenden Streits über ihre gemeinsame Grenze ein. Die nicaraguanische Regierung äußert Bedenken hinsichtlich der Behandlung und des Wohlergehens der in Nicaragua lebenden Bürger in Honduras sowie die feindselige Haltung der honduranischen Behörden im Grenzstreit.\nNicaragua behauptet, dass die Maßnahmen Honduras die Rechte und die Würde der in Honduras lebenden nicaraguanischen Personen verletzt haben. Sie bringen ihre tiefe Sorge um die Sicherheit und das Wohlergehen ihrer Bürger zum Ausdruck und suchen Sie nach internationalen Interventionen, um das Problem anzugehen.\nDarüber hinaus stellt der Grenzstreit zwischen Nicaragua und Honduras eine Quelle von Spannungen und Konflikten zwischen den beiden Nationen dar. Nicaragua wirft Honduras vor, in dem Streit eine ungünstige Haltung einzunehmen, was ihre Beziehungen weiter belastet hat .\nIndem Nicaragua den Völkerbund auf diese Angelegenheit aufmerksam macht, strebt es eine Lösung an, die die Grundsätze des Völkerrechts wahrt, das friedliche Zusammenleben fördert und die Rechte und das Wohlergehen der nicaraguanischen Staatsangehörigen schützt. Die Liga wird nun die Beschwerde prüfen und über die geeignete Vorgehensweise entscheiden, um die von Nicaragua geäußerten Bedenken auszuräumen. "
nicaragua.1.a:0	 "Unsere Notlage ist bekannt "
nicaragua.1.c:0	 "Vielleicht können wir helfen "
nicaragua.1.e:0	 "Hoffentlich kann eine Meditation arrangiert werden "
nicaragua.4.t:	"Armee übernimmt die volle Kontrolle über Nicaragua"
nicaragua.4.d:	"Der Kommandeur der Nationalgarde, Anastasio Somoza Garcia, hat alle Vorwände einer demokratischen Regierung aufgegeben und sich nach einer manipulierten Abstimmung zum Präsidenten erklärt, sollte er mit einem Vorsprung von 107.201 zu 100 Stimmen gewinnen."
nicaragua.4.a:	"Auch unsere neue Regierung"
worldnews.1.t:0	"Bündnis mit den Beneluxstaaten"
worldnews.1.a:0	"Die Alliierten werden stärker."
worldnews.2.t:0	"Mit brennender Sorge In Deutschland lesen"
worldnews.2.d:0	"Die Enzyklika, die nicht wie üblich in Latein, sondern in Deutsch verfasst ist, wurde aus Angst vor der Zensur nach Deutschland geschmuggelt und heute an einem der meistbesuchten Sonntage der Kirche, dem Palmsonntag, von den Kanzeln aller deutschen katholischen Kirchen verlesen. Die Enzyklika verurteilt Verstöße gegen das 1933 zwischen dem Deutschen Reich und dem Heiligen Stuhl geschlossene Reichskonkordat. Sie verurteilt "pantheistische Verwirrung", "Neuheidentum", "den sogenannten Mythos von Rasse und Blut" und die Vergötterung des Staates. Es enthält eine energische Verteidigung des Alten Testaments in der Überzeugung, dass es den Weg für das Neue Testament bereitet. Es stellt fest, dass die Rasse ein grundlegender Wert der menschlichen Gemeinschaft ist, der notwendig und ehrenwert ist, verurteilt aber die Überhöhung der Rasse oder des Volkes oder des Staates über ihren normalen Wert hinaus auf ein götzendienerisches Niveau. Sie erklärt auch, "dass der Mensch als Person Rechte besitzt, die er von Gott hat und die jede Gemeinschaft gegen Verleugnung, Unterdrückung oder Vernachlässigung schützen muss." Obwohl der Nationalsozialismus, Adolf Hitler und die Nazipartei in dem Dokument nicht namentlich genannt werden, wissen alle, die es hören, genau, wer kritisiert wird, und einige glauben sogar, dass der Führer darin als "verrückter Prophet" bezeichnet wird. Es ist die erste organisierte Kritik an der Nazipartei seit ihrer Machtübernahme, und viele Katholiken haben sich die Worte des Papstes zu Herzen genommen."
worldnews.2.a:0	"Der Faschismus wird zurückgedrängt"
worldnews.2.b:0	"Beschlagnahmt alle Exemplare dieses Dokuments!"
 #### Nicaragua Events
worldnews.5.t:0	"Die Pariser Weltausstellung"
worldnews.5.a:0	"Ein riesiger weltweiter Erfolg"
worldnews.6.d:0	"Die Fußballweltmeisterschaft wird in Frankreich ausgetragen. Das achtzehnte Spiel in Folge zieht die ganze Welt in seinen Bann und dreihundertsechsundsiebzigtausend Zuschauer sind in den französischen Stadien. Die vierunddreißig Länder kämpfen unerbittlich, aber es ist Italien, das schließlich das Finale gegen Ungarn gewinnt. Das Mittelmeerland ist zum zweiten Mal Weltmeister. Der Brasilianer Leônidas da Silva, bekannt als der "Schwarze Diamant", ist jedoch der beste Stürmer des Turniers mit seiner persönlichen Technik: dem "Fahrradkick"."
worldnews.6.a:0	"Italien behält die Meisterschaft."
worldnews.7.t:0	"Pearl Harbour bombardiert"
worldnews.7.a:0	"Die Lage im Pazifik spitzt sich zu."
worldnews.7.BOOM:0	"Die IJN hat heute einen kühnen Angriff auf den US-Stützpunkt Pearl Habor unternommen, und das japanische Kommando soll überglücklich über das Ergebnis sein. Die amerikanische Pazifikflotte leidet unter den Folgen der Bombardierung, und obwohl die USA in den Krieg hineingezogen wurden, ist es unwahrscheinlich, dass sie in absehbarer Zeit in der Lage sein werden, eine Gegenoffensive zu starten."
worldnews.7.good:0	"Die IJN hat heute einen kühnen Angriff auf den US-Stützpunkt Pearl Habor unternommen, und die japanische Führung soll mit dem Ergebnis zufrieden sein. Die amerikanische Pazifikflotte leidet unter den Bombardierungen, und obwohl die USA stark in den Krieg hineingezogen wurden, ist es unwahrscheinlich, dass sie in der Lage sein werden, sofort eine Gegenoffensive zu starten."
worldnews.7.historical:0	"Die IJN hat heute einen kühnen Angriff auf den US-Stützpunkt Pearl Habor unternommen, und die japanische Führung soll mit dem Ergebnis zufrieden sein. Die amerikanische Pazifikflotte ist durch die Bombardierung erschüttert, und obwohl die USA stark in den Krieg hineingezogen wurden, ist es unwahrscheinlich, dass sie in der Lage sein werden, eine Gegenoffensive zu starten, bevor sie sich neu formieren."
worldnews.7.poor:0	"Die IJN hat heute einen kühnen Angriff auf den US-Stützpunkt in Pearl Habor unternommen, und die japanische Führung soll den Ergebnissen gegenüber gleichgültig sein. Die amerikanische Pazifikflotte ist durch die Bombardierung erschüttert, und obwohl die USA stark in den Krieg hineingezogen wurden, ist es wahrscheinlich, dass sie bald in der Lage sein werden, eine Gegenoffensive zu starten."
worldnews.7.wipeout:0	"Die IJN hat heute einen kühnen Angriff auf den US-Stützpunkt in Pearl Habor unternommen, und die japanische Führung soll von den Ergebnissen enttäuscht sein. Die amerikanische Pazifikflotte ist durch die Bombardierung leicht erschüttert und obwohl die USA stark in den Krieg hineingezogen wurden, werden sie wahrscheinlich in der Lage sein, eine starke Gegenoffensive zu starten."

 #### WORLD NEWS ####
blackiceevents.151.desc:0	"Wir haben eine große Auswahl an militärischer Ausrüstung sowie spezielle Rüstungen, Flugzeuge und Schiffe für alle großen Nationen hinzugefügt. Die nationalen Fokusbäume wurden für alle großen und viele der kleinen Nationen überarbeitet (einschließlich anderer Mods, die BICE großzügig erlaubt haben, ihre Fokusbäume zu verwenden). Neue Lagergebäude ermöglichen es, in Friedenszeiten Ressourcen zu sammeln, die dann genutzt werden können, wenn sie am dringendsten benötigt werden. Wir haben auch die OOBs, Divisionsvorlagen, Forschungsoptionen und die Ausrüstungsproduktion für alle Nationen umfassend überarbeitet und erweitert. Bestimmte neue Forschungen liefern neue Einheiten, während andere entweder neue Ausrüstung oder Verbesserungen für bestehende Einheiten liefern. Um die Kosten für die Herstellung von Ausrüstung auszugleichen, können spezialisierte Fabriken gebaut werden (z. B. Panzer, Artillerie, Handfeuerwaffen usw.). Diese Gebäude senken die Kosten für die dazugehörige Ausrüstung. Die KI wurde im Vergleich zur Vanilla-Version stark verbessert, ist aber leider nicht in der Lage, mit länderspezifischer Luft- und Seeausrüstung zu arbeiten. Die KI-Majors werden immer die generischen Bäume verwenden. Wir werden das wieder ändern, sobald wir die KI auf ein akzeptables Niveau gebracht haben. Auch damit sind wir nicht zufrieden."
blackiceevents.153.desc:0	"Da BICE die Vanilleversion von Hearts of Iron IV in vielerlei Hinsicht verändert, gibt es einige Aspekte des Mods, die nicht auf den ersten Blick ersichtlich sind, die aber für jede Kampagne entscheidend sind. Die Erforschung bestimmter Ausrüstungskategorien (z.B. Panzerabwehrgewehre) kann sofort dazu führen, dass Bataillone diese Ausrüstung benötigen. Diese Ausrüstungs-Technologien verfügen über benutzerdefinierte Tooltips, die Sie darüber informieren, welche Einheiten die neu freigeschaltete Ausrüstung verwenden werden.\n\nEs gibt ein neues Gesetz in der Kategorie Soldaten, das die Mobilisierung Ihres Landes darstellt. Bei niedriger Mobilisierung sind Ihre Streitkräfte nicht in der Lage, einen Kampf zu bestehen, also stellen Sie sicher, dass Sie Ihr Land rechtzeitig mobilisieren. Die Mobilisierung auf die nächste Stufe dauert etwa 5 Wochen."

BICE_dissent_events.02.t:0	"Arbeiterstreik"
BICE_dissent_events.02.a:0	"Beschwichtigen Sie die Streikenden. Wir dürfen ihre Produktivität nicht verlieren."
BICE_dissent_events.02.b:0	"Warten Sie sie ab. Lohneinbußen werden sie aushungern, um sich wieder anzuschließen."
BICE_dissent_events.02.c:0	"Das kann nicht zugelassen werden. Zerschlagt die Streikenden."
BICE_dissent_events.02.desc:0	"Aus Verärgerung über ihre Arbeitsbedingungen und Löhne haben Fabrik- und Werftarbeiter im ganzen Land ihre Arbeit niedergelegt und mit dem Streik begonnen! Wir könnten sie einfach abwarten, aber unsere Produktion würde in der Zwischenzeit ernsthaft darunter leiden. Wir könnten die Polizei einschalten und den Streik auflösen, aber das könnte zu erheblichen Gegenreaktionen führen, die sich zu etwas viel Schlimmerem entwickeln könnten. Und schließlich könnten wir ihren Forderungen nachgeben, was langfristig unsere industrielle Produktion verringern würde. Wir müssen auch bedenken, wie dies in unserem Land wahrgenommen werden wird, wobei die Rechten härtere Maßnahmen und die Linken Zugeständnisse bevorzugen. Was sollten wir tun?"
BICE_dissent_events.03.a:0	"Okay"
BICE_dissent_events.03.desc:0	"Unser Versuch, den Streik zu brechen, hat leider dazu geführt, dass die Situation zu einem ausgewachsenen Aufstand der Arbeitnehmer eskaliert ist"
BICE_dissent_events.04.a:0	"Das könnte zu einem Zwischenfall führen. Er muss entlassen werden."
 
BICE_dissent_events.04.c:0	"Ignorieren Sie es, und es wird aus dem Nachrichtenzyklus verschwinden."

 ### Politics ###
BICE_dissent_events.07.desc:0	"Aus Verzweiflung über die Grundversorgung und aus Unzufriedenheit mit dem Krieg hat ein Mob von Zivilisten die Wachen in einem unserer Versorgungsdepots überrannt und für die Front bestimmtes Material gestohlen."
BICE_dissent_events.07.a:0	"Okay"

BICE_dissent_events.08.desc:0	"Die öffentliche Unzufriedenheit mit der Heimatfront hat einen Siedepunkt erreicht. Erst heute hat eine Detonation in einer Militäreinrichtung erheblichen Schaden angerichtet. Vorläufige Untersuchungen deuten darauf hin, dass es sich um einen terroristischen Anschlag von Kriegsgegnern handelt."

BICE_dissent_events.09.desc:0	"Aus Verzweiflung über die Grundversorgung und aus Unzufriedenheit über den Krieg hat ein Mob von Zivilisten die Wachen eines Kohlelagers überrannt und große Mengen des wertvollen Rohstoffs erbeutet. Dies hat zu Lieferengpässen geführt und könnte uns zu einer Rationierung der Energie zwingen."
BICE_dissent_events.09.a:0	"Okay"

BICE_dissent_events.10.desc:0	"Mit der zunehmenden Verantwortung und Macht der Polizei in diesem Krieg nutzen immer mehr Mitglieder der Polizei ihre Machtposition gegenüber der Bevölkerung aus. Bestechung, Erpressung und Erpressung nehmen immer mehr überhand."

BICE_dissent_events.12.b:0	"Eine Lösung aushandeln"
BICE_dissent_events.13.desc:0	"Gridlock-Verhandlung scheitert"
BICE_dissent_events.14.t:0	"Gridlock-Verhandlung Erfolgreich"
BICE_dissent_events.14.a:0	"Ah, ja. Der Verhandlungsführer."
BICE_dissent_events.15.t:0	"Kundgebung der Eisernen Garde"
BICE_dissent_events.15.desc:0	"Die Polizei wurde heute zu einem Ausbruch von Gewalt auf den Straßen gerufen, der von Mitgliedern der Eisernen Garde angezettelt worden war. Die Gruppe hat sich offen für einen revolutionären Wandel im Namen einer geistigen Wiederbelebung Rumäniens ausgesprochen. Sie sind fest entschlossen, ihre Präsenz überall bekannt zu machen, mit Worten, Fäusten und Pistolen."
BICE_dissent_events.15.a:0	"Zum Teufel mit diesen Radikalen"
BICE_dissent_events.16.t:0	"Zusammenstöße auf der Straße"
BICE_dissent_events.16.desc:0	"Radikale Teile der Bevölkerung sind in den Straßen der Großstädte aneinandergeraten. Die Proteste zogen Gegendemonstranten an, was zu Schlägereien und Ausschreitungen zwischen den verschiedenen Gruppen führte."
BICE_dissent_events.16.a:0	"Verdammt seien diese Radikalen"
BICE_dissent_events.17.t:0	"Militärischer Offizier kritisiert Kriegsführung"
BICE_dissent_events.17.desc:0	"Beschreibung für einen beliebigen Offizier, der den Krieg kritisiert"
BICE_dissent_events.17.a:0	"Degradieren Sie ihn"
BICE_dissent_events.17.b:0	"Feuern Sie ihn"
BICE_dissent_events.18.t:0	"Waffen der Oppositionsgruppe entdeckt"
BICE_dissent_events.18.a:0	"Für wen schmuggelt er?"
BICE_dissent_events.19.t:0	"Oppositionswaffen aufgespürt"
BICE_dissent_events.20.t:0	"Oppositionsverschwörer verhaftet"
BICE_dissent_events.20.a:0	"Wir haben diese Ratten!"
BICE_dissent_events.21.t:0	"Oppositionsverschwörer entkommen"
BICE_dissent_events.21.desc:0	"Die [rising_opposition_ideology_descriptor]-Verschwörer sind geflohen."
BICE_dissent_events.21.a:0	"Verfolge sie weiter"
BICE_dissent_events.21.b:0	"Verfolgen Sie sie nicht weiter"
reassign_corrupt_politician_risk:0	"Korruption nicht zu bestrafen, könnte zu mehr ermutigen..."

BICE_dissent_events.22.desc:0	"Unsere Klage gegen diesen skandalösen Autor wurde gewonnen! Dadurch, dass wir ihn als den aufmerksamkeitsheischenden Panikmacher entlarven, der er ist, wird er es sich sicher zweimal überlegen, bevor er die Regierung erneut kritisiert."
BICE_dissent_events.22.a:0	"Okay"
BICE_dissent_events.23.desc:0	"Die Verteidigung des Autors hat sich als grundsolide erwiesen. Ihre Klagen gegen die Regierung haben ein noch größeres Publikum erreicht, da sie einen Tummelplatz gefunden haben. Durch ihren Sieg hat unsere Regierung ein schlechteres Image."
BICE_dissent_events.24.t:0	"Parlamentarischer Skandal"
BICE_dissent_events.27.t:0	"Aufruhr in der Rüstungsindustrie"
BICE_dissent_events.27.desc:0	"Unser Versuch, den Streik zu brechen, hat leider dazu geführt, dass sich die Situation zu einem ausgewachsenen Aufstand der Arbeiter ausgeweitet hat."
BICE_dissent_events.28.t:0	"Aufruhr in der Marineindustrie"
BICE_dissent_events.29.t:0	"Erfolgreiche Verteidigung"
BICE_dissent_events.29.desc:0	"Der Vorfall ist zum Glück glimpflich ausgegangen. Der kleinste Ausrutscher kann sich zu einem Massenskandal auswachsen."
BICE_dissent_events.30.t:0	"Erfolglose Verteidigung"

BICE_dissent_events.32.b:0	"Ignorieren Sie ihn"
BICE_dissent_events.33.a:0	"Okay"
BICE_dissent_events.34.desc:0	"Es hat sich herausgestellt, dass die Rhetorik dieses Politikers nur aufmerksamkeitsheischende heiße Luft war. Der Enthusiasmus, den er angeblich ausgelöst hat, ist verpufft, und unsere Unterstützung für ihn war vielleicht reine Zeitverschwendung."
BICE_dissent_events.35.t:0	"Fauxpas des Brandstifters"
BICE_dissent_events.35.desc:0	"Dieser turbulente Politiker hat sich dazu hinreißen lassen, sich oppositionellen Gruppen anzuschließen."
BICE_dissent_events.35.a:0	"Okay"
BICE_dissent_events.36.t:0	"Anti-Wehrpflicht-Protest"
BICE_dissent_events.36.desc:0	"Die Idee einer Zwangseinberufung scheint einigen unserer Bürger nicht zu gefallen.  Einige kleinere Gruppen haben bereits einen Generalstreik organisiert, der in besorgniserregendem Tempo neue Anhänger findet.  Am besten wäre es, die Anführer des Streiks so bald wie möglich zu verhaften, um eine weitere Eskalation der Proteste zu verhindern."
BICE_dissent_events.36.a:0	"Okay"
BICE_dissent_events.37.t:0	"Leck in der Regierung"
BICE_dissent_events.37.desc:0	"Wir haben Grund zu der Annahme, dass jemand innerhalb der Regierung sensible Informationen weitergegeben hat.  Es gab in letzter Zeit zu viele Situationen, in denen unsere Feinde ein wenig zu gut vorbereitet schienen, als dass es sich um einen Zufall handeln könnte.  Eine vorläufige Untersuchung ist bereits im Gange, aber bisher wurde noch nichts gefunden, was etwas beweisen könnte."
BICE_dissent_events.37.a:0	"Es ist wahrscheinlich nichts"
BICE_dissent_events.37.b:0	"Verstärken Sie unsere Bemühungen"
BICE_dissent_events.38.t:0	"Minister kooperiert mit revolutionären Bewegungen"
BICE_dissent_events.38.b:0	"Verstärken Sie unsere Bemühungen"
BICE_romania_factions.03.desc:0	"Die Operation zur Festnahme der Anführer der [GetIronGuardName] war erfolgreich. Beim Einbruch in ihr geheimes Treffen wurden die Faschisten überrumpelt und mit erhobenen Händen abtransportiert. Mehrere wichtige Persönlichkeiten wurden verhaftet, was ein schwerer Schlag für die Organisation ist."
BICE_romania_factions.03.a:0	"Sie werden keinen Ärger mehr machen können!"
BICE_romania_factions.04.a:1	"Ein enttäuschendes Ergebnis..."
BICE_romania_factions.05.desc:1	"Die Operation zur Verhaftung der Anführer der [GetIronGuardName] war ein völliger Fehlschlag. Die Polizeikräfte drangen in ein geheimes Treffen ein, aber die Agenten, die zahlenmäßig weit unterlegen waren, schafften es nicht, die Teilnehmer zu überwältigen, die schnell vom Ort flohen und von der Polizei verfolgt wurden, was zu einer gewalttätigen Konfrontation in den Straßen der Stadt führte und viele unschuldige Bürger verletzte. Angesichts dieser Brutalität der Polizei konnten viele Zivilisten in der Gegend nicht anders, als mit den Faschisten zu sympathisieren, indem sie Mitgliedern der Organisation bei der Flucht halfen und sich sogar dem Kampf gegen die Regierungstruppen anschlossen."
BICE_romania_factions.05.a:1	"Jemand muss für dieses Versagen bezahlen!"
BICE_romania_factions.06.t:0	"Aufgedecktes faschistisches Komplott"
 
BICE_romania_factions.06.a:0	"Untersuchen Sie weiter!"
BICE_romania_factions.06.b:0	"Warten wir darauf, dass sie einen Zug machen..."
BICE_romania_factions.07.t:0	"Faschistischer Verschwörer entlarvt"
BICE_romania_factions.07.a:0	"Beseitigen Sie ihn sofort!"
BICE_romania_factions.07.b:0	"Wir sollten keine voreiligen Schlüsse ziehen."
BICE_romania_factions.08.desc:1	"Wir sind erfolgreich gegen die [GetIronGuardName] vorgegangen und haben Mitglieder verhaftet, die sich öffentlich gegen [ROOt.GetLeader] geäußert oder sich sogar zum Sturz der Regierung verschworen haben sollen."
BICE_romania_factions.09.t:1	"Faschisten unterdrückt"
BICE_romania_factions.13.t:0	"Arbeiterstreiks"
BICE_romania_factions.13.desc:1	"Die Mitglieder der [GetIronGuardName]-Fraktion haben landesweite Streiks unter den Industriearbeitern angezettelt. Durch geheime Versammlungen und Treffen ist es ihnen gelungen, große Unterstützung und Sympathie unter dem Proletariat zu gewinnen.\nWir müssen bei der Durchsetzung der Ordnung in den Regionen, in denen diese Streikenden am beliebtesten sind, mit Vorsicht vorgehen, damit die Situation nicht zu etwas Schlimmerem als bloßen Streiks eskaliert..."
BICE_romania_factions.13.b:1	"Wir müssen sie um jeden Preis unterdrücken!"
BICE_romania_factions.14.a:0	"Ein unglücklicher Ausgang..."
strikes_no_military_factories_damaged:0	" während mehrere kommunistische Gruppen versuchten, unsere Waffenproduktion zu gefährden, indem sie die militärischen Einrichtungen des Staates sabotierten"
strikes_military_factories_damaged_other_state:0	". In [?ROOT.damaged_mils_state.GetName] versuchten mehrere Gruppen, unsere Waffenproduktion durch Sabotage von Militäreinrichtungen zu gefährden."
BICE_romania_factions.15.desc:1	"Die [GetIronGuardName] führt illegal eine Propagandakampagne in den ländlichen Gebieten des Landes durch, wo Tausende von Landwirten manipuliert werden, um der Regierung zu misstrauen und sich ihren Reihen anzuschließen.\nDie [GetIronGuardName] kritisieren vor allem unsere vergangene Politik und bemühen sich, leichte Ähnlichkeiten mit der der aktuellen Regierung zu finden, um Unzufriedenheit und Unsicherheit in der Bevölkerung zu erzeugen."
BICE_romania_factions.17.a:0	"Was um alles in der Welt ist hier los?"
BICE_romania_factions.18.a:0	"Schickt die Armee, um diesen Wahnsinn zu beenden!"
BICE_romania_factions.19.desc:0	"Nach tagelangen Zusammenstößen zwischen dem Militär und den Legionärs-Milizen wurde die Hauptstadt von den staatlichen Sicherheitskräften gesichert und die Aufständischen entweder zerstreut oder inhaftiert. Die Legionärsbewegung hat sich als ungeeignet erwiesen, Rumänien zu führen, da ihr Radikalismus nur zu Chaos und Selbstverbrennung führt. Ihre Regierung wurde zwar aufgelöst, doch die Bemühungen, sie aus dem ganzen Land zu vertreiben, dauern an.\nNachdem die radikalen Elemente endlich beseitigt sind, können wir die Nation unbehelligt durch die bevorstehenden Prüfungen führen."
BICE_romania_factions.19.tt:0	"§YThe [GetIronGuardName] is Crushed§!" "Die Unruhen der Legionäre eskalieren"
BICE_romania_factions.20.t:0	"Die Unruhen der Legionäre eskalieren"
BICE_romania_factions.20.desc:0	"Während sich der König trotzig gegen die legionären Demonstranten stellt, wurden bewaffnete Gruppen auf den Straßen gesichtet. Regierungsbüros wurden belagert und Straßensperren errichtet, während die Männer den Sturz des Königs forderten."
BICE_romania_factions.20.a:0	"Schickt die Armee, um das zu verhindern!"
BICE_romania_factions.21.t:0	"Soldaten laufen zur Eisernen Garde über!"
BICE_romania_factions.21.desc:0	"Es wurden Soldaten der Armee unter den Aufständischen der Garde gesichtet, darunter auch solche, die zur Niederschlagung des Aufstands geschickt wurden. Berichte aus der Hauptstadt bestätigen, dass ein Großteil des Militärs nicht gewillt ist, die Legion zu bekämpfen, und die Beschwerden gegen die Führung des Landes teilt."
BICE_romania_factions.21.a:0	"Keine Verbündeten mehr?"
BICE_romania_factions.22.t:0	"Legionäre stürmen das Parlament!"
BICE_romania_factions.22.desc:0	"Mit Unterstützung der Armee ist die Eiserne Garde in das Parlamentsgebäude eingedrungen, und es kommt zu Zusammenstößen mit den Rebellen, die sich dem Königspalast nähern. Da die Königliche Garde einen Fluchtkorridor besetzt hält, ist der König scheinbar aus Bukarest geflohen und die Legion hat die Kontrolle über die Regierung übernommen."
BICE_romania_factions.22.a:0	"Die Revolution ist endlich da"

politics.2.t:0	"Die Opposition marschiert!"
politics.2.a:0	"Verdammte Kommunisten!"
politics.2.b:0	"Verdammte Faschisten!"
politics.3.t:0	"Außenminister macht einen diplomatischen Fauxpas"
politics.3.a:0	"Sie müssen gehen!"
politics.3.b:0	"Wir stehen zu ihnen"
politics.3.c:0	"Vielleicht wird das Problem verschwinden, wenn wir es ignorieren"
politics.4.desc:0	"Es kann keine andere Erklärung geben. Informationen sickern direkt aus dem Büro des Geheimdienstministers durch.\n Wieder einmal ist die Anwerbung eines hochrangigen ausländischen Diplomaten für unsere Sache gescheitert, weil er auf mysteriöse Weise verschwunden ist.\n Ist der Minister einfach nur inkompetent? Oder haben wir es vielleicht sogar mit Verrat zu tun? Wie auch immer, es muss eine Entscheidung getroffen werden!"
politics.5.t:0	"Korruption im Innenministerium aufgedeckt"
politics.5.desc:0	"Es ist bekannt, dass unser Innenminister schöne Autos und Luxusartikel mag.\n Leider ist jetzt auch bekannt, dass er nicht nur sein eigenes Geld, sondern auch Geld des Staates verwendet, um diese und andere Dinge zu finanzieren. Dieser Narr - wir hatten ihm zu verstehen gegeben, dass er vorsichtiger sein sollte!\n Der Schaden ist bereits erheblich und kann durch unsere Entscheidung nur noch vergrößert oder vielleicht sogar verringert werden. Sollen wir sie entlassen? Es ist nicht unbedingt einfach, einen Nachfolger zu finden. Vielleicht halten wir also doch zu ihm? Vielleicht gerät die Angelegenheit in Vergessenheit, wenn wir sie ignorieren."
politics.6.desc:0	"Unser Minister für wichtige innenpolitische Fragen ist ein Mensch der Politik. Er liebt sie und kann nicht genug davon einführen. Jetzt hat er es wieder übertrieben und mit seinen jüngsten Richtlinien eine regelrechte Protestwelle ausgelöst.\n Der Schaden ist beträchtlich und wir sind gezwungen, eine Entscheidung zu treffen, wie es weitergehen soll. Wenn wir den Minister entlassen, kann das unvorhersehbare Folgen haben - genauso wie das Festhalten an ihm oder sogar das Ignorieren der Situation."
politics.7.t:0	"Propagandaminister verpatzt Grundsatzrede"
politics.8.t:0	"Putschversuch!"
politics.9.t:0	"Wirtschaftsberater misshandeln Eisenbahnen"

politics.14.a:0	"Schicken Sie die Polizei zum "Gespräch" mit den Gewerkschaftsbossen"
politics.14.b:0	"Schickt die Polizei, um die Fabriken zu kontrollieren"
politics.14.d:0	"Diskutiert ihre Gier"
politics.15.a:0	"Lasst die Öffentlichkeit wissen, dass [Root.GetLeader] stärker denn je ist!"
politics.15.b:0	"Lasst sie im Unklaren"
politics.16.desc:0	"General [event_target:target_wounded.name] wurde heute von einem feindlichen Agenten angegriffen, der bei dem Versuch getötet wurde. Dass jemand dem General so nahe gekommen ist, ist natürlich schockierend und könnte, wenn es bekannt würde, andere Offiziere und die Soldaten selbst verunsichern.\n Andererseits könnte es aber auch zu Solidarität und höherer Moral führen. Wie sollten wir uns verhalten?"
politics.17.desc:0	"Leider hat die jüngste Unruhe in der Bevölkerung nun auch politische Konsequenzen. Unsere Opposition hat sich die Situation zunutze gemacht und baut ihren Einfluss aktiv aus. Parteibüros schießen wie Pilze aus dem Boden und wir stehen vor einer Situation, die bestenfalls ungünstig ist."
politics.18.desc:0	"In der Bevölkerung wächst die Kritik an unserem politischen Programm. Unsere so genannte Ideenlosigkeit sorgt für einen stetigen Zustrom von Alternativangeboten.\n Unsere politischen Gegner rekrutieren daher auf Versammlungen und Treffen neue Mitglieder und organisieren sich immer besser.\n Wenn wir nichts tun, gefährden wir über kurz oder lang unsere parlamentarische Mehrheit!"
politics.19.desc:0	"Wann immer die Zeiten in der Zukunft schwierig sind, können wir auf heute zurückblicken und uns daran erinnern, dass auch unsere Feinde fehlbar sind. Eine der größten Zeitungen des Landes hat gerade einen vernichtenden Artikel veröffentlicht, in dem das skandalöse Verhalten eines der populärsten Oppositionsführer geschildert wird! Sicherlich gab es schon vorher Gerüchte, aber jetzt werden die Beweise sie in die Bedeutungslosigkeit verdammen, und hoffentlich auch ihre heimtückische Partei! Mögen sie sich von diesem Schlag nie mehr erholen!"
politics.21.t:0	"Die Öffentlichkeit applaudiert unserem Minister!"
politics.21.a:0	"Machen Sie weiter so!"
politics.22.t:0	"Nationale Einheit ändert sich"
politics.22.desc:0	"Die Stimmung in unserem Land ändert sich, zum Guten oder zum Schlechten."
politics.22.a:0	"Unser Land beginnt sich zu spalten..."
politics.22.b:0	"Unser Land ist im Chaos versunken!"
politics.22.c:0	"Unsere Nation reißt sich selbst auseinander!"
politics.23.t:0	"Nationale Einheit ändert sich"
politics.23.desc:0	"Die Stimmung in unserer Nation ändert sich, zum Guten oder zum Schlechten."
politics.23.a:0	"Unsere Nation hat ihre Wunden geheilt!"
politics.23.b:0	"Unsere Nation ist ins Chaos gestürzt!"
politics.23.c:0	"Unsere Nation reißt sich selbst auseinander!"
politics.24.a:0	"Unsere Nation hat ihre Wunden geheilt!"
politics.24.c:0	"Unsere Nation reißt sich selbst auseinander!"
politics.25.t:0	"Nationale Einheit ändert sich"
politics.25.b:0	"Unsere Nation heilt, ist aber immer noch gespalten."
politics.26.t:0	"Regierungsskandal!"
politics.26.desc:0	"Schreckliche Nachrichten! Einer unserer hochrangigen Minister ist in einen unglaublichen Skandal verwickelt, der vor Korruption und Machtmissbrauch nur so trieft. Das Volk darf unserer Partei nie wieder vertrauen!"
politics.26.a:0	"Die Korruption in der Politik kennt keine Grenzen."
politics.30.t:0	"Umfragebericht"
politics.30.desc:0	"Die Popularität unserer Partei hat einen erheblichen Einfluss darauf, was wir tun können, wenn wir an der Macht sind. Wenn die Menschen hinter uns stehen, gibt es nichts, was wir nicht tun können. Ohne sie ... scheint die ganze Welt gegen uns zu sein."
politics.30.a:0	"Das Mandat des Volkes"
politics.31.t:0	"Die Opposition macht sich das zunutze!"
politics.31.desc:0	"Aufgrund unseres Mangels an politischer Macht hat die große Oppositionspartei trotz unserer Proteste ein umfangreiches Paket von Gesetzen und Vorschriften durchgesetzt! Wir sollten vorsichtiger sein, wenn wir unsere politische Macht mit solch populären Gruppierungen in unserer Mitte ausgeben."
politics.32.t:0	"Unterdrückung der Opposition"
politics.32.a:0	"Nichts tun"
politics.34.a:0	"Nehmt diese Verräter fest und werft den Schlüssel weg!"
politics.35.t:0	"Ermittlungen: Fehlschlag!"
politics.35.a:0	"Eine peinliche Vorstellung für unsere Sicherheitskräfte..."
politics.36.a:0	"Wir können uns nicht noch mehr solcher Zusammenbrüche leisten!"
politics.37.t:0	"Der Oppositionsführer antwortet!"
politics.37.a:0	"Er ist der Fluch unserer Existenz!"
politics.39.t:0	"Nachwirkungen des Putsches"
politics.40.t:0	"Das Kabinett neu besetzen"
politics.41.t:0	"Schwächung des Mandats!"
politics.41.a:0	"Wir müssen das Vertrauen des Volkes zurückgewinnen!"
politics.42.desc:0	"Aus Wut über ihre Arbeitsbedingungen und Löhne haben Fabrik- und Werftarbeiter im ganzen Land ihre Arbeit niedergelegt und mit dem Streik begonnen! Wir könnten sie einfach abwarten, aber unsere Produktion würde in der Zwischenzeit ernsthaft darunter leiden. Wir könnten die Polizei einschalten und den Streik auflösen, aber das könnte zu erheblichen Gegenreaktionen führen, die sich zu etwas viel Schlimmerem entwickeln könnten. Und schließlich könnten wir ihren Forderungen nachgeben, was langfristig unsere industrielle Produktion verringern würde. Wir müssen auch bedenken, wie dies in unserem Land wahrgenommen werden wird, wobei die Rechten härtere Maßnahmen und die Linken Zugeständnisse bevorzugen. Was sollten wir tun?"
politics.42.a:0	"Warten Sie sie ab!"
politics.42.b:0	"Sie brechen!"
politics.42.c:0	"Auf ihre Forderungen eingehen..."
politics.43.t:0	"Generalstreik beendet"
politics.43.desc:0	"Nach mehreren zermürbenden Monaten, in denen wir wertvolle Kriegsproduktion verloren haben, haben die Streikenden endlich gebrochen und sind zur Arbeit zurückgekehrt. Hoffen wir, dass dies nicht so bald wieder geschieht!"
politics.43.a:0	"Endlich!"
politics.44.t:0	"Streikvereinbarungen enden"
politics.44.desc:0	"Diese Vereinbarungen sind endlich ausgelaufen."
politics.44.a:0	"OK"
politics.51.t:0	"Heydrich ermordet!"
politics.52.t:0	"Heydrich überlebt das Attentat!"
politics.52.a:0	"Wer würde einen solchen Anschlag wagen?!"
politics.54.t:0	"Admiral Yamamoto tot!"
politics.55.t:0	"Admiral Yamamoto überlebt!"
politics.55.a:0	"Wussten sie, dass er in dem Flugzeug war?"
politics.56.t:0	"Operation Walküre!"
politics.56.desc:0	"Stürzt den Führer!"
politics.57.t:0	"Der Führer ist tot!" 
politics.57.desc:0	"Eine schlimme Nachricht! Mörderische Verräter haben eine Bombe neben unserem großen Führer gezündet und ihn dabei getötet! Was ist geschehen?!"
politics.57.a:0	"Wir müssen die Kontrolle zurückgewinnen!"
politics.58.desc:0	"Beunruhigende Nachrichten! Verräter haben heute während eines hochrangigen Treffens versucht, ein Attentat auf den Führer zu verüben! Glücklicherweise hat die Bombe unseren großen Führer nur verletzt. Wir müssen herausfinden, wer dafür verantwortlich ist!"
politics.58.a:0	"Wir müssen die Kontrolle wiedererlangen!"
politics.59.desc:0	"Dieser eingehende Bericht zeigt die Folgen des Bombenanschlags. Ist einer unserer anderen Anführer bei der Explosion ums Leben gekommen?"
politics.60.t:0	"Operation Walküre!"
politics.64.t:0	"Valkyrie: Historisch"
politics.64.desc:0	"Wir haben die heimtückischen Verräter besiegt, die es gewagt haben, uns zu stürzen! Ihre Unfähigkeit und Feigheit besiegelten ihr Schicksal mit diesem verunglückten Putschversuch. Für diese schwere Beleidigung werden sie in der Hölle büßen müssen!"
politics.65.t:0	"Walküre Repressalien Ende"
politics.66.t:0	"Walküre-Effekte klingen ab"
politics.66.desc:0	"Nach der langen Säuberung des Nazi-Apparats kehren die Dinge endlich zur Normalität zurück. Die Nation wird noch eine ganze Weile brauchen, um sich zu erholen, aber wir können jetzt wieder normal regieren."
politics.70.t:0	"Königliche Wiederherstellung"
politics.70.c:0	"Wir müssen mit einer starken Legislative koexistieren."
politics.71.b:0	"Absolute Monarchien gehören in den Mülleimer der Geschichte."
politics.72.a:0	"Wir müssen die Befugnisse an die Legislative abtreten."
politics.69.t:0	"General Balbo ist tot!"
politics.69.a:0	"Diese Dummköpfe!"
politics.75.t:0	"General Balbo überlebt den Unfall!"
politics.75.desc:0	"Auf einem Routineflug nach Tobruk wurde das Flugzeug von General Balbo bei seinem Landeversuch von eigenen Truppen beschossen.  Das Flugzeug schaffte eine Bruchlandung, bei der drei der Passagiere an Bord ums Leben kamen.  Der Augenzeuge General Felice Porro berichtet, dass der Unfall dadurch verursacht wurde, dass der Kreuzer San Giorgio das Flugzeug fälschlicherweise für ein britisches Kampfflugzeug hielt, da kurz vor dem Landeanflug von General Balbo ein schwerer Angriff beendet worden war.  General Balbo wurde nicht schwer verletzt, schwor aber, die Verantwortlichen für den Vorfall zu bestrafen."
politics.75.a:0	"Eine knappe Sache..."
politics.200.t:0	"General Wever stürzt ab!"
politics.200.desc:0	"Aufgrund mangelnder Wartung ist das Flugzeug von General Wever abgestürzt! Vielleicht überlebt er seine Verletzungen noch..."
politics.200.a:0	"Wir hoffen, er überlebt!"
politics.201.t:0	"Todt's Flugzeug stürzt ab!"
politics.201.desc:0	"Aufgrund mangelnder Wartung ist das Flugzeug von Minister Todt abgestürzt! Vielleicht überlebt er seine Verletzungen noch..."
politics.202.t:0	"Die Beck-Frage"
politics.202.desc:0	"Aufgrund unserer aggressiven Außenpolitik und des Aufrüstungsprogramms spricht sich General Ludwig Beck gegen die Pläne des Führers aus. Ein so hochrangiger militärischer Führer ist eine mächtige Stimme gegen uns, können wir es zulassen, dass dieser Mann den Aufstieg Deutschlands behindert?"
politics.203.t:0	"Die Halder-Frage"
politics.203.a:0	"Er muss entfernt werden."
politics.203.c:0	"Er mag ein Ärgernis sein, aber er ist zu wertvoll."
politics.204.a:0	"Er muss entfernt werden."
politics.205.t:0	"Admiral Raeder gefeuert"
politics.205.desc:0	"Sehr gut."
politics.205.a:0	"Sehr gut."
politics.206.t:0	"KI installiert Schaposchnikow"
politics.207.t:0	"Die Entlassung von Neurath"
politics.207.desc:0	"Als Reaktion auf die auf der Hossbach-Konferenz geäußerten Vorbehalte verschärft Hitler seine Kontrolle über den militärisch-außenpolitischen Apparat, indem er diejenigen, die nicht mit seiner Politik übereinstimmen, entlässt. Am 4. Februar 1938 wurde Neurath im Zuge der Blomberg-Fritsch-Affäre als Außenminister entlassen. Er fühlte sich in seinem Amt an den Rand gedrängt und befürwortete Hitlers aggressive Kriegspläne nicht, weil er der Meinung war, dass Deutschland mehr Zeit für die Wiederaufrüstung benötigte, die im Hossbach-Memorandum vom 5. November 1937 dargelegt wurde. Sein Nachfolger wurde Joachim von Ribbentrop, der jedoch als Minister ohne Geschäftsbereich in der Regierung blieb, um die Bedenken zu zerstreuen, die seine Absetzung international ausgelöst hätte. Außerdem wurde er zum Vorsitzenden des "Geheimen Kabinettsrats" ernannt, eines angeblichen Superkabinetts, das Hitler in außenpolitischen Fragen beraten sollte. Auf dem Papier sah es so aus, als ob Neurath befördert worden wäre. Dieses Gremium existierte jedoch nur auf dem Papier."
politics.207.c:0	"Er mag ein Ärgernis sein, aber er ist zu wertvoll."
politics.213.t:0	"General Craig geht in den Ruhestand"
politics.213.a:0	"Bleiben Sie ihm treu"
politics.214.t:0	"General Westover stürzt ab!"
politics.218.b:0	"Behalten Sie ihn in der Nähe"
politics.218.t:0	"Ellington geht in den Ruhestand"
politics.219.b:0	"Behalten Sie ihn"
politics.221.a:0	"Behalten Sie ihn hier"
politics.221.b:0	"Wir wünschen ihm einen schönen Ruhestand!"
politics.222.a:0	"Behalten Sie ihn in Ihrer Nähe"
politics.223.b:0	"Wir wünschen ihm einen angenehmen Ruhestand!"
politics.224.b:0	"Wir wünschen ihm einen angenehmen Ruhestand!"
politics.225.a:0	"Behalten Sie ihn bei sich"
politics.226.t:0	"Dill gefeuert"
politics.226.a:0	"Behalten Sie ihn"
politics.226.b:0	"Wir wünschen ihm einen angenehmen Ruhestand!"
politics.227.t:0	"Wirtschaftliche Zukunft Deutschlands"
politics.227.desc:0	"Unser Wirtschaftsminister, der berühmte Hjalmar Schacht, hat in letzter Zeit den Wirtschaftsplan von Herrn Göring ernsthaft kritisiert und gesagt, dass Deutschland wahrscheinlich bankrott sein wird, wenn der Plan noch länger fortgesetzt wird. Obwohl Herr Schacht ein hervorragender Wirtschaftsexperte ist, könnte seine Kritik unserem Ansehen und unserer Autorität sehr schaden, zumal sie das Wirtschaftsprogramm von Herrn Göring unterbrechen würde. Sollten wir ihn entfernen?"
politics.227.a:0	"Er muss entfernt werden."
politics.227.b:0	"Er muss entfernt werden."
politics.227.c:0	"Sein Fachwissen ist zu wertvoll, um es jetzt zu verlieren."
politics.228.t:0	"Prinz Kotohito geht in den Ruhestand"
politics.228.a:0	"Wir wünschen ihm einen schönen Ruhestand!"
politics.228.b:0	"Sein Fachwissen ist zu wertvoll, um es jetzt zu verlieren."
politics.229.t:0	"Prinz Hiroyasu verlässt uns"
politics.229.a:0	"Wir wünschen ihm einen angenehmen Ruhestand!"
politics.229.b:0	"Sein Fachwissen ist zu wertvoll, um es jetzt zu verlieren."
politics.230.b:0	"Behaltet ihn in der Nähe"
politics.300.d.a:0	"Unser Geheimdienst hat eine rege Aktivität bestimmter faschistischer Gruppen in unserem Land festgestellt. Ihre Kundgebungen sind größer geworden, ihre Propaganda hat sich sprunghaft verbessert, und ihre Zahl steigt ins Unermessliche. Dieser plötzliche Zustrom von Vertrauen und Ressourcen ist äußerst seltsam und veranlasst unsere Agenten, die Möglichkeit in Betracht zu ziehen, dass eine ausländische Macht diese Gruppen jetzt gegen unsere Regierung unterstützt! Vielleicht ist das alles nur Geld- und Zeitverschwendung seitens unseres ausländischen Gegners, und es könnte sich für uns als ebenso verschwenderisch erweisen, ernsthafte Anstrengungen zu seiner Bekämpfung zu unternehmen. Aber es könnte sich auch als der Untergang unserer Regierung und möglicherweise unseres Landes erweisen, wenn wir zulassen, dass dieser Umsturz weitergeht."
politics.300.d.b:0	"Unser Geheimdienst hat eine rege Aktivität bestimmter monarchistischer Gruppen in unserem Land festgestellt. Ihre Kundgebungen sind größer geworden, ihre Propaganda hat sich sprunghaft verbessert, und ihre Zahl steigt ins Unermessliche. Dieser plötzliche Zustrom von Vertrauen und Ressourcen ist äußerst merkwürdig und veranlasst unsere Agenten, die Möglichkeit in Betracht zu ziehen, dass eine ausländische Macht diese Gruppen gegen unsere Regierung unterstützt! Vielleicht ist das alles nur Geld- und Zeitverschwendung seitens unseres ausländischen Gegners, und es könnte sich für uns als ebenso verschwenderisch erweisen, ernsthafte Anstrengungen zu seiner Bekämpfung zu unternehmen. Aber es könnte sich auch als der Untergang unserer Regierung und möglicherweise unseres Landes erweisen, wenn wir zulassen, dass dieser Umsturz weitergeht."
politics.300.d.e:0	"Unser Geheimdienst hat eine rege Aktivität bestimmter liberaler Gruppen in unserem Land festgestellt. Ihre Kundgebungen sind größer geworden, ihre Propaganda hat sich sprunghaft verbessert, und ihre Zahl steigt ins Unermessliche. Dieser plötzliche Zustrom von Vertrauen und Ressourcen ist äußerst merkwürdig und veranlasst unsere Agenten, die Möglichkeit in Betracht zu ziehen, dass eine ausländische Macht diese Gruppen jetzt gegen unsere Regierung unterstützt! Vielleicht ist das alles nur Geld- und Zeitverschwendung seitens unseres ausländischen Gegners, und es könnte sich für uns als ebenso verschwenderisch erweisen, ernsthafte Anstrengungen zur Bekämpfung dieser Gruppen zu unternehmen. Aber es könnte sich auch als der Untergang unserer Regierung und möglicherweise unseres Landes erweisen, wenn wir zulassen, dass dieser Umsturz weitergeht."
politics.300.d.g:0	"Unser Geheimdienst hat eine rege Aktivität bestimmter konservativer Gruppen in unserem Land festgestellt. Ihre Kundgebungen sind größer geworden, ihre Propaganda hat sich sprunghaft verbessert, und ihre Zahl steigt ins Unermessliche. Dieser plötzliche Zustrom von Vertrauen und Ressourcen ist äußerst merkwürdig und veranlasst unsere Agenten, die Möglichkeit in Betracht zu ziehen, dass eine ausländische Macht diese Gruppen jetzt gegen unsere Regierung unterstützt! Vielleicht ist das alles nur Geld- und Zeitverschwendung seitens unseres ausländischen Gegners, und es könnte sich für uns als ebenso verschwenderisch erweisen, ernsthafte Anstrengungen zur Bekämpfung dieser Gruppen zu unternehmen. Aber es könnte sich auch als der Untergang unserer Regierung und möglicherweise unseres Landes erweisen, wenn wir diesen Umsturz weiter zulassen würden."
politics.300.a:0	"Wir werden es vorerst zulassen"
politics.300.b:0	"Wir müssen dieses Krebsgeschwür beseitigen, bevor es noch größer wird!"
politics.302.desc:0	"Wir haben mehrere Möglichkeiten, diese ausländischen Agenten zu bekämpfen, die jeweils unterschiedliche Vor- und Nachteile mit sich bringen. Erstens könnten wir eine massive Propagandakampagne starten. Reden, Kundgebungen, Flugblätter, Weißbücher und alles andere, was uns einfällt. Mit unserer gesamten Regierung und Partei im Rücken können wir ihre Botschaften überwältigen. Dies ist zwar die am wenigsten aufwändige Option, aber vielleicht auch die langsamste und am wenigsten effektive. \n\nZweitens können wir versuchen, diese Spione und Verräter zu verhaften. Indem wir ihre Anführer und andere wichtige Agenten festnehmen, wird ihre Bewegung unwiederbringlich lahmgelegt. Dies könnte sich als wirksamer erweisen als eine einfache Propagandakampagne, ohne das Land zu zerreißen. Allerdings könnte sich ihre bloße Verhaftung als zu langsam erweisen. Wir könnten sie auch einfach aus unserem Land entfernen, um den ausländischen Teufeln eine Botschaft zu senden. Dies wäre eine brutale und teure Strategie, die sich aber als die schnellste erweisen könnte."
politics.302.a:0	"Wir werden sie in unserer Propaganda ertränken!"
politics.302.b:0	"Nehmt sie fest!"
politics.305.t:0	"Ausländische Einflussnahme: Erfolgreich!"
politics.305.desc:0	"Gute Nachrichten! Trotz aller Bemühungen unserer Feinde im Ausland haben wir ihre Versuche, Einfluss auf unsere große Nation zu nehmen, zunichte gemacht! Es war zwar ein langer und kostspieliger Kampf, aber unsere Regierung und die Zukunft unseres Landes sind vor ausländischen Eindringlingen sicher."
politics.306.t:0	"Ausländische Beeinflussung: Minister gewechselt"
politics.306.a:0	"Mögen sie sich als so effektiv erweisen wie angekündigt."
political.30.t:0	"Monarchismus auf dem Vormarsch"
political.30.desc:0	"Die Idee einer Monarchie in [Root.GetName] ist nie wirklich gestorben, egal wie lange es her sein mag. Royalisten hat es immer gegeben und wird es wahrscheinlich auch immer geben, aber in diesem Jahr scheint alles anders zu sein. Es gibt eine neue Energie innerhalb der royalistischen Bewegung, eine, die diese Ideologie aus dem Schatten in den politischen Mainstream bringen könnte. \n\nDie Frage bleibt: Ist das [Root.GetAdjective] Volk bereit für den Monarchismus?"
political.30.a.tt:0	"Das erhöht die Chance auf interne Unterstützung für einen monarchistischen Staatsstreich."
political.31.t:0	"Monarchistische Sympathien in der Regierung"
political.31.desc:0	"Während die Regierung [Root.GetLeader] sicherlich kein Freund der Monarchisten ist, kann man das nicht von allen ihren Ministern behaupten. Gerüchte über die vielen Royalisten-Sympathisanten in den Reihen der [Root.GetRulingParty] halten sich hartnäckig, trotz der Bemühungen der Partei-Ältesten, sie auszumerzen. Diese heimlichen Unterstützer haben sich im Stillen für Kompromisse mit den Royalisten eingesetzt, in der Hoffnung, künftiges Unheil zu vermeiden oder zumindest jede Art von Veränderung so unblutig wie möglich zu gestalten."
political.31.a.tt:0	"Wenn die öffentliche Unterstützung ausreichend ist, kann ein Staatsstreich durchgeführt werden."
political.33.t:0	"Royalistische Bewegung taucht in [Root.GetName] auf"
political.34.desc:0	"Demokratie ist das Zählen von Köpfen, nicht das, was in ihnen ist! Die Monarchie ist das einzige Regierungssystem, in dem die Macht zum Wohle aller ausgeübt wird!' Slogans wie diese schallen durch die Straßen jeder größeren Stadt in [Root.GetName]. Die Royalisten haben ihre Machtbasis rasch ausgebaut und können auf Millionen von Anhängern zählen. Sie wettern gegen die Versäumnisse und Skandale der [Root.GetLeader]-Regierung und behaupten, dass sich eine Monarchie niemals auf diese Weise erniedrigen würde. Schlimmer noch, sie rufen die Menschen im ganzen Land aktiv dazu auf, sich der Autorität der derzeitigen Regierung zu widersetzen, und befürworten einen passiven Widerstand im Namen des Sturzes der [Root.GetRulingParty]. Es ist schwer zu sagen, welche Folgen dies letztendlich haben wird, aber das Land war schon seit langem nicht mehr so gespalten."
political.35.desc:0	"Dieser Tag hat lange auf sich warten lassen. Die Royalisten haben sich mit ihrer über das ganze Land verteilten Anhängerschar erhoben, um die Regierung [Root.GetLeader] zu stürzen! Zum Glück für die Regierung haben sich auch Millionen von Loyalisten der Sache angeschlossen, die diese Reaktionäre zurück in die Geschichte schicken wollen. Zum Unglück für das Land sind die beiden Seiten gleich stark, und [Root.GetName] wird schwer leiden, egal wer den kommenden Kampf gewinnt. Sollen wir gegen diese reaktionären Revolutionäre auf die Barrikaden gehen oder sollen wir dem Ruf der Krone folgen?"
political.35.b:0	"Diese Narren gehören in die Geschichtsbücher!"
political.36.desc:0	"Mit jedem Tag, der vergeht, werden die Royalisten stärker als zuvor. Da sie spüren, dass sie die meiste Unterstützung erhalten haben, fordern sie nun ein Referendum, um über die Zukunft von [Root.GetName] zu entscheiden. Leider haben sie wahrscheinlich recht, dass sie ein solches Referendum gewinnen würden, aber ihnen dies zu verweigern, würde sie erzürnen und möglicherweise zu einem gewaltsameren "Referendum" über die Nation selbst führen. \n\nAlternativ könnten wir auch aggressivere Maßnahmen ergreifen, um mit diesem Problem umzugehen, bevor es aus dem Ruder läuft."
political.36.a:0	"Diese Leute sind zu gefährlich, um frei zu bleiben."
political.36.b:0	"Ignorieren Sie diese Reaktionäre."
political.36.c:0	"Wir wagen es nicht, ihnen ihre Stimme zu geben."
political.37.t:0	"Eine Revolution, die einem König würdig ist"
political.37.desc:0	"Nach ihrem katastrophalen Versuch eines Referendums haben sich die Royalisten zusammen mit anderen Reaktionären und einigen Konservativen erhoben und versuchen, mit Gewalt zu erreichen, was sie an der Wahlurne nicht erreichen konnten! Sie haben die [Root.GetRulingParty] als Staatsfeinde denunziert und geben uns die Schuld an der Fäulnis, die [Get.GetName] heute plagt. Sie fordern uns direkt heraus, was sollen wir tun?"
political.37.a:0	"Die Zeiten der Monarchien sind längst vorbei!"
political.37.b:0	"[Root.GetName] wird neue Höhen erreichen!"
political.37.c:0	"Wir müssen mit einer starken Legislative koexistieren."
political.38.t:0	"Royalisten schwinden dahin"
political.38.desc:0	"Es gab eine Zeit, in der die royalistische Bewegung die Zukunft zu sein schien. Ihre Anhänger waren zahlreich und ihr Einfluss weit verbreitet. Doch in letzter Zeit hat sich das Land, aus welchen Gründen auch immer, gegen sie gewandt, da ihre Umfragewerte weiterhin dramatisch sinken. Vielleicht werden sie eines Tages wieder auferstehen, aber heute ist dieser Tag nicht gekommen. Die Royalisten sind nicht länger ein wichtiger Faktor in unserer Politik."

 #New Political Events
goering_four_year_plan_desc:0	"Der Göring-Vierjahresplan war eine Wirtschaftsinitiative, die Göring, der von Hitler gegenüber Hjalmar Schacht bevorzugt wurde, 1936 startete. Er sah unter anderem vor, die Arbeitslosigkeit zu verringern und öffentliche Bauprojekte wie die deutsche Autobahn in Angriff zu nehmen. Der 4-Jahres-Plan von Göring war eigentlich der zweite 4-Jahres-Plan, der umgesetzt wurde. Er wurde im September 1936 angekündigt. Der 4-Jahres-Plan hatte vier Prioritäten: 1. Steigerung der landwirtschaftlichen Produktion. 2. Umschulung von Schlüsselsektoren der Erwerbsbevölkerung. 3. Staatliche Regulierung von Importen und Exporten. 4. Erreichen der Autarkie bei der Rohstoffproduktion. Zusammen mit der späteren Gründung der Reichswerke Hermann Görings und der vollen Rückendeckung Hitlers war Görings Kontrolle über die deutsche Wirtschaft vollständig. Der Göringsche 4-Jahres-Plan endete offiziell 1940, aber einige Aspekte blieben für die Dauer des Krieges bestehen."
gfyp_events.1.desc:0	"Der Göring-Vierjahresplan war eine wirtschaftliche Initiative, die Göring, der von Hitler gegenüber Hjalmar Schacht bevorzugt wurde, im Jahr 1936 startete. Er sah unter anderem vor, die Arbeitslosigkeit zu verringern und öffentliche Bauprojekte wie die deutsche Autobahn in Angriff zu nehmen. Der 4-Jahres-Plan von Göring war eigentlich der zweite 4-Jahres-Plan, der umgesetzt wurde. Er wurde im September 1936 angekündigt. Der 4-Jahres-Plan hatte vier Prioritäten: 1. Steigerung der landwirtschaftlichen Produktion. 2. Umschulung von Schlüsselsektoren der Erwerbsbevölkerung. 3. Staatliche Regulierung von Importen und Exporten. 4. Erreichen der Autarkie bei der Rohstoffproduktion. Zusammen mit der späteren Gründung der Reichswerke Hermann Görings und der vollen Rückendeckung Hitlers war Görings Kontrolle über die deutsche Wirtschaft vollständig. Der 4-Jahres-Plan von Göring endete offiziell 1940, aber einige Aspekte blieben für die Dauer des Krieges bestehen."
