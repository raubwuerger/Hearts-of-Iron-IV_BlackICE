SOV_border_conflict_canceled_attacker.2.a:	"Das nächste Mal werden wir vorbereitet sein"
SOV_border_conflict_canceled_defender.2.desc:	"Unsere Streitkräfte haben es geschafft, das Eindringen des Feindes in unser Gebiet abzuwehren. Beim Anblick unserer Streitkräfte und nach einem kurzen Feuergefecht zog sich der Feind zurück."
