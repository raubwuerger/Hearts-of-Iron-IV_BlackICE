germany.98.b:0	"Zeichnen Sie die Karte von Jugoslawien neu."
 
germany.221.t:0	"Bestellung 44. Infanterie-Division"

germany.222.d:0	"Mit dem Anschluss Österreichs an das nationalsozialistische Deutschland im Jahr 1938 wurde die ehemalige 4. österreichische Division in die Wehrmacht eingegliedert und zur 45. Infanterie-Division umbenannt. Bei der Invasion Polens 1939 war die Division auf dem rechten Flügel der Heeresgruppe Süd von Gerd von Rundstedt eingesetzt. Am 22. Juni 1941 begann die 45. Infanterie-Division die §COperation Barbarossa§! mit der 9-tägigen Belagerung der Festung Brest ein. Im März 1942 besiegte die Rote Armee die Division bei Livny, Russland, und nahm das Divisionsarchiv in Besitz. Das war das erste Mal, dass die Rote Armee von der Verteidigung der Festung Brest erfuhr. In der Schlacht um Kursk erlitt sie schwere Verluste. Sie wurde wieder aufgebaut, aber bei Bobruisk während der §COperation Bagration§! praktisch zerstört. Sie wurde erneut als 45. Volksgrenadier-Division im Herbst 1944 in Polen wieder aufgebaut. Die Division kämpfte 1945 bei Warschau und Radom und zog sich durch Schlesien nach Königgratz und schließlich in die Tschechoslowakei zurück, wo sie kapitulierte."

germany.223.b:0	"Kein Bedarf"
germany.224.t:0	"Bestellung 27. - 28. - 29. - 30. ID"
germany.224.a:0	"Sie erstellen"
germany.224.b:0	"Kein Bedarf"
germany.225.t:0	"Bestellung 31. - 32. - 35. - 36. ID"
germany.225.b:0	"Kein Bedarf"
germany.226.b:0	"Kein Bedarf"
germany.227.t:0	"Bestellung 50. Inf.-Div."
germany.227.a:0	"Bilden Sie die 50. ID"
germany.227.b:0	"Kein Bedarf"
germany.228.t:0	"Bestellung 1. Leichte Division"
germany.228.b:0	"Kein Bedarf"
germany.230.t:0	"Aufstellung und Mobilmachung der 72. Inf.-Div."
germany.230.d:0	"Die 72. Infanterie-Division wurde am 19. September 1939 aus der Grenz-Division Trier gebildet. Nach dem Ausbruch aus der Tscherkassy-Tasche im Februar 1944 wurde sie nach Polen zurückgezogen. Dort wurde sie im März 1944 als Teil der 24. Welle der Schatten-Division Generalgouvernement. Nach schweren Verlusten im Brückenkopf von Baronow an der Weichsel erneut reformiert, kapitulierte die Division im Mai 1945 im Erzgebirge der Tschechoslowakei vor der Roten Armee."
germany.230.b:0	"Kein Bedarf"
germany.231.t:0	"Neuaufstellung der Wachtruppe"
germany.231.d:0	"Im Juni 1937 wurde die Einheit umbenannt, diesmal in Wach-Regiment Berlin. Das Rekrutierungssystem wurde umgestaltet: Die Soldaten wurden nicht mehr nach Divisionen aufgestellt, sondern für 6-monatige Einsätze in die Einheit versetzt. Im Ersten Weltkrieg war Deutschland eher ein politisches Konzept als eine Nation gewesen, und die meisten Divisionen waren noch nach ihrer Region benannt (z. B. Sachsen, Preußen, Bayern, Baden usw.). Unter der NSDAP wurde das Land schließlich zu einem echten Deutschland vereinigt, aber dies war nur ein Teil der Pläne der Partei für ein Großdeutschland, das alle germanischen Völker unter einer Fahne zusammenfassen sollte, und mit seiner Hauptstadt Berlin, die in Germania umbenannt werden sollte, sollte es zum "Infanterie-Regiment Großdeutschland" werden.\nDas Wach-Regiment Berlin stellte Eskorten und Ehrengarden für Staatsbesuche, Konferenzen und die Olympischen Spiele."
germany.232.t:0	"Aufstellung der 3. Leichte Division"
germany.233.d:0	"Deutsches Expeditionskorps in Afrika während des Nordafrikafeldzugs. Zunächst als Auffangtruppe zur Unterstützung der italienischen Verteidigung ihrer afrikanischen Kolonien eingesetzt, kämpfte die Formation unter verschiedenen Bezeichnungen von März 1941 bis zu ihrer Kapitulation im Mai 1943 in Afrika weiter. Der bekannteste Befehlshaber der Einheit war Feldmarschall Erwin Rommel."
germany.233.a:0	"Deutsches Afrikakorps aufstellen"
germany.233.c:0	"Kein Bedarf"
germany.234.t:0	"Umrüstung 1. Leichte Division"
germany.234.d:0	"Nach der Übernahme der Tschechoslowakei durch Deutschland wurde der Pz35T von der deutschen Armee übernommen. Insgesamt wurden 434 Stück gebaut. Davon beschlagnahmten die Deutschen 244, als sie im März 1939 Böhmen und Mähren besetzten, und die Slowaken erwarben 52, als sie zur gleichen Zeit ihre Unabhängigkeit von der Tschechoslowakei erklärten. Andere wurden nach Bulgarien und Rumänien exportiert. In deutschen Diensten kam sie in den ersten Kriegsjahren zum Einsatz, insbesondere bei der Invasion Polens, der Schlacht um Frankreich und dem Einmarsch in die Sowjetunion, bevor sie 1942 ausgemustert oder verkauft wurde. Er wurde für den Rest des Krieges von anderen Ländern und als Übungspanzer in Bulgarien bis in die 1950er Jahre verwendet. Aufgrund von Unzulänglichkeiten, die der Feldzug in der Organisation der leichten Divisionen offenbarte, wurde er als §C6 neu organisiert. Panzer-Division§! im Oktober 1939."
germany.235.d:0	"Mit der Annektierung der Tschechoslowakei haben wir große Mengen an Kriegsmaterial erworben, darunter Lastwagen, Artillerie und Handfeuerwaffen."
germany.236.a:0	"Sehr nützlich!"
germany.237.t:0	"Umrüstung 2. Leichte Division"
germany.237.a:0	"Divisionsvorlage ändern"
germany.238.t:0	"1. Gebirgsjäger-Brigade"
germany.238.d:0	"Die Gebirgs-Brigade wurde im Juni 1935 aufgestellt. Sie war eine der Einheiten, die beim "Anschluss" Österreichs am 12. März 1938 einmarschierte. Sie wurde am 9. April 1938 zur 1. Gebirgs-Division erweitert."
germany.239.t:0	"Aufstellung der 4. Panzer-Division"
germany.240.d:0	"Die 5. Panzer-Division wurde am 15. November 1938 in Oppeln, dem heutigen Opole in Polen, als erste einer zweiten Welle neuer Panzer-Divisionen in Deutschland aufgestellt, nachdem 1935 die ersten drei Panzer-Divisionen aufgestellt worden waren. Neben der 5. Panzer-Division war die 4. fünf Tage zuvor in Würzburg aufgestellt worden. Das Personal der Division bestand hauptsächlich aus Schlesiern und Sudetendeutschen, da das Sudetenland kurz zuvor von Deutschland annektiert worden war."
germany.240.c:0	"Kein Bedarf"
germany.241.d:0	"Sie entstand, nachdem die 4. Leichte Division im Januar 1940 umstrukturiert worden war. Das Hauptquartier der Division befand sich in Wien, im Wehrkreis XVII. Die 9. Panzer-Division, die ursprünglich aus den vor dem Krieg an Deutschland angegliederten österreichischen Streitkräften aufgestellt wurde, war an den meisten der frühen Blitzkriegsangriffe des deutschen Heeres in Westeuropa beteiligt."
germany.241.a:0	"Befehl ausführen"
germany.241.c:0	"Kein Bedarf"
germany.242.a:0	"Befehl ausführen"
germany.243.a:0	"Befehl ausführen"
germany.244.t:0	"Bilden Sie die 12. Panzer-Division"
germany.244.a:0	"Befehl ausführen"
germany.245.t:0	"Bilden Sie die 13. Panzer-Division"
germany.245.d:0	"Die Division wurde 1934 ursprünglich als Infanteriedivision aufgestellt. 1937 wurde sie motorisiert und erhielt den Namen 13. motorisierte Infanterie-Division, die an den Feldzügen gegen Polen (1939) und Westeuropa (1940) teilnahm. Nach dem Fall Frankreichs im Juni 1940 wurde die Division als 13. Panzerdivision reorganisiert."
germany.246.t:0	"14. Panzer-Division"
germany.247.t:0	"16. Panzer-Division"
germany.247.d:0	"Die Division wurde im Herbst 1940 aus der 16. Infanterie-Division gebildet, die zuvor an der deutschen Invasion in Frankreich im Jahr 1940 teilgenommen hatte. Die Division, die im Wehrkreis VI in Westfalen stationiert war, erhielt das 2. Panzer-Regiment der 2. Panzer-Division, verlegte ihren Standort von Münster nach Wuppertal und wurde Hans-Valentin Hube unterstellt."
germany.247.b:0	"Kein Bedarf"
germany.248.t:0	"17. Panzer-Division"
germany.248.d:0	"Die 27. Infanterie-Division wurde im Oktober 1936 in Augsburg, Bayern, als Friedensdivision der neuen deutschen Wehrmacht aufgestellt. Die Division wurde am 26. August 1939 mobilisiert und nahm an der Invasion Polens und der Schlacht um Frankreich teil. Im Jahr 1943 wurde ein nationalsozialistisches Propagandabuch über die Aktionen der Division in Frankreich 1940 mit dem Titel Über Somme, Seine, Loire veröffentlicht. Die 17. Panzerdivision wurde Ende 1940 gebildet, als die 27. Infanteriedivision in eine Panzerdivision umgewandelt wurde. Zum Teil stellte die 2. Panzerdivision das Personal für die neue Division. Die meisten ihrer Truppen kamen aus dem bayerischen Schwaben, dem damaligen NS-Gau Schwaben."
germany.249.t:0	"18. Panzer-Division"
germany.250.t:0	"19. Panzer-Division"
germany.250.d:0	"Die Division wurde im November 1940 aus der 19. Infanterie-Division gebildet, wobei sie das 27. Panzer-Regiment erhielt und das 59. Infanterie-Regiment an die neue 20."
germany.250.b:0	"Kein Bedarf"
germany.251.t:0	"20. Panzer-Division"
germany.251.d:0	"Die 20. Panzer-Division wurde am 5. Oktober 1940 gebildet, nachdem der Beschluss gefasst worden war, die bestehenden deutschen Panzer-Divisionen zu schwächen, um neue Divisionen zu schaffen. Die neue Division setzt sich aus verschiedenen aktiven und Reserveeinheiten zusammen, darunter die 19. Infanterie-Division, die selbst zu einer Panzerdivision umgewandelt worden war und nun als 19."
germany.252.t:0	"24. Panzer-Division"
germany.254.t:0	"Motorisierte 2. Infanterie-Division"
germany.254.d:0	"Die ersten vier motorisierten Infanterie-Divisionen (2., 13., 20. und 29.) wurden in den Jahren 1937 bis 1939 direkt aus den Infanterie-Divisionen aufgewertet, so dass sie die meisten Merkmale ihrer Vorgängerdivisionen beibehielten. Jede motorisierte Infanterie-Division verfügte über drei motorisierte Infanterie-Regimenter und ein motorisiertes Artillerieregiment als Hauptkampfkomponente, die Division verfügte auch über andere unterstützende Einheiten. Die 2. Infanterie-Division(mot.) wird in ihrer Kaserne in STETTIN neu aufgestellt.\nOOB:\nCO: Generalleutnant Paul Bader\nInfanterie-Regiment(motorisiert) 5\nInfanterie-Regiment(motorisiert) 25\nInfanterie-Regiment(motorisiert) 92\nArtillerie-Regiment(motorisiert) 2."
germany.255.d:0	"Die ersten vier motorisierten Infanterie-Divisionen (2., 13., 20. und 29.) wurden in den Jahren 1937 bis 1939 direkt aus Infanterie-Divisionen aufgewertet, so dass sie die meisten Merkmale ihrer Vorgängerdivisionen beibehielten. Jede motorisierte Infanterie-Division verfügte über drei motorisierte Infanterie-Regimenter und ein motorisiertes Artillerieregiment als Hauptkampfkomponente, die Division verfügte auch über andere unterstützende Einheiten. Die 13. Infanterie-Division(mot.) wird in ihrer Kaserne in MAGDEBURG neu aufgestellt.\nOOB:\nCO: Generalleutnant Paul Otto\nInfanterie-Regiment(motorisiert) 33\nInfanterie-Regiment(motorisiert) 66\nInfanterie-Regiment(motorisiert) 93\nArtillerie-Regiment(motorisiert) 13."
germany.256.t:0	"Motorise 20. Infanterie-Div.(mot.)"
germany.256.d:0	"Die ersten vier motorisierten Infanterie-Divisionen (2., 13., 20. und 29.) wurden in den Jahren 1937 bis 1939 direkt aus Infanterie-Divisionen hervorgegangen, so dass sie die meisten Merkmale ihrer Vorgängerdivisionen behielten. Jede motorisierte Infanterie-Division verfügte über drei motorisierte Infanterie-Regimenter und ein motorisiertes Artillerieregiment als Hauptkampfkomponente, die Division verfügte auch über andere unterstützende Einheiten. Die 20. Infanterie-Division(mot.) wird in ihrer Kaserne in HAMBURG neu aufgestellt.\nOOB:\nCO: Generalleutnant Maximilian Schwandner\nInfanterie-Regiment(motorisiert) 69\nInfanterie-Regiment(motorisiert) 76\nInfanterie-Regiment(motorisiert) 90\nArtillerie-Regiment(motorisiert) 20."
germany.257.a:0	"Ok"
germany.258.a:0	"Ausgestattet mit 28 cm SK C/34 Kanonen (11 Zoll)"
germany.258.b:0	"Bewaffnet mit 38 cm (15 Zoll) SK C/34 Geschützen"
germany.259.d:0	"Die 16. Infanterie-Division des Deutschen Heeres wurde 1934 aufgestellt. Am 26. August 1939 wurde die Division für den Einmarsch in Polen (1939) mobilisiert. Im Jahr 1940 nahm sie an der Schlacht um Frankreich teil. Danach wurde die Division geteilt, so dass zwei unabhängige Einheiten entstanden: Die 16. Panzer-Division und die 16. Infanterie-Division(mot.). Letztere wurde ab 1944 zusammen mit anderen Teilen, die nicht zur 16. gehörten, als 116. Panzer-Division.\n\n!!!!! Suchen Sie nach 16. Infanterie-Division und ändern Sie die Vorlage in 'Infanterie-Division(mot.+at)'."
germany.260.t:0	"Bildung der 25. Infanterie-Division(mot.)"
germany.260.d:0	"Die 25. Infanterie-Division (mot.) wurde aus der 25. Infanterie-Division gebildet und am 15. November 1940 umorganisiert, umgerüstet und als 25. Panzergrenadier-Division im Juli 1943 umbenannt.\n\nWICHTIG!!!\nSie können nach der 25. Infanterie-Division in der Armeeansicht suchen. Öffnen Sie sie und ändern Sie die Vorlage in 'Inf-Division(mot.)'\n\nNun benennen Sie sie um in 25. Infanterie-Division(mot.)."
germany.261.d:0	"Umbenannt in 3. motorisierte Infanterie-Division, nahm sie im Juni 1941 an der Operation Barbarossa teil und rückte unter der Heeresgruppe Nord auf Leningrad vor. Im Oktober wurde die Division zur Heeresgruppe Mitte verlegt, wo sie an der Operation Taifun, der Schlacht um Moskau und den Verteidigungskämpfen des Winters teilnahm. Mitte 1942 wurde sie zur Heeresgruppe Süd verlegt, um an der Sommeroffensive "Fall Blau" teilzunehmen, und wurde schließlich in die Schlacht um Stalingrad verwickelt, wo sie im Februar 1943 in der Umzingelung mit der 6. deutschen Armee vernichtet wurde.\n\nWICHTIG!!!\nSie können die 3. Öffnen Sie sie und ändern Sie die Vorlage in 'Inf-Division(mot.)'\n\nNun benennen Sie sie in 3. Infanterie-Division(mot.) um."
germany.263.d:0	"Die Division wurde 1934 in Leipzig durch die Erweiterung des 11. (Sächsischen) Infanterie-Regiments der 4. Division der alten Reichswehr gebildet. Division der alten Reichswehr. Da dies ein direkter Verstoß gegen die Bestimmungen des Versailler Vertrages war, wurde ihre Existenz zunächst verheimlicht; im Oktober 1935 wurde sie offiziell als 14. Diese Geschichte, insbesondere die des Infanterie-Regiments 11, machte sie zu einer der prestigeträchtigsten Infanterie-Divisionen der Wehrmacht. 1939 in der ersten Welle mobilisiert, war die Division am deutschen Überfall auf Polen beteiligt, wo sie in Richtung Częstochowa und Lublin angriff, sowie im folgenden Jahr am Einmarsch in Frankreich. Im Oktober 1940 wurde sie als 14. Infanteriedivision "motorisiert", d. h. mit Kraftfahrzeugen ausgestattet, im Gegensatz zur üblichen Mobilität der Infanteriedivisionen der Wehrmacht zu Fuß und zu Pferd. Infanteriedivision (mot.)\n\nWICHTIG!!!\nSie können die 14. Infanterie-Division in der Armeeansicht suchen. Öffnen Sie sie und ändern Sie die Vorlage in 'Inf-Division(mot.)'\n\nNun benennen Sie sie in 14. Infanterie-Division(mot.)."
germany.263.a:0	"Suchen Sie nach 14. Inf.-Div."
germany.263.c:0	"Kein Bedarf"
germany.264.t:0	"18. Infanterie-Division(mot.)"
germany.264.d:0	"Die deutsche 18. Infanterie-Division wurde am 1. Oktober 1934 als Infanterieführer III in Liegnitz aufgestellt und am 15. Oktober 1935 in 18. Infanterie-Division am 15. Oktober 1935 umbenannt. Sie wurde im August 1939 mobilisiert und nahm an der Invasion Polens und 1940 an der Schlacht um Frankreich teil. Nach dem Frankreichfeldzug wurde die Division motorisiert und am 1. November 1940 in 18. motorisierte Infanterie-Division umbenannt, die für den Rest des Krieges an der Ostfront eingesetzt wurde. Im Juni 1943 wurde die Division zur 18. Panzergrenadier-Division umbenannt.\n\nWICHTIG!!!\nSie können nach der 18. Infanterie-Division in der Armeeansicht suchen. Öffnen Sie sie und ändern Sie die Vorlage in 'Inf-Division(mot.)' \n\nNun umbenennen in 18. Infanterie-Division(mot.)."
germany.264.c:0	"Kein Bedarf"
germany.265.b:0	"KI erhält volle Division"
germany.265.c:0	"Kein Bedarf"
germany.266.d:0	"Die 2. Gebirgs-Division war eine Gebirgsjäger-Division des deutschen Heeres, die im Zweiten Weltkrieg hauptsächlich im nördlichsten Sektor der Ostfront, nahe der Arktis, eingesetzt wurde. Sie wurde 1938 aufgestellt und bei Kriegsende 1945 aufgelöst.\nNach dem Anschluss Österreichs an das nationalsozialistische Deutschland im März 1938 wurde die 2. Gebirgsjäger-Division am 1. April 1938 aus Angehörigen der 6. Infanterie-Division der österreichischen Armee gebildet. Sie war in Innsbruck stationiert, einem Teil des Wehrkreises XVIII, und die meisten ihrer Männer stammten aus der Region Salzburg und Tirol."
germany.266.a:0	"Form der Einheit"
germany.267.t:0	"Form 3. Gebirgsjäger-Division"
germany.268.t:0	"Umrüsten 1. Kav-Brigade"
germany.270.t:0	"Umrüstung des Pz II auf Marder 2 TD"
germany.270.d:0	"Der Marder II basierte auf dem Fahrgestell des Panzer II. Es gab zwei Versionen, wobei die erste eine modifizierte sowjetische 7,62-cm-Kanone mit deutscher Munition und die andere die deutsche 7,5-cm-Pak-40-Kanone trug. Das hohe Profil und die dünne, nach oben offene Panzerung boten der Besatzung nur minimalen Schutz. Dennoch bot der Marder II (und der ähnliche Marder III) 1942 und bis in das Jahr 1943 hinein eine deutlich höhere Feuerkraft als die zeitgenössischen deutschen Panzer."
germany.270.b:0	"Nicht jetzt"
