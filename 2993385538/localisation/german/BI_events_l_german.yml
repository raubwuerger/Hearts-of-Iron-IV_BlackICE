moneymod.2.d:0	"Wir sind knapp bei Kasse. Wir müssen handeln!"
moneymod.2.a:0	"Nehmt es der Wirtschaft"
moneymod.2.b:0	"Nimm Schulden"
moneymod.2.c:0	"Nichts tun"
moneymod.5.t:0	"Konkurs!"
moneymod.5.d:0	"Wir sind schuldenfrei.\n Wir können entweder unsere Wirtschaft oder unsere politische Vision verlieren"
moneymod.5.a:0	"Wirtschaft bricht zusammen"
moneymod.5.b:0	"Politik fallen lassen"
blackiceevents.1.t:0	"Outdated Save"
blackiceevents.1.desc:0	"Dieser Spielstand wurde mit einer anderen Version gestartet als die, die Sie gerade spielen. Dies kann zu Spielfehlern führen, und es wird empfohlen, ein neues Spiel zu beginnen."
blackiceevents.2.t:0	"Zur Achse einladen"
blackiceevents.2.d:0	"Wir haben die Chance, unsere Fraktion zu erweitern. Ungarn könnte ein nützlicher Verbündeter sein oder zumindest eine Pufferzone gegen die kommunistischen Aggressoren im Osten bieten."
blackiceevents.2.a:0	"Laden Sie Ungarn ein, sich der Achse anzuschließen!"
blackiceevents.2.b:0	"Wir brauchen die Hilfe Ungarns nicht!"
blackiceevents.3.t:0	"Wählen Sie Ihre Forschung "
blackiceevents.3.d:0	"Auf welche Art von Forschung sollten wir uns spezialisieren? "
blackiceevents.3.a:0	"Industrie "
blackiceevents.3.b:0	"Ressourcenherstellung "
blackiceevents.4.t:0	"Einladen zur Achse"
blackiceevents.4.d:0	"Wir haben die Chance, unsere Fraktion zu erweitern. Rumänien könnte ein nützlicher Verbündeter sein oder zumindest eine Pufferzone gegen die kommunistischen Aggressoren im Osten bilden."
blackiceevents.4.a:0	"Laden Sie Rumänien ein, sich der Achse anzuschließen!"
blackiceevents.4.b:0	"Wir brauchen Rumänien nicht!"
blackiceevents.5.t:0	"Einladung an die Alliierten"
blackiceevents.5.d:0	"Norwegen hat um den Beitritt zu den Alliierten gebeten. Ein weiteres Land, das Angst vor den Deutschen hat."
blackiceevents.5.a:0	"Laden Sie Norwegen zum Beitritt zu den Alliierten ein!"
blackiceevents.5.b:0	"Tut mir leid, Norwegen, du bist auf dich allein gestellt."
blackiceevents.6.t:0	"Etwas ist schief gelaufen"
blackiceevents.6.d:0	"Dieses Ereignis ist nur ein Test-Ereignis, um uns mitzuteilen, wenn etwas nicht so funktioniert, wie es sollte. Dein Spiel sollte immer noch einwandfrei laufen, aber wenn du uns mitteilen kannst, was du gemacht hast, als dieses Ereignis auftrat, hilft uns das, noch mehr Bugs zu beseitigen."
blackiceevents.6.a:0	"Zurück zum Spiel"
blackiceevents.8.t:0	"Zur Achse einladen"
blackiceevents.8.d:0	"Wir haben die Chance, unsere Fraktion zu erweitern. Italien könnte sich als nützlicher Verbündeter erweisen."
blackiceevents.8.a:0	"Ladet Italien ein, der Achse beizutreten!"
blackiceevents.8.b:0	"Wir brauchen Italien nicht!"
blackiceevents.9.t:0	"Neutrales Land entdeckt"
blackiceevents.9.d:0	"Es sieht so aus, als ob du in BICE ein ziemlich ungewöhnliches Land spielst. Wenn du möchtest, dass die KI ein bisschen mehr auf dich vorbereitet ist, kannst du angeben, welche Hauptgruppe du zu unterstützen hoffst"
blackiceevents.9.a:0	"Wir werden uns Deutschland anschließen!"
blackiceevents.9.b:0	"Wir werden uns Japan anschließen!"
blackiceevents.9.c:0	"Wir schließen uns den Sowjets an!"
blackiceevents.9.e:0	"Wir schließen uns den Alliierten an!"
blackiceevents.9.f:0	"Wir werden uns den Chinesen anschließen!"
blackiceevents.9.g:0	"Ich würde es vorziehen, nichts zu sagen, oder ich plane meinen eigenen Weg"
blackiceevents.11.t:0	"Kein Wecken des Tigers"
blackiceevents.11.d:0	"Es sieht so aus, als würdet ihr "Waking the Tiger" nicht benutzen und daher wurden einige unserer Fokusbäume aus Gründen der Balance abgeschaltet. Bitte seid euch bewusst, dass es Probleme geben kann, wenn ihr WTT nicht benutzt, aber wenn ihr wollt, könnt ihr die Bäume, die versteckt sind, einschalten"
blackiceevents.11.a:0	"Behalten Sie die zusätzlichen Fokusbäume ausgeschaltet"
blackiceevents.11.b:0	"Schalten Sie die zusätzlichen Fokusbäume ein (bitte beachten Sie, dass diese Option nicht unterstützt/getestet wird, um Fehler zu beheben)"
blackiceevents.12.t:0	"Willkommen im Panzeroo-Modus"
blackiceevents.12.d:0	"Eine weise (oder vielleicht auch dumme) Entscheidung, mein Freund. Als Nächstes musst du auswählen, wann du die Macht von Panzeroo\n sehen willst. Wenn du im Mehrspielermodus spielst, sollte nur ein Spieler diese Option wählen und der Rest sollte MP-Lakai wählen und sicherstellen, dass ihr alle in der gleichen Fraktion seid, bevor ihr das Datum wählt."
blackiceevents.12.a:0	"Marco Polo"
blackiceevents.12.b:0	"Danzig"
blackiceevents.12.c:0	"Barbarossa"
blackiceevents.12.e:0	"Pearl Harbor"
blackiceevents.12.f:0	"Ich bin nur ein Lakai, du solltest den anderen Spieler fragen"
blackiceevents.13.t:0	"Seine Zeit"
blackiceevents.13.d:0	"Du hast es so gewollt, vergiss das nicht. Möge der Geist von Panzeroo mit dir sein."
blackiceevents.13.a:0	"Viel Glück solidier.... Du wirst es brauchen"
blackiceevents.15.t:0	"Eine sowjetische Delegation ist eingetroffen"
blackiceevents.15.d:0	"Stalin hat einige Forderungen an Rumänien, die vielleicht nicht nach deinem Geschmack sind."
blackiceevents.15.a:0	"Mal sehen, was er will..."
blackiceevents.27.t:0	"Krieg gegen den Kommunismus"
blackiceevents.27.d:0	"Das Deutsche Reich ist uns zu Hilfe gekommen und hat einen weltweiten Krieg gegen den Kommunismus erklärt. Die Deutschen rücken schnell vor, und der Sieg scheint gesichert. Wegen unseres gemeinsamen Feindes fordern die Deutschen uns nun auf, in ihren Krieg einzutreten!"
blackiceevents.27.a:0	"Wir werden unser Land zurückerobern!"
blackiceevents.27.b:0	"Ein Krieg mit den Sowjets war genug"
blackiceevents.35.t:0	"Das Vereinigte Königreich hat sich hinter uns gestellt und ist bereit, eine Allianz zu gründen!"
blackiceevents.35.d:0	"Die Welt steht in Flammen, und die Briten haben geschworen, die Achsenmächte zu bekämpfen. Sollen wir dasselbe schwören?"
blackiceevents.35.a:0	"Schließen wir uns den Alliierten an!"
blackiceevents.35.b:0	"Nein, wir wollen nicht zu den Alliierten!"
