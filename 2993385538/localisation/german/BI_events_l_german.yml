blackiceairevents.77.t:0	"Bildung von Gruppen für nächtliche Störungen."
blackiceairevents.77.d:0	"Wir haben damit begonnen, mehrere Gruppen von Nachtjägereinheiten zu bilden. Diese Gruppen, die meist aus alten Schulungs- oder veralteten Aufklärungsflugzeugen bestehen, sollen den Feind daran hindern, nachts zu operieren oder ruhig zu schlafen."
blackiceairevents.77.a:0	"Gut."
blackiceairevents.78.t:0	"Jagdflugzeug-Wettbewerb"
blackiceairevents.78.d:0	"Am 10. Februar 1936 gab die Regia Aeronautica Spezifikationen für ein neues Jagdflugzeug heraus. Sechs Unternehmen haben sich mit ihren Entwürfen beteiligt, und nach Abschluss der Flugversuche in Guidonia ist es nun an der Zeit, einen Sieger zu küren. Die Beiträge von Caproni und Aeronautica Umbra, die F.5 und die T.18, sind noch nicht geflogen. Die IMAM Ro.51 ist sowohl im Flug instabil als auch unscheinbar. Von den drei verbleibenden Flugzeugen ist die Macchi MC.200 eindeutig das leistungsstärkste und teuerste. Die Reggiane Re.2000 zeigt großes Entwicklungspotenzial, ist aber noch nicht serienreif. Der Fiat G.50 ist am billigsten und kann am schnellsten in Produktion gehen."
blackiceairevents.78.a:0	"Die G.50. Wir brauchen jetzt Kampfflugzeuge!"
blackiceairevents.78.b:0	"Die MC.200 ist eindeutig die beste!"
blackiceairevents.78.c:0	"Die Re.2000 ist die Zukunft!"
blackiceairevents.78.e:0	"Finanziert sie alle!"
blackiceairevents.78.f:0	"ICH BIN DIE KI UND ICH WÄHLE DIES!"
blackiceairevents.79.t:0	"Wettbewerb für Kampfflugzeuge"
blackiceairevents.79.d:0	"Im Wettbewerb der Serie 5 schrieb die Regia Aeronautica ein Jagdflugzeug aus, das entweder von einem Daimler-Benz DB 605-Motor oder einem lizenzierten Äquivalent angetrieben werden sollte. Der Beitrag von Macchi, die MC.205V, hat die höchste Leistung, ist am teuersten und hat die schwächste Bewaffnung. Die Reggiane Re.2005 ist die am stärksten bewaffnete und hat die geringste Leistung. Die Fiat G.55 liegt sowohl bei der Bewaffnung als auch bei der Flugleistung zwischen den beiden und ist wiederum die billigste."
blackiceairevents.79.a:0	"Die G.55 ist der beste Kauf!"
blackiceairevents.79.b:0	"Die MC.205 ist eindeutig die beste!"
blackiceairevents.79.c:0	"Die Re.2005 wird zur Abwehr feindlicher Bomber benötigt!"
blackiceairevents.79.e:0	"Finanziert sie alle!"
blackiceairevents.79.f:0	"ICH BIN DIE KI UND ICH WÄHLE DIES!"
blackiceairevents.80.t:0	"Luftnahunterstützungs-Flugzeuge"
blackiceairevents.80.d:0	"Über die Zukunft der italienischen CAS-Flugzeuge gibt es zwei Meinungen. Die eine hält kleine, einmotorige Sturzkampfbomber für besser, die andere glaubt, dass zweimotorige Flugzeuge mehr Munition transportieren können. Obwohl beide ihre Vorzüge haben, sollten wir unseren Flugzeugkonstrukteuren mitteilen, welche wir bevorzugen. Einmotorige CAS-Flugzeuge sind billig und effektiv, während zweimotorige CAS-Flugzeuge mehr Waffen transportieren können, was allerdings einen höheren Preis hat."
blackiceairevents.80.a:0	"Einmotorige Flugzeuge sind ein Schnäppchen!"
blackiceairevents.80.b:0	"Wir brauchen schwerere Unterstützungswaffen!"
blackiceairevents.80.c:0	"ICH BIN DIE KI UND ICH WÄHLE DIES!"
blackiceairevents.81.t:0	"Marinebomber-Flugzeuge"
blackiceairevents.81.d:0	"Unsere Flugzeugkonstrukteure sind geteilter Meinung, wenn es um die Zukunft unserer Marinebomber geht. Die einen glauben, dass wir uns auf kleinere und billigere Torpedobomber verlassen sollten, während die anderen meinen, dass größere Flugzeuge, die mehrere Torpedos abfeuern können, der richtige Weg sind. Wir sollten unseren Konstrukteuren zu verstehen geben, was wir bevorzugen."
blackiceairevents.81.a:0	"Kleinere Torpedo-Bomber sind ein Schnäppchen!"
blackiceairevents.81.b:0	"Wie können wir zu mehr Torpedos nein sagen?"
blackiceairevents.81.c:0	"ICH BIN DIE KI UND ICH WÄHLE DIES!"
blackiceairevents.82.t:0	"Lizenzierte Triebwerkstechnologie"
blackiceairevents.82.d:0	"Nun, da unser Bündnis mit einer anderen großen Luftmacht gefestigt ist, können wir uns Zugang zu ihrer Triebwerkstechnologie verschaffen. Während italienische Ingenieure große Fortschritte im Bereich leistungsstarker Flugzeugtriebwerke gemacht haben, verfügen wir noch nicht über die Fähigkeiten, erstklassige Triebwerke für den militärischen Einsatz in großem Maßstab herzustellen. Das werden wir bald ändern."
blackiceairevents.82.a:0	"Großartig!"
blackiceairevents.84.t:0	"Exportierte Flugzeuge wurden ausgeliefert!"
blackiceairevents.84.d:0	"Buffalo hat eine Lieferung von 43 $brewster_b239_equipment_1$ an Finnland abgeschlossen. Es bleibt zu hoffen, dass sie sich weiterhin an amerikanische Unternehmen wenden, um ihre Luftwaffe auszurüsten."
blackiceairevents.84.a:0	"Gut für sie."
blackiceevents.105.t:0	"Historischer Fokus aus"
blackiceevents.105.desc:0	"Wir raten davon ab, ohne historischen Fokus zu spielen. BICE ist nicht für ahistorisches Spiel getestet und CTDs sind wahrscheinlicher."
blackiceevents.105.a:0	"Ok"
blackiceevents.106.t:0	"Ironman aktiviert"
blackiceevents.106.desc:0	"Wir raten davon ab, BICE mit eingeschaltetem Ironman zu spielen. Das macht es für uns auch schwieriger, wenn Ihr Spiel abstürzt und Sie sich entscheiden, uns Ihren Spielstand zu schicken."
blackiceevents.106.a:0	"Ok"
enigma.1.t:0	"Marian Rejewski schickt eine Enigma-Maschine an die Alliierten."
enigma.1.d:0	"Marian Adam Rejewski war ein polnischer Mathematiker und Kryptologe, der 1932 herausfand, wie die mit Steckkarten ausgestattete Enigma-Maschine, das wichtigste von Deutschland verwendete Chiffriergerät, Nachrichten verschlüsselte.  Der Erfolg von Rejewski und seinen Kollegen Jerzy Rózycki und Henryk Zygalski gab den Briten im Zweiten Weltkrieg den Anstoß zum Lesen von Enigma-Nachrichten.  Die so gewonnenen Informationen, die den Codenamen Ultra tragen, trugen vielleicht entscheidend zur Niederlage Nazi-Deutschlands bei.  Fünf Wochen vor dem deutschen Einmarsch in Polen 1939 präsentierten Rejewski und seine Kollegen ihre Ergebnisse zur Entschlüsselung der Enigma den französischen und britischen Geheimdienstvertretern. Kurz nach Ausbruch des Krieges wurden die polnischen Kryptologen nach Frankreich evakuiert, wo sie ihre Arbeit in Zusammenarbeit mit den Briten und Franzosen fortsetzten."
enigma.1.a:0	"Gebt ihnen Enigma"
enigma.1.b:0	"Nein!"
enigma.2.t:0	"Marian Rejewski schickt eine Enigma-Maschine an die Alliierten"
enigma.2.d:0	"Marian Adam Rejewski war ein polnischer Mathematiker und Kryptologe, der 1932 herausfand, wie die mit Steckkarten ausgestattete Enigma-Maschine, das wichtigste von Deutschland verwendete Chiffriergerät, Nachrichten verschlüsselte. Der Erfolg von Rejewski und seinen Kollegen Jerzy Rózycki und Henryk Zygalski gab den Briten im Zweiten Weltkrieg den Anstoß zum Lesen von Enigma-Nachrichten.  Die so gewonnenen Informationen, die den Codenamen Ultra tragen, trugen vielleicht entscheidend zur Niederlage Nazi-Deutschlands bei.  Fünf Wochen vor dem deutschen Einmarsch in Polen 1939 präsentierten Rejewski und seine Kollegen ihre Ergebnisse zur Entschlüsselung der Enigma den französischen und britischen Geheimdienstvertretern. Kurz nach Ausbruch des Krieges wurden die polnischen Kryptologen nach Frankreich evakuiert, wo sie ihre Arbeit in Zusammenarbeit mit den Briten und Franzosen fortsetzten."
enigma.2.a:0	"Ausgezeichnet!  Lasst uns den Code knacken."
enigma.3.t:0	"Operation ULTRA"
enigma.3.d:0	"ULTRA war der Name, den die Briten für die Erkenntnisse aus der Entschlüsselung des verschlüsselten deutschen Funkverkehrs im Zweiten Weltkrieg verwendeten. Der Begriff wurde schließlich zur Standardbezeichnung für alle Informationen aus hochrangigen kryptoanalytischen Quellen.  Der Name entstand, weil das Entschlüsseln von Chiffren als wichtiger angesehen wurde als die höchste damals verfügbare Sicherheitseinstufung (Most Secret) und daher als ultrageheim galt.  Ein Großteil des deutschen Chiffrierverkehrs wurde mit der Enigma-Maschine verschlüsselt, weshalb der Begriff "Ultra" oft fast synonym mit "Enigma entschlüsselt" verwendet wurde.  Die in Bletchley Park unter dem Codenamen "Ultra" hergestellten hochrangigen Geheimdienstinformationen sollen den Kriegsanstrengungen der Alliierten entscheidend geholfen und den Krieg verkürzt haben, obwohl der genaue Einfluss von Ultra noch immer untersucht und diskutiert wird.  Wir werden eine Entschlüsselung gegen Deutschland erreichen."
enigma.3.a:0	"Bletchley Park ist jetzt unser Geheimdienstzentrum."
enigma.3.b:0	"Nein"
enigma.4.t:0	"Beschlagnahmung von Bletchley Park"
enigma.4.d:0	"Der britische Auslandsgeheimdienst MI6 (Military Intelligence Section 6) gab Wochen vor Ausbruch des Zweiten Weltkriegs in Warschau seine Erfolge bei der Entschlüsselung der deutschen Enigma-Chiffren an den französischen und britischen Geheimdienst weiter.  Die Briten nutzten diese Informationen als Grundlage für ihre eigenen frühen Bemühungen zur Entschlüsselung der Enigma.  Die erste Welle der Government Code and Cypher School (GC&CS) zog am 15. August 1939 nach Bletchley Park.  Der Hauptteil der GC&CS, einschließlich der Marine-, Militär- und Luftabteilungen, befand sich im Erdgeschoss, zusammen mit einer Telefonzentrale, einem Fernschreiberraum, einer Küche und einem Speisesaal.  Das Obergeschoss wurde dem MI6 zugewiesen.  Die vorgefertigten Holzhütten wurden noch errichtet, und anfangs war die gesamte "Jagdgesellschaft" in das bestehende Haus, seine Ställe und Hütten gepfercht. Diese erwiesen sich als zu klein, und so wurde die Elmers School, ein benachbartes Jungeninternat, für die kommerzielle und diplomatische Abteilung erworben."
enigma.4.a:0	"Das sollte genügen."
enigma.5.t:0	"Weitere Verbesserung von Bletchley Park."
enigma.5.d:0	"Abhörstationen, die Y-Stationen (wie die in Chicksands in Bedfordshire und Beaumanor Hall in Leicestershire, dem Hauptquartier der Y-Gruppe des Kriegsministeriums), sammelten Rohsignale zur Verarbeitung in Bletchley.  Die verschlüsselten Nachrichten wurden von Hand notiert und auf Papier mit Motorradkurieren oder später mit Fernschreibern nach Bletchley geschickt. Bletchley Park ist vor allem für das Entschlüsseln von Nachrichten bekannt, die mit der deutschen Enigma-Maschine verschlüsselt wurden, aber die größte kryptografische Leistung war wohl das Entschlüsseln der Fernschreiber des deutschen Oberkommandos der Fische.  Die in Bletchley entschlüsselten Informationen erhielten den Codenamen \"Ultra\".  Sie trugen wesentlich zum Erfolg der Alliierten bei der Bekämpfung der U-Boote in der Atlantikschlacht und zu den britischen Seesiegen in der Schlacht von Kap Matapan und der Schlacht am Nordkap bei."
enigma.5.a:0	"Okay"
enigma.6.t:0	"Bletchley Park ist jetzt voll funktionsfähig."
enigma.6.d:0	"Die Abhörstationen arbeiten zu 100 %.  Wir können jetzt Signale vom Kontinent empfangen und entschlüsseln."
enigma.6.a:0	"Gut"
enigma.7.t:0	"Operation Z"
enigma.7.d:0	"Unsere Kryptologen haben den Enigma-Code erfolgreich geknackt."
enigma.7.a:0	"Unglaublich."
enigma.8.t:0	"Ändern der Enigma-Codes"
enigma.8.d:0	"Unsere Kryptologen haben unsere Enigma-Codes geändert, um zu verhindern, dass die Alliierten unsere Befehle entschlüsseln können."
enigma.8.a:0	"Ja"
enigma.9.t:0	"Deutschland hat die Enigma-Codes geändert"
enigma.9.d:0	"Wir können ihre Befehle nicht mehr so gut entschlüsseln wie früher."
enigma.9.a:0	"Donnerwetter"
enigma.10.t:0	"Enigma M4"
enigma.10.d:0	"Am 1. Februar 1942 führte die Marine für den U-Boot-Verkehr eine Enigma-Maschine mit vier Rotoren ein, die M4 genannt wurde (das Gerät war bei den Alliierten als Triton oder "Shark" bekannt). Der zusätzliche Rotor wurde auf demselben Raum untergebracht, indem der Reflektor in eine Kombination aus einem dünnen Reflektor und einem dünnen vierten Rotor aufgeteilt wurde. Dies führte zu einer größeren Verschlüsselungsfähigkeit - jetzt und für einige Monate werden die Alliierten nicht in der Lage sein, unsere Konvoi-Angriffe abzufangen."
enigma.10.a:0	"Gut"
enigma.11.d:0	"Am 1. Februar 1942 führte die Marine für den U-Boot-Verkehr eine Enigma mit vier Rotoren ein, die als M4 bezeichnet wurde (das Gerät war bei den Alliierten als Triton oder "Shark" bekannt). Der zusätzliche Rotor wurde auf demselben Raum angebracht, indem der Reflektor in eine Kombination aus einem dünnen Reflektor und einem dünnen vierten Rotor aufgeteilt wurde. Dies führte zu einer großen Verschlüsselungsfähigkeit und unsere Marine ist seitdem nicht mehr in der Lage, die deutschen Geleitzugangriffe abzufangen.  Unsere Generäle fordern uns auf, dringend nach einem Weg zu suchen, die Enigma-Codes zu knacken, wenn wir unsere Konvois schützen wollen. Wenn Sie zustimmen, werden wir 5% unserer Arbeitskräfte investieren, bis der Code geknackt ist."
enigma.11.a:0	"Lasst ihn uns knacken"
enigma.11.b:0	"Nein"
enigma.12.t:0	"Enigma-Code geknackt!"
enigma.13.a:0	"Danke"
enigma.14.t:0	"Enigma-Code geknackt!"
enigma.14.d:0	"Unsere Kryptologen haben großartige Arbeit geleistet, wir können unsere Konvois jetzt besser gegen deutsche U-Boote verteidigen."
enigma.14.a:0	"Großartig"
USA_Cracking_Enigma:0	"USN-Rechenmaschinenlabor"
 
argentina.1.t:0	"Nazi-Kundgebung im Luna Park"
argentina.1.d:0	"Im Luna-Park wurden Nazikundgebungen abgehalten, die außergewöhnliche Szenarien schufen, die eher an Berlin als an Buenos Aires erinnerten. An einer Nazikundgebung im Jahr 1938, an der erstaunliche 20.000 Menschen teilnahmen, waren auch wichtige Politiker wie Roberto J. Noble, der Gründer der größten argentinischen Zeitung Clarín, beteiligt."
argentina.1.a:0	"Deutschland ist groß!"

argentina.4.d:0	 "Die argentinische Regierung äußerte ihre Besorgnis über die italienische Besetzung Äthiopiens und forderte die Einberufung der Völkerbundversammlung, um die Angelegenheit zu prüfen. In der Erklärung heißt es: "Die argentinische Regierung ist in Anbetracht der gegenwärtigen internationalen Lage der Auffassung, dass die Versammlung des Völkerbundes einberufen werden sollte, um die Frage der italienischen Besetzung äthiopischen Territoriums zu erörtern und die Maßnahmen zu prüfen, die erforderlich sein könnten, um die Durchführung des Paktes zu gewährleisten"."
argentina.4.a:0	"Die Angelegenheit muss geklärt werden"
argentina.4.b:0	"Sie sollten sich um ihre eigenen Angelegenheiten kümmern."
argentina.4.c:0	"Die erste öffentliche Stellungnahme für Äthiopien?"
australia.1.t:0	"Ivy May Pearce"
australia.2.a:0	"Schrecklich"
australia.23.t:0	"Robert Menzies wird gewählt"
australia.23.d:0	"Am 26. April 1939 wurde Robert Menzies als Premierminister vereidigt, nachdem er nach dem Tod von Joseph Lyons zum Vorsitzenden der United Australia Party gewählt worden war."
australia.23.a:0	"Tragischer Verlust"
australia.24.t:0	"John Curtin gewählt"
australia.25.b:0	"Ablehnen"
australia.26.t:0	"erste Sitzung"
australia.26.d:0	"Der Verband der Kunstgalerien und Museen Australiens und Neuseelands hat seine erste Sitzung in Auckland abgehalten. Wir hoffen, dass die Zusammenarbeit zum Wohle der Kultur von großem Nutzen sein wird."
australia.26.a:0	"Großes Zeug"
australia.27.t:0	"Erfolgreiche Antarktis-Mission"
australia.29.t:0	"Australien lehnt Vorschläge zur Rückgabe deutscher Kolonien ab"
australia.29.d:0	"Am 18. März 1936 lehnte Australien die Möglichkeit einer Rückgabe der deutschen Kolonien ab. Die australische Regierung gab eine Erklärung ab, in der sie die Bedeutung der nationalen Sicherheit und der territorialen Integrität des Landes betonte und erklärte, dass die Rückgabe von Gebieten unter australischem Mandat undenkbar sei. Die Erklärung erfolgte als Reaktion auf die zunehmenden Spekulationen, dass Deutschland versuchen könnte, einige seiner ehemaligen Kolonien zurückzuerobern, die nach dem Ersten Weltkrieg vom Völkerbund unter australisches Mandat gestellt worden waren. Die australische Regierung vertrat einen klaren Standpunkt und erklärte, dass die Unverletzlichkeit und Integrität ihrer Gebiete von größter Bedeutung sei. Die Regierung argumentierte, dass diese Politik untrennbar mit ihrer nationalen Sicherheit verbunden sei und dass jeder Bedrohung ihrer territorialen Integrität mit äußerster Entschlossenheit begegnet werden würde. Ein besonderer Bereich der Besorgnis war der strategische Wert von Neuguinea, das nach dem Ersten Weltkrieg unter australisches Mandat gestellt worden war. Aufgrund dieser Faktoren sei Neuguinea von entscheidender Bedeutung für die Verteidigung und Sicherheit Australiens."
australia.29.a:0	"Diese Länder sind jetzt australisch"
australia.29.b:0	"Wir müssen sie uns vielleicht mit Gewalt zurückholen"
australia.29.c:0	"Mutige Worte"
australia.31.a:0	 "Ein Weg nach vorne "
australia.32.t:0	 "Explosion im Kohlebergwerk Wonthaggi "
australia.32.d:0	 "Es wird befürchtet, dass im Schacht Nr. 20 der State Coal Mine in Wonthaggi nach einer schrecklichen Explosion, die die schlimmste Kohlengrubenkatastrophe in der Geschichte von Victoria verursachte, 13 Menschen ums Leben kamen. Aufgrund der Da die im Schacht angetroffenen Kohlenmonoxiddämpfe tödlich sind, ist die Hoffnung, dass einer der Männer lebend gefunden wird, unwahrscheinlich. Gestern Abend haben die Rettungskräfte die Leiche eines der Männer geborgen, die begraben worden war.\nEs wurden herzzerreißende Szenen beobachtet die Grubenmündung, wo Frauen den ganzen Tag standen und hofften, dass sich die tragischen Berichte der Rettungstrupps als unbegründet erweisen würden, während sich mehrere Hundert Männer, die am Morgen das Haus verlassen hatten, um an einer Streikversammlung teilzunehmen, um den Minenschacht drängten und darum bettelten, dies zu dürfen Machen Sie den gefährlichen Abstieg auf der Suche nach ihren begrabenen Gefährten. "
australia.32.a:0	 "Wie tragisch! "
australia.33.t:0	 "Kommunikationskabel zwischen Victoria und Tasmanien fertiggestellt "
austria.1.a:0	"Sicherheit für Österreich"
austria.1.b:0	"Wird der Völkerbund handeln?"
 #################### Austria
austria.2.d:0	"Österreich und Deutschland unterzeichnen einen Vertrag, der Österreichs volle Souveränität festschreibt und es als deutschen Staat anerkennt. Der Pakt, der als wichtiger Schritt auf dem Weg zur Wiedervereinigung Deutschlands angesehen wurde, verpflichtete Österreich auch zu einer Politik, die mit den Interessen Deutschlands übereinstimmt. Im Gegenzug versprach Deutschland, Österreichs Unabhängigkeit und Souveränität zu respektieren. Das Abkommen, das vom österreichischen Bundeskanzler Kurt Schuschnigg und dem deutschen Außenminister Joachim von Ribbentrop unterzeichnet wurde, enthielt eine Bestimmung, wonach jede Regierung die innenpolitischen Verhältnisse der anderen als innerstaatliche Angelegenheit betrachten und weder direkt noch indirekt darauf Einfluss nehmen würde. Das Abkommen wurde von beiden Ländern als wertvoller Beitrag zur friedlichen Entwicklung Europas begrüßt.\n Viele Länder betrachteten das Abkommen jedoch mit Misstrauen, da sie es als möglichen Auftakt zu deutschem Expansionismus ansahen. Die Unterzeichnung des Pakts stieß auf Proteste der Tschechoslowakei, Jugoslawiens und anderer Nationen, die eine Stärkung der deutschen Position in Europa befürchteten."
austria.2.a:0	"Mit Sicherheit vor Deutschland sind wir sicher"
austria.3.t:0	"Österreich bekräftigt weitere Zusammenarbeit mit Deutschland"
austria.3.b:0	"Unser Einfluss wächst"
austria.3.c:0	"Besorgniserregend"
czech.13.t:0	"Russische Luftwaffenmission trifft in Prag ein"
czech.13.d:0	"Im Rahmen des tschechoslowakisch-russischen Beistandsabkommens ist heute die russische Luftwaffenmission in Prag eingetroffen. Dieser Vertrag wurde im Mai letzten Jahres unterzeichnet, und die heutige Ankunft stellt einen konkreten Schritt zu seiner Umsetzung dar. Die Mission besteht aus einem Team russischer Luftwaffenexperten, die eng mit ihren tschechoslowakischen Kollegen zusammenarbeiten werden, um die Fähigkeiten der tschechoslowakischen Luftwaffe weiterzuentwickeln. Der tschechoslowakisch-russische Beistandsvertrag wird als Gegenmaßnahme zu den wachsenden militärischen Ambitionen Nazideutschlands und seiner Verbündeten gesehen. Der Vertrag sieht eine gegenseitige militärische Unterstützung im Falle einer Aggression von außen gegen eines der beiden Länder vor. Mit der Ankunft der russischen Luftwaffenmission hat die Zusammenarbeit zwischen der Tschechoslowakei und Russland im militärischen Bereich eine konkrete Form angenommen. Die Experten beider Länder werden zusammenarbeiten, um die Fähigkeiten der tschechoslowakischen Luftwaffe zu verbessern, die ein wesentlicher Bestandteil des Verteidigungssystems des Landes ist."
 #################### Czechoslovakia
nzl.2.t:0	"Lebensmittelimporte aus Neuseeland"
 #################### New Zealand
nzl.2.a:0	"Gut gemacht, Neuseeland!"
nzl.3.t:0	"Geschwader Nr. 75"
nzl.3.d:0	"Zu Beginn des Krieges leitete Neuseeland 30 Wellington-Bomber und deren Besatzungen ab, die in England auf ihre Auslieferung an die RAF warteten. Sie wurden zur No.75 (NZ) Squadron."
nzl.4.t:0	"Neuseeland und der BCATP"
nzl.5.d:0	"Nach dem Vorbild der British Local Defence Volunteers (später Home Guard) gründeten die Returned Services Association und die Federated Farmers eine Hilfsreserve von Freiwilligen. Die Leitung dieser Reserve wurde bald von der Regierung übernommen. Wir haben eine neue Abteilung, die für die lokale Verteidigung geeignet ist."
nzl.6.t:0	"Wiederaufbereitung von geborgener Ausrüstung"
nzl.6.d:0	"Der Krieg fordert seinen Tribut an die Ausrüstung. Wir haben eine Vielzahl von verlassenen und/oder beschädigten Ausrüstungsgegenständen aus den letzten Schlachten "erworben". Diese wurde mit bescheidenem Aufwand instand gesetzt. Alle unangenehmen Markierungen wurden sorgfältig übermalt."
nzl.6.a:0	"Sie werden sie nicht vermissen."
nzl.7.d:0	"Neuseeland hat sich bereit erklärt, für unsere Streitkräfte im Pazifik kleinere Boote wie Schlepper, Schleppboote und motorisierte Leichter herzustellen. Das Land hat seine bescheidene Schiffbaukapazität durch die rasche Umschulung anderer Berufe weiter ausgebaut. In der Vergangenheit wurden über 100 Schiffe gebaut."
nzl.8.a:0	"Eine weise Maßnahme"
nzl.9.d:0	"Die Erfordernisse des Krieges machen es erforderlich, dass wir zivile Ressourcen mobilisieren, die nicht bereits für die wesentliche Produktion benötigt werden. Wir können zivile Autos, Lastwagen und Gewehre für unsere Verteidigung requirieren und überholen lassen, wobei eine Entschädigung zu einem späteren Zeitpunkt vorgesehen ist."
nzl.9.a:0	"Ein notwendiger Schritt"
nzl.10.t:0	"Die neuseeländische Armee"
nzl.10.a:0	"Sehr gut"
 ##### Belgium ""
belgium.1.d:0	"Im Mai 1940 wurden die Brücken über die Maas gesprengt.  Um die deutschen Truppen am weiteren Vormarsch zu hindern, hatten die Belgier beschlossen, alle Brücken über den Fluss zu zerstören."
belgium.1.a:0	"Nun gut."
belgium.1.b:0	"Vielleicht ist das keine so gute Idee."
 ##### Belgium
belgium.2.d:0	"Vertreter der Streitkräfte Belgiens, Großbritanniens und Frankreichs haben in London Gespräche über die militärische Koordinierung und Planung abgeschlossen. Die Gespräche waren eine Fortsetzung von Gesprächen, die Anfang des Monats stattfanden, und konzentrierten sich wahrscheinlich auf gemeinsame militärische Strategien und die gemeinsame Nutzung von Informationen und Ressourcen. Die drei Länder waren wichtige Verbündete bei den Bemühungen, die Ausbreitung der Nazis einzudämmen und den Frieden auf dem Kontinent zu erhalten. Die Gespräche in London sollen die Zusammenarbeit zwischen den drei Nationen angesichts der zunehmenden Spannungen verstärken und könnten zur Bildung einer breiteren Anti-Nazi-Allianz beitragen. Die Gespräche fanden in einer herzlichen Atmosphäre statt, und die Vertreter der drei Länder bekundeten ihre Entschlossenheit, zusammenzuarbeiten, um die Sicherheit ihrer jeweiligen Länder zu gewährleisten.\nDas Ergebnis dieser Gespräche bleibt abzuwarten, aber viele hoffen, dass sie dazu beitragen werden, Vertrauen und Zusammenarbeit zwischen den Ländern aufzubauen und den Weg für stärkere gemeinsame militärische Anstrengungen in der Zukunft zu ebnen."
belgium.3.a:0	"Unsere Sicherheit ist unsere eigene"
belgium.3.c:0	"Meister ihres eigenen Schicksals"
 ##### Chile ""
chile.1.t:0	"Chile unterstützt Italien"
chile.1.a:0	"Sie haben unsere Unterstützung"
 ##### Chile
chile.2.d:	"Am 5. September 1938 gegen 12:30 Uhr besetzten etwa 30 bewaffnete Nazi-Jugendliche (Nacistas), die der nationalsozialistischen Bewegung nahestanden, das Gebäude des Seguro Obrero. José Luis Salazar, ein Carabinero (uniformierter Polizist), der Wache hielt, kam bei der Beobachtung der Situation zu dem Schluss, dass die Nazis Waffen unter ihren Mänteln versteckten, und bereitete sich auf eine Reaktion vor. Ein Mitglied der Nazi-Bewegung, das die Reaktion des Soldaten beobachtete, begann jedoch zu schießen und verletzte Salazar tödlich.\nAls Reaktion darauf versammelte sich kurze Zeit später eine Menge Carabineros am Fuße des Gebäudes. Es begannen heftige Schüsse zwischen den gegnerischen Seiten. Gerald Gallmeyer, ein Nazi-Jugendlicher, wurde getötet. Seine Begleiter leisteten Widerstand, doch die Streitkräfte der Carabineros zwangen sie zum Rückzug.\nIn der Zwischenzeit hatten weitere 32 Jugendliche das Zentralgebäude der Universität von Chile besetzt. Dies gipfelte auch in einer Schießerei, die um 02:00 Uhr begann, als ein Angriff der Carabineros Mitglieder der nationalsozialistischen Gruppe überraschte; Diejenigen, die kapitulierten, wurden mit erhobenen Händen zum Seguro Obrero ein paar Blocks entfernt geführt. Dort wurde ihnen mitgeteilt, dass der Putschversuch bereits gescheitert sei, und sie wurden losgeschickt, um ihre Gefährten davon zu überzeugen, die Waffen niederzulegen, unter der Bedingung, dass ihr Leben respektiert würde. Die Nazi-Aktivisten akzeptierten das Versprechen und ergaben sich.\nObwohl sie entwaffnet und gefangen genommen wurden, wurden fast 60 der Nazis an einer Wand aufgereiht und erschossen und brachen damit das Versprechen, ihr Leben zu respektieren. Nur vier Jugendlichen gelang es, dem Tod zu entkommen. Die Leichen waren im Gesicht und am Körper durch tiefe Wunden durch Säbel und Bajonette entstellt."
chile.2.b:	"Verstörend"
 ##### Canada ""
