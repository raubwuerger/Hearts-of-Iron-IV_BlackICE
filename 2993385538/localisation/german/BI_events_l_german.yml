kmt.13.b_tt:0	"§RMay lead to war with [CHI.GetName]§!"
kmt.14.t:0	"Neuziehung abgelehnt"
kmt.14.d_1:0	"[RAJ.GetName] hat unseren Vorschlag, die McMahon-Linie neu zu ziehen, abgelehnt. Sie bestehen darauf, dass die Linie unverändert bleiben muss."
kmt.15.a_1:0	"Wir möchten den Frieden zwischen uns bewahren."
kmt.15.b_1:0	"Wie können diese Barbaren es wagen, diese Forderung zu stellen. Taiwan gehört uns durch das Recht der Eroberung!"
kmt.15.b_2:0	"Vielleicht haben sie die Insel in der Vergangenheit beherrscht, aber jetzt beherrschen wir sie!"
kmt.16.t:0	"Taiwan zurückgegeben"
kmt.16.d:0	"Taiwan ist an das chinesische Volk zurückgegeben worden. Unsere Bürger feiern ihre Rückkehr."
kmt.16.a:0	"Das beste Ergebnis, das wir uns erhoffen konnten."
kmt.17.d:0	"Sie haben unseren Antrag auf Rückgabe dessen, was uns rechtmäßig gehört, abgelehnt. Ihre Tyrannei ist sonnenklar."
kmt.17.a:0	"Wir werden sie niederschlagen!"
kmt.18.t:0	"Ruft den Westen um Hilfe an"
kmt.18.d:0	"Es ist klar, dass die japanische Aggression nicht aufhören wird, obwohl sie die Bedingungen des Neun-Mächte-Vertrages nicht einhält. Wir werden alle Unterzeichner des Vertrages und unsere Freunde in Deutschland auffordern, sich zu einer Konferenz in Brüssel zu treffen, um ein Ende dieses Konfliktes zu finden."
kmt.18.a:0	"Vertrauen Sie auf den Westen!"
kmt.19.t:0	"Chiang Kai-shek bittet um Vermittlung:"
kmt.19.d:0	"Chiang Kai-shek hat darum gebeten, dass die Unterzeichner des Neun-Mächte-Vertrages zu einer Konferenz nach Brüssel einberufen werden, um über "friedliche Mittel" zur Beendigung des erneut ausgebrochenen Konflikts zwischen China und Japan zu beraten. Diese Konferenz wird in Übereinstimmung mit einer Bestimmung des Neun-Mächte-Vertrags von 1922 abgehalten. Sie wird in Brüssel, Belgien, abgehalten. Obwohl China den Neun-Mächte-Vertrag nicht unterzeichnet hat, hat es auch Deutschland als langjährigen Freund zur Teilnahme eingeladen."
kmt.19.a:0	"Dies wird China nur stärken"
kmt.19.b:0	"Der Frieden zwischen China und Japan ist sicherlich eine gute Sache"
kmt.19.f:0	"Nein, wir werden damit umgehen, wie wir es für richtig halten."
kmt.21.a:0	"Ein Verbündeter im Osten, warum nicht?"
kmt.21.b:0	"Im Moment nicht"
kmt.22.t:0	"[ENG.GetName] Akzeptiert"
kmt.22.d:0	"[ENG.GetName] hat uns erlaubt, den Verbündeten beizutreten. Wir sind jetzt vereint in der Sache der Freiheit."
kmt.22.a:0	"Die demokratische Welt ist jetzt stärker."
kmt.23.t:0	"[ENG.GetName] Abgelehnt"
kmt.23.a:0	"Arrogante Narren! Vielleicht sehen sie später den Fehler ihres Handelns ein."
kmt.26.t:0	"Entzug der Fraktionsmitgliedschaft"
kmt.28.b:0	"Wir werden sie dann aus unserer Fraktion ausschließen."
kmt.28.c:0	"Wir werden diesen Akt der Usurpation nicht dulden."
kmt.29.d_1:0	"Unser ehemaliger Fraktionsführer hat beschlossen, uns aufgrund der Informationen aus einigen geheimen Dokumenten aus seiner Fraktion auszuschließen. Es scheint, dass es unseren Feinden gelungen ist, uns zu isolieren."
kmt.29.d_2:0	"Unser ehemaliger Fraktionsvorsitzender hat beschlossen, uns aus seiner Fraktion auszuschließen und uns auf der Grundlage von Geheimdokumenten den Krieg zu erklären. Es scheint, dass es unseren Feinden gelungen ist, uns zu isolieren."
kmt.29.a:0	"Wir müssen uns jetzt auf uns selbst verlassen."
kmt.31.d_1:0	"Unser ehemaliger Fraktionsführer hat beschlossen, uns aufgrund der Informationen aus einigen geheimen Dokumenten aus seiner Fraktion auszuschließen. Es scheint, dass es unseren Feinden gelungen ist, uns zu isolieren."
kmt.31.a:0	"Wir müssen uns jetzt auf uns selbst verlassen."
kmt.32.t:0	"Die Hundert-Blumen-Kampagne beginnt"
kmt.32.d:0	"Die Hundert-Blumen-Kampagne ist in Gang gesetzt worden. Jetzt müssen wir nur noch darauf warten, dass sich die rechten Schweine zeigen."
kmt.32.a:0	"Lasst hundert Blumen blühen, damit wir sie pflücken können."
kmt.33.t:0	"Fortschritte der Kampagne"
kmt.33.a:0	"Wir werden diese rechten Schweine jetzt verhaften."
kmt.33.b:0	"Wir sollten mehr von ihnen herauslocken."
kmt.34.t:0	"Mehr Kritik aus dem Volk"
kmt.34.d:0	"Je länger der Wahlkampf andauert, desto mehr Kritik wird an der Regierung geübt. Das wird nur noch schlimmer werden, wenn wir nicht bald die Peitsche schwingen."
kmt.34.a:0	"Wir werden den dissidenten Abschaum ins Gefängnis werfen."
kmt.34.b:0	"Wir müssen geduldig sein."
KMT_baihua_stage_2_tt:0	"Immer mehr Rechte reihen sich in die Reihen der Kritiker ein"
kmt.35.t:0	"Die Kritik wird immer radikaler"
kmt.35.d:0	"Am Anfang war die Kritik noch mild. Doch mit der Zeit werden immer extremere Stimmen laut, die zum Handeln auffordern. Wenn wir nicht bald handeln, könnten wir es mit einer Konterrevolution zu tun haben."
KMT_baihua_stage_3_tt:0	"Die Kritik wird immer extremer"
kmt.36.b:0	"Wir haben fast alle Bastarde, nur noch ein paar Wochen, und wir können alle ihre Köpfe mit einem Schlag abschlagen!"
KMT_baihua_stage_4_tt:0	"Die Menschen beginnen, den Glauben an den Kommunismus zu verlieren"
kmt.37.t:0	"Am Rande des Zusammenbruchs"
kmt.37.d:0	"Das Ausmaß und die Menge der verbalen Angriffe auf die Regierung sind unerträglich geworden. Um die Arbeiter- und Bauernrevolution zu sichern, müssen wir jetzt alle Unruhestifter verhaften!"
kmt.37.a:0	"Um der Partei willen müssen wir jeder Opposition ein Ende setzen. Unverzüglich."
baihua_end_now:0	"Die Kampagne wird jetzt enden.\n"
kmt.39.d:0	"Der Große Sprung nach vorn hat begonnen. Bald werden wir einen totalen und wissenschaftlichen Kommunismus erreichen!"
kmt.42.d:0	"Die chinesische Regierung hat unsere Industrieberater eingesetzt und Teams unter deutscher Leitung mit der Suche nach neuen Rohstoffvorkommen beauftragt."
kmt.45.b:0	"Wenn China allein dasteht, dann soll es so sein"
kmt.45.c:0	"Wir haben bei unseren Bemühungen, China zu schützen, versagt."
kmt.45.e:0	"Sie können der großen Nation Japan keinen Frieden aufzwingen"
kmt.46.t:0	"Der Große Sprung nach vorn ist rückwärts gelandet"
kmt.46.d:0	"Nach einem Parteitag hat der Vorsitzende Mao mit großem Bedauern beschlossen, den Großen Sprung nach vorn zu beenden. Die Leichen verhungerter Bauern und Roheisenreste liegen auf dem Lande. Es stellt sich heraus, dass man in seinem Hinterhof doch keinen Stahl herstellen kann."
kmt.48.a:0	"Vereint stehen wir!"
kmt.49.t:0	"China will der Komintern beitreten."
kmt.49.d:0	"Unsere Kameraden in der KPCh haben große Fortschritte gemacht. Sie sind wirklich bereit, sich der Weltrevolution ernsthaft anzuschließen."
kmt.49.a:0	"Eine willkommene Ergänzung."
kmt.49.b:0	"Nein! Dieser Mao ist ein linker Opportunist!"
