 ## 22/8/2016 ## "[SOV.GetName] Intervention"
kmt.157.t:0	"[SOV.GetName] Intervention"
kmt.157.d_2:0	"[SOV.GetName] hat sich in das Handelshafenproblem eingemischt, das wir mit [CHI.GetName] haben. Sie behaupten, dass sich der Handel zwischen uns verbessern wird, wenn wir zustimmen, die Handelshäfen an China zurückzugeben. "
kmt.157.b_1:0	"Die Komintern ist ein verrottetes Höllenloch, wir werden ihnen nicht folgen!"
kmt.158.d:0	"[CHI.GetName] hat Probleme mit den Handelshäfen, die sie in den ungleichen Verträgen, die von der zerfallenden Qing-Dynastie unterzeichnet wurden, der westlichen Welt zugestanden haben. Sie bitten uns um unsere Präsenz in diesen Angelegenheiten, damit sie ihre Interessen schützen können."
kmt.161.t:0	"[From.GetName] verweigert"
kmt.161.d:0	"Trotz unserer Anwesenheit weigert sich [From.GetName] immer noch, den Handelshafen an China zurückzugeben, das ist verachtenswert!"
kmt.162.t:0	"[From.GetName] Verweigert"
kmt.162.d:0	"Trotz der Anwesenheit von [SOV.GetName] weigern sich [From.GetName] immer noch, den Handelshafen an uns zurückzugeben, das ist verachtend!"
kmt.162.a:0	"Wir werden sie begraben!"
 ## 22/8/2016 ##
kmt.179.t:0	"Verbesserte Industrie"
kmt_incompetent_indus_tt:0	"Senken Sie die Strafe von §YInkompetente Industrie§!\nFügen Sie freie Bauplätze in jedem Staat hinzu."
kmt.179.a:0	"Bald wird unsere industrielle Macht eine der stärksten sein!"
kmt.183.t:0	"Das Schicksal von Ma Bufang"
kmt.183.d:0	"Dieser islamische Kriegsherr ist gefangen genommen worden, nachdem seine Clique besiegt wurde. Jetzt müssen wir über sein Schicksal entscheiden."
kmt.185.t:0	"Die japanische Bedrohung"
kmt.185.d:0	"Die Japaner haben eine Offensive gestartet, während wir noch mit der internen Bedrohung beschäftigt sind! Sollten wir unsere Waffen gegen unsere chinesischen Landsleute niederlegen und sie auf die imperialistischen Invasoren richten?"
kmt.185.a:0	"Unsere Nation befindet sich in einer verzweifelten Lage!"
kmt.185.b:0	"Die innere Stabilität ist noch wichtiger."
kmt.186.t:0	"Kuomintang strebt nach Frieden"
kmt.186.d:0	"Angesichts der japanischen Invasion hat [From.GetLeader] beschlossen, [Root.GetLeader] zu einem Friedensgespräch einzuladen, damit sie sich stattdessen auf den japanischen Invasor konzentrieren können."
kmt.186.a:0	"Es wird Frieden zwischen uns herrschen, aber wir werden uns ihrem Krieg nicht anschließen."
kmt.186.b:0	"Schließlich sind wir alle Chinesen..."
kmt.186.c:0	"Es wird keinen Frieden zwischen uns geben!"
kmt.187.d_1:0	"[From.GetLeader] hat sich auf einen weißen Frieden geeinigt, jetzt können wir uns mehr auf die japanischen Invasoren konzentrieren."
kmt.188.d:0	"[From.GetLeader] hat sich geweigert, Frieden zwischen uns zu schließen, [Root.GetLeader] ist empört."
kmt.188.a:0	"Sie sollen ausgelöscht werden!"
kmt.189.t:0	"[From.GetName] will an unserer Seite kämpfen"
kmt.189.d:0	"[From.GetLeader] ist über die Handlungen von [CHI.GetLeader] empört und hat beschlossen, ihm zusammen mit uns eine Lektion zu erteilen."
kmt.189.a:0	"Die Große Ostasiatische Ko-Wohlstandssphäre wächst!"
kmt.189.b:0	"Menschen, die ihre Nation verraten, haben keine Ehre!"
kmt.190.d:0	"[JAO.GetName] hat unser Angebot angenommen, und nun werden wir [CHI.GetName] von seinem Platz herunterholen!"
kmt.191.d:0	"[JAP.GetName] hat unseren Vorschlag abgelehnt und unsere Tat mit der Begründung verurteilt, dass [Root.GetLeader] keine Ehre hat."
kmt.192.d:0	"[From.GetLeader] hat sich den Japanern angeschlossen und ist in chinesisches Gebiet eingedrungen!"
kmt.196.t:0	"Sinkiang unter Kontrolle"
kmt.196.d:0	"Nach der Rebellion des Volkes von Sinkiang kommt Sinkiang endlich unter unsere Herrschaft."
 ## 5/9/2016 ## "[CHI.GetName] Verbessert unsere Beziehung"
kmt.197.t:0	"[CHI.GetName] Verbessert unsere Beziehung"
kmt.197.d:0	"[CHI.GetLeader] versucht, unsere Beziehungen zu verbessern, indem er auf seine Ansprüche auf Tibet verzichtet. Unsere Beamten warnten vor Schwindeleien und Tricks, aber eine solche Entscheidung sollte schließlich von [TIB.GetLeader] selbst getroffen werden."
kmt.198.a:0	"Niemand will Blutvergießen"
kmt.199.d:0	"[TIB.GetLeader] hat beschlossen, dass [Root.GetRulingParty] sie zu Größe führen wird, und übergibt ihre politischen Angelegenheiten an uns."
kmt.199.a:0	"Wir werden sie nicht enttäuschen"
kmt.200.d:0	"[TIB.GetLeader] hat als Zeichen der Freundschaft beschlossen, dass sie Sikang nicht länger als ihren Kernstaat beanspruchen wird."
kmt.200.a:0	"Gegenseitiger Respekt ist das Wichtigste"
kmt.201.d:0	"[TIB.GetLeader] sind der Meinung, dass unsere Freundschaftsbekundung nichts weiter als armselige Tricks sind, und lehnen weitere Diskussionen zu diesem Thema ab. "
kmt.201.a:0	"Warum können sie keine Gründe sehen!"
 ## 6/9/2016 ## "Der Bürgerkrieg ist vorbei"
kmt.202.t:0	"Der Bürgerkrieg ist vorbei"
kmt.202.a:0	"Jetzt werden wir Verbündete in der ganzen Welt suchen."
