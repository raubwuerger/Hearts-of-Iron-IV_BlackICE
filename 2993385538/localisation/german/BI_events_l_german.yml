italy.20.t:0	"Eine Chance für den Frieden"
italy.20.desc:0	"Nachdem Jugoslawien unter unserer Militärmacht zusammengebrochen ist, müssen wir uns nun der Tschechoslowakei zuwenden. Wir können weiter kämpfen und versuchen, noch mehr Territorium zu erobern, aber ohne nennenswerte Erfolge auf dem Schlachtfeld werden wir politisch leiden. Vielleicht ist es an der Zeit, den Tschechen Frieden anzubieten, damit wir unser neu erworbenes Gebiet konsolidieren können? Sie werden aber vielleicht nicht annehmen, wenn sie das Gefühl haben, dass sie den Krieg gewinnen."
italy.20.a:0	"Frieden anbieten"
italy.20.b:0	"Kämpfen Sie weiter!"
italy.21.t:0	"Eine Chance für den Frieden"
italy.21.desc:0	"Die Italiener haben ein Angebot für einen weißen Frieden unterbreitet. Unsere jugoslawischen Verbündeten sind fast am Ende, wenn nicht sogar schon, und es ist ungewiss, ob wir diesen Krieg gewinnen können. Sollen wir angesichts der derzeitigen Frontlinien und militärischen Möglichkeiten dieses Angebot annehmen oder weiter nach Rom vordringen?"
italy.21.a:0	"Das Friedensangebot annehmen"
italy.22.t:0	"Die Tschechen nehmen an!"
italy.22.desc:0	"Die Tschechen haben unsere Bedingungen gnädig angenommen, ohne Zugeständnisse auf beiden Seiten. Jetzt können wir unsere Forderungen gegen Jugoslawien in vollem Umfang und ohne jegliche Einmischung durchsetzen!"
