BICE_STARTUP_EQUIPMENT_UPDATE_DESC:0	"Wir haben die Ausbildungszeit für Panzer vereinheitlicht. Grille wurde auf den Pz38(t) verlegt. Es wurden einige kleinere Anpassungen an den Werten der Panzer vorgenommen. Mehrere Ereignisse für GER wurden überarbeitet bzw. korrigiert, z. B. für die 24. Pz-Div, 72. Inf-Div, 13. Pz-Div. Mehrere Fehler bei der Ausrüstung für Feldlazarett, Wartungsunterstützung und Mot-Signal behoben. Ausbildungszeit für Linien-Panzerabwehrgeschütze verkürzt. Den Coelian durch den Wirbelwing für die Pzgren-Div Gross-Deutschland ersetzt. Sherman-Firefly-Ereignisse korrigiert. Transportdefinition zu Panzerbataillonen hinzugefügt. Start-Einheitsvorlagen für SOV geändert."
