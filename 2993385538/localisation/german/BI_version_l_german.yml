 BI_SOV_MM_TITLE:0 "Glory of Communism"##### NOT TRANSLATED #####
 BI_SOV_MM_DESC:0 "Peace. After years in the Great War and the subsequent liberation struggle against imperialism, it has returned to our beloved Soviet Union under its great leader Josef W. Stalin.\n\nThe collectivisation of industry and agriculture has led to an undreamt-of boom in our country and its productivity. For some years now we have even been able to export large quantities of grain. Rumours that our people are starving because of this are nothing but anti-Soviet propaganda and will be rooted out!\n\nIn fact, we are surrounded by enemies and false friends. You remember how the Great War originated. It arose out of the desire to re-divide the world. Today we have the same background. There are capitalist states which consider that they were cheated in the previous redistribution of spheres of influence, territories, sources of raw materials, markets, and so on, and which would want another redivision that would be in their favour. Capitalism, in its imperialist phase, is a system which considers war to be a legitimate instrument for settling international disputes.\n\nJapan in the East, which is at this very moment gathering troops at the Mongolian border. Germany and Poland in the West, working together against our country and already plotting the next war. France, Great Britain and the USA, who have landed on our shores only a short time ago and killed our citizens.\n\nNot to forget all the enemies in our own country who are diminishing, betraying and selling out our great achievements. These enemies of the people must be fought with determination! \n\nThe next years will decide which of the systems will dominate the world for the next hundred years - and we have no doubt that communism will emerge victorious from this struggle!"##### NOT TRANSLATED #####

 BI_FRA_MM_TITLE:0 "Liberté, égalité, fraternité"##### NOT TRANSLATED #####
 BI_FRA_MM_DESC:0 "La Grande Nation - the synonym for the French Republic and also an apt description for the nation itself. Not only did we defeat our arch-enemy in the Great War and wipe out the disgrace of 1870/71, but it was then that our return to great power status took place.\n\nSince then, the Treaty of Versailles has guaranteed a secure and peaceful Europe under French supremacy. We were also largely spared the world economic crisis after 1929 - of course, this is also proof of the strength of this third republic.\n\nAgainst Germany we are now also protected by the mighty Maginot Line, an impenetrable bulwark of French engineering ingenuity. Our armies, the air force and a strong navy assert French interests in Europe and our colonies. \n\nOne might think that everything is for the best. Not quite. After the relative political calm since the Great War, two years ago there was the February crisis, anti-parliamentary street demonstrations and riots that ended with the deaths of at least 15 demonstrators. Since then we have had to deal not only with the Nazis in Germany, but also with a radicalised right in our own country.\n\nAdded to this is the sluggishness and complacency of the generals, outdated technology and an antiquated military doctrine. Relations with our natural allies have also fallen asleep in recent years and are threatening to cool down.\n\nWhere will you lead the Grande Nation? To old, perhaps even new heights? Or into the abyss of history, into oblivion?\n\nVive la France!"##### NOT TRANSLATED #####

