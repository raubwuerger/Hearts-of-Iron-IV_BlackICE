BI_GER_MM_TITLE:0	"Deutschland am Scheideweg"
BI_GER_MM_DESC:0	"Es ist der 1. Januar 1936.\n\n In zwei Jahren jährt sich zum 20. Mal die Schande der Niederlage im Ersten Weltkrieg. Zwanzig Jahre alleinige Schuld an einem von außen aufgezwungenen Krieg, der zur Verteidigung des Reiches geführt wurde! \n\nNach der Niederlage im Jahr 1918 stürzte das Deutsche Reich in eine instabile Demokratie, die sogenannte Weimarer Republik. So begannen die 20er Jahre mit einem Putsch (Kapp-Putsch), der die junge Demokratie, die bereits am Rande des Zusammenbruchs stand, an den Rand des Abgrunds führte – was nur durch den größten Generalstreik in der deutschen Geschichte abgewendet werden konnte. Schließlich machte sich 1923 ein gewisser Adolf Hitler daran, mit einem eigenen Putsch die Macht im Land zu übernehmen – und scheiterte kläglich. \n\nDie darauf folgende Zeit ist heute als die "Goldenen Zwanziger" bekannt – eine Zeit der Unbeschwertheit, des wirtschaftlichen Aufschwungs und der künstlerischen und kulturellen Blüte. Das Kino, große Feste und extravagante Mode begeisterten die Massen und ließen den verlorenen Krieg für viele fast in Vergessenheit geraten. Dann kam 1929 die Weltwirtschaftskrise. \n\nAll die Ängste, Sorgen und Nöte, die erdrückenden Reparationsforderungen der Siegermächte des Ersten Weltkriegs rückten mit Macht wieder auf die deutsche Tagesordnung. Auch die Unterlegenheit des von den USA dominierten kapitalistischen Systems war für alle Deutschen offensichtlich. \n\nDer Sturz der jungen Weimarer Republik im Jahr 1933 und die Wahl Adolf Hitlers zum Reichskanzler waren nur logisch. Während die anderen politischen Parteien durch Streit und Zwistigkeiten auffielen, bot die NSDAP einfache Lösungen für schwierige Fragen. \n\nUnd tatsächlich laufen die Dinge in Deutschland seit nunmehr drei Jahren anders. Man spürt das allgegenwärtige Erwachen und die Hoffnung auf ein neues Zeitalter. In dieser kurzen Zeit hat der Reichskanzler Deutschland zur Vollbeschäftigung geführt und die Fesseln des Versailler Vertrags fast vollständig abgeworfen. \n\nWir stehen vor einer neuen Epoche. Der Epoche des Tausendjährigen Reichs. In nicht allzu ferner Zukunft werden Luftschiffe Deutschland mit dem Rest der Welt verbinden. Züge werden mit über 200 km/h ihrem Ziel entgegenrasen. Die im letzten Jahr gegründete deutsche Luftwaffe wird unsere Überlegenheit im militärischen Bereich unter Beweis stellen. Unsere Armee ist nicht mehr die leere Hülle, die sie zuvor war – wir sitzen wieder mit am Tisch, als Weltmacht. \n\nIn weniger als zwei Monaten und später in diesem Jahr werden wir uns der Welt als friedliebende Nation präsentieren können, als Gastgeber sowohl der Winter- als auch der Sommerolympiade.  \n\nFriedliebend. Selbstverständlich. Nur diese kleinen, aber wichtigen Details der noch besetzten deutschen Gebiete müssen geklärt werden. Das besetzte Rheinland – inakzeptabel. Die Gebiete im Osten, besetzt durch den künstlichen Staat Polen – empörend. Und sollten nicht auch alle deutschsprachigen Menschen in einem Staat vereint werden? Werden diejenigen, die in unserem Nachbarstaat ähnlich denken, nicht gerade in diesem Moment schikaniert und bedroht? Was wird aus unseren verlorenen Kolonien? \n\nWer könnte auf unserem Weg zum Ruhm unser Verbündeter sein? Italien mit Mussolini an der Spitze? Kann man ihm wirklich vertrauen? Andererseits wäre er ideologisch gesehen der logische Verbündete. Ungarn? Schließlich war Gyula Gömbös nach der Machtergreifung des Führers der erste ausländische Ministerpräsident auf einem offiziellen Staatsbesuch und hat seitdem diese besondere Beziehung weiter ausgebaut."
BI_ENG_MM_DESC:0	"Das Britische Empire. Allein der Name flößt Respekt ein, und bis heute herrschen wir über weite Landstriche und eine Vielzahl unterschiedlicher Völker, vereint im Commonwealth."\n\nDer Große Krieg traf unsere Nation härter als viele andere, und die anschließende Demobilisierung führte zu Spaltungen innerhalb der Nation. Es folgten Streiks und – im Vergleich zu anderen Ländern – keine "roaring twenties".\n\nUnsere Dominions streben nach immer mehr Unabhängigkeit, und ehemalige Vollkolonien wie Kanada, Südafrika, Australien und Neuseeland sind nun gemäß dem Westminster-Statut von 1931 nicht nur in der Innen-, sondern auch in der Außenpolitik unabhängig. \n\nHinzu kommt die "Große Depression", die uns seit Beginn der 1930er Jahre beschäftigt und für deren Auswirkungen wir bis heute keine wirksame Lösung finden konnten. Die Linke (Labour) und die Rechte (Konservative) streiten sich um die Wahlmodalitäten und haben die Mitte (Liberale) inzwischen völlig zermalmt.\n\nUnser Land steht also vor enormen Herausforderungen – und dabei haben wir noch nicht einmal über unseren eigenen Tellerrand hinausgeschaut. Auf dem Kontinent gewinnt ein alter Feind wieder an Stärke. Nazi-Deutschland wird uns in nicht allzu ferner Zukunft auf die Probe stellen.\n\nWerden die britischen Flotten, die Royal Air Force und die stolzen Soldaten am Boden in der Lage sein, die Freiheit erneut zu verteidigen? Können wir verhindern, dass sich die verbleibenden Kolonien weiter von uns entfernen? Wie entwickelt sich die Geschichte dieses großen Reiches?\n\n"Wem viel gegeben wurde, von dem wird auch viel verlangt"
BI_ITA_MM_DESC:0	"Im Jahr 1915 hatten die Franzosen, Briten und Russen Italien Gebiete versprochen, im Gegenzug für dessen Beitritt zur Sache der Alliierten. Als der Krieg jedoch endete, stand das Prinzip der nationalen Selbstbestimmung den italienischen Bemühungen im Wege, dieses Versprechen einzulösen. Nach dieser weithin akzeptierten Philosophie konnten die Alliierten Italien das versprochene Gebiet nicht gewähren, da es nicht in ihrer Macht stand, es zu vergeben, da der größte Teil des Italien versprochenen Gebiets von Nicht-Italienern bewohnt war. Der italienische Ministerpräsident Vittorio Orlando kehrte am Ende des Ersten Weltkriegs beschämt und mit leeren Händen von der Pariser Friedenskonferenz zurück, ohne etwas vorweisen zu können, das den Opfern der italienischen Kriegsanstrengungen entsprochen hätte. Das italienische Volk wandte sich natürlich gegen Orlandos Regierung sowie gegen die heimkehrenden Veteranen, und beide wurden weithin verachtet. \n\nInmitten des Chaos der frühen Zwischenkriegsjahre gründete Benito Mussolini im März 1919 die faschistische Partei, den Fascio di Combattimento. Die Faschistische Partei, die sich größtenteils aus Kriegsveteranen zusammensetzte, war vehement antikommunistisch und befürwortete die Verherrlichung des Krieges, der ihrer Ansicht nach die Noblesse der italienischen Seele zum Ausdruck brachte. Die Faschisten glaubten, Italien sei dazu bestimmt, den Ruhm Roms wiederzuerlangen. \n\nBei den Wahlen im Mai 1921 wurden 35 Faschisten, darunter Mussolini, in die Abgeordnetenkammer gewählt; sie vertraten etwa 250.000 offizielle Parteimitglieder, die überwiegend aus der unteren Mittelschicht stammten. Die politischen Spannungen zwischen Faschisten und Kommunisten spitzten sich in Italien fast bis zum Bürgerkrieg zu. Faschistische "Schwarzhemden" und kommunistische "Rothemden" lieferten sich häufig Straßenkämpfe. Im Sommer 1922 marschierte die faschistische Armee von Neapel nach Rom, erklärte ihre Treue zum König Viktor Emanuel und zur römisch-katholischen Kirche und behauptete, ihr Ziel sei es, Italien von der liberalen Linken zu befreien. Auch die Kommunisten verfügten über eine eigene Armee, und der König befürchtete offene Gewalt. Um dies zu vermeiden, ernannte er Mussolini am 30. Oktober 1922 zum Ministerpräsidenten. Mussolini setzte seine private Armee, die nun in eine Miliz umgewandelt worden war, ein, um die Kommunalverwaltungen von jeglicher Opposition gegen den Faschismus zu säubern. Er festigte seine Macht unter dem Motto "Alles im Staat, nichts außerhalb des Staates, nichts gegen den Staat." \n\nSeitdem hat "Il Duce" zahlreiche soziale und militärische Reformen mit gemischtem Erfolg durchgeführt. Italien, das sich nach dem Ersten Weltkrieg bereits in einem schlechten Zustand befand, wurde von der Weltwirtschaftskrise schwer getroffen und hat sich bis heute nicht davon erholt. Dennoch stehen die Italiener heute stolz an der Seite ihres großen Führers. Italien gelang es nicht nur, Libyen endgültig zu unterwerfen, sondern im vergangenen Oktober begann es eine groß angelegte Operation gegen Abessinien. Dies soll der erste Schritt zur Wiederbelebung der glorreichen Tage des Römischen Reiches sein!\n\nForza Italia!"
BI_JAP_MM_TITLE:0	"Wohlstand für Asien"
BI_JAP_MM_DESC:0	"Der Aufbau einer starken Armee ist für die Verfolgung der strategischen Interessen Japans unerlässlich. Japan war regelmäßig in Kriege im Ausland und Territorialstreitigkeiten verwickelt, verfolgte im Rahmen seines Bündnisses mit Großbritannien eine expansionistische Politik und strebte nach Gebieten in China, Korea und Sibirien. Nach dem Krieg gegen Russland 1904–1905 verstärkte sich der Nationalismus, was eine neue Phase der kontinentalen Expansion auslöste. \n\nJapans Eintritt in den Ersten Weltkrieg war daher eher ein opportunistisches Manöver. Da Japan den Großteil seiner militärischen Aufrüstung bereits in der zweiten Hälfte des 19. Jahrhunderts vorgenommen hatte, beschränkte sich das Engagement des Landes auf den Krieg mit Deutschland um chinesische Gebiete und war nicht sehr kostspielig. Als Teil der siegreichen Alliierten ermöglichte dies Japan jedoch, seinen Einfluss in Asien und im Pazifikraum auszubauen. Gegen Ende des Krieges erfüllte Japan zunehmend Aufträge seiner europäischen Verbündeten, was die industrielle Diversifizierung des Landes förderte und Japan erstmals zu einem Nettoexporteur von Waren machte.\n\nDie Nachkriegszeit bescherte Japan unmittelbar nach Kriegsende einen beispiellosen Wohlstand. Im Jahr 1918 war Japan nach den USA das zweitgrößte Gläubigerland der Welt. Es nahm 1919 als eine der großen internationalen Militär- und Industriemächte an der Pariser Friedenskonferenz teil und wurde in den ausgewählten Kreis der ständigen Mitglieder des Rates des Völkerbundes aufgenommen. Diese Anerkennung brachte erhebliche wirtschaftliche Vorteile mit sich.\n\nDie wirtschaftlichen Folgen der weltweiten Depression und die Aufwertung des Yen im Zusammenhang mit der Rückkehr zum Goldstandard waren jedoch erheblich. In den Jahren 1930 und 1931 kam es zu einer heftigen Deflation und einem starken Rückgang der Wirtschaftstätigkeit – der Shōwa-Depression. Zwanzig terroristische Anschläge, vier Putschversuche und vier politische Attentate allein seit 1930 zeugen von einem Land am Abgrund und markieren den Verfall der zivilen Autorität und damit auch der strukturellen Integrität der staatlichen Machtstruktur Tokios. \n\nObwohl sich Japan viel schneller als andere Großmächte von den Auswirkungen der Weltwirtschaftskrise erholte, ist die derzeitige Unsicherheit darüber, in welche Richtung das Land steuern wird, enorm. \n "Asien den Asiaten"? Oder wird es "Frieden und Wohlstand für alle" sein? \n\nDie zunehmenden Spannungen mit den Kriegsherren in China sowie mit dem alten Feind im Norden, der nun Sowjetunion heißt, lassen wenig Hoffnung auf ein friedliches nächstes Jahrzehnt. Und dann sind da noch die Vereinigten Staaten, die Japan seit der Eroberung der Mandschurei im Jahr 1931 zunehmend kühl gegenüberstehen..."
