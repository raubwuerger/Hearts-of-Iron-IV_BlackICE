BI_SOV_MM_TITLE:0	"Ruhm des Kommunismus"
BI_SOV_MM_DESC:0	"Frieden. Nach Jahren des Großen Krieges und des anschließenden Befreiungskampfes gegen den Imperialismus ist er in unsere geliebte Sowjetunion unter ihrem großen Führer Josef W. Stalin zurückgekehrt.\n\nDie Kollektivierung von Industrie und Landwirtschaft hat zu einem ungeahnten Aufschwung in unserem Land und zu einer Steigerung der Produktivität geführt. Seit einigen Jahren sind wir sogar in der Lage, große Mengen Getreide zu exportieren. Gerüchte, dass unser Volk deswegen hungert, sind nichts als antisowjetische Propaganda und werden ausgerottet!\n\nTatsächlich sind wir von Feinden und falschen Freunden umgeben. Sie erinnern sich, wie der Große Krieg entstand. Er entstand aus dem Wunsch heraus, die Welt neu aufzuteilen. Heute haben wir denselben Hintergrund. Es gibt kapitalistische Staaten, die der Ansicht sind, bei der vorherigen Neuaufteilung von Einflusssphären, Territorien, Rohstoffquellen, Märkten und so weiter übervorteilt worden zu sein, und die eine weitere Neuaufteilung wünschen, die zu ihren Gunsten ausfällt. Der Kapitalismus in seiner imperialistischen Phase ist ein System, das Krieg als legitimes Instrument zur Beilegung internationaler Streitigkeiten betrachtet.\n\nJapan im Osten, das gerade in diesem Moment Truppen an der mongolischen Grenze zusammenzieht. Deutschland und Polen im Westen, die gemeinsam gegen unser Land vorgehen und bereits den nächsten Krieg planen. Frankreich, Großbritannien und die USA, die erst vor kurzem an unseren Küsten gelandet sind und unsere Bürger getötet haben.\n\nNicht zu vergessen all die Feinde in unserem eigenen Land, die unsere großen Errungenschaften schmälern, verraten und verschleudern. Diese Feinde des Volkes müssen entschlossen bekämpft werden! \n\nDie nächsten Jahre werden entscheiden, welches der Systeme die Welt für die nächsten hundert Jahre beherrschen wird – und wir haben keinen Zweifel daran, dass der Kommunismus als Sieger aus diesem Kampf hervorgehen wird!"
BI_FRA_MM_TITLE:0	"Liberté, égalité, fraternité"
BI_FRA_MM_DESC:0	"La Grande Nation – das Synonym für die Französische Republik und zugleich eine treffende Beschreibung der Nation selbst. Wir haben nicht nur unseren Erzfeind im Ersten Weltkrieg besiegt und die Schmach von 1870/71 getilgt, sondern damals fand auch unsere Rückkehr zum Status einer Großmacht statt.\n\nSeitdem garantiert der Vertrag von Versailles ein sicheres und friedliches Europa unter französischer Vorherrschaft. Auch von der Weltwirtschaftskrise nach 1929 blieben wir weitgehend verschont – natürlich ist dies ebenfalls ein Beweis für die Stärke dieser Dritten Republik.\n\nGegen Deutschland sind wir nun zudem durch die mächtige Maginot-Linie geschützt, ein undurchdringliches Bollwerk französischen Ingenieursgenies. Unsere Armeen, die Luftwaffe und eine starke Marine setzen die französischen Interessen in Europa und unseren Kolonien durch. \n\nMan könnte meinen, alles sei zum Besten. Nicht ganz. Nach der relativen politischen Ruhe seit dem Ersten Weltkrieg kam es vor zwei Jahren zur Februar-Krise, zu antiparlamentarischen Straßendemonstrationen und Unruhen, die mit dem Tod von mindestens 15 Demonstranten endeten. Seitdem müssen wir uns nicht nur mit den Nazis in Deutschland auseinandersetzen, sondern auch mit einer radikalisierten Rechten in unserem eigenen Land.\n\nHinzu kommen die Trägheit und Selbstgefälligkeit der Generäle, veraltete Technologie und eine überholte Militärdoktrin. Auch die Beziehungen zu unseren natürlichen Verbündeten sind in den letzten Jahren eingeschlafen und drohen abzukühlen.\n\nWohin werden Sie die Grande Nation führen? Zu alten, vielleicht sogar neuen Höhen? Oder in den Abgrund der Geschichte, in die Vergessenheit?\n\nVive la France!"|"
