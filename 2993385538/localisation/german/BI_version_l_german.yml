 BI_USA_MM_TITLE:0 "The American Way of Life"##### NOT TRANSLATED #####
 BI_USA_MM_DESC:0 "The American Dream, it has taken a massive hit lately. \n\nAfter the Great War, our nation was left disillusioned. The horrible experiences of the war participants, but also the disappointment that the world has not become permanently \"safe for democracy\", led our people to the conviction that in the future - as in the 19th century - it would be better to stay out of the rivalries of the \"old world\". International relations are characterized by amorality; wars are due to the machinations of small, selfish elites. The Great Depression reinforced this attitude, since the reformation of our own society requires all attention and strength. \n\nThe Depression has hit us hard indeed. Former president Herbert Hoover was slow to respond to it. Though he believed that the \"crazy and dangerous\" behavior of Wall Street speculators had contributed in a significant way to the crisis, he also believed that solving such problems was not really the federal government’s job. As a result, most of the solutions he suggested were voluntary: He asked state governments to undertake public-works projects; he asked big companies to keep workers’ pay steady and he asked labor unions to stop demanding raises. The shantytowns that were popping up as more and more people lost their homes were nicknamed \"Hoovervilles\" as an insult to the president’s hands-off policies. \n\nBy 1932, many Americans were fed up with Hoover and what Franklin Roosevelt later called his \"hear nothing, see nothing, do nothing government.\" The Democratic presidential candidate, New York governor Franklin Delano Roosevelt, promised a change: \"I pledge myself,\" he said, “to a New Deal for the American people.” This New Deal would use the power of the federal government to try and stop the economy’s downward spiral. Roosevelt won that year’s election handily. \n\nPresident Roosevelt’s early efforts had begun to restore Americans’ confidence, but they had not ended the Depression. Last year, he started launching another, more aggressive, set of federal programs, which we are currently in the middle of. While nobody can say, how fast we will recover, but recover we will! And recover, we must. \n\nThe rise of fascism in Europe and nationalism in Asia as a threat to international peace is sparking concern in the United States. In this environment, keeping the nation out of the brewing tension in Europe and Asia could become an important goal in our foreign policy. Or it could be the opportunity to lead the United States out of its self-imposed isolation. \n\nInteresting times are ahead. Times to shape the history of the nation and the whole planet."##### NOT TRANSLATED #####

