BI_USA_MM_TITLE:0	"Der American Way of Life"
BI_USA_MM_DESC:0	"Der amerikanische Traum hat in letzter Zeit einen schweren Schlag erlitten. \n\nNach dem Großen Krieg war unsere Nation desillusioniert. Die schrecklichen Erfahrungen der Kriegsteilnehmer, aber auch die Enttäuschung darüber, dass die Welt nicht dauerhaft \"sicher für die Demokratie\" geworden ist, führten unser Volk zu der Überzeugung, dass es in Zukunft – wie im 19. Jahrhundert – besser wäre, sich aus den Rivalitäten der \"alten Welt\" herauszuhalten. Die internationalen Beziehungen sind von Amoralität geprägt; Kriege sind auf die Machenschaften kleiner, egoistischer Eliten zurückzuführen. Die Weltwirtschaftskrise verstärkte diese Haltung, da die Reform unserer eigenen Gesellschaft unsere ganze Aufmerksamkeit und Kraft erfordert. \n\nDie Weltwirtschaftskrise hat uns in der Tat hart getroffen. Der ehemalige Präsident Herbert Hoover reagierte nur zögerlich darauf. Obwohl er der Ansicht war, dass das "verrückte und gefährliche" Verhalten der Wall-Street-Spekulanten maßgeblich zur Krise beigetragen hatte, glaubte er auch, dass die Lösung solcher Probleme nicht wirklich Aufgabe der Bundesregierung sei. Infolgedessen waren die meisten seiner Lösungsvorschläge freiwilliger Natur: Er forderte die Regierungen der Bundesstaaten auf, öffentliche Bauprojekte durchzuführen; er forderte große Unternehmen auf, die Löhne der Arbeiter stabil zu halten, und er forderte die Gewerkschaften auf, keine Lohnerhöhungen mehr zu fordern. Die Slumsiedlungen, die entstanden, als immer mehr Menschen ihr Zuhause verloren, wurden als Anspielung auf die Politik der Nichteinmischung des Präsidenten "Hoovervilles" genannt. \n\nBis 1932 hatten viele Amerikaner genug von Hoover und dem, was Franklin Roosevelt später als seine "Regierung, die nichts hört, nichts sieht und nichts tut" bezeichnete. Der demokratische Präsidentschaftskandidat, der Gouverneur von New York, Franklin Delano Roosevelt, versprach einen Wandel: "Ich verpflichte mich", sagte er, "zu einem New Deal für das amerikanische Volk." Dieser New Deal sollte die Macht der Bundesregierung nutzen, um zu versuchen, den wirtschaftlichen Abwärtsstrudel zu stoppen. Roosevelt gewann die Wahl in jenem Jahr mit großem Vorsprung. \n\nPräsident Roosevelts frühe Bemühungen hatten begonnen, das Vertrauen der Amerikaner wiederherzustellen, aber sie hatten die Depression nicht beendet. Im vergangenen Jahr startete er eine weitere, aggressivere Reihe von Bundesprogrammen, in deren Verlauf wir uns derzeit befinden. Niemand kann sagen, wie schnell wir uns erholen werden, aber wir werden uns erholen! Und wir müssen uns erholen. \n\nDer Aufstieg des Faschismus in Europa und des Nationalismus in Asien als Bedrohung für den internationalen Frieden sorgt in den Vereinigten Staaten für Besorgnis. In diesem Umfeld könnte es zu einem wichtigen Ziel unserer Außenpolitik werden, die Nation aus den sich anbahnenden Spannungen in Europa und Asien herauszuhalten. Oder es könnte die Gelegenheit sein, die Vereinigten Staaten aus ihrer selbst auferlegten Isolation herauszuführen. \n\nEs stehen interessante Zeiten bevor. Zeiten, die die Geschichte der Nation und des gesamten Planeten prägen werden."
