SCREENING_TOOLTIP_FOR_CAPITAL_BOX:2	" Ihre $NUM_CARR|.0H$ §YTräger§! und $NUM_CONV|.0H$ §YKonvois§! müssen $NUM_NEED|.0H$ §YGroßkampfschiffe§! vollständig abgeschirmt werden, und Sie verfügen derzeit über $NUM_CAPI|.0H$ §YGroßkampfschiffe§!."
SCREENING_TOOLTIP_NO_SCREENS:1	"Ein Mangel an §YAbdeckungsschiffen§! ermöglicht es feindlichen U-Booten und anderen leichten Schiffen, Ihre Großkampfschiffe mit Torpedos anzugreifen, und führt zu erheblichen Einbußen bei der Positionierung."
SCREENING_BOX_TOOLTIP:0	" Die §YAbdeckungsgruppe§! umfasst alle Abdeckungsschiffe – in der Regel leichte Kreuzer und Zerstörer –, deren Aufgabe es ist, feindliche Abdeckungsschiffe von der Haupt §YKampflinie§! fernzuhalten. Eine unzureichende Abschirmung ermöglicht es feindlichen Abschirmungsschiffen, Torpedoangriffe gegen die §YKampflinie§! durchzuführen."
CARRIER_BOX_TOOLTIP:1	"Die §YTrägergruppe§! stellt die wichtigste Fernkampfkraft der Flotte dar. Geschützt vor dem Feind sowohl durch die §YAbdeckungsgruppe§! als auch durch die §YKampflinie§! können die Flugzeugträger ungestört Angriffe auf den Feind fliegen. Sollten sich §YKonvois§! in der Schlacht befinden, werden diese ebenfalls in diesem Bereich erscheinen."
