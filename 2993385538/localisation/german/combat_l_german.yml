combat_stat_light_guns_info:2	 "§HLeichte Geschütze§!\n\nLeichte Geschütze sind wirksamer gegen §YAbschirmungsschiffe§!. Die leichten Geschütze Ihrer Flotte werden den nächstgelegenen Feind ins Visier nehmen. \n"
combat_stat_heavy_guns_info:2	" §HSchwerkanonen§!\n\nSchwerkanonen sind effektiver gegen §YGroßkampfschiffe§!. Sie können die beiden nächstgelegenen Feindgruppen erreichen und feuern bevorzugt auf größere Ziele.\n"
combat_stat_anti_air:1	"§HFlotten-Luftabwehr §!\n\nDie Flotten-Luftabwehr wird anhand der Luftabwehr aller Schiffe der gesamten Flotte berechnet und stört feindliche Bomber, die die Flotte angreifen, sowie verringert den Schaden, den diese verursachen können.\n"
POSITIONING_INFO:1	"§HPositionierung§! gibt an, wie gut Ihre Flotte im Vergleich zum Feind positioniert ist. Sie wird durch die relative Größe der Flotten, das Wetter und die Fähigkeiten des Anführers beeinflusst. Schiffe, die sich dem Kampf erst nach dessen Beginn anschließen, erhalten einen vorübergehenden Malus auf die Positionierung.\n\nLiegt die Positionierung unter 100 %, erleidet die Flotte Malusse.\n"
