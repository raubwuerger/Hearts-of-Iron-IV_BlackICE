ROM_iron_guard_excesses_1_desc:0	"Der Radikalismus und die mangelnde Regierungserfahrung der Eisernen Garde zeigen sich nun deutlich. Sie fordern sofortige revolutionäre Veränderungen in der rumänischen Gesellschaft, während der Conducator erklärt, das neue Regime müsse für künftige Konflikte gesichert werden. Die Legionäre müssen entweder gemäßigt und stabilisiert oder aus der Regierung verdrängt werden."
ROM_iron_guard_excesses_4_desc:0	"Der Radikalismus und die mangelnde Regierungserfahrung der Eisernen Garde zeigen sich deutlich. Sie fordern jetzt einen revolutionären Wandel der rumänischen Gesellschaft, während der Conducator erklärt, das neue Regime müsse für kommende Konflikte gesichert werden. Die Legionäre müssen entweder gemildert und stabilisiert oder aus der Regierung verdrängt werden."
