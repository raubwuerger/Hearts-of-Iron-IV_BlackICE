ARG_roca_runciman_treaty:	"Der Roca-Runciman-Vertrag"
ARG_roca_runciman_treaty_desc:	"Das Roca-Runciman-Abkommen ist ein bedeutender Handelsvertrag zwischen [ARG.GetNameDef] und [ENG.GetNameDef], der im Mai 1933 unterzeichnet wurde und [ARG.GetNameDef] einen festen Anteil am [ENG.GetAdjective] Fleischmarkt garantierte. Im Gegenzug stimmte [ARG.GetNameDef] Beschränkungen in Bezug auf Handel und Währungsumtausch zu, wodurch die Handelsinteressen von [ENG.GetNameDef] in dem Land gewahrt blieben."
ARG_eden_malbran_treaty:	"Der Eden-Malbrán-Vertrag"
ARG_eden_malbran_treaty_desc:	"Als Reaktion auf die strengen Beschränkungen, die im Roca-Runciman-Abkommen auferlegt wurden, wurde unter dem Namen Eden-Malbrán-Vertrag ein neues Abkommen ausgehandelt. Dies ermöglichte [ENG.GetNameDef] zusätzliche Zugeständnisse bei gleichzeitiger Senkung der Frachtkosten für Weizen."
