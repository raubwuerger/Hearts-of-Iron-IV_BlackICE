USA_office_price_administration:0	"Office of Price Administration"
USA_office_price_administration_desc:0	"Der Krieg hat zu einer Verknappung vieler Güter geführt, insbesondere von Lebensmitteln. Der Präsident hat die Durchführungsverordnung 8875 vorbereitet, mit der das Amt für Preisverwaltung eingerichtet werden soll. Dieses Amt wird dafür zuständig sein, Preisobergrenzen festzulegen, um der zunehmenden Preisinflation bei Konsumgütern entgegenzuwirken und mit der Rationierung von knappen Gütern zu beginnen. Dies wird den Unternehmen kurzfristig schaden, ermöglicht es der Regierung jedoch, den Warenfluss in der Wirtschaft aufrechtzuerhalten und vor allem die Versorgung unserer Soldaten im Ausland sicherzustellen."
