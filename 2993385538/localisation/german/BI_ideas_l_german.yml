YUG_serbian_question_desc:0	"Die Serben, die einst hochprivilegierte ethnische Gruppe in Jugoslawien, sind wütend darüber, dass sie auf eine gleichere Ebene mit anderen ethnischen Gruppen gezwungen worden sind. Wir müssen diesen Konflikt lösen."
GER_eupen_malmedy:0	"Die Rückkehr von Eupen-Malmedy"
GER_eupen_malmedy_desc:0	"Eupen-Malmedy, ein mehrheitlich deutschsprachiges Gebiet, wurde nach dem Versailler Vertrag Belgien zugesprochen. Wir streben seine rasche Rückgabe an das Reich an."
GER_south_tyrol:0	"Anspruch auf Südtirol erheben"
GER_south_tyrol_desc:0	"Eine weitere der vielen Ungerechtigkeiten des Ersten Weltkriegs können wir jetzt rückgängig machen. In Südtirol gibt es eine Reihe von Deutschen, die zwangsitalienisiert werden. Sollen wir das weiter zulassen?"
GER_west_poland:0	"Lösung des polnischen Dilemmas"
GER_west_poland_desc:0	"Polen bleibt eine unkontrollierte Bedrohung an unserer Ostgrenze. Wir müssen Maßnahmen ergreifen, um dieses Problem zu neutralisieren, bevor es zu spät ist."
