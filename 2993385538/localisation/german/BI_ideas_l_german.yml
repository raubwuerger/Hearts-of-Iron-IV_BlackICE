ENG_enigma_tt:	"Wir werden daran arbeiten, die deutschen Enigma-Maschinen zu knacken, aber das wird Zeit brauchen. Die Verbesserung unserer §YEntschlüsselungsleistung§! wird den Prozess beschleunigen.\n\n"
ENG_enigma_tt_2:	"Die neuen M4-Maschinen sind wesentlich schwieriger zu knacken. Unsere Kryptologen benötigen deutlich mehr Zeit."
