GER_idea_ship_penalty_reduced_desc:0	"Die deutsche Schiffbauindustrie stagniert seit dem Ende des Ersten Weltkriegs weitgehend. Einschränkungen durch den Versailler Vertrag und das anglo-deutsche Flottenabkommen haben die praktische Entwicklung des modernen Schiffbaus stark behindert. Infolgedessen ist unsere Marineindustrie zwar technisch kompetent, doch sind die Entwürfe hinsichtlich Größe und Material nicht die effizientesten.\nDank unserer jüngsten Erfahrungen beim Bau neuer Schiffe ist es uns gelungen, die Situation zu verbessern."
