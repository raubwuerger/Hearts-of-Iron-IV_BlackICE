GER_south_tyrol_desc:0	"Eine weitere der vielen Ungerechtigkeiten des Ersten Weltkriegs können wir jetzt rückgängig machen. In Südtirol gibt es eine Reihe von Deutschen, die zwangsitalienisiert werden. Sollen wir das weiter zulassen?"
GER_west_poland:0	"Lösung des polnischen Dilemmas"
