USA_office_war_information_desc:0	"Diese neue Behörde wird für die Ausarbeitung und Umsetzung von Informationsprogrammen zuständig sein, um im In- und Ausland das Verständnis für den Stand und den Verlauf des Krieges zu fördern. Auch wenn dies von einigen Kongressabgeordneten als eine fortgesetzte, unnötige Ausweitung der Bundesregierung angesehen werden wird, wird diese Maßnahme wesentlich dazu beitragen, die Unterstützung für den Krieg unter den Amerikanern zu stärken."
