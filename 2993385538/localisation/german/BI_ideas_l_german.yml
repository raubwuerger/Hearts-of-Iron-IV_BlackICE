AST_cut_defence_spending:0	"Enttäuschende Verteidigungsausgaben"
AST_commonwealth_officers_desc:0	"Als Mitglied des Commonwealth wird die australische Militärplanung überwiegend von britischen Offizieren diktiert. Zum Leidwesen der Briten scheinen die australischen Soldaten diese Anweisung jedoch nicht erhalten zu haben. Die australischen Streitkräfte missachten regelmäßig die Befehle ihrer steifen britischen Kommandeure und verfolgen einen "entspannteren" Ansatz in Sachen Disziplin. Ehrlich gesagt stehen die Briten einfach nur im Weg."
AST_standards_enforcement:0	"Durchsetzung von Standards"
AST_standards_enforcement_desc:0	"Wir haben begonnen, gegen nachlässige Miliz- und reguläre Einheiten unserer Armee vorzugehen. Wir haben festgestellt, dass ein Großteil unserer Landstreitkräfte nur auf dem Papier existiert, da viele Männer seit Jahren nicht mehr trainiert haben und selbst die grundlegendsten Standards nicht erfüllen können. Infolgedessen hat unsere Personalstärke massiv gelitten."
AST_militia_forces_2:0	"Standardisierte Milizstreitkräfte"
AST_militia_forces_2_desc:0	"Glücklicherweise ist es uns durch harte Arbeit und die Ernennung von General Blamey zu deren Aufsicht gelungen, unsere nationale Miliz auf einen guten Standard zu bringen, auch wenn wir dabei viel Ballast abgeworfen haben. Sie beschweren sich nicht mehr und widersetzen sich kaum noch einem Einsatz außerhalb Australiens. Einige bestehen jedoch weiterhin darauf, in der unmittelbaren Umgebung Australiens zu bleiben."
AST_great_depression_4:0	"Die Weltwirtschaftskrise"
AST_great_depression_3:0	"Die Weltwirtschaftskrise"
AST_aussie_wool_desc:0	"Mit dem Zusammenbruch des Weltmarktes haben australische Landwirte Schwierigkeiten, Abnehmer für ihre Erzeugnisse zu finden."
AST_aussie_wool_profits:0	"Gewinne der Wollindustrie"
AST_victory_gardens_idea:0	"Victory Gardens"
AST_poor_tracks:0	"Unterschiedliche Spurweiten"
AST_falling_quid:0	"Falling Quid"
AST_falling_quid_desc:0	"Durch die jüngsten Maßnahmen der Regierung ist das Pfund weniger wert denn je. Vielleicht ist es an der Zeit, auf Dollarydoos umzusteigen?"
AST_licensed_planes_idea:0	"Lizenzierte Flugzeuge"
AST_licensed_planes_idea_desc:0	"Wir haben die Tatsache akzeptiert, dass ein eigenständiges Flugzeugdesign in der uns zur Verfügung stehenden Zeit keine realistische Option ist, und konzentrieren all unsere Anstrengungen auf die Produktion lizenzierter Modelle."
AST_the_propaganda_machine_idea_desc:0	"Da sich die Nation im Krieg befindet, müssen wir uns langfristig auf den Krieg einstellen und dafür sorgen, dass die innere Stabilität gewahrt bleibt."
AST_raised_stakes_idea:0	"Erhöhte Einsätze"
AST_advance_australia_idea_desc:0	"Es ist an der Zeit, dass das australische Militär zum Gegenangriff übergeht und die Japaner zurückdrängt. Sie sollten das Beste daraus machen, bevor ihre Logistik versagt."
AST_war_rationing:0	"Kriegsrationierung"
AST_war_rationing_desc:0	"Da Australien erneut im Krieg steht und unser Handel und unsere Versorgung mit Großbritannien eingeschränkt sind, sollten wir ein begrenztes Rationierungssystem einführen, um eine schnellere Mobilisierung zu ermöglichen."
AST_war_rationing_3_desc:0	"Australien muss alles in die Kriegsanstrengungen stecken, auf jeglichen Luxus verzichten, das Fett aus der Pfanne kratzen für Bomben, Leute, wir sind alle dabei!"
AST_womens_military_presence_1:0	"Geringfügige Rollen der Frauen"
AST_womens_military_presence_2_desc:0	"Förderung der Rolle der Frauen"
AST_womens_military_presence_3:0	"Förderung der Rolle der Frauen"
AST_womens_military_presence_3_desc:0	"Förderung der Rolle der Frauen"
AST_womens_military_presence_4:0	"Stärkung der Rolle der Frau"
AST_womens_military_presence_4_desc:0	"Stärkung der Rolle der Frau"
AST_department_of_munitions_idea:0	"Sorgfältiges Versorgungsmanagement"
AST_department_of_munitions_idea_desc:0	"Die australische Armee wird von äußerst sorgfältigen und horizontal integrierten Regierungsbehörden gut versorgt. Dies ermöglicht es dem Inselstaat, eine größere stehende Armee aufrechtzuerhalten, als dies sonst möglich wäre. Jede hergestellte Patrone und jede Ration wird erfasst und dorthin geschickt, wo sie am dringendsten benötigt wird, wodurch die Verschwendung minimiert wird, unter der viele ältere und größere Armeen leiden."
AST_department_of_supply_idea:0	"Ministerium für Versorgung und Entwicklung"
AST_department_of_supply_idea_desc:0	"Das Ministerium für Versorgung und Entwicklung ist eine neue Regierungsbehörde, deren Aufgabe es ist, sicherzustellen, dass australisches Verteidigungsmaterial im Inland auf der Grundlage einer gut ausgebauten Infrastruktur aus lokalen Ressourcen hergestellt und durch eine gut geführte Verwaltung effizient an die Front transportiert werden kann. Während der letzte Teil für uns derzeit noch unerreichbar ist, können wir definitiv auf den ersten Teil hinarbeiten. "
AST_allied_works_council_idea:0	"Alliierter Baurat"
AST_allied_works_council_idea_desc:0	"Der Alliierte Baurat ist eine Organisation, die gegründet wurde, um während der Dauer des Krieges die militärischen Bauarbeiten in Australien zu beaufsichtigen und zu organisieren."
AST_allied_works_council_idea_tt:0	"Der Alliierte Baurat wird den Bau von Militärfabriken, Luftwaffenstützpunkten, Marinestützpunkten, Ausrüstungsfabriken, Flugabwehr- und Radarstationen beaufsichtigen, wodurch diese §G10 %§! schneller errichtet werden."
AST_gov_air_factories_idea:0	"Kommission für Flugzeugproduktion"
AST_citizens_air_force_idea:0	"Bürgerluftwaffe"
AST_subs_idea_desc:0	"Nach Jahren der Untätigkeit, Verschrottung und des allgemeinen Niedergangs hat die Royal Australian Navy beschlossen, mit der lokalen Produktion von U-Booten zu beginnen."
AST_the_jellicoe_plan_idea:0	"Der Jellicoe-Plan"
AST_the_jellicoe_plan_idea_desc:0	"Ursprünglich im Jahr 1920 entworfen. John Jellicoes ehrgeiziger Marineplan wurde in der Welt nach den Flottenverträgen als unnötig erachtet. Seitdem ist klar geworden, dass diese Verträge nur das Papier wert sind, auf dem sie gedruckt sind. Wahnvorstellungen? Vielleicht, aber das war es auch, eine blutige einsame Insel mit einem Haufen Sträflinge zu besiedeln!"
AST_ship_penalty_idea:0	"Dennoch sind wir eingeschränkt"
AST_ship_penalty_idea_desc:0	"Es stellt sich also heraus, dass der Bau eines Schlachtschiffs keine leichte Aufgabe ist, wer hätte das gedacht!"
AST_together_for_victory_idea:0	"Gemeinsam zum Sieg!"
AST_together_for_victory_idea_desc:0	"Gegen alle Tyrannen steht das australische Volk gemeinsam für den Sieg"
