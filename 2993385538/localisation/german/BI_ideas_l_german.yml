GER_enigma_code_desc:0	"Einem deutschen Enigma-Operator wurde eine Klartextnachricht zum Verschlüsseln gegeben. Für jeden eingegebenen Buchstaben zeigte eine Lampe einen anderen Buchstaben an, der nach einem Pseudo-Zufallsverfahren, das auf der Verdrahtung der Maschine beruhte, ersetzt wurde. Der von der Lampe angezeigte Buchstabe wurde als die verschlüsselte Substitution aufgezeichnet. Durch das Drücken einer Taste wurde auch der Rotor bewegt, so dass der nächste Tastendruck einen anderen elektrischen Pfad benutzte und somit eine andere Ersetzung erfolgte."
GER_enigma_code_1:	"Der Enigma-Code I"
