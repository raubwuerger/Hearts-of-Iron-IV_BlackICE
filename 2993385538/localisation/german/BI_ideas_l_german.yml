german_u_boat_bases_desc:0	"Ermöglicht die Wartung und Versorgung der deutschen U-Boote in ihren Häfen."
GER_idea_plan_z_desc:0	"Ein bedeutender Teil unseres industriellen und politischen Willens wurde für die Fertigstellung des massiven Marinebauprogramms \"Plan Z\" eingesetzt."
GER_idea_ship_penalty_desc:0	"Seit dem Ende des Ersten Weltkriegs stagniert die deutsche Schiffbauindustrie weitgehend. Die Beschränkungen durch den Versailler Vertrag und das deutsch-britische Flottenabkommen haben die praktische Entwicklung des modernen Schiffbaus stark eingeschränkt. Infolgedessen ist unsere Marineindustrie zwar technisch kompetent, aber die Entwürfe sind in Bezug auf Größe und Material nicht die effizientesten."
GER_idea_ship_penalty_reduced:0	"Ineffiziente Schiffskonstruktion"
GER_Empower_Nat_I_desc:0	""
GER_Last_Defence_I:0	"Letzte Verteidigungsanstrengung"
GER_Germania_I1_desc:0	"Die von Albert Speer entworfene und vom Führer selbst genehmigte Welthauptstadt Germania wird ein edles und modernes Beispiel für deutsche Größe sein. Von der Großen Halle bis zur Siegessäule wird eine moderne Straße und Schiene führen. Die Stadt wird mit den modernsten Geräten, den luxuriösesten Restaurants und den schönsten Parks ausgestattet sein. All das zum Ruhme des Führers und des deutschen Volkes und der Nation."
