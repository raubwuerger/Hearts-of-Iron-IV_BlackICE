l_german:
BALTIC_events.1.t:0	"[From.GetNameDefCap] Fordert Garantien"
BALTIC_events.1.d:0	"Ein Telegramm von [From.GetNameDef] wurde heute Morgen an [Root.GetLeader] übermittelt, in dem darum gebeten wurde, dass [Root.GetNameDef] ihre Garantien für die Unabhängigkeit von [From.GetAdjective] erneuert. Unter Berufung auf die langjährige Freundschaft zwischen [Root.GetNameDef] und [From.GetNameDef] seit der Staatsgründung im Jahr 1918 betont [From.GetLeader], dass das Überleben der [From.GetLeader.GetHerHis] Nation für den fortdauernden Frieden in Osteuropa unerlässlich ist. \n\nAngesichts der sich aufbauenden Spannungen zwischen [From.GetNameDef] und [SOV.GetNameDefCap] könnte die Annahme des Vorschlags von [From.GetLeader] dazu führen, dass [Root.GetNameDef] in Konflikt mit den [SOV.GetAdjective] gerät…"
BALTIC_events.1.a:0	"Wir werden unsere [From.GetAdjective] Freunde verteidigen."
BALTIC_events.1.b:0	"Wir unterstützen weder die Regierung von [From.GetLeader] noch die von [From.GetLeader.GetHerHis]."
BALTIC_events.101.t:0	"[From.GetNameDefCap] Akzeptiert!"
BALTIC_events.101.d:0	"[From.GetLeader] hat angekündigt, [From.GetHerHis] die fortgesetzte [Root.GetAdjective] Unabhängigkeit zu unterstützen und sich an allen Konflikten zu beteiligen, die die weitere Existenz von [Root.GetNameDef] bedrohen."
BALTIC_events.101.a:0	"Wir sind in Sicherheit."
BALTIC_events.102.t:0	"[From.GetNameDefCap] Lehnt ab!"
BALTIC_events.102.d:0	"Sehr zum Leidwesen von [Root.GetLeader] hat das [From.GetAdjective] Außenministerium beschlossen, keine militärischen Beziehungen zu [Root.GetNameDef] anzustreben."
BALTIC_events.102.a:0	"Wir müssen eine andere Lösung finden."
 
