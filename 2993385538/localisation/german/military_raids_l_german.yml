raid_type_thermonuclear_missile_strike_desc:	"Eine Langstreckenrakete wird vom festgelegten Abschussort aus eine suborbitale ballistische Flugbahn in Richtung des vorgesehenen Ziels einschlagen. Zum geeigneten Zeitpunkt wird der an Bord befindliche Sprengkopf eine thermonukleare Explosion auslösen."
