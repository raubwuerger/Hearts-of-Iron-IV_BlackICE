tooltip_raid_category_air_raids:		"§A Luftangriffe§! \nLuftangriffe durch ein einzelnes Luftgeschwader mit dem Ziel, ein bestimmtes Ziel zu treffen. Dazu gehören: §Y Einrichtungsangriff\nDam Bombing Raid\nMega-Gun Emplacement Strike§!"
tooltip_raid_category_resource_raids:		"§A Luftbombardierung Ressourcenangriffe§! \nLuftangriffe eines einzelnen Luftgeschwaders mit dem Ziel, Ressourcenproduktionsanlagen anzugreifen. Dazu gehören: §Y\nÜberfall auf Ölraffinerien\nÜberfall auf Eisenminen\nÜberfall auf Kohleminen\nÜberfall auf Bauxitminen§!"
tooltip_raid_category_nuclear_raids:		"§HNuclear Raids§! \nAngriffe, die von strategischen Bombern mit Atomwaffen durchgeführt werden. Dazu gehören: \n§YNuclear Strike§!"
tooltip_raid_category_paratrooper_raids:		"§HParatrooper Raids§! \nKleine Angriffe, die von Paradropping-Spezialkräften durchgeführt werden, die sich hinter den feindlichen Linien absetzen, um gefährliche Sabotagemissionen durchzuführen. Dazu gehören: §Y\nPathfinder Raid§!"
tooltip_raid_category_naval_commando_raids:		"§AÜberfälle von Marinekommandos§! \nKleine Überfälle, die von Marines in Küstengebieten durchgeführt werden. Dabei werden kleine Schnellboote und ähnliche Ausrüstung eingesetzt, um einen schnellen Angriff durchzuführen und dann zu verschwinden, bevor der Feind Zeit hat zu reagieren."
tooltip_launch_all_button_first:		"§Klicken Sie auf _§!, um alle fertigen Überfälle zu starten."
tooltip_launch_all_button_second:		"$NUM|H$ Razzien sind startbereit"
tooltip_launch_button_enabled:		"§GKlicken Sie§!, um den Angriff zu starten"
tooltip_launch_button_disabled:		"§RDer Schlachtzug ist nicht bereit zum Start§!"
tooltip_for_expand_button:		"§GClick§! to expand"
tooltip_for_collapse_button:		"§GClick§! to collapse"
tooltip_for_no_items:		"§RKeine Gegenstände§!"
raid_type_facility_strike:		"Anlagenangriff"
raid_type_facility_strike_desc:		"Ein Luftangriff auf eine feindliche Experimentiereinrichtung mit dem Ziel, der Einrichtung und allen dort befindlichen Projekten schweren Schaden zuzufügen."
raid_type_lock_bombing_raid:		"Schleusenbombenangriff"
raid_type_lock_bombing_raid_desc:		"Mit speziellen Abprallbomben ausgerüstete Flugzeuge versuchen, die Schleusen zu zerstören, um die Durchfahrt durch den Kanal zu verhindern."
raid_type_lock_bombing_raid_no_bba:		"$raid_type_lock_bombing_raid$"
raid_type_lock_bombing_raid_no_bba_desc:		"$raid_type_lock_bombing_raid_desc$ $raid_type_lock_bombing_raid_desc$"
raid_type_dam_bombing_raid:		"Bombenangriff auf den Damm"
raid_type_dam_bombing_raid_desc:		"Flugzeuge, die mit speziellen Abprallbomben ausgerüstet sind, versuchen, den Damm zu zerstören, um seine Wirksamkeit zu verringern und es dem Feind zu erschweren, sich in diesem Gebiet zu bewegen."
raid_type_dam_bombing_raid_no_bba:		"$raid_type_dam_bombing_raid$"
raid_type_dam_bombing_raid_no_bba_desc:		"$raid_type_dam_bombing_raid_desc$"
raid_type_gun_emplacement_raid:		"Geschützstellung Strike"
raid_type_gun_emplacement_raid_desc:		"Eine Gruppe von Bombern, die mit einer Earthshaker-Bombe ausgerüstet sind, versucht, eine Geschützstellung für ein $mega_gun_emplacement$ zu zerstören."
raid_type_gun_emplacement_raid_no_bba:		"$raid_type_gun_emplacement_raid$"
raid_type_gun_emplacement_raid_no_bba_desc:		"$raid_type_gun_emplacement_raid_desc$"
raid_type_mega_gun_emplacement_strike:		"Mega-Gun-Stellung Strike"
raid_type_mega_gun_emplacement_strike_desc:		"Ein Schlag gegen eine Mega-Gun-Stellung mit Earthshaker-Bomben"
raid_type_mega_gun_emplacement_strike_no_bba:		"$raid_type_mega_gun_emplacement_strike$"
raid_type_mega_gun_emplacement_strike_no_bba_desc:		"$raid_type_mega_gun_emplacement_strike_desc$"
raid_type_oilfield_raid:		"Ölfeld-Angriff"
raid_type_oilfield_raid_desc:		"Ein Luftangriff, der darauf abzielt, ein großes Ölfeld und die damit verbundenen Raffinerien auszuschalten, um die feindliche Treibstoffproduktion für einen längeren Zeitraum ernsthaft zu stören."
raid_type_nuclear_strike:		"Nuklearer Schlag"
raid_type_nuclear_strike_desc:		"Ein strategischer Bomber und seine Eskorte fliegen zu einem bestimmten Ziel und werfen eine Atombombe ab. Der Bomber wird dann versuchen, das Gebiet zu verlassen, um nicht von der Druckwelle erfasst zu werden."
raid_type_nuclear_missile_strike:		"Nuklearer Raketenangriff"
raid_type_nuclear_missile_strike_desc:		"Eine Langstreckenrakete fliegt auf einer suborbitalen ballistischen Flugbahn vom vorgesehenen Abschussort in Richtung des beabsichtigten Ziels. Im richtigen Moment wird der Sprengkopf an Bord eine Atomexplosion auslösen."
raid_type_paratrooper_facility_sabotage:		"Sabotageangriff auf eine Einrichtung"
raid_type_paratrooper_facility_sabotage_desc:		"Ein Team von Fallschirmjägern stürzt sich auf eine feindliche Einrichtung und versucht, mit Hilfe von Sprengladungen lebenswichtige Geräte zu zerstören, um deren wissenschaftlichen Fortschritt zu stören."
raid_type_mine_sabotage_raid:		"Minensabotage-Angriff"
raid_type_mine_sabotage_raid_desc:		"Ein Team von Fallschirmjägern stürzt sich auf einen großen feindlichen Minenkomplex und versucht, Sprengladungen zu zünden, die die Produktion für eine lange Zeit unterbrechen werden."
raid_type_pathfinder_raid:		"Pfadfinder-Angriff"
raid_type_pathfinder_raid_desc:		"Ein Team von Fallschirmjägern setzt sich hinter den feindlichen Linien ab, um eine bevorstehende Invasion vorzubereiten, indem es kritische Brücken zerstört, Hinterhalte legt und allgemein für Ablenkung sorgt."
raid_type_commando_port_raid:		"Marine-Hafenüberfall"
raid_type_commando_port_raid_desc:		"Eine Gruppe von Marines wird ausgesandt, um einen großen, vom Feind kontrollierten $naval_base$ zu beschädigen. Die Schiffe im Hafen könnten ebenfalls Schaden nehmen."
raid_type_commando_facility_raid:		"Überfall auf eine Marineeinrichtung"
raid_type_commando_facility_raid_desc:		"Eine Gruppe von Marines wird ausgesandt, um eine Versuchsanlage in einer Küstenprovinz zu beschädigen."
raid_type_airfield_raid:		"Überfall auf einen Flugplatz"
raid_type_supply_hub_raid:		"Überfall auf ein Versorgungszentrum"
raid_type_demo_dam_raid:		"Demo-Dammbombenangriff"
raid_type_AUS_reichstag_bombing:		"Bombenangriff auf den Reichstag"
raid_type_AUS_reichstag_bombing_desc:		"Indem wir eine Gruppe von Bombern aussenden, um das Hauptquartier des Feindes und den symbolischen Ort der deutschen Macht anzugreifen, können wir die Moral unseres Volkes stärken und gleichzeitig unseren Feinden einen Schlag versetzen."
raid_type_ENG_reichstag_bombing:		"Bombenangriff auf den Reichstag"
raid_type_ENG_reichstag_bombing_desc:		"Indem wir eine Gruppe von Bombern losschicken, um das Hauptquartier des Feindes und den symbolischen Ort der deutschen Macht anzugreifen, können wir die Moral unseres Volkes stärken und gleichzeitig der Moral unseres Feindes einen Schlag versetzen."
raid_type_GER_eben_emael_raid:		"Eben Emael Raid"
raid_type_GER_eben_emael_raid_desc:		"Ein Sturmtrupp aus Fallschirmjägern und Gleitern greift die strategisch günstig gelegene Festung von oben an und erobert wichtige Brücken, Straßen und Eisenbahnlinien in der Umgebung, um den Weg für den Hauptangriff zu ebnen."
raid_type_GER_big_ben_bombing:		"Big Ben Bombenangriff"
raid_type_GER_statue_of_liberty_bombing:		"Bombenangriff auf die Freiheitsstatue"
raid_type_GER_kremlin_bombing:		"Bombardierung des Kremls"
raid_type_ENG_operation_jericho:		"Operation Jericho"
raid_type_ENG_operation_jericho_desc:		"Nach Informationen des französischen Widerstands hält Deutschland eine große Anzahl von Widerstandskämpfern in Amiens gefangen. Mit der Entsendung einer Flugzeugstaffel, die ein Loch in die Gefängnismauern sprengt, sollten wir in der Lage sein, eine große Anzahl dieser Widerstandskämpfer zu befreien."
raid_type_thermonuclear_strike:		"Thermonuklearer Schlag"
raid_type_thermonuclear_strike_desc:		"Ein strategischer Bomber und seine Eskorte fliegen zu dem angegebenen Ziel und werfen eine thermonukleare Bombe ab. Der Bomber wird dann versuchen, das Gebiet zu verlassen, um nicht von der Druckwelle erfasst zu werden."
raid_type_thermonuclear_missile_strike:		"Thermonuklearer Raketenangriff"
raid_type_thermonuclear_missile_strike_desc:		"Eine Langstreckenrakete fliegt auf einer suborbitalen ballistischen Flugbahn vom vorgesehenen Startplatz in Richtung des beabsichtigten Ziels. Im richtigen Moment wird der Sprengkopf an Bord eine thermonukleare Explosion auslösen."
raid_type_CHI_huansheng_raid:		"Operation Huansheng"
raid_type_CHI_huansheng_raid_desc:		"Unsere Geheimdienstinformationen besagen, dass die Stahlwerke von Yawata und das Marinearsenal von Sasebo zwar wertvolle Ziele sind, aber für unsere Luftwaffe im Moment zu schwierig, um sie richtig anzugreifen. Es wurde daher beschlossen, dass der effektivste Weg, diesen Krieg zu stoppen, darin besteht, das japanische Volk gegen die Gräueltaten der imperialistischen japanischen Kriegstreiber in China aufzurütteln, indem Flugblätter über Städten wie Nagasaki, Fukuoka, Saga und Osaka abgeworfen werden."
