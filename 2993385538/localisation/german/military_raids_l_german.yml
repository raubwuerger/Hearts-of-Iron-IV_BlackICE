operation_jericho_failure_tt:		"Die Razzia ist ein komplettes Desaster, keinem der Gefangenen gelingt die Flucht. Die feindliche Kontrolle über das Gebiet nimmt zu."
operation_jericho_limited_success_tt:		"Bei dem gewagten Bombenangriff gelingt es, ein Loch in die Gefängnismauer zu sprengen. Viele der Gefangenen werden jedoch verletzt oder können nicht entkommen."
operation_jericho_success_tt:		"Durch den gewagten Bombenangriff gelingt es, ein großes Loch in die Gefängnismauer zu sprengen. Einige der Gefangenen werden verletzt oder schaffen es nicht zu fliehen, aber eine beträchtliche Anzahl schafft es zu entkommen und wird vom örtlichen Widerstand aufgegriffen."
operation_jericho_critical_success_tt:		"Bei dem gewagten Bombenangriff gelingt es, ein großes Loch in die Gefängnismauer zu sprengen, ohne dass einer der Gefangenen verletzt wird. Den meisten Gefangenen gelingt die Flucht, und sie werden vom örtlichen Widerstand aufgegriffen."
operation_huansheng_failure_tt:		"Der Überfall ist ein komplettes Desaster. Keiner der Bomber erreicht die vorgesehenen Abwurfzonen, und viele werden von der Luftabwehr der Marine abgeschossen."
operation_huansheng_limited_success_tt:		"Bei dem waghalsigen Bombenangriff gelingt es, Flugblätter über den meisten der vorgesehenen Städte abzusetzen. Die meisten sind jedoch in unzugänglichen Gebieten verstreut und werden schnell von den feindlichen Streitkräften gesäubert."
operation_huansheng_success_tt:		"Der waghalsige Bombenangriff schafft es, Flugblätter über allen Zielstädten abzusetzen. Einige Flugblätter werden auf Dächern oder in bewaldeten Gebieten verstreut, aber die meisten landen in zugänglichen und bewohnten Gebieten und werden schnell von den Anwohnern aufgesammelt."
operation_huansheng_critical_success_tt:		"Bei dem waghalsigen Bombardierungsversuch gelingt es, Flugblätter über allen vorgesehenen Städten zu verteilen. Alle landen in zugänglichen und bewohnten Gebieten und werden schnell von den Anwohnern aufgegriffen, so dass die Nachricht von der japanischen Invasion weithin verbreitet wird."
