raid_type_gun_emplacement_raid:	"Geschützstellung Kommandounternehmen"
raid_type_gun_emplacement_raid_desc:	"Eine Gruppe von Bombern, die mit einer Earthshaker-Bombe ausgerüstet sind, versucht, eine Geschützstellung für ein $mega_gun_emplacement$ zu zerstören."
