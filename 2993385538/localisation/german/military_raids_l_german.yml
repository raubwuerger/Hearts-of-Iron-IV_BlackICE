raid_type_thermonuclear_strike:	"Thermonuklearer Schlag"
raid_type_CHI_huansheng_raid:	"Operation Huansheng"
raid_type_CHI_huansheng_raid_desc:	"Unsere Geheimdienstinformationen besagen, dass die Stahlwerke von Yawata und das Marinearsenal von Sasebo zwar wertvolle Ziele sind, aber für unsere Luftwaffe im Moment zu schwierig, um sie richtig anzugreifen. Es wurde daher beschlossen, dass der effektivste Weg, diesen Krieg zu stoppen, darin besteht, das japanische Volk gegen die Gräueltaten der imperialistischen japanischen Kriegstreiber in China aufzurütteln, indem Flugblätter über Städten wie Nagasaki, Fukuoka, Saga und Osaka abgeworfen werden."
