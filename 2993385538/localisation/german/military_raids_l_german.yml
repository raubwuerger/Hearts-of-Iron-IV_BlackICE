raid_type_AUS_reichstag_bombing_desc:	"Indem wir eine Gruppe von Bombern entsenden, um das Hauptquartier des Feindes und den symbolischen Ort der deutschen Macht anzugreifen, können wir die Moral unseres Volkes stärken und gleichzeitig unseren Feinden einen Schlag versetzen."
raid_type_ENG_reichstag_bombing:	"Bombenangriff auf den Reichstag"
raid_type_GER_eben_emael_raid_desc:	"Eine Sturmtruppe aus Fallschirmjägern und Segelflugtruppen wird die strategisch gelegene Festung von oben angreifen und zudem wichtige Brücken, Straßen und Eisenbahnstrecken in der Umgebung einnehmen, um den Weg für die Hauptangriffstruppe zu ebnen."
raid_type_ENG_operation_jericho:	"Operation Jericho"
raid_type_ENG_operation_jericho_desc:	"Nach Informationen der französischen Résistance hält Deutschland eine große Anzahl von gefangenen Widerstandskämpfern in Amiens fest. Indem wir eine Flugzeugstaffel entsenden, um ein Loch in die Gefängnismauern zu sprengen, sollten wir in der Lage sein, eine große Anzahl dieser Widerstandskämpfer zu befreien."
raid_type_thermonuclear_strike_desc:	"Ein strategischer Bomber und seine Eskorte werden zum vorgesehenen Ziel fliegen und eine thermonukleare Bombe abwerfen. Der Bomber wird anschließend versuchen, aus dem Gebiet zu entkommen, um nicht von der Druckwelle erfasst zu werden."
