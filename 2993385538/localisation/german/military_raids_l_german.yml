tooltip_raid_category_air_raids:	"§ALuftangriffe§! \nLuftangriffe durch ein einzelnes Luftgeschwader mit dem Ziel, ein bestimmtes Ziel zu treffen. Dazu gehören: §YForschungseinrichtungen\nStaumauern\nGroßkalibergeschützstellung§!"
tooltip_raid_category_nuclear_raids:	"§HNuklearangriff§! \nAngriffe, die von strategischen Bombern mit Atomwaffen durchgeführt werden. Dazu gehören: \n§YNuklearschläge§!"
tooltip_raid_category_naval_commando_raids:	"§AKommandounternehmen von Marinekommandos§! \nKleine Kommandounternehmen, die von Marines in Küstengebieten durchgeführt werden. Dabei werden kleine Schnellboote und ähnliche Ausrüstung eingesetzt, um einen schnellen Angriff durchzuführen und dann zu verschwinden, bevor der Feind Zeit hat zu reagieren."
