raid_type_pathfinder_raid:	"Pfadfinder-Angriff"
raid_type_pathfinder_raid_desc:	"Ein Team von Fallschirmjägern setzt sich hinter den feindlichen Linien ab, um eine bevorstehende Invasion vorzubereiten, indem es kritische Brücken zerstört, Hinterhalte legt und allgemein für Ablenkung sorgt."
raid_type_commando_port_raid_desc:	"Eine Gruppe von Marines wird ausgesandt, um einen großen, vom Feind kontrollierten $naval_base$ zu beschädigen. Die Schiffe im Hafen könnten ebenfalls Schaden nehmen."
