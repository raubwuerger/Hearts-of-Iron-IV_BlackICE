UNITS_VIEW_BTN_DRAW_NAVAL_INV_WITH_HARBOR:2	"§HSeeinvasion ORDER (Mit Unterstützung von schwimmenden Häfens)§!\nSchritt 1) §GKlick§! auf eine der hervorgehobenen Provinzen, um die Invasionsquelle festzulegen.\nSchritt 2) §GRechtsklick§! auf die gewünschte(n) Küstenprovinz(en), die eingenommen werden soll(en).\nSobald der Plan aktiviert ist, beginnt die Invasion mit der Vorbereitung und Reservierung von Konvois und eines schwimmenden Hafens aus Ihrem Vorrat."
