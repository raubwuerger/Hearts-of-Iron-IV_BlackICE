NAVY_REPAIR_POLICY_0:1	"§RDer Einsatzverband wird sich nie dazu entschließen, von sich aus zur Heimatbasis zurückzukehren.§!"
NAVY_REPAIR_POLICY_1:1	"§RReparaturpriorität - Niedrig.§!\nDer Einsatzverband beschließt, zu einem Marinestützpunkt zurückzukehren, wenn die Schiffe §RSchwer§! beschädigt wurden."
NAVY_REPAIR_POLICY_2:1	"§YReparaturpriorität - Mittel.§!\nDer Einsatzverband beschließt, zu einem Marinestützpunkt zurückzukehren, wenn die Schiffe §RMittel§! beschädigt wurden."
NAVY_REPAIR_POLICY_3:1	"§GReparaturpriorität - Hoch.§!\nDer Einsatzverband beschließt, nach Hause zurückzukehren, wenn die Schiffe §RLight§! beschädigt sind."
NAVY_REPAIR_POLICY_DESC:1	"Das Reparatur-und-Rückkehr-System ermöglicht es, beschädigte Schiffe zur Reparatur nach Hause zu schicken, ohne dass der Spieler eingreifen muss. Die Prioritätseinstellung lässt den Spieler entscheiden, was wichtiger ist...\nDie Mission um jeden Preis fortsetzen?\nOder um jeden Preis überleben?"
NAVY_REPAIR_POLICY_SPLIT_DESC:2	"Die Option §YAufteilung erlauben§! erlaubt es den am stärksten beschädigten Schiffen, sich abzukoppeln und zu einem nahegelegenen Marinestützpunkt zurückzukehren, um dort Reparaturen durchzuführen, während der Rest des Einsatzverbandes seine Mission fortsetzt.\nDie abgekoppelten Schiffe sind während ihrer Rückkehr sehr anfällig für Angriffe.\nNach Abschluss der Reparaturen kehren die Schiffe zu den ihnen zugewiesenen Einsatzverbänden zurück.\n\nDie Anzahl der abgekoppelten Schiffe hängt von der Einstellung der Reparaturpriorität sowie vom Schaden an jedem einzelnen Schiff ab."
NAVY_REPAIR_NOW_CANCEL:1	"§RAbbrechen§! der Reparaturaufgabe."
SHIP_REPAIR_NOW:3	"§HJetzt reparieren!§!\nDas Schiff löst sich als separater Einsatzverband ab und kehrt zur Reparatur in einen nahegelegenen Marinestützpunkt zurück.\nDas Schiff kehrt zu seinem aktuellen Einsatzverband zurück, sobald es vollständig repariert ist.\n§GKlick§! zum Ablösen.\n§GShift+Klick§! um mehrere Schiffe zu markieren und sie als einen Einsatzverband abzulösen, wenn Sie §GShift§! loslassen."
SHIP_REFIT_TOOLTIP:0	"§HSchiff umrüsten§!\n Rüstet die ausgewählten Schiffe auf ein anderes kompatibles Schiffsdesign um."
SHIP_REFIT_NO_SHIPS_TOOLTIP:0	"§REs sind derzeit keine Schiffe ausgewählt§!"
SHIP_REFIT_NO_COMPATIBLE_DESIGNS_TOOLTIP:0	"§REs gibt keine verfügbaren Schiffsdesigns, die als Umrüstungsziele für alle derzeit ausgewählten Schiffe in Frage kommen.§!"
SHIP_REFIT_TOOLTIP_DELAYED:1	"Nach der Auswahl des Zielschiffsdesigns lösen sich die ausgewählten Schiffe als separate §HEinsatzverband§! ab und kehren zur Umrüstung zu einer nahe gelegenen §HMarinestützpunkt§! zurück.  Während der Umrüstung kann der Fortschritt im Produktionsfenster verfolgt werden.\n\nNach Abschluss der Umrüstung kehren sie zu ihrer aktuellen §HEinsatzverband§! zurück.\n\n§GShift + Klick§! zur Auswahl mehrerer Schiffe.\n§GCtrl + Klick§! zum Umschalten der Schiffsauswahl."
SHIP_REFIT_CANCEL_TOOLTIP:1	"§RAbbrechen§! der Umrüstungsaufgabe."
