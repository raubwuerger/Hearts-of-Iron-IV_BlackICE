SHIP_REPAIR_NOW:3	"§HJetzt reparieren!§!\nDas Schiff löst sich als separater Einsatzverband ab und kehrt zur Reparatur in einen nahegelegenen Marinestützpunkt zurück.\nDas Schiff kehrt zu seinem aktuellen Einsatzverband zurück, sobald es vollständig repariert ist.\n§GKlick§! zum Ablösen.\n§GShift+Klick§! um mehrere Schiffe zu markieren und sie als einen Einsatzverband abzulösen, wenn Sie §GShift§! loslassen."
