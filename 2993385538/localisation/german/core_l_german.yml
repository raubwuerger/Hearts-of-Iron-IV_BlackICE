NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SHORE_BOMBARDMENT_DESC:0	"Der Einsatzverband wird aufgrund seiner geringen Küstenbombardierungsfähigkeiten nicht in der Lage sein, Divisionen an der Küstenlinie im Kampf effizient zu unterstützen. Erwägen Sie die Aufnahme von Schiffen mit §Ygroßkalibrigen Geschützen§! in den Einsatzverband."
