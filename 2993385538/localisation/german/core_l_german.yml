NAVAL_MISSION_NAME_HOLD_DESC:3	"§GKlick§! oder £h \nBrechen Sie die aktuelle Mission und bewegen Sie sich zum nächstgelegenen Hafen.\n\n§GCtrl+Klick§! oder £ctrl +£h \nBrechen Sie die aktuelle Mission und bleiben Sie an Ort und Stelle.\n--------------\nKapitalschiffe, die in einer Seeprovinz, die an eine Landschlacht angrenzt, auf Halten gesetzt werden, können mit §HShore Bombardment§! aushelfen.\nTrägerschiffe, die auf Halten gesetzt werden, während sie sich auf See befinden, können ihre Tragflächen für Standard-Luftmissionen verwenden."
