SHIP_REFIT_TOOLTIP_DELAYED:1	"Nach der Auswahl des Zielschiffsdesigns lösen sich die ausgewählten Schiffe als separate §HEinsatzverband§! ab und kehren zur Umrüstung zu einer nahe gelegenen §HMarinestützpunkt§! zurück.  Während der Umrüstung kann der Fortschritt im Produktionsfenster verfolgt werden.\n\nNach Abschluss der Umrüstung kehren sie zu ihrer aktuellen §HEinsatzverband§! zurück.\n\n§GShift + Klick§! zur Auswahl mehrerer Schiffe.\n§GCtrl + Klick§! zum Umschalten der Schiffsauswahl."
