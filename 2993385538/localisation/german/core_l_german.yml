NAVAL_MISSION_NAME_STRIKE_FORCE:0	"Eingreiftruppe"
NAVAL_MISSION_NAME_STRIKE_FORCE_DESC:	"Befiehl der Einsatzgruppe, in der nächstgelegenen Marinebasis zu warten, bis eine feindliche Einsatzgruppe gesichtet wird.\nSobald ein Feind von einer deiner Patrouilleneinsatzgruppen gesichtet wird, wird deine Angriffstruppe ausrücken, um ihn abzufangen. \n\nWenn keine Feinde aktiv bekämpft werden, verbraucht diese Mission $PERCENT|%0G$ Treibstoff."
