UNITS_VIEW_BTN_RESHAPE:0	"§HEditiermodus§!\nDurch Drücken dieser Schaltfläche schalten Sie den Modus um, oder halten Sie §GALT§!\n§GKlicken Sie mit der rechten Maustaste§! auf Schlachtpläne, die mit Stecknadeln enden, um sie zu bearbeiten.\n§GKlicken Sie mit der linken Maustaste§! auf den Vorrückungspfeil, um ihn umzuformen oder mit einem anderen Befehl zu verbinden.\n§GKlicken Sie mit der rechten Maustaste§! auf einen der blinkenden Befehle, um einen neuen Vorrückungspfeil zu malen."
UNITS_VIEW_BTN_DRAW_DEFENCE_ARMY_GROUP:0	"§HFrontlinie§!\n - §GKlick§! auf eine der Grenzen gegen ein anderes Land, um die zugewiesene Front entlang der gesamten Grenze zu setzen.\n - §GShift + Klick§! auf eine der Grenzen gegen ein anderes Land, um die zugewiesene Front ohne Unterarmee-Fronten entlang der gesamten Grenze zu setzen.\n - §GRechtsklick und Ziehen der Maus§! auf eine der Grenzen gegen ein anderes Land, um die Front in einem kürzeren Intervall zu setzen. \n - §GShift + Rechtsklick und Ziehen der Maus§! auf eine der Grenzen gegen ein anderes Land, um die Front ohne Unterarmee in einem kürzeren Intervall zu setzen.\n - §GRechtsklick und Ziehen der Maus§! auf die bestehenden Frontlinienenden, um sie zu bearbeiten.\n\nFrontlinien sind der Startpunkt von Angriffen in feindliches Gebiet in Richtung Offensivlinien, ermöglichen aber auch die schnelle Positionierung von Divisionen entlang einer fremden Grenze."
UNITS_VIEW_BTN_AREA_DEFENSE:3	"§HGebietsverteidigung§!\n - §GKlick§! auf Staaten, um sie der Armeeordnung hinzuzufügen/zu entfernen.\nEine Armee mit dieser Ordnung kann nicht gleichzeitig andere Typen haben.\n\nDivisionen, die einer Armee mit dieser Ordnung zugewiesen sind, werden sich über das zugewiesene Gebiet verteilen, um wichtige Städte, Häfen oder andere Objekte zu bewachen sowie kleinere feindliche Präsenz zu bewältigen."
UNITS_VIEW_BTN_DRAW_NAVAL_INV:0	"§HLandungsunternehmen§!\nSchritt 1) §GKlick§! auf eine der hervorgehobenen Provinzen, um die Invasionsquelle festzulegen.\nSchritt 2) §GRechtsklick§! auf die gewünschte(n) Küstenprovinz(en), die eingenommen werden soll(en).\nSobald der Plan aktiviert ist, beginnt die Invasion, Konvois aus dem Pool Ihrer Länder vorzubereiten und zu reservieren."
