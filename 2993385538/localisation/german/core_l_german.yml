UNITS_VIEW_BTN_DRAW_OFFENCE:3	"§HAngriffslinie§!\n§GRechts -Klick und halten Sie die Maustaste§! auf der Karte, um §Yeine Angriffslinie§!zu zeichnen. \nLinien können nur auf Gebieten gezeichnet werden, denen Sie eine §HFrontlinie§! oder §HSeelandung§! zugewiesen haben.\n\nDivisionen, die einem Plan mit einer Offensivlinie zugewiesen sind, versuchen, Gebiete zu erobern, um ihre Frontlinie dorthin zu verlegen. \n\n§GHalten Sie die Maustaste gedrückt§! und §Glassen Sie sie los§! auf einer Schaltfläche zur Verhaltensausführung, um den Ausführungstyp des Plans zu ändern"
