SUPPLY_FLOW_SHOW_RANGE:1	" §HVersorgungszentren§! verteilen die Versorgung an benachbarte Provinzen. Ihre Reichweite und Effizienz hängen von Wetter, Bodenbedingungen, Infrastruktur, Eisenbahnniveau und der Motorisierung.\n\nUm die Reichweite und die Versorgungsleistung eines §HVersorgungszentrums§! zu erhöhen, sollten Sie den Einsatz des §HEisenbahnausbaus§! oder eine Änderung des §HMotorisierungsgrades§!. \n\nHalten Sie §GUmschalt§! gedrückt, um die Reichweite anzuzeigen.\n§GUmschalt -Klick§!, um die Motorisierung umzuschalten.\n§GStrg-Klick§!, um die Versorgung der Verbündeten umzuschalten."
SUPPLY_FLOW_DELAYED_DESC:5	"§HVerbleibende Versorgung§! gibt an, wie viel Versorgung dieser Provinz zur Verfügung steht, und setzt sich aus der staatlichen Versorgung und den Hubs innerhalb der Reichweite zusammen. Die Reichweite der Hubs wird durch Wetter, Bodenbeschaffenheit, Infrastruktur, Eisenbahnniveau und Motorisierung beeinflusst. \n\n§HDivisionen§! verbrauchen die provinzielle Versorgung entsprechend ihrem Versorgungsgewicht. Wenn ihr §HLagerbestand§! über dem an ihrem Standort bereitgestellten Versorgungsanteil liegt, verbrauchen sie aus ihrem internen Vorrat, bis der gelagerte Vorrat auf dem gleichen Niveau wie der lokale Vorrat ist.\n\nHalten §GSteuerung§!, um die Flussquellen anzuzeigen. "
