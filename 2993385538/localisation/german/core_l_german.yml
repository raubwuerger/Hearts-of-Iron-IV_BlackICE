SUPPLY_NODE_MOTORIZATION_PRIORITY:1	"§HMotorisierungsgrad§!\nDie Motorisierung des Versorgungszentrums nutzt Lastwagen aus dem Vorrat und erweitert die Versorgungsreichweite des Zentrums sowie die Menge der an die Provinzen gelieferten Vorräte. \n§GKlicken Sie§!, um durch die Prioritäten zu blättern."
