SHIP_ENGAGEMENT_BUTTON_HOLD_FIRE:0	"§HAktuelle Gefechtsregel - §GGefecht vermeiden§!§!"
SHIP_ENGAGEMENT_BUTTON_HOLD_FIRE_DESC:1	"Die Einsatzverband versucht zu vermeiden, den Feind anzugreifen, so dass sie sich durch die Provinzen bewegen kann, ohne dass feindliche Schiffe oder Kämpfe im Spiel sind, es sei denn, wir werden entdeckt und der Feind schießt zuerst."
  
