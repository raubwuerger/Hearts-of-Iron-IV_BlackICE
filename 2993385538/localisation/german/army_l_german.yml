 ist klar: Wenn Frankreich nicht kooperiert, kann Deutschland trotzdem handeln.Das Reich erwartet Kooperation - oder Schweigen[VIC.GetAdjective] mag sich unserem Willen noch nicht beugenCeuta und Oran abgetreten - Vichy gedemütigtDas Reich hat Ceuta und Oran ohne Vorwarnung und Verhandlungen an Spanien abgetreten. Insbesondere Oran war ein Eckpfeiler der französischen Mittelmeerstrategie - sein Verlust erschüttert sowohl das militärische Vertrauen als auch den kolonialen Stolz.\n In Vichy ist die Reaktion explosiv. Laval stürmt aus dem Rat. Marineoffiziere sprechen von Verrat. [VIC.GetLeader] versucht, seine Minister zu beruhigen, aber auch er kann seine Verbitterung nicht verbergen. „Der Führer betrachtet uns als Werkzeug, nicht als Partner“, knurrt ein General. Der Schaden ist angerichtet - nicht nur geografisch, sondern auch in Bezug auf die Legitimität. Vichy regiert nun ein Frankreich, das selbst Berlin nicht respektiert.Die USA treten der Liga beiDie USA nehmen eine Einladung von [ENG.GetLeader] an.[ROM.GetName] verlässt die LigaHeute gab [ROM.GetLeader] die Entscheidung von [ROM.GetAdjective] bekannt, die LON zu verlassen[BUL.GetName] verlässt die LigaHeute [BUL.GetLeader] kündigt [BUL.GetAdjective] Entscheidung an, die LON zu verlassenEuropa verpflichtet sich zur Neutralität im Spanischen Bürgerkrieg - aber wird sie halten?Großbritannien und Frankreich haben sich an die Spitze einer diplomatischen Initiative gestellt und ein 27 Nationen umfassendes Komitee für Nichteinmischung gegründet, um eine ausländische Einmischung in den eskalierenden spanischen Bürgerkrieg zu verhindern. Der Pakt verbietet die Ausfuhr von Waffen, freiwilligen Kämpfern oder materieller Hilfe für die republikanische oder die nationalistische Fraktion. Trotz der offiziellen Unterschriften deuten Geheimdienstberichte darauf hin, dass es bereits zu Verstößen gekommen ist. Deutsche und italienische Lieferungen erreichen weiterhin Francos Streitkräfte, während sowjetische Waffen diskret an die republikanische Seite fließen. Dennoch beharrt London darauf, dass der Pakt unverzichtbar ist, um einen Flächenbrand auf dem Kontinent zu verhindern - zumindest im Prinzip.\nAuch wenn das Ziel edel ist, bleibt die Durchsetzung in der Realität unklar. Das spanische Volk kämpft weiter, und Europa schaut hinter einem Schleier diplomatischer Zurückhaltung zu, der bereits zu reißen beginnt.Dies wird die Ausbreitung des Konflikts verhindernWir werden unsere Unterstützung fortsetzenWir kämpfen weiter[SIA.GetName] verlässt die LigaHeute gab [SIA.GetLeader] die Entscheidung von [SIA.GetAdjective] bekannt, die LON zu verlassen§NErhöhung§! der Meinung der Klöster.\n§Niedrigen§! die Meinung der Klöster.\nReformen der ArmeeJahrelang vernachlässigt, war unsere Armee kaum kampffähig. Mit Hilfe westlicher Berater könnten wir jedoch in der Lage sein, eine relativ effektive Kampftruppe aufzustellen.Anwendung der Neame'schen LeitlinienProfessionalisierung der OffiziereÜberarbeitung der Kampftechniken der OffiziereReligiöse EntscheidungenUnsere Politik, unsere Sozialstruktur und unsere Ziele sind alle von der religiösen Elite motiviert. Die Klöster sind das Herzstück von Wirtschaft und Politik und weitaus mächtiger als die Aristokratie.Suche nach dem Dalai Lama im GeheimenKlöster wiederherstellenSchickt Taring Jigme in die VerwaltungSchickt Taring Jigme zum MilitärTaring Jigme wurde in die Verwaltung geschicktSuche nach dem Dalai LamaPhilip NeameEdward SmithBasil GouldYutok Tashi DondrubPhuntsog RabgyeSonam WangdiTaring JigmeTaring JigmeTaring JigmeTendong SchappeZarong DzasaZarong Dzasa regiert das LandWangchen Geleg SurkhangPhuntsok WangyalNgabo Ngawang JigmeNgabo Ngawang JigmeNgawang KesangChikyak Khenpo Lobsang GelegRinzin Dorji RingangGebirgsbewohnerInfanterie hat +10% Geschwindigkeit und +2% Angriff in den BergenInfanterie hat +10% Geschwindigkeit und +2% Angriff in den BergenSchlecht organisierte ArmeeAufgrund des Drucks der Aristokratie, eine starke Zentralmacht zu vermeiden, ist die tibetische Armee völlig unzureichend ausgerüstet und schlecht vorbereitet. Einige Gewehre sind seit Jahren nicht mehr abgefeuert worden, und nur die Wache des Dalai Lama ist mehr oder weniger gut organisiert.Reform der Armee im GangeMit Hilfe von ausländischen Beratern werden wir die Organisation unserer Armee reformieren.Die Gebildeten als Offiziere anwerbenBritische Schule GyantseDuales BildungssystemModernisierte BildungDob Dob WachsamkeitDie Dob dobs sind die Mönche, die für die Kontrolle der anderen Mönche zuständig sind. Ihre Aufgabe besteht zwar hauptsächlich darin, die Menschenmengen während der Feste zu kontrollieren, aber sie können auch Mönche bestrafen, die sich von perversen Ideen verleiten lassen.Rückständige IndustrieRückständige IndustrieTaring Jigme tritt in die Armee einErste Phase der Armeereform im GangeDrabshi Lékhoung, Abteilung ArsenalDrabshi Lékhoung, ProduktionsabteilungTibet will einen offiziellen GarantievertragTibet ist ein wichtiges Bollwerk gegen jegliche chinesische Ambitionen gegenüber Indien. Das Land hat vor kurzem Reformen nach britischem Vorbild eingeleitet und möchte nun unsere engeren Beziehungen durch einen Garantievertrag formalisieren, der teilweise auf dem 1910 zwischen Britisch-Indien und der königlichen Dynastie von Bhutan unterzeichneten Vertrag von Punakha basiert.Wir werden die Unabhängigkeit des Landes garantieren.Wir können nicht riskieren, in einen Krieg hineingezogen zu werdenGroßbritannien verpflichtet sich, das tibetische Territorium zu schützenUm ihre Beziehungen zu Tibet zu stärken, hat die britische Regierung angekündigt, dass sie die Unabhängigkeit und Souveränität Tibets schützen wird. Der lamaistische Staat hat eine Reihe von beispiellosen demokratischen Reformen durchgeführt, um sich der modernen Welt zu öffnen und dem Land moderne Institutionen zu geben, während der nächste Herrscher, der Dalai Lama, zu jung ist, um persönlich zu regieren. Der in den vergangenen Monaten von der britischen Mission in Lhasa ausgehandelte Vertrag lehnt sich teilweise an den Vertrag von Punakha an, der 1910 zwischen Britisch-Indien und der königlichen Dynastie von Bhutan unterzeichnet wurde. Dieser neue Vertrag zeigt die Entschlossenheit der britischen Regierung, ihre Interessen in Indien zu schützen, ein Thema, das wichtiger denn je ist, da sich China seit der Revolution von 1912 in einem Zustand chronischer Instabilität befindet.Was kommt als Nächstes? Schlagzeilen über Bhutan?Die Briten haben uns nur leere Versprechungen gemachtNachdem wir die Aushandlung eines britischen Schutzvertrages gefordert hatten, antwortete uns Sir Basil Gould, dass die britische Regierung bereit sei, gute Beziehungen zu Tibet zu unterhalten und uns viel Erfolg bei unserem Modernisierungsprogramm wünsche, dass sie aber keine Versprechungen machen wolle, die sie möglicherweise nicht erfüllen könne, und deshalb unseren Vorschlag ablehne.Wir müssen auf unsere Wünsche verzichtenDie Tibeter bitten um einen ausländischen MilitärkommandantenWir müssen mit der britischen Regierung Kontakt aufnehmen und sie fragen, ob sie bereit wäre, uns einen fähigen Offizier zu schicken, der die tibetischen Streitkräfte im Feld führen könnte, um die Verteidigung unseres Landes zu stärken.Ermächtigung von Brigadier Neame, tibetische Einheiten zu befehligenWir können das Risiko einer solchen Entscheidung nicht eingehen.Die Briten haben Brigadier Neame ermächtigt, direkt an militärischen Operationen teilzunehmen!Die britische Regierung hat zugestimmt, die Hilfe ihrer militärischen Mission auszuweiten und hat Brigadier Philip Neame, der bereits die Modernisierung unserer Armee überwacht, autorisiert, direkt an der Leitung von Operationen beteiligt zu werden.Seine Erfahrung wird von unschätzbarem Wert sein.Die Briten haben sich geweigert, ihre Militärmission auszuweiten.Die britische Regierung hat unser Ersuchen abgelehnt, die Offiziere der Militärmission in Lhasa direkt in die Planung unserer Operationen einzubeziehen.Enttäuschung darf nicht zu Wut führenDie große Überprüfung der tibetischen ArmeeZum ersten Mal seit Jahren hat sich ein großer Teil der Armee zu Übungszwecken versammelt. Außerdem ist es das erste Mal seit Anfang des Jahrhunderts, dass ein westlicher Berater anwesend ist, um den Zustand der Armee zu analysieren und Richtlinien zu erlassen. Zum Erstaunen des westlichen Experten sind einige Gewehre seit Jahren nicht mehr abgefeuert worden, und es ist klar, dass eine völlige Umstrukturierung erforderlich sein wird. Dieser langwierige Prozess könnte die Verteidigungssituation Tibets stärken, doch die religiöse Elite könnte sich jedem Modernisierungsplan widersetzen, da das Offizierskorps eine Berufsarmee einsetzen könnte, um das traditionelle theokratische Regime zu bedrohen.Dieser Prozess wird Zeit brauchenDie Ausbildung der Armee wurde modernisiertNach großen Anstrengungen ist der erste Teil der Armeereform endlich vollständig umgesetzt worden. Der nächste Schritt wird darin bestehen, einen Teil der Offiziere in modernen Armeetaktiken auszubilden.Der Weg ist noch langBeginn der Suche nach dem Dalai LamaVor zweieinhalb Jahren verstarb der vorherige Dalai Lama. Nach jedem Tod wird der Dalai Lama irgendwo als Tibeter wiedergeboren. Daher ist die Suche nach dem Dalai Lama die wichtigste Aufgabe der Regentschaft, um den Fortbestand des theokratischen Systems zu gewährleisten. Der Regent hat gerade die tibetische Nationalversammlung einberufen, um zu entscheiden, wo nach dem Dalai Lama gesucht werden soll. In diesem Prozess waren zwei Elemente von wesentlicher Bedeutung: Zeichen und Omen sollten der Regierung allgemeine Informationen darüber geben, wo sie suchen sollte. Dann würden die Visionen des Regenten genauere Informationen über den Aufenthaltsort des nächsten Dalai Lama liefern. Er erklärte, dass er letztes Jahr, als er am Lhamolatso-See war, die Buchstaben „a“, ‚ka‘ und „ma“ sah, ein Kloster mit einem dreistöckigen türkisfarbenen Dach, eine vergoldete pagodenartige Spitze und einen gewundenen Pfad, der östlich dieses Klosters zu einem kahlen Hügel gegenüber einem kleinen einstöckigen Haus mit einem blauen Dach führte. A sollte für Amdo stehen (die ehemalige tibetische Provinz im Nordosten). Dies passt zu der Tatsache, dass sich der Kopf des Dalai Lama nach seinem Tod nach Osten wandte. Außerdem erschien über Nacht auf der Ostseite einer hölzernen Säule an der Nordostseite des Thronsaals ein großer sternförmiger Pilz. Außerdem hatten die Staatsorakel Nechung, Gadong und Samye bei verschiedenen Gelegenheiten zeremonielle Schals nach Osten geschleudert, während sie in Trance waren. \n\nWährend ein Teil der Versammlung davon überzeugt ist, dass Suchtrupps nach Amdo geschickt werden müssen, das derzeit unter der Kontrolle von Hui-Kriegsherren steht, argumentierten andere, angeführt von Lönchen Langdün, dass einer seiner Verwandten, der Sohn von Yabshi Phawpön, der Dalai Lama sei, weil eines der Pferde aus dem Stall des vorherigen Dalai Lama ausgebrochen und zu seinem Haus gerannt sei, als ob es auf seinen Herrn warte.Der Kopf des vorherigen Dalai Lama hat uns den Weg gezeigt: OstDas Pferd hat uns gezeigt, dass der Dalai Lama genau hier ist, in Lhasa.Tibetische Abgesandte suchen den Dalai Lama in unserem TerritoriumEs scheint, dass tibetische Gesandte unter den ethnischen Tibetern, die in unserem Gebiet leben, nach der Reinkarnation ihres Führers, des Dalai Lama, suchen.Ich habe dringendere AngelegenheitenWir können keine ausländischen Agenten auf unserem Territorium dulden.Wir haben ihn gefunden!In dem kleinen und abgelegenen Dorf Taktser, auf einem Hügel, umgeben von wenigen Feldern und einem Meer von Steppenwildnis, lebten nomadische Hirten. Es war eines von nur 17 Häusern, ein rechteckiges, ebenerdiges Gebäude, dessen verschiedene Teile um einen großen zentralen Hof angeordnet waren und das ein rechteckiges Flachdach hatte. An den Außenwänden gab es außer der Türöffnung keine Öffnungen. Auf dem Dach befanden sich drei Schornsteine und zwei Luftschächte. Um das Dach herum befanden sich kleine Dachrinnen mit Abflussrohren, die in den Innenhof führten. Über dem Eingang war ein Sockel im Dach angebracht, der einen 10 Fuß hohen Fahnenmast aufnehmen konnte. \n\nDer Suchtrupp kam dorthin, weil der Buchstabe \"a\", den Reting Rinpoche in seiner Vision gesehen hatte, sich auf die Provinz Amdo bezog, der Buchstabe \"ka\" bedeutete sicherlich das Kloster Kumbum. Dieses Gebäude war dreistöckig und mit blauen Ziegeln gedeckt, wie der Regent beschrieb. Der letzte Teil der Vision deutete auf ein Haus mit einem eigenartigen Baum hin. Hier schließlich sahen sie ein Haus mit einem knorrigen Wacholderbusch auf dem flachen Dach...\n\n Um das zu untersuchen, verkleidete sich Kewtsang Rinpoche, der die Gruppe anführte, als Diener, während sie baten, für die Nacht zu bleiben. Darin lebten ein paar Bauern und ihre Kinder, der erste lebte im Kumbum-Kloster, da er als Reinkarnation des Taktser Rinpoche erkannt worden war. Eines dieser Kinder erkannte ihn plötzlich und rief ihn mehrmals „Sera Lama“, als ob er sein Kloster kennen würde. Einige Tage später kamen sie mit einigen Gegenständen zurück, die sie aus Lhasa mitgebracht hatten, und er erkannte die Gegenstände, die dem früheren Dalai Lama gehörten. Die Gruppe brach dann nach Kumbum auf und brachte die letzte Inkarnation von Avalokiteśvara mit.Sie müssen so schnell wie möglich zurückkehrenDie Tibeter scheinen das Kind gefunden zu habenEiner der tibetischen Suchtrupps hat den Dalai Lama möglicherweise in dem kleinen Dorf Taktser gefunden. Das Kind wurde ins Kloster Kumbum gebracht und es scheint, dass sie sich auf die Abreise nach Lhasa vorbereiten.Lasst sie gehenSchickt ihnen ein kleines diplomatisches GeschenkSchickt Wachen und verbietet ihnen die Abreise, bis sie 100.000 Silbermünzen bezahlt haben!Die Äbte von Kumbum wollen, dass wir den Dalai Lama dort anerkennen oder eine Entschädigung zahlen.Als sie erfuhren, dass wir eine Vereinbarung über die Ausreise des wahrscheinlichen Dalai Lama trafen, schritten die Äbte des Klosters von Kumbum ein. Damit der Junge ihre Mauern verlassen kann, wollen sie, dass wir ihn gleich hier als Dalai Lama anerkennen und nicht in Lhasa. Das ist gefährlich, denn es würde logischerweise den diplomatischen Wert des offiziell noch kleinen Jungen erhöhen und es würde in gewisser Weise anerkennen, dass Tibet von China abhängig ist, was in Tibet niemand will. Um auf diese Forderungen zu verzichten, haben sie uns aufgefordert, eine Reihe von Artefakten abzutreten: Muster der Garderobe des früheren Dalai Lama, einen seiner Throne, ein Exemplar des Kangyur (Sprüche des Buddha in 108 Bänden), geschrieben in goldenen Buchstaben, und ein Exemplar des Tengyur, der tibetischen Übersetzung des Kommentars der indischen Weisen.Wir können unsere Unabhängigkeit in Bezug auf China nicht aufs Spiel setzen, wir müssen wieder zahlenWir müssen die Schlichtung der nationalistischen chinesischen Regierung suchenDie Tibeter bitten uns, die Situation in Bezug auf den vermeintlichen Dalai Lama zu klärenIn einer interessanten Wendung der Ereignisse bitten die Tibeter nun um unsere Hilfe, damit der vermeintliche Dalai Lama das Kloster Kumbum verlassen und nach Lhasa reisen kann. Sie schlagen vor, dass eine Militäreskorte den Dalai Lama auf seinem Weg nach Tibet „beschützen“ soll.nur eine symbolische Vertretung bei der Krönungszeremonie zu fordern.Fordern Sie ein Militärbündnis.Chinesischer Vorschlag, dass eine Militäreskorte den Dalai Lama auf seinem Weg nach Tibet \"schützen\" sollDie Chinesen haben vorgeschlagen, dass eine Militäreskorte den Dalai Lama zurück nach Tibet begleiten wird.Stimmen Sie der Eskorte zuVersuchen Sie zu verhandeln.Wählt stattdessen den Kandidaten von Yabshi Phawpön!Ein Bündnis mit [WTT_current_china_leader.GetNameDef]?Die Situation ist schwierig. Der Junge, den wir für den Dalai Lama halten, wird als Geisel gehalten, und wir könnten gezwungen sein, uns einer chinesischen Allianz anzuschließen.Das ist immer noch besser als eine chinesische Invasion!Zugeständnisse machen, aber ein Militärbündnis vermeidenEin Kompromiss mit den ChinesenNach schwierigen Verhandlungen haben unsere Vertreter akzeptiert, dass ein Vertreter der tibetischen und mongolischen Kommission bei der Krönung anwesend sein wird, aber er sollte zuerst nach Indien reisen, um das Überschreiten der tibetisch-chinesischen Grenze zu vermeiden.Dies ist ein vernünftiger KompromissDie Rückkehr des Dalai LamaDie prächtige Prozession ist seit Tagen unterwegs. Jeden Morgen, nachdem er den Ort verlassen hatte, an dem er geschlafen hatte, weihten die Einheimischen den Raum als Kapelle ein. Das heilige Kind reiste in einer goldenen Sänfte, begleitet von einem riesigen Gefolge und vielen Gläubigen, die sich der lebendigen Manifestation von Avalokiteshvara, dem Bodhisattva des Mitgefühls, nähern wollten.Der Gottkönig ist zurückgekehrt!Ein Junge in Lhasa wird als Dalai Lama anerkannt!In einer überraschenden Wendung der Ereignisse hat uns unsere Vertretung in China mitgeteilt, dass der Sohn einer tibetischen Adelsfamilie formell als der Dalai Lama anerkannt wurde. Dies ist äußerst beunruhigend, da sie Suchtrupps ausgesandt hatten, um den Jungen zu finden. Folglich ist unsere junge Geisel, von der man annahm, dass sie der Dalai Lama sei, nun ein gewöhnliches Kind und hat keinen politischen Wert mehr.Es könnte sich um eine tibetische List handelnDie Inthronisierung des Dalai LamaEine prächtige Prozession, bestehend aus dem gesamten Hofstaat des Dalai Lama, verließ den Norbulingka-Palast und bewegte sich langsam auf der Prozessionsstraße in Richtung des Potala-Palastes. Dort wurde der Dalai Lama formell inthronisiert und endgültig als geistiger und weltlicher Herrscher Tibets anerkannt. Dennoch kann das Kind noch nicht regieren, da es erst noch Mönch werden und jahrelang religiöse Texte studieren muss, bevor es die Regentschaft endgültig aufgeben kann.Lang lebe der Dalai LamaDas Schicksal von LangdunLangdun, die mächtigste Figur neben dem Regenten, wurde vom Kashag (Versammlung) vor vollendete Tatsachen gestellt, weil er sich nicht aktiv um die Rückkehr des Dalai Lama bemüht hatte. Er musste sich entscheiden, entweder zurückzutreten und sein Land und seine Titel zu behalten oder abzulehnen und verhaftet zu werden.Ein Rivale wenigerDer Aufstieg von Namgang Dazang DamduMit der Machtübernahme durch die demokratischen Reformer in Tibet muss Namgang Dazang Damdu (auch bekannt unter seinem Adelsnamen Zarong Dzasa) das Land regieren, anstatt lediglich einen konservativeren Herrscher zu beraten. Ihm stehen nun alle Hebel zur Verfügung, um Tibet zu modernisieren und in ein modernes Land zu verwandeln.Wir müssen einen Nachfolger für ihn findenDer wahre Dalai Lama ist enthüllt wordenNach einer Vision eines der wichtigsten Orakel scheint es, dass der wahre Dalai Lama noch nicht gewählt wurde. Mit Hilfe der goldenen Urne wird ein neuer Dalai Lama ausgewählt. Es stellt sich heraus, dass der wahre Dalai Lama Chao Kung ist, ein Abt aus China, der behauptet, für einige Zeit der Dalai Lama gewesen zu sein.Hoch lebe der wahre Dalai LamaGründung der FC LhasaAufgrund des diskreten britischen Einflusses in unserem Land haben einige Tibeter, die sich für die britische Sportart Fußball begeistern, beschlossen, eine ständige Mannschaft, den Lhasa Football Club, zu gründen. Einige Konservative kritisieren die Mannschaft bereits, da sie traditionelle Sportarten wie Laufen und Ringen aufgeben würde.Ausländische Einflüsse sind allgegenwärtigAnkunft einer deutschen ExpeditionEine ausländische wissenschaftliche Expedition aus dem nahegelegenen Deutschland ist in Lhasa eingetroffen, um die anthropologischen und ethnischen Besonderheiten Tibets zu untersuchen. Sie haben eifrig mit mehreren Aristokraten diskutiert und werden bald im Palast empfangen werden.Diese Wissenschaftler sind sehr nett, lass sie ihre Studien fortsetzen.Gibt es eine Möglichkeit, deutsche Gewehre zu erwerben?Gewehre nach Tibet verkaufen?Es kann bis zu 2 Wochen dauern, um die Ausrüstung zu versenden und die Zahlung zu erhalten.Wir haben endlich Nachrichten von der wissenschaftlichen Expedition nach Tibet erhalten, die dorthin geschickt wurde, um die Hypothese zu untersuchen, dass das Gebiet die Ursprungsregion unseres Volkes ist. Außerdem wird sie versuchen, einige alte Weisen zu treffen und eine geheimnisvolle Kraft zu erforschen: das Vril. Die Antwort war jedoch recht überraschend, denn die tibetische Regierung hat die Mitglieder der Expedition gefragt, ob es möglich wäre, einige deutsche Feuerwaffen zu erwerben.Dies könnte der erste Schritt zu einem Bündnis für einen Angriff auf Indien sein!Es besteht kein Interesse am Handel mit isolierten Menschen.Deutschland AkzeptiertDie Deutschen haben unsere Anfrage akzeptiert und werden uns einige Schusswaffen verkaufen.Gute Nachrichten!Deutschland hat unseren Vorschlag abgelehntDie Deutschen haben unseren Antrag abgelehnt, ihnen einige Feuerwaffen zu kaufen.Das ist enttäuschendTibet versucht einen KompromissDie Tibeter haben uns gebeten, unser Angebot für eine Militäreskorte zu überdenken, was sollen wir sagen?Gut, sie können den Dalai Lama haben.Wir haben unsere Bedingungen gestellt, und wir werden sie einhalten.Sie haben unser großzügiges Angebot nicht respektiert, jetzt sind unsere Bedingungen weniger großzügigChinesische Beamte stellen höhere ForderungenVerärgert über die Ablehnung ihres „großzügigen“ Angebots, haben chinesische Diplomaten härtere Bedingungen für die Rückkehr des Dalai Lama gefordertWir müssen akzeptierenWir können uns solche Kosten nicht leisten, vielleicht finden wir einen anderen WegDer Rücktritt von TrimönWir haben endlich das Rücktrittsschreiben von Trimön erhalten. Er mag zum Zeitpunkt des Todes des 13. Dalai Lama das Oberhaupt des Kashag (Versammlung) gewesen sein und einer der wenigen, die den Regenten auf seiner Pilgerreise zum Lhamolatso-See im Sommer 1935 begleiteten, aber Trimön war in letzter Zeit nur noch der Schatten seines 