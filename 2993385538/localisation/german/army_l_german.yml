n, ob es unter der Erde nützliche Ressourcen für uns gibt.Die Funde ausbeutenUnter der Erde warten Ressourcen auf uns, lasst uns graben!Neue WebtechnikenDas Weben von Stoffen ist eines unserer wichtigsten Produktionsmittel. Neue Webtechniken sind unerlässlich, um unsere wirtschaftliche Lage zu verbessern.Reform des SteuersystemsAnstelle von verschiedenen Abgaben sollten alle Steuern in Geld gezahlt werden.Das Land organisierenEinige Grundstücke werden nicht richtig genutzt, wir sollten eingreifen und das in Ordnung bringen.Händler im HimalayaIn den abgeschotteten Gebieten des Himalaya gibt es nur wenige Menschen, die in der Lage sind, zu handeln. Flügge gewordene IndustrieUnsere Industrie mag derzeit noch in den Kinderschuhen stecken, aber sie wächst und muss gut gepflegt werden, damit sie stetig"ARMY_TEMPLATE_INFO:0	""
