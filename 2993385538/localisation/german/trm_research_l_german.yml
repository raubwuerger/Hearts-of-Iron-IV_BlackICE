tech_trm_suspension_christie_eng:0	"Christie Aufhängung"
tech_trm_suspension_christie_ita:0	"Christie-Aufhängung"
tech_trm_suspension_christie_jap:0	"Christie-Federung"

 
tech_trm_suspension_christie_eng_desc:0	"Die Christie-Aufhängung zeichnet sich durch große, unabhängig voneinander aufgehängte Laufräder aus, die auch zur Abstützung des oberen Teils der Kette dienen. Die Laufräder waren an Längslenkern (Umlenkhebeln) montiert, die die Bewegungsrichtung von der Vertikalen in die Horizontale änderten. Ein weiteres Merkmal der Christie-Konstruktionen war der "Cabrio"-Antrieb: die Möglichkeit, die Raupen für Straßenfahrten abzunehmen, was höhere Geschwindigkeiten und eine größere Reichweite ermöglichte und den Verschleiß der empfindlichen Raupenketten verringerte."
tech_trm_suspension_christie_ita_desc:0	"Die Christie-Aufhängung zeichnet sich durch große, unabhängig voneinander aufgehängte Laufräder aus, die auch zur Abstützung des oberen Teils der Kette dienen. Die Laufräder waren an Längslenkern (Umlenkhebeln) montiert, die die Bewegungsrichtung von der Vertikalen in die Horizontale änderten. Ein weiteres Merkmal der Christie-Konstruktionen war der "Cabrio"-Antrieb: die Möglichkeit, die Raupen für Straßenfahrten abzunehmen, was höhere Geschwindigkeiten und eine größere Reichweite ermöglichte und den Verschleiß der empfindlichen Raupenketten verringerte."
tech_trm_suspension_christie_improved_fra:0	"Verbesserte Christie-Aufhängung"
tech_trm_suspension_christie_improved_ita:0	"Verbesserte Christie-Aufhängung"
tech_trm_suspension_christie_improved_sov:0	"Verbesserte Christie-Aufhängung"

tech_trm_suspension_christie_improved_fra_desc:0	"Die umsetzbare Christie-Aufhängung war eine Folge der zerbrechlichen und empfindlichen Raupenfahrwerke der frühen 1930er Jahre. Gegen Ende des Krieges erwies sich der Cabrio-Aspekt als unnötige Komplikation, die wertvollen Platz im Panzer beanspruchte, und die Funktion wurde fallen gelassen, wodurch der Panzer leichter wurde."
 
tech_trm_suspension_christie_improved_ita_desc:0	"Die Cabrio-Funktion der Christie-Aufhängung war eine Folge der zerbrechlichen und empfindlichen Raupenketten-Systeme der frühen 1930er Jahre. Gegen Ende des Krieges wurde die Cabriofunktion zu einer unnötigen Komplikation, die wertvollen Platz im Panzer beanspruchte, und die Funktion wurde fallen gelassen, um den Panzer leichter zu machen."
tech_trm_suspension_christie_improved_sov_desc:0	"Die Cabrio-Funktion der Christie-Aufhängung war eine Folge der zerbrechlichen und empfindlichen Raupenketten-Systeme der frühen 1930er Jahre. Gegen Ende des Krieges wurde die Cabriofunktion zu einer unnötigen Komplikation, die wertvollen Platz im Panzer beanspruchte, und die Funktion wurde fallen gelassen, um den Panzer leichter zu machen."
tech_trm_suspension_christie_improved_usa_desc:0	"Die Cabrio-Funktion der Christie-Aufhängung war eine Folge der zerbrechlichen und empfindlichen Raupenketten-Systeme der frühen 1930er Jahre. Gegen Ende des Krieges erwies sich der Cabrio-Aspekt als unnötige Komplikation, die wertvollen Platz im Panzer beanspruchte, und die Funktion wurde fallen gelassen, um den Panzer leichter zu machen."

 

