tech_trm_engine_gasoline_basic_eng_desc:0	"Benzinmotoren verfügen über eine höhere Beschleunigung und Höchstgeschwindigkeit als Dieselmotoren (was eine bessere Manövrierfähigkeit als bei Dieselmotoren gewährleistet) und sind zudem kostengünstiger in der Herstellung. Allerdings sind sie weniger zuverlässig, verbrauchen mehr Kraftstoff und haben ein geringeres Drehmoment, was ihre Geländegängigkeit beeinträchtigt."
