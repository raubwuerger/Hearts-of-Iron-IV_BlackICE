tech_trm_armour_construction_cast_partial_eng_desc:0	"Guss war im Grunde genommen ein einzelnes Stück Panzerung, das aus einer Form hergestellt wurde. Mit dieser Methode lassen sich komplexere Formen herstellen, insbesondere abgerundete Panzerplatten. Gusspanzerung bot viele Vorteile – sie war oft weich (d. h. nicht spröde) und dennoch fest und hart, während sie schneller hergestellt werden konnte als geschweißte Panzerung. \n\nDie Nachteile bestanden darin, dass das Verfahren ressourcenintensiv war, da es mehr Stahl benötigte als andere Konstruktionsmethoden, und dass es sehr qualifizierte Arbeitskräfte sowie umfangreiches Know-how erforderte, um hochwertige Panzerplatten zu gießen. \n\nZunächst wurde das Gussverfahren nur für die Herstellung von Teilen von Rümpfen oder Türmen verwendet."
tech_trm_armour_construction_cast_partial_ger:0	"Teilweise Gussbauweise"
tech_trm_armour_construction_cast_partial_ita_desc:0	"Guss war im Grunde genommen ein einzelnes Stück Panzerung, das aus einer Form hergestellt wurde. Mit dieser Methode lassen sich komplexere Formen herstellen, insbesondere abgerundete Panzerplatten. Das Gießen eines gepanzerten Fahrzeugs bot viele Vorteile – gegossene Panzerung war oft weich (d. h. nicht spröde) und dennoch fest und hart, während der Prozess schneller war als das Schweißen.\n\nDie Nachteile bestanden darin, dass das Verfahren ressourcenintensiv war, da es mehr Stahl benötigte als andere Bauweisen, und dass es sehr qualifizierte Arbeitskräfte sowie viel Fachwissen erforderte, um qualitativ hochwertige Panzerung zu gießen. \n\nZunächst wurde das Gießen nur für die Herstellung von Teilen von Rümpfen oder Türmen verwendet."
tech_trm_armour_construction_cast_partial_jap:0	"Teilweise Gussbauweise"
