tech_trm_special_wet_ammo_desc:0	"Die Nassstauung bestand aus einem System, bei dem die Geschosse der Hauptkanone in Gestellen auf dem Wannenboden gelagert wurden. Die Geschosse in jedem Gestell waren von separaten kleinen Behältern mit einer Mischung aus Wasser, Ethylenglykol und einem Rostschutzmittel, dem so genannten "Ammudamp", umgeben. Die Patronen sind nicht wirklich "nass", sondern nur durch die kleinen Flüssigkeitsbehälter getrennt. Wenn das Munitionsregal getroffen wurde, sollte die Flüssigkeit auslaufen und etwaige Brände löschen, ähnlich wie beim Fluten des Magazins auf einem Kriegsschiff. 144 Liter Ammudamp wurden für 100 Patronen benötigt."
tech_trm_special_improved_optics_desc:0	"Optiken sind Geräte, die von Fahrzeugbesatzungen verwendet werden, um die Vergrößerung des anvisierten Gegners zu erhöhen und so eine zuverlässigere Zielerfassung zu ermöglichen."
tech_trm_special_maintenance_desc:0	" "
tech_trm_special_stabilizer_desc:0	"Die Bewegung von Fahrzeugen führt zu unerwünschten Bewegungen der in ihnen montierten Geschütze, die minimiert werden müssen, wenn die Geschütze während der Fahrt überhaupt eine Wahrscheinlichkeit haben sollen, ihre Ziele zu treffen. Die Auswirkungen der Fahrzeugbewegung können jedoch durch Geschützstabilisierungssysteme minimiert werden, die dafür ausgelegt sind, die räumliche Ausrichtung der Geschütze trotz der Neigung, des Gierens und des Rollens der sich bewegenden Fahrzeuge beizubehalten."
tech_trm_special_external_fuel_desc:0	""
tech_trm_special_smoke_discharger_desc:0	"Einige Panzer sind mit fest installierten Granatwerfern mit kurzer Reichweite ausgestattet, die zur Verteidigung dienen. Diese Geräte feuerten in der Regel Rauchgranaten ab, um das Fahrzeug hinter einer Rauchwand zu verbergen, konnten aber auch mit Spreu, Leuchtraketen oder Antipersonengranaten bestückt werden, um Angriffe der Infanterie abzuwehren. Auf Fahrzeugen montierte Rauchgranatenwerfer wurden auch als Nebelwerfer bezeichnet."
tech_trm_armour_construction_cast_partial_eng:0	"Teilgegossene Konstruktion"
tech_trm_armour_construction_cast_partial_ger_desc:0	"Beim Guss handelt es sich um ein einzelnes Stück einer Panzerung, das aus einer Form geformt wird. Mit dieser Methode lassen sich komplexere Formen herstellen, insbesondere abgerundete Panzerungen. Das Gießen eines gepanzerten Fahrzeugs bot viele Vorteile - gegossene Panzerung war oft weich (d. h. nicht spröde) und dennoch stark und hart, und sie war schneller als das Schweißen. Die Nachteile waren, dass sie ressourcenkostenintensiv war, da mehr Stahl als bei anderen Konstruktionsmethoden benötigt wurde, und dass sie sehr qualifizierte Arbeitskräfte und viel Know-how erforderte, um hochwertige Panzerung zu gießen."
tech_trm_armour_construction_cast_partial_ita:0	"Teilgegossene Konstruktion"
tech_trm_armour_construction_cast_partial_jap_desc:0	"Beim Guss handelt es sich um ein einzelnes Stück einer Panzerung, das aus einer Form geformt wird. Mit dieser Methode lassen sich komplexere Formen herstellen, insbesondere abgerundete Panzerungen. Das Gießen eines gepanzerten Fahrzeugs bot viele Vorteile - gegossene Panzerung war oft weich (d. h. nicht spröde) und dennoch stark und hart, und sie war schneller als das Schweißen. Die Nachteile waren, dass sie ressourcenkostenintensiv war, da mehr Stahl als bei anderen Konstruktionsmethoden benötigt wurde, und dass sie sehr qualifizierte Arbeitskräfte und viel Know-how erforderte, um hochwertige Panzerung zu gießen."
tech_trm_armour_construction_cast_partial_sov:0	"Teilgegossene Konstruktion"
tech_trm_armour_construction_cast_partial_usa_desc:0	"Beim Guss handelt es sich um ein einzelnes Stück einer Panzerung, das aus einer Form geformt wird. Mit dieser Methode lassen sich komplexere Formen herstellen, insbesondere abgerundete Panzerungen. Gusspanzer boten viele Vorteile - sie waren oft weich (d. h. nicht spröde) und dennoch stark und hart, und sie waren schneller als das Schweißen. Die Nachteile waren, dass sie teuer waren, da mehr Stahl als bei anderen Konstruktionsmethoden benötigt wurde, und dass sie sehr qualifizierte Arbeitskräfte und viel Know-how erforderten, um Qualitätspanzer zu gießen."
tech_trm_armour_construction_cast_partial_swe:0	"Teilgegossene Konstruktion"
tech_trm_armour_construction_cast_partial_hun_desc:0	"Beim Gießen handelte es sich praktisch um ein einzelnes Stück Panzerung, das aus einer Form geformt wurde. Mit dieser Methode können komplexere Formen hergestellt werden, insbesondere abgerundete Panzerungen. Das Gießen von Rüstungen bot viele Vorteile – sie waren oft weich ( d. h. nicht spröde) und immer noch stark und hart und gleichzeitig schneller als Schweißen.\n\nDie Nachteile bestanden darin, dass es ressourcenintensiv war, da es mehr Stahl als andere Konstruktionsmethoden benötigte und sehr qualifizierte Arbeitskräfte und viel Know-how erforderte, um Qualität zu gießen Panzerung.\n\nAnfangs wurden Gussstücke nur für die Herstellung von Teilen von Wannen oder Türmen verwendet."
