tech_trm_tank_recon_desc:	"Durch den Einsatz von Aufklärungsfahrzeugen mit verbesserter Panzerung und Bewaffnung werden wir hochmobile Spähtrupps aufstellen, die in der Lage sind, leichten feindlichen Angriffen standzuhalten und gleichzeitig wichtige Informationen über das Schlachtfeld zu sammeln. Ausgestattet mit gepanzerten Rad- oder Kettenfahrzeugen - und sogar Panzerketten - werden diese Einheiten über eine überlegene Beobachtungsoptik, Schnellfeuerkanonen und verbesserte Kommunikationssysteme verfügen, die es ihnen ermöglichen, mit größerer Effektivität vor unseren Hauptstreitkräften zu operieren. Ihre Fähigkeit, leicht verteidigte Stellungen anzugreifen und sich schnell zurückzuziehen, wird sie für eine flüssige und schnelle Kriegsführung unverzichtbar machen."
