tech_trm_armour_construction_cast_round_cze_desc:0	"Abgerundete Türme stellten die letzte Entwicklungsstufe der Turmtechnologie im Zweiten Weltkrieg dar. Durch die Verwendung von Stahlguss und die stark abgerundete Oberfläche variierten die Einfallswinkel über die gesamte Oberfläche hinweg erheblich, was die Wahrscheinlichkeit maximierte, dass ein AP-Geschoss voller Kaliber vom Fahrzeug abprallen würde. Außerdem wurde der Turm dadurch leichter und flacher, was bedeutete, dass er schwerer zu treffen war. Der größte Nachteil war der geringere Platz im Inneren für Ausrüstung oder Besatzung."
tech_trm_armour_construction_welded_jap_desc:0	"Der Übergang vom Nieten zum Schweißen begann 1934, als modifizierte Versionen der sowjetischen Panzer BT und T-26 unter Verwendung von aus Deutschland erworbener Schweißtechnik produziert wurden, wo das Schweißen ebenfalls eingesetzt wurde, sobald 1934 mit der Panzerproduktion begonnen wurde. Andere Länder folgten sechs oder sieben Jahre später, und es wurde zur Standardmethode für die Herstellung der meisten gepanzerten Fahrzeuge.\n\nDie Vorteile des Schweißens liegen darin, dass es eine leichte und relativ schnelle Methode zur Verbindung von Panzerungen bietet – die Toleranz und der Spielraum für Fehler sind zudem größer – und darüber hinaus kann man eine gröbere Schweißnaht anbringen, um Lücken auszugleichen. Die Qualitätskontrolle verlief äußerst schnell, und Probleme ließen sich leicht erkennen.\n\nDer größte und wahrscheinlich einzige Nachteil bestand darin, dass es im Vergleich zu anderen Techniken viel Geschick und Know-how erforderte. So konnten beispielsweise Frauen Panzer mittels Nieten herstellen, beim Schweißen war dies jedoch unmöglich."
tech_trm_armour_construction_welded_usa_desc:0	"Der Wechsel vom Nieten zum Schweißen begann 1934, als modifizierte Versionen der sowjetischen Panzer BT und T -26-Panzer unter Verwendung von Schweißtechnologie aus Deutschland produziert wurden, wo das Schweißen ebenfalls eingesetzt wurde, sobald 1934 mit der Panzerproduktion begonnen wurde. Andere Länder folgten sechs oder sieben Jahre später, und es wurde zur Standardmethode für die Herstellung der meisten gepanzerten Fahrzeuge.\n\nDie Vorteile des Schweißens liegen darin, dass es eine leichte und relativ schnelle Methode zur Verbindung von Panzerungen bietet – die Toleranz und der Spielraum für Fehler sind zudem größer – und darüber hinaus kann man eine gröbere Schweißnaht anbringen, um Lücken auszugleichen. Die Qualitätskontrolle verlief äußerst schnell, und Probleme ließen sich leicht erkennen.\n\nDer größte und wahrscheinlich einzige Nachteil bestand darin, dass es im Vergleich zu anderen Techniken viel Geschick und Know-how erforderte. So konnten beispielsweise Frauen Panzer mittels Nieten herstellen, beim Schweißen war dies jedoch unmöglich."
tech_trm_armour_construction_welded_hun_desc:0	"Der Wechsel vom Nieten zum Schweißen begann 1934, als modifizierte Versionen der sowjetischen Panzer BT und T-26 unter Verwendung von Schweißtechnologie aus Deutschland produziert wurden, wo das Schweißen ebenfalls eingesetzt wurde, sobald 1934 mit der Panzerproduktion begonnen wurde. Andere Länder folgten sechs oder sieben Jahre später, und es wurde zur Standardmethode für die Herstellung der meisten gepanzerten Fahrzeuge.\n\nDie Vorteile des Schweißens liegen darin, dass es eine leichte und relativ schnelle Möglichkeit bietet, Panzerungen zu verbinden – die Toleranz und der Spielraum für Fehler sind zudem größer – und darüber hinaus kann man eine gröbere Schweißnaht anbringen, um Lücken auszugleichen. Die Qualitätskontrolle verlief äußerst zügig, und Probleme ließen sich leicht erkennen.\n\nDer größte und wahrscheinlich einzige Nachteil bestand darin, dass diese Technik im Vergleich zu anderen Verfahren viel Geschick und Fachwissen erforderte. So konnten beispielsweise Frauen Panzer mittels Nieten herstellen, beim Schweißen war dies jedoch unmöglich."
tech_trm_armour_construction_welded_pol:0	"Geschweißte Konstruktion"
tech_trm_armour_construction_welded_cze_desc:0	"Der Übergang vom Nieten zum Schweißen begann 1934, als modifizierte Versionen der sowjetischen Panzer BT und T-26 unter Verwendung von Schweißtechnologie hergestellt wurden, die aus Deutschland stammte, wo das Schweißen ebenfalls eingesetzt wurde, sobald 1934 mit der Panzerproduktion begonnen wurde. Andere Länder folgten sechs oder sieben Jahre später, und das Schweißen wurde zur Standardmethode für die Herstellung der meisten gepanzerten Fahrzeuge. \n\nDie Vorteile des Schweißens liegen darin, dass es eine leichte und relativ schnelle Methode zur Verbindung von Panzerungen bietet – die Toleranz und der Spielraum für Fehler sind zudem größer – und darüber hinaus kann man eine gröbere Schweißnaht anbringen, um Lücken auszugleichen. Die Qualitätskontrolle verlief äußerst zügig, und Probleme ließen sich leicht erkennen. \n\nDer größte und wahrscheinlich einzige Nachteil bestand darin, dass es im Vergleich zu anderen Techniken viel Geschick und Know-how erforderte. So konnten beispielsweise Frauen Panzer mittels Nieten herstellen, beim Schweißen war dies jedoch unmöglich."
tech_trm_armour_design_light_sloped_eng_desc:0	" Wenn eine Panzerplatte relativ zum Anstellwinkel geneigt ist, erhöht sich die relative Panzerdicke oder Sichtlinie. Der panzerbrechende Schuss muss daher eine größere Panzerdicke durchdringen als die tatsächliche Dicke der Panzerplatte. Darüber hinaus erhöht sich die Wahrscheinlichkeit, dass ein ankommendes Projektil abgelenkt oder verformt wird, wodurch das Fahrzeug effizienter geschützt wird. \n\nWie alles hat auch die geneigte Panzerung zwei wesentliche Nachteile. Erstens verringert sich die Höhe einer Platte, wenn sie geneigt ist. Infolgedessen muss die geneigte Platte größer sein als eine flache, was zu einem höheren Gewicht führt. Der zweite wesentliche Nachteil besteht darin, dass eine geneigte Panzerung zwar den Schutz erhöhen mag, bei starker Neigung jedoch den für die Besatzung und die Ausrüstung benötigten Platz im Inneren des Panzers erheblich verringert."
