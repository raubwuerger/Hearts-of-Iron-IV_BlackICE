tech_trm_armour_addon_desc:0	"Aufgesetzte Panzerung besteht im Wesentlichen aus zusätzlichen Platten, die auf den Rumpf oder den Turm eines Fahrzeugs montiert oder geschweißt werden. Sie können aus beliebigen Materialien bestehen, werden jedoch häufig aus Keramik oder laminierten Materialien hergestellt. Wie reaktive Panzerung ist auch die Applikationspanzerung eine einfache und kostengünstige Möglichkeit, den Schutz älterer Fahrzeuge zu verbessern.\n\nEs ist wichtig zu beachten, dass bei gleicher Panzerungsqualität die Durchschlagsfestigkeit einer einzelnen Panzerplatte einer bestimmten Dicke größer ist als die Durchschlagsfestigkeit von zwei Panzerplatten mit derselben Gesamtdicke."
