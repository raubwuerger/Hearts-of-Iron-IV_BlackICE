tech_trm_weapon_c_ger_75_kwk40_long:0	"7,5 cm L/48 KwK 40"
tech_trm_weapon_c_ger_75_kwk40_long_desc:0	" \n\n\n\n£KwK40_L48£\n\n\n\n\nFollowing Bei den ersten Tests der KwK 40 L/43 traten zahlreiche Probleme und Bedenken hinsichtlich ihrer Wirksamkeit auf. Die Ergebnisse der Durchschlagstests waren enttäuschend, und es traten zahlreiche Probleme auf, wie beispielsweise das Nicht-Auswerfen der Geschosse (!).\n\nNach vielen gewonnenen Erkenntnissen hinsichtlich des Zögerns bei der Panzerbewaffnung wurde in diesem Fall beschlossen, keine Zeit zu verlieren und keine Ressourcen zu schonen. Die deutsche Armee erkannte, dass die Fähigkeit, russische Panzer erfolgreich zu durchschlagen, für den Kriegsverlauf entscheidend war, und es wurde angeordnet, parallel zur L/43 eine stärkere und zuverlässigere Version zu entwickeln. Sie wurde KwK 40 L/48 genannt und wurde zur Hauptbewaffnung des Panzer IV sowie zur meistproduzierten Panzerabwehrkanone des Zweiten Weltkriegs. Sie war in der Lage, so gut wie jeden feindlichen Panzer zu durchschlagen."
tech_trm_weapon_c_ger_75_kwk42:0	"7,5 cm L/70 KwK 42"
tech_trm_weapon_c_ger_88_kwk36:0	"8,8 cm L/56 KwK 36"
tech_trm_weapon_c_ger_88_kwk36_desc:0	" \n\n\n£Kwk36£\n\n\n\nIn Ende 1939 bot Hitler Porsche einen Auftrag für die Konstruktion eines neuen schweren Panzers an, während Henschel bereits 1937 mit der Entwicklung eines eigenen Entwurfs begonnen hatte. Die beiden Konstrukteure standen sich schließlich im April 1942, an Hitlers Geburtstag, in einem Wettbewerb gegenüber.\n\nWährend Porsche seinen ersten Panzer (Typ 100) entwarf, kontaktierte Krupp Porsche Anfang 1941 und bot an, eine von den 8,8-cm-Flakgeschützen abgeleitete Kanone zu konstruieren. Unterdessen hatte Henschel auf Wunsch Hitlers eine 7,5-cm-Kanone ausgewählt, und der Auftrag fiel an Rheinmetall.\n\nAnfang 1942 wies Porsches Entwurf zahlreiche Probleme auf, und die Situation stellte sich wie folgt dar: Krupp verfügte über einen funktionsfähigen Turm mit einer 8,8-cm-Kanone in einem problematischen Fahrgestell, während Henschel über einen funktionsfähigen Rumpf verfügte, der auf die Entwicklung der 7,5-cm-Kanone wartete. Es erschien sehr sinnvoll, Henschel mit dem Bau der Rümpfe zu beauftragen und diese mit den 8,8-cm-Türmen von Krupp auszustatten, um schnell etwas einsatzbereit zu haben (die Deutschen suchten verzweifelt nach starken Panzern gegen die UdSSR). Dennoch galt die 7,5-cm-KwK 42 weiterhin als Hauptbewaffnung, da sie die Durchschlagskraftanforderungen von 140 mm auf 1000 Meter erfüllte. \n\nEs gab natürlich noch eine letzte Wendung in der Geschichte. Es wurde eine neue 8,8-cm-Panzergranate entwickelt, die die geforderte Durchschlagskraft erreichte. Außerdem wurde festgestellt, dass der Panzer in Zukunft problemlos auf eine größere 8,8-cm-Kanone aufgerüstet werden könnte. Das Schicksal der Bewaffnung war nun besiegelt, und die 8,8-cm-Kanone mit der Bezeichnung KwK 36 L/56 wurde zur Hauptbewaffnung des Henschel-Entwurfs, der später als "Tiger" bekannt wurde."
tech_trm_weapon_c_ger_105_stuh42:0	"10,5 cm L/28 StuH 42"
tech_trm_weapon_c_ger_105_kwk45_desc:0	" \n\n\n\n           £KwK45_2£\n\n\n\n\n\nTo Um den Prozess der Aufrüstung der Panzer einzuleiten, die zur Aufrechterhaltung der Überlegenheit auf zukünftigen Schlachtfeldern erforderlich sein würden, erstellte Krupp im November 1944 eine Reihe von Konzeptskizzen mit längerer und schwererer Bewaffnung. Für den Königstiger stellte sich Krupp eine 10,5-cm-Kw.K L/68 vor. Diese Waffe hätte neue Zielvorrichtungen und eine Neukonstruktion des Turms erfordert – Gründe, die im Januar 1945 zur Einstellung der Aufrüstung führten, da zu diesem Zeitpunkt weder Zeit noch Ressourcen für derart komplizierte Entwicklungen vorhanden waren."
tech_trm_weapon_c_ger_380_rw61:0	"38 cm L/5,4 RW 61"
tech_trm_weapon_aa_ac_ger_30_mk103:0	"30 mm MK103"
tech_trm_weapon_aa_ac_ger_30_mk103_desc:0	" \n\n\n\n\n       £MK103£\n\n\n\n\n\nThe Die MK 103 war ein 30-mm-Maschinengewehr, das ursprünglich 1942/43 von Rheinmetall für Kampfflugzeuge entwickelt wurde. Es führte ein neues Gurtzuführungssystem ein, das das ältere 20-Schuss-Magazinsystem ersetzte. Die maximale Schussreichweite auf Bodenziele betrug etwa 5.700 m, während Luftziele in einer Entfernung von 4.700 m getroffen werden konnten. Es verfügte über eine 360°-Schwenkbarkeit und einen Höhenwinkel von -10° bis +80°.\n\nBis 1944 fehlten allen bisher produzierten Flakpanzern wesentliche Eigenschaften, um als mehr als nur vorübergehende Lösungen angesehen zu werden. Entweder fehlte ihnen ein vollständig geschlossener Turm zum Schutz der Besatzung, oder die Lafette war nicht um 360° schwenkbar. Auf jeden Fall war eine endgültige Lösung erforderlich. Die kompakten Abmessungen der MK 103 in Verbindung mit der Gurtmunition erwiesen sich als ideal für den Einbau in einen geschlossenen Turm.\n\nEs war nur natürlich, dass diese Kanone zur Bewaffnung des letzten der Flakpanzer IV, des Kugelblitz, dem ersten und einzigen vollständig geschlossenen Flugabwehrpanzer mit Turm des Krieges. Diese Waffe erwies sich aufgrund ihrer innovativen Technologie als deutlich besser als die 2-cm- und 3,7-cm-Flakgeschütze und war äußerst geeignet, Flugzeuge in geringer Höhe zu zerstören."
tech_trm_weapon_aa_ac_ger_37_flak43:0	"3,7 cm/57 FlaK 43"
tech_trm_weapon_art_ger_75_fk18:0	"7,5 cm L/26 FK 18"
tech_trm_weapon_art_ger_75_fk18_desc:0	"Die 7,5-cm-Feldkanonen (FK) 18 wurden Mitte der 1930er Jahre entwickelt, um die seit Anfang der 1930er Jahre im Einsatz befindlichen 7,5-cm-FK-16-Feldkanonen zu ersetzen. Sie wurden von der deutschen Rüstungsfirma Krupp konstruiert. Obwohl die neue Waffe moderner war, war sie in mancher Hinsicht weniger effektiv als das Geschütz, das sie ersetzte. Sie hatte einen kürzeren Lauf und eine geringere Mündungsgeschwindigkeit und verfügte daher über eine deutlich geringere Reichweite.  Zudem war sie teuer und aufwendig in der Herstellung, weshalb nur eine geringe Stückzahl produziert wurde."
tech_trm_weapon_art_ger_105_lefh18m_desc:0	"\n\n\n£Wespe£\n\n\n\n\nBy 1942 benötigte die deutsche Armee dringend gepanzerte Feuerkraft und musste auf den riesigen Bestand an Pz-II-Fahrgestellen zurückgreifen. Aus genau diesem Grund entschied man sich für die Anpassung der neuen leFH 18M, die sich dadurch auszeichnete, dass sie deutlich leichter war als andere Haubitzen. Der Umbau wurde von Alkett durchgeführt und war zwar nicht ganz einfach, aber letztendlich erfolgreich, und das daraus resultierende Fahrzeug, die "Wespe", wurde zu einem der zuverlässigsten und bekanntesten deutschen Selbstfahrlafetten des Zweiten Weltkriegs. \n\nDieser Umbau brachte den Panzer II wieder ins Spiel und verschaffte der Wehrmacht angesichts der großen Anzahl vorhandener Fahrgestelle die dringend benötigte Feuerkraft."
tech_trm_weapon_art_ger_150_sig33:0	"15 cm L/11 sIG 33"
tech_trm_weapon_art_ger_150_sig33_desc:0	"\n\n\n\n\n£33sigtank£\n\n\n\n\n\n\nThe Die sehr effektive sIG 33, eine Mörserhaubitze, war aufgrund ihres Gewichts viel zu schwer, um über das Gelände bewegt zu werden. Auf Drängen von Generalmajor Manstein, dem Verfechter von Selbstfahrlafetten, wurde sie so umkonstruiert, dass sie auf gepanzerte Fahrzeuge montiert werden konnte. \nAnfang 1940 erhielt Alkett den Auftrag, eine Selbstfahrlafette auf dem Pz I-Fahrgestell zu entwickeln – eine sehr logische Wahl, da nach dem Feldzug in Polen eine große Anzahl dieser Panzer reparaturbedürftig war. \n\nDer offensichtlichste Vorteil der Montage einer Kanone war ihre Mobilität, die es ihr ermöglichte, mit dem schnellsten Infanterievorstoß Schritt zu halten und sich über Gelände zu bewegen, das konventionelle gezogene Artillerie erheblich verlangsamt hätte. Zudem konnte sie fast augenblicklich das Feuer eröffnen, während eine normale Kanone erst in Stellung gebracht werden musste, bevor sie feuern konnte.\n\nObwohl die Wirkung einer 15-cm-Granate verheerend war, hatte sie auch eine demoralisierende Wirkung auf die Truppen. Die selbstfahrenden 15-cm-sIG 33 blieben bis zum Kriegsende im Einsatz."
tech_trm_weapon_art_ger_150_sfh18_desc:0	"\n\n\n\n\n        £Hummel£\n\n\n\n\n\nBy 1941 wurde der Panzer IV bereits in Serie gefertigt, und es war ganz offensichtlich, dass er zum meistgebauten deutschen Panzer werden würde. Daher musste eine für sein Fahrgestell geeignete Selbstfahrlafette entwickelt werden. Die Wahl fiel auf die 15-cm-sfH 18, die am häufigsten eingesetzte schwere Feldartilleriekanone. Wie in einer perfekten Liebesgeschichte sollten das meistgebaute Fahrgestell und die meistgebaute schwere Haubitze miteinander verbunden werden. \n\nZum Leidwesen von Krupp wählte das Waffenamt Rheinmetall-Borsig als Entwickler der neuen Selbstfahrlafette aus. Rheinmetall wiederum übertrug die gesamte Entwicklung an seine Tochtergesellschaft Alkett, die bereits über große Erfahrung mit Selbstfahrlafetten verfügte. Das Ergebnis dieser Umrüstung war die meistgebaute Selbstfahrlafette des Zweiten Weltkriegs, die "Hummel"."
tech_trm_ammo_ger_apcr_small:0	"Kleine APCR-Munition (20 mm/37 mm/47 mm/50 mm)"
tech_trm_ammo_ger_apcr_small_desc:0	" \n\n\n\n\n\n\n\n|___IC 001997___| Im Zweiten Weltkrieg führte die Verbesserung des Panzerschutzes zu entsprechenden Bestrebungen, die Durchschlagskraft von Panzerabwehrwaffen zu erhöhen . Der naheliegendste Weg, dies zu erreichen, bestand darin, die Geschwindigkeit des Projektils zu erhöhen, doch ab einem bestimmten Wert würde ein Stahlgeschoss einfach zerbrechen, anstatt einzudringen.\n\nWolframkarbid schien eine Lösung zu bieten, da es härter und dichter als Stahl war, brachte jedoch eigene Probleme mit sich. Wolframkarbid hat fast die doppelte Dichte von Stahl, sodass ein Geschoss, das für eine 6-Pfünder-Kanone ausgelegt ist, mehr als zehn Pfund wiegen kann. Dies würde eine geringere Mündungsgeschwindigkeit, eine längere Flugzeit und eine stärker gekrümmte Flugbahn bedeuten, was die Chancen, dass die Granate einen Panzer zerstört, erheblich verringern würde.\n\nEine Lösung für dieses Problem war die APCR-Granate (Armour Piercing Composite Rigid). Ein kleiner Kern aus Wolfram ist von einer Hülse oder einem Sabot aus leichterem Material wie Stahl, einer Legierung oder Aluminium umgeben. Dieser Sabot ist fest mit dem Kern verbunden und löst sich nicht von ihm, sobald das Geschoss die Mündung verlässt. Beim Aufprall auf das Ziel zerbricht die umgebende Hülse, während der harte, dichte Kern die Panzerung durchschlägt. Im Allgemeinen ist das APCR-Geschoss leichter als ein herkömmliches AP-Geschoss, sodass es eine höhere Mündungsgeschwindigkeit aufweist."
tech_trm_ammo_ger_apcr_large_desc:0	"Verbesserte Durchschlagskraft der Munition."
tech_trm_ammo_ger_heat_early:0	"Frühe HEAT-Munition"
tech_trm_ammo_ger_heat_early_desc:0	 "\n\n\n\n£Early_Heat\n\n\n\n\n\nHigh-explosive Panzerabwehrmunition (HEAT) ist eine Art von Sprengstoff, der den Munroe-Effekt nutzt, um schwere Panzerungen zu durchschlagen. \nDer Gefechtskopf funktioniert so, dass eine Sprengladung eine Metallauskleidung im Inneren des Gefechtskopfes zu einem hochgeschwindigkeitsfähigen, superplastischen Strahl zusammenfallen lässt; dieser ist in der Lage, Panzerstahl bis zu einer Tiefe zu durchdringen, die dem sieben- oder mehrfachen Durchmesser der Ladung entspricht. \nDie Wirkung des Strahls ist rein kinetischer Natur; das Geschoss hat keine explosive oder brandverursachende Wirkung auf das Ziel. Der Strahl bewegt sich in festem Material mit Überschallgeschwindigkeit und erodiert daher ausschließlich in dem lokalen Bereich, in dem er mit dem Panzerungsmaterial in Wechselwirkung tritt. \n\nDeutschland war eines der ersten Länder, das dieses Konzept Mitte 1940 einführte, und setzte es aufgrund seiner "kostengünstigen" Natur eifrig ein. APCR-Munition erforderte Wolfram, woran es Deutschland mangelte."
