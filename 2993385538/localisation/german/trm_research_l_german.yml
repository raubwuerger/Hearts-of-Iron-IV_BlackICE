tech_trm_armour_construction_cast_round_pol:0	"Abgerundete Türme gießen"
tech_trm_armour_construction_cast_round_pol_desc:0	"Abgerundete Geschütztürme waren die letzte Stufe in der Entwicklung der Geschützturmtechnologie des 2. Die stark abgerundete Oberfläche aus Stahlguss bedeutete, dass die Winkel auf der gesamten Oberfläche stark variierten, wodurch die Wahrscheinlichkeit maximiert wurde, dass ein AP-Geschoss vollen Kalibers vom Fahrzeug abprallte. Außerdem war der Turm dadurch leichter und unauffälliger, so dass er schwerer zu treffen war. Der größte Nachteil war der geringere Platz im Inneren für Ausrüstung und Besatzung."
tech_trm_armour_construction_cast_round_cze:0	"Abgerundeter Geschützturm Guss"
tech_trm_armour_construction_welded_pol_desc:0	"Der Wechsel vom Nieten zum Schweißen begann 1934, als modifizierte Versionen der sowjetischen BT- und T-26-Panzer mit Hilfe der aus Deutschland übernommenen Schweißtechnik hergestellt wurden, wo das Schweißen ebenfalls ab 1934 eingesetzt wurde. Andere Länder folgten sechs oder sieben Jahre später und es wurde zur Standardmethode für die Produktion der meisten gepanzerten Fahrzeuge.\n\nDie Vorteile des Schweißens liegen darin, dass es eine leichte und recht schnelle Möglichkeit bietet, Panzer zu verbinden - die Toleranz und die Fehlertoleranz sind ebenfalls höher - und außerdem können Sie eine gröbere Schweißnaht anbringen, um Lücken auszugleichen. Die Qualitätskontrolle war extrem schnell und Probleme waren leicht zu erkennen.\n\n Der wichtigste und wahrscheinlich einzige Nachteil war, dass es im Vergleich zu anderen Techniken viel Geschick und Know-how erforderte. Zum Beispiel konnten Frauen Tanks mit Nieten herstellen, aber beim Schweißen war dies unmöglich."
tech_trm_armour_construction_welded_cze:0	"Geschweißte Konstruktion"
tech_trm_armour_design_partial_sloped_pol:0	"Teilweise abgeschrägte Panzerung"
tech_trm_armour_design_partial_sloped_pol_desc:0	"Wenn eine Panzerplatte im Verhältnis zum Angriffswinkel geneigt ist, erhöht sich die relative Panzerstärke, also die Sichtlinie. Der panzerbrechende Schuss muss daher einen größeren Teil der Panzerung durchdringen als die tatsächliche Dicke der Panzerplatte. Darüber hinaus erhöht sich die Wahrscheinlichkeit, ein eintreffendes Geschoss abzulenken oder zu deformieren und ein Fahrzeug effizienter zu schützen.\n\n Wie alles hat auch eine schräge Panzerung zwei wesentliche Nachteile. Erstens: Wenn eine Platte abgewinkelt ist, wird ihre Höhe verringert. Das hat zur Folge, dass die abgewinkelte Platte größer sein muss als eine flache, was zu mehr Gewicht führt. Der zweite große Nachteil ist, dass eine abgewinkelte Panzerung zwar den Schutz erhöht, aber bei starker Neigung den für die Besatzung und die Ausrüstung benötigten Platz im Panzer erheblich verringert."
tech_trm_armour_design_partial_sloped_cze:0	"Teilweise geneigte Panzerung"
tech_trm_armour_design_sloped_pol:0	"Schräges Panzerungsdesign"
tech_trm_armour_design_sloped_pol_desc:0	"Wenn eine Panzerplatte im Verhältnis zum Angriffswinkel geneigt ist, erhöht sich die relative Panzerstärke bzw. die Sichtlinie. Der panzerbrechende Schuss muss daher eine größere Menge an Panzerung durchdringen als die tatsächliche Dicke der Panzerplatte. Darüber hinaus erhöht sich die Wahrscheinlichkeit, ein eintreffendes Geschoss abzulenken oder zu deformieren und ein Fahrzeug effizienter zu schützen.\n\n Wie alles hat auch eine schräge Panzerung zwei wesentliche Nachteile. Erstens: Wenn eine Platte abgewinkelt ist, wird ihre Höhe verringert. Das hat zur Folge, dass die abgewinkelte Platte größer sein muss als eine flache, was zu mehr Gewicht führt. Der zweite große Nachteil ist, dass eine abgewinkelte Panzerung zwar den Schutz erhöht, aber wenn sie stark geneigt ist, den für die Besatzung und die Ausrüstung benötigten Platz im Inneren des Panzers erheblich verringert."
tech_trm_armour_design_sloped_cze:0	"Schräges Panzerungsdesign"
tech_trm_engine_diesel_basic_pol:0	"Einfache Diesel-Motoren"
tech_trm_engine_diesel_basic_pol_desc:0	"Dieselmotoren sind zuverlässiger, verbrauchen weniger Kraftstoff und haben ein höheres Drehmoment (bessere Geländegängigkeit) als Benzinmotoren. Auf der anderen Seite sind sie teurer in der Herstellung und haben eine geringere Beschleunigung und Höchstgeschwindigkeit, was ihre Manövrierfähigkeit im Vergleich zu Benzinmotoren etwas einschränkt."
tech_trm_engine_diesel_basic_cze:0	"Einfache Diesel-Motoren"
 
tech_trm_engine_diesel_improved_pol:0	"Verbesserte Dieselmotoren"
 
 # ITA
tech_trm_engine_diesel_interwar_pol_desc:0	"Dieselmotoren sind zuverlässiger, verbrauchen weniger Kraftstoff und haben ein höheres Drehmoment als Benzinmotoren, was ihnen eine bessere Überlandleistung verleiht. Auf der anderen Seite sind sie teurer in der Herstellung und haben eine geringere Beschleunigung und Höchstgeschwindigkeit, was ihre Manövrierfähigkeit im Vergleich zu Benzinmotoren etwas einschränkt."
 
tech_trm_engine_diesel_advanced_pol_desc:0	"Dieselmotoren sind zuverlässiger, verbrauchen weniger Kraftstoff und haben ein höheres Drehmoment als Benzinmotoren, wodurch sie eine bessere Geländegängigkeit aufweisen. Auf der anderen Seite sind sie teurer in der Herstellung und haben eine geringere Beschleunigung und Höchstgeschwindigkeit, was ihre Manövrierfähigkeit im Vergleich zu Benzinern etwas einschränkt."
tech_trm_engine_diesel_advanced_cze_desc:0	"Dieselmotoren sind zuverlässiger, verbrauchen weniger Kraftstoff und haben ein höheres Drehmoment als Benzinmotoren, wodurch sie eine bessere Geländegängigkeit aufweisen. Auf der anderen Seite sind sie teurer in der Herstellung und haben eine geringere Beschleunigung und Höchstgeschwindigkeit, was ihre Manövrierfähigkeit im Vergleich zu Benzinern leicht einschränkt."
tech_trm_engine_gasoline_basic_pol:0	"Basis-Benzinmotoren"
tech_trm_engine_gasoline_basic_cze:0	"Basis-Benzinmotoren"

tech_trm_engine_gasoline_improved_pol:0	"Verbesserte Benzinmotoren"
tech_trm_engine_gasoline_interwar_cze_desc:0	"Benzinmotoren haben eine höhere Beschleunigung und eine höhere Spitzenleistung als Dieselmotoren (und bieten eine bessere Manövrierfähigkeit als Dieselmotoren) und sind zudem billiger in der Herstellung. Allerdings sind sie weniger zuverlässig, verbrauchen mehr Kraftstoff und haben ein geringeres Drehmoment, was ihre Geländegängigkeit verschlechtert."
tech_trm_special_cupola_pol:0	"Commander Kuppel"
tech_trm_suspension_christie_pol:0	"Christie-Federung"
tech_trm_suspension_christie_pol_desc:0	"Die Christie-Federung zeichnet sich durch den Einsatz großer, unabhängig voneinander aufgehängter Laufräder aus, die auch zur Abstützung des oberen Teils der Schiene dienen. Die Laufräder waren an Längslenkern (Umlenkhebeln) montiert, die die Bewegungsrichtung von vertikal zu horizontal änderten. Das Gewicht des Fahrzeugrumpfes wurde über die auf den Längslenkern gelagerten Schraubenfedern übertragen. Ein weiteres Merkmal von Christies Entwürfen war der Cabrio-Antrieb: die Möglichkeit, die Raupen für den Straßenbetrieb abzunehmen, was höhere Geschwindigkeiten und eine bessere Reichweite ermöglichte und den Verschleiß der empfindlichen Raupensysteme verringerte."
tech_trm_suspension_torsion_cze:0	"Torsionsstabfederung"
 
tech_trm_suspension_torsion_cze_desc:0	"Bei Torsionsstäben wird eine lange Stange aus Stahl durch eine Drehkraft verdreht, um eine Federwirkung zu erzielen. Ein Ende des langen Metallstabs ist fest mit dem Fahrzeugchassis verbunden, das andere Ende endet in einem Hebel, der am Rad befestigt ist. Die vertikale Bewegung des Rades bewirkt eine Drehung des Stabes um seine Achse, der der Torsionswiderstand des Stabes entgegenwirkt.\n\n Der Einbau von Torsionsstäben quer über den Boden von Panzerwannen macht diese zwar gut geschützt und ermöglicht eine geringere Breite des Panzers, aber er erhöht auch ihre Höhe. Das ist an sich schon unerwünscht und kann auch das Gewicht der Panzer erheblich erhöhen, insbesondere wenn sie stark gepanzert sind."

 # SWE
 
tech_trm_transmission_differential_swe_desc:0	"Bei dieser Technik wird ein Standard-Differential zwischen den Ketten verwendet, wobei der Antrieb auf den Käfig wirkt, genau wie bei einem Auto. Der Vorteil dieses Systems gegenüber der Kupplungsbremse ist, dass die Durchschnittsgeschwindigkeit des Fahrzeugs gewollt ist, d.h. wenn man nach links lenkt, wird die rechte Spur entsprechend schneller. Der größte Nachteil ist, dass scharfe Kurven nicht möglich sind und dass es nur eine sehr begrenzte Anzahl von möglichen Kurvenradien gibt, abhängig von der Anzahl der Gänge."
 
tech_trm_transmission_differential_cze_desc:0	"Bei dieser Technik wird ein Standard-Differential zwischen den Spuren verwendet, wobei der Antrieb auf den Käfig wirkt, genau wie bei einem Auto. Der Vorteil dieses Systems gegenüber der Kupplungsbremse ist, dass die Durchschnittsgeschwindigkeit des Fahrzeugs gewollt ist, d.h. wenn man nach links lenkt, wird die rechte Spur entsprechend schneller. Der größte Nachteil ist, dass scharfe Kurven nicht möglich sind und die Anzahl der möglichen Kurvenradien abhängig von der Anzahl der Gänge sehr begrenzt ist."
tech_trm_transmission_twin_transmission_pol:0	"Zwillingsgetriebe"
tech_trm_transmission_twin_transmission_cze:0	"Zwillingsgetriebe"
tech_trm_transmission_twin_transmission_hun_desc:0	"Bei diesem System, das auch als Getriebelenkung bezeichnet wird, wird jede Spur von einem funktional getrennten Mehrganggetriebe angetrieben. Die Lenkung erfolgt durch den Wechsel des Gangs auf einer Spur und nicht auf der anderen.\n\nAbgesehen davon, dass es etwas aufwändiger ist, hat es gegenüber dem Kupplungs- und Bremssystem nur den Nachteil, dass es nicht so enge Kurven fahren kann.\n\nDies erwies sich als kostspielige, aber sehr leistungsfähige Lösung, die nur noch vom doppelten Differentialgetriebe übertroffen wird."
 

