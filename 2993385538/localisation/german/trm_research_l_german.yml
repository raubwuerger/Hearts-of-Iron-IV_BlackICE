tech_trm_medium_advanced_tank_ger_panther_casemate_1_desc:1	"Im Zusammenhang mit gepanzerten Kampffahrzeugen bezieht sich der Begriff "Kasemattenbauweise" auf Fahrzeuge, bei denen die Hauptkanone direkt im Rumpf montiert ist und die keinen drehbaren Turm aufweisen, wie er üblicherweise bei Panzern zu finden ist. Eine solche Bauweise macht das Fahrzeug in der Regel mechanisch einfacher, kostengünstiger in der Herstellung, leichter und flacher. Das eingesparte Gewicht kann genutzt werden, um eine schwerere, leistungsstärkere Kanone zu montieren oder alternativ den Panzerschutz des Fahrzeugs im Vergleich zu regulären Panzern mit Turm zu erhöhen. Im Gefecht muss die Besatzung jedoch das gesamte Fahrzeug drehen, wenn sich ein feindliches Ziel außerhalb des begrenzten Schwenkbereichs der Kanone befindet. Dies kann sich in Kampfsituationen als sehr nachteilig erweisen.\n\nWährend des Zweiten Weltkriegs wurden gepanzerte Kampffahrzeuge vom Kasematten-Typ sowohl von den vereinten Streitkräften der deutschen Wehrmacht als auch von der sowjetischen Roten Armee intensiv eingesetzt. Sie wurden hauptsächlich als Panzerjäger und Sturmgeschütze eingesetzt."
