tech_trm_armour_construction_cast_round_fra:0	"Abgerundeter Guss-Geschützturm"
tech_trm_armour_construction_cast_round_fra_desc:0	"Abgerundete Geschütztürme waren die letzte Entwicklungsstufe der Geschützturmtechnologie des Zweiten Weltkriegs. Die stark abgerundete Oberfläche aus Stahlguss bedeutete, dass die Winkel auf der gesamten Oberfläche stark variierten, was die Wahrscheinlichkeit erhöhte, dass ein AP-Geschoss vollen Kalibers vom Fahrzeug abprallte. Außerdem war der Turm dadurch leichter und unauffälliger, so dass er schwerer zu treffen war. Der größte Nachteil war der geringere Platz im Inneren für Ausrüstung und Besatzung."
tech_trm_armour_construction_cast_round_jap_desc:0	"Abgerundete Geschütztürme waren die letzte Entwicklungsstufe der Geschützturmtechnologie des Zweiten Weltkriegs. Die stark abgerundete Oberfläche aus Stahlguss bedeutete, dass die Winkel auf der gesamten Oberfläche stark variierten, was die Wahrscheinlichkeit erhöhte, dass ein AP-Geschoss vollen Kalibers vom Fahrzeug abprallte. Außerdem war der Turm dadurch leichter und unauffälliger, so dass er schwerer zu treffen war. Der größte Nachteil war der geringere Platz im Inneren für Ausrüstung und Besatzung."
tech_trm_armour_construction_cast_round_sov_desc:0	"Abgerundete Geschütztürme waren die letzte Entwicklungsstufe der Geschützturmtechnologie des Zweiten Weltkriegs. Die stark abgerundete Oberfläche aus Stahlguss bedeutete, dass die Winkel auf der gesamten Oberfläche stark variierten, was die Wahrscheinlichkeit erhöhte, dass ein AP-Geschoss vollen Kalibers vom Fahrzeug abprallte. Außerdem war der Turm dadurch leichter und unauffälliger, so dass er schwerer zu treffen war. Der größte Nachteil war der geringere Platz im Inneren für Ausrüstung und Besatzung."
tech_trm_armour_construction_cast_round_usa_desc:0	"Abgerundete Geschütztürme waren die letzte Entwicklungsstufe der Geschützturmtechnologie des Zweiten Weltkriegs. Die stark abgerundete Oberfläche aus Stahlguss bedeutete, dass die Winkel auf der gesamten Oberfläche stark variierten, was die Wahrscheinlichkeit erhöhte, dass ein AP-Geschoss vollen Kalibers vom Fahrzeug abprallte. Außerdem war der Turm dadurch leichter und unauffälliger, so dass er schwerer zu treffen war. Der größte Nachteil war der geringere Platz im Inneren für Ausrüstung und Besatzung."
tech_trm_armour_construction_cast_round_swe_desc:0	"Abgerundete Türme waren die letzte Stufe in der Entwicklung der Turmtechnologie im Zweiten Weltkrieg. Durch die Verwendung von Stahlguss sorgte die stark abgerundete Oberfläche dafür, dass die Spielwinkel über die gesamte Oberfläche stark variierten, wodurch die Wahrscheinlichkeit maximiert wurde, dass eine vollkalibrige AP-Patrone abprallen würde Dadurch wurde der Turm leichter und hatte ein niedriges Profil, was bedeutete, dass er schwerer zu treffen war. Sein Hauptnachteil war der geringere Innenraum für Ausrüstung oder Besatzung."
tech_trm_armour_construction_cast_round_pol:0	"Abgerundete Türme gießen"
tech_trm_armour_construction_cast_round_pol_desc:0	"Abgerundete Geschütztürme waren die letzte Stufe in der Entwicklung der Geschützturmtechnologie des 2. Die stark abgerundete Oberfläche aus Stahlguss bedeutete, dass die Winkel auf der gesamten Oberfläche stark variierten, wodurch die Wahrscheinlichkeit maximiert wurde, dass ein AP-Geschoss vollen Kalibers vom Fahrzeug abprallte. Außerdem war der Turm dadurch leichter und unauffälliger, so dass er schwerer zu treffen war. Der größte Nachteil war der geringere Platz im Inneren für Ausrüstung und Besatzung."
tech_trm_armour_construction_cast_round_cze:0	"Abgerundeter Geschützturm Guss"
tech_trm_armour_construction_welded_eng:0	"Geschweißte Konstruktion"
tech_trm_armour_construction_welded_eng_desc:0	"Der Übergang vom Nieten zum Schweißen begann 1934, als modifizierte Versionen der sowjetischen Panzer BT und T-26 mit Hilfe der aus Deutschland übernommenen Schweißtechnik hergestellt wurden, wo das Schweißen ebenfalls ab 1934 eingesetzt wurde. Andere Länder folgten sechs oder sieben Jahre später, und so wurde das Schweißen zur Standardmethode für die Herstellung der meisten gepanzerten Fahrzeuge. Die Vorteile des Schweißens liegen darin, dass es ein leichtes und relativ schnelles Verfahren zum Verbinden von Panzern ist - die Toleranz und die Fehlertoleranz sind ebenfalls höher - und außerdem kann man eine gröbere Schweißnaht anbringen, um Lücken auszugleichen. Die Qualitätskontrolle war extrem schnell, und Probleme ließen sich leicht erkennen.\n\n Der größte und wahrscheinlich einzige Nachteil war, dass es im Vergleich zu anderen Techniken viel Geschick und Know-how erforderte. So konnten Frauen beispielsweise Tanks mit Nieten herstellen, aber beim Schweißen war dies unmöglich."
tech_trm_armour_construction_welded_ita:0	"Geschweißte Konstruktion"
tech_trm_armour_construction_welded_ita_desc:0	"Der Übergang vom Nieten zum Schweißen begann 1934, als modifizierte Versionen der sowjetischen Panzer BT und T-26 mit der aus Deutschland übernommenen Schweißtechnik hergestellt wurden. Andere Länder folgten sechs oder sieben Jahre später, und so wurde das Schweißen zur Standardmethode für die Herstellung der meisten gepanzerten Fahrzeuge. Die Vorteile des Schweißens liegen darin, dass es ein leichtes und relativ schnelles Verfahren zum Verbinden von Panzern ist - die Toleranz und die Fehlertoleranz sind ebenfalls höher - und außerdem kann man eine gröbere Schweißnaht anbringen, um Lücken auszugleichen. Die Qualitätskontrolle war extrem schnell, und Probleme ließen sich leicht erkennen.\n\n Der größte und wahrscheinlich einzige Nachteil war, dass es im Vergleich zu anderen Techniken viel Geschick und Know-how erforderte. So konnten Frauen beispielsweise Tanks mit Nieten herstellen, aber beim Schweißen war dies unmöglich."
tech_trm_armour_construction_welded_jap:0	"Geschweißte Konstruktion"
tech_trm_armour_construction_welded_usa:0	"Geschweißte Konstruktion"
tech_trm_armour_construction_welded_hun:0	"Geschweißte Konstruktion"
tech_trm_armour_construction_welded_pol_desc:0	"Der Wechsel vom Nieten zum Schweißen begann 1934, als modifizierte Versionen der sowjetischen BT- und T-26-Panzer mit Hilfe der aus Deutschland übernommenen Schweißtechnik hergestellt wurden, wo das Schweißen ebenfalls ab 1934 eingesetzt wurde. Andere Länder folgten sechs oder sieben Jahre später und es wurde zur Standardmethode für die Produktion der meisten gepanzerten Fahrzeuge.\n\nDie Vorteile des Schweißens liegen darin, dass es eine leichte und recht schnelle Möglichkeit bietet, Panzer zu verbinden - die Toleranz und die Fehlertoleranz sind ebenfalls höher - und außerdem können Sie eine gröbere Schweißnaht anbringen, um Lücken auszugleichen. Die Qualitätskontrolle war extrem schnell und Probleme waren leicht zu erkennen.\n\n Der wichtigste und wahrscheinlich einzige Nachteil war, dass es im Vergleich zu anderen Techniken viel Geschick und Know-how erforderte. Zum Beispiel konnten Frauen Tanks mit Nieten herstellen, aber beim Schweißen war dies unmöglich."
tech_trm_armour_construction_welded_cze:0	"Geschweißte Konstruktion"
tech_trm_armour_design_light_sloped_eng:0	"Leichte Schrägpanzerung"
tech_trm_armour_design_partial_sloped_ger:0	"Teilweise geneigte Panzerung"
tech_trm_armour_design_partial_sloped_ger_desc:0	"Wenn eine Panzerplatte im Verhältnis zum Angriffswinkel geneigt ist, erhöht sich die relative Panzerdicke bzw. die Sichtlinie. Der panzerbrechende Schuss muss daher eine größere Menge an Panzerung durchdringen als die tatsächliche Dicke der Panzerplatte. Darüber hinaus erhöht sich die Wahrscheinlichkeit, ein eintreffendes Geschoss abzulenken oder zu verformen und ein Fahrzeug wirksamer zu schützen.\n\n Wie alles andere hat auch die schräge Panzerung zwei wesentliche Nachteile. Erstens verringert sich die Höhe der Platte, wenn sie abgewinkelt ist. Das hat zur Folge, dass die abgewinkelte Platte größer sein muss als eine flache, was zu einem höheren Gewicht führt. Der zweite große Nachteil ist, dass eine abgewinkelte Panzerung zwar den Schutz erhöht, aber bei starker Neigung den für die Besatzung und die Ausrüstung benötigten Platz im Panzer erheblich verringert."
tech_trm_armour_design_partial_sloped_jap:0	"Teilweise geneigte Panzerung"
tech_trm_armour_design_partial_sloped_jap_desc:0	"Wenn eine Panzerplatte im Verhältnis zum Angriffswinkel geneigt ist, erhöht sich die relative Panzerdicke bzw. die Sichtlinie. Der panzerbrechende Schuss muss daher eine größere Menge an Panzerung durchdringen als die tatsächliche Dicke der Panzerplatte. Darüber hinaus erhöht sich die Wahrscheinlichkeit, ein eintreffendes Geschoss abzulenken oder zu verformen und ein Fahrzeug wirksamer zu schützen.\n\n Wie alles andere hat auch die schräge Panzerung zwei wesentliche Nachteile. Erstens verringert sich die Höhe der Platte, wenn sie abgewinkelt ist. Das hat zur Folge, dass die abgewinkelte Platte größer sein muss als eine flache, was zu einem höheren Gewicht führt. Der zweite große Nachteil ist, dass eine abgewinkelte Panzerung zwar den Schutz erhöht, aber bei starker Neigung den für die Besatzung und die Ausrüstung benötigten Platz im Panzer erheblich verringert."
tech_trm_armour_design_partial_sloped_usa:0	"Teilweise geneigte Panzerung"
tech_trm_armour_design_partial_sloped_usa_desc:0	"Wenn eine Panzerplatte im Verhältnis zum Angriffswinkel geneigt ist, erhöht sich die relative Panzerdicke bzw. die Sichtlinie. Der panzerbrechende Schuss muss daher eine größere Menge an Panzerung durchdringen als die tatsächliche Dicke der Panzerplatte. Darüber hinaus erhöht sich die Wahrscheinlichkeit, ein eintreffendes Geschoss abzulenken oder zu verformen und ein Fahrzeug wirksamer zu schützen.\n\n Wie alles andere hat auch die schräge Panzerung zwei wesentliche Nachteile. Erstens verringert sich die Höhe der Platte, wenn sie abgewinkelt ist. Das hat zur Folge, dass die abgewinkelte Platte größer sein muss als eine flache, was zu einem höheren Gewicht führt. Der zweite große Nachteil ist, dass eine abgewinkelte Panzerung zwar den Schutz erhöht, aber bei starker Neigung den für die Besatzung und die Ausrüstung benötigten Platz im Panzer erheblich verringert."
tech_trm_armour_design_partial_sloped_pol:0	"Teilweise abgeschrägte Panzerung"
tech_trm_armour_design_partial_sloped_pol_desc:0	"Wenn eine Panzerplatte im Verhältnis zum Angriffswinkel geneigt ist, erhöht sich die relative Panzerstärke, also die Sichtlinie. Der panzerbrechende Schuss muss daher einen größeren Teil der Panzerung durchdringen als die tatsächliche Dicke der Panzerplatte. Darüber hinaus erhöht sich die Wahrscheinlichkeit, ein eintreffendes Geschoss abzulenken oder zu deformieren und ein Fahrzeug effizienter zu schützen.\n\n Wie alles hat auch eine schräge Panzerung zwei wesentliche Nachteile. Erstens: Wenn eine Platte abgewinkelt ist, wird ihre Höhe verringert. Das hat zur Folge, dass die abgewinkelte Platte größer sein muss als eine flache, was zu mehr Gewicht führt. Der zweite große Nachteil ist, dass eine abgewinkelte Panzerung zwar den Schutz erhöht, aber bei starker Neigung den für die Besatzung und die Ausrüstung benötigten Platz im Panzer erheblich verringert."
tech_trm_armour_design_partial_sloped_cze:0	"Teilweise geneigte Panzerung"
tech_trm_armour_design_rounded_fra_desc:0	"Mit einer abgerundeten Panzerung sind Sie gegen jeden Winkel besser geschützt (obwohl sie immer noch für die wahrscheinlichsten Winkel optimiert ist). Sie haben jedoch den Nachteil, dass immer die Möglichkeit besteht, dass ein Geschoss senkrecht zur abgerundeten Oberfläche auftrifft. Für Kugeln kann dies ein Problem darstellen, aber Explosionen werden in der Regel trotzdem abgelenkt, da sie eine große Fläche angreifen. Ein potenzieller Vorteil abgerundeter Panzerungsoberflächen besteht darin, dass Bögen die Kraft besser über eine Fläche verteilen als eine flache Oberfläche."
tech_trm_armour_design_sloped_ger_desc:0	"Wenn eine Panzerplatte im Verhältnis zum Angriffswinkel geneigt ist, erhöht sich die relative Panzerdicke bzw. die Sichtlinie. Der panzerbrechende Schuss muss daher eine größere Panzerung durchdringen als die tatsächliche Dicke der Panzerplatte. Darüber hinaus erhöht sich die Wahrscheinlichkeit, ein eintreffendes Geschoss abzulenken oder zu verformen und ein Fahrzeug wirksamer zu schützen.\n\n Wie alles andere hat auch die schräge Panzerung zwei wesentliche Nachteile. Erstens verringert sich die Höhe der Platte, wenn sie abgewinkelt ist. Das hat zur Folge, dass die abgewinkelte Platte größer sein muss als eine flache, was zu einem höheren Gewicht führt. Der zweite große Nachteil ist, dass eine abgewinkelte Panzerung zwar den Schutz erhöht, aber bei starker Neigung den für die Besatzung und die Ausrüstung benötigten Platz im Panzer erheblich verringert."
tech_trm_armour_design_sloped_ita_desc:0	"Wenn eine Panzerplatte im Verhältnis zum Angriffswinkel geneigt ist, erhöht sich die relative Panzerdicke bzw. die Sichtlinie. Der panzerbrechende Schuss muss daher eine größere Panzerung durchdringen als die tatsächliche Dicke der Panzerplatte. Darüber hinaus erhöht sich die Wahrscheinlichkeit, ein eintreffendes Geschoss abzulenken oder zu verformen und ein Fahrzeug wirksamer zu schützen.\n\n Wie alles andere hat auch die schräge Panzerung zwei wesentliche Nachteile. Erstens verringert sich die Höhe der Platte, wenn sie abgewinkelt ist. Das hat zur Folge, dass die abgewinkelte Platte größer sein muss als eine flache, was zu einem höheren Gewicht führt. Der zweite große Nachteil ist, dass eine abgewinkelte Panzerung zwar den Schutz erhöht, aber bei starker Neigung den für die Besatzung und die Ausrüstung benötigten Platz im Panzer erheblich verringert."
tech_trm_armour_design_sloped_hun_desc:0	"Wenn eine Panzerplatte relativ zum Angriffswinkel geneigt ist, erhöht sich die relative Panzerungsdicke oder Sichtlinie. Der panzerbrechende Schuss muss daher eine größere Menge Panzerung durchdringen als die tatsächliche Dicke der Panzerplatte . Darüber hinaus erhöht es die Wahrscheinlichkeit, dass ein ankommendes Geschoss abgelenkt oder deformiert wird, und schützt ein Fahrzeug effizienter.\n\nWie alles hat geneigte Panzerung zwei Hauptnachteile. Erstens verringert sich die Höhe einer Platte, wenn sie angewinkelt wird. Als Infolgedessen muss die abgewinkelte Platte größer sein als eine flache, was zu mehr Gewicht führt. Der zweite große Nachteil besteht darin, dass eine abgewinkelte Panzerung zwar den Schutz erhöht, aber bei starker Neigung den für Besatzung und Ausrüstung benötigten Platz im Panzer erheblich verringert."
tech_trm_armour_design_sloped_pol:0	"Schräges Panzerungsdesign"
tech_trm_armour_design_sloped_pol_desc:0	"Wenn eine Panzerplatte im Verhältnis zum Angriffswinkel geneigt ist, erhöht sich die relative Panzerstärke bzw. die Sichtlinie. Der panzerbrechende Schuss muss daher eine größere Menge an Panzerung durchdringen als die tatsächliche Dicke der Panzerplatte. Darüber hinaus erhöht sich die Wahrscheinlichkeit, ein eintreffendes Geschoss abzulenken oder zu deformieren und ein Fahrzeug effizienter zu schützen.\n\n Wie alles hat auch eine schräge Panzerung zwei wesentliche Nachteile. Erstens: Wenn eine Platte abgewinkelt ist, wird ihre Höhe verringert. Das hat zur Folge, dass die abgewinkelte Platte größer sein muss als eine flache, was zu mehr Gewicht führt. Der zweite große Nachteil ist, dass eine abgewinkelte Panzerung zwar den Schutz erhöht, aber wenn sie stark geneigt ist, den für die Besatzung und die Ausrüstung benötigten Platz im Inneren des Panzers erheblich verringert."
