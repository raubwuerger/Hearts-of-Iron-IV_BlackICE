tech_trm_transmission_differential_cze:0	"Differentialgetriebe"
tech_trm_transmission_differential_ita_desc:0	" Bei dieser Technik kommt ein Standard-Differential zwischen den Ketten zum Einsatz, wobei der Antrieb genau wie bei einem Auto auf den Fahrgestellrahmen wirkt. Für jede Antriebswelle gibt es separate Zahnräder, die unterschiedliche Kettengeschwindigkeiten erzeugen und so die Drehung des Fahrzeugs erzwingen.\n\nDer Vorteil dieses Systems gegenüber der Kupplungs-Brems-Kombination besteht darin, dass die durchschnittliche Fahrzeuggeschwindigkeit beibehalten wird, d. h., wenn man nach links lenkt, beschleunigt die rechte Kette entsprechend.\n\nDer Hauptnachteil besteht darin, dass scharfe Kurven nicht möglich sind und die Anzahl der möglichen Kurvenradien je nach Anzahl der Zahnräder sehr begrenzt ist."
tech_trm_transmission_differential_jap_desc:0	"Bei dieser Technik kommt ein Standarddifferenzial zwischen den Ketten zum Einsatz, wobei der Antrieb genau wie bei einem Auto auf den Fahrgestellrahmen wirkt. Für jede Antriebswelle gibt es separate Getriebe, die unterschiedliche Kettengeschwindigkeiten erzeugen und so die Drehung des Fahrzeugs erzwingen.\n\nDer Vorteil dieses Systems gegenüber der Kupplungs- -Bremse besteht darin, dass die durchschnittliche Fahrzeuggeschwindigkeit beibehalten wird, d. h. wenn man nach links lenkt, beschleunigt die rechte Kette entsprechend.\n\nDer Hauptnachteil besteht darin, dass scharfe Kurven nicht möglich sind und die Anzahl der möglichen Kurvenradien je nach Anzahl der Gänge sehr begrenzt ist. "
tech_trm_transmission_differential_sov_desc:0	"Bei dieser Technik kommt ein Standarddifferenzial zwischen den Ketten zum Einsatz, wobei der Antrieb genau wie bei einem Auto auf den Käfig wirkt. Für jede Antriebswelle gibt es unabhängige Getriebe, die unterschiedliche Kettengeschwindigkeiten erzeugen und so die Drehung des Fahrzeugs erzwingen.\n\nDer Vorteil dieses Systems gegenüber dem Kupplungs-Brems-System besteht darin, dass die durchschnittliche Fahrzeuggeschwindigkeit beibehalten wird, d. h., wenn man nach links lenkt, beschleunigt die rechte Kette entsprechend.\n\nDer Hauptnachteil besteht darin, dass scharfe Kurven nicht möglich sind und die Anzahl der möglichen Kurvenradien je nach Anzahl der Gänge sehr begrenzt ist."
tech_trm_transmission_differential_hun_desc:0	"Bei dieser Technik kommt ein Standard-Differential zwischen den Ketten zum Einsatz, wobei der Antrieb genau wie bei einem Auto auf den Fahrgestellrahmen wirkt. Für jede Antriebswelle gibt es separate Getriebe, die unterschiedliche Kettengeschwindigkeiten erzeugen und so die Drehung des Fahrzeugs erzwingen.\n\nDer Vorteil dieses Systems gegenüber der Kupplungs- -Bremse besteht darin, dass die durchschnittliche Fahrzeuggeschwindigkeit beibehalten wird, d. h. wenn man nach links lenkt, beschleunigt die rechte Kette entsprechend.\n\nDer Hauptnachteil besteht darin, dass scharfe Kurven nicht möglich sind und die Anzahl der möglichen Kurvenradien je nach Anzahl der Gänge sehr begrenzt ist."
tech_trm_transmission_differential_pol_desc:0	" Bei dieser Technik kommt ein Standarddifferenzial zwischen den Ketten zum Einsatz, wobei der Antrieb genau wie bei einem Auto auf den Fahrgestellrahmen wirkt. Für jede Antriebswelle gibt es separate Getriebe, die unterschiedliche Kettengeschwindigkeiten erzeugen und so die Drehung des Fahrzeugs erzwingen.\n\nDer Vorteil dieses Systems gegenüber dem Kupplungs-Brems-System besteht darin, dass die durchschnittliche Fahrzeuggeschwindigkeit beibehalten wird, d. h. wenn man nach links lenkt, beschleunigt die rechte Spur entsprechend.\n\nDer Hauptnachteil besteht darin, dass scharfe Kurven nicht möglich sind und die Anzahl der möglichen Kurvenradien je nach Anzahl der Gänge sehr begrenzt ist. "
tech_trm_transmission_double_differential_ger:0	"Doppeltes Differentialgetriebe"
tech_trm_transmission_double_differential_usa:0	"Doppeltes Differentialgetriebe"
tech_trm_transmission_double_differential_ger_desc:0	"Das komplexere Doppel-Differential-System ähnelt im Grundkonzept dem einfachen Differential, da es die Geschwindigkeit der Ketten durch die Steuerung der Drehung der Umlenkrollen regelt. In diesem Fall werden jedoch zwei vollständige Differentiale verwendet, eines für jede Kette, und die Laufrollen werden nicht durch eine Bremse, sondern durch eine zweite Antriebswelle, die Lenkwelle, gesteuert.\n\nDieses Getriebe war das bestmögliche Getriebe des Zweiten Weltkriegs, da es über eine einzigartige Eigenschaft verfügte: Wenn sich die Antriebswelle im Leerlauf befand, sorgte die Lenkwelle für eine Drehbewegung, wobei eine Kette vorwärts und die andere rückwärts lief, was eine außergewöhnliche Manövrierfähigkeit auf engem Raum ermöglichte.\n\nIn Deutschland war es als Maybach-Doppeldifferenzial bekannt und wurde berühmt im Tiger E eingesetzt."
tech_trm_transmission_double_differential_usa_desc:0	" Das komplexere Doppeldifferenzial-System ähnelt im Grundkonzept dem einfachen Differenzial, da es die Geschwindigkeit der Ketten durch die Steuerung der Drehung der Umlenkrollen regelt. In diesem Fall werden jedoch zwei vollständige Differenziale verwendet, eines für jede Kette, und die Umlenkrollen werden nicht durch eine Bremse, sondern durch eine zweite Antriebswelle, der Lenkwelle.\n\nDieses Getriebe war das bestmögliche Getriebe des Zweiten Weltkriegs, da es über eine einzigartige Eigenschaft verfügte: Wenn sich die Antriebswelle im Leerlauf befand, ermöglichte die Lenkwelle eine Drehbewegung, bei der eine Kette vorwärts und die andere rückwärts lief, was eine außergewöhnliche Manövrierfähigkeit auf engstem Raum ermöglichte."
tech_trm_transmission_twin_transmission_ger:0	"Doppelgetriebe"
tech_trm_transmission_twin_transmission_ita:0	"Doppelgetriebe"
tech_trm_transmission_twin_transmission_swe:0	"Doppelgetriebe"
tech_trm_transmission_twin_transmission_hun:0	"Doppelgetriebe"
tech_trm_transmission_twin_transmission_ger_desc:0	" Bei diesem System, das auch als Zahnradlenkung bezeichnet wird, wird jede Kette von einem funktional getrennten Mehrganggetriebe angetrieben. Die Lenkung erfolgt durch das Schalten des Gangs an einer Kette, nicht an der anderen.\n\nAbgesehen davon, dass es etwas aufwendiger ist, weist es im Vergleich zum Kupplungs- und Bremssystem nur einen Nachteil auf: Es kann keine so engen Kurven fahren. \n\nDies erwies sich als kostspielige, aber sehr leistungsstarke Lösung, die nur noch von einem Doppel-Differentialgetriebe übertroffen wird."
tech_trm_transmission_twin_transmission_ita_desc:0	"Bei diesem System, das auch als Getriebelenkung bezeichnet wird, wird jede Kette von einem funktional getrennten Mehrganggetriebe angetrieben. Die Lenkung erfolgt durch das Schalten des Gangs an einer Kette, nicht an der anderen.\n\nAbgesehen davon, dass es etwas aufwendiger ist, weist es im Vergleich zum Kupplungs- und -Bremssystem nur einen einzigen Nachteil auf, nämlich dass es keine so engen Kurven fahren kann.\n\nDies erwies sich als kostspielige, aber sehr leistungsstarke Lösung, die nur vom Doppel-Differentialgetriebe übertroffen wird."
tech_trm_transmission_twin_transmission_sov_desc:0	"Bei diesem System, das auch als Getriebelenkung bezeichnet wird, wird jede Kette von einem funktional getrennten Mehrganggetriebe angetrieben. Die Lenkung erfolgt durch das Schalten des Gangs an einer Kette, nicht an der anderen.\n\nAbgesehen davon, dass es etwas aufwendiger ist, weist es im Vergleich zum Kupplungs- und Bremssystem nur einen einzigen Nachteil auf, nämlich dass es keine so engen Kurven fahren kann. \n\nDies erwies sich als kostspielige, aber sehr leistungsstarke Lösung, die nur noch von einem Doppel-Differentialgetriebe übertroffen wird."
tech_trm_transmission_twin_transmission_swe_desc:0	"Bei diesem System, das auch als Getriebelenkung bezeichnet wird, wird jede Kette von einem funktional getrennten Mehrganggetriebe angetrieben. Die Lenkung erfolgt durch das Schalten des Gangs an einer Kette, nicht an der anderen.\n\nAbgesehen davon, dass es etwas aufwendiger ist, hat es gegenüber dem Kupplungs- und Bremssystem nur einen Nachteil: Es ermöglicht keine so engen Kurven."\n\nDies erwies sich als kostspielige, aber sehr leistungsstarke Lösung, die nur noch vom Doppel-Differentialgetriebe übertroffen wurde."
tech_trm_transmission_twin_transmission_pol_desc:0	" Bei diesem System, das auch als Getriebelenkung bezeichnet wird, wird jede Kette von einem funktional getrennten Mehrganggetriebe angetrieben. Die Lenkung erfolgt durch das Schalten des Gangs an einer Kette, nicht an der anderen.\n\nAbgesehen davon, dass es etwas aufwendiger ist, weist es im Vergleich zum Kupplungs- und Bremssystem nur einen einzigen Nachteil auf, nämlich dass es keine so engen Kurven fahren kann. \n\nDies erwies sich als kostspielige, aber sehr leistungsstarke Lösung, die nur vom Doppel-Differentialgetriebe übertroffen wird."
tech_trm_transmission_twin_transmission_cze_desc:0	"Bei diesem System, das auch als Getriebelenkung bezeichnet wird, wird jede Kette von einem funktional getrennten Mehrganggetriebe angetrieben. Die Lenkung erfolgt durch das Schalten des Gangs an einer Kette, nicht an der anderen. \n\nAbgesehen davon, dass es etwas aufwendiger ist, weist es gegenüber dem Kupplungs- und Bremssystem nur einen Nachteil auf, nämlich dass es keine so engen Kurven fahren kann. \n\nDies erwies sich als kostspielige, aber sehr leistungsstarke Lösung, die nur vom Doppel-Differentialgetriebe übertroffen wird."
tech_trm_transmission_xelectrical_usa:0	"Elektrischer Antrieb"
tech_trm_transmission_xelectrical_usa_desc:0	 "Das charakteristische Merkmal des elektrischen Antriebs ist, dass er den Bedarf an einem Getriebe umgeht, indem er die mechanische Kraft des Motors (über einen Dynamo oder Generator) in elektrische Energie umwandelt und diese elektrische Energie zum Antrieb von Fahrmotoren nutzt, die das Fahrzeug mechanisch antreiben.\n\nDa keine Gangwechsel erforderlich sind, ermöglicht er eine sanftere Beschleunigung. Es kann zudem erhebliche Vorteile bieten, da es den Energieverlust reduziert, der bei mechanischen Getrieben auftritt. Dies gilt insbesondere für schwerere Fahrzeuge, bei denen die zum Anfahren erforderliche Kraft sehr hoch ist. Diese Einsparungen werden jedoch durch das erhöhte Gewicht und die höheren Anschaffungskosten für Generator, Verkabelung und Motor etwas ausgeglichen.\n\nSein unbestreitbarer Vorteil lag natürlich darin, dass kein Getriebe eingebaut werden musste, was die gesamte Panzerproduktion kostengünstiger machte."
