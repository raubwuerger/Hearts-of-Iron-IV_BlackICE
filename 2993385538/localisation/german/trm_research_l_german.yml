tech_trm_engine_diesel_basic_ger_desc:0	"Dieselmotoren sind zuverlässiger, verbrauchen weniger Kraftstoff und haben ein höheres Drehmoment (bessere Geländegängigkeit) als Benzinmotoren. Auf der anderen Seite sind sie teurer in der Herstellung und haben eine geringere Beschleunigung und Höchstgeschwindigkeit, was ihre Manövrierfähigkeit im Vergleich zu Benzinmotoren leicht einschränkt."
