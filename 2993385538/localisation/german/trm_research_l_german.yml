tech_trm_engine_radial_basic_usa:0	"Einfache Sternbenzinmotoren"
tech_trm_engine_radial_basic_usa_desc:0	"Sternmotoren waren für den Einsatz in Panzern adaptierte Flugzeugmotoren. Sie wurden mit Benzin betrieben, waren luftgekühlt und wiesen ein hohes Leistungsgewicht auf. \n\nSie waren die schnellsten aller Motortypen, was Höchstgeschwindigkeit und Beschleunigung betraf.\n\nAndererseits verbrauchten sie am meisten Kraftstoff, was ihre Geländegängigkeit beeinträchtigte, und ihre Zuverlässigkeit war die schlechteste aller Motortypen. Ein weiterer Nachteil war ihre Größe, was dazu führte, dass die Panzer ein hohes Profil hatten und somit ihre überlegene Geschwindigkeit nicht voll für taktische Manövrierfähigkeit nutzen konnten.\n\nDie Möglichkeit, Flugzeugmotoren einzusetzen, verschaffte den USA in frühen Entwicklungsstadien sehr leistungsstarke Motoren."
tech_trm_engine_radial_interwar_usa:0	"Radialbenzinmotoren der Zwischenkriegszeit"
tech_trm_engine_radial_improved_usa:0	"Verbesserte Radialbenzinmotoren"
tech_trm_engine_radial_interwar_usa_desc:0	" Sternmotoren waren für den Einsatz in Panzern adaptierte Flugzeugmotoren, die ein hohes Leistungsgewicht aufwiesen. Sie waren hinsichtlich Höchstgeschwindigkeit und Beschleunigung die schnellsten aller Motortypen und versorgten die USA in den frühen Kriegsphasen mit sehr leistungsstarken Motoren.\n\nAndererseits hatten sie den höchsten Kraftstoffverbrauch und die geringste Zuverlässigkeit aller Motortypen. Ein weiterer Nachteil war ihre Größe, was dazu führte, dass die Panzer ein hohes Profil hatten und somit ihre überlegene Geschwindigkeit nicht voll für taktische Manövrierfähigkeit nutzen konnten. "
tech_trm_engine_radial_improved_usa_desc:0	"Sternmotoren waren für den Einsatz in Panzern adaptierte Flugzeugmotoren, die ein hohes Leistungsgewicht aufwiesen. Sie waren in Bezug auf Höchstgeschwindigkeit und Beschleunigung die schnellsten aller Motortypen und versorgten die USA in den frühen Kriegsphasen mit sehr leistungsstarken Motoren. \n\nAndererseits verbrauchten sie von allen Motortypen am meisten Treibstoff und wiesen die geringste Zuverlässigkeit auf. Ein weiterer Nachteil war ihre Größe, was dazu führte, dass die Panzer ein hohes Profil hatten und somit ihre überlegene Geschwindigkeit nicht voll für taktische Manövrierfähigkeit nutzen konnten."
