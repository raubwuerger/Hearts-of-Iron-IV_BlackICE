tech_trm_special_cupola_eng:0	"Kommandantenkuppel"
tech_trm_special_cupola_sov:0	"Kommandantenkuppel"
tech_trm_special_cupola_swe:0	"Kommandantenkuppel"
tech_trm_special_cupola_pol:0	"Commander Kuppel"
