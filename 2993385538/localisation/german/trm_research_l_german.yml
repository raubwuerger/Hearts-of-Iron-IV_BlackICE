tech_trm_engine_diesel_basic_eng_desc:0	"Dieselmotoren sind zuverlässiger, verbrauchen weniger Kraftstoff und verfügen über ein höheres Drehmoment (bessere Geländegängigkeit) als Benzinmotoren. Andererseits sind sie in der Herstellung teurer und weisen eine geringere Beschleunigung sowie eine niedrigere Höchstgeschwindigkeit auf, was ihre Manövrierfähigkeit im Vergleich zu Benzinmotoren leicht einschränkt."
