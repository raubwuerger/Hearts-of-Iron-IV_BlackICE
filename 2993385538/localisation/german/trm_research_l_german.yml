tech_trm_medium_tank_ger_panzer4_casemate_1_desc:1	"Bei gepanzerten Kampffahrzeugen bezieht sich der Begriff "Kasemattenbauweise" auf Fahrzeuge, bei denen die Hauptkanone direkt im Rumpf montiert ist und die keinen drehbaren Turm aufweisen, wie er üblicherweise bei Panzern zu finden ist. Eine solche Bauweise führt in der Regel zu einem mechanisch einfacheren Aufbau, geringeren Herstellungskosten, einem geringeren Gewicht und einer flacheren Silhouette. Das eingesparte Gewicht kann genutzt werden, um eine schwerere, leistungsstärkere Kanone zu montieren oder alternativ den Panzerschutz des Fahrzeugs im Vergleich zu regulären Panzern mit Turm zu erhöhen. Im Kampf muss die Besatzung jedoch das gesamte Fahrzeug drehen, wenn sich ein feindliches Ziel außerhalb des begrenzten Schwenkbereichs der Kanone befindet. Dies kann sich in Kampfsituationen als sehr nachteilig erweisen. \n\nWährend des Zweiten Weltkriegs wurden gepanzerte Kampffahrzeuge vom Typ Kasematte sowohl von den vereinten Streitkräften der deutschen Wehrmacht als auch von der sowjetischen Roten Armee intensiv eingesetzt. Sie wurden hauptsächlich als Panzerjäger und Sturmgeschütze eingesetzt."
