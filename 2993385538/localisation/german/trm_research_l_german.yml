tech_trm_special_duplex_drive_eng:0	"Duplex-Antrieb"
tech_trm_special_duplex_drive_usa:0	"Duplex-Antrieb"
tech_trm_special_duplex_drive_usa_desc:0	"Die Duplex Drive Panzer oder "Donald Duck Panzer", die auf dem -M24 Chaffee\n -M4 Sherman\n -M4A3 Sherman\n\nDD verwendet wurden, funktionierten, indem sie einen "Schwimmschirm" um den Panzer errichteten, der es ihm ermöglichte, zu schwimmen, und zwei Propeller hatten, die vom Motor des Panzers angetrieben wurden, um sie im Wasser anzutreiben, wodurch das Fahrzeug bei ruhigem Wetter eine Geschwindigkeit von vier Knoten erreichen konnte. \n\n Wenn der DD-Panzer das Ufer erreicht, wird die Schwimmschürze abgesenkt und das gepanzerte Fahrzeug erhält seine irdischen Eigenschaften zurück, um die Infanterie bei einer Landung oder einer Flussüberquerung so nah wie möglich zu unterstützen. Die bei der Landung in der Normandie und bei der Rheinüberquerung eingesetzten Duplex Drive Panzer ermöglichen einen Brückenkopf mit hoher Feuerkraft, ohne auf externe Mittel (Schiffe, Häfen ...) zurückgreifen zu müssen, die möglicherweise nicht verfügbar sind."
tech_trm_special_tauchpanzer_ger:0	"Tauchpanzer Ausrüstung"
tech_trm_special_tauchpanzer_ger_desc:0	"Der Tauchpanzer wurde Mitte 1940 für die geplante Invasion in England (Sea Lion) entwickelt. Die Pz Kpfw III wurden modifiziert und mit einer Tauchausrüstung versehen. Die Lufteinlässe wurden mit verschließbaren Abdeckungen versehen und der Auspuff mit Rückschlagventilen ausgestattet. Die Kuppel, der Geschützmantel und das Wannen-MG wurden mit wasserdichten Stoffabdeckungen versiegelt. Ein aufblasbarer Gummischlauch umgab den Turmdrehkranz.\n\nWährend des Untertauchens bezog der Panzer Luft durch ein Rohr von einem Schwimmer, der eine Schnorchelvorrichtung und eine Funkantenne trug, die an der Oberfläche blieb. Ein Kreiselkompass diente zur Unterwassernavigation. Der Tauchpanzer konnte in einer Tiefe von bis zu 15 Metern operieren. Ein Schiff mit einer klappbaren Rampe diente dazu, den Tauchpanzer in angemessener Entfernung vom Ufer auszuschiffen. Sobald der Panzer das Ufer erreicht hatte, konnten alle Abdeckungen und Dichtungen über Sprengkabel abgesprengt werden, so dass ein normaler Kampfeinsatz möglich war."
tech_trm_special_schurzen_ger_desc:0	"Um den Schutz gegen Panzerabwehrgewehre zu erhöhen, wurden 8-mm-Stahlbleche, so genannte Schürzen, an Schienen entlang der Panzerseite aufgehängt. Diese Stahlbleche ließen die Schüsse abprallen und verhinderten, dass sie die Panzerung des Panzers durchschlugen. Die Schürzen waren in Abschnitte unterteilt, so dass ein einzelner Abschnitt bei Beschädigung oder Verlust leicht ersetzt werden konnte."
tech_trm_special_zimmerit_ger:0	"Zimmerit-Beschichtung"
tech_trm_special_zimmerit_ger_desc:0	"Ende 1942 begannen die Deutschen mit der Entwicklung einer Panzerabwehrmine, die mit Magneten an ihrem Ziel haftete. Da man befürchtete, dass die Alliierten diese Waffe kopieren würden, wurde Zimmerit, eine Paste, die auf deutsche Panzer und Sturmgeschütze aufgetragen wurde, als Gegenmaßnahme entwickelt. Sie war zwar nicht vollständig antimagnetisch, aber die Dicke der Paste und ihr strukturierter Auftrag sollten die Fähigkeit eines Magneten, am Panzer zu haften, verringern.\n\n Der Panzer wurde dadurch zwar nicht vollständig antimagnetisch, aber die Zimmerit-Beschichtung verringerte die Haftfähigkeit der Minenmagnete. Diese wurden nur auf die Bereiche des Panzers aufgebracht, die die Soldaten zu Fuß erreichen konnten."
tech_trm_special_simple_construction_sov:0	"Vereinfachte Konstruktion"
tech_trm_suspension_christie_eng:0	"Christie Aufhängung"
tech_trm_suspension_christie_ita:0	"Christie-Aufhängung"
tech_trm_suspension_christie_jap:0	"Christie-Federung"
tech_trm_suspension_christie_pol:0	"Christie-Federung"
tech_trm_suspension_christie_eng_desc:0	"Die Christie-Aufhängung zeichnet sich durch große, unabhängig voneinander aufgehängte Laufräder aus, die auch zur Abstützung des oberen Teils der Kette dienen. Die Laufräder waren an Längslenkern (Umlenkhebeln) montiert, die die Bewegungsrichtung von der Vertikalen in die Horizontale änderten. Ein weiteres Merkmal der Christie-Konstruktionen war der "Cabrio"-Antrieb: die Möglichkeit, die Raupen für Straßenfahrten abzunehmen, was höhere Geschwindigkeiten und eine größere Reichweite ermöglichte und den Verschleiß der empfindlichen Raupenketten verringerte."
tech_trm_suspension_christie_ita_desc:0	"Die Christie-Aufhängung zeichnet sich durch große, unabhängig voneinander aufgehängte Laufräder aus, die auch zur Abstützung des oberen Teils der Kette dienen. Die Laufräder waren an Längslenkern (Umlenkhebeln) montiert, die die Bewegungsrichtung von der Vertikalen in die Horizontale änderten. Ein weiteres Merkmal der Christie-Konstruktionen war der "Cabrio"-Antrieb: die Möglichkeit, die Raupen für Straßenfahrten abzunehmen, was höhere Geschwindigkeiten und eine größere Reichweite ermöglichte und den Verschleiß der empfindlichen Raupenketten verringerte."
tech_trm_suspension_christie_pol_desc:0	"Die Christie-Federung zeichnet sich durch den Einsatz großer, unabhängig voneinander aufgehängter Laufräder aus, die auch zur Abstützung des oberen Teils der Schiene dienen. Die Laufräder waren an Längslenkern (Umlenkhebeln) montiert, die die Bewegungsrichtung von vertikal zu horizontal änderten. Das Gewicht des Fahrzeugrumpfes wurde über die auf den Längslenkern gelagerten Schraubenfedern übertragen. Ein weiteres Merkmal von Christies Entwürfen war der Cabrio-Antrieb: die Möglichkeit, die Raupen für den Straßenbetrieb abzunehmen, was höhere Geschwindigkeiten und eine bessere Reichweite ermöglichte und den Verschleiß der empfindlichen Raupensysteme verringerte."
tech_trm_suspension_christie_improved_fra:0	"Verbesserte Christie-Aufhängung"
tech_trm_suspension_christie_improved_ita:0	"Verbesserte Christie-Aufhängung"
tech_trm_suspension_christie_improved_sov:0	"Verbesserte Christie-Aufhängung"
tech_trm_suspension_christie_improved_fra_desc:0	"Die umsetzbare Christie-Aufhängung war eine Folge der zerbrechlichen und empfindlichen Raupenfahrwerke der frühen 1930er Jahre. Gegen Ende des Krieges erwies sich der Cabrio-Aspekt als unnötige Komplikation, die wertvollen Platz im Panzer beanspruchte, und die Funktion wurde fallen gelassen, wodurch der Panzer leichter wurde."
tech_trm_suspension_christie_improved_ita_desc:0	"Die Cabrio-Funktion der Christie-Aufhängung war eine Folge der zerbrechlichen und empfindlichen Raupenketten-Systeme der frühen 1930er Jahre. Gegen Ende des Krieges wurde die Cabriofunktion zu einer unnötigen Komplikation, die wertvollen Platz im Panzer beanspruchte, und die Funktion wurde fallen gelassen, um den Panzer leichter zu machen."
tech_trm_suspension_christie_improved_sov_desc:0	"Die Cabrio-Funktion der Christie-Aufhängung war eine Folge der zerbrechlichen und empfindlichen Raupenketten-Systeme der frühen 1930er Jahre. Gegen Ende des Krieges wurde die Cabriofunktion zu einer unnötigen Komplikation, die wertvollen Platz im Panzer beanspruchte, und die Funktion wurde fallen gelassen, um den Panzer leichter zu machen."
tech_trm_suspension_christie_improved_usa_desc:0	"Die Cabrio-Funktion der Christie-Aufhängung war eine Folge der zerbrechlichen und empfindlichen Raupenketten-Systeme der frühen 1930er Jahre. Gegen Ende des Krieges erwies sich der Cabrio-Aspekt als unnötige Komplikation, die wertvollen Platz im Panzer beanspruchte, und die Funktion wurde fallen gelassen, um den Panzer leichter zu machen."
tech_trm_suspension_torsion_eng:0	"Drehstabfederung"
tech_trm_suspension_torsion_ita:0	"Drehstabfederung"
tech_trm_suspension_torsion_jap:0	"Drehstabfederung"
tech_trm_suspension_torsion_swe:0	"Drehstabfederung"
tech_trm_suspension_torsion_cze:0	"Torsionsstabfederung"
tech_trm_suspension_torsion_ita_desc:0	"Bei Torsionsstäben wird ein langer Stahlstab durch eine Drehkraft verdreht, um eine "Federwirkung" zu erzielen. Ein Ende des langen Metallstabs ist fest mit dem Fahrzeugchassis verbunden; das andere Ende endet in einem Hebel, der am Rad befestigt ist. Die vertikale Bewegung des Rades bewirkt eine Drehung des Stabes um seine Achse, der der Torsionswiderstand des Stabes entgegenwirkt.\n\n Der Einbau von Torsionsstäben quer über den Boden von Panzerwannen macht diese zwar gut geschützt und ermöglicht eine geringere Breite des Tanks, erhöht aber auch ihre Höhe. Dies ist an sich unerwünscht und kann auch das Gewicht der Panzer erheblich erhöhen, insbesondere wenn sie stark gepanzert sind."
tech_trm_suspension_torsion_jap_desc:0	"Bei Torsionsstäben wird ein langer Stahlstab durch eine Drehkraft verdreht, um eine "Federwirkung" zu erzielen. Ein Ende des langen Metallstabs ist fest mit dem Fahrzeugchassis verbunden; das andere Ende endet in einem Hebel, der am Rad befestigt ist. Die vertikale Bewegung des Rades bewirkt eine Drehung des Stabes um seine Achse, der der Torsionswiderstand des Stabes entgegenwirkt.\n\n Der Einbau von Torsionsstäben quer über den Boden von Panzerwannen macht diese zwar gut geschützt und ermöglicht eine geringere Breite des Tanks, erhöht aber auch ihre Höhe. Dies ist an sich unerwünscht und kann auch das Gewicht der Panzer erheblich erhöhen, insbesondere wenn sie stark gepanzert sind."
tech_trm_suspension_torsion_sov_desc:0	"Bei Torsionsstäben wird ein langer Stahlstab durch eine Drehkraft verdreht, um eine "Federwirkung" zu erzielen. Ein Ende des langen Metallstabs ist fest mit dem Fahrzeugchassis verbunden; das andere Ende endet in einem Hebel, der am Rad befestigt ist. Die vertikale Bewegung des Rades bewirkt eine Drehung des Stabes um seine Achse, der der Torsionswiderstand des Stabes entgegenwirkt.\n\n Der Einbau von Torsionsstäben quer über den Boden von Panzerwannen macht diese zwar gut geschützt und ermöglicht eine geringere Breite des Tanks, erhöht aber auch ihre Höhe. Dies ist an sich unerwünscht und kann auch das Gewicht der Panzer erheblich erhöhen, insbesondere wenn sie stark gepanzert sind."
tech_trm_suspension_torsion_cze_desc:0	"Bei Torsionsstäben wird eine lange Stange aus Stahl durch eine Drehkraft verdreht, um eine Federwirkung zu erzielen. Ein Ende des langen Metallstabs ist fest mit dem Fahrzeugchassis verbunden, das andere Ende endet in einem Hebel, der am Rad befestigt ist. Die vertikale Bewegung des Rades bewirkt eine Drehung des Stabes um seine Achse, der der Torsionswiderstand des Stabes entgegenwirkt.\n\n Der Einbau von Torsionsstäben quer über den Boden von Panzerwannen macht diese zwar gut geschützt und ermöglicht eine geringere Breite des Panzers, aber er erhöht auch ihre Höhe. Das ist an sich schon unerwünscht und kann auch das Gewicht der Panzer erheblich erhöhen, insbesondere wenn sie stark gepanzert sind."
tech_trm_suspension_torsion_double_ger:0	"Doppelte Drehstabfederung"
tech_trm_suspension_torsion_double_sov:0	"Doppelte Torsionsstabaufhängung"
tech_trm_suspension_torsion_double_sov_desc:0	"Zusätzliche Torsionsstäbe für unsere Panzer."
tech_trm_suspension_vss_vertical_eng:0	"Vertikale Spiralfederaufhängung"
tech_trm_suspension_vss_vertical_eng_desc:0	"Eine Spiralfeder ist eine Druckfeder in Form eines Kegels (einer Spirale). Beim Zusammendrücken gleiten die Windungen übereinander und ermöglichen so einen längeren Federweg. Das Ergebnis ist stabiler und leistungsfähiger als jede Blatt-, Schrauben- oder Drehstabfeder mit demselben Volumen. Vertikal in einem Straßenfahrgestell für ein Paar Straßenräder an einem Panzer montiert, ergab sich eine sehr kompakte Einheit.\n\n Ihr größter Nachteil waren die Gewichtsbeschränkungen und die nicht sehr hohe Zuverlässigkeit."
tech_trm_suspension_vss_horizontal_usa_desc:0	"Bei dieser Art der Federung wurden die beiden an jedem Drehgestell angebrachten Räder mit einer Spiralfeder gegeneinander gefedert. Es handelte sich im Wesentlichen um eine Version der britischen Horstmann-Federung, bei der die Spiralfedern der Horstmann-Federung durch ein Paar Spiralfedern ersetzt wurden, was die Federung verbesserte."
tech_trm_tank_construction_standard_ger:0	"Standard Konstruktion"
tech_trm_tank_construction_fast_ger:0	"Kostengünstige Konstruktion"
tech_trm_tank_construction_fast_sov:0	"Kostengünstige Konstruktion"
tech_trm_tank_construction_streamlined_eng:0	"Rationalisierte Produktion"
tech_trm_tank_construction_streamlined_usa:0	"Rationalisierte Produktion"
tech_trm_tank_construction_fast_ger_desc:0	"Durch die Einführung automatischer Konstruktionsmethoden und die Umgehung einiger Qualitätssicherungsprüfungen können wir Arbeitskräfte und Zeit einsparen."
tech_trm_tank_construction_fast_sov_desc:0	"1939 erfand das The Electric Welding Institute das automatische Unterpulverschweißen. Dies führte 1941 zur Technologie des automatischen Lichtbogenschweißens von Panzerstählen, die ein automatisches Hochgeschwindigkeitsschweißen von Tanks ermöglichte, wodurch die Zahl der Arbeitsstunden für Schweißarbeiten von 240 auf 80 reduziert werden konnte."
tech_trm_tank_construction_resource_ger_desc:0	"Der geringere Einsatz von Ressourcen ermöglicht die Beibehaltung der volumetrischen Produktion von Panzern bei geringerer Materialqualität."
tech_trm_transmission_differential_swe:0	"Differentialgetriebe"
tech_trm_transmission_differential_swe_desc:0	"Bei dieser Technik wird ein Standard-Differential zwischen den Ketten verwendet, wobei der Antrieb auf den Käfig wirkt, genau wie bei einem Auto. Der Vorteil dieses Systems gegenüber der Kupplungsbremse ist, dass die Durchschnittsgeschwindigkeit des Fahrzeugs gewollt ist, d.h. wenn man nach links lenkt, wird die rechte Spur entsprechend schneller. Der größte Nachteil ist, dass scharfe Kurven nicht möglich sind und dass es nur eine sehr begrenzte Anzahl von möglichen Kurvenradien gibt, abhängig von der Anzahl der Gänge."
tech_trm_transmission_differential_cze_desc:0	"Bei dieser Technik wird ein Standard-Differential zwischen den Spuren verwendet, wobei der Antrieb auf den Käfig wirkt, genau wie bei einem Auto. Der Vorteil dieses Systems gegenüber der Kupplungsbremse ist, dass die Durchschnittsgeschwindigkeit des Fahrzeugs gewollt ist, d.h. wenn man nach links lenkt, wird die rechte Spur entsprechend schneller. Der größte Nachteil ist, dass scharfe Kurven nicht möglich sind und die Anzahl der möglichen Kurvenradien abhängig von der Anzahl der Gänge sehr begrenzt ist."
tech_trm_transmission_double_differential_eng:0	"Doppeldifferentialgetriebe"
tech_trm_transmission_double_differential_eng_desc:0	"Das komplexere Doppeldifferentialsystem ähnelt im Grundkonzept dem einfachen Differentialgetriebe, da es die Geschwindigkeit der Raupen durch die Steuerung der Rotation der Laufrollen kontrolliert. In diesem Fall werden jedoch zwei vollständige Differentiale verwendet, eines für jede Spur, und die Tragrollen werden nicht durch eine Bremse, sondern durch eine zweite Antriebswelle, die Lenkwelle, gesteuert.\n\nieses Getriebe war das bestmögliche Getriebe des Zweiten Weltkriegs, weil es eine einzigartige Eigenschaft hatte: Wenn sich die Antriebswelle im Leerlauf befand, sorgte die Lenkwelle für eine Drehung, wobei eine Spur vorwärts und die andere rückwärts lief, was eine außergewöhnliche Manövrierfähigkeit auf engem Raum ermöglichte.\n\n Im Vereinigten Königreich entwickelte sich dieses System 1939 rasch zum Triple Differential (im Prinzip ein ähnliches Konzept, mit einem zusätzlichen Differential), auch bekannt als Merritt-Brown-Getriebe. Ab 1941 wurde es in allen Churchill-Panzern verwendet, gefolgt von den Centaur- und Cromwell-Panzern."
tech_trm_transmission_twin_transmission_sov:0	"Zwillingsgetriebe"
tech_trm_transmission_twin_transmission_pol:0	"Zwillingsgetriebe"
tech_trm_transmission_twin_transmission_cze:0	"Zwillingsgetriebe"
tech_trm_transmission_twin_transmission_hun_desc:0	"Bei diesem System, das auch als Getriebelenkung bezeichnet wird, wird jede Spur von einem funktional getrennten Mehrganggetriebe angetrieben. Die Lenkung erfolgt durch den Wechsel des Gangs auf einer Spur und nicht auf der anderen.\n\nAbgesehen davon, dass es etwas aufwändiger ist, hat es gegenüber dem Kupplungs- und Bremssystem nur den Nachteil, dass es nicht so enge Kurven fahren kann.\n\nDies erwies sich als kostspielige, aber sehr leistungsfähige Lösung, die nur noch vom doppelten Differentialgetriebe übertroffen wird."
tech_trm_transmission_xelectrical_eng:0	"Elektrische Kraftübertragung"
tech_trm_transmission_xelectrical_ger:0	"Elektrische Kraftübertragung"
tech_trm_transmission_xelectrical_eng_desc:0	"Das Hauptmerkmal des elektrischen Getriebes besteht darin, dass es ohne Getriebe auskommt, indem es die mechanische Kraft des Motors in elektrische Energie umwandelt (über eine Lichtmaschine oder einen Generator) und die elektrische Energie zum Antrieb von Fahrmotoren nutzt, die das Fahrzeug mechanisch antreiben.\n\nDa keine Gangwechsel erforderlich sind, ermöglicht es eine sanftere Beschleunigung. Es kann auch erhebliche Vorteile bieten, da es die Energieverschwendung reduziert, die bei der mechanischen Übertragung auftritt. Dies gilt insbesondere für schwerere Fahrzeuge, bei denen die zum Anfahren erforderliche Kraft sehr hoch ist. Diese Einsparungen werden jedoch durch das höhere Gewicht und die höheren Anschaffungskosten des Generators, der Verkabelung und des Motors etwas aufgehoben. Der unbestrittene Vorteil besteht darin, dass kein Getriebe eingebaut werden muss, was die Herstellung des Tanks insgesamt billiger macht."
tech_trm_transmission_xelectrical_ger_desc:0	"Das Hauptmerkmal der elektrischen Kraftübertragung besteht darin, dass kein Getriebe erforderlich ist, da die mechanische Kraft des Motors in elektrische Energie umgewandelt wird (durch eine Lichtmaschine oder einen Generator) und die elektrische Energie zum Antrieb von Fahrmotoren verwendet wird, die das Fahrzeug mechanisch antreiben.\n\nDa keine Gangwechsel erforderlich sind, ist eine sanftere Beschleunigung möglich. Es kann auch erhebliche Vorteile bieten, da es die Energieverschwendung reduziert, die bei der mechanischen Übertragung auftritt. Dies gilt insbesondere für schwerere Fahrzeuge, bei denen die zum Anfahren erforderliche Kraft sehr hoch ist. Diese Einsparungen werden jedoch durch das höhere Gewicht und die höheren Anschaffungskosten des Generators, der Verkabelung und des Motors etwas aufgehoben. Der unbestrittene Vorteil besteht darin, dass kein Getriebe eingebaut werden muss, was die Herstellung des Tanks insgesamt billiger macht."
tech_trm_german_armour:1	"Deutsche Panzerwaffe"
tech_trm_light_tank_ger_panzer1_aa_open_1:1	"PzKpfw I Offene Flak-Lafette"
tech_trm_light_tank_ger_panzer1_aa_open_1_desc:1	""
tech_trm_light_tank_ger_panzer1_superstructure_open_1_desc:1	"Aufbauten sind Konstruktionen, die um die direkt auf der Panzerwanne installierten Geschütze herum gebaut werden und hauptsächlich dem Schutz der Besatzung und des Geschützes dienen. Die Panzerung ist in der Regel schwächer als die des Panzers selbst. Positiv ist, dass sie leichter ist als Türme oder Kasematten, was die Verwendung schwererer Geschütze ermöglicht. Da sie auch billiger in der Herstellung ist, ist sie die ideale Wahl für selbstfahrende Fahrzeuge."
tech_trm_light_tank_ger_panzer2_aa_open_1:1	"PzKpfw II Offene Flaklafette"
tech_trm_light_tank_ger_panzer2_aa_open_1_desc:1	""
tech_trm_light_tank_ger_panzer2_turret_open_1_desc:1	""
tech_trm_cavalry_tank_ger_pz38_casemate_1:1	"PzKpfw 38(t) Kasematte"
tech_trm_cavalry_tank_ger_pz38_casemate_1_desc:1	"Im Zusammenhang mit gepanzerten Kampffahrzeugen bezieht sich die Kasemattenbauweise auf Fahrzeuge, bei denen die Hauptkanone direkt in der Wanne montiert ist und die nicht über den bei Panzern üblichen Drehturm verfügen. Eine solche Konstruktion macht das Fahrzeug im Allgemeinen mechanisch einfacher, weniger kostspielig in der Konstruktion, leichter im Gewicht und niedriger im Profil. Das eingesparte Gewicht kann genutzt werden, um eine schwerere, leistungsfähigere Kanone zu montieren oder alternativ den Panzerschutz des Fahrzeugs im Vergleich zu normalen Panzern mit Turm zu erhöhen. Im Gefecht muss die Besatzung jedoch das gesamte Fahrzeug drehen, wenn sich ein feindliches Ziel außerhalb des begrenzten Geschützkreises des Fahrzeugs befindet. Dies kann sich in Gefechtssituationen als sehr nachteilig erweisen.\n\nIm Zweiten Weltkrieg wurden gepanzerte Kampffahrzeuge vom Typ Kasematte sowohl von der deutschen Wehrmacht als auch von der Roten Armee der Sowjetunion in großem Umfang eingesetzt. Sie wurden hauptsächlich als Panzerjäger und Sturmgeschütze eingesetzt."
tech_trm_cavalry_tank_ger_pz38_aa_open_1:1	"PzKpfw 38(t) Offene Flak-Lafette"
tech_trm_cavalry_tank_ger_pz38_aa_open_1_desc:1	""
tech_trm_medium_tank_ger_panzer3_casemate_1_desc:1	"In Bezug auf gepanzerte Kampffahrzeuge bezieht sich die Kasemattenbauweise auf Fahrzeuge, bei denen die Hauptkanone direkt in der Wanne montiert ist und die keinen drehbaren Turm haben, wie er bei Panzern üblich ist. Eine solche Konstruktion macht das Fahrzeug im Allgemeinen mechanisch einfacher, weniger kostspielig in der Konstruktion, leichter im Gewicht und niedriger im Profil. Das eingesparte Gewicht kann genutzt werden, um eine schwerere, leistungsfähigere Kanone zu montieren oder alternativ den Panzerschutz des Fahrzeugs im Vergleich zu normalen Panzern mit Turm zu erhöhen. Im Gefecht muss die Besatzung jedoch das gesamte Fahrzeug drehen, wenn sich ein feindliches Ziel außerhalb des begrenzten Geschützkreises des Fahrzeugs befindet. Dies kann sich in Gefechtssituationen als sehr nachteilig erweisen.\n\nIm Zweiten Weltkrieg wurden gepanzerte Kampffahrzeuge vom Typ Kasematte sowohl von der deutschen Wehrmacht als auch von der Roten Armee der Sowjetunion in großem Umfang eingesetzt. Sie wurden hauptsächlich als Panzerjäger und Sturmgeschütze eingesetzt."
tech_trm_medium_tank_ger_panzer4_turret_2_desc:1	""
tech_trm_medium_tank_ger_panzer4_casemate_1:1	"PzKpfw IV Kasematte"
tech_trm_medium_tank_ger_panzer4_turret_3:1	"PzKpfw IV J Drehturm (manuell)"
tech_trm_medium_tank_ger_panzer4_turret_3_desc:1	""
tech_trm_medium_tank_ger_panzer4_turret_4_desc:1	"Im Jahr 1944 schlug Krupp einen vereinfachten Turm für den Pz IV vor. Das neue Turmdesign hatte eine sechsseitige Form, eine flache Geschützhaube, keine Sicht- oder Pistolenöffnungen, keine Kommandantenkuppel, zwei Luken im Turmdach und eine vereinfachte Luke an der linken Turmseite. Der Schutz der Panzerung wurde deutlich erhöht. Der Hauptzweck dieses Turms war es, genügend Platz für die Montage der KwK 42 L/70 zu schaffen und das Gesamtgewicht zu reduzieren."
tech_trm_medium_advanced_tank_ger_panther_aa_1_desc:1	""
tech_trm_heavy_tank_ger_tiger_casemate_1:1	"Tiger-Kasematte"
tech_trm_heavy_tank_ger_tiger2_casemate_1:1	"Tiger II-Kasematte"
tech_trm_heavy_tank_ger_tiger2_casemate_1_desc:1	"Im Zusammenhang mit gepanzerten Kampffahrzeugen bezieht sich die Kasemattenbauweise auf Fahrzeuge, bei denen die Hauptkanone direkt in der Wanne montiert ist und die nicht über den bei Panzern üblichen Drehturm verfügen. Eine solche Konstruktion macht das Fahrzeug im Allgemeinen mechanisch einfacher, weniger kostspielig in der Konstruktion, leichter im Gewicht und niedriger im Profil. Das eingesparte Gewicht kann genutzt werden, um eine schwerere, leistungsfähigere Kanone zu montieren oder alternativ den Panzerschutz des Fahrzeugs im Vergleich zu normalen Panzern mit Turm zu erhöhen. Im Gefecht muss die Besatzung jedoch das gesamte Fahrzeug drehen, wenn sich ein feindliches Ziel außerhalb des begrenzten Geschützkreises des Fahrzeugs befindet. Dies kann sich in Gefechtssituationen als sehr nachteilig erweisen.\n\nIm Zweiten Weltkrieg wurden gepanzerte Kampffahrzeuge vom Typ Kasematte sowohl von der deutschen Wehrmacht als auch von der Roten Armee der Sowjetunion in großem Umfang eingesetzt. Sie wurden hauptsächlich als Panzerjäger und Sturmgeschütze eingesetzt."
tech_trm_weapon_mg_ger_mg42:0	"7,92mm MG42"
tech_trm_weapon_ac_ger_8_ew141_desc:0	"Nach den ersten Begegnungen mit dem T-26 in Spanien wurde klar, dass die mit Maschinengewehren ausgerüsteten Panzer I eine schlechte Wahl waren. Zu diesem Zweck wurde eine sehr ungewöhnliche Panzerkanone entwickelt. Die Firma Mauser begann mit der Arbeit an einer Panzerversion des Maschinengewehrs MG 141, einer Ableitung des MG 151. Es trug den Namen EW 141 und wurde mit 7,92×95 mm Munition aus dem Panzerbüchsengewehr Pz.B.38 verschossen. Es wurde in der deutschen Armee wegen seiner hervorragenden Fähigkeit, 360°-Drehungen durchzuführen, populär. Bald wurde es jedoch zu einer Waffe, die nur für Aufklärungsfahrzeuge geeignet war.\n\n£ew141£"
tech_trm_weapon_c_ger_28_spzb41:0	"2,8cm L/62 sPzB 41"
tech_trm_weapon_c_ger_28_spzb41_desc:0	"\n£28_cm_41£\n\nDieses als erste deutsche \"Geheimwaffe\" bekannte schwere Panzerabwehrgewehr war die erste Waffe, die auf dem Gerlich-Prinzip der Quetschbohrung basierte. Erstmals im Wüstenfeldzug eingesetzt, beruht die Idee der Quetschbohrung darauf, die Kraft des Pulvers zu nutzen, um den Durchmesser des Geschosses zu verringern. Dies würde theoretisch zwei Dinge bewirken: das Geschütz ins Jenseits befördern oder das Projektil auf bis dahin unbekannte Geschwindigkeiten beschleunigen.\n\n Der sPzB 41 gelang es, das Kaliber von 28 mm am Patronenlager auf nur 20 mm an der Mündung zu reduzieren und dabei Geschwindigkeiten von bis zu 1.400 m/s zu erreichen.\n\n Das Besondere an dieser Waffe war, dass sie extrem leicht und wendig war und gleichzeitig leichte Panzerungen durchdringen konnte. Genau aus diesen beiden Gründen eignete sie sich perfekt für Halbkettenfahrzeuge und Aufklärungsfahrzeuge."
tech_trm_weapon_c_ger_42_pak41_desc:0	"Diese Kanone ähnelte äußerlich der 3,7-cm-Pak 36 und verwendete eine modifizierte Version von deren Lafette, nutzte aber das Prinzip der Pressbohrung (auf Deutsch "Gerlich" nach Hermann Gerlich, der das Prinzip in den 1920er Jahren, angeblich für ein Jagdgewehr, entwickelt hatte), um die Geschwindigkeit und damit die Durchschlagskraft zu erhöhen."
tech_trm_weapon_c_ger_47_pak38t:0	"4,7cm L/43 PaK 38(t)"
tech_trm_weapon_c_ger_47_pak38t_desc:0	"Die 47x405mm KPÚV vz. 38 (deutsche Bezeichnung "4,7 cm PaK (t)") war eine Panzerabwehrkanone des Škoda-Werks, die nach der Besetzung der Tschechoslowakei übernommen wurde. Obwohl es recht alt aussah, war seine Leistung aufgrund der für die damalige Zeit beeindruckenden Länge des Kalibers von 2,04 m (L/43) den meisten zeitgenössischen Konstruktionen überlegen. Er wurde auf das Fahrgestell des Panzer I Ausf. B montiert und war damit der erste in Deutschland produzierte Panzerjäger I, der als "Panzerjäger" bekannt wurde."
tech_trm_weapon_c_ger_50_kwk38_desc:0	"\n\n\n £5cm_KwK_38£\n\n\n\n Nicht zu verwechseln mit der späteren PaK 38 (die 420x50mm Patronen verschoss), verwendete die reine Panzerkanone KwK 38 289x50mm-Patronen. Die Entwicklung wurde 1939 als Reaktion auf die ersten Begegnungen mit den britischen Matildas II beschleunigt, bei denen die KwK 37 unwirksam war. Die Kwk 38 erwies sich als hervorragende Panzerabwehrwaffe für die Zerstörung alliierter leichter und mittlerer Panzer, die an der Westfront eingesetzt wurden, und zeigte auch im Wüstenfeldzug sehr gute Leistungen. An der Ostfront war sie jedoch gegen die russischen T-34 und KV-1 fast völlig unwirksam. Diese Waffe, eine der größten Katastrophen in der Geschichte der deutschen Panzerabwehrtechnik, war bereits ein Jahr nach ihrer Einführung veraltet und wurde 1942 nicht mehr produziert. Sie war auch der Grund für die berühmte "Panzerpanik", die die Truppen gegen den T-34 entwickelten. Der T-34 war zwar ein beeindruckender Panzer, aber die stärkste deutsche Panzerkanone von 1941 war zu schwach und ließ die russischen Panzer unbesiegbar erscheinen."
tech_trm_weapon_c_ger_50_kwk39:0	"5 cm L/60 KwK 39"
tech_trm_weapon_c_ger_50_kwk39_desc:0	"\n\n\n £5cm_KwK_39£\n\n\n\n\n Die Geschichte dieser Kanone ist eine griechische Tragödie.\n\nDie Kanone KwK 39 L/60 Rheinmetall-Borsig, die zur gleichen Zeit wie die KwK 38 L/42 entwickelt wurde und 1940 in Produktion ging, hatte eine größere Kammer und ein längeres Kaliber als die KwK 38. Nach dem Fall Frankreichs hatte Hitler in beachtlicher Voraussicht den Befehl gegeben, dass die Hauptbewaffnung des PzKpfw III die KwK 39 sein sollte. In einem der größten Fehler in der Geschichte des deutschen Heeres wurde dieser Befehl mit der Begründung missachtet, dass die KwK 38 L/42 bisher erfolgreich gewesen sei, und der Führer wurde nicht über diese Entscheidung informiert (die spätere Begründung lautete, dass es unmöglich sei, sie in den Pz. Bei einer Panzerdemonstration Anfang 1941 stellte Hitler zu seiner großen Überraschung fest, dass seine Befehle nicht befolgt worden waren. Dies führte zu einem seiner ersten berühmten Wutausbrüche gegen die "Unfähigkeit und den Verrat" der deutschen Offiziere.\n\n In einer Dringlichkeitssitzung bestanden die Experten darauf, dass der Einbau der Kanone in den Pz III unmöglich sei, aber zur Überraschung aller erklärte sich Direktor Panten aus Alkett bereit, es zu versuchen.\n\n Im April 1941 wurde ein Versuchsstück gebaut, das akzeptiert wurde. Es sollte noch 6 Monate dauern, bis es in die Serienproduktion ging, d.h. 5 Monate nach der Operation Barbarossa.\n\n Als zu Beginn des Russlandfeldzuges die russischen "T-34" und "KV"-Panzer auftauchten, zeigte sich die Schwäche der deutschen Panzerbewaffnung schnell in vollem Umfang. Die KwK 38 L/42 konnte die russischen Panzer nur auf selbstmörderische Entfernung zerstören. Darüber hinaus erzeugte Hitlers Entdeckung im April 1941, dass seine Befehle vom deutschen Heer bewusst umgangen wurden, in ihm ein Misstrauen, das bis zum Ende des Konflikts anhielt und katastrophale Folgen hatte, wie es ein deutscher General ausdrückte: "Das hat Deutschland den Krieg gekostet".\n\nWäre der mit KwK 39 L/60 bewaffnete Panzer III im Juni 1941 in ausreichender Zahl verfügbar gewesen, hätte der Ostfeldzug ganz anders verlaufen können. Die rebellische und selbstgefällige Haltung der Armee erwies sich am Ende als fataler Fehler.\n\n Zumindest erwies sich dieses Geschütz in Nordafrika als tödlich erfolgreich gegen britische Kreuzerpanzer und leichte amerikanische M3 Stuart-Panzer und half Rommel, seinen Mythos und seinen Ruf aufzubauen."
tech_trm_weapon_c_ger_75_kwk37:0	"7,5 cm L/24 KwK 37"
tech_trm_weapon_c_ger_75_kwk37_desc:0	"Die 7,5-cm-Kampfwagenkannone 37 L/24, oder einfach KwK 37, war die Hauptkanone der Panzerkampwagen IV-Serie, bis sie später im Krieg durch die KwK 40 ersetzt wurde. Technisch gesehen handelt es sich um eine kleinkalibrige Haubitze, daher auch die kurze Rohrlänge von 1,7 m. Sie wurde in erster Linie zur Unterstützung der Infanterie eingesetzt und verschoss HE Granaten, obwohl sie über eine ausreichende Durchschlagskraft verfügte, um in den ersten Kriegsjahren gegen frühe alliierte Panzer wirksam zu sein.\n\n\n\n£kwk37final£"
tech_trm_weapon_c_ger_75_kwk40:0	"7,5 cm L/43 KwK 40"
tech_trm_weapon_c_ger_75_kwk40_desc:0	"\n\n\n\n\n£KwK40_L43£\n\n\n\n\n\n In der ersten Zeit nach der Operation Barbarossa erwies sich die schwerere und verschlampte russische Panzerung als sehr widerstandsfähig gegen die KwK L/42, und die Durchschlagskraft der L/60 war nicht das "One shot one kill from anywhere", das die Panzertruppen erwartet hatten. Panzertruppen mussten höhere Risiken eingehen und mehrere Geschosse abfeuern.\n\nGuderian erkannte, dass die Truppen schnell das Vertrauen in ihre Fähigkeit verloren, feindliche Panzer zu bekämpfen, und er forderte größere Geschütze, um den Kampfgeist wiederherzustellen.\n\n Am 18. November 1941 befahl das Waffenamt schließlich die Entwicklung des 7,5-cm-Geschützes. Sie wurde gemeinsam von Krupp in Zusammenarbeit mit Rheinmetall entwickelt. Das Geschütz, KwK 40 L/43, war im Allgemeinen eine große Enttäuschung, sei es, weil es für die Moral der Truppe noch nicht stark genug war, sei es, weil es Probleme mit der Zuverlässigkeit gab, wie z.B. fehlgeschlagene Granatenauswürfe. Die Produktion wurde bald auf die längere, wesentlich verbesserte Version umgestellt."
tech_trm_weapon_c_ger_75_kwk42_desc:0	"\n\n\n£KwK42£\n\n\n\n\n\nAm 18. Juli 1941 erhielt die Firma Rheinmetall-Borsig einen Auftrag zur Entwicklung einer Panzerkanone mit einer Durchschlagskraft von 150 mm auf 1000 Meter. Sie sollte in erster Linie auf den neuen, noch in der Entwicklung befindlichen schweren Panzer (später Tiger genannt) montiert werden. Ein Rohr mit einem 75-mm-Kaliber der Länge L/60 wurde 1942 mit Leistungswerten getestet, die fast den Anforderungen entsprachen. Um sicher zu gehen, wurde die Länge auf L/70 verlängert. Aus verschiedenen Gründen wurde für den schweren Panzer schließlich eine 8,8-cm-Panzerkanone verwendet, aber die Armee wusste, dass die 7,5-cm-Kanone ein Meisterstück war. Sie war relativ leicht und billig, während sich ihre Durchschlagskraft als erstaunlich erwies. Bei der Entwicklung des Panther Ende 1941 wurde eine Kanone mit hoher Durchschlagskraft gefordert. Zum ersten Mal stand eine offensichtliche, funktionierende und bereits bewährte Wahl zur Verfügung. Es handelte sich um die von Rheinmetall-Borsig entwickelte KwK 42 L/70. Sie wurde sofort in den Panther-Panzer eingebaut, ohne dass weitere Fragen gestellt wurden. Diese Waffe war so stark, dass normale AP Granaten in der Lage waren, jeden Panzer (mit Ausnahme des Stalin-Panzers von 1944) auf maximale Entfernung zu zerstören."
tech_trm_weapon_c_ger_88_kwk43:0	"8,8cm L/71 KwK 43"
tech_trm_weapon_c_ger_88_kwk43_desc:0	"\n\n\n£KwK43£\n\n\n\n\nBis 1942 hatte die Idee, einen Panzer zu schaffen, der es mit jedem Panzer des Gegners aufnehmen konnte, zur Entwicklung des Tiger I geführt.\n\nDer ultimative Panzer konnte nur eine mögliche Waffe haben: die "ultimative Waffe". Krupp erhielt den Auftrag zur Entwicklung der späteren KwK 43 und PaK 43 (die FlaK 41 wurde von Rheinmetall entwickelt, aber Krupp weigerte sich, die Waffe des Konkurrenten einzubauen, so dass man sich entschloss, eine eigene Version zu entwickeln... als ob Deutschland 1943 Zeit gehabt hätte).\n\nDiese Waffe war das größte Kaliber und die größte Kaliberlänge, die von den Deutschen während des Krieges in einer Panzerlafette eingesetzt wurde. Das Rohr hatte eine Lebensdauer von 1200 Schuss, und der massiv erhöhte Betriebsdruck des neuen Geschützes führte dazu, dass das Rohr bereits nach 500 Schuss so stark abgenutzt war, dass die Leistung nachließ. Daher musste eine neue panzerbrechende Granate entwickelt werden, um dieses Problem zu lösen. Diese Bemühungen scheinen gerechtfertigt: Die Kanone war in der Lage, 132 mm auf 2000 m (!) zu durchschlagen."
tech_trm_weapon_c_ger_105_stuh42_desc:0	"\n\n\n           £stuh_42£\n\n\n\n\nDas Sturmgeschütz 7,5 cm L/24 hatte sich beim Angriff auf Frankreich 1940 und auch in der Anfangsphase der Operation Barbarossa bewährt, wo es bei beiden Angriffen seine taktische Aufgabe erfüllte, die Infanterie an der Front wirksam zu unterstützen. Obwohl er nur in Notfällen oder zur Selbstverteidigung als Kampfpanzer eingesetzt wurde, war er im Allgemeinen in der Lage, solche Situationen zu bewältigen. Das war bis zum unerwarteten Auftauchen der sowjetischen T-34- und KV-1-Panzer auf dem Schlachtfeld der Fall. Obwohl die StuGs mit einer Kanone mit höherer Mündungsgeschwindigkeit aufgerüstet wurden, die es mit feindlichen Panzern aufnehmen konnte, bedeutete dies, dass die Fähigkeit zur Unterstützung der alliierten Truppen abnahm. Eine höhere Mündungsgeschwindigkeit würde zu einer flacheren Flugbahn führen. Wenn man also über die Köpfe der alliierten Infanterie hinweg feuerte, war es unmöglich, den Feind in Gräben oder leicht befestigten Stellungen zu vernichten. Gleichzeitig würde ein längeres Geschützrohr die Beweglichkeit des Panzers verringern und somit ein Hindernis darstellen.\n\n Aus all diesen Gründen wurde eine neue Sonderkategorie des Sfl. geschaffen, die Sturmhaubitze oder StuH, die auf die Unterstützung der Infanterie spezialisiert war, so dass das StuG eher eine leistungsstarke Panzerabwehrwaffe war. Die erste Sturmhaubitze, StuH 42 genannt, war mit einer Anpassung der leichten Haubitze 10,5 L/28 leFH18 M ausgestattet, die über eine zusätzliche Mündungsbremse verfügte."
tech_trm_weapon_c_ger_105_kwk45:0	"10,5 cm L/68 KwK 45"
tech_trm_weapon_c_ger_128_kwk44:0	"12,8 cm L/55 KwK 44"
tech_trm_weapon_c_ger_128_kwk44_desc:0	"\n\n\n£KwK44£\n\n\n\n\n\nBis Anfang 1943 hatte der schwere Panzer Maus immer noch keine endgültige Bewaffnung. Es gab mehrere Möglichkeiten für eine Kanone, aber im Februar 1943 beschloss Hitler, der es leid war, mit den Sowjets mitzuhalten, dem Spiel einmal voraus zu sein, und entschied sich für die größte und stärkste aller möglichen Optionen. Es handelte sich um eine 12,8-cm-Kanone, die von Krupp zur PaK 44 oder 12,8-cm-KwK 44 L/55 entwickelt wurde. Die Kanone stellte den Höhepunkt der Panzerabwehrbewaffnung des Zweiten Weltkriegs dar und war wahrscheinlich die beste Panzerabwehrkanone, die je gebaut wurde. Sie war in der Lage, 200 mm Panzerung auf 2000 m (!!!) zu durchschlagen und hatte eine Lebensdauer von 2000 Schuss. Da es zunächst als Feldgeschütz entwickelt wurde, erfüllte es schließlich beide Funktionen: Feldartillerie und Panzerabwehr.\n\n Aus verschiedenen Gründen kam die Maus nie über das Prototypenstadium hinaus. Die Kanone fand jedoch auf dem Jagdtiger, dem schwersten Kampffahrzeug des Krieges, eine perfekte Ergänzung. Mit der PaK 44 als Sfl. bewaffnet, konnte es jedes bewaffnete Fahrzeug der Alliierten besiegen und seine Reichweite übertreffen."
tech_trm_weapon_c_ger_150_stuh43:0	"15cm L/12 StuH 43"
tech_trm_weapon_c_ger_150_stuh43_desc:0	"\nm Oktober 1942 legte Alkett Hitler einen Entwurf für ein spezielles, verkürztes 15-cm-S.I.G.-Sturmgeschütz auf einem Panzer-IV-Fahrgestell vor. Durch die Verkürzung des Rohrs wurde das Geschütz leichter (perfekt für Panzer) und erfüllte dennoch die Aufgabe, für die es benötigt wurde: die Zerstörung von Gebäuden auf kurze Distanz. Skoda sollte das Geschütz weiterentwickeln. Um die Effektivität bei der Sprengung von Häusern zu erhöhen, verlangte Hitler die Herstellung einer dünnwandigen Granate mit hoher Sprengkraft für die Kanone. Sie ging 1943 in Produktion, als sie zum ersten (und einzigen) Mal in einen Panzer IV eingebaut wurde, der als Sturmpanzer bekannt war."
tech_trm_weapon_c_ger_380_rw61_desc:0	"\n\n\n\n £RW_61£\n\n\n\n\n\nAufgeschreckt durch die anhaltenden Straßenkämpfe in Stalingrad hatte Hitler einen seiner berühmten Wutanfälle und verlangte von seinem Militär- und Industriestab, dass ein Panzer konstruiert werden sollte, der in die widerspenstige Stadt eindringen und sie pulverisieren konnte. Die Wehrmacht verfügte bereits über genügend schwere Geschütze für diesen Zweck, das Problem war nur, dass die meisten von ihnen an Schienen gebunden und nicht in der Lage waren, innerhalb von Städten zu manövrieren. Die auf Raupenfahrgestellen montierten Geschütze waren ungeschützt und daher nicht in der Lage, eine direkte Rolle in der taktischen städtischen Kriegsführung zu übernehmen. Ursprünglich sollte eine 21-cm-Haubitze speziell für die Montage als Selbstfahrlafette auf Panzerfahrgestellen entwickelt werden, aber die sich verschlechternde strategische Lage ließ die Entwicklung der 21-cm-Haubitze ins Stocken geraten. Während Hitler über diese Hindernisse wütete, überbrachte ihm Albert Speer am 11. April 1943 die Nachricht, dass das Konzept durch die Bewaffnung eines Tiger I-Fahrgestells mit einer modifizierten Version des 38-cm-Raketenwasserbombenwerfers der Marine gerettet werden könnte.\n\nDer 38-cm-L/5,4-RTgW war ein verschlußloser Raketenwasserbombenwerfer, der von Rheinmetall-Borsig für die Kriegsmarine zur Verteidigung von Häfen und Marinestützpunkten gegen U-Boote entwickelt wurde. Aufgrund seiner geringen Reichweite von maximal 3000 Metern war das Schussfeld eher klein, so dass die Marine bereits 1941-42 ein Kettenfahrgestell für die Montage des Geschützes plante. Die Marine war jedoch technisch nicht in der Lage, eine solche Waffe zu entwerfen, zu entwickeln und zu bauen. Jahre später überlebte die Idee und wurde 1943 dem Führer vorgelegt. Die Modifikation war ziemlich gründlich: Der Werfer selbst wurde neu entworfen und neue Munition entwickelt, die in der Lage war, Gebäude zu durchdringen. Das bereits vorhandene Projektil war eine Tiefenladung, die für die Unterwasserphysik konzipiert war. Um widerspenstige Städte zu zerstören, brauchte man ein Geschoss, das stark genug war, um in Gebäude einzudringen und im Inneren zu explodieren, wo es großen Schaden anrichten konnte. Schließlich wurden zwei Geschosse entwickelt, High Explosive und HEAT, die in der Lage sein sollten, in stark befestigte Gebäude einzudringen. Die überarbeitete Aerodynamik des Geschosses in Verbindung mit der neu gestalteten Abschussvorrichtung verdoppelte die Reichweite auf fast 5700 Meter. Das neue Geschütz sollte die Bezeichnung 38 cm Raketenwerfer 61 (38cm RW 61) erhalten."
tech_trm_weapon_aa_mg_ger_15_mg151:0	"15mm MG151"
tech_trm_weapon_aa_ac_ger_20_flak38:0	"2cm L/55 KwK 38 und 2cm L/65 FlaK 38"
tech_trm_weapon_aa_ac_ger_20_flak38_desc:0	"Mit der Entwicklung des 2cm FlaK 38 Flakgeschützes wurden 2 Varianten geschaffen: (1) Die 2cm L/55 KwK 38 Autokanone zur Bodenunterstützung.   (2) Die 2cm L/65 FlaK 38 Flakkanone, die hauptsächlich als Sfl. montiert wurde. Zu Beginn des Zweiten Weltkriegs wurde sie von der deutschen Heeresführung nicht sonderlich gewürdigt. Das änderte sich schlagartig 1942, als die USA mit voller Wucht in den Krieg eintraten. Gegen die mächtige amerikanische Luftmacht wurde mit der Entwicklung und Produktion begonnen.\n\n\n£2cm£"
tech_trm_weapon_aa_ac_ger_20_flak38_x4:0	"2cm L/65 FlaK 38 (x2 und x4)"
tech_trm_weapon_aa_ac_ger_20_flak38_x4_desc:0	"         \n\n\n\n\n£Flak_x2_x4"
tech_trm_weapon_aa_ac_ger_37_flak43_desc:0	"\n\n\n\n\n £FlaK43£\n\n\n\n\n\n\n Als die Luftwaffe in der zweiten Hälfte des Zweiten Weltkriegs die Kontrolle über den Luftraum verlor, konnte sie keinen ausreichenden Schutz mehr gegen alliierte Flugzeuge bieten. In Nordafrika war 1942 eine Reihe von gepanzerten Fahrzeugen durch Tieffliegerangriffe verloren gegangen. Im weiteren Verlauf des Krieges wurde die alliierte Luftüberlegenheit so erdrückend, dass die Bewegung von gepanzerten Verbänden fast unmöglich wurde. General Guderian forderte daher für seine Panzereinheiten eine wirksame Verteidigung gegen Tiefflieger, sei es im Transport, bei der Stellungsnahme oder im Kampf.\n\nIm Mai 1943 trat eine PanzerKommission zu einer gemeinsamen Sitzung zusammen, um das Problem zu erörtern. Zwei Tage später wurde festgestellt, dass Flak-Begleitschutz für Panzer dringend benötigt wurde.\n\nKrupp begann sofort mit der Entwicklung einer Lösung unter Verwendung des starken Fahrgestells und der Panzerung des Panzer IV (die bisherigen Flak-Panzer waren auf leichten Panzern aufgebaut und daher für den Einsatz an der Front nicht mehr geeignet). Zunächst sollte die 2-cm-Flak 38 zum Einsatz kommen, doch im November 1943 wurde das 2-cm-Kaliber als zu schwach gegen moderne Flugzeuge eingestuft. Aus diesem Grund wurde die leistungsstärkere 3,7-cm-Flak 43 für den Einbau in einen Geschützturm ausgewählt. Die Kanone war ein völlig neues Flak-Modell. Sie verschoss die Flak 18-Munition, aber das Rohr, die Mündungsbremse und der Mündungsfeuerdämpfer waren neu. Außerdem war sie gasbetrieben, hydrogefedert und mit einem seitlichen Magazin ausgestattet. Leider verzögerte sich die Produktion erheblich, da Hitler immer wieder bezweifelte, dass sich die Verwendung des Panzer IV-Fahrgestells für diesen Zweck lohnen würde. Schließlich wurden zwei Panzer mit dieser Waffe hergestellt: der Möbelwagen und der berühmte Ostwind, der bis zum Ende des Krieges eingesetzt wurde."
