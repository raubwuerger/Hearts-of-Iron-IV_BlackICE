tech_trm_engine_radial_advanced_usa:0	"Verbesserte Radial-Benzinmotoren"

 
tech_trm_engine_radial_advanced_usa_desc:0	"Radialmotoren waren für den Einsatz in Panzern adaptierte Flugzeugmotoren, die ein hohes Leistungsgewicht aufwiesen. Sie waren die schnellsten aller Motortypen, wenn es um Höchstgeschwindigkeit und Beschleunigung ging, und versorgten die USA in der Anfangsphase des Krieges mit sehr leistungsstarken Motoren.\n\n Andererseits verbrauchten sie den meisten Kraftstoff und hatten die schlechteste Zuverlässigkeit aller Motortypen. Ein weiterer Nachteil war, dass sie groß waren, was bedeutete, dass die Panzer ein hohes Profil hatten und daher nicht in der Lage waren, ihre überlegene Geschwindigkeit für die taktische Manövrierfähigkeit voll auszunutzen."
