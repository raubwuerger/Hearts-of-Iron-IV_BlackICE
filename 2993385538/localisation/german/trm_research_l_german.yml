tech_trm_special_deep_wading_eng_desc:0	"Verwendbar bei;\n – Centaur (A27L)\n – Cromwell (A27M)\n – Churchill (A22/A43) \n\nTiefes Waten oder tiefe Durchquerung ist eine Technik, die von einigen schweren halb-amphibischen Fahrzeugen genutzt wird, um mehrere Meter tiefes Wasser zu durchqueren – das Fahrzeug fährt auf dem Fluss-, See- oder Meeresboden und nutzt Siebe oder ein Rohr (einen Schnorchel), das über die Wasseroberfläche ragt, um Luft zuzuführen."
tech_trm_special_deep_wading_usa:0	"Tiefwasser-Wathilfsausrüstung"
tech_trm_special_deep_wading_usa_desc:0	"Verwendbar bei:\n -M5 Light\n\nTiefwasser-Waten oder Tiefwasser-Durchwaten ist eine Technik, die von einigen schweren halb -Amphibienfahrzeugen, um mehrere Meter tiefes Wasser zu durchqueren. Im Wesentlichen ermöglichte es einem Panzer, teilweise oder vollständig unter Wasser auf dem Meeresboden zu fahren, anstatt zu schwimmen, wobei Siebe oder ein Rohr (ein Schnorchel) verwendet wurden, das zur Luftversorgung über die Wasseroberfläche ragt."
tech_trm_special_duplex_drive_eng_desc:0	"Verwendbar bei;\n -Valentine (A15)\n -Grizzly (Kanada)\n\nDD-Panzer (Duplex Drive Tanks) oder "Donald-Duck-Panzer" funktionierten, indem ein "Schwimmgitter" um den Panzer herum aufgestellt wurde, wodurch dieser schwimmen konnte, und verfügten über zwei Propeller, die vom , die sie im Wasser antrieben, wodurch das Fahrzeug bei ruhigem Wetter eine Geschwindigkeit von vier Knoten erreichen konnte.\n\nWenn der DD-Panzer das Ufer erreicht, wird der Schwimmrock abgesenkt und das gepanzerte Fahrzeug gewinnt seine landgestützten Eigenschaften zurück, wodurch es die Infanterie bei einer Landung oder einer Flussüberquerung so nah wie möglich unterstützen kann. Die Duplex-Drive-Panzer, die bei der Landung in der Normandie und bei den Rheinüberquerungen zum Einsatz kamen, ermöglichen es, einen Brückenkopf mit hoher Feuerkraft zu errichten, ohne auf externe Mittel (Schiffe, Häfen ...) zurückgreifen zu müssen, die möglicherweise nicht verfügbar sind."
tech_trm_special_schwimmpanzer_ger:0	"Schwimmpanzer-Ausrüstung"
tech_trm_special_schwimmpanzer_ger_desc:0	 "Verwendbar auf;\n -Panzer II\n\nDer Schwimmpanzer II (Panzer II) war mit 8,9 Tonnen leicht genug, um mit Hilfe von langen, rechteckigen Auftriebskörpern an beiden Seiten des Panzergehäuses zu schwimmen. Die Behälter wurden aus Aluminium gefräst und zur Erhöhung des Auftriebs mit Kapok-Säcken gefüllt. Die Antriebskraft lieferten die eigenen Ketten des Panzers, die über Stangen mit einer Propellerwelle verbunden waren, die durch jeden Schwimmkörper verlief. Der Schwimmpanzer II erreichte im Wasser eine Geschwindigkeit von 5,7 km/h. Ein aufblasbarer Gummischlauch um den Turmring sorgte für eine wasserdichte Abdichtung zwischen Rumpf und Turm."
tech_trm_special_schurzen_ger:0	"Schürzen"
tech_trm_special_simple_construction_sov_desc:0	"§YTyp: Zusatz§!\n\nEin Prinzip, das die Russen übernahmen, war die geplante Obsoleszenz. Bei einem Fertigprodukt macht es keinen Sinn, dass einzelne Bauteile länger halten als das Produkt selbst. Sie erkannten, dass sie diese Komponenten mit geringeren Toleranzen und unter Verwendung minderwertigerer Metalle fertigen konnten. Und sie ersetzten bearbeitete Teile, wann immer möglich, durch gestanzte Metallkomponenten. Die Lackierungen waren beklagenswert schlecht; die Schweißnähte oft grob."
tech_trm_suspension_christie_fra:0	"Christie-Federung"
tech_trm_suspension_christie_fra_desc:0	"Die Christie-Federung zeichnet sich durch die Verwendung großer, unabhängig voneinander gefederter Laufräder aus, die gleichzeitig den oberen oder Rücklaufteil der Kette stützen. Die Laufräder waren an Längslenkern (Knebelhebeln) montiert, die die Bewegungsrichtung von vertikal auf horizontal umlenkten. Das Gewicht des Fahrzeugrumpfs wurde über die auf den Längslenkern aufliegenden Schraubenfedern übertragen.\n\nEin weiteres Merkmal von Christies Konstruktionen war der "umrüstbare" Antrieb: die Möglichkeit, die Ketten für den Straßenverkehr abzunehmen, was höhere Geschwindigkeiten und eine größere Reichweite ermöglichte und den Verschleiß der empfindlichen Raupenlaufwerke reduzierte. "
tech_trm_suspension_christie_jap_desc:0	"Die Christie-Aufhängung zeichnet sich durch die Verwendung großer, unabhängig voneinander aufgehängter Laufräder aus, die gleichzeitig den oberen oder Rücklaufteil der Kette stützen. Die Laufräder waren an Längslenkern (Bellcranks) montiert, die die Bewegungsrichtung von vertikal auf horizontal umlenkten. Das Gewicht des Fahrzeugrumpfs wurde über die auf den Längslenkern aufliegenden Schraubenfedern übertragen. \n\nEin weiteres Merkmal von Christies Konstruktionen war der "umrüstbare" Antrieb: die Möglichkeit, die Ketten für den Straßenverkehr abzunehmen, was höhere Geschwindigkeiten und eine größere Reichweite ermöglichte und den Verschleiß an den empfindlichen Raupenlaufwerken reduzierte."
tech_trm_suspension_christie_improved_eng:0	"Verbesserte Christie-Aufhängung"
tech_trm_suspension_christie_improved_usa:0	"Verbesserte Christie-Aufhängung"
tech_trm_suspension_christie_improved_eng_desc:0	"Die Umrüstbarkeit der Christie-Aufhängung war eine Folge der empfindlichen und zerbrechlichen Raupenlaufwerke der frühen 1930er Jahre. Gegen Ende des Krieges wurde die Umrüstbarkeit zu einer unnötigen Komplikation, die wertvollen Platz im Panzer beanspruchte, und die Funktion wurde gestrichen, wodurch der Panzer leichter wurde."
tech_trm_suspension_horstmann_modified_eng:0	"Modifizierte Horstmann-Aufhängung"
tech_trm_suspension_horstmann_modified_eng_desc:0	"Die Horstmann-Aufhängung war eine Art Drehgestellaufhängung. Zwei Räder sind an einem gemeinsamen Rahmen in L-Form -förmigen Schwenkarm, der mit einer zwischen beiden Endpunkten verlaufenden Schraubenfeder eine Umlenkhebelkonstruktion bildet. Die Anordnung ist so ausgelegt, dass bei einer Aufwärtsbewegung eines Rades die Feder gegen den Schwenkarm des anderen Rades zusammengedrückt wird.\n\nDer Hauptnachteil des Horstmann-Systems bestand darin, dass es schwere Lasten nicht sehr gut bewältigen konnte. Dies wurde hauptsächlich durch die Einführung von zwei weiteren Federn im Rahmen überwunden."
tech_trm_suspension_torsion_fra:0	"Torsionsstab-Aufhängung"
tech_trm_suspension_torsion_ger:0	"Torsionsstab-Aufhängung"
tech_trm_suspension_torsion_sov:0	"Torsionsstabfederung"
tech_trm_suspension_torsion_usa:0	"Torsionsstabfederung"
tech_trm_suspension_torsion_hun:0	"Torsionsstabfederung"
tech_trm_suspension_torsion_pol:0	"Torsionsstabfederung"
tech_trm_suspension_torsion_eng_desc:0	"Torsionsstäbe nutzen eine verdrehende Rotationskraft auf einen langen Stahlstab, um eine "Feder"-Wirkung zu erzielen. Ein Ende eines langen Metallstabs ist fest am Fahrzeugchassis befestigt; das gegenüberliegende Ende mündet in einem Hebel, der am Rad angebracht ist. Vertikale Bewegungen des Rades bewirken, dass sich der Stab um seine Achse verdreht, was durch den Torsionswiderstand des Stabs aufgehalten wird. \n\nDie Anbringung der Torsionsstäbe an der Unterseite der Panzergehäuse sorgt zwar für einen guten Schutz und ermöglicht eine geringere Breite der Panzer, erhöht jedoch gleichzeitig deren Höhe. Dies ist an sich unerwünscht und kann zudem das Gewicht der Panzer erheblich erhöhen, insbesondere wenn diese schwer gepanzert sind."
tech_trm_suspension_torsion_fra_desc:0	"Torsionsstäbe nutzen eine verdrehende Rotationskraft auf einen langen Stahlstab, um eine "Feder"-Wirkung zu erzielen. Ein Ende eines langen Metallstabs ist fest am Fahrzeugchassis befestigt; das gegenüberliegende Ende mündet in einen Hebel, der am Rad angebracht ist. Die vertikale Bewegung des Rades bewirkt, dass sich der Stab um seine Achse verdreht, was durch die Torsionsfestigkeit des Stabs Torsionswiderstand der Stange. \n\nZwar sorgt die Anbringung der Torsionsstäbe am Boden der Panzergehäuse für einen guten Schutz und ermöglicht eine geringere Breite der Panzer, doch erhöht sie auch deren Höhe. Dies ist an sich unerwünscht und kann zudem das Gewicht von Panzern erheblich erhöhen, insbesondere wenn diese schwer gepanzert sind."
tech_trm_suspension_torsion_ger_desc:0	"Torsionsstäbe nutzen eine verdrehende Rotationskraft auf einen langen Stahlstab, um eine "Feder"-Wirkung zu erzielen. Ein Ende eines langen Metallstabs ist fest am Fahrzeugchassis befestigt; das gegenüberliegende Ende mündet in einen Hebel, der am Rad angebracht ist. Die vertikale Bewegung des Rades bewirkt, dass sich der Stab um seine Achse verdreht, was durch den Torsionswiderstand des Stabs aufgefangen wird.\n\nZwar sorgt der Einbau der Torsionsstäbe am Boden der Panzergehäuse für einen guten Schutz und ermöglicht eine Verringerung der Breite der Panzer, doch erhöht er auch deren Höhe. Dies ist an sich unerwünscht und kann zudem das Gewicht der Panzer erheblich erhöhen, insbesondere wenn diese schwer gepanzert sind."
