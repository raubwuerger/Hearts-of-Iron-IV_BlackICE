tech_trm_armour_construction_cast_round_fra:0	"Abgerundeter Guss-Geschützturm"
tech_trm_armour_construction_cast_round_fra_desc:0	"Abgerundete Geschütztürme waren die letzte Entwicklungsstufe der Geschützturmtechnologie des Zweiten Weltkriegs. Die stark abgerundete Oberfläche aus Stahlguss bedeutete, dass die Winkel auf der gesamten Oberfläche stark variierten, was die Wahrscheinlichkeit erhöhte, dass ein AP-Geschoss vollen Kalibers vom Fahrzeug abprallte. Außerdem war der Turm dadurch leichter und unauffälliger, so dass er schwerer zu treffen war. Der größte Nachteil war der geringere Platz im Inneren für Ausrüstung und Besatzung."
  

 
 
tech_trm_armour_construction_cast_round_jap_desc:0	"Abgerundete Geschütztürme waren die letzte Entwicklungsstufe der Geschützturmtechnologie des Zweiten Weltkriegs. Die stark abgerundete Oberfläche aus Stahlguss bedeutete, dass die Winkel auf der gesamten Oberfläche stark variierten, was die Wahrscheinlichkeit erhöhte, dass ein AP-Geschoss vollen Kalibers vom Fahrzeug abprallte. Außerdem war der Turm dadurch leichter und unauffälliger, so dass er schwerer zu treffen war. Der größte Nachteil war der geringere Platz im Inneren für Ausrüstung und Besatzung."

  
tech_trm_armour_construction_cast_round_sov_desc:0	"Abgerundete Geschütztürme waren die letzte Entwicklungsstufe der Geschützturmtechnologie des Zweiten Weltkriegs. Die stark abgerundete Oberfläche aus Stahlguss bedeutete, dass die Winkel auf der gesamten Oberfläche stark variierten, was die Wahrscheinlichkeit erhöhte, dass ein AP-Geschoss vollen Kalibers vom Fahrzeug abprallte. Außerdem war der Turm dadurch leichter und unauffälliger, so dass er schwerer zu treffen war. Der größte Nachteil war der geringere Platz im Inneren für Ausrüstung und Besatzung."

  
tech_trm_armour_construction_cast_round_usa_desc:0	"Abgerundete Geschütztürme waren die letzte Entwicklungsstufe der Geschützturmtechnologie des Zweiten Weltkriegs. Die stark abgerundete Oberfläche aus Stahlguss bedeutete, dass die Winkel auf der gesamten Oberfläche stark variierten, was die Wahrscheinlichkeit erhöhte, dass ein AP-Geschoss vollen Kalibers vom Fahrzeug abprallte. Außerdem war der Turm dadurch leichter und unauffälliger, so dass er schwerer zu treffen war. Der größte Nachteil war der geringere Platz im Inneren für Ausrüstung und Besatzung."

  
tech_trm_armour_construction_cast_round_swe_desc:0	"Abgerundete Türme waren die letzte Stufe in der Entwicklung der Turmtechnologie im Zweiten Weltkrieg. Durch die Verwendung von Stahlguss sorgte die stark abgerundete Oberfläche dafür, dass die Spielwinkel über die gesamte Oberfläche stark variierten, wodurch die Wahrscheinlichkeit maximiert wurde, dass eine vollkalibrige AP-Patrone abprallen würde Dadurch wurde der Turm leichter und hatte ein niedriges Profil, was bedeutete, dass er schwerer zu treffen war. Sein Hauptnachteil war der geringere Innenraum für Ausrüstung oder Besatzung."
 
 
tech_trm_armour_construction_welded_eng:0	"Geschweißte Konstruktion"
tech_trm_armour_construction_welded_eng_desc:0	"Der Übergang vom Nieten zum Schweißen begann 1934, als modifizierte Versionen der sowjetischen Panzer BT und T-26 mit Hilfe der aus Deutschland übernommenen Schweißtechnik hergestellt wurden, wo das Schweißen ebenfalls ab 1934 eingesetzt wurde. Andere Länder folgten sechs oder sieben Jahre später, und so wurde das Schweißen zur Standardmethode für die Herstellung der meisten gepanzerten Fahrzeuge. Die Vorteile des Schweißens liegen darin, dass es ein leichtes und relativ schnelles Verfahren zum Verbinden von Panzern ist - die Toleranz und die Fehlertoleranz sind ebenfalls höher - und außerdem kann man eine gröbere Schweißnaht anbringen, um Lücken auszugleichen. Die Qualitätskontrolle war extrem schnell, und Probleme ließen sich leicht erkennen.\n\n Der größte und wahrscheinlich einzige Nachteil war, dass es im Vergleich zu anderen Techniken viel Geschick und Know-how erforderte. So konnten Frauen beispielsweise Tanks mit Nieten herstellen, aber beim Schweißen war dies unmöglich."
 
tech_trm_armour_construction_welded_ita:0	"Geschweißte Konstruktion"
tech_trm_armour_construction_welded_ita_desc:0	"Der Übergang vom Nieten zum Schweißen begann 1934, als modifizierte Versionen der sowjetischen Panzer BT und T-26 mit der aus Deutschland übernommenen Schweißtechnik hergestellt wurden. Andere Länder folgten sechs oder sieben Jahre später, und so wurde das Schweißen zur Standardmethode für die Herstellung der meisten gepanzerten Fahrzeuge. Die Vorteile des Schweißens liegen darin, dass es ein leichtes und relativ schnelles Verfahren zum Verbinden von Panzern ist - die Toleranz und die Fehlertoleranz sind ebenfalls höher - und außerdem kann man eine gröbere Schweißnaht anbringen, um Lücken auszugleichen. Die Qualitätskontrolle war extrem schnell, und Probleme ließen sich leicht erkennen.\n\n Der größte und wahrscheinlich einzige Nachteil war, dass es im Vergleich zu anderen Techniken viel Geschick und Know-how erforderte. So konnten Frauen beispielsweise Tanks mit Nieten herstellen, aber beim Schweißen war dies unmöglich."
 
