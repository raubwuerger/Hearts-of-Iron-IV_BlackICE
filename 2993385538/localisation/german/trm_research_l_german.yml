tech_trm_armour_construction_cast_round_eng_desc:0	"Abgerundete Türme stellten die letzte Entwicklungsstufe der Turmtechnologie im Zweiten Weltkrieg dar. Durch den Einsatz von Stahlguss sorgte die stark abgerundete Oberfläche dafür, dass die Einfallswinkel über die gesamte Oberfläche stark variierten, wodurch die Wahrscheinlichkeit maximiert wurde, dass eine AP-Granate mit vollem Kaliber vom Fahrzeug abprallen würde. Außerdem wurde der Turm dadurch leichter und flacher, was bedeutete, dass er schwerer zu treffen war. Der größte Nachteil war der dadurch eingeschränkte Platz im Inneren für Ausrüstung oder Besatzung."
tech_trm_armour_construction_cast_round_ger:0	"Abgerundeter Turm"
