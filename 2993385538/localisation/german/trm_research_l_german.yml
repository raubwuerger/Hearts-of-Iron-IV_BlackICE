tech_trm_light_tank_ger_panzer1_superstructure_open_1:1	"PzKpfw I-Aufbau"
tech_trm_light_tank_ger_panzer2_superstructure_open_1:1	"PzKpfw II-Aufbau"
tech_trm_light_tank_ger_panzer2_superstructure_open_1_desc:1	"Aufbauten sind Konstruktionen, die um direkt auf dem Panzerrumpf montierte Geschütze herum errichtet werden und in erster Linie dazu dienen, der Besatzung und dem Geschütz einen gewissen Schutz zu bieten. Die Panzerung ist in der Regel schwächer als die des Panzers selbst. Positiv ist jedoch, dass sie leichter sind als Türme oder Kasematten, was den Einsatz schwererer Geschütze ermöglicht. Da sie zudem kostengünstiger herzustellen sind, sind sie die ideale Wahl für selbstfahrende Fahrzeuge."
tech_trm_light_tank_ger_panzer2_turret_open_1:1	"PzKpfw II mit offenem Turm"
tech_trm_cavalry_tank_ger_pz38_superstructure_open_1:1	"PzKpfw 38(t) Aufbauten"
tech_trm_cavalry_tank_ger_pz38_superstructure_open_1_desc:1	"Aufbauten sind Konstruktionen, die um direkt auf Panzerkörpern montierte Geschütze herum errichtet werden, hauptsächlich um der Besatzung und dem Geschütz einen gewissen Schutz zu bieten. Die Panzerung ist in der Regel schwächer als die des Panzers selbst. Positiv ist jedoch, dass sie leichter ist als Türme oder Kasematten, was den Einsatz schwererer Geschütze ermöglicht. Da sie zudem kostengünstiger herzustellen ist, stellt sie eine ideale Wahl für selbstfahrende Fahrzeuge dar."
tech_trm_medium_tank_ger_panzer3_superstructure_open_1:1	"PzKpfw III & IV Aufbauten"
tech_trm_medium_tank_ger_panzer3_superstructure_open_1_desc:1	"Aufbauten sind Konstruktionen, die um direkt auf Panzerkörpern montierte Geschütze herum errichtet werden, hauptsächlich um der Besatzung und dem Geschütz einen gewissen Schutz zu bieten. Die Panzerung ist in der Regel schwächer als die des Panzers selbst. Positiv ist jedoch, dass sie leichter ist als Turm- oder Kasemattenaufbauten, was den Einsatz schwererer Geschütze ermöglicht. Da sie zudem kostengünstiger herzustellen sind, sind sie die ideale Wahl für selbstfahrende Fahrzeuge."
tech_trm_medium_tank_ger_panzer3_casemate_1:1	"PzKpfw III Kasematte"
tech_trm_medium_tank_ger_panzer3_casemate_3:1	"PzKpfw III Kasematte (mit Mitleiter-MG)"
tech_trm_medium_tank_ger_panzer3_casemate_3_desc:1	"Bei gepanzerten Kampffahrzeugen bezieht sich der Begriff "Kasemattenbauweise" auf Fahrzeuge, bei denen die Hauptkanone direkt im Rumpf montiert ist und die keinen drehbaren Turm aufweisen, wie er üblicherweise bei Panzern zu finden ist. Eine solche Bauweise macht das Fahrzeug in der Regel mechanisch einfacher, kostengünstiger in der Herstellung, leichter und flacher. Das eingesparte Gewicht kann genutzt werden, um eine schwerere, leistungsstärkere Kanone zu montieren oder alternativ den Panzerschutz des Fahrzeugs im Vergleich zu regulären Panzern mit Turm zu erhöhen. Im Kampf muss die Besatzung jedoch das gesamte Fahrzeug drehen, wenn sich ein feindliches Ziel außerhalb des begrenzten Schwenkbereichs der Kanone befindet. Dies kann sich in Kampfsituationen als sehr nachteilig erweisen. \n\nWährend des Zweiten Weltkriegs wurden gepanzerte Kampffahrzeuge vom Typ Kasematte sowohl von den vereinten Streitkräften der deutschen Wehrmacht als auch von der sowjetischen Roten Armee intensiv eingesetzt. Sie wurden hauptsächlich als Panzerjäger und Sturmgeschütze eingesetzt."
