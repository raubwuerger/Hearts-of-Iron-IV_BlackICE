tech_trm_engine_diesel_interwar_ita_desc:0	"Dieselmotoren sind zuverlässiger, verbrauchen weniger Kraftstoff und haben ein höheres Drehmoment als Benzinmotoren, was ihnen eine bessere Geländegängigkeit verleiht. Andererseits sind sie teurer in der Herstellung und haben eine geringere Beschleunigung und Höchstgeschwindigkeit, was ihre Manövrierfähigkeit im Vergleich zu Benzinern etwas einschränkt."
 
