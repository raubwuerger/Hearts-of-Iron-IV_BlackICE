HUN_the_gyori_program_plans:0	"Einer unserer Berater wird die Pläne für ein umfangreiches Aufrüstungsprogramm ausarbeiten. Das Verfahren wird zweifellos kostspielig sein, aber es könnte das Schicksal unseres Landes auf dem Spiel stehen.\n"
HUN_reassert_old_claims_YUG_excluded:0	"Territorien, die zu Jugoslawien gehören, werden nicht beansprucht, um den Pakt der ewigen Freundschaft zwischen [Root.GetName] und Jugoslawien zu ehren.\n"
HUN_new_states_will_gain_infrastructure_realism:0	"Alle neu erworbenen Provinzen des historischen Königreichs Ungarn:\n Fügen Sie §Y1 Infrastruktur§!.\n"
HUN_economic_union_will_be_created:0	"Die Mitglieder der Visegrád-Gruppe werden eine Wirtschaftsunion eingehen, wodurch sich die Handelsbeziehungen zwischen ihnen erheblich verbessern werden. Künftige Mitglieder werden ebenfalls in den Genuss dieser Vorteile kommen.\n"
HUN_future_members_will_also_gain_benefits:0	"Zukünftige Mitglieder werden auch diese Vorteile erhalten.\n"
HUN_hungarian_ss_divisions_will_be_created:0	"Es werden zwei ungarische SS-Divisionen gebildet.\n"
HUN_assistance_from_the_geneal_staff_possibilities:0	"Der deutsche Militärstab wird um jede erdenkliche Unterstützung gebeten werden. Dies könnte nur eine symbolische Delegation sein, aber wenn sie sich besonders großzügig fühlen, könnten sie uns sogar einige ihrer Generäle zur Verfügung stellen.\n"
HUN_adriatic_initiative_defend_adriatic:0	"Wir werden verpflichtet sein, Italien zu Hilfe zu kommen, wenn seine Häfen von einem seiner Feinde bedroht werden, der in die Adria eindringt.\n"
