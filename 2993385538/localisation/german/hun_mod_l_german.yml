HUN_parliamentary_monarchy_effects:0	"Der König wird nur noch als Staatsoberhaupt fungieren und diplomatische und zeremonielle Aufgaben erfüllen.\n"
HUN_will_become_a_republic:0	"[Root.GetName] wird eine Republik werden.\n"
