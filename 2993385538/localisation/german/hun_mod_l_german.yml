HUN_gyori_program_category_desc:0	"Das Gyôri-Programm ist ein wirtschaftliches und militärisches Reformprogramm, das von Béla Imrédy vorgeschlagen wurde. Das Programm zielt darauf ab, Ungarns Industrie, Verteidigung, Armee und Luftwaffe zu modernisieren. Es ist geplant, das Programm in verschiedenen Phasen durchzuführen, wobei jedes Mal ein anderer Aspekt im Vordergrund steht."
