HUN_partition_romania_tt:0	"Wenn beide Seiten zustimmen, wird Rumänien gleichzeitig angegriffen, und nachdem sie besiegt sind, gewinnen wir Siebenbürgen, während [SOV.GetName] Moldawien, Bessarabien und die Bukowina erhält.\n"
