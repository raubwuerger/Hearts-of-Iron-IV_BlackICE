germany.1.d:	"Das Deutsche Reich steht kurz davor, die Kontrolle über Österreich zu übernehmen, wodurch es direkt an unsere Nordgrenze rücken und möglicherweise sogar unsere Herrschaft über Südtirol gefährden würde."
