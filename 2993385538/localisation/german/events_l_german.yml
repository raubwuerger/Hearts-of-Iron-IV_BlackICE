sia.4.a:	"Frieden ist der Weg"
sia.4.b:	"Es gibt keinen Grund, ihnen zu vertrauen"
sia.5.a:	"Das sichert unsere Flanken"
sia.6.t:	"[ENG.GetNameDefCap] lehnt ab"
sia.7.t:	"Der Franco [SIA.GetNameDefCap] Krieg"
sia.7.d:	"Der Krieg zieht sich in die Länge und setzt die Destabilisierung der Region fort, während er sich auch auf unsere Zukunftspläne auswirkt. Wir sollten auf beide Seiten zugehen und eine Vermittlung anbieten, um unser Prestige zu steigern und möglicherweise einen neuen Verbündeten zu gewinnen."
sia.8.d:	"Japanische Gesandte sind eingetroffen und fordern die Beendigung des gegenwärtigen Krieges. Obwohl sie unsere jüngsten Erfolge anerkennen, warnen sie vor den Folgen, sollten wir weitermachen, da sie im Gegenzug für die Abtretung von Land an die Franzosen in Zukunft ein Bündnis mit uns anstreben werden."
sia.8.b:	"Wir werden die Welt bekämpfen, wenn es sein muss"
sia.10.t:	"Skandal um königlichen Grundbesitz"
sia.10.desc:	"Es hat sich herausgestellt, dass ein Großteil der Kronländereien, die kürzlich verkauft wurden, einfach an Regierungsmitglieder zu einem Preis weit unter dem Marktwert verkauft wurden. Die Menschen protestieren gegen die dreiste Korruption."
sia.11.d:	"Sollen wir es ihnen geben?"
sia.11.a:	"Nimm es mit unserem Segen"
sia.11.e:	"Nein, es wird gebraucht"
