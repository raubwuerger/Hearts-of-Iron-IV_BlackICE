britain.25.d:	"Schiffe und U-Boote"
britain.25.e:	"Unterstützende Technologie für die Marine"
britain.25.g:	"Herstellung von Ressourcen"
britain.25.h:	"Methoden und Doktrinen der Kriegsführung"
britain.25.i:	"Elektronische Technik"
britain.27.t:	"Ein Skandal im Finanzministerium - Haushaltsgeheimnisse ausgeplaudert!"
britain.27.desc:	"Ein politischer Sturm bricht heute in Whitehall los, nachdem bestätigt wurde, dass James Henry Thomas, Lordsiegelbewahrer und ranghohes Kabinettsmitglied, vertrauliche Haushaltsdetails an private Mitarbeiter weitergegeben hat, von denen viele Verbindungen zur City haben sollen. Das Büro von Schatzkanzler Neville Chamberlain wurde gestern Abend davon in Kenntnis gesetzt, woraufhin eine sofortige interne Untersuchung eingeleitet wurde und man sich bemühte, den Schaden einzudämmen.\nDie undichten Stellen enthielten Berichten zufolge sensible Informationen über Steuern und Verteidigungsausgaben, was Befürchtungen über Insider-Profiteure und politische Instabilität zu einer Zeit aufkommen ließ, in der die Finanzstrategie des Landes auf dem Prüfstand steht. Angesichts der zunehmenden Spannungen in Europa und des wachsenden Aufrüstungsdrucks ist dieser Verstoß nicht nur peinlich, sondern eine Bedrohung für den nationalen Zusammenhalt.\nDie Rufe nach Thomas' Rücktritt werden von Stunde zu Stunde lauter, sowohl aus den Reihen der Konservativen als auch über die Parteigrenzen hinweg. Die Regierung von Premierminister Baldwin steht nun unter dem Druck, die Disziplin wiederherzustellen, und politische Kommentatoren warnen, dass jedes Versäumnis, entschlossen zu handeln, das Vertrauen der Öffentlichkeit in die Regierung Seiner Majestät erschüttern könnte."
britain.27.a:	"Thomas wird sich für diese Blamage verantworten müssen. Inakzeptabel!"
britain.27.b:	"Daran wird sich in einem Monat niemand mehr erinnern."
britain.28.t:	"Katastrophe in Yorkshire - Bergleute bei Gasexplosion begraben!"
britain.28.desc:	"In der Zeche Wharncliffe Woodmoor in der Nähe von Barnsley, Yorkshire, hat eine verheerende Gasexplosion unter Tage 58 Bergleute in den Tod gerissen, und es wird befürchtet, dass noch weitere verschüttet sind. Die Rettungsarbeiten sind im Gange, aber die Hoffnung schwindet, da weiterhin dichter Rauch aus den Lüftungsschächten aufsteigt und das Feuer tief im Flöz keine Anzeichen für ein Nachlassen zeigt.\nDie Explosion, die kurz nach Beginn der Morgenschicht in der Grube ausbrach, wurde vermutlich durch eine Entzündung von Grubengas ausgelöst, die auf eine schlechte Belüftung und mögliche Versäumnisse bei den Sicherheitsinspektionen zurückzuführen ist. Die Familien warten in Trauer und Ungläubigkeit zusammengekauert am Förderturm, während die örtlichen Behörden und die Bergwerksinspektoren eine umfassende Untersuchung der Ursache eingeleitet haben.\nDie öffentliche Empörung wächst. Es ist bekannt, dass die Modernisierung der Zeche überfällig war, und der Druck auf das Arbeitsministerium und die privaten Betreiber wächst, die Durchsetzung der Bergbauvorschriften zu verschärfen. Die Katastrophe hat die Debatte über die Verstaatlichung kritischer Industriezweige und eine stärkere staatliche Aufsicht über den Schutz der britischen Industriearbeiter neu entfacht - vor allem, da die Nachfrage nach Kohle in Erwartung eines europäischen Konflikts steigt."
britain.28.a:	"Die Nation ist fassungslos!"
britain.29.t:	"Landvermesser machen mobil - Kartierung der Nation mit militärischer Präzision!"
britain.29.desc:	"Heute beginnt die Retriangulation Großbritanniens, eine umfassende Initiative des Ordnance Survey zur Neudefinition und Modernisierung des nationalen geodätischen Rahmens. Vermessungsteams, bewaffnet mit modernsten Theodoliten und Kletterausrüstungen, schwärmen über Hügelkuppen und Moorlandschaften aus, um mit einer akribischen, Punkt-für-Punkt-Neukalibrierung des geografischen Skeletts Großbritanniens zu beginnen. Die Notwendigkeit der Retriangulation ergibt sich aus der militärischen Planung und der nationalen Verteidigungslogistik, da die veralteten Karten aus dem 19. Jahrhundert nicht mehr die Präzision aufweisen, die für die Artillerieplanung, die Koordination der Luftverteidigung und die Notfallinfrastruktur erforderlich ist. Die gesamte Insel wird von Grund auf neu kartiert, wobei ein Netz konkreter Trigonometriepunkte verwendet wird, die alle sorgfältig vermessen und durch Sichtlinien miteinander verbunden werden. Der Ankerpunkt dieses neuen Netzes? Ein einzelner Hügel in Hampshire - Hatherden Beacon. Obwohl Zivilisten das Projekt als abstrakte Kuriosität betrachten, beobachten Militärplaner und Bauingenieure es genau. Nach seiner Fertigstellung wird dieses Projekt Großbritannien eine noch nie dagewesene geografische Präzision verleihen - ein versteckter, aber entscheidender Vorteil im Falle eines totalen Krieges."
britain.29.a:	"Unsere Artillerie wird punktgenau sein, unsere Schiffe auf Kurs, unsere Flugzeuge präzise platziert."
britain.31.desc:	"Ein weiterer Schlag hat das Herz des industriellen Nordens Großbritanniens getroffen, als eine Explosion in der Zeche Markham in der Nähe von Chesterfield in Derbyshire 79 Bergleute tötete und viele weitere verletzte. Rettungsteams arbeiten sich noch immer durch die Trümmer, aber die Hoffnung auf Rettung der Verschütteten schwindet.\nVorläufige Berichte machen fehlerhafte Gasdetektion und Belüftung für das Unglück verantwortlich, was Erinnerungen an die Katastrophe von Wharncliffe weckt und den Eindruck in der Öffentlichkeit verstärkt, dass die Bergwerkseigentümer der Produktion Vorrang vor Menschenleben geben. Die Bergarbeitergewerkschaft National Union of Mineworkers fordert eine formelle Untersuchung, und im Parlament werden Forderungen nach staatlicher Intervention bei der Durchsetzung der Minensicherheit laut.\n Während sich Großbritannien für einen möglichen Krieg rüstet, werden die Kosten für Kohle nicht nur in Tonnen, sondern in Blut gemessen."
britain.32.t:	"Unentschieden in Nordchina - Britische Truppen in der Tientsin-Konzession umzingelt"
britain.33.t:	"Irisch-nationalistischer Terror trifft England - Bombe explodiert im Stadtzentrum!"
britain.33.a:	"Rufen Sie unsere Beamten in Dublin auf, gegen diese Verrückten vorzugehen!"
britain.34.t:	"Massenhysterie im Norden - Der Halifax Slasher verbreitet Angst und Verwirrung!"
britain.34.d:	"In der Stadt Halifax, West Yorkshire, ist Panik ausgebrochen, nachdem Berichte über einen mysteriösen Angreifer aufgetaucht sind, der nur als „Halifax Slasher“ bekannt ist. In den vergangenen Nächten haben Personen - meist junge Frauen - behauptet, von einer Gestalt angegriffen worden zu sein, die ein Rasiermesser oder eine Klinge in der Hand hielt, was zu einer weit verbreiteten Beunruhigung, Bürgerwehrpatrouillen und sogar Massenverhaftungen führte. Viele der Verletzungen waren selbst zugefügt oder eingebildet, verstärkt durch eine Welle der Hysterie, Sensationslust der Medien und lokalen Klatsch und Tratsch. Die informationshungrige und angesichts der Spannungen auf dem Kontinent bereits verunsicherte Öffentlichkeit hat sich auf die Figur des „Schlitzers“ als Bösewicht und Erklärung gestürzt.\nDie „Angriffe“ haben zwar aufgehört, doch der Schaden ist angerichtet. Das Vertrauen der Öffentlichkeit in die Kompetenz von Polizei, Presse und Regierung ist erschüttert, und die ganze Angelegenheit ist eine düstere Erinnerung daran, wie Angst - unbegründet oder nicht - selbst die ruhigsten Städte wie ein Lauffeuer überrollen kann."
britain.34.a:	"Gut, dass das vorbei ist"
britain.35.a:	"Hitlers Ambitionen werden immer gefährlicher für die Stabilität"
britain.36.t:	"Anschlag auf Edwards Leben knapp abgewehrt"
britain.36.a:	"Hat das britische Volk wirklich keinen Respekt mehr vor seinen Königen?"
britain.37.t:	"Walisische Nationalisten streiken aus Protest gegen RAF-Bombenschule"
britain.37.a:	"Will Wales wirklich, dass wir gespalten werden und von innen heraus fallen?"
britain.38.a:	"Das ruft nach einer Tasse Tee"
britain.39.t:	"Flugzeugtragödie südlich von London - Niederländisches Verkehrsflugzeug im Sturm verloren"
britain.39.d:	"Ein Unglück ereignete sich in Purley, Surrey, als eine Douglas DC-2 der KLM Royal Dutch Airlines während eines schweren Gewitters abstürzte. Das Flugzeug, das sich auf dem Weg vom Flugplatz Croydon nach Brüssel befand, stürzte kurz nach dem Start ab und kostete 15 der 17 Passagiere und Besatzungsmitglieder das Leben, darunter auch den ehemaligen schwedischen Ministerpräsidenten Arvid Lindman. Anwohner waren als erste vor Ort und kämpften mit Wrackteilen und Flammen, um Überlebende zu bergen. Erste Untersuchungen deuten auf schlechte Wetterbedingungen und eine mögliche Orientierungslosigkeit des Piloten hin, aber die Luftfahrtbehörden haben eine umfassende Untersuchung mechanischer und navigatorischer Faktoren eingeleitet.\nDies ist eine der schlimmsten Katastrophen der zivilen Luftfahrt im britischen Luftraum und gibt Anlass zur Sorge über die Sicherheitsprotokolle internationaler Fluggesellschaften, die britische Terminals anfliegen. Während Flugreisen für die meisten ein Novum bleiben, hat das Vertrauen der Öffentlichkeit in die entstehenden Luftverkehrsnetze einen schweren Schlag erlitten."
britain.39.a:	"Verdammt! Leiten Sie eine gründliche Untersuchung ein."
britain.41.d:	"Genau um Mitternacht wurde letzte Nacht in London der weltweit erste landesweite Notrufdienst - 999 - aktiviert. Von diesem Moment an können die Bürgerinnen und Bürger die Nummer kostenlos wählen, um in dringenden Situationen Polizei, Feuerwehr oder Krankenwagen zu rufen.\nDas neue System ist ein Wunderwerk der Telekommunikationsinfrastruktur, das durch die enge Zusammenarbeit zwischen dem General Post Office und der Metropolitan Police ermöglicht wurde. Auslöser war ein Brand im Jahr 1935, bei dem nach einer verspäteten Meldung fünf Menschen ums Leben kamen. Das 999-System nutzt Standleitungen, spezialisierte Anrufbearbeiter und die direkte Benachrichtigung von Notfalleinsatzkräften. Damit ist Großbritannien die erste Nation der Welt, die einen derartigen sofortigen Zugang zu Hilfe anbietet.\nDie Reaktion der Öffentlichkeit ist überwältigend positiv, und die Regierung feiert dies als einen Triumph der modernen Verwaltung und der Innovation im öffentlichen Dienst."
britain.42.d:	"Panik herrschte heute im Zentrum Londons, nachdem ein einsamer Schütze versucht hatte, Seine Majestät König Georg VI. während eines routinemäßigen öffentlichen Auftritts in der Nähe der Horse Guards Parade zu ermorden. Der Angreifer, der als gestörter ehemaliger Soldat beschrieben wird, eröffnete das Feuer aus der Menge heraus, wurde jedoch schnell von der Polizei und dem Sicherheitspersonal des Palastes überwältigt, bevor er Schaden anrichten konnte.\nDer König wurde nicht verletzt, obwohl er erschüttert wurde, und ist unter verstärkter Bewachung in den Buckingham Palace zurückgekehrt. Die Motive des Angreifers sind nach wie vor unklar - einige vermuten ideologische Gründe, andere ein anhaltendes Trauma aus dem Ersten Weltkrieg.\n Unabhängig von der Absicht hat der Anschlag die Nation schockiert. Die Öffentlichkeit reagierte mit unerschütterlicher Unterstützung. Vor dem Palast und dem Parlament versammelten sich Menschenmengen und forderten stärkere Sicherheitsvorkehrungen für hochrangige Staatsvertreter. Auch wenn die Kugel ihr Ziel verfehlt hat, werden die Folgen nicht verschwinden."
britain.42.a:	"Es scheint, dass Gott den König tatsächlich gerettet hat!"
britain.43.t:	"Eine Flagge auf dem Eis - Britische Wissenschaftler kehren heim"
britain.43.d:	"Unter der Leitung von John Rymill ist die britische Graham-Land-Expedition erfolgreich von der antarktischen Halbinsel zurückgekehrt. Die Expedition, die mit Flugzeugen, Schlittenhunden und Marineunterstützung ausgestattet war, hatte das Ziel, unerforschte Gebiete zu kartieren, Wetter- und Gletscherforschung zu betreiben und die britischen Gebietsansprüche in der südlichen Hemisphäre zu untermauern. Obwohl die Mission offiziell wissenschaftlich ist, sind die geopolitischen Untertöne klar - Großbritannien zeigt Flagge, bevor andere ihren Anspruch erheben können.\n Das Außenministerium beobachtet das Geschehen genau. In einer Zeit globaler Spannungen mag der polare Süden weit weg erscheinen, aber Souveränität ist ein Spiel, das an allen Fronten gespielt wird - von afrikanischen Wüsten bis zu gefrorenen Wüsten."
britain.43.a:	"Der gefrorene Kontinent wird wieder vom Union Jack geziert!"
britain.43.b:	"Diese Länder gehören rechtmäßig uns"
britain.44.t:	"Großbritannien und Italien unterzeichnen geheimes Abkommen über das Horn von Afrika"
britain.44.d:	"Hinter verschlossenen Türen haben sich britische und italienische Diplomaten nach der umstrittenen Eroberung und Annexion des ehemaligen Kaiserreichs durch Italien über den Status Äthiopiens geeinigt. Obwohl das Abkommen nicht öffentlich bekannt gegeben wurde, erkennt es die italienische Kontrolle im Gegenzug für die Zusicherung von Frieden im Mittelmeer und fortgesetzter maritimer Zusammenarbeit an. In offiziellen Erklärungen bekennt sich London weiterhin zu den Grundsätzen des Völkerbundes, aber insgeheim hat die Regierung jede realistische Erwartung aufgegeben, die Herrschaft von Haile Selassie wiederherzustellen. Der Vertrag sichert Großbritanniens Schifffahrtsrouten durch das Rote Meer und Suez und verschafft Mussolini einen stillen politischen Sieg.\nDie Reaktion der Öffentlichkeit wird gemischt ausfallen. Einige im Parlament schimpfen bereits über den Zusammenbruch der moralischen Autorität. Aber da die Achse immer stärker wird, muss London zwischen Idealen und Realitäten abwägen. Wir haben vielleicht einen Freund in Afrika verloren, aber vielleicht haben wir in Europa Zeit gewonnen."
britain.44.a:	"Die Aufrechterhaltung des Handels ist wichtiger als der Widerstand gegen Mussolini wegen einer verlorenen Sache."
britain.44.b:	"Selbst die Teetrinker erkennen unsere Größe an"
britain.45.t:	"Deutschland schlägt Krisengespräche vor - Kann Europa zusammengehalten werden?"
britain.45.d:	"Aus Berlin ist ein offizielles diplomatisches Kommuniqué eingetroffen. Deutschland fordert mit Unterstützung Italiens ein Vier-Mächte-Gipfeltreffen, um die sich zuspitzende Krise in der Tschechoslowakei zu erörtern, wo sich die Unruhen der Deutschen im Sudetenland zu einem offenen Konflikt auszuweiten drohen. An dem vorgeschlagenen Gipfeltreffen würden Deutschland, Italien, Großbritannien und Frankreich teilnehmen - allerdings ohne die Tschechoslowakei selbst. Das Reich behauptet, es strebe eine friedliche Lösung an, doch Geheimdienstberichten zufolge sind die Vorbereitungen für eine Militäroperation bereits im Gange. Einige in Whitehall argumentieren, dass die Teilnahme am Gipfel einen Krieg verhindern könnte, andere warnen davor, dass dies auf eine Kollaboration mit der Zerstückelung der Tschechoslowakei hinauslaufen würde.\n Premierminister [ENG.GetLeader] neigt dazu, den diplomatischen Weg zu verfolgen. Die Frage ist nicht, ob wir Frieden wollen, sondern welchen Preis wir dafür zu zahlen bereit sind. Ein Gipfel kann Zeit gewinnen. Oder er könnte die erste Schaufel Erde auf ein Grab sein."
britain.45.a:	"Wir müssen den Frieden in unserer Zeit sichern"
britain.46.t:	"Ein deutscher Monarchist spricht vom Widerstand - London empfängt einen Schattenboten"
britain.46.d:	"Ewald von Kleist-Schmenzin, ein konservativer deutscher Aristokrat und scharfer Kritiker des Naziregimes, ist unter dem Vorwand einer Privatreise in London eingetroffen. In Wirklichkeit überbringt er dringende Botschaften eines kleinen, aber entschlossenen Kreises von Anti-Hitler-Verschwörern, die in Deutschlands traditioneller Elite verankert sind.\nKleist-Schmenzin warnt, dass Hitlers Einfluss auf Deutschland nur noch stärker werden wird, wenn Großbritannien weiter beschwichtigt. Er besteht darauf, dass eine klare Linie aus London - eine, die Widerstand gegen territoriale Aggressionen in Mitteleuropa signalisiert - diejenigen ermutigen könnte, die von innen gegen das Reich intrigieren. Er bietet zwar keine festen Garantien, hat aber Informationen vorgelegt, die auf eine starke Unzufriedenheit unter Teilen des Offizierskorps und des alten preußischen Adels hindeuten.\n Das Außenministerium bleibt vorsichtig. Es gibt keine offiziellen Aufzeichnungen über dieses Treffen. Aber hinter verschlossenen Türen müssen britische Beamte nun darüber nachdenken, ob der Weg zum deutschen Zusammenbruch vielleicht nicht über Panzer, sondern über Männer wie diesen führt - Agenten des Gewissens, die alles zu verlieren haben."
britain.46.a:	"Ist dies der Riss in der Rüstung des Eisernen Reiches?"
britain.47.t:	"Gerüchte über deutsche Invasionspläne erschüttern London und Den Haag"
britain.47.d:	"Planen die Deutschen eine Ausweitung des Schlieffen-Plans?§Aufgrund eines erschreckenden Geheimdienst-Informationslecks wird vermutet, dass Deutschland möglicherweise eine Invasion der Niederlande plant - als Teil einer umfassenderen Strategie zur Umgehung der französischen Verteidigung und zur Sicherung von Flugplätzen in der Nähe Großbritanniens. Obwohl das deutsche Auswärtige Amt die Behauptung als „absurd“ abtut, hat die Befürchtung die Märkte abstürzen lassen und dringende diplomatische Kabel in ganz Europa ausgelöst.\nDie so genannte „niederländische Kriegsangst“ wurde Berichten zufolge von Oberst Hans Oster von der Abwehr, einem bekannten Anti-Nazi innerhalb des deutschen Militärs, gestreut. Britische Militärplaner haben bereits mit der Überprüfung von Verteidigungsanlagen in der Nähe des Ärmelkanals begonnen, während die Niederländer ihre Grenzeinheiten mobilisieren.\n Obwohl keine Schüsse gefallen sind, liegen die Nerven blank, und die Angst hat deutlich gemacht, wie ein Flüstern aus dem Inneren des Reichs den ganzen Kontinent in Bewegung setzen kann."
britain.47.a:	"Wir müssen uns auf eine Wiederholung von 1914 vorbereiten"
britain.48.t:	"Großbritannien bietet Zuflucht - jüdische Kinder fliehen vor Hitlers Schatten"
britain.48.d:	"Großbritannien wird zum Zufluchtsort für die verfolgten Massen!\nDie ersten Züge mit jüdischen Flüchtlingskindern aus Nazi-Deutschland sind im Rahmen eines humanitären Programms, das heute als Kindertransport bekannt ist, in Großbritannien angekommen. Tausende von unbegleiteten Minderjährigen, die meisten aus Deutschland, Österreich und der Tschechoslowakei, finden vorübergehend Zuflucht bei britischen Familien, Institutionen und Religionsgemeinschaften. Die Regierung hat die Einwanderungskontrollen für Kinder unter 17 Jahren gelockert, da sie die große Gefahr erkannt hat, die den Juden unter Hitlers Herrschaft drohte. Während die öffentliche Meinung gemischt ist, hat die britische Presse die Bemühungen weitgehend begrüßt und Geschichten von Kindern veröffentlicht, die mit nichts als Erkennungsmarken und Kleidersäcken ankamen.\n Es ist ein seltener Moment moralischer Klarheit in einem Jahrzehnt wachsender Dunkelheit. Großbritannien ist im Moment ein flackerndes Leuchtfeuer für diejenigen, die vor der Tyrannei fliehen."
britain.48.a:	"Wir stehen vereint gegen die von Deutschland begangenen Gräueltaten!"
britain.49.t:	"Rachefeldzug in London - ehemaliger Gouverneur des Punjab erschossen"
britain.49.d:	"Sir Michael O'Dwyer, ehemaliger Gouverneur von Punjab, wurde in der Caxton Hall in London während einer Sitzung der East India Association ermordet. Der Angreifer, ein indischer Nationalist namens Udham Singh, gab mit einem versteckten Revolver mehrere Schüsse ab, die O'Dwyer auf der Stelle töteten und mehrere andere verletzten. Der Anschlag wurde offensichtlich aus Rache für das Massaker von Amritsar 1919 verübt, das O'Dwyer zeitlebens öffentlich verteidigt hatte. Obwohl Singh sofort verhaftet wurde, hat das Attentat das britisch-indische Establishment erschüttert, und die Sicherheitsvorkehrungen für koloniale Persönlichkeiten und indische Politiker in London wurden in aller Stille verschärft.\nDie Presseberichterstattung wird sorgfältig gesteuert, aber die Symbolik ist stark: Indiens Kampf ist bis ins Herz des Empire vorgedrungen - und die Schatten vergangener Gräueltaten bleiben lang und scharf."
britain.49.a:	"Die Spannungen im Raj erreichen einen Siedepunkt, wenn sie in London angreifen."
britain.50.t:	"Explosionen in der Tottenham Court Road und am Leicester Square!"
britain.50.d:	"Terroristen schlagen im Herzen Englands zu!\nZwei Bomben sind im Herzen Londons detoniert, eine in der Tottenham Court Road, eine weitere am Leicester Square, und haben Dutzende von Verletzten und eine weit verbreitete Panik verursacht. Die Behörden gehen davon aus, dass die Anschläge im Zusammenhang mit der Sabotagekampagne der Irisch-Republikanischen Armee stehen, die Teil der laufenden S-Plan-Operationen ist, die auf die britische Infrastruktur und Moral abzielen.\nDie Rettungsdienste haben schnell reagiert, aber die Bomben, die in belebten öffentlichen Bereichen platziert wurden, deuten auf eine gefährliche Eskalation hin. Die Geheimdienste bemühen sich, das verantwortliche Netzwerk ausfindig zu machen, während die Polizei die Überwachung in London und den großen Häfen verstärkt. Während im Ausland der Krieg droht, ist der Terror im eigenen Land angekommen. Die irische Kampagne für die Abspaltung ist nicht mehr nur eine Angelegenheit von Ulster oder Dublin - sie ist jetzt ein Feuer auf den Straßen der Hauptstadt."
britain.50.a:	"Die IRA muss aufgelöst werden!"
britain.50.b:	"Das ist völliger Wahnsinn!"
britain.51.t:	"Das größte jemals gebaute Schiff nimmt still und leise seinen Dienst auf"
#SOUTH AMERICANS COUNTRIES
britain.51.a:	"Eine Königin auf unserem Schachbrett, auch dem Namen nach."
britain.52.t:	"Die Auswirkungen des Bürgerkriegs erreichen die britische Küste"
britain.52.d:	"Während der spanische Bürgerkrieg weiter wütet, erreichen Tausende von Zivilisten - vor allem Basken und Katalanen - die britische Küste und suchen Zuflucht. Viele von ihnen sind in Lagern, Waisenhäusern und umfunktionierten Schulen untergebracht, und die Gemeinden in Southampton, London und Wales haben sich bereit erklärt, ihnen zu helfen. Am meisten gefährdet sind Kinder, die aus Städten wie Bilbao und Barcelona evakuiert wurden, die stark bombardiert wurden. Die Flüchtlinge kommen hungrig, erschöpft und oft traumatisiert an und sind Zeugen der Brutalität der Luftangriffe und politischen Repressalien. Während viele Briten mit ihnen sympathisieren, betrachten andere den Zustrom mit Misstrauen - sie fürchten, dass neben fremden Mündern auch fremde Ideologien importiert werden.\nDie Regierung erlaubt ihnen dennoch den Aufenthalt und wägt dabei zwischen humanitärer Verpflichtung und innenpolitischer Stabilität ab. Im Schatten von Faschismus und Bürgerkrieg wird Großbritannien einmal mehr zu einem zögerlichen Zufluchtsort."
britain.52.a:	"Vielleicht sollten wir zumindest eine indirekte Intervention in Erwägung ziehen..."
britain.53.t:	"Schiff aus Grimsby verschwindet im Nordatlantik - Skipper und Besatzung verschwunden"
 
britain.53.a:	"Die Faszination der Öffentlichkeit für eine so triviale Angelegenheit ist sicherlich übertrieben."
britain.54.t:	"Das Mädchen Pat macht die britische Flotte lächerlich!"
britain.54.d:	"Was als Meldung über ein vermisstes Schiff begann, hat sich zu einer internationalen Blamage ausgewachsen. Berichte von den Kanarischen Inseln und aus Dakar bestätigen nun, dass die Girl Pat nicht nur überlebt hat, sondern absichtlich abtrünnig geworden ist und unter falscher Flagge und mit gefälschten Seekarten weit über ihre Fischereigewässer hinaus gefahren ist. Kapitän Orsborne hat das Schiff offenbar auf eine unerlaubte, kurvenreiche Odyssee entlang der westafrikanischen Küste mitgenommen und sich wochenlang erfolgreich den britischen Konsularbehörden und den Patrouillen der Royal Navy entzogen. Augenzeugen berichten, dass der Trawler getarnt ist und die Besatzung strengstes Stillschweigen bewahrt. Orsborne selbst hat den Einheimischen erzählt, dass er „in geheimer Mission der Admiralität“ unterwegs ist, obwohl die Regierung jegliche Verbindung abstreitet.\nDie Presse hat ihren großen Tag. Karikaturen, Schlagzeilen in der Boulevardpresse und satirische Sketche im Radio machen sich über das Versagen der Admiralität bei der Rückeroberung des kleinen Schiffes lustig. Selbst im Parlament wird der Unmut immer lauter. Ein Abgeordneter witzelte: „Wenn wir ein Fischerboot nicht fangen können, wie sollen wir dann die Italiener fangen?“"
 
britain.55.t:	"Die Reise endet - das Mädchen Pat wird von den Kolonialbehörden gefangen genommen"
britain.55.d:	"Die „letzte große Piratenfahrt“ geht zu Ende! Die lange Verfolgungsjagd ist zu Ende. Die Girl Pat wurde in Dakar aufgegriffen und ihre Reise nach wochenlangem diplomatischem Drängen von den französischen Kolonialbehörden gestoppt. Kapitän George Orsborne und seine Mannschaft wurden verhaftet und an Bord eines Schiffes der Royal Navy gebracht, das sie nach Großbritannien zurückbringen soll.\nEin erstes Verhör offenbart keine politischen Motive - nur eine seltsame Mischung aus persönlicher Schuld, Wahnvorstellungen und der Suche nach Nervenkitzel. Orsborne bleibt trotzig und behauptet, die Admiralität habe „alles gewusst“, obwohl keine Aufzeichnungen seine Behauptung stützen.\nDie Saga ist zwar eine Farce, hat aber tiefere Bedenken hinsichtlich der Hafensicherheit, der Schiffsverfolgung und der Überwachung der Befehlskette ausgelöst. Ein unbedeutender Trawler, der dem Imperium sieben Wochen lang durch die Lappen ging, war schon schlimm genug - zum nationalen Witz zu werden, war noch schlimmer.\nEine umfassende Untersuchung wurde angeordnet. Die Presse nennt es „Die letzte große Piratenfahrt“. Whitehall nennt es „Kopfschmerzen“."
britain.55.a:	"Nach all dem haben die Franzosen sie gekapert? Diese Blamage werden wir nie verwinden."

britain.56.d:	"Wimbledon wurde erstmals 1877 auf dem Rasen des All England Club ausgetragen und hat sich zur bedeutendsten Tennismeisterschaft der Welt entwickelt, die Könige, Aristokraten und das einfache Volk gleichermaßen anzieht. Die smaragdgrünen Rasenplätze sind heute der Altar der Tenniswelt, und auch in diesem Jahr waren sie Schauplatz von Dramatik, Präzision und Triumph. Fred Perry, der Stolz Großbritanniens und Sohn eines Baumwollspinners aus Stockport, hat als erster Mann der Neuzeit drei Wimbledon-Titel in Folge gewonnen, indem er den deutschen Baron Gottfried von Cramm in zwei Sätzen mit 6:1, 6:1, 6:0 besiegte. Perrys Sieg dauerte weniger als eine Stunde und schlug Wellen in der ganzen Nation, denn er war ein Meisterstück an Souveränität und Aggressivität. Über 15 000 Menschen füllten den Centre Court, und die Straßen Londons vibrierten vor Stolz. In Kneipen und Haushalten von Sussex bis Sunderland wurde auf unseren Champion aus der Arbeiterklasse angestoßen. Bei den Frauen wehrte die Amerikanerin Helen Jacobs ein hartes Comeback der Deutschen Hilde Sperling ab und siegte 6:2, 4:6, 7:5. Während Jacobs beklatscht wurde, war es Perry, die mit tosendem Applaus bedacht wurde, wobei selbst die stoischsten Offiziellen im All England Club ihre Bewunderung nicht verbergen konnten. Die nationale Presse bezeichnete das diesjährige Turnier als das bisher bedeutendste - ein Sinnbild für britische Spitzenleistungen im Schatten der wachsenden europäischen Spannungen."
britain.56.a:	"Ein Triumph für Großbritannien und zwei Niederlagen für Deutschland, großartig!"
britain.57.t:	"Britannien verliert eine Kolonie"

britain.57.a:	"Oops"
sia.1.t:	"[SIA.GetNameDefCap] Versucht, unseren Vertrag neu zu definieren"
sia.1.d:	"Unser Vertrag mit [SIA.GetNameDefCap] läuft nun schon seit über 10 Jahren, aber wir haben eine Note des Botschafters von [SIA.GetAdjectiveCap] erhalten, in der es heißt: " Sie wissen, dass der Vertrag über Freundschaft, Handel und Schifffahrt, der die Beziehungen zwischen den Vereinigten Staaten von Amerika und Siam regelt, nun über den im Text vorgesehenen Zeitraum von zehn Jahren in Kraft ist und für einen weiteren Zeitraum von einem Jahr nach Kündigung durch eine der Parteien in Kraft bleiben wird. Dieses Basisabkommen enthält zahlreiche Bestimmungen, deren Nützlichkeit sich während des fraglichen Zeitraums bewährt hat. Es gibt jedoch einige Bestimmungen, die der Regierung Seiner Majestät nicht mehr zweckmäßig erscheinen, einige inhaltlich, andere in Bezug auf die Form. Ähnliche Bemerkungen gelten auch für die bestehenden Verträge zwischen Siam und anderen Mächten.\n Bei mehreren Gelegenheiten wurde die allgemeine Haltung der Regierung Seiner Majestät in diesen Fragen in öffentlichen Erklärungen dargelegt. Zum Beispiel enthielt eine Erklärung der Regierungspolitik vom 22. September 1934 die folgenden Bemerkungen:\n „Im Hinblick auf das Prinzip der Unabhängigkeit gibt es immer noch bestimmte Vertragsbestimmungen, die unsere gerichtliche und fiskalische Autonomie einschränken, und die Regierung wird zu gegebener Zeit eine Gelegenheit für deren Revision suchen.“\nDie Rede des Regentenrats bei der Eröffnung der Versammlung am 1. August 1934 enthielt die folgende Erklärung:\n"... zum gegenwärtigen Zeitpunkt laufen fast alle unsere Verträge mit ausländischen Mächten aus. Die Regierung wird sich daher bemühen, zu gegebener Zeit über ihre Revision zu verhandeln, um ihnen die Form völliger Gleichberechtigung zu geben."\nWie bereits angedeutet, hält es die Regierung Seiner Majestät nun für ihre Pflicht, Maßnahmen einzuleiten, die auf eine Revision der gegenwärtigen Verträge abzielen, oder genauer gesagt, auf die Ersetzung einiger der gegenwärtigen Verträge durch neue Texte oder Instrumente.\nDie Regierung ist bei der Untersuchung dieses Problems zu dem Schluß gekommen, daß die Interessen Siams einerseits und die ausländischer Staaten andererseits am besten definiert und gewahrt werden können, wenn die grundlegenden Verträge einen einheitlichen Charakter haben. Was Siam anbelangt, so wird ein solches Ergebnis das Problem der neuen Gesetzgebung erheblich vereinfachen und eine Auslegung der Texte durch die Gerichte und Verwaltungsbehörden ermöglichen, die eine einheitliche Behandlung der ausländischen Interessen gewährleistet. Da keine ungewöhnlichen Bestimmungen vorgesehen sind und im allgemeinen die in anderen modernen Verträgen häufig verwendeten Formen vorgeschlagen werden, wird davon ausgegangen, daß die so vorgeschlagene Einheitlichkeit keine besonderen legislativen oder administrativen Probleme aufwirft, soweit die anderen Hohen Vertragsparteien betroffen sind.\nMit diesem Ziel, ihr Vertragssystem zu revidieren, um Einheitlichkeit, vollständige Gegenseitigkeit und volle gerichtliche und steuerliche Autonomie zu erreichen, schlägt die Regierung Seiner Majestät vor, unverzüglich einen Entwurf für einen neuen Vertrag zu übermitteln, nachdem sie zu einem frühen Zeitpunkt den Wunsch geäußert hat, den gegenwärtigen Vertrag zu kündigen. Wie in Artikel 17 dieses Dokuments vorgesehen, behält der bestehende Vertrag für ein weiteres Jahr ab dem Datum dieser Mitteilung seine Gültigkeit; in dieser Zeit hofft die Regierung Seiner Majestät, eine vollständige Einigung über die Bedingungen des neuen Vertrags zu erzielen und ihn in Kraft zu setzen, so dass es zu keiner Unterbrechung der vertraglichen Beziehungen kommen wird.\n\n Wie sollten wir reagieren?"
sia.2.t:	"[USA.GetNameDefCap] Stimmt dem neuen Vertrag zu"
sia.2.d:	"Unser Botschafter berichtet die überraschende Nachricht, dass [USA.GetNameDefCap] unserem neuen Vertragsvorschlag zugestimmt hat"
sia.3.d:	"Unser Botschafter berichtet, dass die [USA.GetNameDefCap] unseren neuen Vertragsvorschlag abgelehnt hat"
