sp_land_improved_handheld_at_desc:	"Es kann eine Technologie entwickelt und getestet werden, die die Entwicklung einer neuen Generation von Panzerabwehrwaffen für die Infanterie ermöglicht."
sp_land_assault_rifle:	"Sturmgewehr"
sp_land_assault_rifle_desc:	"Sturmgewehre kombinieren die Kraft von Gewehren, die Kompaktheit von Karabinern und die Feuerrate von Maschinenpistolen und sind daher ein guter Allrounder für Infanterieeinheiten."
