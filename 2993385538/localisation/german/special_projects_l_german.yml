sp_nuclear_design_choice_reward_heavy_water:	"Schwerwasser ist kostengünstiger"
sp_nuclear_isotope_separation_choice_reward_desc:	"Um unsere Reaktoren mit Kernbrennstoff zu versorgen, müssen wir uns für ein Verfahren entscheiden, mit dem die nutzbaren Uranisotope vom Rest getrennt werden. Es gibt eine Reihe von Vorschlägen für Trennanlagen, doch die beiden führenden Verfahren sind das Gasverfahren und das Zentrifugenverfahren."
sp_nuclear_isotope_separation_choice_reward_gaseous:	"Das gasförmige Verfahren ist eine bewährte Technik."
sp_nuclear_isotope_separation_choice_reward_centrifugal:	"Zentrifugen werden auf lange Sicht effizienter sein."
sp_nuclear_generic_industry_tech_reward_desc:	"Während der Arbeit an dem Projekt haben unsere Ingenieure mehrere neue Erfindungen gemacht, die sehr wahrscheinlich auch für den Einsatz in anderen Bereichen angepasst werden könnten."
sp_nuclear_generic_reward_option_industry_tech_name:	"Fortgeschrittene industrielle Forschung"
sp_nuclear_minor_progress_generic_reward_desc:	"Unsere Wissenschaftler haben bei der Arbeit am neuesten Prototyp einige wirklich bahnbrechende Entdeckungen gemacht. Ihre Erkenntnisse haben unser Wissen und unsere Forschung auf diesem Gebiet erheblich vorangebracht."
sp_nuclear_generic_electronics_tech_reward:	"Technologische Innovation"
sp_nuclear_generic_electronics_tech_reward_desc:	"Während der letzten Projektphase wurden wichtige Erkenntnisse gewonnen. Hoffentlich können wir diese in die Praxis umsetzen, was uns ermöglichen dürfte, die Forschung in verwandten Bereichen zu beschleunigen."
sp_nuclear_generic_reward_option_electronics_tech_bonus_name:	"Fortgeschrittene Elektronikforschung"
sp_nuclear_major_political_interference_generic_reward:	"Erhebliche politische Einmischung"
sp_nuclear_bomb_information_leak_reward_desc:	"Einer der Mitarbeiter bei [SpecialProject.GetName] hat offenbar Informationen an ausländische Agenten weitergegeben. Ob dies absichtlich geschah oder nicht, ist bislang nicht bekannt. Ebenso schwer ist es, den Schaden zu beziffern, den dies dem Projekt zugefügt hat"
sp_nuclear_bomb_information_leak_reward_tt:	"Fortschritte beim Gains-Projekt"
