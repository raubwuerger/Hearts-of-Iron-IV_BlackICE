sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01_desc:	"Einer der Nachwuchsingenieure hat eine neue Bewehrungsmethode entdeckt, die bei Standardbefestigungen angewendet werden könnte. Eine sofortige Dokumentation könnte unseren Wissenschaftlern und Ingenieuren einen Vorsprung bei der zukünftigen Forschung verschaffen."
sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02_desc:	"Eine von einem der Nachwuchsingenieure entdeckte neue Bewehrungsmethode wurde zur weiteren Bewertung an ein externes Forschungsteam weitergeleitet. Während die Ergebnisse noch geprüft werden, kann die Technik dennoch auf das aktuelle Projekt angewendet werden, sofern sie als geeignet erachtet wird."
