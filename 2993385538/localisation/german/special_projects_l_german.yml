scientist_trait_genius:	"Genial"
scientist_trait_genius_desc:	"Ein visionärer Geist, der die Grenzen von Wissenschaft und Technologie mit unvergleichlicher Innovation verschiebt. Diese Art von Talent taucht nur einmal in einer Generation auf."
scientist_trait_gifted_engineer:	"Begabter Ingenieur"
scientist_trait_gifted_engineer_desc:	"Ein von Natur aus talentierter Ingenieur, der in der Lage ist, komplexe technische Probleme in einer Vielzahl von Bereichen zu lösen."
scientist_trait_brilliant_theorist:	"Genialer Theoretiker"
scientist_trait_brilliant_theorist_desc:	"Ein Meister der abstrakten Konzepte und Theorien, der in der Lage ist, die militärische Strategie und die wissenschaftliche Forschung zu revolutionieren."
scientist_trait_bright:	"Klug"
scientist_trait_bright_desc:	"Ein scharfsinniger, schnell denkender Wissenschaftler, der neue Konzepte hervorragend erfasst und sie effizient anwendet."
scientist_trait_fast_learner:	"Schneller Lerner"
scientist_trait_fast_learner_desc:	"Passt sich schnell an neue Herausforderungen an, lernt schneller als seine Kollegen und ist in verschiedenen wissenschaftlichen Bereichen herausragend."
scientist_trait_resourceful:	"Einfallsreich"
scientist_trait_resourceful_desc:	"Findet immer kreative Lösungen, auch wenn die Ressourcen knapp sind oder die Lage schlecht ist."
scientist_trait_schrodingers_trait:	"Schrödingers Charaktereigenschaft"
scientist_trait_schrodingers_trait_tt:	"Erfahrungsgewinn für Wissenschaftler: §G+10%§!\nWissenschaftler-EP-Gewinn: §R-10%§!"
scientist_trait_schrodingers_trait_desc:	"Bevor ein Beobachter die Box öffnet, bildet die Wellenfunktion, die die Eigenschaft beschreibt, eine Überlagerung der Zustände ''gut'' und ''schlecht''"
scientist_trait_aircraft_specialist:	"Spezialist für Flugzeuge"
scientist_trait_aircraft_specialist_desc:	"Ein Spezialist für Aerodynamik und Flugzeugdesign, der in der Lage ist, überlegene Flugzeugzellen, Motoren und Designs zu entwickeln, um den Himmel zu beherrschen."
scientist_trait_rocketry_specialist:	"Raketenspezialist"
scientist_trait_rocketry_specialist_desc:	"Ein Spezialist für Raketentechnologie, der sich auf die Prinzipien des Antriebs in ballistischen und gelenkten Raketenprogrammen konzentriert."
scientist_trait_helicopter_expert:	"Hubschrauber-Experte"
scientist_trait_helicopter_expert_desc:	"Ein Pionier im Bereich der Drehflügler, spezialisiert auf die Mechanik des Vertikalflugs, Rotorsysteme und frühe Hubschraubermodelle."
scientist_trait_jet_expert:	"Jet-Experte"
scientist_trait_jet_expert_desc:	"Eine Autorität auf dem Gebiet des Düsenantriebs, die die Forschung zu frühen Düsentriebwerken und deren Anwendung in Militärflugzeugen vorantreibt."
scientist_trait_bombs_expert:	"Bomben-Experte"
scientist_trait_bombs_expert_desc:	"Experte für die Entwicklung von Sprengkörpern und Präzisionsbomben, die in neuen, verfeinerten Strategien für Luftangriffe eingesetzt werden können."
scientist_trait_guidance_systems_expert:	"Experte für Lenksysteme"
scientist_trait_guidance_systems_expert_desc:	"Ein Experte für die frühe Entwicklung von Lenkungstechnologien mit Erfahrung in der Verbesserung von Kontrollsystemen für unbemannte Sprengkörper mit großer Reichweite."
scientist_trait_armored_specialist:	"Spezialist für Panzerung"
scientist_trait_armored_specialist_desc:	"Ein erfahrener Ingenieur, der auf die Entwicklung und Verbesserung von Panzern und anderen gepanzerten Fahrzeugen spezialisiert ist."
scientist_trait_artillery_specialist:	"Artillerie Spezialist"
scientist_trait_artillery_specialist_desc:	"Ein Spezialist für Artilleriesysteme mit Erfahrung in der Verbesserung von Langstreckenfeuerwaffen und großkalibrigen Geschützen."
scientist_trait_army_equipment_specialist:	"Spezialist für Armeeausrüstung"
scientist_trait_army_equipment_specialist_desc:	"Ein Spezialist für verschiedene Spezialausrüstungen der Armee."
scientist_trait_submarine_specialist:	"U-Boot Spezialist"
scientist_trait_submarine_specialist_desc:	"Ein Spezialist für U-Boot-Kriegsführung, der sich auf die Entwicklung neuer U-Boot-Technologien konzentriert, um deren Rolle bei getarnten Marineoperationen zu verbessern."
scientist_trait_torpedo_specialist:	"Torpedo Spezialist"
scientist_trait_torpedo_specialist_desc:	"Ein Spezialist für Torpedo-Design und -Technik, der sich auf die Entwicklung fortschrittlicher Torpedo-Technologien konzentriert."
scientist_trait_asw_specialist:	"Spezialist für U-Boot-Bekämpfung"
scientist_trait_asw_specialist_desc:	"Ein Spezialist für U-Boot-Abwehrtechnologie und -taktik, der sich auf die Entwicklung neuer Methoden zur Erkennung und Bekämpfung von U-Booten konzentriert."
scientist_trait_surface_ship_specialist:	"Spezialist für Überwasserschiffe"
scientist_trait_surface_ship_specialist_desc:	"Spezialisiert auf den Entwurf, die Entwicklung und den Einsatz großer Überwasserkriegsschiffe sowie auf die Erforschung neuer Technologien zur Ausrüstung von Militärschiffen."
scientist_trait_nuclear_specialist:	"Nuklear Spezialist"
scientist_trait_nuclear_specialist_desc:	"Ein Physiker an der Spitze der Atomforschung, der sich intensiv mit der Erforschung von Kernspaltung und Kettenreaktionen beschäftigt."
scientist_trait_nuclear_warfare_expert:	"Experte für nukleare Kriegsführung"
scientist_trait_nuclear_warfare_expert_desc:	"Ein Experte für die praktische Anwendung der Atomphysik bei der Waffenentwicklung, der sich auf die Theorie der Atombombenentwicklung spezialisiert hat."
scientist_trait_nuclear_power_expert:	"Experte für Kernenergie"
scientist_trait_nuclear_power_expert_desc:	"Eine führende Autorität auf dem Gebiet der Kernphysik, versiert auf dem Gebiet der Kernspaltung mit Schwerpunkt auf der Energieerzeugung."
scientist_trait_electronics_specialist:	"Spezialist für Elektronik"
scientist_trait_electronics_specialist_desc:	"Spezialisiert auf Kommunikation, Radar und verwandte Systeme, die für die moderne Kriegsführung unerlässlich sind."
scientist_trait_computing_specialist:	"Spezialist für Computertechnik"
scientist_trait_computing_specialist_desc:	"Spezialisiert auf Computer- und Verschlüsselungssysteme."
sp_land_assault_rifle_early:	"Sturmgewehr"
sp_land_assault_rifle_early_desc:	"Sturmgewehre kombinieren die Kraft von Gewehren, die Kompaktheit von Karabinern und die Feuerrate von Maschinenpistolen und sind daher ein guter Allrounder für Infanterieeinheiten."
sp_land_assault_rifle_early:	"Sturmgewehr"
sp_land_assault_rifle_early_desc:	"Sturmgewehre kombinieren die Kraft von Gewehren, die Kompaktheit von Karabinern und die Feuerrate von Maschinenpistolen und sind daher ein guter Allrounder für Infanterieeinheiten."
