sp_nuclear_bomb_test_prototype_reward:	"Prototyp-Bombe"
sp_nuclear_bomb_test_prototype_reward_desc:	"Ein Prototyp einer Bombe wurde vom Team von [Character.GetName] hergestellt. Die Durchführung und Auswertung eines erfolgreichen Tests würde unseren Fortschritt erheblich verbessern. Andererseits verfügen wir nun über eine Atombombe ..."
