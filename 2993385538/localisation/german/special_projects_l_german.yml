sp_nuclear_war_support_generic_reward:	"Öffentliche Unterstützung"
sp_nuclear_war_support_generic_reward_desc:	"Ein erfolgreicher Test und die damit verbundene, streng kontrollierte Berichterstattung in den Medien haben dazu geführt, dass die Öffentlichkeit versteht, dass wir der Entwicklung einer Art Superwaffe, mit der alle Feinde besiegt werden können, näher gekommen sind. "
sp_nuclear_major_political_interference_generic_reward_desc:	"Das Projekt [SpecialProject.GetName] wurde von der politischen Führung verstärkt unter die Lupe genommen, was zu Verzögerungen führte und möglicherweise Änderungen in der Projektleitung erzwang. Dies hat [Character.GetName] wütend gemacht. Wir müssen uns mit diesen politischen Herausforderungen auseinandersetzen, um das Projekt auf Kurs zu halten"
sp_nuclear_major_political_interference_generic_reward_option_keep:	"Behalten Sie [Character.GetName]"
sp_nuclear_major_political_interference_generic_reward_option_fire:	"Entfernen Sie [Character.GetName]"
sp_nuclear_bomb_theoretical_breakthrough_generic_reward:	"Theoretischer Durchbruch"
sp_nuclear_bomb_theoretical_breakthrough_generic_reward_desc:	"[Character.GetName] ist es gelungen, während der Arbeit mit dem neuesten Prototyp ein komplexes theoretisches Problem zu lösen. Dies hat zu einer Verschlankung des Bombendesigns geführt, wodurch die Herstellung weniger schwierig wird."
sp_nuclear_bomb_critical_mass_generic_reward:	"Experiment zur kritischen Masse geht schief"
sp_nuclear_bomb_critical_mass_generic_reward_desc:	"Bei Experimenten zur Bestimmung der kritischen Masse kam es zu einem kritischen Unfall, der zu einer Strahlenbelastung und zu Opfern unter dem Schlüsselpersonal führte."
sp_nuclear_bomb_information_leak_reward:	"Informationsleck"
sp_nuclear_reactor_radioactive_leak_stabilized_reward_desc:	"Leider kam es bei den Arbeiten am Reaktor zu einem schweren Zwischenfall. Dank der schnellen Reaktion der Mitarbeiter konnte der Schaden eingedämmt werden und das Team konnte wertvolle Daten aus dem Vorfall gewinnen."
sp_nuclear_reactor_minor_explosion_reward:	"Leichte Explosion, keine Verletzten"
sp_nuclear_reactor_minor_explosion_reward_desc:	"Bei der Arbeit an der neuesten Version des Kernreaktor-Prototyps kam es zu einem kleinen Zwischenfall. Es kam zu einer kleineren Explosion, bei der Teile des Labors beschädigt wurden, aber das Feuer, das daraufhin entstand, konnte leicht gelöscht werden. Sobald das Labor repariert ist, sollte die Arbeit wie geplant fortgesetzt werden können, mit nur einer kleinen Verzögerung."
sp_nuclear_reactor_tested_reward:	"Erster erfolgreicher Kernreaktortest"
sp_nuclear_reactor_tested_reward_desc:	"Unser erster Kernreaktor ist erfolgreich getestet worden und hat die Machbarkeit der kontrollierten Kernspaltung bewiesen. Dieser Durchbruch verspricht eine neue Ära der Energieerzeugung und möglicherweise noch viel mehr."
sp_nuclear_reactor_tested_reward_public:	"Feiern Sie die Errungenschaft öffentlich"
nuclear_reactor_tested_reward_classify:	"Halten Sie die Informationen vorerst geheim"
sp_nuclear_reactor_tested_reward_public_tt:	"Andere Länder könnten davon profitieren"

