sp_rockets_flying_bomb_pulsejet:	"Flugbombe"
sp_rockets_flying_bomb_pulsejet_desc:	" Ein unbemanntes Flugzeug, das mit einem Raketentriebwerk ausgestattet ist und eine beträchtliche Nutzlast transportiert, sollte in der Lage sein, unseren Feinden Angst einzuflößen und sie zu demoralisieren."
sp_rockets_early_ballistic_missile:	"Ballistische Rakete"
sp_rockets_early_ballistic_missile_desc:	"Eine gelenkte ballistische Rakete, die in der Lage ist, einen Sprengkopf aus großer Entfernung mit beispielloser Geschwindigkeit und Präzision abzufeuern."
GER_sp_rockets_early_ballistic_missile:	"Das V2-Projekt"
sp_rockets_improved_ballistic_missile_desc:	"Verbesserte ballistische Raketen werden es uns ermöglichen, einen Sprengkopf über größere Entfernungen mit erstaunlicher Genauigkeit und verheerender Wirkung abzufeuern."
sp_rockets_onsite_explosion_generic_reward:	"Explosion vor Ort"
sp_rockets_onsite_explosion_generic_reward_desc:	"Eine schwere Explosion während eines der Tests führte zu erheblichen Schäden an Teilen der Anlage, hat unseren Wissenschaftlern jedoch auch neue Erkenntnisse gebracht"
sp_rockets_generic_major_breakthrough_reward:	"Großer Durchbruch"
sp_rockets_generic_avionics_advancements_reward:	"Fortschritte in der Avionik"
sp_rockets_generic_avionics_advancements_reward_desc:	"Im Rahmen unserer Arbeit haben wir zahlreiche Erkenntnisse im Bereich der allgemeinen Avionik und Aerodynamik gewonnen, die unserer Flugzeugproduktion zugutekommen können."
sp_rockets_experimental_rockets_improved_accuracy_reward:	"Verbesserungen der Genauigkeit"
