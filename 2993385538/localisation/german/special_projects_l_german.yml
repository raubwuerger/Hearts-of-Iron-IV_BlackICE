sp_land_reward_stronghold_network_leadership_approach_desc:	" Im Laufe des Projekts muss [Character.GetName], der leitende Wissenschaftler, entscheiden, inwieweit [Character.GetSheHe] in den täglichen Betrieb eingebunden wird. [Character.GetSheHeCap] kann wählen, ob er die Bauarbeiten direkt vor Ort überwacht, um eine präzise Ausführung sicherzustellen, oder im Büro bleibt und sich auf Strategie und Planung konzentriert."
