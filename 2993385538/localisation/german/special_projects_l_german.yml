sp_rocket_design_choice_reward:	"Reichweite versus Nutzlast?"
sp_rocket_design_choice_reward_desc:	"Bei der Konstruktion unserer Flugbombe sind unsere Ingenieure der Ansicht, dass es wichtig ist, zu entscheiden, was das Hauptziel der Konstruktion der Bombe ist. Wollen wir die Reichweite maximieren, oder ist die Nutzlast das wichtigste Kriterium?"
sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward_desc:	"Unsere Ingenieure haben erhebliche Hürden bei der Konstruktion des Pulsstrahltriebwerks der Rakete überwunden, das für deren Reichweite und Geschwindigkeit entscheidend ist."
sp_rockets_flying_bomb_launch_ramp_innovations_reward:	"Innovationen bei den Abschussrampen"
sp_rockets_flying_bomb_launch_ramp_innovations_reward_desc:	"Unsere Ingenieure haben erhebliche Verbesserungen an den speziellen Abschussrampen vorgenommen, die für den Einsatz der Raketen erforderlich sind."
sp_rockets_flying_bomb_engine_optimization_breakthrough_reward:	"Durchbruch bei der Triebwerksoptimierung"
sp_rockets_flying_bomb_engine_optimization_breakthrough_reward_desc:	"Unseren Ingenieuren ist es gelungen, die Reichweite und Zuverlässigkeit des Pulsstrahltriebwerks erheblich zu verbessern und damit die Einsatzfähigkeit der Rakete zu steigern."
sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward:	"Technologische Innovation bei den Leitsystemen"
sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_desc:	"Während der letzten Prototypenphase wurden erhebliche Verbesserungen hinsichtlich der Genauigkeit und Störfestigkeit des Leitsystems erzielt, wodurch wir unseren technologischen Vorsprung weiter ausgebaut haben."
sp_rockets_ground_control_improvements_reward:	"Verbesserungen der Bodenkontrolle"
sp_rockets_ground_control_improvements_reward_desc:	"[Character.GetName] ist es gelungen, mehrere noch offene Probleme bei der Verfolgung und Steuerung der Rakete vom Boden aus zu lösen. Dies ist ein bedeutender Schritt auf dem Weg zur Bekämpfung hochfliegender feindlicher Flugzeuge."
sp_rockets_high_speed_flight_control_bonus:	"Flugsteuerung bei hoher Geschwindigkeit"
sp_rockets_warhead_detonation_mechanisms_reward:	"Zündmechanismen für Sprengköpfe"
sp_surface_air_missile_warhead_detonation_bonus:	"Boden-Luft-Rakete: Verbesserte Sprengkopfzündung"
sp_rocket_wind_tunnel_choice_reward:	"Ingenieure beantragen Windkanal"
sp_rocket_wind_tunnel_choice_reward_desc:	"Die Ingenieure des ballistischen Raketenprojekts haben den Bau eines Überschallwindkanals beantragt, um maßstabsgetreue Modelle ihrer Entwürfe früher testen zu können. Dies würde ihren Iterationsprozess erheblich beschleunigen und langfristig Ressourcen einsparen."
sp_rocket_wind_tunnel_choice_reward_reject:	"Die Ressourcen werden an anderer Stelle benötigt."
sp_rocket_wind_tunnel_choice_reward_agree:	"Weisen Sie die Ressourcen zu."
sp_rocket_turbo_pump_froth_reward:	"Problem mit Schaumbildung in der Turbopumpe"
sp_rocket_turbo_pump_froth_reward_desc:	"Bei Tests in großer Höhe wurde ein Problem mit der Turbopumpe festgestellt. Es scheint, dass das Schmiermittel im Inneren der Pumpen unter den extremen Bedingungen zu schäumen beginnt, was sich auf die Gesamtleistung und Zuverlässigkeit des aktuellen Entwurfs auswirkt."
sp_rocket_turbo_pump_froth_reward_accept:	"Wir müssen das klären!"
sp_rocket_relay_failure_reward:	"Relaisausfall"
sp_rocket_relay_failure_reward_desc:	"Bei den Vorbereitungen für unseren Teststart wurde ein defektes Relais entdeckt, das für die internen Steuerungssysteme der Rakete verwendet wird. Die Ingenieure sind der Meinung, dass wir das Relais austauschen sollten, bevor wir fortfahren, doch die Bedenken hinsichtlich der politischen Auswirkungen einer Verzögerung nehmen zu."
sp_rocket_relay_failure_reward_accept:	"Lassen Sie diese Relais reparieren."
sp_rocket_outercoating_reward_desc:	"Es wurden Bedenken hinsichtlich der Außenhülle der Rakete geäußert. Bei längerer Lagerung rosten und korrodieren die Materialien häufig. Dies könnte die Rakete unbrauchbar machen, wenn keine Lösung gefunden wird."
sp_rocket_outercoating_reward_accept:	"Vielleicht könnte man ein Schmiermittel auftragen?"
sp_rocket_launch_site_choice_reward_desc:	"Die schiere Größe der neuen Rakete führt zu Einschränkungen am vorgesehenen Startplatz. Die Projektleiter beantragen daher Mittel für den Bau eines neuen, eigens dafür vorgesehenen Standorts an einem anderen Ort."
sp_rocket_launch_site_choice_reward_reject:	"Finden Sie einen Weg, den aktuellen Standort nutzbar zu machen."
sp_rocket_launch_site_choice_reward_accept:	"Wir werden in eine neue Anlage investieren."
sp_air_advanced_avionics:	"Fortschrittliche Avionik"
sp_air_advanced_avionics_desc:	"Durch die Ausstattung unserer Flugzeuge mit Funknavigationsgeräten können wir unseren Piloten helfen, nachts zu ihren Flugplätzen zurückzukehren. Wir können auch eine Anzeige einbauen, um unseren Piloten die Landung bei Nacht mithilfe unserer ILS-Systeme zu erleichtern. "
sp_air_computing_bombsight:	"Fortschrittliches Bombenzielgerät"
sp_air_computing_bombsight_desc:	"Fortschritte in der Computertechnik ermöglichen es uns, ein fortschrittliches Bombenzielgerät für unsere Flugzeuge zu entwickeln, das die Genauigkeit ihrer Angriffe deutlich verbessern wird."
sp_air_anti_air_rocket:	"Luft-Luft-Raketen"
sp_air_guided_bombs_custom_tt:	"Ermöglicht die Entwicklung von Seeaufklärungsflugzeugen unter Verwendung von §YLenkbomben§!."
sp_air_bouncing_bomb:	"Sprungbombe"
sp_air_bouncing_bomb_desc:	"Eine Bombe, die über Wasseroberflächen hüpfen und springen kann, könnte das perfekte Mittel sein, um Staudammverteidigungen zu durchbrechen, und sich auch in anderen Situationen als nützlich erweisen."
sp_air_bouncing_bomb_training_accidents_reward:	"Unfälle beim Training"
sp_air_bouncing_bomb_aircraft_modifications_reward_option:	"Solange es jetzt funktioniert"
sp_air_bouncing_bomb_type_of_explosives_reward_option:	"Das kann sich als nützlich erweisen"
sp_air_earthshaker_bomb:	"Erdbebenbombe"
sp_air_earthshaker_bomb_desc:	"Eine schwere Bombe, die so konstruiert ist, dass sie vor der Detonation in den Boden eindringt und massive strukturelle Schäden am Ziel verursacht. "
sp_air_earthshaker_bomb_completion_tt:	"Schaltet §Y$raid_type_mega_gun_emplacement_strike$§! Überfälle frei"
sp_air_jet_engine:	"Strahltriebwerk"
sp_air_jet_engine_desc:	"Strahltriebwerke sind weitaus leistungsstärker als Propellermotoren, was das Flugzeugdesign revolutionieren und eine neue Ära der Luftfahrttechnik einläuten könnte."
sp_air_motorjet_engine:	"Motorjet-Triebwerk"
sp_air_motorjet_engine_desc:	"Ein Motorjet-Triebwerk ist eine Art Hybridantriebssystem, das Merkmale sowohl eines Kolbenmotors als auch eines Strahltriebwerks vereint."
sp_air_scientist_xp_generic_reward:	"Neue Entdeckungen"
sp_air_scientist_xp_generic_reward_desc:	"Unsere Wissenschaftler haben im Laufe der Arbeit mit dem neuesten Prototyp mehrere neue Entdeckungen gemacht."
sp_air_scientist_xp_generic_reward_option:	"Das ist gut"
sp_air_political_interference_generic_reward:	"Politische Einmischung"
sp_air_political_interference_generic_reward_desc:	"Politiker, die sich in Dinge einmischen, in die sie sich nicht einmischen sollten, haben dazu geführt, dass das Projekt gezwungen war, bereits Erledigtes aus Gründen, die niemandem einleuchten, noch einmal zu machen."
sp_air_political_interference_generic_reward_option:	"Zwei Schritte vorwärts, einen Schritt zurück"
sp_air_generic_major_breakthrough_reward:	"Großer Durchbruch"
sp_air_generic_major_breakthrough_reward_desc:	"Bei der letzten Prototypeniteration ist uns ein großer Durchbruch gelungen."
sp_air_generic_major_breakthrough_reward_option:	"Ausgezeichnet!"
sp_air_generic_aerodynamics_advancements_reward:	"Fortschritte in der Aerodynamik"
sp_air_generic_aerodynamics_advancements_reward_desc:	"Im Rahmen unserer Arbeit haben wir zahlreiche Erkenntnisse im Bereich der allgemeinen Aerodynamik gewonnen, die unserer Flugzeugproduktion zugutekommen können."
sp_air_generic_aerodynamics_advancements_reward_option:	"Gute Nachrichten"
sp_air_generic_reward_scientist_xp_1:	"Wertvolle Erkenntnisse"
sp_air_generic_reward_scientist_xp_2:	"Erweitertes theoretisches Wissen"
sp_air_generic_reward_scientist_xp_3:	"Unbegrenzte Entdeckungen"
sp_air_generic_reward_air_xp_1:	"Frischer Wind"
sp_air_generic_reward_air_xp_2:	"Brise der Innovation"
sp_air_generic_reward_major_progress_2:	"Meisterhafte Landung"
sp_air_generic_reward_major_progress_3:	"Geniestreich"
sp_naval_support_ships:	"Unterstützungsschiffe"
sp_naval_support_ships_desc:	"Unterstützungsschiffe werden dazu beitragen, unsere Überlegenheit auf See zu wahren, indem sie unsere Flotten auch bei längeren Einsätzen einsatzfähig halten."
sp_naval_floating_dock_desc:	"Eine Reihe von Pontons und vorgefertigten Betonkonstruktionen, die über das Wasser transportiert und innerhalb weniger Stunden zusammengebaut werden können, um einen geschützten Landeplatz für die Entladung von Nachschub zu schaffen."
sp_naval_advanced_sub_diesel:	"Fortschrittliche U-Boot-Motoren"
sp_naval_advanced_sub_diesel_desc:	"Durch den Umstieg auf leistungsstärkere Elektromotoren und eine deutlich höhere Batteriekapazität können wir eine völlig neue Generation von U-Booten entwickeln."
sp_naval_modern_submarine:	"Stromlinienförmige U-Boot-Rümpfe"
sp_naval_modern_submarine_desc:	"Die Entwicklung revolutionärer Rumpfformen für U-Boote wird deren Tarnkappeneigenschaften und Schlagkraft deutlich verbessern."
sp_naval_advanced_noise_reduction:	"Geräuschdämpfende Beschichtungen"
sp_naval_advanced_noise_reduction_desc:	"Durch die Entwicklung fortschrittlicher Beschichtungen, die den Geräuschpegel unterdrücken, können wir die Überlebensfähigkeit unserer U-Boote weiter verbessern."
sp_naval_torpedo_magnetic_detonator:	"Magnetischer Zünder"
sp_naval_torpedo_magnetic_detonator_desc:	"Ein neuer Zünder erkennt die Verschiebung des Erdmagnetfelds, wenn der Torpedo unter dem Ziel hindurchfährt. Eine Explosion direkt unter einem Schiff verursacht weitaus größeren Schaden und bricht oft den Kiel des Ziels, wodurch es sofort sinkt."
sp_naval_torpedo_homing:	"Zielsuchtorpedo"
sp_naval_torpedo_electric:	"Elektrischer Torpedo"
sp_naval_torpedo_electric_desc:	"Anstatt eine leicht zu erkennende Blasen-Spur zu hinterlassen, bleibt ein Torpedo mit elektrischem Antrieb praktisch unsichtbar, bis er sein Ziel trifft. Dies bedeutet auch, dass keine Spur zurück zum abschießenden U-Boot führt."
sp_naval_asw_projector:	"Wasserbombenwerfer"
sp_naval_asw_projector_desc:	"Ein Wasserbombenwerfer an Bord des Zerstörers kann eine Sprengladung viel weiter werfen, wodurch das Schiff während des gesamten Angriffs den Sonarkontakt zum U-Boot aufrechterhalten kann und die Treffgenauigkeit drastisch erhöht wird. "
sp_naval_sonar_advanced:	"Fortschrittliche Hydrophone & Sonar"
sp_naval_sonar_advanced_desc:	"Die Kombination aus fortschrittlichen Hydrophonen und Sonar ermöglicht es diesem System, Ziele mit großer Genauigkeit zu erkennen und zu verfolgen."
sp_naval_shell_hardening:	"Fortschrittliche Granatenhärtung"
sp_naval_shell_hardening_desc:	"Die Entwicklung fortschrittlicher metallurgischer Verfahren zur Granatenhärtung wird es uns ermöglichen, die Durchschlagskraft unserer großen Marinegranaten zu erhöhen."
sp_naval_torpedo_cruiser:	"Torpedokreuzer"
sp_naval_carrier_super_desc:	"Eine neue Klasse von Flugzeugträgern, die auf maximale Luftkampfeffizienz ausgelegt ist und die Fähigkeit besitzt, eine große Anzahl von Flugzeugen zu transportieren und einzusetzen. Diese Träger sind wesentlich größer als ihre Vorgänger, was mehr Flugzeuge, schnellere Einsätze und eine größere Einsatzreichweite ermöglicht."
sp_naval_generic_reward_scientist_xp_1:	"Schwimmen in Ideen"
sp_naval_generic_reward_scientist_xp_2:	"Ertrinken in Kreativität"
sp_naval_generic_reward_scientist_xp_3:	"Badewanne – Eureka!"
sp_naval_generic_reward_major_progress_1:	"Großer Durchbruch!"
sp_naval_generic_reward_major_progress_2:	"Großer Erfolg!"
sp_naval_generic_reward_major_progress_3:	"Enorme Fortschritte!"
sp_naval_generic_reward_test_failure_2:	"Nur ein Rückschlag!"
sp_naval_generic_reward_test_failure_3:	"Katastrophale Ergebnisse"
sp_naval_generic_failure_torpedo_accident:	"Torpedoexplosion"
sp_naval_generic_reward_artillery_tech_1:	"Erkenntnisse zur Schiffsartillerie"
sp_naval_generic_reward_artillery_tech_2:	"Innovationen bei Schiffsgeschützen"
sp_naval_generic_reward_artillery_tech_3:	"Einblicke in Schiffsgeschützstellungen"
sp_naval_generic_reward_armor_tech_1:	"Neue Studien zur Panzerung"
sp_naval_generic_reward_armor_tech_2:	"Innovationen bei der Marinepanzerung"
sp_naval_generic_reward_armor_tech_3:	"Zukunftsperspektiven zur Panzerung"
sp_naval_generic_reward_option_armor_tech_bonus_name:	"Experimentelle Forschung zur Marinepanzerung"
sp_naval_generic_reward_option_artillery_tech_bonus_name:	" Experimentelle Forschung zur Marineartillerie"
sp_naval_support_ships_unique_reward_a_desc:	"Zwar ist der Wert von Versorgungsschiffen unbestritten, doch müssen wir entscheiden, worauf ihr operativer Schwerpunkt liegen soll: auf der gezielten Versorgung einer kleinen Anzahl von Schiffen oder auf der allgemeinen Auffüllung der Vorräte der gesamten Flotte."
sp_naval_support_ships_preference_a_a:	"Die Bedürfnisse der Wenigen"
sp_naval_support_ships_preference_b_a:	"Das Gleichgewicht finden"
sp_naval_support_ships_preference_c_a:	"Die Bedürfnisse der Vielen"
sp_naval_support_ships_unique_reward_b:	"Hilfsschiffe – Reparaturmaßnahmen"
sp_naval_support_ships_unique_reward_b_desc:	"Die entscheidende Frage für unsere Organisation der Reparaturschiffe: Entweder eine größere Anzahl kleiner Reparaturmannschaften, die eine große Anzahl von Schiffen langsam warten können, oder eine kleinere Anzahl besser ausgestatteter Mannschaften, die weniger Schiffe dafür aber umfassender reparieren können."
sp_naval_support_ships_preference_a_b:	"Größere Reichweite"
sp_naval_support_ships_preference_c_b:	"Konzentrierte Anstrengungen"
sp_naval_underway_replenishment_unique_reward_a:	"Umfang der Nachschubversorgung"
sp_naval_underway_replenishment_preference_b:	"Geringerer Einsatz von Konvois"
sp_naval_underway_replenishment_preference_c:	"Ein Gleichgewicht finden"
sp_tag_tank:	"Panzerprojekte"
sp_tag_artillery:	"Artillerieprojekte"
sp_tag_army_equipment:	"Armeiausrüstungsprojekte"
sp_tag_torpedo:	"Torpedoprojekte"
sp_tag_asw:	"Projekte zur U-Boot-Bekämpfung"
sp_tag_nuclear_power:	"Projekte zur Kernenergie"
sp_tag_aircraft:	"Flugzeugprojekte"
sp_tag_helicopter:	"Hubschrauberprojekte"
sp_tag_rocket:	"Raketenprojekte"
sp_tag_guided_bomb:	"Lenkbombenprojekte"
scientist_trait_genius:	"Genie"
scientist_trait_genius_desc:	"Ein visionärer Geist, der mit beispielloser Innovationskraft die Grenzen von Wissenschaft und Technik erweitert. Dies ist eine Begabung, die nur einmal in einer Generation auftritt."
scientist_trait_brilliant_theorist:	"Brillanter Theoretiker"
scientist_trait_brilliant_theorist_desc:	"Ein Meister abstrakter Konzepte und Theorien, der in der Lage ist, die Militärstrategie und die wissenschaftliche Forschung zu revolutionieren."
scientist_trait_bright:	"Kluge"
scientist_trait_bright_desc:	"Ein scharfsinniger, schnell denkender Wissenschaftler, der sich durch das Erfassen neuer Konzepte und deren effiziente Anwendung auszeichnet."
scientist_trait_fast_learner:	"Schnell lernend"
scientist_trait_resourceful:	"Einfallsreich"
scientist_trait_resourceful_desc:	"Findet stets kreative Lösungen, selbst wenn die Ressourcen knapp sind oder die Lage aussichtslos erscheint."
scientist_trait_schrodingers_trait_desc:	"Bevor ein Beobachter die Schachtel öffnet, bildet die Wellenfunktion, die diese Eigenschaft beschreibt, eine Überlagerung der Zustände "gut" und "schlecht""
scientist_trait_aircraft_specialist:	"Flugzeugspezialist"
scientist_trait_aircraft_specialist_desc:	"Ein Spezialist für Aerodynamik und Flugzeugkonstruktion, der in der Lage ist, überlegene Flugzeugzellen, Triebwerke und Konstruktionen zu entwickeln, um den Luftraum zu beherrschen."
scientist_trait_rocketry_specialist:	"Raketenspezialist"
scientist_trait_rocketry_specialist_desc:	"Spezialisiert auf Raketentechnologie, mit Schwerpunkt auf den Antriebsprinzipien in Programmen für ballistische und gelenkte Raketen."
scientist_trait_helicopter_expert:	"Hubschrauber-Experte"
scientist_trait_jet_expert_desc:	"Eine Autorität auf dem Gebiet des Strahlantriebs, der die Forschung zu frühen Strahltriebwerken und deren Anwendung in Militärflugzeugen vorantreibt."
scientist_trait_bombs_expert:	"Bomben-Experte"
scientist_trait_guidance_systems_expert_desc:	"Ein Experte für die frühe Entwicklung von Lenktechnologien mit Erfahrung in der Verbesserung von Steuerungssystemen für unbemannte Sprengkörper mit großer Reichweite."
scientist_trait_armored_specialist:	"Panzerspezialist"
scientist_trait_armored_specialist_desc:	"Ein erfahrener Ingenieur, spezialisiert auf die Konstruktion und Verbesserung von Panzern und anderen gepanzerten Fahrzeugen."
scientist_trait_artillery_specialist:	"Artillerie-Spezialist"
scientist_trait_artillery_specialist_desc:	"Ein Spezialist für Artilleriesysteme mit Erfahrung in der Weiterentwicklung von Fernfeuerkraft und großkalibrigen Geschützen."
scientist_trait_army_equipment_specialist:	"Spezialist für Armeeausrüstung"
scientist_trait_army_equipment_specialist_desc:	"Ein Spezialist für verschiedene Spezialausrüstungen der Armee."
scientist_trait_submarine_specialist:	"U-Boot-Spezialist"
scientist_trait_torpedo_specialist_desc:	"Ein Spezialist für Torpedokonstruktion und -technik, der sich auf die Entwicklung fortschrittlicher Torpedotechnologien konzentriert."
scientist_trait_asw_specialist:	"Spezialist für U-Boot-Abwehr"
scientist_trait_asw_specialist_desc:	"Ein Spezialist für U-Boot-Abwehrtechnologie und -Taktik, der sich auf die Entwicklung neuer Methoden zur Erkennung und Bekämpfung von U-Booten konzentriert."
scientist_trait_surface_ship_specialist:	"Spezialist für Überwasserschiffe"
scientist_trait_surface_ship_specialist_desc:	"Spezialisiert auf die Konstruktion, Entwicklung und den Einsatz großer Überwasserkampfschiffe sowie auf die Erforschung neuer Technologien zur Ausrüstung von Militärschiffen."
scientist_trait_nuclear_specialist:	"Nuklearspezialist"
scientist_trait_nuclear_warfare_expert:	"Experte für nukleare Kriegsführung"
scientist_trait_nuclear_power_expert:	"Experte für Kernenergie"
scientist_trait_electronics_specialist:	"Elektronikspezialist"
scientist_trait_electronics_specialist_desc:	"Spezialisiert auf Kommunikations-, Radar- und verwandte Systeme, die für die moderne Kriegsführung unerlässlich sind."
sp_nuclear_project_events.1.t:	"Informationsleck"
sp_nuclear_project_events.1.desc:	"Obwohl es sich um einen reinen Zufall handelt, ist es unseren Agenten in [FROM.GetNameDef] gelungen, Informationen über ein offenbar geheimes Projekt zu beschaffen. Ein an der Entwicklung einer Geheimwaffe, einer Atombombe, beteiligter Arbeiter sprach bei einer kleinen gesellschaftlichen Zusammenkunft, an der auch einer unserer Agenten teilnahm, über seine Arbeit."
