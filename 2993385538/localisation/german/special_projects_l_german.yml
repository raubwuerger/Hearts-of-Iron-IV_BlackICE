sp_nuclear_design_choice_reward:	"Reaktorkonstruktion"
sp_nuclear_design_choice_reward_desc:	"Bei der Konstruktion eines Reaktors müssen wir entscheiden, welches Material wir als Moderator verwenden. Dies bestimmt die Konstruktion des gesamten Reaktors. Wir können Schwerwasser oder Graphit verwenden, wobei beide ihre Vor- und Nachteile haben..."
