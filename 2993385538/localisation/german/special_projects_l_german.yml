sp_nuclear_bomb_test_prototype_reward_keep_bomb:	"Wir können dies gegen unsere Feinde einsetzen"
sp_nuclear_bomb_espionage_threats_reward_desc:	" Sicherheitsbeauftragte argumentieren, dass die Sicherheit am Standort des Projekts ¨[SpecialProject.GetName] und bei allen damit verbundenen Aktivitäten erhöht werden muss. Die Forscher unter der Leitung von [Character.GetName] argumentieren, dass Bewegungs- und Kommunikationsfreiheit für den Fortschritt unerlässlich sind."
sp_nuclear_bomb_espionage_threats_reward_no:	"Erhöhen Sie die Sicherheit nicht"
sp_nuclear_bomb_espionage_threats_reward_increase_security:	"Sicherheit erhöhen"
