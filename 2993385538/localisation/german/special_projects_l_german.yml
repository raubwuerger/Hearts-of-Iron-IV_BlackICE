sp_nuclear_reactor_desc:	"Experimente haben bewiesen, dass bei der Spaltung von Atomen durch Kernspaltung riesige Mengen an Energie freigesetzt werden, die zur Stromerzeugung genutzt werden könnten. Oder vielleicht als Treibstoff für Bomben..."
