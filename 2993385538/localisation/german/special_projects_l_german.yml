sp_commercial_nuclear_reactor_concerns_reward:	"Bedenken hinsichtlich der nuklearen Sicherheit"
sp_commercial_nuclear_reactor_concerns_reward_desc:	"[Character.GetName] hat Bedenken hinsichtlich fehlender Filter in den Kühltürmen unserer neuen Reaktoren geäußert. [Character.GetSheHeCap] besteht darauf, dass Filter eingebaut werden müssen, um zu verhindern, dass im Notfall Strahlung aus dem Reaktor entweicht. Die Ingenieure argumentieren unterdessen, dass dies das Projekt erheblich verzögern würde."
