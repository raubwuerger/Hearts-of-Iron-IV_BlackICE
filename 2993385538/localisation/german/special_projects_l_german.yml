JAP_sp_nuclear_bomb:	"Jin-Projekt"
sp_nuclear_bomb_desc:	"Eine Bombe, die den Prozess der Kernspaltung nutzt, um die gespeicherte Energie des Atoms in einem apokalyptischen Moment freizusetzen. Wer würde es mit einer solchen Waffe in unserem Arsenal wagen, sich uns zu widersetzen?"
sp_nuclear_bomb_tt:	"Kernreaktoren beginnen mit der Produktion von §YNuklearbomben§!."
sp_nuclear_design_choice_reward:	"Reaktordesign"
sp_nuclear_design_choice_reward_desc:	"Bei der Konstruktion eines Reaktors müssen wir entscheiden, welches Material wir für den Moderator verwenden wollen. Davon hängt das Design des gesamten Reaktors ab. Wir können Schweres Wasser oder Graphit verwenden, die beide ihre Vor- und Nachteile haben..."
sp_nuclear_design_choice_reward_graphite:	"Gereinigter Graphit ist der bessere Moderator"
sp_nuclear_design_choice_reward_heavy_water:	"Schweres Wasser wird billiger sein"
sp_nuclear_major_breakthrough_reward:	"Großer Durchbruch bei Kernreaktionen"
sp_nuclear_major_breakthrough_reward_desc:	"Ein kontrolliertes Experiment mit einem Teil unseres begrenzten Nuklearmaterials hat die Machbarkeit des von uns geplanten Designs bewiesen. Dies hat das Projekt mit neuem Enthusiasmus vorangetrieben."
sp_nuclear_isotope_separation_choice_reward:	"Einrichtungen zur Isotopentrennung"
sp_nuclear_isotope_separation_choice_reward_desc:	"Um unsere Reaktoren mit Kernbrennstoff versorgen zu können, müssen wir uns für ein Verfahren entscheiden, mit dem wir die nützlichen Uranisotope vom Rest trennen können. Es gibt eine Reihe von Vorschlägen für Trennanlagen, aber die beiden Spitzenreiter sind die Gas- und die Zentrifugaltechnik."
sp_nuclear_isotope_separation_choice_reward_gaseous:	"Gasförmig ist eine bewährte Technik."
sp_nuclear_isotope_separation_choice_reward_centrifugal:	"Zentrifugen werden auf lange Sicht effizienter sein."
sp_nuclear_scientist_xp_generic_reward:	"Neue Erkenntnisse"
sp_nuclear_generic_industry_tech_reward:	"Technologische Fortschritte"
sp_nuclear_generic_industry_tech_reward_desc:	"Während der Arbeit an diesem Projekt haben unsere Ingenieure mehrere neue Erfindungen gemacht, die sehr wahrscheinlich auch in anderen Bereichen eingesetzt werden könnten."
sp_nuclear_generic_reward_option_industry_tech_name:	"Fortschrittliche industrielle Forschung"
sp_nuclear_scientist_xp_generic_reward_desc:	"TODO_TA"
sp_nuclear_minor_progress_generic_reward:	"Kleiner Durchbruch"
sp_nuclear_minor_progress_generic_reward_desc:	"Unsere Wissenschaftler haben bei der Arbeit an dem neuesten Prototyp einige wirklich bahnbrechende Entdeckungen gemacht. Ihre Erkenntnisse haben unser Wissen und unsere Forschung auf diesem Gebiet erheblich vorangebracht."
sp_nuclear_generic_electronics_tech_reward:	"Technologische Innovation"
sp_nuclear_generic_electronics_tech_reward_desc:	"Bei der letzten Iteration des Projekts haben wir wichtige Erkenntnisse gewonnen. Wir hoffen, dass wir diese in die Praxis umsetzen können, um die Forschung in verwandten Bereichen zu beschleunigen."
sp_nuclear_generic_reward_option_electronics_tech_bonus_name:	"Fortschrittliche Elektronikforschung. "
sp_nuclear_war_support_generic_reward:	"Öffentliche Unterstützung"
sp_nuclear_war_support_generic_reward_desc:	"Ein erfolgreicher Test und die damit verbundene, streng kontrollierte Berichterstattung in den Medien haben dazu geführt, dass die Öffentlichkeit versteht, dass wir der Entwicklung einer Art Superwaffe, mit der alle Feinde besiegt werden können, näher gekommen sind. "
sp_nuclear_major_political_interference_generic_reward:	"Große politische Einmischung"
sp_nuclear_major_political_interference_generic_reward_desc:	"Das Projekt [SpecialProject.GetName] wurde von der politischen Führung verstärkt unter die Lupe genommen, was zu Verzögerungen führte und möglicherweise Änderungen in der Projektleitung erzwang. Dies hat [Character.GetName] wütend gemacht. Wir müssen uns mit diesen politischen Herausforderungen auseinandersetzen, um das Projekt auf Kurs zu halten"
sp_nuclear_major_political_interference_generic_reward_option_keep:	"Behalten Sie [Character.GetName]"
sp_nuclear_major_political_interference_generic_reward_option_fire:	"Entfernen Sie [Character.GetName]"
sp_nuclear_bomb_theoretical_breakthrough_generic_reward:	"Theoretischer Durchbruch"
sp_nuclear_bomb_theoretical_breakthrough_generic_reward_desc:	"[Character.GetName] ist es gelungen, während der Arbeit mit dem neuesten Prototyp ein komplexes theoretisches Problem zu lösen. Dies hat zu einer Verschlankung des Bombendesigns geführt, wodurch die Herstellung weniger schwierig wird."
sp_nuclear_bomb_critical_mass_generic_reward:	"Experiment zur kritischen Masse geht schief"
sp_nuclear_bomb_critical_mass_generic_reward_desc:	"Bei Experimenten zur Bestimmung der kritischen Masse kam es zu einem kritischen Unfall, der zu einer Strahlenbelastung und zu Opfern unter dem Schlüsselpersonal führte."
sp_nuclear_bomb_information_leak_reward:	"Informationsleck"
sp_nuclear_bomb_information_leak_reward_desc:	"Einer der Mitarbeiter der [SpecialProject.GetName] hat offenbar Informationen an ausländische Agenten weitergegeben. Ob dies absichtlich geschah oder nicht, ist bisher nicht bekannt. Es ist auch schwer zu sagen, welchen Schaden dies dem Projekt zugefügt hat."
sp_nuclear_bomb_information_leak_reward_tt:	"Gewinnt Projektfortschritt"
sp_nuclear_reactor_radioactive_leak_stabilized_reward:	"Radioaktives Leck - unter Kontrolle"
sp_nuclear_reactor_radioactive_leak_stabilized_reward_desc:	"Leider kam es bei den Arbeiten am Reaktor zu einem schweren Zwischenfall. Dank der schnellen Reaktion der Mitarbeiter konnte der Schaden eingedämmt werden und das Team konnte wertvolle Daten aus dem Vorfall gewinnen."
sp_nuclear_reactor_minor_explosion_reward:	"Leichte Explosion, keine Verletzten"
sp_nuclear_reactor_minor_explosion_reward_desc:	"Bei der Arbeit an der neuesten Version des Kernreaktor-Prototyps kam es zu einem kleinen Zwischenfall. Es kam zu einer kleineren Explosion, bei der Teile des Labors beschädigt wurden, aber das Feuer, das daraufhin entstand, konnte leicht gelöscht werden. Sobald das Labor repariert ist, sollte die Arbeit wie geplant fortgesetzt werden können, mit nur einer kleinen Verzögerung."
sp_nuclear_reactor_tested_reward:	"Erster erfolgreicher Kernreaktortest"
sp_nuclear_reactor_tested_reward_desc:	"Unser erster Kernreaktor ist erfolgreich getestet worden und hat die Machbarkeit der kontrollierten Kernspaltung bewiesen. Dieser Durchbruch verspricht eine neue Ära der Energieerzeugung und möglicherweise noch viel mehr."
sp_nuclear_reactor_tested_reward_public:	"Feiern Sie die Errungenschaft öffentlich"
nuclear_reactor_tested_reward_classify:	"Halten Sie die Informationen vorerst geheim"
sp_nuclear_reactor_tested_reward_public_tt:	"Andere Länder könnten davon profitieren"
sp_nuclear_reactor_tested_tech_bonus:	"Erhaltene Informationen über Atomtests"
sp_commercial_nuclear_reactor_concerns_reward:	"Bedenken über nukleare Sicherheit"
sp_commercial_nuclear_reactor_concerns_reward_desc:	"[Character.GetName] hat Bedenken über das Fehlen von Filtern in den Kühltürmen unserer neuen Reaktoren geäußert. [Character.GetSheHeCap] besteht darauf, dass Filter eingebaut werden müssen, um zu verhindern, dass bei einem Notfall Strahlung aus dem Reaktor austritt. Die Ingenieure argumentieren unterdessen, dass sie das Projekt erheblich verzögern werden."
sp_commercial_nuclear_reactor_concerns_reward_option_safety:	"Fügen Sie die Filter hinzu."
sp_commercial_nuclear_reactor_concerns_reward_option_ignore:	"Völliger Wahnsinn!"
sp_nuclear_bomb_test_prototype_reward:	"Prototyp-Bombe"
sp_nuclear_bomb_test_prototype_reward_desc:	"Das Team von [Character.GetName] hat eine Prototyp-Bombe hergestellt. Ein erfolgreicher Test und dessen Auswertung würde uns erheblich voranbringen. Andererseits haben wir jetzt eine Atombombe..."
sp_nuclear_bomb_test_prototype_reward_test_bomb:	"Testen Sie sie unter kontrollierten Formen"
sp_nuclear_bomb_test_prototype_reward_keep_bomb:	"Wir können sie gegen unsere Feinde einsetzen"
sp_nuclear_bomb_espionage_threats_reward:	"Spionage-Bedrohungen"
sp_nuclear_bomb_espionage_threats_reward_desc:	"Die Sicherheitsbeamten argumentieren, dass die Sicherheit am Standort des ¨[SpecialProject.GetName]-Projekts und aller damit verbundenen Aktivitäten erhöht werden muss. Die Forscher, mit [Character.GetName] an der Spitze, argumentieren, dass die Freiheit, sich zu bewegen und zu kommunizieren, für den Fortschritt unerlässlich ist."
sp_nuclear_bomb_espionage_threats_reward_no:	"Erhöhen Sie die Sicherheit nicht"
sp_nuclear_bomb_espionage_threats_reward_increase_security:	"Erhöhen Sie die Sicherheit"
sp_nuclear_bomb_espionage_threats_reward_increase_security_tt:	"Erhöhte Sicherheit senkt das Risiko eines Informationsdiebstahls"
sp_nuclear_bomb_breakthrough_plutonium_reward:	"Durchbruch bei der Plutoniumproduktion"
sp_nuclear_bomb_breakthrough_plutonium_reward_desc:	"Unsere Wissenschaftler haben einen bedeutenden Durchbruch in der Plutoniumproduktion erzielt, der die Effizienz der Bombenproduktion erhöht. Dies kann hoffentlich den Zeitplan für die Entwicklung beschleunigen."
sp_nuclear_bomb_accident_generic_reward:	"Versehentliches Feuer"
sp_nuclear_bomb_accident_generic_reward_desc:	"In einem der Lagerhäuser der Anlage ist ein Feuer ausgebrochen. Erste Untersuchungen deuten darauf hin, dass es sich um einen Unfall handelt. Aber war es das wirklich?"
sp_nuclear_bomb_design_choice_reward:	"Einfacher oder komplexer Bombenentwurf"
sp_nuclear_bomb_design_choice_reward_desc:	"Es gibt zwei Entwürfe für eine Atomwaffe, die von unseren Wissenschaftlern verfolgt werden, und es ist eine Debatte darüber entbrannt, wie mit ihnen verfahren werden soll. Der eine Entwurf, die so genannte Kanonenbombe, ist viel einfacher zu bauen, aber auch weniger effizient in der Nutzung des Kernmaterials. Die andere ist die Implosionsbombe, ein wesentlich anspruchsvolleres Design, aber theoretisch effizienter in der Verwendung von Kernmaterial."
sp_nuclear_bomb_design_choice_reward_gun_type:	"Die Waffe ist die sicherere Variante."
sp_nuclear_bomb_design_choice_reward_implosion:	"Die Implosion ist die bessere Konstruktion."
sp_electronics_radar_early:	"Frühes Radar"
sp_electronics_radar_early_desc:	"Durch die Verwendung von gepulsten Radiowellen und die Erkennung ihrer Reflexionen werden wir in der Lage sein, feindliche Bewegungen zu Lande, in der Luft und zur See zu überwachen."
sp_electronics_radar_decimetric:	"Dezimetrisches Radar"
sp_electronics_radar_decimetric_desc:	"Die Entwicklung eines verbesserten Radars, das mit dezimetrischen Wellenlängen arbeitet, wird eine größere Reichweite und Entdeckung ermöglichen."
sp_electronics_radar_centimetric:	"Zentimetrisches Radar"
sp_electronics_radar_centimetric_desc:	"Die Entwicklung eines zentimetrischen Radars wird die Erkennung viel kleinerer Ziele und den Einsatz viel kleinerer Antennen ermöglichen. "
sp_electronics_aa_proximity_fuze:	"AA-Näherungszünder"
sp_electronics_aa_proximity_fuze_desc:	"Mit einer verbesserten und zuverlässigeren Funktechnologie können wir eine neue Art von Zündern entwickeln, die schon in der Nähe des Ziels explodieren und es beschädigen würden."
USA_sp_electronics_aa_proximity_fuze:	"AA VT-Zünder"
ENG_sp_electronics_aa_proximity_fuze:	"AA VT-Zünder"
sp_electronics_artillery_proximity_fuze:	"Artillerie-Näherungszünder"
sp_electronics_artillery_proximity_fuze_desc:	"Durch die Anpassung unseres bestehenden Annäherungszünders an Artilleriegranaten können diese explodieren, bevor sie auf den Boden treffen, was ihre Wirkung verstärkt."
USA_sp_electronics_artillery_proximity_fuze:	"Artillerie VT-Zünder"
ENG_sp_electronics_artillery_proximity_fuze:	"Artillerie VT Zünder "
sp_electronics_computing_machine:	"Rechenmaschine"
sp_electronics_computing_machine_desc:	"Die Entwicklung einer theoretischen Grundlage für moderne Computer und die Konstruktion elektromechanischer Maschinen, um sie in die Praxis umzusetzen, sind die ersten Schritte in dieses Reich der Möglichkeiten. "
sp_electronics_advanced_computing_machine:	"Fortgeschrittene Rechenmaschine"
sp_electronics_advanced_computing_machine_desc:	"Weitere Verfeinerungen des Computers vereinfachen die Verarbeitung größerer Datenmengen."
sp_electronics_generic_reward_scientist_xp_1:	"Wertvolle Einsichten"
sp_electronics_generic_reward_scientist_xp_2:	"Erweitertes theoretisches Wissen"
sp_electronics_generic_reward_scientist_xp_3:	"Grenzenlose Entdeckungen"
sp_electronics_generic_reward_major_progress_1:	"Schockierender Fortschritt"
sp_electronics_generic_reward_major_progress_2:	"Innovation"
sp_electronics_generic_reward_major_progress_3:	"Geniestreich"
sp_electronics_generic_reward_test_failure_1:	"Design-Fehler"
sp_electronics_generic_reward_test_failure_2:	"Durchgebrannte Zünder"
sp_electronics_generic_reward_test_failure_3:	"Kreative Katastrophe"
sp_rockets_flying_bomb_pulsejet:	"Fliegende Bombe"
sp_rockets_flying_bomb_pulsejet_desc:	"Ein unbemanntes Flugzeug mit einem Raketentriebwerk und einer beträchtlichen Nutzlast sollte in der Lage sein, den Feind in Angst und Schrecken zu versetzen und ihn zu demoralisieren."
GER_sp_rockets_flying_bomb_pulsejet:	"Das V1-Projekt"
GER_sp_rockets_flying_bomb_pulsejet_desc:	"Vergeltungswaffe 1. Eine raketengetriebene fliegende Bombe, die unsere Feinde aus der Ferne treffen und ihre Kriegsindustrie zerstören kann, ohne dass dafür ausgebildete Piloten benötigt werden."
sp_rockets_early_ballistic_missile:	"Ballistische Rakete"
sp_rockets_early_ballistic_missile_desc:	"Eine gelenkte ballistische Rakete, die in der Lage ist, einen Sprengkopf aus großer Entfernung mit beispielloser Geschwindigkeit und Genauigkeit abzuschießen."
GER_sp_rockets_early_ballistic_missile:	"Das V2-Projekt"
GER_sp_rockets_early_ballistic_missile_desc:	"Vergeltungswaffe 2. Eine gelenkte ballistische Rakete, die einen Sprengkopf aus großer Entfernung mit beispielloser Geschwindigkeit und Genauigkeit abfeuern kann."
sp_rockets_improved_ballistic_missile:	"Verbesserte ballistische Raketen"
sp_rockets_improved_ballistic_missile_desc:	"Verbesserte ballistische Raketen werden uns in die Lage versetzen, einen Sprengkopf mit erstaunlicher Genauigkeit und verheerender Wirkung über eine größere Entfernung zu befördern."
sp_rockets_scientist_xp_generic_reward:	"Neue Erkenntnisse"
sp_rockets_scientist_xp_generic_reward_desc:	"Unsere Wissenschaftler haben im Laufe der Arbeit mit dem neuesten Prototyp mehrere neue Erkenntnisse gewonnen"
sp_rockets_political_interference_generic_reward:	"Politische Einmischung"
sp_rockets_political_interference_generic_reward_desc:	"Die Einmischung von Politikern in Angelegenheiten, die sie nicht hätten tun sollen, hat dazu geführt, dass das Projekt gezwungen war, Dinge zu wiederholen, die bereits erledigt waren, und zwar aus Gründen, die für niemanden einen Sinn ergeben."
sp_rockets_onsite_explosion_generic_reward:	"Explosion vor Ort"
sp_rockets_onsite_explosion_generic_reward_desc:	"Eine große Explosion während eines der Tests führte zu schweren Schäden an Teilen der Anlage, hat aber auch zu neuen Erkenntnissen für unsere Wissenschaftler geführt"
sp_rockets_generic_major_breakthrough_reward:	"Großer Durchbruch"
sp_rockets_generic_major_breakthrough_reward_desc:	"Während der letzten Iteration des Prototyps ist uns ein wichtiger Durchbruch gelungen."
sp_rockets_generic_avionics_advancements_reward:	"Fortschritte in der Avionik"
sp_rockets_generic_avionics_advancements_reward_desc:	"Während unserer Arbeit haben wir viele Erkenntnisse im Bereich der allgemeinen Avionik und Aerodynamik gewonnen, die unserer Flugzeugproduktion zugute kommen können."
sp_rockets_experimental_rockets_improved_accuracy_reward:	"Verbesserungen der Genauigkeit"
sp_rockets_experimental_rockets_stability_improvements_reward:	"Verbesserte Flugstabilität der Rakete"
sp_rocket_design_choice_reward:	"Reichweite versus Nutzlast?"
sp_rocket_design_choice_reward_desc:	"Bei der Entwicklung unserer fliegenden Bombe ist es nach Ansicht unserer Ingenieure wichtig zu entscheiden, was das Hauptziel der Konstruktion der Bombe ist. Wollen wir die Reichweite maximieren, oder ist die Nutzlast das Wichtigste."
sp_rocket_design_choice_reward_balanced:	"Ausgewogen"
sp_rocket_design_choice_reward_range:	"Reichweite"
sp_rocket_design_choice_reward_payload:	"Nutzlast"
sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward:	"Technischer Durchbruch bei der Entwicklung des Impulsstrahls"
sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward_desc:	"Unsere Ingenieure haben erhebliche Hürden bei der Entwicklung des Impulsstrahltriebwerks der Rakete überwunden, das für ihre Reichweite und Geschwindigkeit entscheidend ist."
sp_rockets_flying_bomb_launch_ramp_innovations_reward:	"Innovationen bei der Startrampe"
sp_rockets_flying_bomb_launch_ramp_innovations_reward_desc:	"Unsere Ingenieure haben die speziellen Startrampen, die für den Einsatz der Raketen erforderlich sind, erheblich verbessert."
sp_rockets_flying_bomb_launch_ramp_innovations_reward_option:	"Gute Nachrichten"
sp_rockets_flying_bomb_mass_production_scaling_reward:	"Skalierung der Massenproduktion"
sp_rockets_flying_bomb_mass_production_scaling_reward_desc:	"Es ist uns gelungen, Verbesserungen in der Produktion zu erzielen, die es uns ermöglichen, die Massenproduktion viel schneller zu steigern."
sp_rockets_flying_bomb_engine_optimization_breakthrough_reward:	"Durchbruch bei der Triebwerksoptimierung"
sp_rockets_flying_bomb_engine_optimization_breakthrough_reward_desc:	"Unseren Ingenieuren ist es gelungen, die Reichweite und Zuverlässigkeit des Impulsstrahls erheblich zu verbessern und damit die Einsatzfähigkeit der Rakete zu erhöhen."
sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward:	"Technologische Innovation bei den Lenksystemen"
sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_desc:	"Während der letzten Prototyping-Runde wurden erhebliche Verbesserungen an der Genauigkeit und Störfestigkeit des Lenksystems vorgenommen, was unseren technologischen Vorsprung vergrößert."
sp_rockets_flying_bomb_test_flight_failures_reward:	"Misserfolge bei Testflügen"
sp_rockets_flying_bomb_test_flight_failures_reward_desc:	"Bei frühen Testflügen kam es zu Ausfällen aufgrund von Fehlfunktionen des Leitsystems und strukturellen Schwächen. Unsere Wissenschaftler haben viel daraus gelernt, aber wir müssen einen Schritt zurücktreten und neu nachdenken."
sp_rockets_ground_control_improvements_reward:	"Verbesserungen bei der Bodenkontrolle"
sp_rockets_ground_control_improvements_reward_desc:	"[Character.GetName] ist es gelungen, mehrere noch offene Probleme mit der Fähigkeit, die Rakete vom Boden aus zu verfolgen und zu steuern, zu lösen. Dies ist ein wichtiger Schritt auf dem Weg, feindliche hochfliegende Flugzeuge ins Visier zu nehmen."
sp_rockets_vertical_launch_reward:	"Vertikales Startsystem"
sp_rockets_vertical_launch_reward_desc:	"Nach einigen gescheiterten Versuchen ist es [Character.GetName] endlich gelungen, die Probleme mit dem vertikalen Start dieser Raketen zu lösen. Das neue System sollte es ermöglichen, dass die Raketen ohne Probleme gestartet werden können und ohne Verzögerung große Höhen erreichen."
sp_rockets_high_speed_flight_control_reward:	"Hochgeschwindigkeits-Flugsteuerung"
sp_rockets_high_speed_flight_control_reward_desc:	"Wir haben es endlich geschafft, ein funktionierendes Kontrollsystem zu entwickeln, das bei hohen Geschwindigkeiten funktioniert und auf die sich ändernde Flugdynamik reagieren kann. Dieses Wissen kann sicherlich auch in anderen Bereichen von Nutzen sein."
sp_rockets_high_speed_flight_control_bonus:	"Hochgeschwindigkeits-Flugsteuerungen"
sp_rockets_warhead_detonation_mechanisms_reward:	"Sprengkopf-Detonationsmechanismen"
sp_rockets_warhead_detonation_mechanisms_reward_desc:	"Ein wichtiger Teil der gesamten Entwicklung besteht darin, die Waffe an der richtigen Stelle explodieren zu lassen. Es scheint, dass [Character.GetName] es geschafft hat, eine Lösung zu finden, die es uns ermöglicht, den Sprengkopf zu einem möglichst günstigen Zeitpunkt zu zünden."
sp_surface_air_missile_warhead_detonation_bonus:	"Boden-Luft-Rakete: Verbesserte Detonation des Sprengkopfes"
sp_rocket_wind_tunnel_choice_reward:	"Ingenieure fordern Windkanal an"
sp_rocket_wind_tunnel_choice_reward_desc:	"Die Ingenieure des ballistischen Raketenprojekts haben den Bau eines Überschallwindkanals beantragt, um die Modelle ihrer Entwürfe früher testen zu können. Dies würde ihren Iterationsprozess beschleunigen und langfristig Ressourcen sparen."
sp_rocket_wind_tunnel_choice_reward_reject:	"Die Ressourcen werden anderswo benötigt."
sp_rocket_wind_tunnel_choice_reward_agree:	"Weisen Sie die Ressourcen zu."
sp_rocket_turbo_pump_froth_reward:	"Problem mit dem Aufschäumen der Turbopumpe"
sp_rocket_turbo_pump_froth_reward_desc:	"Während der Tests in großer Höhe wurde ein Problem mit der Turbopumpe festgestellt. Es scheint, dass das Schmiermittel in den Pumpen unter den anstrengenden Bedingungen zu schäumen beginnt, was die Gesamtleistung und Zuverlässigkeit der aktuellen Konstruktion beeinträchtigt."
sp_rocket_turbo_pump_froth_reward_accept:	"Wir müssen das herausfinden!"
sp_rocket_relay_failure_reward:	"Defektes Relais"
sp_rocket_relay_failure_reward_desc:	"Bei den Vorbereitungen für unseren Teststart wurde ein defektes Relais entdeckt, das für die internen Kontrollsysteme der Rakete verwendet wird. Die Ingenieure sind der Meinung, dass wir das Relais ersetzen sollten, bevor wir weitermachen, aber die Bedenken über die politischen Auswirkungen einer Verzögerung nehmen zu."
sp_rocket_relay_failure_reward_accept:	"Lassen Sie die Relais reparieren."
sp_rocket_relay_failure_reward_reject:	"Wir können nicht länger warten."
sp_rocket_outercoating_reward:	"Rost in der Rakete"
sp_rocket_outercoating_reward_desc:	"Es wurden Bedenken hinsichtlich der Außenhülle der Rakete geäußert. Wenn sie über einen längeren Zeitraum stehen gelassen wird, rosten und korrodieren die Materialien häufig. Dies könnte dazu führen, dass die Rakete nicht mehr funktionsfähig ist, wenn keine Lösung gefunden wird."
sp_rocket_outercoating_reward_accept:	"Vielleicht könnte ein Schmiermittel verwendet werden?"
sp_rocket_launch_site_choice_reward:	"Probleme mit dem Startplatz"
sp_rocket_launch_site_choice_reward_desc:	"Die schiere Größe der neuen Rakete führt zu Engpässen am geplanten Startplatz. Die Projektleiter beantragen daher die Finanzierung eines neuen, speziell angefertigten Standorts, der an einem anderen Ort errichtet werden soll."
sp_rocket_launch_site_choice_reward_reject:	"Finden Sie einen Weg, den derzeitigen Standort zu nutzen."
sp_rocket_launch_site_choice_reward_accept:	"Wir werden in eine neue Anlage investieren."
sp_air_advanced_avionics:	"Fortschrittliche Avionik"
sp_air_advanced_avionics_desc:	"Indem wir unsere Flugzeuge mit Funknavigationsgeräten ausstatten, können wir unseren Piloten helfen, bei Nacht zu ihren Flugplätzen zurückzukehren. Wir können auch einen Indikator einbauen, der unseren Piloten die Landung bei Nacht mit unseren ILS-Systemen erleichtert."
sp_air_computing_bombsight:	"Fortschrittliches Bombenzielgerät"
sp_air_computing_bombsight_desc:	"Die Fortschritte in der Computertechnik ermöglichen es uns, ein fortschrittliches Bombenzielgerät für unsere Flugzeuge zu entwickeln, das die Genauigkeit ihrer Angriffe deutlich verbessert."
sp_air_anti_air_rocket:	"Luft-Luft-Raketen"
sp_air_anti_air_rocket_desc:	"Die Entwicklung von Einzelschuss-Luft-Luft-Raketen ermöglicht es uns, die Feuerkraft unserer Kampfflugzeuge zu erhöhen."
GER_sp_air_anti_air_rocket:	"R4M-Raketen"
sp_air_anti_air_rocket_custom_tt:	"Ermöglicht die Aufrüstung von §YLuft-Luft-Raketen§! für Jäger, Abfangjäger und Mehrzweckflugzeuge."
sp_air_guided_bombs:	"Gelenkte Bomben"
sp_air_guided_bombs_desc:	"Experimentelle Waffen, die die Genauigkeit von Luftangriffen verbessern sollen. Im Gegensatz zu herkömmlichen Bomben, die blind abgeworfen werden, sind diese Bomben mit Leitsystemen wie z.B. einer Funksteuerung ausgestattet, die es ermöglichen, sie auf bestimmte Ziele zu lenken."
sp_air_guided_bombs_custom_tt:	"Ermöglicht die Entwicklung von Marine-Patrouillenflugzeugen mit §YGuided Bombs§!."
sp_air_bouncing_bomb:	"Abprallende Bombe"
sp_air_bouncing_bomb_desc:	"Eine Bombe, die über Wasseroberflächen hüpft und abprallt, könnte das perfekte Werkzeug sein, um Dammverteidigungen zu durchbrechen, und könnte sich auch in anderen Situationen als nützlich erweisen."
sp_air_bouncing_bomb_completion_tt:	"Schaltet §Y$raid_type_dam_bombing_raid$§! frei. "
sp_air_bouncing_bomb_backspin_mechanism_reward:	"Backspin-Mechanismus"
sp_air_bouncing_bomb_backspin_mechanism_reward_desc:	"Unsere Wissenschaftler haben eine geniale Lösung gefunden, um die Bombe nach dem Abwurf zu stabilisieren. Der Mechanismus löst einen Backspin aus, der die Bombe auf dem Weg zum Ziel hält. "
sp_air_bouncing_bomb_backspin_mechanism_reward_option:	"Großartig"
sp_air_bouncing_bomb_training_accidents_reward:	"Trainingsunfälle"
sp_air_bouncing_bomb_training_accidents_reward_desc:	"Leider haben wir einige Flugzeuge verloren, als wir Anflüge in niedriger Höhe versucht haben. Wir müssen die Sicherheitsvorkehrungen und das Trainingsprogramm intensivieren. "
sp_air_bouncing_bomb_training_accidents_reward_option:	"Das ist sehr bedauerlich."
sp_air_bouncing_bomb_aircraft_modifications_reward:	"Modifikationen am Flugzeug"
sp_air_bouncing_bomb_aircraft_modifications_reward_desc:	"Während des letzten Testlaufs ist es uns endlich gelungen, herauszufinden, welche Modifikationen an der Flugzeugzelle erforderlich sind, damit der Auslösemechanismus richtig eingebaut werden kann. "
sp_air_bouncing_bomb_aircraft_modifications_reward_option:	"Solange es jetzt funktioniert"
sp_air_bouncing_bomb_type_of_explosives_reward:	"Art des Sprengstoffs"
sp_air_bouncing_bomb_type_of_explosives_reward_desc:	"Durch die Verwendung von Torpex anstelle von TNT können wir die Größe der Bombe erheblich reduzieren, ohne dass die Sprengkraft beeinträchtigt wird. "
sp_air_bouncing_bomb_type_of_explosives_reward_option:	"Dies kann sich als nützlich erweisen"
sp_air_earthshaker_bomb:	"Earthshaker-Bombe"
sp_air_earthshaker_bomb_desc:	"Eine schwere Bombe, die so konstruiert ist, dass sie den Boden durchdringt, bevor sie detoniert, und dabei massive strukturelle Schäden am Ziel verursacht."
sp_air_earthshaker_bomb_completion_tt:	"Schaltet §Y$raid_type_mega_gun_emplacement_strike$§! Kommandounternehmen frei"
sp_air_jet_engine:	"Strahltriebwerk"
sp_air_jet_engine_desc:	"Düsentriebwerke sind weitaus leistungsfähiger als Propellertriebwerke und haben das Potenzial, die Flugzeugkonstruktion zu revolutionieren und eine neue Ära der Luftfahrttechnik einzuleiten."
sp_air_motorjet_engine:	"Motorstrahltriebwerk"
sp_air_motorjet_engine_desc:	"Ein Motorstrahltriebwerk ist ein hybrides Antriebssystem, das die Eigenschaften von Kolben- und Düsentriebwerken kombiniert."
sp_air_scientist_xp_generic_reward:	"Neue Entdeckungen"
sp_air_scientist_xp_generic_reward_desc:	"Unsere Wissenschaftler haben im Laufe der Arbeit mit dem neuesten Prototyp mehrere neue Entdeckungen gemacht."
sp_air_scientist_xp_generic_reward_option:	"Das ist gut"
sp_air_political_interference_generic_reward:	"Politische Einmischung"
sp_air_political_interference_generic_reward_desc:	"Die Einmischung von Politikern in Angelegenheiten, die sie nicht hätten tun sollen, hat dazu geführt, dass das Projekt aus Gründen, die niemandem einleuchten, gezwungen wurde, Dinge zu wiederholen, die bereits erledigt waren."
sp_air_political_interference_generic_reward_option:	"Zwei Schritte vorwärts, ein Schritt zurück"
sp_air_generic_major_breakthrough_reward:	"Großer Durchbruch"
sp_air_generic_major_breakthrough_reward_desc:	"Während der letzten Iteration des Prototyps ist uns ein großer Durchbruch gelungen."
sp_air_generic_major_breakthrough_reward_option:	"Ausgezeichnet!"
sp_air_generic_aerodynamics_advancements_reward:	"Fortschritte bei der Aerodynamik"
sp_air_generic_aerodynamics_advancements_reward_desc:	"Während unserer Arbeit haben wir viele Erkenntnisse auf dem Gebiet der allgemeinen Aerodynamik gewonnen, die unserer Flugzeugproduktion zugute kommen können."
sp_air_generic_aerodynamics_advancements_reward_option:	"Gute Nachrichten "
sp_air_generic_discoveries_reward:	"Neue verwandte Erkenntnisse"
sp_air_generic_discoveries_reward_desc:	"Im Laufe unserer Arbeit sind unsere Forscher auf eine Reihe von Ideen gekommen, die sich in anderen Situationen als nützlich erweisen könnten."
sp_air_generic_discoveries_reward_option:	"Interessant"
sp_air_generic_reward_scientist_xp_1:	"Wertvolle Einsichten"
sp_air_generic_reward_scientist_xp_2:	"Erweitertes theoretisches Wissen"
