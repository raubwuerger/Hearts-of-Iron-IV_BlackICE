sp_naval_underway_replenishment:	"Nachschub für unterwegs"
sp_naval_underway_replenishment_desc:	"Die Versorgung von Flotten, die weit von ihren Heimatbasen entfernt sind, war schon immer ein limitierender Faktor. Da unsere Flotten auf extremen Entfernungen operieren, müssen wir neue Methoden für die Nachschubversorgung entwickeln."
sp_naval_floating_dock:	"Schwimmende Häfen"
sp_naval_floating_dock_desc:	"Eine Reihe von Pontons und vorgefertigten Betonstrukturen, die über das Wasser bewegt und innerhalb weniger Stunden zusammengebaut werden können, um einen geschützten Landeplatz zum Entladen von Nachschub zu schaffen."
sp_naval_advanced_sub_diesel:	"Fortschrittliche U-Boot-Motoren"
sp_naval_advanced_sub_diesel_desc:	"Durch die Umstellung auf leistungsfähigere Elektromotoren und eine viel höhere Batteriekapazität können wir eine völlig neue Generation von U-Booten entwickeln."
sp_naval_modern_submarine:	"Stromlinienförmige U-Boot-Rümpfe"
sp_naval_modern_submarine_desc:	"Die Entwicklung revolutionärer Hüllenformen für U-Boote wird deren Tarnfähigkeit und Tödlichkeit deutlich erhöhen."
sp_naval_advanced_noise_reduction:	"Lärmreduzierende Beschichtungen"
sp_naval_advanced_noise_reduction_desc:	"Durch die Entwicklung fortschrittlicher Beschichtungen, die den Lärmpegel unterdrücken, können wir die Überlebensfähigkeit unserer U-Boote weiter verbessern."
sp_naval_torpedo_magnetic_detonator:	"Magnetische Sprengkapsel"
sp_naval_torpedo_magnetic_detonator_desc:	"Ein neuer Zünder erkennt die Verschiebung des Erdmagnetfeldes, wenn der Torpedo unter dem Ziel vorbeifährt. Eine Explosion direkt unter einem Schiff verursacht viel mehr Schaden und bricht oft den Kiel des Ziels, so dass es sofort sinkt."
sp_naval_torpedo_homing:	"Zielsuchender Torpedo"
sp_naval_torpedo_homing_desc:	"Ausgestattet mit einem Akustikdetektor kann der Torpedo die größte Geräuschquelle vor ihm anpeilen - normalerweise das Ziel."
sp_naval_torpedo_electric:	"Elektrischer Torpedo"
sp_naval_torpedo_electric_desc:	"Anstatt eine leicht zu entdeckende Spur von Luftblasen zu hinterlassen, bleibt ein Torpedo mit einem elektrischen Antrieb praktisch unsichtbar, bis er einschlägt. Das bedeutet auch, dass es keine Spur gibt, die zum abschießenden U-Boot zurückführt."
sp_naval_asw_projector:	"Wasserbomben-Mörser"
sp_naval_asw_projector_desc:	"Ein Mörser an Bord des Zerstörers kann eine Sprengladung viel weiter werfen. Dadurch kann das Schiff während des gesamten Angriffs den Sonarkontakt mit dem U-Boot aufrechterhalten und seine Genauigkeit drastisch erhöhen."
sp_naval_sonar_advanced:	"Fortgeschrittenes Hydrophon und Sonar"
sp_naval_sonar_advanced_desc:	"Die Kombination aus fortschrittlichen Hydrophonen und Sonar ermöglicht es diesem System, Ziele mit großer Genauigkeit zu erkennen und zu verfolgen."
sp_naval_shell_hardening:	"Fortschrittliche Geschosshärtung"
sp_naval_shell_hardening_desc:	"Die Entwicklung fortschrittlicher metallurgischer Techniken zur Härtung von Geschossen wird es uns ermöglichen, die Durchschlagskraft unserer großen Marinegeschosse zu erhöhen.  "
sp_naval_torpedo_cruiser:	"Torpedokreuzer"
sp_naval_torpedo_cruiser_desc:	"Wir können den wichtigsten und teuersten Schiffen unserer Feinde erheblichen Schaden zufügen, indem wir einen Kreuzer entwickeln, der auf Torpedo-Kriegsführung ausgelegt ist. "
sp_naval_carrier_super:	"Große Flugzeugträger"
sp_naval_carrier_super_desc:	"Eine neue Klasse von Flugzeugträgern, die auf maximale Effektivität im Luftkampf ausgelegt sind und eine große Anzahl von Flugzeugen tragen und einsetzen können. Diese Flugzeugträger sind viel größer als ihre Vorgänger und ermöglichen mehr Flugzeuge, schnellere Operationen und eine größere Reichweite."
