sp_nuclear_bomb_desc:	"Eine Bombe, die den Prozess der Kernspaltung nutzt, um die gespeicherte Energie des Atoms in einem apokalyptischen Moment freizusetzen. Wer würde es mit einer solchen Waffe in unserem Arsenal wagen, sich uns zu widersetzen?"
sp_nuclear_major_breakthrough_reward:	"Großer Durchbruch bei Kernreaktionen"
sp_nuclear_major_breakthrough_reward_desc:	"Ein kontrolliertes Experiment mit einem Teil unseres begrenzten Nuklearmaterials hat die Machbarkeit des von uns geplanten Designs bewiesen. Dies hat das Projekt mit neuem Enthusiasmus vorangetrieben."
sp_nuclear_isotope_separation_choice_reward:	"Einrichtungen zur Isotopentrennung"
sp_nuclear_scientist_xp_generic_reward:	"Neue Erkenntnisse"
sp_nuclear_generic_industry_tech_reward:	"Technologische Fortschritte"
sp_nuclear_scientist_xp_generic_reward_desc:	"TODO_TA"
sp_nuclear_minor_progress_generic_reward:	"Kleiner Durchbruch"
sp_nuclear_war_support_generic_reward:	"Öffentliche Unterstützung"
sp_nuclear_war_support_generic_reward_desc:	"Ein erfolgreicher Test und die damit verbundene, streng kontrollierte Berichterstattung in den Medien haben dazu geführt, dass die Öffentlichkeit versteht, dass wir der Entwicklung einer Art Superwaffe, mit der alle Feinde besiegt werden können, näher gekommen sind. "
sp_nuclear_major_political_interference_generic_reward_desc:	"Das Projekt [SpecialProject.GetName] wurde von der politischen Führung verstärkt unter die Lupe genommen, was zu Verzögerungen führte und möglicherweise Änderungen in der Projektleitung erzwang. Dies hat [Character.GetName] wütend gemacht. Wir müssen uns mit diesen politischen Herausforderungen auseinandersetzen, um das Projekt auf Kurs zu halten"
sp_nuclear_major_political_interference_generic_reward_option_keep:	"Behalten Sie [Character.GetName]"
sp_nuclear_major_political_interference_generic_reward_option_fire:	"Entfernen Sie [Character.GetName]"
sp_nuclear_bomb_theoretical_breakthrough_generic_reward:	"Theoretischer Durchbruch"
sp_nuclear_bomb_theoretical_breakthrough_generic_reward_desc:	"[Character.GetName] ist es gelungen, während der Arbeit mit dem neuesten Prototyp ein komplexes theoretisches Problem zu lösen. Dies hat zu einer Verschlankung des Bombendesigns geführt, wodurch die Herstellung weniger schwierig wird."
sp_nuclear_bomb_critical_mass_generic_reward:	"Experiment zur kritischen Masse geht schief"
sp_nuclear_bomb_critical_mass_generic_reward_desc:	"Bei Experimenten zur Bestimmung der kritischen Masse kam es zu einem kritischen Unfall, der zu einer Strahlenbelastung und zu Opfern unter dem Schlüsselpersonal führte."
sp_nuclear_bomb_information_leak_reward:	"Informationsleck"
sp_nuclear_reactor_radioactive_leak_stabilized_reward_desc:	"Leider kam es bei den Arbeiten am Reaktor zu einem schweren Zwischenfall. Dank der schnellen Reaktion der Mitarbeiter konnte der Schaden eingedämmt werden und das Team konnte wertvolle Daten aus dem Vorfall gewinnen."
sp_nuclear_reactor_minor_explosion_reward:	"Leichte Explosion, keine Verletzten"
sp_nuclear_reactor_minor_explosion_reward_desc:	"Bei der Arbeit an der neuesten Version des Kernreaktor-Prototyps kam es zu einem kleinen Zwischenfall. Es kam zu einer kleineren Explosion, bei der Teile des Labors beschädigt wurden, aber das Feuer, das daraufhin entstand, konnte leicht gelöscht werden. Sobald das Labor repariert ist, sollte die Arbeit wie geplant fortgesetzt werden können, mit nur einer kleinen Verzögerung."
sp_nuclear_reactor_tested_reward:	"Erster erfolgreicher Kernreaktortest"
sp_nuclear_reactor_tested_reward_desc:	"Unser erster Kernreaktor ist erfolgreich getestet worden und hat die Machbarkeit der kontrollierten Kernspaltung bewiesen. Dieser Durchbruch verspricht eine neue Ära der Energieerzeugung und möglicherweise noch viel mehr."
sp_nuclear_reactor_tested_reward_public:	"Feiern Sie die Errungenschaft öffentlich"
nuclear_reactor_tested_reward_classify:	"Halten Sie die Informationen vorerst geheim"
sp_nuclear_reactor_tested_reward_public_tt:	"Andere Länder könnten davon profitieren"
sp_nuclear_bomb_espionage_threats_reward:	"Spionage-Bedrohungen"
sp_nuclear_bomb_breakthrough_plutonium_reward:	"Durchbruch bei der Plutoniumproduktion"
sp_nuclear_bomb_accident_generic_reward_desc:	"In einem der Lagerhäuser der Anlage ist ein Feuer ausgebrochen. Erste Untersuchungen deuten darauf hin, dass es sich um einen Unfall handelt. Aber war es das wirklich?"
sp_nuclear_bomb_design_choice_reward:	"Einfacher oder komplexer Bombenentwurf"
sp_nuclear_bomb_design_choice_reward_desc:	"Es gibt zwei Entwürfe für eine Atomwaffe, die von unseren Wissenschaftlern verfolgt werden, und es ist eine Debatte darüber entbrannt, wie mit ihnen verfahren werden soll. Der eine Entwurf, die so genannte Kanonenbombe, ist viel einfacher zu bauen, aber auch weniger effizient in der Nutzung des Kernmaterials. Die andere ist die Implosionsbombe, ein wesentlich anspruchsvolleres Design, aber theoretisch effizienter in der Verwendung von Kernmaterial."
sp_nuclear_bomb_design_choice_reward_gun_type:	"Die Waffe ist die sicherere Variante."
sp_nuclear_bomb_design_choice_reward_implosion:	"Die Implosion ist die bessere Konstruktion."
sp_electronics_radar_early:	"Frühes Radar"
sp_electronics_radar_early_desc:	"Durch die Verwendung von gepulsten Radiowellen und die Erkennung ihrer Reflexionen werden wir in der Lage sein, feindliche Bewegungen zu Lande, in der Luft und zur See zu überwachen."
sp_electronics_radar_decimetric:	"Dezimetrisches Radar"
sp_electronics_radar_decimetric_desc:	"Die Entwicklung eines verbesserten Radars, das mit dezimetrischen Wellenlängen arbeitet, wird eine größere Reichweite und Entdeckung ermöglichen."
sp_electronics_radar_centimetric:	"Zentimetrisches Radar"
sp_electronics_radar_centimetric_desc:	"Die Entwicklung eines zentimetrischen Radars wird die Erkennung viel kleinerer Ziele und den Einsatz viel kleinerer Antennen ermöglichen. "
ENG_sp_electronics_aa_proximity_fuze:	"AA VT-Zünder"
sp_electronics_artillery_proximity_fuze:	"Artillerie-Näherungszünder"
sp_electronics_artillery_proximity_fuze_desc:	"Durch die Anpassung unseres bestehenden Annäherungszünders an Artilleriegranaten können diese explodieren, bevor sie auf den Boden treffen, was ihre Wirkung verstärkt."
sp_electronics_plastics_iii:	"$plastics_iii$"
sp_electronics_plastics_iii_desc:	"$plastics_iii_desc$"
sp_electronics_generic_reward_scientist_xp_1:	"Wertvolle Einsichten"
sp_electronics_generic_reward_scientist_xp_2:	"Erweitertes theoretisches Wissen"
sp_electronics_generic_reward_scientist_xp_3:	"Grenzenlose Entdeckungen"
sp_electronics_generic_reward_major_progress_1:	"Schockierender Fortschritt"
sp_electronics_generic_reward_major_progress_2:	"Innovation"
sp_electronics_generic_reward_test_failure_1:	"Design-Fehler"
sp_electronics_generic_reward_test_failure_2:	"Durchgebrannte Zünder"
sp_electronics_generic_reward_test_failure_3:	"Kreative Katastrophe"
GER_sp_rockets_flying_bomb_pulsejet:	"Das V1-Projekt"
GER_sp_rockets_flying_bomb_pulsejet_desc:	"Vergeltungswaffe 1. Eine raketengetriebene fliegende Bombe, die unsere Feinde aus der Ferne treffen und ihre Kriegsindustrie zerstören kann, ohne dass dafür ausgebildete Piloten benötigt werden."
GER_sp_rockets_early_ballistic_missile_desc:	"Vergeltungswaffe 2. Eine gelenkte ballistische Rakete, die einen Sprengkopf aus großer Entfernung mit beispielloser Geschwindigkeit und Genauigkeit abfeuern kann."
sp_rockets_improved_ballistic_missile:	"Verbesserte ballistische Raketen"
sp_rockets_scientist_xp_generic_reward:	"Neue Erkenntnisse"
sp_rockets_scientist_xp_generic_reward_desc:	"Unsere Wissenschaftler haben im Laufe der Arbeit mit dem neuesten Prototyp mehrere neue Erkenntnisse gewonnen"
sp_rockets_political_interference_generic_reward:	"Politische Einmischung"
sp_rockets_political_interference_generic_reward_desc:	"Die Einmischung von Politikern in Angelegenheiten, die sie nicht hätten tun sollen, hat dazu geführt, dass das Projekt gezwungen war, Dinge zu wiederholen, die bereits erledigt waren, und zwar aus Gründen, die für niemanden einen Sinn ergeben."
sp_rockets_generic_major_breakthrough_reward_desc:	"Während der letzten Iteration des Prototyps ist uns ein wichtiger Durchbruch gelungen."
sp_rocket_design_choice_reward_balanced:	"Ausgewogen"
sp_rocket_design_choice_reward_range:	"Reichweite"
sp_rocket_design_choice_reward_payload:	"Nutzlast"
sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward:	"Technischer Durchbruch bei der Entwicklung des Impulsstrahls"
sp_rockets_flying_bomb_launch_ramp_innovations_reward_option:	"Gute Nachrichten"
sp_rockets_flying_bomb_mass_production_scaling_reward:	"Skalierung der Massenproduktion"
sp_rockets_flying_bomb_mass_production_scaling_reward_desc:	"Es ist uns gelungen, Verbesserungen in der Produktion zu erzielen, die es uns ermöglichen, die Massenproduktion viel schneller zu steigern."
sp_rockets_flying_bomb_test_flight_failures_reward:	"Misserfolge bei Testflügen"
sp_rockets_flying_bomb_test_flight_failures_reward_desc:	"Bei frühen Testflügen kam es zu Ausfällen aufgrund von Fehlfunktionen des Leitsystems und strukturellen Schwächen. Unsere Wissenschaftler haben viel daraus gelernt, aber wir müssen einen Schritt zurücktreten und neu nachdenken."
sp_rockets_vertical_launch_reward:	"Vertikales Startsystem"
sp_rockets_vertical_launch_reward_desc:	"Nach einigen gescheiterten Versuchen ist es [Character.GetName] endlich gelungen, die Probleme mit dem vertikalen Start dieser Raketen zu lösen. Das neue System sollte es ermöglichen, dass die Raketen ohne Probleme gestartet werden können und ohne Verzögerung große Höhen erreichen."
sp_rockets_high_speed_flight_control_reward:	"Hochgeschwindigkeits-Flugsteuerung"
sp_rockets_high_speed_flight_control_reward_desc:	"Wir haben es endlich geschafft, ein funktionierendes Kontrollsystem zu entwickeln, das bei hohen Geschwindigkeiten funktioniert und auf die sich ändernde Flugdynamik reagieren kann. Dieses Wissen kann sicherlich auch in anderen Bereichen von Nutzen sein."
sp_rockets_warhead_detonation_mechanisms_reward_desc:	"Ein wichtiger Teil der gesamten Entwicklung besteht darin, die Waffe an der richtigen Stelle explodieren zu lassen. Es scheint, dass [Character.GetName] es geschafft hat, eine Lösung zu finden, die es uns ermöglicht, den Sprengkopf zu einem möglichst günstigen Zeitpunkt zu zünden."
sp_rocket_relay_failure_reward_reject:	"Wir können nicht länger warten."
sp_rocket_outercoating_reward:	"Rost in der Rakete"
sp_rocket_launch_site_choice_reward:	"Probleme mit dem Startplatz"
sp_air_anti_air_rocket_desc:	"Die Entwicklung von Einzelschuss-Luft-Luft-Raketen ermöglicht es uns, die Feuerkraft unserer Kampfflugzeuge zu erhöhen."
GER_sp_air_anti_air_rocket:	"R4M-Raketen"
sp_air_anti_air_rocket_custom_tt:	"Ermöglicht die Aufrüstung von §YLuft-Luft-Raketen§! für Jäger, Abfangjäger und Mehrzweckflugzeuge."
sp_air_guided_bombs:	"Gelenkte Bomben"
sp_air_guided_bombs_desc:	"Experimentelle Waffen, die die Genauigkeit von Luftangriffen verbessern sollen. Im Gegensatz zu herkömmlichen Bomben, die blind abgeworfen werden, sind diese Bomben mit Leitsystemen wie z.B. einer Funksteuerung ausgestattet, die es ermöglichen, sie auf bestimmte Ziele zu lenken."
sp_air_bouncing_bomb_completion_tt:	"Schaltet §Y$raid_type_dam_bombing_raid$§! frei. "
sp_air_bouncing_bomb_backspin_mechanism_reward:	"Backspin-Mechanismus"
sp_air_bouncing_bomb_backspin_mechanism_reward_desc:	"Unsere Wissenschaftler haben eine geniale Lösung gefunden, um die Bombe nach dem Abwurf zu stabilisieren. Der Mechanismus löst einen Backspin aus, der die Bombe auf dem Weg zum Ziel hält. "
sp_air_bouncing_bomb_backspin_mechanism_reward_option:	"Großartig"
sp_air_bouncing_bomb_training_accidents_reward_desc:	"Leider haben wir einige Flugzeuge verloren, als wir Anflüge in niedriger Höhe versucht haben. Wir müssen die Sicherheitsvorkehrungen und das Trainingsprogramm intensivieren. "
sp_air_bouncing_bomb_training_accidents_reward_option:	"Das ist sehr bedauerlich."
sp_air_bouncing_bomb_aircraft_modifications_reward:	"Modifikationen am Flugzeug"
sp_air_bouncing_bomb_aircraft_modifications_reward_desc:	"Während des letzten Testlaufs ist es uns endlich gelungen, herauszufinden, welche Modifikationen an der Flugzeugzelle erforderlich sind, damit der Auslösemechanismus richtig eingebaut werden kann. "
sp_air_bouncing_bomb_type_of_explosives_reward:	"Art des Sprengstoffs"
sp_air_bouncing_bomb_type_of_explosives_reward_desc:	"Durch die Verwendung von Torpex anstelle von TNT können wir die Größe der Bombe erheblich reduzieren, ohne dass die Sprengkraft beeinträchtigt wird. "
sp_air_generic_discoveries_reward:	"Neue verwandte Erkenntnisse"
sp_air_generic_discoveries_reward_desc:	"Im Laufe unserer Arbeit sind unsere Forscher auf eine Reihe von Ideen gekommen, die sich in anderen Situationen als nützlich erweisen könnten."
sp_air_generic_discoveries_reward_option:	"Interessant"
sp_air_generic_reward_air_xp_3:	"Winde des Wandels"
sp_air_generic_reward_major_progress_1:	"Projekt Start"
sp_air_generic_reward_test_failure_1:	"Experiment ist gescheitert"
sp_air_generic_reward_test_failure_2:	"Explodierende Bombe"
sp_air_generic_reward_test_failure_3:	"Kreative Katastrophe"
sp_naval_underway_replenishment:	"Nachschub für unterwegs"
sp_naval_underway_replenishment_desc:	"Die Versorgung von Flotten, die weit von ihren Heimatbasen entfernt sind, war schon immer ein limitierender Faktor. Da unsere Flotten auf extremen Entfernungen operieren, müssen wir neue Methoden für die Nachschubversorgung entwickeln."
sp_naval_floating_dock:	"Schwimmende Häfen"
sp_naval_torpedo_homing_desc:	"Ausgestattet mit einem Akustikdetektor kann der Torpedo die größte Geräuschquelle vor ihm anpeilen - normalerweise das Ziel."
sp_naval_torpedo_cruiser_desc:	"Wir können den wichtigsten und teuersten Schiffen unserer Feinde erheblichen Schaden zufügen, indem wir einen Kreuzer entwickeln, der auf Torpedo-Kriegsführung ausgelegt ist. "
sp_naval_carrier_super:	"Große Flugzeugträger"
sp_naval_generic_reward_navy_xp_1:	"Veränderung im Fluss der Ideen"
sp_naval_generic_reward_navy_xp_2:	"Welle der Ideen"
sp_naval_generic_reward_navy_xp_3:	"Tsunami von Innovationen!"
sp_naval_generic_reward_test_failure_1:	"Projektverzögerung!"
sp_naval_support_ships_unique_reward_a:	"Hilfsschiffe – Schwerpunkt der Unterstützung"
sp_naval_support_ships_preference_b_b:	"Das richtige Gleichgewicht finden"
sp_naval_underway_replenishment_unique_reward_a_desc:	"Während wir noch daran arbeiten, das System der Nachschubversorgung auf See so reibungslos wie möglich zu gestalten, müssen wir eine weitere Entscheidung treffen – wollen wir unsere ursprünglichen Schätzungen ändern oder nicht?"
sp_naval_underway_replenishment_preference_a:	"Größere Reichweite"
