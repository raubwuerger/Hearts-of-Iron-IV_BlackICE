sp_nuclear_bomb_breakthrough_plutonium_reward_desc:	"Unsere Wissenschaftler haben einen bedeutenden Durchbruch bei den Plutoniumproduktionstechniken erzielt und damit die Effizienz der Bombenproduktion gesteigert. Dies kann hoffentlich den Entwicklungszeitplan beschleunigen."
