sp_land_night_vision:	"Frühe Nachtsichtgeräte"
sp_land_night_vision_desc:	"Den Feind sehen zu können, ohne selbst gesehen zu werden, ist der Schlüssel zu Nachteinsätzen. Mit der Erfindung der Infrarottechnologie können wir unsere Armee mit Geräten ausstatten, die dies ermöglichen, obwohl sie unhandlich sind."
sp_land_night_vision_improved_desc:	"Frühe Infrarot-Zielfernrohre, die ursprünglich für Scharfschützen gedacht waren, hatten eine begrenzte Sichtweite. Da sich sowohl die Tragbarkeit als auch die Sicht verbessert haben, können diese Geräte von mehr Truppen bei Nacht eingesetzt werden."
sp_land_recovery_tanks_desc:	"Gepanzerte Pionier- und Bergungsfahrzeuge sind spezialisierte Militärmaschinen, die Kampfhandlungen unterstützen, indem sie wichtige Aufgaben wie das Räumen von Hindernissen, die Befestigung von Stellungen und die Bergung beschädigter oder stillgelegter Fahrzeuge übernehmen."
