sp_land_stronghold_network:	"Festungsnetzwerk"
sp_land_stronghold_network_desc:	"Ein komplexes Netzwerk von stark befestigten Bunkern und Stützpunkten, das gebaut wurde, um intensiven Angriffen standzuhalten und kritische strategische Orte vor feindlichen Übergriffen zu schützen."
sp_land_reward_stronghold_network_structural_weakness_discovered:	"Strukturelle Schwachstelle entdeckt"
sp_land_reward_stronghold_network_delayed_by_concrete_shortage:	"Verzögert durch Betonmangel"
sp_land_reward_stronghold_network_underground_rail_systems:	"Unterirdische Schienensysteme"
sp_land_reward_stronghold_network_integration_of_anti_blast_doors:	"Integration von Anti-Blast-Türen"
sp_land_reward_stronghold_network_communication_system_overhaul:	"Überholung des Kommunikationssystems"
sp_land_reward_stronghold_network_communication_system_overhaul_desc:	"Beim Testen des internen Kommunikationsnetzes des Testkomplexes stellte das Team Ineffizienzen fest, die zur Verbesserung ähnlicher Systeme in traditionellen Festungskonstruktionen genutzt werden konnten."
sp_land_reward_option_stronghold_network_communication_system_overhaul_standardize:	"Standardisieren"
sp_land_reward_option_stronghold_network_communication_system_overhaul_further_study:	"Weitere Studie"
sp_land_reward_stronghold_network_leadership_approach:	"Ansatz für die Führung"
sp_land_reward_stronghold_network_leadership_approach_desc:	"Während das Projekt voranschreitet, muss [Character.GetName], der leitende Wissenschaftler, entscheiden, wie stark [Character.GetSheHe] in den täglichen Betrieb eingebunden werden soll. [Character.GetSheHeCap] kann entscheiden, ob er die Bauarbeiten direkt vor Ort beaufsichtigt und für eine präzise Ausführung sorgt oder ob er im Büro bleibt und sich auf Strategie und Planung konzentriert."
sp_land_reward_option_stronghold_network_leadership_approach_oversee_work_personally:	"Arbeit persönlich beaufsichtigen"
sp_land_reward_option_stronghold_network_leadership_approach_office_planning:	"Planung im Büro"
sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01:	"Durchbruch bei der Betonbewehrung"
sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01_desc:	"Einer der Nachwuchsingenieure hat eine neue Bewehrungsmethode entdeckt, die bei Standardbefestigungen angewendet werden könnte. Wenn wir diese Entdeckung jetzt dokumentieren, könnten unsere Wissenschaftler und Ingenieure in der zukünftigen Forschung einen Vorteil haben."
sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_apply_and_document_discovery:	"Entdeckung anwenden und dokumentieren"
sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_use_in_current_project:	"Verwendung im aktuellen Projekt"
sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02:	"$sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01$"
sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02_desc:	"Eine neue Bewehrungsmethode, die von einem der Junior-Ingenieure entdeckt wurde, wurde an ein externes Forschungsteam zur weiteren Bewertung weitergeleitet. Obwohl die Ergebnisse noch geprüft werden, kann die Technik, wenn sie für geeignet befunden wird, auf das aktuelle Projekt angewendet werden."
sp_land_reward_option_stronghold_network_collapse_01:	"Einsturz beim Tunnelbau"
sp_land_reward_option_stronghold_network_collapse_01_desc:	"Ein Tunnel unter einem der Hauptbunker ist unerwartet eingestürzt und hat mehrere Arbeiter und den leitenden Wissenschaftler, [Character.GetName], der die Arbeiten beaufsichtigte, unter den Trümmern eingeschlossen. Es müssen Notfallmaßnahmen ergriffen werden, um die Eingeschlossenen zu retten, aber der Vorfall hat bereits zu einer Verzögerung des Gesamtfortschritts geführt."
sp_land_reward_option_stronghold_network_collapse_01_prioritize_scientist:	"Priorisieren Sie unseren leitenden Wissenschaftler"
sp_land_reward_option_stronghold_network_collapse_01_prioritize_safety:	"Priorisieren Sie die Sicherheit der Arbeiter"
sp_land_reward_option_stronghold_network_collapse_01_continue_without_delay:	"Ohne Verzögerung fortfahren"
sp_land_reward_option_stronghold_network_collapse_02:	"$sp_land_reward_option_stronghold_network_collapse_01$"
sp_land_reward_option_stronghold_network_collapse_02_desc:	"Ein Tunnel unter einem der Hauptbunker ist unerwartet eingestürzt, wodurch mehrere Arbeiter eingeschlossen wurden und die Bauarbeiten zum Stillstand kamen. Es müssen Notfallmaßnahmen ergriffen werden, um die Situation in den Griff zu bekommen und die Eingeschlossenen sicher herauszuholen, aber der Vorfall hat bereits zu einer Verzögerung des Gesamtfortschritts geführt."
