sp_land_improved_handheld_at:	"Fortgeschrittene tragbare Panzerabwehrwaffen"
sp_land_improved_handheld_at_desc:	"Es kann eine Technologie entwickelt und getestet werden, die die Entwicklung einer neuen Generation von Panzerabwehrwaffen für die Infanterie ermöglicht."
sp_land_assault_rifle:	"Sturmgewehr"
sp_land_assault_rifle_desc:	"Sturmgewehre kombinieren die Kraft von Gewehren, die Kompaktheit von Karabinern und die Feuerrate von Maschinenpistolen und sind daher ein guter Allrounder für Infanterieeinheiten."
sp_land_commando_team:	"Kommando-Teams"
sp_land_commando_team_desc:	"Eine spezialisierte, hochqualifizierte Einheit, die für schnelle, aggressive und oft unkonventionelle Operationen hinter den feindlichen Linien konzipiert ist."
sp_land_night_vision:	"Frühe Nachtsichtgeräte"
sp_land_night_vision_desc:	"Den Feind sehen zu können, ohne selbst gesehen zu werden, ist der Schlüssel zu Nachteinsätzen. Mit der Erfindung der Infrarottechnologie können wir unsere Armee mit Geräten ausstatten, die dies ermöglichen, obwohl sie unhandlich sind."
sp_land_night_vision_improved:	"Verbesserte Nachtsichtgeräte"
sp_land_night_vision_improved_desc:	"Frühe Infrarot-Zielfernrohre, die ursprünglich für Scharfschützen gedacht waren, hatten eine begrenzte Sichtweite. Da sich sowohl die Tragbarkeit als auch die Sicht verbessert haben, können diese Geräte von mehr Truppen bei Nacht eingesetzt werden."
sp_land_engineers_bridges:	"Tragbare Brücken und Sturmboote"
sp_land_engineers_bridges_desc:	"Die Entwicklung von Ponton-Brücken und Sturmbooten wird es unseren Truppen ermöglichen, Flüsse leichter zu überqueren."
sp_land_tank_recon:	"Gepanzerte Aufklärung"
sp_land_tank_recon_desc:	"Entwicklung und Modifizierung verschiedener Typen von leichten Panzern für den Einsatz in Aufklärungskompanien."
sp_land_recovery_tanks:	"Gepanzerte Bergefahrzeuge"
sp_land_recovery_tanks_desc:	"Gepanzerte Pionier- und Bergungsfahrzeuge sind spezialisierte Militärmaschinen, die Kampfhandlungen unterstützen, indem sie wichtige Aufgaben wie das Räumen von Hindernissen, die Befestigung von Stellungen und die Bergung beschädigter oder stillgelegter Fahrzeuge übernehmen."
sp_land_amphibious_mechanized:	"Amphibische Traktoren"
sp_land_amphibious_mechanized_desc:	"Amphibische Zugmaschinen, auch Amtracs genannt, ermöglichen es Marines, unter gepanzertem Schutz an einem Strand zu landen."
sp_land_amphibious_mechanized_usa:	"Amphibische Zugmaschinen"
sp_land_amphibious_mechanized_usa_desc:	"Amphibische Traktoren oder Amtracs ermöglichen es Marines, unter gepanzertem Schutz an einem Strand zu landen."
sp_land_multi_charge_large_caliber_gun:	"Großkalibrige Kanone mit Mehrfachaufladung"
sp_land_multi_charge_large_caliber_gun_desc:	"Mit ihrem Multi-Charge-Antriebssystem und ihrem großen Kaliber ist diese Waffe in der Lage, verheerende Bombardierungen über große Entfernungen hinweg durchzuführen."
