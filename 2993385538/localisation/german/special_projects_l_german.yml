sp_nuclear_bomb_desc:	"Eine Bombe, die den Prozess der Kernspaltung nutzt, um die gespeicherte Energie des Atoms in einem apokalyptischen Moment freizusetzen. Wer würde es mit einer solchen Waffe in unserem Arsenal wagen, sich uns zu widersetzen?"

