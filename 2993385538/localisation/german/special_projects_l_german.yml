sp_land_reward_option_stronghold_network_collapse_01_desc:	"Ein Tunnel unter einem der Hauptbunker ist unerwartet eingestürzt und hat mehrere Arbeiter sowie den leitenden Wissenschaftler, [Character.GetName], der die Arbeiten beaufsichtigte, unter den Trümmern eingeschlossen. Es müssen Sofortmaßnahmen ergriffen werden, um das eingeschlossene Personal zu retten, doch der Vorfall hat bereits zu einer Verzögerung des Gesamtfortschritts geführt. "
