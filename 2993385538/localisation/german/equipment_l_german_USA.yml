uniqueheavy_fighter:0	"Schwere Jäger"
bell_yfm1_equipment_desc:0	"Einheitstyp: Schwerer Jäger" \n\n Die Bell FYM-1 Airacuda war ein schwerer Jäger mit einem kühnen Design als mobile Flugabwehrplattform. Das Flugzeug verfügte über zwei nach vorne feuernde 37-mm-M4-Kanonen, die jeweils von einem Schützen bedient wurden, sowie über zwei .30-M1919- und zwei .50-M2-Browning-Maschinengewehre. Die Besatzung bestand aus fünf Mann: einem Piloten, einem Copiloten/Navigator, einem Funker/Schützen und zwei Schützen. Obwohl als Abfangjäger konzipiert, war das Flugzeug jedoch schwerer und langsamer als die meisten Bomber und nicht wendig genug, um sich auf Luftkämpfe mit feindlichen Jagdflugzeugen einzulassen."
bell_yfm1_equipment_1:0	"Bell FM-1 Airacuda"
tech_bell_yfm1_equipment_1:0	"Bell YFM-1"
lockheed_p38_equipment:0	"P-38 Heavy Fighter"
lockheed_p38_equipment_1_short:0	"P-38 Heavy Fighter"
lockheed_p38_equipment_1_desc:0	"Einheitstyp: Schwerer Jäger \n\n Die Lockheed P-38 Lightning war ein einsitziger Kolbenmotor-Jäger mit dem Spitznamen "Der Gabelschwanz-Teufel". Das Flugzeug wurde als Allzweckjäger konzipiert, kam jedoch in verschiedenen Rollen zum Einsatz, darunter als Jagdbomber, Nachtjäger, Langstrecken-Begleitjäger und zur Luftaufklärung eingesetzt. Der Auspuff der beiden Motoren wurde durch die Turbolader gedämpft, was für eine gute Leistung in großen Höhen sorgte und relativ leise war. Das Flugzeug war mit zwei 0,50-Zoll-M2-Browning-Maschinengewehren, zwei 0,30-Zoll-M1919-Maschinengewehren und einer 23-mm-T1-Autokanone bewaffnet."
lockheed_p38g_equipment_1_desc:0	"Einheitentyp: Schwerer Jäger \n\n Die P-38G verfügte über Halterungen innenseitig der Triebwerke, die für zusätzliche Treibstofftanks oder zur Aufnahme von 2.000 Pfund Bomben. Um Probleme hinsichtlich Manövrierfähigkeit und Strömungsabriss zu beheben, wurden Fowler-Klappen hinzugefügt, die zur Leistungssteigerung des Flugzeugs beitrugen. Eine Hispano M2 20-mm-Kanone ersetzte die 23-mm-T1-Autokanone und erhöhte die tödliche Feuerkraft des Flugzeugs erheblich. Die P-38G wurde eingesetzt, um Admiral Yamamoto anzugreifen und zu töten.\n|___NL0028 86___|Veraltete P-38 können zu P-38G umgerüstet werden."
lockheed_p38j_equipment_1:0	"Lockheed P-38J Lightning"
lockheed_p38l_equipment_1:0	" Lockheed P-38L Lightning"
lockheed_p38l_equipment_1_short:0	"P-38L Schwerer Jäger"
northrop_p61_equipment:0	"P-61 Nachtjäger"
northrop_p61_equipment_desc:0	"Einheitstyp: Nachtjäger" \n\n Die Northrop P-61 Black Widow, benannt nach der Spinne, wurde als mit Radar ausgestatteter Nachtjäger konzipiert. Das Flugzeug hatte eine dreiköpfige Besatzung: Pilot, Bordschütze und Radartechniker. Die Bewaffnung bestand aus vier nach vorne feuernden 20-mm-Hispano-M2-Kanonen im unteren Rumpf sowie vier ferngesteuerten .50-M2-Browning-Maschinengewehren in Rücken-Geschütztürmen. Dem Flugzeug wird der letzte Abschuss vor dem Sieg über Japan zugeschrieben; es wurde zu Beginn des Kalten Krieges vom Continental Air Defense Command eingesetzt, bevor es durch die P-82 Twin Mustang ersetzt wurde."
northrop_p61_equipment_1_desc:0	" Einheitentyp: Nachtjäger \n\n Die Northrop P-61 Black Widow, benannt nach der Spinne, wurde als mit Radar ausgestatteter Nachtjäger konzipiert. Das Flugzeug hatte eine Besatzung von drei Mann: Pilot, Bordschütze und Radartechniker. Die Bewaffnung bestand aus vier 20-mm-Hispano-M2-Kanonen im unteren Rumpf, sowie vier ferngesteuerten .50-M2-Browning-Maschinengewehren in Rückentürmen. Dem Flugzeug wird der letzte Abschuss vor dem Sieg über Japan zugeschrieben, und es wurde zu Beginn des Kalten Krieges vom Continental Air Defense Command eingesetzt, bevor es durch die P-82 Twin Mustang ersetzt wurde."
tech_northrop_p61_equipment_1:0	"Northrop P-61 Black Widow"
grumman_f7f_equipment_1:0	" Grumman F7F-1 Tigercat"
grumman_f7f_equipment_1_short:0	"F7F-1 Nachtjäger"
grumman_f7f_equipment_2:0	"Grumman F7F-3 Tigercat"
grumman_f7f_equipment_2_short:0	"F7F-3 Nachtjäger"
northamerican_p82_equipment:0	"P-82 Heavy Fighter"
northamerican_p82_equipment_desc:0	"Einheitstyp: Schwerer Jäger \n\n Als Langstreckenjäger entwickelt, wurde die P -82 Twin Mustang wurde entwickelt, um die Belastung bei Langstreckenflügen auf zwei Piloten zu verteilen. Getreu ihrem Namen basierte die Konstruktion darauf, zwei Rümpfe der P-51 Mustang miteinander zu verbinden."
northamerican_p82_equipment_1_desc:0	"Einheitstyp: Schwerer Jäger \n\n Die P-82 Twin Mustang wurde als Langstreckenjäger entwickelt, um die Belastung bei Langstreckenflügen auf zwei Piloten zu verteilen. Getreu ihrem Namen basierte das Design darauf, zwei Rümpfe der P-51 Mustang miteinander zu verbinden."
tech_northamerican_p82_equipment_1:0	" North American P-82B Twin Mustang"
northrop_a17_equipment_1:0	"Northrop A-17 Nomad"
northrop_a17_equipment_1_short:0	"A-17 CAS"
vultee_a19_equipment_desc:0	"Einheitstyp: CAS \n\n Die Vultee A-19 wurde auf Basis der Vultee V-1, eines einmotorigen Passagierflugzeugs, entwickelt. Das Flugzeug durchlief mehrere Varianten mit unterschiedlichen Triebwerken zu Testzwecken. Es war mit vier nach vorne gerichteten nach vorne feuernden .30-Kaliber-M1919-Maschinengewehren, einem rückseitigen .30-Kaliber-M1919-Maschinengewehr und einem unterflügelmontierten .30-Kaliber-M1919-Maschinengewehr und konnte eine Nutzlast von sechs 30-Pfund-Bomben sowie einer 1.100-Pfund-Bombe tragen. Das Flugzeug war bei den Streitkräften Brasiliens, der Republik China, der Sowjetunion und der Türkei häufiger im Einsatz als bei den Vereinigten Staaten von Amerika."
vultee_a19_equipment_1:0	"Vultee A-19"
tech_vultee_a19_equipment_1:0	"Vultee A-19"
curtiss_a18_equipment:0	"A-18 CAS"
curtiss_a18_equipment_1_short:0	 "A-18 Heavy CAS"
curtiss_a18_equipment_1_desc:0	"Einheitstyp: Heavy CAS" \n\n Die Curtis A-18 war ein zweimotoriges Bodenangriffsflugzeug. Das Army Air Corps war an Angriffsflugzeugen interessiert, die größere Bombenlasten tragen konnten und über eine höhere Feuerkraft verfügten, also im Wesentlichen eher einem leichten Bomber ähnelten. Das Flugzeug war mit vier nach vorne feuernden .30-Kaliber-M1919-Maschinengewehren und einem nach hinten feuernden .30-Kaliber-M1919-Maschinengewehr bewaffnet, verfügte über je eine 400-Pfund-Bombe in jedem Flügelbombenschacht und konnte zusätzlich eine 200-Pfund-Bombe oder chemischen Rauch transportieren."
douglas_a20_equipment_3_short:0	"A -20G Heavy CAS"
douglas_a20_equipment_3_desc:0	"Einheitentyp: Heavy CAS \n\n Die Douglas A-20G war eine Bodenangriffsvariante mit einer neuen massiven Nase, die vier 20-mm-Hispano-Kanonen und zwei . 50-Kaliber-M2-Browning-Maschinengewehre. Als sich die Kanonen als unzuverlässig erwiesen, wurden sie durch vier .50-Kaliber-M2-Maschinengewehre ersetzt. Zwei weitere .50-Kaliber-M2-Maschinengewehre wurden in einem Rückenturm angebracht. Das Flugzeug kam im Pazifikkrieg zum Einsatz, und viele Exemplare wurden an die Sowjetunion geliefert."
beechcraft_a38_equipment_1_short:0	"A-38 Heavy CAS"
beechcraft_a38_equipment_1_desc:0	 "Einheitstyp: Schweres CAS \n\n Die Beechcraft A-38 Grizzly war ein geplantes Bodenangriffsflugzeug, das über eine nach vorne feuernde 75-mm-Kanone vom Typ T15E1, zwei .50-M2-Browning-Maschinengewehre in einer nach vorne gerichteten Position sowie vier .50 M2 in einem ventralen und einem dorsalen Turm. Das Flugzeug erwies sich in Tests als zufriedenstellend und wäre in Produktion gegangen, wenn sein Triebwerk, der Wright R-3350, nicht in hohem Maße für die B-29 Superfortress benötigt worden wäre und sich die Kriegsprioritäten geändert hätten."
vultee_a31_equipment_desc:0	 "Einheitstyp: CAS \n\n Die Vultee A-31 war ein zweisitziger Sturzkampfbomber, der ursprünglich für Frankreich entwickelt wurde; das Land kapitulierte jedoch, bevor Lieferungen erfolgen konnten. Das Flugzeug war mit vier .30-Kaliber-M1919-Browning-Maschinengewehren bewaffnet, zwei in jedem Flügel und zwei .30 M1919 im hinteren Cockpit. Die Nutzlast umfasste zwei 500-Pfund-Bomben im internen Bombenschacht und je eine 250-Pfund-Bombe an jedem Flügel. Das Flugzeug wurde in den USA als Zielschlepper eingesetzt, wurde jedoch von der Royal Air Force, der Royal Australian Air Force und der Indian Air Force für den Kampfeinsatz zugelassen."
vultee_a31_equipment_1:0	"Vultee A-31"
tech_vultee_a31_equipment_1:0	"Vultee A-31"
northamerican_a36_equipment:0	"A-36 CAS"
northamerican_a36_equipment_1_short:0	"A-36 CAS"
northamerican_a36_equipment_1_desc:0	"Einheitstyp: CAS \n\n Die A-36 Apache war ein Bodenangriffs- und Sturzbomber, der von der P-51 Mustang abgeleitet wurde. Das Flugzeug durchlief einen Umbauprozess, bei dem es mit zusätzlichen Bombenabwurfvorrichtungen, Sturzbremsen sowie hochbelastbaren Tragflächen. Die Flugzeugzelle wurde komplett neu konstruiert, behielt jedoch die Hauptbewaffnung von sechs .50-Kaliber-M2-Browning-Maschinengewehren bei. Es gab Pläne, die vier an den Tragflächen montierten .50-Kaliber-Maschinengewehre durch vier 20-mm-Hispano-Kanonen zu ersetzen. Das Flugzeug hatte eine Nutzlast von 1.000 Pfund Bomben.\n\nAusgediente P-51 können zu A-36 umgebaut werden."
douglas_a24_equipment_1_short:0	"A-24 CAS "
douglas_a24_equipment_1_desc:0	"Einheitstyp: CAS" \n\n Die Douglas SBD Dauntless (im Army Air Corps als A-24 Banshee bekannt) war ein Aufklärungs- und Sturzkampfbomber der Marine. Das Flugzeug, das liebevoll den Spitznamen "Slow but Deadly" (Langsam, aber tödlich) trug, verfügte über eine große Reichweite, gute Flugeigenschaften, eine hohe Bombenlast, eine gute Verteidigungsbewaffnung und war robust. Die SBD-5 (A-24 Banshee) verfügte über einen 1.200-PS-Motor, zwei nach vorne feuernde .50-Kaliber-M2-Browning-Maschinengewehre und zwei .30-Kaliber-M1919-Browning-Maschinengewehre im Heck. Die Bombenlast betrug bis zu 2.250 Pfund. Das Flugzeug wurde in Serie produziert und war bei mehreren alliierten Nationen im Einsatz."
curtiss_a25_equipment_1_short:0	"A-25 CAS"
martin_b10_equipment:0	"Martin B-10"
martin_b10_bomber_equipment_1_short:0	"B-10 Leichter Bomber"
martin_b10_bomber_equipment_1_desc:0	"Einheitstyp: Leichter Bomber \n\n Die Martin B-10 war der erste Ganzmetall-Eindecker-Bomber und der erste serienmäßig -produzierte Bomber, dessen Leistungsfähigkeit die der Jagdflugzeuge des Army Air Corps übertraf. Die Konstruktion zeichnete sich durch geschlossene Cockpits, drehbare Geschütztürme, ein einziehbares Fahrwerk, einen internen Bombenschacht sowie vollständige Motorhauben, die alle für Jahrzehnte zu Standardmerkmalen im Bomberbau werden sollten. Zur Verteidigungsbewaffnung gehörten drei .30-Kaliber-M1919-Browning-Maschinengewehre. Das Flugzeug konnte eine Bombenlast von 2.260 Pfund transportieren."
martin_b10_bomber_equipment_2_desc:0	"Einheitentyp: Leichtbomber \n\n Die Martin 139W war die Exportversion des Leichtbombers Martin B-10."
martin_b10_bomber_equipment_3:0	" Martin 166"
martin_b10_bomber_equipment_4:0	"Martin B-10B"
martin_b10_bomber_equipment_4_short:0	"B-10B Leichtbomber"
tech_martin_b10_bomber_equipment_1_desc:0	 "Einheitstyp: Leichter Bomber \n\n Die Martin B-10 war der erste Ganzmetall-Eindecker-Bomber und der erste serienmäßig hergestellte Bomber, dessen Leistungsfähigkeit die der Jagdflugzeuge des Army Air Corps übertraf. Die Konstruktion zeichnete sich durch geschlossene Cockpits, drehbare Geschütztürme, ein einziehbares Fahrwerk, einen internen Bombenschacht und vollständige Motorhauben aus – allesamt Merkmale, die jahrzehntelang zum Standard im Bomberbau. Zur Verteidigungsbewaffnung gehörten drei .30-Kaliber-M1919-Browning-Maschinengewehre. Das Flugzeug konnte eine Bombenlast von 2.260 Pfund transportieren."
tech_martin_b10_bomber_equipment_4:0	"B -10B Leichter Bomber"
martin_a22_equipment_desc:0	"Einheitstyp: Leichter Bomber \n\n Die Martin Model 167 war ein leichter Bomber, der vor allem bei den Franzosen und Briten zum Einsatz kam, die dem Flugzeug den Spitznamen "Maryland" gaben. Der Prototyp XA-22 war ein zweimotoriger , Ganzmetall-Eindecker mit guter Geschwindigkeit, Bewaffnung und einer Bombenlast von 2.000 Pfund. Das Flugzeug verfügte über vier .30-Kaliber-M1919-Browning-Maschinengewehre in den Tragflächen für Bodenangriffe sowie zwei Maschinengewehre, eines in Rücken- und eines in Bauchposition, zur Verteidigung. Das Flugzeug wurde nicht bei den Streitkräften in Dienst gestellt, da der Auftrag an Douglas’ A-20 verloren hatte."
martin_a22_equipment_1:0	"Martin A-22 Maryland"
tech_martin_a22_equipment_1:0	"Martin A-22 Maryland"
northamerican_b25_equipment:0	" B-25 Leichter Bomber"
northamerican_b25_equipment_1_short:0	"B-25 Leichter Bomber"
northamerican_b25_equipment_1_desc:0	"Einheitstyp: Leichter Bomber" \n\n Die B-25 Mitchell, benannt zu Ehren von General William "Billy" Mitchell, war ein zweimotoriges Flugzeug mit Wright R-2600-9 Twin Cyclone-Triebwerken. Zur Verteidigungsbewaffnung gehörten drei 0,30-Zoll-M1919-Maschinengewehre und ein 0,50-Zoll-M2-Maschinengewehr im Heck. Die Bombenlast betrug bis zu 3.000 Pfund. Die erste Serie litt unter Stabilitätsproblemen, weshalb die Tragflächen für die erste Serienversion, die B-25A, komplett neu konstruiert wurden. Zu den weiteren Verbesserungen gehörten selbstdichtende Treibstofftanks, eine Panzerung für die Besatzung und ein verbesserter Heckschützenstand. "
northamerican_b25_equipment_2_short:0	"B-25C Leichter Bomber"
northamerican_b25_equipment_2_desc:0	"Einheitstyp: Leichter Bomber \n\n Eine Weiterentwicklung der B-25 mit verbesserten Wright R-2600-13-Motoren. Es wurden Enteisungs- und Vereisungsschutzvorrichtungen hinzugefügt, ebenso wie ein zusätzliches .50-Kaliber-M2-Browning-Maschinengewehr in der Nase. Die B-25C war die erste serienmäßig -produzierte Version der B-25.\n\nVeraltete B-25 können zu B-25C umgerüstet werden."
northamerican_b25_equipment_3_short:0	"B-25J Leichter Bomber"
northamerican_b25_equipment_3_desc:0	 "Einheitentyp: Leichter Bomber \n\n Die B-25J knüpfte an die Verbesserungen an, die mit der Variante B-25H begonnen hatten, bei der das Flugzeug um eine 75-mm-M4-Kanone erweitert wurde. Es wurden vier am Rumpf montierte Pods installiert, die mit vier . 50-Kaliber-M2-Browning-Maschinengewehren, wodurch sich die Gesamtzahl der M2-Maschinengewehre von vierzehn auf achtzehn erhöhte. Zusätzliche Aufhängepunkte wurden installiert, um acht 5-Zoll-High-Velocity-Flugkörper oder einen Mark-13-Torpedo zu tragen.\n\nVeraltete B-25Cs können zu B-25Js umgerüstet werden."
douglas_p70_equipment_1_short:0	"P -70 Nachtjäger"
douglas_p70_equipment_1_desc:0	"Einheitentyp: Nachtjäger \n\n Die Douglas P-70 Havoc war eine Umrüstung von A-20-Schnellbombern zu Nachtjägern. Die Bewaffnung wurde um vier nach vorne feuernde 20-mm-Kanonen erweitert. Das Flugzeug war mit dem SCR-540-Radar und einem zusätzlichen Treibstofftank ausgestattet. Das Flugzeug kam im Pazifikraum nur begrenzt zum Einsatz, bevor es ausgemustert und als Schulflugzeug verwendet wurde."
douglas_a20_equipment_desc:0	"Einheitentyp: Schnellbomber \n\n Die Douglas A-20 Havoc war ein mittelschwerer Bomber, der in Frankreich als DB-7 (Douglas’ Bezeichnung für das Flugzeug) im Einsatz stand und nach dem Fall Frankreichs von der Royal Air Force genutzt wurde. Die A -20 war mit zwei Wright R-2600-11-Motoren ausgestattet, konnte eine Bombenlast zwischen 1.400 und 1.800 Pfund tragen und verfügte über ein einzelnes .50 M2 Browning-Maschinengewehr zu Verteidigungszwecken."
douglas_a20_equipment_1:0	"Douglas A-20 Havoc"
tech_douglas_a20_equipment_1:0	"Douglas A-20 Havoc"
douglas_a20_equipment_2:0	"Douglas A-20C Havoc"
tech_douglas_a20_equipment_2:0	"Douglas A-20C Havoc"
douglas_a26_equipment:0	 "A-26 Angriffsbomber"
douglas_a26_equipment_1_short:0	"A-26 Schnellbomber"
douglas_a26_equipment_1_desc:0	"Einheitstyp: Schnellbomber" \n\n Die Douglas A-26 wurde als Nachfolgerin der Douglas A-20 entwickelt. Das Flugzeug war ein zweimotoriger, vielseitiger leichter Bomber und Bodenangriffsflugzeug. In der Nase waren sechs bis acht .50-Kaliber-M2-Browning-Maschinengewehre montiert, an den Tragflächen befanden sich optionale Pods für weitere sechs bis acht .50 M2, und in einem ferngesteuerten Rücken- und Bauchgeschützturm befanden sich vier .50er. Darüber hinaus konnte das Flugzeug bis zu zehn 5-Zoll-Hochgeschwindigkeits-Flugzeugraketen, fünf unter jedem Flügel, sowie 4.000 Pfund Bomben im internen Bombenschacht tragen. Obwohl erst gegen Ende des Krieges eingeführt, wurde die A-26 Invader bis 1969 in mehreren Konflikten des Kalten Krieges bis 1969 eingesetzt."
douglas_b18_equipment_desc:0	"Einheitstyp: Mittlerer Bomber \n\n Im Jahr 1934 gab das Army Air Corps eine Ausschreibung zur Ablösung der Martin B-10 heraus. Das neue Design sollte die doppelte Bombenlast und Reichweite aufweisen. Douglas reichte eine modifizierte DC-2 ein, ein Passagierflugzeug für 14 Personen, das gegen das Boeing-Modell 299 (später B-17 Flying Fortress) und der Martin 146. Das Boeing-Modell war eindeutig überlegen; jedoch schied das Flugzeug aufgrund eines Absturzes des Prototyps aus dem Auswahlverfahren aus. Die B-18 konnte bis zu 4.400 Pfund Bomben transportieren. Das Flugzeug wurde bei der Royal Canadian Air Force als "Digby" eingesetzt."
douglas_b18_equipment_1:0	"Douglas B-18 Bolo"
tech_douglas_b18_equipment_1:0	"Douglas B-18 Bolo"
douglas_b23_equipment:0	"B-23 Medium Bomber"
douglas_b23_equipment_1_short:0	"B-23 Medium Bomber "
douglas_b23_equipment_1_desc:0	"Einheitentyp: Mittlerer Bomber \n\n Die Douglas B-23 war ein zweimotoriger Bomber, der als Nachfolger der B-18 Bolo konzipiert wurde. Die B-23 zeichnete sich durch eine größere Spannweite, ein vollständig einziehbares Fahrwerk und eine bessere Verteidigungsbewaffnung aus. Die B-23 war der erste Bomber mit einer verglasten Heckgeschützstellung, die mit einem .50-Kaliber-M2-Browning-Maschinengewehr mit Zielfernrohr ausgestattet war und aus liegender Position bedient wurde. Das Flugzeug verfügte über drei .30-Kaliber-M1919-Maschinengewehre zur zusätzlichen Verteidigung. Die B-23 war zwar besser als die B-18, hatte jedoch eine geringere Nutzlast als die B-25 Mitchell und die B-26 Marauder. Die B-23 wurde später zu einem Mehrzweck-Transportflugzeug für das Schleppen von Segelflugzeugen umgebaut."
martin_b26_equipment_desc:0	"Einheitentyp: Mittelstreckenbomber \n\n Die Martin B-26 war ein zweimotoriger Bomber, der von Pratt & Whitney R-2800-5-Motoren angetrieben wurde. Das Flugzeug verfügte über den ersten motorisierten Rückenturm, der mit zwei .50-M2-Browning-Maschinengewehren bewaffnet war, sowie über zwei .30-M1919-Maschinengewehre zur Verteidigung. Aufgrund einer hohen Anzahl von Strömungsabrissen und Abstürzen, bedingt durch die kurze Spannweite und die hohe Geschwindigkeit bei der Landung, erhielt das Flugzeug Spitznamen wie "Widowmaker", "Martin Murderer", "Flying Coffin", "B-Dash -Crash und anderen bildhaften Namen."
martin_b26_equipment_1:0	"Martin B-26 Marauder"
tech_martin_b26_equipment_1:0	"Martin B-26 Marauder"
martin_b26_equipment_2:0	"Martin B-26B Marauder"
tech_martin_b26_equipment_2:0	"Martin B-26B Marauder"
martin_b26_equipment_3:0	"Martin B-26F Marauder"
tech_martin_b26_equipment_3:0	"Martin B-26F Marauder"
douglas_b42_equipment:0	"B-42 Mittelstreckenbomber"
douglas_b42_equipment_1_short:0	"B-42 Mittelstreckenbomber" "
douglas_b42_equipment_1_desc:0	"Einheitentyp: Mittlerer Bomber \n\n Die Douglas B-42 Mixmaster wurde mit einem unkonventionellen Ansatz entwickelt, bei dem zwei Triebwerke im Rumpf montiert wurden, wodurch Flügel und Rumpf frei von widerstandserzeugenden Vorsprüngen blieben. Die Verteidigungsbewaffnung bestand aus zwei . 50-mm-M2-Browning-Maschinengewehre, eines auf jeder Seite, zwei in einem nach hinten feuernden Turm und zwei in einem nach vorne feuernden Turm. Das Flugzeug konnte bis zu 8.000 Pfund Bomben aus einem internen Laderaum abwerfen. Das Flugzeug litt unter einer Reihe von Problemen und wurde aufgrund des Kriegsendes nie für die Serienproduktion freigegeben."
boeing_b17_equipment_desc:0	"Einheitstyp: Schwerer Bomber \n\n Die Boeing B-17 Flying Fortress war ein viermotoriger schwerer Bomber, der mit der B-18 von Douglas und der 146 von Martin konkurrierte. Obwohl Boeing den Auftrag verlor, weil der Prototyp abstürzte, ordnete das Army Air Corps weitere Evaluierungen an. Die B-17B war das erste Serienmodell mit vier 1.200-PS-R-1820-51-Motoren. Die ursprünglich gewölbten Maschinengewehrstellungen des Flugzeugs wurden durch eine aerodynamischere, bündige Ausführung ersetzt."
boeing_b17_equipment_1:0	"Boeing B-17 Flying Fortress"
tech_boeing_b17_equipment_1:0	"Boeing B-17 Flying Fortress"
boeing_b17_equipment_2:0	"Boeing B-17E Flying Fortress"
tech_boeing_b17_equipment_2:0	" Boeing B-17E Flying Fortress"
boeing_b17_equipment_3:0	"Boeing B-17F Flying Fortress"
tech_boeing_b17_equipment_3:0	"Boeing B-17F Flying Fortress"
boeing_b17_equipment_4:0	" Boeing B-17G Flying Fortress"
tech_boeing_b17_equipment_4:0	"Boeing B-17G Flying Fortress"
consolidated_b24_equipment:0	"B-24 Schwerer Bomber"
consolidated_b24_equipment_1_short:0	"B-24 Schwerer Bomber"
consolidated_b24_equipment_1_desc:0	"Einheitstyp: Schwerer Bomber \n\n Die Consolidated B-24 war ein viermotoriger schwerer Bomber mit einem schultermontierten Davis-Flügel, der den Luftwiderstand verringerte, eine hohe Reisegeschwindigkeit und große Reichweite ermöglichte und zur Erhöhung der Bombenkapazität beitrug. Die B-24A war das erste Serienmodell, dessen Aerodynamik gegenüber dem Prototyp verbessert worden war; dieses Modell wurde direkt an das Vereinigte Königreich verkauft. Die Einnahmen aus dem Verkauf der B-24A wurden zur weiteren Verbesserung der Konstruktion verwendet, was zur B-24D führte, dem ersten Serienmodell mit besseren Triebwerken und verstärkter Verteidigungsbewaffnung."
consolidated_b24_equipment_2_short:0	"B-24J Schwerer Bomber"
consolidated_b24_equipment_2_desc:0	"Einheitstyp: Schwerer Bomber \n\n Nach der B-24H-Serie, die einen elektrisch angetriebenen Bugturm, versetzte Positionen für die Rumpfschützen und einen verbesserten Heckturm aufwies, führte die J-Serie weitere Verbesserungen ein. Ein besseres automatisches -Pilotsystem und ein verbessertes Bombenzielgerät der M-1-Serie wurden eingebaut. Die J-Serie war die einzige Version, die von allen fünf an der B-24-Produktion beteiligten Werken gebaut wurde, und war die am häufigsten produzierte Variante.\n\nVeraltete B-24 können zu B-24J umgerüstet werden."
boeing_b29_equipment_desc:0	"Einheitentyp: Schwerer Bomber \n\n Die Boeing B-29 Superfortress war ein viermotoriger schwerer Bomber, der für den Flug in großer Höhe konzipiert war, worin er sich auszeichnete, aber auch für Bombenangriffe in geringer Höhe und das Abwerfen von Seeminen eingesetzt wurde. Das Flugzeug verfügte über zwei Druckkabinen, die durch einen Tunnel miteinander verbunden waren, da der Bombenschacht nicht unter Druck stand. Zur Verteidigungsbewaffnung gehörten vier ferngesteuerte Geschütztürme mit jeweils zwei .50-M2-Browning-Maschinengewehren sowie ein Heckgeschütz mit Feuerleitradar. Das Flugzeug konnte je nach Höhe und Entfernung bis zu 20.000 Pfund Bomben transportieren. Die "Silverplate"-Variante, bei der die Bewaffnung entfernt und die Treibstoff- und Bombenkapazität erhöht wurde, warf die Atombomben über Japan ab. Nach dem Krieg wurden einige wenige B-29 als fliegende Fernsehsender für das Unternehmen Stratovision eingesetzt. "
boeing_b29_equipment_1:0	"Boeing B-29 Superfortress"
tech_boeing_b29_equipment_1:0	"Boeing B-29 Superfortress"
consolidated_b32_equipment:0	" B-32 Schwerer Bomber"
consolidated_b32_equipment_1_short:0	"B-32 Schwerer Bomber"
consolidated_b32_equipment_1_desc:0	"Einheitstyp: Schwerer Bomber \n\n Die B-32 Dominator war ein viermotoriger schwerer Bomber, der parallel zur B -29 Superfortress entwickelt wurde, für den Fall, dass diese scheitern sollte. Die Konstruktion basierte auf der B-24 Liberator, wies jedoch einen längeren Rumpf und dieselben 2.200 PS starken Wright Duplex-Cyclone-Motoren wie die B-29 auf. Die Kabine war druckbeaufschlagt, und zur Verteidigungsbewaffnung gehörten zehn bis vierzehn M2-Browning-Maschinengewehre in ferngesteuerten Türmen. Das Flugzeug wurde nur in begrenzter Stückzahl produziert; es entstanden lediglich etwa hundert Exemplare. Die B-32 Dominators wurden eingesetzt, um die Einhaltung des Waffenstillstands durch Japan zu überwachen und Fotoaufklärungsdaten sowie Informationen für die Besetzung des Landes zu sammeln."
convair_b36_equipment_1_desc:0	" Schwere Bomber sind viermotorige Bomber, die in erster Linie zum Angriff auf strategische Ziele des Feindes eingesetzt werden. Sie sind schwer bewaffnet, gepanzert und verfügen über eine große Reichweite."
tech_consolidated_b32_equipment_1:0	"Consolidated B-32 Dominator"
lockheed_a28_equipment_1:0	"Lockheed A-28 Hudson"
lockheed_a28_equipment_1_short:0	"A-28 Marinebomber"
lockheed_a28_equipment_2:0	"Lockheed PBO-1 Hudson"
lockheed_a28_equipment_2_short:0	"PBO-1 Naval Bomber"
lockheed_pv1_equipment:0	"PV-1 Patrol Bomber"
lockheed_pv1_equipment_desc:0	" Einheitentyp: Marinebomber \n\n Die Lockheed PV-1 Ventura war ein zweimotoriger mittelschwerer Bomber und Patrouillenflugzeug, der vom Transportflugzeug Lockheed Model 18 Lodestar abgeleitet wurde. Die von den Army Air Forces eingesetzte Bombervariante erhielt die Bezeichnung B-37. Der Unterschied zwischen einer B -37 und der PV-1 bestand in der Ausstattung, die das Flugzeug für eine Rolle als Marinepatrouille anpasste. Die Treibstoffkapazität wurde erheblich erhöht, die nach vorne gerichtete Verteidigungsbewaffnung wurde entfernt und ein ASD-1-Suchradar installiert. Das Flugzeug konnte 3.000 Pfund allgemeine Munition, sechs 325-Pfund-Wasserbomben oder einen Torpedo transportieren."
lockheed_pv1_equipment_1_desc:0	"Einheitentyp: Marinebomber \n\n Die Lockheed PV-1 Ventura war ein zweimotoriger mittlerer Bomber und Patrouillenflugzeug, der vom Transportflugzeug Lockheed Model 18 Lodestar abgeleitet wurde. Die von den Army Air Forces eingesetzte Bombervariante erhielt die Bezeichnung B-37. Der Unterschied zwischen einer B-37 und einer PV-1 bestand in der Ausstattung, die das Flugzeug für den Einsatz als Marinepatrouille geeignet machte . Die Treibstoffkapazität wurde erheblich erhöht, die nach vorne gerichtete Verteidigungsbewaffnung entfernt und ein ASD-1-Suchradar installiert. Das Flugzeug konnte 3.000 Pfund allgemeine Munition, sechs 325-Pfund-Wasserbomben oder einen Torpedo transportieren."
tech_lockheed_pv1_equipment_1:0	"Lockheed PV-2 Harpoon"
lockheed_pv2_equipment_1_desc:0	"Einheitstyp: Marinebomber \n\n Die PV -2 war eine Weiterentwicklung der PV-1 und verfügte über eine vergrößerte Flügelfläche, was ihr eine bessere Tragfähigkeit verlieh. Die Bewaffnung wurde auf fünf nach vorne feuernde .50-M2-Browning-Maschinengewehre standardisiert, und die Bombenlast wurde auf 4.000 Pfund erhöht. Darüber hinaus konnten unter jedem Flügel acht 5-Zoll-Hochgeschwindigkeits-Luftraketen mitgeführt werden. \n\nVeraltete PV-1 können zu PV-2 umgerüstet werden."
