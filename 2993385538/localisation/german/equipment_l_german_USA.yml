usa_boeing_p26_equipment_1:0	"Boeing P-26 Peashooter"
usa_boeing_p26_equipment_1_desc:0	" Einheitentyp: Abfangjäger\n\nDie Boeing P-26 war das erste vollständig aus Metall gefertigte Serienjagdflugzeug und der erste einmotorige Verfolgungsjäger. Das Flugzeug wurde von Pratt & Whitney R-1340-33-Motoren angetrieben und hatte eine hohe Landegeschwindigkeit, was sich für viele Piloten als schwierig erwies. Aufgrund seiner geringen Größe wurde das Flugzeug liebevoll als "Peashooter" bezeichnet. Zur Bewaffnung gehörten zwei .30-Kaliber-M1919-Browning-Maschinengewehre oder ein .30-Kaliber-M1919- und ein .50-Kaliber-Maschinengewehr."
usa_boeing_p26_equipment_2_desc:0	"Einheitstyp: Jagdflugzeug\n\nDie Boeing P-26 war das erste serienmäßige Jagdflugzeug und Verfolgungs-Eindecker aus Vollmetall. Das Flugzeug wurde von Pratt & Whitney R-1340-33-Motoren angetrieben und hatte eine hohe Landegeschwindigkeit, was sich für viele Piloten als schwierig erwies. Aufgrund seiner geringen Größe wurde das Flugzeug liebevoll als "Peashooter" (Erbsenschleuder) bezeichnet. Zur Bewaffnung gehörten zwei Browning-Maschinengewehre vom Kaliber .30 M1919 oder ein Maschinengewehr vom Kaliber .30 M1919 und eines vom Kaliber .50. Die Nutzlast umfasste zwei 100-Pfund- oder fünf 31-Pfund-Antipersonenbomben."
usa_boeing_p26_equipment_2_short:0	"P-26C-Jagdflugzeug"
seversky_p35_equipment_1_short:0	"P-35 Abfangjäger"
republic_p43_equipment_1:0	"Republic P-43 Lancer"
bell_p63_equipment_1:0	"Bell P-63 Kingcobra"
bell_p63_equipment_1_desc:0	"Einheitstyp: Abfangjäger \n\n Die P-63 Kingcobra war der Nachfolger der P-39 und berücksichtigte Anregungen und Kritikpunkte der Piloten. Die Tragflächen wurden neu konstruiert und boten mehr Treibstoffkapazität; zudem wurde ein neuer Motor mit einem effizienten Turbolader eingebaut, wodurch sich die Leistung des Flugzeugs in großen Höhen verbesserte. Die 37-mm-M4-Kanone wurde durch eine neuere 37-mm-M10-Kanone mit mehr Munition und einer höheren Feuerrate ersetzt. Das Flugzeug verfügte außerdem über zwei .50-M2-Browning-Maschinengewehre, die in der Nase montiert waren, sowie je ein .50-M2-Maschinengewehr in jedem Flügel. Das Design wurde von den Army Air Forces abgelehnt, fand jedoch in der Sowjetunion breite Anwendung. "
republic_p47m_equipment_1_desc:0	"Einheitentyp: Abfangjäger \n\n Angesichts der fortschrittlichen Technologie des Feindes entwickelte Republic eine Hochgeschwindigkeitsvariante der P-47. Der Motor wurde durch einen 2.800 PS starken R-2800-57C mit einem leistungsstarken Kompressor , Bremsklappen und einem verbesserten Propeller. Insgesamt stieg die Höchstgeschwindigkeit des Flugzeugs auf 473 mph. Die Bewaffnung des Flugzeugs blieb unverändert gegenüber anderen Modellen: acht 0,52-Zoll-M2-Browning-Maschinengewehre, vier in jedem Flügel. "
republic_p47m_equipment_1_short:0	"P-47M Interceptor"
curtiss_p36_equipment_1:0	"Curtiss P-36 Hawk"
curtiss_p36_equipment_1_desc:0	"Einheitstyp: Jagdflugzeug \n\n Die Curtiss P -36 Hawk zeichnete sich durch eine schnittige Ganzmetall-Eindeckerkonstruktion aus und wurde von einem Pratt & Whitney R-1830-17 Twin Wasp-Sternmotor mit 1.050 PS angetrieben. Zur Offensivbewaffnung gehörten ein .30-Kaliber-M1919-Browning-Maschinengewehr und ein .50-Kaliber-M2-Maschinengewehr. Es wurde eine Aufhängung für einen Bombenhalter hinzugefügt, der eine einzelne 100-Pfund-Bombe tragen konnte. Das Flugzeug ist besser bekannt als Curtis Hawk 75, ein Exportmodell, das in den 1930er und 1940er Jahren in zahlreichen Ländern im Einsatz war."
curtiss_p40_equipment_desc:0	 "Jäger sind Flugzeuge, die dafür ausgelegt sind, feindliche Flugzeuge anzugreifen und zu zerstören. Oft sind sie auch in der Lage, taktische Ziele anzugreifen, jedoch nicht so effektiv wie ein CAS-Flugzeug."
