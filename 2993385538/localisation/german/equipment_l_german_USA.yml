USA_curtiss_p6_equipment_1_desc:0	"Die Curtiss P-6 Hawk war ein rekordverdächtiges Flugzeug, als sie in den 1920er Jahren entwickelt wurde. Sie ist ein leicht bewaffneter Abfangjäger, der zunehmend an Bedeutung verliert."


