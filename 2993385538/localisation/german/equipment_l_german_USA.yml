american_light_tank_equipment_1_short:0	"M1917"
american_light_tank_equipment_1_desc:0	"Einheitstyp: Leichter Panzer" \nAls Amerika in den Ersten Weltkrieg eintrat, verfügte es über keine Panzer. Der M1917 war eine vollständig lizenzierte Kopie des Renault FT und wies wesentliche Unterschiede auf, insbesondere befand sich der Auspuff auf der linken Seite und der Geschützmantel wurde neu gestaltet. Obwohl der Panzer während des Krieges nicht zum Einsatz kam, wurde er 1919 und 1920 zur Niederschlagung von Unruhen in den Vereinigten Staaten eingesetzt. Im Jahr 1940 kaufte die kanadische Armee überschüssige M1917 und nutzte sie zu Ausbildungszwecken."
american_light_tank_equipment_2_short:0	"M2A1"
american_light_tank_equipment_2_desc:0	"Einheitstyp: Leichter Panzer \nDer leichte Panzer M2 wurde ursprünglich mit einer Blattfederung vom Typ Vickers konstruiert, doch die Serienversionen verfügten über die überlegene vertikale Spiralfederung. Die erste Serienvariante verfügte über einen einzigen festen Turm mit einem .50-Kaliber-M2-Browning-Maschinengewehr. Der M2A2, die erste serienmäßig produzierte Variante, hatte zwei Türme mit einem M2-Browning- und einem .30-Kaliber-M1919-Maschinengewehr."
american_light_tank_equipment_3_short:0	"M2A4"
american_light_tank_equipment_3_desc:0	"Einheitentyp: Leichter Panzer \nDer Spanische Bürgerkrieg hatte gezeigt, dass Panzer, deren Hauptbewaffnung aus Maschinengewehren bestand, unwirksam waren. Der M2A4 wurde zur neuen Serienversion mit einem einzigen Turm, der mit einer 37-mm-Kanone und einer dickeren Panzerung ausgestattet war."
american_light_tank_equipment_4_short:0	"M3 Stuart"
american_light_tank_equipment_4_desc:0	"Einheitentyp: Leichter Panzer \nDer leichte Panzer M3, von den Briten Stuart genannt, war als Ersatz für den veralteten leichten Panzer M2 konzipiert. Ähnlich wie der M2 war der M3 mit einer 37-mm-Kanone bewaffnet und verfügte über eine dickere Panzerung als der M2A4. Die ersten Varianten waren mit einem Continental W-670- oder einem Guiberson T-1020-Diesel-Flugzeugmotor ausgestattet. Der M3 wurde im Rahmen des Leih- und Pachtgesetzes in großen Mengen an die Alliierten geliefert; obwohl er mit dem Panzer III Ausf. G vergleichbar und dem Fiat M13/40 überlegen war, wies der Panzer eine schlechte Kampfbilanz auf."
american_light_tank_equipment_5_short:0	"M5 Stuart"
american_light_tank_equipment_5_desc:0	"Einheitstyp: Leichter Panzer \nDer M5 Stuart war eine stark überarbeitete Version des M3, bei der die Flugzeugmotoren durch zwei Cadillac-V8-Motoren und Hydra-Matic-Getriebe ersetzt wurden, was den Panzer geräumiger machte und die Ausbildung der Besatzung vereinfachte. Obwohl der M5 eine dickere Panzerung als der M3 hatte, behielt er die gleiche 37-mm-Kanone bei, der es gegenüber späteren feindlichen Panzern an Feuerkraft mangelte."
american_light_tank_equipment_6_short:0	"M24 Chaffee"
american_light_tank_equipment_6_desc:0	"Einheitstyp: Leichter Panzer \nDer M24 Chaffee, benannt nach General Adna R. Chaffee Jr., dem Vater der Panzertruppen der Armee, wurde entwickelt, um die Mängel des M3 und des M5 Stuart zu beheben. Der Panzer war ursprünglich mit der 75-mm-Haubitze M2 ausgerüstet, diese wurde jedoch verworfen. Die Entwicklung des Fahrzeugs wurde bis 1943 unterbrochen, als die Arbeiten wieder aufgenommen wurden. Das Fahrzeug sollte weniger als 20 Tonnen wiegen, die Panzerung blieb dünn, wurde jedoch geneigt, um ihre Wirksamkeit zu maximieren, und die Bewaffnung bestand aus einer leichten 75-mm-Kanone M6, die eine ähnliche Durchschlagskraft wie die 75-mm-Kanone des M4 Sherman aufwies. Obwohl der M24 Chaffee bereits im November 1944 in Europa war, erreichte er die Frontverbände erst nach Kriegsende."
american_light_tank_aa_equipment_1_short:0	"M19 MGMC"
american_light_tank_aa_equipment_1_desc:0	"Einheitstyp: Selbstfahrende Flugabwehr \nDer M19 Multiple Gun Motor Carriage war eine selbstfahrende Flugabwehrwaffe auf Basis des M24-Fahrgestells. Der M19 entstand aus dem T65-Projekt, das ursprünglich auf dem M5 Stuart basierte; das Projekt wurde jedoch eingestellt, da der M5 ausgemustert wurde. Der Bedarf an einem leichten Flugabwehrfahrzeug blieb jedoch bestehen, und das Projekt wurde als T65E1 wiederbelebt. Das Fahrzeug war mit zwei 40-mm-Bofors-Kanonen bewaffnet. Der M19 kam in Europa nicht zum Einsatz, wurde jedoch im Koreakrieg als Sturmgeschütz eingesetzt und erwies sich als wirksam gegen massive Infanterieangriffe."
american_light_tank_artillery_equipment_1_short:0	"M8 Scott"
american_light_tank_artillery_equipment_1_desc:0	"Einheitentyp: Leichte selbstfahrende Artillerie \nDer Howitzer Motor Carriage M8 wurde zu Ehren von General Winfield Scott benannt. Das Fahrzeug wurde auf Basis eines M5-Fahrgestells entwickelt und war zunächst mit der M2-75-mm-Haubitze und später mit der M3-75-mm-Haubitze bewaffnet. Die Panzerung war relativ dünn, wodurch das Fahrzeug anfällig für feindliche Panzerabwehrwaffen und Panzer war."
american_light_tank_equipment_7_short:0	"M41 Walker Bulldog"
american_light_tank_equipment_7_desc:0	"Einheitstyp: Leichter Panzer \nDer M41 Walker Bulldog war ein leichter Panzer, der für bewaffnete Aufklärungszwecke entwickelt wurde und nach General Walton Walker benannt wurde. Die Entwicklung des Fahrzeugs verlief schleppend, bis der Ausbruch des Koreakriegs den Bedarf der Armee an weiteren Panzern deutlich machte. Die überstürzte Produktion führte zu technischen Problemen, und der beengte Rumpf machte das Fahrzeug bei den Besatzungen unbeliebt. Im Vergleich zum M24 Chaffee galt der Panzer als zu groß für Aufklärungszwecke. Die Hauptbewaffnung bestand aus einer 76-mm-M32A1-Kanone mit gezogenem Lauf, ergänzt durch ein .50-M2- und ein .30-M1919-Maschinengewehr."
american_light_tank_aa_equipment_2_short:0	"M42 Duster"
american_light_tank_aa_equipment_2_desc:0	"Einheitentyp: Selbstfahrende Flugabwehr"
american_medium_tank_destroyer_equipment_1_short:0	"M6 Fargo"
american_medium_tank_destroyer_equipment_1_desc:0	"Einheitentyp: Mittlerer Panzerjäger" \nDer 37-mm-Kanonenwagen M6, auch bekannt als M6 Fargo, war ein modifizierter Dodge WC52-Leichtlastwagen, auf dem eine 37-mm-Kanone in einer Panzerabwehrfunktion montiert war. Die Kanone war im Heck montiert und feuerte nach hinten, da sie andernfalls die Windschutzscheibe beschädigt hätte und die Druckwelle die Besatzung gefährdet hätte. Aufgrund der fehlenden Panzerung und der Unwirksamkeit der Kanone gegen feindliche Panzer war das Fahrzeug nicht sehr beliebt."
american_medium_tank_destroyer_equipment_2_short:0	"M10 Wolverine"
american_medium_tank_destroyer_equipment_2_desc:0	"Einheitentyp: Mittlerer Panzerjäger \nDer 3-Zoll-Panzerjäger M10 war ein Entwurf, der als Ersatz für die Übergangskonstruktionen der früheren Panzerjäger die häufig aus auf Lastwagen montierten Geschützen bestanden. Die Bewaffnung bestand aus einer 76,2-mm-M7-Kanone in einem drehbaren Turm, der auf einem modifizierten M4A2-Sherman-Chassis montiert war. Obwohl das Fahrzeug eine dünne Panzerung aufwies und Schwierigkeiten mit überlegenen feindlichen Fahrzeugen hatte, blieb es bis zum Kriegsende im Einsatz. Das Fahrzeug wurde schließlich von den Briten, den Freien Franzosen und der Sowjetunion eingesetzt und von Ländern wie Israel erworben."
american_medium_tank_destroyer_equipment_3_short:0	"M10 Achilles"
american_medium_tank_destroyer_equipment_3_desc:0	"Einheitentyp: Mittlerer Panzerjäger"
american_medium_tank_destroyer_equipment_4_short:0	"M36 Jackson"
american_medium_tank_destroyer_equipment_4_desc:0	"Einheitstyp: Mittlerer Panzerjäger" \nDer 90-mm-Kanonenwagen M36 war ein Panzerjäger, der den Rumpf eines M10, der wiederum auf einem M4-Fahrgestell basierte, mit einer leistungsstarken 90-mm-Kanone kombinierte. Der M36 wurde entwickelt, um den M10 zu ersetzen, der gegenüber den überlegenen, schwereren Panzern des Feindes zunehmend veraltet war. Das Fahrzeug kam im Koreakrieg zum Einsatz, wo es Fahrzeuge der Nordkoreaner besiegte."
hellcat_equipment_1_short:0	"M18 Hellcat"
hellcat_equipment_1_desc:0	"Einheitentyp: Schneller Panzerjäger \nDer 76-mm-Kanonenwagen M18 war aufgrund seiner hohen Geschwindigkeit, seiner leistungsstarken Waffe und seines innovativen Automatikgetriebes einer der effektivsten Panzerjäger des Krieges. Im Gegensatz zum M10 und M36, die auf dem M4-Chassis basierten, wurde der M18 speziell als Panzerjäger konstruiert und setzte auf seine Geschwindigkeit als Verteidigungsmittel. Ähnlich wie der M4 war der M18 einfach herzustellen, zu warten und zu reparieren."
american_para_tank_equipment_1_short:0	"M22 Locust"
american_para_tank_equipment_1_desc:0	"Einheitstyp: Fallschirmtauglicher Panzer \nDer M22 Locust, offiziell bekannt als Light Tank (Airborne) 22, war ein speziell für den Lufttransport entwickelter leichter Panzer. Der Panzer entstand auf Wunsch der Briten als Ersatz für den Mark VII Tetrarch, der ursprünglich nicht als Luftlandepanzer konzipiert war. Das Fahrzeug sollte nicht mehr als 7,4 Tonnen wiegen, war mit einer 37-mm-M6-Hauptkanone und drei .30-M1919-Kanonen ausgestattet. Das Fahrzeug verfügte über einen motorisierten Turm mit Kanonenstabilisator, der es dem Panzer ermöglichte, während der Fahrt zu feuern. Obwohl ursprünglich für den Transport mit einer Douglas C-54 Skymaster konzipiert, passte der Panzer in einen Hamilcar-Segelflugzeug. Der M22 Locust nahm an der Operation Varsity teil, der letzten Fallschirmoperation des Krieges."
