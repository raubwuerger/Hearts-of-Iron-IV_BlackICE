northamerican_pbj1_equipment:0	"PBJ-1 Patrouillenbomber"
northamerican_pbj1_equipment_desc:0	"Einheitstyp: Marinebomber" \n\n Abgeleitet vom B-25 Mitchell-Bomber war die PBJ -1 mit einem Bordsuchradar ausgestattet und für Patrouillen- und U-Boot-Abwehr-Einsätze genutzt. Bei seinem Einsatz durch das Marine Corps war das Flugzeug unter jedem Flügel mit acht 5-Zoll-Hochgeschwindigkeits-Flugzeugraketen bewaffnet.\n\nAusgemusterte B-25 können zu PBJ -1 umgebaut werden."
