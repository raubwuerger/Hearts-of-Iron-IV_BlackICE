american_heavy_tank_equipment_2_desc:0	"Einheitentyp: Schwerer Panzer" \nKann umgebaut werden von: M26 Pershing \n: Der Super Pershing war eine -bewaffnete Version des Pershing, die mit der 90-mm-M3-Kanone ausgerüstet war, die der deutschen 88-mm-KwK 43 entsprach. Der Super Pershing war mit der T15E1 90 mm bewaffnet und konnte die Frontpanzerung eines Tigers aus 3.000 Metern Entfernung durchschlagen. Der Panzer wies dieselben Panzerungseigenschaften wie ein Pershing auf."
