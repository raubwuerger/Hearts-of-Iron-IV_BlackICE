usa_boeing_p26_equipment:0	"P-26 Interceptor"
usa_boeing_p26_equipment_desc:0	 "Einheitstyp: Abfangjäger\n\nDie Boeing P-26 war das erste serienmäßige Jagdflugzeug und Verfolgungs-Eindecker aus Vollmetall. Das Flugzeug wurde von Pratt & Whitney R-1340-33-Motoren angetrieben und hatte eine hohe Landegeschwindigkeit, was sich für viele Piloten als schwierig erwies. Aufgrund seiner geringen Größe wurde das Flugzeug liebevoll als "Peas hooter". Zur Bewaffnung gehörten zwei .30-Kaliber-M1919-Browning-Maschinengewehre oder ein .30-Kaliber-M1919- und ein .50-Kaliber-Maschinengewehr."
republic_p43_equipment:0	"P-43 Interceptor"
republic_p43_equipment_desc:0	"Einheitentyp: Abfangjäger \n\n Die Republic P-43 Lancer war ein einmotoriges, vollmetallisches Tiefdecker-Jagdflugzeug mit sehr guter Leistung in großen Höhen und verfügte über ein wirksames Sauerstoffsystem für den Piloten. Das Flugzeug war außergewöhnlich gut für Langstreckenflüge geeignet und wurde in dieser Hinsicht nur von der Lockheed P-38 Lightning übertroffen. Aufgrund seiner hohen Geschwindigkeit und seiner Fähigkeiten in großen Höhen wurde die P-43 für Luftaufklärungsmissionen eingesetzt. Das Flugzeug war mit vier .50-Kaliber-M2-Browning-Maschinengewehren gut bewaffnet."
republic_p47j_equipment:0	" P-47M Thunderbolt Abfangjäger"
republic_p47j_equipment_desc:0	"Einheitstyp: Abfangjäger \n\n Angesichts der fortschrittlichen Technologie des Feindes entwickelte Republic eine Hochgeschwindigkeitsvariante der P-47. Der Motor wurde durch einen 2.800 PS starken R -2800-57C mit einem leistungsstarken Kompressor, Bremsklappen und einem verbesserten Propeller. Insgesamt stieg die Höchstgeschwindigkeit des Flugzeugs auf 473 mph. Die Bewaffnung des Flugzeugs blieb unverändert gegenüber anderen Modellen: acht 0,52-Zoll-M2-Browning-Maschinengewehre, vier in jedem Flügel."
boeing_f4b4_equipment_1_desc:0	" Kampfflugzeuge sind dafür ausgelegt, feindliche Flugzeuge abzufangen und zu zerstören. Trägerjäger sind Kampfflugzeuge, die für den Einsatz von Flugzeugträgern aus modifiziert oder konstruiert wurden."
grumman_ff_equipment_1_short:0	"FF Carrier Fighter"
grumman_ff_equipment_1_desc:0	"Kampfflugzeuge sind dafür ausgelegt, feindliche Flugzeuge abzufangen und zu zerstören. Trägerjäger sind Kampfflugzeuge, die für den Einsatz von Flugzeugträgern aus modifiziert oder konstruiert wurden."
grumman_f2f_equipment_1_short:0	"F2F Carrier Fighter"
grumman_f3f_equipment_1:0	"Grumman F3F Flying Barrel"
brewster_f2a_equipment_1:0	"Brewster F2A Buffalo"
brewster_f2a_equipment_1_desc:0	"Einheitstyp: Trägerjäger \n\n Die Brewster F2A Buffalo war ein Trägerkampfflugzeug, das sich gegen Grummans F4F durchsetzte und zum ersten Eindecker der Marine wurde. Finnland bestellte mehrere Buffalos, die während des Winterkriegs und des Fortsetzungskriegs mit großem Erfolg eingesetzt wurden. Das Flugzeug war mit vier . 50-Kaliber-M2-Browning-Maschinengewehre, von denen zwei in der Nase und je eines in den Flügeln montiert waren. Eine spätere Variante verbesserte die Reichweite des Flugzeugs und ermöglichte den Transport von zwei 100-Pfund-Bomben. "
grumman_f4f_equipment_1_desc:0	"Einheitentyp: Trägerjäger \n\n Die Grumman F4F Wildcat begann ursprünglich als trägergestützter Doppeldecker, bevor sie als Eindecker mit der Bezeichnung F4F-2 neu konstruiert wurde, obwohl sie im Vergleich zur Brewster F2A Buffalo immer noch Defizite aufwies. Die F4F -3 wies einige Verbesserungen auf, doch Probleme mit den Maschinengewehren und dem Kompressor führten zu weiteren Verzögerungen. "
grumman_f4f_equipment_1_short:0	"F4F-Trägerjäger"
grumman_f4f_equipment_2_short:0	"F4F-4-Trägerjäger"
grumman_f6f_equipment_1:0	"Grumman F6F Hellcat"
grumman_f6f_equipment_2:0	"Grumman F6F-5 Hellcat"
grumman_f6f_equipment_2_desc:0	"Einheitstyp: Trägerjäger" \n\n Die Grumman F6F-5 Hellcat erhielt einen neuen Pratt & Whitney R -2800-10W-Motor mit Wassereinspritzung, der ihr 2.200 PS lieferte. Die meisten F6F-5 waren mit sechs .50-Kaliber-M2-Browning-Maschinengewehren bewaffnet, andere mit zwei .50-Kaliber-M2-Maschinengewehren und vier 20-mm-Hispano-Kanonen. Zusätzlich wurden zwei Waffengestelle installiert, die bis zu zwei 1.000-Pfund-, vier 500-Pfund- oder acht 250-Pfund-Bomben tragen konnten.\n\nVeraltete F6Fs können zu F6F-5 umgerüstet werden."
grumman_f8f_equipment_1_desc:0	"Einheitentyp: Trägerjäger \n\n Jagdflugzeuge sind dafür ausgelegt, feindliche Flugzeuge abzufangen und zu zerstören. Trägerjäger sind Jagdflugzeuge, die für den Einsatz von Flugzeugträgern aus modifiziert oder konstruiert wurden."
grumman_f8f_equipment_1_short:0	"F8F-Trägerjäger"
vought_corsair_equipment_1_short:0	"F4U-1 Navy Multirole"
vought_corsair_equipment_2:0	"Vought F4U-1C Corsair"
vought_supercorsair_equipment_1:0	"Goodyear F2G Super Corsair"
vought_supercorsair_equipment_1_desc:0	"Einheitstyp: Mehrzweck-Marinejäger" \n\n Die F2G Super Corsair war als Abfangjäger für den Einsatz in niedrigen Höhen konzipiert und wurde von Goodyear entwickelt, das bereits Erfahrung mit der Lizenzfertigung der F4U-1 gesammelt hatte. Die Flugzeugzelle der Corsair wurde modifiziert und erhielt eine Rundum-Kuppelkanopie sowie einen Pratt & Whitney R-4360-4-Motor mit 3.000 PS. Das Flugzeug war mit vier .50-M2-Browning-Maschinengewehren, acht 5-Zoll-Hochgeschwindigkeits-Flugzeugraketen und bis zu 1. 600 Pfund an Bomben. Obwohl die interne Treibstoffkapazität besser war als bei den F4Us, litt die F2G unter Problemen bei der Seitensteuerung und unzureichender Geschwindigkeit, woraufhin die Entwicklung eingestellt wurde."
vought_corsair_cv_equipment_1_desc:0	"Einheitstyp: Mehrzweck-Trägerkampfflugzeug \n\n Die F4U-1A verfügte über eine vereinfachte Windschutzscheibe und ein verbessertes Kabinendachdesign. Der Pilotensitz wurde um einige Zentimeter angehoben, um eine bessere Sicht über die lange Nase des Flugzeugs zu ermöglichen. Das Bombenschussfenster unter dem Cockpit wurde entfernt, und das Fahrwerk sowie die Unterwagenkonstruktion wurden verbessert, um den Aufpralleffekt bei der Landung auf Flugzeugträgern zu beseitigen.\n\nVeraltete F4U-1 können zu F4U-1A umgerüstet werden."
vought_corsair_cv_equipment_1_short:0	"F4U-1A Carrier Multirole"
vought_corsair_cv_equipment_2_short:0	"F4U-1D Carrier Multirole"
vought_corsair_cv_equipment_3:0	"Vought F4U-4 Corsair"
lakes_bg_equipment_1:0	"Great Lakes BG-1"
lakes_bg_equipment_1_short:0	"BG-1 Carrier CAS"
vought_sbu_equipment_1_desc:0	"Einheitstyp: Träger-CAS" \n\n Die Vought SBU Corsair war ein zweisitziger, vollständig aus Metall gefertigter Doppeldecker-Sturzbomber, der auf Voughts F3U -1-Zweisitzer-Jäger basierte, doch die Marine beschloss, auf den Einsatz von zweisitzigen Jagdflugzeugen zu verzichten. Das Flugzeug verfügte über ein geschlossenes Cockpit, hatte ein festes Fahrwerk und war einer der ersten Aufklärungsbomber, der schneller als 200 Meilen pro Stunde flog. Es konnte eine 500 -Pfund-Bombe und war mit einem nach vorne feuernden .30-Kaliber-M1919-Browning-Maschinengewehr sowie einem weiteren .30-Kaliber-M1919-Maschinengewehr im hinteren Cockpit ausgestattet. "
vought_sbu_equipment_1_short:0	"SBU Carrier CAS"
northrop_bt_equipment_1_short:0	"BT Carrier CAS"
curtiss_sbc_equipment_1:0	"Curtiss SBC Helldiver"
vought_vindicator_equipment_1:0	"Vought SB2U Vindicator"
vought_vindicator_equipment_1_desc:0	"Einheitstyp: Träger-CAS" \n\n Die Vought SB2U Vindicator war ein trägergestützter Sturzkampfbomber und das erste Eindeckerflugzeug, das diese Rolle übernahm. Anfangs gab es zwei Vorschläge, einen Doppeldecker und einen Eindecker, da die United States Navy zögerte, moderne Flugzeugkonfigurationen zu verfolgen. Das Flugzeug trug eine 1.000-Pfund-Bombe oder zwei 500-Pfund-Bomben unter dem Rumpf und zwei 100-Pfund-Bomben oder acht 30-Pfund-Bomben unter jedem Flügel, was eine maximale Nutzlast von 1.500 Pfund ergab."
douglas_dauntless_equipment_1_short:0	"SBD Carrier CAS"
douglas_dauntless_equipment_1_desc:0	 "Einheitstyp: Träger-CAS \n\n Die Douglas SBD Dauntless (in Kreisen des Army Air Corps als A-24 Banshee bekannt) war ein Aufklärungs- und Sturzkampfbomber der Marine. Das Flugzeug, das liebevoll den Spitznamen "Slow but Deadly" (Langsam, aber tödlich) genannt, verfügte über eine große Reichweite, gute Flugeigenschaften, eine hohe Bombenlast, eine gute Verteidigungsbewaffnung und war robust. Die SBD-5 (A-24 Banshee) verfügte über einen 1.200-PS-Motor, zwei nach vorne feuernde .50-Kaliber-M2-Browning-Maschinengewehre und zwei .30-Kaliber-M1919-Browning-Maschinengewehre im Heck. Die Bombenlast betrug bis zu 2.250 Pfund. Das Flugzeug wurde in Serie produziert und war bei mehreren alliierten Nationen im Einsatz. "
brewster_sb2a_equipment_1_short:0	"SB2A Carrier CAS"
curtiss_sb2c_equipment_1:0	"Curtiss SB2C Helldiver"
curtiss_sb2c_equipment_2:0	"Curtiss SB2C-3 Helldiver "
curtiss_sb2c_equipment_2_desc:0	"Einheitstyp: Carrier CAS \n\n Die SB2C-3 war ein Versuch, die zahlreichen Probleme der SB2C zu beheben, zu denen ein fehlerhaftes elektrisches System, ein untermotorisiertes Triebwerk und ein komplexes Hydrauliksystem gehörten. Ein neues Triebwerk, das R -2600-20 Twin Wasp mit 1.900 PS und einem vierflügeligen Propeller, wodurch das Leistungsdefizit behoben wurde. Das Flugzeug trug die gleiche Nutzlast wie die Vorgängerversion: 2.000 Pfund Bomben in einem internen Bombenschacht oder je einen Mark-13-2-Torpedo und eine 500-Pfund-Bombe unter jedem Flügel. \n\nVeraltete SB2Cs können zu SB2C-3 umgerüstet werden."
btd_destroyer_equipment_1_desc:0	"Einheitentyp: Trägerbomber \n\n Der Douglas BTD Destroyer begann als Torpedo- und Sturzkampfbomber, der die Douglas SBD Dauntless und die Curtis SB2C Helldiver ersetzen sollte. Das Flugzeug mit der Bezeichnung XSB2D-1 war eine große einmotorige Mittelflüglerkonstruktion mit einem internen Bombenschacht und Unterflügelhalterungen für eine Kapazität von bis 4.200 Pfund an Bomben. Zur Verteidigungsbewaffnung gehörten zwei an den Tragflächen montierte .50-Kaliber-M2-Browning-Maschinengewehre sowie zwei ferngesteuerte Geschütztürme mit je zwei .50-Kaliber-M2-Maschinengewehren. Der Prototyp erwies sich als schneller, leistungsstärker und trug mehr Nutzlast als die SB2C Helldiver. Dann änderte die Marine ihre Anforderungen und verlangte nur noch einen Besatzungsmitglied, keine Verteidigungstürme, sowie mehr Treibstoff und die Fähigkeit, zwei Torpedos zu tragen. Das Design wurde überarbeitet und wurde zum BTD-1 Destroyer; jedoch beendete das Kriegsende die Produktion, wobei nur 28 Destroyers gebaut wurden."
btd_destroyer_equipment_1_short:0	"BTD-1 Trägerbomber"
