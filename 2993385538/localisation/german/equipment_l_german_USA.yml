USA_destroyer_1a:0	"Sampson-Klasse DD"
USA_destroyer_1b:0	 "Wickes-Klasse DD"
USA_destroyer_1c_desc:0	"Der Zerstörer der Clemson-Klasse übernahm viele Konstruktionselemente seines unmittelbaren Vorgängers, der Wickes-Klasse. Die Clemson-Klasse wies gegenüber der Wickes-Klasse ein verbessertes Seeverhalten auf und war mit 4-Zoll-/50-Kaliber-Hauptgeschützen, einer 3\ -Zoll-23-Kaliber-Flugabwehrkanone sowie 12 Torpedorohre. Die Klasse war in die Jahre gekommen und nahezu veraltet, bildete jedoch nach wie vor den Großteil der Zerstörerflotte der US-Marine."
USA_destroyer_1d:0	"Farragut-Klasse DD"
USA_destroyer_1e_desc:0	"DD"
USA_destroyer_1f:0	"Mahan-Klasse DD"
USA_destroyer_1g_desc:0	"DD"
USA_destroyer_1h:0	"DD der Bagley-Klasse"
USA_destroyer_1i_desc:0	"DD"
USA_destroyer_1j:0	"DD der Benham-Klasse"
USA_destroyer_2_desc:0	" Die Sims-Klasse war das größte "1500-Tonnen"-Modell mit einer stromlinienförmigeren Torpedoanordnung und einem längeren Rumpf. Verbesserungen bei der Feuerleitung ermöglichten mit den 5-Zoll-/38-Kaliber-Kanonen eine höhere Angriffsfähigkeit; außerdem verfügte das Schiff über 12 Torpedorohranlagen in der Mittellinie."
USA_destroyer_2b:0	"Benson-Klasse DD"
USA_destroyer_2c_desc:0	" Die Benson-Klasse war eine Klasse von Zerstörern der US-Marine, die zwischen 1939 und 1943 gebaut wurden. Die dreißig 1.620-Tonnen-Zerstörer der Benson-Klasse wurden in zwei Gruppen gebaut. Die ersten sechs wurden im Haushaltsjahr 1938 (FY38) genehmigt und bei Bethlehem Steel in Quincy, Massachusetts, sowie in drei Marinewerften auf Kiel gelegt. Die verbleibenden 24 "Wiederholungs-Bensons" wurden 1940–42 genehmigt und in vier Werften von Bethlehem Steel gebaut. Sie wurden auf Kiel gelegt, nachdem die erste Gruppe in Dienst gestellt worden war. Diese sowie die "Repeat Livermores" (auch bekannt als "Repeat Gleaveses") wurden damals auch als Bristol-Klasse bezeichnet. Die Zerstörer der Benson- und Gleaves-Klasse bildeten das Rückgrat der Neutralitätspatrouillen der Vorkriegszeit und trugen durch ihre Teilnahme an allen großen Feldzügen des Krieges aktiv zur Bekämpfung des Feindes bei."
USA_destroyer_3:0	 "Fletcher-Klasse DD"
USA_destroyer_4_desc:0	"Die Sumner-Klasse knüpfte an die Fletcher-Klasse an, wobei die Verdrängung nur geringfügig erhöht wurde. Das Schiff konnte mehr Bewaffnung aufnehmen und erhielt zwei 5-Zoll-Kanonen vom Kaliber 38 sowie eine deutlich umfangreichere Ausrüstung an Flugabwehrwaffen. Die Hinzufügung eines zweiten Ruders ermöglichte eine verbesserte Manövrierfähigkeit bei U-Boot-Abwehr-Einsätzen."
USA_destroyer_5:0	"Zerstörer der Robert-H.-Smith-Klasse"
USA_destroyer_6_desc:0	"Die Gearing-Klasse ist eine Gruppe von 98 Zerstörern, die während und kurz nach dem Zweiten Weltkrieg für die US-Marine gebaut wurden. Das Gearing-Design war eine geringfügige Modifikation der unmittelbar vorangegangenen Allen-M.-Sumner-Klasse. Der Rumpf wurde mittschiffs um 14 ft (4,3 m) verlängert, wodurch mehr Stauraum für Treibstoff und eine höhere Geschwindigkeit geschaffen wurden, was den Schiffen eine größere Reichweite als den Schiffen der Allen-M.-Sumner-Klasse verlieh."
USA_light_cruiser_1:0	"Omaha-Klasse CL"
USA_light_cruiser_2_desc:0	"Die Brooklyn-Klasse wurde unter Berücksichtigung des Washingtoner Flottenvertrags entworfen und war daher auf 6-Zoll-Geschütze beschränkt. Um die Feuerkraft zu maximieren, wurde die Brooklyn mit 15 der neuen Mk16-6-Zoll-Kanonen in Dreifachtürmen ausgerüstet. Das Gesamtdesign war sehr ausgewogen und galt als Grundlage für alle zukünftigen Kreuzerentwürfe der US-Marine."
USA_light_cruiser_2b:0	"St-Louis-Klasse CL"
USA_light_cruiser_3_desc:0	"Die Cleveland-Klasse basierte auf der Brooklyn-Klasse, unterlag jedoch nicht den Beschränkungen des Washingtoner Flottenvertrags. Die Cleveland-Klasse behielt die Anordnung von 15 6-Zoll-Hauptgeschützen bei, verstärkte jedoch ihre sekundäre 5-Zoll-Bewaffnung erheblich und fügte zusätzliche Flugabwehrwaffen hinzu."
USA_light_cruiser_4:0	"Fargo-Klasse CL "
USA_light_cruiser_5_desc:0	"Die Worcester-Klasse war eine Klasse leichter Kreuzer der United States Navy, deren Bau 1945 begonnen wurde und die 1948–49 in Dienst gestellt wurden. Die Anordnung der Hauptbatterie war charakteristisch, da sie im Gegensatz zu den früheren leichten Kreuzern der Cleveland-, St. Louis- und Brooklyn-Klasse aus Doppel- statt Dreifachtürmen bestand. Abgesehen davon bestand die Hauptbatterie der Worcester-Klasse aus 6-Zoll- (152 mm) statt 5-Zoll- (127 mm) Geschützen, war die Anordnung identisch mit der der wesentlich kleineren leichten Kreuzer der Juneau-Klasse, die 12 Geschütze in sechs Türmen trugen, drei im Bug und drei im Heck, wobei nur die Türme 3 und 4 überlappend feuerten."
USA_AA_light_cruiser_1:0	"Atlanta-Klasse CLAA"
USA_AA_light_cruiser_2_desc:0	"Die Kreuzer der Juneau-Klasse waren leichte Kreuzer der United States Navy, die eine modifizierte Version des Kreuzerentwurfs der Atlanta-Klasse."
USA_heavy_cruiser_1:0	"CA der Pensacola-Klasse"
USA_heavy_cruiser_1c:0	"CA der Portland-Klasse"
USA_heavy_cruiser_1d:0	"CA der New Orleans-Klasse"
USA_heavy_cruiser_3:0	"Baltimore-Klasse CA"
USA_heavy_cruiser_3_desc:0	"Die Baltimore-Klasse vereinte die erfolgreicheren Elemente früherer Kreuzerentwürfe und basierte weitgehend auf dem leichten Kreuzer der Brooklyn-Klasse, kombiniert mit Konfigurationen hinsichtlich Bewaffnung und Panzerung der USS Wichita."
USA_heavy_cruiser_5:0	"Des Moines-Klasse CA"
USA_heavy_cruiser_5_desc:0	 "Die Kreuzer der Des-Moines-Klasse waren ein Trio schwerer Kreuzer der US-Marine, die zwischen 1948 und 1949 in Dienst gestellt wurden. Sie waren die letzten der rein mit Geschützen bestückten schweren Kreuzer und wurden in der amerikanischen Marine an Größe nur von den Kreuzern der Alaska-Klasse übertroffen, die die Grenze zwischen schwerem Kreuzer und Schlachtkreuzer überschritten. Die Des-Moines-Klasse verfügte über eine stärkere Batterie kleiner Kaliber-Flugabwehrgeschützen, darunter 12 Doppelgeschütze vom Typ 3-Zoll/50 Mk27 und später Mk33, die gegenüber den vierfach montierten 40-mm-Bofors-Geschützen früherer Schiffe als überlegen gegenüber den damaligen Luftbedrohungen galten."
USA_battle_cruiser_2:0	"Alaska-Klasse BC"
USA_battle_cruiser_2_desc:0	"Die Alaska-Klasse war eine Reaktion auf die deutschen Taschen-Schlachtschiffe, mittlerweile jedoch eher auf Japans "Superkreuzer". Die Klasse war für den Einsatz von 12-Zoll-Kanonen und die Abwehr von bis zu 10-Zoll-Granaten ausgelegt und erreichte Kreuzergeschwindigkeiten, opferte jedoch den Unterwasserschutz."
USA_battleship_1b_desc:0	"Die Schlachtschiffe der New-York-Klasse waren die ersten US-Schlachtschiffe, die mit 14-Zoll-Hauptgeschützen des Kalibers 45 ausgerüstet waren. Zahlreiche 5-Zoll-Geschütze des Kalibers 51 bildeten die Sekundärbewaffnung, und die Panzerung betrug über 10 Zoll."
USA_battleship_1c:0	"Schlachtschiffe der Nevada-Klasse"
USA_battleship_1f:0	"Schlachtschiffe der Tennessee-Klasse"
USA_battleship_1g:0	"Schlachtschiffe der Colorado-Klasse"
USA_battleship_2_desc:0	 "Die North-Carolina-Klasse war ein anspruchsvolles Konstruktionsprojekt und die erste Schlachtschiffklasse, die von der US-Marine seit 20 Jahren gebaut wurde. Die US-Marine verlangte, dass diese Klasse die Standards des Washingtoner Flottenvertrags erfüllte, auf 36.000 Tonnen begrenzt war, dennoch mit 16-Zoll-Kanonen des Kalibers 45 bewaffnet war und über eine verbesserte Panzerung verfügte, während sie gleichzeitig in der Lage sein sollte, die schnellen Flugzeugträger der US-Marine zu eskortieren."
USA_battleship_2b:0	" BB der South-Dakota-Klasse"
USA_battleship_3_desc:0	"Die Iowa-Klasse übernahm alle Innovationen und Fähigkeiten der früheren North-Carolina-Klasse, erhöhte jedoch deren Verdrängung und taktische Geschwindigkeit erheblich. Die Iowa-Klasse war in erster Linie für die Begleitung von Flugzeugträgergruppen zuständig und wurde mit Blick auf eine zweite Rolle als \"Kreuzerjäger\" konzipiert."
USA_carrier_1:0	"Lexington-Klasse CV"
USA_carrier_2_desc:0	"Die Ranger-Klasse war die erste Klasse der US-Marine, die von Grund auf als Flugzeugträger konzipiert wurde. Als Teil eines Konzepts der US-Marine für kleinere Flugzeugträger war die Klasse deutlich kleiner als die vorherige Lexington-Klasse, behielt jedoch dank Verbesserungen im Innenausbau die gleiche Luftgruppe bei."
USA_carrier_2b:0	"Yorktown-Klasse CV"
USA_carrier_2c_desc:0	"Die USS Wasp (CV-7) war ein Flugzeugträger der US-Marine, der 1940 in Dienst gestellt wurde. Als verkleinerte Version des Rumpfes der Yorktown-Klasse war die Wasp anfälliger als andere US-Flugzeugträger, die zu Beginn der Feindseligkeiten zur Verfügung standen. Die Wasp lief mit fast keiner Panzerung, mäßiger Geschwindigkeit und einer kleineren Flugzeuggruppe vom Stapel."
USA_carrier_3:0	"Essex-Klasse CV"
USA_carrier_4_desc:0	"Die Midway-Klasse stellte den Höhepunkt der Flugzeugträgerkapazitäten der US-Marine dar. Ausgestattet mit einem gepanzerten Deck und der Fähigkeit, weitaus mehr Flugzeuge als frühere Klassen zu transportieren, erhielt die Midway-Klasse eine eigene Unterklassenbezeichnung: CVB (Carrier Vessel Battle)."
USA_lcarrier_1:0	"Independence-Klasse CVL"
USA_lcarrier_2_desc:0	"Die Flugzeugträger der Saipan-Klasse waren eine Klasse von zwei leichten Trägern, der Saipan (CVL-48) und der Wright (CVL-49), die für die US-Marine gebaut wurden. Wie die neun leichten Träger der Independence-Klasse basierten sie auf Kreuzerrümpfen. Insgesamt handelte es sich um ein im Vergleich zur Independence-Klasse überlegenes Trägerdesign."
USA_ecarrier_1:0	"CVE der Long-Island-Klasse"
USA_ecarrier_2_desc:0	"Die Bogue-Klasse war eine Klasse von 45 Begleitträgern, die in den Vereinigten Staaten für den Dienst bei der US-Marine und (im Rahmen des Leih- und Pachtgesetzes) bei der Royal Navy gebaut wurden. Diese Schiffe waren mit einer Vielzahl von Waffen ausgerüstet, darunter ein oder zwei Hauptgeschütze vom Kaliber 4 Zoll/50, 5 Zoll/38 oder 5 Zoll/51. Hinzu kamen 40-mm-Bofors- und 20-mm-Oerlikon-Geschütze. Die Art des Hauptgeschützes und die Anzahl der kleineren Geschütze änderten sich im Laufe des Krieges. Sie konnten bis zu 28 Flugzeuge transportieren."
USA_ecarrier_3:0	"Sangamon-Klasse CVE"
USA_ecarrier_4_desc:0	" Die Begleitträger der Casablanca-Klasse sind die zahlreichste Klasse von Flugzeugträgern, die jemals gebaut wurde. Fünfzig wurden innerhalb von weniger als zwei Jahren – vom 3. November 1942 bis zum 8. Juli 1944 – auf Kiel gelegt, vom Stapel gelassen und in Dienst gestellt. Dies entsprach fast einem Drittel der 151 Träger, die während des Krieges in den Vereinigten Staaten gebaut wurden. Sie verfügten über ein größeres und zweckmäßigeres Hangardeck als frühere Umbauten. Außerdem verfügten sie über ein größeres Flugdeck als die Bogue-Klasse. Im Gegensatz zu größeren Flugzeugträgern, die über eine umfangreiche Panzerung verfügten, beschränkte sich der Schutz auf Splitterpanzerung, weshalb die Konstruktion der Träger sehr anfällig war."
USA_ecarrier_5:0	"Commencement Bay-Klasse CVE"
USA_SH_battleship_1_desc:0	"Die Montana-Klasse war größer und besser gepanzert als die Illinois-Klasse, wobei zugunsten dieser Vergrößerung Abstriche bei der Geschwindigkeit gemacht wurden. Mit ihrer Hauptbewaffnung aus 12 x 18-Zoll-Kanonen (Kaliber 50) und unserem neuesten Feuerleitsystem wird die Feuerkraft der Montana unübertroffen sein. Die ursprünglichen Entwürfe sahen 6-Zoll-Kanonen vor, doch dies wurde geändert, um zu den doppelt nutzbaren 5-Zoll-Doppeltürmen zurückzukehren."
usn_patrol_submarine_1:0	"O-Klasse"
usn_patrol_submarine_2_desc:0	" "
usn_patrol_submarine_3:0	"S-Klasse"
usn_patrol_submarine_4_desc:0	"V-1- bis V-3-Boote. Die ersten drei V-Boote wurden im Haushaltsjahr 1919 finanziert, im Oktober und November 1921 in der Portsmouth Navy Yard auf Kiel gelegt und zwischen 1924 und 1926 im Abstand von etwas weniger als einem Jahr in Dienst gestellt. Bezeichnenderweise waren die V-1, V-2 und V-3 die einzigen Mitglieder der Klasse waren, die darauf ausgelegt waren, die ursprünglichen Anforderungen der Marine an ein "Flottenboot" hinsichtlich hoher Geschwindigkeit über Wasser zu erfüllen. Es handelte sich um große U-Boote mit leistungsstarken Motoren, die bei einer Länge von 342 Fuß (104 m). Sie waren mit sechs 21-Zoll-Torpedorohre (533 mm) – vier im Bug und zwei im Heck – mit 12 Torpedos sowie einer 5-Zoll-Deckkanone (127 mm/Kaliber 51) bewaffnet."
usn_patrol_submarine_5:0	"Argonaut-Klasse"
usn_patrol_submarine_6_desc:0	" V-5- und V-6-Boote. In ihrem Gesamterscheinungsbild und ihren Abmessungen ähnelten die V-5 (später Narwhal) und die V-6 (später Nautilus) der Argonaut und stellten "U-Boot-Kreuzer" dar, die zumindest teilweise von den deutschen Erfolgen mit den weitreichenden Handelsraub-U-Booten der Klassen U-139 und U-151 im Ersten Weltkrieg inspiriert waren. Ausdauer, Seetüchtigkeit, erhöhte Torpedokapazität und große Deckgeschütze standen im Vordergrund, auf Kosten der Höchstgeschwindigkeit. Zusätzlich zu den üblichen Torpedorohren – vier im Bug und zwei im Heck mit 24 Torpedos (acht extern) – trugen sie (und die Argonaut) zwei 6-Zoll-Deckgeschütze (152 mm) Kaliber 53, die größten, die jemals auf US-U-Booten montiert wurden. "
usn_patrol_submarine_7:0	"Dolphin-Klasse"
usn_patrol_submarine_8_desc:0	"V-8- und V-9-Boote. Die U-Boote der Cachalot-Klasse waren zwei mittelgroße U-Boote der United States Navy, die unter Einhaltung der Tonnagegrenzen des Londoner Flottenvertrags von 1930 gebaut wurden. Sie hießen ursprünglich V-8 und V-9 und waren daher als "V-Boote" bekannt, obwohl sie nichts mit den anderen sieben U-Booten zu tun hatten. Die Bewaffnung ähnelte der der Dolphin-Klasse: sechs 21-Zoll-Torpedorohre (533 mm) (4 am Bug, 2 am Heck) mit 16 Torpedos. Ein 3-Zoll-Deckgeschütz (76 mm)/ 50-Kaliber-Deckgeschütz, eine Verringerung des Geschützkalibers, die bis in die Anfangsphase des Zweiten Weltkriegs bestehen bleiben sollte. In den 1930er Jahren herrschte die Ansicht, dass ein größeres Geschütz U-Boot-Kapitäne dazu ermutigen würde, an der Oberfläche gegen überlegene U-Boot-Abwehrschiffe zu kämpfen, doch schließlich zeigte die Kriegserfahrung, dass ein größeres Geschütz erforderlich war."
usn_patrol_submarine_9:0	"Porpoise-Klasse (P-1)"
usn_patrol_submarine_9b_desc:0	"Auch bekannt als die P-3-Unterklasse. Die Shark-Klasse war eine Unterklasse der Boote der Porpoise-Serie."
usn_patrol_submarine_10:0	"Perch-Unterklasse (P-5)"
usn_patrol_submarine_11_desc:0	"Die U-Boote der Salmon-Klasse der US-Marine stellten in den 1930er Jahren einen wichtigen Entwicklungsschritt bei der Konzeption des "Flotten-U-Boots" dar. Als schrittweise Weiterentwicklung der vorherigen Porpoise-Klasse waren sie die erste US-U-Boot-Klasse, die mit einem zuverlässigen Antriebssystem 21 Knoten erreichte, was ihnen den Einsatz zusammen mit den Schlachtschiffen vom Typ "Standard" der Oberflächenflotte ermöglichte. Zudem ermöglichte ihre Reichweite von 11.000 Seemeilen (20.000 km) ohne Auftanken den Einsatz in japanischen Hoheitsgewässern."
usn_patrol_submarine_12:0	"Sargo-Klasse"
usn_patrol_submarine_13_desc:0	"Einschließlich der identischen Gar-Klasse. Das U-Boot der Tambor-Klasse war ein Entwurf der United States Navy, das vor allem während des Zweiten Weltkriegs zum Einsatz kam. Es war das erste vollwertige Flotten-U-Boot der US-Marine und befand sich zu Kriegsbeginn in unmittelbarer Nähe der Kampfhandlungen. Sechs U-Boote dieser Klasse befanden sich am 7. Dezember 1941 in hawaiianischen Gewässern oder im Zentralpazifik, wobei sich die Tautog während des Angriffs in Pearl Harbor befand."
usn_patrol_submarine_14:0	"Mackerel-Klasse"
usn_patrol_submarine_15_desc:0	" Die Gato-Klasse war eine Klasse von U-Booten, die für die United States Navy gebaut und zwischen 1941 und 1943 vom Stapel gelassen wurden; sie waren die erste in Serie gefertigte U-Boot-Klasse der USA im Zweiten Weltkrieg. Zusammen mit ihren Schwesterschiffen der Balao- und Tench-Klassen bildete ihr Design den Großteil der U-Boot-Flotte der United States Navy im Zweiten Weltkrieg. Benannt nach dem Führungsschiff der Klasse, der USS Gato, bildeten die Gatos und ihre Nachfolger den Kern der U-Boot-Flotte, die maßgeblich für die Zerstörung der japanischen Handelsmarine und eines großen Teils der Kaiserlich Japanischen Marine im Zweiten Weltkrieg verantwortlich war. Der Name "Gato" stammt von einer Art kleiner Katzenhaie."
usn_patrol_submarine_16:0	"Balao-Klasse"
##### |___KY024989 ___|„Dies stellt die Boote der Balao-Klasse in der GUPPY-Umrüstung dar. Die Balao-Klasse war ein erfolgreiches U-Boot-Design der United States Navy, das im Zweiten Weltkrieg eingesetzt wurde, und mit 120 fertiggestellten Einheiten die größte U-Boot-Klasse der US-Marine. Als Weiterentwicklung der früheren Gato-Klasse wiesen die Boote geringfügige interne Unterschiede auf. Die bedeutendste Verbesserung war die Verwendung von dickerem Stahl mit höherer Streckgrenze für die Außenhaut und die Spanten des Druckkörpers, wodurch ihre Testtauchtiefe auf 400 Fuß (120 m) erhöht wurde.“
usn_patrol_submarine_17:0	" Tench-Klasse"
usn_patrol_submarine_17b_desc:0	"Dies stellt die GUPPY-umgerüsteten Boote der Tench-Klasse dar. U-Boote der Tench-Klasse waren ein für die US-Marine (USN) zwischen 1944 und 1951 gebaut wurden. Sie stellten eine evolutionäre Weiterentwicklung der Gato- und Balao-Klassen dar, waren nur etwa 35 bis 40 Tonnen größer, aber robuster gebaut und wiesen eine leicht verbesserte Innenanordnung auf. Einer der Ballasttanks wurde für den Transport von Treibstoff umgerüstet, wodurch sich die Reichweite von 11.000 Seemeilen (20.000 km; 13. 000 Meilen bei 10 Knoten) auf 16.000 Seemeilen (30.000 km; 18.000 Meilen bei 10 Knoten)."
usn_patrol_submarine_18:0	"Barracuda-Klasse SSK"
usn_patrol_submarine_19_desc:0	" GM EMD 16-338-Dieselmotoren an Bord. Die U-Boote der Tang-Klasse waren eine amerikanische U-Boot-Klasse, die aus dem GUPPY-Umrüstungsprogramm für U-Boote des Zweiten Weltkriegs hervorging, bei dem deutsche U-Boot-Technologie des Typs XXI in das U-Boot-Design der United States Navy integriert wurde. Sie stellten den Stand der Technik im Bereich der konventionell angetriebenen U-Boote nach dem Zweiten Weltkrieg dar; einige ihrer Merkmale flossen in die atomgetriebenen U-Boote ein, die sie in den 1950er Jahren und darüber hinaus ersetzten. Eine erfolglose Neuerung des Tang-Entwurfs war der leichte, kompakte und schnelle "Pancake"-Motor EMD 16-338 von General Motors. Als die Boote Anfang der 1950er Jahre in See stachen, funktionierten die neuen Motoren nicht gut. Ihre kompakte Bauweise erschwerte die Wartung, und es kam häufig zu Ölleckagen in die Generatoren. Im Jahr 1956 beschloss die Marine, die "Pancake"-Motoren durch zehnzylindrige Fairbanks-Morse-Dieselmotoren vom Typ 38D 8-1/8 mit gegenüberliegenden Kolben zu ersetzen. "
usn_patrol_submarine_20:0	"Tang-Klasse (Block II)"
usn_patrol_submarine_21_desc:0	"Die USS Nautilus (SSN-571) war das weltweit erste einsatzfähige atomgetriebene U-Boot. Das Schiff war das erste U-Boot, das am 3. August 1958 eine Unterwasserfahrt um den Nordpol absolvierte. Benannt nach einer anderen USS Nautilus (SS-168, ein V-Boot) , das sich im Zweiten Weltkrieg ausgezeichnet hatte, wurde die neue atomgetriebene Nautilus 1951 genehmigt, 1952 auf Kiel gelegt und im Januar 1954 in Anwesenheit von Mamie Eisenhower, First Lady der Vereinigten Staaten und Ehefrau des 34. Präsidenten Dwight D. Eisenhower, vom Stapel gelassen; im darauffolgenden September wurde sie in die United States Navy aufgenommen. Der endgültige Bau wurde 1955 abgeschlossen."
