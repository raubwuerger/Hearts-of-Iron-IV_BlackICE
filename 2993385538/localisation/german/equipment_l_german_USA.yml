USA_mechanized_equipment_1_desc:0	"Mechanisierte Kavallerie ist Infanterie, die mit gepanzerten Mannschaftstransportwagen (APCs) oder Schützenpanzern (IFVs) für Transport und Kampf ausgerüstet ist. Mechanisierte Kavallerie unterscheidet sich von motorisierter Infanterie dadurch, dass ihre Fahrzeuge einen gewissen Schutz vor feindlichem Feuer bieten, im Gegensatz zu den ungepanzerten Radfahrzeugen (Lastwagen oder Jeeps) der motorisierten Infanterie."
