tech_northamerican_pbj1_equipment_1:0	"North American PBJ-1 Mitchell"
martin_pbm_equipment_1_short:0	"PBM-Flugboot"
martin_pbm_equipment_1:0	"Martin PBM Mariner"
consolidated_pb2y_equipment_desc:0	 "Einheitstyp: Flugboot \n\n Die PB2Y wurde als nächste Generation von Flugbooten und Patrouillenbombern konzipiert. Das Flugzeug verfügte über vier Pratt & Whitney R-1830-Sternmotoren, und wie bei der PBY Catalina konnten die Flügelspitzen-Schwimmer eingefahren werden, um den Luftwiderstand zu verringern und die Reichweite des Flugzeugs zu erhöhen. Ausgestattet mit sechs .50 M2 Browning-Maschinengewehre in motorisierten Türmen an Bug, Rücken und Heck sowie der Fähigkeit, zwei Mark-13-Torpedos oder 12.000 Pfund Bomben zu tragen, stellte das Flugzeug eine erhebliche Verbesserung gegenüber der PBY Catalina dar. Allerdings kostete das Flugzeug fast dreimal so viel wie sein Vorgänger und wurde nicht in großen Stückzahlen produziert."
consolidated_pb2y_equipment_1_short:0	"PB2Y-Flugboot"
consolidated_pby_equipment:0	"Consolidated PBY Catalina"
consolidated_pby_equipment_desc:0	"Einheitstyp: Flugboot \n\n Die Consolidated PBY Catalina war ein Flugboot und Amphibienflugzeug, das in allen Teilstreitkräften der US-Streitkräfte zum Einsatz kam und in Kanada als Canso bekannt war. Das ursprüngliche Konzept sah ein Flugzeug als Patrouillenbomber mit großer Reichweite vor, um feindliche Transportschiffe aufzuspüren und anzugreifen. Das Flugzeug kam im U-Boot-Abwehrkampf, bei Patrouillenbombardements, zur Konvoibegleitung sowie bei Such- und Rettungsaktionen zum Einsatz und wird heute als Löschflugzeug für die Brandbekämpfung aus der Luft genutzt. Das Flugzeug verfügte über eine Verteidigungsbewaffnung aus drei Maschinengewehren vom Typ .30 M1919 und zwei Maschinengewehren vom Kaliber .50 und konnte 4.000 Pfund an Bomben, Wasserbomben oder Torpedo-Halterungen mitführen."
consolidated_pby_equipment_1_desc:0	 "Einheitstyp: Flugboot \n\n Die Consolidated PBY Catalina war ein Flugboot und Amphibienflugzeug, das bei allen Teilstreitkräften der US-Streitkräfte im Einsatz stand und in Kanada als Canso bekannt war. Das ursprüngliche Konzept sah ein Patrouillenbomberflugzeug mit großer Reichweite vor, um feindliche Transportschiffe aufzuspüren und anschließend anzugreifen. Das Flugzeug kam in der U-Boot-Bekämpfung, bei Patrouillenbombardements, zur Konvoibegleitung sowie bei Such- und Rettungsaktionen zum Einsatz und wird heute als Löschflugzeug für die Brandbekämpfung aus der Luft genutzt. Das Flugzeug verfügte über eine Verteidigungsbewaffnung aus drei Maschinengewehren vom Typ .30 M1919 und zwei Maschinengewehren vom Kaliber .50 und konnte 4.000 Pfund an Bomben, Wasserbomben oder Torpedos mitführen."
consolidated_pby_equipment_2_short:0	"PBY-3 Flying Boat"
consolidated_p2y_equipment:0	"Consolidated P2Y Commodore"
consolidated_p2y_equipment_desc:0	"Flugboote sind große Amphibienflugzeuge, die zur Aufklärung und zum Angriff auf feindliche Flotten eingesetzt werden. Obwohl sie oft eine größere Nutzlast und Bewaffnung mitführen als Marinebomber, sind Flugboote in der Regel anfällig für Abfangmanöver."
consolidated_p2y_equipment_1_desc:0	"Flugboote sind große Amphibienflugzeuge, die zur Aufklärung und zum Angriff auf feindliche Flotten eingesetzt werden. Obwohl sie oft eine größere Nutzlast und Bewaffnung mitführen als Marinebomber, sind Flugboote in der Regel anfällig für Abfangmanöver."
bell_p59_equipment:0	"P-59-Düsenjäger"
bell_p59_equipment_1_desc:0	"Die Bell P-59 Airacomet war ein einsitziger Düsenjäger mit zwei Triebwerken. Die P-59 hatte einen ovalen Querschnitt, eine Ganzmetallhaut und einen Rumpf mit einem Druckcockpit. Die Tragflächen waren, wie bei Kolbenmotor-Jägern, gerade Flügel mit Holmen. Die Bewaffnung bestand aus einer 37-mm-M10-Maschinenkanone und drei .50-M2-Browning-Maschinengewehren. Aufgrund der geringen Leistung, die hinter den Erwartungen zurückblieb, ging das Flugzeug nicht in Serie. Obwohl der Kampfpilot Chuck Yeager von den ruhigen Flugeigenschaften des Flugzeugs beeindruckt war, zeigte er sich enttäuscht von dessen Geschwindigkeit, die nur geringfügig über der von Flugzeugen mit Kolbenmotor lag."
bell_p59_equipment_1_short:0	"P-59 Airacomet-Düsenjäger"
bell_p83_equipment_1:0	"Bell P-83-Düsenjäger"
bell_p83_equipment_1_desc:0	"Düsenjäger sind Kampfflugzeuge, die von Strahltriebwerken angetrieben werden. Sie sind dafür ausgelegt, feindliche Flugzeuge anzugreifen und zu zerstören."
lockheed_p80_equipment_desc:0	"Einheitstyp: Düsenjäger \n\n Die Lockheed P-80 Shooting Star war der erste Düsenjäger der Army Air Forces und wurde innerhalb von 143 Tagen nach der Entdeckung feindlicher Düsenflugzeuge entworfen, gebaut und ausgeliefert. Zwei Flugzeuge kamen in den letzten Kriegsmonaten in Italien in begrenztem Umfang zum Einsatz. Das Flugzeug war mit sechs 0,50-Zoll-M2-Browning-Maschinengewehren und acht 5-Zoll-Hochgeschwindigkeits-Flugzeugraketen bewaffnet und konnte zwei 1.000-Pfund-Bomben tragen. Die P-80 wurde in Korea ausgiebig eingesetzt, bevor sie auf die MiG-15 traf und durch die F-86 Sabre ersetzt wurde."
lockheed_p80_equipment_1_short:0	"P-80A Jet Multirole"
lockheed_p80_equipment_1_desc:0	"Einheitstyp: Düsenjäger \n\n Die Lockheed P-80 Shooting Star war der erste Düsenjäger der Army Air Forces und wurde innerhalb von 143 Tagen nach der Entdeckung feindlicher Düsenflugzeuge entworfen, gebaut und ausgeliefert. Zwei Flugzeuge kamen in den letzten Kriegsmonaten in Italien in begrenztem Umfang zum Einsatz. Das Flugzeug war mit sechs 0,50-Zoll-M2-Browning-Maschinengewehren und acht 5-Zoll-Hochgeschwindigkeits-Flugzeugraketen bewaffnet und konnte zwei 1.000-Pfund-Bomben tragen. Die P-80 wurde in Korea intensiv eingesetzt, bevor sie auf die MiG-15 traf und durch die F-86 Sabre ersetzt wurde."
