m4a3_equipment_desc:0	" Einheitstyp: Mittlerer Panzer \nDer M4A3 war mit einem Ford GAA V-8-Motor ausgestattet. Unter Beibehaltung der 75-mm-M3-Kanone wies der M4A3 geringfügige Verbesserungen auf, wie beispielsweise größere Fahrerkästen, und die Munitionslager wurden in Wassermänteln auf den Rumpfboden verlegt, um Brände an Bord zu verhindern."
