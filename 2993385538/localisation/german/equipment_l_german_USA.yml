northamerican_mustang_equipment:0	"P-51-Jäger"
northamerican_mustang_equipment_1:0	"North American P-51 Mustang"
northamerican_mustang_equipment_1_desc:0	"Einheitstyp: Jagdflugzeug" \n\n Die P-51 war ein , einsitziger Jäger und Jagdbomber, der von der Firma North American Aviation entworfen wurde, die ursprünglich beauftragt worden war, Curtiss P-40 Warhawks in Lizenz zu bauen. Stattdessen entwarf North American einen neuen, modernen Jäger, der ursprünglich von einem Allison V-1710-Motor angetrieben wurde, was die Leistung des Flugzeugs in großen Höhen beeinträchtigte. Die P-51 kam erstmals im Rahmen des Leih- und Pachtgesetzes bei der Royal Air Force zum Einsatz."
northamerican_mustang_equipment_2_desc:0	"Einheitstyp: Jagdflugzeug \n\n Bei der P-51D wurde die Bewaffnung des Flugzeugs auf sechs 0, 50-Kaliber-M2-Browning-Maschinengewehre und fügte Aufhängepunkte für eine 500-Pfund-Bombe hinzu. Spätere Varianten der P-51D-Serie verfügten über sechs bis zehn 5-Zoll-T64-Hochgeschwindigkeits-Flugzeugraketen.\n\nVeraltete P-51Bs können zu P-51Ds umgerüstet werden. "
vought_corsair_not_carrier_equipment:0	"F4U Fighter"
northamerican_p51b_equipment_1:0	"North American P-51B Mustang"
northamerican_p51b_equipment_1_desc:0	"Einheitstyp: Jäger" \n\n Die P-51B war eine Weiterentwicklung der früheren Version und ersetzte den Allison V-1710 durch den Rolls-Royce Merlin, was die Leistung des Flugzeugs in großen Höhen erheblich steigerte.\n\nVeraltete P-51 können zu P-51B umgerüstet werden."
northamerican_p51d_equipment_1_desc:0	"Einheitstyp: Jäger \n\n Die P-51D erweiterte die Bewaffnung des Flugzeugs auf sechs 0,50-Zoll-M2-Browning-Maschinengewehre und fügte Aufhängepunkte für eine 500-Pfund-Bombe hinzu. Spätere Varianten der P -51D-Serie umfassten sechs bis zehn 5-Zoll-T64-Hochgeschwindigkeits-Flugzeugraketen.\n\nVeraltete P-51Bs können zu P -51Ds umgerüstet werden."
northamerican_p51h_equipment:0	"P-51H-Jäger"
northamerican_p51h_equipment_1:0	"North American P-51H Mustang"
northamerican_p51h_equipment_1_desc:0	"Einheitstyp: Jagdflugzeug \n\n Die P-51H hatte wenig mit früheren Varianten gemeinsam, da sie ein kleineres Fahrwerk sowie einen modifizierten Rumpf erhielt, der schlanker, aber länger war. Die Räder wurden mit neuen Scheibenbremsen ausgestattet, und es wurde ein neuerer, leichterer Propeller eingebaut. Die Treibstoffmenge wurde ebenso wie die Munitionskapazität erhöht. Eine für den Einsatz bei der Marine modifizierte Variante der P-51H. Das Flugzeug erhielt Klappflügel, einen Fanghaken und zusätzliche Außenkraftstofftanks.\n\nAufgrund erheblicher Änderungen können veraltete P-51 NICHT zu P-51H umgerüstet werden."
consolidated_p30_equipment_desc:0	"Einheitstyp: Mehrzweckjäger\n\nDie Consolidated P-30 war ein zweisitziges Jagdflugzeug und der erste Jäger mit einziehbarem Fahrwerk, einem geschlossenen und beheizten Cockpit sowie einem abgasgetriebenen Turbolader. Als Antrieb diente ein Curtiss V-1570-57-Motor mit Turbolader. Zur Bewaffnung gehörten zwei M1919-Maschinengewehre vom Kaliber .30, die durch den Propeller feuerten, sowie ein M1919 im hinteren Cockpit. Die Nutzlast umfasste bis zu 180 Pfund an Bomben. Obwohl robust, war das Konzept eines zweisitzigen Jagdflugzeugs veraltet, und das Flugzeug wurde hauptsächlich zu Ausbildungszwecken eingesetzt."
consolidated_p30_equipment_1_desc:0	"Typ: Mehrzweckjäger\n\nDie Consolidated P-30 war ein zweisitziges Jagdflugzeug und der erste Jäger mit einziehbarem Fahrwerk, einem geschlossenen und beheizten Cockpit sowie einem abgasgetriebenen Turbolader. Als Antrieb diente ein Curtiss V-1570-57-Motor mit Turbolader. Zur Bewaffnung gehörten zwei M1919-Maschinengewehre vom Kaliber .30, die durch den Propeller feuerten, sowie ein M1919 im hinteren Cockpit. Die Nutzlast umfasste bis zu 180 Pfund an Bomben. Obwohl robust, war das Konzept eines zweisitzigen Jagdflugzeugs veraltet, und das Flugzeug wurde hauptsächlich zu Ausbildungszwecken eingesetzt."
seversky_a8v1_equipment_desc:0	" Einheitstyp: Mehrzweckjäger \n\n In den späten 1930er Jahren exportierte Seversky (später Republic Aviation Corporation) zweiundzwanzig zweisitzige 2PA-B3 für den Einsatz bei der Kaiserlich Japanischen Marinefliegertruppe. Das Flugzeug war eine Version der Seversky P-35."
##### |___KY0248 12___|„Seversky A8V1“
bell_p39_equipment:0	"P-39 Multi-Role"
bell_p39_equipment_desc:0	"Einheitstyp: Mehrzweckjäger \n\n Die Bell P-39 wies eine ungewöhnliche Konstruktion auf, bei der der Motor in der Mitte des Rumpfes hinter dem Piloten eingebaut war, und war der erste Jäger mit einem Dreiradfahrwerk. Die innovative Konstruktion wurde durch das Fehlen eines effizienten Turboladers beeinträchtigt."
bell_p39_equipment_1_short:0	"P-39 Multirole"
bell_p39_equipment_2:0	"Bell P-39N Airacobra"
republic_p47_equipment:0	"P-47C Multirole"
republic_p47_equipment_desc:0	"Einheitstyp: Mehrzweckjäger" \n\n Die Republic Aviation P-47 war ein einmotoriges Jagdflugzeug und mit acht Tonnen voll beladen eines der schwersten. Angetrieben von einem Pratt & Whitney R-2800 Double Wasp-Motor erreichte das Flugzeug eine gute Geschwindigkeit. Zur Bewaffnung gehörten acht .50-Kaliber-M2-Browning-Maschinengewehre, vier in jedem Flügel. Das Flugzeug diente als effektiver Kurz- bis Mittelstreckenjäger mit guter Leistung in großen Höhen."
republic_p47_equipment_1_short:0	"P-47C Multirole"
republic_p47d_equipment_1:0	"Republic P-47D Thunderbolt"
republic_p47n_equipment:0	"P-47N Thunderbolt Multi-Role"
republic_p47n_equipment_desc:0	"Einheitstyp: Mehrzweckjäger" \n\n Die P-47N war eine Langstreckenvariante der Thunderbolt. Mit einem neuen Pratt & Whitney R-2800-57-Triebwerk, größeren Tragflächen, erhöhter Treibstoffkapazität und dem Einbau eines Autopiloten für bestimmte Triebwerkssteuerungen wurde die Effizienz des Flugzeugs verbessert. Die P-47N wurde von den chinesischen Nationalisten gegen die chinesischen Kommunisten eingesetzt, wo sie sich über der Taiwanstraße Duelle lieferten.\n\nAufgrund erheblicher Änderungen können veraltete P-47Ds nicht zu P-47Ns umgerüstet werden."
republic_p47n_equipment_1_short:0	"P-47N Multirole"
