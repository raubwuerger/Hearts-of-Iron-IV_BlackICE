american_medium_tank_artillery_equipment_3_desc:0	"Einheitentyp: Mittlere selbstfahrende Artillerie" \nKann umgerüstet werden von: M3 Lee \nDer 155-mm-Gun-Motor-Carriage M12 war eine selbstfahrende Kanone, die auf Basis des M3-Fahrgestells entwickelt wurde. Aufgrund der Größe der Kanone war die Ladekapazität begrenzt, sodass nur zehn Schuss zur Verfügung standen. Am Heck des Fahrzeugs wurde eine Erdschaufel, die einem Bulldozer ähnelt, eingesetzt, um den Rückstoß abzufangen. Das Fahrzeug wurde häufig von einem Cargo Carrier M30 begleitet, der auf einem M3-Fahrgestell basierte und die Besatzung sowie zusätzliche Munition transportierte."
USA_american_medium_tank_artillery_equipment_2:0	"M7 Priest"
american_medium_tank_artillery_equipment_2_desc:0	"Einheitentyp: Mittlere selbstfahrende Artillerie \nUmrüstbar von: M3 Lee \nDer 105-mm-Haubitzen-Motorwagen M7 erhielt wegen seines predigtstuhlartigen Maschinengewehrrings den Spitznamen "Priest". Beobachter der Armee hatten erkannt, dass zur Unterstützung gepanzerter Operationen ein selbstfahrendes Artilleriefahrzeug benötigt würde, das gepanzert und vollständig kettengetrieben sein musste. Das veraltete M3-Fahrgestell diente als Plattform für den M7. Das Fahrzeug blieb bis in die 1960er Jahre im Einsatz."
USA_m4_equipment:0	"M4"
m4_equipment_desc:0	"Einheitstyp: Mittlerer Panzer \nDer mittlere Panzer M4, von den Briten "Sherman" genannt, war zuverlässig, kostengünstig in der Herstellung und ein weit verbreiteter mittlerer Panzer. Der M4 baute auf den Konstruktionsmerkmalen des M3 auf und wies eigene konstruktive Weiterentwicklungen auf, darunter einen Einachs-Gyrostabilisator. Der M4 war ausreichend gepanzert und in der Lage, die damalige feindliche Panzerung zu durchschlagen, wurde jedoch bald von schwereren Panzern überflügelt. Der M4 war schließlich der am zweithäufigsten produzierte Panzer des Krieges, hinter dem sowjetischen T-34."
