l_german:
RAJ_take_over_administrative_rights:	"Übernehmen Sie die Verwaltungsrechte"
RAJ_take_over_administrative_rights_desc:	"Um sich würdevoll aus der Region zurückzuziehen, hat die [ENG.GetAdjective] Regierung damit begonnen, Verwaltungsaufgaben an unsere Kompanieangestellten auszulagern."
RAJ_the_return_of_the_east_india_company:	"Die Rückkehr der East India Company"
RAJ_the_return_of_the_east_india_company_desc:	"Nach vielen Jahrzehnten der Abwesenheit soll die East India Company wieder gegründet werden, um den indischen Subkontinent mit rücksichtsloser Effizienz vollständig auszubeuten."
RAJ_the_return_of_the_east_india_company_tt:	"Die East India Investment Schemes and Taxes ist nun aktiv.\nUnlocks §Ydecisions§! to pay out dividends to investors"
RAJ_privatized_tutelage:	"Privatisierte Schulbildung"
RAJ_privatized_tutelage_desc:	"Die Bildung soll denjenigen vorbehalten sein, die ihrer würdig sind, indem ein streng privatisiertes System von Schulen und Colleges beibehalten wird, das frei von Gesindel ist."
RAJ_vertical_integration:	"Vertikale Integration"
RAJ_vertical_integration_desc:	"Die jüngsten Steuervermeidungsmaßnahmen sind von den Regierungen in Übersee relativ unbemerkt geblieben. Vielleicht können wir weitere Schlupflöcher nutzen, um unsere Steuern noch weiter zu senken."
RAJ_acquire_new_resources:	"Erwerben Sie neue Ressourcen"
RAJ_acquire_new_resources_desc:	"Unsere Industrie benötigt immer mehr Ressourcen, um die Nachfrage nach Waren zu befriedigen. Wir werden daher die arbeitslosen Massen in neuen Rohstoffverarbeitungsanlagen in unseren Betrieben einsetzen."
RAJ_corporate_expansion:	"Unternehmensexpansion"
RAJ_corporate_expansion_desc:	"Das Wirtschaftswachstum in unserem Kernportfolio hat zu einem Bevölkerungsboom geführt. Um ein anhaltendes Wachstum zu gewährleisten, werden wir unsere Infrastruktur ausbauen, um unsere zukünftigen Mitarbeiter unterzubringen."
RAJ_trade_federation_of_india:	"Rebranding"
RAJ_trade_federation_of_india_desc:	"Wir haben in den letzten Jahren ein historisches Wachstum erzielt und ein Maß an politischer Macht erlangt, von dem die meisten Konzerne nur träumen können. Einige Staaten, die unter unserer Kontrolle stehen, sind jedoch immer noch nicht mit der Herrschaft des Unternehmens einverstanden. Vielleicht könnte ein großer Geldzufluss sie überzeugen?"
RAJ_trade_federation_of_india_tt:	"Schaltet Entscheidungen für Staaten im Kernbesitz mit hoher Konformität frei, indem Sie den Faktor §YC-Verbrauchsgüterfabriken§! und §YPolitische Macht§! verwenden."
RAJ_the_varuna_class:	"Die Varuna Klasse"
RAJ_the_varuna_class_desc:	"Unser neuestes Großraumschiff ist eine kolossale technische Meisterleistung. Daher ist der einzige passende Name für dieses Schiff der eines Gottes."
RAJ_purchase_destroyers_and_subs:	"Zerstörer und U-Boote kaufen"
RAJ_purchase_destroyers_and_subs_desc:	"$SMB_purchase_destroyers_and_subs_desc$"
RAJ_purchase_cruisers_and_dreadnoughts:	"Kaufen Sie Kreuzer und Dreadnoughts"
RAJ_purchase_cruisers_and_dreadnoughts_desc:	"$SMB_purchase_cruisers_and_dreadnoughts_desc$"
RAJ_mineral_exploitation_institute:	"Institut für Mineralienausbeutung"
RAJ_mineral_exploitation_institute_desc:	"Die jüngsten Erschließungen im Bergbau haben nicht die Erträge gebracht, die wir von ihnen erwartet haben. Es scheint, dass wir in bessere geologische Untersuchungen investieren müssen, um die potenziellen Einnahmen aus unseren natürlichen Ressourcen besser abschätzen zu können."
RAJ_establish_the_reserve_bank_of_india:	"Die Reserve Bank of India gründen"
RAJ_establish_the_reserve_bank_of_india_desc:	"Um unsere Wirtschaft angemessen vor Schockwellen zu schützen, werden wir eine Reservebank einrichten, die die Aufgabe hat, unsere Währung zu kontrollieren."
RAJ_all_india_kisan_sabha:	"All India Kisan Sabha"
RAJ_all_india_kisan_sabha_desc:	"Die Bauern und Landwirte des ländlichen Indiens sind lange genug ausgebeutet worden. Es ist an der Zeit, dass sie sich organisieren und ihre Beschwerden kollektiv vorbringen."
RAJ_haripura_session_of_the_indian_national_congress:	"Zweite Haripura-Sitzung"
RAJ_haripura_session_of_the_indian_national_congress_desc:	"Da der Kapitalismus die globalen Spannungen antreibt, ist es an der Zeit, Swaraj als Kampf für Arbeiter und Bauern neu zu gestalten. Die Zweite Haripura-Sitzung wird uns unter einer revolutionären Vision vereinen, die imperialistische Allianzen ablehnt und den Kampf für ein klassenloses, selbständiges Indien in den Mittelpunkt stellt."
RAJ_the_second_gorkha_war:	"Der Zweite Gorkha-Krieg"
RAJ_the_second_gorkha_war_desc:	"Die Unabhängigkeit Nepals ist ein Relikt der Vergangenheit, das den Subkontinent, der vereint sein sollte, spaltet. Ein entschlossener Feldzug wird die Gorkhas einbinden und die Himalayas sichern."
RAJ_guarantee_nepalese_independence:	"Garantieren Sie die nepalesische Unabhängigkeit"
RAJ_guarantee_nepalese_independence_desc:	"Die Souveränität Nepals ist ein Symbol der Widerstandsfähigkeit gegen die imperiale Herrschaft. Indem wir seine Unabhängigkeit garantieren, schützen wir den Himalaya und sichern uns einen starken Verbündeten in unserem Kampf gegen den ausländischen Einfluss in der Region."
RAJ_ignite_the_sino_indian_war:	"Den Chinesisch-Indischen Krieg entfachen"
RAJ_ignite_the_sino_indian_war_desc:	"Die schwelenden Spannungen mit China wegen der Grenzstreitigkeiten können nicht länger ignoriert werden. Durch entschlossenes Handeln können wir unsere Vorherrschaft im Himalaya behaupten und unsere rechtmäßigen Territorien sichern. Ein kühner Schlag könnte das asiatische Machtgleichgewicht zu unseren Gunsten umgestalten."
RAJ_national_planning_committee:	"Nationaler Planungsausschuss"
RAJ_national_planning_committee_desc:	"Wirtschaftliche Autarkie ist die Grundlage für wahre Unabhängigkeit. Durch die Einrichtung des Nationalen Planungsausschusses können wir einen Kurs für Industrialisierung, ländliche Entwicklung und gerechtes Wachstum festlegen. Ein gemeinsamer Plan wird Indien in eine moderne, selbständige Nation verwandeln."
RAJ_promote_violence_against_the_british:	"Fördern Sie Gewalt gegen die Briten"
RAJ_promote_violence_against_the_british_desc:	"Die Zeit des friedlichen Protests ist vorbei. Um die Ketten der imperialen Unterdrückung zu zerschlagen, müssen wir direkt handeln. Koordinierter Widerstand wird die britische Kontrolle schwächen und die Massen inspirieren, sich gegen die Tyrannei zu erheben."
RAJ_rally_the_indian_left:	"Versammeln Sie die indische Linke"
RAJ_rally_the_indian_left_desc:	"Die zersplitterte Linke muss sich zusammentun, um den Kampf für die Rechte der Arbeiter und die wahre Unabhängigkeit anzuführen. Indem wir die sozialistischen und kommunistischen Kräfte unter einem Banner vereinen, können wir eine starke Front schmieden, um Imperialismus und Kapitalismus gleichermaßen herauszufordern."
RAJ_forward_bloc:	"Vorwärts-Block"
RAJ_forward_bloc_desc:	"Der Vorwärtsblock vertritt eine kühne Vision für die Zukunft Indiens - eine Vision, die Kompromisse ablehnt und revolutionäres Handeln begrüßt. Indem wir alle antiimperialistischen Kräfte vereinen, können wir den Kampf für die vollständige Unabhängigkeit beschleunigen und den Grundstein für ein stärkeres, radikaleres Indien legen."
RAJ_give_me_blood_and_i_will_grant_you_freedom:	"Gebt mir Blut und ich werde euch Freiheit gewähren"
RAJ_give_me_blood_and_i_will_grant_you_freedom_desc:	"Der Weg zur Unabhängigkeit ist mit Kampf und Opfern gepflastert. Wenn wir die Mutigen für unsere Sache gewinnen, können wir eine Bewegung inspirieren, die stark genug ist, um die Ketten der Kolonialherrschaft zu sprengen. Der Sieg wird denjenigen zuteil, die bereit sind, den Preis dafür zu zahlen."
RAJ_rani_of_jhansi_regiment:	"Rani von Jhansi Regiment"
RAJ_rani_of_jhansi_regiment_desc:	"Inspiriert von der Tapferkeit der Rani von Jhansi werden wir ein reines Frauenregiment aufstellen, das sich gegen die Unterdrückung stellt. Indem wir diese mutigen Kämpferinnen stärken, werden wir der Kolonialherrschaft einen kräftigen Schlag versetzen und die Rolle der Frauen im Kampf für die Unabhängigkeit neu definieren."
RAJ_azad_hind_dlc:	"Azad Hind"
RAJ_azad_hind_dlc_desc:	"Azad Hind ist der Höhepunkt unseres Befreiungskampfes - eine Exilregierung, die sich der Beendigung der britischen Herrschaft verschrieben hat. Mit mobilisierten Kräften und einer klaren Vision steht sie bereit, Indien durch Stärke und Entschlossenheit in die Freiheit zu führen."
RAJ_azad_hind_dlc_radio:	"Azad Hind Radio"
RAJ_azad_hind_dlc_radio_desc:	"Um die Botschaft der Befreiung zu verbreiten, müssen wir Azad Hind Radio gründen. Dieser revolutionäre Sender wird unseren Ruf nach Freiheit über die Grenzen tragen, Patrioten vereinen und den Kampf gegen die koloniale Unterdrückung entfachen. Der Kampf braucht eine Stimme, und das wird unsere sein."
RAJ_azad_hind_dlc_bank:	"Azad Hind Bank"
RAJ_azad_hind_dlc_bank_desc:	"Eine Revolution braucht Ressourcen. Mit der Gründung der Azad Hind Bank schaffen wir ein Finanzinstitut, das sich der Unterstützung des Kampfes für die Unabhängigkeit verschrieben hat. Sie wird Mittel mobilisieren, Patrioten stärken und die wirtschaftliche Grundlage für ein freies Indien schaffen."
RAJ_seek_japanese_support:	"Suchen Sie die Unterstützung Japans"
RAJ_seek_japanese_support_desc:	"Der Feind unseres Feindes kann unser stärkster Verbündeter sein. Wenn wir uns um japanische Unterstützung bemühen, können wir Zugang zu Ressourcen, Ausbildung und Arbeitskräften erhalten, um die britische Herrschaft herauszufordern. Auch wenn der Weg dorthin mit Risiken behaftet ist, könnte eine solche Allianz das Blatt zu unseren Gunsten wenden."
RAJ_the_enemy_of_my_enemy:	"Der Feind meines Feindes"
RAJ_the_enemy_of_my_enemy_desc:	"Im Kampf um die Unabhängigkeit werden Bündnisse zwangsläufig geschmiedet. Indem wir mit denjenigen zusammenarbeiten, die sich den Briten widersetzen, können wir ihren Einfluss auf unser Land schwächen. Die Freiheit mag unwahrscheinliche Partnerschaften erfordern, aber der Sieg ist alles, was zählt."
RAJ_shaheed_and_swaraj:	"Shaheed und Swaraj"
RAJ_shaheed_and_swaraj_desc:	"Die Opfer unserer Märtyrer inspirieren uns zu unserem unerbittlichen Streben nach Swaraj. Ihr Blut treibt unsere Revolution an und erinnert uns daran, dass die Unabhängigkeit nicht gegeben wird - sie wird genommen. Möge ihr Andenken unsere Entschlossenheit stärken, ein freies und souveränes Indien zu erreichen."
RAJ_azad_hind_radio:	"Azad Hind Radio"
RAJ_azad_hind_radio_desc:	"$RAJ_azad_hind_dlc_radio_desc$"
RAJ_seek_international_recognition:	"Internationale Anerkennung anstreben"
RAJ_seek_international_recognition_desc:	"Um unseren Kampf zu legitimieren, müssen wir uns um internationale Anerkennung für unsere Sache bemühen. Indem wir weltweite Unterstützung sammeln, können wir die [ENG.GetAdjective] isolieren und unseren Anspruch auf Souveränität in den Augen der Welt stärken."
RAJ_war_taxes:	"Kriegssteuern"
RAJ_war_taxes_desc:	"Die Kosten des Krieges erfordern gemeinsame Opfer. Indem wir Kriegssteuern erheben, können wir unsere militärischen Kampagnen finanzieren und die für den Sieg erforderlichen Ressourcen sicherstellen. Ein freies Indien ist jede Rupie wert."
RAJ_azad_hind_bank:	"Azad Hind Bank"
RAJ_azad_hind_bank_desc:	"$RAJ_azad_hind_dlc_bank_desc$"
RAJ_hindutva:	"Hindutva"
RAJ_hindutva_desc:	"Die Idee der Hindutva sieht ein geeintes Indien vor, das im kulturellen und religiösen Erbe verwurzelt ist. Durch die Förderung dieser Ideologie wollen wir eine nationale Identität schmieden, die die Einheit stärkt und Indien darauf vorbereitet, sich auf der globalen Bühne zu behaupten."
RAJ_netaji:	"Netaji"
RAJ_netaji_desc:	"Netaji Subhas Chandra Bose verkörpert den Geist des unerbittlichen Widerstands gegen die imperiale Herrschaft. Seine Vision und seine Führungsqualitäten inspirieren Millionen, sich dem Kampf für ein souveränes Indien anzuschließen. Unter seiner Führung rückt der Traum von der Unabhängigkeit näher an die Realität."
RAJ_hindu_mahasabha_tt:	"Wenn Sie einen Fürstenstaat als Marionette freilassen, erhöht sich dieser Geisterbonus um §G+4%§!, solange der Staat Ihre Marionette bleibt, bis zu einem Maximum von §Y32%§!."
RAJ_sanatani:	"Sanatani"
RAJ_sanatani_desc:	"Die Prinzipien des Sanatan Dharma bieten eine zeitlose Grundlage für Indiens Einheit und Wiederaufstieg. Indem wir uns diese Werte zu eigen machen, können wir eine harmonische und widerstandsfähige Nation inspirieren, die sich an der Tradition orientiert."
RAJ_hindi_as_a_national_language:	"Hindi als Nationalsprache"
RAJ_hindi_as_a_national_language_desc:	"Die Einführung von Hindi als Nationalsprache wird Indien unter einer gemeinsamen kulturellen Identität vereinen. Indem wir den Gebrauch der Sprache fördern, stärken wir die Kommunikation, fördern den Nationalstolz und legen den Grundstein für einen zusammenhängenden und unabhängigen Staat."
RAJ_seven_shackles_desc:	"Vyavasaybandi schränkt die Inder in ihrer freien Berufswahl ein und bindet sie an ausbeuterische Systeme. Indem wir diese Fesseln sprengen, befreien wir die Arbeiter und befähigen sie, zu einer wirklich unabhängigen und gerechten Wirtschaft beizutragen."
RAJ_coal_fire_and_steel:	"Kohle, Feuer und Stahl"
RAJ_coal_fire_and_steel_desc:	"Kohle treibt die Motoren an, Feuer beflügelt den Willen, und Stahl baut die Zukunft. Indem wir in die Schwerindustrie investieren, legen wir den Grundstein für ein unabhängiges Indien, das in der Lage ist, seine Souveränität zu verteidigen und seinen Wohlstand zu fördern."
RAJ_extend_indian_security_zone:	"Ausweitung der [GetRajName] Sicherheitszone"
RAJ_extend_indian_security_zone_desc:	"Die Ausweitung unserer Sicherheitszone wird Indiens Grenzen schützen und die Macht in der Region ausweiten. Indem wir unseren Einfluss ausweiten, gewährleisten wir die Stabilität und den Schutz, die für eine sichere und souveräne Nation notwendig sind."
RAJ_high_altitude_training:	"Höhentraining"
RAJ_high_altitude_training_desc:	"Die zerklüfteten Gipfel des Himalayas erfordern Stärke und Widerstandsfähigkeit. Durch die Einrichtung spezieller Höhentrainingsprogramme bereiten wir unsere Streitkräfte darauf vor, in extremen Umgebungen zu dominieren, unsere Grenzen zu sichern und die Kontrolle über strategische Bergregionen zu behaupten."
RAJ_high_altitude_training_tt:	"Gewinnen Sie eine Bergsteiger-Vorlage"
RAJ_demand_return_of_imperialist_colonies:	"Fordern Sie die Rückgabe der imperialistischen Kolonien"
RAJ_demand_return_of_imperialist_colonies_desc:	"Es ist an der Zeit, die Rückgabe aller imperialistischen Kolonien auf dem Subkontinent zu fordern, alle indischen Länder unter einer Flagge zu vereinen und die Ära der kolonialen Eindringlinge zu beenden."
RAJ_planned_economy:	"Planwirtschaft"
RAJ_planned_economy_desc:	"Eine starke Nation braucht eine starke Wirtschaft, die von einem Ziel und einer Vision geleitet wird. Durch die Einführung einer Planwirtschaft können wir die Ressourcen effizient verteilen, dem industriellen Wachstum Vorrang einräumen und eine gerechte Entwicklung für alle Bürger sicherstellen."
RAJ_two_nation_theory_:	"Zwei-Nationen-Theorie"
RAJ_two_nation_theory__desc:	"Die Zwei-Nationen-Theorie besagt, dass Hindus und Muslime unterschiedliche Nationen sind, die jeweils einen eigenen Staat verdienen. Indem wir uns diese Ideologie zu eigen machen, erkennen wir die Notwendigkeit an, getrennte Wege zur Selbstbestimmung zu gehen und die Zukunft des Subkontinents durch Teilung und Autonomie zu gestalten."
RAJ_red_in_the_shadows:	"Die Roten im Schatten"
RAJ_red_in_the_shadows_desc:	"Inmitten des Chaos des imperialen Niedergangs gewinnen revolutionäre Kräfte an Stärke, die im Verborgenen daran arbeiten, die alte Ordnung zu untergraben. Der Aufstieg des roten Banners signalisiert eine kommende Abrechnung - eine, die die Zukunft Indiens und der Welt neu gestalten könnte."
RAJ_red_in_the_shadows_tt:	"Wir werden kommunistisch, wenn wir die Unabhängigkeit erlangen und die Teilung verhindern. Pakistan wird befreit werden und [ENG.GetAdjective] Unterstützung erhalten, um weiteren kommunistischen Einfluss abzuwehren."
RAJ_seek_domestic_allies:	"Verbündete im Inland suchen"
RAJ_seek_domestic_allies_desc:	"Der Vorwärtsblock kann seine Vision nicht allein verwirklichen. Indem wir Verbündete im gesamten politischen Spektrum suchen, können wir revolutionäre Denker vereinen, eine breitere Unterstützung mobilisieren und die Führung zusammenbringen, die nötig ist, um Indien zur wahren Unabhängigkeit zu führen."
RAJ_protest_against_the_howell_monument:	"Protest gegen das Holwell-Denkmal"
RAJ_protest_against_the_howell_monument_desc:	"Das Holwell-Denkmal ist eine Verherrlichung kolonialer Herrschaft und Ungerechtigkeit. Indem wir Proteste gegen dieses Symbol organisieren, versammeln wir die Nation, um die imperiale Propaganda abzulehnen und die Entfernung von Relikten zu fordern, die unseren Kampf für die Freiheit beleidigen."
RAJ_the_indian_national_army:	"Die Indische Nationale Armee"
RAJ_the_indian_national_army_desc:	"Die Indische Nationalarmee verkörpert den Kampf für die Unabhängigkeit und vereint Patrioten unter einem einzigen Banner, um gegen die Kolonialherrschaft zu Felde zu ziehen. Mit ihrer Entschlossenheit und Aufopferung ist die INA bereit, Indien zur Befreiung und Souveränität zu führen."
RAJ_appoint_soviet_friendly_government:	"$ROM_appoint_soviet_friendly_government$"
RAJ_appoint_soviet_friendly_government_desc:	"$CZE_go_left$"
RAJ_appoint_german_friendly_government:	"$ROM_appoint_german_friendly_government$ $ROM_appoint_german_friendly_government$"
RAJ_appoint_german_friendly_government_desc:	"$CZE_czech_fascism_desc$ $CZE_czech_fascism_desc$"
RAJ_ban_untouchability_once_and_for_all:	"Unberührbarkeit ein für alle Mal verbieten"
RAJ_ban_untouchability_once_and_for_all_desc:	"Die Unberührbarkeit ist ein Schandfleck in unserer Gesellschaft, der uns spaltet, wenn Einheit am nötigsten ist. Indem wir diese Praxis abschaffen, bekräftigen wir die Würde jedes Inders und machen einen entscheidenden Schritt zum Aufbau einer gerechten und integrativen Nation."
RAJ_a_tiger_unchained:	"Ein entfesselter Tiger"
RAJ_a_tiger_unchained_desc:	"Wir werden Eliteeinheiten schaffen, die in der Lage sind, die härtesten Gebirgsregionen zu meistern. Diese Gipfeltiger werden unsere Feinde in Angst und Schrecken versetzen und unsere Vorherrschaft in den Bergen sichern."
RAJ_to_shake_the_world:	"Um die Welt zu erschüttern"
RAJ_to_shake_the_world_desc:	"Indiens industrielles Potenzial ist enorm, und jetzt ist es an der Zeit, es zu entfesseln. Durch den Ausbau von Fabriken, die Modernisierung der Infrastruktur und die Nutzung unserer Ressourcen können wir Indien in einen industriellen Riesen verwandeln, der in der Lage ist, das Schicksal der Welt zu gestalten."
RAJ_east_india_railways_dlc:	"Ostindische Eisenbahnen"
RAJ_east_india_railways_dlc_desc:	"Durch den Ausbau und die Modernisierung der East India Railways können wir den Handel stärken, die Konnektivität verbessern und die Weichen für eine wohlhabendere und integrierte Nation stellen."
RAJ_modify_indian_railways_tt:	"Ändert $idea_RAJ_indian_railways$ um: "
RAJ_the_calcutta_line:	"Die Kalkutta-Linie"
RAJ_the_calcutta_line_desc:	"Da die Spannungen im Raj zunehmen, müssen wir unser Land befestigen, um unsere Sicherheit zu gewährleisten."
RAJ_the_calcutta_line_tt:	"Fügen Sie §G2§!§Y Landforts §!in §Yjeder§! Provinz des Staates hinzu."
RAJ_bombay_baroda_and_central_india_railway:	"Bombay-Baroda- und Zentralindien-Eisenbahn"
RAJ_bombay_baroda_and_central_india_railway_desc:	"Der Ausbau der Bombay, Baroda und Central India Railway wird wichtige Regionen miteinander verbinden, das Wirtschaftswachstum ankurbeln und die Gemeinden zusammenführen. Diese wichtigen Strecken werden die Handelsnetze stärken und Indiens Infrastruktur für die kommenden Herausforderungen rüsten."
RAJ_great_indian_peninsula_railway_dlc:	"Große Indische Halbinsel-Eisenbahn "
RAJ_great_indian_peninsula_railway_dlc_desc:	"Die Great Indian Peninsula Railway ist der Schlüssel zur Erschließung des wirtschaftlichen Potenzials von Zentral- und Südindien. Der Ausbau dieses Netzes wird den Handel fördern, die Industrie stärken und eine nahtlose Anbindung an den gesamten Subkontinent gewährleisten."
RAJ_south_indian_railway_company:	"Südindische Eisenbahngesellschaft"
RAJ_south_indian_railway_company_desc:	"Die Südindische Eisenbahngesellschaft verbindet den pulsierenden Süden mit dem Rest Indiens. Die Stärkung und Erweiterung dieses Netzes wird das regionale Wachstum vorantreiben, die Einheit fördern und die Rolle des Südens auf dem Weg zur wirtschaftlichen Unabhängigkeit Indiens festigen."
RAJ_supply_center_fortifications:	"Befestigungen der Nachschubzentren"
RAJ_supply_center_fortifications_desc:	"Die Sicherung unserer Nachschubzentren ist entscheidend für die Aufrechterhaltung der Kriegsanstrengungen. Indem wir diese Zentren befestigen, stellen wir den ununterbrochenen Fluss von Ressourcen sicher und schützen das Rückgrat unserer militärischen Operationen vor feindlichen Übergriffen."
RAJ_supply_center_fortifications_tt:	"Fügen Sie §G3§! §Y$bunker$§! an jedem §YSupply Hub§! in den uns gehörenden Staaten hinzu"
RAJ_north_western_state_railway:	"Nordwestliche Staatseisenbahn"
RAJ_north_western_state_railway_desc:	"Die North Western State Railway ist von entscheidender Bedeutung für die Verbindung des indischen Kernlandes mit seinen strategischen Grenzen. Der Ausbau und die Modernisierung dieses Netzes werden den regionalen Handel stärken, die Mobilität verbessern und unsere Präsenz entlang kritischer Grenzen verstärken."
RAJ_prioritize_army_cargo:	"Vorrang für Armeefracht"
RAJ_prioritize_army_cargo_desc:	"Das Eisenbahnnetz ist das Rückgrat der Militärlogistik. Indem wir dem Frachtgut der Armee Vorrang einräumen, stellen wir sicher, dass unsere Soldaten mit den Waffen, Ressourcen und Verstärkungen versorgt werden, die sie für einen schnellen und entscheidenden Sieg benötigen."
RAJ_prioritize_civilian_cargo:	"Priorisieren Sie zivile Güter"
RAJ_prioritize_civilian_cargo_desc:	"Eine starke Heimatfront ist entscheidend für den Sieg. Indem wir der zivilen Fracht Vorrang einräumen, sorgen wir für die rechtzeitige Lieferung von Nahrungsmitteln, Gütern und Materialien zur Versorgung unserer Bevölkerung und Industrie, damit die Nation in Krisenzeiten widerstandsfähig bleibt."
RAJ_specialized_dietary_requirement:	"Spezieller Nahrungsmittelbedarf"
RAJ_specialized_dietary_requirement_desc:	"Um die Moral und den Zusammenhalt zu erhalten, müssen wir die unterschiedlichen Ernährungsbedürfnisse unserer Truppen berücksichtigen. Durch die Bereitstellung von Mahlzeiten, die auf ihre religiösen und kulturellen Überzeugungen abgestimmt sind, stellen wir sicher, dass sich jeder Soldat respektiert fühlt und bereit ist zu kämpfen."
RAJ_standardized_rations:	"Standardisierte Rationen"
RAJ_standardized_rations_desc:	"Effizienz und Konsistenz sind der Schlüssel zu einem starken Militär. Durch die Einführung standardisierter Rationen vereinfachen wir die Logistik, senken die Kosten und stellen sicher, dass jeder Soldat die gleiche Verpflegung erhält, was den Zusammenhalt und die Disziplin in den Reihen fördert."
RAJ_royal_indian_artillery_:	"Königlich Indische Artillerie "
RAJ_royal_indian_artillery__desc:	"Durch die Stärkung dieser gewaltigen Streitkraft stellen wir sicher, dass wir in der Lage sind, verheerende Feuerkraft zu entfalten, die feindlichen Linien zu durchbrechen und den Sieg auf dem Schlachtfeld zu sichern."
RAJ_armoured_corps_center_and_school:	"Panzerkorps Zentrum"
RAJ_armoured_corps_center_and_school_desc:	"Die Zukunft der Kriegsführung liegt in der mechanisierten Macht. Die Einrichtung eines Panzerkorpszentrums wird es uns ermöglichen, unsere Truppen in gepanzerten Taktiken auszubilden und Panzer zur Speerspitze unserer modernen Militärstrategie zu machen."
RAJ_indian_army_corps_of_engineers:	"[ROOT.GetAdjective] Army Corps Of Engineers"
RAJ_indian_army_corps_of_engineers_desc:	"Von Befestigungen bis zu Brücken ist das [ROOT.GetAdjective] Army Corps of Engineers für den operativen Erfolg unerlässlich. Durch den Ausbau und die Ausrüstung dieses wichtigen Zweigs stellen wir sicher, dass unsere Streitkräfte jedes Hindernis überwinden können, und ebnen so den Weg für den Triumph an jeder Front."
RAJ_kingmaker:	"Königsmacher"
RAJ_kingmaker_desc:	"Indem wir Freiwillige in ausländische Konflikte entsenden, erweitern wir unseren Einfluss und sammeln wertvolle Kampferfahrung. Diese Bemühungen unterstützen nicht nur unsere Verbündeten, sondern positionieren uns als entscheidende Kraft bei der Gestaltung der Ergebnisse globaler Kämpfe."
RAJ_relax_agrarian_society_criteria:	"Gesellschaft industrialisieren"
RAJ_relax_agrarian_society_criteria_desc:	"$GRE_force_the_farmers_into_factories$"
RAJ_mechanization_of_the_cavalry:	"Mechanisierung der Kavallerie"
RAJ_mechanization_of_the_cavalry_desc:	"Die Ära der berittenen Kriegsführung ist vorbei. Durch die Mechanisierung der Kavallerie verwandeln wir sie in eine moderne Panzertruppe, die Geschwindigkeit und Feuerkraft kombiniert, um das Schlachtfeld zu beherrschen und Indien in die Zukunft der Kriegsführung zu führen."
RAJ_mountain_tanks:	"Gebirgspanzer"
RAJ_mountain_tanks_desc:	"Herkömmliche Panzer haben es in unwegsamem Gelände schwer, aber spezialisierte Gebirgspanzer werden uns im Kampf in großen Höhen einen Vorteil verschaffen. Diese wendigen Maschinen werden die Höhen beherrschen, strategische Hochburgen sichern und unsere Feinde ausmanövrieren."
RAJ_siege_batteries:	"Belagerungsbatterien"
RAJ_siege_batteries_desc:	"Wenn sich uns Festungen in den Weg stellen, werden Belagerungsbatterien sie in Schutt und Asche legen. Diese schweren Artillerieeinheiten verfügen über eine unvergleichliche Zerstörungskraft und sorgen dafür, dass keine Festung oder kein Bollwerk unserem Vormarsch widerstehen kann."
RAJ_mountain_guns:	"Gebirgskanonen"
RAJ_mountain_guns_desc:	"Der Krieg in großer Höhe erfordert Anpassungsfähigkeit. Gebirgsgeschütze, die für unwegsames Gelände entwickelt wurden, bieten den Truppen in den schwierigsten Umgebungen entscheidende Feuerunterstützung und sichern so die Vorherrschaft selbst in den schwierigsten Schlachten."
RAJ_regimental_loyalty:	"Loyalität zum Regiment"
RAJ_regimental_loyalty_desc:	"Die Bande der Regimentstreue sorgen für Einheit und Disziplin unter unseren Truppen. Indem wir den Stolz auf diese Traditionen fördern, schaffen wir eine Truppe, die durch Ehre, Vertrauen und ein unnachgiebiges Engagement für den Sieg verbunden ist."
RAJ_uplifting_the_people_of_india:	"Das indische Volk ermutigen"
RAJ_uplifting_the_people_of_india_desc:	"Das indische Volk muss auf seinem Weg in die Unabhängigkeit entschlossen sein. Dazu muss es zunächst seine Grundbedürfnisse befriedigen können. Wir werden daher Maßnahmen ergreifen, um dies zu erreichen."
RAJ_gurkhas:	"Gurkhas"
RAJ_gurkhas_desc:	"Die Gurkhas sind für ihren Mut und ihre Hartnäckigkeit bekannt und sind eine im Kampf unübertroffene Elitetruppe. Indem wir ihre Rolle ausweiten und ihre Hingabe für unsere Sache sicherstellen, sichern wir uns einen entscheidenden Vorteil auf dem Schlachtfeld."
RAJ_lions_of_the_great_war_:	"Die Löwen des Großen Krieges"
RAJ_lions_of_the_great_war__desc:	"Die Opfer, die indische Soldaten im Ersten Weltkrieg gebracht haben, sind ein Zeugnis ihrer Tapferkeit. Indem wir ihres Vermächtnisses gedenken, ehren wir ihren Mut und inspirieren eine neue Generation, ihren Geist im Kampf für Indiens Schicksal aufrechtzuerhalten."
RAJ_abolish_agrarian_society_criteria:	"Industrialisierung vorantreiben"
RAJ_abolish_agrarian_society_criteria_desc:	"$GRE_force_the_farmers_into_factories$"
RAJ_abolish_agrarian_society_criteria_tt:	"Reduziert die Zeit, die es braucht, um die Auswirkungen von §Y$idea_RAJ_agrarian_society$§! um §Y3§! Monate dauerhaft zu reduzieren"
RAJ_womens_auxiliary_corps:	"Hilfskorps der Frauen"
RAJ_womens_auxiliary_corps_desc:	"Mit der Einrichtung des Women's Auxiliary Corps befähigen wir Frauen, in wichtigen unterstützenden Funktionen zu dienen und unsere Streitkräfte zu stärken. Ihre Beiträge werden die Logistik, die Kommunikation und die Operationen unterstützen und beweisen, dass jeder Inder eine Rolle bei der Sicherung unserer Zukunft spielen kann."
RAJ_indian_territorial_force:	"[ROOT.GetAdjective] Territoriale Streitkräfte"
RAJ_indian_territorial_force_desc:	"Die [ROOT.GetAdjective] Territorial Force stellt eine lebenswichtige Reserve von ausgebildeten Bürgern dar, die bereit sind, das Heimatland zu verteidigen."
RAJ_military_engineer_services:	"Militärische Ingenieursdienste"
RAJ_military_engineer_services_desc:	"Die Militäringenieure sind das Rückgrat der militärischen Infrastruktur, von Befestigungen bis hin zu Versorgungslinien. Die Stärkung dieses wichtigen Zweigs stellt sicher, dass unsere Streitkräfte mit den Straßen, Stützpunkten und Verteidigungsanlagen ausgestattet sind, die sie benötigen, um in jedem Konflikt zu bestehen."
RAJ_the_burma_rifles:	"Die burmesischen Gewehre"
RAJ_the_burma_rifles_desc:	"Die Burma Rifles sind eine entscheidende Kraft für die Aufrechterhaltung der Sicherheit in dem schwierigen Gelände an der Ostgrenze. Durch die Stärkung und Modernisierung dieses Regiments gewährleisten wir Stabilität, verteidigen Schlüsselregionen und bereiten uns auf zukünftige Herausforderungen in diesem strategischen Gebiet vor."
RAJ_help_from_the_nagas:	"Hilfe von den Nagas"
RAJ_help_from_the_nagas_desc:	"Die Nagas sind mit ihrer profunden Kenntnis des Geländes und ihren unübertroffenen Guerilla-Fähigkeiten unschätzbare Verbündete. Wenn wir uns ihre Unterstützung sichern, stärken wir unsere Position im Nordosten und verwandeln die zerklüfteten Hügel in eine Bastion des Widerstands und der Stärke."
RAJ_campaign_against_agrarian_societys:	"Industrialisierungspläne"
RAJ_campaign_against_agrarian_societys_desc:	"Indien darf nicht im letzten Jahrhundert zurückbleiben. Wir müssen eine konzentrierte Anstrengung unternehmen, um unser Volk aufzurichten."
RAJ_indianize_the_army:	"Indianisieren Sie die Armee"
RAJ_indianize_the_army_desc:	"Es ist an der Zeit, den kolonialen Einfluss durch eine indische Führung in den Streitkräften zu ersetzen. Indem wir indische Offiziere befördern und die Armee umstrukturieren, bauen wir ein Militär auf, das die Nation wirklich repräsentiert und ihr dient."
RAJ_keep_british_generals:	"Behalten Sie britische Generäle"
RAJ_keep_british_generals_desc:	"In diesen unsicheren Zeiten ist eine erfahrene Führung von entscheidender Bedeutung. Die Beibehaltung britischer Generäle stellt sicher, dass die Armee von ihrem Fachwissen und ihrer Disziplin profitiert und auf dem Weg zur Unabhängigkeit Stabilität und Effektivität bewahrt."
RAJ_keep_british_generals_tt:	"Wir werden alle britischen Generäle behalten, auch wenn wir in einen Krieg mit [ENG.GetName] geraten."
RAJ_chindits_:	"Chindits"
RAJ_chindits__desc:	"Die Chindits sind unkonventionelle Elitekrieger, die für weitreichende Dschungeloperationen ausgebildet sind. Indem wir ihre Reihen erweitern und ihre Taktik perfektionieren, gewinnen wir eine Truppe, die in der Lage ist, den Feind auszumanövrieren und seine Operationen tief hinter seinen Linien zu stören."
RAJ_viceroys_body_guard:	"Leibwache des Vizekönigs"
RAJ_viceroys_body_guard_desc:	"Die Leibgarde des Vizekönigs steht für Tradition, Disziplin und Prestige. Indem wir diese traditionsreiche Kavallerieeinheit erhalten und modernisieren, bewahren wir ein Symbol der Autorität und passen sie an die Herausforderungen einer sich wandelnden Zeit an."
RAJ_engineering_revolution:	"Technische Revolution"
RAJ_engineering_revolution_desc:	"Indiens Fortschritt erfordert eine technische Revolution. Durch Investitionen in Infrastruktur, industrielle Entwicklung und Spitzentechnologie können wir die Nation in ein Kraftwerk verwandeln, das sowohl im Frieden als auch im Krieg führend sein kann."
RAJ_ordnance_factory_kanpur_uttar_pradesh:	"Rüstungsfabrik Kanpur"
RAJ_ordnance_factory_kanpur_uttar_pradesh_desc:	"Die Ordnance Factory in Kanpur ist ein Eckpfeiler der indischen Verteidigungsproduktion. Durch den Ausbau ihrer Kapazität und die Modernisierung ihrer Einrichtungen stellen wir eine kontinuierliche Versorgung mit Waffen und Ausrüstung sicher und versetzen unsere Streitkräfte in die Lage, die Nation zu verteidigen und zu sichern."
RAJ_indian_air_force:	"[ROOT.GetAdjective] Luftwaffe"
RAJ_indian_air_force_desc:	"Der Luftraum ist die neue Grenze der modernen Kriegsführung. Durch den Aufbau einer starken und unabhängigen indischen Luftwaffe sichern wir unsere Souveränität, beherrschen die Luft und bereiten uns auf die Herausforderungen künftiger Konflikte vor."
RAJ_the_burma_road:	"Die Burma-Straße"
RAJ_the_burma_road_desc:	"Die Burma Road ist eine wichtige Versorgungsroute, die Indien mit Südostasien und darüber hinaus verbindet. Die Sicherung und der Ausbau dieses Weges gewährleisten einen stetigen Fluss von Ressourcen und Verstärkungen, stärken unsere Position in der Region und unterstützen unsere Verbündeten."
RAJ_womens_auxiliary_air_force:	"Hilfsluftwaffe der Frauen"
RAJ_womens_auxiliary_air_force_desc:	"Die Women's Auxiliary Air Force befähigt Frauen zur Unterstützung von Lufteinsätzen, von der Logistik bis zur Kommunikation. Indem wir ihre Talente einbeziehen, stärken wir unsere Luftwaffe und beweisen, dass jeder Inder zur Sicherung des nationalen Luftraums beitragen kann."
RAJ_trainer_planes:	"Trainingsflugzeuge"
RAJ_trainer_planes_desc:	"Qualifizierte Piloten sind das Rückgrat einer starken Luftwaffe. Durch Investitionen in Trainingsflugzeuge stellen wir sicher, dass unsere Piloten die beste Vorbereitung erhalten und einen Kader von Elitefliegern aufbauen, die bereit sind, Indiens Himmel zu verteidigen."
RAJ_spitfire:	"Spitfire"
RAJ_spitfire_desc:	"Spitfires werden das Rückgrat unserer Luftwaffe sein"
RAJ_ground_pounder:	"Ground Pounder"
RAJ_ground_pounder_desc:	"Das zerklüftete Terrain Indiens macht es Panzern schwer, sich schnell zu bewegen. Eine enge Luftunterstützung wird unerlässlich sein, um den Mangel an schwerer Bodenunterstützung auszugleichen."
RAJ_douglas_dakota:	"Douglas Dakota"
RAJ_douglas_dakota_desc:	"Wir haben einen dringenden Bedarf an schnellen Truppen- und Warentransporten. Die Dakota ist ein sehr fähiges Flugzeug für genau diese Aufgabe."
RAJ_vultee_vengeance:	"Vultee Vengeance"
RAJ_vultee_vengeance_desc:	"Durch die Beschaffung der amerikanischen Vultee Vengeance können wir unsere Luftwaffe zu einem sehr günstigen Preis immens erweitern."
RAJ_ordnance_factory_khamaria_jabalpur:	"Rüstungsfabrik Khamaria Jabalpur"
RAJ_ordnance_factory_khamaria_jabalpur_desc:	"Die in Jabalpur gelegene Ordnance Factory Khamaria ist ein wichtiger Produzent von Munition und Rüstungsgütern. Die Ausweitung ihrer Kapazität stärkt die Feuerkraft unseres Militärs und stellt sicher, dass unsere Streitkräfte für jede Herausforderung gut gerüstet sind."
RAJ_ordnance_factory_medak:	"Munitionsfabrik Medak"
RAJ_ordnance_factory_medak_desc:	"Die auf die Herstellung gepanzerter Fahrzeuge spezialisierte Ordnance Factory Medak ist für die Modernisierung unseres Militärs von entscheidender Bedeutung. Die Ausweitung des Betriebs stellt sicher, dass unsere Streitkräfte mit den modernsten Maschinen ausgestattet sind, die sie benötigen, um das Schlachtfeld zu beherrschen."
RAJ_chariot_of_victory:	"Chariot des Sieges"
RAJ_chariot_of_victory_desc:	"Auf dem Schlachtfeld sind Schnelligkeit und Stärke gefragt. Durch Investitionen in gepanzerte Fahrzeuge und mechanisierte Streitkräfte schaffen wir eine moderne Armee, die zu schnellen und entscheidenden Siegen fähig ist und Indiens Vorherrschaft in jedem Konflikt sicherstellt."
RAJ_the_ledo_road:	"Die Ledo-Straße"
RAJ_the_ledo_road_desc:	"Die Ledo Road führt durch zerklüftetes Gelände und ist eine wichtige Versorgungsroute, die Indien mit den alliierten Streitkräften in China verbindet. Die Fertigstellung und Sicherung dieser Lebensader stellt den Fluss von Truppen, Ressourcen und Ausrüstung sicher, der notwendig ist, um das Blatt in Südostasien zu wenden."
RAJ_long_range_escorts:	"Langstrecken-Eskorten"
RAJ_long_range_escorts_desc:	"Um lebenswichtige Nachschublinien und Missionen zu schützen, brauchen wir Flugzeuge, die Bomber und Transporter über große Entfernungen eskortieren können. Investitionen in Langstreckeneskorten gewährleisten unsere Luftüberlegenheit und die Sicherheit von Operationen weit über unsere Grenzen hinaus."
RAJ_british_air_experts:	"Britische Luftexperten"
RAJ_british_air_experts_desc:	"Die Nutzung des Fachwissens erfahrener britischer Flieger und Ingenieure kann die Entwicklung unserer Luftwaffe beschleunigen. Ihre Erfahrung in der modernen Luftkriegsführung wird uns beim Aufbau einer beeindruckenden Präsenz in der Luft unschätzbare Erkenntnisse liefern."
RAJ_special_operations_executive:	"Exekutive für Sondereinsätze"
RAJ_special_operations_executive_desc:	"Die Special Operations Executive ist auf unkonventionelle Kriegsführung spezialisiert, von Sabotage bis hin zum Sammeln von Informationen. Die Ausweitung ihrer Rolle in Indien stattet uns mit den Instrumenten aus, mit denen wir feindliche Pläne durchkreuzen und verdeckte Operationen in strategische Vorteile verwandeln können."
RAJ_the_ordnance_factories_board:	"Das Amt für Rüstungsbetriebe (Ordnance Factories Board)"
RAJ_the_ordnance_factories_board_desc:	"Die Koordinierung des riesigen indischen Netzwerks von Waffenfabriken unter einer einheitlichen Leitung wird die Produktion rationalisieren, die Effizienz steigern und eine konsistente Versorgung mit Waffen und Munition gewährleisten. Diese Grundlage wird unser Militär stärken und Indiens Eigenständigkeit in der Rüstungsproduktion fördern."
RAJ_smiling_buddah:	"Lächelnder Buddha"
RAJ_smiling_buddah_desc:	"Das Projekt Smiling Buddha markiert Indiens Eintritt in den Bereich der nuklearen Fähigkeiten. Mit der Beherrschung dieser Technologie behaupten wir unsere Unabhängigkeit auf der Weltbühne und sichern uns ein starkes Abschreckungsmittel zum Schutz unserer Souveränität."
RAJ_royal_indian_air_force_dlc:	"Königliche [ROOT.GetAdjective] Luftwaffe"
RAJ_royal_indian_air_force_dlc_desc:	"Die königliche indische Luftwaffe ist die Spitze der indischen Luftstreitkräfte. Der Ausbau ihrer Fähigkeiten durch moderne Flugzeuge und Ausbildung sichert die Vorherrschaft am Himmel, um unsere Nation zu verteidigen und in der Region Stärke zu zeigen."
RAJ_infiltrate_aden:	"Aden infiltrieren"
RAJ_infiltrate_aden_desc:	"Aden, eine strategische Hochburg der britischen Macht, ist der Schlüssel zur Unterbrechung der britischen Kontrolle in der Region. Indem wir den lokalen Widerstand infiltrieren und organisieren, können wir Revolten entfachen, die die britische Macht schwächen und für Chaos sorgen, gerade als unser Kampf für die Unabhängigkeit beginnt."
RAJ_go_into_hiding:	"Verstecken Sie sich"
RAJ_go_into_hiding_desc:	"Subhas Chandra Bose muss sich der britischen Überwachung entziehen, um den Kampf für die Unabhängigkeit fortzusetzen. Indem er sich versteckt, stellt er sicher, dass die Führung der Bewegung intakt bleibt und bereit ist, zuzuschlagen, wenn die Zeit reif ist."
RAJ_trade_protection:	"Schutz des Handels"
RAJ_trade_protection_desc:	"Um den Wohlstand unserer Wirtschaft zu sichern, müssen wir lebenswichtige Handelswege und Industrien vor ausländischer Ausbeutung schützen. Die Stärkung des Handelsschutzes sichert Indiens Ressourcen, fördert das inländische Wachstum und schirmt unsere Märkte vor externen Bedrohungen ab."
RAJ_seek_japanese_support_tt:	"Wenn der Krieg um die Unabhängigkeit beginnt, wird [JAP.GetName] uns mit:\n§Y120§! B4Y Marinebombern\n§Y135§! [Jap.GetAdjective]Ki-10 Zwischenkriegsjägern\nihren entsprechenden Entwürfen und\n"
RAJ_the_enemy_of_my_enemy_tt:	"Die §Y[JAP.GetAdjective]§! Regierung wird der gegnerischen Seite im Bürgerkrieg den Krieg erklären und uns helfen."
RAJ_the_enemy_of_my_enemy_tt_2:	"Die §Y[JAP.GetAdjective]§! wird auch versuchen, in §Y[733.GetName]§! einzudringen und es uns zu übergeben."
RAJ_azad_hind_dlc_tt:	"Wir werden gewinnen: "
RAJ_azad_hind_dlc_tt_2:	"Zu Beginn des §RBürgerkriegs§! für §Y120§! Tage(n)"
RAJ_give_me_blood_and_i_will_grant_you_freedom_tt:	"Wird ein Bürgerkrieg für die Unabhängigkeit zwischen den Anhängern der Demokraten und uns beginnen\nJeder Staat, der mehr als §Y65%§! oder §Y85% Widerstand§! hat, wird sich während des Bürgerkriegs auf unsere Seite stellen und uns 1 bzw. 2 Divisionen gewähren, je nach dem höchsten Widerstand.\nJeder andere Staat wird sich auf die Seite der Demokraten stellen."
RAJ_infiltrate_aden_tt:	"Bei Beginn des Unabhängigkeitskrieges werden Milizen in §Y[659.GetName]§!, §Y[906.GetName]§!, §Y[658.GetName]§!, §Y[765.GetName]§!, §Y[422.GetName]§! und §Y[656.GetName]§! aufgestellt, um die [ENG.GetName] Besitzungen anzugreifen."
RAJ_go_into_hiding_tt:	"Bose entkommt aus der Gefangenschaft und macht sich auf den Weg, um bei Beginn des Bürgerkriegs zurückzukehren."
RAJ_war_taxes_tt:	"Schaltet die Entscheidung frei, die Kriegssteuern für jedes Land zu erhöhen, mit dem Krieg geführt wird."
RAJ_akhand_bharat:	"Akhand Bharat"
RAJ_akhand_bharat_desc:	"Akhand Bharat muss eins und unteilbar bleiben. Alle, die der indischen Nation und ihrem Staat ungeteilte Loyalität und Treue schulden, werden mit vollkommener Gleichheit behandelt und haben die gleichen Pflichten, unabhängig von Kaste, Glaube oder Religion."
RAJ_akhand_bharat_tt:	"Entschließt sich zu Kernstaaten in [AFG.GetName], [MLD.GetName], [NEP.GetName], [PAK.GetName], [BAN.GetName], [BHU.GetName], [SRL.GetName] und bildet Akhand Bharat. Wir können jeweils ein Land als Kern anvisieren, woraufhin wir alle bestehenden Kerne besetzen müssen, um mehr Kerne zu beanspruchen."
RAJ_two_nation_theory_dlc:	"$RAJ_two_nation_theory$"
RAJ_two_nation_theory_dlc_desc:	"$RAJ_two_nation_theory__desc$"
RAJ_extended_franchise:	"Erweiterte Rechte"
RAJ_extended_franchise_desc:	"Die Ausweitung der Rechte der gemeinsamen [GetRajAdjective] ist ein wichtiges Unterfangen, um die Kontrolle der [ENG.GetAdjective] über das Land zu verringern"
RAJ_hand_over_aden_to_the_crown:	"Übergabe Adens an die Krone"
RAJ_hand_over_aden_to_the_crown_desc:	"Wie geplant wird [ROOT.GetNameDef] die Oberherrschaft über Aden an die britische Krone übergeben und damit die Verwaltung entlasten."
RAJ_renegotiate_adens_control:	"Die Kontrolle über Aden neu verhandeln"
RAJ_renegotiate_adens_control_desc:	"Obwohl der Plan war, Aden an [ENG.GetName] zu übergeben, gibt es einen erheblichen Vorteil, einen Handelshafen am Roten Meer zu haben. Wir müssen diese Politik neu verhandeln und sie unter unserer Kontrolle behalten."
RAJ_renegotiate_adens_control_tt:	"Wir werden die Kontrolle über [992.GetName] behalten, anstatt sie an [ENG.GetName] zu übergeben."
RAJ_cripps_mission_dlc:	"$RAJ_cripps_mission$"
RAJ_cripps_mission_dlc_desc:	"$RAJ_cripps_mission_desc$"
RAJ_trade_port:	"Handelshafen"
RAJ_trade_port_desc:	"Aden ist im Moment ein sehr kleiner Hafen, aber mit Investitionen könnte er sich zu einem aufblühenden Hafen entwickeln."
RAJ_fortify_aden:	"Aden befestigen"
RAJ_fortify_aden_desc:	"Da Aden nun ein wichtiger Hafen ist, muss er gegen mögliche Angriffe verstärkt werden."
RAJ_purna_swaraj:	"Selbstherrschaft - Purna Swaraj"
RAJ_purna_swaraj_desc:	"Die [ENG.GetAdjective] Regierung in Indien hat nicht nur das [RAJ.GetAdjective] Volk seiner Freiheit beraubt, sondern sich auf die Ausbeutung der Massen gestützt und Indien wirtschaftlich, politisch, kulturell und spirituell ruiniert. Deshalb muss Indien die [ENG.GetAdjective] Verbindung kappen und Purna Swaraj oder vollständige Unabhängigkeit erlangen."
RAJ_the_second_duar_war:	"Der zweite Duar-Krieg"
RAJ_the_second_duar_war_desc:	"Das Volk der [BHU.GetAdjective] kann unter den gegebenen Umständen nicht länger ein unabhängiger Staat sein. Wir müssen es in Indien aufnehmen."
RAJ_bhutanese_protectorate:	"Bhutanisches Protektorat"
RAJ_bhutanese_protectorate_desc:	"Wir müssen die Isolation des [BHU.GetAdjective] Volkes respektieren, aber gleichzeitig können wir die Realität nicht leugnen, dass kleine Länder von denen mit imperialen Ambitionen verschlungen werden. Wir werden ihnen Schutz unter dem indischen Flügel bieten."
RAJ_bhutanese_protectorate_tt:	"§Y[BHU.GetName]§! wird ein Herrschaftsgebiet von §Y[RAJ.GetNameDefCap].§!\n\nSie werden es eher akzeptieren, wenn\n\t-sie eine hohe Meinung von uns haben\n\t-Wir haben eine wesentlich stärkere Armee als sie"
RAJ_give_sikkim_administrative_rights_for_bhutan:	"Sikkim Verwaltungsrechte für Bhutan geben"
RAJ_all_india_students_federation:	"All India Students Federation"
RAJ_all_india_students_federation_desc:	"Die Mobilisierung von Studenten gegen die Oberherrschaft der [ENG.GetAdjective] wird sicherstellen, dass unsere klügsten jungen Köpfe gegen die etablierte Ordnung arbeiten."
RAJ_league_against_gandhism:	"Liga gegen Gandhismus"
RAJ_league_against_gandhism_desc:	"Mahatmas Politik der Gewaltlosigkeit ist eine bewundernswerte Sache. Leider haben die [ENG.GetAdjective] immer wieder bewiesen, dass sie Proteste mit Kugeln beantworten werden. Deshalb ist eine neue Taktik erforderlich, eine blutgetränkte, wenn es sein muss."
RAJ_league_against_gandhism_tt:	"Bei Unruhen im Rahmen der Teilung erhalten Sie jetzt §G5%§! Kriegsunterstützung, wenn sie stattfinden, bis zu einem Maximum von §Y+50%§!."
RAJ_league_against_gandhism_tt_event:	"Fügt zusätzliche §G+5%§! Kriegsunterstützung hinzu, wenn Sie sich auf die Seite der §Y$RAJ_league_against_gandhism$§! stellen."
RAJ_mahatma:	"Mahatma"
RAJ_mahatma_desc:	"Mahatma Gandhi ist zweifelsohne das Gesicht der Unabhängigkeitsbewegung. Mit ihm und Jawaharlal Nehru werden wir das Joch brechen, das uns an Großbritannien bindet."
RAJ_swadeshi_movement:	"Swadeshi-Bewegung"
RAJ_swadeshi_movement_desc:	"Swadeshi, die Unabhängigkeit vom [ENG.GetAdjective], wird die Unabhängigkeitsbewegung beflügeln und Indiens Reichtum in Indien halten. "
RAJ_form_a_federal_court:	"Bilden Sie ein Bundesgericht"
RAJ_form_a_federal_court_desc:	"Jede Form der Demokratie braucht ein Bundesgericht, um zu funktionieren und die Rechtsstaatlichkeit zu wahren. Wir müssen sicherstellen, dass wir von unseresgleichen beurteilt werden und nicht von den Anwälten des [ENG.GetAdjective]"
RAJ_defense_of_india_act:	"Defense Of India Act"
RAJ_defense_of_india_act_desc:	"Die Sicherheit von [GetRajName] ist durch äußere Aggression bedroht. [ROOT.GetLeader] hat durch eine Proklamation ein Gesetz erlassen, das besondere Maßnahmen zur Gewährleistung der öffentlichen Sicherheit und des öffentlichen Interesses sowie zur Verteidigung des [GetRajAdjective] Staates vorsieht."
RAJ_a_congress_resurgent:	"Ein wiedererstarkter Kongress"
RAJ_a_congress_resurgent_desc:	"Der Nationalkongress hat an Popularität und Stärke gewonnen. Er ist jetzt eine unumstrittene politische Kraft."
RAJ_khadi_movement:	"Khadi-Bewegung"
RAJ_khadi_movement_desc:	"Als Teil von Swadeshi ist Khadi zum Symbol der Unabhängigkeit geworden. Das handgesponnene Tuch ist eine symbolische Geste des Widerstands, und die daraus gewebte Kleidung bietet den Unterdrückten und Armen viele wirtschaftliche Möglichkeiten."
RAJ_boycott_british_made_goods:	"Boykottieren Sie britische Waren"
RAJ_boycott_british_made_goods_desc:	"Zu lange schon hat [ENG.GetAdjective] Rohstoffe von [GetRajName] abgebaut und das veredelte Material zu einem hohen Preis an uns zurück verkauft. [RAJ.GetRajAdjective] sollte Dinge für [RAJ.GetRajAdjective] herstellen und nicht von unseren eigenen Besatzern verhökert werden."
RAJ_litteracy_effort:	"Alphabetisierungsanstrengungen"
RAJ_litteracy_effort_desc:	"Eine ungebildete Bevölkerung ist wie ein offener Geist, der nicht verschlossen und unbewacht ist. Lesen zu können ist eine Schlüsselqualifikation, die jeder Mensch braucht, denn wer hat etwas von einem informierten Schaf, wenn nicht der Hirte?"
RAJ_debt_relief:	"Schuldenerlass"
RAJ_debt_relief_desc:	"Lange Zeit haben reiche [ENG.GetAdjective] und [GetRajAdjective] den einfachen Mann in die Schuldenfalle gelockt, bis zu dem Punkt, an dem dies nun endemisch ist. Wir werden uns bei den lokalen Regierungen dafür einsetzen, diesen Menschen Erleichterung zu verschaffen, um die Last zu verringern, in einem ungerechten System gefangen zu sein."
RAJ_expand_healthcare_facilities:	"Gesundheitseinrichtungen ausbauen"
RAJ_expand_healthcare_facilities_desc:	"Die Gesundheitsversorgung in [GetRajName] ist erbärmlich schlecht. Ruhr, Cholera und Malaria wüten auf dem Lande und hemmen das Wachstum. Der Ausbau der lokalen Einrichtungen wird dem entgegenwirken."
RAJ_indo_centric_curriculum:	"Indozentrisches Curriculum"
RAJ_indo_centric_curriculum_desc:	"Die Bildung in [GetRajName] ist auf eine [ENG.GetAdjective] Weltanschauung ausgerichtet, die die [GetRajAdjective] Identität untergräbt und unsere Geschichte auf eine Geschichte der Unterwerfung reduziert. Wir müssen unser Bildungssystem auf die [GetRajAdjective] Identität gründen und den Kindern unsere Geschichte vermitteln."
RAJ_enrollment_of_dali_children:	"Einschulung von Dalit-Kindern"
RAJ_enrollment_of_dali_children_desc:	"Dalits, die \"Unberührbaren\", die unterste Schicht der Kasten, leben in ständiger Armut. Das Kastensystem, das einen Schandfleck für unsere Nation darstellt, kann nur durch die Einschulung ihrer Kinder durchbrochen werden."
RAJ_local_resistance_to_land_taxes:	"Lokaler Widerstand gegen Grundsteuern"
RAJ_local_resistance_to_land_taxes_desc:	"Die Regierung in Delhi wird zu einem großen Teil durch lokale Steuern finanziert. Wenn wir den Widerstand gegen diese Steuern fördern, wird dies die Regierung strangulieren und gleichzeitig den Untertanen einen größeren Anteil am Reichtum verschaffen."
RAJ_tenancy_reforms:	"Reformen des Mietrechts"
RAJ_tenancy_reforms_desc:	"Wohlhabende Schwarzhüte beherrschen den Wohnungsmarkt, treiben die Preise in die Höhe und drücken den Lebensstandard nach unten, während sie den einfachen Menschen zu kurz kommen lassen. Der Kongress wird sich für eine Reform des Mietrechts einsetzen und dafür sorgen, dass der Preis, den ein Vermieter für eine Wohnung verlangen kann, begrenzt wird."
RAJ_quinine:	"Chinin"
RAJ_quinine_tt:	"Schaltet eine verbesserte Version der Fähigkeit §YZusätzlicher Nachschub§! frei.\n\nBefehlspunkte Kosten: §Y0.15§! (für jedes Bataillon)\nDauer: §Y10 days§!\nAbklingzeit: §Y21 Tage§!\n\n§YBei Aktivierung:§!\nDivisionsverschleiß: §G12.0%§!\nHitzeverschleiß: §G35.00%§!\nVersorgungsaufschub: §G+240.0 Stunde(n)§!\nWahrscheinlichkeit, krank zu werden: §G100.00%§!\nAusreichende Versorgung der Armeen für §Y240§! Stunden"
RAJ_quinine_desc:	"Die Versorgung unserer Truppen mit Chinin und ähnlichen Medikamenten wird es unseren Truppen ermöglichen, in tropischen Umgebungen zu kämpfen, ohne an Malaria zu erkranken."
RAJ_temple_entry_movements:	"Bewegungen zum Betreten des Tempels"
RAJ_temple_entry_movements_desc:	"Unberührbarkeit ist ein Schandfleck für dieses Land und dient nur dazu, uns zu spalten. Um dagegen anzukämpfen, werden wir Menschen aus jeder Kaste den Zugang zu ihren Gotteshäusern ermöglichen."
RAJ_freedom_of_the_press:	"Freiheit der Presse"
RAJ_freedom_of_the_press_desc:	"Die Pressefreiheit ist eine Voraussetzung für jede junge Demokratie, denn ohne sie ist der Autoritarismus nicht weit."
RAJ_provincial_autonomy:	"Auf dem Weg zur Unabhängigkeit"
RAJ_provincial_autonomy_occupation_law_tt:	"Schaltet §Y$independent_rule$§! und §Y$princely_subjugation$§! Besatzungsgesetze für Fürstenstaaten frei"
RAJ_provincial_autonomy_desc:	"Zusätzliche Autonomie für die Provinzen von den Briten zu erhalten, wird ein erster entscheidender Schritt auf dem Weg zum Endziel, der Unabhängigkeit, sein."
RAJ_provincial_autonomy_tt:	"\nUm sich über die Zwei-Nationen-Theorie§! vollständig zu befreien, müssen wir entweder §YVereinigtes Bengalen§! oder §YOstpakistan§! vollenden. \n\nUm uns über §YIndia United§! vollständig zu befreien, müssen wir §YA Secular State§!\n\n§Y§!Um uns über §YLeague Against Ghandism§! vollständig zu befreien, müssen wir §YReds in the Shadow§! oder §YGive me Blood and I will grant you Freedom§! vollenden"
RAJ_princely_states_policy:	"Politik der Fürstlichen Staaten"
RAJ_princely_states_policy_desc:	"Die Fürstenstaaten gibt es in allen Formen und Größen, vom einflussreichen Hyderabad bis zu den kleineren Fürstentümern an den nördlichen Grenzen. Wir müssen eine Politik festlegen, wie wir mit ihnen umgehen wollen."
RAJ_indian_legion:	"Indische Legion"
RAJ_indian_legion_desc:	"Die indische Legion, die sich aus ausländischen indischen Dissidenten unter der Kontrolle von [GER.GetName] zusammensetzt, hat eine umfassende Ausbildung in der Wüstenkriegsführung erhalten. Wir können ihre Erfahrung nutzen, um unsere eigenen Streitkräfte zu verbessern."
RAJ_the_pakistan_movement:	"Die Pakistan-Bewegung"
RAJ_the_pakistan_movement_desc:	"Die Rufe nach einem muslimischen Heimatland, Pakistan, werden immer lauter. Wenn die Zusammenstöße zwischen Hindus und Moslems so weitergehen, könnte es unmöglich sein, ein vereintes Indien zu erhalten."
RAJ_the_pakistan_movement_tt_1:	"Erfrischt, bis entweder:\n§Y-[PAK.GetName]§! frei ist\n§Y-[PAK.GetName]§! kapituliert hat\n-Hat §Y5§! mal wiederholt.\n\nAm Ende des Lebenszyklus der Geister §Y90 Tage§! werden wir gewinnen: "
RAJ_the_pakistan_movement_tt_2:	"Für §Y90§! Tag(e)"
RAJ_assam_oil_dlc:	"Assam-Öl"
RAJ_assam_oil_dlc_desc:	"Wir haben kürzlich große Ölfelder in der Provinz Assam entdeckt. Durch die Gründung einer staatlichen Ölgesellschaft und den Bau von Ölplattformen in Assam können wir unsere Wirtschaft erheblich verbessern."
RAJ_tata_steel_dlc:	"Tata Steel"
RAJ_tata_steel_dlc_desc:	"$RAJ_tata_steel_desc$"
RAJ_incorporation_of_the_east_india_company:	"Gründung der East-India Company"
RAJ_incorporation_of_the_east_india_company_desc:	"Nach dem Schock der großen Depression und den immer lauter werdenden Rufen nach Unabhängigkeit ist klar, dass die [ENG.GetAdjective] Krone die Last der Regierung Indiens nicht mehr tragen kann. Das mag zu vorübergehender Instabilität führen, aber der Status quo ist nicht haltbar."
RAJ_incorporation_of_the_east_india_company_tt:	"§Das Raj§! wird zwischen der §YEast India Company§! und den Überbleibseln von §YIndia§! aufgeteilt werden."
RAJ_special_economic_zones:	"Sonderwirtschaftszonen"
RAJ_special_economic_zones_desc:	"Wir werden in unserem Land Sonderwirtschaftszonen einrichten, um es Unternehmen zu erleichtern, zu investieren und die Steuerlast dieser Unternehmen zu senken."
RAJ_seek_intial_funding:	"Suche nach Anschubfinanzierung"
RAJ_seek_intial_funding_desc:	"Wir müssen uns um Investitionen von reichen Investoren in [ENG.GetAdjective] bemühen, um die Dinge in Gang zu bringen."
RAJ_seek_intial_funding_tt:	"Fügen Sie §G3§! Building Slot\nAdd §G3§! §YCivilian Factory§! to our Capital when completing §Y$RAJ_incorporation_of_the_east_india_company$§!"
RAJ_seek_intial_funding_unlock_tt:	"Entriegelt §Y$RAJ_seek_intial_funding$§! focus\n\n"
has_paid_initial_funding:	"Hat Dividenden an Investoren gezahlt"
RAJ_princely_autonomy:	"Fürstliche Autonomie"
RAJ_princely_autonomy_tt:	"Nach der Freigabe eines Fürstenstaates als Marionette add: "
RAJ_princely_autonomy_desc:	"Der Subkontinent wird langsam destabilisiert. Wir werden die lokalen Prinzen nutzen, um die Kontrolle zu übernehmen. Sie erhalten einen Anschein von lokaler Macht, und wir ernten die Früchte, solange sie uns bezahlen."
RAJ_funnel_british_investments_into_princely_states:	"Leiten Sie Investitionen in die fürstlichen Staaten"
RAJ_funnel_british_investments_into_princely_states_tt:	"Jedes Subjekt, das sich auf dem indischen Subkontinent befindet, erhält §G1§! §YCivilian Factory§! und §G3§! Building Slots.\nSubjekte, die noch nicht freigelassen wurden, erhalten den Bonus, sobald sie freigelassen werden."
RAJ_funnel_british_investments_into_princely_states_desc:	"Die Krone hat vorgeschrieben, dass jede Investition in das Unternehmen innerhalb Indiens ausgegeben werden muss, aber die Krone hat nicht festgelegt, dass sie innerhalb des Unternehmens erfolgen muss."
RAJ_demobilize:	"Demobilisierung"
RAJ_demobilize_desc:	"Eine der wichtigsten Auflagen der Regierung ist, dass wir die Armee demobilisieren und nur eine minimale Friedenstruppe aufrechterhalten müssen. Sind sie besorgt, dass unsere Armee ihrer eigenen überlegen sein könnte?"
RAJ_form_a_police_force:	"Eine Sicherheitstruppe bilden"
RAJ_form_a_police_force_desc:	"Wir können keine Armee aufrechterhalten, aber wir haben den Auftrag, eine Polizeitruppe auszustatten."
RAJ_a_private_military:	"Ein privates Militär"
RAJ_a_private_military_tt_1:	"Schafft irreguläre Divisionen mit voller Personalstärke und Ausrüstung.\n\nDie Entsendung von Divisionen als Freiwillige gibt §G1§! offsite §YCivilian Factory§! für §Y365§! Tag(e), wenn sie in Länder geschickt werden, in die wir zuvor keine Freiwilligen geschickt haben. \nDie Entsendung neuer Freiwilliger in dasselbe Land nach §Y540§! Tag(en) gewährt die Fabrik erneut.\n\nDiese Fabriken zählen nicht für §YTaxes§!."
RAJ_a_private_military_desc:	"Es wäre ein Leichtes, unsere örtliche Polizei in ein privates Militär zu verwandeln. Technisch gesehen wären sie nicht Teil einer Armee, sondern würden direkt von der Firma bezahlt, wie es die Regierung vorschreibt."
RAJ_headhunt_army_personell:	"Abwerbung von Armeeangehörigen"
RAJ_headhunt_army_personell_desc:	"Es gibt viele arbeitslose Nachwuchskräfte aus der ehemaligen Armee, die einen Job suchen. Wir können ihnen ein besseres Angebot machen als die Regierung."
RAJ_lobby_for_increased_policing_responsibilities:	"Setzen Sie sich für mehr Polizeiaufgaben ein"
RAJ_lobby_for_increased_policing_responsibilities_desc:	"Die Welt ist nicht mehr der ruhige Ort, der sie einmal war. Die zunehmenden Spannungen von innen und außen geben uns zusätzliche Befugnisse zum Schutz des Firmeneigentums. Wir werden uns für eine Erhöhung der PMC-Ausgaben einsetzen. Die Regierung wird sicher zur Vernunft kommen, und wenn nicht, hat jeder Mensch seinen Preis."
RAJ_circuvment_demobilization_restrictions:	"Umgehen Sie Beschränkungen"
RAJ_circuvment_demobilization_restrictions_desc:	"Die Regierung hält immer noch eine strenge Obergrenze für die Anzahl der Männer ein, die wir mobilisieren können. Die Krone muss tödliche Angst vor einer Armee haben, die nicht unter ihrer Kontrolle steht. Egal, es gibt Möglichkeiten, diese Beschränkungen zu umgehen, entweder durch Bestechung oder dadurch, dass bestimmte religiöse Mitarbeiter nicht zu den Streitkräften gezählt werden."
RAJ_manipulate_army_statistics:	"Manipulieren Sie die Armeestatistik"
RAJ_manipulate_army_statistics_tt:	"Schaffen Sie irreguläre Divisionen mit voller Personalstärke und Ausrüstung. "
RAJ_manipulate_army_statistics_desc:	"Die Krone befürchtet, dass unsere PMC zu groß und einflussreich werden und damit das stehende Heer in Frage stellen könnte. Nun, es gibt Möglichkeiten, die Regierungskontrolleure in Zahlen und falschen Spuren zu ertränken."
RAJ_just_good_business:	"Einfach ein gutes Geschäft"
RAJ_just_good_business_desc:	"Wir haben nichts gegen unsere östlichen Kollegen, es ist nur so, dass sie über Ressourcen verfügen, die wir brauchen, es ist einfach ein gutes Geschäft."
RAJ_crush_the_anathema:	"Vernichten Sie das Anathema"
RAJ_crush_the_anathema_desc:	"Der Kommunismus ist ein Anathema für gute Geschäfte. Geld bringt die Welt in Schwung, und eine von Kommunisten regierte Welt würde zu ihrer Stagnation führen. Wir müssen die Fäulnis wegbrennen."
RAJ_nothing_personal:	"Nichts Persönliches"
RAJ_nothing_personal_tt:	"Schafft ein Kriegsziel gegen §Y[ENG.GetNameDef]§! und die §YCommonwealth-Länder§!"
RAJ_nothing_personal_desc:	"Die Krone hat uns lange genug ihren Willen aufgezwungen, indem sie unser Wachstum durch archaische Maßnahmen unterdrückt hat. Es ist nichts Persönliches, aber die Regierung kann nicht der Grund für ein unterdurchschnittliches Wachstum sein."
RAJ_bombay_trade_port:	"Der Handelshafen von Bombay"
RAJ_bombay_trade_port_desc:	"Bombay hat das Potenzial, ein Handelshafen von Weltrang zu werden, der den Im- und Export riesiger Mengen von Waren ermöglicht. Alles, was es dazu braucht, sind Investitionen in den Ausbau seiner Hafenanlagen."
RAJ_take_in_british_naval_experts:	"Nehmen Sie [ENG.GetAdjective] Marineexperten auf"
RAJ_take_in_british_naval_experts_desc:	"Wir haben einige der besten Marineexperten der Welt zu Hause in Großbritannien, und es wird ein Leichtes sein, einige davon hierher zu holen."
RAJ_the_need_for_a_mercantile_navy:	"Der Bedarf an einer Handelsmarine"
RAJ_the_need_for_a_mercantile_navy_desc:	"Der Seehandel ist der wichtigste Weg für den weltweiten Handel. Wir brauchen eine Marine, die in der Lage ist, diese Waren zu transportieren und sie zu verteidigen."
RAJ_trade_route_protection:	"Schutz der Handelswege"
RAJ_trade_route_protection_desc:	"Im Osten und Westen nehmen feindliche Mächte Gestalt an. Wir müssen in der Lage sein, als Abschreckung gegen jeden zu wirken, der auf die Idee kommt, Waren zu kapern, die in unseren Gewässern hin und her reisen."
RAJ_procure_the_guns:	"Varunas Waffe"
RAJ_procure_the_guns_desc:	"Wir brauchen eine ausreichend große Abschreckung, um unsere Routen zu schützen, und eine ausreichend große Abschreckung erfordert eine große Kanone, eine sehr große Kanone."
RAJ_procure_the_task_force:	"Varunas Task Force"
RAJ_procure_the_task_force_desc:	"Selbst die größten Schiffe brauchen eine Eskorte, um sie angemessen vor feindlichen Schiffen zu schützen. Durch den Aufbau einer robusten Marine-Taskforce können wir sicherstellen, dass unsere großen Schiffe ihre primären Ziele erreichen können."
RAJ_procure_the_armor:	"Varunas Panzerung"
RAJ_procure_the_armor_desc:	"Varuna braucht eine schwere Panzerung, eine sehr schwere Panzerung. Die Entwicklung eines Prototyps für ein weniger teures Projekt, um die Kosten niedrig zu halten, ist eine Notwendigkeit."
RAJ_institutional_money_laundering:	"Institutionelle Geldwäscherei"
RAJ_institutional_money_laundering_desc:	"Die Anleger müssen nicht wissen, wohin das Geld wirklich fließt, oder? Ist es nicht unser Ziel, kein Gebot, die Gewinne um jeden Preis zu maximieren? Und was ist, wenn dazu ein bisschen Betrug gehört? Sie werden nicht schlauer sein."
RAJ_institutional_money_laundering_tt:	""
RAJ_appoint_a_c_suite:	"Ernennen Sie eine C-Suite"
RAJ_appoint_a_c_suite_desc:	"Ein Unternehmen braucht eine starke Führung, die auf Wachstum, Wachstum und Wachstum ausgerichtet ist."
RAJ_company_bonuses:	"Unternehmensboni"
RAJ_company_bonuses_desc:	"Wir werden die Leistung mit potenziellen Boni verknüpfen, um die Effizienz im gesamten Unternehmen zu steigern."
RAJ_creative_accounting:	"Kreative Buchhaltung"
RAJ_creative_accounting_desc:	"Mit ein paar kreativen Buchhaltungstricks können wir einen Teil unseres Gewinns wegzaubern, oder zumindest werden die Steuerbehörden das glauben. "
RAJ_privatized_healthcare:	"Privatisierte Gesundheitsversorgung"
RAJ_privatized_healthcare_desc:	"Der Ruf nach einem kommunistischen Gesundheitssystem muss in allen unseren Betrieben ertönen. Die Gesundheitsversorgung soll denjenigen zur Verfügung gestellt werden, die sie durch die unsichtbare Hand des Marktes verdient haben."
RAJ_arrest_congress_leaders:	"Verhaftung von Kongressführern"
RAJ_arrest_congress_leaders_desc:	"Die Führer des Kongresses wollen sich der neuen Realität der Unternehmensherrschaft nicht anpassen. Sie leisten immer noch Widerstand und machen bei der geringsten Gelegenheit die Hölle heiß. Wir müssen den Aufrührern das Handwerk legen, bevor es sich ausbreitet."
RAJ_union_busting:	"Zerschlagung der Gewerkschaften"
RAJ_union_busting_desc:	"Die Gewerkschaften sind eine Plage für Innovation und leistungsorientierte Beförderung, sie helfen den Arbeitnehmern nicht und lassen die Unternehmen in der Bürokratie ertrinken. Zerstören Sie diese kommunistische Agenda, bevor sie sich ausbreitet."
RAJ_night_shifts:	"Nachtschichten"
RAJ_night_shifts_desc:	"Zusätzliche Mitarbeiter, die nachts arbeiten, kosten zwar etwas mehr, aber der Ertrag ist es wert."
RAJ_legalize_the_opium_trade:	"Legalisieren Sie den Opiumhandel"
RAJ_legalize_the_opium_trade_desc:	"Opium ist vielleicht nicht gut für den Einzelnen, aber es ist sicherlich gut für die Wirtschaft."
RAJ_force_china_to_accept_opium_trade:	"Dritter Opiumkrieg"
RAJ_force_china_to_accept_opium_trade_tt:	"Es wird ein weltweiter Opiummarkt entstehen. Einigen Generälen könnte das ein wenig zu sehr gefallen..."
RAJ_force_china_to_accept_opium_trade_desc:	"[CHI.GetName] hat versucht, seinen Opiumhandel zu kontrollieren und ist damit direkt in Konflikt mit unseren Wachstumszielen geraten. Wir müssen dafür sorgen, dass sie den Fehler ihres Handelns erkennen."
RAJ_new_economic_policy:	"Neue Wirtschaftspolitik"
RAJ_new_economic_policy_desc:	"Wir werden an einem Modell festhalten, das Kapitalinvestitionen und das Wachstum von Unternehmen durch niedrige Steuern und eine unternehmensfreundliche Politik fördert."
RAJ_phantom_armies:	"Phantom-Armeen"
RAJ_phantom_armies_desc:	"Wenn wir die Zahl der von uns beschäftigten Militärangehörigen in der Bilanz aufblähen, können wir das Finanzamt täuschen."
RAJ_corporate_domination:	"Vorherrschaft der Unternehmen"
RAJ_corporate_domination_desc:	"Während wir die Kontrolle über den Subkontinent festigen, sind wir in der Lage, den privaten und öffentlichen Sektor zunehmend zu dominieren. Mit unserem Ziel der totalen Kontrolle, direkt oder indirekt, sind wir in der Lage, die Produktivität in allen Unternehmen zu steigern."
RAJ_restrictive_administration_budget:	"Restriktiver Verwaltungshaushalt"
RAJ_restrictive_administration_budget_desc:	"Alle nicht lebensnotwendigen Zuwendungen müssen eingestellt werden, wir können uns das nicht leisten."
RAJ_open_up_new_markets:	"Neue Märkte erschließen"
RAJ_open_up_new_markets_desc:	"Wir riskieren, dass unser derzeitiger Markt in den kommenden Jahren gesättigt ist, wenn wir nicht drastische Maßnahmen ergreifen, um ihn zu erweitern. Daher werden wir uns an einigen feindlichen Übernahmen benachbarter Gebiete beteiligen."
RAJ_hostile_takeover:	"Feindliche Übernahme"
RAJ_hostile_takeover_tt:	"Schaltet Entscheidungen zum Kauf von Staaten für §YCivilian Factories§! frei. Staaten, mit denen wir ursprünglich beginnen, erhalten beim Kauf einen Rabatt."
RAJ_hostile_takeover_desc:	"Alles kann gekauft werden, alles. Es ist nur eine Frage des Preises und des Preises, zu dem man bereit ist, sich zu beugen."
RAJ_shareholder_democracy:	"Aktionärsdemokratie"
RAJ_shareholder_democracy_desc:	"Die gesetzgebende Macht in diesem Land liegt zwar im Unternehmen, aber nur dem Namen nach. Richter und Gesetzgeber stehen alle auf unserer Gehaltsliste, so dass es uns leicht fällt, günstige Gesetze zu verabschieden und die Opposition zu spalten."
RAJ_debt_manipulation:	"Schuldenmanipulation"
RAJ_debt_manipulation_desc:	"Wir können bestehende Schulden nutzen, um Verluste vorzutäuschen, so dass wir weniger Steuern zahlen und überschüssige Gewinne horten können."
RAJ_productivity_mandate:	"Produktivitäts-Mandat"
RAJ_productivity_mandate_desc:	"Wir sind von den Investoren gesetzlich verpflichtet, unsere Einnahmen zu steigern. Das bedeutet, dass wir um jeden Preis Wege zur Produktivitätssteigerung finden müssen."
RAJ_lowest_bigger_construction:	"Kostensparendes Bauen"
RAJ_lowest_bigger_construction_desc:	"Wir sollten immer den niedrigsten Bieter auswählen, um die Baukosten niedrig zu halten."
RAJ_water_privatization:	"Privatisierung von Wasser"
RAJ_water_privatization_desc:	"Wir werden öffentlich-private Partnerschaften mit lokalen Wasserversorgern eingehen, um die Effizienz und Qualität der Dienstleistungen zu verbessern."
RAJ_expand_tax_loopholes:	"Steuerschlupflöcher ausbauen"
RAJ_expand_tax_loopholes_desc:	"Wir werden Steuerschlupflöcher als Instrument zur Steuervermeidung nutzen."
RAJ_land_grab:	"Landerwerb"
RAJ_land_grab_desc:	"Wir müssen mehr Flächen für die industrielle Expansion freimachen."
RAJ_deforestation:	"Treibstoff für Feuer"
RAJ_deforestation_desc:	"Feuer befeuert die Industrie. Feuer braucht Holz und Kohle, und davon haben wir reichlich, warum sollten wir es also nicht nutzen?"
RAJ_agricultural_cooperatives:	"Landwirtschaftliche Genossenschaften"
RAJ_agricultural_cooperatives_tt:	"Gewinnen Sie §G1§! §YInfrastructure§! in jedem Staat, der mindestens 4 §YCivilian Factories§! besitzt. Gewinnen Sie §G1§! §YCivilian Factory§! für je 2 §YInfrastructure§!, die durch diesen Fokus gewonnen werden."
RAJ_agricultural_cooperatives_desc:	"Landwirtschaftliche Genossenschaften, die mehreren Bauern gehören, sind der Schlüssel zu Nachhaltigkeit, Eigenständigkeit und Selbstbestimmung."
RAJ_tea_exports_desc:	"Tee hat sich zu einem wichtigen Exportgut in der ganzen Welt entwickelt und ist ein Eckpfeiler im Leben vieler Inder."
RAJ_cottage_industries:	"Heimwerker-Industrie"
RAJ_cottage_industries_desc:	"Unternehmen und Produktionsstätten, die in den Häusern der Menschen angesiedelt sind, stellen eine Alternative zur Schwerindustrie dar und vermitteln den Menschen ein Gefühl der Unabhängigkeit."
RAJ_sikh_religious_guarantees:	"Religiöse Garantien der Sikhs"
RAJ_sikh_religious_guarantees_desc:	"Die Sikhs sind eine wichtige religiöse Minderheit und erbitterte Kämpfer. Wir müssen sie besänftigen, indem wir ihnen ihre religiösen Rechte garantieren."
RAJ_punjab_autonomy:	"Autonomie des Punjab"
RAJ_punjab_autonomy_desc:	"Der Punjab hat eine große Bedeutung für die Sikhs. Indem wir ihnen lokale Autonomie gewähren, können wir ihr Vertrauen gewinnen."
RAJ_handloom_weaving:	"Handweberei"
RAJ_handloom_weaving_desc:	"Die Handweberei ist auf dem Subkontinent zu einem Symbol für Tradition und Unabhängigkeit geworden und bietet gleichzeitig Arbeitsmöglichkeiten für lokale Hersteller."
RAJ_lahore_resolution:	"Lahore-Resolution"
RAJ_lahore_resolution_desc:	"Die muslimische Minderheit im Land hat die Lahore-Resolution verabschiedet, in der sie ein eigenes Heimatland, Pakistan, fordert."
RAJ_united_bengal:	"Vereinigtes Bengalen"
RAJ_united_bengal_tt:	"§Y[BAN.GetName]§! wird nach der Teilung frei sein"
RAJ_united_bengal_desc:	"Die Teilung Pakistans in zwei Länder, Bengalen und Pakistan, macht nur Sinn. Eine Regierung in Pakistan wäre nicht in der Lage, eine weit entfernte bangladeschische Enklave angemessen zu regieren."
RAJ_eastern_pakistan:	"Ost-Pakistan"
RAJ_eastern_pakistan_tt:	"§Y[BAN.GetName]§! wird nach der Teilung zu §Y[PAK.GetName]§! gehören"
RAJ_eastern_pakistan_desc:	"Bangladesch soll Ostpakistan werden und alle Muslime sollen unter einer Flagge regiert werden."
RAJ_partition_preparation:	"Vorbereitung auf die Teilung"
RAJ_partition_preparation_tt:	"§YWird die Auswirkungen der Teilung verringern, sobald sie stattfindet§! Mit der Vorbereitung erhalten wir: \n"
RAJ_partition_preparation_tt_2:	"Und ohne erhalten wir: \n"
RAJ_partition_preparation_desc:	"Wir müssen uns auf die Teilung vorbereiten, damit wir nicht das Chaos erleiden, das durch den Umzug von Millionen von Menschen entstehen wird."
RAJ_indian_independence_act:	"Indisches Unabhängigkeitsgesetz"
RAJ_indian_independence_act_desc:	"Es kommt ein Moment, der in der Geschichte nur selten vorkommt, in dem wir vom Alten zum Neuen aufbrechen, in dem ein Zeitalter endet und in dem die Seele einer Nation, die lange unterdrückt wurde, zum Ausdruck kommt."
RAJ_tryst_with_destiny:	"Rendezvous mit dem Schicksal"
RAJ_tryst_with_destiny_desc:	"Vor langen Jahren haben wir ein Rendezvous mit dem Schicksal geschlossen, und nun ist die Zeit gekommen, in der wir unser Versprechen einlösen werden, zwar nicht ganz oder in vollem Umfang, aber doch ganz wesentlich. Wenn die Mitternachtsstunde schlägt, wenn die Welt schläft, wird Indien zu Leben und Freiheit erwachen."
RAJ_india_united:	"Indien vereint"
RAJ_india_united_tt:	"§YIndien wird während der Teilung vereint bleiben und sich nicht spalten§!"
RAJ_india_united_desc:	"Wir sind Muslime, Hindus, Christen, Juden; wir alle sind Indien."
RAJ_power_sharing_agreement:	"Abkommen zur Machtteilung"
RAJ_power_sharing_agreement_desc:	"Die muslimische Liga betrachtet uns mit Misstrauen, weil sie Angst davor hat, was mit den Muslimen in einem von Hindus dominierten Indien geschehen wird. Wir werden ein Abkommen mit ihnen schließen, um die Macht gleichmäßig zu teilen."
RAJ_cabinet_mission_plan:	"Missionsplan des Kabinetts"
RAJ_cabinet_mission_plan_desc:	"Mit einer vereinten Front von Muslimen und Hindus sind wir bereit, der Delegation der [ENG.GetAdjective]-Regierung entgegenzutreten."
RAJ_inclusive_nationalism:	"Einschließender Nationalismus"
RAJ_inclusive_nationalism_desc:	"Nationalismus und Stolz auf das eigene Land ist nicht unbedingt etwas Schlechtes, solange wir ihn so fördern können, dass er alle einschließt. Wenn wir alle die gleiche Liebe für unser Land teilen, werden die Bande nicht reißen."
RAJ_a_secular_state:	"Ein säkularer Staat"
RAJ_a_secular_state_desc:	"Indien ist ein religiöses Land, aber es ist wichtig, dass der Staat selbst säkular ist, um jeden Zweifel an einer möglichen Voreingenommenheit gegenüber einer Minderheit auszuräumen."
RAJ_a_permanent_muslim_governmental_seat:	"Ein ständiger muslimischer Regierungssitz"
RAJ_a_permanent_muslim_governmental_seat_desc:	"Die Muslime sind eine große Minderheit in unserem Land. Um ihre Ängste vor einem vereinten Indien zu zerstreuen, werden wir ihnen einen ständigen Regierungssitz einräumen."
RAJ_pledge_for_the_allies:	"Versprechen für die Alliierten"
RAJ_pledge_for_the_allies_desc:	"Angesichts des Aufstiegs von Faschismus und Kommunismus auf der ganzen Welt kann Indien nicht allein stehen. [ENG.GetName] mag nicht Indiens Freund gewesen sein, aber es ist klar, dass die anderen unser Feind sind."
RAJ_sideline_the_conflict:	"Den Konflikt ausklammern"
RAJ_sideline_the_conflict_desc:	"Es ist nicht einzusehen, warum [ROOT.GetName] unter der Fehleinschätzung anderer und territorialen Aggressionen leiden sollte. Wir müssen uns nach innen konzentrieren, nicht nach außen."
RAJ_india_indivisible:	"Indien ist unteilbar"
RAJ_india_indivisible_tt:	"Schließt die Entscheidung für die Kernstaaten §YIndian§!, §YPakistani§! und §YBangladeshi§! auf"
RAJ_india_indivisible_desc:	"Unser Territorium ist immer noch von Unruhe und Konflikten geprägt. Wir müssen zusammenarbeiten, um [ROOT.GetName] ganz zu machen."
RAJ_preamble_to_the_constitution_of_india:	"Präambel der Verfassung von [GetRajName]"
RAJ_preamble_to_the_constitution_of_india_desc:	"Wir, das Volk von [GetRajName], haben heute in unserer verfassungsgebenden Versammlung feierlich beschlossen, [GetRajName] zu einer souveränen sozialistischen, säkularen, demokratischen Republik zu machen und all ihren Bürgern Gerechtigkeit, Freiheit und Gleichheit zu sichern und unter ihnen allen Brüderlichkeit zu fördern."
RAJ_an_economy_unbound:	"Eine ungebundene Wirtschaft"
RAJ_an_economy_unbound_desc:	"Unsere Wirtschaft wird nicht länger von unseren Oberherren unterdrückt und kann endlich aufblühen, befreit von ihren früheren Verpflichtungen."
RAJ_annex_goa:	"Anhang Goa"
RAJ_annex_goa_desc:	"Goa gehört zu Indien, das einst an imperialistische Kräfte verloren ging, und es ist klar, dass [POR.GetName] nicht in der Lage ist, es zu verteidigen. Wir müssen dieses historische Unrecht korrigieren."
RAJ_a_tiger_uncained:	"Ein entfesselter Tiger"
RAJ_a_tiger_uncained_desc:	"Zu lange wurden wir von verschiedenen Imperien unterjocht, angekettet an das Joch der imperialen Herrschaft. Nie wieder, wie ein Tiger, der sich endlich von seinen Peinigern befreit hat, wird er sich nie wieder willentlich unterjochen lassen."
RAJ_suppress_paramilitary_organizations:	"Paramilitärische Organisationen unterdrücken"
RAJ_suppress_paramilitary_organizations_desc:	"Es gibt immer noch verschiedene paramilitärische Gruppen in [GetRajName]. Wir müssen sie schnell ausrotten, denn wenn das Unkraut erst einmal fest in den Boden gepflanzt ist, sind die Wurzeln nur schwer auszureißen."
RAJ_defend_burma:	"Verteidigen Sie Birma"
RAJ_defend_burma_desc:	"[BRM.GetName] fungiert als Bollwerk gegen [JAP.GetName] Aggression. Die Stärkung ihrer Position ist für uns nur von Vorteil."
RAJ_mixed_economy:	"Gemischte Wirtschaft"
RAJ_mixed_economy_tt:	"Gewinnen Sie §G+3§! Ressourcen für jede §YExcavation Tech§!, die in jedem Kernstaat mit mehr als 6 Ressourcen erforscht wird"
RAJ_mixed_economy_desc:	"Wir haben viele natürliche Ressourcen, die Diversifizierung in die Mineraliengewinnung wird unsere Selbständigkeit stärken."
RAJ_land_reforms:	"Landreformen"
RAJ_land_reforms_desc:	"Wenn wir mehr Menschen die Möglichkeit geben, das Land zu nutzen, das sie besitzen, werden wir sie aus ihrer Notlage befreien."
RAJ_education_efforts:	"Bemühungen um Bildung"
RAJ_education_efforts_2:	"$RAJ_education_efforts$"
RAJ_education_efforts_desc:	"Die Alphabetisierungsrate in [ROOT.GetName] ist immer noch mager. Wir müssen die Bildungsausgaben drastisch erhöhen, um zu den Großmächten aufzuschließen."
RAJ_education_efforts_2_desc:	"$RAJ_education_efforts_desc$"
RAJ_fight_malnutrition:	"Unterernährung bekämpfen"
RAJ_attract_scientists:	"Wissenschaftler anlocken"
RAJ_attract_scientists_desc:	"Dank unseres großen Reichtums können wir jetzt die besten Wissenschaftler aus der ganzen Welt anziehen."
RAJ_fight_malnutrition_desc:	"Wir müssen umfassende Pläne zur Bekämpfung der Unterernährung in der Bevölkerung umsetzen."
RAJ_import_substitution_industrialisation:	"Importsubstitution Industrialisierung"
RAJ_import_substitution_industrialisation_desc:	"Wann immer wir können, sollten wir importierte Waren durch einheimische ersetzen, indem wir ihre Herstellungskosten ausgleichen."
RAJ_i_am_death:	"Ich bin der Tod"
RAJ_i_am_death_desc:	"Unser Anführer, der nach dem Attentat in Trance ist, ist aufgetaucht. Als er über die Brutalität seiner Tortur nachdachte, hatte er eine Erleuchtung: Wenn die Grausamkeit der Menschheit nicht verhindert werden kann, dann sollte die gesamte Menschheit unter seinem festen demokratischen Griff stehen."
RAJ_destroyer_of_worlds:	"Zerstörer der Welten"
RAJ_destroyer_of_worlds_desc:	"Mit der Zeit werden wir zu einem mächtigen Zerstörer von Welten heranwachsen, um unsere Feinde auszulöschen."
RAJ_uranium_tipped_bullets:	"Uranbestückte Kugeln"
RAJ_uranium_tipped_bullets_desc:	"Was werden wir mit all unserem überschüssigen Uran tun, wenn wir unsere Kugeln damit bestücken?"
RAJ_uranium_tipped_bullets_tt:	"§Y$category_all_infantry$§!:\n Harte Attacke: §G+25%§!\n Durchdringend: §G+100%§!\n§Y$category_cavalry$§!:\n Harte Attacke: §G+10%§!\n Durchbohren: §G+40%§!\n§Y$category_artillery$§!:\n Durchbohren: §G+100%§!\n§Y$category_tank_destroyers$§!\n Harte Attacke: §G+15%§!\n Durchbohren: §G+20%§!\n§Y$anti_tank$§!\n Harte Attacke: §G+10%§!\n Durchbohren: §G+20%§!\n§Y$mot_anti_tank_brigade$§!\n Harte Attacke: §G+10%§!\n Durchbohren: §G+20%§!\n§Y$anti_air$§!\n Luftabwehr-Angriff: §G+10%§!\n§Y$mot_anti_air_brigade$§!\n Luftabwehr-Angriff: §G+10%§!"
RAJ_contamination_cleanup_crew:	"Besatzung für Kontaminationsbeseitigung"
RAJ_contamination_cleanup_crew_desc:	"Unsere Soldaten müssen bereit sein, auch unter den härtesten Bedingungen zu kämpfen, sogar im nuklearen Fallout."
RAJ_rolling_nuke_barrages:	"Rollende Atombombenbarrikaden"
RAJ_rolling_nuke_barrages_desc:	"Rolling Barrages waren während des Ersten Weltkriegs gang und gäbe. Neue Technologien ermöglichen noch verheerendere Sperrfeuer."
RAJ_bathe_in_hellfire:	"Im Höllenfeuer baden"
RAJ_bathe_in_hellfire_desc:	"Unsere Feinde werden nur zwei Alternativen haben, sich zu fügen oder sich dem Scheiterhaufen zu stellen."
RAJ_bathe_in_hellfire_desc_tt:	"§YNukes§! zerstören jetzt §Y50%§! der Zielstaaten §YMilitärische Fabriken§! dauerhaft.\n§YThermonuclear Nukes§! zerstören jetzt §Y100%§! der Zielstaaten §YMilitärische Fabriken§! dauerhaft."
RAJ_jaguar:	"Jaguar"
RAJ_jaguar_desc:	"Der Jaguar ist ein erstklassiger Kandidat, um demokratische Gerechtigkeit von oben zu gewährleisten."
RAJ_ammunition_factory_khadki:	"Munitionsfabrik Khadki"
RAJ_ammunition_factory_khadki_desc:	"Um eine moderne Kampftruppe mit Waffen versorgen zu können, müssen wir die Munitionsfabriken unseres Landes drastisch ausbauen."
RAJ_rifle_factory_ishapore_west_bengal:	"Gewehrfabrik Ishapore"
RAJ_rifle_factory_ishapore_west_bengal_desc:	"Die Gewehrfabrik in Ishapore wird mit der Fabrik in Khadki zusammenarbeiten, um die Armee mit Kleinwaffen zu versorgen."
RAJ_gun_and_shell_factory_cossipore:	"Gewehr- und Granatenfabrik"
RAJ_gun_and_shell_factory_cossipore_desc:	"Die Fabrik in Cassiopore wird unsere Fähigkeiten in Bezug auf die Ausrüstung der Infanterie und die Bereitstellung von Munition für die Truppen weiter verbessern."
RAJ_cordite_factory_aruvankadu_tamil_nadu:	"Korditfabrik Aruvankadu"
RAJ_cordite_factory_aruvankadu_tamil_nadu_desc:	"Gute Treibladungen für die Artillerie werden unseren schweren Geschützen einen Vorteil gegenüber unseren Feinden verschaffen."
RAJ_local_recruitment_offices:	"Lokale Rekrutierungsbüros"
RAJ_local_recruitment_offices_desc:	"Wir haben eine große Bevölkerung, von der viele bereit wären, freiwillig in die Armee einzutreten, um ihre wirtschaftliche Situation zu verbessern, anstatt dass wir eine allgemeine Wehrpflicht einführen müssen. Die Einrichtung von Rekrutierungsbüros wird uns reichlich Freiwillige bescheren."
RAJ_local_recruitment_offices_tt:	"Jeder [?RAJ_recruitment_offices_timeout_max]te Monat wird die Strafe von §Y$idea_RAJ_agrarian_society$§! um den Faktor der rekrutierbaren Bevölkerung verringern: §G+[?RAJ_agrarian_society_conscription_factor_penalty_reduction_display]%§!\n Mobilisierungsgeschwindigkeit: §G[?RAJ_agrarian_society_mobilization_speed_penalty_reduction_display]%§!\n Mobilisierungsgesetz Kostenfaktor: §G[?RAJ_agrarian_society_mobilization_laws_cost_factor_penalty_reduction_display]%§!"
RAJ_military_pensions:	"Militärische Renten"
RAJ_military_pensions_desc:	"Die Bereitstellung von Militärrenten als Teil des Armeepakets wird den Militärkomplex als Ganzes stärken, indem das Personal länger gehalten wird."
RAJ_legacy_of_military_service:	"Erbe des Militärdienstes"
RAJ_legacy_of_military_service_desc:	"Es gibt viele Dörfer rund um [GetRajName], in denen die Väter im Militär gedient haben, so dass ihre Söhne dazu gedrängt werden, dies auch zu tun. Das ist schließlich Tradition und wir können dies nutzen, um mehr Rekruten zu gewinnen, als es normal wäre."
RAJ_indian_states_force:	"Die Streitkräfte der indischen Staaten"
RAJ_indian_states_force_desc:	"Die Fürstenstaaten haben ihre eigenen Streitkräfte, die zur Verteidigung von [GetRajName] herangezogen werden können."
RAJ_frontier_corps:	"Grenzkorps"
RAJ_frontier_corps_desc:	"Unser Land besteht aus mehreren Biomen, darunter auch die zerklüfteten Grenzgebiete im Osten. Es wäre ein Segen für uns, wenn wir mit der dortigen Miliz in Kontakt treten und ihr Fachwissen über die raue Kriegsführung in der Umwelt einbeziehen könnten."
RAJ_seven_shackles:	"Sieben Fesseln"
RAJ_seven_shackles_2:	"Vierte bis Sechste der Sieben Fesseln"
RAJ_release_subjects_hint_tt:	"§Die von uns auf dem Subkontinent freigelassenen Subjekte werden mit größerer Wahrscheinlichkeit industrielle Schwerpunkte gegenüber anderen Schwerpunkten bevorzugen."
RAJ_famine_impact_reduction:	"§YDas wird die Auswirkungen einer Hungersnot verringern, wenn sie eintritt§!"
has_arrested_bose:	"Die britische Regierung hat Subhas Chandra Bose verhaftet."
RAJ_heavy_industries:	"Schwerindustrie"
RAJ_heavy_industries_desc:	"Wir müssen uns schnell industrialisieren. Indien braucht Schwerindustrien in einer modernen Welt"
RAJ_strike_against_china:	"Streik gegen [CHI.GetName]"
RAJ_strike_against_china_desc:	"Wenn [CHI.GetName] zu einer regionalen Macht wird, werden sie uns angreifen, vielleicht nicht heute, aber sicher morgen. Wir müssen zuerst zuschlagen"
RAJ_strike_burma:	"Schlagt zu [BRM.GetNameDef]"
RAJ_strike_burma_desc:	"Wir können nicht dulden, dass eine Nation wie Birma unabhängig bleibt, so nahe an unserer Grenze."
RAJ_cult_of_personality:	"$GUAY_cult_of_personality$"
RAJ_cult_of_personality_desc:	"$GUAY_cult_of_personality_desc$"
RAJ_seek_financial_aid_from_the_ussr:	"Bitten Sie um finanzielle Hilfe von [SOU.GetNameDef]"
RAJ_seek_financial_aid_from_the_ussr_desc:	"Wir müssen die nächstgelegene Großmacht um Hilfe bitten."
RAJ_guided_democracy:	"Geführte Demokratie"
RAJ_guided_democracy_desc:	"Wir können die Illusion von Demokratie zulassen, während wir das Ergebnis zu unseren Gunsten verändern."
RAJ_authoritarianship:	"Autoritäres Handeln"
RAJ_authoritarianship_desc:	"Eine starke zentralisierte Autorität wird Frieden, Gerechtigkeit und Stabilität für unseren neuen Staat gewährleisten."
RAJ_the_sun_sets:	"Die Sonne geht unter"
RAJ_the_sun_sets_desc:	"Es ist an der Zeit, das [ENG.GetAdjective] Imperium zu teilen. Die Sonne wird für die [ENG.GetAdjective] untergehen, und wir werden sie schlucken."
RAJ_great_depression_price_controls:	"Große Depression Preiskontrollen"
RAJ_great_depression_price_controls_desc:	"Die Große Depression hat den Subkontinent hart getroffen. Durch die Bindung der Rupie an das Pfund Sterling und die Einführung verschiedener Preiskontrollen hoffen wir, die Situation zu stabilisieren."
RAJ_look_to_the_past:	"Blick in die Vergangenheit"
RAJ_look_to_the_past_desc:	"Die Preiskontrollen haben einen Faktor der großen Depression erfolgreich abgemildert, aber infolgedessen richten die Kontrollen derzeit verheerenden Schaden in der Wirtschaft an, da die Inflation außer Kontrolle gerät. Verzweiflung führt zu Uneinigkeit und immer mehr lokale Führer finden zu politischer Stärke, indem sie die Bevölkerung mit Geschichten über vergangene Größe aufrütteln. Kann das, was einmal war, wieder auferstehen?"
RAJ_secure_weapons:	"Sichere Waffen"
RAJ_secure_weapons_desc:	"Unsere Militärausrüstung ist ein Sammelsurium von nicht aufeinander abgestimmten Varianten aus einer Reihe von Nationen. Mit ein wenig Hilfe aus dem Ausland können wir jedoch Ausrüstung erwerben, um uns zu befreien."
RAJ_stir_unrest_in_the_north:	"Schüren Sie Unruhen im Norden"
RAJ_stir_unrest_in_the_north_desc:	"Die Menschen in den nördlichen Teilen des Raj sind unverhältnismäßig stark von den Preiskontrollen betroffen. Sie sind wie trockenes Gras, alles was wir brauchen, ist ein Funke, um das Feuer zu entfachen. "
RAJ_stir_unrest_in_the_north_focus_tt:	"Wir werden die Kontrolle über die folgenden Staaten behalten, wenn wir uns abspalten:"
MUGHAL_divisions_spawned:	"§Y4§! voll ausgerüstete loyalistische Divisionen werden sich uns anschließen, wenn wir einen Aufstand auslösen."
RAJ_the_mughal_uprising:	"Der Mogul-Aufstand"
RAJ_the_mughal_uprising_desc:	" Die abgelegene Region im Norden bietet die perfekte geografische Lage, um sich von den Briten zu lösen.\nDie lokalen Anführer haben die Herzen der Menschen mit Erzählungen über die glorreiche Vergangenheit geschürt, als die Moguln dieses Land beherrschten, frei, um ihr eigenes Schicksal zu suchen.\nInshallah, das werden wir auch."
RAJ_the_mughal_uprising_tt:	"Wir werden uns vom britischen Raj§! lösen und den Krieg für die Unabhängigkeit§! erklären."
RAJ_the_mughal_uprising_tt2:	"Wir werden alle Staaten besitzen, die wir am Ende des Bürgerkriegs kontrollieren. "
6_month_timer_mughal_tt:	"Wir werden §Y1§! Jahr Zeit haben, diesen Krieg zu gewinnen, bevor die dezentrale Verwaltung einen Waffenstillstand anbietet."
RAJ_reform_the_agricultural_system:	"Das Agrarsystem reformieren"
RAJ_reform_the_agricultural_system_desc:	"Zu lange wurde das indische Ernährungssystem von Vernachlässigung, Misswirtschaft und Ausbeutung geplagt. Nachdem das Mogulreich wiederhergestellt ist, müssen wir dafür sorgen, dass kein Untertan mehr hungern muss. Indem wir in die Bewässerung investieren, die Landwirtschaft modernisieren und den Griff der räuberischen Großgrundbesitzer brechen, werden wir Indien in ein Land des Überflusses verwandeln, in dem Hungersnöte ein Relikt der Vergangenheit sind."
RAJ_princley_state_breakaway_tt:	"§Y [442.GetName] \n [987.GetName] \n [988.GetName] \n [444.GetName] \n [445.GetName] \n [1012.GetName] \n§!"
RAJ_GOE_enforced_peace_decision:	"Drohender Waffenstillstand"
RAJ_GOE_enforced_peace_decision_desc_tt:	"Wenn wir es schaffen, lange genug durchzuhalten, wird die [UK_INDIA.GetAdjective] Regierung uns einen Waffenstillstand anbieten."
RAJ_GOE_enforced_peace_decision_desc_eng_tt:	"Wenn [RAJ.GetName] lange genug durchhält, wird die [UK_INDIA.GetAdjective] Regierung ihnen einen Waffenstillstand mit territorialen Zugeständnissen anbieten."
RAJ_GOE_enforced_peace_decision_desc_2_tt:	"§Wenn wir auch [440.GetName], [988.GetName], [442.GetName] und [439.GetName] kontrollieren, werden wir größere territoriale Zugeständnisse erhalten!§!"
RAJ_GOE_mughal_independence_category:	"Unabhängigkeit der Moguln"
RAJ_GOE_enforced_peace_decision_eng:	"$RAJ_GOE_enforced_peace_decision$"
RAJ_the_legacy_of_babur:	"Das Vermächtnis von Babur"
RAJ_the_legacy_of_babur_desc:	"Das Mogulreich vereinigte einst weite Teile des Subkontinents unter seinem Banner. Heute träumen einige davon, seinen Ruhm wiederherzustellen und das Erbe Baburs zu nutzen, um eine neue Ära des kaiserlichen Wiederaufstiegs und der Einheit zu inspirieren."
RAJ_the_legacy_of_babur_tt:	"Jeder Staat, in dem es Unruhen gegeben hat, wird sie erhalten: "
RAJ_a_peacock_prince:	"Der Pfauenprinz"
RAJ_a_peacock_prince_desc:	"Das Erbe der Moguln verlangt nach einem würdigen Anführer, der den Thron zurückfordert. Unter den Fürstenstaaten muss ein Pfauenprinz aufsteigen - einer, dessen Abstammung, Ehrgeiz und Visionen die Größe des Reiches wiederherstellen und den Subkontinent wieder vereinen können."
RAJ_halls_of_knowledge:	"Säle des Wissens"
RAJ_halls_of_knowledge_desc:	"Eine starke Nation ist auf dem Fundament des Wissens aufgebaut. Indem wir in Forschung und Bildung investieren, kultivieren wir Innovationen, befähigen unsere Menschen und sichern [ROOT.GetNameDef]s Platz als führendes Land in Wissenschaft, Industrie und Fortschritt."
RAJ_sharpen_the_tulwar:	"Schärfen Sie den Tulwar"
RAJ_sharpen_the_tulwar_desc:	"Der Tulwar, ein Symbol der Stärke und des Trotzes, muss für die kommenden Schlachten geschärft werden. Indem wir unsere Streitkräfte modernisieren und unsere Strategien verfeinern, stellen wir sicher, dass [ROOT.GetNameDef] bereit ist, entschlossen zuzuschlagen, wenn es der Moment erfordert."
RAJ_timurid_bureaucracy:	"Timuridische Bürokratie"
RAJ_timurid_bureaucracy_desc:	"Die timuridische Bürokratie, die auf das Erbe Timurs zurückgeht, ist ein Modell für effizientes Regieren und zentralisierte Kontrolle. Die Wiederbelebung dieses Systems wird die Verwaltung des Mogulreichs stärken und für Stabilität und Wohlstand in seinen riesigen Territorien sorgen."
RAJ_conquer_afghanistan:	"Erobern Sie Afghanistan"
RAJ_conquer_afghanistan_desc:	"Afghanistan, das angestammte Herz des Reiches, muss zurückerobert werden. Indem wir die Kontrolle über diese historische Region wiederherstellen, ehren wir das Erbe der Moguln und sichern eine wichtige Festung für das Wiederaufleben des Reiches."
RAJ_across_the_himalayas:	"Jenseits des Himalayas"
RAJ_across_the_himalayas_desc:	"Die Länder jenseits des Himalaya bergen ungeahnte Reichtümer und strategische Bedeutung. Indem wir den Einfluss des Mogulreiches über diese gewaltigen Gipfel ausdehnen, festigen wir unsere Dominanz und sichern neue Grenzen für den Ruhm des Reiches."
RAJ_through_the_wakhan_corridor:	"Durch den Wakhan-Korridor"
RAJ_through_the_wakhan_corridor_desc:	"$RAJ_skibedi_san_ma_desc$"
RAJ_skibedi_san_ma:	"Die Kriegsherren brechen"
RAJ_skibedi_san_ma_desc:	"Die Kriegsherren von Xibei San Ma stellen ein Hindernis für die Vorherrschaft des Mogulreiches in Zentralasien dar. Mit einem entschlossenen Feldzug können wir ihre Macht brechen, strategische Handelswege sichern und den Einfluss des Reiches in der Region ausweiten."
RAJ_conquerors_of_persia:	"Eroberer von Persien"
RAJ_conquerors_of_persia_desc:	"[PER.GetNameDef], ein Land von unermesslichem Reichtum und Geschichte, war einst ein Rivale des Kaiserreichs. Indem wir es unter die Herrschaft der Moguln bringen, bekräftigen wir unsere Dominanz, sichern uns lebenswichtige westliche Gebiete und festigen den Platz des Reiches als wahrer Erbe der kaiserlichen Größe."
RAJ_halls_of_knowledge_2:	"Kaiserliche Akademien"
RAJ_halls_of_knowledge_2_desc:	"Wissen ist der Schlüssel zu dauerhafter Macht. Durch die Einrichtung kaiserlicher Akademien im gesamten Mogulreich fördern wir Gelehrte, Wissenschaftler und Verwaltungsbeamte, die Innovationen vorantreiben, die Regierungsführung stärken und das Erbe des Reiches an Weisheit und Fortschritt sichern werden."
RAJ_halls_of_knowledge_3:	"Der Brunnen des ewigen Wissens"
RAJ_halls_of_knowledge_3_desc:	"Wissen mag zu einem tiefen Brunnen des Chaos führen, in den der Mensch nicht vorzudringen wagt, aber wir müssen ihn betreten."
RAJ_elephants_for_the_modern_age:	"Elefanten für das moderne Zeitalter"
RAJ_elephants_for_the_modern_age_desc:	"Die mächtigen Kriegselefanten des Mogulreiches beherrschten einst das Schlachtfeld. Jetzt passen wir ihr Erbe an das moderne Zeitalter an, indem wir in gepanzerte Fahrzeuge und mechanisierte Streitkräfte investieren und so unaufhaltsame Kriegsmaschinen schaffen, die unser Reich zum Sieg führen."
RAJ_unite_the_subcontinent:	"Vereinigen Sie den Subkontinent"
RAJ_unite_the_subcontinent_desc:	"Die zersplitterten Staaten des Subkontinents sind nur noch ein Schatten ihres früheren Glanzes. Indem wir diese Länder unter dem Banner der Moguln vereinen, stellen wir die Harmonie, Stärke und Größe eines Reiches wieder her, das dazu bestimmt war, von den Bergen bis zu den Meeren zu herrschen."
RAJ_the_true_mongols:	"Die wahren Mongolen"
RAJ_the_true_mongols_desc:	"[Root.GetNameDef] ist der rechtmäßige Erbe des mongolischen Erbes und verbindet die Kraft der Steppen mit der Kultur des Subkontinents. Indem wir uns auf unsere Wurzeln besinnen, kanalisieren wir den Geist der Wahren Mongolen, um zu erobern und zu vereinen, wie es unsere Vorfahren einst taten."
RAJ_halls_of_knowlege_3:	"Die Bibliotheken des Reiches"
RAJ_halls_of_knowlege_3_desc:	"Eine gelehrte Gesellschaft ist die Grundlage eines blühenden Reiches. Durch den Bau großer Bibliotheken im gesamten Mogulreich bewahren wir altes Wissen, fördern Innovationen und inspirieren künftige Generationen, um das Reich zu unvergleichlicher Größe zu führen."
RAJ_thunder_elephants:	"Donnernde Elefanten"
RAJ_thunder_elephants_desc:	"Die majestätischen Elefanten, Symbole der mogulischen Macht, kehren als Verkörperung von Stärke und Tradition auf das Schlachtfeld zurück. Ihre schiere Macht und Präsenz wird unsere Armeen inspirieren und die Herzen unserer Feinde in Angst und Schrecken versetzen und den Weg für kaiserliche Siege ebnen."
RAJ_revolt_of_the_princes:	"Revolte der Prinzen"
RAJ_revolt_of_the_princes_desc:	"Die Fürstenstaaten, die lange Zeit unter britischer Herrschaft unterworfen waren, werden sich erheben, um ihr Erbe zurückzufordern."
RAJ_revolt_of_the_princes_tt:	"Nach der Kriegserklärung an das britische Raj werden sich die Fürstenstaaten erheben und sich uns anschließen und zu Untertanen werden."
RAJ_secular_rule:	"Weltliche Verwaltung"
RAJ_secular_rule_desc:	"Das Mogulreich lebt von seiner Vielfalt, und eine säkulare Verwaltung gewährleistet eine faire Regierungsführung für alle Untertanen, unabhängig von ihrem Glauben. Indem wir Verdienst und Gleichheit in den Vordergrund stellen, stärken wir die Einheit des Reiches und sichern uns die Loyalität in seinen riesigen und vielfältigen Gebieten."
RAJ_theocratic_rule:	"Neukodifizierung der Dhimmi"
RAJ_theocratic_rule_desc:	"Die Rechte von Nicht-Muslimen waren unter der Moghul-Verwaltung stark reglementiert. Es ist an der Zeit, diese Angelegenheiten an eine moderne Welt anzupassen und ganz Indien zu beweisen, dass wir ein aufgeklärtes Reich sind."
RAJ_mughal_court:	"Mogulgericht"
RAJ_mughal_court_desc:	"Am Mogulhof versammeln sich die klügsten Köpfe und einflussreichsten Führer des Reiches. Indem wir diese Berater ermächtigen, stärken wir das Reich durch ihre Führung und stellen sicher, dass jede Entscheidung den Ruhm und die Ambitionen unserer Herrschaft widerspiegelt."
RAJ_mughal_court_princely_states_tt:	"Alle Prinzen werden ihren Fürstenstaat verlassen und sich dem Mogulreich als verfügbarer Berater oder General anschließen."
RAJ_the_silk_road:	"Erweitern Sie die Seidenstraße"
RAJ_the_silk_road_desc:	"Die Seidenstraße brachte einst Reichtum und Kultur in das Reich. Indem wir dieses historische Handelsnetz wiederherstellen, erobern wir unseren Platz im Zentrum des globalen Handels zurück, bereichern das Reich und fördern den Wohlstand in seinen riesigen Domänen."
RAJ_restore_the_timurid_empire:	"Das Timuridenreich wiederherstellen"
RAJ_restore_the_timurid_empire_desc:	"Die Banner Timurs wehen wieder, und das Reich, das einst die Herzen der Sultane und Könige in Angst und Schrecken versetzte, ist aus der Asche der Geschichte auferstanden. Unsere Herrschaft erstreckt sich über die Länder, die einst von seinen Eroberungen geprägt wurden, und verbindet Ost und West unter einer einzigen Herrschaft. Die Welt soll aufhorchen - die Timuriden sind zurückgekehrt, und dieses Mal werden wir nicht in der Vergangenheit verschwinden."
RAJ_peacock_throne_for_the_modern_age:	"Der Pfauenthron für das moderne Zeitalter"
RAJ_peacock_throne_for_the_modern_age_desc:	"Der Pfauenthron war das ultimative Sinnbild für die Macht und Größe unserer Vorfahren. Indem wir einen neuen Thron an unserem historischen Sitz der Macht errichten, bekräftigen wir unsere Vorherrschaft, wecken Loyalität und machen unsere Vision für die fruchtbaren Deltas des Subkontinents deutlich."
RAJ_the_crown_and_the_world:	"Die Krone und die Welt"
RAJ_the_crown_and_the_world_desc:	"Es ist das Schicksal des Mogulreiches, zur unangefochtenen globalen Supermacht aufzusteigen. Indem wir unseren Einfluss erweitern, unsere Stärke ausbauen und unsere Vorherrschaft behaupten, werden wir unseren Platz als ultimativer Herrscher der modernen Welt sichern."
RAJ_conquerors_of_iraq:	"Marsch auf Mesopotamien"
RAJ_conquerors_of_iraq_desc:	"Der Irak war einst ein wichtiger Knotenpunkt des Handels und der Macht in Timurs Reich, und seine Reichtümer beflügelten unseren vergangenen Ruhm. Jetzt liegt es in den Händen unbedeutender Herrscher, die seines Erbes nicht würdig sind. Indem wir Mesopotamien wieder unter unsere Herrschaft bringen, werden wir ein strategisches Kernland sichern, das Tor zwischen Ost und West kontrollieren und die Welt daran erinnern, dass die Timuriden nicht fragen - sie nehmen."
RAJ_conquerors_of_turkey:	"Die zweite Schlacht von Ankara"
RAJ_conquerors_of_turkey_desc:	"Anatolien war einst ein Schlachtfeld für Imperien, und die Geschichte erinnert sich an den Triumph Timurs über die Osmanen. Doch die Nachfolger dieses zerbrochenen Sultanats stehen noch immer und klammern sich an Länder, die rechtmäßig unter unserer Herrschaft stehen. Wenn wir noch einmal nach Westen marschieren, werden wir ihre Verteidigungsanlagen zerschlagen und unsere vergangenen Eroberungen zurückerobern."
RAJ_reviving_the_workshop_of_the_world:	"Die Werkstatt der Welt wiederbeleben"
RAJ_reviving_the_workshop_of_the_world_desc:	"Vor der britischen Herrschaft war Indien ein globales Zentrum der Industrie, der Textilien und des Handels. Jetzt, da das Empire wiederauferstanden ist, ist es an der Zeit, dieses Erbe zurückzufordern. Durch die Modernisierung unserer Fabriken und die Wiederbelebung unserer Handelswege werden wir unsere Wirtschaft in ein Kraftwerk verwandeln, das es mit den großen Nationen der Welt aufnehmen kann."
RAJ_legacy_of_timur:	"Das Erbe von Timur"
RAJ_legacy_of_timur_desc:	"Das Reich von Timur sollte nie in der Geschichte verblassen. Indem wir unsere angestammten Länder zurückerobern und sie unter einer einzigen Herrschaft vereinen, werden wir das Erbe der Timuriden wiederbeleben und eine neue Ära der Stärke und des Ehrgeizes einleiten. Die Welt wird erneut vor den Söhnen Timurs erzittern."
RAJ_forging_the_mughal_arsenal:	"Das Arsenal der Moguln wiederaufbauen"
RAJ_forging_the_mughal_arsenal_desc:	"Die Kriege der Vergangenheit wurden mit Stöcken und Steinen gewonnen, diese Zeiten sind vorbei. Wenn unser Reich gegen die Großmächte der modernen Welt bestehen soll, müssen wir eine industrielle Basis aufbauen, die in der Lage ist, eine riesige Militärmaschine zu unterhalten. Die Fließbänder werden mit dem Klang der Industrie summen und bald werden unsere Armeen mit Waffen marschieren, die von unseren eigenen Händen geschmiedet wurden."
RAJ_rebuilding_the_empires_roads:	"Wiederaufbau der Straßen des Imperiums"
RAJ_rebuilding_the_empires_roads_desc:	"Ein Imperium kann nicht funktionieren, wenn es nicht die Möglichkeit hat, seine Armeen, Waren und Menschen zu transportieren. Die verfallenen Straßen und Eisenbahnen, die die Briten hinterlassen haben, müssen ausgebaut und modernisiert werden."
if_not_subcontinent_tt:	"Wenn wir §Y$RAJ_unite_the_subcontinent$§! nicht fertiggestellt haben:"
if_not_silk_road_tt:	"Wenn wir §Y$RAJ_the_silk_road$§! nicht abgeschlossen haben:"
also_on_vijay_tt:	"Gewinnen Sie Kerngebiete in §YSouthern India§! und §YCoromandel§!."
unlock_decisions_silk_road_tt:	"Schaltet Entscheidungen frei, um mehr §YSilk Road§! Gebiet zu entkernen"
mughal_west_britain_company_dec:	"Eingliedern der West Britain Company"
allows_mughal_west_british_company_tt:	"Ermöglicht eine administrative Entscheidung."
create_mwbc_tt:	"Erschafft die §Y$mughal_west_britain_company$§! mit Kernen auf dem Festland von England und Wales."
RAJ_hedgemony_of_the_subcontinent:	"Hegemonie auf dem Subkontinent"
RAJ_hedgemony_of_the_subcontinent_desc:	"Wir haben die industrielle Vorherrschaft auf dem Subkontinent erlangt und alle anderen, die einen solchen Titel beanspruchen könnten, verdrängt. Wir sind unangreifbar geworden und lassen die anderen Abtrünnigen in den Staub fallen."
RAJ_hedgemony_of_the_subcontinent_tt:	"Alle beginnenden Staaten sind im Besitz von [ROOT.GetName]."
pak_factories_tt:	"[RAJ.GetName] hat §Y150%§! mehr Fabriken als §Y[PAK.GetName]§!Unsere Fabriken: [?var:THIS.num_of_factories]\nNeeded: [?var:pak_factories] "
pak_tech_tt:	"[RAJ.GetName] hat §Y30%§! mehr Techs als §Y[PAK.GetName]§!\nUnsere Techs: [?var:THIS.num_researched_technologies]\nBedarf: [?var:pak_researched_techs] "
RAJ_orchestrate_train_robberies_desc:	"Die englischen Züge sind voll von Reichtum. Ihr Verlust ist unser Gewinn."
RAJ_revisiting_inquities:	"Auge um Auge"
RAJ_revisiting_inquities_desc:	"Der historische Niedergang unseres Reiches wurde durch die Einmischung ausländischer Handelsgesellschaften nur noch beschleunigt. Es gibt einige unter uns, die glauben, dass es mit unserer neu gewonnenen Macht unser Recht ist, unsere alten Feinde denselben Ungerechtigkeiten zu unterwerfen, die sie uns einst angetan haben."
RAJ_royal_indian_navy_mutiny:	"Meuterei der Königlichen Indischen Marine"
RAJ_royal_indian_navy_mutiny_desc:	"Unter den indischen Seeleuten macht sich Unzufriedenheit breit, die unsere Sache unterstützt. Wir können dies nutzen, um die Macht zu ergreifen und die englische Verstärkung aufzuhalten. Sie werden keine andere Wahl haben, als sich zu unterwerfen."
RAJ_accept_russian_muhajir_money_desc:	"Ausländisches Gold fließt in unsere Hände und schürt die Feuer der Revolution."
RAJ_jugantar_desc:	"Der Geist von Jugantar erwacht und der Widerstand breitet sich im ganzen Land aus. Wir können dies nutzen, um Bengalen wieder einzunehmen."
RAJ_bhoodan_movement_desc:	"Das Land wird denen zurückgegeben, die es bewirtschaften, und ihr Vertrauen für immer gewonnen."
RAJ_the_peoples_liberation_army_desc:	"Eine Armee von Arbeitern und Bauern steht bereit, um für die Freiheit zu kämpfen."
RAJ_deathblow_to_imperial_remnants_desc:	"[PAK.GetName] hat als Stellvertreter für die Engländer fungiert, die ihnen in einer Verzweiflungstat große Mengen an Ressourcen zukommen ließen, um ein Gegengewicht zur steigenden Flut des Kommunismus zu schaffen. Wir werden diesen Streit endlich beenden."
RAJ_the_revolutionary_army_marches_desc:	"Unsere Armee marschiert zielstrebig, für die Revolution, für Indien und für den einfachen Mann."
RAJ_nationalize_british_owned_factories_desc:	"Die Fabriken der Unterdrücker gehören jetzt dem Volk, so wie es immer hätte sein sollen."
RAJ_threaten_princes_desc:	"Die Prinzen werden sich unseren Forderungen beugen oder die Konsequenzen ihrer Missachtung tragen."
RAJ_exile_princes_desc:	"Die Zeit der Prinzen ist vorbei. Sie werden ins Exil geschickt werden, weit weg von ihren Thronen und ihrem Einfluss."
RAJ_look_to_the_future:	"Blick in die Zukunft"
RAJ_look_to_the_future_desc:	"Wir müssen in die Zukunft blicken, nicht in die Vergangenheit, um dieses Preis-Chaos zu kontrollieren. Ein umfangreiches Paket von Stabilisierungsmaßnahmen muss umgesetzt werden, und zwar gestern."
RAJ_lobby_parliment:	"Lobbyarbeit im Parlament"
RAJ_lobby_parliment_desc:	"Wir werden das Parlament mit Hilfe privater Investoren davon überzeugen, dass die einzige Möglichkeit, einen erneuten weltweiten Zusammenbruch, ähnlich wie bei der Großen Depression, zu vermeiden, darin besteht, Teile des Raj an private Investoren zu verkaufen."
RAJ_lobby_parliment_tt:	"Wir werden mit der Gründung der East India Company beginnen."
RAJ_orchestrate_train_robberies:	"Zugüberfälle orchestrieren"
RAJ_accept_russian_muhajir_money:	"Russisches Muhajir-Geld akzeptieren"
RAJ_jugantar:	"Jugantar"
RAJ_jugantar_tt:	"Nachdem wir [PAK.GetName] den Krieg erklärt haben, werden wir uns um Bangladesh herum aufteilen"
RAJ_bhoodan_movement:	"Bhoodan-Bewegung"
RAJ_the_peoples_liberation_army:	"Die Volksbefreiungsarmee"
RAJ_deathblow_to_imperial_remnants:	"Todesstoß für die imperialen Überbleibsel"
RAJ_the_revolutionary_army_marches:	"Die Revolutionäre Armee marschiert"
RAJ_nationalize_british_owned_factories:	"Verstaatlichung der britischen Fabriken"
RAJ_threaten_princes:	"Bedroht die Prinzen"
RAJ_exile_princes:	"Verbannen Sie die Prinzen"
RAJ_join_the_co_prospherity_sphere:	"Beitritt zur Co-Wohlstandssphäre"
RAJ_join_the_co_prospherity_sphere_desc:	"Japan ist die einzige lokale Kraft, die bereit ist, sich gegen die westlichen Imperialisten zu stellen. Wir müssen uns ihnen anschließen, um ein größeres Ziel zu erreichen."
RAJ_join_the_co_prospherity_sphere_tt:	"(§Y[JAP.GetName]§!) Ermöglicht das Ereignis '§Y[RAJ.GetNameDefCap] strebt den Beitritt zur Co-Wohlstandssphäre§!'."
RAJ_cruiser_effort_dlc:	"$RAJ_cruiser_effort$"
RAJ_submarine_effort_dlc:	"$RAJ_submarine_effort$"
RAJ_capital_ship_effort_dlc:	"$RAJ_capital_ship_effort$ $RAJ_capital_ship_effort$"
RAJ_black_swan_sloops:	"Schwarze Schwan-Schaluppen"
RAJ_black_swan_sloops_desc:	"Wir werden billige Kaskos erwerben und als leichte Patrouillenschiffe einsetzen"
RAJ_coastal_protection:	"Schutz der Küste"
RAJ_coastal_protection_desc:	"Unsere weitläufige Küste braucht eine Form des Schutzes vor ausländischen Bedrohungen."
RAJ_the_sword_and_the_saffron:	"Das Schwert und der Safran"
RAJ_the_sword_and_the_saffron_desc:	"Unser Schicksal wird durch Stärke und Glauben geschmiedet. Das Schwert wird unser Land verteidigen, und das Safranbanner wird unser Volk in einem Ziel vereinen."
RAJ_burn_down_the_cellular_jail:	"Brennt das Zellularknast nieder"
RAJ_burn_down_the_cellular_jail_desc:	"Das Cellular Jail ist ein Affront für alle, die jemals für die Unabhängigkeit Indiens gekämpft haben, es muss zerstört werden."
RAJ_indian_marine_corps:	"[ROOT.GetAdjective] Marine Corps"
RAJ_indian_marine_corps_desc:	"Wir werden mit der Ausbildung von Marinesoldaten beginnen, die in unserer Armee dienen sollen."
RAJ_madras_ship_repair_factories:	"Madras Schiffsreparaturfabriken"
RAJ_madras_ship_repair_factories_desc:	"Wir werden in Madras Fabriken errichten, die bei der Reparatur unserer Schiffe helfen werden."
RAJ_obtain_british_naval_contracts:	"Erhalten Sie britische Marineverträge"
RAJ_obtain_british_naval_contracts_desc:	"Wir werden uns an [ENG.GetNameDefCap] wenden, um ein Handelsabkommen für die Marine zwischen uns vorzuschlagen."
RAJ_purchase_decomissioned_british_ships:	"Kauf von ausgemusterten Schiffen"
RAJ_purchase_decomissioned_british_ships_desc:	"Wir werden uns an [ENG.GetNameDefCap] wenden, um den Kauf ihrer alten, ausgemusterten Schiffe zu beantragen."
RAJ_request_transfer_of_british_commanders:	"Transfer britischer Kommandeure beantragen"
RAJ_request_transfer_of_british_commanders_desc:	"Wir werden [ENG.GetNameDefCap] bitten, einen ihrer Marinekommandeure zu uns zu transferieren, um bei der Ausbildung unserer neuen Marinesoldaten zu helfen."
RAJ_obtain_modern_ship_contracts:	"Verträge für moderne Schiffe einholen"
RAJ_obtain_modern_ship_contracts_desc:	"Wir werden [ENG.GetNameDefCap] den Kauf von modernen Kreuzern vorschlagen."
RAJ_dominate_the_bay_of_bengal:	"Beherrschung des Golfs von Bengalen"
RAJ_dominate_the_bay_of_bengal_desc:	"Die Ausweitung unserer Kontrolle über den Golf von Bengalen ist ein entscheidender Schritt in unseren maritimen Bemühungen."
RAJ_indian_cruiser_development:	"[ROOT.GetAdjective] Kreuzer-Entwicklung"
RAJ_indian_cruiser_development_desc:	"Wir werden damit beginnen, unsere eigenen Kreuzer in Indien zu produzieren."
RAJ_increase_funding_for_the_GRSE:	"Erhöhung der Mittel für die GRSE"
RAJ_increase_funding_for_the_GRSE_desc:	"Wir werden die staatlichen Mittel für die GRSE erhöhen, um den Bau neuer Werften zu ermöglichen."
RAJ_womens_royal_indian_naval_service:	"Königlicher [ROOT.GetAdjective] Marinedienst für Frauen"
RAJ_womens_royal_indian_naval_service_desc:	"Wir werden den Women's Royal [ROOT.GetAdjective] Naval Service gründen, damit auch Frauen eine Rolle in der Marine spielen können."
RAJ_modernizing_navy_dlc:	"Modernisierung der Marine"
RAJ_modernizing_navy_dlc_desc:	"Ím heutigen Zeitalter müssen wir Anstrengungen unternehmen, um unsere Marine zu modernisieren und unsere Seedominanz in Asien auszubauen."
RAJ_rashtriya_swayamsevak_sangh:	"Rashtriya Swayamsevak Sangh"
RAJ_rashtriya_swayamsevak_sangh_desc:	"Wir werden die Jugend zu einer disziplinierten Truppe organisieren, die bereit ist, unsere Nation zu verteidigen und die Werte der Hindutva um jeden Preis hochzuhalten."
RAJ_the_hindu_martial_tradition:	"Die hinduistische Kampftradition"
RAJ_the_hindu_martial_tradition_desc:	"Von den Kriegern Shivajis bis zu den Verteidigern des Dharma werden wir unseren alten Kampfgeist wiederbeleben und unser Volk auf die kommenden Schlachten vorbereiten."
RAJ_cultural_reawekening:	"Kulturelles Wiedererwachen"
RAJ_cultural_reawekening_desc:	"Eine neue Morgendämmerung voller Kunst, Sprache und Traditionen ist angebrochen. Wir werden die Nation unter dem zeitlosen Geist unserer Zivilisation vereinen."
RAJ_mass_production:	"Massenproduktion"
RAJ_mass_production_desc:	"Wir werden die Ausrüstung von privaten Unternehmen beziehen, die die geringsten Kosten verursachen. Die Senkung der Kosten für die Ausrüstung ist der Schlüssel zum Wachstum."
RAJ_deathknell_to_the_raj:	"Die Totenglocke des Raj"
RAJ_deathknell_to_the_raj_desc:	"Wir haben die Überreste des Raj abgebaut, indem wir mehr und mehr Kontrolle über ihr Land übernommen haben. Es ist an der Zeit, diese Scharade zu beenden und die volle Kontrolle über den Subkontinent zu fordern."
RAJ_deathknell_to_the_raj_trigger:	"§Das Raj§! unter §YBritish§! Herrschaft existiert"
RAJ_deathknell_to_the_raj_trigger_tt:	"Annektiert die Überreste des Raj"
RAJ_learn_from_the_crown:	"Lernen Sie von der Krone"
RAJ_learn_from_the_crown_desc:	"Wir müssen von der großen militärischen Erfahrung der Krone lernen und ihre bewährten Doktrinen übernehmen, um uns auf die kommenden Herausforderungen vorzubereiten."
RAJ_join_the_shadow_scheme:	"Schließen Sie sich dem Schattenschema an"
RAJ_join_the_shadow_scheme_desc:	"Durch die Teilnahme an verdeckten Operationen können wir unsere geheimdienstlichen Fähigkeiten erweitern und unsere strategische Position stärken."
RAJ_colonial_cadet_exchange:	"Kolonialer Kadettenaustausch"
RAJ_colonial_cadet_exchange_desc:	"Wir werden unsere besten Kadetten zur Ausbildung an der Seite britischer Offiziere entsenden, um sicherzustellen, dass unsere Armee mit den modernsten Techniken ausgestattet ist."
RAJ_learn_from_the_secret_intelligence_service:	"Lernen Sie vom Geheimdienst"
RAJ_learn_from_the_secret_intelligence_service_desc:	"Indem wir mit dem britischen Geheimdienst zusammenarbeiten, können wir ein beeindruckendes Spionagenetzwerk aufbauen, um unsere Interessen zu schützen."
RAJ_purchase_british_supply_equipment:	"Kaufen Sie britische Nachschubausrüstung"
RAJ_purchase_british_supply_equipment_desc:	"Wir müssen modernes britisches Versorgungsmaterial erwerben, um unsere Streitkräfte zu verstärken und die Logistik auf dem Schlachtfeld zu verbessern."
RAJ_forming_an_indian_doctrine:	"Formulierung einer indischen Doktrin"
RAJ_forming_an_indian_doctrine_desc:	"Die Zeit ist gekommen, unseren eigenen Weg zu gehen. Wir werden eine indische Doktrin entwickeln, die unsere einzigartigen Stärken und Bestrebungen widerspiegelt."
RAJ_model_after_germany:	"Modell nach Deutschland"
RAJ_model_after_germany_desc:	"Wir können die disziplinierten und effizienten Militärdoktrinen Deutschlands nachahmen, um unsere Streitkräfte in eine moderne Kriegsmaschine zu verwandeln."
RAJ_model_after_usa:	"Modell USA"
RAJ_model_after_usa_desc:	"Indem wir die amerikanischen Militärstrategien studieren, können wir unsere Armee modernisieren und dabei den Schwerpunkt auf Flexibilität und technologische Innovation legen."
RAJ_model_after_soviet:	"Modell nach der Sowjetunion"
RAJ_model_after_soviet_desc:	"Der Schwerpunkt der Sowjetunion auf Massenmobilisierung und revolutionären Taktiken bietet eine Blaupause für unsere eigene militärische Entwicklung."
RAJ_automating_the_army:	"Automatisierung der Armee"
RAJ_automating_the_army_desc:	"Wir werden der Mechanisierung und fortschrittlichen Panzerdivisionen Vorrang einräumen und so den Weg für eine vollständig modernisierte Armee ebnen."
RAJ_for_the_people_by_the_people:	"Für das Volk, durch das Volk"
RAJ_for_the_people_by_the_people_desc:	"Wir werden uns auf die Stärkung der Infanterie, der Artillerie und der Unterstützungsdivisionen konzentrieren, um eine Armee aufzubauen, die wirklich im Willen des Volkes verwurzelt ist."
RAJ_five_year_plan:	"Der Fünfjahresplan"
RAJ_five_year_plan_desc:	"Jeder kommunistische Staat braucht einen Fünfjahresplan! Wir müssen damit beginnen, unseren zu entwickeln, damit [RAJ.GetNameDefCap]'s' Industrie florieren kann!"
RAJ_five_year_plan_flag:	"Hat den Fokus abgeschlossen §YDer Fünfjahresplan§!"
RAJ_five_year_plan_when_removed_tt:	"Die aktuellen Tage sind: [?RAJ_five_year_plan_flag:days|Y0]"
RAJ_five_year_plan_modify_tt:	"Ändert §YDer Fünfjahresplan§! durch:"
RAJ_soviet_influence:	"Sowjetischen Einfluss"
RAJ_soviet_influence_desc:	"Wir werden uns von [SOV.GetNameDefCap] inspirieren lassen und es auf Indien anwenden."
RAJ_indian_socialism:	"Indischer Sozialismus"
RAJ_indian_socialism_desc:	"Anstatt uns von einer sozialistischen Großmacht inspirieren zu lassen, werden wir unsere eigene sozialistische Doktrin entwickeln, die auf die Bedürfnisse von [RAJ.GetNameDefCap] zugeschnitten ist."
RAJ_soviet_indian_industrial_cooperation:	"Sowjetisch-indische industrielle Zusammenarbeit"
RAJ_soviet_indian_industrial_cooperation_desc:	"Wir werden [SOV.GetNameDefCap] die Hand reichen und eine industrielle Partnerschaft anstreben."
RAJ_indian_national_highways:	"Indische Nationale Autobahnen"
RAJ_indian_national_highways_desc:	"Um [RAJ.GetNameDefCap]'s Industrie zu entwickeln, müssen wir an der Basis mit unseren Versorgungslinien beginnen."
RAJ_expand_industry_in_hyderabad:	"Industrie in Hyderabad ausbauen"
RAJ_expand_industry_in_hyderabad_desc:	"Der Ausbau der Fabriken in Hyderabad wird unsere industrielle Kapazität immens erweitern, ohne dass dafür große Investitionen erforderlich sind."
RAJ_continue_the_five_year_plan:	"Den Fünfjahresplan fortsetzen"
RAJ_continue_the_five_year_plan_desc:	"Nach dem ersten Jahr des Fünfjahresplans ist es an der Zeit, zurückzublicken und zu sehen, welche Fortschritte wir bisher gemacht haben. Wir müssen die Lektionen, die wir gelernt haben, in den nächsten vier Jahren anwenden."
RAJ_focus_on_civilian_industry:	"Fokus auf die zivile Industrie"
RAJ_focus_on_civilian_industry_desc:	"Die Menschen in [RAJ.GetNameDefCap] müssen unsere oberste Priorität sein, und das Wohlergehen jedes Bürgers zu gewährleisten ist entscheidend."
RAJ_nationalize_tata_group:	"Tata Group verstaatlichen"
RAJ_nationalize_tata_group_desc:	"Wir müssen aufhören, in unserer Wirtschaft von der Tata Group abhängig zu sein. Es ist an der Zeit, dass wir das Unternehmen übernehmen und verstaatlichen."
RAJ_focus_on_military_industry:	"Fokus auf die Militärindustrie"
RAJ_focus_on_military_industry_desc:	"Wir müssen die Sicherheit unseres Landes über alles andere stellen. Wir müssen dem Ausbau unseres Militärs Priorität einräumen, um unser Überleben zu sichern."
RAJ_nationalize_gun_carriage_agency:	"Verstaatlichung der Gun Carriage Agency"
RAJ_nationalize_gun_carriage_agency_desc:	"Die Gun Carriage Agency ist eine unserer wichtigsten Quellen für Waffen. Diese Art von Macht kann nicht in den Händen eines privaten Unternehmens liegen, sie muss verstaatlicht werden."
RAJ_eastern_shipyard_construction:	"Bau von Ostwerften"
RAJ_eastern_shipyard_construction_desc:	"Wir werden mehr Schiffswerften bauen, um unsere Marine zu modernisieren."
RAJ_colonial_cadet_exchange_tt:	"Wenn abgesetzt:"
RAJ_form_ties_with_leftist_parties:	"Verbindungen mit linken Parteien herstellen"
RAJ_form_ties_with_leftist_parties_desc:	"Wir müssen die Unterstützung der Sozialisten und Kommunisten im Lande gewinnen."
indian:	"Indien"
pakistan:	"Pakistan"
pakistanis:	"Pakistaner"
bangladesh:	"Bangladesch"
bangladeshi:	"Bangladescher"
tech_recon_focus_bonus_tt:	"£GFX_unit_recon_icon_small $category_recon$\nAufklärung: §G+200%§!"
RAJ_relax_agrarian_society_criteria_tt:	"Ändert §Y$idea_RAJ_agrarian_society$§!\n§YWirksame Änderung:§!"
mountain_tanks_tt:	"Ermöglicht §YBergpanzer§!\n§YAlle Panzerdivisionen (Berge)§!:\nAngriff §G+15%§!\nBewegung: §G+15%§!"
RAJ_secular_rule_alt:	"Timuridisches Erbe"
RAJ_secular_rule_alt_desc:	"Es ist an der Zeit, das Kernland unserer Vorfahren zurückzuerobern und in den Bergen, die unsere Dynastie hervorgebracht haben, eine neue Ära zu begründen. Indem wir das Imperium im zerklüfteten Herzen Afghanistans verankern, sichern wir unsere Herrschaft und stellen das Fundament der imperialen Herrschaft wieder her."
RAJ_theocratic_rule_alt:	"Das mongolische Erbe"
RAJ_theocratic_rule_alt_desc:	"Wir sind die Erben von Eroberern, die Erben eines Reiches, das einst die Welt erschütterte. Um das mongolische Erbe zu ehren, müssen wir Einheit durch Stärke schmieden und den indischen Subkontinent als ein Volk unter unsere Herrschaft bringen, das nicht durch Glauben oder Herkunft, sondern durch die Treue zum Thron gebunden ist. Vor der Macht des Imperiums sollen alle knien."
RAJ_secret_weapons:	"Unser wissenschaftliches Können wiederherstellen"
RAJ_secret_weapons_desc:	"Wir werden uns wieder an die Weltspitze der Raketenentwicklung setzen und sie für die Vernichtung unserer Feinde einsetzen."
AFG_expand_telegraph_network:	"Erweitern Sie das Telegrafennetz"
AFG_expand_telegraph_network_desc:	"[ROOT.GetNonIdeologyName] ist in einer Vielzahl von wirtschaftlichen Kennziffern hinter seine Nachbarn zurückgefallen. Der erste Schritt zur Modernisierung unserer Wirtschaft besteht darin, die Kommunikation zwischen unseren Städten und unseren Nachbarn zu verbessern, indem wir das Telegrafennetz ausbauen."
AFG_increase_agricultural_exports:	"Steigern Sie die Agrarexporte"
AFG_increase_agricultural_exports_desc:	""
AFG_sugar_processing:	"Baghlan Zuckerfabrik"
AFG_sugar_processing_desc:	"Die Nachfrage unserer Bevölkerung nach Zucker wächst stetig. Wir sollten diese Nachfrage befriedigen, indem wir eine Zuckerfabrik errichten, die landwirtschaftliche Produkte zu dem wertvollen Stoff verarbeitet. Damit wird nicht nur die Nachfrage befriedigt, sondern es werden auch mehr industrielle Arbeitsplätze geschaffen."
AFG_fruit_packing:	"Obstverarbeitung"
AFG_fruit_packing_desc:	"Die Menschen in [ROOT.GetNonIdeologyName] sind fähige Landwirte. Wir sollten die Überschüsse, die sie produzieren, nutzen, indem wir sie für den Export verpacken. Zu diesem Zweck müssen wir mehr industrielle Verarbeitungsanlagen errichten."
AFG_clear_malarial_swamps:	"Säubern Sie die Malariasümpfe"
AFG_clear_malarial_swamps_desc:	"Malaria ist nach wie vor eine Plage in vielen Gegenden des Landes. Indem wir die Gebiete räumen, in denen sich die Malaria-Parasiten vermehren, können wir die Landbevölkerung von einem historischen Übel befreien und neues Land für die Entwicklung beanspruchen."
AFG_infrastructure_construction:	"Investitionen in die Infrastruktur"
AFG_infrastructure_construction_desc:	"Unser Mangel an Infrastruktur im ganzen Land hemmt die wirtschaftliche Entwicklung und lässt die Menschen so leben, wie es ihre Vorfahren seit Jahrhunderten getan haben. Eine solche Sichtweise ist nicht im langfristigen Interesse der Nation und muss durch Investitionen in Infrastrukturprojekte korrigiert werden."
AFG_expand_karakul_lambskin_industry:	"Karakul-Lammfell-Industrie ausbauen"
AFG_expand_karakul_lambskin_industry_desc:	"Karakul-Lammfellprodukte sind eine der wenigen Waren, die derzeit in großen Mengen aus [ROOT.GetNonIdeologyName] exportiert werden. Wir könnten dies als Gelegenheit nutzen, unsere noch junge industrielle Basis zu erweitern, indem wir Fabriken für die Verarbeitung und den Export solcher Produkte schaffen."
AFG_look_to_other_partners:	"Schauen Sie auf andere Partner"
AFG_look_to_other_partners_desc:	"Unsere Handelsabkommen mit der Sowjetunion haben den Verdacht aufkommen lassen, dass sie Einfluss auf unsere Innen- und Außenpolitik nehmen. Solche Anschuldigungen sind natürlich falsch, aber vielleicht wäre es in unserem Interesse, uns nach anderen Handelspartnern umzusehen."
AFG_look_to_other_partners_tt:	"Bedeutende Nationen erhalten die Möglichkeit, in [ROOT.GetNameDef] zu investieren, indem sie uns §Eine zivile Fabrik außerhalb der Karte pro Land, das zustimmt§!, im Austausch für §Einflussnahme auf unsere Politik für ein Jahr geben.§!"
generic_higher_opinion_tt:	"\n§Eine höhere Meinung von [ROOT.GetNonIdeologyName] wird die Chance erhöhen, dass die Zielländer den Vorschlag annehmen.§!"
AFG_renew_soviet_trade_agreement:	"Erneuerung des sowjetischen Handelsabkommens"
AFG_renew_soviet_trade_agreement_desc:	"Obwohl sich unsere Ideologien im Laufe der Jahre unterschieden haben, ist die [SOU.GetName] ein guter Wirtschaftspartner für unsere Nation gewesen. Während einige das Risiko eines [SOU.Adjective] Einflusses auf unsere inneren Angelegenheiten fürchten, sehen wir kein Problem darin, das Handelsabkommen zwischen unseren Nationen zu erneuern."
AFG_salang_pass:	"Salang-Pass-Tunnel"
AFG_salang_pass_desc:	"Das gebirgige Terrain von [ROOT.GetNonIdeologyName] macht es schwierig, bequeme Transportwege durch das Land zu entwickeln. Allerdings glauben [SOU.GetAdjective] Ingenieure, dass sie einen Tunnel durch die Berge bei Salang bauen könnten. Ihre Regierung hat angeboten, den Bau im Tausch gegen einige strategische Konzessionen durchzuführen."
AFG_75_year_oil_concessions:	"Angebot 75 Jahre Ölkonzessionen"
AFG_75_year_oil_concessions_desc:	"In den letzten Jahren haben Geologen auf unserem Territorium bedeutende Ölvorkommen entdeckt. Uns fehlen jedoch die industriellen Kapazitäten, um sie selbst zu erschließen. Wenn wir uns an eine der Großmächte mit einem für beide Seiten vorteilhaften Abkommen wenden, könnten wir das Öl vielleicht gemeinsam fördern."
AFG_75_year_oil_concessions_tt:	"§A Beschließen Sie, die Ölvorkommen auf unserem Territorium in Zusammenarbeit mit einer ausländischen Macht zu fördern."
AFG_rail_construction:	"Afghanische Eisenbahngesellschaft gründen"
AFG_rail_construction_desc:	"Für den Transport großer Mengen von Ressourcen oder Menschen ist nichts so effizient wie die Eisenbahn. Wir müssen daher eine Eisenbahngesellschaft gründen, die ein eigenes Schienennetz entwickelt und betreibt."
AFG_electrification:	"Elektrifizierung"
AFG_electrification_desc:	"Innovationen in der Industrie, der Kommunikation und der Kriegsführung sind zunehmend von der Elektrizität abhängig. Wir müssen daher sicherstellen, dass unsere Nation in der Lage ist, von neuen Fortschritten zu profitieren, indem wir die Elektrifizierung in [ROOT.GetNonIdeologyName] ausbauen."
AFG_electrification_tt:	"\n§YDie Elektrifizierung wird sich im Laufe der Zeit von Kabul aus ausbreiten, wobei alle zwei Monate ein neuer Kernstaat den Modifikator erhält.§!"
AFG_establish_radio_networks:	"Upgrade von Radio Kabul"
AFG_establish_radio_networks_desc:	"Radio Kabul wurde in den 1920er Jahren mit veralteter Ausrüstung gegründet. Wir sollten in die Modernisierung der Sendeanlagen investieren, um sicherzustellen, dass die Regierung eine direkte Verbindung zu einem möglichst großen Teil der Bevölkerung hat."
AFG_connect_the_cities:	"[ROOT.GetNonIdeologyName] Ringstraße"
AFG_connect_the_cities_desc:	"Während die Eisenbahn für unsere langfristige Entwicklung von großer Bedeutung sein wird, dürfen die Vorteile eines modernen Autobahnsystems zwischen den großen Städten nicht übersehen werden. Durch den Bau einer Ringstraße, die die Städte miteinander verbindet, können wir endlich den wirtschaftlichen Regionalismus überwinden, der unsere Wirtschaft lange geplagt hat."
AFG_expand_kabul_university:	"Erweitern Sie die Universität Kabul"
AFG_expand_kabul_university_desc:	"Der Bedarf an professionellen Ingenieuren, Ärzten und Lehrern kann nicht länger dadurch gedeckt werden, dass man Studenten zur Fachausbildung ins Ausland schickt. Stattdessen müssen wir in unsere eigenen Institutionen investieren und eine neue Generation von einheimischen Fachkräften heranziehen."
AFG_expand_kabul_university_tt:	"§Eine Ausweitung der Hochschulbildung wird dazu führen, dass sich die Absolventen radikalisieren, wenn die Wirtschaft nicht genug wächst, um ihnen Arbeitsplätze zu bieten!"
AFG_kajaki_dam:	"Helmand Valley Authority gründen"
AFG_kajaki_dam_desc:	"Wir sollten uns von der Tennessee Valley Authority in [USA.GetNameDef] inspirieren lassen und eine ähnliche Behörde für das Flusstal von Helmand gründen. Die Organisation wäre mit der wirtschaftlichen Entwicklung des Gebiets zum Nutzen der nationalen Wirtschaft betraut. Wir müssen uns jedoch davor hüten, unsere westlichen Nachbarn zu provozieren, wenn wir beginnen, den Wasserfluss entlang des Flusses zu verändern. "
AFG_kajaki_dam_tt:	"\n§RWenn es uns nicht gelingt, einen Vertrag mit [414.OWNER.GetNameDef] auszuhandeln, kann die folgende Ereigniskette zu einem Krieg führen!"
AFG_qargha_dam:	"Qargha-Damm"
AFG_qargha_dam_desc:	"In den trockeneren Regionen des Landes fehlt es an ausreichender Bewässerung, was wiederum die Ernten gefährdet und zu Hungersnöten führen kann. Wir können jedoch Dämme errichten, um das verfügbare Wasser für die Bewässerung zu erhöhen, was sogar zu landwirtschaftlichen Überschüssen führen kann."
AFG_chaki_dam:	"Chak-Damm"
AFG_chaki_dam_desc:	"Da die Nachfrage nach Elektrizität zunimmt, müssen wir sicherstellen, dass eine stetige Versorgung gewährleistet ist. Mit Hilfe ausländischer Experten können wir vielleicht einen Staudamm am Chak-Fluss errichten, der die Umgebung, einschließlich Kabul, auf Jahre hinaus mit Strom versorgen könnte."
AFG_chromite_mines:	"Errichten Sie Chromitminen"
AFG_chromite_mines_desc:	"Chrom wird in der industrialisierten Welt immer mehr zu einem begehrten Rohstoff. Wir sollten mit dem Abbau unserer eigenen Chromitvorkommen für den Export beginnen und den daraus gewonnenen Reichtum nutzen, um unser eigenes Industrialisierungsprogramm fortzusetzen."
AFG_iron_mines:	"Erweitern Sie die Kupfer- und Zinnminen"
AFG_iron_mines_desc:	"Zinn, Kupfer und Eisen sind für die Herstellung vieler moderner Güter unerlässlich. Wenn wir uns zu einer Industrienation entwickeln wollen, müssen wir unseren eigenen Zugang zu diesen Ressourcen entwickeln und sichern. Glücklicherweise haben wir noch viele unerschlossene Ressourcen, die darauf warten, ausgebeutet zu werden."
AFG_truck_factory:	"Janagalak Lkw-Fabrik"
AFG_truck_factory_desc:	"In Zusammenarbeit mit unseren [SOU.GetAdjective] Wohltätern haben wir die Möglichkeit, unsere erste groß angelegte Fabrik für die Produktion von Fahrzeugen zu entwickeln. Die dort entwickelten Lastwagen könnten die inländische Nachfrage nach solchen Fahrzeugen in der Industrie und beim Militär befriedigen."
AFG_maintain_quami:	"Quami beibehalten"
AFG_maintain_quami_desc:	"Das Quami-System der Abgaben ist seit Jahrhunderten der Grundstein für unsere Verteidigung. Warum sollten wir ein in der Tradition verwurzeltes System wegwerfen, von dem nur die städtische Elite in der Hauptstadt profitiert? Widerstand gegen diese jüngste Welle von Reformmoden ist die einzige logische Wahl."
AFG_maintain_quami_tt:	"§Behalten Sie $AFG_quami_category$ Entscheidungen und die Fähigkeit, mehr irreguläre Divisionen zu rekrutieren."
AFG_quami_intro_tt:	"Ändern Sie §Y$AFG_quami_modifier$§! von:"
AFG_nufus_intro_tt:	"Ändern Sie §Y$AFG_nufus_modifier$§! von:"
AFG_asymmetric_warfare:	"Asymmetrische Kriegsführung"
AFG_asymmetric_warfare_desc:	"Während unsere Nachbarn sich damit begnügen, ihr Erbe wegzuwerfen, um die Industrialisierung voranzutreiben und ihre Streitkräfte zu vergrößern. Wir werden sie durch den Einsatz unkonventioneller Taktiken und überlegener Kenntnisse unseres Terrains besiegen. Zusammen mit der Entschlossenheit unserer Soldaten werden wir jede Invasionsmacht zurückschlagen."
AFG_khyber_pass_riflining:	"Khyber Pass Rifling"
AFG_khyber_pass_riflining_desc:	"Die Handwerksbetriebe entlang des Khyber-Passes stellen seit Jahrzehnten Kopien ausländischer Waffen her. Ihre Waffen sind zwar qualitativ minderwertig, aber das machen sie durch ihre Quantität wieder wett. Vielleicht ist es an der Zeit, dass wir in die Region investieren und einen einheimischen Waffenproduzenten für unsere Streitkräfte aufbauen."
AFG_scavenging:	"Scavenging"
AFG_scavenging_desc:	"Die Ausrüstung, die wir nicht selbst herstellen können, taucht oft in den Händen ausländischer Aggressoren auf. Wir sollten daher unsere Streitkräfte darin schulen, wertvolle militärische Ausrüstung zu erkennen und zu erbeuten, wann immer sie verfügbar ist."
AFG_militia_cavalry:	"Qatgani Kavallerie"
AFG_militia_cavalry_desc:	"[ROOT.GetName] beherbergt eine Reihe von Pferderassen, die speziell für das raue Terrain des Landes gezüchtet wurden. Diese könnten in den Kavalleriebrigaden eingesetzt werden, anstatt in teure ausländische Ausrüstung zu investieren, die zu Ausfällen neigt und umfangreiche Unterstützung erfordert."
AFG_mountain_training:	"Gebirgsausbildung"
AFG_mountain_training_desc:	"Neue Technologien und Taktiken kommen und gehen mit der Zeit, aber die Berge und Täler bleiben unverändert. Anstatt zu versuchen, mit unseren Nachbarn technologisch Schritt zu halten, sollten wir uns stattdessen darauf konzentrieren, das Land um uns herum zu nutzen, um einen taktischen Vorteil zu erlangen."
AFG_cross_border_ties:	"Grenzüberschreitende Verbindungen"
AFG_cross_border_ties_desc:	"Es liegt in der Natur unserer Geographie, dass die Grenzen immer durchlässig sind, dass Familien über die Grenzen kommen und gehen und sich auf beiden Seiten niederlassen. Im Laufe der Generationen hat dies zu starken zwischenmenschlichen Verbindungen in den Nachbarländern geführt, die in Krisenzeiten ausgenutzt werden könnten."
AFG_cross_border_ties_tt:	"Unlock §Y$AFG_cross_border_ties_category$§! Entscheidungen zur Annexion von beanspruchten Gebieten"
AFG_approach_foreign_inteligence_services:	"Annäherung an ausländische Nachrichtendienste"
AFG_approach_foreign_inteligence_services_desc:	"Wir befinden uns am Schnittpunkt großer Mächte und sind seit langem deren großen Spielen ausgeliefert. Wenn wir einen eigenen Nachrichtendienst einrichten würden, könnten wir unsere einzigartige Situation ausnutzen, indem wir unsere Nachbarn gegeneinander ausspielen."
AFG_expand_border_guards:	"Grenzschutz ausbauen"
AFG_expand_border_guards_desc:	"Wir sollten die Grenzpolizei in grundlegender Kriegsführung ausbilden, damit sie in Krisenzeiten mehr Verantwortung übernehmen und die konventionellen Streitkräfte entlasten kann. Die königliche Garde stellt die Elite unserer Streitkräfte dar und verfügt über die entsprechende Ausbildung und Expertise. Ihre begrenzte Anzahl ist jedoch Anlass zur Sorge, da unsere Nachbarn in einen Konflikt verwickelt sind."
AFG_adopt_nufus:	"Nufus adoptieren"
AFG_adopt_nufus_desc:	"Das jahrhundertealte System, das irreguläre Truppen zur Verteidigung des Reiches aufstellt, hat seinen Zweck längst erfüllt und wird einem Einfall professioneller feindlicher Truppen kaum standhalten. Daher müssen wir das System durch ein System der formellen Einberufung und Ausbildung ersetzen."
AFG_adopt_nufus_tt:	"§RWird die $AFG_quami_category$ Entscheidungen aufheben und die Rekrutierung irregulärer Divisionen verhindern!§!"
AFG_new_army:	"Neue Armee"
AFG_new_army_desc:	"Auch wenn es in der Landbevölkerung weiterhin Widerstand gegen unsere Militärreformen gibt, müssen wir vorankommen und ein groß angelegtes Ausbildungsprogramm für die jüngste Kohorte von Wehrpflichtigen einführen."
AFG_expand_royal_guard:	"Königliche Garde ausbauen"
AFG_expand_royal_guard_desc:	"Die königliche Garde stellt die Elite unserer Streitkräfte dar und verfügt über die entsprechende Ausbildung und Erfahrung. Ihre begrenzte Anzahl ist jedoch besorgniserregend, da unsere Nachbarn in einen Konflikt verwickelt sind."
AFG_establish_naval_bases:	"Marinestützpunkte errichten"
AFG_establish_naval_bases_desc:	"Mit der Errichtung unseres ersten Marinestützpunktes zur Versorgung von Schiffen entlang unserer neu befreiten Küste können wir mit der mühsamen Aufgabe beginnen, unsere eigene Marine aufzubauen."
AFG_establish_naval_bases_tt:	"Fügen Sie §G1§! §Ynaval base§! in einem beliebigen Küstenstaat hinzu"
AFG_standardize_equipment:	"Standardisieren Sie die Ausrüstung"
AFG_standardize_equipment_desc:	""
AFG_expand_academy:	"Erweitern Sie die Akademie"
AFG_expand_academy_desc:	"Mit dem Ausbau einer professionelleren Armee wächst auch der Bedarf an gut ausgebildeten Offizieren. Der Aufbau einer nationalen Militärakademie wäre eine kluge Maßnahme, um sicherzustellen, dass die Armee über die Führung und das Fachwissen verfügt, das sie zum Schutz unserer Grenzen benötigt."
AFG_expand_academy_tt:	"Rekrutieren Sie §YTwo§! zufällig ausgewählte §YGeneräle§!"
AFG_purchase_tanks:	"Panzer kaufen"
AFG_purchase_tanks_desc:	"Unserer Armee fehlt es an Feuerkraft, um die feindlichen Linien zu durchbrechen oder an Geschwindigkeit, um vorzurücken. Wir müssen uns am Rest der Welt orientieren und in eine Panzertruppe investieren, um diese Probleme zu lösen. "
AFG_purchase_aircraft:	"Kaufen Sie Flugzeuge"
AFG_purchase_aircraft_desc:	"Unsere Streitkräfte sind zu verwundbar für Angriffe aus der Luft. Wir müssen in eine eigene Luftwaffe investieren, um feindliche Flugzeuge abzuwehren."
AFG_expand_equipment_purchases:	"Erweitern Sie den Kauf von Ausrüstung"
AFG_expand_equipment_purchases_desc:	"Unsere Streitkräfte sind zunehmend auf Ausrüstung angewiesen, die über einfache Gewehre und Granaten hinausgeht. Wenn sie eine glaubwürdige Streitkraft bleiben sollen, müssen wir so schnell wie möglich mehr Ausrüstung beschaffen."
AFG_increase_air_purchases:	"Erhöhen Sie die Käufe von Luftfahrzeugen"
AFG_increase_air_purchases_desc:	"Unsere Luftwaffe entwickelt schnell die Fähigkeit, ausländische Flugzeuge vom Eindringen in unseren Luftraum abzuhalten oder zu zerstören. Allerdings fehlt uns die Fähigkeit, mit unseren Flugzeugen Macht auf den Boden zu projizieren. Wir sollten daher damit beginnen, in unsere eigenen Bomberstaffeln zu investieren."
AFG_naval_academy:	"Marine-Akademie"
AFG_naval_academy_desc:	"Unser historischer Mangel an Küsten bedeutet einen völligen Mangel an Offizieren mit seemännischen Kenntnissen. Wir müssen daher eine Marineakademie gründen und versuchen, Offiziere aus dem Ausland anzuwerben, um die erste Generation von [AFG.GetAdjective] Matrosen auszubilden."
AFG_naval_academy_tt:	"Rekrutieren Sie §Ytwo§! zufällig ausgewählte §YAdmirals§!"
AFG_shipyards:	"Schaffen Sie [ROOT.GetAdjective] Schifffahrt"
AFG_shipyards_desc:	"Auch wenn wir noch nicht in der Lage sind, eigene Schiffe zu entwickeln, werden alle zukünftigen Schiffe Wartungs- und Umrüstungseinrichtungen benötigen. Wenn wir jetzt eine Werft gründen, können wir sicherstellen, dass unsere zukünftigen Schiffe über die Einrichtungen verfügen, die sie für ihren Betrieb über Jahrzehnte hinweg benötigen."
AFG_shipyards_tt:	"Fügen Sie §G1§! Gebäudeslot und §G1§! §Y Marinewerft§! in einem Küstenstaat hinzu."
AFG_shipyards_tt_2:	"§YUnlock Military Industrial Organization:§!"
AFG_research_bonus_1:	"Entwickeln Sie eine einheimische Marineindustrie"
AFG_research_bonus_1_desc:	"Die Großmächte werden uns nur verkaufen, was sie als veraltet und nicht bedrohlich für ihre Interessen in der Region ansehen. Wenn wir eine moderne Marine aufbauen wollen, die in der Lage ist, diese Großmächte abzuschrecken, sollten wir in die Entwicklung eigener Designs investieren."
AFG_purchase_destroyers:	"Zerstörer kaufen"
AFG_purchase_destroyers_desc:	"Es würde Jahrzehnte dauern, bis wir das Know-how und die Infrastruktur für die Entwicklung und den Bau moderner Kriegsschiffe aufgebaut hätten. Ein weitaus pragmatischerer Ansatz wäre es, stillgelegte Schiffe anderer Nationen zu erwerben und sie für unsere Zwecke umzurüsten."
AFG_research_bonus_2:	"Investieren Sie in die Entwicklung von Marineschiffen"
AFG_research_bonus_2_desc:	"Unsere Erfahrung in der Entwicklung kleinerer Schiffe hat sich ausgezahlt, und unsere Ingenieure stellen sich nun der Herausforderung, viel größere Konstruktionen für die Marine zu entwickeln."
AFG_purchase_capital_ships:	"Kaufen Sie Großkampfschiffe"
AFG_purchase_capital_ships_desc:	"Unsere Marine nimmt mit dem jüngsten Erwerb kleinerer Schiffe allmählich Gestalt an. Allerdings fehlt es uns noch immer an der Feuerkraft größerer Schiffe, und wir sollten uns nach solchen umsehen, die wir erwerben können."
AFG_state_industries:	"Militärische Industrien gründen"
AFG_state_industries_desc:	"Universitätsabsolventen radikalisieren sich, weil es an Arbeitsplätzen fehlt, die ihre Fähigkeiten nutzen. Um dies zu verhindern, könnten wir staatlich geführte Industrien aufbauen, um mehr von ihnen zu beschäftigen und gleichzeitig unsere Streitkräfte mit im Inland produzierter Ausrüstung auszustatten."
AFG_state_industries_tt:	"Entscheiden Sie, §YMilitary Industrial Organizations§! zu gründen und die Frist für die Radikalisierung von Absolventen zu verlängern."
AFG_ideology_on_the_rise_tt:	"§R Großmächte, die [THIS.GetNameDef]s Ideologie nicht teilen, könnten in [ROOT.GetNameDef] einmarschieren wollen, wenn ihr Einfluss auf uns zu groß wird! (Wenn [THIS.GetIdeologyNameWithCaps] größer als 40% ist, könnten andere Mächte uns angreifen!)§! "
AFG_ideology_on_the_rise_flipped_tt:	"§R\n\n[THIS.GetNameDefCap] könnte in [ROOT.GetNameDef] eindringen wollen, wenn andere Nationen zu viel Einfluss auf uns gewinnen! (Wenn irgendeine Ideologie außer Neutralität oder [THIS.GetIdeologyNameWithCaps] größer als 40% ist, kann [THIS.GetNameDef] uns angreifen!)§! "
AFG_foreign_influence_tt:	"Fügen Sie §Y[PREV.GetIdeologyNameWithCaps] Einfluss im Aufwind§! hinzu, der Ihnen (Tägliche [PREV.GetIdeologyNameWithCaps] Unterstützung: §G+0.02§!) "
AFG_against_kabul:	"Gegen Kabul"
AFG_against_kabul_desc:	"König Zahir und seine Onkel sind Thronräuber, ihr unrechtmäßiges Regime muss um jeden Preis gestürzt werden."
AFG_contact_amanullah_loyalists:	"Kontaktieren Sie die Amanullah-Loyalisten"
AFG_contact_amanullah_loyalists_desc:	"Der frühere König $AFG_amunullah_khan$ hat den Thron nie formell einem Nachfolger überlassen, als er ungerechterweise vom Pöbel gestürzt wurde. Wir müssen daher diejenigen in [AFG.GetNonIdeologyName] versammeln, die dem König gegenüber loyal sind und Vorbereitungen für seine unvermeidliche Rückkehr treffen."
AFG_secure_army_support:	"Unterstützung der Armee sichern"
AFG_secure_army_support_desc:	"Es gibt immer noch eine Reihe von Offizieren in den Streitkräften, die von $AFG_amunullah_khan$ ernannt wurden oder unter ihm gedient haben. Mit den richtigen Anreizen könnten sie dazu gezwungen werden, seine Rückkehr auf den Thron zu unterstützen."
AFG_secure_army_support_tt:	"§YMehr Armeedivisionen werden sich im kommenden Bürgerkrieg auf unsere Seite schlagen.§!"
AFG_modifiy_amanullah_insurrection_modifier_tt:	"Ändern Sie §Y$AFG_amanullah_insurection_modifier$§! von:\n"
AFG_contact_rural_loyalists:	"Kontakt zu ländlichen Loyalisten"
AFG_contact_rural_loyalists_desc:	"Die [AFG.GetAdjective] Elite ist leicht genug zu bestechen oder zu beeinflussen. Der durchschnittliche [AFG.GetAdjective] hingegen hat wenig Interesse an materiellem Schmuck oder politischen Versprechungen. Wenn wir jedoch an ihre traditionellen Werte und Missstände appellieren, können wir sie vielleicht doch für unsere Sache gewinnen."
AFG_contact_rural_loyalists_tt:	"§Weitere paschtunische Milizeinheiten werden sich im kommenden Bürgerkrieg auf unsere Seite schlagen."
AFG_request_german_support:	"Bitte um deutsche Unterstützung"
AFG_request_german_support_desc:	"$AFG_amunullah_khan$ bewundert [GER.GetNonIdeologyName] seit langem und hat eine Reihe hochrangiger Unterstützer in seiner Regierung gewonnen. Vielleicht würden sie die Rückkehr des Königs im Austausch für ein freundliches Regime in der Region unterstützen."
AFG_request_german_support_tt:	"§Wenn [GER.GetNonIdeologyName] unseren Vorschlag annimmt, werden sie uns mit Waffen versorgen und Freiwillige schicken, die uns helfen, wenn der Bürgerkrieg beginnt.§!"
AFG_political_events_53_tt:	"§Y[GER.GetNonIdeologyName] wird uns mit Waffen versorgen und Freiwillige schicken, um uns zu helfen, wenn der Bürgerkrieg beginnt.§!"
AFG_stir_unrest_in_the_east:	"Unruhen im Osten schüren"
AFG_stir_unrest_in_the_east_desc:	"Waziristan ist nach wie vor eine Brutstätte sowohl für anti-[RAJ.GetAdjective] als auch für [AFG.GetAdjective] Aktivitäten. Wenn wir die Unruhestifter aufstacheln, können wir vielleicht eine weitere Rebellion anzetteln, um die Truppen des Königs anderswo zu beschäftigen."
AFG_fascist_cw_is_over:	"Der Amanullah-Aufstand ist vorbei. (Die Faschisten haben die Regierung gestürzt und den Bürgerkrieg gewonnen.)"
AFG_return_of_the_emir:	"Die Rückkehr des Königs"
AFG_return_of_the_emir_desc:	"Die Pläne sind geschmiedet, die Kontakte hergestellt und die Waffen verteilt. Jetzt muss nur noch der König nach Afghanistan zurückkehren und unsere zusammengewürfelte Rebellion wird den Sturz des unrechtmäßigen Regimes von König Zahir einleiten."
AFG_revive_the_1923_constitution:	"Die Verfassung von 1923 wiederbeleben"
AFG_revive_the_1923_constitution_desc:	"Der König ist ein Visionär, der 1923 erkannte, dass das Land ins 20. Jahrhundert geführt werden muss. Seine Reformen wurden jedoch von Zahir Shah fast völlig zerfetzt. Aber jetzt, wo der König wieder an der Macht ist, können wir dort weitermachen, wo er aufgehört hat, und seine Verfassung von 1923 wiederherstellen."
AFG_custail_pashtunwali_primacy:	"Beschneiden Sie die Vorrangstellung der Paschtunen"
AFG_custail_pashtunwali_primacy_desc:	"Der traditionelle Moralkodex der Paschtunen, das Paschtunwali, hat im neuen Staat des Königs keinen Platz. Eine neue Reihe von Gesetzen soll erlassen werden, die die Macht der Paschtunen stärken und gleichzeitig dieses veraltete Regelwerk modernisieren."
AFG_education_for_women_and_girls:	"Bildung für Frauen und Mädchen"
AFG_education_for_women_and_girls_desc:	"Der König und seine Frau waren sich darüber im Klaren, dass es wichtig war, Frauen und Mädchen eine Ausbildung zu ermöglichen, anstatt sie zu einem Leben in häuslicher Knechtschaft zu verdammen. Nach seinem Sturz wurden die Bildungsreformen des Königs wieder rückgängig gemacht. Jetzt werden wir diese Ungerechtigkeit korrigieren."
AFG_enforce_western_attire:	"Westliche Kleidung durchsetzen"
AFG_enforce_western_attire_desc:	"Der König und sein innerer Kreis sind unbeeindruckt von der traditionellen Kleidung, die die Mehrheit der Bevölkerung anlegt. Sie sehen darin ein Zeichen für eine antiquierte Gesellschaft und wollen daher eine Textilfabrik und neue Gesetze in Auftrag geben, um die Übernahme westlicher Kleidung durchzusetzen."
AFG_crackdown_on_nomadic_practices:	"Hartes Durchgreifen gegen nomadische Praktiken"
AFG_crackdown_on_nomadic_practices_desc:	"TODO"
AFG_repaying_our_friends:	"Unseren Freunden etwas zurückgeben"
AFG_repaying_our_friends_desc:	"TODO"
AFG_revenge_for_ousting:	"Rache für Verdrängung"
AFG_revenge_for_ousting_desc:	"TODO"
AFG_bring_back_exiles:	"Exilanten zurückbringen"
AFG_bring_back_exiles_desc:	"TODO"
AFG_expand_state_run_factories:	"Staatliche Fabriken ausbauen"
AFG_expand_state_run_factories_desc:	"Nach jahrelanger Vernachlässigung durch das vorherige Regime ist es an der Zeit, die wirtschaftliche Modernisierung des Landes durch die Errichtung neuer staatlicher Fabriken zur Herstellung von Konsum- und Militärgütern voranzutreiben."
AFG_reinforce_the_royal_guard:	"Die Schatten des Königs"
AFG_reinforce_the_royal_guard_desc:	"Trotz seiner Legitimität gibt es viele, die über die Rückkehr des Königs und seine radikalen Reformen verärgert sind. Diese Verräter dürfen die Arbeit des Königs nicht untergraben und müssen von einem neuen Sicherheitsdienst bekämpft werden, der im Verborgenen operiert und seinen Willen durchsetzt."
AFG_reinforce_the_royal_guard_tt:	"Schalten Sie §Y$AFG_shadows_of_the_emir_category$§! Entscheidungen frei, um gegen Andersdenkende vorzugehen und die Stabilität zu erhöhen."
AFG_increase_land_and_animal_taxes:	"Erhöhung der Steuern auf Land und Tiere"
AFG_increase_land_and_animal_taxes_desc:	"Die Landbevölkerung trägt nur wenig zur wirtschaftlichen Vitalität des Landes bei und ihre Subsistenzlandwirtschaft erlaubt es ihnen, die meisten Formen der Besteuerung zu vermeiden. Um Anreize für modernere landwirtschaftliche Praktiken zu schaffen, werden wir eine neue Steuerpolitik einführen, die die Landbevölkerung dazu zwingt, höhere Gewinne zu erzielen, wenn sie etwas zu essen auf den Tisch bringen will."
AFG_expand_state_education:	"Erweitern Sie das staatliche Bildungswesen"
AFG_expand_state_education_desc:	"TODO"
AFG_establish_darulaman:	"Darulaman gründen"
AFG_establish_darulaman_desc:	"Darulaman sollte eine neue Planstadt werden, die Kabul als Hauptstadt von [AFG.GetNonIdeologyName] ablösen sollte. Als der König gestürzt wurde, wurden die Arbeiten an der Stadt eingestellt. Jetzt können wir das Projekt abschließen und sie als Leuchtturm der Moderne etablieren."
AFG_towards_an_amanullah_caliphate:	"Auf dem Weg zu einem Amanullah-Kalifat"
AFG_towards_an_amanullah_caliphate_desc:	"$AFG_amunullah_khan$ erwog einst, nach der Auflösung des Osmanischen Reiches den Titel des Kalifen anzunehmen, entschied sich aber zugunsten eines moderneren Regimes dagegen. Diesmal hat er beschlossen, nicht denselben Fehler zu begehen und sich stattdessen seinen Platz als Führer der islamischen Welt zu sichern."
