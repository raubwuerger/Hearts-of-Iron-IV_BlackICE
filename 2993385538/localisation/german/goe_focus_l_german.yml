AFG_demand_foreign_recognition:	"Ausländische Anerkennung einfordern"
AFG_demand_foreign_recognition_desc:	"TODO"
AFG_afghan_golden_age:	"Afghanisches Goldenes Zeitalter"
AFG_afghan_golden_age_desc:	"TODO"
AFG_alternative_partnerships:	"Alternative Partnerschaften"
AFG_alternative_partnerships_desc:	"Wir haben es geschafft, unsere Unabhängigkeit zu bewahren, indem wir die [ENG.GetAdjective] und [SOU.GetAdjective]s jahrzehntelang sorgfältig gegeneinander ausgespielt haben. Aber jetzt ist ein neuer Spieler in das Große Spiel eingetreten, und wir werden unsere Strategien entsprechend anpassen."
AFG_officer_training:	"Offiziersausbildung"
AFG_officer_training_desc:	"Die [GER.GetAdjective] Armee hat bewiesen, dass sie den [ENG.GetAdjective] oder [SOU.GetAdjective] Armeen mehr als gewachsen ist. Wir sollten ihre Offiziere um Unterstützung bei der Ausbildung der nächsten Generation von [ROOT.GetAdjective] Soldaten bitten."
AFG_permit_axis_airbases:	"Erlauben Sie den Achsenmächten Luftstützpunkte"
AFG_permit_axis_airbases_desc:	"Unsere Freunde in [GER.Capital.GetCapitalVictoryPointName] tun sich schwer damit, ihre Luftwaffe so weit weg von zu Hause aufzustellen. Wir können dieses Problem für sie lindern und gleichzeitig nützliche Infrastruktur und Fachwissen für uns gewinnen. "
AFG_join_axis:	"Schließen Sie sich der Achse an"
AFG_join_axis_desc:	"Obwohl wir es bisher vermieden haben, in einen größeren Konflikt verwickelt zu werden, gibt es so viele Möglichkeiten, die wir nutzen können, wenn wir uns voll und ganz für die Sache der Achsenmächte einsetzen. Daher werden wir eine Vollmitgliedschaft in der Allianz beantragen."
AFG_axis_airforce:	"Luftwaffe der Achse"
AFG_axis_airforce_desc:	"Nachdem wir eng mit der [GER.GetAdjective]-Luftwaffe zusammengearbeitet haben, glauben wir, dass wir nach ihrem Vorbild eine eigene funktionale Streitmacht aufbauen können. Alles, was wir dazu brauchen, ist die entsprechende Ausrüstung."
AFG_axis_equipment:	"Ausrüstung der Achsenmächte"
AFG_axis_equipment_desc:	"Unsere Militärausrüstung ist ein Sammelsurium aus unpassenden Varianten verschiedener Nationen. Mit ein wenig Hilfe der [GER.GetAdjective]s können wir jedoch endlich unsere gesamte Ausrüstung standardisieren und gleichzeitig modernisieren."
AFG_kabul_conference:	"Kabul-Konferenz"
AFG_kabul_conference_desc:	"Nach jahrzehntelangem Kampf, gefangen zwischen den [ENG.GetAdjective] und [SOU.GetAdjective], haben wir nun die Möglichkeit, uns an die Seite der Herrscher der neuen Weltordnung zu stellen und das einzufordern, was rechtmäßig uns gehört."
AFG_kabul_conference_tt:	"Schalten Sie §Y$AFG_kabul_conference_category$§! Entscheidungen frei, um die Gebotskosten der anvisierten Staaten in §YIndien, Zentralasien, Iran und dem Nahen Osten§! während der Friedenskonferenzen zu reduzieren, wenn unsere Fraktion siegreich ist."
AFG_support_king_zahir:	"Unterstützen Sie König Zahir"
AFG_support_king_zahir_desc:	"Nach jahrzehntelanger politischer Instabilität soll die Herrschaft von König Zahir Shah den Beginn eines Zeitalters des Friedens und der wirtschaftlichen Stabilität für unsere gebeutelte Nation markieren."
AFG_support_king_zahir_tt:	"§König Zahir Shah§! gewinnt:\n Politischer Machtzuwachs §G+5%§! \n Tägliche Unterstützung für Blockfreie §G+0.02§!"
AFG_biding_our_time:	"Zeit abwarten"
AFG_biding_our_time_desc:	"Mit König Zahir Shah als Aushängeschild der Nation kann die Regierung ohne Angst vor radikalen Aufständen ihren Geschäften nachgehen, solange sie die konservative Mehrheit auf ihrer Seite hat. Es könnte jedoch noch kleine Möglichkeiten geben, die Nation auf eine Weise zu modernisieren, die die traditionellen Aktivitäten nicht beeinträchtigt."
AFG_expand_the_kings_powerbase:	"Erweitern Sie die Machtbasis des Königs"
AFG_expand_the_kings_powerbase_desc:	"Der junge König Zahir Shah ist nur eine Galionsfigur für das Volk. Inzwischen haben die Onkel des Königs die mächtigsten Regierungsposten inne. Der König ist jedoch zunehmend frustriert über ihr antiquiertes Denken und möchte die Unterstützung für ein fortschrittlicheres Regime gewinnen."
AFG_visit_foreign_capitals:	"Besuchen Sie ausländische Hauptstädte"
AFG_visit_foreign_capitals_desc:	"Unserem Regime fehlt es an starken Verbindungen zu den Großmächten auf der ganzen Welt. Da die geopolitische Lage immer instabiler wird, könnte es in unserem Interesse sein, die Beziehungen zu diesen Mächten zu verbessern, falls sich uns Gelegenheiten bieten."
AFG_retire_the_uncles:	"Schicken Sie die Onkel in den Ruhestand"
AFG_retire_the_uncles_desc:	"Die politische Situation beginnt sich in [ROOT.Capital.GetCapitalVictoryPointName] zum Nachteil der alten Garde zu verändern. Jetzt ist es an der Zeit, dass der König das derzeitige Kabinett auflöst und ein neues Kabinett einsetzt, das seinen eigenen Zielen entspricht."
AFG_implement_currency_controls:	"Da Afghanistan Bank"
AFG_implement_currency_controls_desc:	"Unserer Wirtschaft fehlt es an einem starken Finanzsektor, der die wirtschaftliche Entwicklung des Landes unterstützen kann. Wir sollten daher mit dem privaten Sektor zusammenarbeiten, um eine Bank in Gemeinschaftsbesitz zu gründen, die Dienstleistungen für unsere aufstrebenden Industrien und Unternehmen anbieten kann."
AFG_privatize_factories:	"Fabriken privatisieren"
AFG_privatize_factories_desc:	"TODO"
AFG_introduce_national_service:	"Nationalen Dienst einführen"
AFG_introduce_national_service_desc:	"Die Nationen um uns herum geraten in eine Konfliktspirale und es gibt keine Garantie dafür, dass wir nicht in einen Strudel hineingezogen werden. Um uns auf eine solche Eventualität vorzubereiten, werden wir eine Form des Nationaldienstes einführen, um die Streitkräfte zu stärken."
AFG_placeholder_1:	"Deutsche Investitionen sichern"
AFG_placeholder_1_desc:	"Wir lieben weder die [ENG.GetAdjective] noch die [SOU.GetAdjective]s nach Jahrhunderten der Feindseligkeit und des Konflikts zwischen uns. Der Aufstieg der [GER.GetName] bietet uns jedoch die Möglichkeit, einen gleichgesinnten internationalen Partner zu gewinnen."
AFG_gain_religious_support_for_reforms:	"Derjenige, der sein Vertrauen in Gott setzt"
AFG_gain_religious_support_for_reforms_desc:	"In der Bevölkerung wächst die Sorge, dass der junge König Zahir Shah seine neu gewonnene Autorität nutzen wird, um drastische Reformen durchzuführen, die ihre Lebensweise zerstören werden. Um diese Befürchtungen zu zerstreuen, werden wir die Unterstützung der Mullahs gewinnen und das Engagement des Königs für den Islam demonstrieren."
AFG_reform_1:	"Reform des Bildungswesens"
AFG_reform_1_desc:	"Der Übergang zur parlamentarischen Demokratie ist nicht reibungslos verlaufen und wir müssen mehr tun, um der nächsten Generation demokratische Werte zu vermitteln. Deshalb müssen wir das Bildungssystem reformieren und es allen Kindern im ganzen Land zugänglich machen."
AFG_concessions_to_pashtuns:	"Zugeständnisse an die Paschtunen"
AFG_concessions_to_pashtuns_desc:	"Die Paschtunen machen die Mehrheit der Bevölkerung aus und die meisten ihrer Familien halten seit Jahrhunderten an den uralten Traditionen des Paschtunwali fest. Jetzt sind viele von ihnen besorgt, dass ihre Lebensweise ausgehöhlt wird. Dies ließe sich wahrscheinlich lindern, wenn wir mehr paschtunische Nationalisten und Paschtunwali-Anhänger in die Regierung bringen würden."
AFG_reform_2:	"Errichten Sie den Chak-Damm"
AFG_reform_2_desc:	"Mit Hilfe unserer ausländischen Partner verfügen wir über die technischen und finanziellen Mittel, um einen gewaltigen neuen Staudamm am Chak-Fluss zu errichten, der die Hauptstadt und die umliegenden Gebiete mit Strom versorgen soll. Allerdings wird dies die Gegner unserer Wohltäter verärgern."
AFG_reform_3:	"Antidemokratischen Einfluss zurückdrängen"
AFG_reform_3_desc:	"Trotz unserer Bemühungen, die Kluft zwischen der neuen Regierung und der Opposition zu überbrücken, neigen viele von ihnen nach wie vor zu reaktionären, antidemokratischen Überzeugungen und es ist durchaus möglich, dass sie gegen uns vorgehen, wenn sie die Gelegenheit dazu bekommen. Wir müssen daher mehr tun, um solche Aktivitäten einzuschränken."
AFG_reform_4:	"Wirtschaftliche Modernisierung"
AFG_reform_4_desc:	"Mit der Rückkehr der Stabilität in [ROOT.GetNonIdeologyName] sind auch die Investitionen und das Interesse der Wirtschaft zurückgekehrt. Um die Wirtschaft anzukurbeln, werden wir in die Modernisierung der Landwirtschaft und unserer begrenzten Industrien investieren."
AFG_parliamentary_democracy:	"Parlamentarische Demokratie"
AFG_parliamentary_democracy_desc:	"König Zahir Shahs politische Überzeugungen beginnen durchzuscheinen, nachdem er jahrelang im Schatten seiner Onkel stand. Es ist klar, dass der König einen Übergang zu einer parlamentarischen Demokratie unterstützen würde, wenn es in der Bevölkerung genügend Unterstützung für einen solchen Wandel gäbe. Ein solch radikaler Wandel könnte das Land jedoch in einen Bürgerkrieg mit den traditionelleren Menschen außerhalb der Hauptstadt stürzen."
AFG_parliamentary_democracy_tt:	"§AWenn die demokratische Unterstützung mehr als 50% beträgt, werden wir es vermeiden, einen Bürgerkrieg auszulösen.§!"
AFG_secure_dynasty:	"Sichere Dynastie"
AFG_secure_dynasty_desc:	"Wenn die Wirtschaft stabil ist und das Volk besänftigt ist, können wir die Barakzai-Dynastie sichern, indem wir weniger loyale Teile der Regierung entmachten und sie durch andere Familienmitglieder ersetzen, die dem König gegenüber loyal sind. Oder, was noch wichtiger ist, seine Onkel."
AFG_maintain_neutrality:	"Neutralität aufrechterhalten"
AFG_maintain_neutrality_desc:	"Trotz der relativen Stabilität im Inland wird die globale Situation immer gefährlicher. Bevor wir gegen unseren Willen in irgendwelche Konflikte hineingezogen werden, müssen wir allen unmissverständlich klar machen, dass wir eine neutrale Nation bleiben."
AFG_expel_axis_nationals:	"Achsenmächte vertreiben"
AFG_expel_axis_nationals_desc:	"Die Alliierten beschuldigen uns, dass wir ihren Feinden nachgeben, weil viele Bürger kriegführender Nationen in [ROOT.GetNonIdeologyName] frei ihren Aktivitäten nachgehen können. Obwohl es kaum Beweise dafür gibt, dass sie unseren Interessen schaden, sollten wir die Alliierten beschwichtigen, indem wir diese Menschen auffordern, für die Dauer des aktuellen globalen Konflikts zu gehen."
AFG_expel_allied_nationals:	"Alliierte Staatsangehörige ausweisen"
AFG_expel_allied_nationals_desc:	"Die Achsenmächte haben uns fragwürdige Beweise vorgelegt, dass unser Regime Gefahr läuft, von den Alliierten usurpiert zu werden. Sie argumentieren, dass die einzige Möglichkeit, dies zu verhindern, darin besteht, alle Bürger der alliierten Nationen zu vertreiben, um deren Spione im Lande aufzuspüren."
AFG_pursue_our_own_agenda:	"Verfolgen Sie unsere eigene Agenda"
AFG_pursue_our_own_agenda_desc:	"Die internationale Ordnung wird umgeschrieben, da die Großmächte aufeinanderprallen. Anstatt uns an eine bestimmte Gruppe zu binden, sollten wir das Chaos nutzen und unsere eigenen außenpolitischen Ziele verfolgen. "
AFG_align_with_the_allies:	"Verbünden Sie sich mit den Verbündeten"
AFG_align_with_the_allies_desc:	"Trotz einer Fülle von Beschwerden über die Briten müssen wir diese für den Moment beiseite legen und eine stärkere Zusammenarbeit mit den Alliierten anstreben. Wie die Briten sagen, ist es besser, mit dem Teufel zu verhandeln, den man kennt."
AFG_demand_pashtunistan_referendum:	"Fordern Sie ein Referendum für Paschtunistan"
AFG_demand_pashtunistan_referendum_desc:	"Die Paschtunen machen die Mehrheit unserer Nation aus, aber viele leben außerhalb unserer Grenzen in den Nachbarstaaten. Wir müssen die Unabhängigkeit dieser Staaten für die Paschtunen durchsetzen, damit wir sie in unseren Einflussbereich bringen können."
AFG_protector_of_the_tajiks:	"Beschützer der Tadschiken"
AFG_protector_of_the_tajiks_desc:	"Zwischen der paschtunischen Bevölkerungsmehrheit und der großen Gruppe der Tadschiken im Norden des Landes ist es oft zu Spannungen gekommen. Wir haben jedoch die Möglichkeit, ihre Gunst zu gewinnen, indem wir die Tadschiken jenseits unserer Grenzen unter der despotischen Herrschaft von [742.OWNER.GetLeader] befreien."
AFG_protector_of_the_tajiks_tt:	"Entscheiden Sie sich, Frieden mit [742.OWNER.GetNameDef] vorzuschlagen, wenn [742.GetName] von [ROOT.GetName] besetzt ist"
AFG_anti_soviet_cooperation:	"Antisowjetische Zusammenarbeit"
AFG_anti_soviet_cooperation_desc:	"Es gibt keinen Mangel an Nationen, die den Einfluss von [SOU.GetAdjective] beschnitten sehen wollen. Wir sollten dies als Gelegenheit nutzen, um von diesen Nationen militärisches Fachwissen zu erwerben, damit wir auf einen zukünftigen [SOU.GetAdjective] Expansionismus bestens vorbereitet sind."
AFG_sinkiang_intervention:	"Sinkiang Intervention"
AFG_sinkiang_intervention_desc:	"[SIK.GetNonIdeologyName] war lange Zeit ein Teil der islamischen Welt. Doch der Aufstieg des Kommunismus im ehemaligen Russischen Reich und in China bedroht nun unsere muslimischen Mitbürger jenseits der Grenze dort. Es ist an der Zeit, die Bedrohung für sie ein für alle Mal zu beenden."
AFG_propose_confederation_with_pakistan:	"Konföderation mit Pakistan vorschlagen"
AFG_propose_confederation_with_pakistan_desc:	"Das Volk von [PAK.GetNonIdeologyName] hat schon viel zu lange unter der Herrschaft von [ENG.GetAdjective] gelitten und zu Recht auf seine Unabhängigkeit gedrängt. Unsere Völker teilen jedoch so viel Geschichte und Kultur, dass es nur sinnvoll ist, wenn unsere beiden Nationen sich vereinigen, bevor wir uns stattdessen gegenseitig bekriegen."
AFG_afghan_pakistan_cold_War:	"Afghanisch-pakistanischer Kalter Krieg"
AFG_afghan_pakistan_cold_War_desc:	"Obwohl es uns schmerzt, mit unseren Verwandten jenseits der Grenze im Streit zu liegen, müssen wir die Bedrohung anerkennen, die sie jetzt für uns darstellen. Deshalb müssen wir Vorbereitungen treffen, um sie mit allen notwendigen Mitteln in Schach zu halten."
AFG_graveyard_of_empires:	"Friedhof der Reiche"
AFG_graveyard_of_empires_desc:	"Reiche kommen und gehen, aber unser Volk bleibt der unbestrittene Herrscher dieser Region. Solange unser Volk geeint und mit seinem Erbe verbunden bleibt, wird jeder Angreifer [ROOT.GetNonIdeologyName] wahrlich als seinen Friedhof empfinden."
AFG_prepare_for_operation_countenance:	"Bereiten Sie sich auf die Operation Countenance vor"
AFG_prepare_for_operation_countenance_desc:	"Die Alliierten bereiten sich auf eine Intervention im benachbarten [PER.GetName] vor, um ihr Öl zu sichern, bevor unsere Feinde uns zuvorkommen. Wir müssen logistische Vorkehrungen treffen, um die Intervention zu unterstützen und unseren Teil zur kommenden Operation beizutragen."
AFG_invite_foreign_corporations:	"Ausländische Konzerne einladen"
AFG_invite_foreign_corporations_desc:	"Im Vergleich zu anderen Nationen hinken wir in der Industrie nach wie vor hinterher, was sich in einer geringen inländischen Waffenproduktion niederschlägt. Um dies zu ändern und unsere Industrie zu modernisieren, werden wir Unternehmen aus der ganzen Welt einladen, sich hier niederzulassen."
AFG_secure_iran:	"Den Iran sichern"
AFG_secure_iran_desc:	"Es ist an der Zeit, die [PER.GetAdjective] Ölfelder zu sichern. In Abstimmung mit unseren Verbündeten werden wir tun, was wir tun müssen. Selbst wenn dies einen Regimewechsel in [PER.Capital.GetCapitalVictoryPointName] erfordert."
AFG_repeal_the_durand_line:	"Heben Sie die Durand-Linie auf"
AFG_repeal_the_durand_line_desc:	"Wir haben uns für die Alliierten als vertrauenswürdiger Freund in der Region erwiesen. Vielleicht wäre jetzt eine gute Gelegenheit, die Durand-Linie neu zu verhandeln, die uns vor all den Jahren grausam aufgezwungen wurde."
AFG_future_of_balochistan:	"Die Zukunft von Belutschistan"
AFG_future_of_balochistan_desc:	"Auch wenn wir vorerst mit den Alliierten zusammenarbeiten, müssen wir an die langfristige Politik unserer Region denken. Wir sollten uns daher für ein unabhängiges Belutschistan einsetzen, das wir beeinflussen können, bevor es von einem größeren Staat geschluckt wird."
AFG_linchpin_of_global_defense:	"Dreh- und Angelpunkt der globalen Verteidigung"
AFG_linchpin_of_global_defense_desc:	"Die Alliierten sehen unsere Zugehörigkeit weiterhin als Vorteil in ihrem geopolitischen Verhalten gegenüber unseren gemeinsamen Gegnern. Wir sollten uns dies zunutze machen, indem wir mehr Investitionen in die militärische Infrastruktur tätigen, die für uns alle von Vorteil sein werden. "
AFG_promote_the_counter_elite:	"Fördern Sie die Gegenelite"
AFG_promote_the_counter_elite_desc:	"In der politischen Elite gibt es viele, die radikale Ideen zur Modernisierung der Nation haben, aber aufgrund des konservativen politischen Klimas konnten sie diese Ideen nicht umsetzen. Jetzt, wo die alte Regierung aufgelöst ist, ist vielleicht die Zeit gekommen, diese Radikalen zu fördern."
AFG_promote_the_counter_elite_tt:	"Die folgenden Berater können angeworben werden:"
AFG_support_warzistan_independence:	"Unterstützung der Unabhängigkeit Warzistans"
AFG_support_warzistan_independence_desc:	"Unsere Grenzen mit den [ENG.GetAdjective] in Indien sind eine ständige Quelle der Spannung zwischen unseren Nationen. Wir haben zwar nicht die Kraft, sie aus der Region zu vertreiben, aber wir können ihre Herrschaft untergraben, indem wir Unabhängigkeitsbewegungen wie die in Warzistan unterstützen. "
AFG_socialist_coup:	"Sozialistischer Coup"
AFG_socialist_coup_desc:	"Mit der Aushöhlung der konservativen Beschränkungen des politischen Denkens hat sich die Büchse der Pandora geöffnet und eine Welle antimonarchistischer Gefühle schwappt über das Land. Jetzt ist es an der Zeit, dieses antiquierte Königreich hinwegzufegen und einen modernen sozialistischen Staat einzuführen."
AFG_state_atheism:	"Staatlicher Atheismus"
AFG_state_atheism_desc:	"Das Paschtunwali, der Islam und alle anderen traditionellen Opiate der Massen müssen beiseite geschoben werden, wenn wir die Wirtschaft und die Gesellschaft modernisieren wollen. Wir müssen daher diese antiquierten Praktiken einschränken und das Volk auf säkulare Weise erziehen."
AFG_soviet_research_cooperation:	"Sowjetische Forschungskooperation"
AFG_soviet_research_cooperation_desc:	"Unsere einstigen Widersacher in [SOU.GetNameDef] sind nach dem Sturz des alten Regimes schnell zu unseren engsten Freunden geworden. Wir haben daher die Möglichkeit, von ihnen technologische Erkenntnisse zu gewinnen, die uns bei der Transformation von [ROOT.GetNonIdeologyName] helfen werden."
AFG_soviet_research_technology_exchange_tt:	"§_[SOU.GetNameDefCap] wird eher zustimmen, wenn sie eine hohe Meinung von uns haben.§! Wenn [SOU.GetFlag]§Y[SOU.GetNameDef]§! dem Vorschlag zustimmt, werden wir uns mit ihnen in einer Tech-Sharing-Gruppe zusammenschließen."
AFG_communist_industrialization:	"Kommunistische Industrialisierung"
AFG_communist_industrialization_desc:	"Da wir die alten Regierungsmechanismen des imperialistischen Regimes abgebaut haben, können wir nun mit dem Prozess der schnellen Kollektivierung und Industrialisierung beginnen, um unsere Wirtschaft ins 20. "
AFG_support_soviets_in_asia:	"Unterstützen Sie die Sowjets in Asien"
AFG_support_soviets_in_asia_desc:	"Die zentralasiatischen Republiken innerhalb des [SOU.GetNameDef] sind aufgrund ihrer Entfernung zum [SOU.Capital.GetCaptialVictoryPointName] eine Brutstätte für konterrevolutionäre Aktivitäten. Um ein Übergreifen von Reaktionären auf unser Land zu verhindern, sollten wir die [SOU.GetAdjective] bei der Aufrechterhaltung der Ordnung in der Region unterstützen."
AFG_integrate_tajik_and_uzbek_republics:	"Verteidiger von Zentralasien"
AFG_integrate_tajik_and_uzbek_republics_desc:	"Wir haben bewiesen, dass wir ein unschätzbarer Gewinn für [SOU.GetNameDef] sind. Daher erscheint es nur fair, dass wir für unsere Bemühungen territoriale Zugeständnisse verlangen. Dies sollte auch dazu beitragen, die nicht-paschtunischen Minderheiten im Norden zu besänftigen."
AFG_integrate_tajik_and_uzbek_republics_tt:	"Wenn §Y[SOU.GetName]§! dem Vorschlag zustimmt:"
AFG_republic_of_afghanistan:	"Rufen Sie eine Republik aus"
AFG_republic_of_afghanistan_desc:	"Es war ein großer Schritt, die Demokratie in Form einer konstitutionellen Monarchie einzuführen. Es bleibt jedoch die Sorge, dass unsere demokratischen Freiheiten niemals vollständig gesichert sein werden, solange wir nicht die letzten Überreste der Monarchie beseitigen, indem wir eine Republik ausrufen und ein demokratisches Staatsoberhaupt wählen. "
AFG_republic_of_afghanistan_tt:	"§A Wir werden in der Lage sein, eine neue Identität für unsere Nation zu wählen, die das, was als unsere Kernstaaten angesehen wird, verändern oder neue Ideen hinzufügen kann.§!"
AFG_hot_war_with_pakistan:	"Pakistan auslöschen"
AFG_hot_war_with_pakistan_desc:	"Die Narren in [PAK.GetNonIdeologyName] wollen unser Volk spalten und uns alle zanken lassen, während die wahren Bedrohungen von [SOU.GetNameDef] und [RAJ.GetNameDef] weiter an Stärke gewinnen. Wir müssen dieses aufstrebende Regime beseitigen, bevor es unser ganzes Volk unter das Joch einer anderen Macht stellt."
AFG_accelerate_integration:	"Stärkung der Konföderation"
AFG_accelerate_integration_desc:	"Unsere jüngste Gründung einer Konföderation zwischen [ROOT.GetNonIdeologyName] und [PAK.GetNonIdeologyName] war ein voller Erfolg. Wir sollten jedoch den Integrationsprozess noch weiter beschleunigen, um sicherzustellen, dass wir auf alles vorbereitet sind, was die Welt uns vorsetzt."
AFG_seek_british_investment:	"Suche nach britischen Investitionen"
AFG_seek_british_investment_desc:	"Jahrzehntelang haben wir [ENG.GetAdjective] Ängste vor [SOV.GetNameDef] geschürt, die über unsere Nation herfallen und ihre wertvollen indischen Gebiete annektieren. Das hat zu Stipendien und Investitionen geführt, um uns auf ihrer Seite zu halten. Da die Weltlage immer prekärer wird, könnte sich die Fortsetzung dieses Spiels als noch profitabler erweisen."
AFG_central_asian_unification:	"Zentralasiatische Einigung"
AFG_central_asian_unification_desc:	"Zentralasien hat sich durch unser umsichtiges Management von einem wirtschaftlichen Rückzugsgebiet in ein schnell wachsendes industrielles Kraftzentrum verwandelt. Gemeinsam werden wir eine neue sozialistische Zukunft für alle unsere Völker schmieden."
AFG_central_asian_unification_tt:	"Setzen Sie die §Y$AFG_develop_central_asia_category$§! Beschlüsse zur Gewinnung von Kernen ehemaliger [SOU.GetAdjective] Staaten in Zentralasien um, die an uns abgetreten wurden."
AFG_sov_iran_war:	"Stürzen Sie den Schah von [PER.GetNonIdeologyName]"
AFG_sov_iran_war_desc:	"Unsere Genossen in [SOU.GetNameDef] sind von allen Seiten eingeengt, was sie daran hindert, eine Warmwasserflotte zu unterhalten, die sich unseren Feinden entgegenstellen kann. Aufgrund ihrer stillschweigenden Unterstützung für unsere Feinde könnte die Besetzung von [PER.GetName] uns eine neue Basis für Marineoperationen verschaffen und uns von einem potenziellen Feind befreien."
AFG_development_in_uzb:	"Usbekistan entwickeln"
AFG_development_in_uzb_desc:	"Usbekistan wurde von den verschiedenen Regimen, die es besetzt haben, lange Zeit vernachlässigt. Wenn wir uns die Kontrolle über das Land sichern wollen, müssen wir diese Ungerechtigkeit korrigieren und die Entwicklung der Region fördern, während wir sie gleichzeitig in unsere Wirtschaft integrieren."
AFG_development_in_taj:	"Tadschikistan entwickeln"
AFG_development_in_taj_desc:	"Tadschikistan ist ein Schatten dessen, was es sein könnte. Mit der Integration in unsere Wirtschaft könnte es sich als wertvolle Quelle für Aluminium und andere wichtige Ressourcen für unsere Modernisierungsbemühungen erweisen."
AFG_development_in_tms:	"Entwickeln Sie Turkmenistan"
AFG_development_in_tms_desc:	"Öl wird zu einer entscheidenden Ressource für eine moderne Wirtschaft oder ein modernes Militär. Glücklicherweise haben Prospektoren herausgefunden, dass Turkmenistan über ein großes Vorkommen der kostbaren Flüssigkeit verfügt, das nur darauf wartet, gefördert zu werden."
AFG_modern_economy:	"Eine moderne Wirtschaft"
AFG_modern_economy_desc:	"Wir haben uns endlich von den Fesseln unserer antiquierten Wirtschaftspraktiken befreit, die unser Volk jahrhundertelang zurückgehalten haben. Jetzt können wir wirklich mit den anderen Industrienationen der Welt mithalten."
AFG_darulaman:	"Darulaman"
AFG_darulaman_university:	"Darulaman Universität"
AFG_darulaman_university_desc:	"Unsere moderne Stadt Darulaman wächst nach der Verlegung von Regierungseinrichtungen in die Stadt rasch an. Der König möchte Darulaman jedoch durch die Gründung einer neuen Universität mit Einrichtungen von Weltklasse zu einer großen Stadt des Lernens machen."
AFG_modifiy_1923_constitution_modifier_tt:	"Ändern Sie §Y$AFG_1923_constitution_modifier$§! von:\n"
AFG_from_the_ashes:	"Aus der Asche"
AFG_from_the_ashes_desc:	"Seit dem Zerfall des Osmanischen Reiches herrscht in der islamischen Welt ein Machtvakuum. Jetzt, da die Großmächte wieder durch globale Konflikte abgelenkt sind, haben wir die Chance, uns als überragende Macht in der islamischen Welt zu behaupten."
AFG_exploit_turko_persian_heritage:	"Das türkisch-persische Erbe ausnutzen"
AFG_exploit_turko_persian_heritage_desc:	"Unsere Nation ist im Laufe der Jahrhunderte sowohl von der [PER.GetAdjective] als auch von der [TUR.GetAdjective] Kultur stark beeinflusst worden. Wir sollten dies in den Vordergrund unserer Politik rücken und eine neue türkisch-persische Identität schmieden, die wir nutzen können, um ein Gefühl der Einheit mit unseren Nachbarn zu schaffen."
AFG_exploit_turko_persian_heritage_tt:	"Schalten Sie §Y$AFG_turko_persian_heritage_category$§! Entscheidungen frei, um Nationen in unsere Fraktion einzuladen oder Kriegsziele gegen sie zu erreichen."
AFG_protector_of_baghdad:	"Beschützer von Bagdad"
AFG_protector_of_baghdad_desc:	"TODO"
AFG_savior_of_the_holy_lands:	"Retter der Heiligen Länder"
AFG_savior_of_the_holy_lands_desc:	"Der Moment ist gekommen, in dem wir eine heilige Pflicht erfüllen und die Heiligen Länder vom Joch fremder Unterdrücker befreien. Unsere tapferen Soldaten werden mit der Kraft unserer Vorfahren marschieren, inspiriert von der gerechten Sache, den Geburtsort unseres Glaubens zurückzuerobern. Dieses göttliche Unterfangen wird nicht nur die islamische Welt unter unserer Führung vereinen, sondern auch unserer großen Nation Ehre und Ruhm einbringen. "
AFG_recruit_experts_and_officers:	"Experten und Offiziere rekrutieren"
AFG_recruit_experts_and_officers_desc:	"Wissenschaftler, Ingenieure und Militäroffiziere, die einst den [PER.GetAdjective] oder [TUR.GetAdjective] Staaten dienten, beginnen nun die Überlegenheit unserer Nation zu erkennen. So können wir sie vielleicht davon überzeugen, uns zu dienen, wenn wir versuchen, uns als regionale Großmacht zu etablieren."
AFG_turko_persian_empire:	"Das türkisch-persische Reich"
AFG_turko_persian_empire_desc:	"Da der Großteil der [TUR.GetAdjective] und [PER.GetAdjective] Ländereien nun fest unter unserer Kontrolle steht, ist es an der Zeit, unser Herrschaftsgebiet in ein neues Turko-Persisches Reich umzuwandeln, um die Sicherheit unserer großen Gesellschaft zu gewährleisten."
AFG_eyes_on_the_north:	"Die Augen auf den Norden gerichtet"
AFG_eyes_on_the_north_desc:	"Die Regionen in unserem Norden sind reich an Ressourcen, die von unseren Gegnern noch nicht vollständig ausgebeutet wurden. Es ist unerlässlich, dass wir die notwendigen Vorbereitungen für eine mögliche Expansion in diese Gebiete treffen. Die Verstärkung unserer militärischen Präsenz und die Sicherung der Nachschublinien werden dabei entscheidende Schritte sein."
AFG_alliance_with_turkik_peoples:	"Bündnis mit den Turkvölkern"
AFG_alliance_with_turkik_peoples_desc:	"Als Teil unserer strategischen Ziele im Norden ist es unerlässlich, die bestehenden Machtstrukturen zu schwächen, indem wir Unruhe unter den Turkvölkern in der Region schüren. Indem wir bestehende Missstände ausnutzen und Dissens schüren, können wir die lokalen Regierungen destabilisieren und ein günstigeres Umfeld für unsere Expansion schaffen."
AFG_alliance_with_turkik_peoples_tt:	"Schalten Sie §Y[AFG_get_turkik_people_name_key]§! Entscheidungen zur Verbreitung von Widerstandszellen in [SOU.GetAdjective] zentralasiatischen Staaten frei. Staaten, in die wir uns eingemischt haben, werden sich uns anschließen, wenn der Krieg mit [SOU.GetNameDef] ausbricht."
AFG_red_threat:	"Die rote Bedrohung"
AFG_red_threat_desc:	"Mit unseren heimlichen Verbündeten in Zentralasien bietet sich uns eine einzigartige Gelegenheit, [SOU.GetAdjective] Einfluss zu schwächen und unseren eigenen auszuweiten. Wir werden unsere Invasion mit den Widerstandszellen in der Region koordinieren und den Feind stürzen, bevor er überhaupt weiß, was passiert."
AFG_fortify_pakistan:	"Befestigen Sie die Grenze"
AFG_fortify_pakistan_desc:	"Es ist zwingend notwendig, unsere neu erweiterten Grenzen zu sichern. Die Errichtung einer Reihe von Festungsanlagen und Verteidigungspositionen wird die Stabilität und Sicherheit unseres Territoriums gewährleisten. Außerdem erhalten wir dadurch eine starke Position, von der aus wir unsere militärische Macht ausüben können, sollte es zu einem Konflikt in der Region kommen."
AFG_fortify_pakistan_tt:	"Staaten entlang der Grenze zu [RAJ.GetNameDef], die wir im vorherigen Fokus erworben haben, erhalten §G2§! §YLandfestungen§!"
AFG_into_the_plains_of_india:	"In die Ebenen von [RAJ.GetNameDef]"
AFG_into_the_plains_of_india_desc:	"Für unser Volk ist die Zeit gekommen, sich als Herrscher des indischen Subkontinents zu behaupten. Wir werden tun, was unsere Vorfahren einst taten, und von den Bergen herabstürzen, solange sie noch schwach sind, aber dieses Mal werden wir dort bleiben."
AFG_pashtun_empire:	"Aufstieg Paschtunistans"
AFG_pashtun_empire_desc:	"Der heutige Tag markiert einen historischen Moment in der Geschichte unseres Landes. Unter der Führung von [ROOT.GetLeader] werden wir mit Stolz die Errichtung der paschtunischen Aszendentschaft und den Beginn einer neuen Ära für das paschtunische Volk verkünden. Durch unser modernisiertes Militär, strategische Allianzen und eine ehrgeizige Politik haben wir unsere Position als dominierende regionale Macht gefestigt."
AFG_work_with_gestapo:	"Zusammenarbeit mit dem [GER.GetAdjective] Geheimdienst"
AFG_work_with_gestapo_desc:	"In unseren neu erworbenen Gebieten stellen Uneinigkeit und Unruhen weiterhin eine große Herausforderung für unsere Autorität dar. Um dem zu begegnen, haben wir eine Zusammenarbeit mit den [GER.GetAdjective] Geheimdiensten aufgebaut. Ihre Expertise in der Aufstandsbekämpfung und in nachrichtendienstlichen Operationen wird bei der Identifizierung und Neutralisierung von Rebellengruppen von unschätzbarem Wert sein. "
AFG_secure_baghdad:	"Bagdad sichern"
AFG_secure_baghdad_desc:	"Während sich unser Einfluss in der Region ausweitet, wird deutlich, dass [IRQ.GetNameDef] das Potenzial hat, unsere Bemühungen zu untergraben. Wir müssen daher die Anpassung ihrer Außenpolitik verlangen, oder sie werden den Zorn unserer Streitkräfte zu spüren bekommen."
AFG_agreement_with_germany:	"Einigung mit [GER.GetNameDef]"
AFG_agreement_with_germany_desc:	"In diesen turbulenten Zeiten müssen wir starke und verlässliche Verbündete suchen, um unseren Platz als dominierende Macht in der islamischen Welt zu sichern. In diesem Sinne werden wir [GER.GetNameDef] die Hand reichen, um ihr Interesse an einem gegenseitigen Verteidigungspakt auszuloten."
AFG_agreement_with_germany_tt:	"\n\n§Y[GER.GetNameDefCap] wird eher zustimmen, wenn sie eine Meinung von uns haben, die größer ist als 50.§!"
AFG_renounce_the_durand_line:	"Verzichten Sie auf die Durand-Linie"
AFG_renounce_the_durand_line_desc:	"Die Durand-Linie, die uns von ausländischen Unterdrückern aufgezwungen wurde, hat unsere paschtunischen Verwandten schon viel zu lange geteilt. Durch die Klugheit unserer Diplomaten oder die Stärke unserer Streitkräfte werden wir dieser Ungerechtigkeit ein für alle Mal ein Ende setzen."
AFG_renounce_the_durand_line_tt:	"\n\n§Die Besitzer der beanspruchten Staaten werden unseren Vorschlag eher akzeptieren, wenn sie sich bereits im Krieg befinden oder durch einen andauernden Bürgerkrieg geschwächt sind.§!"
AFG_topple_iran:	"Stürzen Sie den Iran"
AFG_topple_iran_desc:	"Unter der visionären Führung von [ROOT.GetLeader] sind wir bereit, unseren [PER.GetAdjective] Brüdern und Schwestern, die lange unter der despotischen Herrschaft von [PER.GetLeader] gelitten haben, Freiheit und Gerechtigkeit zu bringen. Wir werden nicht nur unsere Grenzen sichern, sondern auch unseren Einfluss in der gesamten Region ausweiten."
AFG_sov_attack_bonus:	"Die Rote Bedrohung"
AFG_raj_attack_bonus:	"Nach Indien vordringen"
AFG_work_with_ger_intel_bonus:	"Techniken zur Unterdrückung der Partisanen"
AFG_rapprochement_with_non_pashtuns:	"Annäherung an die Nicht-Paschtunen"
AFG_rapprochement_with_non_pashtuns_desc:	"Viel zu lange wurden die Nicht-Paschtunen in unserem Land an den Rand der Politik gedrängt. Dies hat nicht nur zu Ressentiments gegen die Zentralregierung geführt, sondern auch zu deren vollständigem Sturz im Jahr 1929. Deshalb müssen wir dafür sorgen, dass sich in dem neuen demokratischen System alle unsere Bürger vertreten und gehört fühlen."
AFG_khorasan_buffer_state:	"Pufferstaat Khorasan errichten"
AFG_khorasan_buffer_state_desc:	"Da die gegenwärtige Bedrohung durch [PER.GetNonIdeologyName] für unsere Kriegsanstrengungen so gut wie beseitigt ist, müssen wir beginnen, in die Zukunft zu blicken. Aufgrund der historischen Spannungen zwischen unseren Nationen und unserer Beteiligung an der Operation Countenance sollten wir Maßnahmen ergreifen, um einen Puffer zwischen uns und einer möglicherweise rachsüchtigen [PER.GetAdjective]-Regierung der Zukunft zu schaffen."
AFG_khorasan_buffer_state_tt:	"§A Wir werden in den folgenden Staaten eine Marionettenregierung von Khorasan einrichten, wenn wir sie kontrollieren: \n [1004.GetName]\n [416.GetName]\n [1003.GetName]§!"
AFG_emerging_economy:	"Aufstrebende Wirtschaft"
AFG_mountain_training_2:	"Beherrschen Sie die Berge"
AFG_mountain_training_2_desc:	"Nach dem Erfolg unserer Initiative zur Ausbildung in den Bergen hat sich gezeigt, dass wir weiterhin spezialisierte Kampfeinheiten für dieses Terrain aufbauen sollten."
AFG_expand_quami_template:	"Quami reformieren"
AFG_expand_quami_template_desc:	"Das Quami-System hat uns natürlich über die Jahre hinweg gute Dienste geleistet, aber es gibt Raum für Verbesserungen. Indem wir die Einheiten umstrukturieren, wenn sie aufgestellt werden, werden sie in der Lage sein, [AFG.GetNonIdeologyName] besser zu verteidigen."
AFG_expand_quami_template_tt:	"Fügen Sie §Y3§! Bataillone von Freischärlern zur §YPaschtun Levy§! Vorlage hinzu."
AFG_expand_quami_template_2_tt:	"Wenn wir §Y$tech_engineers$ , $tech_military_police$ oder $tech_field_hospital$§! erforscht haben, werden sie der Vorlage hinzugefügt."
AFG_request_soviet_support:	"Bitte um sowjetische Hilfe"
AFG_request_soviet_support_desc:	"Unsere Revolution droht zu scheitern, weil wir nur über begrenzte wirtschaftliche Ressourcen und Arbeitskräfte verfügen, mit denen wir die wichtigsten Bevölkerungszentren des Landes einnehmen könnten. Wenn wir Erfolg haben wollen, brauchen wir so schnell wie möglich Hilfe von [SOU.GetNameDef]."
AFG_international_brigades:	"Internationale Brigaden"
AFG_international_brigades_desc:	"Trotz der tapferen Opfer unserer Truppen sieht es nicht so aus, als würde sich der Krieg zu unseren Gunsten entwickeln. Aber vielleicht können wir das Blatt noch wenden, wenn wir internationale Freiwillige rekrutieren, die gegen die Unterdrückung kämpfen wollen."
AFG_defending_democracy:	"Die Nation verteidigen"
AFG_defending_democracy_desc:	"Auch wenn wir die Regierung vor internen Bedrohungen geschützt haben, wird es immer Bedrohungen von außerhalb unserer Grenzen geben. Wir müssen alles in unserer Macht stehende tun, um sicherzustellen, dass unsere Wirtschaft in der Lage ist, unsere Streitkräfte zu unterstützen, sollte es zu einem Krieg kommen."
AFG_islamic_republic_idea:	"Islamische Demokratie"
AFG_recruit_foreign_experts:	"Rekrutieren Sie ausländische Experten"
AFG_recruit_foreign_experts_desc:	"Möglicherweise verfügen wir hier im Land nicht über das nötige Fachwissen. Deshalb sollten wir außerhalb unserer Grenzen nach Fachleuten suchen, die uns jetzt helfen und uns diese Fähigkeiten für die Zukunft vermitteln können."
AFG_seek_american_aid:	"Suchen Sie amerikanische Hilfe"
AFG_seek_american_aid_desc:	"$PAR_accept_american_loans_desc$"
AFG_bill_of_rights:	"Bill of Rights"
AFG_bill_of_rights_desc:	"Unser Volk verdient ein kodifiziertes Dokument, das seine Rechte vor dem Gesetz festhält."
AFG_follower_of_islam:	"Anhänger des Islam"
AFG_follower_of_islam_desc:	"Der Islam ist seit mehr als einem Jahrtausend das Herzstück unseres Glaubens, und wir sollten sicherstellen, dass unser Führer sich an seine Leitprinzipien hält und damit unsere Nation in ein neues goldenes Zeitalter führt."
AFG_ministry_of_supply:	"Ministerium für Versorgung"
AFG_ministry_of_supply_desc:	"Die Nachschublinien für das Militär sind fast nicht vorhanden. Um die Situation zu verbessern, werden wir ein neues Ministerium einrichten, das sich um die Versorgung der Streitkräfte und der kritischen Infrastruktur kümmert."
AFG_communist_propaganda:	"Ministerium für Propaganda"
AFG_communist_propaganda_desc:	"Alle Mittel der Massenkommunikation müssen dem Staat unterstellt und genutzt werden, um das Volk zu unserer glorreichen Arbeiterrepublik zu erziehen."
AFG_hold_elections:	"Halten Sie Wahlen ab"
AFG_hold_elections_desc:	"Nachdem sich die Lage im Lande beruhigt hat, haben wir nun die Möglichkeit, endlich die ersten freien Wahlen in [AFG.GetNonIdeologyName] abzuhalten."
AFG_hold_elections_tt:	"§ADas folgende Wahlereignis wird es uns ermöglichen, einen neuen Führer des Landes zu wählen.§!"
GRE_byz_unified_flag:	"Byzanz"
PER_middle_east_protectorate_faction:	"Protektorat Naher Osten"
PER_first_warning_flag:	"Islamische Revolution Erste Warnung"
PER_second_warning_flag:	"Islamische Revolution Zweite Warnung"
