PER_infantry_equipment_bonus:	"Verstärkung der Infanterie-Waffen"
PER_support_technology_bonus:	"Verstärkung der Infanterieunterstützung"
PER_motorized_infantry_bonus:	"Initiative zur Panzermodernisierung"
