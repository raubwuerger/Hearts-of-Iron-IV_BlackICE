PER_anti_air_research_boost:	"Luftabwehr-Forschung"
PER_raiding_fleet_boost:	"Expertenjäger"
PER_superior_firepower:	"Erweiterte Einrichtungen für schwere Waffen"
PER_sea_specialization:	"Flotten-Spezialisierung"
PER_embrace_industrial_powers_bonus:	"Umarmung von Industriemächten"
PER_increase_education_funding_bonus:	"Erhöhte Bildungsfinanzierung"
PER_tech_share_bonus:	"Technologische Zusammenarbeit"
PER_clergy_upset_tt:	"§Wenn Sie diesen Schwerpunkt setzen, wird das den Klerus verärgern. Wenn Sie die Stabilität zu weit absenken, riskieren Sie einen revolutionären Bürgerkrieg!§!"
PER_clergy_happy_tt:	"§GDieser Schwerpunkt wird den Klerus besänftigen. Sie werden nicht länger die Notwendigkeit sehen, gegen Sie zu rebellieren.§!"
PER_clergy_revolt_tt:	"§Die Einnahme dieses Fokus führt zu einer verärgerten Revolution gegen Sie, die Sie in einen Bürgerkrieg stürzt!§!"
PER_profit_from_war_tt:	"Schaltet die Entscheidung frei: §Y$PER_profit_from_war_category$§! der es [PER.GetNonIdeologyName] ermöglicht, Ressourcenrechte an eine andere Nation abzugeben und gleichzeitig eine Offshore-Fabrik zu erhalten."
PER_add_panzer_leader_trait_tt:	"§YTwo§! zufällig ausgewählte Armeeführer erhalten die Eigenschaft Panzerführer."
PER_add_organizer_trait_tt:	"§YTwo§! zufällig ausgewählte Armeeführer erhalten die Eigenschaft Organisator."
PER_expand_imperial_guard_tt:	"Schaltet die §YIranian Imperial Guard§! Divisionsvorlage frei und rekrutiert §Ytwo§! Einheiten in §Y[ROOT.capital.GetCapitalVictoryPointName]§!."
PER_expand_immortal_legion_tt:	"Rekrutiert §Ydrei§! Einheiten von §YDie Unsterbliche Legion§! in §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
PER_establish_immortal_legion_tt:	"Schaltet die Divisionsvorlage §YImmortal Legion§! frei und rekrutiert §Ydrei§! Einheiten in §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
PER_naval_academy_random_admirals_tt:	"Bis zu §Ydrei§! zufällig ausgewählte Marineführer erhalten §G+1§! Koordinationsfähigkeit"
PER_acceptance_tt:	"§Y[SOU.GetNameDefCap]§! wird eher akzeptiert, wenn sie eine §Gute Meinung§! von uns haben!"
PER_acceptance_ger_tt:	"§Y[GER.GetNameDefCap]§! wird eher akzeptieren, wenn sie eine §Große Meinung§! von uns haben!"
PER_foothold_in_indus_tt:	"Schaltet eine §YEreigniskette§! frei, in der §Y[PER.GetNameDefCap]§! und §Y[RAJ.GetNameDefCap]§! um die Kontrolle über §YBaluchistan§! verhandeln."
PER_reintegrate_anatolia_tt:	"Schaltet §YReintegrate Anatolia§! Entscheidungen frei, die uns erlauben, eroberte Gebiete in unsere Nation zu integrieren."
PER_absorb_byzantines_tt:	"Schaltet §YAbsorbiere Byzanz§! Entscheidungen frei, die es uns ermöglichen, eroberte Gebiete in unsere Nation zu integrieren."
PER_memphis_initiative_tt:	"Schaltet §YMemphis Initiative§! Entscheidungen frei, die es uns ermöglichen, eroberte Gebiete in unsere Nation zu integrieren."
PER_new_shah_tt:	"§Y$PER_mohammed_reza_pahlavi$§! wird Anführer der §Y$PER_neutrality_party$§!."
PER_civil_unrest_tt:	"§Y$PER_mohammed_reza_pahlavi$ wird Anführer der §Y$PER_neutrality_party$ und startet die zeitlich begrenzte Mission $PER_civil_unrest_category$."
PER_legacy_of_greatness_tt:	"Ändern Sie §Y$PER_legacy_of_greatness_modifier$§! durch:"
PER_shahbanu_tt:	"Erhält Ereignis: §YWählen Sie einen Shahbanu§!, der es Ihnen ermöglicht, eine Königin auszuwählen, die als §YPolitischer Berater§! zur Verfügung steht."
PER_imperial_excellency_tt:	"Sobald der nationale Fokus: §YExpand Imperial Guard§! abgeschlossen ist, werden §Yzwei§! Einheiten der §YIranian Imperial Guard§! in §Y[ROOT.capital.GetCapitalVictoryPointName]§! rekrutiert."
PER_half_stability_tt:	"§ROUnsere Stabilität ist unter 50% gesunken! Wenn sie unter 20% sinkt, riskieren wir eine Revolution!§!"
PER_address_the_issue_tt:	"Schaltet die §YIslamische Revolution Entscheidungen§! frei, die uns §R90 Tage§! geben wird, um die Revolutionäre einzudämmen."
PER_rapid_appeasement_tt:	"Indem wir unsere Ressourcen geopfert haben, ist es uns gelungen, die Revolution vorerst abzuwehren."
PER_islamic_revolution_tt:	"Beginnt einen §RBürgerkrieg§! zwischen [PER.GetNameDef] und den islamischen Revolutionären!"
PER_trial_fifty_three_tt:	"Wenn Sie diesen Fokus einnehmen, werden alle §YCommunist§! Berater aus der Regierung verbannt."
PER_stand_with_giants_tt:	"Ändern Sie §Y$PER_stand_with_giants_modifier$§! durch:"
PER_negotiate_tt:	"Wird versuchen, §YPeace§! mit unseren Feinden zu vermitteln, was dazu führt, dass wir möglicherweise ein §Rpuppet§! von [ENG.GetFlag]§Y[ENG.GetNameDef]§! werden und Territorium an [SOU.GetFlag]§Y[SOU.GetNameDef]§! verlieren!"
PER_treaty_of_tehran_tt:	"Wird ein Ereignis an [ENG.GetFlag]§Y[ENG.GetNameDef]§! und [SOV.GetFlag]§Y[SOV.GetNameDef]§! senden und sie auffordern, ihre Truppen zurückzuziehen und den Krieg zu beenden."
PER_strike_first_tt:	"Wenn Sie auf diesem Weg vorgehen, werden Sie §Ya'dabad Pact§! nicht mehr ins Visier nehmen können!"
PER_buffer_state_tt:	"Wenn §Ypeace§! akzeptiert wird, dann werden [AZR.GetFlag]§Y[AZR.GetNameDef]§!, [GEO.GetFlag]§Y[GEO.GetNameDef]§!, [ARM.GetFlag]§Y[ARM.GetNameDef]§! und [TMS.GetFlag]§Y[TMS.GetNameDef]§! als Marionetten von [PER.GetFlag]§Y[PER.GetNameDef]§! freigelassen"
PER_resistance_decisions_tt:	"Schaltet §YPflanzenwiderstand§! Entscheidungen frei, die es uns erlauben, in Vorbereitung auf eine Invasion Instabilität in Nachbarländern zu verursachen."
PER_recruit_rebels_tt:	"Schaltet die §YBakhtiari Rebels§! und §YQashqai Rebels§! Divisionsvorlagen frei und rekrutiert §Yzwei§! Einheiten von jeder in §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
PER_white_peace_tt:	"Wird unseren Feinden ein §Yevent§! schicken, das §YWeißer Frieden§! fordert, was uns erlaubt, unser bisheriges Territorium§! zu behalten."
PER_reparations_tt:	"Wird unseren Feinden ein §Yevent§! schicken, das §YFrieden§! und §YKriegsreparationen§! in Form von §YFabriken§! und einem §YDebuff§! an den Aggressor fordert. Wenn das feindliche Land ein §Ydirekter Nachbar§! ist, werden sie stattdessen Grenzgebiet an §Yus§! abtreten."
PER_swear_fealty_tt:	"Senden Sie unseren Feinden ein §Yevent§!, das uns auffordert, uns zu ergeben und uns ihnen als §Ypuppet§! anzuschließen. Dadurch wird ein §Ypuppet-Zweig§! freigeschaltet, in dem wir entscheiden können, wie wir weiter vorgehen wollen."
PER_push_negotiations_tt:	"Wird unseren Feinden ein §Yevent§! schicken, das §YRessourcenrechte§! im Gegenzug für §YFrieden§! anbietet. Wenn sie uns ablehnen, werden wir im Krieg bleiben."
PER_preemptive_invasion_of_iran_tt:	"Sobald [PER.GetNameDef] kapituliert, werden wir das Land zu einer Marionette machen, indem wir ein paar Staaten an unserer Grenze integrieren und Ressourcenrechte in [PER.GetAdjective] Staaten erhalten, die reich an Öl sind. Wir werden in der Lage sein, [SOU.GetAdjective] um Intervention zu bitten, um eine gemeinsame Operation durchzuführen."
PER_territory_demands_tt:	"Damit werden wir das betreffende Land auffordern, uns _§! seine Grenzgebiete zu überlassen. Die Wahrscheinlichkeit, dass sie dies tun, ist größer, wenn unser Militär §Ymächtiger§! ist."
PER_modernizing_iran:	"Modernisieren [ROOT.GetNonIdeologyName]"
PER_modernizing_iran_desc:	"Zu lange wurde [ROOT.GetNonIdeologyName] durch Desorganisation und kleinliche Zankereien behindert. Wir müssen lernen, für uns selbst zu sorgen, wenn wir eine Nation schmieden wollen, die dem Test der Zeit standhält. Lassen Sie uns eine Zukunft schmieden, die auf Einigkeit beruht und die Moderne annehmen."
PER_adult_literacy:	"Alphabetisierungskampagne für Erwachsene"
PER_adult_literacy_desc:	"Analphabetismus ist ein großes Problem, unter dem unsere Bevölkerung leidet. Die Fähigkeit, in ihrer eigenen Sprache zu schreiben und zu lesen, wird dazu beitragen, unser Volk zu befähigen und zu befreien. Der Ministerrat und das Bildungsministerium haben sich zusammengetan, um ein Lehrbuch zu veröffentlichen und eine Schule zu gründen, in der unsere erwachsene Bevölkerung unterrichtet wird."
PER_national_museum:	"Eröffnen Sie das Nationalmuseum"
PER_national_museum_desc:	"Es ist wichtig, unsere Geschichte zu dokumentieren, besonders angesichts des reichen Wandteppichs, den [ROOT.GetNonIdeologyName] im Laufe der Jahrhunderte gewebt hat. Seit Jahren gibt es Pläne, ein Museum in Teheran zu eröffnen - es ist an der Zeit, sie endlich umzusetzen."
PER_foreign_schools:	"Übernehmen Sie die Kontrolle über ausländische Schulen"
PER_foreign_schools_desc:	"Es gibt eine große Anzahl von Schulen in ausländischem Besitz, die über das ganze Land verstreut sind [PER.GetAdjective]. Diese Einrichtungen könnten als Beispiel dafür gelten, dass unsere Führung ihre Souveränität an ausländische Mächte abtritt. Wir sollten sie beschlagnahmen und verstaatlichen, um der Entwicklung unseres Landes willen."
PER_foreign_schools_bonus:	"Verstaatlichte ausländische Schulen"
PER_university_of_isfahan:	"Finanzieren Sie die Universität von Isfahan"
PER_university_of_isfahan_desc:	"Wir brauchen dringend neue Bildungseinrichtungen, die sich auf die Ausbildung einer neuen Generation von medizinischen Fachkräften konzentrieren. Die Universität von Isfahan ist bereit, die fortschrittlichste medizinische Schule in ganz [ROOT.GetNonIdeologyName] zu werden!"
PER_university_of_isfahan_bonus:	"Finanziert die Universität von Isfahan"
PER_shiraz_university:	"Finanzieren Sie die Universität Shiraz"
PER_shiraz_university_desc:	"Wenn es um die Finanzierung neuer Universitäten geht, sollten wir uns auf die Gründung von Fachschulen konzentrieren, in der Hoffnung, dass ihre Absolventen den Grundstein für ein modernes [ROOT.GetNonIdeologyName] legen werden!"
PER_shiraz_university_bonus:	"Geförderte Shiraz Universität"
PER_educational_reforms:	"Bildungsreformen"
PER_educational_reforms_desc:	"Wir haben neue Alphabetisierungskampagnen ins Leben gerufen. Wir haben neue Universitäten gebaut. Jetzt ist es endlich an der Zeit, neue Bildungsreformen durchzuführen, die zum sozialen Fortschritt und zur Entwicklung unserer Bürger beitragen und die Probleme der bisher ungleichen Bildungschancen angehen."
PER_trans_iranian_railway:	"Die Transiranische Eisenbahn"
PER_trans_iranian_railway_desc:	"Im Jahr 1927 begannen wir mit dem Bau einer landesweiten Eisenbahnverbindung, der Transiranischen Eisenbahn. Jetzt, wo wir uns auf die Modernisierung der [ROOT.GetNonIdeologyName] zubewegen, ist es unerlässlich, dass wir Geld in die Fertigstellung dieses monumentalen Projekts stecken."
PER_expand_tabriz_masshad:	"Verbindung Tabriz-Masshad"
PER_expand_tabriz_masshad_desc:	"Wir müssen die Transiranische Eisenbahn weiter ausbauen. Konzentrieren wir uns auf den Ausbau einer Eisenbahnverbindung zwischen den Städten Täbris und Masshad."
PER_expand_tehran_emam:	"Teheran-Bandar Emam-Verbindung"
PER_expand_tehran_emam_desc:	"Wir müssen die Transiranische Eisenbahn weiter ausbauen. Konzentrieren wir uns auf den Ausbau einer Eisenbahnverbindung zwischen den Städten Teheran und Bandar Emam."
PER_expand_tehran_abbas:	"Teheran-Bandar Abbas-Verbindung"
PER_expand_tehran_abbas_desc:	"Wir müssen die Transiranische Eisenbahn weiter ausbauen. Konzentrieren wir uns auf den Ausbau einer Bahnverbindung zwischen den Städten Teheran und Bandar Abbas."
PER_trains_from_germany:	"Züge anfordern von [GER.GetNonIdeologyName]"
PER_trains_from_germany_desc:	"Da wir kurz vor der Eröffnung der Transiranischen Eisenbahn stehen, brauchen wir Züge, um das Projekt so schnell wie möglich zum Laufen zu bringen. Wir haben Freunde in [GER.GetNonIdeologyName], die uns sicher gerne einen Überschuss an Dampflokomotiven für unsere große Eröffnung zur Verfügung stellen werden, wenn wir sie fragen."
PER_trains_from_britain:	"Züge von [ENG.GetNonIdeologyName] anfordern"
PER_trains_from_britain_desc:	"Da wir kurz vor der Eröffnung der Transiranischen Eisenbahn stehen, benötigen wir Züge, um das Projekt so schnell wie möglich zum Laufen zu bringen. Da die [ENG.GetAdjective] über Bestände und Vorräte an unseren Rohstoffen verfügen, wäre es für beide Nationen von Vorteil, wenn sie uns Dampflokomotiven für die Eröffnung unserer neuen Eisenbahn anbieten würden."
PER_feat_of_engineering:	"Eine Meisterleistung der Technik"
PER_feat_of_engineering_desc:	"Mit der Fertigstellung der Transiranischen Eisenbahn haben wir etwas Besonderes erreicht. Nicht nur wegen ihrer enormen Ausmaße, sondern auch wegen der technischen Wunder, die erforderlich waren, um die steilen Strecken und das bergige Terrain von [ROOT.GetNonIdeologyName] zu überwinden. Wir sollten stolz auf diese technische Meisterleistung unserer Regierung und der beauftragten Ingenieure sein."
PER_feat_of_engineering_bonus:	"Fertigstellung der Trans-Iranischen Eisenbahn"
PER_white_revolution:	"Startschuss für die Weiße Revolution"
PER_white_revolution_desc:	"Die Modernisierung der [ROOT.GetNonIdeologyName] ist keine leichte Aufgabe. Vielmehr bedarf es einer beträchtlichen Anzahl aggressiver Reformen, um dieses große Ziel zu verwirklichen. Wir werden sie die Weiße Revolution oder die Revolution des Schahs und des Volkes nennen, und sie wird [PER.GetNameDef] an die Seite der großen Nationen im Westen bringen."
PER_national_bank:	"Stärken Sie die Nationalbank von [ROOT.GetNonIdeologyName]"
PER_national_bank_desc:	"Wirtschaftlich haben wir uns im Vergleich zu unseren westlichen Rivalen nicht hervorgetan. Das ist, gelinde gesagt, bedauerlich, aber wir können das ändern. Zunächst müssen wir die Nationalbank von [ROOT.GetNonIdeologyName] stärken und sie vor allem für unsere Landbevölkerung zugänglicher machen."
PER_price_stabilization:	"Preisstabilisierung"
PER_price_stabilization_desc:	"Nachdem wir die Banken gestärkt haben, müssen wir nun eine Kampagne gegen unangemessene Profitmacherei starten. Wir können die Besitzer von Fabriken und großen Handelsketten, die sich nicht daran halten, mit Geldstrafen belegen und die Preise für Waren im gesamten [ROOT.GetNonIdeologyName] festsetzen."
PER_abolish_feudalism:	"Schaffen Sie den Feudalismus ab"
PER_abolish_feudalism_desc:	"Viele Jahre lang hat [ROOT.GetNonIdeologyName] unter einem feudalen System gearbeitet, in dem Grundbesitzer den Besitz hatten, den viele Bauern in den ländlichen Regionen bearbeiteten. Dies ist ein veraltetes System, und es ist unsere Pflicht als Regierung, dieses Land von den Eigentümern zu kaufen und es zu einem viel günstigeren Preis an die Bauern zurückzuverkaufen. Dies wird einem bedeutenden Teil unserer Bevölkerung tatsächlich die Freiheit bringen."
PER_women_vote:	"Erweitern Sie das Wahlrecht auf Frauen"
PER_women_vote_desc:	"Gegenwärtig können nur Männer in unseren Regierungsangelegenheiten abstimmen. Da sie etwa die Hälfte unserer Bevölkerung ausmachen, sollten wir dafür sorgen, dass auch die Frauen unserer Nation ihre Stimme erheben können. Wir sollten jedoch vorsichtig sein, da dies bei den Geistlichen den Eindruck erwecken könnte, wir würden uns von der Tradition abwenden."
PER_food_for_all:	"Essen für alle [PER.GetAdjective]"
PER_food_for_all_desc:	"Tragischerweise sind Hungersnöte für uns keine Fremdwörter. Mit der Arbeit, die wir im Rahmen unserer Modernisierungsbemühungen zur Verbesserung der Wirtschaft geleistet haben, haben wir die Möglichkeit, unsere Nahrungsmittelverteilung zu verbessern und sicherzustellen, dass jeder [PER.GetAdjective] Zugang zu einem unserer menschlichen Grundbedürfnisse hat."
PER_rapid_industrialization:	"Rasche Industrialisierung"
PER_rapid_industrialization_desc:	"Modernisierung ist gleichbedeutend mit Industrialisierung. Wir kommen nicht an der Tatsache vorbei, dass wir unsere Fabrikproduktion rasch ausbauen müssen, wenn wir das gleiche Niveau wie die anderen großen Nationen dieser Welt erreichen wollen."
PER_tehran_power_plant:	"Eröffnen Sie ein Kraftwerk in Teheran"
PER_tehran_power_plant_desc:	"Da unsere Städte im ganzen Land wachsen, müssen wir dafür sorgen, dass sie mit ausreichend Strom versorgt werden. Lassen Sie uns ein neues Kraftwerk in der Hauptstadt Teheran eröffnen und es als einen bedeutenden nächsten Schritt in der Expansion unserer wichtigsten Stadt festigen."
PER_tehran_power_grid_bonus:	"Ausbau des Teheraner Stromnetzes"
PER_develop_cities:	"Erschließung der wichtigsten Siedlungen"
PER_develop_cities_desc:	"Zum gegenwärtigen Zeitpunkt ist die Hauptstadt Teheran die am weitesten entwickelte Stadt in [ROOT.GetNonIdeologyName]. Wenn wir unser Land wirklich modernisieren wollen, müssen wir unsere Anstrengungen auf den Ausbau der Infrastruktur unserer großen Städte konzentrieren."
PER_metropolitan_iran:	"Eine Großstadt [ROOT.GetNonIdeologyName]"
PER_metropolitan_iran_desc:	"Schließlich haben wir nach massiven Entwicklungsanstrengungen einen Punkt erreicht, an dem [ROOT.GetNonIdeologyName] als eine Metropolennation betrachtet werden kann. In unseren Städten pulsiert das Leben und die Industrie, so dass wir für die Zukunft gut gerüstet sind."
PER_develop_oil_fields:	"Erschließen Sie die Ölfelder"
PER_develop_oil_fields_desc:	"Um unseren bereits riesigen Ölförderkomplex zu erweitern, haben wir vor kurzem neue Quellen des schwarzen Goldes entdeckt, die reif zum Schürfen sind. Unsere Industrieminister sind der Meinung, dass die Errichtung neuer Ölplattformen dazu führen könnte, dass wir ein Monopol auf diese kostbare Ressource erlangen."
PER_form_oil_company:	"Unsere eigene Ölgesellschaft gründen"
PER_form_oil_company_desc:	"Zu lange wurden unsere Ölfelder von externen Kolonialmächten abgebaut und kontrolliert. Mit unseren neuen Vorräten und einer Zukunft frei von ausländischem Einfluss ist es an der Zeit, die Nationale [PER.GetAdjective] Ölgesellschaft zu gründen."
PER_establish_opec:	"OPEC gründen"
PER_establish_opec_desc:	"Da unsere Ölindustrie nun vollständig etabliert ist, ist es an der Zeit, dass wir uns nach anderen ölreichen Ländern umsehen, um zu sehen, ob wir uns unter einem Banner vereinen können, um diese strategische Ressource zu monopolisieren. Nachdem wir uns an [IRQ.GetNameDef], [SAU.GetNameDef] und [VEN.GetNameDef] gewandt hatten, wurde einstimmig beschlossen, dass wir die Organisation der Erdöl exportierenden Länder gründen würden."
PER_opec:	"OPEC"
PER_oil_baron:	"Erklären Sie sich zum Ölbaron"
PER_oil_baron_desc:	"Anstatt mit unserem Öl den Krieg zu finanzieren, den andere Nationen auf der ganzen Welt führen, wäre es besser, es für unseren eigenen Gebrauch zu sparen. Wenn wir das Öl in [ROOT.GetNonIdeologyName] horten, können wir sicherstellen, dass wir es zu einem überhöhten Preis an diejenigen verkaufen können, die es brauchen."
PER_profit_from_war:	"Profitieren Sie vom Krieg"
PER_profit_from_war_desc:	"Krieg bedeutet Geld, und mit dem aktuellen Konflikt, der auf der ganzen Welt tobt, lässt sich eine Menge Geld verdienen. Mit dem technologischen Fortschritt benötigen die kriegführenden Nationen immer mehr Öl, um ihre Kriegsmaschinerie zu versorgen. Das ist eine große Chance für uns, und wir wären dumm, wenn wir sie nicht ergreifen würden."
PER_invite_oil_nations:	"Laden Sie die ölproduzierenden Nationen ein"
PER_invite_oil_nations_desc:	"Die OPEC war bisher erfolgreich bei der Schaffung von Profiten für den globalen Ölmarkt, aber unsere Organisation hat die Mittel, um größer zu werden. Lassen Sie uns die anderen ölproduzierenden Nationen auf der ganzen Welt ansprechen und sie bitten, sich uns in der OPEC anzuschließen."
PER_deal_with_eitc:	"Schließen Sie ein Abkommen mit dem EITC"
PER_deal_with_eitc_desc:	"Unsere Nachbarn im Osten waren anscheinend sehr beschäftigt. [RAJ.GetNonIdeologyName] hat die East India Trading Company wiedergegründet und ist zu einem landesweiten Megakonzern geworden. Es wäre klug, sie in Bezug auf unser eigenes Ölmonopol auf unsere Seite zu ziehen und einen Deal mit ihnen und dem Rest der OPEC zu schließen. "
PER_restructure_army:	"Umstrukturierung der Armee"
PER_restructure_army_desc:	"Unsere Armee ist durch die endlosen Jahre des Krieges mit Russland unter dem Kommando der Qajar-Dynastie geschwächt worden. In Anbetracht der Lage, in der sich die Welt derzeit befindet, wäre es klug, wenn wir unsere Streitkräfte wieder auf Vordermann brächten."
PER_expand_imperial_guard:	"Erweitern Sie die Kaiserliche Garde"
PER_expand_imperial_guard_desc:	"Als die jüngste große Familie, die [PER.GetNameDef] regiert, benötigt das Haus Pahlavi nur das Beste, wenn es um eine königliche Garde geht. Wenn sie gut ausgerüstet und ausgebildet sind, können sie vielleicht auch an unserer Front kämpfen."
PER_expand_military_facilities:	"Militärische Einrichtungen ausbauen"
PER_expand_military_facilities_desc:	"Gegenwärtig ist unsere Fähigkeit, Waffen zu produzieren, äußerst mangelhaft. Wir sollten unsere Militäreinrichtungen so schnell wie möglich ausbauen, um sicherzustellen, dass unsere neu strukturierte Armee gut ausgerüstet und für den Kampf gerüstet ist."
PER_czech_tanks:	"Kaufen Sie tschechische Panzerlizenzen"
PER_czech_tanks_desc:	"Bevor wir über die Entwicklung und Produktion unserer eigenen mechanisierten Streitkräfte nachdenken, sollten wir uns an die Nationen wenden, die für ihre Panzerproduktion bekannt sind. Indem wir uns an [CZE.GetNameDef] wenden, können wir eine Lizenz für die Produktion von Panzern in den berühmten Skoda-Werken erwerben."
PER_german_tanks:	"Kaufen Sie deutsche Panzerlizenzen"
PER_german_tanks_desc:	"Bevor wir an die Entwicklung und Produktion unserer eigenen mechanisierten Streitkräfte denken, sollten wir uns an die Nationen wenden, die für ihre Panzerproduktion bekannt sind. Indem wir uns an [GER.GetNameDef] wenden, können wir leistungsstarke Panzer produzieren, die sich durch unsere feindlichen Linien schneiden wie ein heißes Messer durch Butter."
PER_reverse_engineer_tanks:	"Reverse-Engineering ausländischer Panzer"
PER_reverse_engineer_tanks_desc:	"Indem wir uns die Panzer, die wir produziert haben und die von ausländischen Mächten stammen, genauer ansehen, können wir lernen, wie sie funktionieren und wie wir unsere eigenen Entwürfe für den zukünftigen Gebrauch produzieren können. Dies ist der erste Schritt auf dem Weg zur [PER.GetNonIdeologyName] Entwicklung eigener Panzerkonstruktionen."
PER_establish_tehran_armor:	"Teheran Armor gründen"
PER_establish_tehran_armor_desc:	"Es ist an der Zeit, dass wir unser eigenes Panzerbauunternehmen gründen. Nachdem wir uns für den Namen Tehran Armor entschieden haben, wurde bekannt gegeben, dass das Unternehmen von der Regierung subventioniert wird, um seine Gründung zu unterstützen."
PER_expand_tehran_armor:	"Die Einrichtungen von Tehran Armor ausbauen"
PER_expand_tehran_armor_desc:	"Da Teheran Armor an der Herstellung neuer Panzer für unsere Kriegsanstrengungen arbeitet, wäre es eine kluge Entscheidung, diesen Prozess durch eine schnelle Erweiterung der Produktionsanlagen zu beschleunigen. Je mehr Fabrikhallen für die Konstruktion unserer Panzerausrüstung zur Verfügung stehen, desto schneller können wir die Panzer auf das Feld bringen."
PER_future_of_war:	"Die Zukunft des Krieges"
PER_future_of_war_desc:	"Noch vor wenigen Jahrzehnten wurden Kriege mit Mann und Pferd, spärlicher Artillerie und altmodischen Taktiken geführt. In der heutigen Zeit ist die Ära der Panzer angebrochen. Wir müssen mit den Fortschritten in der Militärtechnologie Schritt halten, wenn wir uns gegen die Kräfte behaupten wollen, die uns bedrohen."
PER_train_tank_commanders:	"Panzerkommandanten ausbilden"
PER_train_tank_commanders_desc:	"Um den größtmöglichen Nutzen aus unseren Panzerdivisionen zu ziehen, müssen sie von kompetenten Kommandeuren geführt werden. Um dies zu erreichen, müssen wir uns darauf vorbereiten, unsere militärischen Führer wieder in die Ausbildung zu schicken, damit sie lernen, wie sie den Panzerkrieg effektiv in ihr breites Spektrum an Taktiken einbinden können."
PER_military_excellency:	"[PER.GetAdjective] Militärische Exzellenz"
PER_military_excellency_desc:	"Wenn es um eine siegreiche Armee geht, wird die am besten ausgebildete Truppe den Sieg davontragen. Mit einer strengen und rigiden Ausbildung, hervorragender Ausrüstung und einer unaufhaltsamen Taktik wollen wir der Welt beweisen, dass die [PER.GetAdjective] Armee eine Kraft ist, mit der man rechnen muss."
PER_foreign_retraining:	"Initiative zur Umschulung im Ausland"
PER_foreign_retraining_desc:	"Unsere derzeitige Armee ist schlecht ausgebildet und unorganisiert. Um die Qualität unserer Streitkräfte zu verbessern, wäre es klug, in die Ausbildung unserer Truppen durch Ausländer zu investieren, die nach [PER.GetNonIdeologyName] kommen. Das sollte sie in kürzester Zeit fit für den Kampf machen."
PER_bolster_infantry:	"Verstärken Sie die Infanterie"
PER_bolster_infantry_desc:	"Der einfache Fußsoldat gilt seit Generationen als Grundpfeiler jeder bewaffneten Streitkraft, und es ist keine Position in der Armee, die wir vernachlässigen sollten. Lassen Sie uns unsere Infanterie verstärken und dafür sorgen, dass unsere Armeen gut und mit Stolz marschieren."
PER_swedish_artillery:	"Lizenz Artillerie von [SWE.GetNameDef]"
PER_swedish_artillery_desc:	"Die [SWE.GetAdjective] haben eine mächtige Artillerie entwickelt, die wir in unserer Armee gut gebrauchen könnten. Wir sollten uns mit dieser nordischen Nation in Verbindung setzen und versuchen, ein Lizenzabkommen auszuhandeln, damit wir mit der Produktion unserer eigenen Waffen beginnen können."
PER_establish_motor_arms:	"Aufbau einer Motorwaffenindustrie"
PER_establish_motor_arms_desc:	"Um unsere Infanterie zu unterstützen, sollten wir die Produktion verschiedener Fahrzeuge in Erwägung ziehen, um sicherzustellen, dass ihre Fähigkeit, sich auf dem Schlachtfeld zu bewegen, auf dem neuesten Stand und so reibungslos wie möglich ist. Indem wir eine Industrie für diese Art von Ausrüstung aufbauen, bereiten wir uns auf die zukünftige Modernisierung unserer Streitkräfte vor."
PER_motorize_infantry:	"Motorisierung der Infanterie"
PER_motorize_infantry_desc:	"Wir müssen der Zeit voraus sein, und dazu ist es unerlässlich, dass wir unsere regulären Truppen mechanisieren, damit sie an der Seite unserer Panzer über das Schlachtfeld stürmen können, geschützt und bereit, Verwüstung anzurichten."
PER_increase_heavy_arms:	"Mehr schwere Waffen"
PER_increase_heavy_arms_desc:	"Mit der Vergrößerung unserer Streitkräfte wächst auch unser Bedarf an ausgedehnten Anlagen, um einige unserer schwereren Maschinen zu produzieren. Dies wird uns auch die Möglichkeit geben, unsere eigene Artillerie zu entwickeln, so dass wir nicht mehr auf ausländische Mächte angewiesen sind, um unsere Truppen zu unterstützen. Außerdem können wir so unsere Schlachtpläne an eine auf Artillerie ausgerichtete Front anpassen."
PER_our_own_artillery:	"Bau unserer eigenen Artillerie"
PER_our_own_artillery_desc:	"Wir verfügen nun über die notwendigen Einrichtungen, um unsere eigene Artillerie zu entwickeln und zu bauen. Jetzt sind wir nicht mehr auf den Handel angewiesen, um unsere Streitkräfte zu verstärken. Unsere neuen Kanonen lassen Feuer auf unsere Feinde regnen und sorgen dafür, dass wir in jedem Konflikt die Stellung halten können."
PER_develop_qorkhaneh:	"Qorkhaneh entwickeln"
PER_develop_qorkhaneh_desc:	"Die Qorkhaneh war unsere wichtigste Quelle für die Produktion von Waffen und Munition in Teheran. Es würde sich lohnen, Ressourcen in die Entwicklung des Qorkhaneh-Waffenlagers zu investieren, um sicherzustellen, dass unsere Ausrüstungsproduktion für jeden potenziellen Konflikt in Topform bleibt."
PER_desert_training:	"Spezialisiertes Wüstentraining"
PER_desert_training_desc:	"Unser wunderschönes Land [PER.GetNonIdeologyName] hat ein vielfältiges und abwechslungsreiches Ökosystem, aber ein großer Teil unseres Landes besteht aus Wüstenebenen. Ein solch schwieriges Terrain erfordert eine gewisse Rücksichtnahme auf die Arbeitsweise unseres Militärs, und deshalb sollten wir unsere Ausbildung auf das Überleben und Durchqueren von Wüstenlandschaften spezialisieren."
PER_every_man_serves:	"Jeder Mann, der dienen kann"
PER_every_man_serves_desc:	"Quantität statt Qualität wird die Zukunft unseres Militärs sein. Wir haben eine so breite Bevölkerung, und in Zeiten wie diesen sollte jeder Mann, der Waffen tragen kann, seine Bürgerpflicht wahrnehmen, um [PER.GetNameDef] vor fremden Eindringlingen zu verteidigen. Wir werden zwar auf eine spezialisierte Ausbildung verzichten müssen, aber hoffentlich können wir den Feind zahlenmäßig überwältigen."
PER_special_units:	"Iranische Spezialoperationen"
PER_special_units_desc:	"Da unsere militärischen Fähigkeiten wachsen, ist es wichtig, dass wir zusätzlich zu unseren regulären Truppen auch unsere Spezialeinheiten berücksichtigen. Damit werden sich viele neue Möglichkeiten ergeben, darunter Geheimdienstoperationen, Spezialeinheiten und sogar experimentelle Waffen."
PER_form_savak:	"Bilden Sie SAVAK"
PER_form_savak_desc:	"Die Spionage erweist sich als ein entscheidendes Element der Kriegsanstrengungen. Um mit den nachrichtendienstlichen Bemühungen unseres Gegners Schritt halten zu können, sollten wir eine eigene Organisation gründen, die sich um alle unsere Spione und Spionageoperationen kümmert. Auch intern sollte dies dazu beitragen, unsere Regierung zu stärken und diejenigen im Auge zu behalten, die versuchen, sie zu stürzen."
PER_transfer_officers_to_intelligence:	"Versetzung von Offizieren in den Geheimdienst"
PER_transfer_officers_to_intelligence_desc:	"Um die Arbeit unseres Geheimdienstes zu stärken, müssen wir einige unserer intellektuelleren Militäroffiziere in die Geheimdienstabteilung versetzen."
PER_fund_state_intelligence:	"Staatliche Nachrichtendienste finanzieren"
PER_fund_state_intelligence_desc:	"Wenn wir mehr Geld in unser staatliches Nachrichtendienstprogramm stecken, sollten wir in der Lage sein, potenzielle Revolten und Rebellionen in unserem Land genauer im Auge zu behalten. Indem wir diese im Keim ersticken, können wir weiterhin die Sicherheit unseres Landes gewährleisten."
PER_special_forces_program:	"Programm für Spezialeinheiten"
PER_special_forces_program_desc:	"Es gibt Orte, an die unsere regulären Streitkräfte nicht vordringen können, und um hier Abhilfe zu schaffen, ist die Schaffung eines Programms für Spezialkräfte von größter Bedeutung. Bald werden wir über spezialisierte Truppen verfügen, die in der Lage sind, jede noch so schwierige Aufgabe zu bewältigen."
PER_recruit_bakhtiari:	"Rekrutieren Sie Bakhtiari Gebirgsspezialisten"
PER_recruit_bakhtiari_desc:	"Die Bachtiari sind ein Lur-Stamm aus dem Osten [PER.GetNonIdeologyName]. Während viele im Westen des Landes über ihren Einfluss besorgt sind, können wir ihren nomadischen Lebensstil in unseren Streitkräften gut gebrauchen. Indem wir Mitglieder ihrer Stämme rekrutieren, können wir unseren Bergsteigertruppen einen erheblichen Vorteil gegenüber unseren Feinden verschaffen."
PER_expand_unique_unit:	"Erweitern Sie die Unsterbliche Legion"
PER_expand_unique_unit_desc:	"Nachdem wir die Legion der Unsterblichen als Teil unseres kaiserlichen Erbes gegründet haben, können wir nun Ressourcen in den Ausbau dieser prestigeträchtigen Legion stecken und es vielen weiteren Männern ermöglichen, Schulter an Schulter das Gewicht des [PER.GetAdjective] Imperiums zu tragen!"
PER_import_rocketry:	"Importieren Sie Raketendesigns"
PER_import_rocketry_desc:	"Die Kriegsführung entwickelt sich in einem unglaublich schnellen Tempo. Wenn andere Nationen beginnen, Raketentechnologie für den Einsatz auf dem Schlachtfeld zu entwickeln, sollten wir uns bemühen, mit diesen Entwicklungen Schritt zu halten, indem wir die Entwürfe importieren, die wir zur Herstellung unserer eigenen Wunderwaffen benötigen."
PER_cyrus_initiative:	"Die Cyrus-Initiative"
PER_cyrus_initiative_desc:	"Die Cyrus-Initiative ist unser neuestes, streng geheimes Projekt zur Entwicklung beeindruckender, zerstörerischer Waffen, die wir auf dem Schlachtfeld einsetzen können, um unsere Feinde vollständig zu vernichten. Unsere Wissenschaftler haben bereits einige interessante Entwürfe ausgearbeitet, an die keine andere Nation gedacht zu haben scheint, so dass wir in der Lage sind, unsere Gegner in Kriegszeiten zu überraschen."
PER_modern_cataphract:	"Ein moderner Kataphrakt"
PER_modern_cataphract_desc:	"Der Kataphrakt war eine Form der gepanzerten schweren Kavallerie, die in unseren Ländern in der Antike ihren Ursprung hatte. Sowohl das achämenidische als auch das sassanidische Reich setzten diese mächtigen Pferde auf dem Schlachtfeld ein. Mit ihnen als Inspiration sollten wir in der Lage sein, ein motorisiertes Ungetüm zu erschaffen, das unsere Geschichte der Kavalleriekriegsführung verehren wird."
PER_war_elephant:	"Der Kriegselefant"
PER_war_elephant_desc:	"Obwohl im alten persischen Reich nicht so weit verbreitet, waren wir dafür bekannt, dass wir bei unseren alten Eroberungen eine kleine Gruppe von Kriegselefanten eingesetzt haben. Unsere Wissenschaftler haben eine Idee für einen sehr schweren Panzer entwickelt, der von der Form eines indischen Elefanten inspiriert wurde und unsere Feinde sicherlich genauso in Angst und Schrecken versetzen wird, wie sie es vor Tausenden von Jahren getan haben."
PER_negotiate_with_america:	"Mit Amerika verhandeln"
PER_negotiate_with_america_desc:	"[USA.GetNameDefCap] hat sich als weltweit führend in der Entwicklung von Atomtechnologie erwiesen; Innovationen, die sich als entscheidend erweisen könnten, um in unserem Kampf, auf der Weltbühne relevant zu bleiben, an der Spitze zu bleiben. Wir sollten einen diplomatischen Gesandten entsenden, um sie um Hilfe bei der Entwicklung unseres eigenen Atomprogramms zu bitten."
PER_establish_nuclear_program:	"Bauen Sie das [PER.GetAdjective] Nuklearprogramm auf"
PER_establish_nuclear_program_desc:	"Die Geheimnisse des Atoms werden von [GER.GetNameDef] und [USA.GetNameDef] schon seit geraumer Zeit erforscht und erforscht. Nachdem wir Notizen und Forschungsunterlagen von unseren [USA.GetAdjective] Freunden erhalten haben, haben sie uns offiziell beim Aufbau unseres eigenen Atomprogramms unterstützt."
PER_establish_airforce:	"Die Luftwaffe gründen"
PER_establish_airforce_desc:	"Die kaiserliche [PER.Adjective] Luftwaffe wurde offiziell 1920 von Reza Shah Pahlavi gegründet. Doch jetzt, da die Welt von Krieg bedroht ist, sollten wir die Fähigkeit unserer Nation, an Schlachten am Himmel teilzunehmen, festigen, und sei es nur, um die Sicherheit von [PER.GetNameDef] für die kommenden Jahrzehnte zu gewährleisten."
PER_pilot_training:	"Ausbildungsprogramm für Piloten"
PER_pilot_training_desc:	"Piloten brauchen mehr als nur rohes Talent, um ein Kampfflugzeug fliegen zu können. Ein gründliches Trainingsprogramm für diejenigen, die bereit sind, ihr Leben für [PER.GetNameDef] aufs Spiel zu setzen, wird entscheidend sein, um ihre Sicherheit und Effektivität am Himmel zu gewährleisten."
PER_raf_planes:	"RAF-Flugzeuge kaufen"
PER_raf_planes_desc:	"[ENG.GetNameDefCap] hat die Royal Air Force, und ihr Talent und ihre Fähigkeiten sind in den meisten Nationen wohlbekannt. Aber es ist nicht nur das Können ihrer Piloten, sondern auch die Qualität ihrer Flugzeuge, die ihnen hilft, Schlachten zu gewinnen. Lassen Sie uns ihnen die Hand reichen und ihre Flugzeuge bestellen."
PER_luftwaffe_planes:	"Flugzeuge der Luftwaffe kaufen"
PER_luftwaffe_planes_desc:	"Wenn es um außergewöhnliche Flugzeuge geht, ist die Luftwaffe von [GER.GetNameDef] eine der besten. Da wir bereits enge Beziehungen zu [GET.GetNameDef] unterhalten, ist es sinnvoll, dass wir auf sie zugehen und überzählige Flugzeuge kaufen, die sie nicht mehr benötigen."
PER_own_plane_designs:	"Entwickeln Sie unsere eigenen Designs"
PER_own_plane_designs_desc:	"Nachdem wir Ressourcen in den Kauf ausländischer Flugzeuge gesteckt haben, ist es vielleicht an der Zeit, dass wir unsere Ingenieure damit beauftragen, unsere eigenen Flugzeugdesigns für die Luftwaffe zu entwickeln."
PER_establish_air_academy:	"Richten Sie die Luftakademie ein"
PER_establish_air_academy_desc:	"Wir haben bereits eine rudimentäre Pilotenausbildung geschaffen, um Mitglied der Luftwaffe zu werden, aber wir brauchen eine spezialisiertere Ausbildung, wenn wir wirklich die Kontrolle über den Himmel haben wollen. Die Einrichtung einer offiziellen Luftakademie in Teheran wird diesen Prozess beschleunigen und sicherstellen, dass unsere Piloten gut ausgebildet sind."
PER_legacy_of_gilani:	"Das Vermächtnis von Ozra Gilani"
PER_legacy_of_gilani_desc:	"Ozra Gilani war die erste Frau in der kaiserlichen [PER.GetAdjective] Luftwaffe und hat damit einen Präzedenzfall für eine Zukunft geschaffen, in der wir unsere Streitkräfte stärker einbeziehen. Wir sollten darauf hinarbeiten, die Rolle der Frauen in Bezug auf unser Militär zu definieren und ihnen zu erlauben, als Pilotinnen zu fliegen. Auch sie sollten das Recht haben, ihrem Land gut zu dienen."
PER_strategic_bombing:	"Strategische Bombardierung"
PER_strategic_bombing_desc:	"Kriege werden nicht nur in der Luft gewonnen, sondern auch durch die Zerschlagung der wirtschaftlichen und industriellen Kapazitäten des Gegners. Konzentrieren wir uns auf die strategische Bombardierung und zerstören wir ihre Einrichtungen, bevor sie sie gegen uns einsetzen können."
PER_battlefield_support:	"Unterstützung auf dem Schlachtfeld"
PER_battlefield_support_desc:	"Um die Sicherheit unserer Truppen auf dem Weg zur Front zu gewährleisten, müssen wir unbedingt unsere Bodenunterstützungsflugzeuge einsetzen, um zu verhindern, dass feindliche Flugzeuge unsere Armee unter Beschuss nehmen."
PER_air_superiority:	"Luftüberlegenheit"
PER_air_superiority_desc:	"Der wichtigste Einsatz unserer Luftwaffe besteht darin, die Kontrolle über den Himmel zu erlangen. Wenn wir die Luftüberlegenheit haben, können wir gefährlichere Operationen durchführen, ohne befürchten zu müssen, abgefangen zu werden."
PER_perfect_iranian_airforce:	"Perfektionieren Sie die [PER.GetAdjective] Luftwaffe"
PER_perfect_iranian_airforce_desc:	"Bei all den Ressourcen und der Zeit, die wir in die Entwicklung unserer Luftstreitkräfte gesteckt haben, ist es höchste Zeit, dass wir nach ganz oben streben und uns als eine der effizientesten Luftstreitkräfte der Welt bezeichnen. Nichts kann die Fähigkeiten und das Talent unserer Piloten oder die Exzellenz unserer Flugzeuge übertreffen."
PER_construct_air_bases:	"Luftwaffenstützpunkte errichten"
PER_construct_air_bases_desc:	"Unsere Flugzeuge brauchen einen Startplatz, wenn sie ihre Missionen effizient erfüllen sollen. Deshalb ist es wichtig, dass wir Zeit darauf verwenden, neue Luftwaffenstützpunkte rund um [PER.GetNonIdeologyName] zu errichten und die Kapazität unserer Luftwaffe zu erweitern."
PER_construct_air_defenses:	"Luftverteidigung einrichten"
PER_construct_air_defenses_desc:	"Wir müssen mehr Flugabwehrkanonen entlang der Grenzen installieren, um unsere vorrückenden Truppen vor feindlichen Flugzeugen zu schützen."
PER_anti_air_development:	"Entwicklung der Luftabwehr finanzieren"
PER_anti_air_development_desc:	"Die Fabriken unserer Städte sind zu Zielen feindlicher Bomber geworden, weil diese unsere wirtschaftlichen und industriellen Fortschritte stören wollen. Wir sollten unsere Ressourcen in die Entwicklung unserer Luftabwehrmaßnahmen stecken."
PER_anti_air_research:	"Forschungsinitiative zur Luftabwehr"
PER_anti_air_research_desc:	"Unsere derzeitigen Luftabwehrwaffen sind allmählich nicht mehr zeitgemäß. Wir sollten uns mehr um die Erforschung neuer Technologien bemühen, die unsere Nation vor Gefahren aus der Luft schützen können."
PER_establish_the_navy:	"Die Marine gründen"
PER_establish_the_navy_desc:	"Wie die Luftwaffe wurde auch die Kaiserliche [PER_GetAdjective] Marine von Reza Shah Pahlavi nach seinem Staatsstreich gegen die alte Qajar-Dynastie gegründet. Seitdem haben wir festgestellt, dass wir das, was bereits geschaffen wurde, verstärken und sicherstellen müssen, dass wir die Meere, die an unseren nördlichen und südlichen Grenzen liegen, besser kontrollieren können."
PER_officers_to_italy:	"Schicken Sie Offiziere zur Ausbildung nach Italien"
PER_officers_to_italy_desc:	"[ITA.GetNameDefCap] ist der Ort, an dem wir zuerst einige der Schiffe erhalten haben, die heute in unseren Werften liegen, und so haben wir natürlich eine Verbindung, wenn es um die Entwicklung der Marine geht. Wir sollten uns an die [ITA.GetAdjective] Regierung wenden und darum bitten, unsere Offiziere zur Marineausbildung dorthin zu schicken."
PER_persian_gulf_fleet:	"Flotte im Persischen Golf"
PER_persian_gulf_fleet_desc:	"Der Persische Golf ist unser einziger Zugang zum Rest der Welt auf dem Seeweg und muss daher um jeden Preis geschützt werden. Wenn wir unsere Ausbildung speziell auf unsere Aktivitäten im Golf ausrichten, können wir sicherstellen, dass Eindringlinge aus dem Süden es schwer haben werden, auf dem Seeweg zu landen."
PER_construct_naval_bases:	"Neue Marinestützpunkte errichten"
PER_construct_naval_bases_desc:	"Unsere derzeitige Marinekapazität ist geringer, als wir es uns wünschen. Um diese zu erhöhen, müssen wir entlang unserer beiden Küsten mehr Werften errichten, die für die Stationierung von Kriegsschiffen geeignet sind."
PER_bolster_the_caspian:	"Das Kaspische Meer verstärken"
PER_bolster_the_caspian_desc:	"Das Kaspische Meer liegt zwar nur im Landesinneren, aber es würde [SOV.GetNameDef] eine weitere Möglichkeit bieten, in unser Territorium einzudringen, sollten sie sich für eine Invasion entscheiden. Manche mögen sagen, dass die Verteidigung dieses Meeres unbegründet ist, aber wir können nie zu sicher vor unseren Nachbarn im Norden sein."
PER_coastal_defense_initiative:	"Initiative zur Küstenverteidigung"
PER_coastal_defense_initiative_desc:	"Auch wenn wir einen schlechten Zugang zu den Weltmeeren haben, ist eine Invasion auf dem Seeweg immer noch eine reale Möglichkeit. Um den Schutz der Küsten von [PER.GetNonIdeologyName] zu gewährleisten, müssen wir eine Initiative zum Ausbau der Verteidigungsanlagen an den Küsten des Persischen Golfs und des Kaspischen Meeres starten."
PER_purchase_foreign_ships:	"Kauf von ausländischen Schiffen"
PER_purchase_foreign_ships_desc:	"Unsere Marine wurde vor einigen Jahren durch den Kauf neuer, bewaffneter Schiffe von [ITA.GetNameDef] gebildet. Wir können unsere Marinefähigkeiten verstärken, indem wir anderen ausländischen Mächten die Hand reichen und weitere Schiffe kaufen. Dies wird auch die Beziehungen zwischen den Nationen verbessern."
PER_found_iranian_shipyards:	"Iranische Werften gründen"
PER_found_iranian_shipyards_desc:	"Der Kauf von Schiffen anderer Nationen hat zwar bisher ausgereicht, aber wenn wir mit dem Seewettrüsten in der Region mithalten wollen, müssen wir in den Bau unserer eigenen Anlagen investieren. Dies können wir erreichen, indem wir ein Unternehmen gründen, das sich hauptsächlich auf den Bau von Schiffen für unsere Kriegsanstrengungen konzentriert - die iranischen Werften."
PER_expand_dockyards:	"Werftanlagen ausbauen"
PER_expand_dockyards_desc:	"Wenn unsere Marine wächst, müssen wir auch unsere Marine-Infrastruktur entsprechend ausbauen. Nur so können wir sicherstellen, dass die Kontrolle über unsere Küsten fest in unserer Hand bleibt."
PER_merchant_navy:	"Die Handelsmarine"
PER_merchant_navy_desc:	"Der Transport von Ressourcen auf dem Seeweg ist für das Überleben von [PER.GetNameDef] lebenswichtig. Daher ist es von größter Bedeutung, dass wir eine professionelle Handelsmarine aufbauen, die unser Militär unterstützen kann."
PER_expert_raiders:	"Erfahrene Raider"
PER_expert_raiders_desc:	"Obwohl es wichtig ist, unseren eigenen Seehandel zu schützen, ist es in Kriegszeiten entscheidend, die Nachschublinien unseres Feindes aktiv aufzuspüren und zu unterbrechen, um die Funktionsfähigkeit seiner Wirtschaft zu zerstören. Wir sollten uns darauf konzentrieren, unsere Seestreitkräfte einzusetzen, um feindliche Konvois zu überfallen."
PER_the_pahlavi_imperium:	"Das Pahlavi Imperium"
PER_the_pahlavi_imperium_desc:	"Seit er 1925 die Qajar-Dynastie stürzte, war Reza Shah Pahlavi die führende Kraft für [PER.GetNameDef]. Da unser Land am Scheideweg eines weiteren großen Weltkonflikts steht, muss der große Schah darauf vorbereitet sein, jedem Sturm zu begegnen, der durch unser glorreiches [PER.GetAdjective] Land zu fegen droht."
PER_forced_secularization:	"Erzwungene Säkularisierung"
PER_forced_secularization_desc:	"Seit Reza Shah Pahlavi an die Macht gekommen ist, hat es in [PER.GetNameDef] einen ständigen Widerstand gegen den Klerus gegeben. Der Islam ist nach wie vor unsere Staatsreligion, doch um der westlichen Welt zu beweisen, dass wir in der Lage sind, unter ihnen zu bestehen, ist es an der Zeit, Religion und Staat zu trennen und einen Weg der Modernisierung einzuschlagen."
PER_legacy_of_greatness:	"Ein Erbe der Größe"
PER_legacy_of_greatness_desc:	"Es ist für ihre Anhänger keine Überraschung, dass die Pahlavi-Dynastie dazu bestimmt ist, Generationen zu überdauern. Obwohl turbulente Zeiten bevorstehen, ist es klar, dass der Schah und sein Sohn sich anschicken, [PER.GetNameDef] in ein goldenes Zeitalter des Wohlstands zu führen."
PER_imperial_funded_universities:	"Vom Kaiser finanzierte Universitäten"
PER_imperial_funded_universities_desc:	"Um zu beweisen, dass [PER.GetNameDef] in der Lage ist, zu den großen Giganten dieser Welt zu gehören, hat der Schah einen großen Batzen Geld für die Finanzierung der Universitäten des Landes gespendet. Mit dieser großzügigen Spende wird unser Volk einen besseren Zugang zu einer hochwertigen Hochschulbildung erhalten."
PER_the_unification_initiative:	"Die Initiative zur Wiedervereinigung"
PER_the_unification_initiative_desc:	"[PER.GetNameDefCap] kämpft nun schon seit einigen Jahren, insbesondere wenn es darum geht, die Bevölkerung unter einem Banner zu vereinen. Angesichts der kurdischen und aserbaidschanischen Dissidenz, die im Westen für Probleme sorgt, und des Widerstandes des Klerus gegen religiöse Reformen haben wir viel Arbeit vor uns, wenn wir [PER.GetNameDef] ein für alle Mal vereinen wollen."
PER_clamp_kurdish_dissidence:	"Hartes Durchgreifen gegen kurdische Dissidenz"
PER_clamp_kurdish_dissidence_desc:	"[PER.GetNameDefCap] umfasst einige Gebiete, die einst zum kurdischen Volk gehörten. Daher gibt es eine bedeutende Diaspora von Menschen, die mit unserer Herrschaft unzufrieden sind. Es ist höchste Zeit, dass wir diesen rebellischen Zellen das Handwerk legen und dafür sorgen, dass Stabilität und Wohlstand in die Region zurückkehren."
PER_clamp_azerbaijani_dissidence:	"Hartes Durchgreifen gegen aserbaidschanische Dissidenten"
PER_clamp_azerbaijani_dissidence_desc:	"Im Norden unseres Landes lebt eine bedeutende Anzahl von Aserbaidschanern, die [PER.GetNameDef] ihre Heimat nennen. Es gibt jedoch eine beträchtliche Anzahl von Menschen, die mit unserer Herrschaft unzufrieden sind. Es ist höchste Zeit, diesen rebellischen Zellen Einhalt zu gebieten und dafür zu sorgen, dass Stabilität und Wohlstand in die Region zurückkehren können."
PER_venerate_islam:	"Den Islam verehren"
PER_venerate_islam_desc:	"Der Islam ist ein grundlegender Bestandteil unserer Gesellschaft, seit das Alte Reich während der muslimischen Eroberung Persiens fast vollständig zerschlagen wurde. Seitdem spielt er eine wichtige Rolle im täglichen Leben der meisten unserer Bürger. Anstatt sich gegen den Klerus zu wehren, ist es vielleicht an der Zeit, dass wir unsere Religion verehren und der Welt zeigen, wie sehr wir uns dem Islam verpflichtet fühlen."
PER_state_atheism:	"Vollständige Säkularisierung"
PER_state_atheism_desc:	"In einem modernen [PER.GetNameDef] haben wir es nicht mehr nötig, dass die Religion eine so große Rolle spielt wie früher. Anstatt sie in unser tägliches Leben zu integrieren, sollten wir eine Form von Atheismus in unserer Bevölkerung fördern, damit wir uns auf unsere Modernisierungsinitiativen konzentrieren können. Das wird allerdings unseren ständigen Klerus verärgern."
PER_revive_old_ways:	"Die alten Sitten wiederbeleben"
PER_revive_old_ways_desc:	"Wenn wir auf der Weltbühne bestehen wollen, müssen wir die Ideale der früheren persischen Reiche weiter hochhalten. Daher sollten wir uns bemühen, den Zoroastrismus als Staatsreligion für [PER.GetNameDef] wieder einzuführen. Einige der kleineren Stämme, die den Osten des Landes durchstreifen, praktizieren diese Religion noch immer, so dass es nicht außerhalb des Bereichs des Möglichen liegt, diese alte Theologie wiederzubeleben."
PER_imperial_expansionism:	"Imperialer Expansionismus"
PER_imperial_expansionism_desc:	"Es ist an der Zeit, dass wir damit beginnen, unser neues Imperium über unsere derzeitigen Grenzen hinaus auszudehnen. Wir müssen unsere Kriegsmaschinerie bereit machen, unsere Bevölkerung auffordern, ihre Pflicht zu tun und uns darauf vorbereiten, der Welt zu zeigen, dass das [PER.GetAdjective] Imperium bereit ist, das einzufordern, was rechtmäßig uns gehört."
PER_tehran_moscow_pact:	"Der Teheran-Moskau-Pakt"
PER_tehran_moscow_pact_desc:	"Es ist kein Geheimnis, dass [SOV.GetNameDef] wie ein riesiger Bär im Norden über uns steht. Wenn wir unsere expansionistischen Ideale verwirklichen wollen, müssen wir dieses Problem schleunigst lösen. Wir können so schnell wie möglich einen diplomatischen Gesandten nach Moskau schicken, in der Hoffnung, dass die [SOV.GetAdjective] einem Nichtangriffspakt wohlwollend gegenüberstehen werden."
PER_establish_special_unit:	"Errichten Sie die Unsterbliche Legion"
PER_establish_special_unit_desc:	"Die Unsterblichen waren einige der kultigsten Truppen, die die alten persischen Reiche aufgestellt haben. Da wir ein neues Zeitalter imperialer Größe einläuten, ist es an der Zeit, die Unsterblichen als eine Legion von Eliteschocktruppen wieder ins Leben zu rufen."
PER_demand_iraqi_territory:	"Verlangen Sie irakisches Territorium"
PER_demand_iraqi_territory_desc:	"Die nördlichen Territorien von [IRQ.GetNameDef] wären ein ausgezeichnetes Standbein, um den Menschen dieser Region zu zeigen, dass [PER.GetNameDef] beabsichtigt, als einziges Machtzentrum zu bestehen. Dies wird einer unserer Ausgangspunkte für unseren großen Eroberungsfeldzug sein."
PER_demand_afghan_territory:	"Fordern Sie afghanisches Territorium"
PER_demand_afghan_territory_desc:	"[AFG.GetNameDefCap] ist ein Land mit verschlungenen Bergen und Flüssen und wird daher in Zukunft nur schwer zu erobern sein. Wenn wir in dem Land Fuß fassen können, wird es ein hervorragender Stützpunkt sein, um weiter in Richtung Kabul vorzustoßen."
PER_currently_doing_war_plan:	" Wir arbeiten derzeit an einem Kriegsplan§!."
PER_war_plan_darius:	"Kriegsplan Dareios"
PER_war_plan_darius_desc:	"Dareios der Große war ein achämenidischer Herrscher, der Persien als König der Könige in unserer alten Geschichte diente. Er beherrschte Persien auf dem Höhepunkt seines Territoriums, das bis ins Industal reichte. Als solcher wird er nun als Namensgeber für unsere Pläne dienen, auf den indischen Subkontinent vorzustoßen und die [ENG.GetAdjective] aus diesem Land zu vertreiben."
PER_foothold_in_indus:	"Ein Standbein am Indus"
PER_foothold_in_indus_desc:	"[RAJ.GetNameDefCap] ist das leuchtende Beispiel für [ENG.GetNameDef]s Kolonialmacht. Aber die [ENG.GetAdjective] gehören nicht hierher, und es würde ihnen gut tun, zu lernen, dass dies [PER.GetNameDef]s Geburtsrecht ist, gemäß dem Wort von Darius dem Großen. Beginnen Sie die Verhandlungen und sichern Sie unseren Fuß in Indien."
PER_usurp_afghanistan:	"Usurpieren Sie [AFG.GetNameDef]"
PER_usurp_afghanistan_desc:	"Es ist an der Zeit, dass wir Kabul endlich unter [PER.GetAdjective] Kontrolle bringen. Drängen Sie unsere Streitkräfte tief in die Berge von [AFG.GetNonIdeologyName] und kehren Sie erst zurück, wenn unsere Flagge auf den Markisen des Tajbeg-Palastes weht."
PER_invasion_of_india:	"Invasion auf dem indischen Subkontinent"
PER_invasion_of_india_desc:	"Unsere Pläne, in [RAJ.GetNameDef] einzumarschieren, haben das Potenzial, eines unserer bisher größten Ziele zu werden, aber unsere Truppen haben keinen Zweifel daran, dass dies eine gefährliche Operation sein wird. Wenn wir Indien bedrohen, werden wir den Zorn des [ENG.GetAdjective] auf uns ziehen. Wenn das keine Konsequenzen hat, dann lassen Sie uns mit der Invasion Indiens fortfahren."
PER_glory_of_cyrus:	"Der Ruhm von Cyrus dem Großen"
PER_glory_of_cyrus_desc:	"Nachdem wir unsere Kriegsziele erreicht und das Land sicher unter [PER.GetAdjective] Souveränität gebracht haben, haben wir durch die harte Arbeit und die Tapferkeit unserer Streitkräfte eine neue Ära des Wohlstands für [PER.GetNameDef] eingeleitet. Endlich kann [PER.GetNameDef] dem Ruhm des Gründers unserer Zivilisation, Kyros dem Großen, wieder gerecht werden. Ruhm für Cyrus! Ruhm für den Schah!"
PER_war_plan_xerxes:	"Kriegsplan Xerxes"
PER_war_plan_xerxes_desc:	"Xerxes war der vierte König der Könige des Achämenidenreichs und sowohl mit Darius als auch mit Kyros dem Großen verwandt. Da Xerxes vor allem für seine Invasion Griechenlands im Jahr 480 v. Chr. bekannt ist, haben wir beschlossen, unsere Pläne zur Invasion der Länder westlich von [PER.GetNameDef] nach ihm zu benennen. Wir werden uns endlich für unsere Niederlage gegen die Hellenen revanchieren."
PER_reclaim_turkish_peninsula:	"Die türkische Halbinsel zurückerobern"
PER_reclaim_turkish_peninsula_desc:	"[TUR.GetNameDefCap] ist ein Hindernis, das unserer Expansion nach Westen im Wege steht. Anatolien war einst persisches Land, und es ist an der Zeit, dass wir es zurückerobern. Bringen Sie unsere Truppen in Stellung und bereiten Sie sich auf eine Invasion vor!"
PER_reintegrate_anatolia:	"Anatolisches Territorium wieder eingliedern"
PER_reintegrate_anatolia_desc:	"Nachdem wir nun Land innerhalb der ehemaligen Grenzen von [TUR.GetNameDef] erobert haben, können wir nun damit beginnen, dieses Gebiet als offizielles, de jure Land in [PER.GetNameDef] zu integrieren."
PER_clash_of_titans:	"Kampf der Titanen"
PER_clash_of_titans_desc:	"Ein unvorhergesehenes Problem hat sich in Form der Wiedergeburt von [GRE.GetNameDef] ergeben. Wir können nicht zulassen, dass ein weiteres Imperium wie dieses an unseren Grenzen an Macht gewinnt. Wir müssen sofort den Krieg erklären und dieses Land für den Ruhm des Schahs sichern!"
PER_absorb_byzantines:	"Absorbieren Sie das Byzantinische Reich"
PER_absorb_byzantines_desc:	"Wir haben endlich einen jahrhundertealten Groll gegen die [GRE.GetAdjective]s beigelegt, indem wir [GRE.GetNameDef] niedergeschlagen haben. Dieses Gebiet kann nun in den Schoß des Schahs aufgenommen werden und als offizieller Teil unseres Reiches gelten."
PER_war_plan_cambyses:	"Kriegsplan Kambyses"
PER_war_plan_cambyses_desc:	"Als direkter Nachfolger von Kyros dem Großen war Kambyses II. der zweite König der Könige des Achämenidenreiches. Da seine Herrschaft von Eroberungen in Nordafrika und Ägypten geprägt war, wurden unsere Kampagnen in dieser Region zu Ehren seines Ruhmes nach ihm benannt."
PER_path_through_iraq:	"Schlagen Sie einen Weg durch den Irak ein"
PER_path_through_iraq_desc:	"[IRQ.GetNameDefCap] ist unser Tor zur Eroberung Nordafrikas und muss daher als erstes fallen. Da Bagdad so nah an unseren Grenzen liegt, sollte es uns nicht schwer fallen, in das Land vorzudringen und unseren Anspruch auf ihr Land zu erheben."
PER_demand_west_asia:	"Sichern Sie Französisch-Westasien"
PER_demand_west_asia_desc:	"Die [FRA.GetAdjective] sind unrechtmäßige Eindringlinge in diese Länder und müssen vertrieben werden, wenn wir unsere eigene imperiale Agenda sichern wollen. Die Territorien von [SYR.GetNameDef] und [LEB.GetNameDef] müssen eingenommen werden, wenn wir den [ENG.GetAdjective] in Nordafrika entgegentreten wollen..."
PER_march_to_nile:	"Der lange Marsch zum Nil"
PER_march_to_nile_desc:	"Um die ehemaligen persischen Gebiete in Nordafrika zurückzuerobern, müssen wir durch [ENG.GetAdjective] Nordafrika vordringen, bevor wir schließlich in Ägypten einmarschieren. Dies wird uns zweifellos in einen Krieg mit [ENG.GetNameDef] führen, aber es ist ein Risiko, das wir eingehen müssen, wenn wir uns als dominierende imperiale Macht in der Region behaupten wollen."
PER_the_memphis_initiative:	"Die Memphis-Initiative"
PER_the_memphis_initiative_desc:	"Die Integration von Gebieten in unser Imperium ist von entscheidender Bedeutung, wenn wir die Kontrolle über unsere eroberten Territorien behalten wollen. Vor allem Ägypten wird nur schwer unter Kontrolle zu halten sein, wenn wir nicht aufpassen, und deshalb sollten wir diesem Land besondere Aufmerksamkeit schenken."
PER_assassinate_reza_shah:	"Die Ermordung von Reza Schah"
PER_assassinate_reza_shah_desc:	"Reza Shah Pahlavi mag große Veränderungen in [PER.GetNameDef] vorgenommen haben, aber nicht alle davon sind beim Volk beliebt. Seit Jahren kursieren Gerüchte über ein Attentat, aber niemand will es wirklich wagen... oder doch?"
PER_root_out_conspiracies:	"Die Verschwörungen ausrotten"
PER_root_out_conspiracies_desc:	"Im Laufe der Jahre gab es viele Gerüchte über mögliche Attentatspläne gegen Reza Shah Pahlavi. Wir halten dieses Risiko für zu groß und deshalb ist es von größter Wichtigkeit, dass wir diese Verschwörungen aufdecken, um die Sicherheit des Schahs zu gewährleisten."
PER_his_fathers_footsteps:	"In den Fußstapfen seines Vaters"
PER_his_fathers_footsteps_desc:	"Nach dem tragischen Tod von Reza Schah Pahlavi hat sein Sohn, Mohammed Reza Pahlavi, das Amt des Staatsoberhauptes von [PER.GetNameDef] übernommen. Obwohl er ein junger König ist, der nicht regieren wollte, muss er in die Fußstapfen seines Vaters treten und [PER.GetNameDef] zu Ruhm verhelfen."
PER_third_persian_empire:	"Das dritte persische Reich"
PER_third_persian_empire_desc:	"Um die Zukunft unseres Volkes zu sichern, hat Mohammed Reza Pahlavi die Bildung des Dritten Persischen Reiches angekündigt, das die Geschichte unserer alten Vorgänger - der Achämeniden - nachahmen und respektieren soll. Dies ist eine neue Ära für [PER.GetNameDef], und eine, die uns zu Größe führen sollte."
PER_choose_a_shahbanu:	"Wählen Sie einen Schahbanu"
PER_choose_a_shahbanu_desc:	"Die königliche Linie der Pahlavi-Dynastie muss fortbestehen, aber da Mohammed Reza Pahlavi noch sehr jung ist, hatte er noch nicht die Gelegenheit, eine Frau zu finden. Es ist an der Zeit, dass er seine Möglichkeiten überdenkt und eine Frau wählt, die als Shahbanu unseres Landes dienen wird."
PER_embrace_opulence:	"Machen Sie sich eine Kultur der Opulenz zu eigen"
PER_embrace_opulence_desc:	"Für jemanden, der so wichtig ist wie der König der Könige, ist es wichtig, dass wir der Welt zeigen, wie opulent [PER.GetAdjective] sein kann. Lassen Sie uns unsere Pracht jedem zeigen, der sie bewundern möchte."
PER_emperor_for_people:	"Ein Kaiser für das Volk"
PER_emperor_for_people_desc:	"Mohammed Reza Shah wünscht sich, dass seine Herrschaft das Markenzeichen dafür ist, den Kaiser wieder mit seinem Volk zu verbinden. Anstatt egoistisch Reichtümer für die königliche Familie zu horten, möchte er sie stattdessen dazu verwenden, das Leben der normalen Bürger von [PER.GetNameDef] zu verbessern."
PER_fund_imperial_excellency:	"Kaiserliche Exzellenz finanzieren"
PER_fund_imperial_excellency_desc:	"Das Imperium hat den Weg eingeschlagen, unseren Reichtum gegenüber unseren weniger bedeutenden Nachbarn zur Schau zu stellen. Jetzt ist es an der Zeit, etwas davon für die Verbesserung des Palastes auszugeben. Die Einstellung von mehr Wachen scheint das Richtige zu sein!"
PER_uphold_civil_rights:	"Wahrung der Bürgerrechte"
PER_uphold_civil_rights_desc:	"Die Wahrung der Bürgerrechte der [PER.GetNameDef]'Bürger war bisher ein wichtiger Bestandteil der Herrschaft von Mohammed Reza Shah. Indem wir diesen grundlegenden Aspekt unserer Gesellschaft aufrechterhalten, ermutigen wir unsere Bürger, mehr zu erreichen als sie es bisher getan haben."
PER_absolute_monarchy:	"Absolute Monarchie"
PER_absolute_monarchy_desc:	"Nachdem Reza Schah Pahlavi gegen Dissidenten vorgegangen ist, die seine Herrschaft stürzen wollten, hat er nun eine absolute Monarchie ausgerufen, die der Krone mehr Macht verleiht und sicherstellt, dass niemand sonst seine Abstammung bedrohen kann. Zu diesem Prozess gehört auch eine militaristischere Herangehensweise an auswärtige Angelegenheiten und die Vergrößerung des stehenden Heeres von [PER.GetNameDef]."
PER_first_iranian_empire:	"Das erste iranische Reich"
PER_first_iranian_empire_desc:	"Reza Schah Pahlavi hat es immer vorgezogen, seine Nation [PER.GetNameDef] zu nennen und war derjenige, der dies 1935 als offiziellen Namen der Nation wieder einführte. Die Grundlage seiner neuen imperialen Bestrebungen wird daher die Schaffung eines ganz neuen iranischen Reiches sein, anstatt die Perser vor ihm direkt zu imitieren."
PER_take_regional_tour:	"Machen Sie eine regionale Tour"
PER_take_regional_tour_desc:	"Nach der Gründung unseres neuen Reiches möchte Reza Schah Pahlavi eine Rundreise durch die Region unternehmen und sowohl [IRQ.GetNameDef] als auch [AFG.GetNameDef] besuchen, um seine Beziehungen zu den Führern dieser beiden Nationen zu verbessern."
PER_limit_foreign_influence:	"Begrenzung des ausländischen Einflusses"
PER_limit_foreign_influence_desc:	"Schon zu lange ist [PER.GetNameDef] den Launen ausländischer Mächte ausgesetzt. Sie erheben Anspruch auf unsere Ressourcen und verlangen, dass wir an unseren natürlichen Wohltaten teilhaben. Es ist an der Zeit, dass [PER.GetNameDef] auf eigenen Füßen steht, und wir täten gut daran, den Einfluss dieser Außenseiter auf unsere Nation zu begrenzen."
PER_embrace_industrial_powers:	"Umarmen Sie die Industriemächte"
PER_embrace_industrial_powers_desc:	"Anstatt uns vom Rest der Welt abzukapseln und zu isolieren, wäre es viel besser, wenn wir unsere Verbindungen zu den Industriemächten nutzen würden, um die Zukunft von [PER.GetNameDef] voranzutreiben."
PER_subserviant_to_noone:	"Wir sind niemandem untertan"
PER_subserviant_to_noone_desc:	"Auch wenn wir unsere Verbindung zu [ENG.GetNameDef] und der Anglo-Iranian Oil Company in der Vergangenheit als vorteilhaft empfunden haben, haben wir keinen Grund mehr, unsere Ressourcen von fremden Mächten usurpieren zu lassen. Wir sollten diese Gesellschaft auflösen und uns stattdessen auf unsere eigene Entwicklung konzentrieren."
PER_modernize_iran_economy:	"Modernisieren Sie [PER.GetNameDef]s Wirtschaft"
PER_modernize_iran_economy_desc:	"Mit der Hilfe unserer fleißigeren Freunde haben wir es geschafft, unsere Wirtschaft zu modernisieren. Wenn sich die Fabrikhallen drehen und unsere Leute hart arbeiten, werden wir bald mit den anderen großen Nationen dieser Welt als industrielles Kraftzentrum dastehen."
PER_last_thousand_years:	"Ein Reich, das tausend Jahre überdauert"
PER_last_thousand_years_desc:	"Durch all unsere harte Arbeit und unser Engagement für die Verbesserung unserer Nation haben wir schließlich einen Punkt erreicht, an dem [PER.GetNameDef] dazu bestimmt ist, den Test der Zeit zu bestehen und auf der Weltbühne als modernes und mächtiges Land zu stehen. Wir haben endlich die Pracht unserer achämenidischen Vorfahren übertroffen!"
PER_shahanshah:	"Schahanshah"
PER_shahanshah_desc:	"Der Schahansha, oder der König der Könige, ist der höchste Titel, der einem Monarchen von [PER.GetNameDef] verliehen wird. Es ist ein Titel, der unserem derzeitigen Herrscher absolut angemessen ist, und eine Ehre, wieder einmal verwendet zu werden."
PER_rally_ancient_history:	"Rallye durch die alte Geschichte"
PER_rally_ancient_history_desc:	"Es ist kein Geheimnis, dass die junge Herrschaft der Pahlavi-Dynastie viele in [PER.GetNameDef] nervös gemacht hat, was die Zukunft bringen könnte. Unsere größte Chance, nationalistischen Stolz und Vertrauen in den Schah zu verbreiten, besteht darin, unser Volk und die Welt daran zu erinnern, wie unglaublich die Geschichte des alten Persiens war. Es ist an der Zeit, das Reich der Achämeniden zu feiern."
PER_rebuild_persepolis:	"Bauen Sie Persepolis wieder auf"
PER_rebuild_persepolis_desc:	"Persepolis war die zeremonielle Hauptstadt des Achämenidenreiches, deren Ruinen sich in der Ebene von Marvdasht befinden. Als kulturelles Erbe wäre es sehr sinnvoll, unsere Ressourcen für den Wiederaufbau und die Renovierung dieser antiken Stadt zu verwenden und sie für die nächsten Jahrzehnte als Symbol unseres Reiches zu erhalten."
PER_stand_with_germany:	"Stehen Sie zu [GER.GetNameDef]"
PER_stand_with_germany_desc:	"Seit vielen Jahren ist [GER.GetNameDef] einer unserer größten Handelspartner. Da sie ihre eigenen Eroberungsziele verfolgen, wäre es klug, ein Abkommen zu schließen und einen Nichtangriffspakt mit ihnen zu schließen, um unsere eigenen Aussichten zu schützen."
PER_align_with_axis:	"Verbünden Sie sich [PER.GetNameDef] mit den Achsenmächten"
PER_align_with_axis_desc:	"Während der Krieg in Europa wütet, brauchen unsere [GER.GetAdjective] Freunde Verbündete, die sie bei ihren Kriegsanstrengungen unterstützen. Es ist an der Zeit, dass wir unseren eigenen Hut in den Ring werfen und auf der Seite der Achsenmächte in den Krieg ziehen."
PER_donate_oil_fields:	"Spenden Sie Ölfelder an [GER.GetNameDef]"
PER_donate_oil_fields_desc:	"Nachdem wir so lange damit verbracht haben, Nationen wie [ENG.GetNameDef] mit Öl zu versorgen, wäre es für uns vorteilhafter, einige unserer Förderanlagen an [GER.GetNameDef] zu spenden, um sie bei ihren Kriegsanstrengungen zu unterstützen. Wir hoffen, dass dies langfristig für uns beide von Vorteil sein wird."
PER_spoils_of_war:	"Die Beute des Krieges"
PER_spoils_of_war_desc:	"Unsere Bemühungen in diesem Krieg sind bei unseren Verbündeten nicht unbemerkt geblieben. Sie sind offen für die Idee, dass [PER.GetNameDef] nach dem Ende des Krieges Territorium in der umliegenden Region sichert. Dies ist eine großartige Gelegenheit, die Kriegsbeute zu nutzen."
PER_middle_east_protectorate:	"Errichten Sie ein Protektorat über den Nahen Osten"
PER_middle_east_protectorate_desc:	"Nach dem Ende des Krieges konnten wir einige der Nationen in der Umgebung von [PER.GetNameDef] sichern. Es ist nun unsere Pflicht als ihre Oberherren, ihren Schutz vor anderen eindringenden ehemaligen Mächten zu gewährleisten. Wenn irgendjemand versuchen sollte, uns diese Ländereien wegzunehmen, dann würden wir es gerne sehen, wenn er es versucht."
PER_stand_with_giants:	"Mit Giganten stehen"
PER_stand_with_giants_desc:	"Die Welt steht auf Messers Schneide und in Europa braut sich ein Konflikt zwischen mächtigen Nationen zusammen. Während die Lunte des Pulverfasses langsam zu brennen beginnt, müssen wir uns darauf vorbereiten, [PER.GetNameDef] auf ein Niveau zu heben, auf dem wir unter den Giganten dieser Welt stehen und als moderne und fortschrittliche Gesellschaft den Test der Zeit bestehen können."
PER_saadabad_treaty:	"Vertrag von Saadabad"
PER_saadabad_treaty_desc:	"Wir haben nichts zu verlieren und alles zu gewinnen, wenn wir mit unseren Nachbarn freundlich bleiben. Die Idee eines Vertrages, der unsere Freundschaft formalisiert, wurde gelegentlich geäußert, und es ist höchste Zeit, dass wir die Initiative ergreifen und dafür sorgen, dass diese Freundschaft in einem Vertrag festgeschrieben wird."
PER_increase_military_funding:	"Militärische Mittel aufstocken"
PER_increase_military_funding_desc:	"Unser Führer, Reza Schah Pahlavi, ist ein ehemaliger Mitglied der angesehenen persischen Kosaken. Es ist für die Regierungsmitglieder keine Überraschung, dass er [PER.GetNameDef]s militärische Fähigkeiten ausbauen will. Dies beginnt mit der Finanzierung dessen, was wir derzeit haben, um die Qualität unserer Truppen zu verbessern und die Produktion von militärischem Gerät zu erhöhen."
PER_military_high_schools:	"Errichten Sie Militärhochschulen"
PER_military_high_schools_desc:	"Ein gut ausgebildetes stehendes Heer beginnt bei unserer Jugend. Indem wir unsere jungen Leute in militärischen Spitzenleistungen ausbilden, werden wir uns für den Erfolg in der Zukunft rüsten. Es wird ein paar Jahre dauern, aber schließlich werden wir die größte Armee in der Region haben."
PER_persian_german_trade:	"Die Persisch-Deutsche Handelskammer"
PER_persian_german_trade_desc:	"[GER.GetNameDefCap] hat es geschafft, sich nach der Niederlage im Großen Krieg schnell wieder zu industrialisieren. Das wäre ein hervorragendes Beispiel, dem wir folgen sollten, wenn wir die Modernisierung von [PER.GetNameDef] vorantreiben. Es hat den Anschein, dass ihr neuer Anführer uns ebenfalls respektiert, so dass ein reibungsloser Übergang zur Bildung positiver Beziehungen möglich ist."
PER_trial_fifty_three:	"Prozess gegen die Dreiundfünfzig"
PER_trial_fifty_three_desc:	"Die kommunistischen politischen Organisationen haben sich in unserem Prozess zur Sicherung der Pahlavi-Herrschaft in [PER.GetNameDef] als problematisch erwiesen. Wir können nicht zulassen, dass sich diese antimonarchistischen Gefühle zusammenbrauen und möglicherweise in Massendemonstrationen münden. Stattdessen müssen wir diese Dissidenten vor Gericht stellen und ein Tribunal über ihr Schicksal entscheiden lassen."
PER_increase_education_funding:	"Mehr Geld für die Bildung"
PER_increase_education_funding_desc:	"Im Rahmen der Modernisierungsinitiative von Reza Schah wurde ein Schwerpunkt auf die Verbesserung der Qualität der Bildung im Land gelegt. In Abkehr von unserer traditionellen Vergangenheit streben wir die Einführung einer kostenlosen und obligatorischen Schulbildung für Männer und Frauen sowie die Schließung der privaten religiösen Bildungseinrichtungen an."
PER_open_abadan:	"Eröffnung der Technischen Schule von Abadan"
PER_open_abadan_desc:	"Die technische Ausbildung wird uns helfen, zu den Industriegiganten der Welt aufzuschließen, und mit der Eröffnung dieser neuen technischen Schule können wir denjenigen, die in diesen Bereichen arbeiten wollen, Ausbildungsmöglichkeiten bieten. Dies sollte uns helfen, unsere Entwicklung und unseren Modernisierungsprozess voranzutreiben."
PER_royal_visit_germany:	"Ein königlicher Besuch in Deutschland"
PER_royal_visit_germany_desc:	"Während der Regierungszeit von Reza Shah haben wir gute Beziehungen zu dem Führer von [GER.GetNameDef] unterhalten. Dies spiegelt sich auch in ihrem Wunsch wider, uns zu einem königlichen Besuch in ihrem Land einzuladen. Wenn wir darauf eingehen, werden wir unsere Beziehungen zu [GER.GetNameDef] sicher weiter verbessern, aber ob dies eine Hilfe oder ein Hindernis sein wird, bleibt abzuwarten!"
PER_german_non_aggression:	"Diskutieren Sie den Nichtangriffspakt mit [GER.GetNonIdeologyName]"
PER_german_non_aggression_desc:	"Da sich die Dinge in Europa zu erhitzen beginnen, könnte Druck auf uns ausgeübt werden, uns für eine Seite zu entscheiden. Es ist jedoch wichtig, dass [PER.GetNameDef] neutral bleibt, falls ein Krieg ausbrechen sollte. Angesichts ihrer Massenindustrialisierung sollten wir [GER.GetNameDef] einen Nichtangriffspakt anbieten, um unsere Sicherheit zu gewährleisten."
PER_wether_the_storm:	"Dem aufkommenden Sturm trotzen"
PER_wether_the_storm_desc:	"Es hat den Anschein, dass unsere Versuche, uns diplomatisch zu schützen, nach hinten losgegangen sind, da ehemalige Freunde ihre Augen auf unser Land gerichtet haben, in der Hoffnung, uns daran zu hindern, uns gegen sie zu wenden. Obwohl wir dies nicht beabsichtigt hatten, müssen wir uns auf alles vorbereiten, was kommen mag."
PER_stand_our_ground:	"Unseren Boden behaupten"
PER_stand_our_ground_desc:	"Furcht und Angst grassieren in unserer Regierung, denn die drohenden Gefahren unserer Nachbarn und darüber hinaus üben weiterhin einen unerschütterlichen Druck aus. Wir müssen standhaft bleiben, egal, was kommen mag. Es ist an der Zeit, Maßnahmen zu ergreifen, die sicherstellen, dass [PER.GetNameDef] das nächste Jahrzehnt überleben kann."
PER_bolster_civilian_industry:	"Verstärken Sie unsere zivile Industrie"
PER_bolster_civilian_industry_desc:	"Wenn wir den aufkommenden Sturm überleben wollen, müssen wir dafür sorgen, dass unsere zivile Industrie gestärkt wird. Je mehr Ressourcen wir dafür aufwenden, desto wahrscheinlicher ist es, dass unsere Wirtschaft den kommenden Krieg überleben wird."
PER_upscale_military_production:	"Aufwändige Militärproduktion"
PER_upscale_military_production_desc:	"Wenn wir denjenigen, die unsere Nation bedrohen, die Stirn bieten wollen, müssen wir darauf vorbereitet sein, unsere militärische Industrieproduktion zu verdoppeln. Wenn wir neue Fabriken errichten, sind wir in der besten Position, um unsere Streitkräfte weiterhin mit neuer und moderner Ausrüstung auszustatten."
PER_preparatory_mobilization:	"Vorbereitende Mobilisierung"
PER_preparatory_mobilization_desc:	"Wenn wir uns nicht vorbereiten, bereiten wir uns darauf vor, zu scheitern. Es ist kein Geheimnis, dass ausländische Mächte mit gierigen Augen auf [PER.GetNonIdeologyName] blicken, und wenn sie es erobern wollen, dann werden wir kämpfend untergehen. Wenn wir uns darauf vorbereiten, unsere Armee zu mobilisieren, werden wir auf alles vorbereitet sein, was unsere Feinde uns vorwerfen könnten."
PER_we_will_survive:	"Wir werden überleben"
PER_we_will_survive_desc:	"Endlich ist der Krieg vor unserer Haustür angekommen. Zweifellos werden wir unser Bestes tun, um uns gegen diese Invasoren zu behaupten und der Welt zu zeigen, dass die große Nation [PER.GetNameDef] trotz aller Widrigkeiten überleben wird. Wir haben Tausende von Jahren überdauert, und wir werden noch Tausende von Jahren überdauern."
PER_question_of_resources:	"Die Ressourcenfrage"
PER_question_of_resources_desc:	"Wir haben herausgefunden, dass die Wahrscheinlichkeit einer möglichen Invasion durch unsere ehemaligen Verbündeten sehr hoch ist, weil [PER.GetNameDef] reich an Ressourcen ist. Unsere Ölfelder sind von unschätzbarem Wert, und so ist die Wahrscheinlichkeit groß, dass jemand kommt, um sie zu erobern. Das dürfen wir nicht zulassen, also lassen Sie uns stattdessen darauf hinarbeiten, diese potenziellen Bedrohungen auszuschalten, bevor sie uns angreifen..."
PER_plant_resistance_cells:	"Pflanzliche Widerstandszellen"
PER_plant_resistance_cells_desc:	"Um unseren Präventivschlag vorzubereiten, wäre es klug, politische Unruhen in unseren Nachbarregionen zu schüren. [IRQ.GetNameDef] scheint eine ausgezeichnete Wahl zu sein, ebenso wie die besetzten Regionen von [AZR.GetNameDef], [GEO.GetNameDef], [ARM.GetNameDef], [TMS.GetNameDef]."
PER_preemptive_strike:	"Präventivschlag"
PER_preemptive_strike_desc:	"Niemand wird unsere Souveränität bedrohen. Um sicherzustellen, dass diejenigen, die uns mit gierigen Augen betrachten, lernen, sich nicht bei uns einzumischen, werden wir ihnen die volle Macht der [PER.GetNameDef] Streitkräfte zeigen. Wenn wir zuerst zuschlagen, dann werden sie nicht bereit sein, sich gegen einen schnellen und schweren Angriff zu verteidigen."
PER_establish_northern_buffer_states:	"Nördliche Pufferstaaten errichten"
PER_establish_northern_buffer_states_desc:	"Um sicherzustellen, dass unsere Feinde im Norden nicht mehr die Möglichkeit haben, direkt in [PER.GetNameDef] zu stürmen, müssen wir die besetzten Nationen in diesem Land befreien und ihre Souveränität wiederherstellen. Das wird hoffentlich in Zukunft jede überraschende Invasion verhindern."
PER_prepare_for_worst:	"Bereiten Sie sich auf das Schlimmste vor"
PER_prepare_for_worst_desc:	"Da wir Wind davon bekommen haben, dass eine Invasion in [PER.GetNameDef] droht, ist es klug, dass wir Vorbereitungen für den Fall treffen, dass das Schlimmste eintritt. Auch wenn wir geahnt haben, dass es so weit kommen würde, dürfen wir uns nicht die Hände in den Schoß legen und unsere Bäuche entblößen. Stattdessen müssen wir unsere Kräfte aufbauen, um unsere Bemühungen zu unterstützen, wenn die Zeit für unseren Präventivschlag gekommen ist."
PER_fight_for_iran:	"Der Kampf um [PER.GetNonIdeologyName]"
PER_fight_for_iran_desc:	"Unsere schlimmsten Befürchtungen haben sich bewahrheitet, denn die feindlichen Streitkräfte durchbrechen unsere Verteidigung und machen Fortschritte bei einer groß angelegten Invasion von [PER.GetNameDef]. Auch wenn diese Zeiten schwierig sein werden, müssen wir unser Volk mobilisieren und unsere Truppen darauf vorbereiten, unsere große Nation gegen jede ausländische Macht zu verteidigen, die unsere Souveränität bedroht."
PER_force_them_back:	"Treiben Sie sie zurück"
PER_force_them_back_desc:	"Als der Krieg begann, wussten wir immer, dass wir entweder in die Defensive gehen oder unsere Feinde zurückdrängen müssen. Wenn wir den offensiven Weg wählen, sind wir in einer guten Position, um Forderungen zu stellen, wenn der Konflikt vorbei ist. Es mag riskant sein, aber unsere Streitkräfte sind bereit, eine solche Operation durchzuführen."
PER_push_to_deserts:	"Offensive im Norden"
PER_push_to_deserts_desc:	"Die feindlichen Kräfte greifen uns hauptsächlich von den nördlichen Grenzen von [PER.GetNameDef] aus an. Wir müssen unsere Truppen in diesen Regionen konzentrieren und die Invasoren daran hindern, weiter Boden zu gewinnen. Dann nehmen wir den Kampf mit ihnen auf und drängen sie zurück zur Grenze."
PER_push_to_mountains:	"Südliche Front"
PER_push_to_mountains_desc:	"Es scheint, dass die Invasion im Süden von [PER.GetNonIdeologyName] Fuß gefasst hat. Wenn wir sie zurückschlagen wollen, müssen wir unsere Anstrengungen darauf konzentrieren, unsere Feinde an den Persischen Golf zurückzudrängen. Die Zeit drängt, wir dürfen nicht zulassen, dass ihre Streitkräfte noch mehr Boden gewinnen."
PER_demand_war_reparations:	"Fordern Sie Kriegsreparationen"
PER_demand_war_reparations_desc:	"Trotz aller Bemühungen der Invasoren ist es ihnen nicht gelungen, ihre Ziele zu erreichen und stattdessen beginnen wir, den Krieg zu gewinnen. Wir müssen ihnen sofort unsere Forderungen aufzwingen und sie für den Schaden, den sie angerichtet haben, bezahlen lassen."
PER_force_white_peace:	"Erzwingen Sie einen Weißen Frieden"
PER_force_white_peace_desc:	"Die Invasion unseres Feindes ist nicht ganz nach Plan verlaufen. Aufgrund unseres erbitterten Widerstands und unseres Willens, ihnen die Stirn zu bieten, ist es ihnen nicht gelungen, in [PER.GetNonIdeologyName] viel Boden zu gewinnen. Angesichts ihrer Schwierigkeiten sind wir in einer guten Position, diesen unverschämten Eindringlingen einen weißen Frieden aufzuzwingen."
PER_dig_and_defend:	"Eingraben und verteidigen"
PER_dig_and_defend_desc:	"Da die feindlichen Kräfte aus allen Richtungen in die Grenzen unserer großen Nation strömen, müssen wir schnell handeln, wenn wir [PER.GetNameDef] retten wollen. Anstatt in die Offensive zu gehen, müssen wir uns in die Defensive begeben und den Angreifern Probleme bereiten. Andernfalls riskieren wir Verluste in großer Zahl."
PER_capital_protect:	"Beschützen Sie [PER.Capital.GetCapitalVictoryPointName]"
PER_capital_protect_desc:	"Angesichts der Lage von [PER.Capital.GetCapitalVictoryPointName] ist es der perfekte Ort, um eine standhafte Verteidigung aufzubauen. Wenn wir hier Bunker und Stützpunkte errichten, können wir als letzte Bastion der Hoffnung in [PER.GetNameDef] stehen."
PER_secure_coastline:	"Sichern Sie die Küstenlinie"
PER_secure_coastline_desc:	"Die Invasion soll vom Persischen Golf aus erfolgen, also lassen Sie uns ihnen frontal entgegentreten und den Feind daran hindern, in [PER.GetNonIdeologyName] Fuß zu fassen. Wenn wir sie daran hindern können, eine Strandfront vorzubereiten, sind wir in einer guten Position, sie auf der Stelle zu stoppen."
PER_swear_fealty:	"Schwören Sie den Invasoren die Treue"
PER_swear_fealty_desc:	"Trotz unserer besten Bemühungen, [PER.GetNameDef] zu schützen, ist es uns nicht gelungen, den Feind aufzuhalten. Während sich ihre Truppen unserer Hauptstadt nähern, wäre es klug, wenn wir die Hand ausstrecken und diesen Krieg sofort beenden würden, indem wir uns als Marionette anbieten. Auf diese Weise können wir zumindest weitere Verwüstungen in unserem Land verhindern."
PER_push_negotiations:	"Drängen Sie auf Verhandlungen"
PER_push_negotiations_desc:	"Wie es aussieht, konnten wir die Invasion so lange abwehren, wie wir konnten. Wir sind jedoch nicht in der Lage, auf ein direktes Ende des Konflikts zu drängen. Wir haben jedoch ein Druckmittel, um möglicherweise einige unserer natürlichen Ressourcen anzubieten, um unsere Souveränität zu bewahren."
PER_rebuilding_iran:	"Wiederaufbau [PER.GetNonIdeologyName]"
PER_rebuilding_iran_desc:	"Die Invasion hat einen großen Teil unserer Industrie und Infrastruktur in Trümmern liegen lassen. Wir sollten diese Zeit nutzen, um uns auf den Wiederaufbau unseres Landes in seiner früheren Pracht zu konzentrieren, die Scherben aufzusammeln und unsere Wunden zu lecken."
PER_declare_loyalty_to_britain:	"Erklären Sie Ihre Loyalität zu [ROOT.OVERLORD.GetNameDef]"
PER_declare_loyalty_to_britain_desc:	"Als neuer Untertan von [ROOT.OVERLORD.GetNameDef] wäre es klug, wenn wir vorsichtig vorgehen und den Launen unseres Oberherrn folgen würden. Vielleicht ist dies unsere Chance, unsere Modernisierungsinitiative endlich abzuschließen. Der Weg mag eine ganz andere Wendung genommen haben, aber das Ziel ist das gleiche."
PER_invite_british_investors:	"Laden Sie [ROOT.OVERLORD.GetAdjective]-Investoren ein"
PER_invite_british_investors_desc:	"Um unsere Wirtschaft zu verbessern und nach der Invasion wieder aufzubauen, können wir versuchen, [ROOT.OVERLORD.GetNameDef] mit Investoren zu versorgen, die uns helfen, unsere Industrie wieder auf Kurs zu bringen."
PER_request_british_equipment:	"Fordern Sie [ROOT.OVERLORD.GetAdjective] Ausrüstung"
PER_request_british_equipment_desc:	"Unsere Streitkräfte haben während der Invasion viel einstecken müssen, und deshalb brauchen wir dringend Nachschub für unsere Truppen. Als neues Subjekt von [ROOT.OVERLORD.GetNameDef] befinden wir uns in einer guten Position, um um Nachschub und Ausrüstung zu bitten, damit unsere Truppen wieder auf ihren alten Stand kommen."
PER_our_place_in_empire:	"Unser Platz bei [ROOT.OVERLORD.GetNameDef]"
PER_our_place_in_empire_desc:	"Nach Gesprächen mit der Regierung von [ROOT.OVERLORD.GetAdjective] haben wir beschlossen, dass es am besten wäre, [PER.GetLeader] als neuen Vizekönig von [PER.GetNonIdeologyName] neben seiner derzeitigen Position einzusetzen. Das würde uns viel mehr Spielraum bei der Erfüllung unserer Pflichten als Teil von [ROOT.OVERLORD.GetNameDef] geben."
PER_retake_north_iran:	"Rückeroberung von Nord [PER.GetNonIdeologyName]"
PER_retake_north_iran_desc:	"Während unseres anfänglichen Kapitulationsgesuchs hatten wir keine andere Wahl, als unsere nördlichen Gebiete an [SOU.GetNameDef] abzutreten. Jetzt, da wir mehr Macht erlangt haben, ist es an der Zeit, diese Eindringlinge zurückzuschlagen und das zurückzuerobern, was rechtmäßig uns gehört."
PER_azadi:	"Azadi"
PER_azadi_desc:	"Azadi ist das persische Wort für 'Freiheit' und wird der Satz sein, um den wir uns scharen, wenn wir uns darauf vorbereiten, uns gegen unsere Besatzer zu stellen. [ROOT.OVERLORD.GetNameDefCap] erwarten von uns, dass wir gefügig sind, aber wir haben immer die Absicht gehabt, unsere Souveränität zu schützen. Wir mögen die Schlacht verloren haben, aber wir werden trotzdem einen Krieg führen."
PER_reinforce_iranian_identity:	"Stärken Sie [PER.GetAdjective] Identität"
PER_reinforce_iranian_identity_desc:	"Obwohl wir uns unseren Feinden beugen mussten, sind wir alle immer noch [PER.GetAdjective] und niemand wird uns das nehmen. Wir müssen diese Identität gegenüber den Menschen stärken und ihnen zeigen, dass unser Wunsch nach Freiheit noch immer hell in unseren Herzen brennt."
PER_rally_bakhtiari_and_qashqai:	"Versammeln Sie die Bachtiari und die Gaschgai"
PER_rally_bakhtiari_and_qashqai_desc:	"Unzufrieden mit dem Regimewechsel haben die Stammesvölker der Bachtiari und der Gaschgai begonnen, sich dem neuen Rechtsstaat zu widersetzen. Das könnten wir nutzen. Wenn wir sie für unsere Sache gewinnen, haben wir mehr Leute, die uns im Kampf unterstützen, sollte unsere Unabhängigkeitsnotlage blutig werden."
PER_iran_for_iranians:	"[PER.GetNonIdeologyName] für [PER.GetAdjective]s"
PER_iran_for_iranians_desc:	"Es war wirklich eine Schande, vor den imperialistischen Oberherren kapitulieren zu müssen und unser Territorium an diejenigen abzutreten, die unsere Souveränität zerstören wollen. Aber wenn es eine Sache gibt, die wahr ist, dann ist es, dass unser Wunsch nach Autonomie niemals sterben wird. Es ist an der Zeit, dass wir uns erheben und die Unabhängigkeit erklären!"
PER_consolidate_british_territory:	"Konsolidieren Sie [ENG.GetAdjective] Territorium"
PER_consolidate_british_territory_desc:	"Zu lange schon ist [ENG.GetNameDef] im Nahen Osten präsent; ein Ort, an den sie wahrlich nicht gehören. Nun, da wir für die Unabhängigkeit gekämpft haben, sollten wir dies auch für die anderen Nationen in dieser Region tun und sicherstellen, dass sie von uns beschützt werden, anstatt von [ENG.GetNameDef] beherrscht zu werden."
PER_assessing_the_opposition:	"Einschätzung der Opposition"
PER_assessing_the_opposition_desc:	"Bevor wir auch nur in Erwägung ziehen können, unsere Grenzen über den Iran hinaus auszudehnen, müssen wir zuerst nach innen schauen. Mehrere Oppositionsparteien scheinen mit der Zeit immer frustrierter über unsere Regierung zu werden. Wenn wir die Unterstützung des Volkes für den Wiederaufbau eines Imperiums gewinnen wollen, müssen wir sicherstellen, dass wir in der Regierung volle Unterstützung haben, und zwar mit allen Mitteln."
PER_assessing_the_opposition_tt:	"Schaltet die Entscheidungen in der Mission §YCivil Unrest§! aus §YA Legacy of Greatness§! frei, die es uns ermöglichen, die Bedrohung zu kontrollieren und einen Bürgerkrieg zu verhindern."
PER_rally_the_reformers:	"Etablieren Sie eine Nationale Front"
PER_rally_the_reformers_desc:	"Im ganzen Land gibt es nicht wenige Gruppierungen, die dem Schah oder der Monarchie ein jähes Ende bereiten wollen. Da sich die Welt zu destabilisieren beginnt, könnten sich für solche Gruppierungen neue Gelegenheiten ergeben, einen Vorstoß zu unternehmen."
PER_lobby_military_dissidents:	"Militärisches Netzwerk der Tudeh"
PER_lobby_military_dissidents_desc:	"Die Tudeh-Partei hat eine Reihe von Mitgliedern in einflussreichen Positionen innerhalb des Militärs. Vielleicht können wir sie für unsere Sache gewinnen und sie nutzen, um den Schah zu unterminieren, wenn die Zeit reif ist."
PER_promise_clergy_power:	"Versprechen Sie dem Klerus Macht"
PER_promise_clergy_power_desc:	"Der Islam ist für viele unserer Landsleute ein Grundpfeiler der Gesellschaft. Wir können daher nicht darauf hoffen, die Unterstützung des Volkes zu erhalten, wenn wir anfangen, die Gläubigen zu verunglimpfen, und müssen mehr tun, um sie für unsere Sache zu gewinnen."
PER_exclude_religion:	"Religion ausschließen"
PER_exclude_religion_desc:	"Der Islam und die Religion im weiteren Sinne sind zu einem Hindernis für die politische und wirtschaftliche Modernisierung unseres Landes geworden. Wir müssen deutlich machen, dass solche Hürden im neuen [ROOT.GetNonIdeologyName] überwunden werden."
PER_stage_mass_protests:	"Organisieren Sie Proteste"
PER_stage_mass_protests_desc:	"Die Menschen haben genug von den Ausreden des Schahs und der festgefügten Macht der Elite. Jetzt ist es an der Zeit, auf die Straße zu gehen und einen sofortigen Wandel zu fordern."
PER_stage_mass_protests_tt:	"Machen Sie §Y$PER_mass_protests$§! Entscheidungen rückgängig, um die Unterstützung für den Schah zu verringern. "
PER_constitutional_monarchy:	"Wiederherstellung der verfassungsmäßigen Beschränkungen für den Schah"
PER_constitutional_monarchy_desc:	"Der Schah hat die Politik der Nation schon zu lange dominiert. Seine Abwesenheit würde jedoch viel zu viele beunruhigen, die weiterhin an seine heilige Rolle glauben. Daher werden wir die Möglichkeiten des Schahs, politische Angelegenheiten zu beeinflussen, einschränken und seine Rolle auf eine zeremonielle Rolle zurückführen."
PER_strengthen_iranian_parliament:	"Das iranische Parlament stärken"
PER_strengthen_iranian_parliament_desc:	"Da die Macht des Schahs nun unter Kontrolle ist, können wir unseren demokratischen Prozess verbessern, indem wir die Macht zurück in die gewählten Kammern des Parlaments bringen, wo sie hingehört. "
PER_strengthen_iranian_parliament_tt:	"\n\n§Wenn die demokratische Partei weniger als 30% Unterstützung hat, wird der Schah einen Bürgerkrieg gegen uns anzetteln!§!"
PER_continue_westernization:	"Verwestlichung fortsetzen"
PER_continue_westernization_desc:	"Die Verwestlichung war schon immer eine Art Ziel, das in den Hinterköpfen unserer Führung geruht hat. Viele sind begierig darauf, mit einigen der wichtigsten Akteure des Westens gleichzuziehen und deren Ideologien und Praktiken zu übernehmen. Wenn wir uns ihnen in der Zukunft anschließen wollen, müssen wir uns jetzt auf diese Integration vorbereiten."
PER_royal_college_funding:	"Staatliche College-Finanzierung"
PER_royal_college_funding_desc:	"Es ist wichtig, dass wir mit unserer intellektuellen Entwicklung vorankommen. Wenn wir einen Teil der Gelder, die wir aus der Kasse des Schahs entnommen haben, in unsere Bildungseinrichtungen fließen lassen, sind wir in einer guten Position, um mit dem sich schnell verändernden technologischen Fortschritt Schritt zu halten."
PER_expand_oil_production:	"Ölförderung ausbauen"
PER_expand_oil_production_desc:	"[PER.GetNonIdeologyName] ist reich an Öl, und wir wären dumm, wenn wir das nicht zu unserem Vorteil nutzen würden. Lassen Sie uns unsere Ölproduktion ausbauen, damit wir später in einer guten Position sind, um mit dem Westen zu verhandeln."
PER_increase_oil_sales:	"Ölverkäufe steigern"
PER_increase_oil_sales_desc:	"Da wir bereits eine Partnerschaft mit [ENG.GetNameDef] in Bezug auf unsere Ölreserven haben, ist es sinnvoll, unsere neu gewonnenen Ressourcen zu nutzen und die Menge zu erhöhen, die wir an sie verkaufen. Dies ist schließlich ein Abkommen zum beiderseitigen Vorteil."
PER_request_membership_allies:	"Antrag auf Mitgliedschaft bei den Verbündeten"
PER_request_membership_allies_desc:	"Da die Spannungen auf der ganzen Welt zunehmen, ist es endlich an der Zeit, dass wir uns für eine Seite entscheiden. Da wir mit unseren westlichen Freunden enger zusammengewachsen sind, ist es für uns am sinnvollsten, uns mit ihnen zu verbünden. Gemeinsam können wir die Bedrohung durch den Faschismus weltweit ausrotten."
PER_secure_iraq:	"Den Irak sichern"
PER_secure_iraq_desc:	"Als Teil unserer Pflichten gegenüber unseren Verbündeten müssen wir uns um die Sicherung von [IRQ.GetNameDef] mit allen Mitteln bemühen. Diese drastische Maßnahme soll den Schutz des [IRQ.GetAdjective] Volkes vor äußeren Bedrohungen gewährleisten und die Einheit in der Region fördern."
PER_secure_afghanistan:	"Sicheres Afghanistan"
PER_secure_afghanistan_desc:	"[AFG.GetNameDefCap] ist eines von [PER.GetNameDef]s offenen Toren zum Osten. Die Sicherung dieses Korridors für unsere Verbündeten ist von äußerster Wichtigkeit. So können wir auch sicherstellen, dass [AFG.GetNameDef] unter unserer Aufsicht geschützt werden kann. Dies ist sicherlich zum Wohle des [AFG.GetAdjective] Volkes."
PER_post_war_spoils:	"Nachkriegsbeute"
PER_post_war_spoils_desc:	"Nun, da der Krieg zu Ende ist, stellt sich die Frage, was wir mit unserer schützenden Besatzung von [IRQ.GetNonIdeologyName] und [AFG.GetNonIdeologyName] tun sollen. Nachdem wir uns an unsere Verbündeten gewandt haben, haben wir beschlossen, dass es am besten wäre, diese Gebiete in die Regierung von [PER.GetNameDef] zu integrieren. Auf diese Weise können wir für einen stärkeren und stabileren Nahen Osten sorgen."
PER_follow_the_tudeh:	"Scharen Sie sich um die Tudeh-Partei"
PER_follow_the_tudeh_desc:	"Die Tudeh-Partei ist die einzige Partei, die den Wunsch des Volkes nach einem radikalen Wandel verkörpert und nicht die demokratische Augenwischerei des derzeitigen Regimes. Deshalb müssen wir uns um sie scharen, denn sie ist das Herz der radikalen Bewegung."
PER_rally_behind_mosaddegh:	"Scharen Sie sich hinter Mosaddegh"
PER_rally_behind_mosaddegh_desc:	"Seit dem Beginn des Pahlavi-Regimes ist Mohammad Mosaddegh dafür bekannt, dass er mit vielen Aspekten der Herrschaft des Schahs nicht einverstanden ist. Wenn wir uns wirklich gegen die Pahlavi-Dynastie stellen und eine neue, demokratischere [PER.GetNonIdeologyName] schaffen wollen, dann ist er vielleicht derjenige, hinter dem sich unsere Bewegung versammeln sollte."
PER_reach_to_seperatists:	"Den Separatisten die Hand reichen"
PER_reach_to_seperatists_desc:	"Die Arbeiterklasse hat sich noch nicht vollständig mit ihren sozioökonomischen Bedingungen abgefunden und verfügt daher nicht über die Kraft, die festgefahrene Macht des Schahs zu überwinden. Im Norden und Osten gibt es jedoch viele, die von aserbaidschanischen oder kurdischen Gefühlen beseelt sind und für unsere Sache gewonnen werden könnten."
PER_reach_to_seperatists_tt:	"Alle Staaten, die zu §YKurdistan§! oder §YAzerbaijan§! gehören, werden sich uns anschließen und im kommenden Bürgerkrieg Truppen stellen. \n\n§Allerdings werden sie erwarten, dass sie als Ausgleich innerhalb von zwei Jahren nach Abschluss dieses Schwerpunkts die Unabhängigkeit erlangen!§!"
PER_embrace_national_front:	"Auf dem Weg zu einer Republik"
PER_embrace_national_front_desc:	"Politische Macht und Entscheidungsfindung können nicht länger in den Händen des nicht gewählten, nicht rechenschaftspflichtigen Schahs oder eines Nachfolgers konzentriert sein. Wir müssen die gesamte Institution abschaffen und die Bildung einer [ROOT.GetAdjective] Republik anstreben."
PER_force_abdication:	"Abdankung erzwingen"
PER_force_abdication_desc:	"Der Schah und seine Kumpane leiden unter dem massiven Unmut des Volkes. Jetzt ist der Moment gekommen, unseren Vorteil auszuspielen und ihn zur Abdankung zu zwingen, damit wir diesen feudalen Unsinn ein für alle Mal beenden können."
PER_nationalize_oil_fields:	"Ölfelder verstaatlichen"
PER_nationalize_oil_fields_desc:	"Wir haben viele Jahre damit verbracht, unser Öl in unfairen Abkommen mit gierigen Nationen zu verhökern. Es ist an der Zeit, dass [PER.GetNameDef] seine Ölproduktion verstaatlicht, so dass wir endlich die volle Kontrolle über unsere eigenen natürlichen Ressourcen haben werden."
PER_free_elections:	"Freie Wahlen"
PER_free_elections_desc:	"Jetzt, wo unsere neue, neu erfundene Regierung Gestalt annimmt, ist es an der Zeit, dass wir entscheiden, wer der Premierminister sein wird, um [PER.GetNameDef] in ein goldenes Zeitalter der Demokratie zu führen!"
PER_free_elections_tt:	"Sie können wählen, welcher _YKandidat§! am besten geeignet ist, ein _Ydemokratisches [PER.GetNonIdeologyName] zu führen.§!"
PER_united_progressive_parties:	"Vereinigte Progressive Parteien"
PER_united_progressive_parties_desc:	"Mit der Abdankung des Schahs haben wir die Chance, eine fortschrittlichere Zukunft für [ROOT.GetNonIdeologyName] aufzubauen. Aber dazu brauchen wir die Unterstützung aller progressiven Parteien in einer großen Koalition, die unsere Agenda durchsetzen kann."
PER_strengthen_the_tudeh:	"Die Tudeh-Partei stärken"
PER_strengthen_the_tudeh_desc:	"Die Tudeh-Partei hat sich zur Vorhut der [ROOT.GetAdjective] Arbeiterklasse entwickelt und sie zum Sieg über den Schah geführt. Jetzt muss sie die Autorität erhalten, den Sozialismus umzusetzen und das Volk von den Fesseln des Imperialismus und Kapitalismus zu befreien. "
PER_soviet_alignment:	"Sowjetische Ausrichtung"
PER_soviet_alignment_desc:	"Die Welt verändert sich schnell und wir brauchen starke Verbündete, um unsere Feinde abzuschrecken. Die Tudeh-Partei ist die einzige sozialistische Partei mit Verbindungen zu [SOU.GetNameDef] und könnte als solche eine starke Beziehung zu ihnen pflegen."
PER_industrial_aid:	"Industrielle Hilfe"
PER_industrial_aid_desc:	"Unsere Genossen in [SOU.GetNameDef] haben gezeigt, dass eine vorwiegend landwirtschaftlich geprägte Wirtschaft durch sorgfältige Planung schnell industrialisiert werden kann. Wir sollten uns mit ihnen in Verbindung setzen und sehen, ob sie bereit sind, ihr Fachwissen in dieser Angelegenheit zu teilen."
PER_workers_army:	"Die Volksarmee"
PER_workers_army_desc:	"In der Armee tummeln sich viele konterrevolutionäre Eiferer, die nur darauf warten, dass sich eine Gelegenheit bietet, ihre antiquierten Ansichten auf die Nation zu übertragen. Wir müssen die Armee reformieren, um dies zu verhindern, angefangen mit dem Sturz der Reaktionäre."
PER_elevate_the_iran_party:	"Die Iranische Partei aufwerten"
PER_elevate_the_iran_party_desc:	"Die Tudeh-Partei würde unsere Nation an [SOU.GetNameDef] binden und ihre Befehle von [SOU.Capital.GetCapitalVictoryPointName] entgegennehmen. Alle Progressiven müssen sich daher auf die Seite der Iranischen Partei stellen, wenn wir die Hoffnung haben wollen, einen iranischen Weg zum Sozialismus zu etablieren."
PER_iranian_socialism:	"Der iranische Sozialismus"
PER_iranian_socialism_desc:	"Um die langfristige Sicherheit des Staates zu gewährleisten, müssen wir neue Allianzen mit gleichgesinnten Regierungen in der ganzen Region schmieden."
PER_iranian_industrialization:	"Industrialisierung"
PER_iranian_industrialization_desc:	"Wir werden uns nicht von ausländischen Mächten abhängig machen, um unsere Wirtschaft zu modernisieren. Stattdessen werden wir das ungenutzte Potenzial unseres Volkes nutzen und unseren eigenen Weg zur Modernisierung finden."
PER_international_solidarity:	"Internationale Solidarität"
PER_international_solidarity_desc:	"Obwohl wir die imperialistischen Fesseln innerhalb unserer Grenzen abgeworfen haben, werden wir erst dann wirklich frei sein, wenn die imperialen Mächte aus unserer Region vertrieben sind. Aber wir sind noch nicht bereit für eine umfassende Konfrontation. Deshalb werden wir damit beginnen, ihren Besitz zu untergraben."
PER_appease_the_seperatists:	"Beschwichtigen Sie die Separatisten"
PER_appease_the_seperatists_desc:	"Es ist an der Zeit, unsere Verpflichtungen gegenüber der aserbaidschanischen und kurdischen Bevölkerung zu erfüllen, indem wir ihnen mehr Autonomie über ihre eigenen Angelegenheiten gewähren. Allerdings sollten wir im Interesse unserer kollektiven Sicherheit alles daran setzen, sie in unserem Einflussbereich zu halten."
PER_appease_the_seperatists_tt:	"§Wir werden nicht länger der Gefahr ausgesetzt sein, dass ein Unabhängigkeitskrieg gegen uns ausbricht.§!"
PER_communist_industrialization:	"Ausschuss für Wirtschaftsplanung"
PER_communist_industrialization_desc:	"Wir werden eine neue Abteilung einrichten, um die Expansion und Modernisierung der Wirtschaft zu überwachen, frei von den Voreingenommenheiten und der Trägheit der früheren Wirtschaftsabteilungen."
PER_communist_education_reform:	"Bildungssystem ausbauen"
PER_communist_education_reform_desc:	"Unser Bildungssystem ist veraltet und wird den Bedürfnissen des Staates nicht gerecht. Wir müssen mehr Kinder in die Klassenzimmer bringen und dafür sorgen, dass sie die Schule mit mehr praktischen Fähigkeiten verlassen, die sie in der Arbeitswelt einsetzen können."
PER_iranian_culture:	"Vereinigen Sie die Ultra-Nationalisten"
PER_iranian_culture_desc:	"Trotz aller Rhetorik der Politiker und des Schahs ist keiner von ihnen bereit, das zu tun, was notwendig ist, um unser kulturelles Erbe und unsere territoriale Integrität zu schützen. Wir werden die ungleichen Schriftsteller und Nationalisten in einer neuen politischen Bewegung vereinen, die die Nation wieder zu ihrer Größe führen wird."
PER_ally_the_bazaari:	"Beeinflussen Sie die Elite"
PER_ally_the_bazaari_desc:	"Unter der [PER.GetAdjective] Elite wächst die Unruhe über den Kurs der Nation. Viele fürchten um die Zukunft ihrer Unternehmen oder ihres Vermögens und könnten bereit sein, unsere Sache zu unterstützen, wenn sie im Gegenzug Garantien erhalten, die sie vor politischen Nachbeben bewahren."
PER_brown_shirts:	"Schocktruppen-Märsche"
PER_brown_shirts_desc:	"Viele unserer Parteimitglieder haben in letzter Zeit die Braunhemd-Uniformen der europäischen faschistischen Bewegungen übernommen. Vielleicht sollten wir diese engagierten Mitglieder dazu bringen, Massenaufmärsche zu organisieren, um die Trommel für die Bewegung zu rühren."
PER_march_on_saadabad:	"Marsch auf Saadabad"
PER_march_on_saadabad_desc:	"Das Regime hat es versäumt, auf unsere Missstände einzugehen. Deshalb werden wir auf den Sa'dabad-Komplex marschieren und dem Schah ein Ultimatum stellen. Entweder er willigt in einen Kurswechsel ein und bleibt souverän, oder er muss den Zorn unserer Bewegung auf sich ziehen."
PER_roll_back_reforms:	"Wiederherstellung der Nation"
PER_roll_back_reforms_desc:	"Der Schah hat zwar einige Fortschritte bei der Modernisierung der Nation gemacht, aber die Reformen gehen nicht weit genug. Wir werden eine viel tiefer gehende und radikale Agenda verfolgen, die uns wieder zu Größe verhelfen soll."
PER_fascist_secularism:	"Säkularismus durchsetzen"
PER_fascist_secularism_desc:	"Die gewaltsame Bekehrung des persischen Reiches zum Islam hat unsere einst große Kultur zerstört. Wir müssen zu unseren Wurzeln zurückkehren und diese fremde Religion aus allen Bereichen des öffentlichen Lebens verbannen, indem wir einen strengen Kodex des Säkularismus durchsetzen."
PER_form_savama:	"Eine Geheimpolizei einrichten"
PER_form_savama_desc:	"Die Verräter, die unsere Kultur verlassen haben oder als Agenten ausländischer Mächte arbeiten, müssen so schnell wie möglich ausgemerzt werden. Zu diesem Zweck werden wir eine neue Sonderpolizei einrichten, die diese Aufgabe übernimmt."
PER_fascist_reach_out_to_germany:	"Blick in den Westen"
PER_fascist_reach_out_to_germany_desc:	"Da es immer wahrscheinlicher wird, dass wir in einen globalen Konflikt verwickelt werden, sollten wir uns vielleicht mit gleichgesinnten Regimen wie [GER.GetNameDef] zusammenschließen."
PER_fascist_reach_out_to_japan:	"Schauen Sie in den Osten"
PER_fascist_reach_out_to_japan_desc:	"Die [JAP.GetAdjective] wissen, wie schwer es ist, ihr Land zu modernisieren und gleichzeitig seine Kultur vor den zersetzenden Kräften der Verwestlichung zu schützen. Wir sollten uns mit ihnen verbünden, um den westlichen Würgegriff der globalen Macht zu brechen."
PER_pan_iranianism:	"Pan-Iranismus"
PER_pan_iranianism_desc:	"Es gibt nach wie vor Enklaven iranischer Völker jenseits unserer Grenzen, eine Situation, die wir nicht länger hinnehmen dürfen. Es ist an der Zeit, eine größere iranische Identität zu fördern und die Vereinigung unseres Volkes voranzutreiben."
PER_anti_soviet_resistance_network:	"Anti-[SOU.GetAdjective]Widerstand"
PER_anti_soviet_resistance_network_desc:	"Sie können es verkleiden, wie sie wollen, aber die Realität ist, dass [SOU.GetNameDef] nur ein weiteres russisches Reich ist und viele iranische Völker unter ihrem despotischen Joch gefangen bleiben. Wir müssen mehr tun, um ihre Autorität zu untergraben und die Befreiung unseres Volkes zu fördern."
PER_intervene_in_central_asia:	"Beschützen Sie die großiranische Diaspora"
PER_intervene_in_central_asia_desc:	"Wir haben [SOU.GetAdjective] Kontrolle über Zentralasien aufgeweicht. Außerdem sind sie durch Konflikte auf der ganzen Welt abgelenkt. Daher sollten wir diesen Moment nutzen, um sie ein für alle Mal aus der Region zu vertreiben."
PER_proclaim_greater_iran:	"Proklamieren Sie einen Groß-Iran"
PER_proclaim_greater_iran_desc:	"Unsere Grenzen sind an allen Fronten wiederhergestellt und wir haben unser Volk von der Tyrannei der Fremdherrschaft befreit. Jetzt können wir endlich die Geburt eines Großirans verkünden, der die Zeit überdauern wird. "
PER_fascist_attack_turkey:	"Die [TUR.GetAdjective]-Bedrohung eindämmen"
PER_fascist_attack_turkey_desc:	"Die [TUR.GetAdjective] und ihre osmanischen Vorgänger haben lange an unseren Grenzen genagt und unsere Kultur korrumpiert, während sie Länder besetzten, die rechtmäßig unserem Volk gehören. Wir müssen diese historische Ungerechtigkeit korrigieren."
PER_intervention_in_iraq:	"Intervention in [IRQ.GetNonIdeologyName]"
PER_intervention_in_iraq_desc:	"[IRQ.GetNonIdeologyName] ist nur ein Konstrukt westlicher Imperialisten, die Grenzen auf einer Landkarte ziehen. Eine solche Nation ist unhaltbar und sollte ihren rechtmäßigen Eigentümern, uns, zurückgegeben werden."
PER_crush_saudi_arabia:	"Kriegswirtschaftliche Integration"
PER_crush_saudi_arabia_desc:	"Unsere jüngsten Eroberungen haben uns eine Menge an industrieller Ausrüstung und Personal hinterlassen, das nach Hause verschifft werden könnte, um dort eingesetzt zu werden. Allerdings werden wir dafür eine große Anzahl von Zügen benötigen."
PER_fascist_attack_afghanistan:	"Konfrontation mit Afghanistan"
PER_fascist_attack_afghanistan_desc:	"Eine beträchtliche iranische Bevölkerung ist jenseits unserer Grenzen unter der Fuchtel der Paschtunen in [AFG.Capital.GetCapitalVictoryPointName] gefangen. Eine solche Beleidigung unserer territorialen Integrität werden wir nicht länger tolerieren."
PER_modify_opposition_tt:	"Ändern Sie §Y$PER_opposition_modifier$§! durch:"
PER_communist_afghanistan_intervention:	"Stören Sie das große Spiel"
PER_communist_afghanistan_intervention_desc:	"Die [ENG.GetAdjective] und [SOU.GetAdjective] streiten sich seit fast einem Jahrhundert um den Status von [AFG.GetNonIdeologyName]. Wir werden das Gleichgewicht zu unseren Gunsten stören, indem wir dort ein kommunistisches Regime an die Macht bringen."
PER_communist_liberate_pashtuns:	"Unterstützen Sie den paschtunischen Nationalismus"
PER_communist_liberate_pashtuns_desc:	"Da [AFG.GetNonIdeologyName] sicher in unserem Einflussbereich liegt, können wir die [ENG.GetAdjective] Grenzregionen damit destabilisieren, indem wir einen stärkeren paschtunischen Nationalismus in der Region fördern."
PER_communist_liberate_pashtuns_tt:	"Schalten Sie mehr §Y$PER_gulf_decisions_cat$§! Entscheidungen zur Förderung des Widerstands gegen die Kolonialmächte entlang der afghanisch-iranischen Grenze frei."
PER_communist_destabilize_iraq:	"Destabilisieren Sie den Nordirak"
PER_communist_destabilize_iraq_desc:	"Die [ENG.GetAdjective] sind vom Öl aus [IRQ.GetNonIdeologyName] abhängig. Wir könnten ihren Zugang dazu untergraben, indem wir einen kurdischen Aufstand im Norden des Landes fördern und sie mit uns verbünden."
PER_communist_destabilize_iraq_tt:	"Schalten Sie §Y$PER_gulf_decisions_cat$§! Entscheidungen zur Förderung eines kurdischen Aufstandes frei."
PER_communist_kurdish_uprising:	"Bereiten Sie einen kurdischen Aufstand vor"
PER_communist_kurdish_uprising_desc:	"TODO"
PER_revolution_in_the_gulf:	"Revolution in der Golfregion"
PER_revolution_in_the_gulf_desc:	"Das Gleichgewicht der Kräfte in der Region verschiebt sich zu unseren Gunsten. Wir müssen unseren Vorteil nutzen und beginnen, größere antikoloniale Bewegungen in der gesamten Region zu fördern."
PER_revolution_in_the_gulf_tt:	"Schalten Sie weitere §Y$PER_gulf_decisions_cat$§! Entscheidungen zur Förderung des Widerstands in den besetzten Staaten am Persischen Golf frei."
PER_hormuz_crisis:	"Die Hormuz-Krise"
PER_hormuz_crisis_desc:	"Die Imperialisten sind auf dem Rückzug, jetzt ist es an der Zeit, sie unter Androhung von Angriffen an allen Fronten aus der Region zu vertreiben. Wir werden den Prozess mit der Blockade der Straße von Hormuz für die imperiale Schifffahrt beginnen."
PER_hormuz_crisis_tt:	"§Jede Kolonialmacht in Arabien oder im Golf von Persien wird aufgefordert, sich aus den Gebieten in der Region zurückzuziehen. Wenn sie sich weigern, werden wir die Möglichkeit haben, ihnen den Krieg zu erklären.§!"
PER_communist_gulf_hegemony:	"Hegemonie am Persischen Golf"
PER_communist_gulf_hegemony_desc:	"Wir haben erreicht, was unmöglich schien: die Vertreibung der imperialen Mächte aus dem Persischen Golf. Jetzt sind wir de facto die Großmacht in der Region und können beginnen, unseren Einfluss ohne Einmischung von außen geltend zu machen."
PER_communist_propaganda:	"Nationales iranisches Radio"
PER_communist_propaganda_desc:	"Die Verstaatlichung der Radiosender zu einer einzigen öffentlichen Rundfunkanstalt würde es uns ermöglichen, die öffentliche Meinung in Angelegenheiten, in denen sie nicht vollständig mit der des Staates übereinstimmt, schnell zu beeinflussen."
PER_communist_propaganda_tt:	"Schalten Sie §Y$PER_national_iranian_radio$§! Entscheidungen frei, um die Stabilität, die Kriegsunterstützung und die Popularität der Partei zu fördern."
PER_the_new_economy:	"Die neue Wirtschaft"
PER_the_new_economy_desc:	"Eine neue Wirtschaft, die sich an den Bedürfnissen der Menschen und nicht an den Launen des Marktes orientiert, beginnt sich nach unseren Reformen endlich zu entwickeln. Es bleibt zwar noch einiges zu tun, aber wir können sagen, dass wir den Sozialismus in [ROOT.GetNameDef] aufbauen."
PER_oil_and_rubber_industry:	"Diversifizierung der Industrie"
PER_oil_and_rubber_industry_desc:	"Obwohl unser Land über riesige unerschlossene Ölreserven verfügt, sollten wir vermeiden, dass unsere Wirtschaft vollständig von der Verschiffung von Öl in andere Länder abhängig wird. Deshalb müssen wir unsere Industrien diversifizieren, um Produkte herzustellen, die für den Konsum im Inland geeignet sind."
PER_the_peoples_airforce:	"Revolutionäre Luftwaffe des Volkes"
PER_the_peoples_airforce_desc:	"Wenn wir uns jemals als regionale Macht etablieren wollen, müssen wir die Kontrolle über den Persischen Golf erlangen. Zu diesem Zweck werden wir mit dem Aufbau einer Volksluftwaffe beginnen, um der Seedominanz der imperialen Mächte entgegenzutreten."
PER_communist_air_defense:	"Initiative zur Luftverteidigung"
PER_communist_air_defense_desc:	"Wir dürfen nicht zulassen, dass alles, was wir aufgebaut haben, von den imperialen Mächten aus der Luft zerstört wird. Deshalb werden wir eine Reihe von Luftabwehrsystemen im ganzen Land errichten."
PER_communist_basic_plane_design:	"Zusammenarbeit der Luftwaffe"
PER_communist_basic_plane_design_desc:	"Unsere Luftwaffenreformen haben einen guten Start hingelegt, jetzt müssen wir uns darauf konzentrieren, die entsprechende Technologie und die Fähigkeiten zu entwickeln, um es mit Schiffen aufnehmen zu können. Vielleicht können wir diesen Prozess mit der Hilfe unserer Kameraden im Ausland beschleunigen."
PER_communist_naval_bomber_design:	"[SOU.GetAdjective]-[ROOT.GetAdjective] Konstruktion von Bombern"
PER_communist_naval_bomber_design_desc:	"Mit Hilfe unserer [SOU.GetAdjective] Freunde sind wir fast so weit, eine Flotte von Marinebombern einzusetzen, die jede Flotte dezimieren wird, die dumm genug ist, ohne unsere Zustimmung in den Persischen Golf zu segeln."
PER_challenge_the_royal_navy:	"Fordern Sie die britische Flotte heraus"
PER_challenge_the_royal_navy_desc:	"Wir verfügen jetzt über die Technologie und das theoretische Wissen, um es mit unserem großen Gegner aufzunehmen. Allerdings fehlt uns die konkrete Erfahrung, die wir brauchen, um es zu schaffen. Vielleicht können wir durch kleine Provokationen im Golf Wissen sammeln?"
PER_the_peoples_navy:	"Revolutionäre Volksmarine"
PER_the_peoples_navy_desc:	"Wir können zwar nicht darauf hoffen, die Überwasserflotten der imperialen Mächte an der Oberfläche herauszufordern, aber wir könnten dies tun, indem wir eine speziell gebaute Klasse von U-Booten entwickeln."
PER_communist_shore_defense:	"Initiative zur Küstenverteidigung"
PER_communist_shore_defense_desc:	"Die Aufrechterhaltung einer robusten Reihe von Seeverteidigungsanlagen entlang unserer Küste wird einen großen Beitrag dazu leisten, potenzielle Angreifer davon abzuhalten, an unseren Küsten zu landen."
PER_communist_naval_designs:	"Zusammenarbeit bei der Marine"
PER_communist_naval_designs_desc:	"Wir machen Fortschritte bei unseren Marinereformen, aber wir müssen unsere Anstrengungen verdoppeln und mit der Entwicklung von U-Boot-Technologien beginnen. Vielleicht wären unsere Kameraden anderswo bereit, uns bei diesem Vorhaben zu unterstützen?"
PER_communist_submarine_design:	"[SOU.GetAdjective]-[ROOT.GetAdjective] U-Boot-Entwicklung"
PER_communist_submarine_design_desc:	"In Zusammenarbeit mit unseren [SOU.GetAdjective] Genossen stehen wir kurz davor, ein hochmodernes U-Boot zu entwickeln, das es uns ermöglichen wird, den Persischen Golf zu beherrschen."
PER_eastern_expansion:	"Östliche Expansion"
PER_eastern_expansion_desc:	"Die Welt hat sich in den letzten Jahren drastisch verändert und die Regime in unserem Osten sind weiterhin brüchig und sturzgefährdet. Vielleicht bietet sich uns nie wieder eine solche Gelegenheit, sie in unseren Einflussbereich zu integrieren."
PER_curtail_pan_arabism:	"Zügeln Sie den Panarabismus"
PER_curtail_pan_arabism_desc:	"Die arabischen Völker des Nahen Ostens und Nordafrikas entwickeln zunehmend ein Gefühl der panarabischen Solidarität. Wir können nicht zulassen, dass sie vor unserer Haustür zu einer vereinten Kraft werden und müssen daher präventiv handeln, um dies zu verhindern."
PER_there_can_be_only_one:	"Es kann nur einen geben"
PER_there_can_be_only_one_desc:	"Wir mögen zwar viele der gleichen Werte wie [GER.GetNameDef] teilen, aber es wird immer deutlicher, dass sie sich als allen Nationen der Welt überlegen betrachten. Dies ist eine Beleidigung für unser Volk und unser Erbe und wir müssen ihre falschen Vorstellungen mit Gewalt korrigieren."
PER_iran_first:	"[ROOT.GetNonIdeologyName] Erstens"
PER_iran_first_desc:	"Niemand außer das iranische Volk selbst kann unsere Werte und unsere Kultur angemessen schützen. Deshalb werden wir unsere eigenen Ziele verfolgen und die Welt unserem Willen unterwerfen. "
PER_propagate_political_literature:	"Lokale Oppositionsgruppen gründen"
PER_propagate_political_literature_desc:	"Die Institutionen des imperialen Staates mögen dem Einzelnen unüberwindbar erscheinen, doch in Wirklichkeit sind seine Ressourcen über das ganze Land verteilt und können einer dezentralisierten Widerstandsbewegung nicht standhalten. Um einen Wandel herbeizuführen, werden wir uns diese Schwäche zunutze machen."
PER_propagate_political_literature_tt:	"Schalten Sie §Y$PER_mass_protests$§! Entscheidungen zur Gründung von Oppositionsgruppen in den Staaten frei, damit sie sich nicht mit dem Schah in einen möglichen §RBürgerkrieg§! einlassen."
PER_brown_shirts_tt:	"§YWir werden [?ROOT.PER_fascist_militia_count] Milizabteilungen gewinnen, wenn wir in einen Bürgerkrieg gegen den Schah eintreten oder wenn wir faschistisch werden.§!"
PER_rally_the_reformers_tt:	"Schalten Sie §Y$PER_mass_protests$§! Entscheidungen frei, um eine Operationsbasis für unsere Oppositionsbewegung zu schaffen."
PER_fascism_sway_the_rich_idea_tt:	"Wenn ein Bürgerkrieg beginnt oder die faschistische Bewegung die Macht übernimmt, kommen wir auf die folgende Idee:"
PER_finding_a_shah:	"Einen Schah finden"
PER_finding_a_shah_desc:	"Mit der Niederlage der Pahlavi-Dynastie haben wir die Möglichkeit, einen gefügigeren Schah auf dem Sonnenthron zu installieren, der dem weisen Rat seiner vertrauenswürdigen Berater folgen wird."
PER_finding_a_shah_tt:	"Wir werden im folgenden Ereignis wählen können, wer der neue Schah von [ROOT.GetNameDef] sein soll."
PER_form_sumka:	"Formular SUMKA"
PER_form_sumka_desc:	"Davud Monshizadeh hat kürzlich Zeit in [GER.GetNameDef] verbracht und sich dort mit der nationalsozialistischen Bewegung vertraut gemacht. Nun scheint es, als wolle er in den Iran zurückkehren, um die aktuelle Welle des Nationalismus anzuzapfen und eine neue iranische Ordnung einzuführen."
PER_form_arya_party:	"Arya-Partei gründen"
PER_form_arya_party_desc:	"Hasan Arfa war ein loyaler Militäroffizier und ein überzeugter Verteidiger des Schahs als Abbild Gottes. Er könnte jedoch in der Lage sein, die aufkommenden nationalistischen Gefühle zu nutzen, um die Nation radikal zu reformieren, wie es sich der Schah nicht einmal in seinen kühnsten Träumen vorstellen konnte."
PER_iranian_socialist_revolution:	"Die iranische sozialistische Revolution"
PER_iranian_socialist_revolution_desc:	"Für die Arbeiterklasse des Iran ist der Moment gekommen, sich zu erheben und das schwache Schah-Regime und seine bürgerlichen Vollstrecker zu stürzen. An seiner Stelle soll ein neuer Arbeiter- und Bauernstaat entstehen, der vom Volk selbst geführt wird."
PER_islamic_restoration:	"Widerstand gegen Gharbzadegi"
PER_islamic_restoration_desc:	"Der jüngste Eifer für die Verwestlichung untergräbt die Grundlagen unserer islamischen Kultur und der iranischen Gesellschaft als Ganzes. Die Regierung muss daher mehr tun, um den Zugang zu den Lastern des Westens und seinen ungläubigen Ideologien einzuschränken."
PER_ally_bazaari:	"Verbünden Sie sich mit dem Bazar"
PER_ally_bazaari_desc:	"Die Basare und die Händler, die sie betreiben, sind seit Jahrhunderten Stützen unserer Gemeinschaften. Jetzt stehen sie unter dem zunehmenden Druck der multinationalen Konzerne der Industriemächte. Wenn wir Maßnahmen zum Schutz der Händler ergreifen, werden sie sich wahrscheinlich für unsere konservative Sache einsetzen."
PER_islamic_solidarity:	"Islamische Bruderschaft"
PER_islamic_solidarity_desc:	"Auch wenn wir mit Konfessionen außerhalb des schiitischen Islams nicht immer einer Meinung sind, können wir nicht leugnen, dass wir in den imperialistischen Mächten Westeuropas, die sich weiterhin in unsere nationalen Angelegenheiten einmischen, einen gemeinsamen Feind haben. Aber gemeinsam werden wir sie ein für alle Mal aus unseren Ländern vertreiben."
PER_promote_resistance_levant:	"Anti-imperialistischer Widerstand"
PER_promote_resistance_levant_desc:	"Unsere Bemühungen, mit den Imperialisten fertig zu werden, stoßen aufgrund ihrer überwältigenden Feuerkraft oft auf heftigen Widerstand. Dennoch gibt es keinen Mangel an Menschen, die gerne hinter den feindlichen Linien zu den Waffen greifen würden."
PER_entice_foreign_investment:	"Ausländische Investitionen anlocken"
PER_entice_foreign_investment_desc:	"Unsere Wirtschaft hat aufgrund des Reichtums an natürlichen Ressourcen und einer wachsenden städtischen Bevölkerung, die Arbeit sucht, ein enormes Wachstumspotenzial. Wir brauchen jedoch mehr Investitionen aus dem Ausland, um dieses Wachstum anzukurbeln."
PER_islamic_revolution:	"Die islamische Revolution"
PER_islamic_revolution_desc:	"Die Tage des Schahs sind gezählt. In den Moscheen ertönt der Ruf nach Veränderung, und auf den Straßen hat er nicht mehr das Sagen. Die alte Ordnung wird fallen."
IRQ_decouple_from_the_pound:	"Lösen Sie sich vom Pfund"
IRQ_decouple_from_the_pound_desc:	"Unsere Währung ist nach wie vor an das britische Pfund Sterling gekoppelt, was unsere Fähigkeit einschränkt, eine Wirtschaftspolitik zu betreiben, die unseren Bedürfnissen entspricht. Wir müssen die Verbindung lösen und eine eigene Währungsbehörde einrichten, um den Dinar zu kontrollieren."
IRQ_construct_the_kut_barrage:	"Bau des Staudamms von Kut"
IRQ_construct_the_kut_barrage_desc:	"Die jüngsten Rückschläge beim Bau des Staudamms von Kut müssen so schnell wie möglich überwunden werden, wenn wir eine ausreichende Wasserversorgung für die Bewässerung des Tigris aufrechterhalten wollen."
IRQ_strengthen_mesopotamian_farming:	"Mesopotamische Landwirtschaft stärken"
IRQ_strengthen_mesopotamian_farming_desc:	"Wie viele seiner Vorgänger liegt auch [ROOT.GetNonIdeologyName] im Zentrum seiner beiden großen Flüsse, dem Tigris und dem Euphrat. Das Land zwischen diesen Flüssen ist ideal für die Landwirtschaft. Es gibt jedoch moderne Techniken, die wir einsetzen könnten, um die Ernteerträge zu steigern."
IRQ_extensive_irrigation_projects:	"Umfangreiche Bewässerungsprojekte"
IRQ_extensive_irrigation_projects_desc:	"Ein großer Teil unseres Landes ist trocken und ungünstig für die Landwirtschaft. Durch massive Bewässerungsprojekte könnten wir jedoch in der Lage sein, solche Gebiete in üppige Ackerflächen zu verwandeln."
IRQ_extensive_irrigation_projects_680_tt:	"Wenn wir §Y[680.GetName]§! kontrollieren, werden wir §G1§! zusätzlichen Bauplatz in diesem Staat gewinnen"
IRQ_extensive_irrigation_projects_413_tt:	"Wenn wir §Y[413.GetName]§! kontrollieren, gewinnen wir §G2§! zusätzliche Bauplätze in diesem Staat"
IRQ_rural_electrification:	"Ländliche Elektrifizierung"
IRQ_rural_electrification_desc:	"Während die Elektrifizierung in den städtischen Gebieten stetig voranschreitet, bleibt die Landbevölkerung von dieser Entwicklung abgeschnitten. Wir sollten daher eine nationale Elektrizitätsbehörde einrichten, um die elektrische Infrastruktur gleichmäßig im ganzen Land auszubauen."
IRQ_found_the_iraqi_state_railways:	"[IRQ_found_the_iraqi_state_railways_key]"
IRQ_found_the_iraqi_state_railways_IRQ:	"Gründung der irakischen Staatseisenbahnen"
IRQ_found_the_iraqi_state_railways_KUR:	"Gründung der kurdischen Staatseisenbahn"
IRQ_found_the_iraqi_state_railways_desc:	"Die [ENG.GetAdjective] haben trotz unserer angeblichen Unabhängigkeit immer noch die Kontrolle über unsere Eisenbahninfrastruktur in Form der Mesopotamischen Eisenbahnen. Wir sollten ihnen ein Angebot zum Kauf des Unternehmens machen und es in Irakische Staatsbahn umbenennen."
IRQ_finish_the_berlin_baghdad_railway:	"Fertigstellung der Berlin-Bagdad-Bahn"
IRQ_finish_the_berlin_baghdad_railway_desc:	"Das alte Deutsche Reich hatte lange Zeit den Ehrgeiz, eine Eisenbahnlinie von Berlin nach Bagdad zu errichten, um seine Marinepräsenz im Persischen Golf zu unterstützen. Wir könnten jedoch von den wirtschaftlichen Vorteilen dieser Strecke profitieren, wenn wir sie selbst fertigstellen. "
IRQ_purchase_foreign_equipment:	"Kaufen Sie ausländische Werkzeugmaschinen"
IRQ_purchase_foreign_equipment_desc:	"Wir haben zwar Ackerland und jede Menge Bewässerungsflächen, aber es fehlt uns an den mechanischen Werkzeugen der Industriemächte. Wenn wir in den Import solcher Maschinen investieren würden, könnten wir unsere Ernteproduktion und unseren industriellen Output drastisch steigern."
IRQ_found_southern_steel_plants:	"Südliche Stahlwerke gründen"
IRQ_found_southern_steel_plants_desc:	"Stahl ist von entscheidender Bedeutung für die wirtschaftliche Entwicklung sowie für die Produktion von militärischer Ausrüstung. Bislang gibt es nur wenige einheimische Produzenten, die unseren Bedarf decken können, so dass wir auf Importe angewiesen sind. Das kann so nicht weitergehen, denn die Welt wird immer feindseliger."
IRQ_found_the_state_company_for_iron_and_steel:	"Staatliche Gesellschaft für Eisen und Stahl"
IRQ_found_the_state_company_for_iron_and_steel_desc:	"Die jüngsten Investitionen in die Stahlindustrie haben unserer Wirtschaft gut getan und die Abhängigkeit von Importen verringert. Wir könnten jedoch noch weiter gehen, indem wir unsere eigenen staatlich kontrollierten Industrien gründen, um die Versorgung mit diesen lebenswichtigen Rohstoffen zu kontrollieren."
IRQ_baghdad_colleges_of_engineering_and_education:	"Erweitern Sie die Bagdad Colleges"
IRQ_baghdad_colleges_of_engineering_and_education_desc:	"Bagdad ist seit Jahrhunderten ein Zentrum des Lernens, aber in den letzten Jahrzehnten wurde es zugunsten westlicher Universitäten vernachlässigt. Es ist höchste Zeit, dass wir in unsere Bildungseinrichtungen investieren, um unsere Stadt wieder zum Herz der Wissenschaft zu machen. "
IRQ_strengthen_the_iraqi_dinar:	"[IRQ_strengthen_the_iraqi_dinar_key]"
IRQ_strengthen_the_iraqi_dinar_IRQ:	"Den irakischen Dinar stärken"
IRQ_strengthen_the_iraqi_dinar_KUR:	"Stärken Sie den kurdischen Dinar"
IRQ_strengthen_the_iraqi_dinar_desc:	"Jetzt, wo wir dem [ENG.GetAdjective] die Kontrolle über unsere Währung entrissen haben, können wir endlich unsere eigene Geldpolitik so gestalten, dass sie unserer heimischen Wirtschaft zugute kommt."
IRQ_heavy_industry_investments:	"Investitionen in der Schwerindustrie"
IRQ_heavy_industry_investments_desc:	"Wir machen Fortschritte bei der Versorgung der Industrie mit Rohstoffen, aber es wird immer deutlicher, dass wir mehr staatlich geführte Schwerindustrien aufbauen oder bestehende subventionieren müssen, um mit den Großmächten gleichzuziehen. "
IRQ_local_arms_industry:	"Eine lokale Rüstungsindustrie"
IRQ_local_arms_industry_desc:	"Sollte ein Krieg ausbrechen, können wir uns nicht auf die Lieferung von militärischem Gerät aus dem Ausland verlassen. Daher müssen wir rasch eine eigene einheimische Rüstungsindustrie aufbauen, um unsere Streitkräfte in Krisenzeiten zu unterstützen."
IRQ_invite_foreign_arms_corporations:	"Ausländische Konzerne einladen"
IRQ_invite_foreign_arms_corporations_desc:	"Die Notwendigkeit einer einheimischen Rüstungsindustrie ist von entscheidender Bedeutung, aber uns fehlt das Know-how, um unsere eigene Ausrüstung zu entwickeln und zu produzieren. Wir sollten daher mit ausländischen Unternehmen zusammenarbeiten, um Fabriken zu errichten, die für beide Seiten von Vorteil sind."
IRQ_construct_the_dukan_dam:	"Bauen Sie den Dukan-Damm"
IRQ_construct_the_dukan_dam_desc:	"Die großen Flüsse unseres Landes sollten nicht nur für die Bewässerung, sondern auch für die Stromerzeugung nutzbar gemacht werden. Dazu werden wir einen Staudamm am Zab-Fluss errichten und so einen künstlichen See schaffen."
IRQ_forceful_industrialization:	"Forcierte Industrialisierung"
IRQ_forceful_industrialization_desc:	"Das Tempo der Industrialisierung in [ROOT.GetNameDef] ist viel zu langsam, wenn wir nicht von unseren Gegnern abgehängt werden wollen. Wir müssen ein massives Industrialisierungsprogramm auf die Beine stellen, auch wenn das bedeutet, dass wir die Öffentlichkeit verärgern."
IRQ_nationalize_the_anglo_iraqi_oil_company:	"Verstaatlichung der anglo-irakischen Ölgesellschaft"
IRQ_nationalize_the_anglo_iraqi_oil_company_desc:	"Die Anglo-Irakische Ölgesellschaft dominiert weiterhin unsere wirtschaftlichen und außenpolitischen Angelegenheiten, indem sie unseren Reichtum in die Kriegsschiffe der [ENG.GetAdjective] Navy fließen lässt, was uns wiederum davon abhält, unsere eigenen Angelegenheiten zu kontrollieren. Es ist an der Zeit, dass wir diese Scharade beenden und das Unternehmen verstaatlichen, damit unser eigenes Volk davon profitiert."
IRQ_anglo_iraqi_oil_expansion:	"Anglo-irakische Ölexpansion"
IRQ_anglo_iraqi_oil_expansion_desc:	"Das derzeitige Abkommen mit der Anglo-Irakischen Ölgesellschaft mag unser Volk verärgern, aber es ist kurzsichtig und kann die Vorteile, die es unserer Wirtschaft bringt, und den Schutz, den wir durch die [ENG.GetAdjective] erhalten, nicht ermessen."
IRQ_form_opec:	"Die OPEC bilden"
IRQ_form_opec_desc:	"Die Großmächte sind völlig abhängig vom Ölfluss in ihre Fabriken und Fahrzeuge. Wenn die ölproduzierenden Nationen der Welt bei der Ölproduktion und der Sicherheit zusammenarbeiten würden, könnten wir die Großmächte endlich für all das zur Rechenschaft ziehen, was sie uns angetan haben."
IRQ_demand_greater_stake_in_the_company:	"Fordern Sie eine stärkere Beteiligung an dem Unternehmen"
IRQ_demand_greater_stake_in_the_company_desc:	"Wir haben viel getan, um den Betrieb der Ölanlagen für die [ENG.GetAdjective] so zuverlässig wie möglich zu machen. Daher scheint es nur fair, dass sie einen größeren Anteil an dem Wohlstand haben, den die Ölversorgung generiert."
IRQ_expand_oil_production:	"Ölförderung ausweiten"
IRQ_expand_oil_production_desc:	"Geologen glauben, dass es in unserem Land eine Fülle von unerschlossenen Ölreserven gibt. Diese Ressourcen könnten unserem Volk großen Reichtum bescheren und müssen so schnell wie möglich ausgebeutet werden."
IRQ_export_infrastructure:	"Export-Infrastruktur"
IRQ_export_infrastructure_desc:	"Öl ist für die Weltwirtschaft von entscheidender Bedeutung. Wenn wir in unsere Exportinfrastruktur investieren, können wir [ROOT.GetNameDef] auf die Landkarte setzen und gleichzeitig finanziell davon profitieren. "
IRQ_is_kurdistan:	"§AWir spielen als Kurdistan§!"
IRQ_royal_iraqi_army:	"[IRQ_royal_iraqi_army_key]"
IRQ_royal_iraqi_army_IRQ:	"Königliche Irakische Armee"
IRQ_royal_iraqi_army_KUR:	"Kurdische Armee"
IRQ_royal_iraqi_army_desc:	"Die Gefahr eines Krieges, sei es durch unsere Nachbarn oder durch weiter entfernte Länder, wird immer wahrscheinlicher. Darüber hinaus gibt es eine Fülle von innerstaatlichen Gruppierungen, die bereit sind, unsere Nation zu zerreißen. Das Einzige, was sie in Schach halten kann, ist die Stärke unserer Streitkräfte."
IRQ_approach_tribes_for_support:	"Bitten Sie Stämme um Unterstützung"
IRQ_approach_tribes_for_support_desc:	"Es gibt viele ländliche Gemeinden, die an der traditionellen Lebensweise der Stämme festhalten und die uns seit der Gründung unseres Staates weitgehend feindlich gesinnt sind. Vielleicht haben wir einfach noch nicht die richtigen Anreize gefunden, um sie für uns zu gewinnen."
IRQ_establish_iraqi_coastal_defense_force:	"[IRQ_establish_iraqi_coastal_defense_force_key]"
IRQ_establish_iraqi_coastal_defense_force_IRQ:	"Irakische Küstenverteidigungskräfte aufstellen"
IRQ_establish_iraqi_coastal_defense_force_KUR:	"Aufbau einer kurdischen Küstenverteidigungstruppe"
IRQ_establish_iraqi_coastal_defense_force_desc:	"Unsere Küste mag kurz sein, aber sie liegt an einer der wichtigsten Versorgungsrouten der Welt für den Ölexport in den Westen. Daher müssen wir eine Seestreitkraft aufstellen, um unsere Interessen in diesem Gebiet zu schützen."
IRQ_invite_foreign_advisors:	"Ausländische Berater einladen"
IRQ_invite_foreign_advisors_desc:	"Uns fehlt das Fachwissen, um mit jeder Seemacht in der Region mithalten zu können. Wir könnten jedoch unsere Streitkräfte aufwerten, indem wir ausländische Experten zur Ausbildung unserer Marineoffiziere heranziehen."
IRQ_purchase_small_ships:	"Kleine Schiffe kaufen"
IRQ_purchase_small_ships_desc:	"$SMB_purchase_destroyers_and_subs_desc$"
IRQ_create_repair_yards:	"Gründung des Tiefseehafens Umm Qasr"
IRQ_create_repair_yards_desc:	"Die Entwicklung eines Tiefseehafens könnte einen großen Beitrag dazu leisten, unsere Fähigkeit zum Export von Gütern zu verbessern und gleichzeitig Einrichtungen für Militärschiffe zum Andocken und Nachschub bereitzustellen."
IRQ_navy_research_bonus:	"Technologischer Fortschritt in der Marine"
IRQ_navy_research_bonus_desc:	"Bislang waren wir auf gebrauchte Schiffe aus dem Ausland angewiesen, die schon veraltet waren, bevor wir sie überhaupt gekauft hatten. Um nicht ins Hintertreffen zu geraten, müssen wir unsere eigene Marinetechnologie erforschen und entwickeln und unsere Flotte nachrüsten oder neu aufbauen."
IRQ_infantry_focus:	"Stärken Sie die Infanterie"
IRQ_infantry_focus_desc:	"Die Großmächte können mit ihren mechanisierten Monstrositäten spielen, so viel sie wollen, die Realität ist, dass jeder Krieg letztlich von der Infanterie geführt wird. Aus diesem Grund wird das Budget der Armee erheblich aufgestockt, um ihre Ausbildung zu verbessern."
IRQ_scavenging:	"Nutzen Sie die Plünderungstaktik"
IRQ_scavenging_desc:	"Die Ausrüstung, die wir nicht selbst herstellen können, taucht oft in den Händen ausländischer Aggressoren auf. Wir sollten daher unsere Streitkräfte darauf trainieren, wertvolle militärische Ausrüstung zu erkennen und zu erbeuten, wann immer sie verfügbar ist."
IRQ_cavalry_integration:	"Integration der Kavallerie"
IRQ_cavalry_integration_desc:	"Auch wenn die Motorisierung in Zukunft zum Standard werden könnte, benötigt unsere Armee Unterstützung, die wir vorerst nur in Form von Kavallerie leisten können. "
IRQ_modernization:	"Streben Sie nach Modernisierung"
IRQ_modernization_desc:	"Mit veralteter Ausrüstung durch die Straßen zu marschieren, mag ausreichen, um unsere eigenen Leute in Schach zu halten, aber es wird wenig dazu beitragen, die Aggression einer fremden Macht abzuschrecken. Wir müssen unsere Ausrüstung modernisieren und unsere Streitkräfte als ernstzunehmende Abschreckung etablieren."
IRQ_purchase_mechanized_equipment:	"Kaufen Sie mechanisierte Ausrüstung"
IRQ_purchase_mechanized_equipment_desc:	"Der langsame Marsch der Infanterie ist durch das Aufkommen der mechanisierten Infanterie im Ausland zu einer eklatanten Schwäche unserer Streitkräfte geworden. Es ist an der Zeit, dass wir in die Mechanisierung unserer eigenen Streitkräfte investieren, bevor es zu spät ist."
IRQ_purchase_armored_equipment:	"Kaufen Sie gepanzerte Ausrüstung"
IRQ_purchase_armored_equipment_desc:	"Unsere Streitkräfte sind nicht so schlagkräftig wie die unserer Gegner, weil wir uns zu sehr auf die traditionelle Infanterie verlassen. Der Panzer ist eindeutig die Zukunft der Landkriegsführung und wir müssen jemanden finden, der bereit ist, uns seine überschüssigen Modelle zu verkaufen."
IRQ_training:	"Verbessern Sie die Ausbildungsprogramme der Armee"
IRQ_training_desc:	"Die Ausbildung der Truppen in [IRQ.GetNonIdeologyName] ist veraltet und könnte durch die Einführung von Reformen, die denen anderer Nationen entsprechen, verbessert werden."
IRQ_army_research_bonus:	"Modernisieren Sie die Militärdoktrinen"
IRQ_army_research_bonus_desc:	"Viele unserer Militäroffiziere sind entweder ehemalige Soldaten des alten Osmanischen Reiches oder haben eine Grundausbildung bei den [ENG.GetAdjective] Streitkräften erhalten. In jedem Fall sind ihre Taktiken veraltet und müssen sofort aktualisiert werden."
IRQ_special_projects:	"Nukleares Forschungszentrum Tuwaitha"
IRQ_special_projects_desc:	"Gerüchte über atomare Geheimnisse aus dem Ausland haben ihren Weg zu unseren Wissenschaftlern und Ingenieuren gefunden, die darauf brennen, ihre Fähigkeiten zu demonstrieren. Mit ihrem Fachwissen und genügend finanziellen Mitteln könnten wir in der Lage sein, Waffen von unvorstellbarer Stärke zu entwickeln."
IRQ_special_forces:	"Spezialeinheiten"
IRQ_special_forces_desc:	"In manchen Kriegssituationen kann eine Handvoll Spezialtruppen, die sich hinter die feindlichen Linien schleichen, einen verheerenden Schlag versetzen, den eine ganze Armee im offenen Gelände nicht geschafft hätte. Wir brauchen solche eigenen Kräfte in Bereitschaft."
IRQ_expand_habbaniya_airbase:	"Habbaniya Luftwaffenstützpunkt ausbauen"
IRQ_expand_habbaniya_airbase_desc:	"Der Luftwaffenstützpunkt Habbaniya hat sich seit seiner Einrichtung durch [ENG.GetAdjective] zum Herzstück der Luftoperationen im Irak entwickelt. Um unsere wachsende Luftwaffe besser unterbringen zu können, sollten wir die Einrichtungen dort ausbauen. "
IRQ_independent_flight_schools:	"Unabhängige Flugschulen"
IRQ_independent_flight_schools_desc:	"Unsere Piloten wurden größtenteils von der [ENG.GetAdjective] im Ausland ausgebildet, aber wir haben jetzt eine kritische Masse an Piloten, so dass wir vielleicht damit beginnen können, unsere Piloten im Inland auszubilden."
IRQ_purchase_british_aircraft:	"Kauf von britischen Flugzeugen"
IRQ_purchase_british_aircraft_desc:	"Aufgrund unserer Beziehungen zur [ENG.GetAdjective] RAF erscheint es nur logisch, mehr Flugzeuge von ihr zu beschaffen."
IRQ_purchase_alternative_aricraft:	"Alternative Flugzeuge kaufen"
IRQ_purchase_alternative_aricraft_desc:	"Um eine übermäßige Abhängigkeit von einem Lieferanten zu vermeiden, sollten wir uns bei der Beschaffung von Flugzeugen für unsere aufstrebenden Streitkräfte nicht nur auf die [ENG.GetAdjective] verlassen. Viele unserer Offiziere plädieren für ein Geschäft mit den [ITA.GetAdjective]."
IRQ_bomber_training:	"Bomber-Ausbildung"
IRQ_bomber_training_desc:	"Unserer Luftwaffe fehlt es an Erfahrung mit größeren Flugzeugen, die für Bombeneinsätze genutzt werden könnten. Diese Qualifikationslücke muss so schnell wie möglich geschlossen werden."
IRQ_naval_air_support:	"Luftunterstützung durch die Marine"
IRQ_naval_air_support_desc:	"Es ist ein Narrenspiel zu glauben, wir könnten eine Marine entwickeln, die es mit den Großmächten aufnehmen kann. Aber die Entwicklung von Flugzeugen, die auf Marinewaffen abzielen können, kann das Spielfeld zu einem Bruchteil der Kosten eines einzigen Schiffes ausgleichen."
IRQ_fighter_training:	"Kampfflugzeug-Ausbildung"
IRQ_fighter_training_desc:	"Alle unsere militärischen und wirtschaftlichen Planungen werden umsonst sein, wenn unsere Piloten ihre Flugzeuge nicht angemessen einsetzen können, um unseren Himmel vor feindlichen Bombern zu schützen."
IRQ_air_research_bonus:	"Aerodynamik und Avionikforschung"
IRQ_air_research_bonus_desc:	"Der Bereich der Avionik macht angesichts der weltweiten Konflikte rasante Fortschritte. Wir brauchen eine Einrichtung, in der unsere Ingenieure Spitzentechnologie für die Luftwaffe entwickeln können, wenn wir eine Chance haben wollen, eine Macht in der Region zu werden."
IRQ_project_babylon_focus:	"Projekt Babylon"
IRQ_project_babylon_focus_desc:	"Um künftige Kriege zu gewinnen, müssen wir uns die schweren Waffen beschaffen, die wir brauchen, um unsere Feinde zu beherrschen, egal, wie unterlegen wir sein mögen. Wir sollten uns daher bemühen, Einrichtungen zu eröffnen, die sich der Erforschung und Entwicklung experimenteller Waffen widmen."
IRQ_invest_in_ordnance_mountain_howitzers:	"Investieren Sie in Panzerhaubitzen"
IRQ_invest_in_ordnance_mountain_howitzers_desc:	"Unser Land ist im Norden und Osten von Bergen eingeschlossen, aber unseren Streitkräften fehlt es an angemessener Feuerkraft für den Kampf in solchen Gebieten. Vielleicht ist es an der Zeit, dass wir in spezialisierte Gebirgsartillerie investieren, um sie zu unterstützen, falls es zu einem solchen Konflikt mit unseren Nachbarn kommt."
IRQ_develop_the_kuwaiti_port:	"Entwickeln Sie den kuwaitischen Hafen"
IRQ_develop_the_kuwaiti_port_desc:	"Seit Kuwait unter unserer rechtmäßigen Kontrolle steht, hat sich unsere Küstenlinie erheblich vergrößert. Dies hat uns die Möglichkeit gegeben, unsere Marineeinrichtungen noch weiter auszubauen, um eine noch größere Präsenz im Persischen Golf zu unterstützen."
IRQ_develop_the_kuwaiti_port_tt:	"Fügen Sie einen §G1§Y Marinestützpunkt §!§!in jeder Provinz hinzu. "
IRQ_form_the_independent_mechanized_brigade:	"Bilden Sie die Unabhängige Mechanisierte Brigade"
IRQ_form_the_independent_mechanized_brigade_desc:	"Mit dem Kauf der entsprechenden Ausrüstung und viel Training glauben unsere Streitkräfte, dass sie bereit sind, ihre ersten mechanisierten Einheiten einzusetzen und zu nutzen."
IRQ_form_the_independent_mechanized_brigade_tt:	"Erstellen Sie die Al-Mechanikiyah §YMechanized§! Divisionsvorlage und setzen Sie die §Y1§! Einheit ein."
IRQ_expand_camel_corps:	"Erweitern Sie das Kamelkorps"
IRQ_expand_camel_corps_desc:	"Die [ENG.GetAdjective] demonstrierten die Vielseitigkeit der Kamele im letzten Großen Krieg, indem sie ein Korps von ihnen in Nord- und Ostafrika einsetzten. Einige in unseren Streitkräften glauben, dass uns eine solche Truppe auch auf unserem eigenen Territorium einen Vorteil verschaffen könnte."
IRQ_purchase_british_aircraft_AAT_tt:	"§AWir erhalten eine größere Ausrüstungssubvention, während $IRQ_anglo_iraqi_treaty$ aktiv ist. §!"
IRQ_purchase_british_aircraft_treaty_tt:	"§AWir erhalten eine größere Menge an Ausrüstung, während $IRQ_anglo_iraqi_treaty$ aktiv ist.§!"
IRQ_align_afghanistan_fasc:	"Afghanistan einladen"
IRQ_align_afghanistan_fasc_desc:	"[AFG.GetNameDef] ist seit langem als Pufferstaat zwischen den [SOU.GetAdjective]s und [ENG.GetAdjective] gefangen. Vielleicht können wir sie durch Zusammenarbeit zu einer angemesseneren Position in der Region erheben."
IRQ_rally_behind_the_hashemite_dynasty:	"Versammeln Sie sich hinter der Haschemiten-Dynastie"
IRQ_rally_behind_the_hashemite_dynasty_desc:	"Die haschemitische Familie muss der Mittelpunkt sein, von dem aus wir weiterhin ein Gefühl der irakischen Nationalität aufbauen. Nach Jahren an der Macht sind wir kurz davor, sie wirklich zu festigen."
IRQ_align_afghanistan_fasc_tt:	"§Y[AFG.GetNameWithFlag]§! ist zu unserer Fraktion eingeladen"
IRQ_anti_western_alliance_per_tt:	"§Y[PER.GetNameWithFlag]§! wird in unsere Fraktion eingeladen"
IRQ_anti_western_alliance_tur_tt:	"§Y[TUR.GetNameWithFlag]§! wird in unsere Fraktion eingeladen"
IRQ_refuge_for_the_grand_mufti:	"Zuflucht für den Großmufti"
IRQ_refuge_for_the_grand_mufti_desc:	"Nach den jüngsten Unruhen in Palästina ist Amin al-Husseini, der umstrittene Großmufti von Jerusalem, von den Briten ins Exil geschickt worden. Um die anti-britischen Gemüter in unserem Land zu besänftigen, könnten wir ihm vorerst Zuflucht bieten."
IRQ_religious_resistance:	"Religiöser Widerstand"
IRQ_religious_resistance_desc:	"Wenn der Großmufti unter unserem Schutz steht, können wir vielleicht mit ihm zusammenarbeiten, um in der gesamten arabischen Welt den Widerstand gegen die unterdrückerischen westlichen Regime, die uns aufgezwungen wurden, zu stärken."
IRQ_protector_of_the_gulf:	"Beschützer des Golfs"
IRQ_protector_of_the_gulf_desc:	"Wir haben uns gegenüber den westlichen Mächten als vertrauenswürdiger Verbündeter erwiesen. Vielleicht sind sie bereit, sich aus der Region zurückzuziehen, wenn wir im Gegenzug die Sicherheit des Persischen Golfs von nun an gewährleisten."
IRQ_restoration_of_hejaz:	"Wiederherstellung des Hejaz"
IRQ_restoration_of_hejaz_desc:	"Die [SAU.GetAdjective]s haben vor nicht allzu langer Zeit das Königreich Hejaz zerschlagen. Und damit haben sie den Einfluss der Haschemiten-Dynastie beschnitten. Es ist an der Zeit, dass wir es ihnen mit gleicher Münze heimzahlen."
IRQ_reach_out_to_jordan:	"Reach Out to Jordan"
IRQ_reach_out_to_jordan_desc:	"Unsere Verwandten regieren Jordanien weiterhin unter dem Schutz der [ENG.GetAdjective]. Wir könnten jedoch in der Lage sein, sie und die [ENG.GetAdjective] dazu zu bewegen, uns im Austausch für die Übernahme ihrer Verteidigung einen größeren politischen und wirtschaftlichen Zusammenhalt zu ermöglichen."
IRQ_status_of_lebanon:	"Status des Libanon"
IRQ_status_of_lebanon_desc:	"Da Syrien nun fest unter unserer Kontrolle ist, richtet sich die Aufmerksamkeit auf die Zukunft des Libanon. Vielleicht können wir unser Glück ein weiteres Mal versuchen und verlangen, dass auch dieser Staat unter unsere Kontrolle gestellt wird."
IRQ_regional_economic_integration:	"Regionale wirtschaftliche Integration"
IRQ_regional_economic_integration_desc:	"Wir müssen massiv in die Infrastruktur der Region investieren, damit wir alle vom langfristigen Wirtschaftswachstum profitieren können."
IRQ_regional_military_integration:	"Regionale militärische Integration"
IRQ_regional_military_integration_desc:	"Wir verfügen nicht über die militärischen Produktionskapazitäten der Großmächte, aber vielleicht können wir durch eine regionale Investition damit beginnen, den Rückstand aufzuholen."
IRQ_demand_palestine:	"Fordern Sie Palästina"
IRQ_demand_palestine_desc:	"Die Briten haben sich in Bezug auf den Schutz des palästinensischen Volkes in den Mandatsgebieten als unzuverlässig erwiesen. Während die Augen der Welt auf sie gerichtet sind, können wir sie vielleicht dazu zwingen, das Mandat unter unsere Kontrolle zu bringen."
IRQ_hashemite_arab_federation:	"Haschemitische Arabische Föderation"
IRQ_hashemite_arab_federation_desc:	"Da unsere Mitglieder der Haschemiten-Dynastie in der gesamten Region etabliert sind, haben wir die Möglichkeit, unsere Königreiche zu einer größeren Haschemitischen Arabischen Föderation zu vereinen."
IRQ_fligerfuhrer_irak:	"Fliegerführer Irak"
IRQ_fligerfuhrer_irak_desc:	"Unser Militär ist der [ENG.GetAdjective] waffentechnisch hoffnungslos unterlegen, aber mit Flugzeugen und Piloten unserer Verbündeten können wir das Gleichgewicht vielleicht zu unseren Gunsten verändern."
IRQ_commander_of_the_faithful:	"Befehlshaber der Gläubigen"
IRQ_commander_of_the_faithful_desc:	"Jetzt, da wir die Mission übernommen haben, die arabischen Völker unter unserer Herrschaft zu vereinen, ist es klug, sie so gut wie möglich für unsere Sache zu rekrutieren. Abd Al-Ilah sieht sich in der Lage, den Titel Amīr al-Mu'minīn auf sich zu nehmen, wie ihn einst Hussein bin Ali al-Hashimi trug."
IRQ_increase_anglo_iraqi_economic_ties:	"Anglo-irakische Wirtschaftsbeziehungen ausbauen"
IRQ_increase_anglo_iraqi_economic_ties_desc:	"Es wäre dumm von uns, die engen wirtschaftlichen Beziehungen, die wir mit [ENG.GetAdjective] entwickelt haben, nicht zu nutzen. "
IRQ_raf_levies_focus:	"RAF-Abgaben"
IRQ_raf_levies_focus_desc:	"Die [ENG.GetAdjective] haben eine Reihe von Truppen auf unserem Territorium stationiert, um ihre Luftwaffenstützpunkte zu sichern. Vielleicht könnten wir unsere Verteidigungsfähigkeiten verbessern, indem wir besser mit solchen Kräften zusammenarbeiten."
IRQ_increase_prime_ministers_powers:	"Stärken Sie die Befugnisse des Premierministers"
IRQ_increase_prime_ministers_powers_desc:	"Es hat sich gezeigt, dass das irakische Volk keine absolute Herrschaft unter der Haschemiten-Dynastie wünscht, und so bietet sich uns jetzt die Gelegenheit, den verfassungsmäßigen Charakter ihrer Herrschaft ein für alle Mal zu sichern und den Irak auf einen westlicheren Weg zu bringen."
IRQ_party_of_national_brotherhood:	"Partei der Nationalen Bruderschaft"
IRQ_party_of_national_brotherhood_desc:	"Zu lange hat sich die Regierung den [ENG.GetAdjective] Launen gebeugt. Nur die Partei der Nationalen Bruderschaft hat das Potenzial, [IRQ.GetNonIdeologyName] zu Größe zu verhelfen."
IRQ_bakr_sidqi_coup:	"Der Coup von Bakr Sidqi"
IRQ_bakr_sidqi_coup_desc:	"Das derzeitige Regime ist schwach und fehlgeleitet. Unter der Führung von Bakr Sidqi werden wir es stürzen und eine unabhängige Zukunft für das Volk von [ROOT.GetNonIdeologyName] sichern."
IRQ_bakr_sidqi_tt:	"§Y$IRQ_bakr_sidqi$ wird als unabsetzbarer Berater angeheuert.§!"
IRQ_a_new_caliph:	"Der neue Kalif"
IRQ_a_new_caliph_desc:	"Nach Jahren des Kampfes haben wir uns als herausragende Macht in der islamischen Welt etabliert. Daher ist es an der Zeit, das Erbe von Hussein bin Ali fortzuführen und ein Kalifat unter der Führung der haschemitischen Dynastie wiederzuerrichten."
IRQ_demand_syria_hashemite:	"Syrische Vereinigung vorschlagen"
IRQ_demand_syria_hashemite_desc:	"Syrien stand 1920 kurz unter der Herrschaft von Faisal I., wurde uns aber durch französischen Verrat entrissen. Jetzt können wir aus einer Position der Stärke heraus verhandeln und die Rückgabe unseres rechtmäßigen Territoriums fordern. "
IRQ_kurdish_outreach:	"Kurdische Annäherung"
IRQ_kurdish_outreach_desc:	"Die Kurden im Nordirak haben das Potenzial, unsere Autorität über die Region massiv zu stören, wenn sie sich gegen uns verbünden würden. Wir müssen uns daher bemühen, sie in die breitere irakische Nation zu integrieren, selbst wenn dies bedeutet, ihnen ein gewisses Maß an Autonomie zu gewähren."
IRQ_assasination_of_sidqi:	"Ermordung von Bakr Sidqi"
IRQ_assasination_of_sidqi_desc:	"[IRQ_assassination_of_sidqi_desc_key]"
IRQ_assassination_of_sidqi_desc_leader:	"Bakr Sidqi ist es seit dem Sturz der vorherigen Regierung nicht gelungen, die Nation zu vereinen. In der politischen Elite schwelt der Unmut, und die breite irakische Bevölkerung misstraut einem Kurden, der so viel Einfluss auf die nationalen Angelegenheiten hat. Wenn sich die Gelegenheit ergibt, ist es fast unvermeidlich, dass jemand versuchen wird, sein Leben zu beenden..."
IRQ_assassination_of_sidqi_desc_not_leader:	"Bakr Sidqi plant eindeutig einen Staatsstreich gegen unsere Regierung, und viele unserer Offiziere haben berichtet, dass er versucht, sich ihre Loyalität für den Fall zu sichern, dass so etwas passiert. Wir müssen ihn beseitigen, wenn wir unsere Herrschaft behalten wollen."
IRQ_attempted_assasination_of_sidqi:	"Versuchte Ermordung von Sidqi"
IRQ_attempted_assasination_of_sidqi_desc:	"Trotz massiver Ressentiments in der Bevölkerung und der politischen Elite waren die jüngsten Attentatsversuche auf Bakr Sidqi bisher erfolglos. Es scheint jedoch, dass wir die Sicherheits- und Geheimdienstmaßnahmen verstärken müssen, um das neue Regime vor Dissidenten zu schützen."
IRQ_increase_italian_business_relations:	"Import aus [ITA.GetNonIdeologyName]"
IRQ_increase_italian_business_relations_desc:	"Wir können es uns nicht erlauben, in Bezug auf unsere wirtschaftlichen Bedürfnisse völlig abhängig von den [ENG.GetAdjective] zu bleiben. Glücklicherweise sind die [ITA.GetAdjective] mehr als bereit, uns bei diesem Unterfangen zu helfen."
IRQ_revoke_anglo_iraq_treaty:	"Den anglo-irakischen Vertrag widerrufen"
IRQ_revoke_anglo_iraq_treaty_desc:	"Der einseitige anglo-irakische Vertrag hat die Entwicklung unserer Nation lange genug gebremst. Aber jetzt haben wir die Kraft des Willens, uns dem [ENG.GetAdjective] zu widersetzen und werden den Vertrag endlich widerrufen. Unabhängig von den Konsequenzen."
IRQ_revoke_anglo_iraq_treaty_tt:	"§Die _[ENG.GetNameDefCap] werden uns wahrscheinlich den Krieg erklären, weil wir den Vertrag widerrufen haben!§!"
IRQ_restore_regent:	"Setzen Sie den Regenten wieder ein"
IRQ_restore_regent_desc:	"Der törichte Opportunismus von Rashid Ali al-Gaylani und dem Goldenen Quadrat hat unserer Nation nur Schaden zugefügt. Wir müssen uns ein für alle Mal von ihrem giftigen Einfluss befreien, indem wir sie beseitigen und die alte Regierung wieder an die Macht bringen."
IRQ_support_the_allied_war_effort:	"Unterstützen Sie die Kriegsanstrengungen der Alliierten"
IRQ_support_the_allied_war_effort_desc:	"Ob unser Volk es nun wahrhaben will oder nicht, unsere Zukunft liegt in den Händen der alliierten Nationen der Welt. Wir müssen unser Engagement für ihre Sache unter Beweis stellen und uns einen Platz in der entstehenden Weltordnung sichern."
IRQ_allied_training:	"Alliierte Ausbildung"
IRQ_allied_training_desc:	"Unsere Verbündeten sind bereit, uns einen Teil ihres Fachwissens zu vermitteln, das sie in den letzten Jahren im Konflikt mit unseren Feinden erworben haben. Wir werden diese Hilfe annehmen, um unsere Truppen so gut wie möglich auf den Einsatz an der Front vorzubereiten."
IRQ_renegotiate_treaty:	"Den anglo-irakischen Vertrag neu verhandeln"
IRQ_renegotiate_treaty_desc:	"Wir haben bewiesen, dass wir keine Bedrohung für [ENG.GetAdjective] Interessen in der Region sind und ihnen ein potenzieller Verbündeter sein können, sollte sich die Notwendigkeit ergeben. Daher sollten wir den anglo-irakischen Vertrag endlich auf Augenhöhe neu verhandeln."
IRQ_strengthen_the_golden_square:	"Stärken Sie das Goldene Quadrat"
IRQ_strengthen_the_golden_square_desc:	"Das Goldene Quadrat, das aus vier hochrangigen Militäroffizieren besteht, ist zu einem Brennpunkt für Panarabismus und Anti-[ENG.GetAdjective]-Stimmung geworden. Vielleicht ist es an der Zeit, sie vollständig in die Regierung einzubinden und die notwendigen Reformen zur Stärkung der Nation einzuleiten."
IRQ_iraqi_al_futuwwa:	"Bilden Sie die irakische Al-Futuwwa"
IRQ_iraqi_al_futuwwa_desc:	"Damit unsere Nation stark wird, müssen wir Jugendorganisationen gründen, die unser Volk im Kampf für eine glorreichere Zukunft ausbilden!"
IRQ_seek_axis_investment:	"Suchen Sie nach Achseninvestitionen"
IRQ_seek_axis_investment_desc:	"Unsere Wirtschaft stagniert und muss diversifiziert werden, wenn wir uns gegen ausländische Aggressionen wappnen wollen. Vielleicht wären unsere Freunde in Übersee bereit, hier zu investieren, um unsere Beziehungen zu vertiefen. "
IRQ_axis_training:	"Achsenausbildung"
IRQ_axis_training_desc:	"$IRQ_allied_training_desc$"
IRQ_eliminate_the_golden_square:	"Eliminieren Sie das Goldene Quadrat"
IRQ_eliminate_the_golden_square_desc:	"Das Goldene Quadrat und seine Anhänger wollen, dass wir wegen ihres Wunsches, die arabische Welt zu vereinen, einen regionalen Konflikt und eine interne Spaltung riskieren. Sie müssen beseitigt werden, bevor sie unser Land zerstören."
IRQ_embargo_the_axis_powers:	"Embargo gegen die Achsenmächte"
IRQ_embargo_the_axis_powers_desc:	"Die Achsenmächte sind eine Bedrohung für den Weltfrieden und müssen mit allen Mitteln ausgehungert werden, die sie zum Führen eines Krieges benötigen. "
IRQ_al_muthanna_club:	"Al-Muthanna Vereine"
IRQ_al_muthanna_club_desc:	"Es mangelt nicht an Vereinen und Gruppen, die ein panarabisches Regime in der Region errichten wollen. Wir werden die Finanzierung dieser Organisationen sicherstellen, um zu gewährleisten, dass sie weiter wachsen und die Bevölkerung auf dieses Ziel einschwören."
IRQ_arab_free_legion:	"Freie Arabische Legion"
IRQ_arab_free_legion_desc:	"Araber aus aller Welt haben sich freiwillig gemeldet, um gegen die alten Mächte zu kämpfen, die uns jahrzehntelang zurückgehalten haben. Vielleicht können wir darauf aufbauen und Truppen von jenseits unserer Grenzen rekrutieren, die an der Seite unseres Militärs gegen unsere gemeinsamen Feinde kämpfen."
IRQ_arab_free_legion_tt:	"Setzen Sie §Y$IRQ_arab_free_legion_cat$§! Entscheidungen zur Rekrutierung von Divisionen aus der gesamten arabischen Welt um."
IRQ_curtail_arabism:	"Zügeln Sie den Panarabismus"
IRQ_curtail_arabism_desc:	"Die wachsende Besessenheit unseres Volkes vom Panarabismus entfremdet die nichtarabischen Gemeinschaften, die unsere Nation ausmachen, und bringt uns auf Kollisionskurs mit den Großmächten. Wir müssen dieser Ideologie Einhalt gebieten, bevor sie uns vernichtet."
IRQ_strengthen_relations_with_iran:	"Beziehungen zum Iran stärken"
IRQ_strengthen_relations_with_iran_desc:	"Auch wenn die Völker [IRQ.GetAdjective] und [PER.GetAdjective] nicht immer einer Meinung waren, so haben wir doch ein gemeinsames Ziel: die Modernisierung unserer Nationen und den Widerstand gegen die westliche Vorherrschaft in der Region. Es ist an der Zeit, eine konstruktive Beziehung zueinander aufzubauen, damit wir unsere Ziele gemeinsam erreichen können."
IRQ_strengthen_relations_with_turkey:	"Stärkung der Beziehungen zur Türkei"
IRQ_strengthen_relations_with_turkey_desc:	"Die [TUR.GetAdjective] haben sich an vorderster Front gegen die westlichen Mächte gewehrt, auch wenn es sie letztlich ihr Reich gekostet hat. Als solche sind wir natürliche Verbündete und wir sollten mehr tun, um bessere Beziehungen zu ihnen aufzubauen."
IRQ_anti_western_alliance:	"Antiwestliche Allianz"
IRQ_anti_western_alliance_desc:	"Wenn die dominierenden Mächte der Region ihre militärische Macht bündeln und sich verpflichten würden, sich gegenseitig zu verteidigen, hätten wir eine echte Chance, den westlichen Mächten, die sich so oft in unsere Angelegenheiten einmischen, endlich die Stirn zu bieten."
IRQ_carve_up_syria:	"Aufteilung Syriens"
IRQ_carve_up_syria_desc:	"Syrien hätte rechtmäßig zu unserem Reich gehören sollen, wurde uns aber von den Franzosen geraubt. Außerdem erheben unsere Freunde in [TUR.GetNonIdeologyName] ebenfalls Anspruch auf Teile des Gebiets. Vielleicht ist es an der Zeit, dass wir einen gemeinsamen Anspruch auf das Gebiet erheben, während die Welt abgelenkt ist."
IRQ_encourage_federalism:	"Föderalismus fördern"
IRQ_encourage_federalism_desc:	"Wir sollten uns bemühen, den Kurden und Assyrern ein gewisses Maß an Autonomie zuzugestehen und die lokalen Sprachen und Praktiken in unserem Land zu legalisieren, um alle irakischen Bürger unter einem Banner zu vereinen."
IRQ_reapproachment_with_the_tribes:	"Vorwürfe an die Stämme"
IRQ_reapproachment_with_the_tribes_desc:	"Es gibt immer noch viele Stammesführer, die kein volles Vertrauen in unsere Regierung setzen. Wir sollten sie besänftigen und in ihre lokalen Regionen investieren, um sicherzustellen, dass ihre Loyalität uns und nur uns gilt."
IRQ_reapproachment_with_the_tribes_tt:	"§YAhmed Barzani§! und §YMustafa Barzani§! werden als Stufe 3 §YGeneral§! verfügbar."
IRQ_abd_al_illah_fm_tt:	"§YAbd Al-Ilah§! wird als Stufe 3 §YFeldmarschall§! verfügbar"
IRQ_greater_iraq:	"Großer Irak"
IRQ_greater_iraq_desc:	"Da nun ein größerer Teil der arabischen Bevölkerung sicher unter unserer Herrschaft steht, scheint es nur angemessen, dass wir zu diesem Anlass die Einführung einer breiteren Definition von [IRQ.GetNonIdeologyName] verkünden. "
IRQ_greater_iraq_tt:	"Schalten Sie §Y$greater_iraq_decision_cat$§! Entscheidungen zur Gewinnung von Kernen in den Staaten des Nahen Ostens frei, die uns gehören."
IRQ_arab_republic_core_tt:	"Schalten Sie §Y$united_arab_republic_cat$§! Entscheidungen frei, um Kerne in den arabischen Staaten zu gewinnen, die uns gehören."
IRQ_take_advantage_of_british_weakness:	"Machen Sie sich die Situation zunutze"
IRQ_take_advantage_of_british_weakness_desc:	"Wenn wir die [ENG.GetAdjective] aus unserer Region verdrängen wollen, werden wir vielleicht nie eine so gute Gelegenheit bekommen wie jetzt, wo sie mit Konflikten in der ganzen Welt abgelenkt sind. Lassen Sie uns einen Schlag ausführen, von dem sie sich nie wieder erholen werden. "
IRQ_arab_dominance:	"Arabische Vorherrschaft"
IRQ_arab_dominance_desc:	"[IRQ.GetNonIdeologyName] ist eine vielfältige Nation, aber nur wenn wir die politische Dominanz der arabischen Mehrheit festigen, können wir jemals hoffen, eine stabile Regierung zu erhalten."
IRQ_rally_the_arab_world:	"Die arabische Welt versammeln"
IRQ_rally_the_arab_world_desc:	"Die arabische Welt sehnt sich danach, die Fesseln der westlichen Mächte abzuschütteln. Gemeinsam werden wir die arabischen Völker vereinen und uns wieder als Herren unseres eigenen Schicksals etablieren."
IRQ_regime_change_in_arabia:	"Regimewechsel in Arabien"
IRQ_regime_change_in_arabia_desc:	"Dem Haus Saud kann man als potenziellem Verbündeten gegen die Großmächte nicht trauen. Deshalb muss es beseitigt werden, bevor es zu einer Bedrohung wird."
IRQ_iran_ultimatum:	"Ultimatum an den Iran"
IRQ_iran_ultimatum_desc:	"Eine beträchtliche Anzahl von Arabern lebt in den westlichen Regionen von [PER.GetName]. Vielleicht ist die Zeit gekommen, ihre Vereinigung mit unserer Nation zu fordern, um sie vor der [PER.GetAdjective]-Herrschaft zu schützen."
IRQ_iran_ultimatum_tt2:	""
IRQ_iran_ultimatum_tt:	"§YWenn [PER.GetNameDef] sich weigert, Territorium abzutreten, haben wir die Möglichkeit, ihnen den Krieg zu erklären.§!"
IRQ_liberate_levant:	"Befreien Sie die Levante"
IRQ_liberate_levant_desc:	"Die Levante wurde von den Siegern des Großen Krieges aufgeteilt, was für die Völker der Region nichts als Blutvergießen und Elend zur Folge hatte. Wir können nicht länger tatenlos zusehen, wie unsere Verwandten ein solches Schicksal erleiden."
IRQ_liberate_north_africa:	"Befreien Sie Nordafrika"
IRQ_liberate_north_africa_desc:	"Nordafrika ist schon viel zu lange unter dem imperialistischen Stiefel der Europäer zerdrückt worden. Es ist an der Zeit, sie zu befreien und wieder in die Gemeinschaft aufzunehmen."
IRQ_proclaim_united_arab_republic:	"Rufen Sie eine Vereinigte Arabische Republik aus"
IRQ_proclaim_united_arab_republic_desc:	"Unsere Träume von einer panarabischen Nation beginnen sich zu verwirklichen. Wir müssen die Gelegenheit ergreifen und die Gründung einer Vereinigten Arabischen Republik ausrufen und die Menschen für unsere Sache gewinnen."
IRQ_request_syria_from_vichy:	"Anfrage Syrien"
IRQ_request_syria_from_vichy_desc:	"Die Franzosen waren noch nie so gespalten und schwach. Dies ist die perfekte Gelegenheit, um die Übergabe ihres syrischen Territoriums an uns zu fordern."
AT_PEACE_WITH_SYRIA_OWNER_TT_NOT:	"Nicht im Krieg mit Syrien"
IRQ_unite_mashriq:	"Vereinigen Sie Mashriq"
IRQ_unite_mashriq_desc:	"Mashriq ist das schlagende Herz der islamischen Welt. Wir können nicht ruhen, bevor es nicht vollständig unter der Kontrolle des Kalifen ist."
IRQ_discuss_a_new_treaty:	"Diskutieren Sie einen neuen Vertrag"
IRQ_discuss_a_new_treaty_desc:	"Der anglo-irakische Vertrag wurde ausgehandelt, als wir nur eine junge und schwache Nation waren. Jetzt sind wir die herausragende Macht der islamischen Welt und ein solcher Vertrag ist eine Beleidigung für unseren Führer. Es ist daher an der Zeit, einen neuen Vertrag mit der [ENG.GetAdjective] auszuhandeln."
IRQ_unite_maghreb:	"Maghreb vereinen"
IRQ_unite_maghreb_desc:	"Der Maghreb ist ein fester Bestandteil der islamischen Welt, der zu lange unter der westlichen Herrschaft gelitten hat. Mit unserer neu gefundenen Macht werden wir ihn unter unserer Herrschaft vereinen und die Imperialisten ein für alle Mal vertreiben."
IRQ_unite_maghreb_tt:	"Gewinne §YRetake core state §!Kriegsziel gegen jedes Land, das Staaten besetzt, dieser Fokus gibt Ihnen Kerne auf"
IRQ_arab_league:	"Bilden Sie die Arabische Liga"
IRQ_arab_league_desc:	"Wir müssen eine Allianz gleichgesinnter arabischer Nationen gründen, deren Ziel es ist, die arabischen Interessen vor Einmischung von außen zu schützen und die Länder jenseits unserer Grenzen von der Besatzung zu befreien."
IRQ_arab_league_economic_cooperation:	"Wirtschaftsrat der Arabischen Liga"
IRQ_arab_league_economic_cooperation_desc:	"Um die Brüderlichkeit zwischen den arabischen Nationen zu stärken, sollten wir uns bemühen, im wirtschaftlichen Bereich enger zusammenzuarbeiten."
IRQ_arab_league_economic_cooperation_tt:	"Wir werden für jeden anderen §YArabischen Staat§!, der eine höhere als §G85§! §YMeinung§! von uns hat, eine §YCivilian Factory§! außerhalb der Karte erhalten. Dies gilt für §Y[KUW.GetNameWithFlag]§!, §Y[JOR.GetNameWithFlag]§!, §Y[SYR.GetNameWithFlag]§!, §Y[PAL.GetNameWithFlag]§!, §Y[BHR.GetNameWithFlag]§!, §Y[SAU.GetNameWithFlag]§!, §Y[QAT.GetNameWithFlag]§!, §Y[UAE.GetNameWithFlag]§!, §Y[OMA.GetNameWithFlag]§!, §Y[IMO.GetNameWithFlag]§!, §Y[YEM.GetNameWithFlag]§!, §Y[FSA.GetNameWithFlag]§!, §Y[EGY.GetNameWithFlag]§!, §Y[SUD.GetNameWithFlag]§!, §Y[LBA.GetNameWithFlag]§!, §Y[ALG.GetNameWithFlag]§!, §Y[TUN.GetNameWithFlag]§!, §Y[MOR.GetNameWithFlag]§!, §Y[RIF.GetNameWithFlag]§!, §Y[WES.GetNameWithFlag]§!, §Y[MRT.GetNameWithFlag]§! und §Y[LEB.GetNameWithFlag]§!."
IRQ_expand_membership:	"Mitgliedschaft in der Föderation ausbauen"
IRQ_expand_membership_desc:	"Während einige über die Idee unserer Föderation spotteten, schauten andere bewundernd auf unsere Errungenschaften. Vielleicht ist es an der Zeit, die Mitgliedschaft auf diejenigen auszuweiten, die weise genug sind zu erkennen, dass wir gemeinsam stärker sind."
IRQ_expand_membership_tt:	"Schalten Sie §Y$hashemite_federation_cat$§! Entscheidungen frei, um Mitglieder einzuladen, Ihre Marionetten zu werden."
IRQ_restore_al_andalus:	"Al-Andalus wiederherstellen"
IRQ_restore_al_andalus_desc:	"Die Spanier mögen sich für die Herren von Iberien halten, aber lange bevor ihre Nation gegründet wurde, war es Al-Andalus. Die Rückgabe an die islamische Welt wird eine Niederlage sein, die die Europäer nie vergessen werden."
IRQ_promote_kurdish_culture:	"Fördern Sie die kurdische Identität"
IRQ_promote_kurdish_culture_desc:	"Das kurdische Volk ist über mehrere Nationen verstreut, aber unsere Kultur verbindet uns, unabhängig davon, wo wir leben. Wir müssen dieses Erbe fördern und schützen, bevor es von denen, die uns regieren, demontiert wird."
IRQ_kurdish_democratic:	"Demokratische Partei Kurdistans"
IRQ_kurdish_democratic_desc:	"Die Rechte der Kurden werden jeden Tag von der arabischen Mehrheit von [IRQ.GetNameDef] mit Füßen getreten. Es ist an der Zeit, dass wir unsere eigene politische Bewegung gründen mit dem Ziel, eine freie und unabhängige Nation für unser Volk zu sichern."
IRQ_kurdish_socialist:	"Suchen Sie sowjetische Hilfe"
IRQ_kurdish_socialist_desc:	"[SOU.GetNameDefCap] sehnt sich nach einer Möglichkeit, die westliche Vorherrschaft im Nahen Osten zu untergraben. Vielleicht wären sie bereit, uns in unserem Kampf gegen die [IRQ.GetAdjective]-Regierung und damit auch gegen die [ENG.GetAdjective] zu unterstützen."
IRQ_kurdish_revolt:	"Starten Sie eine Revolte"
IRQ_kurdish_revolt_desc:	"Der Moment ist gekommen, unsere Unabhängigkeit von [IRQ.GetNonIdeologyName] zu erklären und eine wirklich freie Nation für das kurdische Volk zu schaffen."
IRQ_kurdish_revolt_tt:	"Wir werden die Unabhängigkeit vom _YIrakischen Staat§! erklären und uns in einen §RWar of Independence§! gegen ihn begeben."
IRQ_kurdish_language:	"Kurdische Sprachschulen"
IRQ_kurdish_language_desc:	"Mit unserer neu gewonnenen Unabhängigkeit können wir endlich damit beginnen, ein Bildungssystem aufzubauen, das sich auf die kurdische Kultur und Sprache konzentriert."
IRQ_kurdish_industry:	"Industrielle Basis ausbauen"
IRQ_kurdish_industry_desc:	"Um zu verhindern, dass wir von unseren stärkeren Nachbarn geschluckt werden, müssen wir eine eigene industrielle Basis aufbauen. "
IRQ_kurdish_oil:	"Kurdisches Öl"
IRQ_kurdish_oil_desc:	"In den letzten Jahren wurden in unserem Gebiet Ölvorkommen erschlossen, aber der daraus resultierende Reichtum wurde aus der Region abgeschöpft. Jetzt können wir endlich unsere eigene Ölindustrie aufbauen und den Reichtum für unser eigenes Volk nutzen."
IRQ_kurdish_form_the_peshmerga:	"Bilden Sie die Peshmerga"
IRQ_kurdish_form_the_peshmerga_desc:	"Unsere Rebellion war zwar erfolgreich bei der Niederschlagung des irakischen Militärs, aber in Zukunft wird sie vielleicht nicht mehr so viel Glück haben. Wir werden daher eine nationale Armee mit echter militärischer Ausbildung und moderner Ausrüstung aufbauen, um einen möglichen Konflikt gar nicht erst aufkommen zu lassen."
IRQ_kurdish_women_in_military:	"Frauen im Militär"
IRQ_kurdish_women_in_military_desc:	"Die antiquierte Ansicht, dass Frauen von Konflikten ferngehalten werden müssen, muss beseitigt werden, wenn wir ein robustes Militär aufbauen wollen, das in der Lage ist, sich gegen unsere Nachbarn zu behaupten."
IRQ_kurdish_support_resistance:	"Unterstützung des Widerstands im Ausland"
IRQ_kurdish_support_resistance_desc:	"Während die Menschen innerhalb unserer Grenzen wahre Freiheit genießen, bleiben viel zu viele unserer Geschwister unter der Herrschaft fremder Mächte gefangen. Wir müssen sie bei ihren Versuchen, sich zu befreien, unterstützen."
IRQ_kurdish_reject_ankara_treaty:	"Den Vertrag von Ankara ablehnen"
IRQ_kurdish_reject_ankara_treaty_desc:	"Der Vertrag von Ankara hat frühere Versuche zerstört, eine Nation für das kurdische Volk zu gründen. Wir müssen der Welt klar machen, dass wir die durch diesen Vertrag festgelegten Grenzen ablehnen und dass wir nicht ruhen werden, bis das kurdische Volk geeint ist."
IRQ_kurdish_attack_turkey:	"Befreiung der Kurden in der Türkei"
IRQ_kurdish_attack_turkey_desc:	"Die [TUR.GetAdjective] bekämpft aktiv das kurdische Volk innerhalb ihrer Grenzen und beraubt es seines Erbes. Dies kann nicht länger toleriert werden, selbst wenn es bedeutet, unser Volk mit Gewalt zu befreien."
IRQ_kurdish_attack_iran:	"Befreiung der Kurden im Iran"
IRQ_kurdish_attack_iran_desc:	"Das [PER.GetAdjective]-Regime ist eine Bedrohung für unser Volk. Nur durch die gewaltsame Befreiung der Kurden innerhalb ihrer Grenzen und die Niederlage des [PER.GetAdjective]-Militärs durch unsere Hände können wir unserem Volk eine Zukunft sichern."
IRQ_kurdish_united:	"Vereinigtes Kurdistan"
IRQ_kurdish_united_desc:	"Durch große Entbehrungen und Kämpfe haben wir schließlich das kurdische Volk unter unserer Herrschaft vereint. Was auch immer jetzt kommt, wir stehen als ein geeintes Volk da."
IRQ_a_new_islamic_golden_age:	"Neues islamisches Goldenes Zeitalter"
IRQ_a_new_islamic_golden_age_desc:	"TODO"
IRQ_put_down_tribal_revolts:	"Stammesrevolten niederschlagen"
IRQ_put_down_tribal_revolts_desc:	"TODO"
IRQ_join_axis:	"$TUR_join_the_axis$"
IRQ_join_axis_desc:	"$TUR_join_the_axis_desc$"
RAJ_royal_indian_artillery_dlc:	"$RAJ_royal_indian_artillery$"
RAJ_royal_indian_artillery_dlc_desc:	"$RAJ_royal_indian_artillery_desc$"
RAJ_lions_of_the_great_war_dlc:	"$RAJ_lions_of_the_great_war$"
RAJ_lions_of_the_great_war_dlc_desc:	"$RAJ_lions_of_the_great_war_desc$"
RAJ_chindits_dlc:	"$RAJ_chindits$"
RAJ_chindits_dlc_desc:	"$RAJ_chindits_desc$"
RAJ_re_establish_the_khyber_rifles:	"Wiederaufstellung der Khyber Rifles"
RAJ_re_establish_the_khyber_rifles_desc:	"Wir werden die Khyber Rifle Miliz wieder aufstellen, um unser zerklüftetes Gelände zu verteidigen, und vielleicht können wir auch etwas von ihnen lernen."
RAJ_expand_mazagon_dock_dlc:	"$RAJ_expand_mazagon_dock$"
RAJ_expand_mazagon_dock_dlc_desc:	"$RAJ_expand_mazagon_dock_desc$"
RAJ_found_scindia_shipyard_dlc:	"$RAJ_found_scindia_shipyard$"
RAJ_found_scindia_shipyard_dlc_desc:	"$RAJ_found_scindia_shipyard_desc$"
RAJ_royal_indian_navy_dlc:	"$RAJ_royal_indian_navy$"
RAJ_royal_indian_navy_dlc_desc:	"$RAJ_royal_indian_navy_desc$"
