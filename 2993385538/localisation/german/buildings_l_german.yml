nuclear_reactor_heavy_water_desc:0	"Dieses Gebäude versorgt die Provinz mit der Produktion von angereichertem Uran für den Einsatz in Kernwaffen.\nKernreaktoren, die Schweres Wasser verwenden, sind etwas billiger zu bauen als Graphitreaktoren, produzieren aber weniger Material, das für die Herstellung von Kernwaffen verwendet werden kann.$nuclear_reactor_effect$"
