canal_kiel_desc:0	"Die Schleusen des Nord-Ostsee-Kanals werden benötigt, damit der Kanal mit voller Kapazität betrieben werden kann. Ihre Zerstörung würde die Schifffahrt und den Schiffsverkehr für lange Zeit behindern."


canal_panama_desc:0	"Die Schleusen des Panamakanals werden benötigt, damit der Kanal mit voller Kapazität betrieben werden kann. Ihre Zerstörung würde die Schifffahrt und den Schiffsverkehr für lange Zeit behindern."

nuclear_facility_plural:0	"Forschungseinrichtungen für Nukleartechnik"
nuclear_facility_desc:0	"In den experimentellen Einrichtungen für die Kernforschung können Sie Forschungsprojekte zur Nutzung der Kernenergie starten."

electronics_facility_plural:0	"Forschungseinrichtungen für Elektronik- und Computerforschung"
electronics_facility_desc:0	"In den experimentellen Einrichtungen für die Elektronik- und Computerforschung können Sie Forschungsprojekte in den Bereichen Computertechnik, Verschlüsselung und fortgeschrittene Elektronik durchführen."

air_facility_plural:0	"Forschungseinrichtungen für Aerodynamik und Raketentechnik"
air_facility_desc:0	"In den experimentellen Einrichtungen für Aerodynamik und Raketentechnik können Sie Forschungsprojekte für Flugzeuge und Raketen starten."



land_facility:0	"Forschungseinrichtung für Landkriegsführung"
land_facility_plural:0	"Forschungseinrichtungen für Landkriegsführung"
land_facility_desc:0	"Experimentelle Einrichtungen für Landkriegsführung ermöglichen es Ihnen, Forschungsprojekte zu verschiedenen Aspekten der Landkriegsführung zu starten, wie z.B. Spezialpanzer oder Artillerie."



naval_supply_hub_desc:	" Dieses Gebäude ermöglicht es Ihren Flotten, sich zusätzlich zu ihren Heimatbasen in dieser Basis wieder aufzufüllen und aufzutanken, wodurch sich die Einsatzreichweite Ihrer §YEinsatzverbände§! möglicherweise erweitert.\nEin Marineversorgungszentrum kann nur in einer Küstenprovinz errichtet werden, die über einen Marinestützpunkt der Stufe 6 oder höher verfügt."




mega_gun_emplacement_desc:0	"Dieses großkalibrige Geschütz, das nach dem Prinzip des Mehrfachladungsantriebs arbeitet, wurde entwickelt, um bei der Bombardierung unvergleichliche Reichweiten zu erzielen. Durch eine Reihe von unterirdischen Tunneln werden die Geschosse auf Überschallgeschwindigkeit beschleunigt, bevor sie auf weit entfernte Ziele abgefeuert werden."

