synthetic_refinery_resource:0	"£resources_strip|$FRAME$"
 
infrastructure:0	"Infrastruktur"
infrastructure_plural:0	"Infrastruktur"
infrastructure_desc:0	"Dieses Gebäude bietet dem Staat eine Verbesserung der Infrastruktur. Es erhöht Ihre Versorgungskraft in strategischen Regionen und erhöht die Geschwindigkeit Ihrer Divisionen.$infrastructure_effect$"
 
arms_factory:0	"Militärfabrik"
arms_factory_plural:0	"Militärfabriken"
arms_factory_desc:0	"Dieses Gebäude versorgt den Staat mit Industrie für die Produktion neuer militärischer Ausrüstung. Kann bei Bedarf in zivile Industrie umgewandelt werden.$arms_factory_effect$"
 
dockyard:0	"Marinewerft"
dockyard_plural:0	"Marinewerften"
dockyard_desc:0	"Dieses Gebäude versorgt den Staat mit Industrie für den Bau neuer Schiffe.$dockyard_effect$"
 
shipyard:0	"Werft"
shipyard_plural:0	"Werften"
shipyard_desc:0	"Jede Werft wird §Gdie Produktionskosten§! von: §YMilitärischen Überwasserschiffen§! und §YKonvois§! senken.$shipyard_effect$"
 
subyard:0	"U-Boot-Werft"
subyard_plural:0	"U-Boot-Werften"
subyard_desc:1	"Jede U-Boot-Werft wird §Gdie Produktionskosten§! von: §YU-Booten§! um senken.$subyard_effect$"
 
tank_assembly:0	"Panzermontagewerk"
tank_assembly_plural:0	"Panzermontagewerke"
tank_assembly_desc:0	"Panzermontagewerke bieten §YPanzerproduktionskapazität§!, die für den Bau von §YPanzern§!, §YPanzerwagen§! und §YMechanisierten§!$tank_assembly_effect$ erforderlich ist"
 
air_assembly:0	"Flugzeugmontagewerk"
air_assembly_plural:0	"Flugzeugmontagewerke"
air_assembly_desc:0	"Flugzeugmontagewerk stellen §YFlugzeugproduktionskapazität§! bereit, die für den Bau von §YFlugzeugen§!$air_assembly_effect$ erforderlich ist"
 
engine_assembly:0	"Motorenfabrik"
engine_assembly_plural:0	"Motorenfabriken"
engine_assembly_desc:0	"Motorenfabriken stellen §YMotorproduktionskapazität§! bereit, die für den Bau von §YLkw§!, §YManisierten§!, §YPanzerwagen§!, §YPanzern§! und §YFlugzeugen§!$engine_assembly_effect$ erforderlich ist"
 
artillery_assembly:0	"Artilleriegießerei"
artillery_assembly_plural:0	"Artilleriegießereien"
artillery_assembly_desc:0	"Artilleriegießereien stellen §YArtillerie Produktionskapazität§! bereit, die für den Bau von §YArtillerie§!, §YPanzerabwehrkanonen§! und §YPanzern§!$artillery_assembly_effect$ erforderlich ist"
 
shipyard_capital_building:0	"Große Schiffswerft"
shipyard_capital_building_plural:0	"Große Schiffswerften"
shipyard_capital_building_desc:0	"Eine große Schiffswerft stellt §YGroße Schiffswerften-Kapazität§! zur Verfügung, die für den Bau von §YGroßkampfschiffen§! und §YTrägern§!$shipyard_capital_building_effect$ erforderlich ist"
 
research_centre:0	"Forschungszentrum"
research_centre_desc:0	"Forschungszentren stellen Ihrer Nation £tech_mod §YForschungsplätze§! zur Verfügung. Sie können durch §YFocuses§! und §YEvents§! gewonnen werden. Der Verlust eines Staates mit einem §YForschungszentrum§! führt zum Verlust eines £tech_mod §YForschungsplatz§!. \n\n£trigger_no Dieses Gebäude ist §Rnicht baubar.§!"
research_centre_overlay:0	"§YForschungszentrum§!\n\nForschungszentren stellen Ihrer Nation £tech_mod §YForschungsplätze§! zur Verfügung. Sie können durch §YFocuses§! und §YEvents§! gewonnen werden. Verlust eines Staates mit einem §YForschungszentrum§! führt zum Verlust eines £tech_mod §Yresearch Slot§!. \n\n£trigger_no Dieses Gebäude ist §Rnicht baubar.§!"
 
industrial_complex:0	"Zivilfabrik"
industrial_complex_plural:0	"Zivilfabriken"
industrial_complex_desc:0	"Dieses Gebäude versorgt den Staat mit Industrie für die Produktion ziviler Güter oder den Bau neuer Gebäude. Kann bei Bedarf in eine Militärindustrie umgewandelt werden.$industrial_complex_effect$"
 
air_base:0	"Luftwaffenstützpunkt"
air_base_plural:0	"Luftwaffenstützpunkte"
air_base_desc:0	"Dieses Gebäude bietet dem Staat Stationierungsmöglichkeiten für Ihre Luftstreitkräfte.$air_base_effect$"
 
 
naval_base:0	"Marinestützpunkt"
naval_base_plural:0	"Marinestützpunkte"
naval_base_desc:1	"Erweitert die Reichweite Ihrer Flotte und bietet Reparaturdienste dafür. Ermöglicht die Lieferung und den Export von Ressourcen nach Übersee. Höhere Stufen erhöhen den Versorgungsdurchsatz.$naval_base_effect$"
 
bunker:0	"Landfestung"
bunker_plural:0	"Landfestungen"
bunker_desc:0	"Dieses Gebäude fügt dem Angreifer im Kampf einen Angriffsmalus von $VALUE|+%0$ für jede Festungsstufe zu. Angriffe aus mehreren Richtungen verringern den Festungseffekt.$bunker_effect$"
 
coastal_bunker:0	"Küstenfestung"
coastal_bunker_plural:0	"Küstenfestungen"
coastal_bunker_desc:0	"Dieses Gebäude fügt dem Angreifer im Seeinvasionskampf einen Angriffsmalus von $VALUE|+%0$ für jede Festungsstufe zu.$coastal_bunker_effect$"
 
anti_air_building:0	"Statische Luftabwehr"
anti_air_building_plural:0	"Statische Luftabwehr"
anti_air_building_desc:0	"Dieses Gebäude bietet dem Staat Schutz vor feindlichen Bombern und die Möglichkeit, auf angreifende Flugzeuge zu schießen.$anti_air_building_effect$"
 
synthetic_refinery:0	"Synthetische Raffinerie"
synthetic_refinery_plural:0	"Synthetische Raffinerien"
synthetic_refinery_desc:0	"Dieses Gebäude versorgt den Staat mit Treibstoff.\n\nMax. Stufe: §Y4§!\nGebäudezustand: §Y6§!\nInfrastruktureffekt: §GJa§!"
 
radar_station:0	"Radarstation"
radar_station_plural:0	"Radarstationen"
radar_station_desc:3	"Radar ermöglicht es Ihnen, Informationen über feindliche Truppen in nahegelegenen Staaten zu erhalten.\nEine höhere Radarstufe in einem Staat erhöht die effektive Reichweite des Radars.\nRadar ermöglicht dem Staat auch eine bessere Erkennung feindlicher Luftstreitkräfte und gibt Ihren Flugzeugen mehr Sicherheit eine bessere Chance, sie anzugreifen.\nAußerdem erhöht Radar die Erkennung feindlicher Flotten auf See.$radar_station_effect$"
 
rocket_site:0	"Raketenstandort"
rocket_site_plural:0	"Raketenstandorte"
rocket_site_desc:0	"Dieses Gebäude bietet dem Staat die Möglichkeit, produzierte Raketen zu stationieren.$rocket_site_effect$"
 
nuclear_reactor:0	"Kernreaktor"
nuclear_reactor_plural:0	"Kernreaktoren"
nuclear_reactor_desc:0	"Dieses Gebäude versorgt den Staat mit der Produktion von angereichertem Uran für den Einsatz in Atomwaffen.$nuclear_reactor_effect$"
 
fuel_silo:0	"Kraftstoffsilo"
fuel_silo_plural:0	"Kraftstoffsilos"
fuel_silo_desc:0	"Dieses Gebäude bietet Ihrer Nation mehr Platz für die Bevorratung mit §HTreibstoff§!.$fuel_silo_effect$"
 
supply_node:1	"Versorgungsknoten"
supply_node_desc:2	"Ein Versorgungsknotenpunkt ist ein Punkt entlang einer Eisenbahnstrecke außerhalb bestehender Städte, an dem Versorgung bezogen werden kann.$supply_node_effect$"
 
rail_way:0	"Eisenbahnen"
rail_way_desc:2	"Eisenbahnen werden verwendet, um Versorgungszentren miteinander zu verbinden, um eine Versorgung weit entfernt von Ihrer Hauptstadt zu ermöglichen.$rail_way_effect$"

pillbox:0	"Unterstand"
pillbox_plural:0	"Unterstände"
pillbox_desc:0	"Dieses Gebäude fügt dem Angreifer im Kampf einen Angriffsmalus von $VALUE|+%0$ für jeden Unterstand zu. Angriffe aus mehreren Richtungen verringern den Unterstandeffekt. Es ist nur 1 Unterstandsstufe verfügbar.$pillbox_effect$"
 
