nuclear_reactor_heavy_water:0	"Schwerer Wasser-Kernreaktor"
nuclear_reactor_heavy_water_plural:0	"Schweres Wasser Kernreaktoren"
nuclear_reactor_heavy_water_desc:0	"Dieses Gebäude versorgt den Staat mit der Produktion von angereichertem Uran für den Einsatz in Kernwaffen.\nKernreaktoren, die Schweres Wasser verwenden, sind etwas billiger zu bauen als Graphitreaktoren, produzieren aber weniger Material, das für die Herstellung von Kernwaffen verwendet werden kann.$nuclear_reactor_effect$"
