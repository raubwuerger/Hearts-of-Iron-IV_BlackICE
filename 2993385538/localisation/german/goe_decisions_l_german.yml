RAJ_GOE_pay_out_dividends_small_tt:	"Am Ende des §YFinanzjahres§! werden wir $eic_low_investments_cost_tt$ auszahlen und ihn damit dauerhaft aus einem zufälligen Zustand entfernen. Im Gegenzug erhalten wir einen kleinen Betrag zusätzlicher Investitionen von privaten Anlegern für die gesamte Dauer des nächsten Geschäftsjahres.\n\n"
RAJ_GOE_pay_out_dividends_normal_tt:	"Am Ende des Fiskaljahres§! zahlen wir $eic_normal_investments_cost_tt$ aus und entfernen ihn damit dauerhaft aus einem zufälligen Zustand. Im Gegenzug erhalten wir für die gesamte Dauer des nächsten Fiskaljahres einen durchschnittlichen Betrag an zusätzlichen Investitionen von privaten Anlegern.\n\n"
RAJ_GOE_pay_out_dividends_high_tt:	"Am Ende des Fiskaljahres§! zahlen wir $eic_high_investments_cost_tt$ aus und entfernen ihn damit dauerhaft aus einem zufälligen Zustand. Im Gegenzug erhalten wir eine große Menge an zusätzlichen Investitionen von privaten Investoren für die gesamte Dauer des nächsten Fiskaljahres.\n\n"
