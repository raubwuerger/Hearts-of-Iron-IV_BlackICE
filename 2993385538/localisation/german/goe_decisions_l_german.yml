taxes_desc:	"Wir zahlen Steuern als Prozentsatz unseres Einkommens in Schichten, die als Steuerklassen bezeichnet werden. Je höher unser Einkommen ist, desto höher ist der Steuersatz für die nächste Einkommensschicht.\n\nAm Ende eines jeden Steuerjahres müssen wir Steuern an die [ENG.GetAdjective] Regierung zahlen, je nachdem, wie groß unsere Branche ist. Dies wird durch die Anzahl unserer zivilen Fabriken§! bestimmt.\n\nDer Betrag wird in §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!\nWie viel zu zahlen ist, wird durch verschiedene Steuerklassen wie folgt bestimmt:\n"
eic_industry_tt:	"Betrag der steuerpflichtigen zivilen Fabriken: §Y[?var:actually_controlled_civs]§!\n$RAJ_dividents_status_tt$"
eic_industry_tt_on_hover:	"Derzeit besitzen wir §Y[?var:actually_controlled_civs]§! Zivile Fabriken, und als solche erwarten wir eine [?var:taxes_display_tt] §YConsumer Goods Factories factor§! Strafe. Um die Steuerklasse zu senken, in der wir uns befinden, können wir zivile Fabriken an Untertanen weiterleiten, indem wir den §YInstitutionelle Geldwäsche§! Fokus\n abschließen"
tier_1_taxes:	"  §W 1st:                        0-[?var:tier_two_taxes_threshold] Fabriken [?tier_one_taxes_tax_tt]%§!"
tier_1_taxes_tt:	"Um in dieser Steuerklasse zu sein, müssen wir zwischen 0-[?var:tier_two_taxes_threshold] §YZivile Fabriken§! haben, und wenn wir uns innerhalb dieser Klasse befinden, wird ein §Y[?tier_one_taxes_tax_tt]%§! Konsumgüterfabriken-Faktor auf uns angewendet."
tier_2_taxes:	"  §W 2nd:                        [?var:tier_two_taxes_threshold_plus_1]-[?var:tier_three_taxes_threshold] Fabriken [?tier_two_taxes_tax_tt]%§!"
tier_2_taxes_tt:	"Um in dieser Steuerklasse zu sein, müssen wir zwischen [?var:tier_two_taxes_threshold_plus_1]-[?var:tier_three_taxes_threshold] §YCivilian Factories§! haben, und wenn wir in dieser Steuerklasse sind, werden wir mit dem Faktor §Y[?tier_two_taxes_tax_tt]%§! Consumer Goods Factories bestraft."
tier_3_taxes:	"  §W 3rd:                        [?var:tier_three_taxes_threshold_plus_1]-[?var:tier_four_taxes_threshold] Fabriken [?tier_three_taxes_tax_tt]%§!"
