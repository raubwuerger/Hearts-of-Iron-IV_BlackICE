china.400.b:0	"Beende mein Leiden!"
china.401.t:0	"Die Kapitulation Chinas!"
china.401.d:0	"Die kaiserliche japanische Armee ist siegreich! Die Republik China hat kapituliert, und ihre Regierung wurde aufgelöst, aber wir können auf absehbare Zeit mit weiterem Partisanenwiderstand rechnen. Nun müssen wir entscheiden, ob wir unserer neu gebildeten Marionettenregierung die volle Kontrolle über die eroberten Gebiete übertragen wollen oder nicht."
china.402.t:0	"Annektierung der Küste"
china.402.d:0	"Annektierung der Küste"
china.402.a:0	"Annektierung der Küste"
jap.8.t:	"Kōki Hirota wird Premierminister"
jap.8.desc:	"Nachdem die radikalen Fraktionen innerhalb des japanischen Militärs nach dem Vorfall vom 26. Februar in Misskredit geraten waren, wurde Hirota als Nachfolger von Okada zum Premierminister Japans ernannt"
jap.8.a:	"Willkommen"
jap.9.desc:0	"Kaiser Hirohito hat den Vorschlag angenommen, Fumimaro Konoe zum neuen Premierminister zu ernennen."
jap.11.d:0	"[MCK.GetLeader] hat die ganze Zeit über seinen erbärmlichen Plan zur Wiederherstellung geschmiedet. Heute haben er und seine kleine Clique ihre Unabhängigkeit von uns erklärt!"
jap.11.b:0	"Wie auch immer"
jap.12.d:0	"In der Mandschurei hat eine Reihe von Attentaten stattgefunden; die Ziele sind lokale japanische Beamte, insbesondere solche der Kwantung-Armee. Einige unserer Generäle wurden getötet; die Ermittlungen deuten auf lokale chinesische Guerillakämpfer hin, doch es gelingt uns nicht, die Täter zu fassen."
jap.13.d:0	"[From.GetName] hat den Wunsch geäußert, sich von Japan zu lösen, und bittet nun um unsere Unterstützung."
jap.13.b:0	"Kein Interesse."
jap.14.d:0	"[From.GetName] hat zugestimmt, unsere Unabhängigkeit zu unterstützen. Weitere Bedingungen werden später besprochen."
jap.15.t:0	"[From.GetName] hat sich geweigert, unsere Unabhängigkeit zu unterstützen"
jap.15.a:0	"Wir müssen einen anderen Weg suchen."
jap.16.d:0	"Nach der erfolgreichen Einführung der Demokratie in [From.GetName] fordert [From.GetLeader] uns nun auf, gegen die Japaner vorzugehen, um sie in die Freiheit zu führen."
jap.16.b:0	"Wir haben bereits einen Plan im Sinn, sagen Sie ihnen, sie sollen Geduld haben."
jap.17.t:0	"Ultimatum von [From.GetName]"
jap.17.a:0	"Wir können es uns nicht leisten, gegen sie in den Krieg zu ziehen."
jap.18.t:0	"[From.GetName] weigert sich, jetzt zu handeln"
jap.18.a:0	"Dann warten wir ..."
jap.19.d:0	"[JAP.GetName] hat [MCK.GetName] die Unabhängigkeit gewährt."
jap.20.t:0	"[JAP.GetName] gewährt uns die Unabhängigkeit"
jap.20.a:0	"Ein glorreicher Tag!"
jap.21.d:0	"Trotz unserer Macht weigert sich [JAP.GetName], dem Ultimatum nachzukommen."
jap.22.t:0	"Hat sich [USA.GetName] angeschlossen!"
jap.22.a:0	"Freiheit oder Tod!"
jap.23.d:0	"Das aufständische Volk von [MCK.GetName] hat sich von uns losgerissen und sich [USA.GetNameDef] im Krieg angeschlossen."
jap.28.t:0	"[From.GetNameDef] bietet Vasallenschaft an"
jap.28.a:0	"Das Edikt ist eingegangen."
jap.29.t:0	"[From.GetName] wird unser Vasall"
jap.29.a:0	"Die Welt wird sich erneut vor dem mächtigen Qing-Reich verneigen!"
jap.30.t:0	"[From.GetName] lehnt die Vasallenschaft ab"
jap.30.a:0	"Sie werden ihren Fehler bald erkennen."
jap.31.d:0	"[MCK.GetName] hat einen Vertreter entsandt, um die Angelegenheit der Übergabe von Kanto-Shu zu besprechen."
jap.31.b:0	"Auf keinen Fall."
jap.32.d:0	"Wir haben das Eigentumsrecht an Kanto-Shu erlangt!"
jap.33.t:0	"Kanto-Shu blieb in japanischer Hand"
jap.33.a:0	"Wir können nichts tun."
jap.34.d:0	"[MCK.GetName] Beamte sind gekommen, um über die Genehmigung zum Ausbau ihrer Marine zu verhandeln."
jap.35.d:0	"Uns wurde die Genehmigung zum Ausbau unserer Marine erteilt."
jap.36.d:0	"Uns wurde die Genehmigung zum Ausbau unserer Marine verweigert."
jap.37.d:0	"Unsere Industrie war lange Zeit unterentwickelt. Dank der Bemühungen unseres geliebten und glorreichen Kaisers hat unsere Industrie nun eine bedeutende Verbesserung erfahren."
jap.38.d:0	"Mit den zunehmenden Anstrengungen im industriellen Bereich haben sich auch unsere Techniken in diesem Fachgebiet erheblich verbessert."
jap.40.t:0	"Fortschritte in der Rüstung"
jap.41.d:0	"Unsere Spezialisten haben ein tieferes Verständnis für die Militärtechnologie gewonnen. In Anbetracht der Lage unseres Reiches hat unser geliebter und glorreicher Kaiser eine kleine Zuwendung für die Marineindustrie bewilligt."
jap.42.d:0	"Die demütigende Niederlage durch die japanische Marine vor langer Zeit ist nicht vergessen worden. Die Bedeutung einer starken Marine ist allen unseren Bürgern bewusst."
jap.43.d:0	"Unsere Marinetechnologie schreitet in großem Umfang voran. Unsere Luftwaffe befindet sich jedoch nach wie vor in einem desolaten Zustand. Wenn wir das Eigentum des Volkes schützen wollen, müssen wir es auch von der Angst vor feindlichen Bombardements befreien."
jap.45.t:0	"Aussichten für Öl"
jap.46.t:0	"Mineralvorkommen"
jap.47.d:0	"Nachdem wir erfolgreich unsere Unabhängigkeit von den Japanern erklärt haben, hat die RFP ihr Versprechen erfüllt, und es ist an der Zeit, dass wir unseres erfüllen – oder etwa nicht?"
jap.47.b:0	"Wir benötigen 10 Monate zur Vorbereitung. "
jap.48.d:0	"Die Zeit ist gekommen, gegen die Bolschewiken zuzuschlagen!"
jap.49.d:0	"Unser Verrat hat die RFP in Rage versetzt, und sie haben sich gegen uns erhoben!"
jap.50.t:0	"Sieg gegen die Guerillas"
jap.50.a:0	"Gerechtigkeit soll siegen!"
jap.51.d:0	"Unser jüngster Versuch, den Guerillas entgegenzutreten, ist außer Kontrolle geraten. Unsere Divisionen gerieten in einen Hinterhalt und wurden schnell von den anderen abgeschnitten. Nur wenige haben das Gemetzel überlebt."
jap.52.t:0	"Frieden mit [JAP.GetName]?"
jap.52.a:0	"Lassen Sie uns Friedensgespräche vereinbaren."
jap.53.t:0	"[MCK.GetName] will Frieden"
jap.53.a:0	"Das nächste Mal werden sie nicht so viel Glück haben."
jap.54.t:0	"Frieden!"
jap.54.b:0	"Ein glorreicher Tag!"
jap.55.d:0	"Unser Vertreter wurde von der japanischen Militärpolizei festgenommen."
MCK_independence_yes_tt:0	"Übernehmen Sie Staaten, die Japan und seinen Marionetten gehören."
MCK_rfp_rise_tt:0	"Die RFP wird in Zukunft einen Bürgerkrieg auslösen."
jap.57.t:0	"Regierungsumstrukturierung in [From.GetName]"
jap.57.a:0	"Wir müssen ihre Autonomie beschneiden, um weiteren Schaden für unsere Interessen zu verhindern."
jap.58.t:0	"[From.GetName] Fordern Sie unsere Annexion"
jap.58.a:0	"Handeln Sie, bevor es zu spät ist!"
jap.59.t:0	"[From.GetName] bricht aus"
jap.59.a:0	"Wie können sie es wagen!"
jap.60.d:0	 "Im Wissen, dass dies zum Wohle des [From.GetNameADJ] und des [Root.GetNameADJ] Volkes ist, hat [From.GetLeader] zugestimmt, dass [From.GetName] Teil von [Root.GetNameDef] wird."
jap.64.d:0	"Die Japaner haben unsere Unzufriedenheit gegenüber [CHI.GetRulingParty] bemerkt, nachdem sich das Mongalische Politische Komitee gespalten hatte. Sie haben uns mitteilen lassen, dass sie uns dabei helfen könnten, unsere eigene Regierung in der Region Chahar zu etablieren und das [ECR.GetName], das unter der Kontrolle von [ECR.GetLeader] steht, einzugliedern."
jap.64.a:0	"Die Japaner sind vielversprechend."
jap.64.b:0	"Das muss ihr hinterhältiger Plan sein."
jap.66.t:0	"Gründung von [Root.GetName]"
jap.66.d:0	"In Zhangjiangkou wurde ein Protokoll unterzeichnet, nachdem Suiyuan und Taiyuan unter die Kontrolle unseres Verbündeten gefallen waren. Das Protokoll sieht die Einrichtung von [Root.GetName] vor."
jap.67.t:0	"Aufteilung von [MEN.GetName]"
jap.68.t:0	"Politisches Komitee von Suiyuan"
jap.68.d:0	"[From.GetRulingParty] hat beschlossen, die Macht von [MEN.GetLeader] einzuschränken, indem das Politische Komitee von Mongal in zwei Teile geteilt wird. Das Politische Komitee von Suiyuan wird gegründet, und Fu Zuoyi, der ein treuer General von [Root.GetName] war, wird zum Vorsitzenden ernannt."
jap.68.a:0	"Eine Stärkung unserer Kräfte."
jap.70.t:0	"[MEN.GetName] Gegründet"
jap.70.d:0	"Das [MEN.GetName] wurde von Demchugdongrub mit Hilfe der Japaner gegründet. Auch sie haben sich unserer Kontrolle entzogen."
jap.70.a:0	"Wir wussten es!"
jap.71.b:0	"Verschwenden Sie keine Ressourcen für solch eine unbedeutende Angelegenheit."
jap.72.t:0	"[From.GetName] Einverstanden"
jap.72.d:0	"Demchugdongrub hat der Gründung von [MEN.GetName] zugestimmt, und [MEN.GetLeader] wurde zum Vorsitzenden ernannt. Sie sind uns nun loyal und haben sich von [CHI.GetRulingParty] losgesagt."
jap.73.a:0	"Wie bedauerlich."
increase_jap_awareness_tt:0	"§RDas Bewusstsein der japanischen Regierung leicht schärfen\n§!"
jap.78.d:0	"In letzter Zeit hat eine Gruppe von Restaurationisten eine radikalere Methode zur Verbreitung ihrer Propaganda angewandt. Sie zwingen andere, ihre Bewegung zu unterstützen, und diejenigen, die sich weigern, werden zusammengeschlagen. Einige berichteten sogar, dass sie in die Häuser pro-japanischer Bürger eingebrochen sind und ihnen eine "Lektion" erteilt haben . Ihre Handlungen haben Unruhe unter unserem Volk ausgelöst. Wenn sie keine gemäßigtere Methode zur Verbreitung ihrer Propaganda anwenden, werden wir bald die Aufmerksamkeit der Japaner auf uns ziehen, und der gesamte Plan wird gefährdet sein."
jap.78.b:0	"Sagen Sie ihnen, sie sollen sich beruhigen."
jap.79.d:0	" Unsere Ermittler haben stichhaltige Beweise für [MCK.GetLeader]s kleinlichen Plan gefunden, sich unserer Kontrolle zu entziehen. Wir haben ihm ein Ultimatum gestellt und seine sofortige Unterwerfung gefordert. Sollte er es wagen, sich nicht zu fügen, werden sie die Macht der mächtigen Armee von [Root.GetNameDef] zu spüren bekommen!"
jap.80.t:0	"Versammlung der Restaurationisten"
jap.80.a:0	"Nehmen Sie den Brief entgegen."
jap.81.t:0	"Monarchistische Ideen werden in Schulen gelehrt"
jap.81.a:0	"Lassen Sie es zu."
jap.82.t:0	"Anti-japanische Versammlungen"
jap.82.a:0	"Setzen Sie unsere Teeparty fort."
jap.83.t:0	"Politiker mögen keine Japaner"
jap.83.a:0	"Dies wird erheblich zur Restauration beitragen!"
jap.84.t:0	"Das Militär mag keine Japaner"
jap.84.a:0	"Verbieten Sie Japanern die Teilnahme an allen militärischen Angelegenheiten unseres Landes!"
jap.85.t:0	"Japaner getötet"
jap.85.a:0	"Sehen Sie darüber hinweg."
jap.87.t:0	"Antijapanische Guerillakämpfer"
jap.87.a:0	"Erlauben Sie der Guerilla, sich auszubreiten."
jap.88.t:0	"Vandalismus gegen Japaner"
jap.88.b:0	"Entsenden Sie Polizei, um potenzielle Ziele von Vandalismus zu schützen."
jap.89.d:0	"Bei einem kürzlichen Treffen der Restaurationisten hat einer von ihnen einen kühnen Plan vorgeschlagen, um die restaurationistische Idee noch weiter und schneller zu verbreiten. Einige andere haben jedoch Einwände gegen seinen Plan erhoben und argumentiert, dass dadurch das Risiko steige, dass unser geheimer Plan nach außen dringt. Nach langem Hin und Her liegt die Entscheidung nun bei [Root.GetLeader]: Soll die vorgeschlagene Methode angenommen werden? "
jap.89.b:0	"Vertraulichkeit hat oberste Priorität."
MCK_nothing_tt:0	"Es wird nichts passieren\n"
jap.90.t:0	"Flyer-Verteiler festgenommen"
jap.90.a:0	"Sie werden uns nicht finden können, das Hauptquartier fügt sich sehr gut in die Umgebung ein."
jap.91.t:0	"Möglicher Informant"
jap.91.a:0	"Versuchen wir zunächst, ihn zu überzeugen."
jap.92.t:0	"Geheimes Treffen aufgedeckt"
jap.92.a:0	"Wir werden unsere Kameraden niemals im Stich lassen!"
jap.93.t:0	"Japanischer Ermittler getötet"
jap.93.b:0	"Gesetz ist Gesetz ..."
jap.94.d:0	"Eine Ermittlerin aus Japan ist zu Besuch bei [Root.GetLeader]. Die Ermittlerin fordert [Root.GetLeader] auf, ihr alles zu erzählen, was er über die aktuelle Restaurationsbewegung weiß. Die Ermittlerin scheint sehr überzeugt davon zu sein, dass [Root.GetLeader] in irgendeiner Weise mit der Bewegung in Verbindung steht. Lügen ist hier vielleicht nicht die beste Option, aber andere Restaurationisten zu verraten, ist es auch nicht."
jap.94.b:0	"\"Diese Verschwörer haben mich bereits zuvor kontaktiert, aber ich habe ihre Angebote abgelehnt...\""
jap.95.d:0	"[Root.GetLeader] beginnt nun zu vermuten, dass Stalker aus Tokio sein tägliches Leben noch genauer überwachen. Sogar einige Mitglieder der Bewegung haben berichtet, dass sie verfolgt werden, und zahlreiche Treffen mussten abgesagt werden, da wichtige Persönlichkeiten nicht am Treffpunkt eintreffen konnten. Die Stalker stellen zweifellos eine Bedrohung für unseren Plan dar, doch wir können Lockvögel einsetzen, um die Stalker abzulenken und so das Risiko einer Entdeckung zu verringern."
jap.95.b:0	"Ein solider Plan."
jap.96.d:0	"Einige Schlüsselpersonen haben berichtet, dass ihre Telefone abgehört werden. Die meisten glauben, dass dies das Werk japanischer Agenten ist. Viele von ihnen kommunizieren nun per Brief statt über das Telefon. Dies hat den Fortschritt der Bewegung drastisch verlangsamt."
increase_jap_awareness2_tt:0	"§RDas Bewusstsein der japanischen Regierung mäßig steigern\n§!"
increase_jap_awareness4_tt:0	"§RDas Bewusstsein der japanischen Regierung drastisch schärfen\n§!"
jap.97.d:0	"Die Japaner haben eine Geheimpolizei aufgestellt, nachdem sie von unseren Restaurationsbewegungen Kenntnis erlangt haben. Wir konnten uns einige Monate lang unauffällig verhalten. Nun haben wir jedoch erfahren, dass sie eine landesweite Razzia planen, um die Restaurationsaktivisten auszuschalten. Hochrangige Mitglieder der Bewegung haben zu einer Phase der Inaktivität aufgerufen, um nicht entdeckt zu werden. Dies wird unseren Fortschritt sicherlich erheblich verlangsamen, aber langfristig von Vorteil sein."
jap.97.b:0	"Wir dürfen nicht riskieren, erwischt zu werden!"
jap.98.d:0	"[MCK.GetName] hat Japanern seit einiger Zeit den Zugang zur Regierung untersagt. Eine solche Politik schadet unseren Interessen in der Region erheblich. Wir müssen die Aufhebung des Verbots fordern und unsere Interessen schützen. Sollten sie dem nicht nachkommen, könnten wir sie genauso gut in unser Reich "eingliedern" und das Gebiet unter unsere direkte Kontrolle stellen..."
jap.98.b:0	"Das kann später geschehen, wir müssen uns auf unser aktuelles Problem konzentrieren."
jap.99.d:0	"Ein Ultimatum von [From.GetName] ist auf dem Schreibtisch von [Root.GetLeader] eingegangen. Darin wird gefordert, dass wir das Einreiseverbot für Japaner in unsere Regierung aufheben. Sollten wir dem nicht nachkommen, könnten sie ihre Truppen für eine Offensive mobilisieren."
jap.99.b:0	"Abscheuliche Kreaturen! Wir werden unsere Macht niemals wieder an fremde Mächte abtreten!"
jap.100.d:0	"[From.GetLeader] hat beschlossen, das Verbot aufzuheben. Wir können nun unsere Kontrolle über das Gebiet mühelos festigen."
jap.101.t:0	"Verbot weiterhin in Kraft"
jap.101.a:0	"Sie strampeln nur gegen den Stachel."
jap.102.t:0	"Hausarrest [MCK.GetLeader]?"
jap.102.a:0	"Schicken Sie einige Männer, um ihn zu "bewachen"."
jap.103.t:0	"[Root.GetLeader] Unter Hausarrest"
jap.103.a:0	"Wir schlagen hart zurück!"
jap.104.t:0	"[From.GetName] Schlägt zurück"
jap.104.a:0	"Mudamudamudamudamudamuda!"
jap.105.d:0	"Unsere Aktion hat die Japaner provoziert, [From.GetName] hat uns den Krieg erklärt! "
jap.106.d:0	"Peking, einst Sitz des Kaisers, steht nun wieder unter unserer Kontrolle. Wir sollten die Residenz des Kaisers zurück in die Verbotene Stadt verlegen und diesen Rebellen zeigen, dass wir die Kontrolle über die Zentralebene zurückgewonnen haben!"
jap.106.a:0	"Lang lebe [Root.GetLeader]!"
jap.107.t:0	"Tod von [Root.GetLeader]"
jap.74.t:0	"Sich [JAP.GetName] anschließen?"
jap.74.d:0	"Angesichts der aktuellen Lage bietet sich uns eine einmalige Gelegenheit, uns von den [CHI.GetAdjective] zu lösen und uns den [JAP.GetAdjective] anzuschließen. Sollen wir jetzt handeln?"
jap.74.a:0	"Eine solche Chance wird sich nicht wieder bieten."
jap.75.d:0	"Angesichts ihrer aktuellen Lage hat [From.GetLeader] beschlossen, uns zu kontaktieren und um unsere Hilfe zu bitten, damit sie sich von der [CHI.GetAdjective] befreien können. Im Gegenzug werden sie uns Treue schwören."
jap.75.a:0	" Interessant"
jap.75.b:0	"Das erscheint mir zu verdächtig"
jap.77.t:0	"[From.GetName] hat abgelehnt"
jap.77.d:0	"[From.GetName] hat unsere Anfrage aus unbekannten Gründen abgelehnt."
jap.77.a:0	"Verdammt."
jap.111.t:0	"Unsere Verbündeten anrufen?"
jap.111.d:0	"Da wir nun im Krieg mit [SOV.GetNameDef] stehen, können wir unsere Verbündeten auffordern, sich unserer Sache anzuschließen."
jap.111.a:0	"Bitten Sie sie um Unterstützung."
jap.112.a:0	"Eine fantastische Idee!"
jap.112.b:0	"Nein!"
jap.113.t:0	"Allianz geschlossen"
jap.114.d:0	"[GER.GetName] hat unser Angebot zur Bildung einer Allianz abgelehnt."
jap.114.a:0	"Schade"
jap.116.t:0	"[From.GetName] bittet um unsere Unterstützung"
jap.117.t:0	"[From.GetName] Geehrte Allianz"
jap.117.d:0	"[From.GetName] hat sich unserem Krieg gegen die [SOV.GetAdjective] Bedrohung angeschlossen!"
jap.117.a:0	"Fantastisch!"
jap.119.t:0	"Uns unserem Verbündeten anschließen?"
jap.119.d:0	"Unser Verbündeter befindet sich nun im Krieg mit [SOV.GetNameDef]. Sollen wir unser Bündnis ehren und uns ihrer Sache anschließen?"
jap.109.d:0	"Unser Verbündeter, [JAP.GetName], ist in einen Krieg mit [USA.GetNameDef] eingetreten. Wir können uns unseren Freunden von [JAP.GetAdjective] anschließen, indem wir [USA.GetName] den Krieg erklären, als Zeichen der Freundschaft als Gegenleistung für deren Unterstützung in unserem aktuellen Krieg gegen [SOV.GetNameDef]. Einige Beamte weisen jedoch darauf hin, dass eine Kriegserklärung an [USA.GetNameDef] möglicherweise nicht im besten Interesse von [Root.GetName] liegt."
jap.110.d:0	"Als Zeichen der Freundschaft hat [From.GetName] beschlossen, sich unserem Krieg gegen die [USA.GetName]-Barbaren anzuschließen. Im Gegenzug haben sie uns um Unterstützung in ihrem Krieg gegen [SOV.GetNameDef] gebeten. "
jap.110.a:0	"Wir werden die Bedrohung durch [SOV.GetAdjective] gemeinsam besiegen!"
jap.110.b:0	"Vielleicht … später?"
jap.108.a:0	"Sicher"
jap.108.b:0	"Zeitverschwendung."
jap.120.t:0	"Eine Marionette von [JAP.GetName] werden?"
jap.121.t:0	"[From.GetName] Rebellen"
jap.121.d:0	"Nachdem ihr ehemaliger Oberherr [CHI.GetName] die kluge Entscheidung getroffen hat, unsere Marionette zu werden, haben die starrköpfigen Wilden von [From.GetName] beschlossen, dass sie unter unserem eisernen Stiefel zugrunde gehen werden."
jap.121.a:0	"Lächerlich."
jap.129.a:0	"Rufen Sie den [JAP.GetAdjective] Außenminister an"
jap.129.b:0	"Pah! Lesen Sie ein paar Geschichtsbücher, dann weiß jeder, dass Russland unbesiegbar ist!"
jap.130.t:0	"Nichtangriffspakt mit [From.GetName]? "
jap.131.t:0	"Sowjetisch-japanischer Neutralitätspakt"
jap.131.d:0	"[From.GetName] hat den Pakt unterzeichnet, wir können uns nun stärker auf die [GER.GetAdjective] Bedrohung konzentrieren."
jap.131.a:0	"Ein Haufen Narren ..."
jap.135.d:0	"Gemäß dem kürzlich unterzeichneten sowjetisch-japanischen Neutralitätspakt hat [SOV.GetName] beschlossen, keine militärische Hilfe mehr an uns zu senden."
jap.135.a:0	"Verdammt"
jap.138.a:0	"Angriff!"
jap.138.b:0	"Halten wir uns vorerst zurück."
jap.139.t:0	"[From.GetName] erklärt [SOV.GetNameDef] den Krieg"
jap.140.d:0	"Da wir den Krieg verlieren, [From.GetNameDef] hat beschlossen, uns den Krieg zu erklären, um seinen Anteil an der Beute zu beanspruchen."
jap.140.a:0	"Verdammt seien diese gelben Gefahren!"
jap.141.t:0	"Die [JAP.GetAdjective] angreifen?"
jap.142.t:0	"[From.GetName] erklärt uns den Krieg"
jap.142.d:0	" [From.GetAdjective] Truppen haben die Grenze überschritten und eine Offensive gegen unsere Truppen in Grenznähe gestartet. Die Kriegserklärung traf kurz darauf auf dem Schreibtisch unseres Premierministers ein."
jap.142.a:0	"Alles bricht zusammen!"
jap.145.d:0	"[WJW.GetNameDefCap] wurde von [WJW.GetLeader] mit Unterstützung der Japaner gegründet. Einige unserer Generäle sind ebenfalls zu ihnen übergelaufen."
jap.145.a:0	"Verräter!"
jap.146.a:0	"Tun Sie es!"
jap.146.b:0	"Nicht jetzt."
jap.147.t:0	"[From.GetName] möchte sich uns anschließen"
jap.148.t:0	" [From.GetName] Akzeptiert"
jap.148.d:0	"[From.GetName] hat uns in ihren Einflussbereich aufgenommen."
jap.148.a:0	"Großartig!"
jap.150.t:0	"[From.GetName] Ergreift [KMT_land_grabbed.GetName]"
jap.150.d:0	"Da wir im aktuellen Bürgerkrieg mit inneren Feinden zu tun haben, [From.GetName] hat diese Gelegenheit genutzt und [KMT_land_grabbed.GetName] besetzt!"
jap.150.a:	"Unverschämt!"
jap.151.a:0	"Es ist an der Zeit, dass wir sie dieses Mal unterwerfen!"
jap.151.b:0	"Eine schreckliche Idee."
jap.152.t:0	"Kontakt zum Wang-Jingwei-Regime"
KMT_nice_to_become_dog_tt:0	"\n§GEs ist außergewöhnlich, dass wir [From.GetName]s Handlanger werden können§!\n"
jap.115.t:0	"[GER.GetName] Abgelehnt [JAP.GetAdjective] Vorschlag"
jap.115.d:0	"Bei einem kürzlichen Treffen der Außenminister der beiden Großmächte hat [GER.GetAdjective] einen [JAP.GetAdjective]-Vorschlag für einen Verteidigungspakt abgelehnt, der darauf abzielt, die [SOV.GetAdjective]-Bedrohung einzudämmen. Man könnte sich fragen, warum [GER.GetName] einen so vorteilhaften Vorschlag ablehnen würde, da die Grenze zu [SOV.GetNameDef] eine große Bedrohung für die nationale Sicherheit darstellen würde. Andererseits hat der Außenminister von [JAP.GetAdjective] zwar seine Enttäuschung zum Ausdruck gebracht, bleibt jedoch hoffnungsvoll hinsichtlich künftiger Kooperationen. \n\nBislang liegt noch keine Stellungnahme der Behörden von [SOV.GetNameDef] zu dieser Angelegenheit vor."
jap.115.a:0	"Zan nen da..."
jap.115.f:0	"Wir wollen sicherlich nicht, dass unser Feind weitere Verbündete gewinnt."
jap.126.t:0	"Gründung von [WJW.GetNameDef]"
jap.126.a:0	"Japan soll über sie alle herrschen!"
jap.126.c:0	"Ein weiterer verabscheuungswürdiger Hund der japanischen Barbaren."
jap.127.d:0	"Nachdem von ihnen verlangt wurde, sich in eine neue Marionettenregierung einzugliedern, [From.GetName] hielten sie stand und lehnten dieses Angebot sowie die [JAP.GetAdjective] tyrannische Herrschaft ab. Sie haben nun die ehemalige Marionettenregierung gestürzt und beschlossen, für ihre eigenen Interessen zu kämpfen, das heißt, die japanische Bedrohung zu beseitigen."
jap.127.b:0	"Schöner Verrat!"
jap.127.e:0	"Wir werden niemals Sklaven sein!"
jap.133.d:0	"[JAP.GetNameDefCap] und [SOV.GetNameDef] haben einen Nichtangriffspakt miteinander geschlossen. Dies würde es [SOV.GetNameDef] ermöglichen, einen größeren Teil seiner militärischen Stärke auf [GER.GetAdjective] zu konzentrieren, und für [JAP.GetAdjective] würde dies auch bedeuten, dass sie sich um eine Sache weniger sorgen müssten, sollten sie beschließen, weitere militärische Aktionen in Asien zu unternehmen."
jap.133.b:0	"Ein Pakt mit dem Teufel."
jap.133.e:0	"Interessante Entwicklung."
jap.134.d:0	"\nIn einem jüngsten Versuch, einen möglichen Zweifrontenkrieg zu vermeiden, hat [SOV.GetLeader] den Außenminister von [JAP.GetName] angerufen, um einen Nichtangriffspakt zwischen den beiden Nationen zu erörtern. [JAP.GetName] hat jedoch alle Bedingungen entschieden abgelehnt und erklärt, dass man den Sowjets nicht trauen könne.\n\nDie seit langem bestehenden feindseligen Beziehungen zwischen den beiden Nationen könnten sich noch weiter verschlechtern."
jap.134.b:0	"Wir werden keinen Pakt mit dem Teufel schließen!"
jap.134.e:0	"Sie werden bald ihren eigenen Untergang herbeiführen."
jap.136.t:0	"[KMT_SJ_neutrality_broker.GetName] hat den sowjetisch-japanischen Neutralitätspakt gebrochen"
jap.136.a:0	"Wir wussten es!"
jap.136.c:0	"Dies wird der Untergang von [KMT_SJ_neutrality_attacked.GetName] sein!"
jap.136.f:0	"Dies könnte unsere Chance sein!"
jap.136.h:0	" Das Vertrauen zwischen den Großmächten ist hauchdünn."
