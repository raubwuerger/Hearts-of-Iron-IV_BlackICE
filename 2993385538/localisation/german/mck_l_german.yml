 ## news ##
jap.115.b:0	"Wir haben unsere eigenen Gründe..."
jap.115.c:0	"Was für ein erbärmlicher Versuch."
jap.115.e:0	"Interessante Entwicklung."
jap.126.d:0	"\nit Unterstützung der [JAP.GetAdjective]-Regierung wurde [WJW.GetLeader] in Nanking als Chef der [WJW.GetNameDef] mit Sitz in [WJW.Capital.GetName] an die Macht gebracht. Die Marionettenregierung wird bald von [JAP.GetName]'s Verbündeten und ihren anderen Marionetten anerkannt, während andere dies nicht tun.\n\n[WJW.GetLeader]'s Aktion würde von den Chinesen, die noch gegen die japanischen Invasoren kämpfen, als Verrat angesehen werden. Sollte der Krieg mit einer japanischen Niederlage enden, könnte er mit ernsten Konsequenzen rechnen."
 ## 10/10/2017 ##
jap.126.b:0	"Japans Einflussbereich wächst..."
jap.127.t:0	"[From.GetName] rebelliert gegen [JAP.GetName]"
jap.127.a:0	"Verräter!"
jap.127.c:0	"Ein Wolf, der in der Nähe gehalten wird, wird sich irgendwann gegen dich wenden."
 ## 13/10/2017 ## ""
jap.133.a:0	"Ein Sieg für uns."
 ## 13/10/2017 ##
jap.133.c:0	"Solch ein Verrat!!"
jap.134.t:0	"[JAP.GetName] lehnt Nichtangriffspakt mit [SOV.GetName] ab"
jap.134.a:0	"Verflucht seien diese gelben Gefahren!"
jap.134.c:0	"Ein erbärmlicher Versuch."
jap.134.f:0	"Eine Fehlkalkulation von [SOV.GetNameDef], vielleicht."
jap.136.d:0	"\n[KMT_SJ_neutrality_broker.GetName] hat den sowjetisch-japanischen Neutralitätspakt gebrochen, indem er [KMT_SJ_neutrality_attacked.GetName] den Krieg erklärt hat. Die Kriegsmaschinen von [KMT_SJ_neutrality_broker.GetAdjective] haben die Grenze überquert und sind in die Gebiete von [KMT_SJ_neutrality_attacked.GetAdjective] eingedrungen. Obwohl sie über den Verrat von [KMT_SJ_neutrality_broker.GetName] schockiert ist, hat [KMT_SJ_neutrality_attacked.GetName] begonnen, Truppen zu mobilisieren, um die Front von [KMT_SJ_neutrality_broker.GetAdjective] zu verteidigen."
jap.136.b:0	"Wir werden sie begraben!"
jap.136.e:0	"Hinterhältige Bastarde!"
jap.136.g:0	"Wir herrschen über alles!"

