MAN_low_legitimacy_1_desc:0	"Kaiser Puyi ist der legitime Nachkomme der Qing-Kaiser, die China dreihundert Jahre lang regiert haben. Die Xinhai-Revolution, die ihn 1911 absetzte, war sehr populär, da die späte Qing-Regierung sowohl gegen die Ausländer, die chinesisches Land stahlen, als auch gegen die regionalen Gouverneure, die sich als Warlords etablierten, machtlos war. Die Einsetzung von Kaiser Puyi durch Japan als Kaiser von Mandschukuo wird von der mandschurischen Bevölkerung noch nicht akzeptiert, ganz zu schweigen vom Rest Chinas.\n\n Wir werden die Unabhängigkeit des Kaisers von Japan herstellen müssen, um die Nation unter ihm zu versammeln."
MAN_banditry:0	"Banditentum"
MAN_banditry_desc:0	"Wir befinden uns in einem Krieg niedriger Intensität mit Partisanen, Überläufern und republikanischen Terroristen. Wir sollten uns auf die Befriedung des Landes konzentrieren, um diese Banditen zur Strecke zu bringen."
MAN_kwantung_veto:0	"Kwantung-Veto"
MAN_kwantung_veto_desc:0	"Nachdem Japan 1905 Dalian von Russland erobert hatte, wurde die dort stationierte Garnison Kwantung (Kantō auf Japanisch) politisiert, und expansionistische Generäle ergriffen die Initiative, um mehr chinesisches Land für Japan zu erobern. Dies gipfelte im Mukden-Zwischenfall von 1932, als das Reich Mandschukuo aus den kleinen Kriegsherren des Nordostens herausgelöst wurde. Die Kwantung-Armee dominiert das Gebiet weiterhin und stellt die Interessen ihrer Generäle über die Bedürfnisse Mandschukuos. Wir werden das Problem nur lösen, indem wir die japanische Armee dazu bringen, uns als gleichberechtigt anzuerkennen, oder indem wir sie mit Gewalt vertreiben."
