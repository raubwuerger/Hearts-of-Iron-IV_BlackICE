MAN_arms_seized_1:0	"Munitionsknappheit in der Mandschurei"
MAN_arms_seized_1_desc:0	"Die Qing haben einen Überraschungsangriff inszeniert und eine Reihe von Waffendepots und Munitionslagern auf ihrem Gebiet beschlagnahmt. Es wird einige Zeit dauern, unsere Versorgungsketten in ihrem Gebiet zu reorganisieren."
MAN_underground_gun_shops:0	"Unterirdische Werkstätten"
MAN_underground_gun_shops_desc:0	"Wir haben eine Reihe von behelfsmäßigen Werkstätten in Hinterhöfen und Kellern eingerichtet, um mehr Ausrüstung zu produzieren. Die Qualität ist vielleicht nicht so gut, aber das machen sie durch ihre Anzahl wieder wett."
