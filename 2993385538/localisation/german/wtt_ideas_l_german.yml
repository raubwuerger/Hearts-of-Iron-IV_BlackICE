l_german:
CHI_nine_power_treaty:0	"Neun-Mächte-Vertrag"
CHI_nine_power_treaty_desc:0	"Wir leiden immer noch unter den Auswirkungen der ungleichen Verträge, die die Politik der offenen Tür gegenüber China formalisieren. Die Ausländer haben immer noch extraterritoriale Rechte, und wir haben nicht die volle Kontrolle über unsere Wirtschaft."
CHI_army_corruption:0	"Korruption in der Armee"
CHI_army_corruption_desc:0	"Unsere Streitkräfte sind von Korruption und Vetternwirtschaft durchsetzt. Wenn wir sie in eine schlagkräftige Kampftruppe verwandeln wollen, müssen wir ein langwieriges und teures Programm zur Reform der Armee in Angriff nehmen."
CHI_ineffective_bureaucracy:0	"Ineffektive Bürokratie"
CHI_ineffective_bureaucracy_desc:0	"Das Chaos des Bürgerkriegs hat den Aufbau eines effektiven Staatsapparats gestört. Mehr als ein Drittel der verfügbaren Rekruten wird nicht eingezogen, einfach weil niemand weiß, dass es sie gibt. Eine Reform des Prüfungsverfahrens wird sicherstellen, dass wir kompetente Leute einstellen."
CHI_warlord_state_idea:	"Warlord-Staat"
CHI_warlord_state_idea_desc:	"Unser Staat ist weit von der Definition des Wortes entfernt. Es handelt sich um eine Region und Menschen, die ihr tägliches Leben unter dem Schutz einer unabhängigen Armee leben, die keinem Staat die Treue schwört. Das führt dazu, dass wir als Regierung sehr wenig tun können, aber es hat auch seine Vorteile."
CHI_warlord_state_idea_tt:	"Dieser Geist wird entfernt, sobald einer der Schwerpunkte §YMachtkampf§!, §YDer Yan'an-Zwischenfall§! und §YAusrufung einer rivalisierenden Regierung§! abgeschlossen ist."
CHI_incompetent_officers:0	"Inkompetente Offiziere"
CHI_incompetent_officers_desc:2	"Unsere Offiziere sind der Aufgabe, einen modernen Krieg zu führen, noch nicht gewachsen. Sie müssen erst noch harte Lektionen lernen, bevor sie ihren Kollegen in anderen Nationen wirklich ebenbürtig sind. Ihre Ausbildung wird Teil eines größeren Programms zur Reform der Armee sein."
CHI_hyper_inflation_none:0	"Stabile Wirtschaft"
CHI_hyper_inflation_none_desc:0	"Die Wirtschaft zeigt keine Anzeichen von Problemen."
CHI_hyper_inflation_1:0	"Niedrige Inflation"
CHI_hyper_inflation_1_desc:0	"Unsere Wirtschaftsexperten haben einen leichten Anstieg der Inflation festgestellt. Wir sollten das im Auge behalten."
CHI_hyper_inflation_2:0	"Mäßige Inflation"
CHI_hyper_inflation_2_desc:0	"Die Inflation hat begonnen, die Wirtschaft erheblich zu beeinträchtigen. Wir sollten Gegenmaßnahmen in Betracht ziehen, bevor die Dinge außer Kontrolle geraten."
CHI_hyper_inflation_3:0	"Starke Inflation"
CHI_hyper_inflation_3_desc:0	"Das von der Regierung ausgegebene Geld ist immer weniger wert, die Kaufkraft sinkt und einige Güter sind nur noch für Menschen mit den richtigen Verbindungen erhältlich."
CHI_hyper_inflation_4:0	"Hyperinflation"
CHI_hyper_inflation_4_desc:0	"Der Wert unserer Währung verflüchtigt sich. Die Preise steigen von Tag zu Tag dramatisch an. Wir müssen sehr dringend Gegenmaßnahmen ergreifen, bevor wir einen vollständigen Zusammenbruch erleiden."
CHI_hyper_inflation_5:0	"Wirtschaftlicher Zusammenbruch"
CHI_hyper_inflation_5_desc:0	"Unser Währungssystem ist vollständig zusammengebrochen. In weiten Teilen des Landes ist der Handel zu einem Tauschhandelssystem zurückgekehrt. Armut ist weit verbreitet. Unsere Angestellten verwenden das Papiergeld, mit dem wir sie bezahlen, um ihre Häuser zu heizen. Ein aggressives Programm zur Finanz- und Wirtschaftsreform ist notwendig, um die Situation zu lösen."
