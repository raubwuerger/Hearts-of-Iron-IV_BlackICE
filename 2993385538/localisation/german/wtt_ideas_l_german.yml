PRC_the_long_march:1	"Nachwirkungen des Langen Marsches"
PRC_the_long_march_desc:0	"Der lange Rückzug nach Shanxi hat unsere Kräfte geschwächt und die Yan'an-Basiszone ist noch nicht bereit, einen größeren Aufstand zu unterstützen. Es wird Zeit oder Hilfe von außen brauchen, um sich zu erholen."
PRC_the_long_march_2:0	"Erholung vom Langen Marsch"
PRC_low_popular_support:0	"Geringe Unterstützung durch die Bevölkerung"
PRC_low_popular_support_desc:0	"Die Bauern haben im Bürgerkrieg schwer gelitten. Wenn wir als legitime Regierung Chinas akzeptiert werden wollen, müssen wir ihre Unterstützung gewinnen."
PRC_power_struggles:0	"Machtkämpfe"
PRC_power_struggles_desc:0	"Die Partei ist intern uneins über die beste Vorgehensweise. Kämpfe zwischen verschiedenen Fraktionen sind ausgebrochen und werden weitergehen, bis eine von ihnen die Oberhand gewinnt."
PRC_red_army_weakened:0	"Rote Armee geschwächt"
PRC_red_army_weakened_desc:0	"Erschöpft vom Langen Marsch ist unsere Rote Armee noch nicht kampffähig. Wir müssen neue Einheiten aufstellen und eine neue Armee der Befreiung bilden."
