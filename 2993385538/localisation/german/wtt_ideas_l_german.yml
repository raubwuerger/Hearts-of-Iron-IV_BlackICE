MAN_low_legitimacy:0	"Geringe Legitimität"
MAN_low_legitimacy_5_desc:0	"Kaiser Puyi ist der legitime Nachkomme der Qing-Kaiser, die China dreihundert Jahre lang regierten. Die Xinhai-Revolution, die ihn 1911 absetzte, war sehr populär, da die späte Qing-Regierung sowohl gegen die Ausländer, die chinesisches Land stahlen, als auch gegen die regionalen Gouverneure, die sich als Warlords etablierten, machtlos war. Die Einsetzung von Kaiser Puyi durch Japan als Kaiser von Mandschukuo wird von der mandschurischen Bevölkerung noch nicht akzeptiert, ganz zu schweigen vom Rest Chinas.\n\n Wir werden die Unabhängigkeit des Kaisers von Japan herstellen müssen, um die Nation unter ihm zu versammeln."
MAN_low_legitimacy_4_desc:0	"Kaiser Puyi ist der legitime Nachkomme der Qing-Kaiser, die China dreihundert Jahre lang regiert haben. Die Xinhai-Revolution, die ihn 1911 absetzte, war sehr populär, da die späte Qing-Regierung sowohl gegen die Ausländer, die chinesisches Land stahlen, als auch gegen die regionalen Gouverneure, die sich als Warlords etablierten, machtlos war. Die Einsetzung von Kaiser Puyi durch Japan als Kaiser von Mandschukuo wird von der mandschurischen Bevölkerung noch nicht akzeptiert, ganz zu schweigen vom Rest Chinas.\n\n Wir werden die Unabhängigkeit des Kaisers von Japan herstellen müssen, um die Nation unter ihm zu versammeln."
