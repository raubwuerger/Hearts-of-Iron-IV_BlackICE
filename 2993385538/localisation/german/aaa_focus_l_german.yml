ENG_complete_mountbatten:	"\nSchließen Sie den §Y$ENG_Mountbatten$§! Fokus ab, um Folgendes zu erhalten:\n"
ENG_exibition_desc:	"Ähnlich wie die von der Sowjetunion ausgerichtete Weltausstellung werden wir in Glasgow eine Imperiumsausstellung veranstalten, um der Welt die Fortschritte, Ressourcen, Kultur und globalen Friedensbestrebungen unseres Imperiums zu präsentieren."
ENG_MI8c_desc:	"Dieser Zweig, auch bekannt als Radio Security Service, ist dafür verantwortlich, sicherzustellen, dass unsere Kommunikation sicher ist und nicht von feindlichen Agenten abgefangen werden kann."
ENG_MI9_desc:	"Der MI9 infiltriert feindliches Gebiet und unterstützt unsere auf feindlichem Boden gestrandeten Armeeangehörigen, indem er Flucht- und Ausweichrouten zurück in verbündetes Gebiet einrichtet, um einer Gefangennahme zu entgehen."
ENG_MI19_desc:	"Grausamkeit und Folter sind trotz humanitärer Bedenken im Krieg notwendig, um von gefangenen Kämpfern entscheidende Informationen zu erhalten, die durch normale Verhöre niemals gewonnen werden könnten."
ENG_Special_desc:	"Der SOE, der vor dem Krieg aus drei separaten Abteilungen zusammengelegt wurde, wird feindliche Einrichtungen angreifen und sabotieren, die für deren Kriegsanstrengungen von entscheidender Bedeutung sind, und lokale Widerstandsbewegungen unterstützen, um die Besatzungsmächte weiter zu schwächen."
ENG_Political_Warfare_desc:	"Wie im Ersten Weltkrieg bewiesen wurde, hat moderne Propaganda einen greifbaren Einfluss auf den Ausgang von Kriegen. Experten der Political Warfare Executive werden inländische Propaganda erstellen und ausländischer Propaganda entgegenwirken, damit wir als Sieger hervorgehen."
ENG_Fifth_desc:	"Der feindliche Geheimdienst versucht, gefährdete Bürger zu bestechen oder zu erpressen, damit sie gegen unsere Interessen arbeiten, doch die Fähigkeiten des Feindes sind auch unsere eigenen."
ENG_Ministry_desc:	"Das Informationsministerium wird feindlicher Propaganda entgegenwirken und sie entlarven und, falls erforderlich, selbst Propaganda verbreiten, um zu verhindern, dass unsere Bevölkerung ihren Kampfgeist verliert."
ENG_Ultra_desc:	"Der feindliche Chiffrierverkehr wird durch sogenannte Enigma-Maschinen verschlüsselt und ist theoretisch völlig unknackbar, doch unsere besten Spezialisten in Bletchley Park werden dennoch daran arbeiten, den Code zu knacken."
ENG_MI15_desc:	"Die Abteilung 15 wird unserem Kommando aktuelle Luftaufklärungsdaten sowie die Standorte feindlicher Flugabwehranlagen liefern."
ENG_MI14_desc:	"Der MI14 versorgt unser Oberkommando mit aktuellen Karten, die für die Planung von Offensiv- und Defensivoperationen in bestimmten Gebieten erforderlich sind."
ENG_Testery_desc:	" Dieser Zweig von Bletchley Park wird weiterhin Informationen aus entschlüsselten feindlichen Kommunikationen zwischen dem Oberkommando und einzelnen Einheiten abgreifen."
ENG_Joint_desc:	"Die Überwachung und Bewertung eingehender Informationen ist die Aufgabe des Ausschusses, bevor diese den politischen Entscheidungsträgern vorgelegt werden."
