TIB_angry_british_desc:	"Die Grenze zwischen unserem Land und dem Britischen Empire verläuft durch ein abgelegenes Tal in der Nähe des Dorfes Tawang. Die Ungenauigkeit der Karte verursacht ein kleines Problem: Einige Dörfer wurden doppelt besteuert, da beide Seiten der Ansicht waren, dass sie unter ihrer jeweiligen Gerichtsbarkeit stünden. Um unsere guten Beziehungen zu den Briten zu wahren, muss die Grenze eindeutig festgelegt werden."
