LOW_SUPPLIES_TIPS:2	"Die folgenden Maßnahmen können Ihnen helfen, die Situation zu lösen:\n – Verteilen Sie Ihre Einheiten oder weisen Sie ihnen neue Aufgaben zu, um den lokalen Verbrauch zu senken. \n\n - Errichten Sie Infrastruktur höherer Stufe und stellen Sie sicher, dass es keine Eisenbahnengpässe von der Hauptstadt aus gibt.\n\n - Wenn Sie über genügend Lastwagen verfügen, können Sie Knotenpunkte in der Region motorisieren, wodurch deren Versorgungskapazität und Reichweite erhöht werden.\n\nWenn die Versorgung in dem Gebiet auf dem Seeweg erfolgt, können Sie außerdem:\n - Das Level der Marinestützpunkte in den Ausgangs- und Zielprovinzen verbessern. \n\n - Stellen Sie sicher, dass Sie genügend Konvois gebildet haben.\n\n - Stellen Sie sicher, dass Sie Konvois entlang der Route mit der Marine-Mission "Konvoieskorte" eskortieren. Die Lieferleistung kann sinken, wenn Konvois versenkt werden."
