wuw_GER_reichskommissariats.17.t:	"Der Status der Slowakei"
wuw_GER_reichskommissariats.17.desc:	"Mit der Einnahme der slowakischen strategischen Zone stellt sich die Frage, wie mit der Region verfahren werden soll. Einige Pläne sehen vor, das Gebiet in den Balkan einzugliedern, während andere vorschlagen, es an den böhmischen Staat anzugliedern oder möglicherweise sogar in den großdeutschen Staat zu integrieren. Was sagen wir dazu?"
wuw_GER_reichskommissariats.17.a:	"Ungarn sollte belohnt werden"
wuw_GER_reichskommissariats.17.b:	"Es sollte in Balkan eingegliedert werden"
wuw_GER_reichskommissariats.17.c:	"Es sollte in Böhmen-Mähren eingegliedert werden"
wuw_GER_reichskommissariats.17.d:	"Es sollte in unser Reich eingegliedert werden"
