l_german:
wuw_GER_news.1.t:	 "Die Wiedervereinigung Deutschlands"
wuw_GER_news.2.desc:	"Zum vierten Mal seit der Unterzeichnung des Versailler Vertrags haben sich Rebellen in Deutsch-Schlesien gegen die Regierung erhoben. Diesmal [SIL.GetLeader] behauptet, dass die Ziele ihrer militärischen Aktionen vor allem darin bestehen, die Unabhängigkeit eines schlesischen Staates zu sichern und gleichzeitig das schlesische Volk während des deutschen Bürgerkriegs vor Schaden zu bewahren, obwohl frühere Aufstände eher darauf abzielten, Autonomie innerhalb des polnischen Staates zu erlangen. Nur die Zeit wird zeigen, ob sie der deutschen Armee die Stirn bieten können."
wuw_GER_news.2.a:	"Eine interessante Wendung der Ereignisse"
AUS_political_events.1.a:	"Es ist am sichersten, alles so zu belassen, wie es ist"
AUS_political_events.1.a_tt:	" An unseren Industriekonzernen werden keine Änderungen vorgenommen. Der Creditanstalt-Bankverein bleibt bestehen und gewährt:"
AUS_political_events.1.b:	"Die Österreichische Creditanstalt ist die klügste Wahl"
AUS_political_events.1.c:	"Der Wiener Bankverein wird uns nicht im Stich lassen"
AUS_reestablish_benkverein:	 "Der Creditanstalt-Bankverein wird aufgelöst, und der neue Wiener Bankverein erhält unsere volle Unterstützung."
AUS_political_events.3.a_tt:	"Schaltet die §YAnti-Anschluss-Maßnahmen§!-Entscheidungen frei"
AUS_political_events.4.desc:	" Der zuvor offen faschistische Kardinal Theodor Innitzer hat kürzlich seine Rhetorik radikal geändert. Nachdem er zuvor lautstark und öffentlich den Nationalsozialismus und den [GER.GetAdjective] Führer unterstützt hatte, bezog er in einer Messe am 7. Oktober eindeutig Stellung gegen den Führer. Anstelle seiner üblichen Predigten darüber, dass die Massen ihr Vertrauen in [GER.GetLeader] setzen sollten, wies er sie nun wieder auf den Herrn hin. \n \n Die [GER.GetAdjective] Führung ist wütend und wünscht, dass wir Maßnahmen ergreifen."
AUS_political_events.4.b:	"Herr Innitzer darf seine eigene Meinung haben."
AUS_political_events.5.desc:	"Ein Vorschlag der [AUS.GetAdjective] Diplomaten in unserem Land ist soeben bei uns eingegangen. Nachdem sie vom Vertrag von Saint-Germain-En -Laye möchten sie nun ihre Armee wiederaufbauen, wie sie uns versichert haben, zu Verteidigungszwecken. Ihr Land hat eine Tradition in der Herstellung recht robuster Flugzeugzellen und verfügt über eine ganze Reihe talentierter Piloten, doch angesichts der Lücken in ihrer Produktion und Ausbildung stehen sie nun vor der Herausforderung, diese Kapazitäten wiederherzustellen. Wenn wir bereit sind, über ihre Handlungen im Ersten Weltkrieg hinwegzusehen, könnten wir von dieser Partnerschaft profitieren. "
AUS_political_events.5.c:	"Wir glauben diese "defensive" Lüge, die sie uns erzählen, nicht."
AUS_political_events.8.t:	"[FROM.GetNameDefCap] Lehnt unsere vorgeschlagene Partnerschaft ab"
AUS_political_events.9.t:	"Wilhelm Zehner ermordet"
AUS_political_events.9.desc:	"Wilhelm Zehner, eines der Mitglieder unseres Oberkommandos, wurde tot in seiner Wohnung aufgefunden. Die [GER.GetAdjective] Diplomaten bestreiten alles und behaupten, sie seien nicht beteiligt gewesen und Zehner müsse dies selbst mit der Waffe getan haben, mit der er aufgefunden wurde. Die strafrechtlichen Ermittlungen weisen in eine ganz andere Richtung..."
AUS_anschluss_ratio_lowered:	 "Die §YGesamtkampfstärke der Armee§!, die für den §YAnschluss§! erforderlich ist, wird §Ygesenkt§!"
##### |___KY 048936___| „Die |___CC009518___|Gesamtkampfstärke der Armee|___CC009519___|, die für den |___CC009520___|Anschluss|___CC009521___| erforderlich ist, wird |___CC009522___|erhöht|___CC009523___| „
AUS_political_events.10.t:	"Attentat auf Wilhelm Zehner vereitelt"
AUS_political_events.10.desc:	"Gestern Abend drang die Gestapo in die Wohnung von Wilhelm Zehner ein und stieß auf die Wachen, die wir um unser Oberkommando postiert hatten. Der Kampf dauerte nicht lange, und Zehner ging völlig unverletzt aus der Auseinandersetzung hervor."
AUS_political_events.10.a:	"Wir wussten es!"
AUS_political_events.11.a_tt:	" Löst die Mission aus §Y[GER.GetAdjective] Feindseligkeit gegenüber dem Oberkommando der Wehrmacht§!\n\nGelingt es nicht, den Tod Zehners zu verhindern, führt dies zur §YGesamt Kampfstärke der Armee§!, die für §Yden Anschluss§! erforderlich ist, §Yverringert§!. "
AUS_political_events.11.b:	"Wenn es das ist, was nötig ist, um ihren Unsinn zu beenden..."
AUS_political_events.12.t:	"[FROM.GetNameDefCap] bietet uns Infanterieausrüstung an"
AUS_political_events.13.desc:	"Wir haben Proteste gegen das Embargo erhalten, das wir wie viele andere verhängt haben [ITA.GetNameDef]. Mit der Behauptung, das Embargo sei unzumutbar und unbegründet, hat die Führung von [AUS.GetAdjective] gefordert, dass wir das Embargo aufheben.\n\nAuf Nachfrage nach den Gründen für ihren Protest gegen das Embargo weigert sich die Führung von [FROM.GetNameDef], näher darauf einzugehen."
AUS_political_events.14.desc:	"[FROM.GetNameDefCap] hat kürzlich gegen das gegen uns verhängte Embargo protestiert. Mit der Begründung, dass wir ein äußerst geschätzter Verbündeter seien, haben sie aktiv Einwände an alle Länder gerichtet, die uns mit einem Embargo belegt haben, um die Situation für uns zumindest ein wenig zu entschärfen."
AUS_political_events.15.a:	"So leicht werden sie uns nicht verlieren! "
AUS_political_events.15.b:	"Wie unhöflich!"
AUS_political_events.16.a_tt:	"Ernennt §YArthur Seyss -Inquart§! als Berater, der §Rnicht entlassen werden kann§!\n"
AUS_political_events.18.t:	"[FROM.GetNameDefCap] Ernennt Arthur Seyss-Inquart zum Berater"
AUS_political_events.18.a:	"Gut"
AUS_political_events.19.a:	"Wir brauchen jede Hilfe, die wir bekommen können!"
AUS_von_brumowski_recruited_flag:	"Godwin von Burmowski rekrutiert"
AUS_political_events.20.t:	"[FROM.GetNameDefCap] Bittet um unsere Unterstützung"
AUS_political_events.20.a:	"Ihre Unabhängigkeit ist für uns von größter Bedeutung!"
AUS_political_events.20.b:	"Wir werden sie diplomatisch unterstützen"
AUS_political_events.20.c:	"Vielleicht können wir eine für beide Seiten vorteilhafte Vereinbarung erzielen"
AUS_political_events.20.d:	"Wir werden für sie kein Risiko eingehen"
AUS_political_events.21.a:	"Ausgezeichnet!"
AUS_political_events.22.a:	"Nicht das, worum wir gebeten haben, aber besser als nichts."
AUS_political_events.23.desc:	"[FROM.GetNameDefCap] hat auf unsere Bitte um Hilfe mit einer eigenen Forderung reagiert. Seitdem uns dieser Vertrag auferlegt wurde, haben wir uns bemüht, Südtirol und das Trentino für uns zurückzugewinnen, da sie rechtmäßig uns gehören. [FROM.GetNameDef] betrachtet diese Gebiete als sein Eigentum, und wenn sie unsere Unabhängigkeit garantieren sollen, verlangen sie von uns, dass wir diese Ansprüche ein für alle Mal aufgeben."
AUS_political_events.23.a:	"Unsere unmittelbare Sicherheit ist wichtiger als diese Ansprüche"
AUS_political_events.25.t:	"[FROM.GetNameDefCap] zieht Ansprüche auf unsere Gebiete zurück"
AUS_political_events.26.desc:	"Wir dachten, die [FROM.GetAdjective] wären eine vernünftige Nation, nachdem sie uns erst kürzlich um Hilfe gebeten hatten. Es hat sich herausgestellt, dass wir uns in ihnen getäuscht haben. Als sie aufgefordert wurden, ihre Ansprüche auf Gebiete, die rechtmäßig uns gehören, zurückzuziehen, haben sie dies unverhohlen abgelehnt."
AUS_political_events.27.t:	"[AUS.GetNameDefCap] Strebt eine Wiederaufrüstung an"
AUS_political_events.27.desc:	" [AUS.GetNameDefCap] hat sich an uns gewandt und um die Genehmigung zur Wiederaufrüstung sowie zur Aufhebung des Vertrags von Saint-Germain-en-Laye gebeten. Mit der Begründung, dass sich die Lage in ihrer Nachbarregion in letzter Zeit deutlich verschärft habe, erklären sie, dass sie sich ohne eine eigene Armee nicht mehr sicher fühlen. Die Anfrage wurde an alle drei Großmächte gerichtet, die den Vertrag unterzeichnet haben: [ITA.GetNameDef], [ENG.GetNameDef] und [FRA.GetNameDef] sowie [USA.GetNameDef], und gemäß dem Vertrag kann jede von uns ein Veto einlegen, sollten wir dies wünschen."
AUS_political_events.29.b:	"Wir müssen darüber verhandeln! "
AUS_treaty_asked_permission_key:	"Trotz unserer größten Bemühungen, sie davon abzuhalten, hat die [AUS.GetAdjective]-Regierung beschlossen, die Wiederaufrüstung von [AUS.GetNameDef] anzuordnen, was einen klaren Verstoß gegen den Vertrag darstellt. Wir hatten gehofft, dass es nicht so weit kommen würde, aber es scheint nichts sie davon abhalten zu können, diesen Weg einzuschlagen."
##### |___KY048 967___|„Hat unseren Vertrag gebrochen“
AUS_political_events.31.b:	"Sie können einen Teil der von uns erbeuteten Ausrüstung haben"
AUS_political_events.33.t:	"[FROM.GetNameDefCap] Bietet erbeutete Ausrüstung an"
AUS_political_events.33.a:	"Großartig!"
AUS_political_events.34.t:	"[FROM.GetNameDefCap] Weigert sich, uns zu entschädigen"
AUS_political_events.35.a:	"Die [GetMilitiaName] hatten ihre Chance."
AUS_political_events.35.b:	" Die Menschen müssen sich einfach anpassen."
AUS_political_events.36.t:	"Die Zukunft von [ROOT.GetNameDef]"
AUS_political_events.36.desc:	"Unser Weg zurück von einer schwer geschwächten Kleinmacht war lang und beschwerlich. Wenn wir zurückblicken, wo wir begonnen haben, wird nur allzu deutlich, dass sich diese Reise gelohnt hat. Wiedergeboren und noch stärker als zuvor ist es nun an der Zeit, dass wir entscheiden, was unsere Zukunft bereithält und wie wir bekannt sein möchten."
AUS_grossosterreich_fascism_key:	"Großösterreich"
AUS_political_events.36.c:	"Wir sind perfekt, so wie wir sind "
AUS_integration_target_is_poland_key:	"Eine harte Botschaft wurde uns von der [FROM.GetAdjective] Regierung übermittelt. Sie fordern, dass wir [Get37PuppetOrNotDesc] an sie aushändigen, und warnen uns, dass es Konsequenzen haben könnte, sollten wir versuchen, Widerstand zu leisten.\n\nDieser Akt der Aggression seitens [FROM.GetNameDef] kam nach einer Reihe ähnlicher Forderungen an andere Länder in der Umgebung nicht völlig unerwartet."
AUS_political_events.37_tt:	"Wir werden ihnen die von ihnen beanspruchten Staaten übergeben."
37DescIsPuppet:	"[FROM.FROM.OWNER.GetNameDef]"
AUS_political_events.39.a:	"Willkommen bei [ROOT.GetNameDef]!"
AUS_political_events.40.b:	"Wir haben keinen Bedarf an ihnen."
AUS_political_events.42.t:	"[FROM.GetNameDefCap] Weigert sich, uns beitreten zu lassen [FROM.GetFactionName]"
AUS_political_events.43.t:	" [FROM.GetNameDefCap] fordert [Get43PuppetOrNotTitle]"
43TitleIsPuppet:	"Wir übergeben unseren Untertanen"
AUS_political_events.43.a.tt:	" §Y[Get43PuppetOrNotTt]§! könnten gezwungen werden, einer [FROM.GetAdjective] Fraktion beizutreten"
43TtIsPuppet:	"[FROM.FROM.OWNER.GetNameDefCap]"
AUS_political_events.44.t:	"[FROM.GetNameDefCap] sich unseren Forderungen unterwirft"
44DescIsNotPuppet:	"sich selbst"
AUS_political_events.46.desc:	"In dem Versuch, Unterwerfung und Einschränkungen ihrer Unabhängigkeit zu vermeiden, hat die [FROM.GetAdjective]-Führung drastische Maßnahmen ergriffen. Anstatt sich uns zu unterwerfen, übergeben sie uns ihre Staaten, die zuvor von uns kontrolliert wurden. Dies war nicht das erwartete Ergebnis unserer Forderungen, und wir müssen nun entscheiden, ob wir dies akzeptieren oder nicht."
AUS_political_events.47.a:	"Wir lassen uns dazu nicht zwingen!"
AUS_political_events.49.b:	"Unser Territorium ist weit mehr wert als das!"
AUS_political_events.50.a:	"Ein äußerst fairer Deal!"
AUS_political_events.53.t:	"[FROM.GetNameDefCap] Integriert sich friedlich"
AUS_political_events.54.t:	"[FROM.GetNameDefCap] Verweigert uns den rechtmäßigen Anspruch auf Habsburg"
AUS_political_events.55.a:	"Ein fairer Deal"
AUS_political_events.55.b:	"Unser Land steht nicht zum Verkauf!"
AUS_seeks_a_deal_title_56:	"[FROM.GetNameDefCap] Übergibt Staaten als Gegenleistung für industrielle Investitionen"
AUS_makes_demands_title_56:	"[FROM.GetNameDefCap] Übergibt Staaten"
AUS_makes_demands_desc_56:	"Unsere Forderungen an [FROM.GetNameDef] wurden genehmigt. Die [FROM.GetAdjective] werden uns die Staaten [39.GetName] und [850.GetName] unverzüglich übergeben, und endlich werden diese beiden Staaten wieder uns gehören!"
AUS_seeks_a_deal_title_57:	" [FROM.GetNameDefCap] Lehnt unseren vorgeschlagenen Deal ab"
AUS_makes_demands_title_57:	"[FROM.GetNameDefCap] Lehnt unsere Forderungen ab"
AUS_seeks_a_deal_desc_57:	"Die Antwort von den [FROM.GetADjective] ist bei uns eingegangen; sie stimmen dem Deal nicht zu. Mit der Begründung, dass ihr Land nicht zum Verkauf stehe, lehnen sie jede Möglichkeit eines Verkaufs oder jeglicher Art von Vereinbarung bezüglich der betreffenden Staaten entschieden ab."
AUS_political_events.57.a:	"Es war einen Versuch wert"
AUS_political_events.58.b:	"Auf keinen Fall!"
AUS_political_events.59.t:	"[FROM.GetNameDefCap] unterstützt Alfred Jansas Plan"
AUS_political_events.59.desc:	"Die Regierung von [FROM.GetNameDef] hat erneut ihr Vertrauen in Alfred Jansa gesetzt, einem Feldmarschall mit eindeutig anti-[ROOT.GetAdjective]-Einstellungen. Mit Plänen zur Befestigung unserer Grenzen und einem Plan, der darauf zugeschnitten ist, einem Angriff von uns entgegenzuwirken, war dieser Feldmarschall uns bereits zuvor ein Ärgernis und wird es wahrscheinlich wieder sein."
AUS_political_events.60.desc:	"Es wurde eine formelle Beschwerde von [FROM.GetNameDef] bezüglich unseres jüngsten Bekenntnisses zu dem von Alfred Jansa vorgelegten Verteidigungsplan vorgebracht. Sie behaupten, dass diese Maßnahme eindeutig aus Feindseligkeit ihnen gegenüber ergriffen wurde und dass sie unseren künftigen diplomatischen Beziehungen im Wege stehen wird. Wir sind uns nicht sicher, warum dies eine derart heftige Reaktion hervorgerufen hat. "
AUS_political_events.60.a:	"Gut, dann nehmen wir stattdessen Franz Böhme"
AUS_political_events.60.a_tt:	"§YFranz Böhme§! wird §Gverfügbar§! als Chef der Armee. \n\n§YAlfred Jansa§! wird §Rnicht mehr verfügbar sein§! als Armeechef. "
AUS_political_events.61.desc:	"Unser Druck auf die [FROM.GetAdjective], Alfred Jansa und seinen törichten Verteidigungsplan unverzüglich zu ersetzen, hat sich ausgezahlt. Anstelle des äußerst anti-[ROOT.GetAdjective] eingestellten Jansa haben sich die [FROM.GetAdjective] nun für den weitaus sympathischeren Franz Böhme entschieden."
AUS_political_events.62.a:	"Wie können sie es wagen?"
AUS_political_events.63.t:	"Verbannt [AUS.GetAdjective]s bieten ihre Dienste an"
AUS_political_events.64.a:	"Eine willkommene Überraschung!"
AUS_political_events.67.t:	"[FROM.GetNameDefCap] akzeptiert föderative Union"
AUS_political_events.68.desc:	"Trotz der offensichtlichen Vorteile und obwohl dies eindeutig das Beste für die Föderation wäre, [FROM.GetNameDef] hat unseren Vorschlag für eine engere Union abgelehnt. Man kann nur über ihre Gründe spekulieren, aber es scheint, als hätten sie nicht das Wohl der Föderation im Sinn."
AUS_political_events.68.a:	"Sie stellen ein Risiko für die Einheit der Föderation dar!"
AUS_political_events.69.t:	"Anschlussrisiko gemindert"
AUS_joined_faction:	"Da wir nun Teil von [ROOT.GetFactionName] sind, scheint es, dass [GER.GetLeader] beschlossen hat, keinen Versuch zu unternehmen, uns in [GER.GetNameDef] zu integrieren. \n\nWir haben sehr hart daran gearbeitet, um sicherzustellen, dass wir unsere Unabhängigkeit bewahren können, und der Aufwand hat sich gelohnt."
AUS_became_subject:	"[ROOT.GetNameDefCap] durchläuft einige radikale Veränderungen, seit wir unsere Unabhängigkeit verloren haben. Obwohl viele davon weniger angenehme Nebenwirkungen der verlorenen Unabhängigkeit sind, ist uns kürzlich ein seltener positiver Effekt ins Auge gefallen. Da wir nicht mehr unabhängig sind, würde ein Versuch, uns zu integrieren, mehr als nur unseren eigenen Zorn hervorrufen.\n\nSich dessen wohl bewusst, scheint [GER.GetLeader] den Plan aufgegeben zu haben, uns zu zwingen, sich [GER.GetNameDef]"
AUS_political_events.70.t:	"[FROM.GetAdjective] Regierung bietet Entschädigung als Gegenleistung für Garantien an"
AUS_political_events.73.a:	"Das können wir akzeptieren"
AUS_political_events.73.c_tt:	"Für die Dauer des überarbeiteten Vertrags wird ein demokratisch gesinnter Aufseher nach Österreich entsandt"
AUS_political_events.74.desc:	 "Nach langwierigen Debatten und zahlreichen Diskussionen sind die Garantiemächte endlich zu einem Ergebnis gekommen. Wir dürfen im Laufe der Zeit teilweise wieder aufrüsten; ab heute stehen uns keine Einschränkungen mehr im Weg, was die Ausbildung neuer Truppen und die Aufstockung unserer Truppenstärke im Einsatz betrifft."\n\n"Unsere Industrie unterliegt zwar weiterhin Einschränkungen, diese sind jedoch weniger streng. Die Einschränkungen werden in einem , sofern sich in der Welt nichts grundlegend ändert."
AUS_political_events.75.t:	"Die Garanten weigern sich, den Vertrag zu überarbeiten"
AUS_political_events.76.t:	"Die Garanten stimmen einer Überarbeitung des Vertrags zu und ernennen einen Aufseher"
AUS_political_events.76.a:	"Wir nehmen das an! "
AUS_political_events.77.a_tt:	"§R[GER.GetNameWithFlag] hat den Prozess zu unserem Anschluss eingeleitet. Wir können darauf keinen Einfluss mehr nehmen!§!"
AUS_political_events.78.t:	" Kommunisten in [FROM.GetNameDef] bitten um unsere Unterstützung"
AUS_political_events.79.desc:	"Ganz wie wir es uns erhofft hatten, hat uns die Führung von [FROM.GetAdjective] in diesen schwierigen Zeiten Unterstützung angeboten. Wir können uns natürlich nicht darauf verlassen, dass sie alle unsere Probleme vollständig lösen, aber ihre Unterstützung erneut zu haben, ist sicherlich eine sehr willkommene Hilfe. Vor allem, da sich unser Machtkampf weiter hinzieht."
AUS_political_events.80.desc:	"Unter Berufung auf geringfügige ideologische Differenzen und unsere Zurückhaltung gegenüber dem revolutionären Kommunismus [FROM.GetNameDef] hat [FROM.GetNameDef] unseren Hilferuf zurückgewiesen. Wir werden auf uns allein gestellt sein."
AUS_political_events.81.desc:	"Lange Zeit haben die [FROM.GetAdjective] hartnäckig an ihrer eigenen Form des Kommunismus festgehalten, die als Austromarxismus bezeichnet wird. Diese politische Spaltung ist eine Mischung aus Sozialdemokratie und echtem Kommunismus, für die wir wenig übrig haben. Es scheint nun, als seien sie endlich zur Vernunft gekommen und hätten diese ideologische Fehlentwicklung abgeschafft, um sich uns anzunähern und sich in unsere Gunst zu bringen, da sie auf unseren Schutz hoffen, sollten feindliche Kräfte sie angreifen."
AUS_political_events.81.a:	"Großartig, wir werden unseren Schutz anbieten"
AUS_political_events.83.a:	"Wir freuen uns darauf!"
AUS_political_events.84.t:	"[FROM.GetAdjective]s stärken kommunistische Tendenzen in unserem Land"
AUS_political_events.84.desc:	"\nUns wurde zur Kenntnis gebracht, dass derzeit Versuche unternommen werden, [AUS.GetNameDef] kommunistische Stimmungen unter unseren Mitarbeitern zu schüren. Auch wenn dies harmlos sein mag, könnte es sich ebenso um eine Vorbereitung auf etwas handeln. Wir haben keine Ahnung, was ihre wahren Absichten sind, doch müssen wir alle Möglichkeiten ."
AUS_political_events.85.t:	"[FROM.GetNameDefCap] Ermöglicht unsere Bemühungen, die Arbeiter zu organisieren"
AUS_political_events.85.desc:	"\nWir waren uns durchaus bewusst, dass unsere Aktivitäten in [FROM.GetNameDef] früher oder später aufgedeckt werden würden. Glücklicherweise scheint es, dass die [FROM.GetLeader] kein Problem damit hat, dass wir kommunistische Gesinnungen innerhalb ihrer Belegschaft stärken und sie über ihre Rechte und Pflichten als gute Arbeiter aufklären."
AUS_political_events.86.t:	"[FROM.GetNameDefCap] Verbietet Bemühungen zur Organisierung der Arbeiter"
AUS_political_events.87.desc:	" Nach einer Zeit wachsender kommunistischer Stimmungen, während sich die Propaganda von [FROM.GetAdjective] unter unseren Arbeitern verbreitet, ist nun ein Ultimatum bei uns eingegangen. [FROM.GetLeader] fordert, dass wir eine friedliche kommunistische Machtübernahme zulassen, da er der Ansicht ist, dass unser Volk dies wünscht. Für den Fall, dass wir uns weigern, versichert er uns, dass sie unseren Arbeitern zur Seite stehen werden, was auch immer diese tun möchten."
AUS_political_events.89.desc:	"Trotz eindeutiger Anzeichen dafür, dass das Volk dies wünscht, haben sich der [FROM.GetAdjective] und sein Anführer [FROM.GetLeader] entschieden, nicht zurückzutreten, damit eine besser geeignete Regierung die Macht übernehmen kann. WIR müssen unsere Optionen abwägen und das tun, was für das Volk richtig ist."
AUS_political_events.89.b:	"Die Stimme des Volkes wird gehört werden!"
AUS_political_events.90.desc:	"Die ersten Wahlen seit der "Selbstauflösung des Parlaments" sind abgeschlossen. Die Wahlbeteiligung war hoch, da die Nation erkannt hat, was aus unserem Land wird, wenn sie ihre Pflichten als Wähler vernachlässigen. Die drei führenden Kandidaten liegen bei der endgültigen Auszählung nur wenige Stimmen auseinander."
AUS_political_events.90.a:	"Kurt Schuschnigg ist im Herzen ein Demokrat!"
AUS_political_events.90.b:	"Karl Renner hat uns zuvor gute Dienste geleistet!"
AUS_political_events.91.desc:	"In jüngster Zeit haben wir festgestellt, dass unser Erzherzog, Seine Majestät [ROOT.GetLeader], unablässig über die Lage an der Front nachsinnt. Er äußert ein Gefühl der Unzulänglichkeit und den Wunsch, seine Männer direkter zu führen. Heute wurde die Angelegenheit erneut zur Sprache gebracht: Unser Erzherzog möchte seine Männer tapfer in die Schlacht führen und die Regierungsgeschäfte jemand anderem überlassen."
AUS_political_events.92.t:	"[FROM.GetNameDefCap] beantragt den Kauf von Alaska"
AUS_political_events.92.a:	"Unser Territorium steht nicht zum Verkauf!"
generic_this_might_cause_tt:	"§RDies könnte dazu führen, dass§!:"
AUS_political_events.94.desc:	"Trotz der sehr hohen Geldsumme, die wir [FROM.GetNameDef] angeboten haben, um [463.GetName] von ihnen zu erwerben, lehnen sie dieses Angebot ab. Wir haben einen sehr legitimen Anspruch auf [463.GetName], den sie uns nun aktiv verweigern. Wir müssen darüber nachdenken, wie wir am besten vorgehen."
AUS_political_events.95.t:	"Die [ROOT.GetAdjective] Armee kehrt nach erfolgreicher Kampagne zurück"
AUS_political_events.95.desc:	"Als der Österreichisch-Preußische Krieg am 22. Juli 1866 endete, marschierte unsere tapfere Armee nach Hause zurück. Bei ihrer Rückkehr hieß es, dass sich ein Soldat mehr in den Reihen befand, als in den Krieg gezogen waren. Ob dies wahr ist oder nur eine Lügengeschichte, bleibt umstritten. Wir können jedoch bestätigen, dass dies nun geschehen ist, da unsere ruhmreiche Armee um einen Mann stärker zurückkehrt."
AUS_political_events.95.a_tt:	"Ein wahrer [ROOT.GetAdjective] Patriot hat sich unseren Reihen angeschlossen"
AUS_political_events.98.t:	"[FROM.GetNameDefCap] Lehnt unseren Antrag auf Beitritt zur [FROM.GetFactionName] ab"
AUS_political_events.98.desc:	"Trotz unserer größten Bemühungen wurde der Antrag, den wir an die [FROM.GetAdjective] gerichtet haben, um der [FROM.GetFactionName] beizutreten, abgelehnt. Ihre Begründung enthielt keinen wirklichen Grund, und es scheint, als seien wir erneut auf uns allein gestellt."
AUS_political_events.99.t:	"[FROM.GetNameDefCap] Lehnt unsere Forderungen ab"
AUS_political_events.101.t:	"[FROM.GetNameDefCap] Beendet die Bemühungen zur Einsetzung von Arthur Seyss-Inquart"
AUS_anschluss_ratio_ticking_down:	 "Die §YGesamtkampfstärke der Armee§!, die für den Start des nationalen Fokus §YAnschluss§! erforderlich ist, wird wöchentlich gesenkt. Der Wert entspricht der Beliebtheit von §YNeutralität|___CC0 09555___| in §Y[AUS.GetNameWithFlag]§!."
AUS_political_events.103.t:	"Beunruhigender Bericht über den [GER.GetAdjective] Expansionismus"
AUS_political_events.104.t:	"Das [GER.GetAdjective] Exil"
AUS_political_events.104.c:	"Elizabeth..?"
AUS_political_events.105.a:	"Es ist jetzt eine verlorene Sache."
AUS_political_events.107.desc:	"Uns hat die verheerende Nachricht erreicht, dass [FROM.GetLeader] den Forderungen der [GER.GetAdjective] nach ihrer Eingliederung in [GER.GetNameDef] nachgegeben hat. Obwohl wir den [FROM.GetAdjective] Garantien angeboten haben, scheint es, dass dieses Versprechen nicht ausreichte, um sie zum Widerstand zu ermutigen. Wir haben weiterhin ein Interesse an diesem Gebiet, daher sollten wir in Zukunft vielleicht in Erwägung ziehen, die [FROM.GetAdjective] zu befreien."
AUS_political_events.107.a:	"Wir werden sie retten!"
AUS_political_events.107.a_tt:	"Wenn wir einen Krieg gegen [GER.GetNameDef] beginnen, werden wir Folgendes gewinnen:\n"
AUS_political_events.108.a:	"Wir werden ein wachsames Auge darauf haben! "
AUS_political_events.109.t:	"[FROM.GetNameDefCap] Bewaffnen Sie die Grenzschutzbeamten"
AUS_political_events.110.desc:	"Infolge einer von der Regierung finanzierten Kundgebung liegen uns Berichte über einen starken Anstieg der Anti-[ROOT.GetAdjective]-Stimmung in [FROM.GetNameDef] vor. Die Führung von [FROM.GetAdjective] hat sich nicht direkt an uns gewandt, um diese Angelegenheiten zu klären, und es kann nur angenommen werden, dass sie derzeit kein Interesse an diplomatischen Bemühungen hat."
AUS_political_events.110.a:	"Besorgniserregend"
AUS_political_events.111.a:	"Die Vergangenheit ist Vergangenheit, wir werden unterzeichnen!"
AUS_political_events.112.t:	"[FROM.GetNameDefCap] unterzeichnet den Nichtangriffspakt"
AUS_political_events.113.desc:	"Es scheint, als sei unser Angebot an die Führung von [FROM.GetAdjective] für diese nicht gut genug gewesen. Entweder haben sie unsere Zukunftspläne durchschaut, oder sie hegen selbst böswillige Absichten uns gegenüber. Wir müssen uns auf diesen Fall vorbereiten, und sollten wir unsere Pläne weiterverfolgen wollen, könnten weitere feindselige Maßnahmen erforderlich werden."
AUS_political_events.115.desc:	"Vertreter der [FROM.GetAdjective] Armee haben sich an uns gewandt, in der Hoffnung, eine gemeinsame Militärübung für unsere Streitkräfte zu organisieren. Sie versichern uns, dass dies für beide Länder von größtem Nutzen wäre und dass wir viel von ihnen lernen könnten, genauso wie sie von uns lernen könnten."
AUS_political_events.117.a:	"Egal... "
AUS_political_events.119.t:	"[FROM.GetNameDefCap] fordert weitere Zugeständnisse"
AUS_political_events.119.a:	"Wir müssen nachgeben"
AUS_political_events.120.t:	"[FROM.GetNameDefCap] Gibt unseren Forderungen nach"
AUS_political_events.121.t:	 "[FROM.GetNameDefCap] Lehnt unsere Forderungen ab"
AUS_political_events.121.desc:	"Trotz unserer völlig berechtigten Ansprüche auf Gebiete, die sich derzeit im [FROM.GetAdjective] Besitz von [FROM.GetLeader] befinden, hat dieser beschlossen, die geforderten Gebiete nicht zu übergeben. Dies ist sicherlich ein Rückschlag, aber wir werden diese Gebiete zurückerobern, komme was wolle."
AUS_political_events.122.desc:	"Georg von Trapp war einst ein hoch angesehener Admiral in der großen österreichisch-ungarischen Marine. Nach dem Untergang unseres mächtigen Reiches und dem Verlust unserer Küstenlinie wandte er sich, wie viele andere auch, anderen Unternehmungen zu. Nach einer Tätigkeit im Finanzwesen, bei der er den Großteil seines Vermögens verlor, wandte er sich der Musik zu.\n\n Nun, da wir die Kontrolle über eine Küstenlinie erlangt haben, bietet von Trapp seine Dienste an, um im Namen unserer großen Nation erneut in See zu stechen. "
AUS_political_events.122.b:	"So sehr wir ihn auch schätzen.. . nein"
AUS_political_events.123.b:	"Einmal war genug"
AUS_political_events.124.desc:	"So sehr wir von unserem eigenen Verbündeten erwartet hatten, waren sie doch überaus erfreut, unsere Einladung anzunehmen, unsere glorreiche Fraktion wieder zusammenzuführen. Sie haben zugestimmt, sich unserem Kampf gegen eine Welt anzuschließen, die uns am Ende des Großen Krieges so ungerecht behandelt hat."
AUS_political_events.124.a:	"Unsere Reiche werden wieder auferstehen!"
AUS_political_events.125.desc:	" Wir hatten gehofft, dass die [FROM.GetAdjective] den offensichtlichen Vorteil einer erneuten Zusammenarbeit mit uns erkennen würden, doch es scheint, als habe der Rückschlag, den wir damals erlitten haben, ihren Blick getrübt. Unser Anführer [ROOT.GetLeader] hat darauf mit Würde und Entschlossenheit reagiert; dies ist nur ein kleiner Rückschlag."
AUS_news_events.3.t:	"Der s Sturz in Ungnade"
AUS_news_events.3.a:	"Er hat uns gute Dienste geleistet, ruhe in Frieden"
AUS_news_events.4.desc:	"Der [AUS.GetAdjective]-Kampfpilas Godwin von Brumowski war gestern in eine Beinahe-Katastrophe verwickelt, als er einen [HOL.GetAdjective]-Flugschüler über dem Flugplatz Schiphol ausbildete.\n\nVon Brumowski war der erfolgreichste Jagdflieger der mächtigen Luftfahrtruppen. Mit 35 Luftsegen, weiteren 12 geteilten Siegen und 8 unbestätigten Siegen nahm er sowohl am Ersten Weltkrieg sowie am Bürgerkrieg von 1934 in [AUS.GetNameDef] teil. \n\nDas Duo hat das Abenteuer relativ unversehrt überstanden."
AUS_news_events.4.a:	"Eine knappe Sache"
AUS_news_events.5.t:	"Die [AUS.GetAdjective]s Aufhebung des Vertrags von Saint-Germain -En-Laye"
AUS_news_events.6.desc:	"\n\nDa es in ihrer unmittelbaren Umgebung keine tragfähigen Optionen für Bündnisse gibt, hat [AUS.GetNameDef] beschlossen, die Mittelmächte erneut zu reformieren. Nachdem sich das Land von den ihm auferlegten Verträgen befreit hat, hat es eine rasante -Militarisierung. Ob dieses neue Bündnis ihrem Namensvetter aus dem Ersten Weltkrieg ähneln wird oder nicht, bleibt abzuwarten."
AUS_news_events.7.desc:	"\nNachdem er den Großteil seines Lebens im Exil verbracht hatte, zunächst in [SWI.GetNameDef] und später auf der Insel Madeira in [POR.GetNameDef], ist Otto von Habsburg nach [AUS.GetNameDef] zurückgekehrt. Der Prinz floh 1918 mit seinen Eltern, Kaiser Karl I. und Kaiserin Zita, aus dem Land, nachdem die Monarchien am Ende des Ersten Weltkriegs gestürzt worden waren. Seine Rückkehr als [AUS.GetAdjective] Staatsoberhaupt bedeutet eine deutliche Veränderung des politischen Klimas in [AUS.GetNameDef]."
AUS_news_events.7.c:	"Gut für ihn"
AUS_news_events.8.t:	"Die Habsburger an der Macht in Habsburg"
AUS_news_events.8.b:	"Habsburg gehört uns! "
AUS_news_events.11.t:	"[AUS.GetNameDefCap] Bildet den Donaublock"
AUS_news_events.11.desc:	"Nachdem sie sich radikal von ihrer Vergangenheit abgewandt haben, hat die [AUS.GetAdjective] Führung unter der Leitung von [AUS.GetLeader] beschlossen, eine eigene Fraktion zu gründen. Er äußert die Hoffnung, dass sich andere Arbeiter in Mitteleuropa gegen ihre Unterdrücker erheben und sich ihnen in diesem Kampf für die Rechte des Volkes anschließen werden"
AUS_news_events.11.a:	"Warum sollten sie das tun?"
WW_hungary.1.t:	"[HUN.GetName] startet gemeinsame Produktionsprogramme"
WW_hungary.3.desc:	 "Unser Ministerpräsident, der Militäroffizier und Anführer der Ungarischen Nationalen Verteidigungsvereinigung, Gyula Gömbös, ist Berichten zufolge während einer diplomatischen Mission in München an Hodenkrebs verstorben. Während [ROOT.GetLeader] bereits einen neuen Ministerpräsidenten im Auge hat, nämlich den Zentrist Kálmán Darányi, bleibt die Frage offen, was mit der faschistischen paramilitärischen Organisation geschehen soll, die zuvor von Gömbös selbst angeführt wurde. Aufgrund ihrer und [ROOT.GetLeader]s gemeinsamen antikommunistischen Haltung könnte es möglich sein, sie davon zu überzeugen, für uns zu arbeiten, doch da wir nicht wissen, wem ihre wahre Loyalität gilt, könnte es für uns in Zukunft gefährlich werden, wenn wir sie in unsere Streitkräfte integrieren. Wie sollen wir in Bezug auf die MOVE vorgehen?"
WW_hungary.3.c:	"Lassen Sie sie gewähren. Was kann schon Schlimmes passieren? "
WW_hungary.4.desc:	"Transsilvanien war lange Zeit Teil von [HUN.GetNameDef], bevor es im Vertrag von Trianon abgetreten wurde. Leider hat [HUN.GetNameDef] den Verlust seines Territoriums nie überwunden. Zu verschiedenen Zeitpunkten haben sie Transsilvanien öffentlich als integralen Bestandteil ihrer Nation beansprucht. Angesichts der jüngsten Veränderungen in der politischen Lage haben sie erneut beschlossen, ihre Ansprüche geltend zu machen, und fordern, dass wir ihnen ganz Transsilvanien übergeben … sonst."
WW_hungary.4.b:	"Sonst … was?"
WW_hungary.5.a:	"So wie es sein sollte"
WW_hungary.6.t:	"[FROM.GetNameDefCap] Weigert sich, Siebenbürgen zu übergeben"
WW_hungary.7.t:	"[FROM.GetNameDefCap] Fordert die Südslowakei"
WW_hungary.7.b:	"Dann kommen Sie und holen Sie es sich!"
WW_hungary.8.t:	"[HUN.GetNameDefCap] Bietet Schutz im Austausch für [975.GetName]"
WW_hungary.9.desc:	 "Die kluge Führung in [FROM.GetNameDef] hat beschlossen, unser Angebot anzunehmen, und wird uns umgehend die Kontrolle über die Region [975.GetName] im Austausch gegen Unabhängigkeitsgarantien übergeben. Wir werden größer, und unsere Freundschaft mit den [FROM.GetAdjective]s ist erneut entflammt."
WW_hungary.10.t:	"[FROM.GetNameDefCap] Lehnt unseren Schutz ab"
WW_hungary.10.a:	"Die haben eine Schraube locker... "
WW_hungary.11.a:	"Es lohnt sich nicht, dafür Blut zu vergießen"
WW_hungary.12.t:	"[FROM.GetNameDefCap] übergibt ihre [SLO.GetAdjective] Gebiete"
WW_hungary.12.desc:	"Die Vernünftigen [FROM.GetLeader] von [FROM.GetNameDef] haben zugestimmt, ihre Gebiete in der Slowakei zu übergeben, und ihren Truppen befohlen, sich zurückzuziehen und das Gebiet zu verlassen. Wir stehen erneut als Sieger da!"
WW_hungary.14.t:	"[FROM.GetNameDefCap] fordert die Vojvodina"
WW_hungary.14.desc:	" Die [HUN.GetAdjective] Regierung hat begonnen, in der Frage der Vojvodina mehr Druck auszuüben, und erklärt, dass diese während des Kaiserreichs Teil Ungarns war und daher zurückgegeben werden sollte. Sie behauptet, dass die Vereinigung mit Serbien am Ende des Ersten Weltkriegs "aufgrund von Druck von außen ungültig" gewesen sei und dass das Gebiet daher rechtlich gesehen immer noch [HUN.GetAdjective] sei. "
WW_hungary.14.b:	"Wir werden ihre Wahnvorstellungen nicht unterstützen"
WW_hungary.15.desc:	"\n[FROM.GetNameDef] hat zugestimmt, uns die Vojvodina zu überlassen. Unsere Streitkräfte haben die vollständige Kontrolle über die Region übernommen, und die Integration soll umgehend beginnen."
WW_hungary.16.t:	"[From.GetNameDefCap] Lehnt unsere Forderungen ab"
WW_hungary.17.desc:	" [HUN.GetLeader] von [HUN.GetNameDef] hat uns heute ein Ultimatum gestellt, in dem er von uns die [HUN.GetName] Besetzung der Region Westbanat verlangt. Wenn wir den Forderungen von [HUN.GetLeader] nicht nachkommen, droht uns wahrscheinlich ein militärischer Konflikt."
WW_hungary.17.a:	"Sie können es haben"
WW_hungary.18.desc:	" [FROM.GetLeader] von [FROM.GetNameDef] hat unsere Forderungen nach der Besetzung von West-Banat bereitwillig akzeptiert und uns das Gebiet daraufhin abgetreten. Sie ziehen es vor, uns zu beschwichtigen, anstatt sich uns entgegenzustellen, was Italiens Zielen auf dem Balkan nur zugutekommen wird."
WW_hungary.19.a:	"Dann mit Gewalt"
WW_hungary.21.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, seine Gebiete in Karpatenrussland zu übergeben, und seinen Truppen befohlen, sich zurückzuziehen und das Gebiet zu räumen. Wir stehen erneut als Sieger da!"
WW_hungary.22.t:	"[From.GetNameDefCap] lehnt unsere Forderungen ab"
WW_hungary.22.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.23.a:	"Dies ist kein Konflikt, den wir gewinnen können"
WW_hungary.24.a:	"Großartig"
WW_hungary.25.desc:	"Obwohl nicht völlig unerwartet, hat die törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation nach Erhalt unseres Ultimatums in höchste Alarmbereitschaft versetzt und einen Gesandten entsandt, der erklärt, dass sie in Bezug auf den Streit im Burgenland keinen einzigen Schritt zurückweichen werden."
WW_hungary.26.t:	"[FROM.GetNameDefCap] möchte sich unserer Fraktion anschließen"
WW_hungary.26.desc:	"[FROM.GetLeader] hat sich nach einem Besuch in unserer großartigen Hauptstadt an uns gewandt und behauptet, im Namen des gesamten Volkes von [FROM.GetAdjective] zu sprechen. Er wünscht sich, dass sich unsere beiden Nationen zu einem Militärbündnis zusammenschließen, mit dem Ziel, die Territorien sowohl der [ROOT.GetAdjective] als auch der [FROM.GetAdjective] Nation weiter auszudehnen."
WW_hungary.29.t:	"[FROM.GetNameDefCap] zur Wiederherstellung der Habsburger Herrschaft"
WW_hungary.29.a:	"Diplomatischen Protest einlegen"
WW_hungary.30.a:	"Wir können Nichtangriff versprechen. Vorerst ..."
WW_hungary.31.t:	"[FROM.GetNameDefCap] ernennt uns einen neuen Monarchen"
WW_hungary.31.desc:	"[FROM.GetNameDefCap] hat Joseph August von Habsburg zum neuen Pfalzgrafen unserer Nation ernannt. Dies wird unser Regime sicherlich stärken."
WW_hungary.31.a:	"In der Tat"
WW_hungary.33.a:	"Sie haben die richtige Wahl getroffen"
WW_hungary.34.a:	"Sie haben die falsche Wahl getroffen"
WW_hungary.35.t:	"[FROM.GetNameDefCap] Möchte unserer Fraktion beitreten"
WW_hungary.35.desc:	"[FROM.GetLeader] hat sich nach einem Besuch in unserer großartigen Hauptstadt an uns gewandt und behauptet, im Namen des gesamten [FROM.GetAdjective] Volkes zu sprechen; er wünscht sich, dass sich unsere beiden Nationen zu einem Militärbündnis zusammenschließen, mit dem Ziel, die Territorien sowohl der [ROOT.GetAdjective] als auch der [FROM.GetAdjective] Nation weiter auszudehnen."
WW_hungary.37.t:	"[FROM.GetNameDefCap] uns entehrt"
WW_hungary.37.a:	"Es sollte nicht sein"
WW_hungary.39.a:	"Lassen Sie uns die Fehler des Großen Krieges wiedergutmachen!"
WW_hungary.40.a:	"Dann werden wir führen!"
WW_hungary.41.desc:	"[FROM.GetLeader] hat sich nach einem Besuch in unserer großen Hauptstadt an uns gewandt und behauptet, im Namen aller [FROM.GetAdjective] Menschen zu sprechen, in der Hoffnung, dass sich unsere beiden Nationen zu einem Militärbündnis zusammenschließen, mit dem Ziel, die Territorien sowohl der [ROOT.GetAdjective] als auch der [FROM.GetAdjective] Nation weiter auszudehnen."
WW_hungary.41.a:	"Sie sind herzlich willkommen, sich uns anzuschließen"
WW_hungary.41.b:	"Wir haben keine Verwendung für sie"
WW_hungary.42.t:	"[FROM.GetNameDefCap] ehrt die Große Allianz"
WW_hungary.43.t:	"[FROM.GetNameDefCap] entehrt uns"
WW_hungary.43.desc:	" Der Schurke [FROM.GetLeader] von [FROM.GetNameDef] hat unsere Bitte abgelehnt und damit im Grunde alle Möglichkeiten einer Zusammenarbeit zwischen unseren Staaten in naher Zukunft zunichte gemacht. Wir werden daher andere Bündnisse suchen oder auf uns allein gestellt sein."
WW_hungary.44.desc:	"Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] hat verlangt, dass wir die Wiedische Krone wiederherstellen und Wilhelm von Wied erneut zu unserem Monarchen krönen. Dies würde im Grunde genommen unsere Unabhängigkeit beenden, könnte uns jedoch vor einer vollständigen Annexion bewahren. Nehmen wir einen Platz in der neuen kaiserlichen Föderation an?"
WW_hungary.45.desc:	" Die weise Führung in [FROM.GetNameDef] hat beschlossen, Wilhelm von Wied gemäß unseren Forderungen zu krönen und zugunsten ihres neuen Königs zurückzutreten. Ein neuer Morgen wird über unserer kaiserlichen Föderation anbrechen!"
WW_hungary.46.t:	"[FROM.GetNameDefCap] Lehnt einen wiedistischen Monarchen ab"
WW_hungary.46.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, nicht von ihren Ämtern zurückzutreten, da sie irgendwie glaubt, weiser zu sein als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Wilhelm von Wied auf ihren Thron setzen, ob es ihnen gefällt oder nicht!"
WW_hungary.47.b:	"Tod den Monarchen!"
WW_hungary.48.desc:	"Die weise Führung in [FROM.GetNameDef] hat beschlossen, gemäß unseren Forderungen einen Habsburger Monarchen zu krönen und zugunsten ihres neuen Königs zurückzutreten."
WW_hungary.49.t:	"[FROM.GetNameDefCap] lehnt einen Habsburger Monarchen ab"
WW_hungary.50.desc:	"[FROM.GetNameDefCap] hat Karl Pius von Habsburg zum neuen König unserer Nation ernannt. Dies wird unser Regime sicherlich stärken."
WW_hungary.51.desc:	" Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] hat gefordert, dass wir die Herrschaft der Habsburger über unsere Länder wiederherstellen, wie es von 1516 bis 1700 der Fall war, und erneut einen Habsburger zu unserem Monarchen krönen. Dies würde uns mit ihnen verbünden und uns ermöglichen, ihrem Bündnis beizutreten, ohne unsere Unabhängigkeit vollständig aufzugeben."
WW_hungary.52.t:	"[FROM.GetNameDefCap] Akzeptiert einen Habsburger Monarchen"
WW_hungary.53.t:	" [FROM.GetNameDefCap] Lehnt einen Habsburger-Monarchen ab"
WW_hungary.53.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, nicht von ihren Ämtern zurückzutreten, da sie irgendwie glaubt, klüger zu sein als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Karl Pius auf ihren Thron setzen, ob es ihnen gefällt oder nicht!"
WW_hungary.53.a:	"Sie haben die falsche Wahl getroffen"
WW_hungary.56.desc:	" Nach Beratungen auf höchster Ebene, die bis spät in die Nacht dauerten, hat die [CZE.GetAdjective]-Regierung beschlossen, unser Angebot anzunehmen, und Albrecht Franz zum König von Böhmen, Markgrafen von Mähren und Herzog von Teschen ernannt. Die Soldaten der ehemaligen tschechischen Armee haben ihrem neuen König und Kaiser einen Eid geschworen, und die zivile Verwaltung der Reiche wurde nominell integriert."
WW_hungary.56.a:	"Ein weiterer Schritt auf dem Weg zur Rückeroberung unseres Geburtsrechts."
WW_hungary.59.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, seine Gebiete in Galizien und der Bukowina zu übergeben, und seinen Truppen befohlen, sich zurückzuziehen und das Gebiet zu räumen. Wir stehen erneut als Sieger da!"
WW_hungary.61.a:	"In der Tat"
WW_hungary.62.t:	"[FROM.GetLeader] fordert, dass wir die kaiserliche Herrschaft wiederherstellen"
WW_hungary.62.a:	"Es war ohnehin höchste Zeit"
WW_hungary.62.b:	"Für wen halten die sich eigentlich? "
WW_hungary.63.desc:	"Die weise Führung in [FROM.GetNameDef] hat beschlossen, María Josepha Sophia de Iturbide gemäß unseren Forderungen zur neuen Kaiserin zu krönen und zugunsten ihrer neuen Königin abzutreten."
WW_hungary.64.t:	"[FROM.GetNameDefCap] Lehnt die kaiserliche Herrschaft ab "
WW_hungary.64.a:	"Sie haben die falsche Wahl getroffen"
WW_hungary.65.a:	"In der Tat"
WW_hungary.66.t:	"[FROM.GetLeader] fordert, dass wir die Herrschaft der Habsburger wiederherstellen"
WW_hungary.67.t:	"[FROM.GetNameDefCap] Akzeptiert einen Habsburger Monarchen"
WW_hungary.67.desc:	"Die weise Führung in [FROM.GetNameDef] hat beschlossen, gemäß unseren Forderungen einen Habsburger Monarchen zu krönen und zugunsten ihres neuen Königs abzutreten."
WW_hungary.67.a:	"Sie haben die richtige Entscheidung getroffen"
WW_hungary.68.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, in ihren derzeitigen Ämtern zu verbleiben, in der irrigen Annahme, sie seien weiser als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Joseph Francis auf ihren Thron setzen, ob es ihnen gefällt oder nicht!"
WW_hungary.69.desc:	"Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] hat gefordert, dass wir die Herrschaft der Habsburger über unsere Länder wiederherstellen, wie es bis zu unserer Vereinigung mit Italien der Fall war, und erneut einen Habsburger als unseren Monarchen krönen. Sie versprechen uns jedoch mehr Autonomie als zuvor. Was sagen wir dazu?"
WW_hungary.69.b:	"Was glauben die eigentlich, wer sie sind?"
WW_hungary.70.t:	"[FROM.GetNameDefCap] Akzeptiert einen Habsburger-Monarchen"
WW_hungary.70.a:	"Sie haben die richtige Entscheidung getroffen"
WW_hungary.71.t:	"[FROM.GetNameDefCap] Lehnt einen Habsburger Monarchen ab"
WW_hungary.71.a:	"Sie haben eine unkluge Entscheidung getroffen... "
WW_hungary.72.desc:	"Der unbesonnene [FROM.GetLeader] hat kürzlich unsere, wie er es nannte, unrechtmäßige Besetzung von [FROM.GetAdjective] Schlesien angeprangert. Nun haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir reagieren?"
WW_hungary.72.a:	"Es lohnt sich nicht, dafür Blut zu vergießen"
WW_hungary.72.b:	"Dann kommen Sie und holen Sie es sich!"
WW_hungary.73.t:	"[FROM.GetNameDefCap] übergibt ihre [SIL.GetAdjective] Gebiete"
WW_hungary.74.t:	" [FROM.GetNameDefCap] bleibt in Schlesien standhaft"
WW_hungary.74.desc:	"Obwohl nicht ganz unerwartet, hat die törichte [FROM.GetLeader] von [FROM.GetNameDef] nach Erhalt unseres Ultimatums die Truppen der Nation in höchste Alarmbereitschaft versetzt und einen Gesandten entsandt, der erklärte, dass sie in dieser Streitfrage keinen einzigen Schritt zurückweichen werden."
WW_hungary.75.t:	"[FROM.GetNameDefCap] fordert das Heilige Land"
WW_hungary.75.b:	"Wie viele Kreuzzüge sind schon gescheitert?"
WW_hungary.76.t:	 "[FROM.GetNameDefCap] übergibt das Heilige Land"
WW_hungary.76.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, Palästina an uns zu übergeben, und hat seinen Truppen befohlen, sich zurückzuziehen und das Gebiet zu verlassen. Wir stehen erneut als Sieger da!"
WW_hungary.77.desc:	"Obwohl nicht völlig unerwartet, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation nach Erhalt unseres Ultimatums in höchste Alarmbereitschaft versetzt und einen Gesandten entsandt, der erklärte, dass sie in dieser Streitfrage keinen einzigen Schritt zurückweichen werden."
WW_hungary.77.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.77.b:	"Wir müssen dies hinter uns lassen"
WW_hungary.78.t:	"[FROM.GetNameDefCap] ernennt uns einen neuen Anführer"
WW_hungary.79.t:	"[FROM.GetNameDefCap] Weist uns einen neuen Anführer zu"
WW_hungary.79.a:	"In der Tat"
WW_hungary.80.t:	"[HUN.GetNameDefCap] will uns integrieren"
WW_hungary.80.desc:	"[HUN.GetNameDefCap] hat beschlossen, dass es höchste Zeit ist, unsere Länder wieder in die Krone von Österreich-Ungarn zu integrieren. Wir können nicht viel tun, außer diese Tatsache zu akzeptieren...."
WW_hungary.80.b:	"Sie werden uns niemals lebendig fassen!"
WW_hungary.81.desc:	"[FROM.GetNameDefCap] hat beschlossen, unserer Forderung nach der Wiedereingliederung ihrer Länder in die Krone von Österreich-Ungarn nachzukommen. Heute ist ein großer Tag für das Reich!"
WW_hungary.81.a:	"Und alles ist gut in der Welt"
WW_hungary.83.t:	"[FROM.GetNameDefCap] bietet an, [975.GetName] zu erwerben"
WW_hungary.83.desc:	"Die [HUN.GetAdjective] Regierung betrachtet [975.GetName] nach wie vor als integralen Bestandteil ihres Reiches und erklärt, dass es während des Kaiserreichs zu Ungarn gehörte und daher zurückgegeben werden sollte. Sie hat sich nun mit einem Angebot an uns gewandt, die Region von uns zurückzukaufen – und zwar zu einem guten Preis."
WW_hungary.83.a:	"Wir nehmen alles Geld, das wir bekommen können"
WW_hungary.84.a:	"Perfekt"
WW_hungary.85.t:	"[From.GetNameDefCap] Lehnt unser Angebot ab"
WW_hungary.85.desc:	"Obwohl nicht ganz unerwartet, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] unsere Bitte abgelehnt und einen Gesandten entsandt, der erklärt, dass sie in Bezug auf den Streit in [975.GetName] keinen einzigen Schritt zurückweichen werden."
WW_hungary.85.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.85.b:	"Sie haben Nein gesagt, und wir werden das respektieren"
WW_hungary.86.t:	"[FROM.GetNameDefCap] inszeniert einen Aufstand in [975.GetName]"
WW_hungary.86.a:	"Wir haben nicht die Kraft, gegen sie zu kämpfen"
WW_hungary.87.t:	"[FROM.GetNameDefCap] Möchte sich unserer Fraktion anschließen"
WW_hungary.87.a:	"Sie sind herzlich willkommen, sich uns anzuschließen"
WW_hungary.88.t:	"[FROM.GetNameDefCap] Lässt uns zu ihnen stoßen"
WW_hungary.89.t:	"[FROM.GetNameDefCap] Lässt uns nicht zu ihnen stoßen"
WW_hungary.89.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unseren Antrag abgelehnt und damit im Wesentlichen alle Möglichkeiten einer Zusammenarbeit zwischen unseren Staaten in naher Zukunft ausgeschlossen. Wir werden daher andere Bündnisse suchen oder auf uns allein gestellt sein müssen."
WW_hungary.89.a:	"Es sollte einfach nicht sein"
WW_hungary.90.a:	"Miklós Horthy ist die naheliegende Wahl"
WW_hungary.90.b:	"István Horthy hat die Unterstützung des Volkes"
WW_hungary.91.desc:	"Die [HUN.GetAdjective] Regierung hat uns ein interessantes Angebot unterbreitet, unsere beiden Länder zu vereinen. Natürlich wollen sie, dass dies zu ihren Bedingungen geschieht, was bedeutet, dass ihre Regierung beide Länder regieren würde, aber vielleicht ist das die sicherste Option?"
WW_hungary.91.b:	"Die müssen ja ganz schön von sich eingenommen sein"
WW_hungary.92.t:	"[FROM.GetNameDefCap] Akzeptiert die Union"
WW_hungary.92.a:	"Großartig!"
WW_hungary.93.t:	"[From.GetNameDefCap] Lehnt die Union ab"
WW_hungary.93.desc:	"Obwohl nicht ganz unerwartet, hat die törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation nach Erhalt unseres Vorschlags in höchste Alarmbereitschaft versetzt und einen Gesandten entsandt, der erklärte, dass sie keinen einzigen Schritt zurückweichen werden, mit den Worten: "Rumänien ist Rumänien!"."
WW_hungary.93.a:	" Es ist ihre Entscheidung"
WW_hungary.94.a:	"Béla Kun muss an die Macht zurückkehren"
WW_hungary.94.c:	"Mihály Károlyi sollte uns führen"
WW_hungary.95.desc:	"Es ist an der Zeit, endlich Präsidentschaftswahlen für die Nation abzuhalten und sicherzustellen, dass unsere demokratischen Prinzipien als leuchtendes Vorbild im Herzen Europas strahlen können. Die wichtigsten Kandidaten sind Mihály Károlyi, Präsident der Ersten Republik, Árpád Szakasits, Vorsitzender der ungarischen Sozialdemokraten, und János Zichy, Vorsitzender der Ungarischen Christlich-Wirtschaftlichen und Sozialen Partei sowie Mitglied der Ungarischen Akademie der Wissenschaften. Welche Zukunft erwartet Ungarn? "
WW_hungary.95.a:	"Mihály Károlyi versteht es, zu führen"
WW_hungary.95.b:	"Árpád Szakasits kann einen guten Mittelweg finden"
WW_hungary.96.a:	" Es lohnt sich nicht, dafür Blut zu vergießen"
WW_hungary.97.t:	"[FROM.GetNameDefCap] übergibt ihre [SLO.GetAdjective] Gebiete"
WW_hungary.97.desc:	"Die vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, ihre Gebiete in der Slowakei zu übergeben, und ihren Truppen befohlen, sich zurückzuziehen und das Gebiet zu verlassen. Wir stehen erneut als Sieger da!"
WW_hungary.97.a:	"Dies ist ein großartiger Tag!"
WW_hungary.99.t:	"Ungarn fordert die Oberhoheit über das Székely-Land"
WW_hungary.99.desc:	 "Das Gebiet, das den größten Teil von [76.GetName] umfasst und dem Volk von [HUN.GetAdjective] als Székelyföld bekannt ist, wird zum Großteil von ihren Brüdern, den székelyischen Ungarn, bewohnt. Sie sprechen ihren eigenen, unverwechselbaren Dialekt und haben ihre eigene einzigartige Kultur; daher hat [HUN.GetLeader] erklärt, dass sie kein integraler Bestandteil ihrer Nation sein müssen. Sie möchten jedoch die Hüter dieses Volkes sein und bitten uns um die Oberhoheit über das Gebiet."
WW_hungary.99.b:	"Sie leiden eindeutig unter Wahnvorstellungen"
WW_hungary.100.t:	"[FROM.GetName] gewährt uns ein Protektorat über Székelyföld"
WW_hungary.100.desc:	 "[FROM.GetLeader] von [FROM.GetNameDef] hat unsere Forderungen akzeptiert und die Region Székelyföld als autonome Region übergeben. Wir sind nun mit dem Schutz und der Verbesserung der Region beauftragt."
WW_hungary.100.a:	" Endlich wieder vereint!"
WW_hungary.101.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unsere Forderungen nach einem autonomen Székely-Protektorat abgelehnt. Dort bleibt das Volk von Székely verwundbar und schutzlos. Da sich ihre derzeitigen Herrscher kaum um sie kümmern, sollten wir eingreifen und die Region besetzen?"
WW_hungary.101.a:	"Sie werden ihre Taten bereuen"
WW_hungary.102.a:	"Gömbös muss Notstandsbefugnisse erlangen!"
WW_hungary.103.t:	"Ferenc Szálasis Staatsstreich"
WW_hungary.103.desc:	" Nachdem Gömbös die Partei des Nationalen Willens bewaffnet hatte, damit diese auf Budapest marschieren und er die nationale Führung übernehmen konnte, hat er nun keine Verwendung mehr für sie und hat Schritte unternommen, sie zu unterdrücken. Heute Morgen jedoch umzingelten sie den Sándor-Palast in Budapest und forderten seinen Rücktritt zugunsten ihres Anführers, Ferenc Szálasi. Die MOVE hat daraufhin begonnen, die Stadt einzukesseln, und das Land steht am Rande des Zusammenbruchs. Was ist zu tun?"
WW_hungary.103.a:	"Treten Sie zurück und ernennen Sie Szálasi zum neuen Nemzetvezető"
WW_hungary.104.t:	"[FROM.GetNameDefCap] fordert die Kontrolle über Kroatien"
WW_hungary.104.b:	"Dann kommen Sie und holen Sie es sich!"
WW_hungary.105.t:	"[FROM.GetNameDefCap] übergibt ihre kroatischen Gebiete"
WW_hungary.105.a:	"Dies ist ein großartiger Tag!"
WW_hungary.106.desc:	"Obwohl nicht ganz unerwartet, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] nach Erhalt unseres Ultimatums die Truppen der Nation in höchste Alarmbereitschaft versetzt und einen Gesandten entsandt, der erklärte, dass sie in dieser Streitfrage keinen einzigen Schritt zurückweichen werden."
WW_hungary.108.desc:	" \nDa die [FROM.GetAdjective] Führung unter [FROM.GetLeader] nun eng mit uns verbündet ist, haben sie darum gebeten, einen deutschen König zu krönen, der den nun symbolischen Platz auf dem [FROM.GetAdjective] Thron einnehmen soll. Dafür haben sie Hermann Göring ausgewählt, und ihre Historiker haben bereits damit begonnen, seine Verbindung zum alten ungarischen Anführer Árpád zu dokumentieren. Sollen wir ihm gestatten, nach [FROM.GetNameDef] zu reisen?"
WW_hungary.108.a:	"Wir werden es gestatten"
WW_hungary.109.t:	"[FROM.GetLeader] Erlaubt die Krönung Görings"
WW_hungary.109.desc:	"Der große [GER.GetLeader] hat zugestimmt, dass Hermann Göring in unser Land zieht und der neue konstitutionelle König unseres Volkes wird. Unsere Bande werden immer enger, und endlich steht der Thron nicht mehr leer."
WW_hungary.109.a:	"Wir sind dankbar"
WW_hungary.110.desc:	"Der paranoide [FROM.GetLeader] hat beschlossen, Hermann Göring die Einreise in unser Land nicht zu gestatten, trotz ständiger Drängerei und gut vorgebrachter Argumente. Wir müssen ohne König auskommen und Szálasi zum einzigen Führer der Nation machen."
WW_hungary.110.a:	"Es scheint kein Königreich mehr zu sein"
WW_hungary.111.t:	"Referendum über den Beitritt zum [HUN.GetAdjective] Staat"
WW_hungary.112.t:	"[FROM.GetNameDefCap] akzeptiert das Referendum"
WW_hungary.112.desc:	"Die Führung in [FROM.GetNameDef] hat öffentlich ihre unerschütterliche Unterstützung für die Selbstbestimmung der Bevölkerung in der Region [664.GetName] bekundet. Es ist an der Zeit, dass sie selbst entscheiden können, in welchem Staat sie leben möchten, erklärte [FROm.GetLeader] Anfang dieser Woche und verzichtete damit im Wesentlichen auf ihre Ansprüche auf das Gebiet."
WW_hungary.112.a:	"Eine vernünftige Reaktion"
WW_hungary.113.t:	"[FROM.GetNameDefCap] erklärt das Referendum für unrechtmäßig"
WW_hungary.113.desc:	"Die Führung in [FROM.GetNameDef] hat öffentlich erklärt, dass die Ergebnisse der Referenden, die Anfang dieses Monats in der Region [664.GetName] abgehalten wurden, unrechtmäßig seien, und erklärt, dass die Wahlbeteiligung und die internationalen Beobachter in hohem Maße manipuliert waren und eindeutig eine Voreingenommenheit zugunsten der Regierung von [ROOT.GetAdjective] zeigten."
WW_hungary.114.t:	"Referendum über den Beitritt zum Staat [HUN.GetAdjective]"
WW_hungary.114.desc:	"Seit einem Monat findet in [73.GetName] ein öffentliches Referendum statt, mit dem Ziel, zu entscheiden, ob sie [HUN.GetNameDef] beitreten möchten oder nicht. Da es von internationalen Beobachtern gebilligt wurde, kann man davon ausgehen, dass kaum Wahlbetrug stattgefunden hat. Die Ergebnisse liegen nun vor, wobei ein großer Teil der Bevölkerung für den Austritt aus unserer Nation gestimmt hat. Sollten wir dies akzeptieren?"
WW_hungary.114.a:	"Wenn es der Wunsch des Volkes ist"
WW_hungary.114.b:	"Das Referendum war manipuliert"
WW_hungary.116.t:	"[FROM.GetNameDefCap] erklärt das Referendum für ungültig"
WW_hungary.116.desc:	"Die Führung in [FROM.GetNameDef] hat öffentlich erklärt, dass die Ergebnisse der Referenden, die Anfang dieses Monats in der Region [73.GetName] abgehalten wurden, ungültig seien, und behauptet, dass die Wahlbeteiligung und die internationalen Beobachter in hohem Maße manipuliert waren und eindeutig eine Voreingenommenheit gegenüber der |___NS004159 ___| Regierung."
WW_hungary.116.a:	"Wir werden es akzeptieren müssen"
WW_hungary.117.desc:	"Im letzten Monat fand in [45.GetName] ein öffentliches Referendum statt, mit dem Ziel zu entscheiden, ob man sich [HUN.GetNameDef] anschließen möchte oder nicht. Da es von internationalen Beobachtern bestätigt wurde, kann man davon ausgehen, dass kaum Wahlbetrug stattgefunden hat. Die Ergebnisse liegen nun vor, und ein großer Teil der Bevölkerung hat für den Austritt aus unserem Land gestimmt. Sollten wir dies akzeptieren?"
WW_hungary.117.a:	"Wenn es der Wunsch der Bevölkerung ist"
WW_hungary.117.b:	"Das Referendum war manipuliert"
WW_hungary.118.t:	"[FROM.GetNameDefCap] Akzeptiert das Referendum"
WW_hungary.118.a:	"Eine vernünftige Reaktion"
WW_hungary.119.t:	"[FROM.GetNameDefCap] Erklärt das Referendum für ungültig"
WW_hungary.120.t:	"Referendum über den Beitritt zum [HUN.GetAdjective] Staat"
WW_hungary.120.b:	"Das Referendum war manipuliert"
WW_hungary.121.t:	" [FROM.GetNameDefCap] Akzeptiert das Referendum"
WW_hungary.121.desc:	"Die Führung in [FROM.GetNameDef] hat sich öffentlich zu Wort gemeldet und ihre unerschütterliche Unterstützung für die Selbstbestimmung der Bevölkerung in der Region [76.GetName] bekundet. Es ist an der Zeit, dass sie selbst entscheiden können, in welchem Staat sie leben möchten, erklärte [FROm.GetLeader] Anfang dieser Woche und gab damit im Wesentlichen ihre Ansprüche auf das Gebiet auf."
WW_hungary.121.a:	"Eine vernünftige Reaktion"
WW_hungary.122.t:	"[FROM.GetNameDefCap] erklärt das Referendum für unrechtmäßig"
WW_hungary.122.a:	"Wir werden es akzeptieren müssen"
WW_hungary.123.desc:	"Unsere Truppen haben den radikalen nationalsozialistischen Politiker Zoltán Böszörmény und seine Anhänger abgefangen, die auf Budapest marschierten, im Rahmen eines Putschversuchs, der stark von Mussolinis Marsch auf Rom beeinflusst war. Dieser politische Randaktivist, der sich selbst als "Riesen unter den Riesen des Intellekts und großen ungarischen Dichter mit prophetischer Mission" bezeichnet, hat seine Gruppe unzufriedener Anhänger aus der Landwirtschaft unter dem Banner ihres Sichelkreuzes versammelt und zieht auf unsere Hauptstadt zu. Wie sollen wir damit umgehen?"
HUN_third_mexican_empire_tt:	"§YMexiko§! wird bekannt sein als §Ydas Dritte Mexikanische Reich§!. \n"
HUN_croatia_slavonia_tt:	"§YKroatien§! wird bekannt sein als §Ydas Königreich Kroatien-Slawonien§!. \n"
HUN_cisleithania_tt:	"§YÖsterreich§! wird bekannt stehen als §Ydie im Reichsrat vertretenen Königreiche und Länder§!.\n"
WW_hungary.124.t:	"Ein Mann kehrt nach Hause zurück"
wuw_HUN_news_events.1.t:	"[HUN.GetNameDEFCAP] Kündigt das Győri-Programm an"
wuw_HUN_news_events.1.d:	"\nDie [HUN.GetAdjective] Regierung unter [HUN.GetLeader] hat ein neues großangelegtes Industrieprogramm angekündigt, mit dem Ziel, das Land so schnell wie möglich effizient wieder aufzurüsten. Ausländische Beobachter betrachten dies als einen Akt der Aggression seitens [HUN.GetNameDef] gegenüber ihren Nachbarn, doch nur die Zeit wird zeigen, was ihre wahren Absichten sind."
wuw_HUN_news_events.2.t:	"[HUN.GetNameDefCap] schließt sich den [GER.GetAdjective] an"
wuw_HUN_news_events.2.a:	"Wie wird sich das entwickeln?"
wuw_HUN_news_events.2.b:	"Für eine bessere Zukunft!"
wuw_HUN_news_events.2.c:	"Sie werden ein nützlicher Spielstein sein"
wuw_HUN_news_events.3.t:	"[HUN.GetNameDefCap] Reformiert die Mittelmächte"
wuw_HUN_news_events.3.c:	"Sie führen unser Erbe fort"
GER_Rejected_HUN_central_powers:	"Deutschland lehnte unseren Beitritt zu den Mittelmächten ab"
wuw_HUN_news_events.4.desc:	" [HUN.GetLeader] von [HUN.GetNameDef] hat die Ambitionen der Nation verkündet, die Welt zu beherrschen und eine [HUN.GetAdjective] Hegemonie auf allen Kontinenten zu errichten. Sie behaupten, dies sei das Geburtsrecht des Volkes des Apostolischen Königreichs und dass sie sich niemals wieder vor fremden Mächten beugen würden."
wuw_HUN_news_events.4.a:	"Sie müssen vernichtet werden!"
wuw_HUN_news_events.4.b:	" "Die Welt liegt uns zu Füßen!"
wuw_HUN_news_events.5.desc:	"Auf der Suche nach einem König für ihre Nation haben die [HUN.GetAdjective] nach langen Verhandlungen und Vorbereitungen Anfang dieser Woche [HUN.GetLeader] offiziell gekrönt. Heute wurde er unter großem Jubel und Feierlichkeiten in einer feierlichen Zeremonie im Königspalast in Budapest zum König von Ungarn gekrönt."
wuw_HUN_news_events.5.b:	"Ein neuer Feind erhebt sich"
wuw_HUN_news_events.6.t:	"Joseph August übernimmt die ungarische Krone"
wuw_HUN_news_events.6.a:	"Endlich ein König!"
wuw_HUN_news_events.6.c:	"Ein potenzieller Verbündeter?"
wuw_HUN_news_events.7.desc:	"Heute hat der Vorsitzende des Zentralen Exekutivrats von Ungarn, Béla Kun, die Wiedererrichtung der Sozialistischen Föderativen Republik der Räte in Ungarn angekündigt, die zuvor im August 1919 ein jähes Ende gefunden hatte. Obwohl sie in der Vergangenheit von einer vereinten Streitmacht aus Antirevolutionären und der Kleinen Entente niedergeschlagen wurde, hat Béla Kun erklärt, dass es diesmal anders sein werde. Was erwartet den Balkan in den kommenden Jahren?"
wuw_HUN_news_events.7.a:	"Arbeiter aller Länder, vereinigt euch!"
wuw_HUN_news_events.8.desc:	"Heute hat der Generalsekretär Ungarns, Mátyás Rákosi, die Gründung einer neuen Ungarischen Volksrepublik verkündet und angekündigt, dass das Land eine verstärkte Zusammenarbeit mit [SOV.GetNameDef] anstrebt. Obwohl er das Land als offene Demokratie bezeichnet hat, ist die diktatorische Herrschaft des Landes nicht zu übersehen. Wie sieht die Zukunft des ungarischen Volkes aus?"
wuw_HUN_news_events.8.b:	"Frieden war nie eine Option ..."
wuw_HUN_news_events.8.c:	"Zweifellos eine Überraschung, aber eine willkommene"
wuw_HUN_news_events.9.t:	"[HUN.GetNameDefCap] besetzt das Burgenland"
wuw_HUN_news_events.9.b:	"Es gehört ihnen nicht!"
wuw_HUN_news_events.9.c:	"Eine interessante Entwicklung"
ww_BEL_event_political.1.t:	"Die Regierung tritt zurück und es kommt zu vorgezogenen Wahlen"
ww_BEL_event_political.1.a:	"Bildung einer Regierung der nationalen Einheit"
ww_BEL_event_political.1.b:	"Vandervelde bildet eine Minderheitsregierung"
ww_BEL_event_political.2.t:	"Korruptionsskandal um Paul van Zeeland"
ww_BEL_event_political.3.t:	"Die königliche Ernennung"
ww_BEL_event_political.3.desc:	"Paul van Zeeland ist schließlich als Ministerpräsident zurückgetreten und verlässt sein Amt in Ungnade. Diesmal hat Leopold III., der König selbst, erklärt, dass er eingreifen und einen neuen Ministerpräsidenten ernennen wird. Es gibt zwei prominente Kandidaten: \n\nPaul-Émile Janson, Mitglied der Liberalen Partei und der Regierung der Nationalen Einheit, gilt als verlässliche Stütze. Der andere ist Léon Degrelle, der als Stimme von Recht und Ordnung gepriesen wird und kürzlich durch den Erfolg bei den Wahlen gestärkt wurde."
ww_BEL_event_political.3.a:	"Ernennen Sie den stabilen Mann, den Liberalen Paul-Émile Janson"
ww_BEL_event_political.4.a:	"Hoffentlich hält Premierminister Spaak länger durch!"
ww_BEL_event_political.5.desc:	"Was als recht normale Ernennung begann, entwickelte sich zu einer weiteren politischen Krise für unsere Regierung. Der Premierminister musste ein neues Mitglied in die Königliche Akademie für Medizin berufen und schlug Adriaan Martens zur Prüfung vor. Dies erwies sich aufgrund von Martens’ flämischem Nationalismus und seiner Kollaboration mit den deutschen Besatzern während des Ersten Weltkriegs als umstrittene Wahl. Diese Entscheidung stieß auf heftigen Widerstand seitens der Veteranen, der Liberalen und der französischsprachigen Belgier, und sogar der König hat sein Missfallen zum Ausdruck gebracht. \n\n[BEL.GetLeader] hat versucht, die Wahl zu verteidigen, steht jedoch unter zunehmendem Druck. Seine Gegner haben vorgezogene Neuwahlen gefordert, um einen neuen Regierungschef zu wählen, obwohl Spaak möglicherweise über das politische Kapital verfügt, um um dieses Amt zu kämpfen. "
ww_BEL_event_political.5.a:	"Der Premierminister sollte zurücktreten und vorgezogene Neuwahlen anberaumen"
ww_BEL_event_political.5.b:	"Spaak verfügt über die politische Unterstützung, um dies zu überstehen"
ww_BEL_event_political.6.desc:	"Seit seiner Gründung ist Belgien ein Land, das zwischen zwei Sprachgruppen gespalten ist: den französischsprachigen Wallonen und den niederländischsprachigen Flamen. Dies hat zu einer ganzen Reihe von Problemen innerhalb unserer Nation geführt, von einfachen Missverständnissen zwischen Freunden über falsch ausgeführte militärische Befehle bis hin zu Justizirrtümern, weil Angeklagte nicht dieselbe Sprache sprechen wie das Gericht, das über sie urteilt. \n\nEs ist an der Zeit, diese Spaltung ein für alle Mal beiseite zu legen und zu entscheiden, wie wir unsere Nation am besten unter einem gemeinsamen Sprachmodell vereinen können."
ww_BEL_event_political.6.b:	"Französisch sollte Vorrang haben."
ww_BEL_event_political.7.desc:	"Da die Verfassungskrise vorerst eingedämmt ist, ist es an der Zeit, sicherzustellen, dass die Regierung wieder ihre Legitimität erlangt, andernfalls unterscheidet sie sich nicht von denjenigen, die sie gerade abgesetzt hat. Derzeit sind Paul-Henri Spaak von den Sozialisten und Hubert Pierlot von der Katholischen Partei die Spitzenreiter bei den möglichen vorgezogenen Wahlen."
ww_BEL_event_political.7.b:	"Paul-Henri Spaak und die Arbeiterpartei werden uns in eine neue sozialistische Zukunft führen."
ww_BEL_event_political.8.t:	"Die Sprache des Volkes "
ww_BEL_event_political.8.b:	"Französisch ist unsere Sprache"
ww_BEL_event_political.8.c:	"Unsere Sprachen sind gleichberechtigt, und wir werden beide beibehalten!"
ww_BEL_event_diplomatic.1.t:	"[FROM.GetNameDefCap] lehnt unsere Garantien ab "
ww_BEL_event_diplomatic.1.desc:	"[FROM.GetLeader] hat uns mitgeteilt, dass die gegenseitigen Verteidigungsverträge zwischen unseren Ländern null und nichtig sind, da sie in diesen unruhigen Zeiten einen neutralen Kurs verfolgen. Das hat für sie während des Ersten Weltkriegs jedoch nicht wirklich funktioniert...."
ww_BEL_event_diplomatic.1.a:	"Sollen sie doch alleine voranschreiten"
ww_BEL_event_diplomatic.2.b:	"Luxemburg ist eine stolze und unabhängige Nation!"
ww_BEL_event_diplomatic.3.t:	"[FROM.GetNameDefCap] Kapituliert"
ww_BEL_event_diplomatic.3.desc:	"Wir haben hervorragende Nachrichten erhalten! Die Bevölkerung von [FROM.GetNameDefCap] hat klugerweise erkannt, dass wir gemeinsam stärker sind, und es werden bereits Vorkehrungen getroffen, um die neue Verwaltung dieses Gebiets sicherzustellen."
ww_BEL_event_diplomatic.3.a:	"Hervorragend"
ww_BEL_event_diplomatic.4.desc:	" Leider scheint es, als hätten die Menschen von [FROM.GetNameDefCap] ein überhöhtes Selbstverständnis ihrer eigenen Souveränität und hätten beschlossen, unser freundliches Angebot zur Vereinigung abzulehnen. Wir müssen ihnen die Stärke unserer Nation demonstrieren und sie mit Gewalt in unsere Union aufnehmen."
ww_BEL_event_diplomatic.5.b:	"Kongo für Calais."
ww_BEL_event_diplomatic.5.d:	"Bieten Sie im Gegenzug ein Bündnis an."
ww_BEL_event_diplomatic.6.desc:	"Wir haben soeben eine unverschämte Forderung von [BEL.GetName] erhalten, ihnen Calais zu übergeben! Sie behaupten, dieses Land gehöre rechtmäßig zu Belgien aufgrund des historischen Herzogtums Burgund, auf das sie einen gewissen Anspruch erheben. Ihre Botschafter haben ganz klar mit Gewalt gedroht, sollten wir ihrer Forderung nicht nachkommen; angesichts ihrer militärischen Stärke handelt es sich jedoch höchstwahrscheinlich um einen Bluff."
ww_BEL_event_diplomatic.6.a:	"Sacre Bleu! Non!"
ww_BEL_event_diplomatic.7.t:	"Belgien möchte Calais tauschen"
ww_BEL_event_diplomatic.7.a:	"Nein, Calais ist für uns wertvoller."
ww_BEL_event_diplomatic.7.b:	"Nun gut, das ist ein fairer Tausch. "
ww_BEL_event_diplomatic.8.desc:	"Wir haben soeben ein interessantes Angebot von der [BEL.GetAdjective] Delegation erhalten. Sie haben Interesse bekundet, Calais von uns zu kaufen, um ihre "historischen Gebiete wieder zu vereinen". Die von ihnen vorgeschlagene Summe ist recht hoch und würde sicherlich in gewissem Maße zur Verbesserung unserer eigenen Wirtschaft beitragen; die Frage ist, ob wir glauben, dass dieser Verlust an Land diesen Preis wert ist. Es sollte auch beachtet werden, dass ihre Diplomaten eine Eskalation der Spannungen angedeutet haben, sollten wir ihr Angebot ablehnen."
ww_BEL_event_diplomatic.8.a:	"Nein, Calais ist für uns wertvoller."
ww_BEL_event_diplomatic.8.b:	"Das scheint ein fairer Preis zu sein!"
ww_BEL_event_diplomatic.10.t:	"Frankreich hat zugestimmt!"
ww_BEL_event_diplomatic.10.desc:	"Wir haben von unserer Delegation in Paris die Nachricht erhalten, dass [FRA.GetName] beschlossen hat, unser Angebot anzunehmen, und der Prozess zur Übertragung der Verwaltung von Calais und den umliegenden Gebieten an uns ist bereits im Gange!"
ww_BEL_event_diplomatic.10.a:	"Unser rechtmäßiges Territorium wurde wiederhergestellt!"
ww_BEL_event_diplomatic.11.a:	"Treten Sie vom Abgrund zurück."
ww_BEL_event_diplomatic.11.b:	"Dann haben sie sich für den Krieg entschieden!"
ww_BEL_event_diplomatic.12.desc:	"Eine Mitteilung der Führung von [FROM.GetAdjective] hat uns soeben erreicht. Da die Welt um sie herum immer feindseliger wird, hegen sie Bedenken hinsichtlich ihrer eigenen Fähigkeit, ihr Land zu schützen. Unsere Hilfe wäre höchst willkommen und von entscheidender Bedeutung für die Wahrung des Friedens in der Region."
ww_BEL_event_diplomatic.12.b:	" Wir können ihnen nicht helfen"
ww_BEL_event_diplomatic.13.desc:	"Wir haben die wunderbarste Nachricht von den [FROM.GetAdjective] Diplomaten erhalten. Sie stimmen zu, dass unsere Sicherheit bedroht sein könnte und dass unsere Armee möglicherweise nicht ausreicht, um unsere Unabhängigkeit zu sichern. In diesem Zusammenhang haben sie uns die von uns geforderte Garantie angeboten."
ww_BEL_event_diplomatic.14.t:	"[FROM.GetNameDefCap] Verweigert uns eine Garantie"
ww_BEL_event_diplomatic.15.desc:	"Eine Bitte der im Exil lebenden [FROM.GetAdjective] Führung ist soeben bei uns eingegangen. Sie wünschen sich von uns Ausrüstung, um die Truppen, die ihnen noch verbleiben, auszubilden, in der Hoffnung, dass sie irgendwann in der Lage sein werden ihre Heimat zurückzuerobern."
ww_BEL_event_diplomatic.15.a:	"Wir werden sie unterstützen!"
ww_BEL_event_diplomatic.15.b:	"Ihr Ziel ist edel, aber wir können nicht helfen"
ww_BEL_event_diplomatic.16.desc:	"Wir haben eine Anfrage der [FROM.GetAdjective] Führung erhalten, unsere Fabriken zur Herstellung von Ausrüstung für ihre verbliebenen Truppen zu nutzen. Sie streben danach, ihre Heimatländer zurückzuerobern, und dafür benötigen ihre Truppen Ausrüstung."
ww_BEL_event_diplomatic.16.b:	"Wir verfügen nicht über die Kapazitäten, um zu helfen"
ww_BEL_event_diplomatic.17.t:	"[FROM.GetNameDefCap] schlägt den Austausch militärischer Erfahrungen vor"
ww_BEL_event_diplomatic.18.t:	" [FROM.GetNameDefCap] Stimmt zu"
ww_BEL_event_diplomatic.18.desc:	"Unsere vorgeschlagenen Maßnahmen zur Stärkung unserer Position und zum Wiederaufbau unserer Armee für die Rückeroberung des Heimatlandes wurden von [FROM.GetNameDef] befürwortet. Auch wenn dies allein unsere Probleme nicht lösen kann, wird es ein wichtiger Meilenstein für uns sein, um endlich unsere Unabhängigkeit zurückzugewinnen."
ww_BEL_event_diplomatic.18.a:	"Großartige Neuigkeiten!"
ww_BEL_event_diplomatic.19.t:	"[FROM.GetNameDefCap] Lehnt ab"
ww_BEL_event_diplomatic.19.a:	"Bedauerlich"
ww_BEL_event_diplomatic.20.t:	"[FROM.GetNameDefCap] lädt uns zu einem europäischen Kooperationsprojekt ein"
ww_BEL_event_diplomatic.21.t:	"[FROM.GetNameDefCap] tritt der [ROOT.GetFactionName] bei"
ww_BEL_event_diplomatic.21.desc:	"Unsere Einladung an [FROM.GetNameDef] wurde positiv aufgenommen. Man ist sich einig, dass eine größere europäische Gemeinschaft der richtige Weg ist. Mit gemeinsamen Anstrengungen werden wir die Region wieder stabilisieren können."
ww_BEL_event_diplomatic.21.a:	"Großartige Neuigkeiten!"
ww_BEL_event_diplomatic.22.t:	"[FROM.GetNameDefCap] Lehnt unsere Einladung zu [ROOT.GetFactionName] ab"
ww_BEL_event_diplomatic.22.desc:	"Die [FROM.GetAdjective] Diplomaten sind mit einer enttäuschenden Antwort zu uns zurückgekehrt. Sie behaupten, dass die Idee zwar edel sei, aber unweigerlich scheitern werde, ähnlich wie ähnliche Initiativen vor uns."
ww_BEL_event_diplomatic.22.a:	"Wirklich schade ..."
ww_BEL_event_diplomatic.23.a:	"Sicher, wir machen mit"
ww_BEL_event_diplomatic.24.t:	"[FROM.GetNameDefCap] Tritt der Forschungsgruppe zur Europäischen Union bei"
ww_BEL_event_diplomatic.25.desc:	"Obwohl wir glaubten, der Forschungsgruppe der Europäischen Union stichhaltige Argumente vorgelegt zu haben [FROM.GetNameDef], hat diese sich geweigert, der Initiative beizutreten. Wir hoffen, dennoch von der Initiative profitieren zu können, doch dies wird ohne [FROM.GetNameDef] geschehen müssen."
ww_BEL_event_diplomatic.25.a:	" Na ja..."
ww_BEL_event_diplomatic.26.a:	"Zum Wohle von [FROM.GetFactionName]"
ww_BEL_event_diplomatic.26.b:	"Nein, wir müssen an unsere Souveränität denken! "
ww_BEL_event_diplomatic.26.b_tt:	"§RSie könnten uns aus der Fraktion ausschließen!§!"
ww_BEL_event_diplomatic.27.t:	"[FROM.GetNameDefCap] Erlaubt begrenzte Föderalisierung"
ww_BEL_event_diplomatic.27.a:	"Großartig!"
ww_BEL_event_diplomatic.28.b:	"Sie sind eine Gefahr für uns alle!"
ww_BEL_event_diplomatic.29.t:	"Otto von Habsburg bietet seine Unterstützung an"
ww_BEL_event_diplomatic.29.a:	"Es wäre uns eine Ehre, ihn an Bord zu haben"
ww_BEL_event_diplomatic.29.b:	"Die Habsburger gehören der Vergangenheit an."
ww_BEL_event_diplomatic.30.desc:	" Nach der [FROM.GetAdjective] Entscheidung, ihre Neutralitätsbestrebungen aufzugeben, hat sich die Führung von [FROM.GetNameDef]" noch enger an unserer politischen Agenda ausgerichtet. Sie hat sich nun mit der Bitte an uns gewandt, [ROOT.GetFactionName] beizutreten. Ihre Hilfe könnte nützlich sein und uns neue Möglichkeiten eröffnen, Strategien für unsere zukünftige Expansion zu entwickeln."
ww_BEL_event_diplomatic.30.b:	"Wir brauchen sie nicht"
ww_BEL_event_diplomatic.31.desc:	"Der Anführer von [FROM.GetAdjective], [FROM.GetLeader], hat uns kontaktiert, um uns in der [FROM.GetFactionName] willkommen zu heißen. Von nun an werden wir Seite an Seite gegen gemeinsame Bedrohungen kämpfen. Die Zeit unserer Neutralität ist vorbei!"
ww_BEL_event_diplomatic.31.a:	"Großartige Neuigkeiten"
ww_BEL_event_diplomatic.32.desc:	"Trotz offensichtlicher Vorteile hat der Anführer der [FROM.GetAdjective], [FROM.GetLeader], uns als Mitglied der [FROM.GetFactionName] abgelehnt. Wir hätten viel beitragen können, doch angesichts dieser Reaktion sollten wir unsere Ambitionen, uns ihnen anzuschließen, sowohl jetzt als auch in Zukunft überdenken."
ww_BEL_event_diplomatic.32.a:	"Wir können etwas Besseres schaffen!"
BEL_tried_to_join_the_axis_flag:	"Haben bereits versucht, der [GER.GetFactionName] beizutreten"
ww_BEL_event_diplomatic.33.t:	"Die Zukunft der Neutralität von [ROOT.GetAdjective]"
ww_BEL_event_diplomatic.33.b:	"Die Neutralität muss gewahrt bleiben!"
ww_BEL_event_diplomatic.34.t:	"[FRA.GetNameDefCap]: Freund oder Feind?"
ww_BEL_event_diplomatic.35.t:	"[FROM.GetNameDefCap] wendet sich an uns"
ww_BEL_event_diplomatic.35.desc:	"Wir wurden von unserem nördlichen Nachbarn kontaktiert. Sie wünschen sich ernsthaftere diplomatische Beziehungen zu uns. Ihr Angebot könnte für uns beide von Vorteil sein, doch müssen wir dennoch sicherstellen, dass wir in dieser Angelegenheit die richtige Entscheidung treffen."
ww_BEL_event_diplomatic.36.t:	"Der [FROM.GetAdjective] stimmt zu"
ww_BEL_event_diplomatic.36.a:	"Großartig!"
ww_BEL_event_diplomatic.37.t:	"Der [FROM.GetAdjective] ist anderer Meinung"
ww_BEL_event_diplomatic.37.desc:	"Trotz der offensichtlichen Vorteile für uns beide scheint es, dass die [FROM.GetAdjective] nicht bereit sind, über das bereits Bestehende hinaus diplomatische Beziehungen zu uns zu pflegen. Wir hatten große Hoffnungen in diese Sache gesetzt, doch es scheint, dass diese nicht geteilt wurden."
ww_BEL_event_diplomatic.37.a:	"Schade ..."
ww_BEL_event_war.2.t:	"Unbekannte Sympathien"
BEL_unknown_sympathies_tt:	"§RKönig Leopold wird kapitulieren, wenn wir Lüttich, Antwerpen oder Brüssel verlieren. Sie haben vielleicht noch einige Optionen, sollte dieser Zeitpunkt kommen.§!"
ww_BEL_event_war.3.t:	"Die Kapitulation des Königs"
ww_BEL_event_war.4.t:	" Der königliche Gefangene"
ww_BEL_event_war.4.desc:	"Nach seinem Verrat, durch den er die Nation dem Angreifer ausgeliefert hat, wurde der König unter Hausarrest gestellt und seines Amtes als Oberbefehlshaber der Streitkräfte, seiner Titel und natürlich seiner Krone enthoben. Das Volk braucht jedoch weiterhin einen Herrscher, und es liegt nun an uns zu entscheiden, wer die Regentschaft übernehmen soll, bis sein Sohn alt genug ist, den Thron zu besteigen. Es gibt zwei Optionen: \n\nDie erste ist Leon Degrelle, der Premierminister und rechtmäßig ernannte Führer unseres Volkes. Die andere Option ist Karl, Graf von Flandern, der Bruder Leopolds, der der Krone den Anschein von Legitimität und Kontinuität verleihen würde."
ww_BEL_event_war.4.a:	"Machen Sie Leon Degrelle zum neuen Regenten"
ww_BEL_event_war.4.b:	"Sichern Sie die legitime Linie mit Karl"
ww_BEL_event_war.5.t:	" Die Kapitulation des Königs"
ww_BEL_event_war.6.desc:	"Eine Gruppe belgischer Beamter ist mit einem Angebot an uns herangetreten: Wenn wir ihnen gestatten, ihre Arbeit im öffentlichen Dienst fortzusetzen, werden sie dafür sorgen, dass die Kommunalverwaltung in dieser Übergangszeit reibungslos weiterfunktioniert. Die belgische Regierung hat Gesetze erlassen, um ihre Zusammenarbeit mit uns zu legalisieren, in dem Bestreben, die Auswirkungen der Besatzung auf ihre Bevölkerung zu mildern. Sie hat sogar belgischen Banken die Genehmigung erteilt, die Gehälter dieser Verwaltungsbeamten weiter auszuzahlen. Dies ist eine Gelegenheit für uns, unsere Bereitschaft zur Zusammenarbeit mit den Einheimischen zu zeigen, und wird dazu beitragen, den aktiven Widerstand in der Region abzuschwächen."
ww_BEL_event_war.6.a:	"Eine gute Initiative, arbeiten Sie mit ihnen zusammen, um eine reibungslose Besatzung zu gewährleisten."
BEL_available_secretaries_general_tt:	"§YGeneralsekretäre§! stehen nun als §YBesatzungsgesetz§! in Belgien zur Verfügung"
BEL_remove_secretaries_general_civs_tt:	"Entfernen Sie 2 §YZivilfabriken außerhalb der Karte§!"
ww_BEL_event_war.7.desc:	 "Unsere Spitzen-Diplomaten und Generäle haben sich kürzlich getroffen und uns darauf hingewiesen, dass wir, sollte dieser Konflikt in seinem Umfang begrenzt bleiben – das heißt, sollten sich keine anderen Großmächte einmischen –, möglicherweise in der Lage wären, [FRA.GetName] an den Verhandlungstisch zu bringen und ein schnelles Friedensabkommen zu erzielen. Wir wissen, dass sie Angst vor zunehmenden Spannungen haben und ebenso wie wir keinen Wunsch verspüren, in einen weiteren globalen Konflikt hineingezogen zu werden. |___NL00658 8___|\nDaher gehen wir davon aus, dass der Fall von Paris als Beweis für unsere Fähigkeiten ausreichen würde, sodass sie bereit wären, über die Übergabe des umstrittenen Calais zu verhandeln."
ww_BEL_event_war.8.t:	"Paris ist gefallen!"
ww_BEL_event_war.8.desc:	"In einer nationalen Katastrophe ist unsere stolze Hauptstadt Paris gefallen! Einmal mehr haben sich unsere Streitkräfte angesichts eines deutlich unterlegenen Feindes als unzureichend erwiesen. Die [FROM.GetAdjective] haben angeboten, ihre Truppen zurückzuziehen und den Rest des Landes zu verschonen, doch im Gegenzug verlangen sie, dass wir ihnen Calais übergeben. \n\nWir spüren bereits, wie die Geier ihre Kreise ziehen, und dies wird uns Zeit geben, die gewonnenen Erkenntnisse zu verinnerlichen und uns auf potenziell stärkere Gegner in der Zukunft vorzubereiten."
ww_BEL_event_war.8.a:	"Bieten Sie Calais für den Frieden an."
ww_BEL_event_war.9.t:	"Frankreich stimmt dem Frieden zu"
ww_BEL_event_war.9.desc:	"Heute empfingen wir eine französische Delegation, die nach dem Fall ihrer Hauptstadt gekommen war, um über eine friedliche Lösung des aktuellen Konflikts zu verhandeln. Nach mehreren Beratungen haben sie sich darauf geeinigt, uns Calais im Austausch für eine sofortige Einstellung der Feindseligkeiten anzubieten. \n\nEs sei darauf hingewiesen, dass dies ein einmaliges Angebot ist; sollten wir es ablehnen, werden sie in ihrer Verteidigung entschlossener vorgehen und es wahrscheinlich nicht erneut anbieten."
ww_BEL_event_war.9.b:	"Kämpft weiter! Wir können noch mehr einstecken."
ww_BEL_event_war.10.b:	"Wir wollen alles!"
ww_BEL_event_spanish_interaction.1.desc:	"Wir haben eine Lieferung von Gewehren von der [FROM.GetAdjective] Regierung erhalten. Sie teilen unsere Ansicht, dass die Nationalisten gestoppt werden müssen, und möchten unseren Kampf unterstützen – und zwar nicht nur mit Worten."
ww_BEL_event_spanish_interaction.2.t:	"Weitere Ausrüstungslieferungen an [SPR.GetAdjective] die Republikaner"
ww_BEL_event_spanish_interaction.2.desc:	"Unsere vorherige Lieferung an die [SPR.GetAdjective] hat sich für unsere republikanischen Freunde als sehr nützlich erwiesen. Ihr Kampf ist jedoch noch lange nicht vorbei, und wir sollten in der Lage sein, ihnen weitere Ausrüstung anzubieten."
ww_BEL_event_spanish_interaction.2.b:	"Sie könnten etwas Unterstützungsausrüstung gebrauchen!"
ww_BEL_event_spanish_interaction.2.c:	"Schicken Sie ihnen Artillerie!"
ww_BEL_event_spanish_interaction.3.t:	"[FROM.GetNameDefCap] Schickt mehr Ausrüstung"
ww_BEL_event_spanish_interaction.4.t:	"[FROM.GetAdjective] Rede zur Unterstützung unseres Kampfes"
ww_BEL_event_spanish_interaction.4.a:	"Richten Sie unseren Dank an die [FROM.GetAdjective]s aus!"
ww_BEL_event_spanish_interaction.5.desc:	"In letzter Zeit haben wir einen Anstieg der Einwanderung von [FROM.GetAdjective]-Bürgern beobachtet. Viele dieser Einwanderer erklären sich bereit, sich unseren Streitkräften anzuschließen, sollten wir ihre Hilfe benötigen. Man kann sich nur vorstellen, dass dies eine bewusste Anstrengung seitens der [FROM.GetAdjective]s ist."
ww_BEL_event_spanish_interaction.5.a:	"Großartige Neuigkeiten!"
ww_BEL_event_spanish_interaction.6.t:	"[FROM.GetNameDefCap] schlägt Bündnis vor"
ww_BEL_event_spanish_interaction.6.desc:	"Die zuvor so neutralen [FROM.GetAdjective]s haben uns einen überraschenden Vorschlag unterbreitet. Sie möchten ein Bündnis mit uns eingehen. Sie hoffen, dass sie uns dadurch in unserem Kampf gegen die Nationalisten besser unterstützen können."
ww_BEL_event_spanish_interaction.6.a:	"Eine großartige Idee!"
ww_BEL_event_spanish_interaction.6.b:	"Wir wissen ihre Unterstützung zu schätzen, aber nein."
ww_BEL_event_spanish_interaction.7.t:	"[FROM.GetNameDef] tritt der [ROOT.GetFactionName] bei"
ww_BEL_event_spanish_interaction.7.desc:	"Die [FROM.GetAdjective] haben unseren Vorschlag zur Bildung der [ROOT.GetFactionName] positiv beantwortet. Wir werden gemeinsam gegen die nationalistische Bedrohung vorgehen!"
ww_BEL_event_spanish_interaction.7.a:	"Vorwärts!"
ww_BEL_event_spanish_interaction.8.t:	"[FROM.GetNameDefCap] Lehnt unseren Bündnisvorschlag ab"
ww_BEL_event_spanish_interaction.8.desc:	"Angesichts der Unterstützung, die wir dem [FROM.GetAdjective] kontinuierlich gewährt haben, hatten wir gehofft, dass unser Vorschlag auf positive Resonanz stoßen würde. Dies scheint jedoch nicht der Fall gewesen zu sein, da sie unseren Vorschlag abgelehnt haben und erklärten, dass unsere Hilfe zwar willkommen sei, sie jedoch kein Bündnis wünschten."
ww_BEL_event_spanish_interaction.9.desc:	"Mit dem Ende unseres Bürgerkriegs hat die [FROM.GetAdjective] beschlossen, dass es an der Zeit ist, unsere Partnerschaft zu beenden. Auch wenn dies unsere Allianz vorerst beendet, haben sie sehr deutlich gemacht, dass dies nicht bedeutet, dass wir nie wieder Verbündete sein werden."
ww_BEL_event_spanish_interaction.9.a:	"Wirklich schade"
ww_BEL_event_misc.1.t:	"Der Chef ist tot"
ww_BEL_event_misc.1.a:	"Sein Nachfolger ist der Mann, der die Aufgabe meistern wird!"
ww_BEL_event_misc.3.t:	"Cockerill: Das Herzstück der belgischen Fertigungsindustrie"
ww_BEL_event_misc.3.a:	"Sie haben wahrscheinlich den Motor unserer Wirtschaft gebaut!"
ww_congo.1.t:	"Belgien investiert in unsere Entwicklung"
ww_congo.1.desc:	"Das belgische Kolonialamt hat heute ein Gesetz verabschiedet, um wesentlich größere Mittel für unsere industrielle Entwicklung bereitzustellen, und mit dem Bau von Industrieanlagen in [295.GetName] begonnen."
ww_congo.4.desc:	"Der belgische Militäroffizier Raoul van Overstraeten, der bis vor kurzem in unserem Land gedient hat, hat nun angesichts der Nachricht von unserer neu gewonnenen Unabhängigkeit beschlossen, auf das europäische Festland zurückzukehren. Wir haben keinen Bedarf mehr an Europäern wie ihm, und dieser Verlust wird uns sicherlich nur stärker machen."
ww_congo.4.a:	"Weg mit dem Imperialisten!"
ww_congo.5.b:	"Wenn er glaubt, dass es das Beste ist ..."
CONGO_refused_increased_food_production:	"Unser Oberherr hat unseren Plan zur Steigerung der Nahrungsmittelproduktion abgelehnt"
ww_congo.6.t:	"Die [BEL.GetAdjective]s lehnen unseren Plan zur Steigerung der Nahrungsmittelproduktion ab"
ww_congo.6.a:	"Das war zu erwarten"
ww_congo.7.t:	"Die [BEL.GetAdjective]s genehmigen unseren Plan zur Steigerung der Nahrungsmittelproduktion"
ww_congo.7.a:	"Großartig!"
ww_congo.8.desc:	"Es gibt einen großen, wachsenden Teil der kongolesischen Bevölkerung, der über gute Französischkenntnisse verfügt, dem christlichen Glauben angehört und eine weiterführende Schulbildung genossen hat. Die Kolonialverwalter haben begonnen, sie als Évolué, als europäisierte Menschen, zu bezeichnen, und obwohl sie aufgrund der Anforderungen der Kolonialverwaltung weiterhin nur begrenzt in unserer Gesellschaft aufsteigen können, wird eine besser ausgebildete Bevölkerung sicherlich dazu beitragen, unserer Nation eines Tages Wohlstand zu bringen."
evolue_will_start_attempting_to_enter_politics_tt:	 "Die Évolués werden versuchen, in die Politik einzusteigen, was dazu führen wird, dass viele neue §YPolitische Berater§! verfügbar werden"
evolue_have_entered_politics:	" Verschiedene §YUnabhängigkeitsbefürworter§! und §Ykongolesische politische Denker§! stehen nun als §Ypolitische Berater§!"
ww_congo.9.a:	"Diese Männer werden unsere Nation sicherlich in die Unabhängigkeit führen"
ww_congo.10.t:	"[FROM.GetNameDefCap] Forderungen [772.GetName]"
ww_congo.10.d:	"Kongolesische Truppen sind entlang der Grenzen unserer Kolonie in [772.GetName] positioniert und fordern uneingeschränkten Zugang zu unseren Stützpunkten und Einrichtungen! Wenn wir ihrer Forderung nachgeben, übertragen wir ihnen faktisch die Kontrolle über [772.GetName]. Andererseits verfügen wir nicht gerade über die Mittel, um sie in dieser Angelegenheit zu bekämpfen."
ww_congo.10.a:	"Wir haben keine andere Wahl, als zuzustimmen."
ww_congo.11.t:	"Die Franzosen akzeptieren unsere Forderungen"
ww_congo.12.t:	"Die Franzosen lehnen unsere Forderungen ab"
ww_congo.12.a:	"Idioten!"
ww_congo.13.t:	"[FROM.GetNameDefCap] fordert unsere Integration"
ww_congo.13.b:	"Niemals!"
ww_congo.14.t:	" [FROM.GetNameDefCap] Akzeptieren unsere Forderungen"
ww_congo.14.d:	"[FROM.GetNameDefCap] haben unseren Forderungen zugestimmt, und ihre Nation wird innerhalb der nächsten Tage als unabhängige Einheit aufhören zu existieren. Sie haben die vollständige Kontrolle über ihr Land faktisch an uns übergeben."
ww_congo.14.a:	"Ein kluger Schachzug."
ww_congo.15.t:	"[FROM.GetNameDefCap] Lehnen Sie unsere Forderungen ab"
ww_congo.15.d:	"[FROM.GetNameDefCap] haben unsere Forderungen unverschämt abgelehnt! Es scheint, als müssten wir [772.GetName] mit Gewalt an uns reißen, wenn wir es wollen!"
ww_congo.15.a:	"Narren! "
ww_congo.16.t:	"Vereinigtes Latein-Afrika"
ww_congo.16.d:	"Als Reaktion auf die zunehmenden globalen Spannungen und angesichts der jüngsten Siegeszüge von [FROM.GetLeader] ist die Vereinigung der romanischsprachigen zentralafrikanischen Länder gelungen. Nun erklären sie sich zu einer neuen Weltmacht und versprechen, das [FROM.GetAdjective] Volk um jeden Preis zu schützen."
ww_congo.16.a:	"Sie sind zum Scheitern verurteilt"
ww_congo.16.b:	"Lang lebe [ROOT.GetNameDef]!"
ww_congo.17.d:	"Nach der Zustimmung durch die [BEL.GetAdjective] Behörden des Staates hielt der neue [COG.GetAdjective] Premierminister Patrice Lumumba eine kurze Rede, um die neu gewonnene Unabhängigkeit seines Landes zu feiern. Darin äußerte er unverblümte Kritik am Kolonialismus und an der sogenannten "[BEL.GetAdjective] zivilisatorischen Mission". Obwohl dies innerhalb der Nation positiv aufgenommen wurde, haben viele außerhalb des Landes dies als persönlichen Angriff auf das [BEL.GetAdjective] Staatsoberhaupt interpretiert. Die Ära der Entkolonialisierung hat gerade erst begonnen!"
ww_congo.17.c:	" Vielleicht war es das Beste ..."
ww_congo.18.t:	"Kongolesischer Aufstand niedergeschlagen"
ww_congo.18.d:	"Vor kurzem versuchte die Regierung der Freien Kongolesen in Stanleyville, sich vom belgischen Kolonialreich abzuspalten. Obwohl sie im Land große Unterstützung genoss, wurde ihr Aufstand rasch von belgietreuen Truppen und ausländischen Söldnern gleichermaßen niedergeschlagen."
ww_congo.18.b:	 "Die Verräter haben bekommen, was sie verdient haben"
ww_congo.18.c:	"Einigkeit macht stark"
ww_congo.19.t:	"Kongolesischer Aufstand erfolgreich"
ww_congo.19.d:	"Vor kurzem hat die Regierung der Freien Kongolesen in Stanleyville einen Unabhängigkeitskrieg gegen das belgische Kolonialreich begonnen. Obwohl es einige Zeit dauerte, gelang es ihrer Rebellion schließlich, die in der Region stationierten Kolonialtruppen zu überwältigen und die wichtigsten Städte im Kongo einzunehmen. Nun haben sie offiziell die Unabhängigkeit erklärt, und es wird ein Friedensabkommen zwischen ihnen und ihren ehemaligen Unterdrückern angestrebt.."
ww_congo.20.t:	"Die ruandische Revolution"
ww_congo.20.d:	"Angesichts des sehr lockeren Zugriffs unserer Regierung auf das Ruanda-Urundi-Mandat und der Ausbreitung nationalistischer Stimmungen in der gesamten Region hat Mwami Mutara III. Rudahigwa, König von Ruanda, die Nation zu einem unabhängigen Staat erklärt und damit die Verbindungen zu unserer Zentralregierung gekappt. Sollten wir eingreifen?"
ww_congo.20.a:	"Es steht uns nicht zu, sie aufzuhalten"
ww_congo.20.b:	"Wer hat ihnen die Unabhängigkeit zugesprochen?"
ww_congo.21.t:	"Mwambutsas Erklärung"
ww_congo.21.a:	"Es steht uns nicht zu, sie aufzuhalten"
ww_congo.21.b:	"Wer hat ihnen die Unabhängigkeit zugesprochen?"
threatened_us_opinion_modifier:	"Sie haben uns bedroht!"
ww_congo.22.desc:	"Unser Gouverneur im Kongo, [COG.GetLeader], hat seinen Wunsch nach einer verstärkten [ROOT.GetAdjective] Einwanderung in die Region zum Ausdruck gebracht, um Menschen mit Wissen und Kapital anzuziehen. Die reichen und warmen Gebiete von Katanga wären für viele mit Abenteuerlust oder Pflichtbewusstsein verlockend, und wenn wir dies fördern, wird dies sicherlich noch viel mehr Menschen dazu bewegen, hierher zu ziehen.."
ww_congo.22.a:	"Wir werden dem nachkommen"
ww_congo.22.b:	"Was glaubt er, wer er ist?"
ww_congo.23.desc:	" Die Kolonialverwaltung in [FROM.GetNameDef] hat unserem Antrag auf verstärkte Förderung der [FROM.GetAdjective] Auswanderung in unseren Staat stattgegeben. Eine neue Welle von Menschen, die bereit sind, beim Aufbau unseres Staates mitzuwirken, wird sicherlich bald eintreffen."
ww_congo.24.t:	" Die [FROM.GetAdjective] lehnen unser Einwanderungsprogramm ab"
ww_congo.24.desc:	"Die Kolonialverwaltung in [FROM.GetNameDef] hat unseren Antrag auf verstärkte Förderung der [FROM.GetAdjective] Auswanderung in unseren Staat abgelehnt. Es ist wirklich schade, aber wir können nicht viel tun, um sie umzustimmen. "
ww_congo.24.a:	"Ich meine, was haben wir denn erwartet?"
ww_congo.25.t:	"Albert de Vleeshauwer reist ins Ausland, um um Unterstützung zu werben"
ww_congo.25.a:	"Hier beginnt der Krieg erst richtig"
ww_congo.26.desc:	"\nAnfang dieser Woche marschierten Truppen der [COG.GetNameDef] ein und besetzten unser Gebiet [796.GetName], wobei sie angaben, sie seien auf einer Mission, um die Region vor einer möglichen Besetzung durch ihre Feinde zu schützen. Dies ist eindeutig ein kriegerischer Akt, jedoch einer, den wir wahrscheinlich einfach ignorieren könnten, da sie wahrscheinlich keinen Streit mit uns suchen, sondern vielmehr die Wiedervereinigung des Kongobeckens anstreben."
ww_congo.26.a:	"Es lohnt sich nicht, darum zu kämpfen"
ww_congo.27.t:	"Eine Meuterei in Luluabourg"
ww_congo.27.desc:	"Anfang dieser Woche meuterten kongolesische Unteroffiziere unter der Führung von Oberfeldwebel Ngoie Mukalabushi in Luluabourg in der Provinz Kasaï. Einer der Hauptauslöser scheint die Behandlung durch unsere belgischen Offiziere gewesen zu sein. Die Meuterer brachen am Morgen in die Waffenkammer der Basis ein und plünderten das weiße Viertel der Stadt. Sie griffen zudem sichtbare Symbole der Kolonialbehörden an und verkündeten ihren Wunsch nach Unabhängigkeit. Anschließend zerstreuten sie sich in ihre Heimatdörfer, wobei sie unterwegs plünderten, scheinen es jedoch nicht geschafft zu haben, den Aufstand auf benachbarte Garnisonen auszuweiten. Wie sollen wir mit der Situation umgehen? "
COG_pro_independence_reforms_in_the_force_publique_structure:	"Unabhängigkeitsfreundliche Reformen in der Force Publique"
ww_congo.28.t:	"Wachsendes Misstrauen gegenüber dem Nationalkomitee"
ww_congo.28.desc:	"Da das neu gegründete Nationale Befreiungskomitee eine eher distanzierte Haltung gegenüber der Kolonialregierung eingenommen hat, machen sich viele Menschen auf dem Land sich Sorgen darüber zu machen, dass das Komitee möglicherweise keinen friedlichen Weg zur Unabhängigkeit einschlagen wird. Darüber hinaus sind in der Region Katanga Gerüchte über eine Sezession aufgekommen, und es könnte sein, dass der Staat versucht, die Unabhängigkeit zu erklären, sobald unser Befreiungskrieg beginnt..."
ww_congo.28.a:	"Sie müssen überzeugt oder mit Gewalt befreit werden"
ww_congo.29.a:	"Auf jeden Fall"
ww_congo.29.b:	"Es gibt keinen Grund, einzugreifen"
ww_congo.30.t:	"[FROM.GetNameDefCap] beschließt, uns zu unterstützen"
ww_congo.30.desc:	"Unsere Diplomaten sind von ihren Gesprächen mit dem [FROM.GetAdjective] Militärstab zurückgekehrt und haben angeblich eine Vereinbarung getroffen, wonach sie uns Männer und Ausrüstung schicken werden, wenn wir beschließen, unseren Unterdrückern den Krieg zu erklären. Heute ist ein guter Tag für das Volk des Kongo! "
ww_congo.30.a:	"Perfekt"
ww_congo.31.desc:	"Unsere Diplomaten sind von ihren Gesprächen mit dem [FROM.GetAdjective] Militärstab mit leeren Händen zurückgekehrt. Es scheint, als könne keine Einigung erzielt werden, und unsere vermeintlichen Verbündeten haben uns betrogen..."
ww_congo.31.a:	"Eine echte Schande"
ww_congo.32.b:	"Christophe Gbenye sollte führen"
ww_congo.33.t:	"Die Frage der Führung"
ww_congo.33.desc:	"Die Führung unserer Nation ist in letzter Zeit in Frage gestellt worden, was auf Cyrille Adoulas Verbindungen zu amerikanischen und belgischen Gewerkschaften zurückzuführen ist. Viele sind der Meinung, dass der Anführer der Simbas, Christophe Gbenye, das Amt des neuen Staatspräsidenten übernehmen sollte. Sollten wir uns ihnen beugen?"
ww_congo.33.b:	"Christophe Gbenye sollte führen"
ww_congo.34.t:	"Staatsbesuch von Kwame Nkrumah"
ww_congo.34.desc:	"Der ghanaische panafrikanistische Politiker Kwame Nkrumah ist heute nach einer offiziellen Einladung durch [ROOT.GetLeader] in unserer Hauptstadt eingetroffen. Als überzeugter Sozialist glauben viele, dass eine Zusammenarbeit mit ihm von Vorteil sein könnte, wenn wir Afrikas Zukunft sichern wollen; einige behaupten sogar, er solle die Führung unserer Nation übernehmen. Was wäre die beste Vorgehensweise?"
ww_congo.34.a:	"Wir glauben, dass eine großartige Zusammenarbeit erreicht werden kann"
ww_congo.34.b:	"Er ist der Führer, den wir brauchen!"
ww_congo.35.t:	"[COG.GetNameDefCap] stachelt den Widerstand gegen die Kolonialherrschaft an"
ww_congo.35.desc:	"\nDie [COG.GetAdjective] Regierung hat Berichten zufolge damit begonnen, Waffen an Widerstandsgruppen in Afrika zu liefern, und beherbergt und trainiert Dissidenten und Milizen für deren Versuche, ihre unter unserer Besatzung stehenden Staaten zu befreien. Wir müssen in Bezug auf die Region in Zukunft vorsichtig sein..."
ww_congo.35.a:	"Wir müssen dem sofort ein Ende setzen!"
ww_congo.36.t:	"[FROM.GetName] Lehnt Friedensvorschlag ab"
ww_congo.36.a:	"Wie heuchlerisch – ihre imperiale Gewalt kann nur mit Gewalt gestoppt werden."
ww_congo.37.t:	"[FROM.GetNameDefCap] Bietet Frieden für [?COG.COG_disputed_colony.GetAdjective] Unabhängigkeit an"
ww_congo.37.desc:	"[FROM.GetAdjective] Diplomaten haben sich mit einem Friedensangebot an uns gewandt. Das Angebot hängt davon ab, dass wir zustimmen, unsere Ansprüche auf das [?COG.COG_disputed_colony.GetAdjective] Gebiet aufzugeben, das wir während dieses Konflikts an [FROM.GetNameDef] verloren haben. Die Diplomaten erklären zudem, dass in den abgetretenen [?COG.COG_disputed_colony.GetAdjective] Gebieten Wahlen stattfinden werden, um eine neue Regierung zu wählen. Inwieweit diese Wahlen unabhängig sein werden, ist noch unklar."
ww_congo.38.t:	"[FROM.GetName] Stimmt Friedensangebot zu"
ww_congo.38.desc:	"Diplomaten aus [FROM.GetNameDef] haben uns mitgeteilt, dass ihre Regierung bereit ist, ihre Ansprüche auf das von uns befreite [?COG.COG_disputed_colony.GetAdjective] Gebiet aufzugeben. Sie ziehen nun ihre Truppen an die neu festgelegten Grenzen in der Region zurück."
ww_congo.38.a:	" Ein heldenhafter Sieg über den Imperialismus!"
ww_congo.39.desc:	"Die ersten freien Wahlen sind abgeschlossen, und Joseph Kasa-Vubu hat sich durchgesetzt. Nun arbeitet er intensiv daran, das erste kongolesische Ministerkabinett zusammenzustellen. Da er im ganzen Land äußerst beliebt und in seinem Amt hervorragend ist, wird er sicherlich noch vielen kommenden Generationen als großer Präsident in Erinnerung bleiben."
ww_congo.40.desc:	"Unser Präsident [ROOT.GetLeader] ist dabei, unser erstes offizielles Kabinett zusammenzustellen, nachdem er bei den jüngsten Wahlen einen Sieg errungen hat. Da er im ganzen Land äußerst beliebt ist, wird er für kommende Generationen sicherlich als Gründervater unseres modernen Staates bekannt werden! "
ww_congo.40.a:	"Kasa-Vubu ist wahrlich der richtige Mann für diese Aufgabe"
ww_congo.41.t:	"[FROM.GetLeader] fordert die Wiedervereinigung des Volkes der Bakongo"
ww_congo.42.t:	 "[FROM.GetLeader] Übergibt die Gebiete der Bakongo"
ww_congo.42.desc:	"\n [FROM.GetLeader], Anführer von [FROM.GetNameDef], hat zugestimmt, alle Gebiete mit einem hohen Anteil an Bakongo-Bevölkerung zu übergeben, und wünscht uns alles Gute für die Zukunft. Heute ist ein großer Tag für die kongolesische Nation. "
ww_congo.42.a:	"Ausgezeichnet!"
ww_congo.43.t:	"[FROM.GetLeader] Übergibt die Bakongo-Gebiete nicht"
ww_congo.43.desc:	" \n [FROM.GetLeader], Anführer von [FROM.GetNameDef], hat unsere Forderungen nach der Übergabe aller Gebiete mit einem hohen Anteil an Bakongo-Bevölkerung zurückgewiesen. Wie sollen wir auf die Unterdrückung unseres Volkes durch ausländische Mächte reagieren?"
ww_congo.43.a:	"Wir können nicht viel tun"
ww_congo.43.b:	"Wir werden es ihnen zeigen!"
ww_congo.44.b:	"Nein, wir brauchen jemand anderen!"
ww_congo.45.t:	"Den Nyim von Bakuba"
ww_congo.45.desc:	"Der Rat hat beschlossen, dass der nächstlegitimere Herrscher des Kongo Mbóp Mábíínc maMbéky sein würde, der König des Königreichs Kuba, eines kleinen Reiches in unseren zentralen Provinzen. Sicherlich könnte er Stabilität schaffen und das erreichen, was nur wenige andere könnten?"
ww_congo.45.a:	"Er ist derjenige, der uns zu Größe führen wird!"
ww_congo.46.desc:	"Der Rat hat beschlossen, dass der nächstlegitimere Herrscher des Kongo Moe Poaty III. sein soll, der Mâ Loango des Königreichs Loango, eines Staates, der in und um unsere westlichsten Provinzen herum existiert, hauptsächlich im heutigen Mittelkongo. Sicherlich könnte er für Stabilität sorgen und die Vereinigung mit den westlichen kongolesischen Provinzen erreichen?"
ww_congo.46.a:	"Er kann uns einen legitimen Anspruch auf Mittelkongos sichern!"
ww_congo.46.b:	"Nein, wir brauchen jemand anderen!"
ww_congo.47.desc:	"Der Rat hat beschlossen, dass ein weiterer möglicher Herrscher des Kongo Mwambutsa IV. wäre, der Mwami des Königreichs Burundi, eines Königreichs im Osten. Sicherlich könnte er für Stabilität sorgen und eine Vereinigung mit dem burundischen Staat erreichen?"
ww_congo.47.b:	"Nein, wir brauchen jemand anderen!"
ww_congo.48.t:	"Der Clan Abanyiginya aus Ruanda"
ww_congo.48.desc:	"Der Rat hat beschlossen, dass ein weiterer möglicher Herrscher des Kongo Mutara III. Rudahigwa sein könnte, der Umwami des Königreichs Ruanda, eines Königreichs im Osten. Sicherlich könnte er für Stabilität sorgen und die Vereinigung mit dem ruandischen Staat erreichen?" "
ww_congo.48.b:	"Nein, wir brauchen jemand anderen!"
ww_congo.49.t:	 "Der deutsche Kollaborateur"
ww_congo.49.desc:	"Der Rat hat beschlossen, dass, da keine anderen Optionen mehr zur Verfügung stehen, der letzte mögliche Herrscher des Kongo Yuhi V. Musinga sein könnte, der Umwami des Königreichs Ruanda, eines Königreichs im Osten, der nach dem Ersten Weltkrieg von den belgischen Gouverneuren aufgrund seiner Kollaboration und Verehrung für das deutsche Kolonialreich von der Macht verdrängt wurde. Er mag ein riskantes Unterfangen sein , aber zumindest hat er große Ambitionen..."
ww_congo.49.b:	"Das ist nicht so gelaufen, wie wir es geplant hatten..."
ww_congo.50.t:	"[FROM.GetNameDefCap] Strebt den Abschluss eines Bündnisses an"
ww_congo.50.desc:	"\n[FROM.GetNameDefCap] hat sich an uns gewandt und um den Abschluss eines gegenseitigen Bündnisses gebeten. Sie haben mit der Aufrüstung begonnen und äußern den Wunsch, zusammenzuarbeiten, um uns beide stärker zu machen. In der Vergangenheit waren unsere Beziehungen bestenfalls angespannt, aber es gibt keinen besseren Zeitpunkt als jetzt für eine Versöhnung."
ww_congo.50.a:	"Wir würden uns freuen"
ww_congo.50.b:	"Wir brauchen sie nicht. "
ww_congo.52.t:	"[FROM.GetNameDefCap] Lehnt unser Angebot zur Gründung einer Allianz ab"
ww_congo.52.desc:	"\nUnser Angebot zur Gründung einer Allianz wurde von [FROM.GetLeader] kühl zurückgewiesen. Wir haben versucht, unsere Nützlichkeit zu begründen, doch leider hat [FROM.GetNameDef] seine Entscheidung bereits getroffen. Auch wenn dies äußerst ärgerlich ist, werden wir uns davon nicht entmutigen lassen, sondern stattdessen andere Lösungen finden."
ww_congo.52.a:	"Wir werden es ihnen zeigen"
ww_congo.53.desc:	" \n [FROM.GetLeader], Anführer von [FROM.GetNameDef] und des burundischen Volkes, hat sich an uns gewandt und verlangt, dass wir alle mehrheitlich burundischen Gebiete an sie abtreten. Wie sollen wir darauf reagieren? "
ww_congo.53.b:	"Auf keinen Fall!"
ww_congo.54.t:	"[FROM.GetLeader] Burundische Gebiete abtreten"
ww_congo.54.a:	"Ausgezeichnet!"
ww_congo.55.t:	"[FROM.GetLeader] Keine Übergabe burundischer Gebiete"
ww_congo.55.desc:	" \n [FROM.GetLeader], Anführer von [FROM.GetNameDef], hat unsere Forderungen nach der Übergabe aller Gebiete mit einem hohen Anteil an burundischer Bevölkerung zurückgewiesen. Wie sollen wir auf die Unterdrückung unseres Volkes durch ausländische Mächte reagieren?"
ww_congo.55.a:	" Wir können nicht viel tun"
ww_congo.55.b:	"Wir werden es ihnen zeigen!"
ww_congo.56.b:	"Auf keinen Fall!"
ww_congo.57.t:	"[FROM.GetLeader] Übergabe der ruandischen Gebiete"
ww_congo.57.a:	"Ausgezeichnet! "
ww_congo.58.desc:	"\n [FROM.GetLeader], Anführer von [FROM.GetNameDef], hat unsere Forderungen nach der Übergabe aller Gebiete mit einem hohen Anteil an ruandischer Bevölkerung zurückgewiesen. Wie sollen wir auf die Unterdrückung unseres Volkes durch ausländische Mächte reagieren?"
ww_congo.58.b:	"Wir werden es ihnen zeigen!"
ww_congo.59.t:	"[FROM.GetLeader] Anträge auf Ernennung zum Protektorat"
ww_congo.59.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat sich kürzlich an einen unserer Diplomaten gewandt und uns inständig gebeten, unsere Oberhoheit über sein Königreich wiederherzustellen; er ging sogar so weit, seinen Staat "Mittelafrika" zu nennen. Er stand einst unter unserem Schutz, als er als König von Ruanda regierte, wurde jedoch inzwischen von den belgischen Behörden entmachtet. Sollten wir der Bitte des verrückten Königs nachkommen?"
ww_congo.59.a:	"Das ist eine Gelegenheit, die wir uns nicht entgehen lassen dürfen"
ww_congo.60.a:	"Heute ist ein denkwürdiger Tag!"
ww_congo.62.t:	"Raoul van Overstraeten kehrt nach Belgien zurück"
ww_congo.62.desc:	"Der belgische Offizier Raoul van Overstraeten, der bis vor kurzem in unserem Land gedient hat, wurde angesichts des Verlusts seiner Heimat nach [BEL.GetName] zurückgerufen. Er hat uns hier gute Dienste geleistet, und wir hoffen, dass er dazu beitragen kann, die Invasoren zu vertreiben."
ww_congo.62.a:	"Viel Glück!"
ww_congo.63.desc:	" \n [FROM.GetLeader], Anführer von [FROM.GetNameDef], ist mit einem interessanten Angebot an uns herangetreten. Anscheinend sind die Uranvorkommen des Landes reichhaltiger als erwartet, und es gibt nun Überlegungen, einen Teil des Rohstoffs gegen Bezahlung in unser Land zu schmuggeln."
ww_congo.63.a:	 "Das ist ein willkommener Segen"
ww_congo.64.t:	"[FROM.GetLeader] akzeptiert das Uranabkommen"
ww_congo.64.desc:	" \n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat zugestimmt, den von uns vorgeschlagenen Uran-Deal zu unterzeichnen, und uns die geforderten Zahlungen überwiesen."
ww_congo.64.a:	"Ausgezeichnet! "
ww_congo.65.t:	"[FROM.GetLeader] Lehnt den Uran-Deal ab"
ww_congo.66.t:	"[FROM.GetNameDefCap] Kündigt den Uran-Deal"
ww_congo.66.desc:	 "\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat beschlossen, unseren laufenden Uran-Deal zu stornieren, da er für die Nation [FROM.GetAdjective] als zu kostspielig erachtet wurde. "
ww_congo.66.a:	"Nun, das ist schade ..."
ww_congo.67.b:	"Es ist zu gefährlich"
ww_congo.68.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat zugestimmt, dem von uns vorgeschlagenen Uranentwicklungsfonds beizutreten, und ihr Atomprogramm kann nun mit dem neu erworbenen Uran endlich wieder in Gang kommen."
ww_congo.69.t:	"[FROM.GetLeader] lehnt unseren Vorschlag ab"
ww_congo.69.desc:	" \n [FROM.GetLeader], Anführer von [FROM.GetNameDef], hat unsere Einladung zum Uranium Development Trust abgelehnt und erklärt, dass sie alle Nuklearprogramme streng geheim halten müssen, da die Offenlegung von Informationen, die an den Feind gelangen könnten, viel zu gefährlich sei, um einen solchen Vorschlag überhaupt in Betracht zu ziehen. "
ww_congo.69.a:	"Schade..."
ww_congo.70.t:	"Jan Zumbach tritt dem [ENG.GetAdjective] bei"
ww_congo.70.a:	"Guten Flug"
ww_congo.71.desc:	"Unser Spitzenpilot Jan Zumbach, der aus Polen zu uns gekommen ist, hat erklärt, dass er uns verlassen und in den Kongo gehen möchte, um dort beim Aufbau einer Luftwaffe zu helfen. Sollten wir ihm dies gestatten?"
ww_congo.72.t:	"Jan Zumbach trifft ein"
ww_congo.72.desc:	"Der polnische Kampfpilot Jan Zumbach ist soeben in unserem Land eingetroffen und hat erklärt, dass er unserer Luftwaffe beitreten und für uns kämpfen möchte. Sicherlich gibt es eine Aufgabe, die wir ihm übertragen können?"
ww_congo.73.t:	 "[FROM.GetNameDefCap] Bietet Frieden im Austausch für die Unabhängigkeit unserer Kolonie an"
ww_congo.73.a:	"Wir werden unser Territorium nicht aufgeben."
ww_congo.73.b:	"Wir haben keine andere Wahl, als zuzustimmen."
congo_independence_struggle.1.a:	"Wir sollten versuchen, unsere Freiheit auf diplomatischem Wege zu erlangen"
congo_independence_struggle.1.b:	"Wir müssen um jeden Preis die Unabhängigkeit erlangen"
congo_independence_struggle.2.b:	"Nun gut, aber nur, wenn sie uns eine hohe Entschädigung zahlen"
congo_independence_struggle.3.t:	"[FROM.GetNameDefCap] wird uns unsere Freiheit gewähren, wenn wir uns ihrer Fraktion anschließen"
congo_independence_struggle.3.d:	"Wir haben eine Nachricht von [BEL.GetName] erhalten, und sie haben anerkannt, dass die Ära der Kolonialreiche sich rasch dem Ende zuneigt. Sie haben uns daher angeboten, dem [Bel.GetAdjective] Commonwealth als freie und unabhängige Nation beizutreten, und somit als gleichberechtigter Partner beizutreten. Wir wären weiterhin an dieselben Bedingungen gebunden, die jedem anderen militärischen Verbündeten angeboten werden, und müssten daher an allen Kriegen gemeinsam teilnehmen. \n\nDies ist wahrscheinlich das diplomatischste Ergebnis, auf das wir hoffen können, und es würde es uns ermöglichen, Blutvergießen mit unseren europäischen Freunden vollständig zu vermeiden und gleichzeitig den afrikanischen Stolz und die Unabhängigkeit zu wahren."
##### |___KY 049630___|„Wir können diesen Bedingungen nicht zustimmen ...“
congo_independence_struggle.4.d:	"Wir haben eine Nachricht von [BEL.GetName] erhalten, und sie haben unserer Unabhängigkeit buchstäblich einen Preis auferlegt. Sie erinnern uns an die erheblichen Kapitalinvestitionen, die sie in unser Land getätigt haben, darunter den Bau umfangreicher Gleisstrecken, den Ausbau der Bergbaukapazitäten und die allgemeine Erweiterung der Infrastruktur. \n\nDamals wurde dies als Teil ihrer Verantwortung uns gegenüber als Kolonialmacht dargestellt und lediglich als Teil des Prozesses zur Zivilisierung der Nation angesehen. Nun jedoch halten sie uns dies als Druckmittel vor, um durch wirtschaftliche Abhängigkeit unsere anhaltende Loyalität zu sichern. \n\nDer geforderte Preis ist zwar nicht unerreichbar, aber er ist extrem hoch und wird unsere Nation kurzfristig in den Ruin treiben und uns danach für einen viel längeren Zeitraum durch Schulden in ihrer Abhängigkeit halten. Die Frage ist nun: Ist dies den Preis der Unabhängigkeit wert, oder sollte er mit Blut bezahlt werden?"
congo_independence_struggle.4.a:	"Wir werden das Kapital aufbringen, so oder so"
congo_independence_struggle.4.b:	" Wir können diesen Bedingungen nicht zustimmen..."
congo_independence_struggle.5.t:	"[FROM.GetNameDef] ziehen lassen"
congo_independence_struggle.6.t:	"[FROM.GetNameDefCap] wird unsere Bedingungen nicht akzeptieren"
congo_independence_struggle.6.d:	 "Es hat sich herausgestellt, dass [COG.GetNameDef] unser großzügiges Angebot für einen friedlichen und für beide Seiten vorteilhaften Weg zur Unabhängigkeit abgelehnt hat. Daher liegt es nun an uns, zu entscheiden, mit welcher Härte wir an dieser eigensinnigen Kolonie festhalten. Wir haben die folgenden drei Optionen:\n\nErste Option: Wenn wir glauben, dass ihre Entschlossenheit, Unabhängigkeit schwankt, könnten wir ihnen den Status eines Übersee-Departements anbieten und sie damit effektiv von einem Kolonialbesitz in einen entfernten Teil unserer eigentlichen Nation mit sehr begrenzter Autonomie umwandeln. \n\nDie zweite Option besteht darin, sie zu einem offenen Konflikt zu provozieren und ihnen dann auf dem Schlachtfeld unsere Stärke zu demonstrieren. Dies ist eher ein Glücksspiel, doch sollten wir gewinnen, steht uns der Weg zur vollständigen Herrschaft offen, und wir können all ihre Vermögenswerte ohne internationale Verurteilung beschlagnahmen. \n\nDie dritte Option ist die diplomatischste, und wir verfolgen ein Modell ähnlich dem des Britischen Empire, wobei [COG.GetNameDef] sie sich das Recht verdienen, ein Dominion zu werden. Ihre diplomatischen Entscheidungen werden weiterhin von uns getroffen, aber ansonsten wird ihre Autonomie erheblich erweitert. \n\nWir sollten uns jedoch bewusst sein, dass es, sollten sie eine dieser Optionen ablehnen, wahrscheinlich keinen anderen Ausweg als Gewalt gibt."
congo_independence_struggle.6.a:	"Fordern Sie, dass sie ein Übersee-Departement werden"
congo_independence_struggle.6.c:	"Bleiben wir diplomatisch. Vielleicht wären sie bereit, ein Dominion zu werden?"
congo_independence_struggle.7.d:	"Wir haben soeben eine Nachricht vom neuen Botschafter aus [COG.GetNameDef] erhalten, in der angekündigt wird, dass sie das Angebot angenommen haben, sich von unserer Kolonialherrschaft freizukaufen. Nun beginnt die Arbeit, die Verwaltung aus dem Kolonialamt herauszulösen und diese Verantwortung stattdessen ihrer neuen Regierung zu übertragen – und natürlich sicherzustellen, dass die Bankkonten und Holdinggesellschaften eingerichtet werden, um die entsprechenden Zahlungen entgegennehmen zu können."
congo_independence_struggle.8.a:	"Gut. Wir akzeptieren ..."
congo_independence_struggle.8.b:	"Das ist inakzeptabel, wir fordern die vollständige Unabhängigkeit!"
congo_independence_struggle.9.t:	"Die Force Publique greift unsere Truppen in Léopoldville an"
congo_independence_struggle.9.d:	" Der Morgen brach heute unter dem Klang von Schüssen an, als meuternde Elemente der Force Publique Regierungsgebäude in Léopoldville angriffen. Loyale Wachen erwiderten das Feuer und konnten die Rebellen zurückdrängen; die Spannungen sind jedoch extrem hoch, und es gibt Berichte über weitere Meutereien in Einheiten der Force Publique sowie darüber, dass lokale Milizen begonnen haben, sich zu bewaffnen und im gesamten Kongo zu versammeln."
congo_independence_struggle.9.a:	" Im Kongo braut sich eine Krise zusammen"
congo_independence_struggle.22.t:	"Die Bildung eines neuen Übersee-Departements"
congo_independence_struggle.22.d:	"Wir haben Nachricht von einer stark kritisierten Delegation aus [COG.GetNameDef] erhalten, dass sie beschlossen haben, ihren Platz als Übersee-Departement von [BEL.GetName] anzunehmen. Unsere Einbürgerungs- und Steuerbehörden haben damit begonnen, die Unterlagen für die ordnungsgemäße Integration dieser neuen Bürger in unser System auszuarbeiten, und das Kolonialamt hat damit begonnen, ein neues System der Kommunalverwaltung zu entwerfen, das sich enger an den Vorgaben von [BEL.GetAdjective] orientiert."
congo_independence_struggle.22.a:	" Wir haben sie erfolgreich getäuscht!"
congo_independence_struggle.23.t:	"[FROM.GetNameDefCap] möchte, dass wir ein Dominion werden"
congo_independence_struggle.23.d:	" Unser Treffen mit den [BEL.GetName] Diplomaten hat Früchte getragen, und es scheint, dass sie weiterhin einen diplomatischen Weg einschlagen wollen. Sie haben uns als Dominion mehr Autonomie angeboten, ähnlich dem britischen Modell. Wir müssten zwar weiterhin der [BEL.GetAdjective] Diplomatie folgen, hätten jedoch deutlich mehr Rechte zur Selbstverwaltung, während wir weiterhin unter ihrem Schutz stünden."
congo_independence_struggle.23.a:	"Dem können wir zustimmen, ja."
congo_independence_struggle.23.b:	"Das ist inakzeptabel, wir fordern volle Unabhängigkeit!"
congo_independence_struggle.10.d:	"Wir haben soeben eine Antwort von [COG.GetNameDef] bezüglich unseres Angebots erhalten, sie zu einem Dominion zu erheben, und sie haben zugestimmt! \n\nNun, da wir gesehen haben, dass sie verhandlungsbereit sind, könnten wir sie vielleicht noch weiter herunterhandeln, wenn wir etwas mehr Druck ausüben; dies ist jedoch nicht ohne Risiken, und wir könnten sie gänzlich verlieren oder, schlimmer noch, in die Enge treiben. "
congo_independence_struggle.10.a:	"Wir können uns damit zufrieden geben, dass sie ein Dominion werden"
congo_independence_struggle.11.t:	"Gründung des Dominions Kongo"
congo_independence_struggle.11.d:	"Gemäß der Vereinbarung mit [BEL.GetName] haben wir heute Morgen den ersten Spatenstich für den Bau des neuen Regierungsgebäudes vorgenommen, in dem das Parlament des Dominions untergebracht werden soll. Der nächste Schritt wird darin bestehen, mit der Ausarbeitung unserer Verfassung zu beginnen und die ersten Wahlen anzusetzen. Aus diesen bescheidenen Anfängen heraus können wir beginnen, die zukünftige politische Identität dieser Nation zu gestalten."
congo_independence_struggle.12.t:	"[FROM.GetNameDefCap] lehnt die Dominion-Lösung ab"
congo_independence_struggle.12.d:	"In einem überraschenden Schritt hat [BEL.GetName] beschlossen, sein Angebot zur Gründung eines Dominions zurückzuziehen! Wir sind uns nicht ganz sicher, was diesen Sinneswandel verursacht hat; vielleicht tut der Kolonisator, nachdem er einmal zurückgewichen ist, das, was er am besten kann, und nutzt die Situation aus. Wir müssen unsere eigene Reaktion auf diese Kränkung festlegen."
congo_independence_struggle.12.a:	"Das ist inakzeptabel! Drohen Sie ihnen mit Gewaltanwendung."
congo_independence_struggle.12.b:	"Wir sollten nachgeben, ein Überseegebiet ist gar nicht so schlecht"
congo_independence_struggle.13.t:	" Der Kongo gibt nach und willigt ein, ein Überseegebiet zu werden"
congo_independence_struggle.13.d:	"Unser diplomatischer Schachzug gegen [COG.GetName] hat funktioniert! Ihre Delegation ist heute zu uns gekommen, um ihre Stellung als Überseegebiet zu akzeptieren."
congo_independence_struggle.14.b:	"Wir sind im Moment einfach zu überlastet. Geben Sie ihnen die Freiheit, die sie sich so sehr wünschen."
congo_independence_struggle.15.t:	"[FROM.GetNameDefCap] wird nicht kampflos aufgeben"
congo_independence_struggle.15.a:	"Wir werden siegen"
congo_independence_struggle.16.t:	"[FROM.GetNameDefCap] gibt nach und gewährt uns die Unabhängigkeit"
congo_independence_struggle.16.d:	"Es ist uns gelungen, vom Rande eines Krieges mit unserem Kolonialherrn zurückzukommen. Oder besser gesagt, unserem ehemaligen Kolonialherrn. \n\nDie Delegation, die wir zu Gesprächen mit der Verwaltung entsandt hatten, traf sich heute Morgen mit dem Kolonialgouverneur, und beide Parteien unterzeichneten die Dokumente, mit denen die Unabhängigkeit von [COG.GetNameDef] offiziell erklärt wurde. Wir sind nun eine eigene freie Nation, und die Machtübergabe hat bereits begonnen. \n\nVon nun an haben wir unser Schicksal fest in der Hand, und das alles ohne jeglichen Preis an Blut, Stolz oder Geld."
congo_independence_struggle.16.a:	"Heute ist ein Tag zum Feiern!"
congo_independence_struggle.17.t:	"[FROM.GetNameDefCap] strebt Unabhängigkeit um jeden Preis an"
congo_independence_struggle.17.d:	"Heute Morgen erhielten wir per Funk einen hastig zusammengestellten Bericht des Kolonialgouverneurs von [COG.GetNameDef]. Er behauptete, ein Mob sei in seine Amtsresidenz eingedrungen, habe die Wachen mit im Ausland hergestellten Waffen überwältigt und ihm eine Unabhängigkeitserklärung überreicht. Anschließend seien sie umgehend wieder abgezogen. Am beunruhigendsten war der Hinweis, dass dieser Mob von Angehörigen der Force Publique angeführt worden sei, jener Gendarmerie, die für die Aufrechterhaltung der Ordnung zuständig ist. \n\n\ Die Erklärung forderte den sofortigen Rückzug der Kolonialverwaltung und die anschließende Übergabe der rechtmäßigen Macht an eine Zivilregierung, die aus der Führung dieser Rebellion gebildet werden sollte. Wir dürfen uns keinen Illusionen hingeben, dass die Gefahr real ist, und die Tatsache, dass dieser Mob mit Waffen ausgerüstet war, die nicht von [BEL.GetAdjective] stammen, könnte darauf hindeuten, dass ausländische Akteure ein direktes Interesse daran haben und die Rebellen militärisch unterstützen könnten."
congo_independence_struggle.17.a:	"Wir haben keine andere Wahl, als dies zu akzeptieren"
congo_independence_struggle.18.d:	"Es scheint, dass unser Ultimatum von unserem Oberherrn mit der gebotenen Ernsthaftigkeit behandelt wurde, denn heute erhielten wir die unterzeichnete Unabhängigkeitsurkunde von der Kolonialverwaltung. Bereits laufen die Planungen für das offizielle Einholen der [BEL.GetAdjective]-Flagge und damit für die friedliche Machtübergabe an unser neues Regime. Obwohl unser vorrangiges Ziel erreicht wurde, beginnt nun die eigentliche Arbeit der Bildung einer Regierung. Wir haben viel zu tun: eine Wirtschaft aufzubauen, die Beziehungen zu anderen Nationen zu normalisieren und natürlich bestimmte Schulden bei denen zu begleichen, die uns bei der Verwirklichung dieses Traums unterstützt haben."
congo_independence_struggle.18.a:	"Heute ist ein Tag zum Feiern!"
congo_independence_struggle.19.t:	" [FROM.GetNameDefCap] Bereitet sich auf den Krieg vor"
congo_independence_struggle.19.d:	"Uns liegen Berichte vor, dass [BEL.GetAdjective] Truppen in Léopoldville mit der Mobilisierung begonnen haben und dass in der gesamten Force Publique hart gegen illoyale Elemente vorgegangen wird. Trotz unserer größten Bemühungen, die [BEL.GetAdjective] Regierung einzuschüchtern und unser Ziel der Unabhängigkeit ohne Blutvergießen zu erreichen, haben sich die Kolonialmächte dafür entschieden, die Macht auf die einzige Art und Weise zu behalten, die sie kennen – durch Gewalt. Unser Zeitfenster schließt sich  schnell, und wir müssen entscheiden, ob wir unseren Anhängern das Signal zum Aufstand geben oder uns zurückziehen, bevor die Lage außer Kontrolle gerät."
congo_independence_struggle.19.b:	"Das ist zu gefährlich. Wir müssen zurückweichen."
congo_independence_struggle.20.d:	" Wir ergriffen alle uns zur Verfügung stehenden Maßnahmen, um die Kontrolle über die sich rapide verschlechternde Lage zu behalten, einschließlich der systematischen Entfernung verräterischer Elemente innerhalb der Force Publique. Leider wurde diese offenere Vorgehensweise als aggressiv empfunden, und die meuternden Einheiten eröffneten das Feuer auf ihre Offiziere, sobald sie diese näherkommen sahen. Mit diesen Schüssen hat der Unabhängigkeitskrieg ernsthaft begonnen und gerät mittlerweile völlig außer Kontrolle für beide Seiten. \n|___NL0 06632___|Es gibt Gebiete, die uns treu geblieben sind, da sie die Vorteile der Kolonialisierung am unmittelbarsten gespürt haben; jedoch hat sich der Großteil des Landes nun gegen uns gestellt."
congo_independence_struggle.20.a:	"Zu den Waffen, Brüder!"
congo_independence_struggle.21.t:	 "Der Kongo lenkt ein und willigt ein, ein Überseegebiet zu werden"
congo_independence_struggle.21.d:	"Unsere schnelle Reaktion auf die aktuelle Lage im Kongo hat die Spannungen dort offenbar beruhigt. [BEL.GetAdjective] Offiziere handelten rasch, um bekannte meuternde Elemente der Force Publique zu befrieden. Nachdem ihre anhaltende Loyalität gesichert war, erlosch der Aufstand schnell, und die lautesten Stimmen wurden verstummten – in den meisten Fällen durch die dicken Mauern des Gefängnisses. \n\nDie Kolonialverwaltung hat die Initiative ergriffen und die sich ihr bietende Gelegenheit genutzt, um ihre Kontrolle auf alle Regierungsebenen auszuweiten, wodurch wir nun ein weitaus höheres Maß an Kontrolle über die Kolonie genießen als zuvor."
congo_independence_struggle.21.a:	"Gl Ehre dem [BEL.GetAdjective] Imperium!"
congo_independence_struggle.24.d:	"Der Klang von Schüssen durchbrach die Stille des Morgens. [BEL.GetAdjective] Polizeieinheiten wurden entsandt, um patriotische Elemente der Force Publique gefangen zu nehmen, doch stattdessen wurden sie von einem Kugelhagel empfangen. Die Meuterei breitet sich rasch aus, und Milizen haben im ganzen Land begonnen, zu den Waffen zu greifen. Die Unterstützung für die Sache ist im ganzen Land weit verbreitet, doch die Kolonialstreitkräfte behalten die Kontrolle über mehrere Gebiete, insbesondere über jene, die sie am intensivsten ausgebeutet hatten und in denen sie daher die größte militärische Präsenz unterhielten. \n\nDieser Unabhängigkeitskrieg hat nun ernsthaft begonnen, und wir werden nicht ruhen, bis der Kongo von der europäischen Besatzung befreit ist."
congo_independence_struggle.24.a:	"Dies ist ein Krieg, den wir uns nicht leisten können zu verlieren!"
congolese_civil_war_starting_tt:	"Der Kongo wird uns den Unabhängigkeitskrieg erklären. Sie werden in der Lage sein, Frieden zu erzwingen und ihre volle Unabhängigkeit zu erlangen, wenn sie die Kontrolle über §YLéopoldville§!, §YÉlisabethville§! und §YStanleyville§! kontrollieren. \n\nEbenso werden wir in der Lage sein, Frieden mit ihnen zu erzwingen und unsere Kontrolle über das Gebiet aufrechterhalten, indem wir §YLéopoldville§!, §YÉlisabethville§! und §YStanleyville§! kontrollieren."
wuw_GER_releasable.1.a:	"Berlin ist die naheliegende Wahl!"
wuw_GER_releasable.1.b:	"Es sollte München sein"
wuw_GER_releasable.1.c:	"Frankfurt wird eine gute Hauptstadt im Westen sein"
wuw_GER_releasable.2.desc:	"Da die Wahl zugunsten der Rietspartei ausgegangen ist, ist es an der Zeit, die Person auszuwählen, die am besten geeignet ist, die Nation zu regieren. Die Partei möchte, dass Pierre Dupong vorerst die Führung übernimmt, um Joseph Bech Zeit für andere wichtige Angelegenheiten zu geben. Da sich jedoch dunkle Wolken über Europa zusammenbrauen, wäre es vielleicht klug, einen drastischen Wandel in unserer politischen Landschaft herbeizuführen, damit wir nicht den benachbarten Mächten unterliegen ..."
wuw_GER_releasable.2.b:	"Joseph Bech wird noch gebraucht"
wuw_GER_releasable.2.c:	"In diesen gefährlichen Zeiten muss das Königshaus handeln!"
wuw_GER_releasable.2.d:	"Das Volk sollte gegen eine so offensichtlich manipulierte Wahl protestieren!"
wuw_GER_civil_war.1.t:	"Im Exil lebende Kommunisten kehren nach Hause zurück"
wuw_GER_civil_war.1.a:	"Willkommen zurück, Genossen! "
wuw_GER_civil_war.1.b:	"Jemand muss ein Auge auf sie haben"
wuw_GER_civil_war.2.t:	"Ernst Thälmann aus dem Gefängnis befreit"
wuw_GER_civil_war.2.desc:	"Es liegt ein Bericht vor, wonach eine Gruppe kommunistischer Partisanen in das Gefängnis von Bautzen in Sachsen eingedrungen ist und den überzeugten Kommunisten und ehemaligen Vorsitzenden der KPD, Ernst Thälmann, befreit hat. Sein Parteirivale Walter Ulbricht hat den Angriff auf das Gefängnis als antirevolutionären Terrorakt verurteilt – eine Äußerung, die wahrscheinlich auf seiner Befürchtung beruht, der allseits beliebte Thälmann könnte die Parteiführung zurückerobern."
wuw_GER_civil_war.2.a:	"Eine interessante Entwicklung"
GER_thalmann_freed_from_prison_tt:	"§YErnst Thälmann§! wird von kommunistischen Partisanen aus dem Gefängnis befreit"
wuw_GER_civil_war.3.t:	"Die Reform der paramilitärischen Flügel"
wuw_GER_civil_war.3.desc:	"Unsere Politiker und Generäle haben in letzter Zeit über die Idee diskutiert, paramilitärische Flügel in die Reihen unserer Soldaten einzuführen. Die konservativen Parteien wünschen sich die Wiedereinführung der Bismarck-Jugend, der mit der DNVP verbundenen antimarxistischen Jugendbewegung. Andere hingegen sehen in der bereits kämpfenden sozialdemokratischen Eisernen Front eine vorrangige Organisation, die gestärkt werden muss, wenn wir mehr Paramilitärs innerhalb unserer Streitkräfte einsetzen wollen."
wuw_GER_civil_war.4.t:	"Die Zukunft der paramilitärischen Flügel"
wuw_GER_civil_war.4.b:	"Vielleicht könnten wir sie vorerst einfach demobilisieren?"
wuw_GER_civil_war.5.desc:	"Uns liegen Berichte vor, wonach schlesische und polnische Partisanen in Schlesien das Feuer auf deutsche Soldaten eröffnet haben. Sie streben nach Unabhängigkeit für ihre Nation und sahen in unserem Bürgerkrieg das Zeichen der Schwäche, das sie brauchten, um den Mut zur Abspaltung aufzubringen. Wir müssen sicherstellen, dass ihre Ziele nicht erreicht werden und dass ihr Aufstand so schnell wie möglich niedergeschlagen wird."
wuw_GER_civil_war.5.a:	"Man darf ihnen keinen Erfolg gewähren!"
wuw_GER_civil_war.6.t:	"Kommunistischer Bürgerkrieg in [ROOT.GetNameDef]"
wuw_GER_civil_war.6.a:	"Für das Proletariat!"
GER_shalva_maglakelidze_and_giorgi_kvinitadze_join:	"§YGiorgi Kvinitadze§! und §YShalva Maglakelidze§! werden sich uns als §YFeldmarschall§! und ein §YGeneral§!\n"
GER_georgian_legion_recruitment_tt:	"Erhalten Sie zwei georgische §YInfanterie§! Einheiten"
GER_cossack_exiles_divisions_recruitment_tt:	"Erhalten Sie zwei Kosaken- §YKavallerie§! Einheiten "
GER_promised_erich_raeder_a_great_navy_tt:	"Erich Raeder und ein großer Teil der Kriegsmarine werden sich unserer Seite anschließen, wenn der Staatsstreich stattfindet. Sollten wir jedoch daran scheitern, entweder §Y$GER_rebuild_the_high_seas_fleet_ww$§!, oder §Y$GER_high_seas_fleet$§! und §Y$GER_re_establish_the_seekriegsleitung$§! innerhalb von zwei Jahren nicht erfüllen, könnte er §Rgegen unser Reg §!"
wuw_GER_civil_war.8.a:	"Sie werden für ihren Verrat bezahlen!"
wuw_GER_civil_war.9.t:	"August von Mackensen tritt aus dem Militärdienst zurück"
wuw_GER_civil_war.9.desc:	"Nachdem der Sieg über die Nazi-Bedrohung gesichert ist, hat der Chef der Militärregierung, August von Mackensen, aufgrund seines Alters und seines sich verschlechternden Gesundheitszustands erneut beschlossen, sich vom Feldkommando zurückzuziehen, und erklärt, dass er von nun an lediglich bei administrativen Aufgaben helfen werde."
wuw_GER_civil_war.9.a:	"Er hat uns gute Dienste geleistet"
wuw_GER_legions.1.t:	"Die Bildung einer georgischen Fremdenlegion"
wuw_GER_legions.1.a:	"Sie sind herzlich willkommen, sich uns anzuschließen"
wuw_GER_legions.2.t:	"Hans Krebs aus [SOV.GetNameDef]"
wuw_GER_legions.2.desc:	"Angesichts der jüngsten Kriegserklärung zwischen uns und den [SOV.GetAdjective] wurde unser Militärattaché unter der Leitung von Generalmajor Hans Krebs einige Wochen früher als geplant zurückgerufen und ist kürzlich in Berlin eingetroffen. Er ist nun bereit, an der Ostfront zu dienen, und erklärt, dass er über die Erfahrung und das Wissen der [SOV.GetAdjective] Streitkräfte verfügt, die wir für eine erfolgreiche Invasion ihres Territoriums benötigen."
wuw_GER_legions.2.a:	"Wir könnten seine militärischen Kenntnisse gut gebrauchen"
wuw_GER_legions.3.t:	"Die Gelegenheit zur Zusammenarbeit in Lokot"
wuw_GER_legions.3.desc:	"Nach der Besetzung der Oblasten Brjansk, Kursk und Orel hat unsere Armee einen Plan ausgeheckt, lokale Kollaborateure mit Sitz in Lokot einzusetzen, um die Region leichter zu regieren und sie gleichzeitig dazu zu bringen, mehr Einheiten für den Kampf gegen die Anti-[SOV.GetAdjective]-Bewegung aufzustellen. Dies würde jedoch unserer Heeresgruppe ihre Kriegsbeute in der Region vorenthalten. Sollen wir die Einrichtung dieser Autonomie von Lokot genehmigen?"
wuw_GER_legions.3.b:	"Wir haben keinen Bedarf an lokalen Kollaborateuren"
wuw_GER_legions.4.desc:	"Uns ist zu Ohren gekommen, dass die [GER.GetAdjective]-Armee die Lokot-Autonomie in der Grenzregion zwischen den Oblasten Brjansk, Kursk und Orel errichtet hat, nachdem sie von eifrigen Kollaborateuren wie Konstantin Voskoboinik und Bronislav Kaminski angesprochen wurde. Es scheint, als seien sie damit beauftragt worden, die Region zu verwalten und gegen Partisanen und den Widerstand vorzugehen. Wir müssen dem Feind zurückschlagen und diesen Scheinstaat so schnell wie möglich zerstören!"
wuw_GER_legions.4.a:	"Sie haben die falsche Wahl getroffen"
lokot_autonomy_has_been_established_flag:	"Die §YLokot-Autonomie§! wurde gegründet"
wuw_GER_legions.5.t:	"Die Auflösung der Lokot-Autonomie"
wuw_GER_legions.5.desc:	" Nach der Rückeroberung der Oblasten Brjansk, Kursk und Orel hat unsere Armee die meisten Kollaborateure in Lokot gefangen genommen und unsere lokalen Regierungen in der Region wieder eingesetzt. Die [GER.GetAdjective] Armee hat sich aus der Region zurückgezogen, und unsere Kommandeure versichern uns, dass der Tag des Sieges immer näher rückt."
wuw_GER_legions.5.a:	"Wir werden siegen!"
wuw_GER_legions.6.a:	"Der Krieg hat eine Wende genommen"
GER_lokot_collaborators_have_been_captured_by_the_soviets_tt:	" §Y[GER.SOV_bronislav_kaminski.GetName]§! und §Y[GER.SOV_konstantin_voskoboinik.GetName]§! wurden von [SOV.GetAdjective]-Truppen gefangen genommen"
##### |___KY0 49730___|„Ein Angebot russischer Exilanten in Serbien“
wuw_GER_legions.7.desc:	" Nach der Bildung der serbischen Regierung der Nationalen Rettung in unseren kürzlich besetzten Gebieten haben einige weißrussische Emigranten angeboten, bei der Aufstellung eines russischen Schutzkorps mitzuwirken, das uns beim Schutz von Fabriken und Regierungsgebäuden im besetzten Serbien sowie bei der Bekämpfung von Tschetniks und anderen Widerstandskämpfern in der Region unterstützen würde. Sollten wir ihre Hilfe in Anspruch nehmen?"
wuw_GER_legions.8.t:	"Ein Angebot von unzufriedenen Kosaken"
wuw_GER_legions.8.desc:	 "Da unsere Absicht, die morschen Türen von [SOV.GetNameDef] einzutreten, immer deutlicher wird, haben sich viele derjenigen, die im russischen Bürgerkrieg unterlegen waren, an uns gewandt, in der Hoffnung, eine Chance zu erhalten, der derzeitigen [SOV,GetAdjective]-Regierung ein Ende zu setzen. Unter ihnen befinden sich Don- und Kuban-Kosaken [SOV.SOV_pyotr_krasnov.GetName] und |___NS0 04383___|, die für uns kämpfen wollen. Sollten wir ihre Hilfe annehmen?"
wuw_GER_legions.8.b:	" "Und warum sollten wir die Hilfe einiger Kosaken benötigen?"
wuw_GER_monroe.1.desc:	"Wir haben alarmierende Berichte erhalten, dass [FROM.GetNameDef] zunehmend Interesse daran zeigt, die Monroe-Doktrin zu destabilisieren. Die Doktrin wurde eingeführt, um zu verhindern, dass fremde Nationen auf dem amerikanischen Kontinent, den wir als unseren Einflussbereich betrachten, Unruhe stiften. Nach früheren Begegnungen mit |___NS004 385___| können wir nur vermuten, dass ihre Absichten nicht gut sind."
wuw_GER_monroe.1.a_tt:	 "Schaltet Entscheidungen frei, um §Ydie Monroe-Doktrin zu stärken§!.\n\n[GER.GetNameDefCap] hat Entscheidungen freigeschaltet, um zu versuchen, §Rdie Monroe-Doktrin zu destabilisieren§!."
wuw_GER_monroe.1.b_tt:	" |___CC009631___|."
wuw_GER_monroe.2.t:	"Die Monroe-Doktrin bröckelt"
wuw_GER_monroe.2.a:	"Wir werden alle schützen, die sich uns nicht widersetzt haben!"
wuw_GER_monroe.2.b_tt:	"Die §YMonroe-Doktrin§! wird aus allen Ländern abgeschafft, in denen sie noch gilt. Garantiert allen Ländern, die die Doktrin lautstark unterstützt haben, zu einem Preis von £GFX_pol_power §Y25 politische Macht§! §Rpro Land garantiert§!!\n\nDerzeit gibt es §Y[?global.monroe_countries_in_support^num]§! Länder, die sie unterstützen.\n\nDie aktuellen Kosten der Garantien betragen £GFX_pol_power §Y[?USA.monroe_countries_strict_in_support_guarantee_cost] Politische Macht§!"
wuw_GER_monroe.2.c:	"Wenn sie Garantien wollten, hätten sie dies verhindern sollen. "
wuw_GER_monroe.3.t:	"[FROM.GetNameDefCap] Stärkt die Monroe-Doktrin"
wuw_GER_monroe.3.a:	"Verdammt!"
wuw_GER_monroe.4.a_tt:	 "Wir werden unsere §RAblehnung§! der Monroe-Doktrin lautstark zum Ausdruck bringen. Sollte sich die Doktrin durchsetzen, werden wir §Rohne Garantien§! stehen.§Y|___NS 004392___|[USA.GetNameDefCap]§! uns nicht weiter beeinflussen können."
wuw_GER_monroe.4.b:	"Wir werden nicht auf ihre Lügen hören!"
monroe_country_in_opposition_flag:	"Dieses Land hat bereits Stellung gegen die Monroe-Doktrin bezogen."
wuw_GER_monroe.5.t:	"[FROM.GetNameDefCap] Einmischung in [ROOT.GetAdjective] die Politik"
wuw_GER_monroe.5.desc:	"Uns ist zu Ohren gekommen, dass [FROM.GetAdjective]-Agenten in unserem Land aktiv versuchen, unsere Politik zu beeinflussen. Dieser Einfluss ist nicht aufdringlich, sondern beschränkt sich darauf, bereits bestehende Gruppen zu mobilisieren und ihre Position im politischen Klima zu stärken."
wuw_GER_monroe.5.b:	"Sie haben kein Recht, sich in unsere Politik einzumischen!"
wuw_GER_monroe.6.desc:	"Eine Mitteilung von [FROM.GetNameDef] ist soeben bei uns eingegangen. Sie haben beobachtet, wie [GER.GetAdjective]-Agenten Maßnahmen ergriffen haben, um die Region zu destabilisieren, in dem Bestreben, die Monroe-Doktrin zu untergraben und letztendlich aufzuheben, und möchten nun unsere Loyalität gegenüber der Doktrin sicherstellen."
wuw_GER_monroe.6.a_tt:	 "Wir werden unsere §GUnterstützung§! für die Monroe-Doktrin lautstark zum Ausdruck bringen. Sollte die Doktrin zusammenbrechen, haben wir die Chance, weiterhin §GGarantien§! von [FROM.GetNameDef].§Y[GER.GetFlag][GER.GetNameDefCap]§! uns nicht weiter beeinflussen können."
wuw_GER_monroe.6.b:	"Wir werden uns nicht abschotten."
monroe_country_in_support_flag:	" Dieses Land hat bereits Stellung bezogen und sich für die Monroe-Doktrin ausgesprochen."
wuw_GER_monroe.7.b:	"Wir lassen uns nicht einschüchtern!"
wuw_GER_monroe.8.b:	"Wir haben gar nicht erst um die Monroe-Doktrin gebeten!"
wuw_GER_monroe.10.t:	"[FROM.GetNameDefCap] hebt die Monroe-Doktrin teilweise auf"
wuw_GER_monroe.10.desc:	"Unsere Bemühungen haben sich endlich ausgezahlt. Der Anführer von [FROM.GetNameDef], [FROM.GetLeader], hat soeben die Aufhebung der Monroe-Doktrin angekündigt, allerdings nur teilweise. [FROM.GetLeader.GetSheHe] erklärt weiter, dass sie beabsichtigen, die Unabhängigkeit all jener zu garantieren, die sich nicht in Opposition erhoben haben, da sie glauben, dass dies die richtige Entscheidung ist. Dies könnte unseren Fortschritt in der Region behindern, aber sicherlich können wir auch dies überwinden."
wuw_GER_monroe.11.t:	"[FROM.GetNameDefCap] hebt die Monroe-Doktrin teilweise auf"
wuw_GER_monroe.11.desc:	" Unsere Bemühungen haben sich endlich ausgezahlt. Der Anführer von [FROM.GetNameDef], [FROM.GetLeader], hat soeben die Aufhebung der Monroe-Doktrin angekündigt, wenn auch nur teilweise. [FROM.GetLeader.GetSheHe] führt weiter aus, dass sie beabsichtigen, die Unabhängigkeit derjenigen zu garantieren, die die Monroe-Doktrin weiterhin unterstützen. Obwohl es nun weniger sind, behaupten sie, dass sie so stark wie eh und je sind. Dies könnte unseren Fortschritt in der Region zwar behindern, stellt jedoch keine nennenswerte Hürde für uns dar. Sicherlich werden wir auch dies überwinden."
wuw_GER_monroe.12.t:	"Krieg zwischen [USA.GetNameDef] und [GER.GetNameDef] beendet Streit um die Monroe-Doktrin"
wuw_GER_monroe.13.t:	"Ausländische Mächte versuchen, die Region zu destabilisieren"
wuw_GER_monroe_news.1.t:	"Der Untergang der Monroe-Doktrin"
wuw_GER_monroe_news.1.b:	"Wie schrecklich"
wuw_GER_monroe_news.1.c:	"Ein großartiger Tag!"
wuw_GER_monroe_news.1.d:	" Ein schrecklicher Tag!"
GER_crushed_the_monroe_doctrine_good:	"Die Monroe-Doktrin zerschlagen"
germany_mefo_bills.1.t:	"Die Zukunft des deutschen Wiederaufrüstungsprogramms"
germany_mefo_bills.1.a:	"Wiederaufrüstung war schon immer unser Ziel"
germany_mefo_bills.2.desc:	"Unser Wiederaufrüstungsprogramm ist zwar notwendig und von edlen Absichten getragen, sorgt jedoch bei einigen unserer Ökonomen zunehmend für Besorgnis. Sie befürchten, dass die Rüstungsproduktion immer mehr Mittel benötigen wird, um sich selbst zu tragen. Wir müssen dies genau im Auge behalten, damit die Militärausgaben nicht außer Kontrolle geraten."
germany_mefo_bills.3.t:	" Wachsende Besorgnis über die Wiederaufrüstung"
germany_mefo_bills.3.desc:	"Während unsere Bemühungen um die Wiederaufrüstung immer stärker werden, wächst auch die Belastung, die Programme zu finanzieren. Die Rüstungsproduktion beansprucht mittlerweile einen beträchtlichen Teil der Staatsfinanzen, was immer mehr Menschen hinsichtlich der Stabilität unserer Wirtschaft beunruhigt. Wenn es uns nicht gelingt, die Militärausgaben niedrig zu halten, wird dies unsere Wirtschaft erheblich beeinträchtigen."
germany_mefo_bills.3.a:	"Wir müssen alternative Finanzierungsquellen finden"
germany_mefo_bills.4.t:	"Militärproduktion verursacht Wirtschaftskrise"
wuw_GER_military_events.2.t:	"Pilot verschont [USA.GetAdjective] Bomberbesatzung"
wuw_GER_military_events.2.desc:	 "Nach intensiven Bombenangriffen auf unsere Rüstungsindustrie ist eine unwahrscheinliche Geschichte ans Licht gekommen. Trotz klarer Befehle, jedes feindliche Flugzeug, das unseren Luftraum verletzt, abzuschießen, hat sich ein Kampfpilot geweigert, dies zu tun. Der Pilot, ein gewisser Franz Stigler, stieß kurz nach einem Bombenangriff auf einen beschädigten Bomber und entschied sich, nicht auf ihn zu schießen. Er rechtfertigt sein Handeln damit, dass der beschädigte Bomber sich nicht von Männern mit Fallschirmen unterscheide und dass das Schießen auf sie ebenso verabscheuungswürdig wäre. Nachdem er zunächst versucht hatte, mit der Bomberbesatzung zu kommunizieren, um sie dazu zu bewegen, in [GER.GetNameDef] zu landen und sich zu ergeben oder zumindest in neutrales Gebiet zu fliegen, gab Stigler diese anständigen Bemühungen auf und eskortierte stattdessen den feindlichen Bomber in Sicherheit.\n\nFranz Stigler ist ein talentierter Pilot, doch wenn man ihn so weitermachen lässt, könnten er und seine trotzigen Handlungen uns Probleme bereiten."
wuw_GER_military_events.2.b:	"Machen Sie ein Exempel an ihm!"
wuw_GER_military_events.2.c:	"Kein Wort darüber."
wuw_GER_diplomacy.2.t:	"[FROM.GetNameDefCap] hat unser Handelsangebot angenommen"
wuw_GER_diplomacy.3.t:	"[FROM.GetNameDefCap] hat unser Handelsangebot abgelehnt"
wuw_GER_diplomacy.3.a:	"Ihr Pech."
wuw_GER_diplomacy.10.a:	"Wir wagen es nicht, Nein zu sagen ..."
wuw_GER_diplomacy.11.desc:	"In unmissverständlichen Worten hat [FROM.GetLeader] von [FROM.GetName] uns mitgeteilt, was [FROM.GetLeader.GetSheHe] von unserem jüngsten Versuch hält, ihre Innenpolitik zu beeinflussen. Selbstverständlich mussten unsere Diplomaten Teile der Botschaft umformulieren, bevor sie diese |___NS00 4419___| vorlegen."
wuw_GER_diplomacy.11.a:	"Diese Unverschämtheit!"
wuw_GER_diplomacy.20.a:	"Gemeinsam zum Sieg!"
wuw_GER_diplomacy.20.b:	"Wir haben andere Pläne"
wuw_GER_diplomacy.21.desc:	" Unser Oberkommando hat es gemeinsam mit erfahrenen Diplomaten geschafft, [FROM.GetLeader] und die Regierung von [FROM.GetAdjective] davon zu überzeugen, sich mit uns zu verbünden, um unsere gemeinsamen Feinde zu vernichten. Wir brauchen ihre Hilfe natürlich nicht wirklich, um unsere Feinde zu vernichten, aber ihre Soldaten eignen sich hervorragend als Kanonenfutter, während unsere Männer jeglichen Widerstand niederschlagen."
wuw_GER_diplomacy.22.a:	"Mal sehen, wie lange sie alleine durchhalten"
wuw_GER_diplomacy.23.t:	" [FROM.GetNameDefCap] Forderung nach Kontrolle über ehemalige Kolonien"
wuw_GER_diplomacy.23.desc:	"Der [FROM.GetAdjective] Anführer [FROM.GetLeader] hat sich mit einem Vorschlag für ein Abkommen an uns gewandt, das zumindest laut [FROM.GetLeader.GetHerHis] für beide Seiten von Vorteil ist. [FROM.GetLeader.GetHerHis] möchte seine ehemaligen Kolonien zurückerhalten, bietet im Gegenzug jedoch Einblick in die Produktion von Panzern sowie ein Friedensversprechen zwischen unseren Ländern an."
wuw_GER_diplomacy.23.a:	"Die [FROM.GetADjective]s legen überzeugende Argumente vor"
wuw_GER_diplomacy.24.desc:	"Wir haben eine höchst willkommene Nachricht von [FROM.GetNameDef] erhalten. Sie haben den Nutzen des von uns vorgeschlagenen Abkommens erkannt und alle unsere alten Kolonien, die zuvor unter ihrer Kontrolle standen, in unser Eigentum überführt. "
wuw_GER_diplomacy.25.a:	"Eine schlechte Entscheidung ihrerseits..."
wuw_GER_diplomacy.26.t:	"Ein Vorschlag für gemeinsame Forschung"
wuw_GER_diplomacy.26.b:	"Das ist für uns nicht von Interesse"
wuw_GER_diplomacy.27.t:	"[FROM.GetNameDefCap] stimmt der Einrichtung gemeinsamer Forschungsbemühungen zu"
wuw_GER_diplomacy.27.desc:	"Die Führung von [FROM.GetAdjective] hat äußerst positiv auf unsere vorgeschlagenen gemeinsamen Forschungsbemühungen reagiert. Da sich unsere maritimen Bemühungen stark unterscheiden, erkennen auch sie den Wert des gegenseitigen Lernens, damit wir gemeinsam immer stärker werden können."
wuw_GER_diplomacy.27.a:	"Großartig!"
wuw_GER_diplomacy.28.desc:	"Die Antwort von [FROM.GetNameDef] entsprach nicht unseren Erwartungen. Sie scheinen nicht bereit zu sein, ihre Erkenntnisse im Bereich der Schiffsbautechnik zu teilen, obwohl wir ihnen ein äußerst vorteilhaftes Angebot unterbreiten und ihnen anbieten, unsere eigenen Erkenntnisse mit ihnen zu teilen. Zusammen mit der Ablehnung kommt die Erklärung, dass die [FROM.GetAdjective]-Marine unserer eigenen weit überlegen ist und dass, solange wir keine bedeutenden Fortschritte in der Schifffahrtstechnik erzielt haben, jegliche Art von Abkommen wie dieses vom Tisch ist."
wuw_GER_diplomacy.29.a:	"Unerwartet, aber willkommen!"
wuw_GER_diplomacy.30.t:	"[FROM.GetAdjective] Annahme des Handelsvorschlags"
wuw_GER_diplomacy.31.a:	"Ihr Pech"
wuw_GER_diplomacy.32.b:	"Wir werden unsere ursprüngliche Vereinbarung einhalten"
wuw_GER_diplomacy.33.t:	"[FROM.GetNameDefCap] Weigert sich, zu unserer Vereinbarung zurückzukehren"
wuw_GER_diplomacy.33.a:	"Wie unhöflich von ihnen!"
wuw_GER_diplomacy.34.desc:	"Die [FROM.GetAdjective] haben sich als die treuesten Partner erwiesen. Wir hatten ursprünglich bereits 1898 den 99-jährigen Pachtvertrag für [743.GetName] unterzeichnet, doch der Vertrag wurde unterbrochen, als der Erste Weltkrieg über die . Nach einer Zeit der Besetzung durch [JAP.GetNameDef] wurde das Gebiet an [FROM.GetNameDef] zurückgegeben, doch glücklicherweise werden sie unsere Vereinbarung einhalten."
wuw_GER_diplomacy.35.desc:	"Wir haben eine Nachricht vom Anführer von [FROM.GetAdjective], [FROM.GetLeder], erhalten, [FROM.GetLeader.GetSheHe] die Kontrolle über ihre ehemaligen Kolonien zurückerlangen möchte, die sich derzeit in unserer Hand befinden. Die Mitteilung scheint harmlos genug, doch angesichts der aktuellen politischen Lage in [FROM.GetNameDef] könnte eine Ablehnung schwerwiegende Folgen haben."
wuw_GER_diplomacy.35.a:	"Diese Gebiete gehören ihnen nicht!"
wuw_GER_diplomacy.35.b:	"Es lohnt sich nicht, das Risiko einer Ablehnung einzugehen!"
wuw_GER_diplomacy.37.t:	"[FROM.GetNameDefCap] tritt uns Gebiete ab"
wuw_GER_diplomacy.37.desc:	"Unsere Forderung, unsere Kolonien von [FROM.GetNameDef] zurückzubekommen, stieß bei [FROM.GetLeader] auf Verständnis und Zustimmung. Mit der Erklärung, dass ihnen unsere Beziehungen wichtiger sind als Territorium, haben sie uns das Land, das rechtmäßig uns gehört, großzügig wieder zurückübertragen."
wuw_GER_diplomacy.38.t:	"[FROM.GetAdjective] Fordert Territorium"
wuw_GER_diplomacy.38.desc:	"[GetGERAfricanColonyOverlordDesc]"
GER_is_not_colonial_overlord_desc:	"Wir haben Forderungen erhalten, unser Territorium an [FROM.GetNameDef] zu übergeben. Aus historischen Gründen behaupten sie, die rechtmäßigen Eigentümer dieser Ländereien zu sein. Die Forderung ist recht scharf formuliert, aber es bleibt uns noch Spielraum, entsprechend unserer eigenen Agenda zu reagieren."
GER_is_not_colonial_overlord_option:	"Sicher ist sicher ..."
wuw_GER_diplomacy.38.b:	"Auf keinen Fall!"
wuw_GER_diplomacy.39.t:	"[FROM.GetNameDefCap] tritt uns das Gebiet ab"
wuw_GER_diplomacy.39.desc:	 "Unsere Forderungen an die [FROM.GetAdjective] Führung wurden mit widerwilliger Zustimmung aufgenommen. Auch wenn sie nicht gerade begeistert davon zu sein scheinen, ihr Territorium abzutreten, geht uns ihre Meinung dazu nichts an – wichtig ist nur, dass wir das Territorium erhalten, das uns rechtmäßig zusteht."
wuw_GER_diplomacy.39.a:	"Großartig!"
wuw_GER_diplomacy.100.t:	 "[FROM.GetAdjective] Zahlungen für Besatzungskosten werden eingestellt"
wuw_GER_diplomacy.50.a:	"Verdammt großartig!"
wuw_GER_diplomacy.50.b:	"Keine Zusammenarbeit mit den Krauts!"
wuw_GER_diplomacy.51.t:	"[FROM.GetNameDefCap] Akzeptiert Zusammenarbeit bei der Marineentwicklung"
wuw_GER_diplomacy.51.desc:	" [FROM.GetLeader] hat sich heute für das Abkommen ausgesprochen, das wir ihnen kürzlich zur Zusammenarbeit im Marinebereich unterbreitet haben, und behauptet, dass [FROM.GetAdjective] Marineingenieure bereits darauf hinarbeiten, bereits nächste Woche mit der gemeinsamen Entwicklung und Erforschung von Marineschiffen und Waffen zu beginnen. Dies ist ein großartiger Tag für [ROOT.GetNameDef] und ihre Marine!"
wuw_GER_diplomacy.52.t:	"[FROM.GetNameDefCap] lehnt Zusammenarbeit bei der Marineentwicklung ab"
wuw_GER_diplomacy.53.desc:	"Diplomaten von [FROM.GetNameDef] haben uns bezüglich eines lukrativen Angebots angesprochen. Sie möchten die Rechte an bestimmten Rohstoffvorkommen in unseren Kolonien erwerben und bieten im Gegenzug industrielle Hilfe an. Sollten wir dieses Angebot annehmen?"
wuw_GER_diplomacy.53.a:	"Wir beide können davon profitieren."
wuw_GER_diplomacy.53.b:	"Dieses Geschäft wird nur einem von uns zugutekommen ..."
wuw_GER_diplomacy.55.t:	" [FROM.GetNameDefCap] hat unseren Handelsvorschlag abgelehnt"
wuw_GER_diplomacy.55.desc:	"[FROM.GetLeader] scheint ein unvernünftiger und unkluger Anführer zu sein, dem es völlig gleichgültig ist, was für [FROM.GetLeader.GetHerHis] das Land am besten ist. Wir werden uns anderweitig umsehen, um das zu finden, was wir suchen."
wuw_GER_diplomacy.56.t:	"[FROM.GetNameDefCap] "Leert unsere Konten"
wuw_GER_diplomacy.56.a:	""Wie können sie es wagen!"
wuw_GER_diplomacy.57.a:	""Wir wollen keinen Konflikt, also müssen wir nachgeben ..."
wuw_GER_diplomacy.58.t:	"[FROM.GetNameDefCap] Gibt unseren Forderungen nach"
wuw_GER_diplomacy.59.t:	"[FROM.GetNameDefCap] Bleibt beim Schleswig-Referendum standhaft"
wuw_GER_diplomacy.59.a:	"Dann werden wir es ihnen aus ihren kalten Händen reißen!"
wuw_GER_mutual_guarantees.1.b:	"Wir sehen keinen Wert in diesem Pakt"
wuw_GER_mutual_guarantees.2.t:	"[FROM.GetNameDefCap] Begrüßt die gegenseitige Zusammenarbeit"
wuw_GER_mutual_guarantees.2.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unseren Antrag auf gegenseitige Zusammenarbeit und Garantien angenommen und unsere Diplomaten mit offenen Armen empfangen, wobei er erklärte, dass wir unsere Nationen nur gemeinsam vor ausländischen Mächten schützen können, die das Gleichgewicht bedrohen."
wuw_GER_mutual_guarantees.2.a:	" Großartig"
wuw_GER_mutual_guarantees.3.t:	"[FROM.GetNameDefCap] Lehnt gegenseitige Zusammenarbeit ab"
wuw_GER_weltpolitik.1.desc:	" [FROM.GetLeader] von [FROM.GetNameDef] ist mit einer interessanten Bitte an uns herangetreten. Sie bitten uns, ihnen alte [FROM.GetAdjective] Kolonialgebiete zurückzugeben, im Austausch für eine Vertiefung der Beziehungen zwischen unseren Ländern und ihre offizielle Unterstützung unserer Regierung auf globaler Ebene. Es scheint ein wenig einseitig, aber vielleicht ist es das Beste?"
wuw_GER_weltpolitik.1.a:	"Alles für unsere Freunde"
wuw_GER_weltpolitik.2.t:	"[FROM.GetNameDefCap] gibt unsere Kolonien zurück"
wuw_GER_weltpolitik.2.a:	"Wir nähern uns mit großen Schritten einem neuen Goldenen Zeitalter! "
wuw_GER_weltpolitik.3.desc:	"\n[FROM.GetLeader] von [FROM.GetNameDef] hat unseren Antrag auf Rückgabe unserer alten Kolonien abgelehnt und behauptet, es handele sich um ein einseitiges Geschäft, bei dem sie wenig bis gar nichts zu gewinnen hätten."
wuw_GER_diplomacy.60.t:	"[FROM.GetNameDefCap] fordert Nordschleswig"
wuw_GER_diplomacy.61.desc:	"[FROM.GetLeader] hat erklärt, dass sie, da sie keinen bewaffneten Konflikt mit uns eingehen wollen, sich dafür entschieden haben, das Gebiet von [912.GetName] zurückzugeben. Die Bevölkerung der Region jubelt, da sie wieder in die Gemeinschaft aufgenommen wurde."
wuw_GER_diplomacy.61.a:	"Ein großer Tag für das Volk von [ROOT.GetAdjective]!"
wuw_GER_diplomacy.62.t:	"[FROM.GetNameDefCap] steht fest zu [912.GetName]"
wuw_GER_diplomacy.62.desc:	"\nDer übermütige [FROM.GetLeader] hat verfügt, dass Nordschleswig [FROM.GetAdjective] ist und immer sein wird. [FROM.GetNameDefCap]s Truppen sind mobilisiert worden und werden in der Region stationiert, um eine Invasion abzuschrecken. Wie sollen wir auf diese Provokation reagieren?"
wuw_GER_diplomacy.62.b:	" Wir sollten dies wirklich nicht eskalieren lassen..."
wuw_GER_diplomacy.63.desc:	"\nUnser Oberherr [FROM.GetLeader] hat verfügt, dass Nordschleswig ist und immer sein wird [FROM.GetAdjective]. [FROM.GetNameDefCap]s Truppen sind in die Region, und ihre neuen lokalen Verwalter haben unsere Politiker dazu gezwungen, ein Gesetz zu unterzeichnen, das ihnen das Gebiet für die nächsten 100 Jahre überlässt."
GER_seized_north_schleswig:	"Deutschland hat Nordschleswig eingenommen"
wuw_GER_chinese_diplomacy.1.t:	"[FROM.GetNameDefCap] schickt uns Waffen und Material"
wuw_GER_chinese_diplomacy.1.a:	"Das wird uns zugutekommen"
wuw_GER_chinese_diplomacy.2.desc:	"\nUnsere großen Verbündeten im Westen, die [FROM.GetAdjective], haben uns eine Delegation entsandt. Die Delegation erklärt, dass sie bereit ist, in unsere Industrien zu investieren, im Austausch für Rechte auf bessere Handelsabkommen in Bezug auf unsere natürlichen Ressourcen. Sie sind wahrlich gute Freunde."
wuw_GER_chinese_diplomacy.3.desc:	"\nUnsere Delegation ist mit großartigen Neuigkeiten zurückgekehrt. Sie berichtet, dass die [FROM.GetAdjective] Regierung mehr als bereit war, das von uns vorgeschlagene Abkommen zu unterzeichnen, und dass der Vertrag sofort in Kraft treten wird. Wir haben somit erfolgreich Zugang zu ihren natürlichen Ressourcen erhalten, gegen die geringe Gegenleistung, sie bei ihrer Industrialisierung zu unterstützen."
wuw_GER_chinese_diplomacy.3.a:	"Großartig"
wuw_GER_chinese_diplomacy.4.t:	"[FROM.GetNameDefCap] Lehnt unser Angebot ab"
wuw_GER_chinese_diplomacy.4.desc:	"\nUnsere Delegation ist mit enttäuschenden Nachrichten zurückgekehrt. Sie berichten, dass die [FROM.GetAdjective]-Regierung sich geweigert hat, das Abkommen zu unterzeichnen, und behauptet, wir versuchten, sie unter dem Deckmantel der Industriehilfe auszubeuten."
wuw_GER_diplomacy.64.t:	"[FROM.GetNameDefCap] bietet Schutz im Austausch gegen Tribut an"
wuw_GER_diplomacy.64.desc:	" \n[FROM.GetLeader] von [FROM.GetNameDef] hat sich an uns gewandt und uns Schutz vor der Bedrohung aus dem Osten angeboten. Dieser Schutz ist jedoch nicht kostenlos, da erklärt wurde, dass wir den [FROM.GetAdjective] Tribut zahlen müssen, wenn wir Schutz wünschen."
##### |___KY049 863___|„Wenn es sein muss“
wuw_GER_diplomacy.64.b:	"Es ist einfach zu teuer, um es zu akzeptieren ..."
wuw_GER_diplomacy.65.t:	"[FROM.GetNameDefCap] akzeptiert unsere Bedingungen"
wuw_GER_diplomacy.66.desc:	" [FROM.GetLeader] von [FROM.GetNameDef] hat auf unser Angebot geantwortet und erklärt, dass die Bedingungen für unseren Schutz zu hart und die damit verbundenen Kosten viel zu hoch seien. Sie kommen alleine zurecht und benötigen keine Unterstützung durch eine Möchtegern-preußische Armee."
wuw_GER_diplomacy.66.a:	"Na ja"
wuw_GER_diplomacy.67.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat sich heimlich an uns gewandt und angeboten, gemeinsam unsere Nachbarn aufzuteilen – im Rahmen eines Paktes, der uns zu Verbündeten machen und Einflusssphären in den Niederungen etablieren würde. Sollten wir ihr zwielichtiges Angebot annehmen? "
wuw_GER_diplomacy.67.a:	"Dies wird uns sicherlich zugutekommen"
wuw_GER_diplomacy.68.a:	"Dann ist es Zeit zuzuschlagen!"
wuw_GER_diplomacy.69.t:	"[FROM.GetNameDefCap] Lehnt den Pakt ab"
wuw_GER_diplomacy.69.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat auf unser Angebot geantwortet und erklärt, dass es sich einfach nicht richtig anfühlt, ihren Nachbarn zu zerschneiden und ihnen in den Rücken zu fallen, und dass wir uns anderswo Verbündete suchen sollten, wenn wir in zukünftigen Konflikten die Angreifer sein wollen."
wuw_GER_diplomacy.69.a:	"Wir müssen uns andere Verbündete suchen"
wuw_GER_diplomacy.70.a:	"Keine schlechte Idee, wir könnten einen weiteren Verbündeten gebrauchen"
wuw_GER_diplomacy.70.b:	"Keine Zusammenarbeit mit den [FROM.GetAdjective], bringen Sie diese Propagandisten sofort zum Schweigen!"
wuw_GER_diplomacy.71.t:	"Die Einrichtung des Volkskommissariats [ROOT.GetNonIdeologyName]"
wuw_GER_diplomacy.71.desc:	"Unsere Oberherren in [FROM.GetNameDef] haben uns soeben über eine Umstrukturierung unserer derzeitigen Vereinbarung informiert. In dem Bestreben, die Arbeiter im ganzen Land zu vereinen, werden wir gebeten, ihnen Zugang zu einem größeren Teil unserer Industrie zu gewähren, um dies zum Wohle unseres Volkes zu nutzen. Obwohl wir dabei kein Mitspracherecht hatten, bleibt uns kein Raum für Beschwerden. Als sie uns ihre Hilfe anboten, wussten wir, dass dies sehr wohl der zu zahlende Preis sein könnte."
wuw_GER_diplomacy.72.t:	"Kommunistische Einflüsse aus [FROM.GetNameDef]"
wuw_GER_diplomacy.72.desc:	"Es ist uns zu Ohren gekommen, dass derzeit [FROM.GetAdjective] Zellen in unserem Land aktiv sind, die kommunistische Ansichten verbreiten. Obwohl dies an sich harmlos genug erscheint, scheint ein Teil der Propaganda doch eher revolutionärer Natur zu sein. Berichte darüber, dass Arbeiter dazu ermutigt werden, sich zu organisieren und zusammenzuschließen, werden immer häufiger, und angesichts der jüngsten Geschichte können wir nicht sicher sein, dass dies kein ausgeklügelter Trick der [GER.GetAdjective]-Führung ist, um uns letztendlich zu integrieren."
wuw_GER_diplomacy.72.a_tt:	" §RSollten die kommunistischen Anhänger den Bürgerkrieg gewinnen, könnte [FROM.GetNameWithFlag] versuchen, uns zu unterwerfen!§!"
wuw_GER_diplomacy.72.b:	"Darauf werden wir nicht hereinfallen!"
wuw_GER_diplomacy.74.t:	" [FROM.GetNameDefCap] Verbietet politische Einflussnahme "
wuw_GER_diplomacy.74.a:	"Wir müssen unsere [FROM.GetAdjective] Genossen befreien!"
wuw_GER_diplomacy.75.desc:	"Nach einer langen Zeit wachsender kommunistischer Stimmungen scheint es, als habe das [ROOT.GetAdjective] Proletariat es satt, auf einen friedlichen Regierungswechsel zu warten. Nach intensiven Diskussionen scheint die Diplomatie gescheitert zu sein, und es ist zu einem bewaffneten Konflikt gekommen."
wuw_GER_diplomacy.75.a:	"Für das Proletariat!"
wuw_GER_diplomacy.76.t:	"[FROM.GetNameDefCap] fordert, dass wir uns unterwerfen "
wuw_GER_diplomacy.76.desc:	"Nachdem sich der Bürgerkrieg endlich beruhigt hat, [FROM.GetNameDef] ist zu uns zurückgekehrt, um unsere Unterwerfung zu fordern. Wir hatten dies bereits vermutet, entschieden uns jedoch, es zu ignorieren, um ihre Hilfe beim Sturz unserer früheren Regierung zu erhalten. Bislang haben sie sich uns gegenüber als recht wohlwollend erwiesen, sodass die Hoffnung besteht, dass dies für uns vielleicht gar nicht so schlimm sein wird."
wuw_GER_diplomacy.76.a:	"Das ist der Preis, den wir zahlen."
wuw_GER_diplomacy.77.a:	"Warum nicht?"
wuw_GER_diplomacy.77.b:	"Auf keinen Fall!"
wuw_GER_diplomacy.78.desc:	"Nach einem Sieg der [FROM.GetAdjective], die sich uns anschließen wollten, in ihrem jüngsten Referendum ist die Führung von [FROM.GetNameDef] mit einer positiven Antwort zu uns zurückgekehrt. Von nun an werden sie sich uns zum Wohle unseres Volkes unterwerfen."
wuw_GER_diplomacy.79.desc:	"Die ablehnende Antwort der Führung von [FROM.GetAdjective] hat uns viel zu schnell erreicht, als dass wir glauben könnten, dass überhaupt ein Referendum stattgefunden hat. Trotz eindeutiger Anzeichen dafür, dass es ihrem Volk unter unserer sicheren Führung viel besser gehen würde, hat [FROM.GetLeader] die eigene Macht von [FROM.GetLeader.GetHerHis] dem Wohl des Volkes von [FROM.GetLeader.GetHerHis] vorgezogen."
wuw_GER_diplomacy.79.a:	"Wir müssen sie befreien!"
wuw_GER_diplomacy.80.t:	"[FROM.GetNameDefCap] investiert in unsere Industrie"
wuw_GER_diplomacy.80.desc:	"Die [FROM.GetAdjective] Regierung hat beträchtliche Investitionen getätigt, um unsere Industrie auf denselben Standard wie ihre zu bringen. Wir stellen dies als eine für beide Seiten vorteilhafte Vereinbarung dar: Wir als Land erhalten eine besser entwickelte Industrie, und wenn unsere Kapazitäten steigen, werden auch sie davon profitieren."
wuw_GER_diplomacy.80.a:	"Großartig!"
wuw_GER_diplomacy.81.t:	"Die Integration von [ROOT.GetNameDef]"
wuw_GER_diplomacy.82.t:	"[FROM.GetAdjective] Unterstützung für den Aufstand"
wuw_GER_diplomacy.82.desc:	"Unsere Genossen in [FROM.GetNameDef] haben uns eine Lieferung Gewehre geschickt, um uns in unserem Kampf gegen den Kapitalismus und die Bourgeoisie zu helfen. Diese Hilfe wird wahrscheinlich später ihren Preis haben, aber wer sind wir, dass wir ihre Hilfe ablehnen sollten?"
wuw_GER_diplomacy.82.a:	"Machen Sie guten Gebrauch von diesen Waffen!"
wuw_GER_diplomacy.83.t:	"[GER.GetNameDefCap] lädt uns zum [GER.GetFactionName] ein"
wuw_GER_diplomacy.83.a:	"Natürlich werden wir uns anschließen"
wuw_GER_diplomacy.83.b:	"Wir würden es vorziehen, auf uns allein gestellt zu bleiben."
GER_root_is_proletarian_subject:	"Da unser Land nun rechtmäßig von Vertretern der Arbeiter und des Proletariats geführt wird, haben die [FROM.GetAdjective]s Kontakt zu uns aufgenommen. Sie sprechen von sogenannter proletarischer Solidarität und davon, dass wir als ihre Untertanen ihnen einen Teil unserer Industrie zur Verfügung stellen sollten, als Gegenleistung für ihre Hilfe beim Aufbau unseres Landes."
wuw_GER_diplomacy.84.a:	"Wir stimmen zu: Solidarität für alle!"
wuw_GER_diplomacy.84.b:	"Das klingt für sie vorteilhafter."
wuw_GER_diplomacy.85.b:	"Wenn wir kämpfen müssen, kämpfen wir!"
wuw_GER_diplomacy.86.desc:	"Heute erreichte uns eine höchst willkommene Nachricht: Nachdem wir die Kontrolle über [FROM.GetAdjective] Gebiete innerhalb unseres Einflussbereichs übernommen haben, hat [FROM.FROM.GetNameDef] beschlossen, unsere Vereinbarung einzuhalten. Das Gebiet innerhalb unseres Einflussbereichs wurde in unser Eigentum überführt."
wuw_GER_diplomacy.86.a:	"Großartig!"
wuw_GER_diplomacy.87.t:	"Achtung der Einflusssphären"
wuw_GER_diplomacy.88.t:	"[FROM.GetNameDefCap] übergibt Gebiete in unserer Einflusssphäre"
wuw_GER_diplomacy.88.a:	"Großartig!"
wuw_GER_diplomacy.89.t:	"[FROM.GetNameDefCap] Errichtet Einflusssphäre"
wuw_GER_diplomacy.89.a:	"Na gut, dann..."
wuw_GER_diplomacy.89.b:	"Inakzeptabel"
wuw_GER_diplomacy.90.t:	" [FROM.GetNameDefCap] Fordert einen Nichtangriffspakt"
wuw_GER_diplomacy.90.desc:	"[FROM.GetLeader] hat sich mit einer Bitte an uns gewandt. [FROM.GetLeader.GetSheHe] möchte einen gegenseitigen Nichtangriffspakt mit uns unterzeichnen, um die Vorstellung zu festigen, dass wir zwar vielleicht keine echten Verbündeten sind, aber sicherlich auch keine Feinde. Ein solcher Pakt schränkt zwar unsere Handlungsfreiheit ein, sollten wir uns jemals mit den [FROM.GetAdjective]s überwerfen, doch er birgt auch das Potenzial, das Risiko, dass so etwas jemals geschieht, zu minimieren."
wuw_GER_diplomacy.91.t:	" [FROM.GetNameDefCap] äußert den Wunsch nach einer Annäherung"
wuw_GER_diplomacy.92.desc:	"Die Reaktion unserer Genossen in [FROM.GetNameDef] war positiv. Sie begrüßen unsere Annäherung an ihre politische Doktrin und teilen unsere Hoffnungen auf eine gute Zusammenarbeit in der Zukunft. Was die Frage betrifft, wie dies am besten zu bewerkstelligen ist, haben sie einen Vorschlag für uns, um diesen Übergang einfacher und schneller zu gestalten. Sie schlagen vor, unseren politischen Führer auszutauschen; obwohl Ernst Thälmann zweifellos ein fähiger Führer ist, sind sie überzeugt, dass Walter Ulbricht eine bessere Grundlage für unsere zukünftige Zusammenarbeit bieten könnte."
wuw_GER_diplomacy.93.desc:	"Vielleicht überraschenderweise war die Führung von [FROM.GetAdjective] bereit, Ernst Thälmann abzulösen. Sie haben diesen Wechsel vorgenommen, um gute Beziehungen zu uns zu pflegen und sicherzustellen, dass unsere politischen Agenden ähnlich genug sind, damit unsere Zusammenarbeit reibungslos verläuft. Dies muss als Erfolg gewertet werden!"
wuw_GER_diplomacy.95.t:	"Vorschlag zur industriellen Zusammenarbeit"
wuw_GER_diplomacy.95.desc:	"Die [FROM.GetAdjective] Führung ist mit einem Vorschlag zur industriellen Zusammenarbeit zwischen unseren Ländern an uns herangetreten. Ihr Vorschlag beschreibt detailliert, wie wir unsere industriellen Bemühungen gemeinsam verbessern und ausweiten könnten. Ob wir tatsächlich davon profitieren werden oder ob dies lediglich etwas ist, das den [FROM.GetAdjective] zugutekommt, bleibt abzuwarten."
wuw_GER_diplomacy.96.t:	"[FROM.GetNameDefCap] stimmt der industriellen Zusammenarbeit zu"
wuw_GER_diplomacy.96.desc:	"Die Reaktion auf unseren Vorschlag an die [FROM.GetAdjective]s zur industriellen Zusammenarbeit wurde positiv aufgenommen. In Zukunft werden wir bei der Erweiterung und Effizienzsteigerung unserer Industrie von dieser Zusammenarbeit profitieren."
wuw_GER_diplomacy.97.desc:	"Unser Vorschlag an die [FROM.GetAdjective]s wurde abgelehnt. Obwohl das Abkommen für uns und sie von größtem Nutzen gewesen wäre, haben sie sich geweigert, uns anzuhören. Auch wenn dieser Plan gescheitert ist, können wir dennoch Teile unserer ursprünglichen Ziele erreichen. Wir können unsere industrielle Expansion weiterhin auf eigene Faust optimieren. "
wuw_GER_diplomacy.97.a:	"Dann werden wir auf eigene Faust expandieren."
wuw_GER_diplomacy.99.t:	"[FROM.GetNameDefCap] tritt der Initiative zum Technologieaustausch bei."
wuw_GER_diplomacy.101.t:	"[FROM.GetNameDefCap] lehnt die Initiative zum Technologieaustausch ab"
wuw_GER_diplomacy.101.desc:	"Trotz offensichtlicher Vorteile für alle Beteiligten hat [FROM.GetNameDef] sich geweigert, unserer Initiative zum Technologieaustausch beizutreten. Mit der Begründung, dass man uns ihre Technologie nicht anvertrauen könne, haben sie unser Angebot abgelehnt und uns gebeten, ihnen solche Torheiten nicht vorzuschlagen."
wuw_GER_diplomacy.101.a:	"Unvernünftige [FROM.GetAdjective]s..."
wuw_GER_diplomacy.102.t:	"[FROM.GetNameDefCap] stimmt Nichtangriffspakt zu"
wuw_GER_diplomacy.102.desc:	"Unser Antrag auf Abschluss eines Nichtangriffspakts mit [FROM.GetNameDef] wurde genehmigt. Von nun an werden wir beide auf Angriffe gegeneinander verzichten. Wir sind sicher, dass dies beiden Nationen großen Nutzen bringen wird."
wuw_GER_diplomacy.103.t:	"[FROM.GetNameDefCap] Lehnt Nichtangriffspakt ab"
wuw_GER_diplomacy.103.a:	"Besorgniserregend"
wuw_GER_diplomacy.104.desc:	" Wir haben von den [FROM.GetAdjective]s die Nachricht erhalten, dass sie der Idee der Einrichtung unserer Einflusssphären zustimmen. Dies wird Feindseligkeiten verhindern und das Risiko von Konflikten um Gebiete in unserer unmittelbaren Umgebung verringern."
wuw_GER_diplomacy.105.a:	"Wie unhöflich!"
wuw_GER_diplomacy.107.b:	"Dies ist kein guter Zeitpunkt"
wuw_GER_diplomacy.107.c:	"Ein ungerechtes Angebot, schlagen Sie das nie wieder vor!"
wuw_GER_diplomacy.108.t:	"[FROM.GetAdjective] Zustimmung zur Industrieverlagerung"
wuw_GER_diplomacy.109.t:	"[FROM.GetAdjective] Ablehnung des Abkommens zur Industrieverlagerung"
wuw_GER_diplomacy.110.t:	"[FROM.GetAdjective] Lehnt den Deal zur Verlagerung von Industriebetrieben scharf ab"
wuw_GER_diplomacy.110.a:	"Egoistisch [FROM.GetAdjective]s..."
GER_SOV_have_had_enough_tt:	" §RHebt §YEntscheidungen§! zur Verlagerung von Industrien nach §Y[SOV.GetNameWithFlag]§! im Austausch gegen Ressourcen§!"
wuw_GER_diplomacy.111.a:	"Wir haben keine andere Wahl, als zu akzeptieren..."
wuw_GER_diplomacy.113.b:	"Dann ist es Krieg!"
wuw_GER_diplomacy.117.a:	"Wir können nicht hoffen, ihnen Widerstand zu leisten..."
wuw_GER_diplomacy.118.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat angekündigt, dass sich die [FROM.GetAdjective] Nation unserer Herrschaft unterwerfen wird, was zum Besten ist, da sie nicht die Macht haben, uns aufzuhalten, und ein Kampf nur Zerstörung über ihr Land und ihr Volk bringen würde."
wuw_GER_diplomacy.119.desc:	"Die hartnäckigen [FROM.GetAdjective] haben unseren Vorschlag abgelehnt, unsere Länder zu einer stärkeren Einheit zu vereinen. Ist das der Dank, den wir erhalten, nach allem, was wir für sie getan haben?"
wuw_GER_weltpolitik.4.t:	"[FROM.GetLeader] will den Kongo aufteilen"
wuw_GER_weltpolitik.4.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat sich in der Angelegenheit der verlorenen [FROM.GetAdjective] Kolonien an uns gewandt, da sie sich durch den Versailler Vertrag beraubt fühlen. Sie fordern nun, dass wir einen Pakt mit der [GER.GetAdjective] Nation unterzeichnen, um den Kongo in Einflusssphären aufzuteilen, und gemeinsam eine Forderung zu stellen, dies zu tun. Sollten wir ihnen nachgeben und einen solchen Pakt unterzeichnen?"
wuw_GER_weltpolitik.4.a:	"Es ist ein für beide Seiten vorteilhaftes Abkommen"
wuw_GER_weltpolitik.4.b:	"Wir werden diese Aggression nicht unterstützen"
wuw_GER_weltpolitik.5.t:	"[FROM.GetLeader] fordert, dass wir den Kongo aufgeben"
wuw_GER_weltpolitik.5.desc:	"In einer gemeinsamen Erklärung zusammen mit [GER.GetLeader] hat [FROM.GetLeader] von [FROM.GetNameDef] an uns herangetreten und gefordert, dass wir den Kongo an die beiden Staaten, die sie vertreten, abtreten. Sollen wir ihnen in dieser Angelegenheit Widerstand leisten, oder sollen wir einfach nachgeben und ihnen den Kongo übergeben?"
wuw_GER_weltpolitik.5.a:	"Leider lässt sich daran nicht viel ändern"
wuw_GER_weltpolitik.5.b:	"Wir können dies nicht akzeptieren"
wuw_GER_weltpolitik.6.t:	"[FROM.GetLeader] lehnt das Abkommen ab"
wuw_GER_weltpolitik.6.desc:	" [FROM.GetLeader] hat erklärt, dass [FROM.GetLeader.GetSheHe] für alle tapferen Bürger von [FROM.GetNameDef] steht, wenn [FROM.GetLeader.GetSheHe] sagt, dass sie unsere abwegigen Ideen, den Kongo – einen Staat, der mit keinem unserer eigenen verbunden ist – aufzuteilen, nicht unterstützen werden. Es scheint, als sei die Entscheidung endgültig. "
wuw_GER_weltpolitik.6.a:	"In diesem Fall gehört alles uns!"
wuw_GER_weltpolitik.6.b:	"Wir sollten nicht weiter darauf drängen"
wuw_GER_weltpolitik.7.t:	"[BEL.GetNameDefCap] plant, unsere Freiheit aufzugeben"
wuw_GER_weltpolitik.7.desc:	 "[BEL.GetLeader] von [BEL.GetNameDef] ist den gemeinsamen Forderungen von [GER.GetAdjective] und [ENG.GetAdjective] nachgegeben und hat beschlossen, unsere Nation zur Aufteilung unter ihnen zu übergeben, was jegliche Unabhängigkeit, die wir derzeit besitzen, effektiv beenden wird. Sollen wir uns wirklich einfach hinlegen und ein solches Schicksal akzeptieren?"
wuw_GER_weltpolitik.7.a:	"Wir können dagegen nichts ausrichten ..."
wuw_GER_weltpolitik.7.b:	"Wir können das nicht akzeptieren, zu den Waffen!"
wuw_GER_weltpolitik.9.t:	" [BEL.GetNameDefCap] Weigert sich, den Kongo aufzugeben"
wuw_GER_weltpolitik.9.desc:	"[BEL.GetLeader] von [BEL.GetNameDef] hat beschlossen, unseren Forderungen standhaft zu widerstehen, und erklärt, dass die [BEL.GetAdjective] Armee angesichts des Widerstands nicht zurückweichen und bis zum letzten Mann um den Kongo kämpfen werde. Sie wissen nicht, mit wem sie sich anlegen."
wuw_GER_weltpolitik.9.a:	"Dann werden sie vernichtet werden"
wuw_GER_weltpolitik.10.t:	"Die Kongo-Krise"
wuw_GER_weltpolitik.11.t:	"Die Kongo-Krise"
wuw_GER_weltpolitik.11.desc:	"Unsere Gouverneure im Kongo berichten uns, dass sie das Schicksal, das wir für sie gewählt haben, nicht akzeptieren werden und entschlossen für [COG.GetAdjective] Autonomie eintreten werden. Wir werden ihren Widerstand brechen müssen, damit sie nicht zum Untergang unserer Nation führen, vorausgesetzt, [ENG.GetNameDef] und [GER.GetNameDef] dies als einen Akt des Widerstands unsererseits betrachten."
wuw_GER_weltpolitik.11.a:	"Wir müssen sie vernichten, um die Sicherheit unseres Volkes zu gewährleisten!"
wuw_GER_chinese_diplomacy.5.desc:	"Unsere großen Verbündeten im Westen, die [FROM.GetAdjective], haben uns eine Delegation entsandt, die darum bittet, dass wir bei der Entwicklung neuer Technologien zusammenarbeiten, wobei sie ihr neues geplantes Programm als das " chinesisch-deutschen gemeinsamen Forschungsprogramms" bezeichnet. Sollen wir uns ihnen anschließen?"
wuw_GER_chinese_diplomacy.6.t:	"[FROM.GetNameDefCap] stimmt der Zusammenarbeit zu"
wuw_GER_chinese_diplomacy.7.a:	"Sie wissen gar nicht, was ihnen entgeht"
wuw_GER_weltpolitik.12.t:	"[FROM.GetName] Fordert die Rückgabe ehemaliger Kolonialgebiete"
wuw_GER_weltpolitik.12.b:	"Nein, sie gehören jetzt uns"
wuw_GER_weltpolitik.13.t:	"[FROM.GetNameDefCap] Gibt unsere Kolonien zurück"
wuw_GER_weltpolitik.13.desc:	"\n[FROM.GetLeader] von [FROM.GetNameDef] hat unsere Forderung nach der Rückgabe unserer ehemaligen Kolonien akzeptiert und erklärt, dass es ihnen in unseren Händen besser gehe. Die Menschen feiern auf den Straßen, da es den Anschein hat, dass das [ROOT.GetAdjective] Kolonialreich Imperium endlich wieder auf der Landkarte ist."
wuw_GER_weltpolitik.14.t:	"[FROM.GetNameDefCap] gibt unsere Kolonien nicht zurück"
wuw_GER_weltpolitik.14.desc:	"\n[FROM.GetLeader] von [FROM.GetNameDef] hat unseren Antrag auf Rückgabe unserer alten Kolonien abgelehnt und behauptet, es handele sich um ein einseitiges Geschäft, bei dem sie wenig bis gar nichts zu gewinnen hätten."
wuw_GER_weltpolitik.15.t:	" [FROM.GetNameDefCap] überträgt Gebiete an [GER.GetNameDefCap]"
wuw_GER_weltpolitik.15.desc:	"\n[FROM.GetLeader] von [FROM.GetNameDef] hat in einer überraschenden Wendung beschlossen, alle alten [GER.GetAdjective] Kolonialgebiete an sie zurückzuübertragen, einschließlich derer, die wir innehatten. Leider können wir nicht viel tun, um das neue Gesetz zu verhindern, aber zumindest können wir von ihnen eine Form der Entschädigung verlangen."
wuw_GER_reichskommissariats.1.desc:	"Nun, da wir in Belgien und Nordfrankreich eine neue Zivilverwaltung eingerichtet haben, müssen wir nicht nur über den Zweck unseres neuen Herrschaftsgebiets entscheiden, sondern auch darüber, wer die Bevölkerung in der Region führen und sicherstellen wird, dass unsere Politik ordnungsgemäß umgesetzt wird. Sollten wir einen [ROOT.GetAdjective] Politiker in die Position des Reichskommissars berufen, oder sollten wir einen lokalen Kollaborateur einsetzen?"
wuw_GER_reichskommissariats.1.b:	"Es könnte klug sein, einen lokalen Kollaborateur einzusetzen"
