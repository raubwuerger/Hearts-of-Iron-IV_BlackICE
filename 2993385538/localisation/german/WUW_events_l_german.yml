WW_hungary.65.t:	"[FROM.GetNameDefCap] Ernennt uns einen Habsburger Monarchen"
WW_hungary.65.desc:	"[FROM.GetNameDefCap] hat Joseph Franz von Habsburg zum neuen König unserer Nation ernannt. Dies wird unser Regime sicherlich stärken."


