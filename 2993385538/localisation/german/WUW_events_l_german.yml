 #wuw_GER_diplomacy.10.t - using old loc
 #wuw_GER_diplomacy.10.desc - using old loc
wuw_GER_realpolitik.18.desc:	" [FROM.GetLeader] von [FROM.GetNameDef] hat angekündigt, dass die [FROM.GetAdjective] Nation uns unsere alten östlichen imperialen Besitzungen zurückgeben wird. Endlich sind die historischen Ungerechtigkeiten von Versailles rückgängig gemacht worden!"
wuw_GER_realpolitik.19.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat erklärt, dass unsere Gründe für die Forderung nach ihrem Territorium durch den Vertrag von Versailles hinfällig geworden seien, einen Vertrag, gegen den wir kein Recht haben, zu verstoßen."
wuw_GER_realpolitik.19.a:	"Sie werden ihre Entscheidung bereuen"
wuw_GER_realpolitik.20.t:	"[FROM.GetNameDefCap] fordert weitere Zugeständnisse"
wuw_GER_realpolitik.20.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat verlangt, dass wir ihnen noch mehr Gebiete überlassen. Diesmal fordern sie [87.GetName], [98.GetName] und [97.GetName]. Sie greifen erneut in unseren Staat ein, doch vielleicht ist dies der einzige Weg, um die Vernichtung zu vermeiden. Sollten wir ihre Bedingungen akzeptieren?"
wuw_GER_realpolitik.20.b:	"Diesmal sind sie zu weit gegangen!"
wuw_GER_realpolitik.22.t:	"[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
wuw_GER_realpolitik.22.desc:	 "[FROM.GetLeader] von [FROM.GetNameDef] hat erklärt, dass unsere Gründe für die Forderung nach [FROM.GetAdjective] Land erfundene Lügen sind und dass sie nicht tatenlos zusehen werden, während wir dem Volk sein traditionelles [FROM.GetAdjective] Land rauben. Es scheint, als hätten sie unseren Bluff durchschaut. "
wuw_GER_realpolitik.22.a:	"Sie sind nicht auf unseren Trick hereingefallen, aber wir werden nicht wanken!"
wuw_GER_realpolitik.23.t:	"[FROM.GetNameDefCap] lädt uns zu einem Bündnis ein"
wuw_GER_realpolitik.23.b:	"Wir brauchen ihre Freundschaft nicht!"
wuw_GER_realpolitik.25.t:	"[FROM.GetNameDefCap] Lehnt unser Angebot ab"
wuw_GER_realpolitik.25.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat auf unsere Einladung zum Beitritt mit starkem Unmut reagiert und behauptet, dass jegliche Art von Partnerschaft zwischen unseren Ländern ausgeschlossen ist und für immer bleiben wird. Es scheint, als wollten sie unsere Hilfe bei der Rückeroberung alter osmanischer Gebiete nicht in Anspruch nehmen..."
wuw_GER_realpolitik.26.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat Diplomaten in unsere Hauptstadt entsandt, um die Aussicht auf komplexe Handelsbeziehungen mit der [FROM.GetAdjective] Nation zu erörtern. Dies würde unsere Beziehungen vertiefen, aber es würde ihnen den Zugang zu unseren Ressourcen zu einem günstigeren Preis ermöglichen, was das Risiko birgt, unserer Wirtschaft zu schaden."
wuw_GER_realpolitik.26.a:	"Wir sehen darin kein Problem"
wuw_GER_realpolitik.26.b:	" Sie können Ihre Papiere zurück nach Berlin bringen!"
wuw_GER_realpolitik.27.t:	"Bürgerkrieg in [ROOT.GetNameDef]"
wuw_GER_realpolitik.27.a:	"Für den König!"
wuw_GER_realpolitik.28.desc:	"Nach einer langen Zeit wachsender demokratischer Bestrebungen scheint es, dass die [ROOT.GetAdjective] demokratischen Kräfte es leid sind, auf einen friedlichen Regierungswechsel zu warten, und behaupten, dass unsere derzeitige Regierung darauf aus ist, die gesamte Macht für sich zu behalten, und daher gestürzt werden muss, damit die Demokratie gedeihen kann. Nach intensiven Diskussionen scheint die Diplomatie gescheitert zu sein, und es ist zu einem bewaffneten Konflikt gekommen."
wuw_GER_realpolitik.28.b:	"Wir müssen diesem Wahnsinn ein Ende setzen!"
wuw_GER_realpolitik.33.t:	"[FROM.GetNameDefCap] fordert wirtschaftliche Integration"
wuw_GER_realpolitik.34.t:	"[FROM.GetNameDefCap] nimmt unser Angebot an"
wuw_GER_realpolitik.34.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat positiv auf unser Angebot reagiert, und ihre Diplomaten sind in unserem Land eingetroffen, um die notwendigen Dokumente zu unterzeichnen, die ihre weitere wirtschaftliche Integration ermöglichen."
wuw_GER_realpolitik.35.t:	"[FROM.GetNameDefCap] Lehnt unser Angebot ab"
wuw_GER_realpolitik.35.a:	"Schreckliche Nachrichten..."
wuw_GER_realpolitik.36.a:	"Die klein-deutsche Lösung war ein Fehler"
wuw_GER_realpolitik.36.b:	"Wir werden bei unserer Unabhängigkeit keine Kompromisse eingehen!"
wuw_GER_realpolitik.37.t:	"[FROM.GetNameDefCap] akzeptiert unsere Forderungen"
wuw_GER_realpolitik.38.desc:	" [FROM.GetLeader] von [FROM.GetNameDef] hat erklärt, dass unsere Gründe für die Forderung nach der [FROM.GetAdjective] Unterwerfung die Idee der [FROM.GetAdjective] Souveränität und Selbstbestimmung gänzlich untergraben. Es scheint, als wünschten sie sich nicht, Teil eines Großgermanischen Staates zu sein."
wuw_GER_realpolitik.38.a:	"In diesem Fall müssen wir ihre Wünsche respektieren"
AUS_is_more_likely_to_accept_being_brothers_in_arms_flag:	" Das §Y[AUS.GetAdjective]§! Volk wurde auf unsere Seite gebracht"
wuw_GER_realpolitik.39.t:	"[FROM.GetNameDefCap] lädt uns zu einem Bündnis ein"
wuw_GER_realpolitik.39.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] ist heute in unserer Hauptstadt eingetroffen und hat uns ein Angebot unterbreitet. Sie wünschen sich, dass wir ihrem Bündnis beitreten und an allen zuvor geschlossenen Partnerschaften und Vereinigungen teilhaben. Sie versichern zudem, dass sie uns bei der Rückeroberung unserer alten ungarischen Gebiete unterstützen und uns helfen werden, Großungarn wiederherzustellen. Sollen wir dieses Angebot annehmen?"
wuw_GER_realpolitik.40.t:	"[FROM.GetNameDefCap] nimmt unser Angebot an"
wuw_GER_realpolitik.40.a:	"Sehr gut"
wuw_GER_realpolitik.41.t:	"[FROM.GetNameDefCap] Lehnt unser Angebot ab"
wuw_GER_realpolitik.41.desc:	 "[FROM.GetLeader] von [FROM.GetNameDef] hat auf unsere Einladung zum Beitritt mit starkem Unmut reagiert und erklärt, dass jegliche Art von Partnerschaft zwischen unseren Ländern ausgeschlossen ist und für immer bleiben wird. Es scheint, als wollten sie unsere Hilfe bei der Rückeroberung alter ungarischer Gebiete nicht in Anspruch nehmen..."
wuw_GER_realpolitik.41.a:	"Sie verpassen eine Chance..."
wuw_GER_realpolitik.42.b:	"Wir brauchen ihre Freundschaft nicht!"

wuw_GER_realpolitik.44.a:	"Sie erkennen nicht, was für ihr eigenes Volk am besten ist"
wuw_GER_realpolitik.45.t:	"[FROM.GetLeader] will die Tschechoslowakei teilen"

wuw_GER_realpolitik.45.a:	"Abgemacht!"
wuw_GER_realpolitik.45.b:	"Dem können wir nicht zustimmen"

wuw_GER_realpolitik.46.a:	"Wir können nicht gegen beide kämpfen ..."

wuw_GER_realpolitik.48.t:	" [FROM.GetLeader] Lehnt die Teilung der Tschechoslowakei ab"
wuw_GER_realpolitik.48.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat uns unsere rechtmäßigen Gebiete verweigert und behauptet, dass wir sie uns mit eigener Hand nehmen müssen, wenn wir sie haben wollen. Die [FROM.GetAdjective] reden zwar große Töne, aber können sie das auch untermauern?"
wuw_GER_realpolitik.48.a:	"Wir werden uns zurückholen, was uns gehört!"


wuw_GER_realpolitik.50.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unseren Antrag auf Aufteilung der ehemaligen österreichisch-ungarischen und tschechoslowakischen Gebiete abgelehnt. Es scheint, als sei der Deal doch geplatzt..."
wuw_GER_realpolitik.50.a:	"Dann können wir nicht viel tun ..."

wuw_GER_realpolitik.51.a:	"Es lohnt sich nicht, dafür Blut zu vergießen"
wuw_GER_realpolitik.52.t:	"[FROM.GetNameDefCap] überträgt Galizien"

wuw_GER_realpolitik.53.desc:	"Obwohl nicht völlig unerwartet, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation nach Erhalt unseres Ultimatums in höchste Alarmbereitschaft versetzt und einen Gesandten entsandt, der erklärte, dass sie in dieser Streitfrage keinen einzigen Schritt zurückweichen werden."

wuw_GER_realpolitik.54.t:	"Der Zweite Berliner Schiedsspruch"

wuw_GER_realpolitik.55.t:	"[FROM.GetNameDefCap] überträgt alte ungarische Besitzungen"
wuw_GER_realpolitik.55.a:	"Dies ist ein großartiger Tag!"

wuw_GER_realpolitik.57.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] ist einen Schritt weiter gegangen, als ursprünglich versprochen, und manipuliert die Märkte, um unsere Abhängigkeit von ihrer Wirtschaft weiter zu erhöhen, damit wir nicht von ihrem Kurs abweichen können. Wenn wir uns nicht sofort von ihnen lösen, bedeutet dies praktisch das Ende unseres Status als unabhängigen Nation bedeuten. Wie sollen wir vorgehen?"

wuw_GER_realpolitik.57.b:	"Sieg oder Tod!"
wuw_GER_realpolitik.58.t:	"[FROM.GetNameDefCap] akzeptiert weitere Integration"
wuw_GER_realpolitik.58.desc:	"Die glorreiche Nachricht, dass die Führung in [FROM.GetNameDef] einer weiteren Integration mit uns zugestimmt hat, wurde heute im Reichstag mit großem Beifall aufgenommen. Was wir anbieten konnten, war offensichtlich ausreichend, damit sie das Angebot trotz des leichten Einschnitts in ihre Souveränität als vorteilhaft erachteten."

wuw_GER_realpolitik.59.t:	" [FROM.GetNameDefCap] Lehnt weitere Integration ab"

wuw_GER_realpolitik.60.desc:	"Die Integration unserer Volkswirtschaften reichte offenbar nicht aus, um die [FROM.GetAdjective]s zu befriedigen, da [FROM.GetLeader] von [FROM.GetNameDef] heute einen Schritt weiter gegangen ist, als ursprünglich versprochen wurde, und nun unsere vollständige Integration in ihre Nation fordert. Wenn wir uns nicht unverzüglich von ihnen lösen, bedeutet dies das Ende unseres Status als unabhängige Nation. Wie sollen wir vorgehen?"
wuw_GER_realpolitik.60.a:	"Wir werden die Situation akzeptieren müssen"

wuw_GER_realpolitik.61.desc:	"Die glorreiche Nachricht, dass die Führung in [FROM.GetNameDef] der Integration in unsere Nation zugestimmt hat,  wurde heute im Reichstag mit großem Beifall aufgenommen. Was wir anbieten konnten, reichte offensichtlich aus, damit sie das Angebot trotz des Endes ihrer Souveränität als vorteilhaft anzusehen."
wuw_GER_realpolitik.62.t:	"[FROM.GetNameDefCap] Lehnt vollständige Integration ab"

wuw_GER_realpolitik.62.b:	"Wir werden sie genau im Auge behalten"

wuw_GER_realpolitik.63.a:	"Wir werden gerne annehmen"

GOT_GER_integrated_puppet_economies.02.desc:	"Um ihre eigene industrielle Kapazität zu stärken, betreiben die Deutschen eine Ausbeutungspolitik, um all unsere Ressourcen und Produktivität auszuschöpfen, was uns völlig ausbeuten wird."
GOT_GER_integrated_puppet_economies.02.a:	" Wir müssen dies zu unserem Vorteil nutzen"

wuw_GER_the_battle_of_britain.01.t:	"Die Luftschlacht um England"
wuw_GER_the_battle_of_britain.01.desc:	"$GER_hermann_goring$ ist bestrebt, die Überlegenheit der Luftwaffe zu demonstrieren und den Kampfgeist des [ENG.GetAdjective] Volkes zu brechen. Er beabsichtigt, dies durch die Bombardierung von Londons Wahrzeichen, dem Big Ben, zu erreichen. Er argumentiert, dass dies [ENG.GetNameDef] in die Knie zwingen und den Krieg verkürzen werde. Er garantiert zudem persönlich, dass während dieser Kampagne keine einzige Bombe Berlin treffen werde – andernfalls könne man ihn Hermann "Meier" nennen."
wuw_GER_the_battle_of_britain.01.b:	"Er verspricht zu viel"

wuw_GER_uncertain_future.01.desc:	"Nachdem der Bürgerkrieg endlich beendet ist, bauen wir die Nation langsam wieder auf, während sich die Menschen nach Stabilität und Sicherheit sehnen, aber zunehmend das Gefühl haben, ohne übergeordnetes Ziel oder Zielsetzung orientierungslos zu sein. Die Bevölkerung ist dieser Unsicherheit überdrüssig und fordert einen festen Kurs."
wuw_GER_uncertain_future.02.t:	"[ROOT.GetNameDefCap] Steht vor einer ungewissen Zukunft "

wuw_GER_uncertain_future.02.a:	"Eine Unruhe im Volk, nicht wahr?"
wuw_GER_german_politics.01.desc:	"Mit der Rückkehr freier Wahlen sind die [ROOT.GetAdjective] Bürger in Scharen zu den Wahllokalen geströmt, um über die Zukunft Deutschlands zu entscheiden. Ein Gefühl der Euphorie breitet sich in den Straßen aus, begleitet von der weit verbreiteten Überzeugung, die dunklen Tage endlich hinter sich gelassen zu haben, sodass dieser Tag eher wie ein Fest als wie eine nationale Wahl wirkt."

wuw_GER_german_politics.02.t:	"Ein Führer für das Volk"

GOT_GER_amerikabomber.01.t:	" Das "Amerikabomber"-Projekt"
GOT_GER_amerikabomber.01.desc:	"Nachdem die Entscheidung zum Bau eines Langstreckenbomber bereits in die Wege geleitet wurde, wurden Entwürfe verschiedener Teams eingereicht, die jeweils versprechen, eine Maschine zu liefern, die den Krieg über den Atlantik tragen kann; der einzige verbleibende Schritt ist nun die Auswahl des Teams, das diesen ehrgeizigen Plan verwirklichen wird. "

GOT_GER_amerikabomber.01.b:	"$GER_heinkel_organization$"
GOT_GER_amerikabomber.01.c:	"$GER_junkers_organization$"

GER_amerikabomber_focke_wulf_flag:	" §Y$GER_focke_wulf_organization$§! wurde der Entwicklung des §YAmerikabomber§!"
GER_amerikabomber_heinkel_flag:	"§Y$GER_heinkel_organization$§! wurde der Entwicklung des §YAmerikabomber§! zugewiesen"
GER_amerikabomber_messerschmitt_flag:	 "§Y$GER_messerschmitt_organization$§! wurde der Entwicklung des §YAmerikabomber§!"
GER_amerikabomber_junkers_flag:	 "§Y$GER_junkers_organization$§! wurde mit der Entwicklung des §YAmerikabomber§! beauftragt"

GER_operation_panzerfaust_events.01.desc:	"Es hat sich die Möglichkeit ergeben, dass unser Verbündeter Miklós Horthy geheime Friedensverhandlungen mit unseren Feinden führt. Wir müssen Druck auf ihn ausüben, um sicherzustellen, dass Ungarn der Sache treu bleibt."

GER_operation_panzerfaust_events.02.a:	"Wir sind nicht in der Lage, uns ihnen zu widersetzen"
GER_operation_panzerfaust_events.02.b:	"Sie haben hier keine Macht"

GER_operation_panzerfaust_events.04.t:	 "Horthy bleibt unnachgiebig"
GER_operation_panzerfaust_events.04.desc:	"Miklós Horthy hat heute verkündet, dass er dem deutschen Druck nicht nachgeben wird und dass Ungarn außerhalb deutscher Kontrolle bleiben soll. Da bloßer diplomatischer Druck nicht auszureichen scheint, müssen wir nun über unser weiteres Vorgehen entscheiden."

GER_operation_panzerfaust_events.05.desc:	"Der Führer hält an seiner Behauptung fest und hat nun den Beginn der Operation Margarethe angekündigt, einer Invasion unseres Landes mit dem Ziel der Unterwerfung. Wir müssen uns widersetzen!"

GER_operation_panzerfaust_events.06.desc:	"Trotz aller Bedrohungen unserer Grenzen und Souveränität hat Deutschland nun versucht, die Situation zu deeskalieren, indem es von seinen Forderungen zurücktrat."
GER_operation_panzerfaust_events.06.a:	"Dann sei es so"
GER_operation_panzerfaust_events.07.t:	"Operation Panzerfaust ist gescheitert "

GER_operation_panzerfaust_events.08.a:	"Hervorragend"
GER_operation_panzerfaust_events.09.t:	"Komplott gegen Horthy vereitelt"

GER_operation_panzerfaust_events.09.a:	"Wir sind sicher, vorerst"
GER_operation_panzerfaust_events.10.t:	"Horthy entführt"

GER_operation_panzerfaust_events.10.b:	"Wir werden uns niemals ergeben!"
GOT_GER_fading_eagle.01.t:	"[FROM.GetNameDefCap] fordert unsere Unterwerfung"
GOT_GER_fading_eagle.01.a:	"Wir müssen es vorerst zulassen"
GOT_GER_fading_eagle.01.b:	"Wir werden unsere Souveränität niemals aufgeben!"


GOT_GER_fading_eagle.03.a:	"Sie werden ihre Entscheidung bereuen"
GER_inner_circle_himmler.00.t:	"Himmlers Aufgaben"

GER_inner_circle_himmler.00.b:	"Konzentrieren Sie sich auf die Verbesserung unserer Geheimdienstarbeit"
GER_inner_circle_himmler_ss_tt:	" §Y$GER_heinrich_himmler$§! wird bald mit der Arbeit an dem Schwerpunkt beginnen §Y$GER_expand_ss_security_duties$§!."

GER_inner_circle.01.desc:	"[GetAscendingAdvisorName] hat großen Ehrgeiz bewiesen und innerhalb der Partei an Einfluss gewonnen. Allerdings seine Bemühungen, mehr Kontrolle auszuüben, haben zu Einwänden seitens anderer Mitglieder geführt, was einen Machtkampf zur Folge hatte. Die Frage ist, ob [GetAscendingAdvisorName] [GER.GetLeader] ausreichend beeindruckt hat, um sich einen Platz im inneren Kreis zu sichern."
GER_inner_circle.01.a:	" Ersetzen [GetAscendedAdvisorName1]"
GER_inner_circle.01.b:	"Ersetzen [GetAscendedAdvisorName2]"

GER_inner_circle.02.desc:	"Die Reichsleiter, die [GER.GetLeader] am nächsten stehen, haben begonnen, [GER.GetLeader.GetHersHis] Führung und die Vision [GER.GetLeader.GetSheHe] für die Zukunft von [GER.GetNameDef] in Frage zu stellen. Sie schmieden nun Pläne, [GER.GetLeader] von der Macht zu verdrängen und den Titel des Führers für sich selbst zu beanspruchen. Die Frage ist: Wer wird sich von den anderen abheben und den Weg in eine glorreiche Zukunft weisen?"
GER_inner_circle.02.a:	"[GetAscendedAdvisorName1] soll die Nation führen."

GER_inner_circle.02.d:	"Wir sind nicht bereit für einen Führungswechsel."

GER_inner_circle.03.b:	"$GER_fritz_todt$ verfügt über die erforderliche Erfahrung, um diese Aufgabe zu bewältigen."
GER_inner_circle.03.c:	"$GER_albert_speer$ wird die Industrieangelegenheiten übernehmen."

GER_inner_circle_industrial_reichsleiter:	"[GetIndustrialReichsleiterNames]"
GER_inner_circle_industrial_reichsleiter_all:	"$GER_fritz_todt$, $GER_albert_speer$, und $GER_hermann_goring$"
GER_inner_circle_industrial_reichsleiter_no_goring:	"$GER_fritz_todt$ und $GER_albert_speer$"

GOT_guarantee_events.01.desc:	" Es ist offensichtlich, dass [GER.GetLeader] nicht zur Vernunft gebracht werden kann und vor der Weltherrschaft nicht zurückschrecken wird. [GER.GetLeader.GetSheHe] ist zu der Überzeugung gelangt, dass niemand es wagt, sich [GER.GetNameDef] und dessen wachsenden Ambitionen sowie dessen Hunger nach Territorium in den Weg zu stellen. "

GOT_newsevents.1.desc:	 "Den [FROM.GetAdjective] ist es gelungen, die Europäer zu unterwerfen, sich als Hegemon auf dem Kontinent zu etablieren und Schritte zur Integration der neu eroberten Gebiete zu unternehmen. Die [FROM.GetAdjective]-Regierung hat versucht, das Volk hinter dem Staat und den sozialistischen Idealen zu vereinen, und mehrere pan -nationalistische Propagandakampagnen gestartet, um die Unterstützung des Proletariats zu stärken.\n\n[FROM.GetLeader] hat erklärt, dass die vereinigten Proletarier Europas fortan als "[From.GetNameDef]" bekannt sein werden."
GOT_newsevents.1.a:	"Wir erheben uns gemeinsam"
GOT_newsevents.1.b:	"Das verheißt nichts Gutes"

wuw_GER_news.1.d:	"Nachdem das deutsche Volk lange Zeit durch willkürliche Grenzen, die einen Bruder vom anderen trennten, auf verschiedene Staaten aufgeteilt war, kann es sich nun wieder freuen, da ein neuer deutscher Staat im Entstehen begriffen ist. Nach den jüngsten politischen Errungenschaften ist [FROM.GetLeader] dem Geist Bismarcks gerecht geworden und hat die Wiedervereinigung Deutschlands verkündet, einer Nation, die tausend Jahre bestehen wird!"
wuw_GER_news.1.b:	"Dies ist erst der Anfang"
wuw_GER_news.2.t:	"Ein Aufstand in Schlesien"

wuw_GER_news.2.c:	" Dies ist unsere Chance!"
AUS_political_events.1.t:	"Das Schicksal der Creditanstalt-Bankverein"
AUS_political_events.1.desc:	"Wir haben erfahren, dass die Bankenfusion von 1934, bei der die rekapitalisierte Creditanstalt alle Vermögenswerte und Verbindlichkeiten des Wiener Bankvereins sowie die rentablen Geschäftsbereiche der Niederösterreichischen Escompte -Gesellschaft übernommen wurden, uns nun auf die Füße fällt, da dies unsere wirtschaftliche Entwicklung erheblich behindert und unbeabsichtigt eine Art Monopol im Finanzsektor geschaffen hat. Angesichts der Tatsache, dass wir diesen Sektor nun regulieren, wie sollten wir mit der Situation umgehen?"

AUS_reestablish_creditanstalt:	"Der Creditanstalt-Bankverein wird aufgelöst, und die neue Österreichische Creditanstalt wird unsere volle Unterstützung erhalten."

AUS_political_events.2.desc:	"Kurz nach dem Tod ihres geliebten Generaldirektors Wilhelm Berliner ist die Phönix-Versicherung in weitere Schwierigkeiten geraten. Der neu ernannte Direktor Eberhard Reininghaus hat die Regierung auf gefälschte Bilanzen aufmerksam gemacht, die ein Defizit aus dem Jahr 1929 offenlegen, das sich auf über 250 Millionen Schilling beläuft. \n \n Das Unternehmen hat Insolvenz angemeldet und den Betrieb sofort eingestellt. Die überaus beliebte Kriegsteilnehmerversicherung hat ein jähes Ende gefunden, was bei vielen, die auf die Versicherungsleistungen angewiesen waren, für Empörung sorgt."
AUS_political_events.2.a:	"Wie schrecklich!"

AUS_political_events.2.b_tt:	"Durch die Übernahme der Versicherung können wir die Phönix-Versicherung wiederbeleben."

AUS_political_events.4.t:	"Meinungsumschwung"
AUS_political_events.4.a:	"Beseitigen Sie den Verräter!"

AUS_political_events.5.t:	" [AUS.GetNameDefCap] Strebt Zusammenarbeit zwischen unseren Luftstreitkräften an"
AUS_political_events.5.a:	"Es lohnt sich, wir werden so gut wie möglich helfen!"
AUS_political_events.5.b:	"Wir können lernen, zusammenzuarbeiten."

AUS_political_events.6.t:	" [FROM.GetNameDefCap] Akzeptiert unseren Vorschlag und gewährt uns Zugang zum Kauf von Ausrüstung"
AUS_political_events.6.desc:	"[FROM.GetNameDefCap] hat positiv auf unseren Vorschlag reagiert, beim Aufbau unserer Luftstreitkräfte zusammenzuarbeiten und unsere Erfahrungen auszutauschen. Sie haben die Schwierigkeiten erkannt, mit denen wir nach dem Ausstieg aus dem Vertrag von Saint-Germain -En-Laye stehen, und haben uns zudem die Möglichkeit angeboten, überschüssige Ausrüstung von ihnen zu erwerben!"

AUS_political_events.7.a:	"Großartig!"

AUS_air_force_partnership_small:	"Partnerschaft mit der Luftwaffe"

AUS_political_events.9.a_tt:	"§YWilhelm Zehner§!§R ist getötet worden!§!"


AUS_political_events.11.desc:	"Diplomaten aus [GER.GetNameDef] haben gegenüber einem Mitglied unseres militärischen Oberkommandos . Sie behaupten, dass wir zwar zweifellos ein souveräner Staat sind und tun können, was wir wollen, dies jedoch unsere diplomatischen Beziehungen zu [GER.GetNameDef] ins Wanken bringen könnte. \n\nWir müssen damit rechnen, dass sie die Angelegenheit selbst in die Hand nehmen, wenn wir nicht in ihrem besten Interesse handeln. "
AUS_political_events.11.a:	"Das geht sie nichts an!"

AUS_political_events.12.desc:	" [FROM.GetNameDefCap] hat sich an uns gewandt und uns Unterstützung in Form von Infanterieausrüstung angeboten. Sie schätzen uns sehr als einen äußerst wertvollen Verbündeten und wünschen, dass diese Gewehre für unsere Kriegsanstrengungen in [ETH.GetNameDef] eingesetzt werden, um unseren Sieg in diesem Krieg zu sichern."
AUS_political_events.12.a:	"Das kam unerwartet, ist aber sehr willkommen."

AUS_political_events.13.b:	"Gut."
AUS_political_events.14.t:	"[FROM.GetNameDefCap] spricht sich gegen das gegen uns verhängte Embargo aus"


AUS_political_events.15.c:	"Dafür haben wir jetzt keine Zeit!"

AUS_political_events.16.desc:	"Wie erwartet hat [FROM.GetNameDef] schlecht auf unser kürzlich verhängtes Verbot von DNSAP reagiert. Abgesehen von der offensichtlichen Forderung, dass wir das Verbot unverzüglich aufheben, verlangen sie zudem, dass wir Arthur Seyss-Inquart als Berater einsetzen. Sie bestehen sehr nachdrücklich darauf, und obwohl wir schon immer wussten, dass er die [FROM.GetAdjective]-Methode sehr schätzte, wirft dies doch die Frage auf: Warum?"
AUS_political_events.16.a:	"Wir müssen ihn genau im Auge behalten."
AUS_political_events.16.b:	"Auf keinen Fall!"

AUS_political_events.17.t:	"[FROM.GetNameDefCap] protestiert gegen unser Verbot der DNSAP"
AUS_political_events.17.desc:	"Wie erwartet [FROM.GetNameDef] hat die DNSAP negativ auf unser jüngstes Verbot reagiert. Sie betrachten dies als Angriff auf ihre eigene Ideologie und haben große Enttäuschung und Wut über unsere Entscheidung zum Ausdruck gebracht. Obwohl wir gute Gründe für das Verbot der DNSAP hatten, fordert die [FROM.GetAdjective]-Führung nun, dass wir das Verbot unverzüglich aufheben."

AUS_political_events.18.desc:	"Es scheint, als sei [FROM.GetAdjective] doch zur Vernunft gekommen. Das Verbot unserer Schwesterpartei in [FROM.GetNameDef] besteht zwar weiterhin, aber sie haben zumindest Arthur Seyss-Inquart als Berater eingesetzt, was uns einen Einblick in ihre politischen Manöver gewährt."
AUS_political_events.19.t:	"Godwin von Brumowski bietet seine Dienste an"

AUS_political_events.19.b:	" Angesichts seiner Beteiligung am Putsch von 1934 können wir das Risiko nicht eingehen"

AUS_guarantor_is_not_italy_key:	" [FROM.GetNameDefCap] hat einen Botschafter zu uns entsandt, der um unsere Hilfe bittet. Die [FROM.GetAdjective] Führungen haben besorgniserregende Tendenzen seitens der Führung von [GER.GetNameDef] festgestellt, und da sie aufgrund des Vertrags von Saint-Germain-en-Laye nicht mobilisieren können, um der Bedrohung zu begegnen, bitten sie nun formeller um unsere Unterstützung. Im Vertrag und den nachfolgenden Vereinbarungen haben wir uns bereit erklärt, ihnen zu helfen, doch es gibt keine Vorgaben, wie diese Unterstützung genau aussehen soll."

AUS_political_events.21.t:	"[FROM.GetNameDefCap] garantiert unsere Unabhängigkeit"
AUS_political_events.21.desc:	"Gemäß den Bestimmungen des Vertrags von Saint-Germain-En -Laye [FROM.GetNameDef] zugestimmt, unsere Unabhängigkeit zu garantieren. Zur Sicherheit gewähren sie uns zudem die Möglichkeit, Ausrüstung zu beschaffen, da wir derzeit nicht in der Lage sind, diese selbst herzustellen."

AUS_political_events.22.t:	"[FROM.GetNameDefCap] Unterstützt unsere Unabhängigkeit diplomatisch"

AUS_political_events.23.t:	"[FROM.GetNameDefCap] bietet bedingt eine Garantie an"

AUS_political_events.24.t:	"[FROM.GetNameDefCap] Lehnt unsere Bitte um Unterstützung ab"
AUS_political_events.24.a:	"Wir haben die anderen Parteien genau auf diesen Mangel hingewiesen ..."
AUS_political_events.24.b:	"Wir werden ihnen einen Anreiz bieten!"

AUS_political_events.26.t:	"[FROM.GetNameDefCap] Weigert sich, ihre Ansprüche zurückzuziehen"


AUS_political_events.27.b:	"Auf keinen Fall."
AUS_political_events.28.t:	"Die Garantiemächte stimmen der Wiederaufrüstung zu"
AUS_political_events.29.t:	 "Die Garantiemächte lehnen den Antrag auf Wiederaufrüstung ab"
AUS_political_events.29.a:	"Dann haben wir keine andere Wahl ..."


AUS_political_events.29.c:	"Sie haben uns zum Scheitern verurteilt, aber was können wir tun?"
AUS_political_events.29.c_tt:	 "§RWenn Sie diese Option wählen, bleibt der Vertrag von Saint-Germain-en-Laye bis zum 16. Juli 1940 in Kraft§!"
AUS_political_events.30.t:	" [AUS.GetNameDefCap] Bricht den Vertrag von Saint-Germain-en-Laye"
AUS_political_events.30.desc:	"[GetTreatyStatus]"

AUS_treaty_no_permission_key:	"Ohne jegliche Vorwarnung wurde uns mitgeteilt, dass [AUS.GetNameDef] den Vertrag von Saint-Germain-en-Laye mit all seinen Bestimmungen nicht länger einhalten wird. Vor allem bedeutet dies, dass sie nun ungehindert aufrüsten werden, ohne Rücksicht auf die Beschränkungen, die ihnen nach dem Ersten Weltkrieg auferlegt wurden. Warum sie so plötzlich aufrüsten wollen, bleibt unklar."
AUS_political_events.30.a:	"Wir können sie nicht aufhalten, aber wir können sie bremsen."
AUS_political_events.30.b:	"Na gut, dann sollen sie es doch tun."
AUS_political_events.30.c:	"Keine Garantien mehr für sie!"

AUS_broke_the_treaty_democratic:	"Hat unseren Vertrag gebrochen"
AUS_political_events.31.t:	"[FROM.GetNameDefCap] fordert Entschädigung für ihre Hilfe"
AUS_political_events.31.desc:	"Nachdem sich der Staub nach dem Bürgerkrieg gelegt hat, wurden wir von den [FROM.GetAdjective] bezüglich der Entschädigung für ihre Bemühungen im Bürgerkrieg kontaktiert. Sie fordern eine Form der Entschädigung für die geleistete Arbeit, die gefallenen Männer und die Waffen, die von ihren Freiwilligen eingesetzt und beschädigt wurden."
AUS_political_events.31.a:	"Wir werden auf industrieller Ebene helfen. "

AUS_political_events.31.c:	"Ihre Unterstützung war vernachlässigbar"
AUS_political_events.32.t:	"[FROM.GetNameDefCap] bietet Hilfe beim Bau einer neuen Fabrik an"
AUS_political_events.32.desc:	" Unsere Bitte um Entschädigung wurde von den [FROM.GetAdjective] Nationalisten erhört, und als Dankeschön haben sie uns Arbeiter und Material zur Verfügung gestellt, um eine neue Fabrik in Niederösterreich zu errichten. Dies ermöglicht es uns, verlorene Ausrüstung zu ersetzen, und wird sich auch in Zukunft als äußerst hilfreich erweisen."
AUS_political_events.32.a:	"Großartig!"


AUS_political_events.34.a:	"Wie unhöflich ..."
AUS_political_events.35.t:	"Paramilitärische Aktivitäten verursachen zivile Unruhen"
AUS_political_events.35.desc:	"Unsere jüngste Zusammenarbeit mit [GetMilitiaName] hat einige beunruhigende Nebenwirkungen gehabt. Da die Organisation durch die Führung des Landes legitimiert wurde , ist die [GetMilitiaName] in ihren Aktionen gegen die Zivilbevölkerung immer dreister geworden.\n\nDie Unruhen innerhalb der Nation haben zugenommen, da sich unser Volk mit der Arbeitsweise der Organisation nicht mehr ganz wohlfühlt. Es werden Fragen an unsere Führung gestellt, ob wir die [GetMilitiaName], und ob diese Entscheidung wirklich dazu beitragen wird, die Nation zu schützen."

AUS_political_events.35.c:	"Dies wird das neue [ROOT.GetName] sein!"

AUS_grossosterreich_neutrality_key:	"das Großösterreichische Reich"
AUS_political_events.36.a_tt:	" §YEntscheidungen freischalten§! um §Ydeutsche Kerngebiete§! im Laufe der Zeit zu integrieren."
AUS_political_events.36.b:	"Wir werden als Süddeutschland bekannt sein"

AUS_political_events.37.desc:	"[GetIntegrationEventTarget]"

AUS_political_events.37.b:	"Wir haben keine Chance gegen sie"

AUS_political_events.38.a:	"Sie werden sich uns anschließen, ganz gleich, was sie zu wollen glauben."

38DescIsPuppet:	"um es zu übergeben [FROM.FROM.OWNER.GetName] und es integrieren zu lassen"
AUS_political_events.39.desc:	 "Die Reaktion der [FROM.GetAdjective] Führung ist äußerst begrüßenswert. Sie werden die Waffen niederlegen und sich nicht wehren, während wir das integrieren, was rechtmäßig uns gehört. Offensichtlich haben sie erkannt, wie wichtig es ist, ihre Nation nicht in einen sinnlosen Krieg wegen solcher Angelegenheiten zu stürzen.. "

AUS_political_events.40.t:	 "[FROM.GetNameDefCap] Möchte sich [ROOT.GetFactionName] anschließen"
AUS_political_events.40.desc:	"[FROM.GetNameDefCap] hat sich an uns gewandt und darum gebeten, unserer Fraktion beizutreten. Sie haben mit der Aufrüstung begonnen und den Wunsch geäußert, zusammenzuarbeiten, um uns beide stärker zu machen. Historisch gesehen war diese Nation eine bedeutende Macht auf dem Schlachtfeld, und obwohl sie nun geschwächt ist, versichern sie uns dennoch, dass sie für uns die nützlichsten Verbündeten sein werden."

AUS_political_events.41.t:	"[FROM.GetNameDefCap] Stimmt unserem Beitritt zu [FROM.GetFactionName]"
AUS_political_events.41.desc:	" [FROM.GetNameDefCap] hat unsere Bitte, uns ihnen anzuschließen, mit Begeisterung aufgenommen und uns in die Fraktion willkommen geheißen. Wir werden nicht länger allein gegen diejenigen kämpfen, die uns bedrohen!"

AUS_political_events.42.desc:	"Unser Antrag auf Beitritt zur [FROM.GetFactionName] wurde kühl abgelehnt. Wir haben versucht, unsere Nützlichkeit zu begründen, doch leider hat [FROM.GetNameDef] seine Entscheidung bereits getroffen. Auch wenn dies äußerst ärgerlich ist, lassen wir uns davon nicht entmutigen, sondern suchen stattdessen nach anderen Lösungen."
AUS_political_events.42.a:	"Wir werden es ihnen zeigen"

AUS_political_events.43.desc:	"Die scharf formulierte Forderung von [FROM.GetNameDef] erreichte uns heute Morgen mit der Aufforderung, unverzüglich [Get43PuppetOrNotDesc]. Kaum verhüllte Drohungen mit Gewalt durchziehen die Forderung, und es scheint wahrscheinlich, dass Feindseligkeiten folgen könnten, sollten wir diesen Vorschlag von ihnen ablehnen."
43DescIsNotPuppet:	"uns ihren Forderungen zu unterwerfen und ein Untertan unter ihrer Herrschaft zu werden"

AUS_political_events.43.b:	"Nur über unsere Leichen"
AUS_political_events.43.c:	"Wir waren nie ihre Untertanen, aber sie können die Staaten haben, die früher zu ihnen gehörten."

AUS_political_events.44.desc:	" Die Reaktion auf unsere Forderungen gegenüber [FROM.GetNameDef] war äußerst erfreulich. Sie werden sich [Get44PuppetOrNotDesc] unserer Herrschaft unterwerfen und mit sofortiger Wirkung zu unseren Untertanen werden. Dies ist ein großer Erfolg für uns in unseren Bemühungen, unser Reich wiederherzustellen!"
AUS_political_events.44.a:	"Wunderbar!"

AUS_political_events.45.t:	"[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
AUS_political_events.45.desc:	 "In einer Demonstration offensichtlicher Respektlosigkeit und Missachtung ihrer eigenen Sicherheit [FROM.GetNameDef] hat beschlossen, unseren Vorschlag abzulehnen. Das Abkommen wäre für uns beide von Vorteil gewesen, doch sie scheinen unsere Ansichten diesbezüglich nicht zu teilen."
AUS_political_events.45.a:	"Dann kämpfen wir darum!"
AUS_political_events.46.t:	"[FROM.GetNameDefCap] Verlegt Staaten, um Unterwerfung zu vermeiden"

AUS_political_events.46.a:	"Umso besser!"
AUS_political_events.47.t:	"[FROM.GetNameDefCap] Lehnt den Vorschlag ab"
AUS_political_events.47.desc:	" Trotz unserer größten Bemühungen, die [FROM.GetAdjective] zu beschwichtigen, scheinen sie entschlossen zu sein, dass das einzig akzeptable Ergebnis darin besteht, dass wir uns ihren Forderungen beugen und sie ein Marionettenregime in unserem Land einsetzen lassen. Sie betonen, dass es keinen Raum für Kompromisse gibt – entweder sind wir auf ihrer Seite oder gegen sie."

AUS_political_events.47.b:	"Es war einen Versuch wert."
AUS_political_events.48.t:	"[FROM.GetNameDefCap] setzt einen Habsburger-Monarchen auf unseren Thron"
AUS_political_events.48.a:	"Wie es die Habsburger eben tun ..."

AUS_political_events.49.desc:	"Die Welt um uns herum verändert sich, während die Spannungen zunehmen. Heute erreichte uns eine Mitteilung, in der die Regierung von [FROM.GetAdjective] uns aufgefordert hat, Schlesien an sie zu übergeben. Schlesien war historisch gesehen Teil ihres Reiches, kam jedoch nach dem Ende des Ersten Weltkriegs unter unsere Kontrolle und steht seitdem unter unserer Herrschaft.\n\n[FROM.GetNameDefCap] hat sich entschlossen, im Gegenzug für die Provinzen Niederschlesien und Oberschlesien einige Fabriken anzubieten, in der Hoffnung, dass dies unsere Entscheidung erleichtern könnte."
AUS_political_events.49.a:	"Na gut, sie können diese Provinzen haben."

AUS_political_events.51.t:	"[FROM.GetNameDefCap] weigert sich, Schlesien zu übergeben"
AUS_political_events.51.desc:	"Die Mitteilung der [FROM.GetAdjective] Diplomaten entsprach nicht unseren Erwartungen. Nicht nur, dass [FROM.GetNameDef] das Abkommen ablehnt, sondern sie tun dies auch in einer Weise, die nur als abfällig und herablassend bezeichnet werden kann, und stellen in Frage, warum sie so etwas überhaupt zustimmen sollten und warum wir glauben, das Recht zu haben, irgendetwas zu fordern."
AUS_political_events.51.a:	"Sie werden diese Worte bereuen!"

AUS_political_events.52.desc:	" Aufgrund uralter Ansprüche und familiärer Bindungen hat der [FROM.GetAdjective] Monarch [FROM.GetLeader] verlangt, dass wir uns seiner Herrschaft unterwerfen. Mit der Behauptung, die Stadt Habsburg gehöre als altes Herrschaftsgebiet seiner Familie rechtmäßig zu seinem Land, fordert er, dass wir uns unverzüglich integrieren, oder wir müssen den Zorn seiner neu aufgestellten Armee fürchten."
AUS_political_events.52.a:	"Wir haben keine andere Wahl, als uns zu unterwerfen"
AUS_political_events.52.b:	"Die Habsburger haben kein Recht auf Habsburg!"
AUS_political_events.53.desc:	" Wir haben die Nachricht erhalten, dass die [FROM.GetAdjective] sich einer Annexion ihres Landes nicht widersetzen werden und sich stattdessen friedlich in unser glorreiches [ROOT.GetName] integrieren. Wir haben endlich die Kontrolle und das Eigentumsrecht an unserer alten Heimat, dem Dorf Habsburg, zurückerlangt."

AUS_political_events.54.desc:	"Wir haben die Antwort der Führung von [FROM.GetAdjective] erhalten; sie werden unseren Forderungen nicht nachkommen. Indem sie unsere familiären Ansprüche auf die Stadt Habsburg missachten, verweigern sie uns das rechtmäßige Eigentumsrecht an dem Land und beflecken unsere Ehre. Dies kann nicht toleriert werden!"
AUS_political_events.54.a:	"Für Habsburg!"

AUS_political_events.56.t:	"[GetHostilityItalianClaimTitle56]"

AUS_seeks_a_deal_desc_56:	"Unser vorgeschlagenes Abkommen mit [FROM.GetNameDef] wurde genehmigt. Als Gegenleistung für eine beträchtliche Industrieinvestition haben die [FROM.GetAdjective] zugestimmt, die Bundesstaaten [39.GetName] und [850.GetName] gemäß unserer Forderung zu übergeben."
AUS_political_events.56.a:	"Großartige Neuigkeiten"
AUS_political_events.57.t:	"[GetHostilityItalianClaimTitle57]"

AUS_makes_demands_desc_57:	"Unsere an die Führung der [FROM.GetAdjective] gerichteten Forderungen wurden nicht wohlwollend aufgenommen. Sie lehnen unsere Forderungen ab und lassen uns keinerlei Spielraum, weiter nachzufassen oder einen weiteren Versuch zu unternehmen, solche Forderungen zu stellen."

AUS_political_events.58.t:	"[FROM.GetNameDefCap] fordert das Eigentumsrecht an [39.GetName] und [850.GetName]"
AUS_political_events.58.desc:	 "[FROM.GetNameDefCap] hat sich mit einer scheinbaren Drohung an uns gewandt. Sie teilen uns in keinen freundlichen Worten mit, dass sie [39.GetName] und [850.GetName] haben möchten, von denen sie behaupten, dass sie rechtmäßig ihnen gehören. Die Staaten waren einst Teil des [FROM.GetAdjective] Kernlandes, gehören seit dem Großen Krieg zu uns."

AUS_political_events.59.a:	"Er muss weg!"
AUS_political_events.59.b:	"Das ist ihre Entscheidung"
AUS_political_events.60.t:	"[FROM.GetNameDefCap] lehnt Alfred Jansas Verteidigungsplan ab"

AUS_political_events.60.b:	"Umso mehr Grund, warum Alfred Jansa bleiben muss!"

AUS_political_events.61.a:	"Ausgezeichnet!"
AUS_political_events.62.t:	"[FROM.GetNameDefCap] Behält Alfred Jansa im Amt. "
AUS_political_events.62.desc:	"Trotz unserer Forderungen, dass [FROM.GetNameDef] den sogenannten Jansa-Plan nicht umsetzt und sicherstellt, dass dieser Mann keinerlei Macht oder Einfluss ausübt, haben die [FROM.GetAdjective]s es abgelehnt, unseren Forderungen nachzukommen. Wir können nur vermuten, dass dies nichts Gutes für unsere zukünftigen Beziehungen verheißt."

AUS_political_events.63.a:	"Wir können ihre Loyalität nicht garantieren"
AUS_political_events.64.t:	"[FROM.GetNameDefCap] bietet industrielle Unterstützung an"
AUS_political_events.64.desc:	"Scheinbar ohne besonderen Anlass haben sich die [FROM.GetAdjective] an uns gewandt und angeboten, unsere Industrie weiter voranzubringen. Sie haben angeboten, einen Teil unserer erforderlichen Produktion von zivilen Konsumgütern zu übernehmen, damit wir uns weiter auf den Fabrikbau konzentrieren können."

AUS_industrial_help:	"Industrielle Unterstützung"
AUS_political_events.65.t:	"[FROM.GetNameDefCap] Bietet Marktunterstützung "
AUS_political_events.65.desc:	"Anscheinend ohne besonderen Anlass haben die [FROM.GetAdjective] sich an uns gewandt und uns einen Preisnachlass auf ihre Ausrüstung auf dem internationalen Markt angeboten. Ob dies ein Trick ist, um uns dazu zu bringen, mehr bei ihnen zu kaufen, oder ein aufrichtiges Angebot, bleibt unklar. "
AUS_political_events.65.a:	"Es ist auf jeden Fall nützlich!"

AUS_political_events.66.t:	"[FROM.Get.GetNameDefCap] Schlägt eine föderative Union vor"
AUS_political_events.66.desc:	" [FROM.GetLeader] von [FROM.GetNameDef] hat sich mit einem sogenannten Angebot an uns gewandt. Mit dem Wachstum der Föderation wird es immer wichtiger, dass alle beteiligten Länder zuverlässig zusammenarbeiten. Um dies zu vereinfachen, hat [FROM.GetLeader] vorgeschlagen, dass wir uns alle unter ihrer Führung vereinen. \n\nWir würden zwar Zugeständnisse hinsichtlich unserer Souveränität machen, aber als Teil einer föderativen Nation würden wir auch die Sicherheit genießen, die eine größere Armee und mehr diplomatisches Gewicht mit sich bringen."
AUS_political_events.66.a:	"Das klingt nach einem fairen Deal"

AUS_political_events.67.desc:	" Die großartige Nachricht, dass [FROM.GetNameDef] zugestimmt hat, Teil unseres neuen föderativen Staates zu werden, hat uns soeben erreicht. Was wir zu bieten hatten, reichte offenbar aus, damit sie das Angebot trotz des leichten Einschnitts in ihre Souveränität als vorteilhaft erachteten."
AUS_political_events.68.t:	"[FROM.GetNameDefCap] Lehnt den Beitritt zur Föderativen Union ab"

AUS_political_events.68.b:	"Wir werden sie genau im Auge behalten"
AUS_political_events.69.desc:	"[GetHowAvoidedAnschluss]"

AUS_political_events.69.a:	"Ein Silberstreif am Horizont unserer aktuellen Situation"
AUS_political_events.69.b:	"Sicherheit für unsere Zeit!"
AUS_political_events.70.desc:	 "\n[FROM.GetLeader] von [FROM.GetNameDef] hat sich diesmal persönlich an uns gewandt. Unsere bisherigen Gespräche verliefen nicht so, wie sie es sich erhofft hatten, und sie haben beschlossen, uns ein neues Angebot zu unterbreiten, in der Hoffnung, unsere Meinung zu ändern.\n\nDa dies für sie eine sehr ernste Angelegenheit ist, haben sie angeboten, die Kosten für zwei neue Fabriken in unserem Land mitzutragen, und sie versichern uns, dass wir ihre Dankbarkeit genießen würden, sollten wir unsere Meinung ändern und ihnen eine Garantie geben."

AUS_political_events.71.t:	"[FROM.GetNameDefCap] Bietet Garantie für industrielle Unterstützung"
AUS_political_events.71.a:	"Endlich einmal gute Nachrichten! "

AUS_political_events.72.desc:	"Man kann nicht sagen, dass wir nicht unser Bestes versucht hätten. Wir haben uns auf den Vertrag von Saint-Germain-en-Laye berufen und eine Entschädigung angeboten, die weit über das hinausgeht, was von einem Land unserer Größe und in unserer Lage erwartet werden konnte. Trotz alledem [FROM.GetNameDef] weigert sich hartnäckig, uns gemäß dem Vertrag, an dessen Ausarbeitung sie selbst beteiligt waren, zu garantieren. Wir können in Zukunft nicht auf ihre Hilfe zählen."
AUS_political_events.72.a:	"Wir werden uns durchsetzen, und wir werden es ihnen zeigen!"
AUS_political_events.73.t:	"[FROM.GetNameDef] schlägt eine Revision des Vertrags von Saint-Germain-en-Laye vor"

AUS_political_events.73.b:	"Nein, der Vertrag muss bestehen bleiben."
AUS_political_events.73.c:	"Wenn sie wieder aufrüsten sollen, wollen wir, dass jemand dies überwacht!"

AUS_political_events.74.a:	"Die diplomatischen Bemühungen haben sich gelohnt!"

AUS_political_events.75.a:	"Wir müssen einfach durchhalten"
AUS_political_events.75.b:	"Genug ist genug, wir brauchen sie nicht!"
AUS_political_events.76.desc:	 "\nNach langem Ringen und vielen Diskussionen sind die Garanten endlich zu einer Einigung gelangt. Wir dürfen im Laufe der Zeit teilweise wieder aufrüsten; ab heute stehen uns keine Einschränkungen mehr im Weg, was die Ausbildung neuer Truppen und die Aufstockung unserer Soldatenstärke im Einsatz betrifft. Für unsere Industrie gelten zwar weiterhin Einschränkungen, diese sind jedoch weniger streng. Die Beschränkungen werden in einem Jahr vollständig aufgehoben, sofern sich in der Welt nichts grundlegend ändert.\n\nDieser Sieg hat jedoch seinen Preis. Die Garanten trauen unserer Fähigkeit nicht zu, uns aus Konflikten herauszuhalten, und haben einen Aufseher ernannt, der während dieses gesamten Prozesses in unserer Regierung verbleiben muss."

AUS_political_events.77.a:	"Machen Sie sich auf den Aufprall gefasst ..."

AUS_political_events.78.desc:	"Die Führer der [FROM.GetCommunistParty] in [FROM.GetNameDef] haben sich erneut an uns gewandt und um Hilfe gebeten. Obwohl sie sich derzeit nicht in einem bewaffneten Konflikt befinden, brennt das schmerzhafte Scheitern des Bürgerkriegs und des Putsches von 1934 an der Seite der Sozialdemokraten noch immer in ihren Köpfen. Sie wünschen sich unsere Hilfe, da sie erneut um die Macht in ihrem Land kämpfen."
AUS_political_events.78.a:	"Wir werden helfen, wenn wir können!"
AUS_political_events.78.b:	"Wir haben Besseres zu tun"
AUS_political_events.79.t:	"[FROM.GetNameDefCap] bietet seine Unterstützung an"

AUS_political_events.79.a_tt:	"Falls ein Krieg ausbricht, [FROM.GetFlag]§Y[FROM.GetNameDef]§! ist es wahrscheinlicher, dass sie uns Freiwillige schicken und uns Ausrüstung im Rahmen des Leih- und Pachtgesetzes zur Verfügung stellen."
AUS_political_events.80.t:	"[FROM.GetNameDefCap] lehnt unseren Hilferuf ab"

AUS_political_events.80.a:	"Wir hatten wirklich geglaubt, sie würden uns helfen!"
AUS_political_events.81.t:	"[FROM.GetNameDefCap] schließt sich unserer Politik an"

AUS_political_events.81.b:	"Sie werden die wertvollsten Verbündeten sein … aber noch nicht jetzt."
AUS_aligned_with_our_values:	"Im Einklang mit unseren Werten"
AUS_political_events.82.t:	"[FROM.GetNameDefCap] bietet Garantie"

AUS_political_events.82.a:	"Großartig! "
AUS_political_events.83.t:	"[FROM.GetNameDefCap] Befürwortet unseren politischen Kurswechsel"
AUS_political_events.83.desc:	"Unsere Entscheidung, uns stärker an der politischen Ideologie von [FROM.GetLeader] auszurichten, wurde positiv aufgenommen. [FROM.GetNameDefCap] hat zum Ausdruck gebracht, dass sie diesen Schritt als einen Schritt in die richtige Richtung zu schätzen und dass sie hoffen, uns in Zukunft als Verbündete zu sehen."

AUS_political_events.84.a:	"Wir sehen darin kein Problem"
AUS_political_events.84.b:	"Verbieten Sie sie!"

AUS_political_events.85.a:	"Ausgezeichnet"

AUS_political_events.85.2.a_tt:	"Schaltet die Entscheidung frei, §Ydie Befreiung der Arbeiter in [FROM.GetNameDef]§!zu fordern."
AUS_political_events.86.desc:	"\nIn einem Akt der Missachtung gegenüber seinen eigenen Arbeitern [FROM.GetLeader] hat er unsere Bemühungen verboten, sie über ihre Rechte in der Gesellschaft aufzuklären. Dies ist eindeutig eine feindselige Handlung nicht nur uns gegenüber, sondern auch gegenüber Arbeitern auf der ganzen Welt."
AUS_political_events.86.a:	"Verdammt!"

AUS_political_events.87.t:	 "[FROM.GetAdjective] Forderungen nach einem kommunistischen Regime"
AUS_political_events.87.a:	"Wir haben keine Wahl."

AUS_political_events.88.t:	"[FROM.GetNameDefCap] setzt kommunistische Regierung ein"
AUS_political_events.88.desc:	"Unsere unermüdlichen Bemühungen in [FROM.GetNameDef] haben sich endlich ausgezahlt. Die Arbeiter jubeln, als der neue Führer [FROM.GetLeader] die Führung des Landes übernimmt."
AUS_political_events.89.t:	"[FROM.GetNameDefCap] Lehnt unsere Forderungen ab"

AUS_political_events.89.a:	"Ein Krieg wäre noch schlimmer"

AUS_political_events.90.a_tt:	" §YKurt Schuschnigg§! wird Vorsitzender der §YDemokratischen§! Partei."
AUS_political_events.90.c:	"Vinzenz Schumy kann die meisten Wähler ansprechen!"
AUS_political_events.91.t:	"[ROOT.GetLeader] Möchte auf dem Schlachtfeld sein"

AUS_political_events.91.a:	"Ziehen Sie los, Erzherzog! Wir lassen jemanden Ihren Platz warmhalten"
AUS_political_events.91.b:	"Auch Erzherzöge müssen an ihrem Platz bleiben."
AUS_political_events.91.a_tt:	"Die neue Hauptstadt wird §YVaduz§! heißen."
AUS_political_events.91.a_tt2:	 "§YOtto von Habsburg§! wird §YFähigkeit 2§! Feldmarschall"

AUS_political_events.92.desc:	" [FROM.GetLeader] von [FROM.GetNameDef] hat sich mit der Bitte an uns gewandt, den Bundesstaat [463.GetName] zu erwerben. Bereits im Jahr 1867, als der Bundesstaat vom damaligen Russischen Reich durch [USA.GetNameDef] erworben wurde, wurde das Angebot zunächst an [FROM.GetNameDef] unterbreitet. Das Angebot wurde damals abgelehnt, doch seitdem hat sich ihre Meinung geändert, und nun möchten sie den Staat von uns erwerben. Als Gegenleistung bieten sie uns eine großzügige Zahlung an. "
AUS_political_events.92.b:	"Wir haben keine Verwendung für [463.GetName]"

AUS_political_events.93.desc:	"Wir haben von [FROM.GetLeader] die Nachricht erhalten, dass sie bereit sind, uns den Staat [463.GetName] zu dem von uns angebotenen Preis zu verkaufen. Der Staat wird unverzüglich an uns übertragen, damit wir mit den Integrationsbemühungen beginnen können."
AUS_political_events.93.a:	"Großartig"

AUS_political_events.94.a:	"Es war einen Versuch wert"

AUS_political_events.96.t:	"[FROM.GetNameDefCap] möchte sich der [ROOT.GetFactionName] anschließen"

AUS_political_events.96.a:	"Sie sind herzlich willkommen, sich uns anzuschließen!"
AUS_political_events.96.b:	"Wir trauen ihnen nicht."
AUS_political_events.97.t:	" [FROM.GetNameDefCap] Heißt uns willkommen bei der [ROOT.GetFactionName]"

AUS_political_events.97.a:	"Es musste getan werden"
AUS_political_events.98.a:	 "Wie schrecklich von ihnen!"

AUS_has_not_rejected_before:	"[FROM.GetLeader] der [FROM.GetAdjective] Führung hat auf unsere Forderungen geantwortet. Der Brief ist diplomatisch formuliert, enthält jedoch dennoch einen beleidigenden Unterton. Unsere Bedenken wurden abgetan, als wären sie nichts, was bedeutet, dass unsere Bedenken bezüglich [FROM.GetNameDef] tatsächlich berechtigt waren. Aus den Reihen unserer Führung wurden Stimmen laut, wir sollten weiterhin Druck auf die [FROM.GetAdjective] ausüben, damit sie nachgeben, da dies die Umsetzung unserer Zukunftspläne für sie erleichtern könnte; eine Minderheit vertritt jedoch die Ansicht, wir sollten in Erwägung ziehen, den [FROM.GetAdjective] diesen sinnlosen Sieg zuzugestehen."

AUS_political_events.99.a:	"Sie werden sich uns unterwerfen!"
AUS_refuses_to_submit:	"Weigern sich, sich uns zu unterwerfen"
AUS_political_events.99.b:	"Lassen Sie sie das haben, lassen Sie sie ihre Wachsamkeit verringern ..."

AUS_political_events.100.t:	"Weiterer Druck zur Einsetzung von Arthur Seyss-Inquart"
AUS_political_events.100.a:	"Es gibt einen Grund, warum sie Druck auf uns ausüben – geben Sie nicht nach!"
AUS_trying_to_control_us:	"Der Versuch, uns zu kontrollieren"

AUS_political_events.101.desc:	"Nach langem Hin und Her über etwas, das sie sicherlich sie betraf [FROM.GetNameDef], haben sie endlich ihre Versuche eingestellt, unsere Politik unrechtmäßig zu beeinflussen. Man kann nur vermuten, dass sie nun sehr unzufrieden mit uns sind, doch das ist nicht unser Hauptanliegen. Unser Hauptanliegen war schon immer, ist derzeit und wird immer die Verbesserung von [ROOT.GetNameDef] sein."
AUS_political_events.102.t:	"Der Führer plant die Expansion"

AUS_political_events.102.a:	"Eine wunderbare Idee!"
AUS_anschluss_ratio_ticking_down_monarchist:	" Die §YGesamtkampfstärke der Armee§!, die zum Starten des nationalen Schwerpunkts §YAnschluss§! erforderlich ist, wird wöchentlich gesenkt. Der Wert entspricht der Beliebtheit von §YFaschismus§! in §Y[AUS.GetNameWithFlag]§!."

AUS_political_events.103.desc:	"Zwar hegen wir schon seit langem den Verdacht, dass [GER.GetAdjective] die Absicht hegt, uns zu annektieren, doch der Bericht, den wir erst heute Morgen erhalten haben, rückt die Lage in ein neues, weitaus düstereres Licht. Es scheint, dass kürzlich eine Konferenz stattfand, auf der [GER.GetLeader] abscheuliche Ideen darüber äußerte, wie wir in ihr Land integriert werden könnten. Trotz unserer größten Bemühungen scheint es, als seien diese streng vertraulichen Informationen an die Öffentlichkeit gelangt, und was noch beunruhigender ist: an politische Parteien, die dies offenbar für eine großartige Idee halten. Diese Gruppen werden höchstwahrscheinlich den Kampfeswillen unseres Volkes untergraben, sollten diese abscheulichen Pläne von [GER.GetLeader] jemals verwirklicht werden."
AUS_political_events.104.desc:	"Heute Morgen fand ein höchst ungewöhnliches Treffen statt. Unsere Führung stand einem seltsamen Mann gegenüber, bei dem sie das Gefühl nicht loswurden, ihn schon einmal gesehen zu haben; sogar seine Stimme kam ihnen bekannt vor. Dieser Mann behauptet, er sei ein aufstrebender Künstler, er sei aus [GER.GetNameDef] angereist und wolle uns helfen. Er gibt an, ein fähiger Anführer zu sein, und dass unser Land dringend einen solchen benötige.\n\nAuf Nachfrage bei unseren Grenzbeamten bestreiten diese, dass jemand mit diesem Namen die Grenze überquert habe, und dass eine gewisse Elizabeth Hiedler die größte Ähnlichkeit aufweise."
AUS_political_events.104.a:	"Das wird nicht passieren, darauf fallen wir nicht herein."

AUS_political_events.105.t:	"[FROM.GetNameDefCap] zieht seine Unterstützung zurück"

AUS_political_events.105.b:	"Wir werden alleine stehen!"
AUS_political_events.106.t:	"[FROM.GetNameDefCap] bekräftigt seine Unterstützung"
AUS_political_events.106.desc:	"Angesichts der jüngsten Feindseligkeiten seitens [GER.GetNameDef] haben die [ITA.GetAdjective] sich an uns gewandt, um ihre Unterstützung zu bekräftigen. Ungeachtet der Drohungen werden sie unsere Unabhängigkeit garantieren, und sollte es zu einem bewaffneten Konflikt kommen, werden sie an unserer Seite kämpfen."


AUS_political_events.108.t:	"[FROM.GetNameDefCap] führt eine Militärübung an unserer Grenze durch"
AUS_political_events.108.desc:	 "Uns ist zu Ohren gekommen, dass die [FROM.GetAdjective] Armee direkt an unserer Grenze eine ziemlich große Militärübung begonnen hat. Obwohl keine Drohung ausgesprochen wurde, können wir das Gefühl nicht abschütteln, dass dies eine Art Warnung vor dem ist, was noch kommen wird. Wir müssen bei unseren Handlungen ihnen gegenüber vorsichtig sein, damit sie nicht noch heftiger zurückschlagen."

AUS_political_events.109.desc:	 "Seit kurzem berichten unsere Grenzpatrouillen von einer deutlich höheren Anzahl an Grenzpatrouillen und sogar Wachposten auf der [FROM.GetAdjective] Seite der Grenze. Noch beunruhigender ist, dass diese Wachposten nicht mehr nur leicht bewaffnet sind, sondern Gewehre tragen, wie man sie von der Armee erwarten würde. Wenn man ihren früheren Aussagen Glauben schenken kann, könnte dies Anlass zur Sorge geben."
AUS_political_events.109.a:	"Beunruhigend. .."
AUS_political_events.110.t:	"Anti-[ROOT.GetAdjective]-Stimmungen nehmen in [FROM.GetNameDef] zu"

AUS_political_events.111.desc:	"Soeben haben uns Mitteilungen der Führung von [FROM.GetAdjective] erreicht. Sie bitten uns, ein gegenseitiges Friedensabkommen zwischen unseren Ländern zu unterzeichnen. Sie erkennen an, dass wir in der Vergangenheit unseren gerechten Anteil an Schwierigkeiten hatten, wünschen sich jedoch jetzt und in Zukunft einen konstruktiveren Dialog."

AUS_political_events.111.b:	"In Anbetracht der [FROM.GetAdjective] und dessen, was sie verursacht haben, auf keinen Fall!"

AUS_political_events.113.a:	"Das ist bedauerlich"
AUS_political_events.114.desc:	"Angesichts unserer jüngsten Vereinbarung über den Frieden zwischen unseren Ländern haben die [FROM.GetAdjective] uns industrielle Unterstützung angeboten. Obwohl unser Industriesektor normalerweise unseren Standards entspricht, ist ihre Hilfe natürlich willkommen. Es wurden einige warnende Stimmen laut, die behaupten, dass [FROM.GetNameDefCap] dies sicherlich aus einem bestimmten Grund tut."

AUS_political_events.115.t:	"Vorgeschlagene [FROM.GetAdjective]-[ROOT.GetAdjective] Militärübung"
AUS_political_events.115.a:	"Warum nicht?"

AUS_political_events.116.desc:	" Heute findet die [ROOT.GetAdjective]-[FROM.GetAdjective] Militärübung ihren Abschluss. Unsere Truppen haben von dieser Übung sehr profitiert, und wir hoffen, dass auch die [FROM.GetAdjective] davon profitiert hat. Ein genauerer Einblick in die Operationen der [FROM.GetAdjective] Armee verschafft uns zudem einen guten Überblick darüber, womit wir mit wem wir zusammenarbeiten müssen, sobald unsere Pläne bezüglich ihrer Zukunft verwirklicht sind."
AUS_political_events.116.a:	"Ausgezeichnet!"
AUS_political_events.117.t:	"[FROM.GetAdjective] Ablehnung einer gemeinsamen [ROOT.GetAdjective]-[FROM.GetAdjective] Militärübung"
AUS_political_events.117.desc:	" \nTrotz der offensichtlichen Vorteile für uns beide [FROM.GetNameDef] haben sie unseren Vorschlag für eine gemeinsame Militärübung abgelehnt. Unsere Armeen hätten viel voneinander lernen können. Dies hätte auch eine hervorragende Gelegenheit für uns sein können, [FROM.GetNameDef] in die Richtung zu beeinflussen, die wir für unsere Zukunftspläne anstreben."

 # wuw_GER_realpolitik.30, wuw_GER_realpolitik.31 and wuw_GER_realpolitik.32 use other loc 

AUS_political_events.118.b:	"Wir werden unsere derzeitigen Vereinbarungen nutzen, um dies zu regeln"
AUS_political_events.118.c:	"Wir werden hierfür eine geeignete Organisation einrichten! "
AUS_political_events.118.c.tt:	"§Y[FROM.FROM.GetNameDefCap]§! werden gezwungen sein, sich der §Y[ROOT.GetAdjective]§! Fraktion anzuschließen"

AUS_political_events.119.b:	"Das können wir nicht zulassen!"

AUS_political_events.120.a:	"Herrlich."

AUS_political_events.121.a:	"Wir werden dieses Land zurückerobern!"
AUS_political_events.122.t:	"Das Geräusch von [ROOT.GetAdjective] U-Booten?"

AUS_political_events.123.desc:	"Die Nachricht, dass Österreich die Mittelmächte reformiert hat, erreichte uns erst heute Morgen. Das Militärbündnis hielt während des Ersten Weltkriegs zusammen, zerfiel jedoch mit dem Untergang der meisten führenden Mitglieder. Die [FROM.GetAdjective] haben beschlossen, diese Fraktion erneut ins Leben zu rufen, und da wir Teil ihrer früheren Form waren, hielten sie es für angebracht, uns eine Einladung auszusprechen."
AUS_political_events.123.a:	"Wir werden zusammenstehen!"

AUS_political_events.124.t:	"[FROM.GetNameDefCap] schließt sich den [ROOT.GetFactionName] an"
AUS_political_events.125.t:	"[FROM.GetNameDefCap] Lehnt unsere Einladung ab"

AUS_news_events.1.a:	"Wir wünschen [AUS.GetNameDef] dabei alles Gute ..."
AUS_news_events.1.b:	"Wir werden es ihnen zeigen ..."

AUS_news_events.3.desc:	" Der [AUS.GetAdjective] Jagdfliegerass Godwin von Brumowski ist bei einem schweren Absturz zusammen mit einem [HOL.GetAdjective] Flugschüler, den er über dem Flugplatz Schiphol ausbildete, ums Leben gekommen.\n\nVon Brumowski war das erfolgreichste Jagdfliegerass der mächtigen Luftfahrtruppen. Mit 35 Solo-Luftabschüssen, 12 gemeinsamen Abschüssen und weiteren 8 unbestätigten Abschüssen nahm er sowohl am Ersten Weltkrieg als auch am Bürgerkrieg von 1934 in [AUS.GetNameDef] teil."


AUS_news_events.5.desc:	 "\n[AUS.GetLeader] von [AUS.GetNameDef] hat kürzlich seine Absicht bekundet, den Vertrag von Saint-Germain-en-Laye ein für alle Mal aufzuheben und erneut aufzurüsten. Der Vertrag wurde nach dem Großen Krieg geschlossen, um [AUS.GetNameDef] davon abzuhalten, die Taten zu wiederholen, die den Krieg ausgelöst und zur Machterweiterung geführt hatten. Theoretiker vermuten, dass dies eine Reaktion auf die langsam steigenden Spannungen in der Welt ist; ob diese Militarisierungsbemühungen defensiven oder aggressiven Zwecken dienen sollen, bleibt abzuwarten."
AUS_news_events.5.a:	"Besorgniserregend"
AUS_news_events.5.b:	"Endlich!"

AUS_news_events.6.a:	"Besorgniserregend"
AUS_news_events.6.b:	"Ein großartiger Tag!"
 wuw_GER_realpolitik.43.a: "Splendorous"##### NOT TRANSLATED #####

AUS_news_events.7.a:	"Es lebe der Habsburger Prinz!"
AUS_news_events.7.b:	 "Das war nicht das, was wir im Vertrag festgelegt hatten!"

AUS_news_events.8.a:	"Warum sollten sie das tun?"

AUS_news_events.9.a:	"Das kam unerwartet"
AUS_news_events.9.b:	"Wir wünschen ihnen viel Glück!"
AUS_news_events.10.t:	"Bürgerkrieg in [FROM.GetNameDef]"

AUS_news_events.10.a:	"Das ist absurd"
AUS_news_events.10.b:	"Gute Arbeit und viel Glück!"
AUS_news_events.10.c:	"Vorwärts!"


AUS_news_events.12.t:	"[AUS.GetNameDefCap] hält erneut demokratische Wahlen ab"
AUS_news_events.12.desc:	 "\nZum ersten Mal seit dem 11. September 1930 [AUS.GetNameDef] hat demokratische Wahlen abgehalten. Die Wahlbeteiligung war hoch, und als die Auszählung der Stimmen zu Ende ging, [AUS.GetLeader] von [AUS.GetDemocraticParty] steht als Sieger fest. Ihm steht nun die schwierige Aufgabe, das Land auf einen neuen, demokratischeren Weg zu führen."
AUS_news_events.12.a:	"Großartig"
AUS_news_events.12.b:	"Zur Kenntnis genommen"

WW_hungary.1.desc:	" Unser Verbündeter [HUN.GetNameDef] hat ein Programm zur gemeinsamen Entwicklung von Flugzeugen in unserer Fraktion initiiert und damit begonnen, in unsere Entwicklung zu investieren, um in Zukunft die eigene voranzutreiben."

WW_hungary.2.a:	"Großartig!"
WW_hungary.3.t:	"Der Tod von Ministerpräsident Gyula Gömbös"
WW_hungary.3.a:	"Wir sollten versuchen, die MOVE zu integrieren"

HUN_gombos_has_died_flag:	"§YGyula Gömbös§! ist verstorben"
WW_hungary.4.t:	"[HUN.GetNameDefCap] fordert Siebenbürgen"

WW_hungary.4.a:	"Na und, sollen sie es doch haben ..."
WW_hungary.5.t:	"[FROM.GetNameDefCap] übergibt Siebenbürgen"
WW_hungary.5.desc:	"Anstatt sich der Macht unserer Armeen zu stellen, haben die feigen [FROM.GetAdjective] beschlossen, unsere rechtmäßigen Gebiete zurückzugeben. Ihre gesamten kontrollierten Gebiete in Siebenbürgen wurden unserer Verwaltung übergeben, und unsere Streitkräfte haben die volle Kontrolle übernommen."

WW_hungary.6.desc:	"Die arroganten Anführer in [FROM.getNameDef] haben unser Friedensangebot abgelehnt und behaupten, dass Krieg ihnen lieber sei, als Siebenbürgen an uns zu übergeben. Vielleicht haben sie unseren Bluff durchschaut, oder vielleicht ist jetzt der richtige Zeitpunkt, um gegen sie vorzugehen. Nur die Zeit wird es zeigen."
WW_hungary.6.a:	"Dann soll es Krieg geben"
WW_hungary.6.b:	"Es ist die Mühe einfach nicht wert"

WW_hungary.7.a:	"Es lohnt sich nicht, dafür Blut zu vergießen"

WW_hungary.8.desc:	 "[HUN.GetLeader] von [HUN.GetNameDef] hat sich mit einem interessanten Angebot an uns gewandt. Er erklärt, dass er im Austausch für die Rückgabe von [975.GetName], oder wie sie es nennen, der Lajtabánság, in die Hände von [HUN.GetAdjective] zu übergeben, bereit wären, uns eine Garantie für unsere Unabhängigkeit zu geben und auf unserer Seite zu stehen, falls die [GER.GetAdjective]s uns angreifen sollten. Sollen wir ihr Angebot annehmen?"
WW_hungary.8.a:	"Wir brauchen jede Hilfe, die wir bekommen können ..."
WW_hungary.8.b:	"Und wie viel ist ihre Garantie genau wert?"
WW_hungary.9.t:	"[FROM.GetNameDefCap] übergibt [975.GetName] als Garantie"

WW_hungary.9.a:	"Wir stehen heute als zwei alte Freunde, die wieder vereint sind!"
WW_hungary.10.desc:	"Die törichte Führung in [FROM.GetNameDef] hat unser Angebot abgelehnt und erklärt, es diene uns eindeutig besser als ihnen, und sie könnten vernünftigerweise nicht darauf vertrauen, dass wir unsere Verpflichtungen einhalten würden... Für wen halten die uns eigentlich!?"

WW_hungary.11.b:	"Dann kommen Sie und holen Sie es sich!"

WW_hungary.12.a:	"Dies ist ein großartiger Tag!"
WW_hungary.13.t:	"[FROM.GetNameDefCap] bleibt in der Slowakei standhaft"
WW_hungary.13.desc:	"Obwohl nicht völlig unerwartet, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation nach Erhalt unseres Ultimatums in höchste Alarmbereitschaft versetzt und einen Gesandten entsandt, der erklärte, dass sie in dieser Streitfrage keinen einzigen Schritt zurückweichen werden."

WW_hungary.13.b:	"Wir müssen dies auf sich beruhen lassen"
WW_hungary.14.a:	"Dies ist kein Konflikt, den wir gewinnen können"

WW_hungary.15.t:	" [FROM.GetNameDefCap] Überträgt die Vojvodina"
WW_hungary.15.a:	"Großartig"

WW_hungary.16.a:	"Vielleicht ist es das"
WW_hungary.16.b:	"Sie werden diesen Tag bereuen"

WW_hungary.17.b:	"Was glauben die eigentlich, wer sie sind?"
WW_hungary.18.t:	"[FROM.GetNameDefCap] akzeptiert unsere Forderungen"
WW_hungary.18.a:	"Alles nach Plan"



WW_hungary.20.t:	"[FROM.GetNameDefCap] fordert Karpatenrussland"
WW_hungary.20.desc:	" Die [HUN.GetAdjective] Regierung hat begonnen, in der Frage von Karpatenrussland mehr Druck auszuüben, und erklärt, dass es während des Kaiserreichs Teil Ungarns war und daher zurückgegeben werden sollte. Sie behaupten, dass die Huzulen-Republik und alle Nachfolgestaaten in der Region illegitim seien und dass diese Ungerechtigkeit nur behoben werden könne, wenn die Region wieder [HUN.GetAdjective] werde."
WW_hungary.20.a:	"Dies ist kein Konflikt, den wir gewinnen können"
WW_hungary.20.b:	"Können sie ihre Behauptung wirklich untermauern?"
WW_hungary.21.a:	"Großartig"
 
WW_hungary.22.b:	"Wir müssen dies auf sich beruhen lassen"
WW_hungary.23.desc:	"Die [HUN.GetAdjective] Regierung hat begonnen, in der Burgenland-Frage mehr Druck auszuüben, und erklärt, dass es während des Kaiserreichs zu Ungarn gehörte und daher zurückgegeben werden müsse. Sie behaupten, dass die Lajtabánság in dem Gebiet wiederhergestellt werden müsse und dass unsere Regierungsführung illegitim sei. Wie sollen wir reagieren?"

WW_hungary.23.b:	"Können sie ihre Behauptung wirklich untermauern?"
WW_hungary.24.desc:	"Die vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, ihre Gebiete im Burgenland zu übergeben, und ihren Truppen befohlen, sich zurückzuziehen und das Gebiet zu verlassen. Wir stehen erneut als Sieger da!"
WW_hungary.25.t:	"[From.GetNameDefCap] lehnt unsere Forderungen ab"

WW_hungary.25.b:	"Wir müssen dies auf sich beruhen lassen"
 wuw_GER_german_politics.01.a: "We need a cautious traditionalist"##### NOT TRANSLATED #####
WW_hungary.26.a:	"Sie sind herzlich willkommen, sich uns anzuschließen"
WW_hungary.27.t:	"[FROM.GetNameDefCap] Lassen Sie uns ihnen beitreten"
WW_hungary.27.desc:	"Der große [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, ein neues Militärbündnis zu bilden, wodurch die bereits bestehende Verbindung zwischen unseren Nationen gestärkt wird. Unsere Bevölkerung ist auf die Straßen gegangen, um diesen bedeutsamen Anlass zu feiern, da er die Wiedergeburt des Staates [ROOT.GetAdjective] und den Beginn einer neuen Ära für sein Volk markiert."
WW_hungary.27.a:	"Lassen Sie uns gemeinsam unsere Zukunft gestalten!"
WW_hungary.28.t:	"[FROM.GetNameDefCap] lässt uns nicht beitreten"

WW_hungary.29.desc:	" Die Regierung in [FROM.GetNameDef] hat ihre Absicht bekannt gegeben, die Pragmatische Sanktion von 1713 wieder in Kraft zu setzen, wodurch faktisch erneut ein Habsburger den Thron besteigen könnte – was unseren Forderungen nach dem Ersten Weltkrieg zuwiderläuft. Wir können es nicht wirklich rechtfertigen, deswegen in den Krieg zu ziehen, aber da sie bald eine Bedrohung für uns darstellen könnten, sollten wir vielleicht versuchen, Druck auf sie auszuüben?"
WW_hungary.30.t:	"Die Kleine Entente verlangt Friedensversprechen"
WW_hungary.30.desc:	"Die Mächte der Kleinen Entente nahmen Karl IV.s Versuch, die Habsburgermonarchie 1921 wiederherzustellen, nicht auf die leichte Schulter, und sie lassen eine solche Maßnahme auch heute noch nicht zu. Diesmal haben sie uns jedoch nicht mit Krieg gedroht, sondern stattdessen verlangt, dass wir unsere friedlichen Absichten unter Beweis stellen, damit sie unsere Monarchie nicht ein für alle Mal beenden müssen."


 # Event for GER
WW_hungary.32.desc:	"Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] hat gefordert, dass wir die cisleithanischen Gebiete zurückgeben und erneut einen Habsburger als unseren Monarchen krönen. Dies würde im Grunde unsere Unabhängigkeit beenden, könnte uns jedoch vor einer vollständigen Annexion bewahren. Nehmen wir einen Platz in der neuen kaiserlichen Föderation an? "
WW_hungary.32.b:	"Die Habsburger wurden aus gutem Grund ins Exil geschickt!"
WW_hungary.33.t:	"[FROM.GetNameDefCap] Akzeptiert einen Habsburger-Monarchen"

 # Event for HUN
WW_hungary.34.t:	" [FROM.GetNameDefCap] Lehnt einen Habsburger Monarchen ab"
WW_hungary.34.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, nicht von ihren Ämtern zurückzutreten, da sie irgendwie glaubt, weiser zu sein als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Joseph August auf ihren Thron setzen, ob es ihnen gefällt oder nicht!"

 # Event for GER
WW_hungary.35.b:	"Wir haben keine Verwendung für sie"
WW_hungary.36.t:	"[FROM.GetNameDefCap] stellt die Mittelmächte wieder her"
WW_hungary.36.desc:	"Der große und ehrenwerte [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, ein neues Militärbündnis zu bilden, wodurch die bereits bestehende Verbindung zwischen unseren Nationen gestärkt wird. Unser Volk ist auf die Straßen gegangen, um diesen bedeutsamen Anlass zu feiern, da er die Wiedergeburt des Staates [ROOT.GetAdjective] und den Beginn einer neuen Ära für sein Volk markiert."

 # Event for GER
WW_hungary.38.t:	"[FROM.GetNameDefCap] lädt uns zu den Mittelmächten ein"
WW_hungary.38.desc:	"[FROM.GetLeader] hat sich nach einem Besuch in unserer Hauptstadt an uns gewandt und behauptet, im Namen des gesamten [FROM.GetAdjective] Volkes zu sprechen. Er wünscht sich, dass unsere beiden Nationen erneut ein militärisches Bündnis eingehen, mit dem Ziel, die Territorien sowohl der [ROOT.GetAdjective] und [FROM.GetAdjective] Nationen weiter auszudehnen. Wie sollen wir auf ihre Bitte reagieren?"
WW_hungary.38.a:	"Sie werden niemals allein dastehen"

 # Event for HUN
WW_hungary.39.desc:	"Das große und ehrenwerte [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, unserem neuen Militärbündnis beizutreten, wodurch die bereits bestehende Verbindung zwischen unseren Nationen gestärkt wird. Unser Volk ist auf die Straßen gegangen, um diesen bedeutsamen Anlass zu feiern, da er die Wiedergeburt des Staates [ROOT.GetAdjective] und den Beginn einer neuen Ära für sein Volk markiert."
WW_hungary.40.t:	"[FROM.GetNameDefCap] entehrt uns"

 # Event for HUN
WW_hungary.40.b:	" Wir müssen einen anderen Ansatz versuchen"

 # Event for GER
WW_hungary.42.desc:	" Der große und ehrenwerte [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, ein neues Militärbündnis zu bilden. Unser Volk ist auf die Straßen gegangen, um diesen bedeutsamen Anlass zu feiern, da er die Wiedergeburt des Staates [ROOT.GetAdjective] und den Beginn einer neuen Ära für sein Volk markiert."
WW_hungary.42.a:	"Lassen Sie uns gemeinsam unsere Zukunft schützen!"

 # Event for GER
WW_hungary.43.a:	"Man kann nur der Familie wirklich vertrauen"
ENG_Rejected_HUN_grand_alliance:	"England hat die Wiederherstellung der Großen Allianz abgelehnt"

 # Event for HUN
WW_hungary.45.t:	"[FROM.GetNameDefCap] Akzeptiert einen wiedistischen Monarchen"

 # Event for HUN
WW_hungary.46.a:	"Sie haben die falsche Entscheidung getroffen"
WW_hungary.47.t:	"[FROM.GetLeader] Fordert die Wiederherstellung der Habsburger Herrschaft"

WW_hungary.48.t:	"[FROM.GetNameDefCap] Akzeptiert einen Habsburger Monarchen"

WW_hungary.49.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, nicht von ihren Ämtern zurückzutreten, da sie irgendwie glaubt, weiser zu sein als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Karl Albrecht auf ihren Thron setzen, ob es ihnen gefällt oder nicht!"
WW_hungary.49.a:	"Sie haben die falsche Wahl getroffen"
WW_hungary.50.t:	"[FROM.GetNameDefCap] Ernennt uns einen Habsburger Monarchen"

WW_hungary.50.a:	"In der Tat"
WW_hungary.51.t:	"[FROM.GetLeader] Fordert, dass wir die Herrschaft der Habsburger wiederherstellen"
WW_hungary.51.a:	"Es ist unsere Pflicht"


