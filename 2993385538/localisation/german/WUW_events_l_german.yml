l_german:
wuw_GER_reichskommissariats.28.t:	"Der Status des Nördlichen Urals"
wuw_GER_reichskommissariats.28.desc:	"Mit der Eroberung der strategischen Zone des Nördlichen Urals stellt sich die Frage, wie mit dieser Region verfahren werden soll. Einige Pläne sehen vor, das Gebiet in Moskowien einzugliedern, während andere vorschlagen, es könnte vielleicht als eigenständiger Staat bestehen. Was meinen wir dazu?"
wuw_GER_reichskommissariats.28.a:	"Es sollte ein eigenes Reichskommissariat sein"
wuw_GER_reichskommissariats.28.b:	"Es sollte in Moskowien eingegliedert werden"
