wuw_GER_weltpolitik.18.t:	"[FROM.GetNameDefCap] Lehnt die Einrichtung von Einflusssphären ab "
wuw_GER_weltpolitik.18.desc:	"Wir haben von den [FROM.GetAdjective] die Nachricht erhalten, dass sie sich weigern werden, unseren Einflussbereich anzuerkennen und zu akzeptieren, da sie erklärt haben, dass sie ihren eigenen Einflussbereich ohne Einmischung unsererseits festlegen werden. Dies könnte zu Spannungen in der Region führen."

wuw_GER_weltpolitik.19.desc:	" Der Unbesonnene [FROM.GetLeader] hat kürzlich unsere, wie er es nannte, unrechtmäßige Besetzung von [FROM.GetAdjective] Angola angeprangert. Nun haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir reagieren?"

wuw_GER_weltpolitik.20.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] haben zugestimmt, ihre Gebiete in Angola zu übergeben, und ihren Truppen befohlen, sich zurückzuziehen und das Gebiet zu verlassen. Wir stehen erneut als Sieger da!"

wuw_GER_weltpolitik.21.a:	"Sie werden ihre Entscheidung noch bereuen!"
wuw_GER_realpolitik.5.desc:	"Wie im Vertrag von Brest-Litowsk festgelegt, sollten die heute als Litauen bekannten Gebiete ein Vasallenstaat von uns werden, auch wenn die genauen Details noch nicht vollständig ausgearbeitet waren. Nun, da dies erneut relevant geworden ist, müssen wir entscheiden: Wie sollen wir mit [LIT.GetNameDef] umgehen?"
wuw_GER_realpolitik.5.a:	"Sie sollten in [ROOT.GetNameDef] eingegliedert werden"
wuw_GER_realpolitik.5.b:	"Vielleicht könnten wir sie zu unserem Vasallenstaat machen"

wuw_GER_realpolitik.6.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat verlangt, dass wir uns ihrer Herrschaft unterwerfen und eine autonome Region innerhalb ihrer Nation werden, wie es ursprünglich im Vertrag von Brest-Litowsk vor langer Zeit festgelegt wurde. Sollen wir ihren Forderungen nachgeben?"

