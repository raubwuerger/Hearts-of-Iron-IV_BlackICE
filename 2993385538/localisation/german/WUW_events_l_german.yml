wuw_GER_reichskommissariats.9.t:	"Der Status der Wolgadeutschen"
wuw_GER_reichskommissariats.9.desc:	"[ROOT.GetLeader] hat lautstark den Wunsch geäußert, die wolgadeutsche Kolonie in ein Reichsgebiet umzuwandeln und sie so weit wie möglich zu integrieren. Viele lokale Verwaltungsbeamte halten es jedoch für klüger, sie von einem näher gelegenen Staat aus zu regieren. Wie sollte mit dieser Frage umgegangen werden?"
wuw_GER_reichskommissariats.9.a:	"Es sollte in ein Reichsgebiet umgewandelt werden!"
wuw_GER_reichskommissariats.9.c:	"Es sollte in Turkestan eingegliedert werden"
wuw_GER_reichskommissariats.10.desc:	"Mit der Eroberung der strategischen Zone des Südurals stellt sich die Frage, wie mit der Region verfahren werden soll. Einige Pläne sehen das Gebiet als Teil von Moskowien vor, während andere vorschlagen, dass es vielleicht als eigenständiger Staat bestehen oder sogar Teil von Turkestan werden könnte. Was meinen Sie?"
wuw_GER_reichskommissariats.10.a:	"Es sollte ein eigenes Reichskommissariat sein"
wuw_GER_reichskommissariats.11.desc:	"Mit der Eroberung der strategischen Zone Ostkarelien stellt sich die Frage, wie mit der Region verfahren werden soll. Einige Pläne sehen vor, das Gebiet in Moskowien einzugliedern, während andere vorschlagen, es möglicherweise dem finnischen Staat anzuschließen. Was meinen wir dazu?"
wuw_GER_reichskommissariats.12.t:	"Die Führung des Generalgouvernements"
wuw_GER_reichskommissariats.12.a:	"Sie benötigen einen deutschen Beamten"
wuw_GER_reichskommissariats.12.b:	"Es könnte ratsam sein, einen lokalen Kollaborateur einzusetzen"
