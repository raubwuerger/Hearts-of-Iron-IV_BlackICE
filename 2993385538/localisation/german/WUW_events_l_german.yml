wuw_GER_reichskommissariats.22.t:	"Die Führung von Nordamerika"
wuw_GER_reichskommissariats.22.desc:	"Nun, da wir eine neue Zivilverwaltung in Nordamerika eingerichtet haben, müssen wir nicht nur über den Zweck unseres neuen Subjekts entscheiden, sondern auch darüber, wer die Menschen in der Region führen und sicherstellen wird, dass unsere Politik ordnungsgemäß umgesetzt wird. Sollen wir einen [ROOT.GetAdjective] Politiker in die Position des Reichskommissars einsetzen oder einen lokalen Kollaborateur?"
wuw_GER_reichskommissariats.22.a:	"Sie brauchen einen deutschen Beamten"
wuw_GER_reichskommissariats.22.b:	"Es könnte klug sein, einen lokalen Kollaborateur einzusetzen"
wuw_GER_reichskommissariats.23.t:	"Der Status der amerikanischen Westküste"
wuw_GER_reichskommissariats.23.desc:	"Nach der Eroberung der strategischen Zone an der amerikanischen Westküste stellt sich die Frage, wie mit dieser Region verfahren werden soll. Einige Pläne sehen vor, dass das Gebiet zu Nordamerika gehört, während andere vorschlagen, dass es vielleicht an den kolumbianischen Staat angegliedert werden könnte. Einige plädieren sogar dafür, es [JAP.GetNameDef] zuzugestehen. Was sagen wir dazu?"
wuw_GER_reichskommissariats.23.a:	"Die Verträge mit Japan sollten eingehalten werden"
wuw_GER_reichskommissariats.23.b:	"Es sollte in Nordamerika eingegliedert werden"
wuw_GER_reichskommissariats.23.c:	"Es sollte in Kolumbus eingegliedert werden"
wuw_GER_reichskommissariats.24.t:	"Die Führung von Arabien"
wuw_GER_reichskommissariats.24.desc:	"Nun, da wir eine neue Zivilverwaltung in Arabien eingerichtet haben, müssen wir nicht nur über den Zweck unseres neuen Subjekts entscheiden, sondern auch darüber, wer die Menschen in der Region führen und sicherstellen wird, dass unsere Politik ordnungsgemäß umgesetzt wird. Sollen wir einen [ROOT.GetAdjective] Politiker in das Amt des Reichskommissars einsetzen oder einen lokalen Kollaborateur?"
