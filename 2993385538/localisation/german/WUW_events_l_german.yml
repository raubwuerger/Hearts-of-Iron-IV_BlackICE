wuw_GER_weltpolitik.8.t:	 "[BEL.GetNameDefCap] wird den Kongo abtreten"
wuw_GER_weltpolitik.8.desc:	"[BEL.GetLeader] von [BEL.GetNameDef] ist unseren Forderungen nachgegeben und erklärt, dass der Kongo mit sofortiger Wirkung an uns abgetreten wird. Es ist noch nicht sicher, ob die Bevölkerung und die Gouverneure im Kongo dies akzeptieren werden, aber zumindest die [BEl.GetAdjective]s haben nachgegeben."
wuw_GER_weltpolitik.8.a:	"Perfekt"

wuw_GER_weltpolitik.9.b:	"Dann besteht kein Grund, darauf zu drängen"
wuw_GER_weltpolitik.10.desc:	"Der Vertrag wurde offiziell unterzeichnet, und das Land soll übergeben werden. Es gibt jedoch Widerstand im Kongo, Widerstand, der beseitigt werden muss ..."
wuw_GER_weltpolitik.10.a:	"Wir werden es mit Gewalt einnehmen"
wuw_GER_weltpolitik.10.b:	"Heute ist ein guter Tag"

