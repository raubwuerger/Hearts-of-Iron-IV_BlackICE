wuw_GER_realpolitik.1.t:	"[FROM.GetNameDefCap] lädt uns zu einer Allianz ein"
wuw_GER_realpolitik.1.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] ist heute in unserer Hauptstadt eingetroffen und hat uns ein Angebot unterbreitet. Sie möchten, dass wir ihrem Bündnis beitreten und uns an allen bereits bestehenden Partnerschaften und Bündnissen beteiligen. Werden wir dieses Angebot annehmen?"
wuw_GER_realpolitik.1.a:	"Wir nehmen dieses Angebot demütig an"
wuw_GER_realpolitik.1.b:	"Wir brauchen ihre Freundschaft nicht!"
wuw_GER_realpolitik.2.t:	"[FROM.GetNameDefCap] Nimmt unser Angebot an"
wuw_GER_realpolitik.2.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat wohlwollend auf unser Angebot reagiert, und ihre Diplomaten sind in unserer Nation eingetroffen, um die notwendigen Dokumente zu unterzeichnen, die ihren vollständigen Beitritt zu unserer Allianz ermöglichen."
wuw_GER_realpolitik.2.a:	"Sehr gut"
wuw_GER_realpolitik.3.t:	"[FROM.GetNameDefCap] Lehnt unser Angebot ab"
wuw_GER_realpolitik.3.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat auf unsere Allianzeinladung mit starkem Unmut reagiert und behauptet, dass jede Art von Partnerschaft zwischen unseren Ländern vom Tisch ist und für immer vom Tisch sein wird. Halten sie uns für eine Art Eroberer?"
wuw_GER_realpolitik.3.a:	"Sie haben etwas verpasst..."
wuw_GER_realpolitik.4.t:	"[FROM.GetNameDefCap] schickt militärische Unterstützung"
wuw_GER_realpolitik.4.desc:	"Die [FROM.GetAdjective] wollen uns bei unseren Kriegsanstrengungen unterstützen und haben uns etwas Ausrüstung geschickt. Es ist eine eher kleine Lieferung, aber jede Hilfe wird angenommen."
wuw_GER_realpolitik.4.a:	"Das wird uns sicher nützlich sein"
wuw_GER_weltpolitik.16.t:	"[FROM.GetNameDefCap] Richtet Einflusssphären ein"
wuw_GER_weltpolitik.16.desc:	"[FROM.GetNameDefCap] hat uns mitgeteilt, dass sie eine Einflusssphäre errichtet haben. Das betrifft uns zwar nicht direkt, da es keine formelle Vereinbarung gibt, aber wir sollten uns dessen bewusst sein. Sie könnten versuchen, uns diese Sphäre aufzudrängen oder Territorium von uns zu fordern, sollten wir die Kontrolle darüber erlangen."
wuw_GER_weltpolitik.16.a:	"Wir werden die Welt erobern, gemeinsam!"
wuw_GER_weltpolitik.16.b:	"Auf keinen Fall!"
wuw_GER_weltpolitik.17.t:	"[FROM.GetNameDefCap] ist mit der Einrichtung von Einflusssphären einverstanden"
wuw_GER_weltpolitik.17.desc:	"Wir haben von den [FROM.GetAdjective] die Nachricht erhalten, dass sie der Idee zustimmen, unsere Einflusssphären einzurichten. Dies wird Feindseligkeiten verhindern und das Risiko von Konflikten um Ländereien in unserer unmittelbaren Umgebung verringern."
wuw_GER_weltpolitik.17.a:	"Großartig!"
wuw_GER_weltpolitik.18.t:	"[FROM.GetNameDefCap] lehnt die Einrichtung von Einflusssphären ab"
wuw_GER_weltpolitik.18.desc:	"Wir haben von den [FROM.GetAdjective] erfahren, dass sie sich weigern werden, unsere Einflusssphären anzuerkennen. Sie haben erklärt, dass sie selbst über ihre Einflusssphären entscheiden werden, ohne dass wir uns daran beteiligen. Das könnte zu einigen Spannungen in der Region führen."
wuw_GER_weltpolitik.18.a:	"Wie unhöflich!"
wuw_GER_weltpolitik.19.t:	"[FROM.GetNameDefCap] fordert die Kontrolle über unsere [ANG.GetAdjective] Territorien"
wuw_GER_weltpolitik.19.desc:	"Der unbesonnene [FROM.GetLeader] hat kürzlich unsere, wie er sagte, unrechtmäßige Besetzung von [FROM.GetAdjective] Angola angeprangert. Jetzt haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir darauf reagieren?"
wuw_GER_weltpolitik.19.a:	"Es ist es nicht wert, dafür Blut zu vergießen."
wuw_GER_weltpolitik.19.b:	"Dann kommt und holt es Euch!"
wuw_GER_weltpolitik.20.t:	"[FROM.GetNameDefCap] übergibt ihre [ANG.GetAdjective] Territorien"
wuw_GER_weltpolitik.20.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, seine Territorien in Angola zu übergeben, und hat seine Truppen angewiesen, sich zurückzuziehen. Wir haben wieder einmal gesiegt!"
wuw_GER_weltpolitik.20.a:	"Dies ist ein großer Tag!"
wuw_GER_weltpolitik.21.t:	"[FROM.GetNameDefCap] bleibt in Angola standhaft"
wuw_GER_weltpolitik.21.desc:	"Obwohl es nicht völlig unerwartet kam, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation in höchste Alarmbereitschaft versetzt, nachdem er unser Ultimatum erhalten hatte, und einen Abgesandten geschickt, der erklärte, dass er in dem Streit keinen einzigen Schritt zurückgehen werde."
wuw_GER_weltpolitik.21.a:	"Sie werden ihre Entscheidung noch bereuen!"
wuw_GER_weltpolitik.21.b:	"Wir müssen die Sache auf sich beruhen lassen"
wuw_GER_realpolitik.5.t:	"Die [LIT.GetAdjective]-Frage"
wuw_GER_realpolitik.5.desc:	"Wie im Vertrag von Brest-Litowsk festgelegt, sollten die Länder, die heute als Litauen bekannt sind, ein Klientelstaat von uns werden, auch wenn die genauen Details noch nicht vollständig geklärt waren. Nun, da es wieder relevant geworden ist, müssen wir entscheiden, wie wir mit [LIT.GetNameDef] umgehen wollen."
wuw_GER_realpolitik.5.a:	"Sie sollten in [ROOT.GetNameDef] eingegliedert werden."
wuw_GER_realpolitik.5.b:	"Vielleicht könnten wir sie zu unserem Klientenstaat machen"
wuw_GER_realpolitik.6.t:	"[FROM.GetNameDefCap] Fordert unsere Annektierung"
wuw_GER_realpolitik.6.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat gefordert, dass wir uns ihrer Herrschaft unterwerfen und eine autonome Region innerhalb ihrer Nation werden, wie es ursprünglich im Vertrag von Brest-Litowsk vor langer Zeit festgelegt wurde. Sollten wir ihren Forderungen nachgeben?"
wuw_GER_realpolitik.6.a:	"Es gibt nicht viel, was wir tun können, um sie aufzuhalten..."
wuw_GER_realpolitik.6.b:	"Wir werden unsere Freiheit niemals aufgeben!"
wuw_GER_realpolitik.7.t:	"[FROM.GetNameDefCap] verlangt, dass wir ihr Klientenstaat werden"
wuw_GER_realpolitik.7.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] verlangt, dass wir uns ihrer Herrschaft unterwerfen und ihr Klientelstaat werden, so wie es ursprünglich im Vertrag von Brest-Litowsk vor langer Zeit festgelegt wurde. Sollten wir ihren Forderungen nachgeben?"
wuw_GER_realpolitik.7.a:	"Es gibt nicht viel, was wir tun können, um sie aufzuhalten..."
wuw_GER_realpolitik.7.b:	"Wir werden unsere Freiheit niemals aufgeben!"
wuw_GER_realpolitik.8.t:	"[FROM.GetNameDefCap] Nimmt unsere Forderungen an"
wuw_GER_realpolitik.8.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat angekündigt, dass sich die [FROM.GetAdjective] Nation unserer Herrschaft unterwerfen wird, da sie nicht die Macht haben, uns aufzuhalten, und ein Kampf nur noch mehr Zerstörung über ihr Land und ihr Volk bringen würde."
wuw_GER_realpolitik.8.a:	"Ein großer Tag für [ROOT.GetNameDef]!"
wuw_GER_realpolitik.9.t:	"[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
wuw_GER_realpolitik.9.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat erklärt, dass unsere Gründe für die Forderung nach ihrer Unterwerfung auf losen Dokumenten basieren, die keinen wirklichen Wert haben, und hat unsere Nation als Ganzes öffentlich denunziert. Es scheint, als seien sie entschlossen, für ihre Freiheit zu kämpfen, wenn es sein muss..."
wuw_GER_realpolitik.9.a:	"Sie werden ihre Entscheidung bereuen"
wuw_GER_realpolitik.10.t:	"[FROM.GetNameDefCap] Fordert die Wiederherstellung der Monarchie"
wuw_GER_realpolitik.10.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat verlangt, dass wir uns ihrer Herrschaft unterwerfen und ein Klientenstaat von ihnen werden, wie es ursprünglich geplant war, als wir 1918 zum ersten Mal einen von Hessen auf unserem Thron akzeptierten. Sollten wir ihren Forderungen nachgeben?"
wuw_GER_realpolitik.10.a:	"Vielleicht können sie uns vor den [SOV.GetAdjective]s schützen."
wuw_GER_realpolitik.10.b:	"Bei Sisu, wir werden nicht aufgeben!"
wuw_GER_realpolitik.11.t:	"[FROM.GetNameDefCap] Nimmt unsere Forderungen an"
wuw_GER_realpolitik.11.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat angekündigt, dass sich die [FROM.GetAdjective] Nation unserer Herrschaft unterwerfen wird, da es ein Fehler der früheren Regierung war, auf die Monarchie und den deutschen Thronanspruch zu verzichten."
wuw_GER_realpolitik.11.a:	"Ein großer Tag für [ROOT.GetNameDef]!"
wuw_GER_realpolitik.12.t:	"[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
wuw_GER_realpolitik.12.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat erklärt, dass unsere Gründe, ihre Unterwerfung zu fordern, so schwach sind wie unser Volk und unser nationaler Wille selbst. Es scheint, als seien sie entschlossen, für ihre Freiheit zu kämpfen, wenn es sein muss..."
wuw_GER_realpolitik.12.a:	"Sie werden ihre Entscheidung bereuen"
wuw_GER_realpolitik.13.t:	"[FROM.GetNameDefCap] verlangt, dass wir ihr Klientenstaat werden"
wuw_GER_realpolitik.13.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat verlangt, dass wir uns ihrer Herrschaft unterwerfen und ein Klientenstaat von ihnen werden, um uns leichter vor der [SOV.GetAdjective]-Bedrohung schützen zu können. Sollten wir ihren Forderungen nachgeben?"
wuw_GER_realpolitik.13.a:	"Vielleicht können sie uns vor den [SOV.GetAdjective] schützen."
wuw_GER_realpolitik.13.b:	"Bei Sisu, wir werden nicht aufgeben!"
wuw_GER_realpolitik.14.t:	"[FROM.GetNameDefCap] Nimmt unsere Forderungen an"
wuw_GER_realpolitik.14.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat verkündet, dass sich die [FROM.GetAdjective] Nation unserer Herrschaft unterwerfen wird, denn sie brauchen jede Hilfe, die sie bekommen können, wenn sie das Heimosodat fortführen wollen."
wuw_GER_realpolitik.14.a:	"Ein großer Tag für [ROOT.GetNameDef]!"
wuw_GER_realpolitik.15.t:	"[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
wuw_GER_realpolitik.15.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat erklärt, dass unsere Gründe, ihre Unterwerfung zu fordern, so schwach sind wie unser Volk und unser nationaler Wille selbst. Es scheint, dass sie für ihre Freiheit kämpfen wollen, wenn sie müssen..."
wuw_GER_realpolitik.15.a:	"Sie werden ihre Entscheidung bereuen"
wuw_GER_realpolitik.16.t:	"[FROM.GetNameDefCap] Fordert unsere Annektierung"
wuw_GER_realpolitik.16.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat erklärt, dass unsere Existenz so schnell wie möglich beendet werden muss, da wir in den [FROM.GetAdjective] Staat integriert werden sollen. Sollten wir ihre Forderungen akzeptieren?"
wuw_GER_realpolitik.16.a:	"Das ist das Ende der Fahnenstange für uns"
wuw_GER_realpolitik.16.b:	"Zu den Waffen, Männer!"
wuw_GER_realpolitik.17.t:	"[FROM.GetNameDefCap] Fordert kaiserliche Besitztümer"
wuw_GER_realpolitik.17.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat gefordert, dass wir ihnen ihre alten östlichen kaiserlichen Besitzungen zurückgeben, nämlich die Provinz Westpreußen, die Provinz Schlesien und die Provinz Posen. Das ist eine Menge Land, aber vielleicht ist die Rückgabe der einzige Weg, um den Abgrund der Unterwerfung zu vermeiden."
wuw_GER_realpolitik.17.a:	"Wenn es das ist, was nötig ist..."
wuw_GER_realpolitik.17.b:	"Sie werden es uns selbst aus den Händen reißen müssen!"
wuw_GER_realpolitik.18.t:	"[FROM.GetNameDefCap] Nimmt unsere Forderungen an"
wuw_GER_realpolitik.18.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat angekündigt, dass die [FROM.GetAdjective] Nation unsere alten östlichen imperialen Besitztümer an uns zurückgeben wird. Endlich sind die historischen Ungerechtigkeiten von Versailles ungeschehen gemacht worden!"
wuw_GER_realpolitik.18.a:	"Ein großer Tag für die [ROOT.GetAdjective] Nation!"
wuw_GER_realpolitik.19.t:	"[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
wuw_GER_realpolitik.19.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat erklärt, dass unsere Gründe für die Forderung nach ihrem Territorium durch Versailles hinfällig geworden sind, ein Vertrag, den wir nicht verletzen dürfen."
wuw_GER_realpolitik.19.a:	"Sie werden ihre Entscheidung bedauern."
wuw_GER_realpolitik.19.b:	"Dies ist nicht der richtige Zeitpunkt für Eile"
GER_kaiserreich_decided_not_to_attack_poland:	"Beschlossen, §YPolen§! wegen der abgelehnten Rückgabe alter kaiserlicher Besitztümer nicht anzugreifen"
wuw_GER_realpolitik.20.t:	"[FROM.GetNameDefCap] Fordert weitere Zugeständnisse"
wuw_GER_realpolitik.20.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat verlangt, dass wir noch mehr Territorium an sie abtreten. Diesmal fordern sie [87.GetName], [98.GetName] und [97.GetName]. Sie greifen wieder einmal in unseren Staat ein, aber vielleicht ist das der einzige Weg, die Vernichtung zu vermeiden. Sollten wir ihre Bedingungen akzeptieren?"
wuw_GER_realpolitik.20.a:	"Hoffentlich ist dies das letzte Mal..."
wuw_GER_realpolitik.20.b:	"Diesmal sind sie zu weit gegangen!"
wuw_GER_realpolitik.21.t:	"[FROM.GetNameDefCap] Nimmt unsere Forderungen an"
wuw_GER_realpolitik.21.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat angekündigt, dass die [FROM.GetAdjective] Nation [87.GetName], [98.GetName] und [97.GetName] an uns ausliefern wird. Vielleicht haben sie noch nicht herausgefunden, welche Pläne wir für den [FROM.GetAdjective] Staat haben."
wuw_GER_realpolitik.21.a:	"Ein großer Tag für die [ROOT.GetAdjective] Nation!"
wuw_GER_realpolitik.22.t:	"[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
wuw_GER_realpolitik.22.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat erklärt, dass unsere Gründe für die Forderung nach [FROM.GetAdjective] Land erfundene Lügen sind und sie nicht tatenlos zusehen werden, wie wir den Menschen ihr traditionelles [FROM.GetAdjective] Land stehlen. Es scheint, als hätten sie unseren Bluff durchschaut."
wuw_GER_realpolitik.22.a:	"Sie sind nicht auf unseren Trick hereingefallen, aber wir werden nicht zögern!"
wuw_GER_realpolitik.23.t:	"[FROM.GetNameDefCap] Lädt uns zu einer Allianz ein"
wuw_GER_realpolitik.23.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] ist heute in unserer Hauptstadt eingetroffen und hat uns ein Angebot unterbreitet. Sie möchten, dass wir ihrer Allianz beitreten und uns an allen bereits bestehenden Partnerschaften und Bündnissen beteiligen. Sie behaupten auch, dass sie uns bei der Rückeroberung unserer alten osmanischen Gebiete helfen werden. Werden wir dieses Angebot annehmen?"
wuw_GER_realpolitik.23.a:	"Es ist an der Zeit, unser Geburtsrecht zurückzufordern!"
wuw_GER_realpolitik.23.b:	"Wir brauchen ihre Freundschaft nicht!"
wuw_GER_realpolitik.24.t:	"[FROM.GetNameDefCap] Nimmt unser Angebot an"
wuw_GER_realpolitik.24.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat wohlwollend auf unser Angebot reagiert, und ihre Diplomaten sind in unserer Nation eingetroffen, um die notwendigen Dokumente zu unterzeichnen, die ihren vollen Beitritt zu unserer Allianz erleichtern. Sie würden unsere Hilfe bei der Rückeroberung alter osmanischer Gebiete gerne annehmen."
wuw_GER_realpolitik.24.a:	"Sehr gut"
wuw_GER_realpolitik.25.t:	"[FROM.GetNameDefCap] Lehnt unser Angebot ab"
wuw_GER_realpolitik.25.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat auf unsere Allianzeinladung mit starkem Unmut reagiert und behauptet, dass jede Art von Partnerschaft zwischen unseren Ländern vom Tisch ist und für immer sein wird. Es scheint, dass sie unsere Hilfe bei der Rückeroberung alter osmanischer Gebiete nicht wollen..."
wuw_GER_realpolitik.25.a:	"Sie verpassen etwas..."
wuw_GER_realpolitik.26.t:	"[FROM.GetNameDefCap] bittet um Handelsvereinbarungen"
wuw_GER_realpolitik.26.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat Diplomaten in unsere Hauptstadt geschickt, um die Aussicht auf komplizierte Handelsbeziehungen mit der [FROM.GetAdjective] Nation zu erörtern. Dies würde unsere Beziehungen vertiefen, aber es wird ihnen den Zugang zu unseren Ressourcen zu einem günstigeren Preis ermöglichen, was das Risiko birgt, unserer Wirtschaft zu schaden."
wuw_GER_realpolitik.26.a:	"Wir sehen darin kein Problem"
wuw_GER_realpolitik.26.b:	"Sie können Ihre Papiere zurück nach Berlin bringen!"
wuw_GER_realpolitik.27.t:	"Bürgerkrieg in [ROOT.GetNameDef]"
wuw_GER_realpolitik.27.desc:	"Nach einer langen Periode wachsender monarchistischer Gefühle scheinen die konservativen Elemente in [ROOT.GetAdjective] des Wartens auf einen friedlichen Regierungswechsel überdrüssig geworden zu sein. Sie behaupten, dass unsere Regierung darauf aus ist, alle Macht für sich zu behalten und eine Rückkehr zu vergangenen Epochen nicht zuzulassen. Nach einem intensiven Diskurs scheint die Diplomatie gescheitert zu sein und ein bewaffneter Konflikt ist die Folge."
wuw_GER_realpolitik.27.a:	"Für den König!"
wuw_GER_realpolitik.27.b:	"Wir müssen diesen Wahnsinn stoppen!"
wuw_GER_realpolitik.28.t:	"Bürgerkrieg in [ROOT.GetNameDef]"
wuw_GER_realpolitik.28.desc:	"Nach einer langen Periode wachsender demokratischer Gefühle scheinen die [ROOT.GetAdjective] demokratischen Elemente des Wartens auf einen friedlichen Regierungswechsel überdrüssig geworden zu sein. Sie behaupten, dass unsere derzeitige Regierung darauf aus ist, alle Macht für sich selbst zu behalten und gestürzt werden muss, damit die Demokratie erblühen kann. Nach einem intensiven Diskurs scheint die Diplomatie gescheitert zu sein und ein bewaffneter Konflikt ist entstanden."
wuw_GER_realpolitik.28.a:	"Für die Republik!"
wuw_GER_realpolitik.28.b:	"Wir müssen diesen Wahnsinn stoppen!"
wuw_GER_realpolitik.29.t:	"Bürgerkrieg in [ROOT.GetNameDef]"
wuw_GER_realpolitik.29.desc:	"Nach einer langen Periode wachsender faschistischer Stimmungen scheinen die faschistischen Elemente in [ROOT.GetAdjective] es leid zu sein, auf einen friedlichen Regierungswechsel zu warten, und haben eine örtliche Polizeistation bombardiert, was zu Kämpfen auf den Straßen führte. Nach intensiven Gesprächen scheint die Diplomatie gescheitert zu sein und es ist zu einem bewaffneten Konflikt gekommen. Wir können nur mit angehaltenem Atem abwarten, wo die Zukunft der [ROOT.GetAdjective] Nation liegt."
wuw_GER_realpolitik.29.a:	"Für die Revolution!"
wuw_GER_realpolitik.29.b:	"Wir müssen diesen Wahnsinn stoppen!"
wuw_GER_realpolitik.33.t:	"[FROM.GetNameDefCap] Fordert wirtschaftliche Integration"
wuw_GER_realpolitik.33.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] ist heute in unserer Hauptstadt eingetroffen und hat uns ein Angebot unterbreitet. Sie wollen, dass wir unsere Aktivitäten in der Zollunion ausweiten und unsere wirtschaftliche Integration mit ihnen vorantreiben. Das würde unserer Wirtschaft erheblich helfen, aber irgendetwas ist faul an der ganzen Sache..."
wuw_GER_realpolitik.33.a:	"Es ist zu gut, um es abzulehnen"
wuw_GER_realpolitik.33.b:	"Wir werden unsere wirtschaftliche Unabhängigkeit nicht aufgeben!"
wuw_GER_realpolitik.34.t:	"[FROM.GetNameDefCap] Nimmt unser Angebot an"
wuw_GER_realpolitik.34.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat positiv auf unser Angebot reagiert und ihre Diplomaten sind in unserer Nation eingetroffen, um die notwendigen Dokumente zu unterzeichnen, die ihre weitere wirtschaftliche Integration erleichtern."
wuw_GER_realpolitik.34.a:	"Wir sind dankbar für ihre Naivität"
wuw_GER_realpolitik.35.t:	"[FROM.GetNameDefCap] Lehnt unser Angebot ab"
wuw_GER_realpolitik.35.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat auf unsere Einladung zur Integration mit starkem Unmut reagiert und behauptet, dass jede Art von engerer wirtschaftlicher Partnerschaft zwischen unseren Ländern vom Tisch ist und für immer vom Tisch sein wird. Vielleicht konnten sie sehen, was wir für sie auf Lager hatten..."
wuw_GER_realpolitik.35.a:	"Schreckliche Nachrichten..."
wuw_GER_realpolitik.36.t:	"[FROM.GetNameDefCap] schlägt Vereinheitlichung vor"
wuw_GER_realpolitik.36.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat vorgeschlagen, dass sich unsere Nation mit der ihren vereinigt, da die Menschen die gleichen sind und sich unter einem stärkeren Staat besser geschützt fühlen werden. In der Botschaft steckt ein Hauch von Schwerfälligkeit und Aggression, aber vielleicht wäre es besser, Teil eines größeren Ganzen zu werden?"
wuw_GER_realpolitik.36.a:	"Die kleindeutsche Lösung war ein Fehler"
wuw_GER_realpolitik.36.b:	"Wir werden keine Kompromisse bei unserer Unabhängigkeit eingehen!"
wuw_GER_realpolitik.37.t:	"[FROM.GetNameDefCap] Nimmt unsere Forderungen an"
wuw_GER_realpolitik.37.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat bekannt gegeben, dass nach einer öffentlichen Abstimmung beschlossen wurde, dass die [FROM.GetAdjective] Nation von heute an offiziell aufhört zu existieren und ein integraler Bestandteil des [ROOT.GetAdjective] Reiches wird. Es scheint, dass unsere Überzeugungsarbeit erfolgreich war."
wuw_GER_realpolitik.37.a:	"Ein großer Tag für die [ROOT.GetAdjective] Nation!"
wuw_GER_realpolitik.38.t:	"[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
wuw_GER_realpolitik.38.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat erklärt, dass unsere Gründe für die Forderung nach [FROM.GetAdjective] Unterwerfung die Idee von [FROM.GetAdjective] Souveränität und Selbstbestimmung völlig untergraben. Es scheint, dass sie nicht Teil eines großgermanischen Staates sein wollen."
wuw_GER_realpolitik.38.a:	"In diesem Fall müssen wir ihre Wünsche respektieren."
wuw_GER_realpolitik.38.b:	"[FROM.GetNameDefCap] ist [ROOT.GetAdjective]!"
AUS_is_more_likely_to_accept_being_brothers_in_arms_flag:	"Das §Y[AUS.GetAdjective]§! Volk hat sich auf unsere Seite geschlagen"
wuw_GER_realpolitik.39.t:	"[FROM.GetNameDefCap] lädt uns zu einem Bündnis ein"
wuw_GER_realpolitik.39.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] ist heute in unserer Hauptstadt angekommen und hat uns ein Angebot unterbreitet. Sie möchten, dass wir ihrer Allianz beitreten und uns an allen bereits bestehenden Partnerschaften und Bündnissen beteiligen. Sie behaupten auch, dass sie uns bei der Rückeroberung unserer alten ungarischen Ländereien helfen und uns bei der Wiederherstellung Großungarns unterstützen werden. Sollten wir dieses Angebot annehmen?"
wuw_GER_realpolitik.39.a:	"Es ist an der Zeit, unser Geburtsrecht zurückzufordern!"
wuw_GER_realpolitik.39.b:	"Wir brauchen ihre Freundschaft nicht!"
wuw_GER_realpolitik.40.t:	"[FROM.GetNameDefCap] Nimmt unser Angebot an"
wuw_GER_realpolitik.40.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat wohlwollend auf unser Angebot reagiert, und ihre Diplomaten sind in unserer Nation eingetroffen, um die notwendigen Dokumente zu unterzeichnen, die ihren vollen Beitritt zu unserer Allianz erleichtern. Sie würden gerne unsere Hilfe bei der Rückeroberung alter ungarischer Gebiete in Anspruch nehmen."
wuw_GER_realpolitik.40.a:	"Sehr gut"
wuw_GER_realpolitik.41.t:	"[FROM.GetNameDefCap] Lehnt unser Angebot ab"
wuw_GER_realpolitik.41.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat auf unsere Allianzeinladung mit starkem Unmut reagiert und behauptet, dass jede Art von Partnerschaft zwischen unseren Ländern vom Tisch ist und für immer sein wird. Es scheint, dass sie unsere Hilfe bei der Rückeroberung alter ungarischer Gebiete nicht wollen..."
wuw_GER_realpolitik.41.a:	"Sie verpassen etwas..."
wuw_GER_realpolitik.42.t:	"[FROM.GetNameDefCap] Lädt uns zu einer Allianz ein"
wuw_GER_realpolitik.42.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] ist heute in unserer Hauptstadt eingetroffen und hat uns ein Angebot unterbreitet. Sie möchten, dass wir ihrem Bündnis beitreten und wieder Seite an Seite als Brüder kämpfen, so wie wir es im Großen Krieg getan haben. Sie behaupten auch, dass sie uns bei der Rückeroberung unserer alten österreichisch-ungarischen Ländereien unterstützen und uns helfen werden, die territoriale Integrität des Reiches wiederherzustellen. Sollten wir ihr Angebot annehmen?"
wuw_GER_realpolitik.42.a:	"Es ist an der Zeit, unser Geburtsrecht zurückzufordern!"
wuw_GER_realpolitik.42.b:	"Wir brauchen ihre Freundschaft nicht!"
wuw_GER_realpolitik.43.t:	"[FROM.GetNameDefCap] Nimmt unser Angebot an"
wuw_GER_realpolitik.43.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat wohlwollend auf unser Angebot reagiert, und ihre Diplomaten sind in unserer Nation eingetroffen, um die notwendigen Dokumente zu unterzeichnen, die ihren vollständigen Eintritt in Mitteleuropa ermöglichen. Sie würden gerne unsere Hilfe bei der Rückeroberung alter österreichisch-ungarischer Gebiete in Anspruch nehmen und wollen wieder Seite an Seite als Brüder gegen die Welt kämpfen."
wuw_GER_realpolitik.43.a:	"Prachtvoll"
wuw_GER_realpolitik.44.t:	"[FROM.GetNameDefCap] Lehnt unser Angebot ab"
wuw_GER_realpolitik.44.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat auf unsere Allianzeinladung mit starkem Unmut reagiert und behauptet, dass jede Art von Partnerschaft zwischen unseren Ländern vom Tisch ist und für immer sein wird. Es scheint, dass sie unsere Hilfe bei der Rückeroberung alter österreichisch-ungarischer Gebiete nicht wollen..."
wuw_GER_realpolitik.44.a:	"Sie sehen nicht, was das Beste für ihr eigenes Volk ist."
wuw_GER_realpolitik.45.t:	"[FROM.GetLeader] Möchte die Tschechoslowakei teilen"
wuw_GER_realpolitik.45.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] ist mit einem interessanten Angebot an uns herangetreten. Sie wollen die alten tschechoslowakischen Gebiete zwischen unseren beiden Nationen aufteilen. Klingt nach einer guten Idee, oder?"
wuw_GER_realpolitik.45.a:	"Abgemacht!"
wuw_GER_realpolitik.45.b:	"Wir können dem nicht zustimmen"
wuw_GER_realpolitik.46.t:	"[GER.GetNameDefCap] Fordert tschechoslowakische Ländereien"
wuw_GER_realpolitik.46.desc:	"[GER.GetLeader] von [GER.GetNameDef] hat gefordert, dass wir alle tschechoslowakischen Ländereien, die früher Teil des österreichisch-ungarischen Reiches waren, an sie und ihre Verbündeten zurückgeben. Das klingt nach einem schlechten Geschäft für uns, aber vielleicht können wir uns nicht gegen sie durchsetzen?"
wuw_GER_realpolitik.46.a:	"Wir können sie nicht beide bekämpfen..."
wuw_GER_realpolitik.46.b:	"Wir werden niemals kapitulieren!"
wuw_GER_realpolitik.47.t:	"[FROM.GetLeader] Akzeptiert die Teilung der Tschechoslowakei"
wuw_GER_realpolitik.47.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat sich unseren Forderungen gebeugt, so hart sie auch sein mögen. Unsere Truppen haben sich bereits in Bewegung gesetzt und es ist endlich an der Zeit, den längst verlorenen vergangenen Ruhm wiederherzustellen."
wuw_GER_realpolitik.47.a:	"Großartig"
wuw_GER_realpolitik.48.t:	"[FROM.GetLeader] lehnt die Teilung der Tschechoslowakei ab"
wuw_GER_realpolitik.48.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat uns unser rechtmäßiges Land verweigert und behauptet, wenn wir es haben wollen, müssen wir es uns mit eigenen Händen nehmen. Die [FROM.GetAdjective] reden groß daher, aber können sie es auch belegen?"
wuw_GER_realpolitik.48.a:	"Wir werden uns zurückholen, was uns gehört!"
wuw_GER_realpolitik.49.t:	"Unser Overlord übergibt uns an [GER.GetNameDef]"
wuw_GER_realpolitik.49.desc:	"Unser Oberbefehlshaber hat uns komplett verraten und sich dafür entschieden, unser Land an [GER.GetNameDef] zu übergeben. Sollen wir uns dieser Entscheidung fügen oder versuchen, uns dagegen zu wehren?"
wuw_GER_realpolitik.49.a:	"Nun gut..."
wuw_GER_realpolitik.49.b:	"Dann werden sie uns mit Gewalt nehmen müssen!"
wuw_GER_realpolitik.50.t:	"[FROM.GetNameDefCap] lehnt unser Angebot ab"
wuw_GER_realpolitik.50.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unseren Antrag abgelehnt, die alten österreichisch-ungarischen, tschechoslowakischen Gebiete aufzuteilen. Es sieht so aus, als ob der Deal nun doch geplatzt ist..."
wuw_GER_realpolitik.50.a:	"Dann können wir nicht viel tun..."
wuw_GER_realpolitik.51.t:	"Der Erste Berliner Preis"
wuw_GER_realpolitik.51.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat vor kurzem unsere, wie sie sagten, unrechtmäßige Besetzung unserer galizischen Ländereien angeprangert, da die Ländereien angeblich immer noch ein rechtmäßiger Teil des alten österreichisch-ungarischen Reiches sind, worauf [FROM.GetNameDef] und ihre Verbündeten vollen Anspruch erheben. Jetzt haben wir ein [FROM.GetAdjective]-Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir darauf reagieren?"
wuw_GER_realpolitik.51.a:	"Es ist es nicht wert, dafür Blut zu vergießen."
wuw_GER_realpolitik.51.b:	"Dann kommen Sie und holen Sie es sich!"
wuw_GER_realpolitik.52.t:	"[FROM.GetNameDefCap] Überträgt Galizien"
wuw_GER_realpolitik.52.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, seine Gebiete in Galizien an unsere Allianz abzutreten, und hat seine Truppen angewiesen, sich aus dem Gebiet zurückzuziehen. Wir haben wieder einmal gesiegt!"
wuw_GER_realpolitik.52.a:	"Dies ist ein großer Tag!"
wuw_GER_realpolitik.53.t:	"[FROM.GetNameDefCap] Bleibt standhaft"
wuw_GER_realpolitik.53.desc:	"Obwohl nicht völlig unerwartet, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation in höchste Alarmbereitschaft versetzt, nachdem er unser Ultimatum erhalten hatte, und einen Abgesandten geschickt, der erklärte, dass er in dem Streit keinen einzigen Schritt zurückweichen wird."
wuw_GER_realpolitik.53.a:	"Sie werden ihre Entscheidung noch bereuen!"
wuw_GER_realpolitik.53.b:	"Wir müssen die Sache auf sich beruhen lassen..."
wuw_GER_realpolitik.54.t:	"Der Zweite Berliner Preis"
wuw_GER_realpolitik.54.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat vor kurzem unsere, wie sie sagten, unrechtmäßige Besetzung unserer banatischen und siebenbürgischen Ländereien angeprangert, da diese Ländereien angeblich immer noch ein rechtmäßiger Teil des alten österreichisch-ungarischen Reiches sind, worauf [FROM.GetNameDef] und ihre Verbündeten vollen Anspruch erheben. Jetzt haben wir ein [FROM.GetAdjective] Ultimatum erhalten und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir darauf reagieren?"
wuw_GER_realpolitik.54.a:	"Es ist es nicht wert, dafür Blut zu vergießen."
wuw_GER_realpolitik.54.b:	"Dann kommen Sie und holen Sie es sich!"
wuw_GER_realpolitik.55.t:	"[FROM.GetNameDefCap] Überträgt alte ungarische Besitztümer"
wuw_GER_realpolitik.55.desc:	"\nDer vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, seine Gebiete in den alten ungarischen Landen an unsere Allianz abzutreten, und hat seine Truppen angewiesen, sich aus dem Gebiet zurückzuziehen. Wir haben wieder einmal gesiegt!"
wuw_GER_realpolitik.55.a:	"Dies ist ein großer Tag!"
wuw_GER_realpolitik.56.t:	"[FROM.GetNameDefCap] Bleibt standhaft"
wuw_GER_realpolitik.56.desc:	"Obwohl nicht völlig unerwartet, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation in höchste Alarmbereitschaft versetzt, nachdem er unser Ultimatum erhalten hatte, und einen Abgesandten geschickt, der erklärte, dass er in dem Streit keinen einzigen Schritt zurückweichen werde."
wuw_GER_realpolitik.56.a:	"Sie werden ihre Entscheidung noch bereuen!"
wuw_GER_realpolitik.56.b:	"Wir müssen die Sache auf sich beruhen lassen..."
wuw_GER_realpolitik.57.t:	"[FROM.GetNameDefCap] Integriert unsere Wirtschaft"
wuw_GER_realpolitik.57.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] ist einen Schritt weiter gegangen als ursprünglich versprochen und manipuliert die Märkte, um unsere Abhängigkeit von ihrer Wirtschaft weiter zu erhöhen. Wenn wir uns nicht sofort von ihnen lösen, wird dies praktisch das Ende unseres Status als unabhängige Nation bedeuten. Wie sollen wir das anstellen?"
wuw_GER_realpolitik.57.a:	"Wir werden die Situation akzeptieren müssen"
wuw_GER_realpolitik.57.b:	"Sieg oder Tod!"
wuw_GER_realpolitik.58.t:	"[FROM.GetNameDefCap] Akzeptiert die weitere Integration"
wuw_GER_realpolitik.58.desc:	"Die glorreiche Nachricht, dass die Führung von [FROM.GetNameDef] einer weiteren Integration mit uns zugestimmt hat, wurde heute im Reichstag mit großem Beifall aufgenommen. Das, was wir anbieten konnten, reichte ihnen offensichtlich aus, um das Angebot als vorteilhaft zu betrachten, trotz des leichten Einschnitts in ihre Souveränität."
wuw_GER_realpolitik.58.a:	"Großartig!"
wuw_GER_realpolitik.59.t:	"[FROM.GetNameDefCap] Lehnt weitere Integration ab"
wuw_GER_realpolitik.59.desc:	"Trotz der offensichtlichen Vorteile und weil es eindeutig das Beste für die Union ist, hat [FROM.GetNameDef] unseren Vorschlag für eine weitere Integration abgelehnt. Über die Gründe kann man nur spekulieren, aber es scheint, dass sie nicht die besten Interessen der Gewerkschaft im Sinn haben."
wuw_GER_realpolitik.59.a:	"Sie sind eine Gefahr für die Einheit der Konföderation!"
wuw_GER_realpolitik.59.b:	"Wir werden sie genau im Auge behalten."
wuw_GER_realpolitik.60.t:	"[FROM.GetNameDefCap] Fordert totale Integration"
wuw_GER_realpolitik.60.desc:	"Die Integration unserer Volkswirtschaften reichte offenbar nicht aus, um die [FROM.GetAdjective] zu befriedigen, denn [FROM.GetLeader] von [FROM.GetNameDef] ist heute einen Schritt weiter gegangen als ursprünglich versprochen und fordert nun unsere vollständige Integration in ihre Nation. Wenn wir uns nicht sofort von ihnen trennen, wird dies das Ende unseres Status als unabhängige Nation bedeuten. Wie sollen wir das bewerkstelligen?"
wuw_GER_realpolitik.60.a:	"Wir werden die Situation akzeptieren müssen"
wuw_GER_realpolitik.60.b:	"Sieg oder Tod!"
wuw_GER_realpolitik.61.t:	"[FROM.GetNameDefCap] Akzeptiert die totale Integration"
wuw_GER_realpolitik.61.desc:	"Die glorreiche Nachricht, dass die Führung von [FROM.GetNameDef] akzeptiert hat, sich in unsere Nation zu integrieren, wurde heute im Reichstag mit großem Beifall aufgenommen. Das, was wir anbieten konnten, war eindeutig genug für sie, um das Angebot trotz des Endes ihrer Souveränität als vorteilhaft zu betrachten."
wuw_GER_realpolitik.61.a:	"Großartig!"
wuw_GER_realpolitik.62.t:	"[FROM.GetNameDefCap] Lehnt die totale Integration ab"
wuw_GER_realpolitik.62.desc:	"Trotz der offensichtlichen Vorteile und weil es eindeutig das Beste für die Union ist, hat [FROM.GetNameDef] unseren Vorschlag für eine vollständige Integration abgelehnt. Über die Gründe kann man nur spekulieren, aber es scheint, dass sie nicht die besten Interessen der Gewerkschaft im Sinn haben."
wuw_GER_realpolitik.62.a:	"Sie sind eine Gefahr für die Einheit der Föderation!"
wuw_GER_realpolitik.62.b:	"Wir werden sie genau im Auge behalten."
wuw_GER_realpolitik.63.t:	"[FROM.GetNameDefCap] Lädt uns zu einer Zollunion ein"
wuw_GER_realpolitik.63.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] ist mit einem Angebot an uns herangetreten, einer Zollunion beizutreten, die die Wirtschaft unserer beiden Nationen nur stärken wird. Das klingt nach einem Angebot, das man sich nicht entgehen lassen sollte, oder?"
wuw_GER_realpolitik.63.a:	"Wir werden es gerne annehmen."
wuw_GER_realpolitik.63.b:	"Klingt für mich verdächtig..."
GOT_GER_integrated_puppet_economies.01.t:	"[FROM.GetAdjective] Entwicklungshilfe"
GOT_GER_integrated_puppet_economies.01.desc:	"Die Deutschen investieren in Industrien, um unsere Militärproduktion weiterzuentwickeln und einen Teil unserer Wirtschaft zu integrieren. Das wird sicherlich unsere Produktivität steigern, aber es wird auch unsere Autonomie und Unabhängigkeit schmälern."
GOT_GER_integrated_puppet_economies.01.a:	"Wir müssen dies zu unseren Gunsten nutzen."
GOT_GER_integrated_puppet_economies.02.t:	"[FROM.GetAdjective] Ausbeutungsprogramm"
GOT_GER_integrated_puppet_economies.02.desc:	"Um ihre eigenen Industriekapazitäten zu stärken, betreiben die Deutschen eine Ausbeutungspolitik, um alle unsere Ressourcen und unsere Produktivität zu nutzen, die uns auf dem Trockenen sitzen lassen wird."
GOT_GER_integrated_puppet_economies.02.a:	"Wir müssen dies zu unseren Gunsten ausnutzen."
GER_idea_added_for_limited_time:	"Die folgende Idee wird für §Y$TIME$§! Tage hinzugefügt: \n$IDEA$"
wuw_GER_the_battle_of_britain.01.t:	"Die Schlacht um Großbritannien"
wuw_GER_the_battle_of_britain.01.desc:	"$GER_hermann_goring$ ist erpicht darauf, die Überlegenheit der Luftwaffe zu demonstrieren und den Geist des [ENG.GetAdjective] Volkes zu brechen. Er will dies erreichen, indem er Londons Wahrzeichen, den Big Ben, bombardiert. Er argumentiert, dass dies [ENG.GetNameDef] in die Knie zwingen und den Krieg verkürzen wird. Außerdem garantiert er persönlich, dass während dieser Kampagne keine einzige Bombe Berlin treffen wird, oder Sie können ihn Hermann 'Meier' nennen."
wuw_GER_the_battle_of_britain.01.a:	"Lassen Sie es ihn versuchen"
wuw_GER_the_battle_of_britain.01.b:	"Er verspricht zu viel"
GER_unlocks_big_ben_raid_tt:	"Schaltet §YLuftangriff§! auf §Yden Big Ben§! frei"
wuw_GER_uncertain_future.01.t:	"$GER_growing_public_dissent_mission$"
wuw_GER_uncertain_future.01.desc:	"Nach dem Ende des Bürgerkriegs bauen wir die Nation langsam wieder auf. Die Menschen sehnen sich nach Stabilität und Sicherheit, haben aber zunehmend das Gefühl, ohne ein übergeordnetes Ziel zu sein. Die Bevölkerung wird dieser Ungewissheit überdrüssig und fordert einen stabilen Kurs."
wuw_GER_uncertain_future.01.a:	"Wir müssen schnellstens handeln!"
wuw_GER_uncertain_future.02.t:	"[ROOT.GetNameDefCap] Steht vor einer ungewissen Zukunft"
wuw_GER_uncertain_future.02.desc:	"Nach dem Ende des Bürgerkriegs baut sich die deutsche Nation langsam wieder auf, aber die Menschen sehnen sich nach Stabilität und Sicherheit. [ROOT.GetLeader] hat keine Anstrengungen unternommen, um voranzukommen und scheint kein Interesse daran zu haben, zu entscheiden, wie die Zukunft des neuen deutschen Staates aussehen soll. Das hat in der Bevölkerung große Besorgnis ausgelöst, die sich unbedingt von ihrer zerrütteten Vergangenheit lösen möchte."
wuw_GER_uncertain_future.02.a:	"Ein Aufruhr in der Bevölkerung, oder?"
wuw_GER_german_politics.01.t:	"Die Rückkehr der Demokratie"
wuw_GER_german_politics.01.desc:	"Mit der Rückkehr der freien Wahlen ist das [ROOT.GetAdjective] Volk in Scharen zu den Wahllokalen geströmt, um über die Zukunft Deutschlands zu entscheiden. Eine gewisse Euphorie macht sich in den Straßen breit und das Gefühl, die dunklen Tage endlich hinter sich gelassen zu haben, lässt diesen Tag eher wie eine Feier als eine nationale Wahl erscheinen."
wuw_GER_german_politics.01.a:	"Wir brauchen einen vorsichtigen Traditionalisten"
wuw_GER_german_politics.01.b:	"Wir brauchen einen vorausschauenden Sozialisten"
wuw_GER_german_politics.02.t:	"Eine Führungspersönlichkeit für das Volk"
wuw_GER_german_politics.02.desc:	"Mit der Rückbesinnung auf die Ideale des Spartakusbundes geht der Wunsch einher, das Volk ein wenig aktiver einzubeziehen. Es wurde eine Wahl ausgeschrieben, um die Person zu wählen, die uns vertreten soll, und da alle Stimmzettel ausgezählt sind, scheint das Ergebnis sehr ausgeglichen zu sein. Die Menschen halten beide Kandidaten eindeutig für geeignete Führungspersönlichkeiten für [ROOT.GetNameDef], aber leider können wir nur einen ernennen."
wuw_GER_german_politics.02.a:	"Heinrich Brandler ist die richtige Wahl!"
wuw_GER_german_politics.02.b:	"Behalten Sie Ernst Thälmann an der Macht!"
wuw_GER_german_politics.02.c:	"Wir brauchen einen pragmatischen Sozialisten!"
GOT_GER_amerikabomber.01.t:	"Das Amerikabomber-Projekt"
GOT_GER_amerikabomber.01.desc:	"Die Entscheidung, einen Langstreckenbomber zu bauen, ist bereits gefallen. Die Entwürfe verschiedener Teams wurden eingereicht, die alle versprechen, eine Maschine zu bauen, die den Krieg über den Atlantik tragen kann."
GOT_GER_amerikabomber.01.a:	"$GER_focke_wulf_organization$"
GOT_GER_amerikabomber.01.b:	"$GER_heinkel_organization$"
GOT_GER_amerikabomber.01.c:	"$GER_junkers_organization$ $GER_messerschmitt_organization$"
GOT_GER_amerikabomber.01.d:	"$GER_messerschmitt_organization$"
when_intercontinental_bomber_project_is_completed_tt:	"Wenn das Sonderprojekt §Y$sp_air_intercontinental_bomber$§! abgeschlossen ist:"
GER_amerikabomber_focke_wulf_flag:	"§Y$GER_focke_wulf_organization$§! wurde mit der Entwicklung des §YAmerikabomber§! beauftragt"
GER_amerikabomber_heinkel_flag:	"§Y$GER_heinkel_organization$§! wurde der Entwicklung des §YAmerikabomber§! zugewiesen"
GER_amerikabomber_messerschmitt_flag:	"§Y$GER_messerschmitt_organization$§! wurde der Entwicklung des §YAmerikabomber§! zugewiesen"
GER_amerikabomber_junkers_flag:	"§Y$GER_junkers_organization$§! wurde der Entwicklung des §YAmerikabomber§! zugeordnet"
GER_operation_panzerfaust_events.01.t:	"Eine Frage der Loyalität von Horthy"
GER_operation_panzerfaust_events.01.desc:	"Die Möglichkeit, dass unser Verbündeter Miklós Horthy geheime Friedensgespräche mit unseren Feinden führt, ist uns aufgefallen. Wir müssen Druck auf ihn ausüben, um sicherzustellen, dass Ungarn unserer Sache treu bleibt."
GER_operation_panzerfaust_events.01.a:	"Fordern Sie seine Unterwerfung unter den Führer"
GER_operation_panzerfaust_events.01.b:	"Das ist eine Überreaktion, Horthy ist loyal!"
GER_operation_panzerfaust_events.02.t:	"[GER.GetLeader] Fordert den Rücktritt von Horthy"
GER_operation_panzerfaust_events.02.desc:	"Heute haben wir die Nachricht erhalten, dass die Deutschen den Rücktritt von Miklós Horthy zugunsten von Ferenc Szálasi gefordert haben, den sie für vertrauenswürdiger halten. Sie haben auch erklärt, dass eine Intervention in unserem Land notwendig sein könnte, wenn sie ihren Willen nicht durchsetzen können."
GER_operation_panzerfaust_events.02.a:	"Wir sind nicht in der Lage, uns ihnen zu widersetzen."
GER_operation_panzerfaust_events.02.b:	"Sie haben hier keine Macht"
GER_operation_panzerfaust_events.03.t:	"Ungarn knickt ein"
GER_operation_panzerfaust_events.03.desc:	"Miklós Horthy ist eingeknickt und Ungarn ist nun vollständig in unserer Hand. Es scheint, dass unsere Einschüchterungsversuche erfolgreich waren."
GER_operation_panzerfaust_events.03.a:	"Fantastisch"
GER_operation_panzerfaust_events.04.t:	"Horthy bleibt trotzig"
GER_operation_panzerfaust_events.04.desc:	"Miklós Horthy hat heute angekündigt, dass er dem deutschen Druck nicht nachgeben wird und dass Ungarn nicht in deutsche Hände fallen wird. Da bloßer diplomatischer Druck nicht auszureichen scheint, müssen wir jetzt entscheiden, wie wir weiter vorgehen."
GER_operation_panzerfaust_events.04.a:	"Wir sind zu weit gegangen. Starten Sie die Operation Margarethe!"
GER_operation_panzerfaust_events.04.b:	"Wir werden seine Spielchen nicht mitmachen."
GER_operation_panzerfaust_events.04.c:	"Dann überlassen wir das unseren Agenten..."
GER_operation_panzerfaust_events.05.t:	"Deutschland startet die Operation Margarethe"
GER_operation_panzerfaust_events.05.desc:	"Der Führer hält an seiner Behauptung fest und hat nun den Beginn der Operation Margarethe angekündigt, eine Invasion unseres Landes mit dem Ziel der Unterwerfung. Wir müssen standhaft bleiben!"
GER_operation_panzerfaust_events.05.a:	"Sollen sie doch kommen"
GER_operation_panzerfaust_events.06.t:	"Deutschland bemüht sich um Deeskalation"
GER_operation_panzerfaust_events.06.desc:	"Trotz aller Bedrohungen unserer Grenzen und unserer Souveränität hat Deutschland nun versucht, die Situation zu deeskalieren, indem es von seinen Ansprüchen abgerückt ist."
GER_operation_panzerfaust_events.06.a:	"Dann soll es so sein"
GER_operation_panzerfaust_events.07.t:	"Die Operation Panzerfaust ist gescheitert"
GER_operation_panzerfaust_events.07.desc:	"Wir hatten gehofft, dass dies der letzte Schlag gegen die immer rebellischeren Ungarn sein würde, aber die Operation Panzerfaust wurde heute vereitelt, nachdem unsere Agenten vor der Residenz von Horthy festgenommen wurden."
GER_operation_panzerfaust_events.07.a:	"Sie werden vorerst außerhalb unseres Zugriffs bleiben müssen."
GER_operation_panzerfaust_events.08.t:	"Operation Panzerfaust ist ein Erfolg"
GER_operation_panzerfaust_events.08.desc:	"Wir haben Horthy und seinen Sohn erfolgreich gefangen genommen und anschließend die Macht an Ferenc Szálasi übergeben. Damit ist Ungarn nun der Sache treu."
GER_operation_panzerfaust_events.08.a:	"Hervorragend"
GER_operation_panzerfaust_events.09.t:	"Komplott gegen Horthy vereitelt"
GER_operation_panzerfaust_events.09.desc:	"Heute erhielten wir die Nachricht, dass ein Komplott der Deutschen, Horthy und seinen Sohn abzusetzen und zu entführen, gescheitert ist, nachdem ihre Agenten vor ihrer Residenz gefangen genommen wurden."
GER_operation_panzerfaust_events.09.a:	"Wir sind sicher, vorerst"
GER_operation_panzerfaust_events.10.t:	"Horthy gekidnappt"
GER_operation_panzerfaust_events.10.desc:	"Heute sind die Deutschen mit Panzern auf den Burgberg gerollt und haben Miklós Horthy entführt. Es wird gemunkelt, dass sie Miklós Horthy jr. entführt und nach Österreich gebracht haben. Sie haben die Nachricht verbreitet, dass wir uns ergeben müssen oder sie werden uns dazu zwingen."
GER_operation_panzerfaust_events.10.a:	"Wir werden ihre Bedingungen akzeptieren müssen."
GER_operation_panzerfaust_events.10.b:	"Wir werden niemals kapitulieren!"
GOT_GER_fading_eagle.01.t:	"[FROM.GetNameDefCap] Fordert unsere Unterwerfung"
GOT_GER_fading_eagle.01.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat inmitten einer Kampagne zur Wiedererlangung der Kontrolle über den Balkan und das ehemalige Italienische Reich verlangt, dass wir uns ihrer Autorität unterwerfen. Wir haben im Moment nicht wirklich die Macht, uns ihnen zu widersetzen, aber vielleicht ist dies die Gelegenheit zur Freiheit, auf die wir gewartet haben?"
GOT_GER_fading_eagle.01.a:	"Wir müssen es vorerst zulassen"
GOT_GER_fading_eagle.01.b:	"Wir werden unsere Souveränität niemals aufgeben!"
GOT_GER_fading_eagle.02.t:	"[FROM.GetNameDefCap] Nimmt unsere Forderungen an"
GOT_GER_fading_eagle.02.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat angekündigt, dass die [FROM.GetAdjective] Nation sich uns ausliefern und unserer Sache bis zum Ende treu bleiben wird."
GOT_GER_fading_eagle.02.a:	"Wir gewinnen die Kontrolle zurück!"
GOT_GER_fading_eagle.03.t:	"[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
GOT_GER_fading_eagle.03.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat erklärt, dass sie eine erneute Unterwerfung nicht akzeptieren werden und dass wir uns ihr Land mit Gewalt nehmen müssen, wenn wir es wollen."
GOT_GER_fading_eagle.03.a:	"Sie werden ihre Entscheidung bereuen."
GOT_GER_fading_eagle.03.b:	"Wir können uns keinen weiteren Feind leisten"
GER_inner_circle_himmler.00.t:	"Himmlers Aufgaben"
GER_inner_circle_himmler.00.desc:	"Himmler hat erheblichen Einfluss auf die deutsche Politik und die politischen Entscheidungen, nachdem er die Kontrolle über die SS und die Gestapo übernommen hat. Das macht ihn zwar zu einer mächtigen Figur in deutschen Angelegenheiten, aber er hat nur begrenzte Zeit, um eine dieser Organisationen zu stärken. Die Frage ist, welche von beiden wird Vorrang haben?"
GER_inner_circle_himmler.00.a:	"Die Waffen-SS ist unsere Priorität"
GER_inner_circle_himmler.00.b:	"Konzentrieren Sie sich auf die Verbesserung unseres Geheimdienstes"
GER_inner_circle_himmler_ss_tt:	"§Y$GER_heinrich_himmler$§! wird bald mit der Arbeit an dem Schwerpunkt §Y$GER_expand_ss_security_duties$§! beginnen."
GER_inner_circle_himmler_gestapo_tt:	"§Y$GER_heinrich_himmler$§! wird bald mit der Arbeit an dem Schwerpunkt §Y$GER_expand_gestapo$§! beginnen."
GER_inner_circle.01.t:	"Der Aufstieg von [GetAscendingAdvisorName]"
GER_inner_circle.01.desc:	"[GetAscendingAdvisorName] hat starken Ehrgeiz bewiesen und an Einfluss innerhalb der Partei gewonnen. Seine Bemühungen, mehr Kontrolle zu erlangen, haben jedoch zu Einwänden anderer Mitglieder geführt, so dass es zu einem Machtkampf gekommen ist. Die Frage ist, ob [GetAscendingAdvisorName] [GER.GetLeader] genug beeindruckt hat, um sich einen Platz im Inneren Kreis zu sichern."
GER_inner_circle.01.a:	"Ersetzen Sie [GetAscendedAdvisorName1]"
GER_inner_circle.01.b:	"Ersetzen Sie [GetAscendedAdvisorName2]"
GER_inner_circle.01.c:	"Ersetzen Sie [GetAscendedAdvisorName3]"
GER_inner_circle.01.d:	"[GetAscendingAdvisorName] ist des Vertrauens des Führers nicht würdig"
GER_inner_circle.02.t:	"Ein neuer Führer steigt auf"
GER_inner_circle.02.desc:	"Die Reichsleiter, die [GER.GetLeader] am nächsten stehen, haben Zweifel an [GER.GetLeader.GetHersHis] Führung und der Vision, die [GER.GetLeader.GetSheHe] für die Zukunft von [GER.GetNameDef] hat. Sie planen nun, [GER.GetLeader] von der Macht zu verdrängen und den Titel des Führers für sich selbst zu beanspruchen. Die Frage ist, wer wird sich über die anderen erheben und den Weg in eine glorreiche Zukunft anführen?"
GER_inner_circle.02.a:	"[GetAscendedAdvisorName1] wird die Nation anführen."
GER_inner_circle.02.b:	"[GetAscendedAdvisorName2] ist am besten für diese Aufgabe geeignet."
GER_inner_circle.02.c:	"[GetAscendedAdvisorName3] wird ein wahrer Führer des [ROOT.GetAdjective] Volkes sein."
GER_inner_circle.02.d:	"Wir sind nicht bereit für einen Wechsel in der Führung."
GER_inner_circle.03.t:	"[GetIntrigueCharacterName]'s Industrieplan in Frage gestellt"
GER_inner_circle.03.desc:	"Zwischen den Rivalen im Inneren Kreis von [GER.GetLeader] ist ein erbitterter Machtkampf ausgebrochen. Die Spannungen haben zugenommen, seit [GetIntrigueCharacterName] an Einfluss und Autorität gewonnen hat. [GetIndustrialReichsleiterNames] hat sich über die Methoden des jeweils anderen geäußert, wie man die deutsche Industrie und die Rüstungsproduktion am besten leitet, während er gleichzeitig um [GER.GetLeader]s Gunst buhlt."
GER_inner_circle.03.a:	"[GetIntrigueCharacterName] hat das volle Vertrauen des Führers."
GER_inner_circle.03.b:	"$GER_fritz_todt$ hat die nötige Erfahrung, um dies zu bewältigen."
GER_inner_circle.03.c:	"$GER_albert_speer$ wird das Industriegeschäft übernehmen."
GER_inner_circle.03.d:	"$GER_hermann_goring$ ist die rechte Hand des Führers, setzen Sie ihn ein!"
GER_inner_circle_industrial_reichsleiter:	"[GetIndustrialReichsleiterNames]"
GER_inner_circle_industrial_reichsleiter_all:	"$GER_fritz_todt$, $GER_albert_speer$, und $GER_hermann_goring$"
GER_inner_circle_industrial_reichsleiter_no_goring:	"$GER_fritz_todt$ und $GER_albert_speer$"
GOT_guarantee_events.01.t:	"Garantie der polnischen Souveränität"
GOT_guarantee_events.01.desc:	"Es ist klar, dass [GER.GetLeader] nicht zur Vernunft zu bringen ist und vor der Weltherrschaft nicht zurückschrecken wird. [GER.GetLeader.GetSheHe] ist überzeugt, dass es niemand wagt, sich [GER.GetNameDef] und seinen wachsenden Ambitionen und seinem Hunger nach Territorium in den Weg zu stellen."
GOT_guarantee_events.01.a:	"Wir müssen den Polen unseren Schutz anbieten!"
GOT_guarantee_events.01.b:	"Lassen Sie [GER.GetLeader] tun, was [GER.GetLeader.GetSheHe] will."
GOT_newsevents.1.t:	"Der Aufstieg von [FROM.GetNameDef]"
GOT_newsevents.1.desc:	"Die [FROM.GetAdjective] haben es geschafft, die Europäer zu unterwerfen und sich als Hegemon über den Kontinent zu etablieren und haben Schritte unternommen, die neu eroberten Gebiete zu integrieren. Die [FROM.GetAdjective] Regierung hat versucht, das Volk hinter dem Staat und den sozialistischen Idealen zu versammeln und mehrere pan-nationalistische Propagandakampagnen gestartet, um die Unterstützung des Proletariats zu erhöhen. \n[FROM.GetLeader] hat erklärt, dass die vereinigten Proletarier Europas von nun an als '[From.GetNameDef]' bekannt sein werden."
GOT_newsevents.1.a:	"Wir erheben uns gemeinsam"
GOT_newsevents.1.b:	"Das verheißt nichts Gutes"
