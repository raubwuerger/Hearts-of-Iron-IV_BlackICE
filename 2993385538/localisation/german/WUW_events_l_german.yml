 #Relocate Air Industries

 ### King's Surrender Chain

 #Unknown Sympathies
congo_independence_struggle.10.t:	" [FROM.GetNameDefCap] ist bereit, den Status eines Dominions zu akzeptieren"
congo_independence_struggle.10.b:	"Nein, wir können sie zu einer weiteren Integration drängen."

 #The King's Surrender
congo_independence_struggle.11.a:	"Es ist an der Zeit, an die Arbeit zu gehen und unser neues Dominion aufzubauen!"

 #Royal Prisoner
congo_independence_struggle.13.a:	"Perfekt!"
congo_independence_struggle.14.t:	" [FROM.GetNameDefCap] droht mit Krieg"
congo_independence_struggle.14.d:	"Ein sehr kriegerisch auftretender Delegierter aus [COG.GetNameDef] traf sich vorhin mit dem Kolonialgouverneur. Sichtlich frustriert über den bisherigen Verlauf der Gespräche haben sie ein Ultimatum gestellt. \n\nEntweder akzeptieren wir ihre Unabhängigkeit mit sofortiger Wirkung, oder sie werden die Glocken der Freiheit gegen uns läuten. Wir erhalten bereits Berichte über die Versammlung von Milizeinheiten, und es gab bereits eine Reihe von Scharmützeln gegen Garnisonen der Force Publique. Bislang ist noch niemand ums Leben gekommen, doch bei derart hohen Spannungen ist dies nur eine Frage der Zeit."
congo_independence_struggle.14.a:	"Dann sollen sie Krieg bekommen! [COG.GetNameDef] gehört UNS!"

 #The King's Surrender - Triggered via capitulation rather than event
congo_independence_struggle.15.d:	"Einheiten der loyalistischen Force Publique haben heute versucht, Anführer der Unabhängigkeitsbewegung zusammenzutreiben und zu verhaften. [COG.GetAdjective]-Miliz schritt ein, und es kam zu einem Schusswechsel zwischen ihnen. Es scheint, als sei die Diplomatie gescheitert, und dieser Unabhängigkeitskrieg hat offiziell begonnen."

 ## King's Surrender Chain Ends

 # Belgium demands special treatment (-_-)ゞ゛ - Event for any occupier of Belgium 
congo_independence_struggle.17.b:	"Sie sind wahnsinnig. Organisieren Sie unverzüglich eine Expeditionstruppe, um die Ordnung wiederherzustellen!"
congo_independence_struggle.18.t:	"[FROM.GetNameDefCap] Lassen Sie uns gehen"

congo_independence_struggle.19.a:	"Der Sieg wird ihnen zuteilwerden!"
congo_independence_struggle.20.t:	"Der Kongo erklärt den Unabhängigkeitskrieg!"

## France Limited War

 # To Belgium: Inform Belgium of Limited War goals
congo_independence_struggle.24.t:	"Die Loyalisten in Léopoldville eskalieren den Konflikt"

 # To France: Paris has fallen! Sue for peace?
congolese_civil_war_starting_congo_side_tt:	"Die belgischen Loyalisten werden einen Bürgerkrieg gegen uns anzetteln. Wir werden in der Lage sein, unseren ehemaligen Oberherren Frieden aufzuzwingen und die volle Unabhängigkeit zu erlangen, wenn wir §YLéopoldville§!, §YÉlisabethville§! und §YStanleyville§!. \n\nEbenso werden sie in der Lage sein, uns Frieden aufzuzwingen und die Kontrolle über unser Land zu behalten, indem sie §YLéopoldville§!, §YÉlisabethville§! und §YStanleyville§!."
wuw_GER_releasable.1.t:	"Eine Hauptstadt für das deutsche Volk"
wuw_GER_releasable.1.desc:	"Im Zuge der Reform des deutschen Staates haben viele unserer Politiker argumentiert, dass unsere Hauptstadt neu überdacht werden muss. Sie behaupten, dass sie Titeln wie "Hauptstadt des deutschen Volkes" nicht gerecht wird. Wohin möchten wir in einem solchen Fall unsere Hauptstadt verlegen?"

 # To Belgium: Accept peace offer?
wuw_GER_releasable.1.d:	"Unsere Hauptstadt ist so, wie sie ist, in Ordnung"
wuw_GER_releasable.2.t:	"Die Wahl"
wuw_GER_releasable.2.a:	"Pierre Dupong übernimmt das Ruder"

wuw_GER_civil_war.1.desc:	"Nach dem jüngsten Putsch der Wehrmacht gegen das Nazi-Regime strömen nun viele Kommunisten, die zuvor das Land verlassen hatten, über unsere Grenzen zurück, da sie ihre Chance sehen, uns im Kampf gegen diejenigen zu unterstützen, die ihnen einst Unrecht getan haben. Sollen wir ihnen erlauben zu kämpfen, oder sollten wir versuchen, ihre Rückkehr unter den Teppich zu kehren, in der Hoffnung, dass sie nicht populär genug werden, um eine eigene Revolution anzuzetteln?"

 ### King's Surrender Chain End

 ### Spanish Civil War Interaction Events ###

GER_thalmann_freed_from_prison_flag:	"§YErnst Thälmann§! wurde aus dem Gefängnis befreit"

wuw_GER_civil_war.3.a:	"Eine neue Bismarckjugend sollte oberste Priorität haben"
wuw_GER_civil_war.3.b:	"Wir sollten, wenn überhaupt, die Eiserne Front stärken"
wuw_GER_civil_war.4.desc:	"Da der Bürgerkrieg beendet und das Nazi-Regime vollständig zerschlagen ist, stellt sich die Frage, ob es wirklich klug ist, offen politischen paramilitärischen Organisationen zu gestatten, in unserem Land frei zu operieren. Angesichts der Tatsache, dass die Junta kaum oder gar keine formelle Kontrolle über sie hat, könnte es ratsam sein, sie zu verbieten und ihre Auflösung zu erzwingen. Andernfalls könnten wir vielleicht versuchen, sie beizubehalten und sie lediglich so weit zu verkleinern, dass sie keine Bedrohung mehr darstellen?"
wuw_GER_civil_war.4.a:	"Versuchen, sie vollständig aufzulösen"

wuw_GER_civil_war.5.t:	"Der vierte Schlesische Aufstand"

wuw_GER_civil_war.6.desc:	"Nach einer Zeit, die von heftigen Unruhen unter dem Proletariat geprägt war, hat sich die Lage in [ROOT.GetNameDef] verschärft. Die Streitkräfte von [ROOT.GetLeader] wurden nach anhaltenden Aufständen in mehreren Bundesstaaten überrannt. Wie sich dieser Aufstand weiterentwickeln wird, bleibt abzuwarten."
wuw_GER_civil_war.6.b:	"Wir werden diesen Pöbel vernichten!"

GER_andrey_shckuro_and_pyotr_krasnov_join_tt:	"§YAndrej Schkuro§! und §YPjotr Krasnow§! werden sich uns als Generäle anschließen\n"
GER_white_russian_exiles_divisions_recruitment_tt:	"Erhalten Sie zwei Kosaken-Einheiten und eine russische §YInfanterie§! Einheit"

wuw_GER_civil_war.7.t:	"Die Loyalität der Kriegsmarine"
wuw_GER_civil_war.7.desc:	 "Uns ist zu Ohren gekommen, dass sich die Kriegsmarine möglicherweise auf die Seite von [ROOT.GetLeader] stellen wird, wenn wir unseren Staatsstreich durchführen. Der Grund scheint zu sein, dass ihrem Anführer Erich Raeder von [ROOT.GetLeader] versprochen wurde, dass sein Teil der Streitkräfte unter seinem Regime umfangreiche Investitionen und Freiheiten erhalten wird, etwas, das die alte Regierung nicht erreicht hat. Vielleicht sollten wir ähnliche Versprechen machen, um ihn auf unsere Seite zu ziehen?"
wuw_GER_civil_war.7.a:	"Wir müssen uns ihre Loyalität um jeden Preis sichern"
wuw_GER_civil_war.7.b:	"Wir dürfen Erich Raeder nicht beschwichtigen"

GER_chose_to_not_placate_erich_raeder_tt:	"Nur ein kleiner Teil der Kriegsmarine wird sich bei einem Staatsstreich auf unsere Seite schlagen, doch wir werden nicht an irgendwelche Versprechen gegenüber Erich Raeder gebunden sein"
wuw_GER_civil_war.8.t:	"Der Staatsstreich der Kriegsmarine"
wuw_GER_civil_war.8.desc:	"Jahre, nachdem wir versprochen hatten, die Marine wieder zu ihrem früheren Glanz zu führen, scheint es, als hätten Erich Raeder und die Kriegsmarine genug von unserem endlosen Hinauszögern, denn sie haben heute früh einen Staatsstreich gegen unsere Regierung versucht. Zu unserem Glück ist dieser gescheitert, doch um sicherzustellen, dass sich so etwas nicht wiederholt, müssen wir zahlreiche hochrangige Beamte und Elemente innerhalb unserer Streitkräfte entlassen ..."

wuw_GER_civil_war.8.b:	"Der Staat wird es bereuen, seine Versprechen gebrochen zu haben"
this_will_happen_tt:	"Folgendes wird geschehen:\n"

GER_mackensen_went_into_retirement_tt:	"§YAugust von Mackensen§! ist nicht mehr §YFeldmarschall§!"
GER_recalled_hans_krebs_from_russia_flag:	"§YHans Krebs§! wurde aus §Y[SOV.GetNameDef]§!"

wuw_GER_legions.1.desc:	"Angesichts der jüngsten Erklärung, dass es unsere Absicht ist, die Grenzen des Friedensvertrags von Brest-Litowsk wiederherzustellen, haben sich einige im Exil lebende georgische Generäle und Soldaten an uns gewandt, um uns bei der Rückeroberung ihrer ehemaligen Heimat zu unterstützen – im Gegenzug für das Versprechen, den georgischen Staat wiederherzustellen und ihm die Herrschaft über den Kaukasus zu gewähren. Sollten wir ihre Hilfe annehmen?"
wuw_GER_legions.1.b:	"Wir haben keinen Bedarf an ihnen"


wuw_GER_legions.3.a:	 "Wir heißen den Feind unseres Feindes stets willkommen!"
wuw_GER_legions.4.t:	"Kollaborateure in Lokot!"

 ### Congolese events ###

lokot_autonomy_has_been_crushed_flag:	"Die §YAutonomie von Lokot§! wurde zerschlagen "
SOV_recapture_lokot_to_destroy_the_autonomy_tt:	"Wenn wir §Y[224.GetName]§!, §Y[220.GetName]§! und §Y[222.GetName]§!, können wir die §YLokot-Autonomie§! rasch zerschlagen."

wuw_GER_legions.6.t:	"Die Zerstörung der Autonomie von Lokot"
wuw_GER_legions.6.desc:	"Nach der [SOV.GetAdjective] Rückeroberung der Region Lokot haben sie den von uns zuvor errichteten autonomen Staat aufgelöst sowie alle Mitglieder der lokalen Kollaborationsregierung verhaftet und eliminiert."

wuw_GER_legions.7.a:	"Wir könnten ihre Hilfe bei der Unterdrückung Serbiens gebrauchen"
wuw_GER_legions.7.b:	"Wir haben keinen Bedarf an diesem russischen Gesindel"

wuw_GER_legions.8.a:	"Wir könnten ihr Wissen über die Kuban-Steppe gut gebrauchen"
wuw_GER_monroe.1.t:	"[FROM.GetAdjectiveCap] Interesse an der Monroe-Doktrin"

wuw_GER_monroe.1.a:	"Wir müssen eingreifen!"
wuw_GER_monroe.1.b:	"Wen interessiert das?"

wuw_GER_monroe.2.desc:	"Nach massivem [FROM.GetAdjective] Druck scheint die Monroe-Doktrin endlich nachzugeben. Mehrere Länder haben sich gegen die Doktrin erhoben und sich enger an die [FROM.GetAdjective]s angelehnt. Obwohl der Widerstand lautstark ist, gibt es immer noch diejenigen, die die Doktrin zumindest bis zu einem gewissen Grad für erhaltenswert halten. Zu diesem Zeitpunkt werden alle unsere Handlungen als Schadensbegrenzungstaktiken betrachtet; wir sollten unsere Reaktion darauf sorgfältig abwägen."
wuw_GER_monroe.2.a_tt:	"Die §YMonroe-Doktrin§! wird aus allen Ländern entfernt, die sie noch anwenden. Garantiert allen Ländern, die sich nicht lautstark gegen die Doktrin ausgesprochen haben, zu einem Preis von £GFX_pol_power §Y2 5 politische Macht§! §Rpro Land garantiert§!!\n\nDerzeit gibt es §Y[?global.monroe_countries_in_support^num] Länder§!, die diese Doktrin unterstützen, und §Y[?global.monroe_doctrine_countries_to_destabilize^num] Länder§!, die sie passiv unterstützen.\n\nDie aktuellen Kosten der Garantien betragen §Y[?USA.monroe_countries_all_in_support_guarantee_cost] Politische Macht§!"
wuw_GER_monroe.2.b:	"Wir können nur denen Garantien geben, die loyal geblieben sind"

wuw_GER_monroe.3.desc:	" Es überrascht nicht, [FROM.GetNameDef] dass sie unsere Versuche, die Region zu destabilisieren, durchschaut haben. Nach einer massiven Propaganda-, Erpressungs- und Bestechungskampagne haben die [FROM.GetAdjective] die in der Monroe-Doktrin genannten Länder auf ihre Seite gezogen und sie gegen uns aufgebracht. Die Monroe-Doktrin steht stärker denn je."

wuw_GER_monroe.4.t:	"[FROM.GetNameDefCap] Fordert, dass wir die Monroe-Doktrin aufgeben"
wuw_GER_monroe.4.desc:	"Wir haben eine recht scharf formulierte Mitteilung von [FROM.GetNameDef] erhalten. Sie erklären, dass die Monroe-Doktrin zusammenbrechen wird und dass wir in Kürze nicht mehr unter dem Schutz von [USA.GetNameDef] stehen werden. Sollten wir die Doktrin jetzt abschaffen, bieten sie ihren eigenen Schutz als Ersatz an, haben jedoch sehr deutlich gemacht, dass dieses Angebot davon abhängt, dass wir schnell handeln."
wuw_GER_monroe.4.a:	"Was hat [USA.GetNameDef] überhaupt für uns getan? "

wuw_GER_monroe.4.b_tt:	"Wir werden uns weigern, in dieser Angelegenheit Stellung zu beziehen. Es könnten Versuche unternommen werden von §Y[USA.GetNameWithFlag]§!, uns auf ihre Seite zu ziehen."

wuw_GER_monroe.5.a:	"Gut"
wuw_GER_monroe.6.t:	"[FROM.GetNameDefCap] fordert, dass wir unseren Standpunkt zur Monroe-Doktrin bekräftigen"

wuw_GER_monroe.6.a:	"Wir werden die Doktrin unterstützen, genau wie zuvor "
wuw_GER_monroe.6.b_tt:	"Wir werden es ablehnen, in dieser Angelegenheit Stellung zu beziehen. Es könnten Versuche unternommen werden von §Y[GER.GetNameWithFlag]§!, uns auf ihre Seite zu ziehen."

wuw_GER_monroe.7.t:	"[FROM.GetAdjective] Ultimatum"
wuw_GER_monroe.7.desc:	"Ein scharf formuliertes [FROM.GetAdjective] hat uns erreicht. Sie behaupten, ihre Bemühungen zur Destabilisierung der Monroe-Doktrin seien erfolgreich gewesen und es sei nur eine Frage der Zeit, bis [USA.GetNameDef] die Doktrin endgültig aufhebt. Um uns die Möglichkeit zu geben, die Doktrin aufzugeben und ihren Zorn zu vermeiden, haben sie uns diese letzte Chance gegeben, uns der Doktrin zu widersetzen."
wuw_GER_monroe.7.a:	"Geben Sie sie auf, um den [FROM.GetAdjective] Zorn zu vermeiden!"

wuw_GER_monroe.8.t:	"[FROM.GetNameDefCap] bekräftigt die Monroe-Doktrin."
wuw_GER_monroe.8.desc:	"[FROM.GetAdjective] Der Staatschef [FROM.GetLeader] hat sich persönlich an uns gewandt. [FROM.GetLeader.GetSheHeCap] Er warnt uns, dass die Monroe-Doktrin trotz [GER.GetAdjective] aller Bemühungen, sie zu untergraben, weiterhin gilt. Sie betonen, dass wir ihren Schutz genossen haben und dass dies mit der Verantwortung einhergeht, die Doktrin gemeinsam mit ihnen aufrechtzuerhalten."
wuw_GER_monroe.8.a:	"Zurück zur Doktrin"

wuw_GER_monroe.8.c:	"Natürlich haben wir einfach den Sturm abgewartet"
wuw_GER_monroe.9.t:	"[FROM.GetNameDefCap] Hebt die Monroe-Doktrin auf"
wuw_GER_monroe.9.desc:	"Unsere Bemühungen haben sich endlich ausgezahlt. Der Anführer von [FROM.GetNameDef], [FROM.GetLeader], hat soeben die Abschaffung der Monroe-Doktrin angekündigt. Natürlich hat [FROM.GetLeader.GetSheHe] dies als etwas Negatives dargestellt, aber wir wissen, dass die Länder, die früher unter die Doktrin fielen, diese Entwicklung zu schätzen wissen werden ."
wuw_GER_monroe.9.a:	"Wunderbar!"

wuw_GER_monroe.10.a:	"Vorwärts"
wuw_GER_monroe.11.a:	"Vorwärts"

wuw_GER_monroe.12.desc:	"Der geringfügige und wenig intensive Streit um die Monroe-Doktrin ist abgeklungen, nachdem unsere beiden Länder in einen Krieg verwickelt wurden. Diplomatie und verdeckte Operationen in fremden Ländern erscheinen selbst Politikern, die weit von der Front entfernt sind, allzu bedeutungslos, da unsere Länder nun viel direkter aufeinanderprallen."
wuw_GER_monroe.12.a:	"Wir werden dies stattdessen mit Waffen lösen!"
wuw_GER_monroe.13.desc:	"Uns ist aufgefallen, dass ein gesteigertes Interesse seitens [GER.GetAdjective] Akteuren in der Region zu beobachten ist. Unser Bericht ist sehr knapp gehalten, doch es scheint, als würden Versuche unternommen, die Monroe-Doktrin zu destabilisieren und schließlich sogar zu demontieren. "
wuw_GER_monroe.13.a:	"Oh je..."

wuw_GER_monroe_news.1.desc:	"Nach massivem Druck und diplomatischen Bemühungen seitens [GER.GetNameDef] ist die sogenannte Monroe-Doktrin gescheitert. Von [USA.GetNameDef] eingeführt, um Amerika zu schützen, hat die Doktrin zumindest bis zu einem gewissen Grad für Frieden auf dem Kontinent gesorgt. Die Motive der [GER.GetAdjective]s hierfür bleiben unklar."
wuw_GER_monroe_news.1.a:	"Wirklich wunderbar"

GER_crushed_the_monroe_doctrine_bad:	"Die Monroe-Doktrin zunichte gemacht"
GER_saved_the_monroe_doctrine_bad:	"Die Monroe-Doktrin gestärkt"
GER_supported_the_monroe_doctrine_good:	"Die Monroe-Doktrin unterstützt"
GER_opposed_the_monroe_doctrine_good:	"Gegen die Monroe-Doktrin"

germany_mefo_bills.1.desc:	"Die finanziellen Belastungen des Wiederaufrüstungsprogramms drohen unsere Wirtschaft zum Zusammenbruch zu bringen. Wenn wir die Rüstungsproduktion auf dem bisherigen Niveau halten wollen, müssen wir neue Finanzierungswege finden – oder unsere Prioritäten neu setzen."
germany_mefo_bills.1.b:	"Das Programm ist zu teuer"
germany_mefo_bills.2.t:	"Steigende Kosten der Wiederaufrüstung"

germany_mefo_bills.2.a:	"Wir werden vorerst zurechtkommen"

germany_mefo_bills.4.desc:	"Die Militärausgaben haben ein beispielloses Niveau erreicht und unsere Finanzen erheblich belastet. Ohne sofortige Finanzierung wird unsere Rüstungsproduktion zum Erliegen kommen, und unsere Wirtschaft insgesamt wird unter der Last leiden, sie wieder anzukurbeln."
germany_mefo_bills.4.a:	"Wir dürfen nicht zulassen, dass diese Krise weitergeht!"
GER_mefo_bills_warning_tt:	" §Y[GetMilitaryProductionModifierName]§! hat erreicht $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y[?ROOT.GER_industrial_consumer_goods_factor|1%]§!"

wuw_GER_military_events.2.a:	"Wir lassen ihn am Leben, doch das darf sich nicht wiederholen!"

wuw_GER_diplomacy.1.t:	"[FROM.GetNameDefCap] bietet eine Handelspartnerschaft an"
wuw_GER_diplomacy.1.a:	"Wir beide können davon profitieren."
wuw_GER_diplomacy.1.b:	"Dieser Deal wird nur einem von uns zugutekommen ..."

wuw_GER_diplomacy.2.desc:	"[FROM.GetLeader] scheint ein vernünftiger Führer zu sein, der sich um [FROM.GetLeader.GetHerHis] die besten Interessen seines Landes kümmert. Zufälligerweise liegt dies zufällig auch im besten Interesse unseres Landes. Wir werden die zusätzlichen Ressourcen aus [FROM.GetName] sinnvoll einsetzen."
wuw_GER_diplomacy.3.desc:	 "[FROM.GetLeader] scheint ein unvernünftiger und unkluger Führer zu sein, dem das Wohl des Landes [FROM.GetLeader.GetHerHis] völlig gleichgültig ist. Wir werden uns anderweitig umsehen, um das zu finden, was wir suchen."

wuw_GER_diplomacy.10.b:	"Das ist inakzeptabel!"
wuw_GER_diplomacy.11.t:	"[FROM.GetNameDefCap] durchkreuzt unsere Pläne"

wuw_GER_diplomacy.20.t:	"Eine Einladung an die [FROM.GetFactionName]"
wuw_GER_diplomacy.20.desc:	"[FROM.GetLeader] hat die [FROM.GetFactionName] persönlich nach [ROOT.GetLeader] eingeladen. Vertreter des [FROM.GetAdjective] Oberkommandos versichern uns, dass wir gemeinsam mit ihrem ohnehin schon mächtigen Bündnis unsere gemeinsamen Feinde mühelos besiegen und so die Vorherrschaft von [ROOT.GetAdjective] in unserer Umgebung sichern werden."
wuw_GER_diplomacy.21.t:	" [FROM.GetNameDefCap] schließt sich dem [ROOT.GetFactionName] an"

wuw_GER_diplomacy.21.a:	"Willkommen in unseren Reihen!"
wuw_GER_diplomacy.22.t:	"[FROM.GetNameDefCap] lehnt unsere Einladung ab"
wuw_GER_diplomacy.22.desc:	" Trotz unserer größten Bemühungen und der offensichtlichen Vorteile, die [FROM.GetNameDef] durch einen Zusammenschluss unserer Kräfte gewinnen würde, haben [FROM.GetLeader] und die [FROM.GetAdjective]-Regierung die falsche Entscheidung getroffen, unsere Einladung zum Beitritt zur [ROOT.GetFactionName] abzulehnen. Dies wird für uns natürlich nicht viel ändern, da diese Einladung eher zum Nutzen von [FROM.GetName] gedacht war."

wuw_GER_diplomacy.23.b:	"Das bringt uns überhaupt keinen Vorteil!"
wuw_GER_diplomacy.24.t:	"Die [FROM.GetAdjective] übertragen ehemalige [ROOT.GetAdjective] Kolonien"

wuw_GER_diplomacy.24.a:	"Wunderbare Neuigkeiten!"
wuw_GER_diplomacy.25.t:	"Die [FROM.GetAdjective] lehnen es ab, unsere alten Kolonien an uns zu übertragen."
wuw_GER_diplomacy.25.desc:	"Wir hielten [FROM.GetLeader] von [FROM.GetNameDef] für einen äußerst vernünftigen Mann, doch es scheint, als hätten wir uns geirrt. Die [FROM.GetAdjective] lehnen unser vorgeschlagenes Abkommen hartnäckig ab, obwohl es ihnen offensichtliche Vorteile gebracht hätte. Wir werden einfach auf unsere alten Kolonien verzichten müssen."

wuw_GER_diplomacy.26.desc:	" Der Anführer der [FROM.GetAdjective], [FROM.GetLeader], ist mit einem Vorschlag zur wissenschaftlichen Zusammenarbeit an uns herangetreten. [FROM.GetLeader.GetSheHeCap] erklärt, dass es angesichts unserer ähnlichen Ideologien, aber sehr unterschiedlichen Schwerpunkte bei der Führung unserer Marinen hier reichlich Möglichkeiten zur Zusammenarbeit gibt. Einem solchen Pakt zuzustimmen, würde bedeuten, einige unserer Erkenntnisse mit ihnen zu teilen, würde uns aber auch ermöglichen, von ihnen zu lernen."
wuw_GER_diplomacy.26.a:	"Klingt fair genug"

wuw_GER_diplomacy.28.t:	"[FROM.GetNameDefCap] Lehnt unseren Forschungsvorschlag ab"

wuw_GER_diplomacy.29.t:	 "Alter Verbündeter schlägt Handelsabkommen vor"
wuw_GER_diplomacy.29.desc:	"Es gab Zeiten, in denen wir [FROM.GetNameDef], oder zumindest deren Vorgänger, als unseren Verbündeten betrachteten. In den letzten Jahren haben wir uns auseinanderentwickelt, doch es scheint, als wollten sie nun die Freundschaft wieder aufleben lassen. Mit dem Vorschlag eines für beide Seiten vorteilhaften Handelsabkommens hat die [FROM.GetAdjective] uns erneut die Hand gereicht."
wuw_GER_diplomacy.29.b:	"Das klingt zwielichtig ..."

wuw_GER_diplomacy.30.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat positiv auf unser vorgeschlagenes Handelsabkommen reagiert. Wir hatten bereits zuvor äußerst vorteilhafte Handelsabkommen mit ihnen, und [ROOT.GetLeader] ist sehr zuversichtlich, dass uns dies großen Gewinn einbringen wird."
wuw_GER_diplomacy.30.a:	"Großartige Neuigkeiten!"
wuw_GER_diplomacy.31.t:	"[FROM.GetAdjective] Ablehnung unseres Handelsvorschlags"
wuw_GER_diplomacy.31.desc:	"Trotz unserer historischen Verbindungen und des klaren Vorteils für sie hat [FROM.GetNameDef] das von uns vorgeschlagene Handelsabkommen abgelehnt. Das Abkommen hätte den Handel zwischen unseren beiden Ländern gefördert und unsere Partnerschaft gefestigt. Leider scheint es, als hätte [FROM.GetAdjective] andere Vorstellungen gehabt."

wuw_GER_diplomacy.32.t:	"[FROM.GetAdjective] Antrag auf Wiederaufnahme des Pachtvertrags für [743.GetName]"
wuw_GER_diplomacy.32.desc:	"Im Rahmen von Verhandlungen im Jahr 1898 [743.GetName] an das damalige Deutsche Reich verpachtet. Heute hat sich deren Nachfolger, [FROM.GetNameDef], hat sich an uns gewandt, um diesen Pachtvertrag wieder aufzunehmen. Der ursprüngliche Pachtvertrag sollte bis 1997 laufen, wurde jedoch durch den Ersten Weltkrieg und die [JAP.GetAdjective] Besetzung vorzeitig beendet."
wuw_GER_diplomacy.32.a:	"Wir haben kein Interesse daran, diesen Pachtvertrag wieder aufzunehmen"

wuw_GER_diplomacy.33.desc:	"Unsere Vereinbarung aus dem Jahr 1898 war eindeutig: [743.GetName] es gehörte uns bis 1997, doch die [FROM.GetAdjective] scheinen kalte Füße bekommen zu haben. Sie scheinen zu glauben, dass allein aufgrund dieses Krieges und der darauf folgenden [JAP.GetAdjective] Besatzung unsere Vereinbarung nicht mehr gültig sei. Die Vereinbarung enthält keine solche Klausel, aber es scheint, als hätten wir kaum eine Wahl. Wenn wir [743.GetName] zurückhaben wollen, müssen wir möglicherweise zu drastischeren Maßnahmen greifen."
wuw_GER_diplomacy.34.t:	"[FROM.GetNameDefCap] kehrt zum [743.GetName] Pachtvertrag zurück"

wuw_GER_diplomacy.34.a:	" Wunderbare Neuigkeiten!"
wuw_GER_diplomacy.35.t:	"[FROM.GetNameDefCap] fordert die Kontrolle über ehemalige Kolonien"

wuw_GER_diplomacy.36.t:	"[FROM.GetAdjective] Weigerung, unsere Kolonien zu übertragen"
wuw_GER_diplomacy.36.desc:	"Wir dachten, wir hätten [FROM.GetNameDef] klar gemacht, dass die Übertragung unserer rechtmäßigen Kolonien nicht optional ist. Dennoch weigern sie sich hartnäckig, das zu tun, was richtig und in ihrem besten Interesse ist. Wir erheben weiterhin Anspruch auf dieses Gebiet, und sie haben kein Recht, sich uns in den Weg zu stellen!"
wuw_GER_diplomacy.36.a:	"Diese Ländereien gehören uns!"

wuw_GER_diplomacy.37.a:	"Eine kluge Entscheidung"

GER_is_colonial_overlord_desc:	"Wir hatten befürchtet, dass dieser Tag kommen würde, hofften jedoch, dass es nicht so weit kommen würde. [FROM.GetLeader] von [FROM.GetNameDef] hat verlangt, dass wir als [FROM.GetLeader.GetHerHis]-Untertanen unsere Unabhängigkeit aufgeben und Teil von [FROM.GetNameDef] selbst werden. Unsere Meinung spielt in dieser Frage keine Rolle mehr, wir können nichts anderes tun, als uns zu fügen."
wuw_GER_diplomacy.38.a:	"[GetGERAfricanColonyOverlordOption]"

GER_is_colonial_overlord_option:	"Wir hatten eine gute Zeit"

wuw_GER_diplomacy.40.t:	"[FROM.GetNameDefCap] Lehnt unsere Gebietsforderungen ab"
wuw_GER_diplomacy.40.desc:	" Trotz des zunehmend hohen Drucks auf [FROM.GetAdjective] den Anführer [FROM.GetLeader] und den Rest der [FROM.GetAdjective] Führung werden diese nicht nachgeben. Wir werden nicht in der Lage sein, friedlich die Kontrolle über unsere alten Kolonien zu übernehmen, die derzeit unter ihrer Kontrolle stehen."
wuw_GER_diplomacy.40.a:	"Wir werden einen anderen Weg finden"

wuw_GER_diplomacy.100.desc:	"Der Botschafter von [FROM.GetName] hat uns mitgeteilt, dass wir die vereinbarten Zahlungen für die Besatzungskosten nicht mehr von ihnen erhalten werden."
wuw_GER_diplomacy.100.a:	"So sei es"
wuw_GER_diplomacy.50.t:	"[FROM.GetNameDefCap] möchte eine Zusammenarbeit im Bereich der Marineentwicklung initiieren"
wuw_GER_diplomacy.50.desc:	"\nDiplomaten und Schiffsingenieure von [FROM.GetNameDef] sind mit einem ungewöhnlichen Angebot auf uns zugekommen. Sie behaupten, dass sie ein umfangreiches Programm zur Zusammenarbeit im Marinebereich starten möchten, bei dem Entwicklungen und Techniken zwischen unseren beiden Ländern ausgetauscht werden. Dies könnte uns zugutekommen, birgt aber auch das Risiko, dass geheime Informationen an die [FROM.GetAdjective]s weitergegeben werden. Was sagen wir dazu?"

wuw_GER_diplomacy.51.a:	"Unsere Marine wird wieder stark werden"

wuw_GER_diplomacy.52.desc:	"[FROM.GetLeader] hat sich heute gegen das Abkommen ausgesprochen, das wir ihnen kürzlich zur Zusammenarbeit im Marinebereich unterbreitet haben, und behauptet, es handele sich um einen offensichtlichen Trick, um [FROM.GetAdjective] technische Geheimnisse zu stehlen ..."
wuw_GER_diplomacy.52.a:	"Eine törichte Entscheidung"
wuw_GER_diplomacy.53.t:	"[FROM.GetNameDefCap] bietet eine Handelspartnerschaft an"

wuw_GER_diplomacy.54.t:	"[FROM.GetNameDefCap] hat unseren Handelsvorschlag angenommen"
wuw_GER_diplomacy.54.desc:	"[FROM.GetLeader] scheint ein vernünftiger Anführer zu sein, der die besten Interessen seines Landes im Blick hat. Zufälligerweise liegt dies auch im besten Interesse unseres Landes. Wir werden die zusätzlichen Ressourcen von [FROM.GetName] sinnvoll einsetzen."
wuw_GER_diplomacy.54.a:	"Perfekt!"

wuw_GER_diplomacy.55.a:	"Ihr Pech."
wuw_GER_diplomacy.56.desc:	"[FROM.GetAdjective] Beamte und Bankiers haben uns den Zugang zu unseren Konten in Deutschland gesperrt und diese leergeräumt. Das bedeutet, dass [GER.GetNameDef] unser aus dem Gömbös-Handelsabkommen stammendes Bargeld beschlagnahmt und das Abkommen damit im Wesentlichen außer Kraft gesetzt hat. Wir können ihrem Wort nie wieder vertrauen..."

wuw_GER_diplomacy.57.t:	"[FROM.GetNameDefCap] fordert die Rückgabe von Nordschleswig"
wuw_GER_diplomacy.57.desc:	"\nDie Rhetorik von [FROM.GetLeader] und der [FROM.GetAdjective]-Regierung ist uns gegenüber in letzter Zeit deutlich feindseliger geworden, indem sie behaupten, die schleswischen Volksabstimmungen von 1920 seien rechtswidrig und betrügerisch gewesen, und nun verlangen sie, dass wir ihnen das Gebiet zurückgeben. Wir wissen, dass dies nicht der Wahrheit entspricht, aber vielleicht wäre es am besten, einen offenen Konflikt mit [FROM.GetNameDef] zu vermeiden?"
wuw_GER_diplomacy.57.b:	"Sie können kommen und es sich holen!"

wuw_GER_diplomacy.58.desc:	"[FROM.GetLeader] hat erklärt, dass sie, da sie keinen bewaffneten Konflikt mit uns eingehen wollen, sich dafür entschieden haben, das bei den schleswischen Volksabstimmungen von 1920 gewonnene Gebiet zurückzugeben. Die Menschen der Region jubeln, da sie wieder in den Schoß der Gemeinschaft aufgenommen wurden."
wuw_GER_diplomacy.58.a:	"Ein großer Tag für das [ROOT.GetAdjective] Volk!"
wuw_GER_diplomacy.59.desc:	"\nDer übermütige [FROM.GetLeader] hat verfügt, dass Nordschleswig [FROM.GetAdjective] ist und immer sein wird. [FROM.GetNameDefCap]" s Truppen haben mobilisiert und werden rasch an unsere Grenze verlegt, da sie sich offenbar auf einen Krieg vorbereiten. Wie sollen wir auf diese Provokation reagieren?"

wuw_GER_diplomacy.59.b:	"Wir sollten die Lage wirklich nicht eskalieren lassen ..."
wuw_GER_mutual_guarantees.1.t:	" [FROM.GetNameDefCap] Bittet um gegenseitige Zusammenarbeit"
wuw_GER_mutual_guarantees.1.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat sich mit einem Angebot für gegenseitige Garantien und Zusammenarbeit an uns gewandt. Die Vereinbarung würde sich auf den gegenseitigen Schutz der jeweiligen Gebiete erstrecken und könnte sich in Zukunft möglicherweise zu etwas noch Größerem entwickeln. Was meinen Sie dazu?"
wuw_GER_mutual_guarantees.1.a:	"Es ist ein für beide Seiten vorteilhaftes Abkommen"


wuw_GER_mutual_guarantees.3.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unseren Antrag auf einen Pakt gegenseitigen Schutzes und der Zusammenarbeit abgelehnt und behauptet, dies sei ein Mittel für uns, nicht nur heimlich die Herzen ihres Volkes zu unterwandern, um es zu schwächen, sondern auch ein Trick, um letztendlich die Herrschaft über ihren Staat zu erlangen. Sie sind sich wirklich nicht bewusst, welches Angebot sie verpassen ..."
wuw_GER_mutual_guarantees.3.a:	"Sie begehen einen großen Fehler"
wuw_GER_weltpolitik.1.t:	"[FROM.GetName] fordert die Rückgabe ehemaliger Kolonialgebiete"

wuw_GER_weltpolitik.1.b:	"Nein, sie gehören jetzt uns"
wuw_GER_weltpolitik.2.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unserem Antrag auf Rückgabe unserer ehemaligen Kolonien stattgegeben und erklärt, dass es ihnen in unseren Händen besser gehe. Die Menschen feiern auf den Straßen, da es den Anschein hat, dass das [ROOT.GetAdjective] Kolonialreich endlich wieder auf der Landkarte steht."

wuw_GER_weltpolitik.3.t:	"[FROM.GetNameDefCap] gibt unsere Kolonien nicht zurück"
wuw_GER_weltpolitik.3.a:	"Es sollte einfach nicht sein ..."

wuw_GER_diplomacy.60.desc:	" \nDie Rhetorik von [FROM.GetLeader] und der [FROM.GetAdjective]-Regierung ist gegenüber unseren lokalen Verwaltungsbeamten in [912.GetName] feindseliger geworden; sie behaupten, Nordschleswig sei immer deutsch gewesen und werde es immer bleiben, und fordern nun, dass wir ihnen das Gebiet zurückgeben. Wir wissen, dass dies nicht der Wahrheit entspricht, aber vielleicht wäre es am besten, einen offenen Konflikt mit [FROM.GetNameDef] zu vermeiden?"
wuw_GER_diplomacy.60.a:	"Sie haben recht"
wuw_GER_diplomacy.60.b:	"Sind sie wahnsinnig?"
wuw_GER_diplomacy.61.t:	" [FROM.GetNameDefCap] gibt unseren Forderungen nach"

wuw_GER_diplomacy.62.a:	"Wir werden bei der Freiheit unseres Volkes keine Kompromisse eingehen!"

wuw_GER_diplomacy.63.t:	"[FROM.GetNameDefCap] erobert [912.GetName]"
wuw_GER_diplomacy.63.a:	"Leider können wir nicht viel tun, um sie aufzuhalten ..."

wuw_GER_chinese_diplomacy.1.desc:	"\nUnsere großen Verbündeten im Westen, die [FROM.GetAdjective], haben uns eine Lieferung mit Waffen und Munition geschickt. Das ist jedoch noch nicht alles, denn sie haben auch eine Gruppe von Ingenieuren und Industriellen entsandt, die uns bei der Entwicklung unserer eigenen Waffen unterstützen werden, damit unsere Militärwirtschaft nach Jahrhunderten der Demütigung wieder auf Kurs kommen kann."
wuw_GER_chinese_diplomacy.2.t:	"[FROM.GetNameDefCap] Bietet industrielle Hilfe im Austausch gegen Rohstoffrechte"

wuw_GER_chinese_diplomacy.2.a:	"Ein wahrhaft guter Freund"
wuw_GER_chinese_diplomacy.2.b:	"Wir können unsere natürlichen Ressourcen nicht hergeben"
wuw_GER_chinese_diplomacy.3.t:	"[FROM.GetNameDefCap] Nimmt unser Angebot an"

wuw_GER_chinese_diplomacy.4.a:	"Wirklich enttäuschend"


wuw_GER_diplomacy.65.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat auf unser Angebot geantwortet und erklärt, dass, um die Zukunft von [FROM.GetAdjective] zu sichern, unsere Bedingungen erfüllt und die erforderlichen Zahlungen mit sofortiger Wirkung geleistet werden." "
wuw_GER_diplomacy.65.a:	"Es läuft alles wie am Schnürchen!"
wuw_GER_diplomacy.66.t:	"[FROM.GetNameDefCap] Lehnt unsere Bedingungen ab"

wuw_GER_diplomacy.66.b:	"Sie brauchen dennoch Schutz, auch wenn sie sich weigern, dafür zu bezahlen!"
wuw_GER_diplomacy.67.t:	" [FROM.GetNameDefCap] Bietet einen geheimen Pakt an"

wuw_GER_diplomacy.67.b:	"Das ist unethisch!"
wuw_GER_diplomacy.68.t:	"[FROM.GetNameDefCap] stimmt dem Pakt zu"
wuw_GER_diplomacy.68.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat auf unser Angebot geantwortet und erklärt, dass sie, um die [FROM.GetAdjective] Zukunft zu sichern, dem Pakt zustimmen und Einflusssphären einrichten werden. "

wuw_GER_diplomacy.68.b:	"Großartige Neuigkeiten. Wir müssen jedoch Geduld bewahren"

warning_they_may_instead_apporach_our_neighbor_tt:	"§R[FROM.GetNameDefCap] könnte sich stattdessen an unseren Nachbarn wenden§!"
wuw_GER_diplomacy.70.t:	"[FROM.GetNameDefCap] mischt sich in unsere Politik ein"
wuw_GER_diplomacy.70.desc:	"[FROM.GetAdjective] Propagandisten haben vor kurzem begonnen, unsere Bevölkerung zu beeinflussen und auf ihre Seite zu ziehen, indem sie unserem Volk eine großartige Zukunft versprechen, sollten wir uns ihrem Staat als Verbündeter anschließen. Dies ist nicht unbedingt eine Bedrohung für unsere Unabhängigkeit, stellt jedoch ganz sicher einen Akt der Aggression gegen unsere derzeitige Regierung dar, wobei viele neu verteilte Zeitungen die Schwächen unseres Systems anprangern. Vielleicht könnten wir einen weiteren Freund in der Welt gebrauchen, auch wenn dies wahrscheinlich nicht das letzte Mal sein wird, dass wir von den [FROM.GetLeader] und [FROM.GetLeader.GetHerHis] Handlangern hören."

wuw_GER_diplomacy.71.a:	"Es liegt im besten Interesse unseres Volkes."

wuw_GER_diplomacy.72.a:	"Wir haben keinen Grund, ihnen zu misstrauen"

wuw_GER_diplomacy.73.t:	"[FROM.GetNameDefCap] ermöglicht es uns, kommunistische Tendenzen zu stärken."
wuw_GER_diplomacy.73.desc:	"Unsere Agenten, die in [FROM.GetNameDef] tätig sind, um die kommunistische Bewegung zu stärken, sind der Führung des Landes aufgefallen. Glücklicherweise scheint diese dem wachsenden Anteil der Bevölkerung, der die Sache des Proletariats unterstützt, weitgehend gleichgültig gegenüberzustehen, und wir können unsere Bemühungen fortsetzen."
wuw_GER_diplomacy.73.a:	"Für das Proletariat!"

wuw_GER_diplomacy.74.desc:	"Unsere Agenten, die in [FROM.GetNameDef] tätig sind, um die kommunistische Bewegung zu stärken, sind der Führung des Landes aufgefallen. Wir haben einen strengen Brief von ihnen erhalten, in dem sie verlangen, dass wir diese Operation unverzüglich einstellen. Es scheint, dass unsere gut gemeinte Aufklärung der Arbeiter über ihre Rechte [FROM.GetLeader]s wahres Gesicht als Feind des einfachen Volkes offenbart hat."
wuw_GER_diplomacy.75.t:	"Bürgerkrieg in [ROOT.GetNameDef]"

wuw_GER_diplomacy.75.b:	"Wir müssen diesem Wahnsinn ein Ende setzen!"

wuw_GER_diplomacy.77.t:	"[FROM.GetNameDefCap] Fordert, dass wir ein Referendum über den Beitritt zu ihnen abhalten"
wuw_GER_diplomacy.77.desc:	"Unsere Nachbarn im Norden haben uns die Forderung übermittelt, ein Referendum über den Beitritt zu ihnen abzuhalten. Mit der Begründung, dass unser Volk ihrem sehr ähnlich sei und dass es verdiene, vereint zu leben, haben sie angedeutet, dass wir uns ihnen unterwerfen sollten. Uns wird zwar weiterhin ein gewisses Maß an Freiheit gewährt, doch unter anderem unsere Außenpolitik wird von den [FROM.GetAdjective] überwacht und gelenkt werden."

wuw_GER_diplomacy.78.t:	"[FROM.GetNameDefCap] schließt sich an"
wuw_GER_diplomacy.78.a:	"Ein Tag zum Feiern!"
wuw_GER_diplomacy.79.t:	"[FROM.GetNameDefCap] Führung weigert sich, sich uns anzuschließen "


 #### THE WHISPERS AND NEGOTIATIONS OF INDEPENDENCE EVENT CHAIN ####

wuw_GER_diplomacy.81.desc:	"Unsere Zeit als Volkskommissariat ist zu Ende gegangen. Die [FROM.GetAdjective] Führung ist sehr zufrieden mit unseren Bemühungen und betrachtet das Land nun als mehr als nur einen Vasallenstaat. Als solches möchten sie uns belohnen, indem sie uns erlauben, Teil ihres großen Landes zu werden, anstatt nur ein Vasallenstaat zu sein. Das bedeutet natürlich, dass uns keine Unabhängigkeit mehr gewährt wird, aber sie versichern uns, dass sie sich gut um unser Volk kümmern werden."
wuw_GER_diplomacy.81.a:	"Kaum eine Belohnung, aber welche Wahl haben wir?"

wuw_GER_diplomacy.83.desc:	"Nach unserem Erfolg im Bürgerkrieg und der anschließenden Hinwendung zum Kommunismus hat [GER.GetNameDef] uns kameradschaftlich die Hand gereicht. Wie groß der Anteil der Unterstützung war, die wir von den [GER.GetAdjective] tatsächlich erhalten haben, lässt sich am besten unerwähnt. Da wir nun ähnliche Ideologien teilen, haben sie uns dieses Angebot unterbreitet; inwieweit wir in dieser Angelegenheit wirklich eine Wahl haben, bleibt ein wenig unklar."

wuw_GER_diplomacy.84.t:	"[FROM.GetNameDefCap] Forderung nach mehr proletarischer Solidarität"
wuw_GER_diplomacy.84.desc:	"[GetIsRootProletarianSubject]"
GER_root_not_proletarian_subject:	"Da unser Land nun zu Recht von Vertretern der Arbeiter und des Proletariats geführt wird, haben sich die [FROM.GetAdjective] an uns gewandt. Sie sprechen von Solidarität unter kommunistischen Nationen, um das Leben unserer Völker zu verbessern. Der Handel zwischen unseren Ländern könnte den Arbeitern beider Länder zugutekommen, verhindert jedoch weiterhin Einflüsse aus kapitalistischen Ländern, die das politische System untergraben würden, das wir so sorgfältig aufgebaut haben."

wuw_GER_diplomacy.85.t:	"[FROM.GetNameDefCap] fordert unsere Integration"
wuw_GER_diplomacy.85.desc:	"Eine scharf formulierte Forderung von [FROM.GetAdjective] ist bei uns eingegangen. Sie sind der Ansicht, dass unsere derzeitige Zusammenarbeit zwar vorteilhaft, aber nicht gut genug ist. Ihre Lösung besteht darin, zu fordern, dass wir uns in [FROM.GetNameDef] integrieren. Obwohl keine Konsequenzen für eine Ablehnung erwähnt werden, kann man nur annehmen, dass eine Ablehnung nicht leichtfertig erfolgen sollte."
wuw_GER_diplomacy.85.a:	"Wir haben keine Wahl"

wuw_GER_diplomacy.86.t:	"[FROM.FROM.GetNameDefCap] übergibt Gebiete in unserem Einflussbereich"

wuw_GER_diplomacy.87.desc:	"Aufgrund unseres Sieges im jüngsten Krieg müssen wir eine Entscheidung treffen. Einige der von uns eroberten Gebiete liegen nicht innerhalb unseres Einflussbereichs. Gemäß der Vereinbarung müssen wir diese Gebiete abtreten. Die Vereinbarung wurde jedoch nie schriftlich festgehalten, und daher könnte man argumentieren, dass sie nicht bindend war..."
wuw_GER_diplomacy.87.a:	"Wir müssen die Vereinbarung einhalten!"
wuw_GER_diplomacy.87.b:	"Wir haben dieses Land fair und rechtmäßig erobert!"
wuw_GER_diplomacy.88.desc:	"Heute erreichte uns eine überaus willkommene Nachricht: Nachdem wir die Kontrolle über [FROM.GetAdjective] Gebiete innerhalb unseres Einflussbereichs übernommen haben, hat [FROM.FROM.GetNameDef] beschlossen, unsere Vereinbarung einzuhalten. Das Gebiet innerhalb unseres Einflussbereichs wurde in unser Eigentum überführt. "

wuw_GER_diplomacy.89.desc:	"[FROM.GetNameDefCap] hat uns mitgeteilt, dass sie eine Einflusssphäre errichtet haben. Auch wenn dies keine direkten Auswirkungen auf uns hat, da kein formelles Abkommen besteht, sollten wir uns dessen bewusst sein. Sie könnten versuchen, uns dies aufzuzwingen oder Gebiete von uns zu fordern, sollten wir die Kontrolle darüber erlangen."

wuw_GER_diplomacy.90.a:	"Das wird uns stärken!"
wuw_GER_diplomacy.90.b:	"Wir dürfen uns nicht an sie binden."

wuw_GER_diplomacy.91.desc:	"Wir haben soeben eine Mitteilung von der Führung der [FROM.GetAdjective] erhalten, dass sie sich unserer politischen Doktrin anschließen möchte. Sie hofft, dass dies eine gute Grundlage für die weitere Zusammenarbeit in der Zukunft sein kann, betont jedoch, dass solche Pläne nicht sofort umgesetzt werden müssen. Dies ist eine hervorragende Gelegenheit für uns, Einfluss auf ihre politische Elite zu nehmen."
wuw_GER_diplomacy.91.a:	"Wir kennen da jemanden ..."
wuw_GER_diplomacy.92.t:	"[FROM.GetNameDefCap] Befürwortet unsere Angleichung"

wuw_GER_diplomacy.92.a:	"Ulbricht ist genauso fähig, wir werden ihn einsetzen."
wuw_GER_diplomacy.92.b:	"Nein, wir lassen uns nicht von ihnen einmischen!"
wuw_GER_diplomacy.93.t:	" [FROM.GetNameDef] Setzt Walter Ulbricht ein"

wuw_GER_diplomacy.93.a:	"Großartig!"
wuw_GER_diplomacy.94.t:	"[FROM.GetNameDefCap] Weigert sich, Ernst Thälmann zu ersetzen"
wuw_GER_diplomacy.94.desc:	"Obwohl unser Vorschlag der wohlmeinendste Versuch war, unseren [FROM.GetAdjective] Genossen zu helfen, haben sie sich hartnäckig geweigert, unseren Rat zu befolgen. Es scheint, als hätten sie den Vorschlag als Versuch angesehen, sich in ihre Politik einzumischen, obwohl dies keineswegs unsere Absicht war."
wuw_GER_diplomacy.94.a:	"Hartnäckige [FROM.GetAdjective]s..."

wuw_GER_diplomacy.95.a:	"Das klingt fair"
wuw_GER_diplomacy.95.b:	"Die müssen uns für dumm halten."

wuw_GER_diplomacy.96.a:	"Großartig! "
wuw_GER_diplomacy.97.t:	"[FROM.GetNameDefCap] Lehnt unseren Vorschlag ab"

wuw_GER_diplomacy.98.t:	"[FROM.GetNameDefCap] lädt uns zur Initiative zum Technologieaustausch ein"
wuw_GER_diplomacy.98.desc:	"Unsere Genossen in [FROM.GetNameDef] haben sich kürzlich an uns gewandt, um die Möglichkeit einer Initiative zur Bündelung unseres Wissens in den Bereichen Industrie und Produktion zu erörtern. Wir würden unser Wissen mit ihnen teilen, und im Gegenzug würden sie ihr Wissen mit uns teilen. Dies könnte für unsere Arbeiter und unsere Produktionslinien von Vorteil sein."
wuw_GER_diplomacy.98.a:	"Es ist eine großartige Initiative"
wuw_GER_diplomacy.98.b:	"Man kann ihnen nicht trauen."

wuw_GER_diplomacy.99.desc:	"Zu unserer großen Zufriedenheit scheint es, dass die [FROM.GetAdjective] den Nutzen unserer vorgeschlagenen Technologieaustauschgruppe erkannt haben. Von nun an werden wir Zugang zu ihrem Wissen haben, genauso wie sie zu unserem. Infolgedessen sollten wir große Fortschritte in den Bereichen Industrie und Produktion sehen."
wuw_GER_diplomacy.99.a:	"Großartig"

wuw_GER_diplomacy.102.a:	"Großartig"

wuw_GER_diplomacy.103.desc:	"Trotz offensichtlicher Vorteile für uns beide hat [FROM.GetNameDef] den vorgeschlagenen Nichtangriffspakt abgelehnt. Wir wissen nicht, welche Gründe dafür vorliegen, doch ihre Ablehnung ist ziemlich besorgniserregend. Wir werden sie genau im Auge behalten."
wuw_GER_diplomacy.104.t:	"[FROM.GetNameDefCap] stimmt der Einrichtung von Einflusssphären zu"

wuw_GER_diplomacy.104.a:	"Großartig!"
wuw_GER_diplomacy.105.t:	"[FROM.GetNameDefCap] Lehnt die Einrichtung von Einflusssphären ab"
wuw_GER_diplomacy.105.desc:	"Wir haben von den [FROM.GetAdjective]s die Nachricht erhalten, dass sie sich weigern werden, unseren Einflussbereich anzuerkennen und zu akzeptieren, da sie erklärt haben, dass sie ihren eigenen Einflussbereich ohne Einmischung unsererseits festlegen werden. Dies könnte zu Spannungen in der Region führen."

wuw_GER_diplomacy.107.t:	"Die [FROM.GetAdjective] bieten Industrie für Ressourcen an"
wuw_GER_diplomacy.107.desc:	"Wir haben ein Angebot von [FROM.GetNameDef] erhalten. Sie sind an einem langfristigen Handel mit Ressourcen interessiert, im Gegenzug für die Verlagerung eines Teils ihrer Industrie. Derzeit haben sie ein Auge auf die Ressourcen in [FROM.FROM.GetName] geworfen, von denen sie einen Teil erhalten möchten."
wuw_GER_diplomacy.107.a:	"Warum nicht?"

wuw_GER_diplomacy.108.desc:	"Wir haben eine Rückmeldung von den [FROM.GetAdjective] bezüglich unserer Bitte um eine Industrieverlagerung im Austausch gegen einen Teil ihrer Ressourcen erhalten. Es scheint, dass wir uns über die Vorteile dieses Deals einig sind, und sie haben diesem Deal gerne zugestimmt. Wir werden die Ressourcen in Kürze erhalten."
wuw_GER_diplomacy.108.a:	"Großartig"

wuw_GER_diplomacy.109.desc:	"Obwohl die [FROM.GetAdjective]s unserem vorgeschlagenen Abkommen gegenüber größtenteils neutral eingestellt waren, haben sie sich letztendlich entschieden, unseren Vorschlag zur Verlagerung von Industrien zu ihnen im Austausch gegen Ressourcen abzulehnen. Sie behaupten, dass dies kein guter Zeitpunkt sei, was den Eindruck erweckt, dass wir vielleicht in Zukunft eine Einigung erzielen könnten, sobald wir unsere Beziehung weiter gestärkt haben."
wuw_GER_diplomacy.109.a:	"Wenn es beim ersten Mal nicht klappt ..."
wuw_GER_diplomacy.110.desc:	"Es scheint, als sei das äußerst faire Angebot, das wir den [FROM.GetAdjective] vorgelegt haben, auf kalte Ablehnung gestoßen. Nicht nur das, sondern sie haben auch sehr deutlich gemacht, dass sie nicht wünschen, dass wir sie in dieser Angelegenheit jemals wieder kontaktieren. Wenn wir diese Ressourcen wollen, müssen wir vielleicht ... alternative Wege finden."

wuw_GER_diplomacy.111.t:	"Vertrag zur Entwicklung der Wirtschaftsbeziehungen"
wuw_GER_diplomacy.111.desc:	"Diplomaten aus [FROM.GetNameDef] haben darauf bestanden, dass wir ihren Vorschlag für einen deutsch-rumänischen Vertrag zur Entwicklung der Wirtschaftsbeziehungen zwischen den beiden Ländern unterzeichnen. Sie behaupten, dass dieses Abkommen beiden Ländern zugutekommen wird, da sie unsere natürlichen Ressourcen für ihre Industrie benötigen und wir einen besseren Preis für deutsche Rüstungsgüter erhalten. Dieses Abkommen scheint für uns nicht so vorteilhaft zu sein, wie die Deutschen behaupten, aber eine Ablehnung würde sie sicherlich verärgern..."

wuw_GER_diplomacy.111.b:	" Wir können dies nicht akzeptieren, die Konsequenzen seien uns egal!"
wuw_GER_diplomacy.112.desc:	"[FROM.GetLeader] scheint ein vernünftiger Staatschef zu sein, der die besten Interessen des Landes im Blick hat. Zufälligerweise liegt dieses unausgewogene Abkommen auch im besten Interesse unseres Landes. Wir werden die zusätzlichen Ressourcen aus [FROM.GetName] sinnvoll einsetzen."
wuw_GER_diplomacy.113.desc:	"[FROM.GetLeader] scheint ein unvernünftiger und unkluger Führer zu sein, dem das Wohl des Landes völlig gleichgültig ist. Das Volk wird unter dieser Torheit leiden."

wuw_GER_diplomacy.117.b:	"Wir werden uns niemals unterwerfen!"
wuw_GER_diplomacy.118.t:	"[FROM.GetNameDefCap] Einreichung"

wuw_GER_diplomacy.119.t:	"[FROM.GetNameDefCap] Weigert sich, sich zu unterwerfen"






