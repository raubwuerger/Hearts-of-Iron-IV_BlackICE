wuw_GER_realpolitik.8.desc:	 "[FROM.GetLeader] von [FROM.GetNameDef] hat angekündigt, dass sich die [FROM.GetAdjective] Nation unserer Herrschaft unterwerfen wird, da sie nicht die Macht hat, uns aufzuhalten, und ein Kampf nur noch mehr Zerstörung über ihr Land und ihr Volk bringen würde."
