l_german:
wuw_GER_news.1.t:	"Die Wiedervereinigung Deutschlands"
wuw_GER_news.1.d:	"Nachdem das deutsche Volk lange Zeit durch willkürliche Grenzen, die einen Bruder vom anderen trennten, in verschiedene Staaten geteilt war, kann es nun wieder jubeln, denn ein neuer deutscher Staat ist im Entstehen begriffen. Nach den jüngsten politischen Erfolgen ist [FROM.GetLeader] dem Geist Bismarcks gerecht geworden und hat die Wiedervereinigung Deutschlands ausgerufen, eine Nation, die tausend Jahre lang Bestand haben wird!"
wuw_GER_news.1.a:	"Deutschland ist endlich wieder ganz"
wuw_GER_news.1.b:	"Dies ist erst der Anfang"
wuw_GER_news.2.t:	"Ein Aufstand in Schlesien"
wuw_GER_news.2.desc:	"Zum vierten Mal seit der Unterzeichnung des Versailler Vertrags haben sich die Rebellen in Deutsch-Schlesien gegen die Regierung erhoben. Diesmal behauptet [SIL.GetLeader], dass die Ziele ihrer militärischen Aktionen hauptsächlich darin bestehen, die Unabhängigkeit eines schlesischen Staates zu sichern und gleichzeitig das schlesische Volk vor Schaden im deutschen Bürgerkrieg zu bewahren, obwohl frühere Aufstände eher das Ziel hatten, Autonomie innerhalb des polnischen Staates zu erlangen. Es wird sich zeigen, ob sie sich gegen die deutsche Armee behaupten können."
wuw_GER_news.2.a:	"Eine interessante Wendung der Ereignisse"
wuw_GER_news.2.b:	"Sie haben es schon einmal versucht und sind gescheitert"
wuw_GER_news.2.c:	"Dies ist unser Moment!"
wuw_GER_news.2.d:	"Hoffen wir, dass sie dieses Mal Erfolg haben."
AUS_political_events.1.t:	"Das Schicksal der Creditanstalt-Bankverein"
AUS_political_events.1.desc:	"Wir sind darauf aufmerksam geworden, dass die Bankenfusion von 1934, bei der die rekapitalisierte Creditanstalt alle Aktiva und Passiva des Wiener Bankvereins sowie die lebensfähigen Geschäfte der Niederösterreichischen Escompte-Gesellschaft übernommen hat, uns in die Suppe gespuckt hat, da sie unsere wirtschaftliche Entwicklung stark behindert und ungewollt eine Art Monopol auf dem Finanzsektor geschaffen hat. Da wir nun diesen Sektor regulieren, wie sollten wir die Situation angehen?"
AUS_political_events.1.a:	"Am sichersten ist es, alles so zu belassen, wie es ist"
AUS_political_events.1.a_tt:	"An unseren Industriekonzernen werden keine Änderungen vorgenommen. Die Creditanstalt-Bankverein wird weiterhin zur Verfügung stehen, indem sie Kredite gewährt:"
AUS_political_events.1.b:	"Die Österreichische Creditanstalt ist die klügste Wahl"
AUS_political_events.1.c:	"Der Wiener Bankverein wird uns nicht im Stich lassen"
AUS_reestablish_creditanstalt:	"Die Creditanstalt-Bankverein wird aufgelöst und die neue Österreichische Creditanstalt wird unsere volle Unterstützung erhalten."
AUS_reestablish_benkverein:	"Die Creditanstalt-Bankverein wird aufgelöst und der neue Wiener Bankverein erhält unsere volle Unterstützung."
AUS_political_events.2.t:	"Phönix Versicherungsskandal"
AUS_political_events.2.desc:	"Kurz nach dem Tod ihres geliebten Generaldirektors Wilhelm Berliner ist die Phönix Versicherung in weitere Schwierigkeiten geraten. Der neu ernannte Direktor Eberhard Reininghaus hat die Regierung auf gefälschte Bilanzen aufmerksam gemacht, die ein Defizit von über 250 Millionen Schilling aus dem Jahr 1929 aufdecken. \n \n Das Unternehmen hat Konkurs angemeldet und den Betrieb sofort eingestellt. Die allseits beliebte Kriegsteilnehmerversicherung hat ein abruptes Ende gefunden, was zu einem Aufschrei bei vielen derjenigen geführt hat, die auf die Auszahlungen der Versicherung angewiesen waren"
AUS_political_events.2.a:	"Wie furchtbar!"
AUS_political_events.2.b:	"Wir werden die Auszahlungen übernehmen!"
AUS_political_events.2.b_tt:	"Die Übernahme der Versicherung wird es uns ermöglichen, die Phönix-Versicherung wiederzubeleben."
AUS_political_events.3.t:	"Deutsche Remilitarisierung löst weit verbreitete Besorgnis aus"
AUS_political_events.3.desc:	"Die jüngste Remilitarisierung des Rheinlandes hat in unserer Bevölkerung große Besorgnis ausgelöst. In unserer Regierung wird die Frage aufgeworfen: 'Könnten wir die Nächsten sein?' Obwohl der Führer immer wieder versichert hat, dass ein Anschluss Österreichs nicht in seinem Interesse liegt, müssen wir bedenken, dass eine solche Aktion nicht mehr völlig ausgeschlossen ist."
AUS_political_events.3.a:	"Wir sollten uns auf das Schlimmste vorbereiten..."
AUS_political_events.3.a_tt:	"Entriegelt die §YAnti-Anschluss Maßnahmen§! Entscheidungen"
AUS_political_events.4.t:	"Meinungsumschwung"
AUS_political_events.4.desc:	"Der bisher äußerlich faschistische Kardinal Theodor Innitzer hat seine Rhetorik kürzlich radikal geändert. Nachdem er zuvor den Nationalsozialismus und den [GER.GetAdjective] Führer lautstark und öffentlich unterstützt hatte, bezog er in einer Messe am 7. Oktober eindeutig Stellung gegen den Führer. Anstelle seiner üblichen Predigten darüber, wie die Massen ihren Glauben mit [GER.GetLeader] verbinden sollten, wies er sie nun auf den Herrn zurück. \n \n Die [GER.GetAdjective] Führung ist wütend und möchte, dass wir handeln."
AUS_political_events.4.a:	"Werden Sie den Verräter los!"
AUS_political_events.4.b:	"Herr Innitzer darf seine eigene Meinung haben."
AUS_political_events.5.t:	"[AUS.GetNameDefCap] Sucht Kooperation zwischen unseren Luftstreitkräften"
AUS_political_events.5.desc:	"Ein Vorschlag der [AUS.GetAdjective] Diplomaten in unserem Land hat uns soeben erreicht. Nachdem sie aus dem Vertrag von Saint-Germain-En-Laye entlassen wurden, wollen sie nun ihre Armee wieder aufbauen, für Verteidigungsmaßnahmen, wie sie uns versichert haben. Ihr Land hat in der Vergangenheit recht robuste Flugzeuge gebaut und verfügt über einige talentierte Piloten, aber durch die Lücke in der Produktion und Ausbildung stehen sie nun vor der Herausforderung, diese Kapazitäten wieder aufzubauen. Wenn wir bereit sind, über ihre Taten im Großen Krieg hinwegzusehen, könnten wir von dieser Partnerschaft profitieren."
AUS_political_events.5.a:	"Es lohnt sich, wir werden so viel wie möglich helfen!"
AUS_political_events.5.b:	"Wir können lernen, zusammenzuarbeiten."
AUS_political_events.5.c:	"Wir glauben nicht an diese 'defensive' Lüge, die man uns erzählt."
AUS_political_events.6.t:	"[FROM.GetNameDefCap] nimmt unseren Vorschlag an und gibt uns Zugang zum Kauf von Ausrüstung"
AUS_political_events.6.desc:	"[FROM.GetNameDefCap] hat positiv auf unseren Vorschlag reagiert, beim Aufbau unserer Luftstreitkräfte zu kooperieren und unsere Erfahrungen zu teilen. Sie haben die Schwierigkeiten erkannt, mit denen wir nach der Loslösung vom Vertrag von Saint-Germain-En-Laye konfrontiert sind, und haben uns angeboten, auch bei ihnen überschüssige Ausrüstung zu kaufen!"
AUS_political_events.6.a:	"Ein Toast auf eine großartige Partnerschaft!"
AUS_political_events.7.t:	"[FROM.GetNameDefCap] nimmt unser Angebot an"
AUS_political_events.7.desc:	"[FROM.GetNameDefCap] hat ziemlich gut auf unseren jüngsten Vorschlag reagiert, beim Aufbau unserer jeweiligen Luftstreitkräfte zusammenzuarbeiten. Sie sind zwar nicht in der Lage, uns materiell zu unterstützen, aber sie haben sich bereit erklärt, einige ihrer neuesten Methoden für die Pilotenausbildung mit uns zu teilen."
AUS_political_events.7.a:	"Großartig!"
AUS_political_events.8.t:	"[FROM.GetNameDefCap] lehnt die von uns vorgeschlagene Partnerschaft ab"
AUS_political_events.8.desc:	"[FROM.GetNameDefCap] hat unser Angebot abgelehnt. Mit der Begründung, dass das Abkommen einseitig wäre und ihnen keinen Nutzen brächte und dass wir uns durch unser Verhalten im Großen Krieg selbst in diese Lage gebracht hätten."
AUS_political_events.8.a:	"Und wie wird ihnen diese Situation nützen?"
AUS_air_force_partnership_big:	"Umfassende Partnerschaft mit der Luftwaffe"
AUS_air_force_partnership_small:	"Partnerschaft mit der Luftwaffe"
AUS_rejected_air_force_partnership:	"Luftwaffenpartnerschaft abgelehnt"
AUS_political_events.9.t:	"Wilhelm Zehner ermordet"
AUS_political_events.9.desc:	"Wilhelm Zehner, eines der Mitglieder unseres Militärischen Oberkommandos, wurde tot in seiner Wohnung aufgefunden. Die [GER.GetAdjective] Diplomaten streiten alles ab und behaupten, dass sie nichts damit zu tun haben und dass Zehner dies mit der Waffe, mit der er gefunden wurde, selbst getan haben muss. Die strafrechtlichen Ermittlungen deuten in eine ganz andere Richtung..."
AUS_political_events.9.a:	"Die [GER.GetAdjective]s sind also sowohl Lügner als auch Mörder..."
AUS_political_events.9.a_tt:	"§YWilhelm Zehner§!§R ist tot!§!"
AUS_anschluss_ratio_lowered:	"Die §YTotal Army Fighting Strength§!, die für §YAnschluss§! benötigt wird, wird §YLowered§!"
AUS_anschluss_ratio_raised:	"Die für §YAnschluss§! benötigte §YGesamte Kampfkraft§! wird §YErhöht§!"
AUS_political_events.10.t:	"Attentat auf Wilhelm Zehner vereitelt"
AUS_political_events.10.desc:	"Gestern Abend brach die Gestapo in die Wohnung von Wilhelm Zehner ein und traf auf die Wachen, die wir um unser Oberkommando positioniert hatten. Der Kampf dauerte nicht sehr lange, und Zehner kam völlig unverletzt aus der Auseinandersetzung heraus."
AUS_political_events.10.a:	"Wir wussten es!"
AUS_political_events.11.t:	"[GER.GetNameDefCap] äußert Abneigung gegen unser militärisches Oberkommando"
AUS_political_events.11.desc:	"Diplomaten von [GER.GetNameDef] haben bei einem Mitglied unseres militärischen Oberkommandos Bedenken angemeldet. Sie behaupten, dass wir zwar ein souveräner Staat sind und tun können, was wir wollen, dass dies aber unsere diplomatischen Beziehungen zu [GER.GetNameDef] ins Wanken bringen könnte. \n\n Wir müssen damit rechnen, dass sie die Sache selbst in die Hand nehmen, wenn wir nicht in ihrem Interesse handeln."
AUS_political_events.11.a:	"Das geht sie nichts an!"
AUS_political_events.11.a_tt:	"Löst die Mission §Y[GER.GetAdjective] Animosity Towards Military High Command§!\n\nWenn wir den Tod von Zehner nicht verhindern, wird die §YTotal Army Fighting Strength§!, die für §YAnschluss§! erforderlich ist, §YLowered§!."
AUS_political_events.11.b:	"Wenn es das ist, was nötig ist, um ihre Eskapaden zu stoppen..."
AUS_political_events.12.t:	"[FROM.GetNameDefCap] bietet uns Infanterie-Ausrüstung an"
AUS_political_events.12.desc:	"[FROM.GetNameDefCap] hat sich an uns gewandt und bietet uns Unterstützung in Form von Infanterieausrüstung an. Sie betrachten uns als einen sehr geschätzten Verbündeten und wünschen, dass diese Gewehre für unsere Kriegsanstrengungen in [ETH.GetNameDef] verwendet werden, um unseren Sieg in diesem Krieg zu sichern."
AUS_political_events.12.a:	"Das war unerwartet, aber sehr willkommen."
AUS_political_events.13.t:	"[FROM.GetNameDefCap] protestiert gegen das Embargo von [ITA.GetNameDef]"
AUS_political_events.13.desc:	"Wir haben Proteste gegen das Embargo erhalten, das wir wie viele andere gegen [ITA.GetNameDef] verhängt haben. Mit der Behauptung, das Embargo sei unvernünftig und unbegründet, hat die Führung von [AUS.GetAdjective] gefordert, dass wir das Embargo aufheben.\n\nAuf die Frage nach den Gründen für den Protest gegen das Embargo weigert sich die Führung von [FROM.GetNameDef], näher darauf einzugehen."
AUS_political_events.13.a:	"Die [AUS.GetAdjective] haben kein Recht, dies zu fordern."
AUS_political_events.13.b:	"Gut."
AUS_political_events.14.t:	"[FROM.GetNameDefCap] spricht sich gegen das Embargo gegen uns aus"
AUS_political_events.14.desc:	"[FROM.GetNameDefCap] hat kürzlich gegen das gegen uns verhängte Embargo protestiert. Mit dem Hinweis, dass wir ein sehr geschätzter Verbündeter sind, haben sie aktiv Einwände an alle Länder geschickt, die ein Embargo gegen uns verhängt haben, um die Situation für uns auch nur ein wenig zu erleichtern."
AUS_political_events.14.a:	"Ein mutiger Schritt der [FROM.GetAdjective]s"
AUS_political_events.15.t:	"[FROM.GetNameDefCap] Verbietet DNSAP"
AUS_political_events.15.desc:	"Soeben erreicht uns die Nachricht, dass die [FROM.GetAdjective] Regierung ein Verbot für DNSAP in [FROM.GetNameDef] erlassen hat. Ein sanftes Verbot gab es bereits seit 1934, allerdings wurde dieses Verbot von den politischen Parteien und der Regierung weitgehend ignoriert. Das bedeutet, dass sich der Ton der [FROM.GetAdjective] Führung uns gegenüber geändert hat. \n\nAbgesehen von der offensichtlichen Beleidigung, die dies darstellt, könnte dies auch unseren Einfluss auf [FROM.GetNameDef] beeinträchtigen."
AUS_political_events.15.a:	"So leicht werden sie uns nicht los!"
AUS_political_events.15.b:	"Wie unhöflich!"
AUS_political_events.15.c:	"Dafür haben wir jetzt keine Zeit!"
AUS_banned_dnsap:	"Verbotene DNSAP"
AUS_meddling_with_our_politics:	"Einmischung in unsere Politik"
AUS_political_events.16.t:	"Nazis in der Regierung"
AUS_political_events.16.desc:	"Wie erwartet hat [FROM.GetNameDef] schlecht auf unser jüngstes Verbot von DNSAP reagiert. Abgesehen von der offensichtlichen Forderung, dass wir das Verbot sofort aufheben, verlangen sie auch, dass wir Arthur Seyss-Inquart als Berater einsetzen. Sie sind sehr hartnäckig in dieser Frage und obwohl wir schon immer wussten, dass er den [FROM.GetAdjective] Weg sehr mochte, stellt sich die Frage, warum? "
AUS_political_events.16.a:	"Wir müssen ihn genau im Auge behalten. "
AUS_political_events.16.b:	"Auf gar keinen Fall!"
AUS_political_events.16.a_tt:	"Setzt §YArthur Seyss-Inquart§! als Berater ein, der nicht gefeuert werden kann§!\n"
AUS_political_events.17.t:	"[FROM.GetNameDefCap] protestiert gegen unser Verbot von DNSAP"
AUS_political_events.17.desc:	"Wie erwartet hat [FROM.GetNameDef] schlecht auf unser jüngstes Verbot von DNSAP reagiert. Sie betrachten dies als einen Angriff auf ihre eigene Ideologie und haben ihre große Enttäuschung und Wut über unsere Entscheidung zum Ausdruck gebracht. Obwohl wir gute Gründe für das Verbot der DNSAP hatten, verlangt die [FROM.GetAdjective]-Führung nun, dass wir das Verbot sofort aufheben. "
AUS_political_events.17.a:	"Sie haben kein Recht, sich in unsere Politik einzumischen."
AUS_political_events.18.t:	"[FROM.GetNameDefCap] setzt Arthur Seyss-Inquart als Berater ein"
AUS_political_events.18.desc:	"Es scheint, dass die [FROM.GetAdjective] doch noch zur Vernunft gekommen ist. Das Verbot unserer Schwesterpartei in [FROM.GetNameDef] bleibt bestehen, aber sie haben zumindest Arthur Seyss-Inquart als Berater eingesetzt, der uns einen Einblick in ihre politischen Manöver gewährt. "
AUS_political_events.18.a:	"Gut"
AUS_political_events.19.t:	"Godwin von Brumowski bietet seinen Dienst an"
AUS_political_events.19.desc:	"Unser erfolgreichstes Kampfflugzeug-Ass aus dem Großen Krieg hat sich an uns gewandt und bietet uns erneut seine Dienste an, da wir uns im Krieg befinden. Obwohl er nicht mehr jung ist und auch nicht mehr so gut fliegen kann wie früher, nachdem er 1936 knapp gescheitert war, hat er angeboten, unsere Luftwaffe vom Boden aus zum Sieg zu führen. Unsere derzeitigen Piloten haben immer noch großen Respekt vor ihm und es herrscht die Meinung vor, dass er unsere Flieger zu einer Größe ausbilden könnte, die mit seiner eigenen vergleichbar ist."
AUS_political_events.19.a:	"Wir brauchen jede Hilfe, die wir bekommen können!"
AUS_political_events.19.b:	"Angesichts seiner Verwicklung in den Putsch von 1934 können wir das nicht riskieren."
AUS_von_brumowski_recruited_flag:	"Godwin von Burmowski rekrutiert"
AUS_political_events.20.t:	"[FROM.GetNameDefCap] Bittet um unsere Unterstützung"
AUS_political_events.20.desc:	"[GetGuarantorFlavorText]"
AUS_guarantor_is_italy_key:	"[FROM.GetNameDefCap] hat den General und von Zeit zu Zeit auch den Militärattaché Emil Liebitzky mit der Bitte um Hilfe zu uns geschickt. Er und andere in der [FROM.GetAdjective]-Führung haben besorgniserregende Tendenzen bei [GER.GetNameDef] festgestellt und wünschen sich nun eine formellere Unterstützung von uns, falls ihre Einschätzung der Lage tatsächlich richtig ist. \n\nAls Parteien, die den Vertrag von Saint-Germain-En-Laye unterzeichnet haben, wird von uns wahrscheinlich erwartet, dass wir ihnen zu Hilfe kommen, obwohl sich wahrscheinlich Schlupflöcher im Text finden lassen."
AUS_guarantor_is_not_italy_key:	"[FROM.GetNameDefCap] hat einen Botschafter zu uns geschickt, der uns um Hilfe bittet. Die Führung von [FROM.GetAdjective] hat besorgniserregende Tendenzen bei der Führung von [GER.GetNameDef] festgestellt und da sie aufgrund des Vertrags von Saint-Germain-En-Laye nicht mobilisieren kann, um der Bedrohung zu begegnen, bittet sie uns nun formeller um Unterstützung. In dem Vertrag und den folgenden Verträgen haben wir uns bereit erklärt, ihnen zu helfen, aber es gibt keinen Entwurf, wie genau diese Unterstützung aussehen soll."
AUS_political_events.20.a:	"Ihre Unabhängigkeit ist für uns von größter Bedeutung!"
AUS_political_events.20.b:	"Wir werden sie diplomatisch unterstützen"
AUS_political_events.20.c:	"Vielleicht können wir eine für beide Seiten vorteilhafte Vereinbarung treffen"
AUS_political_events.20.d:	"Wir werden nichts für sie riskieren"
AUS_political_events.21.t:	"[FROM.GetNameDefCap] Garantiert unsere Unabhängigkeit"
AUS_political_events.21.desc:	"In Übereinstimmung mit dem Vertrag von Saint-Germain-En-Laye hat [FROM.GetNameDef] zugestimmt, unsere Unabhängigkeit zu garantieren. Außerdem stellen sie uns Mittel zur Verfügung, um einige Ausrüstungsgegenstände zu beschaffen, da wir derzeit nicht in der Lage sind, selbst welche zu produzieren."
AUS_political_events.21.a:	"Ausgezeichnet!"
AUS_political_events.22.t:	"[FROM.GetNameDefCap] Unterstützt unsere Unabhängigkeit diplomatisch"
AUS_political_events.22.desc:	"Unter Ausnutzung einiger weniger bekannter Klauseln und des Kleingedruckten hat [FROM.GetNameDef] beschlossen, uns keine Garantie zu geben, sondern uns im Falle einer Invasion lediglich diplomatische Unterstützung anzubieten. Sie behaupten, dass sie sicher sind, dass ihre Worte [GER.GetLeader] genauso gut überzeugen könnten wie eine Drohung mit einer Intervention und sehen daher keinen Grund, Männer für uns bereitzuhalten."
AUS_political_events.22.a:	"Nicht das, worum wir gebeten haben, aber besser als nichts."
AUS_political_events.22.b:	"Diplomatie und Ausrüstung werden uns nicht retten!"
AUS_political_events.23.t:	"[FROM.GetNameDefCap] bietet bedingt eine Garantie an"
AUS_political_events.23.desc:	"[FROM.GetNameDefCap] hat auf unsere Bitte um Hilfe mit einer eigenen Bitte geantwortet. Seit der Zeit, als uns dieser Vertrag auferlegt wurde, haben wir uns bemüht, Südtirol und das Trentino für uns zurückzuerobern, da sie rechtmäßig uns gehören. [FROM.GetNameDef] betrachtet diese Gebiete als die seinen, und wenn sie unsere Unabhängigkeit garantieren sollen, wollen sie, dass wir ein für alle Mal auf diese Ansprüche verzichten."
AUS_political_events.23.a:	"Unsere unmittelbare Sicherheit ist wichtiger als diese Ansprüche."
AUS_political_events.23.b:	"Sie versuchen, aus unserer misslichen Lage Profit zu schlagen, absolut nicht."
AUS_political_events.24.t:	"[FROM.GetNameDefCap] lehnt unsere Bitte um Unterstützung ab"
AUS_political_events.24.desc:	"Unter Ausnutzung einer Vielzahl von Spitzfindigkeiten, Kleingedrucktem und obskuren Klauseln im Vertrag von Saint-Germain-En-Laye hat [FROM.GetNameDef] es irgendwie geschafft, sich aus der Unterstützung für uns herauszuwinden. In den Papieren steht klar und deutlich, dass wir im Gegenzug dafür, dass uns keine anständige Armee zugestanden wird, Hilfe von außen erhalten, aber wie sich herausstellt, hat [FROM.GetNameDef] beschlossen, dass dies nicht für sie gilt. Wir müssen auf uns selbst gestellt sein."
AUS_political_events.24.a:	"Wir haben die anderen Parteien auf genau diesen Fehler hingewiesen..."
AUS_political_events.24.b:	"Wir werden ihnen einen Anreiz geben!"
AUS_political_events.25.t:	"[FROM.GetNameDefCap] widerruft Ansprüche auf unsere Territorien"
AUS_political_events.25.desc:	"[FROM.GetNameDefCap] hat auf unsere Forderung, ihre Ansprüche auf unser Territorium zurückzunehmen, reagiert, indem sie sich diesen Forderungen unterworfen hat. Sie haben die Idee, diese Gebiete als Gegenleistung für unsere Unterstützung zu übernehmen, vollständig aufgegeben."
AUS_political_events.25.a:	"Großartige Neuigkeiten!"
AUS_political_events.26.t:	"[FROM.GetNameDefCap] weigert sich, seine Ansprüche zu widerrufen"
AUS_political_events.26.desc:	"Wir hielten die [FROM.GetAdjective] für ein vernünftiges Volk, nachdem sie uns erst kürzlich um Hilfe gebeten hatten. Wie sich herausstellt, haben wir uns in ihnen getäuscht. Als wir sie aufforderten, ihre Ansprüche auf Gebiete, die rechtmäßig uns gehören, zurückzunehmen, haben sie sich eklatant geweigert."
AUS_political_events.26.a:	"Also absolut keine Hilfe für sie."
AUS_political_events.27.t:	"[AUS.GetNameDefCap] Möchte aufrüsten"
AUS_political_events.27.desc:	"[AUS.GetNameDefCap] hat sich an uns gewandt und um die Genehmigung gebeten, wieder aufzurüsten und den Vertrag von Saint-Germain-En-Laye aufzuheben. Sie geben an, dass ihr Nachbargebiet in letzter Zeit sehr viel feindseliger geworden ist und dass sie sich ohne eine eigene Armee nicht mehr sicher fühlen. Die Anfrage wurde an alle drei Großmächte gerichtet, die den Vertrag unterzeichnet haben, [ITA.GetNameDef], [ENG.GetNameDef] und [FRA.GetNameDef] sowie [USA.GetNameDef], und gemäß dem Vertrag kann jeder von uns ein Veto einlegen, wenn wir dies wünschen."
AUS_political_events.27.a:	"Sie werden keinen Schaden anrichten."
AUS_political_events.27.b:	"Ganz und gar nicht."
AUS_political_events.28.t:	"Die Bürgen stimmen der Abrüstung zu"
AUS_political_events.28.desc:	"Wir haben endlich die Antworten der Garantiegeber erhalten und das Warten hat sich gelohnt. Nach vielen Diskussionen und Gesprächen haben sie zugestimmt, dass wir wieder aufrüsten dürfen und haben den Vertrag von Saint-Germain-En-Laye für obsolet erklärt. Wir sind nicht länger an die Handlungen unserer Vorväter gebunden."
AUS_political_events.28.a:	"Ausgezeichnet!"
AUS_political_events.29.t:	"Die Garantiemächte lehnen den Aufruf zur Wiederbewaffnung ab"
AUS_political_events.29.desc:	"Nach langen Diskussionen und vielen Debatten haben die Bürgen beschlossen, unserem Antrag auf Wiederbewaffnung nicht zuzustimmen. Wir haben versucht, sie zur Vernunft zu bringen, aber ihre Antwort bleibt trotz der offensichtlichen Gefahr für unsere Souveränität und Unabhängigkeit standhaft."
AUS_political_events.29.a:	"Dann haben wir keine andere Wahl..."
AUS_political_events.29.a_tt:	"§Wenn Sie sich dafür entscheiden, werden Sie den Vertrag von Saint-Germain-En-Laye für immer los, aber das könnte Konsequenzen haben§!"
AUS_political_events.29.b:	"Wir müssen darüber verhandeln!"
AUS_political_events.29.c:	"Sie haben uns zum Scheitern verurteilt, aber was können wir tun?"
AUS_political_events.29.c_tt:	"§Wenn Sie dies wählen, bleibt der Vertrag von Saint-Germain-En-Laye bis zum 16. Juli 1940 in Kraft§!"
AUS_political_events.30.t:	"[AUS.GetNameDefCap] Bricht den Vertrag von Saint-Germain-En-Laye"
AUS_political_events.30.desc:	"[GetTreatyStatus]"
AUS_treaty_asked_permission_key:	"Trotz unserer Bemühungen, sie zu stoppen, hat die [AUS.GetAdjective] Regierung beschlossen, die Wiederbewaffnung von [AUS.GetNameDef] anzuordnen, was einen klaren Bruch des Vertrages darstellt. Wir hatten gehofft, dass es nicht so weit kommen würde, aber es scheint, dass man sie nicht davon abhalten kann, diesen Weg zu gehen."
AUS_treaty_no_permission_key:	"Ohne jede Vorwarnung wurden wir darüber informiert, dass [AUS.GetNameDef] den Vertrag von Saint-Germain-En-Laye mit allem, was er mit sich bringt, nicht mehr einhalten wird. Das bedeutet vor allem, dass sie jetzt ohne Rücksicht auf die Beschränkungen, die ihnen nach dem Großen Krieg auferlegt wurden, frei aufrüsten werden. Warum sie so plötzlich aufrüsten wollen, bleibt unklar."
AUS_political_events.30.a:	"Wir können sie nicht aufhalten, aber wir können sie bremsen."
AUS_political_events.30.b:	"Gut, dann sollen sie es tun."
AUS_political_events.30.c:	"Keine Garantien mehr für sie!"
AUS_broke_the_treaty:	"Hat unseren Vertrag gebrochen"
AUS_broke_the_treaty_democratic:	"Unseren Vertrag gebrochen"
AUS_political_events.31.t:	"[FROM.GetNameDefCap] fordert eine Entschädigung für ihre Hilfe"
AUS_political_events.31.desc:	"Während sich der Staub nach dem Bürgerkrieg legt, wurden wir von der [FROM.GetAdjective] wegen einer Entschädigung für ihre Bemühungen im Bürgerkrieg kontaktiert. Sie fordern eine Form der Entschädigung für die geleistete Arbeit, die verlorenen Männer und die Waffen, die von ihren Freiwilligen benutzt und zerstört wurden."
AUS_political_events.31.a:	"Wir werden industriell helfen."
AUS_political_events.31.b:	"Sie können einen Teil der Ausrüstung haben, die wir erbeutet haben."
AUS_political_events.31.c:	"Ihre Unterstützung war vernachlässigbar"
AUS_political_events.32.t:	"[FROM.GetNameDefCap] Bietet Hilfe beim Bau einer neuen Fabrik an"
AUS_political_events.32.desc:	"Unsere Bitte um Entschädigung wurde von den [FROM.GetAdjective] Nationalisten erhört und als Dankeschön haben sie uns Arbeiter und Material für den Bau einer neuen Fabrik in Niederösterreich zur Verfügung gestellt. Damit können wir verlorene Ausrüstung ersetzen und uns auch in Zukunft als sehr hilfreich erweisen."
AUS_political_events.32.a:	"Großartig!"
AUS_political_events.33.t:	"[FROM.GetNameDefCap] Bietet erbeutete Ausrüstung an"
AUS_political_events.33.desc:	"Unsere Bitte um Entschädigung wurde von den [SPA.GetAdjective] erhört und als Dankeschön haben sie uns einige der Ausrüstungsgegenstände geschickt, die sie während des Bürgerkriegs von ihren Gegnern erbeutet haben, um uns für einen Teil der Ausrüstung zu entschädigen, die wir durch unsere Hilfe verloren haben."
AUS_political_events.33.a:	"Großartig!"
AUS_political_events.34.t:	"[FROM.GetNameDefCap] weigert sich, uns zu entschädigen"
AUS_political_events.34.desc:	"Nachdem wir den [SPA.GetAdjective] in ihrem Bürgerkrieg geholfen haben, haben wir zumindest eine Art Entschädigung und Dankbarkeit erwartet, aber es scheint, als hätten wir uns zu viel erhofft. Mit dem Hinweis, dass unsere Hilfe nichts Besonderes war, lehnt die Führung von [SPA.GetNameDef] die Idee ab, dass wir irgendeine Art von Entschädigung für die von uns angebotene Unterstützung erhalten sollten."
AUS_political_events.34.a:	"Wie unhöflich..."
AUS_political_events.35.t:	"Paramilitärische Aktivitäten verursachen zivile Unruhen"
AUS_political_events.35.desc:	"Unsere jüngste Zusammenarbeit mit der [GetMilitiaName] hat einige beunruhigende Nebeneffekte gehabt. Da die Organisation von der Führung des Landes legitimiert wurde, ist die [GetMilitiaName] in ihrem Vorgehen gegen die Zivilbevölkerung mutiger geworden.\n\nDie Unruhen innerhalb der Nation haben zugenommen, da sich unsere Bevölkerung mit der Arbeitsweise der Organisation nicht mehr ganz wohl fühlt. Es werden Fragen an unsere Führung gestellt, ob wir wirklich die Kontrolle über die [GetMilitiaName] haben und ob diese Entscheidung wirklich dazu beiträgt, die Sicherheit der Nation zu gewährleisten."
AUS_political_events.35.a:	"Die [GetMilitiaName] hatten ihre Chance."
AUS_political_events.35.b:	"Die Menschen müssen sich nur darauf einstellen."
AUS_political_events.35.c:	"Dies wird die neue [ROOT.GetName] sein!"
AUS_political_events.36.t:	"Die Zukunft von [ROOT.GetNameDef]"
AUS_political_events.36.desc:	"Unser Weg zurück von einer schwer verkrüppelten Kleinmacht war lang und mühsam. Wenn wir zurückblicken, wo wir angefangen haben, wird nur allzu deutlich, dass sich diese Reise gelohnt hat. Wiedergeboren und noch stärker als zuvor ist es nun an der Zeit, dass wir entscheiden, was unsere Zukunft bringt und wie wir bekannt sein wollen."
AUS_political_events.36.a:	"Zu gegebener Zeit werden wir als [GetGrossosterreichCosmeticIdeology] bekannt sein."
AUS_grossosterreich_fascism_key:	"Großösterreich"
AUS_grossosterreich_neutrality_key:	"das Großösterreichische Reich"
AUS_political_events.36.a_tt:	"§YEntscheidungen§! zur §YIntegration der deutschen Kerne§! im Laufe der Zeit."
AUS_political_events.36.b:	"Wir werden als Süddeutschland bekannt sein"
AUS_political_events.36.c:	"Wir sind perfekt, so wie wir sind"
AUS_political_events.37.t:	"Ultimatum von [FROM.GetNameDef]"
AUS_political_events.37.desc:	"[GetIntegrationEventTarget]"
AUS_integration_target_is_poland_key:	"Wir haben eine harsche Nachricht von der [FROM.GetAdjective] Regierung erhalten. Sie verlangen, dass wir [Get37PuppetOrNotDesc] an sie ausliefern und warnen uns, dass es Konsequenzen haben könnte, sollten wir versuchen, uns zu widersetzen.\n\nDieser Akt der Aggression von [FROM.GetNameDef] kam nicht völlig unerwartet, nachdem eine Reihe ähnlicher Forderungen an andere Länder in der Nähe gestellt wurden."
AUS_integration_target_is_not_poland_key:	"Die Regierung von [FROM.GetAdjective] hat sich mit einem Ultimatum an uns gewandt. Unterwerfen Sie sich [Get37PuppetOrNotDesc] bereitwillig, oder stellen Sie sich der Macht ihrer nun wieder aufgebauten Kriegsmaschine auf dem Schlachtfeld. Ganz gleich, welchen Weg wir in dieser Frage einschlagen, es scheint, dass es keinen Weg ohne Konsequenzen geben wird."
AUS_political_events.37.a:	"Wir werden uns ihnen nicht unterwerfen!"
AUS_political_events.37.b:	"Wir haben keine Chance gegen sie"
AUS_political_events.37_tt:	"Wir werden ihnen die Staaten aushändigen, die sie für sich beanspruchen."
37DescIsPuppet:	"[FROM.FROM.OWNER.GetNameDef]"
37DescIsNotPuppet:	"ihre alten Staaten"
AUS_political_events.38.t:	"[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
AUS_political_events.38.desc:	"Wir wollten den [FROM.GetAdjective] eine Chance [Get38PuppetOrNotDesc] in unserer Gesellschaft geben, aber es scheint, dass unser großzügigstes Angebot nicht angenommen wurde. Schließlich sind wir uns sehr wohl bewusst, dass es [FROM.GetNameDef] unter unserer Führung viel besser gehen wird."
AUS_political_events.38.a:	"Sie werden sich uns anschließen, egal, was sie zu wollen glauben."
AUS_political_events.38_tt:	"Erschafft ein _YTake Claimed State§! Kriegsziel gegen _[FROM.FROM.OWNER.GetNameWithFlag]§!"
38DescIsPuppet:	"[FROM.FROM.OWNER.GetName] ausliefern und integrieren lassen"
38DescIsNotPuppet:	"friedlich zu integrieren"
AUS_political_events.39.t:	"[FROM.GetNameDefCap] Falten"
AUS_political_events.39.desc:	"Die Reaktion der [FROM.GetAdjective]-Führung ist eine, die sehr zu begrüßen ist. Sie werden die Waffen niederlegen und nicht zurückschlagen, während wir integrieren, was rechtmäßig uns gehört. Offensichtlich haben sie erkannt, wie wichtig es ist, ihr Land nicht wegen solcher Dinge in einen sinnlosen Krieg zu stürzen."
AUS_political_events.39.a:	"Willkommen bei [ROOT.GetNameDef]!"
AUS_political_events.40.t:	"[FROM.GetNameDefCap] Möchte der [ROOT.GetFactionName] beitreten"
AUS_political_events.40.desc:	"[FROM.GetNameDefCap] hat sich an uns gewandt und um den Beitritt zu unserer Fraktion gebeten. Sie haben mit einer Militarisierungskampagne begonnen und äußern den Wunsch, zusammenzuarbeiten, um uns beide stärker zu machen. In der Vergangenheit war die Nation eine wichtige Kraft auf dem Schlachtfeld, mit der man rechnen musste, aber obwohl sie jetzt geschwächt ist, ist sie sich sicher, dass sie für uns ein nützlicher Verbündeter sein wird."
AUS_political_events.40.a:	"Sie sind uns herzlich willkommen."
AUS_political_events.40.b:	"Wir haben keinen Bedarf an ihnen."
AUS_political_events.41.t:	"[FROM.GetNameDefCap] Stimmt zu, dass wir uns den [FROM.GetFactionName] anschließen"
AUS_political_events.41.desc:	"[FROM.GetNameDefCap] hat unser Ersuchen, sich ihnen anzuschließen, mit Begeisterung beantwortet und uns in der Fraktion willkommen geheißen. Wir werden nicht länger allein gegen unsere Bedroher kämpfen!"
AUS_political_events.41.a:	"Gemeinsam sind wir stärker!"
AUS_political_events.42.t:	"[FROM.GetNameDefCap] lehnt es ab, uns in die [FROM.GetFactionName] aufzunehmen"
AUS_political_events.42.desc:	"Unser Antrag, der [FROM.GetFactionName] beizutreten, wurde eiskalt abgelehnt. Wir haben versucht, unsere Nützlichkeit zu argumentieren, aber leider hat sich [FROM.GetNameDef] eine Meinung gebildet. Das ist zwar sehr ärgerlich, aber wir lassen uns davon nicht entmutigen, sondern finden andere Lösungen."
AUS_political_events.42.a:	"Wir werden ihnen zeigen"
AUS_political_events.43.t:	"[FROM.GetNameDefCap] Fordert [Get43PuppetOrNotTitle]"
43TitleIsPuppet:	"Wir übergeben unseren Untertan"
43TitleIsNotPuppet:	"Unsere Unterwerfung"
AUS_political_events.43.desc:	"Die stark formulierte Forderung von [FROM.GetNameDef] hat uns heute Morgen erreicht und verlangt, dass wir sofort [Get43PuppetOrNotDesc]. Dünn verschleierte Aggressionsdrohungen spitzen die Forderung zu und es scheint wahrscheinlich, dass es zu Feindseligkeiten kommen könnte, sollten wir ihren Vorschlag ablehnen."
43DescIsPuppet:	"die Kontrolle über [FROM.FROM.OWNER.GetNameDef] an sie abgeben"
43DescIsNotPuppet:	"sich ihren Forderungen zu unterwerfen und ein Untertan unter ihrer Herrschaft zu werden"
AUS_political_events.43.a:	"Wir sind nicht in der Lage, uns zu wehren."
AUS_political_events.43.a.tt:	"§_[Get43PuppetOrNotTt]§! gezwungen sein könnten, sich einer [FROM.GetAdjective] Fraktion anzuschließen"
AUS_political_events.43.b:	"Nur über unsere Leichen"
AUS_political_events.43.c:	"Wir waren nie ihre Untertanen, aber sie können die Staaten haben, die es waren."
43TtIsPuppet:	"[FROM.FROM.OWNER.GetNameDefCap]"
43TtIsNotPuppet:	"[ROOT.GetNameDefCap]"
AUS_political_events.44.t:	"[FROM.GetNameDefCap] Unterwirft sich unseren Forderungen"
AUS_political_events.44.desc:	"Die Reaktion auf unsere Forderungen gegenüber [FROM.GetNameDef] war höchst willkommen. Sie werden sich [Get44PuppetOrNotDesc] unserer Herrschaft unterwerfen und mit sofortiger Wirkung zu einem unserer Untertanen werden. Das ist ein großer Erfolg für uns in unseren Bemühungen, unser Imperium wiederherzustellen!"
AUS_political_events.44.a:	"Wunderbar!"
44DescIsPuppet:	"[FROM.FROM.OWNER.GetNameDef]"
44DescIsNotPuppet:	"selbst"
AUS_political_events.45.t:	"[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
AUS_political_events.45.desc:	"In eklatanter Respektlosigkeit und Missachtung ihrer eigenen Sicherheit hat [FROM.GetNameDef] beschlossen, unseren Vorschlag abzulehnen. Der Deal wäre für beide Seiten vorteilhaft gewesen, aber sie scheinen unsere Gefühle in dieser Hinsicht nicht zu teilen."
AUS_political_events.45.a:	"Dann streiten wir darüber!"
AUS_political_events.46.t:	"[FROM.GetNameDefCap] Überträgt Staaten, um Unterwerfung zu vermeiden"
AUS_political_events.46.desc:	"In dem Versuch, die Unterwerfung zu vermeiden und ihre Unabhängigkeit zu beschneiden, hat die [FROM.GetAdjective]-Führung zu drastischen Maßnahmen gegriffen. Anstatt sich uns zu unterwerfen, übergeben sie uns ihre ehemals von uns kontrollierten Staaten. Das war nicht das erwartete Ergebnis unserer Forderungen und wir müssen nun Stellung dazu beziehen, ob wir es akzeptieren oder nicht."
AUS_political_events.46.a:	"Noch besser!"
AUS_political_events.46.b:	"Nein. Wir wollen sie unter unserer Kontrolle haben!"
AUS_political_events.47.t:	"[FROM.GetNameDefCap] lehnt den Vorschlag ab"
AUS_political_events.47.desc:	"Trotz unserer Bemühungen, die [FROM.GetAdjective] zu besänftigen, scheinen sie entschlossen zu sein, dass das einzig akzeptable Ergebnis darin besteht, dass wir uns ihren Forderungen beugen und sie ein Marionettenregime in unserem Land installieren lassen. Sie betonen, dass es keinen Raum für Kompromisse gibt, entweder sind wir für sie oder gegen sie."
AUS_political_events.47.a:	"Wir werden uns nicht einschüchtern lassen!"
AUS_political_events.47.b:	"Es war einen Versuch wert."
AUS_political_events.48.t:	"[FROM.GetNameDefCap] Installiert einen Habsburger Monarchen auf unserem Thron"
AUS_political_events.48.desc:	"Bei der Geschichte von [FROM.GetNameDef] war es unvermeidlich, dass sie sich als unser Oberherr früher oder später in unsere Innenpolitik einmischen würden. Man hat uns mitgeteilt, dass sie [ROOT.GetLeader] als Führer für unser Land eingesetzt haben."
AUS_political_events.48.a:	"Wie es Habsburger tun..."
AUS_political_events.49.t:	"[FROM.GetNameDefCap] fordert Übergabe von Schlesien"
AUS_political_events.49.desc:	"Die Welt um uns herum verändert sich, die Spannungen nehmen zu. Heute erreichte uns eine Mitteilung, in der die [FROM.GetAdjective]-Regierung uns auffordert, Schlesien an sie abzutreten. Schlesien war historisch gesehen Teil ihres Reiches, kam aber nach dem Ende des Großen Krieges unter unsere Kontrolle und ist es seither. \n[FROM.GetNameDefCap] hat sich entschieden, einige Fabriken im Gegenzug für die Staaten Niederschlesien und Oberschlesien anzubieten, in der Hoffnung, dass dies unsere Entscheidung erleichtern würde."
AUS_political_events.49.a:	"Gut, sie können diese Staaten haben."
AUS_political_events.49.b:	"Unser Territorium ist viel mehr wert als das!"
AUS_political_events.50.t:	"[FROM.GetNameDefCap] Übergeben Sie Schlesien"
AUS_political_events.50.desc:	"Wir haben von den [FROM.GetAdjective]s gehört, dass wir Schlesien für sie erwerben wollen. Sie haben diesem Deal gnädigerweise zugestimmt und werden die Staaten sofort an uns übertragen. Im Gegenzug haben wir ihnen ein paar Fabriken in Staaten ihrer Wahl gebaut,"
AUS_political_events.50.a:	"Ein äußerst fairer Deal!"
AUS_political_events.51.t:	"[FROM.GetNameDefCap] Weigert sich, Schlesien zu übergeben"
AUS_political_events.51.desc:	"Die Mitteilung der [FROM.GetAdjective]-Diplomaten war nicht die, die wir zu hören gehofft hatten. Nicht nur, dass [FROM.GetNameDef] den Deal ablehnt, sie tun dies in einer Art und Weise, die man nur als abfällig und herabsetzend bezeichnen kann, indem sie in Frage stellen, warum sie zu so etwas bereit sein sollten und warum wir meinen, das Recht zu haben, etwas zu verlangen."
AUS_political_events.51.a:	"Sie werden diese Worte fressen!"
AUS_political_events.52.t:	"[FROM.GetNameDefCap] Fordert unsere Integration"
AUS_political_events.52.desc:	"Auf der Grundlage uralter Ansprüche und familiärer Bindungen hat der [FROM.GetAdjective] Monarch [FROM.GetLeader] gefordert, dass wir uns seiner Herrschaft unterwerfen. Da er behauptet, dass die Stadt Habsburg als alte Domäne seiner Familie rechtmäßig zu seinem Land gehört, verlangt er, dass wir uns sofort integrieren oder uns dem Zorn seiner neu aufgestellten Armee aussetzen."
AUS_political_events.52.a:	"Wir haben keine andere Wahl als uns zu fügen"
AUS_political_events.52.b:	"Die Habsburger haben kein Recht auf Habsburg!"
AUS_political_events.53.t:	"[FROM.GetNameDefCap] Integriert sich friedlich"
AUS_political_events.53.desc:	"Wir haben erfahren, dass die [FROM.GetAdjective] sich einer Annektierung ihres Landes nicht widersetzen werden und sich stattdessen friedlich in unser glorreiches [ROOT.GetName] integrieren. Wir haben endlich die Kontrolle und den Besitz unserer alten Heimat, des Dorfes Habsburg, zurückgewonnen."
AUS_political_events.53.a:	"Endlich!"
AUS_political_events.54.t:	"[FROM.GetNameDefCap] verweigert uns den rechtmäßigen Anspruch auf Habsburg"
AUS_political_events.54.desc:	"Wir haben die Antwort der [FROM.GetAdjective] Führung erhalten, sie werden sich unseren Forderungen nicht beugen. Indem sie unsere familiären Ansprüche auf die Stadt Habsburg nicht anerkennen, verweigern sie uns den rechtmäßigen Besitz des Landes und beschmutzen damit unsere Ehre. Das kann nicht toleriert werden!"
AUS_political_events.54.a:	"Für Habsburg!"
AUS_political_events.55.t:	"[FROM.GetNameDefCap] will einen Deal über den Besitz von [39.GetName] und [850.GetName] aushandeln"
AUS_political_events.55.desc:	"Die [FROM.GetAdjective] Führung hat sich mit einem Vorschlag an uns gewandt. Schon seit längerer Zeit wollen sie [39.GetName] und [850.GetName] von uns erwerben. Sie sind zu uns gekommen und haben uns ein paar Fabriken als Gegenleistung angeboten, wenn wir ihnen diese Staaten praktisch verkaufen würden."
AUS_political_events.55.a:	"Ein fairer Deal"
AUS_political_events.55.b:	"Unser Land steht nicht zum Verkauf!"
AUS_political_events.56.t:	"[GetHostilityItalianClaimTitle56]"
AUS_seeks_a_deal_title_56:	"[FROM.GetNameDefCap] Übergibt Staaten im Gegenzug für industrielle Investitionen"
AUS_makes_demands_title_56:	"[FROM.GetNameDefCap] Übergibt Staaten"
AUS_political_events.56.desc:	"[GetHostilityItalianClaimDesc56]"
AUS_seeks_a_deal_desc_56:	"Der von uns vorgeschlagene Deal mit [FROM.GetNameDef] ist genehmigt worden. Im Gegenzug für eine beträchtliche industrielle Investition haben die [FROM.GetAdjective] zugestimmt, die Staaten [39.GetName] und [850.GetName] gemäß unserer Forderung zu übergeben."
AUS_makes_demands_desc_56:	"Unsere Forderungen an [FROM.GetNameDef] wurden angenommen. Die [FROM.GetAdjective] werden uns die Staaten [39.GetName] und [850.GetName] sofort übergeben und endlich werden diese beiden Staaten wieder uns gehören!"
AUS_political_events.56.a:	"Großartige Neuigkeiten"
AUS_political_events.57.t:	"[GetHostilityItalianClaimTitle57]"
AUS_seeks_a_deal_title_57:	"[FROM.GetNameDefCap] Lehnt unseren vorgeschlagenen Deal ab"
AUS_makes_demands_title_57:	"[FROM.GetNameDefCap] Lehnt unsere Forderungen ab"
AUS_political_events.57.desc:	"[GetHostilityItalianClaimDesc57]"
AUS_seeks_a_deal_desc_57:	"Die Antwort der [FROM.GetADjective] hat uns erreicht, sie sind mit dem Deal nicht einverstanden. Mit dem Hinweis, dass ihre Ländereien nicht zum Verkauf stehen, lehnen sie jede Möglichkeit eines Verkaufs oder irgendeines Deals bezüglich der fraglichen Staaten entschieden ab."
AUS_makes_demands_desc_57:	"Unsere Forderungen, die wir an die [FROM.GetAdjective]-Führung geschickt haben, wurden nicht wohlwollend aufgenommen. Sie lehnen unsere Forderungen ab und lassen uns keinen Raum, um weiter Druck zu machen oder einen weiteren Versuch zu unternehmen, solche Forderungen zu stellen."
AUS_political_events.57.a:	"Es war einen Versuch wert"
AUS_political_events.58.t:	"[FROM.GetNameDefCap] Fordert Eigentum an [39.GetName] und [850.GetName]"
AUS_political_events.58.desc:	"[FROM.GetNameDefCap] hat sich mit einer scheinbaren Drohung an uns gewandt. Ohne freundliche Worte teilen sie uns mit, dass sie [39.GetName] und [850.GetName] haben wollen, die ihrer Meinung nach rechtmäßig ihnen gehören. Die Staaten waren einst ein Teil des [FROM.GetAdjective] Kernlandes, gehören aber seit dem Großen Krieg zu uns."
AUS_political_events.58.a:	"Gut"
AUS_political_events.58.b:	"Auf gar keinen Fall!"
AUS_political_events.59.t:	"[FROM.GetNameDefCap] Unterstützt den Plan von Alfred Jansa"
AUS_political_events.59.desc:	"Die Regierung von [FROM.GetNameDef] hat wieder einmal ihr Vertrauen in Alfred Jansa gesetzt, einen Feldmarschall mit eindeutig anti-[ROOT.GetAdjective] Gesinnung. Mit seinen Plänen, unsere Grenzen zu befestigen und einem Plan, der auf einen Angriff von uns zugeschnitten ist, war dieser Feldmarschall schon einmal ein Ärgernis für uns und wird es wahrscheinlich wieder sein."
AUS_political_events.59.a:	"Er muss gehen!"
AUS_political_events.59.b:	"Das ist ihre Entscheidung"
AUS_political_events.60.t:	"[FROM.GetNameDefCap] legt Einspruch gegen Alfred Jansas Verteidigungsplan ein"
AUS_political_events.60.desc:	"Eine formelle Beschwerde von [FROM.GetNameDef] über unser jüngstes Engagement für den von Alfred Jansa vorgelegten Defensivplan wurde eingereicht. Sie behaupten, dass diese Maßnahme eindeutig aus Feindseligkeit ihnen gegenüber getroffen wurde und dass sie unseren zukünftigen diplomatischen Beziehungen im Wege stehen wird. Wir sind uns nicht sicher, warum dies eine so heftige Reaktion hervorgerufen hat."
AUS_political_events.60.a:	"Gut, dann nehmen wir stattdessen Franz Böhme."
AUS_political_events.60.a_tt:	"§YFranz Böhme§! wird §GAvailable§! als Chef der Armee. \n\n§YAlfred Jansa§! wird §RNicht mehr verfügbar§! als Chef der Armee."
AUS_political_events.60.b:	"Ein Grund mehr, warum Alfred Jansa bleiben muss!"
AUS_political_events.60.b_tt:	"§YAlfred Jansa§! wird weiterhin als Chef der Armee zur Verfügung stehen"
AUS_political_events.61.t:	"[FROM.GetNameDefCap] Ersetzt Alfred Jansa"
AUS_political_events.61.desc:	"Unser Druck auf die [FROM.GetAdjective]s, Alfred Jansa und seinen törichten Verteidigungsplan sofort zu ersetzen, hat sich ausgezahlt. Anstelle des sehr anti-[ROOT.GetAdjective] Jansa haben sich die [FROM.GetAdjective]s jetzt für den viel angenehmeren Franz Böhme entschieden."
AUS_political_events.61.a:	"Ausgezeichnet!"
AUS_political_events.62.t:	"[FROM.GetNameDefCap] behält Alfred Jansa im Amt."
AUS_political_events.62.desc:	"Trotz unserer Forderungen, dass [FROM.GetNameDef] den so genannten Jansa-Plan nicht durchführt und dafür sorgt, dass dieser Mann keinerlei Macht oder Einfluss hat, haben sich die [FROM.GetAdjective] geweigert, auf unsere Forderungen einzugehen. Wir können nur vermuten, dass dies ein schlechtes Omen für unsere zukünftigen Beziehungen ist."
AUS_political_events.62.a:	"Wie können sie es wagen?"
AUS_political_events.63.t:	"Exilierte [AUS.GetAdjective]s bieten ihren Dienst an"
AUS_political_events.63.desc:	"Der Anschluss von [AUS.GetNameDef] hat dazu geführt, dass viele [AUS.GetAdjective], die sich dieser Entwicklung widersetzten, aus ihrer früheren Heimat vertrieben wurden. Einige dieser Dissidenten sind nun in [ROOT.GetNameDef] angekommen und bieten ihre Dienste in den Fabriken, auf den Straßen und an der Front an."
AUS_political_events.63.a:	"Wir können nicht für ihre Loyalität garantieren."
AUS_political_events.63.b:	"Wir könnten ihre Hilfe gebrauchen"
AUS_political_events.64.t:	"[FROM.GetNameDefCap] bietet industrielle Unterstützung an"
AUS_political_events.64.desc:	"Die [FROM.GetAdjective] haben uns ein Angebot unterbreitet, um unsere Industrie weiter zu fördern. Sie haben angeboten, einen Teil unserer benötigten Produktion von zivilen Konsumgütern zu übernehmen, damit wir uns weiter auf den Bau von Fabriken konzentrieren können."
AUS_political_events.64.a:	"Eine willkommene Überraschung!"
AUS_industrial_help:	"Industrielle Unterstützung"
AUS_political_events.65.t:	"[FROM.GetNameDefCap] Bietet Marktunterstützung"
AUS_political_events.65.desc:	"Die [FROM.GetAdjective] haben uns ein Angebot für einen Rabatt auf ihre Ausrüstung auf dem internationalen Markt gemacht. Ob dies ein Trick ist, um uns dazu zu bringen, mehr von ihnen zu kaufen, oder ein aufrichtiges Angebot, bleibt unklar."
AUS_political_events.65.a:	"Nützlich ist es auf jeden Fall!"
AUS_market_help:	"Marktunterstützung"
AUS_political_events.66.t:	"[FROM.Get.GetNameDefCap] schlägt eine föderative Union vor"
AUS_political_events.66.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat sich an uns gewandt mit einem Angebot, wie er es nennt. Während die Föderation wächst, wird es immer wichtiger, dass alle beteiligten Länder unbedingt zusammenarbeiten. Um dies zu vereinfachen, hat [FROM.GetLeader] vorgeschlagen, dass wir uns alle unter ihm vereinen. \n\n Wir würden zwar Zugeständnisse in Bezug auf unsere Souveränität machen, aber als Teil einer föderativen Nation würden wir auch die Sicherheit genießen, die mit einer größeren Armee und größeren diplomatischen Muskeln einhergeht."
AUS_political_events.66.a:	"Das klingt nach einem fairen Deal"
AUS_political_events.66.b:	"Das nützt uns überhaupt nichts!"
AUS_political_events.67.t:	"[FROM.GetNameDefCap] Akzeptiert die Föderative Union"
AUS_political_events.67.desc:	"Die glorreiche Nachricht, dass [FROM.GetNameDef] sich bereit erklärt hat, Teil unseres neuen föderativen Staates zu werden, hat uns gerade erreicht. Das, was wir anbieten konnten, reichte ihnen offensichtlich aus, um das Angebot als vorteilhaft zu betrachten, auch wenn es ihre Souveränität leicht beeinträchtigt."
AUS_political_events.67.a:	"Großartig!"
AUS_political_events.68.t:	"[FROM.GetNameDefCap] Lehnt den Beitritt zur Föderativen Union ab"
AUS_political_events.68.desc:	"Trotz der offensichtlichen Vorteile und weil es eindeutig das Beste für die Föderation ist, hat [FROM.GetNameDef] unseren Vorschlag für eine engere Union abgelehnt. Über die Gründe kann man nur spekulieren, aber es scheint, dass sie nicht das Beste für die Föderation im Sinn haben."
AUS_political_events.68.a:	"Sie sind eine Gefahr für die Einheit der Föderation!"
AUS_political_events.68.b:	"Wir werden sie genau im Auge behalten."
AUS_political_events.69.t:	"Anschlussrisiko gemildert"
AUS_political_events.69.desc:	"[GetHowAvoidedAnschluss]"
AUS_joined_faction:	"Da wir nun Teil der [ROOT.GetFactionName] sind, scheint es, dass [GER.GetLeader] sich gegen den Versuch entschieden hat, uns in [GER.GetNameDef] einzugliedern.\n\nWir haben sehr hart daran gearbeitet, um sicherzustellen, dass wir unsere Unabhängigkeit bewahren können, und der Lohn dafür war unsere Zeit wert."
AUS_became_subject:	"[ROOT.GetNameDefCap] durchläuft einige radikale Veränderungen, seit wir unsere Unabhängigkeit verloren haben. Obwohl viele davon weniger angenehme Nebeneffekte des Verlustes der vollen Unabhängigkeit sind, hat sich vor kurzem ein seltener positiver Effekt gezeigt. Da wir nicht mehr unabhängig sind, würde ein Versuch, uns zu integrieren, mehr als nur unseren eigenen Zorn hervorrufen.\n\nDeshalb scheint [GER.GetLeader] den Plan, uns zu zwingen, sich [GER.GetNameDef] anzuschließen, abgesagt zu haben."
AUS_political_events.69.a:	"Ein Silberstreif in unserer derzeitigen Situation"
AUS_political_events.69.b:	"Sicherheit für unsere Zeit!"
AUS_political_events.69.a_tt:	"Entfernt die §YAnti-Anschluss Maßnahmen§! Beschlüsse."
AUS_political_events.70.t:	"[FROM.GetAdjective] Regierung bietet Entschädigung im Gegenzug für Garantien"
AUS_political_events.70.desc:	"\n[FROM.GetLeader] von [FROM.GetNameDef] hat sich dieses Mal persönlich an uns gewandt. Unsere bisherigen Gespräche sind nicht so verlaufen, wie sie es sich erhofft hatten, und sie haben beschlossen, uns ein neues Angebot zu machen, in der Hoffnung, dass wir unsere Meinung ändern. Da sie diese Angelegenheit sehr ernst nehmen, haben sie uns angeboten, die Kosten für zwei neue Fabriken in unserem Land zu übernehmen, und sie versichern uns, dass sie uns dankbar wären, wenn wir unsere Meinung ändern und ihnen eine Garantie geben würden."
AUS_political_events.70.a:	"Das ändert die Dinge!"
AUS_political_events.70.b:	"Unsere Antwort bleibt bestehen. Nein."
AUS_political_events.71.t:	"[FROM.GetNameDefCap] bietet Garantie für industrielle Unterstützung"
AUS_political_events.71.desc:	"Unsere Bemühungen, den [FROM.GetAdjective] Führer [FROM.GetLeader] zu überzeugen, haben sich gelohnt. Wir werden den Bau von zwei Fabriken für sie unterstützen müssen, und obwohl dies unsere eigenen industriellen Bemühungen höchstwahrscheinlich behindern wird, können wir nun etwas beruhigter sein, da wir wissen, dass sie im Falle eines Angriffs auf unsere Souveränität auf unserer Seite stehen."
AUS_political_events.71.a:	"Endlich mal eine gute Nachricht!"
AUS_political_events.72.t:	"[FROM.GetNameDefCap] Weigert sich trotz Entschädigungsangebots zu helfen"
AUS_political_events.72.desc:	"Man kann nicht sagen, dass wir nicht unser Bestes getan haben. Wir haben uns auf den Vertrag von Saint-Germain-En-Laye berufen und eine Entschädigung angeboten, die weit über das hinausgeht, was von einem Land unserer Größe und in unserer Lage zu erwarten gewesen wäre. Trotz alledem weigert sich [FROM.GetNameDef] hartnäckig, uns im Einklang mit dem Vertrag zu garantieren, den sie selbst mit ausgearbeitet haben. Wir können in Zukunft nicht auf ihre Hilfe zählen."
AUS_political_events.72.a:	"Wir werden uns durchsetzen, und wir werden es ihnen zeigen!"
AUS_political_events.73.t:	"[FROM.GetNameDef] schlägt eine Revision des Vertrages von Saint-Germain-En-Laye vor"
AUS_political_events.73.desc:	"\nAdamant hat in seinem Bestreben, die [FROM.GetAdjective] aufrüsten zu dürfen, erneut einen überarbeiteten und weniger strengen Vertrag vorgeschlagen, der es uns erlaubt, das Tempo ihrer Aufrüstung zu kontrollieren. Die Überarbeitung würde es ihnen erlauben, mit der Ausbildung von Truppen zu beginnen, aber ihre Industrie würde noch ein weiteres Jahr eingeschränkt werden."
AUS_political_events.73.a:	"Das können wir akzeptieren"
AUS_political_events.73.a_tt:	"Wir werden [FROM.GetNameDef]s vorgeschlagene Revision unterstützen. Alle Garantiegeber müssen zustimmen, damit die Revision in Kraft treten kann."
AUS_political_events.73.b:	"Nein, der Vertrag muss bestehen bleiben."
AUS_political_events.73.b_tt:	"Wir werden §Rnot§! [FROM.GetNameDef]s vorgeschlagene Revision unterstützen. Alle Garantiegeber müssen zustimmen, damit die Revision durchgeführt werden kann."
AUS_political_events.73.c:	"Wenn sie wieder aufrüsten sollen, wollen wir jemanden, der das überwacht!"
AUS_political_events.73.c_tt:	"Ein Aufseher mit demokratischer Gesinnung wird für die Dauer des revidierten Vertrags in Österreich eingesetzt."
AUS_political_events.74.t:	"Die Bürgen stimmen der Revision des Vertrags zu"
AUS_political_events.74.desc:	"Nach langen Debatten und vielen Diskussionen sind die Bürgen schließlich zu einem Ergebnis gekommen. Wir dürfen im Laufe der Zeit teilweise aufrüsten. Ab heute werden uns keine Beschränkungen mehr bei der Ausbildung neuer Truppen und der Erhöhung der Anzahl unserer Soldaten im Feld im Wege stehen. Die Beschränkungen werden in einem Jahr vollständig aufgehoben, sollte sich in der Welt nichts radikal ändern."
AUS_political_events.74.a:	"Die diplomatischen Bemühungen haben sich gelohnt!"
AUS_political_events.75.t:	"Die Garantiegeber weigern sich, den Vertrag zu überarbeiten"
AUS_political_events.75.desc:	"Trotz unserer Bemühungen bleiben die Garantiegeber standhaft. Wir dürfen unter keinen Umständen wieder aufrüsten. Unsere diplomatischen Bemühungen, sie zu überzeugen und Kompromisse vorzuschlagen, sind auf taube Ohren gestoßen. Die [ROOT.GetAdjective] Bevölkerung hegt nun eine starke Abneigung gegen diese Garanten."
AUS_political_events.75.a:	"Wir müssen einfach durchhalten."
AUS_political_events.75.b:	"Genug ist genug, wir brauchen sie nicht!"
AUS_political_events.76.t:	"Die Bürgen stimmen einer Revision des Vertrages zu und ernennen einen Aufseher"
AUS_political_events.76.desc:	"\nNach vielen Debatten und Diskussionen sind die Garantiegeber endlich zu einem Ergebnis gekommen. Wir dürfen im Laufe der Zeit teilweise aufrüsten. Ab heute stehen uns keine Beschränkungen mehr im Weg, wenn es darum geht, neue Truppen auszubilden und die Zahl unserer Soldaten im Feld zu erhöhen. Unsere Industrie unterliegt immer noch Beschränkungen, wenn auch weniger strengen. Die Beschränkungen werden in einem Jahr vollständig aufgehoben, sollte sich in der Welt nichts radikal ändern.\n\nDieser Sieg hat jedoch seinen Preis. Die Bürgen trauen uns nicht zu, dass wir uns aus Konflikten heraushalten können, und haben einen Aufseher ernannt, der während des gesamten Prozesses in unserer Regierung bleiben muss."
AUS_political_events.76.a:	"Wir nehmen es hin!"
AUS_political_events.77.t:	"Eine unmittelbare Bedrohung"
AUS_political_events.77.desc:	"Einige unserer erfahrensten und geschicktesten Diplomaten beobachten seit langem das Risiko, dass [GER.GetNameDef] nach den von [GER.GetLeader] mal bestätigten, mal dementierten Plänen handeln würde. Es scheint, dass es in letzter Zeit eine ziemlich radikale Veränderung gegeben hat und unsere Quellen glauben nun, dass ein Versuch, uns zu annektieren, sehr wohl unmittelbar bevorstehen könnte."
AUS_political_events.77.a:	"Machen Sie sich auf den Aufprall gefasst..."
AUS_political_events.77.a_tt:	"§R[GER.GetNameWithFlag] hat den Prozess zum Anschluss an uns eingeleitet. Wir können das nicht mehr beeinflussen! §!"
AUS_political_events.78.t:	"Kommunisten in [FROM.GetNameDef] suchen unsere Unterstützung"
AUS_political_events.78.desc:	"Die Anführer der [FROM.GetCommunistParty] in [FROM.GetNameDef] haben sich an uns gewandt und uns erneut um Hilfe gebeten. Obwohl sie sich derzeit nicht in einem bewaffneten Konflikt befinden, ist ihnen das Scheitern des Bürgerkriegs und des Putsches im Jahr 1934 an der Seite der Sozialdemokraten noch immer im Gedächtnis verankert. Sie wünschen sich unsere Hilfe, während sie erneut um die Macht in ihrem Land kämpfen."
AUS_political_events.78.a:	"Wir werden helfen, wenn wir können!"
AUS_political_events.78.b:	"Wir haben Besseres zu tun"
AUS_political_events.79.t:	"[FROM.GetNameDefCap] bietet ihre Unterstützung an"
AUS_political_events.79.desc:	"Wie wir gehofft hatten, hat uns die [FROM.GetAdjective] Führung in diesen schwierigen Zeiten Unterstützung angeboten. Wir können uns natürlich nicht darauf verlassen, dass sie alle unsere Probleme lösen, aber ihre Unterstützung ist uns wieder einmal sehr willkommen. Vor allem, da sich unser Machtkampf weiter hinzieht."
AUS_political_events.79.a:	"Großartig!"
AUS_political_events.79.a_tt:	"Falls ein Krieg ausbricht, wird [FROM.GetFlag]§Y[FROM.GetNameDef]§! uns eher Freiwillige schicken und uns Leihgeräte zur Verfügung stellen."
AUS_political_events.80.t:	"[FROM.GetNameDefCap] lehnt unseren Aufruf zur Unterstützung ab"
AUS_political_events.80.desc:	"Unter Berufung auf geringfügige ideologische Differenzen und unser Zögern gegenüber dem revolutionären Kommunismus hat [FROM.GetNameDef] unseren Hilferuf zurückgewiesen. Wir werden auf uns allein gestellt sein."
AUS_political_events.80.a:	"Wir dachten wirklich, sie würden uns helfen!"
AUS_political_events.81.t:	"[FROM.GetNameDefCap] passt sich unserer Politik an"
AUS_political_events.81.desc:	"Lange Zeit haben die [FROM.GetAdjective] hartnäckig an ihrer eigenen Form des Kommunismus festgehalten, die als Austromarxismus bezeichnet wird. Dieses politische Schisma ist eine Form der Kombination aus Sozialdemokratie und echtem Kommunismus, für die wir wenig übrig haben. Es scheint, dass sie nun endlich zur Vernunft gekommen sind und diesen Fehler einer Ideologie abgeschafft haben, um sich mit uns zu verbünden, in der Hoffnung, unseren Schutz zu genießen, falls feindliche Kräfte sie angreifen sollten."
AUS_political_events.81.a:	"Großartig, wir werden ihnen unseren Schutz anbieten."
AUS_political_events.81.b:	"Sie werden der wertvollste aller Verbündeten sein... aber noch nicht."
AUS_aligned_with_our_values:	"Im Einklang mit unseren Werten"
AUS_political_events.82.t:	"[FROM.GetNameDefCap] Bietet Garantie"
AUS_political_events.82.desc:	"Unsere Entscheidung, uns stärker an der politischen Ideologie von [FROM.GetLeader] zu orientieren, ist gut aufgenommen worden. [FROM.GetNameDefCap] hat uns eine Garantie angeboten und wird uns unterstützen, falls wir Feindseligkeiten ausgesetzt sein sollten."
AUS_political_events.82.a:	"Großartig!"
AUS_political_events.83.t:	"[FROM.GetNameDefCap] befürwortet unseren politischen Kurswechsel"
AUS_political_events.83.desc:	"Unsere Entscheidung, uns stärker an der politischen Ideologie von [FROM.GetLeader] zu orientieren, ist gut aufgenommen worden. [FROM.GetNameDefCap] hat geäußert, dass sie diesen Schritt als einen Schritt in die richtige Richtung begrüßen und hoffen, uns in Zukunft als Verbündete zu sehen."
AUS_political_events.83.a:	"Wir freuen uns darauf! "
AUS_political_events.84.t:	"[FROM.GetAdjective]s Verstärkung der kommunistischen Gefühle in unserem Land"
AUS_political_events.84.desc:	"\nWir sind darauf aufmerksam gemacht worden, dass [AUS.GetNameDef] derzeit versucht, kommunistische Gefühle in unserer Belegschaft zu schüren. Das mag zwar harmlos sein, aber es könnte auch sein, dass dies eine Vorbereitung für etwas ist. Wir haben keine Ahnung, was ihre wahren Absichten sind, aber wir müssen alle Möglichkeiten in Betracht ziehen."
AUS_political_events.84.a:	"Wir sehen kein Problem darin"
AUS_political_events.84.b:	"Verbieten Sie sie!"
AUS_political_events.84.b_tt:	"§Das könnte schlimme Folgen haben!"
AUS_political_events.85.t:	"[FROM.GetNameDefCap] Erlaubt unsere Bemühungen, die Arbeiter zu organisieren"
AUS_political_events.85.desc:	"\nWir waren uns sehr wohl bewusst, dass unsere Aktivitäten in [FROM.GetNameDef] früher oder später entdeckt werden würden. Zum Glück scheint die [FROM.GetLeader] nichts dagegen zu haben, dass wir die kommunistische Stimmung in ihrer Belegschaft stärken und sie über ihre Rechte und Pflichten als gute Arbeiter informieren."
AUS_political_events.85.a:	"Ausgezeichnet"
AUS_political_events.85.a_tt:	"Schaltet Entscheidungen zu §YForderung der Befreiung der Arbeiter§! frei, sobald der Fokus §YForderung der Befreiung der Arbeiter§! abgeschlossen ist"
AUS_political_events.85.2.a_tt:	"Schaltet die Entscheidung zu §YForderung der Befreiung der Arbeiter in [FROM.GetNameDef]§! frei."
AUS_political_events.86.t:	"[FROM.GetNameDefCap] Verbietet Bemühungen zur Organisierung von Arbeitern"
AUS_political_events.86.desc:	"\nIn einem Akt der Respektlosigkeit gegenüber seinen eigenen Arbeitern hat [FROM.GetLeader] unsere Bemühungen, sie über ihre Rechte in der Gesellschaft zu informieren, verboten. Dies ist eindeutig eine feindselige Handlung, nicht nur uns gegenüber, sondern auch gegenüber Arbeitern auf der ganzen Welt."
AUS_political_events.86.a:	"Verflucht!"
AUS_political_events.86.b:	"Wir werden diese Feindseligkeit stoppen!"
AUS_political_events.87.t:	"[FROM.GetAdjective] Forderungen nach einem kommunistischen Regime"
AUS_political_events.87.desc:	"Nachdem die [FROM.GetAdjective] Propaganda unter unseren Arbeitern seit einiger Zeit die kommunistische Stimmung anheizt, hat uns nun ein Ultimatum erreicht. [FROM.GetLeader] verlangt, dass wir eine friedliche kommunistische Machtübernahme zulassen, so wie er glaubt, dass unser Volk sie will. Für den Fall, dass wir uns weigern, versichert er uns, dass sie unseren Arbeitern beistehen werden, was auch immer sie zu tun gedenken."
AUS_political_events.87.a:	"Wir haben keine Wahl."
AUS_political_events.87.b:	"Wir treffen unsere eigenen Entscheidungen."
AUS_political_events.88.t:	"[FROM.GetNameDefCap] Installiert kommunistische Regierung"
AUS_political_events.88.desc:	"Unsere unermüdlichen Bemühungen in [FROM.GetNameDef] haben sich endlich ausgezahlt. Die Arbeiter jubeln, als der neue Führer [FROM.GetLeader] die Führung des Landes übernimmt."
AUS_political_events.88.a:	"Willkommen, Genossinnen und Genossen!"
AUS_political_events.89.t:	"[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
AUS_political_events.89.desc:	"Trotz klarer Anzeichen dafür, dass das Volk es will, haben die [FROM.GetAdjective] und ihr Führer [FROM.GetLeader] beschlossen, nicht zurückzutreten, damit eine geeignetere Regierung die Führung übernehmen kann. WIR müssen unsere Option in Betracht ziehen und das tun, was für das Volk richtig ist."
AUS_political_events.89.a:	"Ein Krieg wäre noch schlimmer"
AUS_political_events.89.b:	"Die Stimme des Volkes wird gehört werden!"
AUS_political_events.90.t:	"Die Ergebnisse unserer Wahl"
AUS_political_events.90.desc:	"Die erste Wahl seit der 'Selbstauflösung des Parlaments' ist abgeschlossen. Die Wahlbeteiligung war hoch, denn das Volk hat gesehen, was aus unserem Land wird, wenn es seine Pflichten als Wähler vernachlässigt. Die drei Spitzenkandidaten liegen bei der endgültigen Auszählung nur wenige Stimmen auseinander."
AUS_political_events.90.a:	"Kurt Schuschnigg ist im Herzen ein Demokrat!"
AUS_political_events.90.a_tt:	"§YKurt Schuschnigg§! wird Vorsitzender der Partei §YDemocratic§!."
AUS_political_events.90.b:	"Karl Renner hat uns schon einmal gut gedient!"
AUS_political_events.90.c:	"Vinzenz Schumy kann mit den meisten Wählern umgehen!"
AUS_political_events.91.t:	"[ROOT.GetLeader] Möchte auf dem Schlachtfeld sein"
AUS_political_events.91.desc:	"In letzter Zeit hat unser Erzherzog, Seine Majestät [ROOT.GetLeader], ständig über die Lage an der Front gegrübelt. Er drückt ein Gefühl der Unzulänglichkeit aus und wünscht sich, seine Männer direkter zu führen. Heute wurde die Angelegenheit erneut zur Sprache gebracht. Unser Erzherzog möchte seine Männer mutig in die Schlacht führen und das Regieren jemand anderem überlassen."
AUS_political_events.91.a:	"Fahren Sie fort, Erzherzog! Wir werden dafür sorgen, dass jemand Ihren Platz warm hält."
AUS_political_events.91.b:	"Auch Erzherzöge müssen an ihrem Platz bleiben"
AUS_political_events.91.a_tt:	"Die neue Hauptstadt wird §YVaduz§! heißen."
AUS_political_events.91.a_tt2:	"§YOtto von Habsburg§! wird ein §YSkill 2§! Feldmarschall"
AUS_political_events.92.t:	"[FROM.GetNameDefCap] bittet um den Kauf von Alaska"
AUS_political_events.92.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat sich an uns gewandt mit der Bitte, den Staat [463.GetName] zu kaufen. Damals, 1867, als [USA.GetNameDef] den Staat vom damaligen Russischen Reich kaufte, wurde das Angebot zunächst an [FROM.GetNameDef] gerichtet. Das Angebot wurde damals abgelehnt, aber seitdem haben sie ihre Meinung geändert und wollen den Staat nun von uns erwerben. Im Gegenzug bieten sie uns an, großzügig zu zahlen. "
AUS_political_events.92.a:	"Unser Gebiet steht nicht zum Verkauf!"
AUS_political_events.92.b:	"Wir haben keine Verwendung für [463.GetName]."
generic_this_might_cause_tt:	"§Das könnte _§! verursachen:"
AUS_political_events.93.t:	"[FROM.GetNameDefCap] Verkauft uns [463.GetName]"
AUS_political_events.93.desc:	"Wir haben die Nachricht von [FROM.GetLeader] erhalten, dass sie bereit sind, uns den Staat [463.GetName] für die von uns angebotene Summe zu verkaufen. Der Staat wird uns sofort übertragen, damit wir mit den Integrationsbemühungen beginnen können."
AUS_political_events.93.a:	"Großartig"
AUS_political_events.94.t:	"[FROM.GetNameDefCap] weigert sich, [463.GetName] zu verkaufen"
AUS_political_events.94.desc:	"Trotz der sehr hohen Summe, die wir [FROM.GetNameDef] angeboten haben, um [463.GetName] von ihnen zu erwerben, lehnen sie diesen Deal ab. Wir haben einen sehr legitimen Anspruch auf [463.GetName], den sie uns jetzt aktiv verweigern. Wir müssen uns überlegen, wie wir am besten vorgehen."
AUS_political_events.94.a:	"Es war einen Versuch wert"
AUS_political_events.94.b:	"Wir werden sie befreien!"
AUS_political_events.95.t:	"Die [ROOT.GetAdjective] Armee kehrt nach erfolgreichem Feldzug zurück"
AUS_political_events.95.desc:	"Als der österreichisch-preußische Krieg am 22. Juli 1866 zu Ende ging, marschierte unsere tapfere Armee nach Hause. Bei ihrer Rückkehr hieß es, dass sie einen Soldaten mehr in ihren Reihen hatte, als sie in den Krieg gezogen war. Ob dies wahr ist oder nur ein Ammenmärchen, bleibt umstritten. Wir können jedoch bestätigen, dass dies der Fall ist, denn unsere glorreiche Armee kehrt nun um einen Mann stärker zurück."
AUS_political_events.95.a:	"Willkommen bei [ROOT.GetNameDef]!"
AUS_political_events.95.a_tt:	"Ein wahrer [ROOT.GetAdjective] Patriot hat sich unseren Reihen angeschlossen"
AUS_political_events.96.t:	"[FROM.GetNameDefCap] Möchte sich dem [ROOT.GetFactionName] anschließen"
AUS_political_events.96.desc:	"[FROM.GetLeader] der neu entstandenen demokratischen [FROM.GetName] ist mit der Bitte an uns herangetreten, sich [ROOT.GetFactionName] anzuschließen. Obwohl sie seit dem Ende des Großen Krieges allein dastanden, haben das aktuelle politische Klima und die zunehmenden Spannungen in der Welt sie zu einem Sinneswandel veranlasst. Da sie nun wieder eine richtige Demokratie sind, haben sie sich entschlossen, uns die Hand zu reichen und uns zu versichern, dass sie eine große Bereicherung für die Fraktion sein werden!"
AUS_political_events.96.a:	"Sie sind herzlich eingeladen, der Fraktion beizutreten!"
AUS_political_events.96.b:	"Wir trauen ihnen nicht."
AUS_political_events.97.t:	"[FROM.GetNameDefCap] Heißt uns willkommen in der [ROOT.GetFactionName]"
AUS_political_events.97.desc:	"Unserem Antrag auf Beitritt zur [ROOT.GetFactionName] wurde stattgegeben! Wir sind uns zwar sicher, dass unser Land diesen radikalen Kurswechsel brauchte, aber die Lage ist ernst. Nach dem Großen Krieg haben wir uns von allen Bündnissen losgesagt, in der Hoffnung, dass eine ähnliche Situation nie wieder eintritt. Während wir uns nun in der relativen Sicherheit unseres neuen Bündnisses einrichten, wissen wir, dass der Frieden in der Tat eine zerbrechliche Sache ist. "
AUS_political_events.97.a:	"Es musste getan werden"
AUS_political_events.98.t:	"[FROM.GetNameDefCap] lehnt unseren Antrag auf Beitritt zur [FROM.GetFactionName] ab"
AUS_political_events.98.desc:	"Trotz unserer besten Bemühungen wurde unsere Anfrage an die [FROM.GetAdjective], der [FROM.GetFactionName] beizutreten, abgelehnt. Ihre Antworten auf die Frage, warum, haben keinen wirklichen Grund geliefert und es scheint, dass wir wieder einmal auf uns allein gestellt sind."
AUS_political_events.98.a:	"Wie schrecklich von ihnen!"
AUS_political_events.98.b:	"Es scheint, als müssten wir alles selbst machen!"
AUS_political_events.99.t:	"[FROM.GetNameDefCap] Lehnt unsere Forderungen ab"
AUS_political_events.99.desc:	"[GetRejectionAmounts]"
AUS_has_not_rejected_before:	"[FROM.GetLeader] der [FROM.GetAdjective] Führung hat auf unsere Forderungen geantwortet. Der Brief ist zwar diplomatisch formuliert, hat aber dennoch einen beleidigenden Unterton. Unsere Bedenken wurden abgetan, als wären sie nichtig, was bedeutet, dass unsere Sorgen über [FROM.GetNameDef] tatsächlich berechtigt waren. Aus den Reihen unserer Führung wurden Stimmen laut, dass wir die [FROM.GetAdjective] weiter zur Unterwerfung drängen sollten, da dies unsere zukünftigen Pläne für sie erleichtern könnte, doch eine Minderheit meint, wir sollten in Betracht ziehen, den [FROM.GetAdjective] diesen sinnlosen Sieg zu überlassen."
AUS_GER_cannot_take_a_no:	"Trotz des anhaltenden und zunehmenden Drucks auf [FROM.GetNameDef], hält [FROM.GetLeader] an [FROM.GetLeader.GetHerHis] fest. Arthur Seyss-Inquart wird nicht als Berater in der Regierung zugelassen werden, egal was wir sagen oder tun. Wir werden das umgehen müssen, es wird nur ein kleines Ärgernis sein."
AUS_political_events.99.a:	"Sie werden sich uns unterwerfen!"
AUS_refuses_to_submit:	"Sie weigern sich, sich uns zu unterwerfen"
AUS_political_events.99.b:	"Sollen sie das doch haben, sollen sie doch ihre Wachsamkeit verringern..."
AUS_bullied_austria:	"Unter Druck gesetzt [AUS.GetNameDef]"
AUS_political_events.100.t:	"Weiterer Druck zur Installation von Arthur Seyss-Inquart"
AUS_political_events.100.desc:	"\nTrotz unserer früheren Ablehnung, Arthur Seyss-Inquart in unsere Regierung einzusetzen, wird der [FROM.GetAdjective] Führer [FROM.GetLeader] nicht aufhören, dies zu fordern. Obwohl der Druck auf uns dadurch zugenommen hat, behalten wir immer noch unsere Souveränität und die Kontrolle über unsere eigene Politik, und die Wahl bleibt immer noch bei uns."
AUS_political_events.100.a:	"Es gibt einen Grund, warum sie uns unter Druck setzen, geben Sie nicht nach!"
AUS_trying_to_control_us:	"Sie versuchen, uns zu kontrollieren"
AUS_political_events.100.b:	"Wir riskieren Vergeltungsmaßnahmen, wenn wir uns weigern"
AUS_political_events.101.t:	"[FROM.GetNameDefCap] Beendet die Bemühungen, Arthur Seyss-Inquart zu installieren"
AUS_political_events.101.desc:	"Nach langem Hin und Her über etwas, das sie sicherlich nichts angeht, hat [FROM.GetNameDef] endlich ihre Versuche eingestellt, unsere Politik unrechtmäßig zu beeinflussen. Man kann nur vermuten, dass sie jetzt sehr unzufrieden mit uns sind, aber das ist nicht unser Hauptanliegen. Unser Hauptanliegen war, ist und wird immer die Verbesserung von [ROOT.GetNameDef] sein."
AUS_political_events.101.a:	"Schließlich"
AUS_political_events.102.t:	"Der Führer plant die Expansion"
AUS_political_events.102.desc:	"In einer kürzlich von [ROOT.GetLeader] einberufenen Konferenz teilte der Führer einige seiner Ambitionen für die zukünftige Expansion von [ROOT.GetNameDef] mit. Die erste derartige Expansion ist eine, die [ROOT.GetLeader.GetSheHe] als wenig riskant ansieht. Das [AUS.GetAdjective] Volk unterscheidet sich nicht von unserem, und es vertritt meist ähnliche Ansichten, wie das politische Klima im Land beweist. Der Führer glaubt, dass eine solche Expansion auf diplomatischem Wege möglich ist, wenn genügend Zeit bleibt, um [ROOT.GetAdjective] freundliche Gefühle in [AUS.GetNameDef] zu entwickeln."
AUS_political_events.102.a:	"Eine wunderbare Idee!"
AUS_anschluss_ratio_ticking_down:	"Die §YTotal Army Fighting Strength§!, die erforderlich ist, um den National Focus §YAnschluss§! zu starten, wird wöchentlich gesenkt. Der Betrag entspricht der Popularität von §YNeutralität§! in §Y[AUS.GetNameWithFlag]§!."
AUS_anschluss_ratio_ticking_down_monarchist:	"Die §YTotal Army Fighting Strength§!, die benötigt wird, um den National Focus §YAnschluss§! zu starten, wird wöchentlich gesenkt. Der Betrag entspricht der Popularität des §YFaschismus§! in §Y[AUS.GetNameWithFlag]§!."
AUS_political_events.103.t:	"Besorgniserregender Bericht über [GER.GetAdjective] Expansionismus"
AUS_political_events.103.desc:	"Während wir [GER.GetAdjective] Absichten, uns zu annektieren, schon lange vermutet haben, hat der Bericht, den wir erst heute Morgen erhalten haben, die Dinge in eine neue, viel schlimmere Perspektive gerückt. Es scheint, dass vor kurzem eine Konferenz stattgefunden hat, auf der [GER.GetLeader] abscheuliche Ideen geäußert hat, wie wir in ihr Land integriert werden könnten. Trotz unserer Bemühungen scheint es, dass diese streng vertraulichen Informationen die Massen erreicht haben, und, was noch besorgniserregender ist, politische Parteien, die dies für eine großartige Idee zu halten scheinen. Diese Gruppen werden höchstwahrscheinlich den Willen unseres Volkes untergraben, sich zu wehren, sollten diese erbärmlichen Pläne der [GER.GetLeader] verwirklicht werden."
AUS_political_events.103.a:	"Das ist schlecht."
AUS_political_events.104.t:	"Das [GER.GetAdjective] Exil"
AUS_political_events.104.desc:	"Heute Morgen fand ein höchst ungewöhnliches Treffen statt. Unsere Führung sah sich einem seltsamen Mann gegenüber, bei dem sie das Gefühl nicht loswurde, dass sie ihn schon einmal gesehen hatten, sogar die Stimme kam ihnen bekannt vor. Dieser Mann behauptet, er sei ein aufstrebender Künstler, er sei von [GER.GetNameDef] gereist und wolle uns helfen. Er sagt, er sei ein fähiger Anführer und unser Land brauche dringend einen solchen. Als wir unsere Grenzwächter fragen, verneinen sie, dass jemand mit diesem Namen die Grenze überquert hat und dass eine Elizabeth Hiedler am ehesten in Frage käme."
AUS_political_events.104.a:	"Das passiert nicht, darauf fallen wir nicht herein. "
AUS_political_events.104.b:	"Was kann da schon schiefgehen?"
AUS_political_events.104.c:	"Elizabeth...?"
AUS_british_monarch:	"Anführerin, die von einer langen Reihe britischer Königinnen abstammt"
AUS_political_events.105.t:	"[FROM.GetNameDefCap] Zieht ihre Unterstützung zurück"
AUS_political_events.105.desc:	"Da [GER.GetNameDef] umso aggressiver darauf gedrängt hat, dass wir uns von ihnen annektieren lassen, dachten wir, wir könnten uns auf die [ITA.GetAdjective] und ihre Garantie verlassen. Es scheint, dass dies nicht der Fall war. Als sie mit einer [GER.GetAdjective]-Aggression drohten, machten sie sofort einen Rückzieher und ließen uns in einer prekären Situation zurück. Es scheint, dass ihre Versprechen nichts als Worte waren."
AUS_political_events.105.a:	"Es ist eine verlorene Sache."
AUS_political_events.105.b:	"Wir werden allein stehen!"
AUS_political_events.106.t:	"[FROM.GetNameDefCap] bekräftigt ihre Unterstützung"
AUS_political_events.106.desc:	"Angesichts der jüngsten Feindseligkeiten von [GER.GetNameDef] haben sich die [ITA.GetAdjective] an uns gewandt, um ihre Unterstützung zu bekräftigen. Ungeachtet der Drohungen werden sie unsere Unabhängigkeit garantieren, und sollte es zu einem bewaffneten Konflikt kommen, werden sie an unserer Seite kämpfen."
AUS_political_events.106.a:	"Die [GER.GetAdjective]s werden ihr Handeln bereuen!"
AUS_political_events.107.t:	"[FROM.GetNameDefCap] beugt sich dem [GER.GetAdjective] Druck"
AUS_political_events.107.desc:	"Uns hat die niederschmetternde Nachricht erreicht, dass [FROM.GetLeader] sich den Forderungen der [GER.GetAdjective] nach ihrer Integration in [GER.GetNameDef] gebeugt hat. Obwohl wir den [FROM.GetAdjective] Garantien angeboten haben, scheint dieses Versprechen nicht genug gewesen zu sein, um sie zu ermutigen, sich zu wehren. Wir haben immer noch ein Interesse an dem Gebiet, also sollten wir in Zukunft vielleicht in Betracht ziehen, die [FROM.GetAdjective]s zu befreien."
AUS_political_events.107.a:	"Wir werden sie retten!"
AUS_political_events.107.a_tt:	"Wenn wir einen Krieg gegen [GER.GetNameDef] beginnen, werden wir gewinnen:\n"
AUS_political_events.107.b:	"Es ist eine verlorene Sache"
AUS_political_events.108.t:	"[FROM.GetNameDefCap] hält eine Militärübung an unserer Grenze ab"
AUS_political_events.108.desc:	"Uns ist zu Ohren gekommen, dass die [FROM.GetAdjective] Armee eine ziemlich große Militärübung direkt an unserer Grenze begonnen hat. Es wurde zwar keine Drohung ausgesprochen, aber wir werden das Gefühl nicht los, dass es sich um eine Art Warnung vor dem handelt, was uns bevorsteht. Wir müssen aufpassen, wie wir uns ihnen gegenüber verhalten, damit sie nicht noch mehr um sich schlagen können."
AUS_political_events.108.a:	"Wir werden ein wachsames Auge behalten!"
AUS_political_events.109.t:	"[FROM.GetNameDefCap] Bewaffnete Grenzsoldaten"
AUS_political_events.109.desc:	"In letzter Zeit berichten unsere Grenzpatrouillen von einer viel höheren Anzahl von Grenzpatrouillen und sogar Wachen auf der [FROM.GetAdjective] Seite der Grenze. Noch beunruhigender ist, dass diese Wachen nicht mehr nur leicht bewaffnet sind, sondern Gewehre tragen, wie man sie von der Armee erwarten würde. Wenn man ihren früheren Aussagen Glauben schenken darf, könnte dies ein Grund zur Sorge sein."
AUS_political_events.109.a:	"Besorgniserregend..."
AUS_political_events.110.t:	"Anti-[ROOT.GetAdjective] Sentiments steigen in [FROM.GetNameDef]"
AUS_political_events.110.desc:	"Infolge einer von der Regierung finanzierten Kundgebung haben wir Berichte über einen starken Anstieg von Anti-[ROOT.GetAdjective] in [FROM.GetNameDef] erhalten. Die [FROM.GetAdjective]-Führung hat sich nicht direkt an uns gewandt, um diese Angelegenheiten anzusprechen, und man kann nur vermuten, dass sie derzeit kein Interesse an Diplomatie hat."
AUS_political_events.110.a:	"In Bezug auf"
AUS_political_events.111.t:	"[FROM.GetNameDefCap] bietet den Nichtangriffspakt an"
AUS_political_events.111.desc:	"Eine Mitteilung der [FROM.GetAdjective] Führung hat uns soeben erreicht. Sie bitten uns, ein gegenseitiges Friedensabkommen zwischen unseren Ländern zu unterzeichnen. Sie erkennen an, dass wir in der Vergangenheit unsere Schwierigkeiten hatten, aber sie wünschen sich jetzt und in Zukunft einen konstruktiveren Dialog."
AUS_political_events.111.a:	"Die Vergangenheit ist Vergangenheit, wir werden unterschreiben!"
AUS_political_events.111.b:	"Im Wissen um die [FROM.GetAdjective]s und was sie verursacht haben, auf keinen Fall!"
AUS_political_events.112.t:	"[FROM.GetNameDefCap] unterschreibt den Nichtangriffspakt"
AUS_political_events.112.desc:	"Unsere Pläne für [FROM.GetNameDef] sind heute einen Schritt weitergekommen, denn wir haben jetzt einen Nichtangriffspakt unterzeichnet. Wir werden uns auch weiterhin bemühen, sie immer enger an uns zu binden. Die Zukunft ist noch eine ungeschriebene Karte, aber sollten wir mit unseren Plänen weiter vorankommen wollen."
AUS_political_events.112.a:	"Ausgezeichnet"
AUS_political_events.113.t:	"[FROM.GetNameDefCap] lehnt den Nichtangriffspakt ab"
AUS_political_events.113.desc:	"Es scheint, dass unser Angebot an die [FROM.GetAdjective] Führung nicht gut genug für sie war. Entweder haben sie unsere Pläne für die Zukunft durchschaut oder sie haben selbst bösartige Pläne in Bezug auf uns. Wir müssen uns auf diese Eventualität vorbereiten, und wenn wir unsere Pläne weiterverfolgen wollen, könnten weitere feindliche Aktionen erforderlich sein."
AUS_political_events.113.a:	"Das ist unglücklich"
AUS_political_events.114.t:	"[FROM.GetNameDef] Bietet industrielle Unterstützung an"
AUS_political_events.114.desc:	"In Anbetracht unseres jüngsten Friedensabkommens zwischen unseren Ländern haben uns die [FROM.GetAdjective] etwas industrielle Unterstützung angeboten. Obwohl unser Industriesektor in der Regel unseren Standards gerecht wird, ist ihre Hilfe natürlich willkommen. Es wurden einige vorsichtige Stimmen laut, die behaupteten, dass [FROM.GetNameDefCap] dies sicherlich aus einem bestimmten Grund tut."
AUS_political_events.114.a:	"Geben Sie unseren Dank weiter."
AUS_political_events.115.t:	"Vorgeschlagene [FROM.GetAdjective]-[ROOT.GetAdjective] Militärübung"
AUS_political_events.115.desc:	"Beamte der [FROM.GetAdjective] Armee haben sich an uns gewandt, in der Hoffnung, eine gemeinsame Militärübung für unsere Armeen zu organisieren. Sie versichern uns, dass dies für unsere beiden Länder am vorteilhaftesten wäre und dass wir viel von ihnen lernen könnten, so wie sie von uns lernen könnten."
AUS_political_events.115.a:	"Warum eigentlich nicht?"
AUS_political_events.115.b:	"Das klingt verdächtig..."
AUS_political_events.116.t:	"[ROOT.GetAdjective]-[FROM.GetAdjective] Militärübung abgeschlossen"
AUS_political_events.116.desc:	"Heute wird die [ROOT.GetAdjective]-[FROM.GetAdjective] Militärübung abgeschlossen. Unsere Truppen haben sehr von dieser Übung profitiert, und wir hoffen, dass auch die [FROM.GetAdjective] davon profitiert hat. Der Einblick in die Operationen der [FROM.GetAdjective] Armee gibt uns auch einen guten Überblick darüber, womit wir arbeiten müssen, sobald unsere Pläne für ihre Zukunft verwirklicht sind."
AUS_political_events.116.a:	"Ausgezeichnet!"
AUS_political_events.117.t:	"[FROM.GetAdjective] Absage für gemeinsame [ROOT.GetAdjective]-[FROM.GetAdjective] Militärübung"
AUS_political_events.117.desc:	"\nTrotz der offensichtlichen Vorteile für uns und [FROM.GetNameDef] haben sie unseren Vorschlag für eine gemeinsame Militärübung abgelehnt. Unsere Armeen hätten viel voneinander lernen können. Dies wäre auch eine gute Gelegenheit für uns gewesen, [FROM.GetNameDef] dahingehend zu beeinflussen, wo wir sie für unsere Pläne für die Zukunft haben wollen."
AUS_political_events.117.a:	"Aber egal..."
AUS_political_events.118.t:	"Organisation eines Imperiums"
AUS_political_events.118.desc:	"Da wir uns auf den Weg gemacht haben, unser Imperium wieder aufzubauen, steht die Frage, wie wir das Imperium organisieren wollen, erneut vor uns. Unsere Vorgänger haben in dieser Frage versagt, was zu einem großen, aber unorganisierten Reich geführt hat. Uns wurde der Vorschlag unterbreitet, eine Fraktion zu bilden, um sicherzustellen, dass unsere Vasallen uns gegenüber loyal bleiben, aber auch, dass sie sich nicht untereinander streiten."
AUS_political_events.118.a:	"Sie werden sich uns anschließen müssen."
AUS_political_events.118.b:	"Wir werden unsere derzeitigen Vorkehrungen beibehalten, um dies zu regeln."
AUS_political_events.118.c:	"Wir werden eine geeignete Organisation dafür einrichten!"
AUS_political_events.118.c.tt:	"§Y[FROM.FROM.GetNameDefCap]§! werden gezwungen sein, sich der §Y[ROOT.GetAdjective]§!-Fraktion anzuschließen"
AUS_political_events.119.t:	"[FROM.GetNameDefCap] Fordert weitere Zugeständnisse"
AUS_political_events.119.desc:	"Obwohl sie bereits beträchtliche Ansprüche auf dem Balkan erhoben haben, wollen die [FROM.GetAdjective] anscheinend noch mehr. Die Forderungen, die sie dieses Mal stellen, werden in unsere Interessensphäre eindringen, sollten wir zustimmen. Gleichzeitig könnten die Konsequenzen, die sie für eine Ablehnung anführen, sehr wohl schrecklich sein."
AUS_political_events.119.a:	"Wir müssen nachgeben"
AUS_political_events.119.b:	"Das können wir nicht zulassen!"
AUS_political_events.120.t:	"[FROM.GetNameDefCap] unterwirft sich unseren Forderungen"
AUS_political_events.120.desc:	"Unsere territorialen Forderungen an die [FROM.GetAdjective] Führung sind auf Zustimmung gestoßen. Obwohl wir damit gerechnet hatten, ist es dennoch sehr angenehm, dass wir keine drastischeren Maßnahmen ergreifen müssen, um unser rechtmäßiges Territorium zu sichern."
AUS_political_events.120.a:	"Glorreich."
AUS_political_events.121.t:	"[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
AUS_political_events.121.desc:	"Trotz unserer sehr berechtigten Ansprüche auf Gebiete, die sich derzeit im Besitz von [FROM.GetAdjective] befinden, hat [FROM.GetLeader] beschlossen, die geforderten Gebiete nicht zu übergeben. Das ist sicherlich ein Rückschlag, aber wir werden diese Gebiete zurückerobern, egal wie."
AUS_political_events.121.a:	"Wir werden dieses Land bekommen!"
AUS_political_events.122.t:	"Der Klang der [ROOT.GetAdjective] U-Boote?"
AUS_political_events.122.desc:	"Georg von Trapp war einst ein angesehener Admiral in der großen österreichisch-ungarischen Marine. Nach dem Untergang unseres mächtigen Reiches und dem Verlust unserer Küstenlinie wandte er sich wie viele andere auch anderen Unternehmungen zu. Nach einer Tätigkeit im Finanzwesen, die ihn den größten Teil seines Reichtums kostete, wandte er sich der Musik zu.\n\n Jetzt, da wir die Kontrolle über eine Küste erlangt haben, bietet von Trapp seine Dienste an, um im Namen unserer großen Nation wieder zur See zu fahren. "
AUS_political_events.122.a:	"Fantastisch, holt ihn in die Marine!"
AUS_political_events.122.b:	"So gern wir ihn auch haben... nein"
AUS_political_events.123.t:	"Die [FROM.GetAdjective]s reformiert die Mittelmächte"
AUS_political_events.123.desc:	"Die Nachricht, dass Österreich die Mittelmächte reformiert hat, hat uns heute Morgen erreicht. Das Militärbündnis hielt während des Großen Krieges zusammen, zerfiel aber nach dem Fall der meisten führenden Mitglieder. Die [FROM.GetAdjective]s haben beschlossen, diese Fraktion wieder aufleben zu lassen, und da wir ein Teil der vorherigen Iteration waren, haben sie es für angebracht gehalten, uns eine Einladung auszusprechen."
AUS_political_events.123.a:	"Wir werden zusammenstehen!"
AUS_political_events.123.b:	"Einmal war genug"
AUS_political_events.124.t:	"[FROM.GetNameDefCap] schließt sich der [ROOT.GetFactionName] an"
AUS_political_events.124.desc:	"Wie wir es von unserem eigenen Verbündeten erwartet hatten, waren sie über unsere Einladung, unsere glorreiche Fraktion wieder zusammenzubringen, nur zu froh. Sie haben zugestimmt, sich unserem Kampf gegen eine Welt anzuschließen, die uns am Ende des Großen Krieges so ungerecht behandelt hat."
AUS_political_events.124.a:	"Unsere Reiche werden sich wieder erheben!"
AUS_political_events.125.t:	"[FROM.GetNameDefCap] lehnt unsere Einladung ab"
AUS_political_events.125.desc:	"Wir hatten gehofft, dass die [FROM.GetAdjective] die offensichtlichen Vorteile eines erneuten Zusammenschlusses mit uns erkennen würden, aber es scheint, dass der Rückschlag, den wir damals erlitten haben, ihren Blick getrübt hat. Unser Anführer [ROOT.GetLeader] hat darauf mit Anmut und Entschlossenheit reagiert, dies ist nur ein kleiner Rückschlag."
AUS_political_events.125.a:	"Wenn sie nicht mit uns sind..."
AUS_news_events.1.t:	"[AUS.GetNameDefCap] Verweigert [GER.GetAdjective] Anschluss"
AUS_news_events.1.desc:	"Angesichts eines viel stärkeren Feindes hat die [AUS.GetAdjective]-Führung beschlossen, den jüngsten Forderungen von [GER.GetAdjective], sich zu unterwerfen und sich [GER.GetNameDef] anzuschließen, nicht nachzugeben. Truppen von [GER.GetNameDef] haben sich an der Grenze zu [AUS.GetAdjective] aufgestellt, aber es bleibt abzuwarten, ob eine Invasion in vollem Umfang gestartet wird.\n\nDiese Ereignisse folgen auf die jahrelange Verschlechterung der Beziehungen zwischen den Ländern und den zunehmenden Druck von [GER.GetAdjective] auf [AUS.GetNameDef], sich in [GER.GetNameDef] zu integrieren."
AUS_news_events.1.a:	"Wir wünschen [AUS.GetNameDef] dabei das Beste..."
AUS_news_events.1.b:	"Wir werden es ihnen zeigen..."
AUS_news_events.1.c:	"Östfrei!"
AUS_news_events.3.t:	"Der Sündenfall eines Fighter-Asses"
AUS_news_events.3.desc:	"Das [AUS.GetAdjective]-Jägerass Godwin von Brumowski ist bei einem heftigen Absturz zusammen mit einem [HOL.GetAdjective]-Flugschüler, den er über dem Flugplatz Schiphol ausbildete, ums Leben gekommen.\n\nVon Brumowski war das erfolgreichste Fliegerass der mächtigen Luftfahrtgruppen. Mit 35 Einzelsiegen, 12 geteilten Siegen und weiteren 8 unbestätigten Siegen nahm er sowohl am Ersten Weltkrieg als auch am Bürgerkrieg 1934 in [AUS.GetNameDef] teil."
AUS_news_events.3.a:	"Er hat uns gut gedient, ruhe in Frieden"
AUS_news_events.3.b:	"Tragisch"
AUS_news_events.4.t:	"Fliegerass entgeht nur knapp einer Katastrophe"
AUS_news_events.4.desc:	"Das [AUS.GetAdjective] Fliegerass Godwin von Brumowski war gestern in eine Beinahe-Katastrophe verwickelt, als er einen [HOL.GetAdjective] Flugschüler über dem Flugplatz Schiphol trainierte.\n\nVon Brumowski war das erfolgreichste Fliegerass der mächtigen Luftfahrtgruppen. Mit 35 Luftsiegen, weiteren 12 geteilten Siegen und weiteren 8 unbestätigten Siegen nahm er sowohl am Ersten Weltkrieg als auch am Bürgerkrieg 1934 in [AUS.GetNameDef] teil.\n\nDas Duo hat das Unterfangen relativ unbeschadet überstanden."
AUS_news_events.4.a:	"Eine knappe Sache"
AUS_news_events.5.t:	"Die [AUS.GetAdjective]s heben den Vertrag von Saint-Germain-En-Laye auf"
AUS_news_events.5.desc:	"\n[AUS.GetLeader] von [AUS.GetNameDef] hat kürzlich seine Absicht erklärt, den Vertrag von Saint-Germain-En-Laye ein für alle Mal aufzuheben und wieder aufzurüsten. Der Vertrag wurde nach dem Großen Krieg geschlossen, um [AUS.GetNameDef] davon abzuhalten, die Taten zu wiederholen, die den Krieg ausgelöst hatten, und ihr Territorium zu erweitern, um an Macht zu gewinnen. Theoretiker spekulieren, dass dies eine Reaktion auf die langsam ansteigenden Spannungen in der Welt ist. Ob der beabsichtigte Zweck dieser Militarisierungsbemühungen defensiv oder aggressiv ist, bleibt abzuwarten."
AUS_news_events.5.a:	"In Bezug auf"
AUS_news_events.5.b:	"Endlich!"
AUS_news_events.6.t:	"[AUS.GetNameDefCap] Reformen der Zentralmächte"
AUS_news_events.6.desc:	"\n\nDa es in ihrer unmittelbaren Umgebung keine brauchbaren Optionen für Allianzen gibt, hat [AUS.GetNameDef] die Mittelmächte erneut reformiert. Das Land hat sich von den Verträgen, die ihm auferlegt wurden, losgesagt und sich in rasantem Tempo der Remilitarisierung zugewandt. Es bleibt abzuwarten, ob dieses neue Bündnis seinem Namensvetter aus dem Großen Krieg ähneln wird oder nicht."
AUS_news_events.6.a:	"In Bezug auf"
AUS_news_events.6.b:	"Ein großer Tag!"
AUS_news_events.7.t:	"Otto von Habsburg kehrt nach [AUS.GetNameDef] zurück"
AUS_news_events.7.desc:	"\nNachdem er den größten Teil seines Lebens im Exil verbracht hat, zunächst in [SWI.GetNameDef] und später auf der Insel Madeira in [POR.GetNameDef], ist Otto von Habsburg nach [AUS.GetNameDef] zurückgekehrt. Der Prinz floh 1918 mit seinen Eltern, Kaiser Karl I. und Kaiserin Zita, nach dem Zusammenbruch der Monarchien am Ende des Ersten Weltkriegs aus dem Land. Seine Rückkehr als [AUS.GetAdjective] Staatsoberhaupt bedeutet eine deutliche Veränderung des politischen Klimas in [AUS.GetNameDef]."
AUS_news_events.7.a:	"Lang lebe der Habsburger Fürst!"
AUS_news_events.7.b:	"Das war nicht das, was wir im Vertrag skizziert haben!"
AUS_news_events.7.c:	"Gut für ihn"
AUS_news_events.8.t:	"Die Habsburger unter der Kontrolle von Habsburg"
AUS_news_events.8.desc:	"Unter der Herrschaft von [AUS.GetLeader] hat [AUS.GetNameDef] die Stadt Habsburg zurückerobert. Nachdem sie die [SWI.GetAdjective] ihrem Willen unterworfen hatten, wollten sie damit die Macht der Habsburger Familie stärken und kehrten damit zu einer viel imperialistischeren [AUS.GetName] zurück."
AUS_news_events.8.a:	"Warum sollten sie das tun?"
AUS_news_events.8.b:	"Habsburg gehört zu uns!"
AUS_news_events.9.t:	"Kommunistischer Putsch in [FROM.GetNameDef]"
AUS_news_events.9.desc:	"Nachdem die Unterstützung für [FROM.GetCommunistParty] in [FROM.GetNameDef] über einen langen Zeitraum zugenommen hat, ist es in [FROM.GetNameDef] zu einem friedlichen Staatsstreich gekommen. Die Kommunisten haben friedlich die Macht im Lande übernommen und mit wenig Widerstand die Regierung übernommen. \n\n Das ist eine deutliche Abkehr von dem, was [FROM.GetNameDef] in den letzten Jahrzehnten gewesen ist."
AUS_news_events.9.a:	"Das war unerwartet"
AUS_news_events.9.b:	"Wir wünschen ihnen Glück!"
AUS_news_events.9.c:	"Endlich!"
AUS_news_events.10.t:	"Bürgerkrieg in [FROM.GetNameDef]"
AUS_news_events.10.desc:	"In [FROM.GetNameDef] ist ein heftiger Bürgerkrieg ausgebrochen. Die kommunistische [FROM.GetCommunistParty] hat einen Aufstand gegen die regierende [FROM.GetNeutralParty] begonnen. Nachdem die Kommunisten in der jüngeren Vergangenheit viel Unterstützung erhalten haben, sind sie in [FROM.GetNameDef] zu einer ernstzunehmenden Kraft geworden."
AUS_news_events.10.a:	"Das ist absurd."
AUS_news_events.10.b:	"Gute Arbeit und viel Glück!"
AUS_news_events.10.c:	"Vorwärts!"
AUS_news_events.11.t:	"[AUS.GetNameDefCap] bildet den Danubischen Block"
AUS_news_events.11.desc:	"Nach ihrer radikalen Abkehr von der Vergangenheit hat die [AUS.GetAdjective]-Führung unter der Leitung von [AUS.GetLeader] beschlossen, eine eigene Fraktion zu gründen. Er hofft, dass andere Arbeiter in Mitteleuropa sich gegen ihre Unterdrücker erheben und sich ihnen in diesem Kampf für die Rechte des Volkes anschließen werden."
AUS_news_events.11.a:	"Warum sollten sie das tun?"
AUS_news_events.11.b:	"Wir wünschen ihnen alles Gute!"
AUS_news_events.11.c:	"Ein großer Tag für [AUS.GetNameDef]!"
AUS_news_events.12.t:	"[AUS.GetNameDefCap] hält wieder demokratische Wahlen ab"
AUS_news_events.12.desc:	"\nZum ersten Mal seit dem 11. September 1930 hat [AUS.GetNameDef] demokratische Wahlen abgehalten. Die Wahlbeteiligung war hoch und als die Auszählung der Stimmen zu Ende ging, stand [AUS.GetLeader] von [AUS.GetDemocraticParty] als Sieger fest. Er wird nun vor der schwierigen Aufgabe stehen, das Land auf einen neuen, demokratischeren Weg zu führen."
AUS_news_events.12.a:	"Großartig"
AUS_news_events.12.b:	"Notiert"
WW_hungary.1.t:	"[HUN.GetName] startet Programme für verbündete Hersteller"
WW_hungary.1.desc:	"Unser Verbündeter [HUN.GetNameDef] hat ein Programm zur gemeinsamen Entwicklung von Flugzeugen in unserer Fraktion ins Leben gerufen. Er hat damit begonnen, in unsere Entwicklung zu investieren, um in Zukunft seine eigene zu fördern."
WW_hungary.1.a:	"Ein wahrer Segen"
WW_hungary.2.t:	"[FROM.GetAdjective] Waffenlieferungen treffen ein"
WW_hungary.2.desc:	"Die [FROM.GetAdjective] Regierung hat sich bei unseren Kriegsanstrengungen offen auf die Seite unseres Landes gestellt. Als Teil ihrer neuen Unterstützung hat sie uns Waffenlieferungen zukommen lassen. Das wird uns in diesem Krieg sicherlich helfen."
WW_hungary.2.a:	"Großartig!"
WW_hungary.3.t:	"Der Tod von Premierminister Gyula Gömbös"
WW_hungary.3.desc:	"Unser Premierminister, der Militäroffizier und Vorsitzende der Ungarischen Nationalen Verteidigungsvereinigung, Gyula Gömbös, ist Berichten zufolge während einer diplomatischen Mission in München an Hodenkrebs verstorben. Während [ROOT.GetLeader] bereits einen neuen Ministerpräsidenten im Auge hat, nämlich den Zentristen Kálmán Darányi, bleibt die Frage offen, was mit der faschistischen paramilitärischen Organisation geschehen soll, die früher von Gömbös selbst geleitet wurde. Aufgrund ihrer und [ROOT.GetLeader]s gemeinsamer antikommunistischer Haltung könnte es möglich sein, sie davon zu überzeugen, für uns zu arbeiten, aber nicht zu wissen, wo ihre wahre Loyalität liegt, könnte für uns in der Zukunft gefährlich werden, wenn wir sie in unsere Streitkräfte einbinden. Wie sollten wir mit der MOVE verfahren?"
WW_hungary.3.a:	"Wir sollten versuchen, die MOVE zu integrieren"
WW_hungary.3.b:	"Lösen Sie diese Szegediner Faschisten sofort auf!"
WW_hungary.3.c:	"Lassen Sie sie frei herumlaufen. Was ist das Schlimmste, was passieren kann?"
HUN_gombos_has_died_flag:	"§YGyula Gömbös§! ist gestorben"
WW_hungary.4.t:	"[HUN.GetNameDefCap] fordert Transsylvanien"
WW_hungary.4.desc:	"Siebenbürgen war lange Zeit ein Teil von [HUN.GetNameDef], bevor es ihm im Vertrag von Trianon weggenommen wurde. Leider ist [HUN.GetNameDef] nie über den Verlust ihres Territoriums hinweggekommen. Zu verschiedenen Zeiten haben sie Transsylvanien öffentlich als integralen Bestandteil ihrer Nation beansprucht. Angesichts der jüngsten Veränderungen in der politischen Lage haben sie erneut beschlossen, ihre Ansprüche geltend zu machen und verlangen, dass wir ihnen ganz Siebenbürgen überlassen... oder sonst."
WW_hungary.4.a:	"Wie auch immer, sie können es haben..."
WW_hungary.4.b:	"Oder sonst...was?"
WW_hungary.5.t:	"[FROM.GetNameDefCap] Übergibt Transsilvanien"
WW_hungary.5.desc:	"Anstatt sich der Macht unserer Armeen zu stellen, haben die feigen [FROM.GetAdjective]s beschlossen, unsere rechtmäßigen Gebiete zurückzugeben. Die Gesamtheit der von ihnen kontrollierten Gebiete in Transsylvanien wurde an unsere Verwaltung übergeben, und unsere Streitkräfte haben die volle Kontrolle übernommen."
WW_hungary.5.a:	"Wie es sein sollte"
WW_hungary.6.t:	"[FROM.GetNameDefCap] Weigert sich, Transsylvanien zu übergeben"
WW_hungary.6.desc:	"Die arroganten Führer in [FROM.getNameDef] haben sich gegen unser Friedensangebot entschieden und behaupten, dass ein Krieg der Übergabe Transsilvaniens an uns vorzuziehen sei. Vielleicht haben sie unseren Bluff durchschaut, vielleicht ist jetzt aber auch die Zeit gekommen, um sie zu schlagen. Das kann nur die Zeit zeigen."
WW_hungary.6.a:	"Dann ist Krieg angesagt"
WW_hungary.6.b:	"Es ist die Mühe einfach nicht wert"
WW_hungary.7.t:	"[FROM.GetNameDefCap] Fordert die Südslowakei"
WW_hungary.7.desc:	"Der vorschnelle [FROM.GetLeader] hat kürzlich unsere, wie er sagte, unrechtmäßige Besetzung der [FROM.GetAdjective] Südslowakei angeprangert. Jetzt haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir darauf reagieren?"
WW_hungary.7.a:	"Es ist es nicht wert, dafür Blut zu vergießen."
WW_hungary.7.b:	"Dann kommen Sie und holen Sie es sich!"
WW_hungary.8.t:	"[HUN.GetNameDefCap] bietet Schutz im Austausch für [975.GetName]"
WW_hungary.8.desc:	"[HUN.GetLeader] von [HUN.GetNameDef] ist mit einem interessanten Angebot an uns herangetreten. Er erklärt, dass sie im Gegenzug für die Rückgabe von [975.GetName], oder wie sie es nennen, dem Lajtabánság, in [HUN.GetAdjective] Hände, bereit wären, uns eine Garantie für die Unabhängigkeit zu geben und auf unserer Seite zu stehen, falls die [GER.GetAdjective] uns holen kommen sollten. Sollten wir ihr Angebot annehmen?"
WW_hungary.8.a:	"Wir brauchen jede Hilfe, die wir bekommen können..."
WW_hungary.8.b:	"Und wie viel ist ihre Garantie genau wert?"
WW_hungary.9.t:	"[FROM.GetNameDefCap] übergibt [975.GetName] für Garantien"
WW_hungary.9.desc:	"Die weise Führung in [FROM.GetNameDef] hat beschlossen, auf unser Angebot einzugehen und wird uns umgehend die Kontrolle über die Region [975.GetName] im Austausch für Garantien der Unabhängigkeit übergeben. Wir werden größer, und unsere Freundschaft mit den [FROM.GetAdjective] ist wieder aufgefrischt worden."
WW_hungary.9.a:	"Wir stehen heute als zwei alte Freunde wiedervereint da!"
WW_hungary.10.t:	"[FROM.GetNameDefCap] verweigert unseren Schutz"
WW_hungary.10.desc:	"Die törichte Führung von [FROM.GetNameDef] hat unser Angebot mit der Begründung abgelehnt, dass es uns eindeutig mehr nützt als ihnen und dass sie nicht darauf vertrauen können, dass wir unsere Zusagen einhalten... Für wen halten die uns eigentlich!?"
WW_hungary.10.a:	"Sie haben eine Schraube locker..."
WW_hungary.11.t:	"[FROM.GetNameDefCap] fordert die Kontrolle über unsere [SLO.GetAdjective] Territorien"
WW_hungary.11.desc:	"Der vorschnelle [FROM.GetLeader] hat vor kurzem unsere, wie er es ausdrückte, unrechtmäßige Besetzung der [FROM.GetAdjective] Slowakei angeprangert. Jetzt haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir darauf reagieren?"
WW_hungary.11.a:	"Es ist es nicht wert, dafür Blut zu vergießen."
WW_hungary.11.b:	"Dann kommt und holt es Euch!"
WW_hungary.12.t:	"[FROM.GetNameDefCap] übergibt ihre [SLO.GetAdjective] Territorien"
WW_hungary.12.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, seine Territorien in der Slowakei zu übergeben, und hat seine Truppen angewiesen, sich zurückzuziehen. Wir haben wieder einmal gesiegt!"
WW_hungary.12.a:	"Dies ist ein großer Tag!"
WW_hungary.13.t:	"[FROM.GetNameDefCap] bleibt in der Slowakei standhaft"
WW_hungary.13.desc:	"Obwohl es nicht ganz unerwartet kam, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation in höchste Alarmbereitschaft versetzt, nachdem er unser Ultimatum erhalten hatte, und einen Abgesandten geschickt, der erklärte, dass er in dem Streit keinen einzigen Schritt zurückgehen wird."
WW_hungary.13.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.13.b:	"Wir müssen es gut sein lassen"
WW_hungary.14.t:	"[FROM.GetNameDefCap] fordert die Vojvodina"
WW_hungary.14.desc:	"Die [HUN.GetAdjective] Regierung hat begonnen, in der Frage der Vojvodina mehr Druck auszuüben. Sie behauptet, dass die Vojvodina während des Kaiserreichs zu Ungarn gehörte und daher zurückgegeben werden sollte. Sie behaupten, dass die Vereinigung mit Serbien am Ende des Ersten Weltkriegs aufgrund des Drucks von außen ungültig war, und dass das Gebiet daher immer noch rechtlich [HUN.GetAdjective] ist."
WW_hungary.14.a:	"Das ist ein Konflikt, den wir nicht gewinnen können."
WW_hungary.14.b:	"Wir werden ihre Wahnvorstellungen nicht unterstützen"
WW_hungary.15.t:	"[FROM.GetNameDefCap] Überträgt die Vojvodina"
WW_hungary.15.desc:	"\n[FROM.GetNameDef] hat zugestimmt, die Vojvodina an uns abzutreten. Unsere Streitkräfte haben die volle Kontrolle über die Region übernommen und die Integration wird umgehend beginnen."
WW_hungary.15.a:	"Groß"
WW_hungary.16.t:	"[From.GetNameDefCap] lehnt unsere Forderungen ab"
WW_hungary.16.desc:	"In einem angespannten Treffen mit [FROM.GetLeader] wurde unserer Delegation mitgeteilt, dass die Souveränität der Vojvodina nicht zur Diskussion stehe und dass die Regierung von [FROM.GetAdjective] sich einem solchen Druck auf keinen Fall beugen würde. Die Menschen in der Vojvodina hatten 1919 das Sagen, und sie haben sich damals entschieden, sich uns nicht anzuschließen. Was die [FROM.GetAdjective] Regierung betrifft, so ist die Sache damit erledigt."
WW_hungary.16.a:	"Vielleicht ist es"
WW_hungary.16.b:	"Sie werden diesen Tag bereuen"
WW_hungary.17.t:	"[HUN.GetName] fordert die Besetzung des Westbanats"
WW_hungary.17.desc:	"[HUN.GetLeader] von [HUN.GetNameDef] hat uns heute ein Ultimatum gestellt, in dem er uns auffordert, [HUN.GetName] die Besetzung der Region West Banat zu gewähren. Wenn wir den Forderungen von [HUN.GetLeader] nicht nachkommen, werden wir wahrscheinlich einen militärischen Konflikt am Hals haben."
WW_hungary.17.a:	"Sie können es haben"
WW_hungary.17.b:	"Was glauben sie, wer sie sind?"
WW_hungary.18.t:	"[FROM.GetNameDefCap] Nimmt unsere Forderungen an"
WW_hungary.18.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unsere Forderungen nach einer Besetzung des Westbanats gnädig akzeptiert und das Gebiet an uns abgetreten. Sie beschwichtigen uns lieber, als sich gegen uns zu stellen, was den Zielen Italiens auf dem Balkan nur förderlich sein wird."
WW_hungary.18.a:	"Alles nach Plan"
WW_hungary.19.t:	"Der törichte [FROM.GetLeader] hat unser Ultimatum abgelehnt"
WW_hungary.19.desc:	"Der törichte [FROM.GetLeader] von [FROM.GetNameDef] hat uns unseren rechtmäßigen Ton verweigert, und es ist nun an der Zeit, [FROM.GetNameDef] in einem schnellen Angriff niederzuschlagen. Dies wird unsere Ansprüche auf das Westbanat für die nahe Zukunft sichern."
WW_hungary.19.a:	"Dann erzwingt es"
WW_hungary.20.t:	"[FROM.GetNameDefCap] fordert Karpaten-Ruthenien"
WW_hungary.20.desc:	"Die [HUN.GetAdjective] Regierung hat begonnen, in der Frage des Karpatenrutheniens mehr Druck auszuüben und behauptet, dass es während des Kaiserreichs Teil Ungarns war und daher zurückgegeben werden sollte. Sie behaupten, dass die Huzulische Republik und alle Nachfolgestaaten in der Region unrechtmäßig sind und dass das Unrecht nur rückgängig gemacht werden kann, wenn die Region wieder [HUN.GetAdjective] wird."
WW_hungary.20.a:	"Das ist ein Konflikt, den wir nicht gewinnen können."
WW_hungary.20.b:	"Können sie ihre Aussage wirklich untermauern?"
WW_hungary.21.t:	"[FROM.GetNameDefCap] Überträgt Karpaten-Ruthenien"
WW_hungary.21.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, seine Gebiete in Karpaten-Ruthenien abzutreten und hat seine Truppen angewiesen, sich aus dem Gebiet zurückzuziehen. Wir sind wieder einmal siegreich!"
WW_hungary.21.a:	"Großartig"
WW_hungary.22.t:	"[From.GetNameDefCap] lehnt unsere Forderungen ab"
WW_hungary.22.desc:	"Obwohl es nicht ganz unerwartet kam, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation in höchste Alarmbereitschaft versetzt, nachdem er unser Ultimatum erhalten hatte, und einen Abgesandten geschickt, der erklärte, dass er in Bezug auf den Streit in Karpaten-Ruthenien keinen einzigen Schritt zurückgehen wird."
WW_hungary.22.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.22.b:	"Wir müssen es gut sein lassen"
WW_hungary.23.t:	"[FROM.GetNameDefCap] fordert das Burgenland"
WW_hungary.23.desc:	"Die [HUN.GetAdjective] Regierung hat begonnen, in der Frage des Burgenlandes mehr Druck auszuüben. Sie behauptet, dass das Burgenland während des Kaiserreichs Teil Ungarns war und daher zurückgegeben werden sollte. Sie behaupten, dass dieLajtabánság in diesem Gebiet wiederhergestellt werden muss und dass unsere Regierung unrechtmäßig ist. Wie sollen wir darauf reagieren?"
WW_hungary.23.a:	"Das ist ein Konflikt, den wir nicht gewinnen können."
WW_hungary.23.b:	"Können sie ihre Behauptung wirklich untermauern?"
WW_hungary.24.t:	"[FROM.GetNameDefCap] Übertragungen Burgenland"
WW_hungary.24.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, seine Gebiete im Burgenland abzutreten, und hat seine Truppen angewiesen, sich zurückzuziehen. Wir sind wieder einmal siegreich!"
WW_hungary.24.a:	"Großartig"
WW_hungary.25.t:	"[From.GetNameDefCap] lehnt unsere Forderungen ab"
WW_hungary.25.desc:	"Obwohl es nicht völlig unerwartet kam, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation in höchste Alarmbereitschaft versetzt, nachdem er unser Ultimatum erhalten hatte, und einen Abgesandten geschickt, der erklärte, dass er in Bezug auf den Streit im Burgenland keinen einzigen Schritt zurückgehen wird."
WW_hungary.25.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.25.b:	"Wir müssen die Sache auf sich beruhen lassen."
WW_hungary.26.t:	"[FROM.GetNameDefCap] Möchte unserer Fraktion beitreten"
WW_hungary.26.desc:	"[FROM.GetLeader] hat sich nach einem Besuch in unserer großen Hauptstadt an uns gewandt und behauptet, im Namen des gesamten [FROM.GetAdjective] Volkes zu sprechen. Er wünscht, dass sich unsere beiden Nationen in einem Militärbündnis zusammenschließen, mit dem Ziel, die Territorien sowohl der [ROOT.GetAdjective] als auch der [FROM.GetAdjective] Nationen weiter zu vergrößern."
WW_hungary.26.a:	"Sie sind willkommen, sich uns anzuschließen."
WW_hungary.26.b:	"Wir haben keine Verwendung für sie"
WW_hungary.27.t:	"[FROM.GetNameDefCap] Lässt uns zu ihnen stoßen"
WW_hungary.27.desc:	"Der große [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, ein neues Militärbündnis zu bilden, das die bereits bestehende Verbindung zwischen unseren Nationen stärkt. Unser Volk ist auf die Straße gegangen, um diesen bedeutenden Anlass zu feiern, denn er markiert die Wiedergeburt des [ROOT.GetAdjective] Staates und den Beginn einer neuen Ära für sein Volk."
WW_hungary.27.a:	"Lassen Sie uns gemeinsam unsere Zukunft aufbauen!"
WW_hungary.28.t:	"[FROM.GetNameDefCap] lässt uns nicht mitmachen"
WW_hungary.28.desc:	"Der verdorbene [FROM.GetLeader] von [FROM.GetNameDef] hat unser Gesuch abgelehnt und damit alle Möglichkeiten der Zusammenarbeit zwischen unseren Staaten in naher Zukunft unterbunden. Wir werden uns daher nach anderen Bündnissen umsehen müssen oder auf uns allein gestellt sein."
WW_hungary.28.a:	"Es war nicht vorgesehen, dass"
WW_hungary.29.t:	"[FROM.GetNameDefCap] zur Wiederherstellung der Habsburger Herrschaft"
WW_hungary.29.desc:	"Die Regierung in [FROM.GetNameDef] hat ihre Absicht bekannt gegeben, die Pragmatische Sanktion von 1713 wieder in Kraft zu setzen und damit erneut einen Habsburger auf den Thron zu setzen, was unseren Forderungen nach dem Großen Krieg widerspricht. Wir können es nicht wirklich rechtfertigen, deswegen in den Krieg zu ziehen, aber da sie bald eine Bedrohung für uns darstellen könnten, sollten wir vielleicht versuchen, sie unter Druck zu setzen?"
WW_hungary.29.a:	"Erlassen Sie einen diplomatischen Protest"
WW_hungary.29.b:	"Erteilen Sie ein Embargo und einen Protest"
WW_hungary.30.t:	"Die Kleine Entente verlangt Friedensversprechen"
WW_hungary.30.desc:	"Die Mächte der Kleinen Entente haben die versuchte Wiederherstellung der Habsburger Monarchie durch Karl IV. im Jahr 1921 nicht auf die leichte Schulter genommen und lassen eine solche Aktion noch immer nicht zu. Diesmal haben sie uns jedoch nicht mit einem Krieg gedroht, sondern von uns verlangt, dass wir unsere friedlichen Absichten unter Beweis stellen, damit sie unsere Monarchie nicht ein für alle Mal beenden müssen."
WW_hungary.30.a:	"Wir können Nichtangriff versprechen. Für den Moment..."
WW_hungary.30.b:	"Sie können uns nicht zwingen, dies zu tun!"
HUN_habsburg_refused_promises_of_peace:	"Abgelehnte Friedensversprechen an die Kleine Entente"
WW_hungary.31.t:	"[FROM.GetNameDefCap] weist uns einen neuen Monarchen zu"
WW_hungary.31.desc:	"[FROM.GetNameDefCap] hat Joesph August von Habsburg zum neuen Pfalzgrafen unserer Nation ernannt. Dies wird unser Regime sicherlich stärken."
WW_hungary.31.a:	"In der Tat"
WW_hungary.32.t:	"[FROM.GetLeader] verlangt, dass wir die Habsburger Herrschaft wiederherstellen"
WW_hungary.32.desc:	"Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] hat verlangt, dass wir die cisleithanischen Ländereien wiederherstellen und erneut einen Habsburger als unseren eigenen Monarchen krönen. Dies würde im Grunde unsere Unabhängigkeit beenden, könnte uns aber vor einer vollständigen Annektierung bewahren. Akzeptieren wir einen Platz in der neuen kaiserlichen Föderation?"
WW_hungary.32.a:	"Sie haben Recht"
WW_hungary.32.b:	"Die Habsburger wurden nicht ohne Grund verbannt!"
WW_hungary.33.t:	"[FROM.GetNameDefCap] Akzeptiert einen habsburgischen Monarchen"
WW_hungary.33.desc:	"Die weise Führung in [FROM.GetNameDef] hat beschlossen, einen habsburgischen Monarchen zu krönen, der unseren Forderungen entspricht, und anstelle ihres neuen Königs abzutreten. Eine neue Morgenröte wird über unserer kaiserlichen Föderation aufgehen!"
WW_hungary.33.a:	"Sie haben die richtige Wahl getroffen"
WW_hungary.34.t:	"[FROM.GetNameDefCap] lehnt einen habsburgischen Monarchen ab"
WW_hungary.34.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, nicht von ihren Ämtern zurückzutreten, weil sie irgendwie glaubt, dass sie weiser ist als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Joseph August auf ihren Thron setzen, ob es ihnen gefällt oder nicht!"
WW_hungary.34.a:	"Sie haben die falsche Wahl getroffen"
WW_hungary.35.t:	"[FROM.GetNameDefCap] Möchte unserer Fraktion beitreten"
WW_hungary.35.desc:	"[FROM.GetLeader] hat sich nach einem Besuch in unserer großen Hauptstadt an uns gewandt und behauptet, im Namen des gesamten [FROM.GetAdjective] Volkes zu sprechen. Er wünscht, dass sich unsere beiden Nationen in einem Militärbündnis zusammenschließen, mit dem Ziel, die Territorien der beiden Nationen [ROOT.GetAdjective] und [FROM.GetAdjective] weiter auszubauen."
WW_hungary.35.a:	"Sie sind willkommen, sich uns anzuschließen."
WW_hungary.35.b:	"Wir haben keine Verwendung für sie"
WW_hungary.36.t:	"[FROM.GetNameDefCap] stellt die Zentralmächte wieder her"
WW_hungary.36.desc:	"Der große und ehrenwerte [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, ein neues Militärbündnis zu bilden, das die bereits bestehende Verbindung zwischen unseren Nationen stärkt. Unser Volk ist auf die Straßen gegangen, um diesen bedeutenden Anlass zu feiern, denn er markiert die Wiedergeburt des Staates [ROOT.GetAdjective] und den Beginn einer neuen Ära für sein Volk."
WW_hungary.36.a:	"Lassen Sie uns gemeinsam unsere Zukunft aufbauen!"
WW_hungary.37.t:	"[FROM.GetNameDefCap] Entehren Sie uns"
WW_hungary.37.desc:	"Der üble [FROM.GetLeader] von [FROM.GetNameDef] hat uns unsere Bitte verweigert und damit alle Möglichkeiten der Zusammenarbeit zwischen unseren Staaten in der nahen Zukunft unterbunden. Wir werden uns daher nach anderen Bündnissen umsehen müssen oder auf uns allein gestellt sein."
WW_hungary.37.a:	"Es war nicht beabsichtigt"
WW_hungary.38.t:	"[FROM.GetNameDefCap] lädt uns zu den Zentralmächten ein"
WW_hungary.38.desc:	"[FROM.GetLeader] hat sich nach einem Besuch in unserer Hauptstadt an uns gewandt und behauptet, im Namen des gesamten [FROM.GetAdjective] Volkes zu sprechen. Er wünscht, dass sich unsere beiden Nationen wieder in einem Militärbündnis zusammenschließen, mit dem Ziel, die Territorien der beiden Nationen [ROOT.GetAdjective] und [FROM.GetAdjective] weiter auszubauen. Wie sollen wir auf ihre Petition reagieren?"
WW_hungary.38.a:	"Sie werden niemals allein stehen"
WW_hungary.38.b:	"Sie sind nur eine Belastung"
WW_hungary.39.t:	"[FROM.GetNameDefCap] schließt sich den Mittelmächten an"
WW_hungary.39.desc:	"Der große und ehrenwerte [FROM.GetLeader] von [FROM.GetNameDef] hat sich bereit erklärt, unserem neuen Militärbündnis beizutreten und die bereits bestehende Verbindung zwischen unseren Nationen zu stärken. Unser Volk ist auf die Straßen gegangen, um diesen bedeutenden Anlass zu feiern, denn er markiert die Wiedergeburt des [ROOT.GetAdjective] Staates und den Beginn einer neuen Ära für sein Volk."
WW_hungary.39.a:	"Lassen Sie uns die Fehler des Großen Krieges ungeschehen machen!"
WW_hungary.40.t:	"[FROM.GetNameDefCap] Entehren Sie uns"
WW_hungary.40.desc:	"Der üble [FROM.GetLeader] von [FROM.GetNameDef] hat uns unsere Bitte verweigert und damit alle Möglichkeiten der Zusammenarbeit zwischen unseren Staaten in der nahen Zukunft unterbunden. Wir werden uns daher nach anderen Bündnissen umsehen müssen, da sie nicht bereit sind, sich an einem solchen mit uns zu beteiligen."
WW_hungary.40.a:	"Dann werden wir führen!"
WW_hungary.40.b:	"Wir müssen einen anderen Ansatz versuchen"
WW_hungary.41.t:	"[FROM.GetNameDefCap] Möchte die Große Allianz wiederherstellen"
WW_hungary.41.desc:	"[FROM.GetLeader] hat sich nach einem Besuch in unserer großen Hauptstadt an uns gewandt und behauptet, im Namen des gesamten [FROM.GetAdjective] Volkes zu sprechen. Er wünscht, dass sich unsere beiden Nationen in einem Militärbündnis zusammenschließen, mit dem Ziel, die Territorien der beiden Nationen [ROOT.GetAdjective] und [FROM.GetAdjective] weiter auszudehnen."
WW_hungary.41.a:	"Sie sind willkommen, sich uns anzuschließen."
WW_hungary.41.b:	"Wir haben keine Verwendung für sie"
WW_hungary.42.t:	"[FROM.GetNameDefCap] ehrt die Große Allianz"
WW_hungary.42.desc:	"Der große und ehrenwerte [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, ein neues Militärbündnis zu bilden. Unser Volk ist auf die Straße gegangen, um diesen bedeutenden Anlass zu feiern, denn er markiert die Wiedergeburt des [ROOT.GetAdjective] Staates und den Beginn einer neuen Ära für sein Volk."
WW_hungary.42.a:	"Lassen Sie uns gemeinsam unsere Zukunft schützen!"
WW_hungary.43.t:	"[FROM.GetNameDefCap] Entehren Sie uns"
WW_hungary.43.desc:	"Der üble [FROM.GetLeader] von [FROM.GetNameDef] hat uns unsere Bitte verweigert und damit alle Möglichkeiten der Zusammenarbeit zwischen unseren Staaten in der nahen Zukunft unterbunden. Wir müssen uns daher nach anderen Bündnissen umsehen oder auf uns allein gestellt sein."
WW_hungary.43.a:	"Sie können nur der Familie wirklich vertrauen"
ENG_Rejected_HUN_grand_alliance:	"England hat die Wiederherstellung der Großen Allianz abgelehnt."
WW_hungary.44.t:	"[FROM.GetLeader] verlangt, dass wir die wiedistische Herrschaft wiederherstellen"
WW_hungary.44.desc:	"Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] hat verlangt, dass wir die wiedistische Krone wiederherstellen und Wilhelm von Wied erneut zu unserem eigenen Monarchen krönen. Dies würde im Grunde unsere Unabhängigkeit beenden, könnte uns aber vor einer vollständigen Annektierung bewahren. Akzeptieren wir einen Platz in der neuen kaiserlichen Föderation?"
WW_hungary.44.a:	"Sie haben Recht"
WW_hungary.44.b:	"Wied wurde nicht ohne Grund verbannt!"
WW_hungary.45.t:	"[FROM.GetNameDefCap] Akzeptiert einen wiedistischen Monarchen"
WW_hungary.45.desc:	"Die weise Führung in [FROM.GetNameDef] hat beschlossen, Wilhelm von Wied in Übereinstimmung mit unseren Forderungen zu krönen und anstelle ihres neuen Königs abzutreten. Eine neue Morgenröte wird über unserer kaiserlichen Föderation aufgehen!"
WW_hungary.45.a:	"Sie haben die richtige Wahl getroffen"
WW_hungary.46.t:	"[FROM.GetNameDefCap] lehnt einen wiedistischen Monarchen ab"
WW_hungary.46.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, nicht von ihren Ämtern zurückzutreten, weil sie glaubt, dass sie weiser ist als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Wilhelm von Wied auf ihren Thron setzen, ob es ihnen gefällt oder nicht!"
WW_hungary.46.a:	"Sie haben die falsche Wahl getroffen"
WW_hungary.47.t:	"[FROM.GetLeader] Fordert die Wiederherstellung der Habsburger Herrschaft"
WW_hungary.47.desc:	"Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] verlangt, dass wir die habsburgische Herrschaft über unsere Länder wiederherstellen, wie es in der Akte vom 5. November vereinbart wurde, und dass wir wieder einen Habsburger zu unserem eigenen Monarchen krönen. Damit würden wir uns mit ihnen verbünden und ihrer Allianz beitreten, ohne unsere Unabhängigkeit vollständig aufzugeben."
WW_hungary.47.a:	"Es ist unsere Pflicht"
WW_hungary.47.b:	"Tod den Monarchen!"
WW_hungary.48.t:	"[FROM.GetNameDefCap] Akzeptiert einen Habsburger Monarchen"
WW_hungary.48.desc:	"Die weise Führung in [FROM.GetNameDef] hat beschlossen, einen habsburgischen Monarchen zu krönen, der unseren Forderungen entspricht, und anstelle ihres neuen Königs abzutreten."
WW_hungary.48.a:	"Sie haben die richtige Wahl getroffen"
WW_hungary.49.t:	"[FROM.GetNameDefCap] lehnt einen habsburgischen Monarchen ab"
WW_hungary.49.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, nicht von ihren Ämtern zurückzutreten, weil sie irgendwie glaubt, dass sie weiser ist als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Karl Albrecht auf ihren Thron setzen, ob es ihnen gefällt oder nicht!"
WW_hungary.49.a:	"Sie haben die falsche Wahl getroffen"
WW_hungary.50.t:	"[FROM.GetNameDefCap] weist uns einen Habsburger Monarchen zu"
WW_hungary.50.desc:	"[FROM.GetNameDefCap] hat Karl Pius von Habsburg zum neuen König unserer Nation ernannt. Das wird unser Regime sicherlich stärken."
WW_hungary.50.a:	"In der Tat"
WW_hungary.51.t:	"[FROM.GetLeader] verlangt, dass wir die Habsburger Herrschaft wiederherstellen"
WW_hungary.51.desc:	"Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] hat verlangt, dass wir die Herrschaft der Habsburger über unsere Länder wiederherstellen, wie es von 1516 bis 1700 der Fall war, und erneut einen Habsburger zu unserem eigenen Monarchen krönen. Damit würden wir uns mit ihnen verbünden und ihrer Allianz beitreten, ohne unsere Unabhängigkeit vollständig aufzugeben."
WW_hungary.51.a:	"Es ist unsere Pflicht"
WW_hungary.51.b:	"Was glauben sie, wer sie sind?"
WW_hungary.52.t:	"[FROM.GetNameDefCap] Akzeptiert einen habsburgischen Monarchen"
WW_hungary.52.desc:	"Die weise Führung in [FROM.GetNameDef] hat beschlossen, einen habsburgischen Monarchen zu krönen, der unseren Forderungen entspricht, und anstelle ihres neuen Königs abzutreten."
WW_hungary.52.a:	"Sie haben die richtige Wahl getroffen"
WW_hungary.53.t:	"[FROM.GetNameDefCap] lehnt einen habsburgischen Monarchen ab"
WW_hungary.53.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, nicht von ihren Ämtern zurückzutreten, weil sie irgendwie glaubt, dass sie weiser ist als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Karl Pius auf ihren Thron setzen, ob es ihnen gefällt oder nicht!"
WW_hungary.53.a:	"Sie haben die falsche Wahl getroffen"
WW_hungary.54.t:	"[FROM.GetNameDefCap] weist uns einen Habsburger Monarchen zu"
WW_hungary.54.desc:	"[FROM.GetNameDefCap] hat Vasyl Vyshyvanyi von Habsburg zum neuen König unserer Nation ernannt. Das wird unser Regime sicherlich stärken."
WW_hungary.54.a:	"In der Tat"
WW_hungary.55.t:	"Österreich-Ungarn bietet Schutz"
WW_hungary.55.desc:	"Angesichts der jüngsten dramatischen Veränderungen in der politischen Landschaft des Balkans stellt sich immer wieder die Frage nach unseren Beziehungen zur neuen österreichisch-ungarischen Monarchie. Heute hat der ungarische Botschafter eine offizielle Note überreicht, in der er uns förmlich auffordert, unsere Haltung gegenüber dem Kaiserreich zu erklären. Die Habsburger behaupten, dass Böhmen und Mähren als alte Kronländer zu ihnen gehören. \n\nAllerdings hat [HUN.GetLeader] angedeutet, dass er eine Kompromisslösung akzeptieren würde, bei der er nominell Staatsoberhaupt unseres Landes wäre, aber mit sehr wenig wirklicher Macht."
WW_hungary.55.a:	"Wir werden in das Empire zurückkehren."
WW_hungary.55.b:	"Wir werden unsere Freiheit niemals für die Sicherheit aufgeben!"
WW_hungary.56.t:	"Böhmen kehrt zur Krone zurück"
WW_hungary.56.desc:	"Nach einer Diskussion auf höchster Ebene, die bis spät in die Nacht dauerte, hat die [CZE.GetAdjective] Regierung beschlossen, unser Angebot anzunehmen und Albrecht Franz zum König von Böhmen, Markgrafen von Mähren und Herzog von Teschen zu proklamieren. Die Soldaten der ehemaligen böhmischen Armee haben einen Eid auf ihren neuen König und Kaiser geschworen, und die zivile Verwaltung der Reiche wurde nominell integriert."
WW_hungary.56.a:	"Ein weiterer Schritt auf dem Weg, unser Geburtsrecht zurückzufordern."
WW_hungary.57.t:	"[CZE.GetNameDefCap] lehnt Vorstöße ab"
WW_hungary.57.desc:	"[CZE.GetNameDefCap] hat sich geweigert, eine Einigung oder ein Abkommen über ihre zukünftigen Beziehungen mit uns zu schließen. Als unser Botschafter im Außenministerium eintraf, um die offizielle Note zu besprechen, die er zuvor überbracht hatte, wurde ihm gesagt, dass es nichts zu besprechen gäbe, und er wurde schnell vor die Tür gesetzt. Der Botschafter von [CZE.GetAdjective] bei unserer Regierung hat erklärt, dass seine Regierung zwar eine friedliche und freundschaftliche Beziehung zwischen unseren Nationen wünscht, dass es aber keine Möglichkeit gibt, [CZE.GetNameDef] in das österreichisch-ungarische Reich einzugliedern."
WW_hungary.57.a:	"Das ist bedauerlich..."
WW_hungary.58.t:	"[FROM.GetNameDefCap] fordert die Kontrolle über Galizien und die Bukowina"
WW_hungary.58.desc:	"Der unbesonnene [FROM.GetLeader] hat kürzlich unsere, wie er sagte, unrechtmäßige Besetzung unserer galizischen und bukowinischen Ländereien angeprangert. Jetzt haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir darauf reagieren?"
WW_hungary.58.a:	"Es ist es nicht wert, dafür Blut zu vergießen."
WW_hungary.58.b:	"Dann kommt und holt es Euch!"
WW_hungary.59.t:	"[FROM.GetNameDefCap] übergibt ihr galizisches und bukowinisches Land"
WW_hungary.59.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat sich bereit erklärt, seine Gebiete in Galizien und der Bukowina abzutreten und hat seine Truppen angewiesen, sich aus dem Gebiet zurückzuziehen. Wir haben wieder einmal gesiegt!"
WW_hungary.59.a:	"Dies ist ein großer Tag!"
WW_hungary.60.t:	"[FROM.GetNameDefCap] Bleibt standhaft"
WW_hungary.60.desc:	"Obwohl es nicht ganz unerwartet kam, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation in höchste Alarmbereitschaft versetzt, nachdem er unser Ultimatum erhalten hatte, und einen Abgesandten geschickt, der erklärte, dass er in dem Streit keinen einzigen Schritt zurückgehen werde."
WW_hungary.60.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.60.b:	"Wir müssen die Sache auf sich beruhen lassen."
WW_hungary.61.t:	"[FROM.GetNameDefCap] stellt die de Iturbide Herrschaft wieder her"
WW_hungary.61.desc:	"[FROM.GetNameDefCap] hat María Josepha Sophia de Iturbide zur neuen Königin unserer Nation ernannt. Dies wird unser Regime sicherlich stärken."
WW_hungary.61.a:	"In der Tat"
WW_hungary.62.t:	"[FROM.GetLeader] verlangt, dass wir die kaiserliche Herrschaft wiederherstellen"
WW_hungary.62.desc:	"Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] hat verlangt, dass wir die Iturbide-Habsburgische Herrschaft über unsere Länder wiederherstellen, wie es von 1821 bis 1823 und 1864 bis 1867 der Fall war, und wieder einen Monarchen krönen. Damit würden wir uns mit ihnen verbünden und ihrer Allianz beitreten, ohne unsere Unabhängigkeit völlig aufzugeben."
WW_hungary.62.a:	"Es war ohnehin an der Zeit"
WW_hungary.62.b:	"Für wen halten die sich eigentlich?"
WW_hungary.63.t:	"[FROM.GetNameDefCap] Akzeptiert die kaiserliche Herrschaft"
WW_hungary.63.desc:	"Die weise Führung in [FROM.GetNameDef] hat beschlossen, María Josepha Sophia de Iturbide in Übereinstimmung mit unseren Forderungen zu ihrem neuen Kaiser zu krönen und anstelle ihrer neuen Königin abzutreten."
WW_hungary.63.a:	"Sie haben die richtige Wahl getroffen"
WW_hungary.64.t:	"[FROM.GetNameDefCap] lehnt die kaiserliche Herrschaft ab"
WW_hungary.64.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, nicht von ihren Ämtern zurückzutreten, weil sie irgendwie glaubt, dass sie weiser ist als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und María Josepha Sophia de Iturbide auf ihren Thron setzen, ob sie wollen oder nicht!"
WW_hungary.64.a:	"Sie haben die falsche Wahl getroffen"
WW_hungary.65.t:	"[FROM.GetNameDefCap] Weist uns einen Habsburger Monarchen zu"
WW_hungary.65.desc:	"[FROM.GetNameDefCap] hat Joseph Franz von Habsburg zum neuen König unserer Nation ernannt. Das wird unser Regime sicherlich stärken."
WW_hungary.65.a:	"In der Tat"
WW_hungary.66.t:	"[FROM.GetLeader] verlangt, dass wir die Habsburger Herrschaft wiederherstellen"
WW_hungary.66.desc:	"Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] hat verlangt, dass wir die habsburgische Herrschaft über unsere Länder wiederherstellen, wie es bis zur Auflösung des österreichisch-ungarischen Reiches der Fall war, und erneut einen Habsburger zu unserem eigenen Monarchen krönen. Sie versprechen uns jedoch eine größere Autonomie als zuvor, mit großen Versprechungen einer so genannten Dreifachmonarchie. Was sagen wir dazu?"
WW_hungary.66.a:	"Das haben wir doch schon immer gewollt!"
WW_hungary.66.b:	"Für wen halten die sich eigentlich?"
WW_hungary.67.t:	"[FROM.GetNameDefCap] Akzeptiert einen Habsburger Monarchen"
WW_hungary.67.desc:	"Die weise Führung in [FROM.GetNameDef] hat beschlossen, einen habsburgischen Monarchen zu krönen, der unseren Forderungen entspricht, und anstelle ihres neuen Königs abzutreten."
WW_hungary.67.a:	"Sie haben die richtige Wahl getroffen"
WW_hungary.68.t:	"[FROM.GetNameDefCap] lehnt einen habsburgischen Monarchen ab"
WW_hungary.68.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, in ihren derzeitigen Positionen zu bleiben, weil sie irgendwie glaubt, dass sie weiser ist als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Joseph Francis auf ihren Thron setzen, ob es ihnen gefällt oder nicht!"
WW_hungary.68.a:	"Sie haben eine unkluge Wahl getroffen..."
WW_hungary.69.t:	"[FROM.GetLeader] verlangt, dass wir die Habsburger Herrschaft wiederherstellen"
WW_hungary.69.desc:	"Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] verlangt, dass wir die Herrschaft der Habsburger über unsere Länder wiederherstellen, wie es bis zu unserer Vereinigung mit Italien der Fall war, und dass wir wieder einen Habsburger zu unserem eigenen Monarchen krönen. Sie versprechen uns jedoch eine größere Autonomie als zuvor. Was sagen wir dazu?"
WW_hungary.69.a:	"Wir würden uns gerne anschließen"
WW_hungary.69.b:	"Für wen halten die sich eigentlich?"
WW_hungary.70.t:	"[FROM.GetNameDefCap] Akzeptiert einen habsburgischen Monarchen"
WW_hungary.70.desc:	"Die weise Führung in [FROM.GetNameDef] hat beschlossen, gemäß unseren Forderungen einen habsburgischen Monarchen zu krönen und anstelle ihres neuen Königs abzutreten."
WW_hungary.70.a:	"Sie haben die richtige Wahl getroffen"
WW_hungary.71.t:	"[FROM.GetNameDefCap] lehnt einen habsburgischen Monarchen ab"
WW_hungary.71.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, in ihren derzeitigen Positionen zu bleiben, weil sie irgendwie glaubt, dass sie weiser ist als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Robert auf ihren Thron setzen, ob es ihnen gefällt oder nicht!"
WW_hungary.71.a:	"Sie haben eine unkluge Wahl getroffen..."
WW_hungary.72.t:	"[FROM.GetNameDefCap] fordert die Kontrolle über unsere [SIL.GetAdjective] Territorien"
WW_hungary.72.desc:	"Der unbesonnene [FROM.GetLeader] hat kürzlich unsere, wie er es ausdrückte, unrechtmäßige Besetzung von [FROM.GetAdjective] Schlesien angeprangert. Jetzt haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir darauf reagieren?"
WW_hungary.72.a:	"Es ist es nicht wert, dafür Blut zu vergießen."
WW_hungary.72.b:	"Dann kommt und holt es Euch!"
WW_hungary.73.t:	"[FROM.GetNameDefCap] übergibt ihre [SIL.GetAdjective] Territorien"
WW_hungary.73.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, seine Territorien in Schlesien zu übergeben, und hat seine Truppen angewiesen, sich zurückzuziehen. Wir haben wieder einmal gesiegt!"
WW_hungary.73.a:	"Dies ist ein großer Tag!"
WW_hungary.74.t:	"[FROM.GetNameDefCap] bleibt in Schlesien standhaft"
WW_hungary.74.desc:	"Obwohl es nicht ganz unerwartet kam, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation in höchste Alarmbereitschaft versetzt, nachdem er unser Ultimatum erhalten hatte, und einen Abgesandten geschickt, der erklärte, dass er in dem Streit keinen einzigen Schritt zurückweichen wird."
WW_hungary.74.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.74.b:	"Wir müssen die Sache auf sich beruhen lassen."
WW_hungary.75.t:	"[FROM.GetNameDefCap] Fordert das Heilige Land"
WW_hungary.75.desc:	"Der unbesonnene [FROM.GetLeader] hat die Besetzung des Heiligen Landes durch [FROM.GetAdjective] Kräfte gefordert und verlangt, dass wir das Gebiet übergeben und unsere eigenen Kräfte aus der Region abziehen. Die Situation könnte möglicherweise außer Kontrolle geraten, wenn wir nicht vorsichtig sind. Wie sollten wir darauf reagieren?"
WW_hungary.75.a:	"Die Verfechter des Katholizismus können es haben"
WW_hungary.75.b:	"Wie viele Kreuzzüge sind schon gescheitert?"
WW_hungary.76.t:	"[FROM.GetNameDefCap] übergibt das Heilige Land"
WW_hungary.76.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, uns Palästina zu überlassen, und hat seine Truppen angewiesen, sich aus dem Gebiet zurückzuziehen. Wir haben wieder einmal gesiegt!"
WW_hungary.76.a:	"Dies ist ein großer Tag!"
WW_hungary.77.t:	"[FROM.GetNameDefCap] bleibt im Heiligen Land standhaft"
WW_hungary.77.desc:	"Obwohl es nicht völlig unerwartet kam, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation in höchste Alarmbereitschaft versetzt, nachdem er unser Ultimatum erhalten hatte, und einen Abgesandten geschickt, der erklärte, dass er in dem Streit keinen einzigen Schritt zurückweichen werde."
WW_hungary.77.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.77.b:	"Wir müssen die Sache auf sich beruhen lassen."
WW_hungary.78.t:	"[FROM.GetNameDefCap] weist uns einen neuen Anführer zu"
WW_hungary.78.desc:	"[FROM.GetNameDefCap] hat einen neuen Papst zum Anführer unserer Nation ernannt. Das wird unser Regime sicherlich stärken."
WW_hungary.78.a:	"In der Tat"
WW_hungary.79.t:	"[FROM.GetNameDefCap] Weist uns einen neuen Anführer zu"
WW_hungary.79.desc:	"[FROM.GetNameDefCap] hat einen neuen Monarchen zum Anführer unserer Nation ernannt. Dies wird unser Regime sicherlich stärken."
WW_hungary.79.a:	"In der Tat"
WW_hungary.80.t:	"[HUN.GetNameDefCap] versucht, uns zu integrieren"
WW_hungary.80.desc:	"[HUN.GetNameDefCap] hat beschlossen, dass es höchste Zeit ist, unsere Länder wieder in die Krone Österreich-Ungarns zu integrieren. Wir können nicht viel tun, außer diese Tatsache zu akzeptieren...."
WW_hungary.80.a:	"Es ist, wie es sein sollte"
WW_hungary.80.b:	"Sie werden uns niemals lebendig fassen!"
WW_hungary.81.t:	"[FROM.GetNameDefCap] akzeptiert die Integration"
WW_hungary.81.desc:	"[FROM.GetNameDefCap] hat beschlossen, unsere Forderung zu akzeptieren, dass ihre Ländereien wieder in die Krone Österreich-Ungarns integriert werden sollen. Heute ist ein großer Tag für das Kaiserreich!"
WW_hungary.81.a:	"Und alles ist gut in der Welt"
WW_hungary.82.t:	"[FROM.GetNameDefCap] verweigert die Integration"
WW_hungary.82.desc:	"[FROM.GetNameDefCap] hat beschlossen, unsere Forderung nach der Wiedereingliederung seiner Länder in die Krone Österreich-Ungarns abzulehnen. Wir werden es also mit Gewalt tun müssen..."
WW_hungary.82.a:	"Wir werden sie zahlen lassen"
WW_hungary.83.t:	"[FROM.GetNameDefCap] bietet an, [975.GetName] zu kaufen"
WW_hungary.83.desc:	"Die [HUN.GetAdjective] Regierung sieht [975.GetName] immer noch als integralen Bestandteil ihres Reiches an und behauptet, dass es während des Kaiserreichs Teil Ungarns war und daher zurückgegeben werden sollte. Sie sind nun mit dem Angebot an uns herangetreten, die Region von uns zurückzukaufen, und zwar zu einem guten Preis."
WW_hungary.83.a:	"Wir werden alles Geld nehmen, das wir bekommen können."
WW_hungary.83.b:	"[975.GetName] ist [ROOT.GetAdjective]!"
WW_hungary.84.t:	"[FROM.GetNameDefCap] verkauft uns [975.GetName]."
WW_hungary.84.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, uns [975.GetName] zu übergeben, und hat die Zahlung erhalten, wie wir versprochen haben. Heute ist ein großer Tag für das [ROOT.GetAdjective] Volk!"
WW_hungary.84.a:	"Perfekt"
WW_hungary.85.t:	"[From.GetNameDefCap] lehnt unser Angebot ab"
WW_hungary.85.desc:	"Obwohl es nicht völlig unerwartet kam, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] unsere Bitte abgelehnt und einen Abgesandten geschickt, der erklärte, dass er keinen einzigen Schritt in Bezug auf den Streit in [975.GetName] zurückgehen wird."
WW_hungary.85.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.85.b:	"Sie haben Nein gesagt und wir werden das respektieren."
WW_hungary.86.t:	"[FROM.GetNameDefCap] inszeniert einen Aufstand in [975.GetName]"
WW_hungary.86.desc:	"Rebellen, die zu [FROM.GetAdjective] paramilitärischen Organisationen gehören, haben die Kontrolle über wichtige Gebäude in der Region [975.GetName] übernommen und in aller Eile ein Referendum über den Wiederanschluss an [FROM.GetNameDef] abgehalten, wobei die Ergebnisse eindeutig gefälscht waren. Unsere Truppen sind in der Nähe in Bereitschaft, warten aber auf Befehle, um zu sehen, ob ein Eingreifen die richtige Wahl ist oder nicht."
WW_hungary.86.a:	"Wir haben nicht die Kraft, sie zu bekämpfen."
WW_hungary.86.b:	"Sie werden lernen, ihre Entscheidung zu bereuen!"
WW_hungary.87.t:	"[FROM.GetNameDefCap] Möchte unserer Fraktion beitreten"
WW_hungary.87.desc:	"[FROM.GetLeader] hat sich nach einem Besuch in unserer Hauptstadt an uns gewandt und behauptet, im Namen des gesamten [FROM.GetAdjective] Volkes zu sprechen. Er wünscht, dass sich unsere beiden Nationen in einem Militärbündnis zusammenschließen, mit dem Ziel, die Menschen sowohl der [ROOT.GetAdjective] als auch der [FROM.GetAdjective] Nationen zu schützen."
WW_hungary.87.a:	"Sie sind willkommen, sich uns anzuschließen."
WW_hungary.87.b:	"Wir haben keine Verwendung für sie"
WW_hungary.88.t:	"[FROM.GetNameDefCap] Lässt uns zu ihnen stoßen"
WW_hungary.88.desc:	"Die [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, ein neues Militärbündnis zu bilden, das die Verbindung zwischen unseren Nationen stärkt. Unser Volk ist auf die Straße gegangen, um diesen bedeutenden Anlass zu feiern, denn er markiert die Wiedergeburt des [ROOT.GetAdjective] Staates und den Beginn einer neuen, sichereren Ära für sein Volk."
WW_hungary.88.a:	"Lassen Sie uns gemeinsam unsere Zukunft aufbauen!"
WW_hungary.89.t:	"[FROM.GetNameDefCap] lässt uns nicht mitmachen"
WW_hungary.89.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unser Ersuchen abgelehnt und damit alle Möglichkeiten der Zusammenarbeit zwischen unseren Staaten in naher Zukunft unterbunden. Wir werden uns daher nach anderen Bündnissen umsehen müssen oder auf uns allein gestellt sein."
WW_hungary.89.a:	"Es war nicht vorgesehen, dass"
WW_hungary.90.t:	"Krönung eines apostolischen Königs"
WW_hungary.90.desc:	"Nun wurde beschlossen, die Monarchie offiziell wieder einzuführen, aber wir haben ein Problem. Es sind keine guten Kandidaten aufgetaucht, aber der Regent muss sich bald entscheiden. Er könnte sich selbst krönen, was allerdings sehr unpopulär wäre, oder er könnte einen anderen Weg einschlagen und seinen Sohn István Horthy krönen, der beim Volk sehr beliebt ist. Wer sollte für das Amt ausgewählt werden?"
WW_hungary.90.a:	"Miklós Horthy ist die natürliche Wahl"
WW_hungary.90.b:	"István Horthy hat die Unterstützung des Volkes"
WW_hungary.91.t:	"[FROM.GetNameDefCap] schlägt eine Union vor"
WW_hungary.91.desc:	"Die [HUN.GetAdjective] Regierung ist mit einem interessanten Angebot an uns herangetreten, unsere beiden Länder zu einem zu vereinen. Sie wollen natürlich, dass es zu ihren Bedingungen geschieht, d.h. dass ihre Regierung beide Länder regiert, aber vielleicht ist das ja die sicherste Option, die wir wählen können?"
WW_hungary.91.a:	"Sehr gut, wir akzeptieren."
WW_hungary.91.b:	"Sie müssen von sich selbst überzeugt sein"
WW_hungary.92.t:	"[FROM.GetNameDefCap] Akzeptiert die Union"
WW_hungary.92.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, uns die Kontrolle über die Regierung zu übergeben und damit den Prozess der Vereinigung unserer beiden Nationen unter einem König einzuleiten. Wir haben wieder einmal gesiegt!"
WW_hungary.92.a:	"Großartig!"
WW_hungary.93.t:	"[From.GetNameDefCap] lehnt die Union ab"
WW_hungary.93.desc:	"Obwohl es nicht ganz unerwartet kam, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation in höchste Alarmbereitschaft versetzt, nachdem er unseren Vorschlag erhalten hatte, und einen Abgesandten geschickt, der erklärte, dass er keinen einzigen Schritt zurückgehen werde, denn 'Rumänien ist Rumänien!"
WW_hungary.93.a:	"Es ist ihre Entscheidung"
WW_hungary.94.t:	"Wahl eines neuen [ROOT.GetAdjective] Präsidenten"
WW_hungary.94.desc:	"Die Nation braucht dringend einen gewählten Volksvertreter, jetzt, wo sich der Staub des Bürgerkriegs gelegt hat. In der einen Ecke steht der populäre Mihály Károlyi, konservativer Politiker und früherer Premierminister von Ungarn. Auf der anderen Seite stehen die Kommunisten, von denen einige dafür sind, Bela Kun, den Führer der ehemaligen ungarischen Sowjetrepublik, wieder an die Macht zu bringen, und andere, die den Stalinisten Mátyás Rákosi unterstützen, der sich kürzlich durch seinen Kampf an der Front verdient gemacht hat. Wer soll das Land in die Zukunft führen?"
WW_hungary.94.a:	"Béla Kun muss an die Macht zurückkehren"
WW_hungary.94.b:	"Mátyás Rákosi hat sich den Respekt des Volkes verdient"
WW_hungary.94.c:	"Mihály Károlyi sollte uns führen"
WW_hungary.95.t:	"Die ersten Präsidentschaftswahlen der Zweiten Republik"
WW_hungary.95.desc:	"Es ist an der Zeit, endlich eine Präsidentschaftswahl für die Nation abzuhalten und sicherzustellen, dass unsere demokratischen Prinzipien als heller Leuchtturm im Zentrum Europas erstrahlen können. Die wichtigsten Kandidaten sind Mihály Károlyi, Präsident der Ersten Republik, Árpád Szakasits, Vorsitzender der ungarischen Sozialdemokraten, und János Zichy, Vorsitzender der Ungarischen Christlichen Wirtschafts- und Sozialpartei sowie Mitglied der Ungarischen Akademie der Wissenschaften. Welche Zukunft erwartet Ungarn?"
WW_hungary.95.a:	"Mihály Károlyi weiß, wie man führt"
WW_hungary.95.b:	"Árpád Szakasits kann einen guten Mittelweg finden"
WW_hungary.95.c:	"János Zichy kann uns helfen, wieder auf die Beine zu kommen"
WW_hungary.96.t:	"[FROM.GetNameDefCap] Fordert die Kontrolle über unsere [SLO.GetAdjective] Territorien"
WW_hungary.96.desc:	"Der voreilige [FROM.GetLeader] hat vor kurzem unsere, wie er es ausdrückte, unrechtmäßige Besetzung der [FROM.GetAdjective] Slowakei angeprangert. Jetzt haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir darauf reagieren?"
WW_hungary.96.a:	"Es ist es nicht wert, dafür Blut zu vergießen."
WW_hungary.96.b:	"Dann kommt und holt es Euch!"
WW_hungary.97.t:	"[FROM.GetNameDefCap] übergibt ihre [SLO.GetAdjective] Territorien"
WW_hungary.97.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, seine Territorien in der Slowakei zu übergeben, und hat seine Truppen angewiesen, sich aus dem Gebiet zurückzuziehen. Wir haben wieder einmal gesiegt!"
WW_hungary.97.a:	"Dies ist ein großer Tag!"
WW_hungary.98.t:	"[FROM.GetNameDefCap] bleibt in der Slowakei standhaft"
WW_hungary.98.desc:	"Obwohl es nicht völlig unerwartet kam, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation in höchste Alarmbereitschaft versetzt, nachdem er unser Ultimatum erhalten hatte, und einen Abgesandten geschickt, der erklärte, dass er in dem Streit keinen einzigen Schritt zurückgehen werde."
WW_hungary.98.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.98.b:	"Wir müssen die Sache auf sich beruhen lassen"
WW_hungary.99.t:	"Ungarn fordert die Oberhoheit über das Székely-Land"
WW_hungary.99.desc:	"Das Gebiet, das den größten Teil von [76.GetName] umfasst und dem Volk der [HUN.GetAdjective] als Székelyföld bekannt ist, wird zu einem großen Teil von ihren Brüdern, den Székely-Ungarn, bewohnt. Sie sprechen ihren eigenen Dialekt und haben ihre eigene einzigartige Kultur. Daher hat [HUN.GetLeader] erklärt, dass sie kein integrierter Teil ihrer Nation sein müssen. Sie möchten jedoch die Hüter dieses Volkes sein und bitten uns um die Oberherrschaft über das Gebiet."
WW_hungary.99.a:	"Für eine gerechtere Welt!"
WW_hungary.99.b:	"Sie sind eindeutig wahnhaft"
WW_hungary.100.t:	"[FROM.GetName] gewährt uns ein Székelyföld-Protektorat"
WW_hungary.100.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unsere Forderungen akzeptiert und die Region Székelyföld als autonome Region übergeben. Wir sind nun mit dem Schutz und der Verbesserung der Region betraut."
WW_hungary.100.a:	"Endlich wiedervereint!"
WW_hungary.101.t:	"[FROM.GetName] verweigert uns unser Székelyföld-Protektorat"
WW_hungary.101.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unsere Forderungen nach einem autonomen Székely-Protektorat abgelehnt. Das szeklerische Volk bleibt dort schutzlos und ungeschützt. Da sich ihre derzeitigen Oberherren nur wenig um sie kümmern, sollten wir eingreifen und die Region besetzen?"
WW_hungary.101.a:	"Sie werden ihr Handeln bereuen"
WW_hungary.101.b:	"Es gibt nicht viel, was wir tun können."
WW_hungary.102.t:	"Der Marsch auf Budapest"
WW_hungary.102.desc:	"Nach monatelangen Kampagnen und Protesten gegen den Regenten Miklós Horthy sind die faschistischen Bewegungen, inspiriert durch den Sensenkreuz-Aufstand und Mussolinis Marsch auf Rom, nun auf unsere Hauptstadt marschiert und fordern den Rücktritt von Horthy, damit der günstigere Gyula Gömbös sein Amt antreten kann."
WW_hungary.102.a:	"Gömbös muss die Notstandsvollmachten antreten!"
WW_hungary.103.t:	"Der Staatsstreich von Ferenc Szálasi"
WW_hungary.103.desc:	"Nachdem er die Partei des Nationalen Willens bewaffnet hat, um sie auf Budapest marschieren zu lassen, damit er die nationale Führung übernehmen kann, hat Gömbös keinen Bedarf mehr an ihnen und hat Schritte unternommen, sie zu unterdrücken. Heute Morgen jedoch umzingelten sie den Sándor-Palast in Budapest und forderten seinen Rücktritt zugunsten ihres Anführers Ferenc Szálasi. Die MOVE hat daraufhin damit begonnen, die Stadt einzukesseln, und das Land steht kurz vor dem Zusammenbruch. Was sollte man tun?"
WW_hungary.103.a:	"Treten Sie zurück und machen Sie Szálasi zur neuen Nemzetvezető."
WW_hungary.103.b:	"Wir werden ihren Bedingungen zustimmen, unter einer Bedingung"
WW_hungary.104.t:	"[FROM.GetNameDefCap] Fordert die Kontrolle über Kroatien"
WW_hungary.104.desc:	"Der voreilige [FROM.GetLeader] hat kürzlich unsere, wie er sagte, unrechtmäßige Besetzung unserer kroatischen Ländereien angeprangert. Jetzt haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir darauf reagieren?"
WW_hungary.104.a:	"Es ist es nicht wert, dafür Blut zu vergießen."
WW_hungary.104.b:	"Dann kommt und holt es Euch!"
WW_hungary.105.t:	"[FROM.GetNameDefCap] übergibt ihre kroatischen Ländereien"
WW_hungary.105.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, seine Gebiete in Kroatien abzutreten, und hat seine Truppen angewiesen, sich zurückzuziehen. Wir sind wieder einmal siegreich!"
WW_hungary.105.a:	"Dies ist ein großer Tag!"
WW_hungary.106.t:	"[FROM.GetNameDefCap] Bleibt standhaft"
WW_hungary.106.desc:	"Obwohl es nicht völlig unerwartet kam, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation in höchste Alarmbereitschaft versetzt, nachdem er unser Ultimatum erhalten hatte, und einen Abgesandten geschickt, der erklärte, dass er in dem Streit keinen einzigen Schritt zurückgehen werde."
WW_hungary.106.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.106.b:	"Wir müssen die Sache auf sich beruhen lassen"
WW_hungary.108.t:	"[FROM.GetNameDefCap] will Hermann Göring zum König krönen"
WW_hungary.108.desc:	"\nDa die [FROM.GetAdjective]-Führung unter [FROM.GetLeader] nun eng mit uns verbündet ist, hat sie darum gebeten, einen deutschen König zu krönen, der den nun symbolischen Platz auf dem [FROM.GetAdjective]-Thron einnimmt. Dafür haben sie Hermann Göring ausgewählt, und ihre Historiker haben bereits begonnen, seine Verbindung zum alten ungarischen Führer Árpád aufzuschreiben. Sollten wir ihm erlauben, nach [FROM.GetNameDef] zu gehen?"
WW_hungary.108.a:	"Wir werden es erlauben"
WW_hungary.108.b:	"Es wäre nicht angemessen"
WW_hungary.109.t:	"[FROM.GetLeader] Erlaubt Görings Krönung"
WW_hungary.109.desc:	"Der große [GER.GetLeader] hat Hermann Göring erlaubt, in unser Land zu ziehen und der neue konstitutionelle König unseres Volkes zu werden. Unsere Bande werden immer enger, und endlich steht der Thron nicht mehr leer."
WW_hungary.109.a:	"Wir sind dankbar"
WW_hungary.110.t:	"[FROM.GetLeader] Verbietet die Krönung Görings"
WW_hungary.110.desc:	"Der paranoide [FROM.GetLeader] hat beschlossen, Hermann Göring nicht in unser Land ziehen zu lassen, trotz ständigen Drängens und gut vorgetragener Argumente. Wir werden ohne einen König auskommen müssen und Szálasi zum einzigen Führer der Nation machen."
WW_hungary.110.a:	"Ein Königreich scheint es nicht mehr zu geben"
WW_hungary.111.t:	"Referendum zum Beitritt zum [HUN.GetAdjective] Staat"
WW_hungary.111.desc:	"Seit einem Monat läuft in [664.GetName] ein öffentliches Referendum, bei dem entschieden werden soll, ob das Land dem [HUN.GetNameDef] beitreten will oder nicht. Da das Referendum von internationalen Beobachtern abgesegnet wurde, kann man davon ausgehen, dass es keinen großen Wahlbetrug gegeben haben wird. Die Ergebnisse sind jedoch da, und ein großer Teil der Bevölkerung hat für den Austritt aus unserem Land gestimmt. Sollten wir das akzeptieren?"
WW_hungary.111.a:	"Wenn es das ist, was die Menschen wollen"
WW_hungary.111.b:	"Das Referendum war betrügerisch"
WW_hungary.112.t:	"[FROM.GetNameDefCap] Nimmt das Referendum an"
WW_hungary.112.desc:	"Die Führung in [FROM.GetNameDef] hat öffentlich erklärt, dass sie das Selbstbestimmungsrecht der Menschen in der Region [664.GetName] uneingeschränkt unterstützt. Es sei an der Zeit, dass sie selbst entscheiden können, in welchem Staat sie leben wollen, erklärte [FROm.GetLeader] Anfang dieser Woche und gab damit im Wesentlichen ihre Ansprüche auf das Gebiet auf."
WW_hungary.112.a:	"Eine vernünftige Antwort"
WW_hungary.113.t:	"[FROM.GetNameDefCap] erklärt das Referendum für unrechtmäßig"
WW_hungary.113.desc:	"Die Führung von [FROM.GetNameDef] ist an die Öffentlichkeit gegangen und hat die Ergebnisse des Referendums, das Anfang des Monats in der Region [664.GetName] abgehalten wurde, für illegitim erklärt. Sie erklärte, dass die Wahlbeteiligung und die internationalen Beobachter in hohem Maße betrügerisch waren und eindeutig eine Voreingenommenheit gegenüber der [ROOT.GetAdjective]-Regierung besteht."
WW_hungary.113.a:	"Wir werden es akzeptieren müssen"
WW_hungary.114.t:	"Referendum zum Beitritt zum [HUN.GetAdjective] Staat"
WW_hungary.114.desc:	"Seit einem Monat läuft in [73.GetName] ein öffentliches Referendum mit dem Ziel, zu entscheiden, ob sie dem Staat [HUN.GetNameDef] beitreten wollen oder nicht. Da das Referendum von internationalen Beobachtern abgesegnet wurde, kann man davon ausgehen, dass es keinen großen Wahlbetrug gegeben hat. Die Ergebnisse sind jedoch da, und ein großer Teil der Bevölkerung hat für den Austritt aus unserem Land gestimmt. Sollten wir das akzeptieren?"
WW_hungary.114.a:	"Wenn es das ist, was die Menschen wollen"
WW_hungary.114.b:	"Das Referendum war betrügerisch"
WW_hungary.115.t:	"[FROM.GetNameDefCap] Nimmt das Referendum an"
WW_hungary.115.desc:	"Die Führung in [FROM.GetNameDef] ist an die Öffentlichkeit gegangen und hat ihre unnachgiebige Unterstützung für die Selbstbestimmung der Menschen in der Region [73.GetName] erklärt. Es ist an der Zeit, dass sie selbst entscheiden können, in welchem Staat sie leben wollen, erklärte [FROm.GetLeader] Anfang dieser Woche und gab damit im Wesentlichen ihre Ansprüche auf das Gebiet auf."
WW_hungary.115.a:	"Eine vernünftige Antwort"
WW_hungary.116.t:	"[FROM.GetNameDefCap] erklärt das Referendum für unrechtmäßig"
WW_hungary.116.desc:	"Die Führung von [FROM.GetNameDef] ist an die Öffentlichkeit gegangen und hat die Ergebnisse des Referendums, das Anfang des Monats in der Region [73.GetName] abgehalten wurde, für illegitim erklärt. Sie erklärte, dass die Wahlbeteiligung und die internationalen Beobachter in hohem Maße betrügerisch waren und eindeutig eine Voreingenommenheit gegenüber der Regierung von [ROOT.GetAdjective] erkennen lassen."
WW_hungary.116.a:	"Wir werden es akzeptieren müssen"
WW_hungary.117.t:	"Referendum zum Beitritt zum [HUN.GetAdjective] Staat"
WW_hungary.117.desc:	"Seit einem Monat läuft in [45.GetName] ein öffentliches Referendum mit dem Ziel, zu entscheiden, ob sie dem Staat [HUN.GetNameDef] beitreten wollen oder nicht. Da das Referendum von internationalen Beobachtern abgesegnet wurde, kann man davon ausgehen, dass es keinen großen Wahlbetrug gegeben haben wird. Die Ergebnisse sind jedoch da, und ein großer Teil der Bevölkerung hat dafür gestimmt, unser Land zu verlassen. Sollten wir das akzeptieren?"
WW_hungary.117.a:	"Wenn es das ist, was die Menschen wollen"
WW_hungary.117.b:	"Das Referendum war betrügerisch"
WW_hungary.118.t:	"[FROM.GetNameDefCap] Nimmt das Referendum an"
WW_hungary.118.desc:	"Die Führung in [FROM.GetNameDef] hat öffentlich erklärt, dass sie die Selbstbestimmung der Menschen in der Region [45.GetName] unnachgiebig unterstützt. Es ist an der Zeit, dass sie selbst entscheiden können, in welchem Staat sie leben wollen, erklärte [FROm.GetLeader] Anfang dieser Woche und gab damit im Wesentlichen ihre Ansprüche auf das Gebiet auf."
WW_hungary.118.a:	"Eine vernünftige Antwort"
WW_hungary.119.t:	"[FROM.GetNameDefCap] erklärt das Referendum für unrechtmäßig"
WW_hungary.119.desc:	"Die Führung von [FROM.GetNameDef] ist an die Öffentlichkeit gegangen und hat die Ergebnisse des Referendums, das Anfang des Monats in der Region [45.GetName] abgehalten wurde, für illegitim erklärt. Sie erklärte, dass die Wahlbeteiligung und die internationalen Beobachter in hohem Maße betrügerisch waren und eindeutig eine Voreingenommenheit gegenüber der Regierung von [ROOT.GetAdjective] erkennen lassen."
WW_hungary.119.a:	"Wir werden es akzeptieren müssen"
WW_hungary.120.t:	"Referendum zum Beitritt zum [HUN.GetAdjective] Staat"
WW_hungary.120.desc:	"Seit einem Monat läuft in [76.GetName] ein öffentliches Referendum mit dem Ziel, zu entscheiden, ob sie dem Staat [HUN.GetNameDef] beitreten wollen oder nicht. Da das Referendum von internationalen Beobachtern abgesegnet wurde, kann man davon ausgehen, dass es keinen großen Wahlbetrug gegeben haben wird. Die Ergebnisse sind jedoch da, und ein großer Teil der Bevölkerung hat für den Austritt aus unserem Land gestimmt. Sollten wir das akzeptieren?"
WW_hungary.120.a:	"Wenn es das ist, was die Menschen wollen"
WW_hungary.120.b:	"Das Referendum war betrügerisch"
WW_hungary.121.t:	"[FROM.GetNameDefCap] Nimmt das Referendum an"
WW_hungary.121.desc:	"Die Führung in [FROM.GetNameDef] hat öffentlich erklärt, dass sie die Selbstbestimmung der Menschen in der Region [76.GetName] unnachgiebig unterstützt. Es ist an der Zeit, dass sie selbst entscheiden können, in welchem Staat sie leben wollen, erklärte [FROm.GetLeader] Anfang dieser Woche und gab damit im Wesentlichen ihre Ansprüche auf das Gebiet auf."
WW_hungary.121.a:	"Eine vernünftige Antwort"
WW_hungary.122.t:	"[FROM.GetNameDefCap] erklärt das Referendum für unrechtmäßig"
WW_hungary.122.desc:	"Die Führung von [FROM.GetNameDef] ist an die Öffentlichkeit gegangen und hat die Ergebnisse der Referenden, die Anfang des Monats in der Region [76.GetName] abgehalten wurden, für illegitim erklärt. Sie erklärte, dass die Wahlbeteiligung und die internationalen Beobachter in hohem Maße betrügerisch waren und eindeutig eine Voreingenommenheit gegenüber der Regierung von [ROOT.GetAdjective] erkennen lassen."
WW_hungary.122.a:	"Wir werden es akzeptieren müssen"
WW_hungary.123.t:	"Das Sensenkreuz marschiert auf Budapest"
WW_hungary.123.desc:	"Unsere Truppen haben den radikalen nationalsozialistischen Politiker Zoltán Böszörmény und seine Anhänger bei einem Putschversuch, der stark von Mussolinis Marsch auf Rom beeinflusst ist, in Budapest abgefangen. Dieser politische Randaktivist, der sich selbst als 'Riese unter den Geistesriesen und großer ungarischer Dichter mit prophetischer Mission' bezeichnet, hat seine Gruppe verärgerter Anhänger aus der Landwirtschaft unter dem Banner ihres Sensenkreuzes versammelt und bewegt sich auf unsere Hauptstadt zu. Wie sollen wir damit umgehen?"
WW_hungary.123.a:	"Treiben Sie sie auseinander und nehmen Sie ihren erbärmlichen Anführer fest!"
WW_hungary.123.b:	"Eröffnen Sie das Feuer und schrecken Sie sie ab."
HUN_third_mexican_empire_tt:	"§YMexico§! wird als §Ydas dritte mexikanische Reich§! bekannt sein.\n"
HUN_croatia_slavonia_tt:	"§YCroatia§! wird bekannt sein als §Ythe Kingdom of Croatia-Slavonia§!.\n"
HUN_bohemia_and_silesia_tt:	"§YCzechoslovakia§! wird als §Ythe Kingdom of Bohemia-Moravia and Silesia§!.\n bekannt sein"
HUN_cisleithania_tt:	"§YAustria§! wird bekannt sein als §Ythe Kingdoms and Lands Represented in the Imperial Council§!.\n"
WW_hungary.124.t:	"Ein Mann kehrt in seine Heimat zurück"
WW_hungary.124.desc:	"Am frühen Morgen meldeten die Behörden in Gori einen Mann, der die Rückgabe eines Bauernhofs forderte, der ihm angeblich einst gehörte. Er sagte, er habe es erst kürzlich geschafft, in seine Heimat zurückzukehren und den Fängen der russischen Bedrohung zu entkommen. Außerdem versprach er, dass er unser Land zu Ruhm und Ehre führen könne, wenn man ihn in die Politik einließe, da er offenbar aus einer Reihe erfolgreicher Politiker stamme. Ist er der Mann, den wir brauchen, um unsere Träume von einem größeren Georgien wiederherzustellen?"
WW_hungary.124.a:	"Geben Sie diesem Mann ein Amt, sofort!"
WW_hungary.124.b:	"Was auch immer er sagt, wir können ihm nicht trauen."
wuw_HUN_news_events.1.t:	"[HUN.GetNameDEFCAP] kündigt das Győri-Programm an"
wuw_HUN_news_events.1.d:	"\nDie [HUN.GetAdjective]-Regierung unter [HUN.GetLeader] hat ein neues groß angelegtes Industrieprogramm angekündigt, um die Nation so schnell wie möglich effizient aufzurüsten. Ausländische Beobachter betrachten dies als einen Akt der Aggression von [HUN.GetNameDef] gegenüber ihren Nachbarn, aber nur die Zeit wird zeigen, was ihre wahren Absichten sind."
wuw_HUN_news_events.1.a:	"Sie bereiten sich auf etwas vor..."
wuw_HUN_news_events.1.b:	"Das wird unsere Zukunft sichern!"
wuw_HUN_news_events.2.t:	"[HUN.GetNameDefCap] schließt sich den [GER.GetAdjective]s an"
wuw_HUN_news_events.2.d:	"Nach der Unterzeichnung eines neuen Paktes über gegenseitige Unterstützung und die Förderung der jeweiligen nationalen Ziele haben [GER.GetLeader] und [HUN.GetLeader] heute den Beitritt von [HUN.GetNameDef] zur [GER.GetAdjective]-Fraktion bekannt gegeben."
wuw_HUN_news_events.2.a:	"Wie wird sich das entwickeln?"
wuw_HUN_news_events.2.b:	"Für eine größere Zukunft!"
wuw_HUN_news_events.2.c:	"Sie werden ein nützliches Pfand sein"
wuw_HUN_news_events.3.t:	"[HUN.GetNameDefCap] reformiert die Zentralmächte"
wuw_HUN_news_events.3.desc:	"\nDa es in ihrer unmittelbaren Umgebung keine brauchbaren Optionen für Allianzen gibt, hat [HUN.GetNameDef] die Mittelmächte erneut reformiert. Das Land hat sich von den Verträgen, die ihm auferlegt wurden, losgesagt und sich in rasantem Tempo der Remilitarisierung zugewandt. Ob dieses neue Bündnis seinem Namensvetter aus dem Großen Krieg ähneln wird, bleibt abzuwarten."
wuw_HUN_news_events.3.a:	"Sehr bedenklich"
wuw_HUN_news_events.3.b:	"Wir werden unseren vergangenen Ruhm zurückgewinnen!"
wuw_HUN_news_events.3.c:	"Sie führen unser Erbe fort"
GER_Rejected_HUN_central_powers:	"Deutschland hat unseren Beitritt zu den Mittelmächten abgelehnt"
wuw_HUN_news_events.4.t:	"[HUN.GetNameDefCap] Erklärt die Weltherrschaft"
wuw_HUN_news_events.4.desc:	"[HUN.GetLeader] von [HUN.GetNameDef] hat die Ambitionen der Nationen angekündigt, den Globus zu beherrschen und eine [HUN.GetAdjective] Hegemonie auf allen Kontinenten zu errichten. Sie behaupten, dass dies das Geburtsrecht der Menschen des Apostolischen Königreichs sei und dass sie sich nie wieder fremden Mächten beugen werden."
wuw_HUN_news_events.4.a:	"Sie müssen vernichtet werden!"
wuw_HUN_news_events.4.b:	"Die Welt ist unsere Auster!"
wuw_HUN_news_events.5.t:	"[HUN.GetLeader] übernimmt die ungarische Krone"
wuw_HUN_news_events.5.desc:	"Auf der Suche nach einem König für ihre Nation haben die [HUN.GetAdjective]s nach langen Verhandlungen und Vorbereitungen Anfang dieser Woche [HUN.GetLeader] offiziell gekrönt. Heute wurde er in einer feierlichen Zeremonie im Königspalast in Budapest unter großem Trara zum König von Ungarn gekrönt."
wuw_HUN_news_events.5.a:	"Ein König, endlich!"
wuw_HUN_news_events.5.b:	"Ein neuer Feind erhebt sich"
wuw_HUN_news_events.5.c:	"Ein potenzieller Verbündeter?"
wuw_HUN_news_events.6.t:	"Joseph August übernimmt die ungarische Krone"
wuw_HUN_news_events.6.desc:	"Auf der Suche nach einem König für ihre Nation krönten die [HUN.GetAdjective]s nach langen Verhandlungen und Vorbereitungen Anfang dieser Woche offiziell Joseph August von Habsburg, den letzten Pfalzgrafen von Ungarn, Erzherzog von Österreich und Prinz von Ungarn und Böhmen, sowie Feldmarschall der ehemaligen österreichisch-ungarischen Armee. Heute wurde er in einer feierlichen Zeremonie im Königspalast in Budapest unter großem Tamtam zum König von Ungarn gekrönt. §A Vitez, ein habsburgischer Aristokrat, hat bereits erklärt, dass er Ungarn zu der Größe verhelfen wird, die es verdient, ohne die Verträge zu brechen, die das österreichisch-ungarische Reich aufgelöst haben. Zusammen mit dem Versprechen des Königs, 'die Ungerechtigkeiten, die uns in der Vergangenheit widerfahren sind, ungeschehen zu machen', ist es daher unwahrscheinlich, dass diese Krönung zu einem Abbau der Spannungen in der Region führen wird."
wuw_HUN_news_events.6.a:	"Ein König, endlich!"
wuw_HUN_news_events.6.b:	"Ein neuer Feind erhebt sich"
wuw_HUN_news_events.6.c:	"Ein potenzieller Verbündeter?"
wuw_HUN_news_events.7.t:	"Wiederherstellung der ungarischen Sowjetrepublik"
wuw_HUN_news_events.7.desc:	"Der Vorsitzende des Zentralen Exekutivrates von Ungarn, Béla Kun, hat heute die Wiederherstellung der Sozialistischen Föderativen Räterepublik in Ungarn angekündigt, die im August 1919 ein jähes Ende gefunden hatte. Obwohl sie in der Vergangenheit von einer kombinierten Kraft aus Antirevolutionären und der Kleinen Entente zerschlagen wurde, hat Béla Kun erklärt, dass es dieses Mal anders sein wird. Was erwartet den Balkan in den kommenden Jahren?"
wuw_HUN_news_events.7.a:	"Arbeiter der Welt, vereinigt euch!"
wuw_HUN_news_events.7.b:	"Was um alles in der Welt haben sie vor?"
wuw_HUN_news_events.7.c:	"Revisionistische Poser..."
wuw_HUN_news_events.8.t:	"Ausrufung der ungarischen Volksrepublik"
wuw_HUN_news_events.8.desc:	"Heute hat der Generalsekretär Ungarns, Mátyás Rákosi, die Gründung einer neuen ungarischen Volksrepublik proklamiert und angekündigt, dass die Nationen die Zusammenarbeit mit [SOV.GetNameDef] verstärken wollen. Obwohl er die Nation zu einer offenen Demokratie erklärt hat, ist die diktatorische Herrschaft der Nation nicht schwer zu erkennen. Wie sieht die Zukunft des ungarischen Volkes aus?"
wuw_HUN_news_events.8.a:	"Endlich!"
wuw_HUN_news_events.8.b:	"Frieden war nie eine Option..."
wuw_HUN_news_events.8.c:	"Eine Überraschung, gewiss, aber eine willkommene"
wuw_HUN_news_events.9.t:	"[HUN.GetNameDefCap] besetzt das Burgenland"
wuw_HUN_news_events.9.desc:	"Anfang dieser Woche sind [HUN.GetAdjective] Truppen in Eisenstadt eingezogen und haben das Gebiet besetzt. Sie behaupten, dies sei ein Akt zum Schutz der [HUN.GetAdjective] Menschen in der Region, die erst kürzlich aus Protest gegen die ihrer Meinung nach illegale Besetzung der Region nach Trianon auf die Straße gegangen sind. Wird dies vielleicht zu einem neuen Krieg auf dem Balkan führen, oder handelt es sich lediglich um eine kleine Grenzanpassung?"
wuw_HUN_news_events.9.a:	"Zurück in den richtigen Händen"
wuw_HUN_news_events.9.b:	"Es gehört ihnen nicht!"
wuw_HUN_news_events.9.c:	"Eine interessante Entwicklung"
ww_BEL_event_political.1.t:	"Rücktritt der Regierung und vorgezogene Neuwahlen"
ww_BEL_event_political.1.desc:	"Der Druck, der aufgrund des anhaltenden Korruptionsskandals auf die Regierung ausgeübt wurde, hat sie schließlich zum Sturz gebracht. Ermittler unter der Leitung von Leon Degrelle, dem Anführer der faschistischen Rexist-Bewegung, untersuchen seit mehreren Jahren die Bestechung von Ministern, wobei zahlreiche Zahlungen entdeckt wurden. \n\n In einem Versuch, seine Legitimität wiederzuerlangen, rief der umkämpfte Premierminister Paul van Zeeland Neuwahlen aus, um Glaubwürdigkeit und Legitimität wiederzuerlangen. \n\nDie Partei Ouvrier Belge (Belgische Arbeiterpartei) unter der Führung von Emile Vandervelde hat am besten abgeschnitten und von der Unbeliebtheit seines politischen Rivalen profitiert. Er könnte diesen Sieg nutzen und eine Minderheitsregierung bilden oder mit der katholischen Partei von Paul van Zeeland zusammenarbeiten, um eine stabilere Mehrheit zu bilden und eine Regierung der nationalen Einheit zu bilden. \n\n Es sollte auch erwähnt werden, dass die Rexisten-Partei von Leon Degrelle ebenfalls sehr gut abgeschnitten hat, da seine Anti-Korruptions-Haltung sehr beliebt ist."
ww_BEL_event_political.1.a:	"Bilden Sie die Regierung der Nationalen Einheit"
ww_BEL_event_political.1.b:	"Vandervelde bildet eine Minderheitsregierung"
BEL_paul_van_zeeland_remains_tt:	"§Paul van Zeeland§! bleibt Premierminister und führt eine breite Koalition aus demokratischen§! Parteien an."
ww_BEL_event_political.2.t:	"Paul van Zeeland Korruptionsskandal"
ww_BEL_event_political.2.desc:	"Der Korruptionsskandal, der die katholische Partei von Paul van Zeeland heimsucht, hat sich heute verschlimmert, da der Premierminister selbst Spenden angenommen hat! Es scheint nur eine Frage der Zeit zu sein, bis seine Regierung erneut zusammenbricht..."
ww_BEL_event_political.2.a:	"Nimmt die Korruption denn kein Ende?!"
ww_BEL_event_political.3.t:	"Die königliche Ernennung"
ww_BEL_event_political.3.desc:	"Paul van Zeeland tritt schließlich als Premierminister zurück und verlässt seinen Posten in Ungnade. Diesmal hat Leopold III., der König selbst, erklärt, dass er einspringen und einen neuen Premierminister ernennen wird. Es gibt zwei prominente Kandidaten: \n\nPaul-Émile Janson, ein Mitglied der Liberalen Partei und Mitglied der Regierung der Nationalen Einheit, gilt als stabile Hand. Der andere ist Leon Degrelle, der als die Stimme von Recht und Ordnung gilt und kürzlich durch den Wahlerfolg seiner eigenen Partei gestärkt wurde."
ww_BEL_event_political.3.a:	"Ernennen Sie die stabile Hand, den Liberalen Paul-Émile Janson"
ww_BEL_event_political.3.b:	"Setzen Sie auf den Rexisten Leon Degrelle, um Recht und Ordnung wiederherzustellen"
ww_BEL_event_political.4.t:	"Haushaltskrise"
ww_BEL_event_political.4.desc:	"Trotz der ersten Anzeichen einer wirtschaftlichen Erholung stehen wir wieder einmal vor einer Finanzkrise. Premierminister [BEL.GetLeader] hat es nicht geschafft, den [BEL.GetHerHis] Haushalt durch das Parlament zu bringen. Er war nicht in der Lage, einen breiten Konsens über die notwendigen Steuerreformen zu erzielen, die notwendig sind, um der Verschlechterung der öffentlichen Finanzen entgegenzuwirken, was einmal mehr zum Zusammenbruch der Regierung geführt hat. \n\n Dies führte zu einer schnellen Übergabe der Macht an Paul-Henri Spaak, einen aufsteigenden Stern der Arbeiterpartei und den ersten sozialistischen Premierminister Belgiens."
ww_BEL_event_political.4.a:	"Hoffentlich bleibt Premierminister Spaak länger an der Macht!"
ww_BEL_event_political.5.t:	"Adriaan Martens-Krise"
ww_BEL_event_political.5.desc:	"Was als ganz normale Ernennung begann, wurde zu einer weiteren politischen Krise für unsere Regierung. Der Premierminister musste ein neues Mitglied für die Königliche Akademie für Medizin ernennen und schlug Adriaan Martens vor. Dies erwies sich als kontroverse Wahl, da Martens flämischer Nationalismus und Kollaboration mit den deutschen Besatzern während des Ersten Weltkriegs vorlag. Diese Wahl wurde von Veteranen, Liberalen und französischsprachigen Belgiern heftig abgelehnt und sogar der König zeigte sich unzufrieden. \n\n[BEL.GetLeader] hat versucht, die Wahl zu verteidigen, ist aber zunehmend unter Druck geraten. Seine Gegner haben vorgezogene Neuwahlen gefordert, um einen neuen Regierungschef zu wählen, obwohl Spaak möglicherweise das politische Kapital hat, um für diese Position zu kämpfen."
ww_BEL_event_political.5.a:	"Der Premierminister sollte zurücktreten und Neuwahlen ausrufen"
ww_BEL_event_political.5.b:	"Spaak hat die politische Unterstützung, um dies zu überleben"
ww_BEL_event_political.6.t:	"Die flämische Frage"
ww_BEL_event_political.6.desc:	"Seit seiner Gründung ist Belgien ein Land, das zwischen zwei Sprachgruppen geteilt ist: den Wallonen, die Französisch sprechen, und den Flamen, die Niederländisch sprechen. Dies hat zu einer ganzen Reihe von Problemen innerhalb unserer Nation geführt, von einfachen Missverständnissen zwischen Freunden über die falsche Ausführung militärischer Befehle bis hin zu Justizirrtümern, weil Angeklagte nicht dieselbe Sprache sprechen wie das Gericht, das sie verurteilt. Es ist an der Zeit, diese Spaltung ein für alle Mal zu überwinden und zu entscheiden, wie wir unsere Nation am besten unter einem gemeinsamen Sprachmodell vereinen können."
ww_BEL_event_political.6.a:	"Niederländisch sollte Vorrang haben."
ww_BEL_event_political.6.b:	"Französisch sollte Vorrang haben."
ww_BEL_event_political.6.c:	"Belgien wird von beiden Kulturen gleichermaßen geprägt."
ww_BEL_event_political.7.t:	"Die vorgezogenen Neuwahlen"
ww_BEL_event_political.7.desc:	"Nachdem die Verfassungskrise vorerst eingedämmt ist, ist es an der Zeit, der Regierung wieder ihre Legitimität zu verleihen, sonst unterscheidet sie sich nicht von denen, die sie gerade abgesetzt hat. Im Moment sind Paul-Henri Spaak von den Sozialisten und Hubert Pierlot von der Katholischen Partei die Spitzenkandidaten bei den möglichen Neuwahlen."
ww_BEL_event_political.7.a:	"Hubert Pierlot und die Katholische Partei werden denen, die uns bedrohen, trotzig gegenüberstehen."
ww_BEL_event_political.7.b:	"Paul-Henri Spaak und die Arbeiterpartei werden uns in eine neue sozialistische Zukunft führen."
ww_BEL_event_political.8.t:	"Die Sprache des Volkes"
ww_BEL_event_political.8.desc:	"Unser Volk ist seit langem durch die Sprache gespalten. Die Wallonen sprechen Französisch und die Flamen Niederländisch, was zu einer Kluft zwischen den Gruppen führt und verhindert, dass sich eine einheitlichere [ROOT.GetName] entwickelt. Wir müssen eine Entscheidung darüber treffen, welches unsere offizielle Sprache ist, sonst werden Missverständnisse zwischen Freunden, falsch ausgeführte militärische Befehle und Justizirrtümer nie aufhören, Teil des täglichen [ROOT.GetAdjective] Lebens zu sein."
ww_BEL_event_political.8.a:	"Niederländisch ist unsere Sprache"
ww_BEL_event_political.8.b:	"Französisch ist unsere Sprache"
ww_BEL_event_political.8.c:	"Unsere Sprachen sind gleichberechtigt und wir werden beide behalten!"
ww_BEL_event_diplomatic.1.t:	"[FROM.GetNameDefCap] lehnt unsere Garantien ab"
ww_BEL_event_diplomatic.1.desc:	"[FROM.GetLeader] hat uns wissen lassen, dass der Vertrag über die gegenseitige Verteidigung zwischen unseren Ländern null und nichtig ist, da sie in diesen unruhigen Zeiten einen neutralen Ansatz suchen. Das hat sich für sie während des Großen Krieges nicht wirklich bewährt, aber...."
ww_BEL_event_diplomatic.1.a:	"Sollen sie doch alleine weitermachen"
ww_BEL_event_diplomatic.2.t:	"[FROM.GetNameDefCap] Fordert unsere Annektierung"
ww_BEL_event_diplomatic.2.desc:	"[FROM.GetLeader] hat sich auf die Bande der Vergangenheit und unser gemeinsames Erbe und unsere gemeinsame Sprache berufen, um unsere Annektierung in ihre Nation zu erreichen."
ww_BEL_event_diplomatic.2.a:	"Gemeinsam sind wir stärker."
ww_BEL_event_diplomatic.2.b:	"Luxemburg ist eine stolze und unabhängige Nation!"
ww_BEL_event_diplomatic.3.t:	"[FROM.GetNameDefCap] Renditen"
ww_BEL_event_diplomatic.3.desc:	"Wir haben hervorragende Nachrichten erhalten! Das Volk von [FROM.GetNameDefCap] hat in weiser Voraussicht beschlossen, dass wir gemeinsam stärker sind, und es werden bereits Vorkehrungen getroffen, um die neue Verwaltung dieses Gebiets zu gewährleisten."
ww_BEL_event_diplomatic.3.a:	"Prächtig"
ww_BEL_event_diplomatic.4.t:	"[FROM.GetNameDefCap] wehrt sich!"
ww_BEL_event_diplomatic.4.desc:	"Leider hat es den Anschein, dass die Menschen in [FROM.GetNameDefCap] ein übersteigertes Gefühl für ihre eigene souveräne Macht haben und unser freundliches Angebot zur Vereinigung ablehnen. Wir werden ihnen die Stärke unserer Nation zeigen müssen und sie mit Gewalt in unsere Union holen müssen."
ww_BEL_event_diplomatic.4.a:	"Sie haben die falsche Wahl getroffen"
ww_BEL_event_diplomatic.5.t:	"Wie sollen wir Calais bekommen?"
ww_BEL_event_diplomatic.5.desc:	"Wir haben beschlossen, Calais von Frankreich einzufordern, aber wir müssen noch entscheiden, wie wir es bekommen wollen. Natürlich können unsere mächtigen Armeen dieses Land ohne Probleme einnehmen, aber wir sollten uns der Möglichkeit von Kollateralschäden bewusst sein und daher vielleicht eine andere Methode der Übernahme wählen. Die Art und Weise der Einigung ist uns nicht wichtig, solange wir das bekommen, was uns rechtmäßig gehört!"
ww_BEL_event_diplomatic.5.a:	"Drohen Sie dafür mit Krieg."
ww_BEL_event_diplomatic.5.b:	"Kongo für Calais."
ww_BEL_event_diplomatic.5.c:	"Bieten Sie eine finanzielle Entschädigung."
ww_BEL_event_diplomatic.5.d:	"Bieten Sie im Gegenzug ein Bündnis an."
ww_BEL_event_diplomatic.6.t:	"Belgien fordert Calais"
ww_BEL_event_diplomatic.6.desc:	"Wir haben gerade eine unverschämte Forderung von [BEL.GetName] erhalten, ihnen Calais zu überlassen! Sie behaupten, dass dieses Land aufgrund des historischen Herzogtums Burgund, auf das sie sich in irgendeiner Form berufen, rechtmäßig zu Belgien gehört. Ihre Botschafter haben uns mit Gewalt gedroht, sollten wir ihrer Forderung nicht nachkommen. Aber da wir ihre militärische Stärke kennen, ist dies höchstwahrscheinlich ein Bluff."
ww_BEL_event_diplomatic.6.a:	"Sacre Bleu! Non!"
ww_BEL_event_diplomatic.6.b:	"Wir können uns im Moment keinen weiteren Feind leisten."
ww_BEL_event_diplomatic.7.t:	"Belgien möchte Calais tauschen"
ww_BEL_event_diplomatic.7.desc:	"Wir haben gerade ein interessantes Angebot von der [BEL.GetAdjective] Delegation erhalten. Sie haben einen Gebietstausch vorgeschlagen, Calais gegen einen großen Teil des Kongo. Wir würden uns die Staaten Coquilhatville und Stanleyville sichern, die an unsere derzeitigen Territorien in diesem Gebiet grenzen. Es gab einige angedeutete Drohungen seitens ihrer Diplomaten, falls wir dieses Angebot ablehnen sollten. Dies wäre eine erhebliche Ausweitung unserer afrikanischen Besitzungen, aber ist es den Preis wert?"
ww_BEL_event_diplomatic.7.a:	"Nein, Calais ist für uns wertvoller."
ww_BEL_event_diplomatic.7.b:	"Nun gut, das ist ein fairer Tausch."
ww_BEL_event_diplomatic.8.t:	"Belgien möchte Calais kaufen"
ww_BEL_event_diplomatic.8.desc:	"Wir haben gerade ein interessantes Angebot von der [BEL.GetAdjective]-Delegation erhalten. Sie haben ihr Interesse bekundet, Calais von uns zu kaufen, um ihre historischen Territorien wieder zu vereinen. Die von ihnen vorgeschlagene Summe ist recht hoch und würde sicherlich dazu beitragen, unsere eigene Wirtschaft zu verbessern. Die Frage ist, ob wir glauben, dass dieser Landverlust diesen Preis wert ist. Es sei auch darauf hingewiesen, dass ihre Diplomaten eine Eskalation der Spannungen angedeutet haben, sollten wir ihr Angebot ablehnen."
ww_BEL_event_diplomatic.8.a:	"Nein, Calais ist für uns wertvoller."
ww_BEL_event_diplomatic.8.b:	"Das scheint ein fairer Preis zu sein!"
ww_BEL_event_diplomatic.9.t:	"Coquilhatville und Stanleyville an Frankreich verkauft!"
ww_BEL_event_diplomatic.9.desc:	"Unser Kolonialgouverneur wurde soeben darüber informiert, dass [BEL.GetName] ein Geschäft mit [FRA.GetName] abgeschlossen hat, um Calais gegen ein paar unserer Staaten einzutauschen, nämlich Coquilhatville und Stanleyville. Wieder einmal ändern die europäischen Machthaber die Grenzen Afrikas, ohne dass wir, die wir hier leben, etwas dazu beitragen!"
ww_BEL_event_diplomatic.9.a:	"Wir werden unsere Karten aktualisieren müssen... Wieder einmal."
ww_BEL_event_diplomatic.10.t:	"Frankreich akzeptiert!"
ww_BEL_event_diplomatic.10.desc:	"Wir haben von unserer Delegation in Paris die Nachricht erhalten, dass [FRA.GetName] unser Angebot angenommen hat und der Prozess zur Übertragung der Verwaltung von Calais und den umliegenden Gebieten an uns bereits im Gange ist!"
ww_BEL_event_diplomatic.10.a:	"Unser rechtmäßiges Territorium ist wiederhergestellt!"
ww_BEL_event_diplomatic.11.t:	"Eskalierende Spannungen um Calais"
ww_BEL_event_diplomatic.11.desc:	"Unsere Delegation in Paris hat mitgeteilt, dass die Verhandlungen über Calais gescheitert sind und wir möglicherweise Gewalt anwenden müssen, um dieses Land, das uns rechtmäßig gehört, zu sichern. Wir haben versucht, mit unseren Angeboten vernünftig zu sein, aber sie haben uns bei jedem Schritt abgewiesen. Es ist an der Zeit, ihnen die wahre Kraft der [BEL.GetAdjective] militärischen Macht zu zeigen."
ww_BEL_event_diplomatic.11.a:	"Treten Sie vom Abgrund zurück."
ww_BEL_event_diplomatic.11.b:	"Dann haben sie den Krieg gewählt! "
ww_BEL_event_diplomatic.12.t:	"[FROM.GetNameDefCap] bittet um unsere Hilfe"
ww_BEL_event_diplomatic.12.desc:	"Eine Mitteilung der [FROM.GetAdjective] Führung hat uns soeben erreicht. Während die Welt um sie herum immer feindseliger wird, machen sie sich Sorgen über ihre eigenen Fähigkeiten, ihr Land zu schützen. Unsere Hilfe wäre sehr willkommen und würde den Frieden in der Region sichern."
ww_BEL_event_diplomatic.12.a:	"Sie sollen unsere Hilfe bekommen!"
ww_BEL_event_diplomatic.12.b:	"Wir können ihnen nicht helfen"
ww_BEL_event_diplomatic.13.t:	"[FROM.GetNameDefCap] Garantiert unsere Unabhängigkeit"
ww_BEL_event_diplomatic.13.desc:	"Wir haben die wunderbarsten Nachrichten von den [FROM.GetAdjective] Diplomaten erhalten. Sie sind der Meinung, dass unsere Sicherheit bedroht sein könnte und dass unsere Armee möglicherweise nicht ausreicht, um unsere Unabhängigkeit zu sichern. Aus diesem Grund haben sie uns die von uns geforderte Garantie angeboten."
ww_BEL_event_diplomatic.13.a:	"Dies wird uns Sicherheit bieten."
ww_BEL_event_diplomatic.14.t:	"[FROM.GetNameDefCap] Verweigert uns eine Garantie"
ww_BEL_event_diplomatic.14.desc:	"Trotz der offensichtlichen Bedrohung unserer Existenz hat die [FROM.GetAdjective] Führung unsere Bitte um eine Garantie abgelehnt. Wir haben versucht, sie zur Vernunft zu bringen, aber sie weigern sich, den Ernst der Lage zu erkennen. Es sieht so aus, als müssten wir auf uns allein gestellt sein."
ww_BEL_event_diplomatic.14.a:	"Wie unhöflich von ihnen!"
ww_BEL_event_diplomatic.15.t:	"[FROM.GetNameDefCap] Bittet um Ausrüstung"
ww_BEL_event_diplomatic.15.desc:	"Soeben hat uns eine Anfrage der Führung der [FROM.GetAdjective] im Exil erreicht. Sie wünschen sich von uns einige Ausrüstungsgegenstände, um die Truppen zu trainieren, die sie noch haben, in der Hoffnung, dass sie irgendwann in der Lage sein werden, ihr Heimatland zurückzuerobern."
ww_BEL_event_diplomatic.15.a:	"Wir werden sie unterstützen!"
ww_BEL_event_diplomatic.15.b:	"Ihre Ambitionen sind edel, aber wir können nicht helfen."
ww_BEL_event_diplomatic.16.t:	"[FROM.GetNameDefCap] Erbittet Fabriken"
ww_BEL_event_diplomatic.16.desc:	"Wir haben eine Anfrage von der [FROM.GetAdjective] Führung erhalten, unsere Fabriken zu nutzen, um Ausrüstung für ihre verbleibenden Truppen zu produzieren. Sie wollen ihr Heimatland zurückerobern und dafür brauchen ihre Truppen Ausrüstung."
ww_BEL_event_diplomatic.16.a:	"Natürlich werden wir helfen."
ww_BEL_event_diplomatic.16.b:	"Wir haben nicht die Kapazität zu helfen"
ww_BEL_event_diplomatic.17.t:	"[FROM.GetNameDefCap] Schlägt Austausch von militärischer Erfahrung vor"
ww_BEL_event_diplomatic.17.desc:	"Die Exilregierung von [FROM.GetNameDef] hat sich an uns gewandt, um eine gemeinsame Anstrengung zum Austausch militärischer Erfahrungen zwischen unseren Armeen vorzuschlagen. Davon könnten wir genauso profitieren wie sie."
ww_BEL_event_diplomatic.17.a:	"Eine großartige Idee!"
ww_BEL_event_diplomatic.17.b:	"Es ist die Zeit nicht wert"
ww_BEL_event_diplomatic.18.t:	"[FROM.GetNameDefCap] Stimmt zu"
ww_BEL_event_diplomatic.18.desc:	"Unsere vorgeschlagenen Bemühungen, unsere Position zu stärken und unsere Armee für die Rückeroberung des Heimatlandes wiederaufzubauen, sind bei [FROM.GetNameDef] auf Zustimmung gestoßen. Auch wenn dies allein unsere Probleme nicht lösen kann, wird es doch ein großer Schritt sein, um endlich wieder unabhängig zu werden."
ww_BEL_event_diplomatic.18.a:	"Großartige Neuigkeiten!"
ww_BEL_event_diplomatic.19.t:	"[FROM.GetNameDefCap] lehnt ab"
ww_BEL_event_diplomatic.19.desc:	"Unser Vorschlag, unsere Position zu stärken und unsere Armee für die Rückeroberung des Heimatlandes wieder aufzubauen, wurde von [FROM.GetNameDef] abgelehnt. Wir hatten gehofft, dass dies ein Sprungbrett für die Zukunft sein würde, aber es scheint, dass diese Pläne zunichte gemacht wurden."
ww_BEL_event_diplomatic.19.a:	"Unglücklich"
ww_BEL_event_diplomatic.20.t:	"[FROM.GetNameDefCap] lädt uns zu einem europäischen Kooperationsprojekt ein"
ww_BEL_event_diplomatic.20.desc:	"Wir haben eine offizielle Einladung von [FROM.GetNameDef] erhalten, dem [FROM.GetFactionName] beizutreten. Dies ist ihre neue Initiative zur Förderung der Zusammenarbeit in der Region. Sie hoffen, dass diese Initiative die Region stabilisieren und bessere diplomatische Beziehungen fördern wird."
ww_BEL_event_diplomatic.20.a:	"Eine großartige Initiative!"
ww_BEL_event_diplomatic.20.b:	"Das klingt verdächtig..."
ww_BEL_event_diplomatic.21.t:	"[FROM.GetNameDefCap] schließt sich der [ROOT.GetFactionName] an"
ww_BEL_event_diplomatic.21.desc:	"Unsere Einladung an [FROM.GetNameDef] ist mit Zustimmung aufgenommen worden. Sie sind sich einig, dass eine größere europäische Gemeinschaft der richtige Weg ist. Mit gemeinsamen Anstrengungen werden wir die Region wieder stabilisieren können."
ww_BEL_event_diplomatic.21.a:	"Gute Nachrichten!"
ww_BEL_event_diplomatic.22.t:	"[FROM.GetNameDefCap] lehnt unsere Einladung zum [ROOT.GetFactionName] ab"
ww_BEL_event_diplomatic.22.desc:	"Die Diplomaten von [FROM.GetAdjective] haben sich mit einer enttäuschenden Antwort an uns gewandt. Sie behaupten, dass die Idee zwar edel sein mag, aber unweigerlich scheitern wird, so wie ähnliche Initiativen schon vor uns."
ww_BEL_event_diplomatic.22.a:	"Eine Schande, wirklich..."
ww_BEL_event_diplomatic.23.t:	"[FROM.GetNameDefCap] lädt uns zu ihren Forschungsanstrengungen ein"
ww_BEL_event_diplomatic.23.desc:	"Eine [FROM.GetAdjective]-Delegation ist an uns herangetreten, um eine [FROM.GetFactionName]-weite Forschungsarbeit vorzuschlagen. Als enge Verbündete müssen wir unsere Technologien untereinander austauschen, um alle in der Union voranzubringen."
ww_BEL_event_diplomatic.23.a:	"Sicher, wir werden uns anschließen."
ww_BEL_event_diplomatic.23.b:	"Unsere eigene Technologie wird unsere eigene bleiben"
ww_BEL_event_diplomatic.24.t:	"[FROM.GetNameDefCap] tritt der Forschungsgruppe der Europäischen Union bei"
ww_BEL_event_diplomatic.24.desc:	"Unsere Initiative, einen Ort für den Technologieaustausch zwischen unseren Verbündeten zu schaffen, ist auf die Zustimmung von [FROM.GetNameDef] gestoßen. Sie haben sich den Bemühungen angeschlossen und werden ihre technologischen Fortschritte mit uns und unseren gemeinsamen Verbündeten teilen, so wie wir unsere mit ihnen teilen werden."
ww_BEL_event_diplomatic.24.a:	"Ausgezeichnet!"
ww_BEL_event_diplomatic.25.t:	"[FROM.GetNameDefCap] weigert sich, der Forschungsgruppe der Europäischen Union beizutreten"
ww_BEL_event_diplomatic.25.desc:	"Obwohl wir der Meinung waren, dass wir [FROM.GetNameDef] ein solides Argument für die European Union Research Group vorgelegt haben, hat sie sich geweigert, der Initiative beizutreten. Wir hoffen, dass wir trotzdem von der Initiative profitieren können, aber das wird ohne [FROM.GetNameDef] geschehen müssen."
ww_BEL_event_diplomatic.25.a:	"Tja..."
ww_BEL_event_diplomatic.26.t:	"[FROM.GetNameDefCap] bittet um begrenzte Föderalisierung"
ww_BEL_event_diplomatic.26.desc:	"Wir haben eine Anfrage von [FROM.GetNameDef] erhalten. Als Präsident der [ROOT.GetFactionName] sind sie zu der Erkenntnis gelangt, dass ein föderaleres Europa die Verteidigungs- und Handelsbemühungen des Blocks verbessern würde, und haben darum gebeten, dass wir uns diesen Bemühungen anschließen."
ww_BEL_event_diplomatic.26.a:	"Zum Wohle von [FROM.GetFactionName]"
ww_BEL_event_diplomatic.26.b:	"Nein, wir müssen an unsere Souveränität denken!"
ww_BEL_event_diplomatic.26.b_tt:	"§Sie könnten uns aus der Fraktion werfen!"
ww_BEL_event_diplomatic.27.t:	"[FROM.GetNameDefCap] Erlaubt begrenzte Föderalisierung"
ww_BEL_event_diplomatic.27.desc:	"[FROM.GetNameDefCap] hat unserem Antrag zugestimmt, sich enger an [FROM.GetFactionName] zu binden. Wir werden einige Befugnisse über ihre Außenpolitik erhalten und der Handel zwischen uns allen wird vereinfacht werden."
ww_BEL_event_diplomatic.27.a:	"Großartig!"
ww_BEL_event_diplomatic.28.t:	"[FROM.GetNameDefCap] lehnt begrenzte Föderalisierung ab"
ww_BEL_event_diplomatic.28.desc:	"Trotz der offensichtlichen Vorteile hat [FROM.GetNameDef] beschlossen, sich unserer Idee eines föderalen Europas nicht anzuschließen. Sie behaupten, dass ihre eigene Souveränität über dem Wohlergehen der gesamten $EU_tech_sharing_group_name$ steht, und das ist eine sehr beunruhigende Haltung, die aus den Reihen der Union kommt."
ww_BEL_event_diplomatic.28.a:	"Das ist sehr besorgniserregend."
ww_BEL_event_diplomatic.28.b:	"Sie sind eine Gefahr für uns alle!"
ww_BEL_event_diplomatic.29.t:	"Otto von Habsburg bietet seine Unterstützung an"
ww_BEL_event_diplomatic.29.desc:	"Wir haben ein Angebot zur Unterstützung von einer Person erhalten, die uns etwas überrascht hat. Otto von Habsburg ist zwar der Erbe von Karl I., Kaiser von Österreich, König von Ungarn und König von Kroatien, aber es scheint, dass Otto im Gegensatz zu seinem Vater der Zusammenarbeit innerhalb Europas sehr viel mehr zugeneigt ist. Er begrüßt unsere Bemühungen und bietet uns seine Hilfe auf diplomatischer Ebene an. Sein weitreichendes diplomatisches Netzwerk könnte ein Gewinn für uns sein und diese Hilfe würde er uns gerne anbieten."
ww_BEL_event_diplomatic.29.a:	"Es wäre uns eine Ehre, ihn an unserer Seite zu haben."
ww_BEL_event_diplomatic.29.b:	"Die Habsburger gehören der Vergangenheit an."
ww_BEL_event_diplomatic.30.t:	"[FROM.GetNameDefCap] Bittet um den Beitritt zum [ROOT.GetFactionName]"
ww_BEL_event_diplomatic.30.desc:	"Nach der Entscheidung der [FROM.GetAdjective], ihr Streben nach Neutralität aufzugeben, hat sich die Führung der [FROM.GetNameDef] umso mehr auf unsere politische Agenda eingestellt. Sie haben sich nun mit der Bitte an uns gewandt, sich [ROOT.GetFactionName] anzuschließen. Ihre Hilfe könnte nützlich sein und uns neue Wege für die Strategie unserer zukünftigen Expansion eröffnen."
ww_BEL_event_diplomatic.30.a:	"Sie sind hier willkommen"
ww_BEL_event_diplomatic.30.b:	"Wir haben keinen Bedarf an ihnen"
ww_BEL_event_diplomatic.31.t:	"[FROM.GetNameDefCap] Nimmt uns in die [FROM.GetFactionName] auf"
ww_BEL_event_diplomatic.31.desc:	"[FROM.GetAdjective] Anführer [FROM.GetLeader] hat uns die Hand gereicht, um uns in der [FROM.GetFactionName] willkommen zu heißen. Von nun an werden wir Seite an Seite gegen gemeinsame Bedrohungen kämpfen. Vorbei ist die Zeit unserer Neutralität!"
ww_BEL_event_diplomatic.31.a:	"Große Neuigkeiten"
ww_BEL_event_diplomatic.32.t:	"[FROM.GetNameDefCap] verweigert uns die Mitgliedschaft in der [FROM.GetFactionName]"
ww_BEL_event_diplomatic.32.desc:	"Trotz offensichtlicher Vorteile hat uns der [FROM.GetAdjective]-Führer [FROM.GetLeader] als Mitglied des [FROM.GetFactionName] abgelehnt. Wir hätten viel einbringen können, aber in Anbetracht dieser Reaktion sollten wir unsere Ambitionen, ihnen beizutreten, noch einmal überdenken, sowohl jetzt als auch in Zukunft."
ww_BEL_event_diplomatic.32.a:	"Wir können etwas Besseres schaffen!"
BEL_tried_to_join_the_axis_flag:	"Wir haben bereits versucht, der [GER.GetFactionName] beizutreten."
ww_BEL_event_diplomatic.33.t:	"Die Zukunft der [ROOT.GetAdjective]-Neutralität"
ww_BEL_event_diplomatic.33.desc:	"Die Neutralität hat unserem Land sehr gut gedient, aber wenn wir neutral bleiben, könnten andere uns nur als passive Zuschauer und Zielscheibe betrachten. Wir müssen sorgfältig über die Zukunft unserer Außenpolitik und unsere Haltung zum bewaffneten Kampf nachdenken, denn es scheint, dass uns in naher Zukunft ein Konflikt erreichen könnte."
ww_BEL_event_diplomatic.33.a:	"Wir müssen die Fesseln sprengen und uns vorbereiten!"
ww_BEL_event_diplomatic.33.b:	"Die Neutralität muss gewahrt werden!"
ww_BEL_event_diplomatic.34.t:	"[FRA.GetNameDefCap]: Freund oder Feind?"
ww_BEL_event_diplomatic.34.desc:	"Egal, wie gut wir bewaffnet sind, wir müssen uns mit der Tatsache abfinden, dass unser südlicher Nachbar wahrscheinlich immer mehr Kapazitäten haben wird als wir. Wir müssen uns einigen: Betrachten wir sie als Freund oder als Feind?"
ww_BEL_event_diplomatic.34.a:	"Die [FRA.GetAdjective] sind unsere Freunde"
ww_BEL_event_diplomatic.34.b:	"Den [FRA.GetAdjective] kann man nicht trauen!"
ww_BEL_event_diplomatic.35.t:	"[FROM.GetNameDefCap] erreicht uns"
ww_BEL_event_diplomatic.35.desc:	"Wir sind von unserem nördlichen Nachbarn kontaktiert worden. Sie möchten ernsthafte diplomatische Beziehungen mit uns aufnehmen. Ihr Angebot könnte für uns beide von Vorteil sein, aber wir müssen trotzdem sicherstellen, dass wir in dieser Angelegenheit die richtige Wahl treffen."
ww_BEL_event_diplomatic.35.a:	"Aber natürlich!"
ww_BEL_event_diplomatic.35.b:	"Nein, wir sehen darin keinen Vorteil."
ww_BEL_event_diplomatic.36.t:	"Der [FROM.GetAdjective] stimmt zu"
ww_BEL_event_diplomatic.36.desc:	"Die Führung von [FROM.GetNameDef] ist ebenfalls der Meinung, dass wir beide von einer Vertiefung unserer diplomatischen Beziehungen profitieren könnten. Wir können auf sie als unsere Freunde und Verbündeten in dieser immer feindseliger werdenden Welt zählen."
ww_BEL_event_diplomatic.36.a:	"Großartig!"
ww_BEL_event_diplomatic.37.t:	"Die [FROM.GetAdjective] ist anderer Meinung"
ww_BEL_event_diplomatic.37.desc:	"Trotz der offensichtlichen Vorteile für uns beide scheinen die [FROM.GetAdjective] nicht bereit zu sein, diplomatische Beziehungen mit uns zu unterhalten, die über das hinausgehen, was sie bereits tun. Wir hatten große Hoffnungen in diese Angelegenheit, aber es scheint, dass sie nicht geteilt wurden."
ww_BEL_event_diplomatic.37.a:	"Eine Schande..."
ww_BEL_event_war.1.t:	"Umgesiedelte Luftindustrie aktiviert"
ww_BEL_event_war.1.desc:	"Unsere Voraussicht, gute Arbeitskontakte zu ausländischen Industrieunternehmen aufzubauen, hat sich ausgezahlt. Ihre Anlagen sind bereit, die Produktion sofort aufzunehmen."
ww_BEL_event_war.1.a:	"Deshalb planen wir vorausschauend!"
ww_BEL_event_war.2.t:	"Unbekannte Sympathien"
ww_BEL_event_war.2.desc:	"König Leopold III. steht im Schatten seines Vaters, König Albert, dem Soldatenkönig, der dafür bekannt ist, dass er Belgien im Ersten Weltkrieg gehalten und dem Deutschen Reich den Sieg verwehrt hat. Obwohl sein Land dabei in ein Schlachtfeld verwandelt wurde, blieb der militärische Stolz der Nation ungetrübt und das Ansehen Belgiens auf der Weltbühne stieg. \n\nNun, da sich Belgien erneut im Krieg befindet, wird die wahre Prüfung von Leopolds Charakter beginnen, und schon jetzt gibt es Geräusche, die uns Sorgen machen. \n\n Unter dem Vorwand, das Leben seines Volkes schützen zu wollen, hat der König bereits die Fühler nach Frieden ausgestreckt, und wir vermuten, dass der König im Falle einer Niederlage von Brüssel, Lüttich oder Antwerpen vorzeitig kapitulieren könnte, ungeachtet des demokratischen Willens des Volkes, weiter zu kämpfen."
ww_BEL_event_war.2.a:	"König Leopold wird uns zum Sieg führen."
BEL_unknown_sympathies_tt:	"§RKönig Leopold wird kapitulieren, wenn wir Lüttich, Antwerpen oder Brüssel verlieren. Sie haben vielleicht noch einige Optionen, wenn es so weit ist.§!"
ww_BEL_event_war.3.t:	"Die Kapitulation des Königs"
ww_BEL_event_war.3.desc:	"Der König als Oberbefehlshaber der Streitkräfte hat heute die bedingungslose Kapitulation von [BEL.GetName] angeboten, ohne vorher die Ratifizierung durch das Parlament [BEL.GetAdjective] abzuwarten. Technisch gesehen hat er als Oberbefehlshaber die Macht, das Militär zu kapitulieren, aber nicht das Land selbst. \n\n Das zivile Parlament ist bereits ins Exil geflohen und hat seine Absicht deutlich gemacht, den Krieg unter Einsatz aller Ressourcen des [BEL.GetAdjective] Reiches fortzusetzen."
ww_BEL_event_war.3.a:	"Es ist der Wille des Königs!"
ww_BEL_event_war.3.b:	"Kämpfen Sie weiter!"
ww_BEL_event_war.3.c:	"Er hatte kein Recht dazu! Stellen Sie den König unter Hausarrest."
ww_BEL_event_war.4.t:	"Der königliche Gefangene"
ww_BEL_event_war.4.desc:	"Nach seinem Verrat, die Nation an den Eindringling auszuliefern, wurde der König unter Hausarrest gestellt und seines Amtes als Oberbefehlshaber der Streitkräfte enthoben, seiner Titel beraubt und natürlich seiner Krone beraubt. Das Volk braucht aber immer noch einen Herrscher, und wir haben die Wahl, wer die Regentschaft übernehmen soll, bis sein Sohn alt genug ist, um den Thron zu besteigen. Es gibt zwei Möglichkeiten: \n\nDie erste ist Leon Degrelle, der Premierminister und rechtmäßig ernannte Anführer unseres Volkes. Die andere Option ist Charles, Graf von Flandern, der Bruder von Leopold, der den Anschein von Legitimität und Kontinuität in der Krone erwecken würde."
ww_BEL_event_war.4.a:	"Machen Sie Leon Degrelle zum neuen Regenten"
ww_BEL_event_war.4.b:	"Sichern Sie die legitime Linie mit Charles"
ww_BEL_event_war.5.t:	"Die Kapitulation des Königs"
ww_BEL_event_war.5.desc:	"Nach einer beherzten Verteidigung der Nation hat König Leopold III. schließlich die Kapitulation von [BEL.GetName] angeboten und unsere Regierung ist ins Exil gezwungen worden. Leopold hat sich entschieden, bei seinem Volk zu bleiben und ein Gefangener in seinem eigenen Haus zu werden. Wir können uns immer noch auf den guten Willen unserer Verbündeten verlassen und uns auf die Ressourcen des [BEL.GetAdjective] Imperiums stützen, so dass wir mit der Zeit unser Heimatland zurückerhalten."
ww_BEL_event_war.5.a:	"Die Zukunft ist ungewiss."
ww_BEL_event_war.6.t:	"Generalsekretäre"
ww_BEL_event_war.6.desc:	"Eine Gruppe belgischer Beamter ist mit einem Angebot an uns herangetreten. Erlauben Sie ihnen, ihre Arbeit im Bürgeramt fortzusetzen, und sie werden dafür sorgen, dass die lokale Verwaltung in dieser Zeit des Übergangs weiterhin reibungslos funktioniert. Die belgische Regierung hat ein Gesetz verabschiedet, das ihre Zusammenarbeit mit uns legalisiert, um die Auswirkungen der Besetzung auf die Bevölkerung zu verringern. Sie hat den belgischen Banken sogar erlaubt, die Gehälter der Verwaltungsangestellten weiter zu zahlen. Dies ist eine Gelegenheit für uns, unsere Bereitschaft zur Zusammenarbeit mit den Einheimischen zu zeigen, und wird dazu beitragen, den aktiven Widerstand in der Region wiederzubeleben."
ww_BEL_event_war.6.a:	"Eine gute Initiative, mit ihnen zusammenzuarbeiten, um eine reibungslose Besetzung zu gewährleisten."
ww_BEL_event_war.6.b:	"Interessante Idee, wir werden ihr Angebot in Betracht ziehen."
ww_BEL_event_war.6.c:	"Dies ist lediglich ein Vorwand für einen legitimen Widerstand. Nein."
BEL_set_secretaries_general_tt:	"§YGeneralsekretär§! wird als §YBerufliches Recht§! in ganz Belgien eingeführt werden"
BEL_available_secretaries_general_tt:	"§YGeneralsekretäre§! sind jetzt als §YBerufliches Recht§! in Belgien verfügbar"
BEL_no_secretaries_general_tt:	"§YGeneralsekretäre§! werden als §YBerufliches Recht§! in Belgien entfernt"
BEL_remove_secretaries_general_civs_tt:	"Entferne 2 §YZivilfabriken (ausserhalbe der Karte)§!"
ww_BEL_event_war.7.t:	"Möglicher begrenzter Krieg - Paris muss fallen!"
ww_BEL_event_war.7.desc:	"Unsere Spitzendiplomaten und Generäle haben sich kürzlich getroffen und uns geraten, dass wir [FRA.GetName] an den Verhandlungstisch bringen und ein schnelles Friedensabkommen erzielen könnten, wenn dieser Konflikt in seinem Umfang begrenzt bleibt, d.h. wenn sich keine anderen Großmächte einmischen würden. Wir wissen, dass sie Angst vor steigenden Spannungen haben und genau wie wir nicht in einen weiteren globalen Konflikt hineingezogen werden wollen. \n\nSo ist es unser Kalkül, dass, sollte Paris fallen, dies eine ausreichende Demonstration unserer Fähigkeiten wäre, damit sie bereit sein könnten, über die Übergabe des umstrittenen Calais zu verhandeln."
ww_BEL_event_war.7.a:	"Unsere Truppen werden schon bald durch die Straßen von Paris marschieren!"
ww_BEL_event_war.8.t:	"Paris ist gefallen!"
ww_BEL_event_war.8.desc:	"In einer nationalen Katastrophe ist unsere stolze Hauptstadt Paris gefallen! Wieder einmal hat sich gezeigt, dass unsere Streitkräfte angesichts eines eindeutig unterlegenen Feindes unzureichend sind. Die [FROM.GetAdjective]s haben angeboten, ihre Truppen zurückzuziehen und den Rest des Landes zu verschonen, aber im Gegenzug verlangen sie, dass wir ihnen Calais ausliefern. \n\n Wir spüren bereits, wie die Geier kreisen, und das wird uns Zeit geben, die Lehren zu ziehen, die wir gezogen haben, und uns auf größere potenzielle Feinde in der Zukunft vorzubereiten."
ww_BEL_event_war.8.a:	"Bieten Sie Calais für den Frieden an."
ww_BEL_event_war.8.b:	"Kämpfen Sie weiter! Dieser Krieg ist noch nicht vorbei."
ww_BEL_event_war.9.t:	"Frankreich stimmt dem Frieden zu"
ww_BEL_event_war.9.desc:	"Heute haben wir eine französische Delegation empfangen, die gekommen ist, um über eine friedliche Lösung des aktuellen Konflikts nach dem Fall ihrer Hauptstadt zu verhandeln. Nach mehreren Beratungen haben sie sich darauf geeinigt, uns Calais im Austausch für eine sofortige Einstellung der Feindseligkeiten anzubieten. \n\n Es sei darauf hingewiesen, dass es sich um ein einmaliges Angebot handelt. Sollten wir es ablehnen, werden sie ihre Verteidigung noch entschlossener vorantreiben und es ist unwahrscheinlich, dass sie es noch einmal anbieten werden."
ww_BEL_event_war.9.a:	"Wir nehmen an! Calais für den Frieden."
ww_BEL_event_war.9.b:	"Kämpfen Sie weiter! Wir können mehr einnehmen."
ww_BEL_event_war.10.t:	"Paris unter [ROOT.GetAdjective] Kontrolle"
ww_BEL_event_war.10.desc:	"Die Ziele, die wir uns in den Diskussionen in den ersten Tagen unseres Krieges gegen die [FRA.GetAdjective] gesetzt haben, sind erreicht worden. Paris liegt unter unserer Kontrolle und als solches könnte man annehmen, dass die [FRA.GetAdjective] jetzt so gestresst sind, dass ein Angebot, unsere Truppen zurückzuziehen, wenn sie uns im Gegenzug Calais überlassen, auf zögerliche Zustimmung stoßen könnte.\n\nZur gleichen Zeit werden Stimmen laut, wir sind so weit gekommen und die [FRA.GetAdjective] sind offensichtlich nicht in der Lage, uns aufzuhalten. Warum jetzt aufhören?"
ww_BEL_event_war.10.a:	"Wir haben bekommen, wofür wir gekommen sind, wir klagen auf Frieden!"
ww_BEL_event_war.10.b:	"Wir wollen alles!"
ww_BEL_event_spanish_interaction.1.t:	"[FROM.GetNameDefCap] schickt Ausrüstung"
ww_BEL_event_spanish_interaction.1.desc:	"Wir haben eine Lieferung von Gewehren von der [FROM.GetAdjective] Regierung erhalten. Sie teilen unsere Ansicht, dass die Nationalisten gestoppt werden müssen, und wollen unseren Kampf nicht nur mit Worten unterstützen."
ww_BEL_event_spanish_interaction.1.a:	"Wir werden sie gut gebrauchen können!"
ww_BEL_event_spanish_interaction.2.t:	"Weitere Ausrüstungslieferungen an [SPR.GetAdjective] Republikaner"
ww_BEL_event_spanish_interaction.2.desc:	"Unsere letzte Lieferung an die [SPR.GetAdjective] hat sich für unsere republikanischen Freunde als sehr nützlich erwiesen. Ihr Kampf ist jedoch noch lange nicht vorbei und wir sollten ihnen weitere Ausrüstungsgegenstände anbieten können."
ww_BEL_event_spanish_interaction.2.a:	"Schicken Sie mehr Gewehre!"
ww_BEL_event_spanish_interaction.2.b:	"Sie könnten etwas Unterstützungsausrüstung gebrauchen!"
ww_BEL_event_spanish_interaction.2.c:	"Schicken Sie ihnen Artillerie!"
ww_BEL_event_spanish_interaction.3.t:	"[FROM.GetNameDefCap] Schickt mehr Ausrüstung"
ww_BEL_event_spanish_interaction.3.desc:	"Wir haben eine weitere Lieferung von [FROM.GetAdjective] Ausrüstung erhalten. Ihre Unterstützung wird uns im Kampf gegen die nationalistische Geißel, die unsere Heimatländer heimsucht, sehr hilfreich sein."
ww_BEL_event_spanish_interaction.3.a:	"Großartig!"
ww_BEL_event_spanish_interaction.4.t:	"[FROM.GetAdjective] Rede zur Unterstützung unseres Kampfes"
ww_BEL_event_spanish_interaction.4.desc:	"Wir wurden darüber informiert, dass vor einigen Stunden in [FROM.GetNameDef] eine Kundgebung und eine Rede zu unserer Unterstützung stattgefunden hat. Die [FROM.GetAdjective]-Führung hat erneut ihre Unterstützung für uns bekräftigt, in der Hoffnung, dass wir dadurch mehr Handlungsspielraum erhalten, da unser Volk mehr Vertrauen in uns gewinnt."
ww_BEL_event_spanish_interaction.4.a:	"Schicken Sie unseren Dank an die [FROM.GetAdjective]s!"
ww_BEL_event_spanish_interaction.5.t:	"Förderung der [FROM.GetAdjective] Auswanderung"
ww_BEL_event_spanish_interaction.5.desc:	"In letzter Zeit haben wir eine Zunahme der Einwanderung von [FROM.GetAdjective] Bürgern erlebt. Viele dieser Einwanderer erklären sich bereit, unseren Streitkräften beizutreten, falls wir ihre Hilfe benötigen sollten. Man kann nur vermuten, dass dies eine bewusste Anstrengung der [FROM.GetAdjective]s ist."
ww_BEL_event_spanish_interaction.5.a:	"Tolle Neuigkeiten!"
ww_BEL_event_spanish_interaction.6.t:	"[FROM.GetNameDefCap] Schlägt Bündnis vor"
ww_BEL_event_spanish_interaction.6.desc:	"Die bisher so neutralen [FROM.GetAdjective]s haben uns einen überraschenden Vorschlag unterbreitet. Sie möchten ein Bündnis mit uns eingehen. Sie hoffen, dass sie uns dadurch in unserem Kampf gegen die Nationalisten besser unterstützen können."
ww_BEL_event_spanish_interaction.6.a:	"Eine großartige Idee!"
ww_BEL_event_spanish_interaction.6.b:	"Wir wissen ihre Unterstützung zu schätzen, aber nein."
ww_BEL_event_spanish_interaction.7.t:	"[FROM.GetNameDef] schließt sich den [ROOT.GetFactionName] an"
ww_BEL_event_spanish_interaction.7.desc:	"Die [FROM.GetAdjective] haben unseren Vorschlag, die [ROOT.GetFactionName] zu bilden, bejaht. Wir werden gemeinsam gegen die nationalistische Bedrohung antreten!"
ww_BEL_event_spanish_interaction.7.a:	"Vorwärts!"
ww_BEL_event_spanish_interaction.8.t:	"[FROM.GetNameDefCap] lehnt unseren Vorschlag für ein Bündnis ab"
ww_BEL_event_spanish_interaction.8.desc:	"In Anbetracht der Unterstützung, die wir dem [FROM.GetAdjective] kontinuierlich angeboten haben, hatten wir gehofft, dass unser Vorschlag auf ein positives Echo stoßen würde. Anscheinend war das nicht der Fall, denn sie haben unseren Vorschlag abgelehnt und erklärt, dass unsere Hilfe willkommen ist, sie aber kein Bündnis wünschen."
ww_BEL_event_spanish_interaction.8.a:	"Wie unhöflich!"
ww_BEL_event_spanish_interaction.9.t:	"[FROM.GetNameDefCap] Demontiert $BEL_SPR_alliance$"
ww_BEL_event_spanish_interaction.9.desc:	"Mit dem Ende unseres Bürgerkriegs hat die [FROM.GetAdjective] beschlossen, dass es an der Zeit ist, unsere Partnerschaft zu beenden. Obwohl dies unser Bündnis für den Moment beendet, haben sie sehr deutlich gemacht, dass dies nicht bedeutet, dass wir nie wieder Verbündete sein werden."
ww_BEL_event_spanish_interaction.9.a:	"Wirklich schade"
ww_BEL_event_misc.1.t:	"Der Boss ist tot"
ww_BEL_event_misc.1.desc:	"Émile Vandervelde, Spitzname 'le patron' (der Chef), der langjährige sozialistische Politiker und Premierminister von [BEL.GetName] ist gestorben. Er war bekannt als Mitglied der belgischen Delegation auf der Pariser Friedenskonferenz, die den Ersten Weltkrieg beendete. Er war ein entschiedener Gegner des Faschismus und befürwortete sogar ein direktes Eingreifen in den Spanischen Bürgerkrieg auf Seiten der Republikaner. \n\nHenri de Man hat das Amt des Premierministers übernommen und wird noch heute vom König vereidigt werden."
ww_BEL_event_misc.1.a:	"Sein Nachfolger ist der Mann, der die Arbeit erledigen wird!"
ww_BEL_event_misc.2.t:	"Die Schwarze Insel"
ww_BEL_event_misc.2.desc:	"Hergés jüngste Comicserie, in der der rätselhafte Abenteurer Tintin wegen eines Verbrechens, das er nicht begangen hat, nach Schottland gejagt wird, ist gerade mit großem kommerziellen Erfolg veröffentlicht worden. Angeblich arbeitet der belgische Autor bereits fleißig an der nächsten Folge der Abenteuer von Tim und Struppi."
ww_BEL_event_misc.2.a:	"Wohin werden Tims Abenteuer ihn als nächstes führen?"
ww_BEL_event_misc.3.t:	"Cockerill: Das Herz der belgischen Industrie"
ww_BEL_event_misc.3.desc:	"Cockerill ist das Unternehmen, das im Herzen der belgischen Industrie steht. Im Laufe seines Bestehens hat es sich nicht nur der Herstellung von Eisen und Stahl gewidmet, sondern auch der Herstellung feiner Maschinen wie Dampfmaschinen, Zügen und sogar Schlachtschiffen. Das Unternehmen hat sich einen hervorragenden Ruf erworben und ist zu einem der wichtigsten Akteure in der westeuropäischen Stahlindustrie aufgestiegen. \n\nAdolphe Greiner, der Generaldirektor, und andere Mitglieder der Geschäftsleitung blieben während der Belagerung von Lüttich im Ersten Weltkrieg auf ihren Posten und sorgten dafür, dass die Beschäftigung der Belegschaft so lange wie möglich aufrecht erhalten wurde. Nach der Besetzung weigerte sich das Unternehmen, für die Besatzungstruppen zu produzieren, und wurde daher für den größten Teil seiner schweren Stahlbearbeitungsgeräte ausgeweidet. \n\n Es hat sich in der Zwischenkriegszeit erholt und ist nach wie vor ein führendes Industrieunternehmen."
ww_BEL_event_misc.3.a:	"Sie haben wahrscheinlich den Motor unserer Wirtschaft gebaut!"
ww_congo.1.t:	"Belgien investiert in unsere Entwicklung"
ww_congo.1.desc:	"Das belgische Kolonialamt hat heute einen Gesetzesentwurf verabschiedet, der viel größere Mittel für unsere industrielle Entwicklung vorsieht, und hat mit dem Bau von Industrieanlagen in [295.GetName] begonnen."
ww_congo.1.a:	"Ein großer Segen"
ww_congo.4.t:	"Raoul van Overstraeten kehrt nach Belgien zurück"
ww_congo.4.desc:	"Der belgische Militäroffizier Raoul van Overstraeten, der bis vor kurzem in unserem Land gedient hat, hat mit der Nachricht von unserer neu gewonnenen Unabhängigkeit beschlossen, auf das europäische Festland zurückzukehren. Wir haben keinen Bedarf mehr an Europäern wie ihm, und sein Verlust wird uns sicherlich nur stärker machen."
ww_congo.4.a:	"Hinfort, Imperialist!"
ww_congo.5.t:	"[COG.GetLeader] will die Nahrungsmittelproduktion im Kongo steigern"
ww_congo.5.desc:	"Unser Gouverneur im Kongo, [COG.GetLeader], hat den Wunsch geäußert, die Nahrungsmittelproduktion zu erhöhen, indem er die Bergbauproduktion reduziert, um 'die sozialen Bedingungen der Kolonialbevölkerung zu verbessern'. Das würde der Rentabilität der Kolonie sicherlich vorerst schaden, sie aber auf lange Sicht mit Sicherheit verbessern."
ww_congo.5.a:	"Das würde die Gewinne verringern!"
ww_congo.5.b:	"Wenn er glaubt, dass es das Beste ist..."
CONGO_refused_increased_food_production:	"Unser Oberherr hat unser Programm zur Steigerung der Nahrungsmittelproduktion abgelehnt"
CONGO_accepted_increased_food_production:	"Unser Oberherr hat unser Programm zur Steigerung der Nahrungsmittelproduktion genehmigt."
ww_congo.6.t:	"Die [BEL.GetAdjective]s lehnen unser Nahrungsmittelproduktionsprogramm ab"
ww_congo.6.desc:	"Die Kolonialverwaltung in [BEL.GetNameDef] hat unsere Bitte abgelehnt, die Nahrungsmittelproduktion zu erhöhen, indem sie die Bergbauproduktion reduziert, um 'die sozialen Bedingungen der Kolonialbevölkerung zu verbessern'."
ww_congo.6.a:	"Es war zu erwarten, dass"
ww_congo.7.t:	"Die [BEL.GetAdjective]s genehmigen unser Programm zur Nahrungsmittelproduktion"
ww_congo.7.desc:	"Die Kolonialverwaltung in [BEL.GetNameDef] hat unseren Antrag auf Erhöhung der Nahrungsmittelproduktion durch Reduzierung der Bergbauproduktion mit dem Ziel der 'Verbesserung der sozialen Bedingungen der kolonialen Bevölkerung' genehmigt."
ww_congo.7.a:	"Großartig!"
ww_congo.8.t:	"Das Entstehen einer neuen Mittelschicht"
ww_congo.8.desc:	"Es gibt einen großen, wachsenden Anteil der kongolesischen Bevölkerung, der über gute Französischkenntnisse verfügt, dem Christentum anhängt und über eine gewisse Form der postprimären Bildung verfügt. Die Kolonialverwalter haben begonnen, sie als Évolué, europäisierte Menschen, zu bezeichnen, und auch wenn ihr Aufstieg in unserer Gesellschaft aufgrund der Anforderungen der Kolonialverwaltung noch begrenzt sein wird, wird eine besser ausgebildete Bevölkerung unserem Land eines Tages sicherlich zu Wohlstand verhelfen."
ww_congo.8.a:	"Wir müssen abwarten, wie sich das entwickelt."
evolue_will_start_attempting_to_enter_politics_tt:	"Die Évolué werden versuchen, in die Politik einzusteigen, was dazu führen wird, dass viele neue §YPolitische Berater§! zur Verfügung stehen werden"
evolue_have_entered_politics:	"Verschiedene §YUnabhängigkeitsbefürworter§! und §YKongolesische politische Denker§! werden nun als §YPolitische Berater§! zur Verfügung stehen"
ww_congo.9.t:	"Évolué beginnen, in die [ROOT.GetAdjective] Politik einzutreten"
ww_congo.9.desc:	"Seitdem unsere Mittelschicht wächst und viele Menschen in den Städten eine höhere Schulbildung haben, haben viele [COG.GetAdjective] begonnen, die Werke politischer Theoretiker zu lesen, und viele neue Politiker und Unabhängigkeitsbefürworter beginnen, die Szene zu betreten. Dies ist ein Zeichen für einen neuen Aufbruch für die [COG.GetAdjective] Nation!"
ww_congo.9.a:	"Diese Männer werden unsere Nation sicher in die Unabhängigkeit führen."
ww_congo.10.t:	"[FROM.GetNameDefCap] Forderungen [772.GetName]"
ww_congo.10.d:	"Kongolesische Truppen sind entlang der Grenzen unserer Kolonie in [772.GetName] positioniert, und sie fordern vollständigen Zugang zu unseren Basen und Einrichtungen! Wenn wir ihrer Forderung zustimmen, übergeben wir ihnen die Kontrolle über [772.GetName]. Andererseits haben wir nicht gerade die Mittel, um sie in dieser Angelegenheit zu bekämpfen."
ww_congo.10.a:	"Wir haben keine andere Wahl als zuzustimmen."
ww_congo.10.b:	"Niemals!"
ww_congo.11.t:	"Die Franzosen akzeptieren unsere Forderungen"
ww_congo.11.d:	"Die Franzosen haben unseren Forderungen zugestimmt, und ihre Basen und Einrichtungen in [772.GetName] stehen uns vollständig zur Verfügung. Sie haben uns praktisch die volle Kontrolle über ihre Kolonie übergeben."
ww_congo.11.a:	"Ein kluger Schachzug."
ww_congo.12.t:	"Die Franzosen lehnen unsere Forderungen ab"
ww_congo.12.d:	"Die Franzosen haben unsere Forderungen in unverschämter Weise abgelehnt! Wenn wir [772.GetName] haben wollen, müssen wir es uns wohl mit Gewalt nehmen!"
ww_congo.12.a:	"Dummköpfe!"
ww_congo.13.t:	"[FROM.GetNameDefCap] Fordert unsere Integration"
ww_congo.13.d:	"Die kongolesischen Streitkräfte haben sich entlang unserer Grenze postiert und verlangen die totale Kontrolle über unsere Stützpunkte, Institutionen und Einrichtungen! Wenn wir ihrer Forderung zustimmen, geben wir unsere Unabhängigkeit auf und werden ein Teil ihrer Nation. Andererseits haben wir nicht gerade die Mittel, sie in dieser Angelegenheit zu bekämpfen."
ww_congo.13.a:	"Wir werden gemeinsam stärker werden!"
ww_congo.13.b:	"Niemals!"
ww_congo.14.t:	"[FROM.GetNameDefCap] Akzeptieren Sie unsere Forderungen"
ww_congo.14.d:	"[FROM.GetNameDefCap] haben unseren Forderungen zugestimmt, und ihre Nation wird in den nächsten Tagen aufhören, als unabhängige Einheit zu existieren. Damit haben sie uns die volle Kontrolle über ihr Land übergeben."
ww_congo.14.a:	"Ein kluger Schachzug."
ww_congo.15.t:	"[FROM.GetNameDefCap] Lehnen unsere Forderungen ab"
ww_congo.15.d:	"[FROM.GetNameDefCap] haben unsere Forderungen in unverschämter Weise abgelehnt! Es scheint, dass wir uns [772.GetName] mit Gewalt nehmen müssen, wenn wir sie haben wollen!"
ww_congo.15.a:	"Dummköpfe!"
ww_congo.16.t:	"Latein-Afrika geeint"
ww_congo.16.d:	"Als Reaktion auf die zunehmenden globalen Spannungen und dank der jüngsten siegreichen Heldentaten von [FROM.GetLeader] wurde die Vereinigung der romanischsprachigen Länder Zentralafrikas erreicht. Jetzt erklären sie sich selbst zur neuen Weltmacht und versprechen, das [FROM.GetAdjective] Volk um jeden Preis zu schützen."
ww_congo.16.a:	"Sie sind zum Scheitern verurteilt."
ww_congo.16.b:	"Lang lebe [ROOT.GetNameDef]!"
ww_congo.17.t:	"Kongolesische Unabhängigkeit erlangt"
ww_congo.17.d:	"Nach der Genehmigung durch die [BEL.GetAdjective] Behörden des Staates hielt der neue [COG.GetAdjective] Premierminister Patrice Lumumba eine kurze Rede, um die neu gewonnene Unabhängigkeit seines Landes zu feiern. Darin kritisierte er unverblümt den Kolonialismus und die so genannte [BEL.GetAdjective] zivilisierende Mission. Obwohl dies innerhalb der Nation positiv aufgenommen wurde, haben viele außerhalb des Landes es als persönlichen Angriff gegen den [BEL.GetAdjective] Staatschef interpretiert. Die Ära der Entkolonialisierung hat gerade erst begonnen!"
ww_congo.17.a:	"Das Gleichgewicht der Kräfte in Afrika hat sich verschoben"
ww_congo.17.b:	"Es ist an der Zeit zu beweisen, dass wir zwei gleichberechtigte und unabhängige Länder sind"
ww_congo.17.c:	"Vielleicht war es das Beste..."
ww_congo.18.t:	"Kongolesischer Aufstand niedergeschlagen"
ww_congo.18.d:	"Vor kurzem hat die freie kongolesische Regierung in Stanleyville versucht, sich vom belgischen Kolonialreich abzuspalten. Obwohl sie große Unterstützung in der Nation hatte, wurde ihre Rebellion von belgischen Truppen und ausländischen Söldnern schnell niedergeschlagen."
ww_congo.18.a:	"Das Zeitalter des Imperialismus ist noch nicht zu Ende"
ww_congo.18.b:	"Die Verräter bekamen, was sie verdienten"
ww_congo.18.c:	"Einigkeit macht stark"
ww_congo.19.t:	"Erfolgreicher kongolesischer Aufstand"
ww_congo.19.d:	"Vor kurzem hat die freie kongolesische Regierung in Stanleyville einen Unabhängigkeitskrieg gegen das belgische Kolonialreich begonnen. Obwohl es einige Zeit dauerte, gelang es der Rebellion schließlich, die im Gebiet stationierten Kolonialtruppen zu überrennen und die wichtigsten Städte im Kongo zu erobern. Jetzt haben sie offiziell ihre Unabhängigkeit erklärt und ein Friedensabkommen zwischen ihnen und ihren ehemaligen Unterdrückern angestrebt."
ww_congo.19.a:	"Das Zeitalter des Imperialismus ist zu Ende"
ww_congo.19.b:	"Wir sind siegreich!"
ww_congo.19.c:	"Ein vernichtender Schlag..."
ww_congo.20.t:	"Die ruandische Revolution"
ww_congo.20.d:	"Da unsere Regierung das Ruanda-Urundi-Mandat nur sehr locker in der Hand hat und sich nationalistische Gefühle in der gesamten Region ausbreiten, hat Mwami Mutara III Rudahigwa, König von Ruanda, die Nation zu einem unabhängigen Staat erklärt und damit die Verbindungen zu unserer Zentralregierung gekappt. Sollten wir intervenieren?"
ww_congo.20.a:	"Es ist nicht unsere Aufgabe, sie aufzuhalten."
ww_congo.20.b:	"Wer hat gesagt, dass sie unabhängig sein können?"
ww_congo.21.t:	"Mwambutsa's Erklärung"
ww_congo.21.d:	"Da unsere Regierung das Ruanda-Urundi-Mandat nur sehr locker im Griff hat und sich nationalistische Gefühle in der gesamten Region ausbreiten, hat Mwami Mwambutsa IV, König von Burundi, die Nation zu einem unabhängigen Staat erklärt und damit die Verbindungen zu unserer Zentralregierung gekappt. Sollten wir intervenieren?"
ww_congo.21.a:	"Es ist nicht unsere Aufgabe, sie aufzuhalten."
ww_congo.21.b:	"Wer hat gesagt, dass sie unabhängig sein können?"
threatened_us_opinion_modifier:	"Sie haben uns gedroht!"
attempted_diplomacy_opinion_modifier:	"Sie haben versucht, sich uns diplomatisch zu nähern"
BEL_commonwealth_faction:	"Das belgische Commonwealth"
ww_congo.22.t:	"[COG.GetLeader] Fordert verstärkte Auswanderung in den Kongo"
ww_congo.22.desc:	"Unser Gouverneur im Kongo, [COG.GetLeader], hat seinen Wunsch nach verstärkter [ROOT.GetAdjective] Einwanderung in die Region geäußert, in dem Bemühen, Menschen mit Wissen und Geld in die Region zu bringen. Das reiche und warme Land von Katanga würde viele Menschen mit Abenteuerlust oder Pflichtbewusstsein anlocken, und wenn wir dies fördern, wird es sicher viele weitere Menschen dazu bewegen, dorthin zu ziehen."
ww_congo.22.a:	"Wir werden uns bemühen"
ww_congo.22.b:	"Was glaubt er, wer er ist?"
ww_congo.23.t:	"Die [FROM.GetAdjective]s billigen unser Einwanderungsprogramm"
ww_congo.23.desc:	"Die Kolonialverwaltung in [FROM.GetNameDef] hat unserem Antrag auf verstärkte Förderung der [FROM.GetAdjective] Auswanderung in unseren Staat zugestimmt. Eine neue Welle von Menschen, die bereit sind, beim Aufbau unseres Staates mitzuhelfen, wird mit Sicherheit eintreffen."
ww_congo.23.a:	"Perfekt"
ww_congo.24.t:	"Die [FROM.GetAdjective] lehnen unser Einwanderungsprogramm ab"
ww_congo.24.desc:	"Die Kolonialverwaltung in [FROM.GetNameDef] hat unseren Antrag auf verstärkte Förderung der [FROM.GetAdjective] Auswanderung in unseren Staat abgelehnt. Es ist wirklich eine Schande, aber wir können nicht viel tun, um sie umzustimmen."
ww_congo.24.a:	"Ich meine, was haben wir denn erwartet?"
ww_congo.25.t:	"Albert de Vleeshauwer geht ins Ausland, um für Unterstützung zu werben"
ww_congo.25.desc:	"Der belgische Minister für die Kolonien Albert de Vleeshauwer, ein enger Verbündeter von Pierre Ryckmans, hat beschlossen, sich ins Ausland zu begeben, um bei unseren neu gewonnenen Verbündeten um Unterstützung zu werben, denn die Lage scheint ernst zu sein und die Politiker auf dem Festland weigern sich zu handeln. Vielleicht können wir dank seiner Hilfe ein paar vorteilhafte Deals abschließen?"
ww_congo.25.a:	"Hier beginnt der Krieg wirklich"
ww_congo.26.t:	"[FROM.GetNameDefCap] okkupiert [796.GetName]!"
ww_congo.26.desc:	"\nAnfang dieser Woche sind Truppen von [COG.GetNameDef] in unser Territorium [796.GetName] eingedrungen und haben behauptet, sie seien auf einer Mission, um die Region vor einer möglichen Besetzung durch ihre Feinde zu schützen. Dies ist eindeutig ein kriegerischer Akt, den wir aber wahrscheinlich einfach ignorieren können, da sie wahrscheinlich keinen Kampf mit uns austragen, sondern vielmehr die Wiedervereinigung des Kongobeckens anstreben."
ww_congo.26.a:	"Es ist es nicht wert, darum zu kämpfen"
ww_congo.26.b:	"Für wen halten sie sich eigentlich?"
ww_congo.27.t:	"Eine Meuterei in Luluabourg"
ww_congo.27.desc:	"Anfang dieser Woche haben kongolesische Unteroffiziere unter der Führung von Oberstabsfeldwebel Ngoie Mukalabushi in Luluabourg in der Provinz Kasaï gemeutert. Einer der Hauptauslöser scheint ihre Behandlung durch unsere belgischen Offiziere gewesen zu sein. Die Meuterer brachen am Morgen in die Waffenkammer des Stützpunkts ein und plünderten das weiße Viertel der Stadt. Sie griffen auch sichtbare Zeichen der Kolonialbehörden an und verkündeten ihren Wunsch nach Unabhängigkeit. Anschließend zogen sie in ihre Heimatdörfer und plünderten unterwegs, aber es scheint ihnen nicht gelungen zu sein, den Aufstand auf die benachbarten Garnisonen auszuweiten. Wie sollten wir mit dieser Situation umgehen?"
ww_congo.27.a:	"Nehmen Sie sie gefangen und statuieren Sie an Mukalabushi ein Exempel."
ww_congo.27.b:	"Das ist ein Zeichen dafür, dass ein großer Wandel notwendig ist"
COG_pro_independence_reforms_in_the_force_publique_structure:	"Unabhängigkeitsfördernde Reformen in der Force Publique"
ww_congo.28.t:	"Wachsendes Misstrauen gegenüber dem Nationalen Komitee"
ww_congo.28.desc:	"Da das neu gegründete Nationale Komitee für die Befreiung eine eher ablehnende Haltung gegenüber der Kolonialregierung eingenommen hat, machen sich viele Menschen auf dem Lande Sorgen darüber, dass das Komitee nicht versuchen könnte, einen friedlichen Weg in die Unabhängigkeit einzuschlagen. Außerdem sind in der Region Katanga Sezessionsgeräusche zu hören, und es könnte sein, dass der Staat versucht, die Unabhängigkeit zu erklären, wenn unser Befreiungskrieg beginnt..."
ww_congo.28.a:	"Sie werden überzeugt werden müssen oder mit Gewalt befreit werden."
COG_coquilatville_and_lusambo_will_join_the_belgian_loyalsits_tt:	"§Y[538.GetName]§! und §Y[888.GetName]§! werden sich den §YPro-Belgian Loyalists§! anschließen, wenn der Krieg für die Unabhängigkeit beginnt"
ww_congo.29.t:	"Kongolesische Nationalisten bitten uns um Hilfe"
ww_congo.29.desc:	"Kongolesische Nationalisten, die sich selbst als Nationales Komitee für die Befreiung bezeichnen, bereiten einen Unabhängigkeitskrieg gegen ihren Oberherrn vor. Sie versprechen uns, dass sie sich uns annähern werden, sobald der Krieg gewonnen ist, vorausgesetzt wir schicken ihnen Waffen, wenn die Kämpfe beginnen, und behaupten, dass ein geschwächtes [BEL.GetName] in unserem Interesse liegt."
ww_congo.29.a:	"Mit allen Mitteln"
ww_congo.29.b:	"Es gibt keinen Grund zu intervenieren"
ww_congo.30.t:	"[FROM.GetNameDefCap] beschließt, uns zu helfen"
ww_congo.30.desc:	"Unsere Diplomaten sind von ihren Gesprächen mit dem [FROM.GetAdjective] Militärstab zurückgekehrt und haben angeblich eine Vereinbarung getroffen, wonach sie uns Männer und Ausrüstung schicken werden, wenn wir uns entschließen, unseren Unterdrückern den Krieg zu erklären. Heute ist ein guter Tag für die Menschen im Kongo!"
ww_congo.30.a:	"Perfekt"
ww_congo.31.t:	"[FROM.GetNameDefCap] Beschließt, uns nicht zu helfen"
ww_congo.31.desc:	"Unsere Diplomaten sind von ihren Gesprächen mit dem [FROM.GetAdjective] Militärstab mit leeren Händen zurückgekehrt. Es scheint, als ob keine Einigung erzielt werden konnte und unsere angeblichen Verbündeten uns verraten haben..."
ww_congo.31.a:	"Eine echte Schande"
ww_congo.32.t:	"Der Simba-Staatsstreich"
ww_congo.32.desc:	"Die Simba-Bewegung hat in letzter Zeit viel Unterstützung im Land erhalten. Jetzt ist sie in den Nationalkongress eingetreten und fordert einen Wechsel an der Spitze. Unseren Politikern bleibt nicht viel anderes übrig, als die Situation zu akzeptieren. Die Frage ist jedoch, wer soll unseren Staat jetzt führen?"
ww_congo.32.a:	"Cyrille Adoula ist ein guter Staatsmann"
ww_congo.32.b:	"Christophe Gbenye sollte führen"
ww_congo.33.t:	"Die Frage der Führung"
ww_congo.33.desc:	"Die Führung unseres Staates ist in letzter Zeit in Frage gestellt worden, was auf die Verbindungen von Cyrille Adoula zu Amerikanern und belgischen Gewerkschaften zurückzuführen ist. Viele sind der Meinung, dass der Führer der Simbas, Christophe Gbenye, den Mantel des neuen Staatspräsidenten übernehmen sollte. Sollten wir uns ihnen beugen?"
ww_congo.33.a:	"Cyrille Adoula ist ein guter Staatsmann, er kann nicht gehen"
ww_congo.33.b:	"Christophe Gbenye sollte die Führung übernehmen"
ww_congo.34.t:	"Der Staatsbesuch von Kwame Nkrumah"
ww_congo.34.desc:	"Der ghanaische panafrikanistische Politiker Kwame Nkrumah ist heute auf offizielle Einladung von [ROOT.GetLeader] in unserer Hauptstadt eingetroffen. Als begeisterter Sozialist glauben viele, dass eine Zusammenarbeit mit ihm von Vorteil sein könnte, wenn wir die Zukunft Afrikas sichern wollen. Einige fordern sogar, dass er die Führung unserer Nation übernehmen sollte. Was wäre die beste Vorgehensweise?"
ww_congo.34.a:	"Wir glauben, dass eine gute Zusammenarbeit erreicht werden kann"
ww_congo.34.b:	"Er ist der Führer, den wir brauchen!"
ww_congo.35.t:	"[COG.GetNameDefCap] regt kolonialen Widerstand an"
ww_congo.35.desc:	"\nDie [COG.GetAdjective] Regierung hat Berichten zufolge damit begonnen, Waffen an Widerstandsgruppen in Afrika zu liefern und beherbergt und trainiert Dissidenten und Milizen für ihren Versuch, ihre von uns besetzten Staaten zu befreien. Wir müssen in Zukunft in der Region wachsam sein..."
ww_congo.35.a:	"Wir müssen dem sofort ein Ende setzen!"
ww_congo.35.b:	"Die Zeit für Afrika ist gekommen"
ww_congo.36.t:	"[FROM.GetName] lehnt Friedensvorschlag ab"
ww_congo.36.desc:	"Die Botschafter von [FROM.GetNameDef] haben unseren Friedensvorschlag abgelehnt. Sie argumentieren, dass unser Angriff gegen sie völlig ungerechtfertigt war und sie daher nichts anderes als eine bedingungslose Kapitulation von uns akzeptieren werden, da sie eine Bedrohung für den regionalen Frieden darstellen."
ww_congo.36.a:	"Wie heuchlerisch, ihre imperiale Gewalt kann nur mit Gewalt gestoppt werden."
ww_congo.37.t:	"[FROM.GetNameDefCap] Bietet Frieden für [?COG.COG_disputed_colony.GetAdjective] Unabhängigkeit"
ww_congo.37.desc:	"[FROM.GetAdjective] Diplomaten haben sich mit einem Friedensangebot an uns gewandt. Das Angebot hängt davon ab, ob wir bereit sind, auf die Ansprüche auf das [?COG.COG_disputed_colony.GetAdjective] Territorium zu verzichten, das wir in diesem Konflikt an [FROM.GetNameDef] verloren haben. Die Diplomaten erklären auch, dass in den abgetretenen [?COG.COG_disputed_colony.GetAdjective] Gebieten Wahlen stattfinden werden, um eine neue Regierung zu wählen. Wie unabhängig diese Wahlen sein werden, ist noch nicht klar."
ww_congo.37.a:	"Wir werden unser Territorium nicht aufgeben."
ww_congo.37.b:	"Wir haben keine andere Wahl als zuzustimmen."
ww_congo.38.t:	"[FROM.GetName] stimmt dem Friedensangebot zu"
ww_congo.38.desc:	"Diplomaten aus [FROM.GetNameDef] haben uns informiert, dass ihre Regierung bereit ist, auf die Ansprüche auf [?COG.COG_disputed_colony.GetAdjective] Territorium zu verzichten, das wir befreit haben. Sie ziehen nun ihre Streitkräfte auf die neu errichteten Grenzen in der Region zurück."
ww_congo.38.a:	"Ein heldenhafter Sieg gegen den Imperialismus!"
ww_congo.39.t:	"Die erste kongolesische Wahl"
ww_congo.39.desc:	"Die erste freie Wahl ist abgeschlossen und Joseph Kasa-Vubu hat sie gewonnen. Jetzt arbeitet er hart daran, das erste kongolesische Ministerkabinett zusammenzustellen. Da er im ganzen Land sehr beliebt ist und seine Arbeit hervorragend macht, wird er sicher noch vielen Generationen als großer Präsident in Erinnerung bleiben."
ww_congo.39.a:	"Kasa-Vubu ist ein guter Staatsmann, wir brauchen ihn"
ww_congo.40.t:	"Das erste Kabinett von Kasa-Vubu"
ww_congo.40.desc:	"Unser Präsident [ROOT.GetLeader] ist dabei, sein erstes offizielles Kabinett zusammenzustellen, nachdem er bei den letzten Wahlen einen Sieg errungen hat. Da er im ganzen Land sehr populär ist, wird er sicher über Generationen hinweg als Gründervater unseres modernen Staates bekannt werden!"
ww_congo.40.a:	"Kasa-Vubu ist wirklich der richtige Mann für diese Aufgabe."
ww_congo.41.t:	"[FROM.GetLeader] Fordert die Wiedervereinigung des Bakongo-Volkes"
ww_congo.41.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef] und der Allianz der Bakongo, hat sich an uns gewandt und verlangt, dass wir alle mehrheitlichen Bakongo-Gebiete an sie abtreten. Wie sollen wir darauf reagieren?"
ww_congo.41.a:	"Es ist für das Allgemeinwohl"
ww_congo.41.b:	"Auf keinen Fall!"
ww_congo.42.t:	"[FROM.GetLeader] Übergeben Sie Bakongo-Territorien"
ww_congo.42.desc:	"\n [FROM.GetLeader], Anführer von [FROM.GetNameDef], hat sich bereit erklärt, alle Gebiete mit einer großen Anzahl von Bakongo zu übergeben und wünscht uns für die Zukunft alles Gute. Heute ist ein großer Tag für die kongolesische Nation."
ww_congo.42.a:	"Ausgezeichnet!"
ww_congo.43.t:	"[FROM.GetLeader] Gibt Bakongo-Territorien nicht aus der Hand"
ww_congo.43.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat unsere Forderungen nach Übergabe aller Gebiete mit einem großen Anteil an Bakongo-Völkern abgelehnt. Wie sollten wir auf die Unterdrückung unseres Volkes durch ausländische Mächte reagieren?"
ww_congo.43.a:	"Es gibt nicht viel, was wir tun können"
ww_congo.43.b:	"Wir werden es ihnen zeigen!"
ww_congo.44.t:	"Das Haus von Água Rosada"
ww_congo.44.desc:	"Der Rat hat beschlossen, dass der legitimste Herrscher des Kongo Dom Pedro VII. ist, der derzeitige Thronanwärter des kürzlich aufgelösten Königreichs Kongo, das einst in unseren westlichen Provinzen sowie im heutigen Cabinda und Angola lag. Sicherlich könnte er für Stabilität sorgen und die Einigung des Bakongo-Volkes erreichen?"
ww_congo.44.a:	"Er ist der legitimste Kandidat, den wir bekommen könnten!"
ww_congo.44.b:	"Nein, wir brauchen jemand anderen!"
ww_congo.45.t:	"Der Nyim von Bakuba"
ww_congo.45.desc:	"Der Rat hat beschlossen, dass der nächste legitime Herrscher des Kongo Mbóp Mábíínc maMbéky wäre, der König des Königreichs Kuba, einem kleinen Reich in unseren zentralen Provinzen. Sicherlich könnte er für Stabilität sorgen und erreichen, was nur wenige andere schaffen?"
ww_congo.45.a:	"Er ist derjenige, der uns zu Größe führen wird!"
ww_congo.45.b:	"Nein, wir brauchen jemand anderen!"
ww_congo.46.t:	"Der Mâ Loango"
ww_congo.46.desc:	"Der Rat hat beschlossen, dass der nächste legitime Herrscher des Kongo Moe Poaty III. sein soll, der Mâ Loango des Königreichs Loango, eines Staates, der in und um unsere westlichsten Provinzen existiert, hauptsächlich im heutigen Mittelkongo. Sicherlich könnte er für Stabilität sorgen und die Vereinigung mit den westlichen kongolesischen Provinzen erreichen?"
ww_congo.46.a:	"Er kann uns einen legitimen Anspruch auf den Mittelkongo gewähren!"
ww_congo.46.b:	"Nein, wir brauchen jemand anderen!"
ww_congo.47.t:	"Haus Ntwero von Burundi"
ww_congo.47.desc:	"Der Rat hat beschlossen, dass Mwambutsa IV, der Mwami des Königreichs Burundi, ein Königreich im Osten, ein weiterer möglicher Herrscher des Kongo sein könnte. Sicherlich könnte er für Stabilität sorgen und die Vereinigung mit dem burundischen Staat erreichen?"
ww_congo.47.a:	"Er kann uns zumindest einen legitimen Anspruch auf Burundi einräumen..."
ww_congo.47.b:	"Nein, wir brauchen jemand anderen!"
ww_congo.48.t:	"Clan Abanyiginya von Ruanda"
ww_congo.48.desc:	"Der Rat hat beschlossen, dass ein weiterer möglicher Herrscher des Kongo Mutara III Rudahigwa wäre, der Umwami des Königreichs Ruanda, eines Königreichs im Osten. Sicherlich könnte er für Stabilität sorgen und die Vereinigung mit dem ruandischen Staat erreichen?"
ww_congo.48.a:	"Er kann uns zumindest einen legitimen Anspruch auf Ruanda einräumen..."
ww_congo.48.b:	"Nein, wir brauchen jemand anderen!"
ww_congo.49.t:	"Der deutsche Kollaborateur"
ww_congo.49.desc:	"Der Rat hat beschlossen, dass Yuhi V Musinga, der Umwami des Königreichs Ruanda im Osten des Landes, der nach dem Ersten Weltkrieg von den belgischen Gouverneuren wegen seiner Kollaboration mit dem deutschen Kolonialreich und seiner Verehrung für dieses entmachtet wurde, der letzte mögliche Herrscher des Kongo sein könnte, da es keine anderen Optionen mehr gibt. Er mag eine riskante Wette sein, aber zumindest hat er große Ambitionen..."
ww_congo.49.a:	"Er wird es tun müssen..."
ww_congo.49.b:	"Das hat sich nicht so entwickelt, wie wir es geplant hatten..."
ww_congo.50.t:	"[FROM.GetNameDefCap] Versucht, eine Allianz zu gründen"
ww_congo.50.desc:	"\n[FROM.GetNameDefCap] hat sich an uns gewandt und uns gebeten, eine gemeinsame Allianz zu gründen. Sie haben mit einer Militarisierung begonnen und möchten zusammenarbeiten, um uns beide stärker zu machen. In der Vergangenheit waren unsere Beziehungen bestenfalls steinig, aber kein Zeitpunkt ist besser als der jetzige, um sich zu versöhnen."
ww_congo.50.a:	"Wir würden uns freuen"
ww_congo.50.b:	"Wir haben keinen Bedarf an ihnen."
ww_congo.51.t:	"\n[FROM.GetNameDefCap] Vereinbart die Gründung einer Allianz"
ww_congo.51.desc:	"\n[FROM.GetNameDefCap] hat unsere Bitte um ein Bündnis mit ihnen mit Begeisterung erwidert und alle notwendigen Papiere unterzeichnet, um es offiziell zu machen. Wir werden nicht länger allein gegen unsere Bedroher kämpfen!"
ww_congo.51.a:	"Gemeinsam sind wir stärker!"
ww_congo.52.t:	"[FROM.GetNameDefCap] lehnt unser Angebot, eine Allianz zu gründen, ab"
ww_congo.52.desc:	"\nUnser Angebot, eine Allianz zu gründen, wurde von [FROM.GetLeader] kühl zurückgewiesen. Wir haben versucht, unsere Nützlichkeit zu argumentieren, aber leider hat sich [FROM.GetNameDef] entschieden. Das ist zwar sehr ärgerlich, aber wir lassen uns davon nicht entmutigen, sondern suchen nach anderen Lösungen."
ww_congo.52.a:	"Wir werden ihnen zeigen"
ww_congo.53.t:	"[FROM.GetLeader] Fordert die Wiedervereinigung des burundischen Volkes"
ww_congo.53.desc:	"\n [FROM.GetLeader], Anführer von [FROM.GetNameDef] und des burundischen Volkes, hat sich an uns gewandt und verlangt, dass wir alle mehrheitlich burundischen Gebiete an sie abtreten. Wie sollen wir darauf reagieren?"
ww_congo.53.a:	"Es ist für das Allgemeinwohl"
ww_congo.53.b:	"Auf keinen Fall!"
ww_congo.54.t:	"[FROM.GetLeader] Übergibt burundische Territorien"
ww_congo.54.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat sich bereit erklärt, alle Gebiete mit einer großen Anzahl von Burundern abzutreten und wünscht uns das Beste für die Zukunft. Heute ist ein großer Tag für die kongolesische Nation."
ww_congo.54.a:	"Ausgezeichnet!"
ww_congo.55.t:	"[FROM.GetLeader] Gibt burundische Territorien nicht aus der Hand"
ww_congo.55.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat unsere Forderungen nach Übergabe aller Gebiete mit einer großen Anzahl burundischer Menschen abgelehnt. Wie sollten wir auf die Unterdrückung unseres Volkes durch ausländische Mächte reagieren?"
ww_congo.55.a:	"Es gibt nicht viel, was wir tun können"
ww_congo.55.b:	"Wir werden es ihnen zeigen!"
ww_congo.56.t:	"[FROM.GetLeader] Fordert die Wiedervereinigung des ruandischen Volkes"
ww_congo.56.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef] und des ruandischen Volkes, hat sich an uns gewandt und verlangt, dass wir alle mehrheitlich ruandischen Gebiete an sie abtreten. Wie sollen wir darauf reagieren?"
ww_congo.56.a:	"Es ist für das Allgemeinwohl"
ww_congo.56.b:	"Auf keinen Fall!"
ww_congo.57.t:	"[FROM.GetLeader] Übergibt ruandische Territorien"
ww_congo.57.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat sich bereit erklärt, alle Gebiete mit einer großen Anzahl von Ruandern abzutreten und wünscht uns das Beste für die Zukunft. Heute ist ein großer Tag für die kongolesische Nation."
ww_congo.57.a:	"Ausgezeichnet!"
ww_congo.58.t:	"[FROM.GetLeader] Gibt ruandische Territorien nicht ab"
ww_congo.58.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat unsere Forderungen nach Übergabe aller Gebiete mit einer großen Anzahl ruandischer Bürger abgelehnt. Wie sollten wir auf die Unterdrückung unseres Volkes durch ausländische Mächte reagieren?"
ww_congo.58.a:	"Es gibt nicht viel, was wir tun können"
ww_congo.58.b:	"Wir werden es ihnen zeigen!"
ww_congo.59.t:	"[FROM.GetLeader] Ersuchen, ein Protektorat zu werden"
ww_congo.59.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat sich kürzlich an einen unserer Diplomaten gewandt und uns angefleht, die Oberherrschaft über sein Königreich wiederherzustellen. Er stand einst unter unserem Schutz, als er als König von Ruanda regierte, wurde aber inzwischen von den belgischen Behörden aus dem Amt gejagt. Sollten wir der Bitte des verrückten Königs nachkommen?"
ww_congo.59.a:	"Das ist eine Gelegenheit, die wir nicht verpassen dürfen."
ww_congo.59.b:	"Nein!"
ww_congo.60.t:	"[FROM.GetLeader] Nimmt unsere Bitte an, ihr Protektorat zu werden"
ww_congo.60.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat beschlossen, unsere Bitten anzunehmen und uns zu erlauben, wieder ein Protektorat ihrer Nation zu werden. Wahrlich, das Gleichgewicht in Afrika ist wiederhergestellt!"
ww_congo.60.a:	"Heute ist ein denkwürdiger Tag!"
ww_congo.61.t:	"[FROM.GetLeader] lehnt unseren Antrag ab, ihr Protektorat zu werden"
ww_congo.61.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat beschlossen, unsere Anfrage abzulehnen, da er wenig Wert in unserer Region sieht und behauptet, dass wir ihnen nicht viel bringen könnten, was sie nicht schon haben."
ww_congo.61.a:	"Heute ist ein denkwürdiger Tag..."
ww_congo.62.t:	"Raoul van Overstraeten kehrt nach Belgien zurück"
ww_congo.62.desc:	"Der belgische Militäroffizier Raoul van Overstraeten, der bis vor kurzem in unserem Land gedient hat, ist angesichts des Verlusts seiner Heimat nach [BEL.GetName] zurückgerufen worden. Er hat uns hier gut gedient und wir hoffen, dass er helfen kann, die Invasoren zu vertreiben."
ww_congo.62.a:	"Viel Glück!"
ww_congo.63.t:	"[FROM.GetLeader] Möchte uns Uran verkaufen"
ww_congo.63.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], ist mit einem interessanten Angebot an uns herangetreten. Offenbar sind die Uranvorkommen des Landes reicher als erwartet und es gibt nun Überlegungen, einen Teil des Rohstoffs gegen einen Preis in unser Land zu schmuggeln."
ww_congo.63.a:	"Das ist ein willkommener Segen"
ww_congo.63.b:	"Wir werden uns nicht zur Kriminalität herablassen."
ww_congo.64.t:	"[FROM.GetLeader] Nimmt den Uran-Deal an"
ww_congo.64.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat sich bereit erklärt, den von uns vorgeschlagenen Uran-Deal zu unterzeichnen, und hat uns die von uns geforderten Zahlungen zukommen lassen."
ww_congo.64.a:	"Ausgezeichnet!"
ww_congo.65.t:	"[FROM.GetLeader] lehnt den Uran-Deal ab"
ww_congo.65.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat unsere Bitte, Uran gegen einen Preis in sein Land zu schmuggeln, mit der Begründung abgelehnt, dass er sich nicht auf die Stufe eines internationalen Verbrechers herablassen wird."
ww_congo.65.a:	"Schade..."
ww_congo.66.t:	"[FROM.GetNameDefCap] Sagt den Uran-Deal ab"
ww_congo.66.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat beschlossen, unseren laufenden Uran-Deal zu kündigen, da er als zu kostspielig für die [FROM.GetAdjective] Nation angesehen wird."
ww_congo.66.a:	"Nun, das ist schade..."
ww_congo.67.t:	"[FROM.GetLeader] lädt uns zu einem Uranium Development Trust ein"
ww_congo.67.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], ist mit einem interessanten Angebot an uns herangetreten. Sie möchten, dass wir dem gemeinsamen Uranium Development Trust beitreten und nukleares Material und Forschung miteinander teilen. Dadurch könnten Informationen leichter nach außen dringen, aber für das Uran, das wir so dringend benötigen, könnte es sich durchaus lohnen."
ww_congo.67.a:	"Mit Vergnügen!"
ww_congo.67.b:	"Es ist zu gefährlich"
ww_congo.68.t:	"[FROM.GetLeader] Tritt dem Uranium Development Trust bei"
ww_congo.68.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat zugestimmt, dem Uranium Development Trust beizutreten, den wir ihm vorgeschlagen haben. Damit kann sein Atomprogramm mit dem neu erworbenen Uran endlich wieder in Gang kommen."
ww_congo.68.a:	"Ausgezeichnet!"
ww_congo.69.t:	"[FROM.GetLeader] schießt unsere Idee ab"
ww_congo.69.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], hat unsere Einladung an den Uranium Development Trust abgelehnt und behauptet, dass sie alle Nuklearprogramme unter Verschluss halten müssen, da die Preisgabe von Informationen, die an den Feind durchsickern könnten, viel zu gefährlich sei, um einen solchen Vorschlag überhaupt annehmen zu können."
ww_congo.69.a:	"Schade..."
ww_congo.70.t:	"Jan Zumbach schließt sich der [ENG.GetAdjective] an"
ww_congo.70.desc:	"Unser Pilot Jan Zumbach hat uns verlassen und beschlossen, den Kampf für die RAF aufzunehmen. Die Entscheidung, seine Kameraden zu verlassen, ist ihm nicht leicht gefallen, aber wir müssen ihm dafür applaudieren, dass er weiter für ein unabhängiges Polen, frei von Unterdrückung, kämpfen will."
ww_congo.70.a:	"Einen guten Flug"
ww_congo.71.t:	"Jan Zumbach will in den Kongo gehen"
ww_congo.71.desc:	"Unser Fliegerass Jan Zumbach, der aus Polen hierher gekommen ist, hat erklärt, dass er uns verlassen und in den Kongo gehen möchte, um dort beim Aufbau einer Luftwaffe zu helfen. Sollen wir ihm das erlauben?"
ww_congo.71.a:	"Lassen Sie ihn gehen"
ww_congo.71.b:	"Blockieren Sie seine Ausreise!"
ww_congo.72.t:	"Jan Zumbach kommt an"
ww_congo.72.desc:	"Der polnische Kampfpilot Jan Zumbach ist soeben in unserem Land eingetroffen und hat erklärt, er wolle sich unserer Luftwaffe anschließen und für uns kämpfen. Sicherlich gibt es eine Rolle, die wir ihm zuweisen können?"
ww_congo.72.a:	"Wir werden ihn an die Arbeit schicken."
ww_congo.73.t:	"[FROM.GetNameDefCap] Bietet Frieden für die Unabhängigkeit unserer Kolonie"
ww_congo.73.desc:	"[FROM.GetAdjective] Diplomaten haben sich mit einem Friedensangebot an uns gewandt. Das Angebot hängt davon ab, dass wir auf Ansprüche auf bestimmte afrikanische Besitzungen verzichten und unsere Truppen aus der Region abziehen. Nehmen wir das an?"
ww_congo.73.a:	"Wir werden unser Territorium nicht aufgeben."
ww_congo.73.b:	"Wir haben keine andere Wahl als zuzustimmen."
congo_independence_struggle.1.t:	"Das Flüstern der Unabhängigkeit"
congo_independence_struggle.1.d:	"Seit unser Kontinent unter den Europäern aufgeteilt wurde, sehnen wir uns nach Freiheit und der Möglichkeit, unsere eigene Zukunft zu gestalten. Unsere eigene Vergangenheit als [BEL.GetNameDefCap]-Kolonie war von Ausbeutung und Entmenschlichung geprägt, aber wir wurden immer von unserer eigenen Uneinigkeit und ihrer überlegenen Feuerkraft in Schach gehalten. \n\nAuf den Straßen und in den Dschungeln sind wieder Stimmen zu hören, die von einem Kongo frei von kolonialer Einmischung träumen. Ein Kongo, der frei ist, seine eigenen Gesetze zu erlassen und durchzusetzen, ein Kongo, der frei ist, von seiner eigenen harten Arbeit zu profitieren, ein Kongo, der frei ist, seine eigene Zukunft zu gestalten."
congo_independence_struggle.1.a:	"Wir sollten versuchen, unsere Freiheit durch Diplomatie zu erlangen"
congo_independence_struggle.1.b:	"Wir müssen unsere Unabhängigkeit um jeden Preis erhalten"
congo_independence_struggle.2.t:	"[FROM.GetNameDefCap] hat sich wegen ihrer Unabhängigkeit an uns gewandt"
congo_independence_struggle.2.d:	"Wir wurden soeben von einer Gruppe kontaktiert, die behauptet, die Unabhängigkeitsbewegung unseres kolonialen Untertanen [COG.GetNameDef] zu vertreten. Obwohl die koloniale Verwaltung dort schon seit einiger Zeit von den wachsenden Unabhängigkeitsgefühlen weiß, hat die Kühnheit, dies tatsächlich zu fordern, sie etwas überrascht. Sie warnen uns, dass dieses Ziel einer freien und unabhängigen Nation von vielen Menschen unterstützt wird und dass eine zu harte Reaktion zu Gewalt und möglicherweise sogar zu Krieg führen könnte. \n\n Wir müssen auch unsere globalen Verpflichtungen und unser Prestige berücksichtigen. Daher wäre es das diplomatischste Angebot, ihnen zu erlauben, sich uns als gleichberechtigte Partner in einem [BEL.GetAdjective] Commonwealth anzuschließen. \n\nAlternativ dazu stammt ein beträchtlicher Teil unseres Reichtums aus diesem Territorium und unsere Finanzen würden durch ihren Verlust außerordentlich hart getroffen werden. Wir könnten von ihnen verlangen, dass sie uns für ihre Freiheit bezahlen - zu einem ziemlich hohen Preis. \n\nSchließlich können wir einfach nein sagen und unsere Streitkräfte als Warnung vor einem möglichen Aufstand mobilisieren. "
congo_independence_struggle.2.a:	"Solange sie weiterhin an unserer Seite kämpfen."
congo_independence_struggle.2.b:	"Sehr gut, aber nur, wenn sie uns eine hohe Entschädigung zahlen."
congo_independence_struggle.2.c:	"Wir werden sie niemals freiwillig gehen lassen!"
congo_independence_struggle.3.t:	"[FROM.GetNameDefCap] wird uns die Freiheit gewähren, wenn wir uns ihrer Fraktion anschließen"
congo_independence_struggle.3.d:	"Wir haben eine Nachricht von [BEL.GetName] erhalten, und sie haben erkannt, dass die Zeit der Kolonialreiche schnell zu Ende geht. Sie haben uns daher angeboten, dem [Bel.GetAdjective] Commonwealth als freie und unabhängige Nation und damit als gleichberechtigter Partner beizutreten. Für uns würden die gleichen Bedingungen gelten wie für jeden anderen militärischen Verbündeten, so dass man von uns erwarten würde, dass wir uns an allen Kriegen beteiligen. \n\nDies ist wahrscheinlich das diplomatischste Ergebnis, das wir uns erhoffen können, und es würde uns ermöglichen, ein Blutvergießen mit unseren europäischen Freunden vollständig zu vermeiden und gleichzeitig den afrikanischen Stolz und die Unabhängigkeit zu wahren."
congo_independence_struggle.3.a:	"Das klingt sehr vernünftig. Wir akzeptieren!"
congo_independence_struggle.3.b:	"Wir können diesen Bedingungen nicht zustimmen..."
congo_independence_struggle.4.t:	"[FROM.GetNameDefCap] wird uns frei sein lassen, wenn wir eine Entschädigung zahlen"
congo_independence_struggle.4.d:	"Wir haben eine Nachricht von [BEL.GetName] erhalten, und sie haben einen wortwörtlichen Preis auf unsere Unabhängigkeit gesetzt. Sie erinnern uns an den beträchtlichen Kapitalaufwand, den sie in unsere Nation investiert haben, angefangen von der Verlegung beträchtlicher Streckenlängen, der Entwicklung von Bergbaumöglichkeiten und dem allgemeinen Ausbau der Infrastruktur. \n\n Damals wurde behauptet, dies sei Teil ihrer Verantwortung gegenüber uns als Kolonialherren und gehöre einfach zum Prozess der Zivilisierung der Nation. Jetzt jedoch halten sie uns dies als Sicherheit vor, um unsere anhaltende Loyalität durch wirtschaftliche Abhängigkeit zu erhalten. \n\nDer geforderte Preis ist nicht unerreichbar, aber er ist extrem hoch und wird unsere Nation kurzfristig in den Ruin treiben und uns danach für einen viel längeren Zeitraum durch Schulden in ihrer Schuld stehen lassen. Die Frage ist nun, ob dies den Preis der Unabhängigkeit wert ist, oder ob er mit Blut bezahlt werden muss.  "
congo_independence_struggle.4.a:	"Wir werden das Kapital aufbringen, so oder so."
congo_independence_struggle.4.b:	"Wir können diesen Bedingungen nicht zustimmen..."
congo_independence_struggle.5.t:	"[FROM.GetNameDef] gehen zu lassen"
congo_independence_struggle.5.d:	"Wir haben soeben die Nachricht des neuen Botschafters von [COG.GetName] erhalten, dass sie das Angebot der Unabhängigkeit von der [BEL.GetAdjective] Kolonialherrschaft im Austausch für den Beitritt zum [BEL.GetAdjective] Commonwealth als vollwertiges und gleichberechtigtes Mitglied angenommen haben. Nun beginnt die Arbeit, die Verwaltung aus dem Kolonialamt herauszulösen und diese Verantwortung stattdessen ihrer neuen Regierung zu übertragen."
congo_independence_struggle.5.a:	"Unsere Mission ist zu Ende!"
congo_independence_struggle.6.t:	"[FROM.GetNameDefCap] wird unsere Bedingungen nicht akzeptieren"
congo_independence_struggle.6.d:	"Es hat sich herausgestellt, dass [COG.GetNameDef] unser großzügiges Angebot für einen friedlichen und für beide Seiten vorteilhaften Weg in die Unabhängigkeit abgelehnt hat. Daher liegt es nun an uns, wie stark wir an dieser eigensinnigen Kolonie festhalten. Wir haben die folgenden drei Optionen:\n\nErste Option: Wenn wir glauben, dass ihre Entschlossenheit, die Unabhängigkeit zu erlangen, ins Wanken gerät, könnten wir ihnen den Status eines überseeischen Departements anbieten, wodurch sie effektiv von einem kolonialen Aktivposten zu einem entfernten Teil unserer eigentlichen Nation mit sehr begrenzter Autonomie werden würden. \n\n Die zweite Option ist, sie zu einem offenen Konflikt zu provozieren und dann auf dem Schlachtfeld unsere Stärke gegenüber ihnen zu demonstrieren. Es ist eher ein Glücksspiel, aber sollten wir gewinnen, steht uns der Weg zur vollständigen Vorherrschaft offen und wir können alle ihre Vermögenswerte ohne internationale Verurteilung beschlagnahmen. \n\nDie dritte Option ist die diplomatischste, und wir wählen ein Modell, das dem britischen Empire ähnelt, wobei [COG.GetNameDef] sich das Recht verdient, ein Herrschaftsgebiet zu werden. Ihre diplomatischen Entscheidungen werden weiterhin von uns getroffen, aber ansonsten wird ihre Autonomie stark erweitert. \n\n Wir sollten uns jedoch darüber im Klaren sein, dass, sollten sie eines davon ablehnen, es wahrscheinlich keine andere Möglichkeit gibt, als Gewalt anzuwenden."
congo_independence_struggle.6.a:	"Verlangen Sie, dass sie ein überseeisches Departement werden."
congo_independence_struggle.6.b:	"Dann wird es keine Verhandlungen geben"
congo_independence_struggle.6.c:	"Lassen Sie uns diplomatisch bleiben. Vielleicht wären sie ja bereit, ein Herrschaftsgebiet zu werden?"
congo_independence_struggle.7.t:	"[FROM.GetNameDef] gehen lassen"
congo_independence_struggle.7.d:	"Wir haben soeben die Nachricht des neuen Botschafters von [COG.GetNameDef] erhalten, dass sie das Angebot angenommen haben, ihre Unabhängigkeit von unserer Kolonialherrschaft zu erwerben. Jetzt beginnt die Arbeit, die Verwaltung aus dem Kolonialamt herauszulösen und diese Verantwortung stattdessen ihrer neuen Regierung zu übertragen - und natürlich dafür zu sorgen, dass die Bankkonten und Holdinggesellschaften eingerichtet werden, um die entsprechenden Zahlungen zu erhalten."
congo_independence_struggle.7.a:	"Unsere Mission ist zu Ende, aber unsere Gewinne nicht!"
congo_independence_struggle.8.t:	"[FROM.GetNameDefCap] möchte, dass wir ein Überseeministerium werden."
congo_independence_struggle.8.d:	"[BEL.GetName] scheint zu glauben, dass wir nicht in der Lage sind, die Unabhängigkeit von ihnen mit Gewalt zu erlangen, und hat unseren Bluff durchschaut. Sie haben uns angeboten, ein Überseedepartement zu werden, was uns im Wesentlichen zu einer Erweiterung ihrer Nation mit Bürgerrechten macht, aber ohne die Autonomie, unsere eigene Zukunft zu gestalten. Sie mögen Recht haben, dass uns die militärische Stärke fehlt, um uns dem zu widersetzen, aber die Entscheidung liegt letztlich bei uns."
congo_independence_struggle.8.a:	"Na schön. Wir akzeptieren..."
congo_independence_struggle.8.b:	"Das ist inakzeptabel, wir fordern volle Unabhängigkeit!"
congo_independence_struggle.9.t:	"Die Force Publique greift unsere Streitkräfte in Léopoldville an"
congo_independence_struggle.9.d:	"Bei Tagesanbruch ertönten Schüsse, als meuternde Elemente der Force Publique die Regierungsgebäude in Léopoldville angriffen. Die loyalen Wachen erwiderten das Feuer und konnten die Rebellen zurückdrängen. Die Spannungen sind jedoch extrem hoch und es gibt Berichte über weitere Meutereien in den Einheiten der Force Publique und darüber, dass lokale Milizen begonnen haben, sich zu bewaffnen und im ganzen Kongo zu versammeln."
congo_independence_struggle.9.a:	"Es braut sich eine Krise im Kongo zusammen"
congo_independence_struggle.22.t:	"Die Gründung einer neuen Überseeabteilung"
congo_independence_struggle.22.d:	"Wir haben eine Nachricht von einer sehr gescholtenen Delegation von [COG.GetNameDef] erhalten, dass sie beschlossen haben, ihren Platz als Überseedepartement von [BEL.GetName] zu akzeptieren. Unsere Staatsbürgerschafts- und Steuerbehörden haben mit der Ausarbeitung der Unterlagen für die ordnungsgemäße Integration dieser neuen Bürger in unser System begonnen, und das Kolonialamt hat mit der Ausarbeitung eines neuen Systems der lokalen Verwaltung begonnen, das sich enger an [BEL.GetAdjective] anlehnt."
congo_independence_struggle.22.a:	"Wir haben sie erfolgreich getäuscht!"
congo_independence_struggle.23.t:	"[FROM.GetNameDefCap] will, dass wir ein Dominion werden"
congo_independence_struggle.23.d:	"Unser Treffen mit den [BEL.GetName]-Diplomaten hat Früchte getragen, und es scheint, dass sie immer noch einen diplomatischen Weg gehen wollen. Sie haben uns eine größere Autonomie als Dominion angeboten, ähnlich wie das britische Modell. Wir müssten immer noch der [BEL.GetAdjective] Diplomatie folgen, hätten aber deutlich mehr Rechte, uns selbst zu regieren, während wir immer noch unter ihrem Schutz stehen."
congo_independence_struggle.23.a:	"Dem können wir zustimmen ja"
congo_independence_struggle.23.b:	"Das ist inakzeptabel, wir fordern volle Unabhängigkeit!"
congo_independence_struggle.10.t:	"[FROM.GetNameDefCap] ist bereit, die Position des Dominion zu akzeptieren"
congo_independence_struggle.10.d:	"Wir haben soeben eine Antwort von [COG.GetNameDef] auf unser Angebot erhalten, sie zu einem Dominion zu erheben, und sie haben zugestimmt! \n\nNun, da wir gesehen haben, dass sie bereit sind, zu verhandeln, könnten wir sie vielleicht noch weiter herunterhandeln, wenn wir etwas mehr Druck ausüben, aber das ist nicht ohne Risiko und wir könnten sie ganz verlieren oder sie noch schlimmer in die Ecke drängen."
congo_independence_struggle.10.a:	"Wir können uns damit zufrieden geben, dass sie ein Dominion sind"
congo_independence_struggle.10.b:	"Nein, wir können sie zu einer weiteren Integration drängen."
congo_independence_struggle.11.t:	"Gründung des Dominion Kongo"
congo_independence_struggle.11.d:	"Gemäß der Vereinbarung mit [BEL.GetName] haben wir heute Morgen mit dem Bau des neuen Regierungsgebäudes begonnen, in dem das Parlament des Dominion untergebracht werden soll. Der nächste Schritt wird sein, mit der Ausarbeitung unserer Verfassung zu beginnen und die ersten Wahlen abzuhalten. Von diesen bescheidenen Anfängen aus können wir beginnen, die zukünftige politische Identität dieser Nation zu gestalten."
congo_independence_struggle.11.a:	"Es ist an der Zeit, an die Arbeit zu gehen und unser neues Dominion zu errichten!"
congo_independence_struggle.12.t:	"[FROM.GetNameDefCap] lehnt die Dominion-Lösung ab"
congo_independence_struggle.12.d:	"In einer schockierenden Entscheidung hat [BEL.GetName] beschlossen, sein Angebot, ein Dominion zu bilden, zurückzuziehen! Wir sind uns nicht ganz sicher, was zu diesem Gesinnungswandel geführt hat. Vielleicht macht der Kolonisator, nachdem er einmal einen Rückzieher gemacht hat, das, was er am besten kann, und nutzt die Situation aus. Wir müssen selbst entscheiden, wie wir auf diesen Affront reagieren."
congo_independence_struggle.12.a:	"Das ist inakzeptabel! Drohen Sie ihnen mit der Anwendung von Gewalt."
congo_independence_struggle.12.b:	"Wir sollten uns zurückziehen, ein überseeisches Gebiet ist gar nicht so schlecht"
congo_independence_struggle.13.t:	"Kongo gibt nach und erklärt sich bereit, ein Überseegebiet zu werden"
congo_independence_struggle.13.d:	"Unser diplomatischer Schachzug gegen [COG.GetName] hat funktioniert! Ihre Delegation ist heute zu uns gekommen, um ihren Platz als Überseeterritorium zu akzeptieren."
congo_independence_struggle.13.a:	"Perfekt!"
congo_independence_struggle.14.t:	"[FROM.GetNameDefCap] droht mit Krieg"
congo_independence_struggle.14.d:	"Ein sehr streitlustiger Delegierter von [COG.GetNameDef] hat sich vorhin mit dem Kolonialgouverneur getroffen. Offensichtlich frustriert über die bisherigen Fortschritte bei den Gesprächen haben sie ein Ultimatum gestellt. \n\n Entweder wir akzeptieren ihre Unabhängigkeit mit sofortiger Wirkung, oder sie werden die Glocken der Freiheit gegen uns läuten. Wir erhalten bereits Berichte über Milizeinheiten, die sich versammeln, und es gab bereits eine Reihe von Scharmützeln gegen Garnisonen der Force Publique. Bisher ist noch niemand gestorben, aber das ist nur eine Frage der Zeit, wenn die Spannungen so hoch sind."
congo_independence_struggle.14.a:	"Dann werden sie Krieg haben! [COG.GetNameDef] ist UNSER!"
congo_independence_struggle.14.b:	"Wir sind im Moment einfach zu überfordert. Geben Sie ihnen die Freiheit, die sie sich so sehr wünschen."
congo_independence_struggle.15.t:	"[FROM.GetNameDefCap] wird nicht kampflos aufgeben"
congo_independence_struggle.15.d:	"Loyalistische Einheiten der Force Publique haben heute versucht, Anführer der Unabhängigkeitsbewegung zusammenzutreiben und zu verhaften. [COG.GetAdjective] Milizen schritten ein, und es kam zu einem Schusswechsel zwischen ihnen. Es scheint, dass die Diplomatie gescheitert ist und dieser Unabhängigkeitskrieg offiziell begonnen hat."
congo_independence_struggle.15.a:	"Wir werden uns durchsetzen"
congo_independence_struggle.16.t:	"[FROM.GetNameDefCap] gibt nach und überlässt uns die Unabhängigkeit"
congo_independence_struggle.16.d:	"Wir haben es geschafft, uns vom Rande eines Krieges mit unserem kolonialen Oberherrn zurückzuziehen. Oder besser gesagt, dem ehemaligen kolonialen Oberherrn. \n\nDie Delegation, die wir zu einem Treffen mit der Verwaltung geschickt haben, hat sich heute Morgen mit dem Kolonialgouverneur getroffen, und beide Parteien haben die Papiere unterzeichnet, die offiziell die Unabhängigkeit von [COG.GetNameDef] erklären. Wir sind jetzt eine eigene freie Nation, und die Übergabe der Macht hat bereits begonnen. \n\n Von nun an haben wir unser Schicksal fest in der Hand, und das ohne jegliche Bezahlung durch Blut, Stolz oder Geld."
congo_independence_struggle.16.a:	"Heute ist ein Tag zum Feiern!"
congo_independence_struggle.17.t:	"[FROM.GetNameDefCap] strebt die Unabhängigkeit um jeden Preis an"
congo_independence_struggle.17.d:	"Heute Morgen erhielten wir über Funk einen eilig zusammengestellten Bericht des Kolonialgouverneurs von [COG.GetNameDef]. Er behauptete, ein Mob sei in seine offizielle Residenz eingedrungen, habe die Wachen mit im Ausland hergestellten Waffen befriedet und ihm eine Unabhängigkeitserklärung in die Hand gedrückt. Danach seien sie sofort verschwunden. Besonders alarmierend war, dass dieser Mob von Elementen der Force Publique angeführt wurde, der Gendarmerie, die für die Aufrechterhaltung der Ordnung zuständig ist. \n\nDie Erklärung forderte den sofortigen Rückzug der Kolonialverwaltung und die anschließende Übergabe der legitimen Macht an eine Zivilregierung, die aus der Führung dieser Rebellion gebildet werden sollte. Wir können uns keinen Illusionen hingeben, dass das Risiko real ist, und die Tatsache, dass dieser Mob mit Waffen bewaffnet war, die nicht von [BEL.GetAdjective] stammen, könnte darauf hindeuten, dass ausländische Stellen ein direktes Interesse haben und die Rebellen militärisch unterstützen könnten."
congo_independence_struggle.17.a:	"Wir haben keine andere Wahl als zu akzeptieren"
congo_independence_struggle.17.b:	"Sie haben Wahnvorstellungen. Sorgen Sie für ein Expeditionskorps, das sofort die Ordnung wiederherstellt!"
congo_independence_struggle.18.t:	"[FROM.GetNameDefCap] Lasst uns gehen"
congo_independence_struggle.18.d:	"Es scheint, dass unser Ultimatum von unserem Oberherrn mit der nötigen Ernsthaftigkeit behandelt wurde, denn heute haben wir die unterzeichnete Unabhängigkeitsurkunde von der Kolonialverwaltung erhalten. Die Pläne für das offizielle Hissen der [BEL.GetAdjective]-Flagge und damit die friedliche Übergabe der Macht an unser neues Regime sind bereits im Gange. Obwohl unser Hauptziel erreicht ist, beginnt nun die eigentliche Arbeit der Regierungsbildung. Wir haben viel zu tun, eine Wirtschaft zu entwickeln, die Beziehungen zu anderen Nationen zu normalisieren und natürlich gewisse Schulden bei denen zurückzuzahlen, die uns bei der Verwirklichung dieses Traums unterstützt haben."
congo_independence_struggle.18.a:	"Heute ist ein Tag zum Feiern!"
congo_independence_struggle.19.t:	"[FROM.GetNameDefCap] Bereitet sich auf den Krieg vor"
congo_independence_struggle.19.d:	"Uns liegen Berichte vor, dass [BEL.GetAdjective] Truppen in Léopoldville mobilisiert werden und dass in der gesamten Force Publique hart gegen illoyale Elemente vorgegangen wird. Trotz unserer besten Bemühungen, die [BEL.GetAdjective] Regierung zur Unterwerfung zu zwingen und unser Ziel der Unabhängigkeit ohne Blutvergießen zu erreichen, haben sich die Kolonialmächte dafür entschieden, die Macht auf die einzige Weise zu erhalten, die sie kennen - mit Gewalt. Unser Zeitfenster schließt sich schnell und wir müssen entscheiden, ob wir unseren Anhängern das Wort geben, sich zu erheben, oder ob wir uns zurückziehen, bevor die Dinge außer Kontrolle geraten."
congo_independence_struggle.19.a:	"Der Sieg wird ihnen nützen!"
congo_independence_struggle.19.b:	"Es ist zu gefährlich. Wir müssen uns zurückziehen."
congo_independence_struggle.20.t:	"Der Kongo erklärt den Krieg für die Unabhängigkeit!"
congo_independence_struggle.20.d:	"Wir haben alle möglichen Maßnahmen ergriffen, um die Kontrolle über die sich rapide verschlechternde Situation zu behalten, einschließlich der systematischen Beseitigung von verräterischen Elementen innerhalb der Force Publique. Leider wurde dieser offenere Akt als kriegerisch angesehen und die mutierten Einheiten eröffneten das Feuer auf ihre Offiziere, sobald sie diese näherkommen sahen. Mit diesen Schüssen hat der Unabhängigkeitskrieg ernsthaft begonnen und gerät für beide Seiten außer Kontrolle. \n\n Es gibt Gebiete, die uns treu geblieben sind, weil sie die Vorteile der Kolonisierung am unmittelbarsten zu spüren bekommen haben, doch der größte Teil des Landes ist nun gegen uns aufgerüstet."
congo_independence_struggle.20.a:	"Zu den Waffen, Brüder!"
congo_independence_struggle.21.t:	"Kongo gibt nach und erklärt sich bereit, ein Überseegebiet zu werden"
congo_independence_struggle.21.d:	"Unsere schnelle Reaktion auf die anhaltende Situation im Kongo hat die Spannungen dort scheinbar beruhigt. [BEL.GetAdjective] Offiziere haben schnell gehandelt, um bekannte meuternde Elemente der Force Publique zu befrieden. Da ihre anhaltende Loyalität gesichert war, erlosch das Feuer der Revolte schnell und die lautesten Stimmen wurden zum Schweigen gebracht - in den meisten Fällen durch die dicken Mauern des Gefängnisses. \n\nDie Kolonialverwaltung hat die Initiative ergriffen und die sich ihr bietende Gelegenheit genutzt und ihre eigene Kontrolle über alle Regierungsebenen ausgeweitet, so dass wir heute ein weitaus höheres Maß an Kontrolle über die Kolonie haben als zuvor."
congo_independence_struggle.21.a:	"Ruhm für das [BEL.GetAdjective] Empire!"
congo_independence_struggle.24.t:	"Die Loyalisten in Léopoldville lassen den Konflikt eskalieren"
congo_independence_struggle.24.d:	"Der Klang von Schüssen durchbrach die Stille des Morgens. [BEL.GetAdjective] Polizeieinheiten wurden entsandt, um patriotische Elemente der Force Publique in die Gefangenschaft zu führen, doch stattdessen wurden sie von einem Kugelhagel getroffen. Die Meuterei breitet sich schnell aus, und die Milizen greifen im ganzen Land zu den Waffen. Die Unterstützung für die Sache ist im ganzen Land weit verbreitet, doch die Kolonialtruppen behalten die Kontrolle über mehrere Gebiete, vor allem in den Gebieten, die sie am leichtesten ausgebeutet hatten und in denen sie daher die größte militärische Präsenz hatten. \n\nDieser Unabhängigkeitskrieg hat ernsthaft begonnen, und wir werden nicht ruhen, bis der Kongo von der europäischen Besatzung befreit ist."
congo_independence_struggle.24.a:	"Diesen Krieg können wir uns nicht leisten zu verlieren!"
congolese_civil_war_starting_tt:	"Der Kongo wird einen Unabhängigkeitskrieg gegen uns erklären. Sie werden in der Lage sein, Frieden zu erzwingen und ihre volle Unabhängigkeit zu erlangen, wenn sie §YLéopoldville§!, §YÉlisabethville§! und §YStanleyville§! kontrollieren. \n\nGleichermaßen werden wir in der Lage sein, Frieden mit ihnen zu erzwingen und unsere Kontrolle über das Gebiet zu behalten, wenn wir §YLéopoldville§!, §YÉlisabethville§! und §YStanleyville§! kontrollieren."
congolese_civil_war_starting_congo_side_tt:	"Die belgischen Loyalisten werden einen Bürgerkrieg gegen uns anzetteln. Wenn wir §YLéopoldville§!, §YÉlisabethville§! und §YStanleyville§! kontrollieren, können wir den Frieden mit unseren ehemaligen Oberherren erzwingen und volle Unabhängigkeit erlangen. \n\nGleichermaßen werden sie in der Lage sein, Frieden mit uns zu erzwingen und die Kontrolle über unser Land zu behalten, wenn sie §YLéopoldville§!, §YÉlisabethville§! und §YStanleyville§! kontrollieren."
wuw_GER_releasable.1.t:	"Eine Hauptstadt für das deutsche Volk"
wuw_GER_releasable.1.desc:	"Mit der Reformierung des deutschen Staates haben viele unserer Politiker argumentiert, dass unsere Hauptstadt überdacht werden muss. Sie behaupten, dass sie Titeln wie 'Hauptstadt des deutschen Volkes' nicht gerecht wird. Wohin wollen wir in einem solchen Fall unsere Hauptstadt verlegen?"
wuw_GER_releasable.1.a:	"Berlin ist die offensichtliche Wahl!"
wuw_GER_releasable.1.b:	"Es sollte München sein."
wuw_GER_releasable.1.c:	"Frankfurt wäre eine gute westliche Hauptstadt"
wuw_GER_releasable.1.d:	"Unsere Hauptstadt ist gut so, wie sie ist"
wuw_GER_releasable.2.t:	"Die Wahl"
wuw_GER_releasable.2.desc:	"Nachdem die Wahl zu Gunsten der Rietspartei ausgefallen ist, ist es nun an der Zeit, die Person zu wählen, die am besten geeignet ist, die Nation zu regieren. Die Partei möchte, dass Pierre Dupong vorerst die Führung übernimmt, damit Joseph Bech Zeit hat, sich anderen wichtigen Dingen zu widmen. Da sich jedoch dunkle Wolken über Europa zusammenbrauen, könnte es klug sein, unsere politische Landschaft drastisch zu verändern, damit wir nicht an benachbarte Mächte fallen..."
wuw_GER_releasable.2.a:	"Pierre Dupong übernimmt das Ruder"
wuw_GER_releasable.2.b:	"Joseph Bech wird noch gebraucht"
wuw_GER_releasable.2.c:	"In diesen gefährlichen Zeiten müssen die Royals aktiv werden!"
wuw_GER_releasable.2.d:	"Das Volk sollte gegen eine so eindeutig manipulierte Wahl protestieren!"
wuw_GER_civil_war.1.t:	"Ausgebürgerte Kommunisten kehren heim"
wuw_GER_civil_war.1.desc:	"Nach dem jüngsten Putsch der Wehrmacht gegen das Naziregime strömen viele Kommunisten, die zuvor das Land verlassen hatten, nun wieder über unsere Grenzen, da sie ihre Chance sehen, uns im Kampf gegen diejenigen zu unterstützen, die ihnen einst Unrecht getan haben. Sollten wir ihnen erlauben zu kämpfen, oder sollten wir versuchen, ihre Rückkehr unter den Teppich zu kehren, in der Hoffnung, dass sie nicht populär genug werden, um eine eigene Revolution zu starten?"
wuw_GER_civil_war.1.a:	"Willkommen zurück, Genossen!"
wuw_GER_civil_war.1.b:	"Jemand muss ein Auge auf sie haben"
wuw_GER_civil_war.2.t:	"Ernst Thälmann aus dem Gefängnis befreit"
wuw_GER_civil_war.2.desc:	"Wie berichtet, ist eine Gruppe kommunistischer Partisanen in das sächsische Gefängnis Bautzen eingebrochen und hat den engagierten Kommunisten und ehemaligen KPD-Vorsitzenden Ernst Thälmann befreit. Sein Parteirivale Walter Ulbricht hat den Überfall auf das Gefängnis als antirevolutionären Terrorakt verurteilt. Diese Äußerung entspringt wahrscheinlich seiner Befürchtung, dass der allseits beliebte Thälmann die Führung der Partei zurückgewinnen könnte."
wuw_GER_civil_war.2.a:	"Eine interessante Entwicklung"
GER_thalmann_freed_from_prison_tt:	"§YErnst Thälmann§! wird von kommunistischen Partisanen aus dem Gefängnis befreit"
GER_thalmann_freed_from_prison_flag:	"§YErnst Thälmann§! ist aus dem Gefängnis befreit worden"
wuw_GER_civil_war.3.t:	"Die Reformation der paramilitärischen Flügel"
wuw_GER_civil_war.3.desc:	"Unsere Politiker und Generäle haben in letzter Zeit die Idee diskutiert, paramilitärische Abteilungen in den Reihen unserer Soldaten einzuführen. Die konservativen Parteien wünschen sich die Wiedereinführung der Bismarck-Jugend, der mit der DNVP verbundenen antimarxistischen Jugendbewegung. Andere hingegen sehen in der bereits kämpfenden sozialdemokratischen Eiserne Front eine erstklassige Organisation, die es zu stärken gilt, wenn wir mehr Paramilitärs in unseren Streitkräften einsetzen wollen."
wuw_GER_civil_war.3.a:	"Eine Neue Bismarckjugend sollte oberste Priorität haben"
wuw_GER_civil_war.3.b:	"Wir sollten die Eiserne Front auf jeden Fall stärken"
wuw_GER_civil_war.4.t:	"Die Zukunft der paramilitärischen Flügel"
wuw_GER_civil_war.4.desc:	"Nach dem Ende des Bürgerkriegs und der vollständigen Zerschlagung des Nazi-Regimes stellt sich die Frage, ob es wirklich klug ist, offen politische paramilitärische Organisationen in unserem Land frei agieren zu lassen. Da die Junta wenig bis gar keine formale Kontrolle über sie hat, könnte es klug sein, sie zu verbieten und ihre Auflösung zu erzwingen. Andernfalls könnten wir vielleicht versuchen, sie zu behalten und sie so weit einzuschränken, dass sie keine Bedrohung mehr darstellen sollten."
wuw_GER_civil_war.4.a:	"Versuchen Sie, sie ganz aufzulösen"
wuw_GER_civil_war.4.b:	"Vielleicht können wir sie vorerst einfach demobilisieren?"
wuw_GER_civil_war.5.t:	"Der vierte schlesische Aufstand"
wuw_GER_civil_war.5.desc:	"Uns liegen Berichte vor, wonach schlesische und polnische Partisanen das Feuer auf deutsche Soldaten in Schlesien eröffnet haben. Sie streben die Unabhängigkeit ihrer Nation an und sehen unseren Bürgerkrieg als das Zeichen der Schwäche, das sie brauchen, um den Mut zur Abspaltung aufzubringen. Wir müssen dafür sorgen, dass ihre Ziele nicht erreicht werden und dass ihre Rebellion so schnell wie möglich niedergeschlagen wird."
wuw_GER_civil_war.5.a:	"Wir dürfen nicht zulassen, dass sie Erfolg haben!"
wuw_GER_civil_war.6.t:	"Kommunistischer Bürgerkrieg in [ROOT.GetNameDef]"
wuw_GER_civil_war.6.desc:	"Nach einiger Zeit, die von intensivem Dissens mit dem Proletariat geprägt war, hat sich die Situation in [ROOT.GetNameDef] zum Feind entwickelt. Die Streitkräfte von [ROOT.GetLeader] sind in mehreren Staaten nach anhaltenden Aufständen überrannt worden. Was aus dieser Revolte wird, bleibt abzuwarten."
wuw_GER_civil_war.6.a:	"Für das Proletariat!"
wuw_GER_civil_war.6.b:	"Wir werden diesen Pöbel zerschlagen!"
GER_shalva_maglakelidze_and_giorgi_kvinitadze_join:	"§YGiorgi Kvinitadze§! und §YShalva Maglakelidze§! werden sich uns als §YFeldmarschall§! und §YGeneral§! anschließen"
GER_georgian_legion_recruitment_tt:	"Gewinnen Sie zwei §YInfanterie§! Einheiten der Georgischen Legion"
GER_andrey_shckuro_and_pyotr_krasnov_join_tt:	"§YAndrey Shkuro§! und §YPyotr Krasnov§! schließen sich uns als Generäle\n an"
GER_white_russian_exiles_divisions_recruitment_tt:	"Gewinnen Sie zwei Kosakeneinheiten und eine russische §YInfantry§! Einheit"
GER_cossack_exiles_divisions_recruitment_tt:	"Gewinnen Sie zwei kosakische §YKavallerie§!-Einheiten"
wuw_GER_civil_war.7.t:	"Die Loyalität der Kriegsmarine"
wuw_GER_civil_war.7.desc:	"Wir haben erfahren, dass die Kriegsmarine sich möglicherweise für [ROOT.GetLeader] entscheidet, wenn wir unseren Coup ausführen. Der Grund dafür scheint zu sein, dass ihrem Anführer Erich Raeder von [ROOT.GetLeader] versprochen wurde, dass sein Zweig des Militärs unter seinem Regime große Investitionen und Freiheiten erhalten wird, etwas, das die alte Regierung nicht erreicht hat. Vielleicht sollten wir ähnliche Versprechen machen, um ihn auf unsere Seite zu ziehen?"
wuw_GER_civil_war.7.a:	"Wir müssen uns ihre Loyalität um jeden Preis sichern"
wuw_GER_civil_war.7.b:	"Wir dürfen Erich Raeder nicht besänftigen"
GER_promised_erich_raeder_a_great_navy_tt:	"Erich Raeder und ein großer Teil der Kriegsmarine werden sich auf unsere Seite schlagen, wenn der Staatsstreich stattfindet. Sollten wir es jedoch nicht schaffen, entweder §Y$GER_rebuild_the_high_seas_fleet_ww$§! oder §Y$GER_high_seas_fleet$§! und §Y$GER_re_establish_the_seekriegsleitung$§! innerhalb von zwei Jahren abzuschließen, könnte er §RRevolte gegen unser Regime§!"
GER_chose_to_not_placate_erich_raeder_tt:	"Nur ein kleinerer Teil der Kriegsmarine wird sich auf unsere Seite schlagen, wenn der Staatsstreich stattfindet, aber wir werden uns nicht durch irgendwelche Versprechen an Erich Raeder fesseln lassen"
wuw_GER_civil_war.8.t:	"Der Staatsstreich der Kriegsmarine"
wuw_GER_civil_war.8.desc:	"Jahre nach unserem Versprechen, die Marine wieder zu ihrem alten Glanz zu verhelfen, scheinen Erich Raeder und die Kriegsmarine genug von unserer endlosen Hinhaltetaktik zu haben, denn sie haben heute einen Putschversuch gegen unsere Regierung unternommen. Zu unserem Glück ist er gescheitert, aber um sicherzustellen, dass sich so etwas nicht wiederholt, müssen wir viele hochrangige Beamte und Elemente innerhalb unserer Streitkräfte aus dem Weg räumen..."
wuw_GER_civil_war.8.a:	"Sie werden für ihren Verrat bezahlen!"
wuw_GER_civil_war.8.b:	"Der Staat wird den Bruch seiner Versprechen bereuen."
this_will_happen_tt:	"Folgendes wird geschehen:\n"
wuw_GER_civil_war.9.t:	"August von Mackensen scheidet aus dem Militär aus"
wuw_GER_civil_war.9.desc:	"Nachdem der Sieg über die Nazibedrohung gesichert ist, hat sich der Chef der Militärregierung August von Mackensen aufgrund seines Alters und seines sich verschlechternden Gesundheitszustands erneut entschlossen, von der Führung der Streitkräfte zurückzutreten. Er hat erklärt, dass er von nun an nur noch bei administrativen Aufgaben helfen wird."
wuw_GER_civil_war.9.a:	"Er hat uns gut gedient."
GER_mackensen_went_into_retirement_tt:	"§YAugust von Mackensen§! hört auf, ein §YFeldmarschall§! zu sein"
GER_recalled_hans_krebs_from_russia_flag:	"§YHans Krebs§! ist von §Y[SOV.GetNameDef]§! abberufen worden."
wuw_GER_legions.1.t:	"Die Bildung einer georgischen Fremdenlegion"
wuw_GER_legions.1.desc:	"Nachdem wir kürzlich erklärt haben, dass wir beabsichtigen, die Grenzen des Friedensvertrags von Brest-Litowsk wiederherzustellen, haben sich einige georgische Generäle und Soldaten im Exil an uns gewandt, die uns bei der Rückeroberung ihrer ehemaligen Heimat helfen wollen. Im Gegenzug versprechen sie uns, den georgischen Staat wiederherzustellen und ihm die Herrschaft über den Kaukasus zu übertragen. Sollten wir ihre Hilfe annehmen?"
wuw_GER_legions.1.a:	"Sie sind willkommen, sich uns anzuschließen."
wuw_GER_legions.1.b:	"Wir haben keinen Bedarf an ihnen"
wuw_GER_legions.2.t:	"Hans Krebs Abgerufen von [SOV.GetNameDef]"
wuw_GER_legions.2.desc:	"Nach der jüngsten Erklärung der Feindseligkeiten zwischen uns und den [SOV.GetAdjective]s wurde unser Militärattaché unter der Leitung von Generalmajor Hans Krebs einige Wochen im Voraus abberufen und ist vor kurzem wieder in Berlin eingetroffen. Er ist nun bereit, an der Ostfront zu dienen, da er nach eigenen Angaben über die Erfahrung und die Kenntnisse der [SOV.GetAdjective] Streitkräfte verfügt, die wir für eine erfolgreiche Invasion ihres Territoriums benötigen."
wuw_GER_legions.2.a:	"Wir könnten seinen militärischen Geheimdienst gebrauchen."
wuw_GER_legions.3.t:	"Die Gelegenheit zur Zusammenarbeit in Lokot"
wuw_GER_legions.3.desc:	"Nach der Besetzung der Oblaste Brjansk, Kursk und Orel hat unsere Armee den Plan ausgeheckt, lokale Kollaborateure in Lokot einzusetzen, um die Region leichter regieren zu können und gleichzeitig mehr Einheiten für den Kampf gegen _[SOV.GetAdjective] aufstellen zu können. Dies würde jedoch unsere Armeegruppe um ihre Kriegsbeute in der Region bringen. Sollten wir die Einrichtung dieser Lokot-Autonomie genehmigen?"
wuw_GER_legions.3.a:	"Ein Feind unseres Feindes ist uns immer willkommen!"
wuw_GER_legions.3.b:	"Wir haben keinen Bedarf an lokalen Kollaborateuren"
wuw_GER_legions.4.t:	"Kollaborateure in den Lokot!"
wuw_GER_legions.4.desc:	"Wir haben erfahren, dass die [GER.GetAdjective] Armee die Lokot-Autonomie in der Grenzregion zwischen den Oblasten Brjansk, Kursk und Orel eingerichtet hat, nachdem sie von eifrigen Kollaborateuren wie Konstantin Voskoboinik und Bronislav Kaminski angesprochen wurde. Es scheint, dass sie mit der Aufgabe betraut wurden, die Region zu regieren und mit Partisanen und Widerstand umzugehen. Wir müssen den Feind zurückschlagen und diesen falschen Staat so schnell wie möglich zerstören!"
wuw_GER_legions.4.a:	"Sie haben die falsche Wahl getroffen"
lokot_autonomy_has_been_established_flag:	"Der §YLokot Autonomy§! wurde gegründet"
lokot_autonomy_has_been_crushed_flag:	"Die §YLokot-Autonomie§! wurde zerschlagen"
SOV_recapture_lokot_to_destroy_the_autonomy_tt:	"Wenn wir §Y[224.GetName]§!, §Y[220.GetName]§! und §Y[222.GetName]§! zurückerobern, können wir die §YLokot Autonomy§! schnell demontieren."
wuw_GER_legions.5.t:	"Die Zerschlagung der Lokot-Autonomie"
wuw_GER_legions.5.desc:	"Nach der Rückeroberung der Oblaste Brjansk, Kursk und Orel hat unsere Armee den größten Teil der Kollaborateure in Lokot gefangen genommen und unsere lokalen Regierungen in der Region wieder eingesetzt. Die [GER.GetAdjective] Armee hat sich aus der Region zurückgezogen, und unsere Kommandeure versichern uns, dass der Tag des Sieges immer näher rückt."
wuw_GER_legions.5.a:	"Wir werden siegreich sein!"
wuw_GER_legions.6.t:	"Die Zerstörung der Autonomie der Lokot"
wuw_GER_legions.6.desc:	"Nach der Rückeroberung der Region Lokot durch [SOV.GetAdjective] haben sie den autonomen Staat, den wir zuvor errichtet hatten, zerschlagen und alle Mitglieder der lokalen Kollaborationsregierung verhaftet und eliminiert."
wuw_GER_legions.6.a:	"Der Krieg hat eine Wendung genommen"
GER_lokot_collaborators_have_been_captured_by_the_soviets_tt:	"§Y[GER.SOV_bronislav_kaminski.GetName]§! und §Y[GER.SOV_konstantin_voskoboinik.GetName]§! sind von [SOV.GetAdjective] Kräften gefangen genommen worden"
wuw_GER_legions.7.t:	"Ein Angebot der russischen Exilanten in Serbien"
wuw_GER_legions.7.desc:	"Nach der Einsetzung der serbischen Regierung der Nationalen Rettung in den kürzlich von uns besetzten Gebieten haben einige weißrussische Emigranten angeboten, uns bei der Schaffung eines russischen Schutzkorps zu unterstützen, das uns beim Schutz von Fabriken und Regierungsgebäuden im besetzten Serbien sowie bei der Unterdrückung von Tschetniks und anderen Widerstandskämpfern in der Region helfen würde. Sollten wir ihre Hilfe in Anspruch nehmen?"
wuw_GER_legions.7.a:	"Wir könnten ihre Hilfe bei der Unterdrückung Serbiens in Anspruch nehmen."
wuw_GER_legions.7.b:	"Wir haben keinen Bedarf an diesem russischen Gesindel"
wuw_GER_legions.8.t:	"Ein Angebot von verärgerten Kosaken"
wuw_GER_legions.8.desc:	"Da immer deutlicher wird, dass wir beabsichtigen, die verfaulte Tür von [SOV.GetNameDef] einzutreten, sind viele derjenigen, die im russischen Bürgerkrieg verloren haben, an uns herangetreten und wünschen sich eine Chance, der derzeitigen [SOV,GetAdjective]-Regierung ein Ende zu bereiten. Unter ihnen sind Don- und Kuban-Kosaken [SOV.SOV_pyotr_krasnov.GetName] und [SOV.SOV_andrey_shkuro.GetName], die für uns kämpfen wollen. Sollten wir ihre Hilfe annehmen?"
wuw_GER_legions.8.a:	"Wir könnten ihr Wissen über die Kubanische Steppe gebrauchen."
wuw_GER_legions.8.b:	"Und warum sollten wir die Hilfe einiger Kosaken benötigen?"
wuw_GER_monroe.1.t:	"[FROM.GetAdjectiveCap] Interesse an der Monroe-Doktrin"
wuw_GER_monroe.1.desc:	"Wir haben alarmierende Berichte erhalten, dass [FROM.GetNameDef] ein verstärktes Interesse an der Destabilisierung der Monroe-Doktrin zeigt. Die Doktrin wurde eingeführt, um zu verhindern, dass fremde Nationen auf dem amerikanischen Kontinent, den wir als unseren Einflussbereich betrachten, Unruhe stiften. Nach den bisherigen Begegnungen mit [FROM.GetNameDef] können wir nur vermuten, dass ihre Absichten nicht gut sind."
wuw_GER_monroe.1.a:	"Wir müssen intervenieren!"
wuw_GER_monroe.1.a_tt:	"Schaltet Entscheidungen zur §YDurchsetzung der Monroe-Doktrin§! frei. \n[GER.GetNameDefCap] hat Entscheidungen zum Versuch der §RDestabilisierung der Monroe-Doktrin§! freigeschaltet."
wuw_GER_monroe.1.b:	"Wen interessiert das?"
wuw_GER_monroe.1.b_tt:	"[GER.GetNameDefCap] hat Entscheidungen freigeschaltet, die darauf abzielen, §RDestabilisierung der Monroe-Doktrin§!.\n\nDurch die Auswahl dieser Option erhalten wir §RNOT§! weitere Benachrichtigungen in Bezug auf die Monroe-Doktrin. [FROM.GetNameDefCap] darf ohne Unterbrechung versuchen, die Doktrin zu beseitigen.\n\n§Wählen Sie diese Option nur, wenn Sie einen Notfallplan zur Hand haben!§!"
wuw_GER_monroe.2.t:	"Die Monroe-Doktrin bröckelt"
wuw_GER_monroe.2.desc:	"Nach ausgiebigem [FROM.GetAdjective] Druck scheint es, dass die Monroe-Doktrin endlich nachgibt. Mehrere Länder haben sich gegen die Doktrin erhoben und sich enger an die [FROM.GetAdjective] angelehnt. Die Opposition ist zwar laut, aber es gibt immer noch Leute, die die Doktrin zumindest bis zu einem gewissen Grad für rettenswert halten. An diesem Punkt werden alle unsere Aktionen als Abschwächungstaktik betrachtet, wir sollten unsere Reaktion darauf sorgfältig auswählen."
wuw_GER_monroe.2.a:	"Wir werden all diejenigen schützen, die sich uns nicht widersetzt haben!"
wuw_GER_monroe.2.a_tt:	"Die §YMonroe-Doktrin§! wird aus allen Ländern entfernt, die sie noch haben. Garantiert allen Ländern, die sich nicht lautstark gegen die Doktrin ausgesprochen haben, £GFX_pol_power §Y25 politische Macht§! §RPro Land Garantiert§!! \n\nGegenwärtig gibt es §Y[?global.monroe_countries_in_support^num] Länder§!, die die Doktrin unterstützen, und §Y[?global.monroe_doctrine_countries_to_destabilize^num] Länder§!, die die Doktrin passiv unterstützen.\n\nGegenwärtig betragen die Kosten der Garantien £GFX_pol_power §Y[?USA.monroe_countries_all_in_support_guarantee_cost] Politische Macht§!"
wuw_GER_monroe.2.b:	"Wir können nur für diejenigen garantieren, die loyal geblieben sind."
wuw_GER_monroe.2.b_tt:	"Die §YMonroe-Doktrin§! wird aus allen Ländern entfernt, die sie noch haben. Garantien für alle Länder, die die Doktrin lautstark unterstützt haben, zum Preis von £GFX_pol_power §Y25 politische Macht§! §RPro Land Garantiert§!!\n\nAktuell gibt es §Y[?global.monroe_countries_in_support^num]§! Länder, die sie unterstützen.\n\nDie Kosten für die Garantien betragen derzeit £GFX_pol_power §Y[?USA.monroe_countries_strict_in_support_guarantee_cost] Political Power§!"
wuw_GER_monroe.2.c:	"Wenn sie Garantien wollten, hätten sie das verhindern müssen."
wuw_GER_monroe.3.t:	"[FROM.GetNameDefCap] Verstärkt die Monroe-Doktrin"
wuw_GER_monroe.3.desc:	"Es überrascht nicht, dass [FROM.GetNameDef] unseren Versuchen, die Region zu destabilisieren, auf die Schliche gekommen ist. Mit einer massiven Propaganda-, Erpressungs- und Bestechungskampagne haben die [FROM.GetAdjective] die Länder, die unter die Monroe-Doktrin fallen, auf ihre Seite gezogen und gegen uns aufgehetzt. Die Monroe-Doktrin ist stärker als je zuvor."
wuw_GER_monroe.3.a:	"Verflucht!"
wuw_GER_monroe.4.t:	"[FROM.GetNameDefCap] fordert, dass wir die Monroe-Doktrin fallen lassen"
wuw_GER_monroe.4.desc:	"Wir haben eine recht harsch formulierte Mitteilung von [FROM.GetNameDef] erhalten. Sie erklären, dass die Monroe-Doktrin zerbröckeln wird und dass wir bald nicht mehr unter dem Schutz von [USA.GetNameDef] stehen werden. Wenn wir die Doktrin jetzt abschaffen, bieten sie ihren eigenen Schutz als Ersatz an, aber sie haben sehr deutlich gemacht, dass dieses Angebot davon abhängt, dass wir schnell handeln."
wuw_GER_monroe.4.a:	"Was hat [USA.GetNameDef] überhaupt für uns getan?"
wuw_GER_monroe.4.a_tt:	"Wir werden unsere §ROpposition§! gegen die Monroe-Doktrin lautstark zum Ausdruck bringen. Für den Fall, dass sich die Doktrin durchsetzt, werden wir §Rohne Garantien§! stehen.§Y[USA.GetFlag][USA.GetNameDefCap]§! wird uns nicht mehr umstimmen können."
wuw_GER_monroe.4.b:	"Wir werden nicht auf ihre Lügen hören!"
wuw_GER_monroe.4.b_tt:	"Wir werden es ablehnen, in dieser Angelegenheit Stellung zu beziehen. Es mag Versuche von §Y[USA.GetNameWithFlag]§! geben, uns auf ihre Seite zu ziehen."
monroe_country_in_opposition_flag:	"Dieses Land hat bereits gegen die Monroe-Doktrin Stellung bezogen."
wuw_GER_monroe.5.t:	"[FROM.GetNameDefCap] Einmischung in [ROOT.GetAdjective] Politik"
wuw_GER_monroe.5.desc:	"Wir sind darauf aufmerksam geworden, dass [FROM.GetAdjective] Agenten in unserem Land aktiv versuchen, unsere Politik zu beeinflussen. Der Einfluss ist nicht aufdringlich und geht darüber hinaus, bereits existierende Gruppen zu sammeln und ihre Position im politischen Klima zu stärken."
wuw_GER_monroe.5.a:	"Gut"
wuw_GER_monroe.5.b:	"Sie haben kein Recht, sich in unsere Politik einzumischen!"
wuw_GER_monroe.6.t:	"[FROM.GetNameDefCap] Fordert uns auf, unsere Haltung zur Monroe-Doktrin zu bekräftigen"
wuw_GER_monroe.6.desc:	"Eine Mitteilung von [FROM.GetNameDef] hat uns soeben erreicht. Sie haben [GER.GetAdjective] Agenten gesehen, die versuchen, die Region zu destabilisieren, um die Monroe-Doktrin zu stören und schließlich zu demontieren, und möchten sich nun unserer Loyalität gegenüber der Doktrin versichern."
wuw_GER_monroe.6.a:	"Wir werden die Doktrin unterstützen, genau wie bisher."
wuw_GER_monroe.6.a_tt:	"Wir werden unsere §GSupport§! für die Monroe-Doktrin lautstark zum Ausdruck bringen. Für den Fall, dass die Doktrin bröckelt, haben wir die Chance, noch §Garantien§! von [FROM.GetNameDef] zu erhalten. §Y[GER.GetFlag][GER.GetNameDefCap]§! wird uns nicht weiter beeinflussen können."
wuw_GER_monroe.6.b:	"Wir werden uns nicht verschließen."
wuw_GER_monroe.6.b_tt:	"Wir werden es ablehnen, in dieser Angelegenheit Stellung zu beziehen. Es mag Versuche von §Y[GER.GetNameWithFlag]§! geben, uns auf ihre Seite zu ziehen."
monroe_country_in_support_flag:	"Dieses Land hat bereits zur Unterstützung der Monroe-Doktrin Stellung bezogen."
wuw_GER_monroe.7.t:	"[FROM.GetAdjective] Ultimatum"
wuw_GER_monroe.7.desc:	"Ein stark formuliertes [FROM.GetAdjective] hat uns erreicht. Sie behaupten, dass ihre Bemühungen, die Monroe-Doktrin zu destabilisieren, erfolgreich waren und dass es nur eine Frage der Zeit ist, bis [USA.GetNameDef] die Doktrin endgültig auflöst. Um uns eine Chance zu geben, die Doktrin fallen zu lassen und ihren Zorn zu vermeiden, haben sie uns diese letzte Chance gegeben, uns der Doktrin zu widersetzen."
wuw_GER_monroe.7.a:	"Lassen Sie sie fallen, um den [FROM.GetAdjective] Zorn zu vermeiden!"
wuw_GER_monroe.7.b:	"Wir werden uns nicht bedrohen lassen!"
wuw_GER_monroe.8.t:	"[FROM.GetNameDefCap] verdoppelt die Monroe-Doktrin."
wuw_GER_monroe.8.desc:	"[FROM.GetAdjective] Führer [FROM.GetLeader] hat sich persönlich an uns gewandt. [FROM.GetLeader.GetSheHeCap] warnt uns, dass die Monroe-Doktrin immer noch gilt, trotz [GER.GetAdjective] Bemühungen, sie zu destabilisieren. Sie betonen, dass wir ihren Schutz genossen haben und dass dies mit der Verantwortung einhergeht, die Doktrin gemeinsam mit ihnen aufrechtzuerhalten."
wuw_GER_monroe.8.a:	"Gehen Sie zurück zur Doktrin"
wuw_GER_monroe.8.b:	"Wir haben die Monroe-Doktrin gar nicht erst angefordert!"
wuw_GER_monroe.8.c:	"Natürlich haben wir den Sturm einfach abgewartet."
wuw_GER_monroe.9.t:	"[FROM.GetNameDefCap] Demontiert die Monroe-Doktrin"
wuw_GER_monroe.9.desc:	"Unsere Bemühungen haben sich endlich ausgezahlt. Der Führer von [FROM.GetNameDef], [FROM.GetLeader] hat gerade die Abschaffung der Monroe-Doktrin angekündigt. Natürlich hat [FROM.GetLeader.GetSheHe] dies als etwas Schlechtes bezeichnet, aber wir wissen, dass die Länder, die früher unter die Doktrin fielen, diese Entwicklung begrüßen werden."
wuw_GER_monroe.9.a:	"Wunderbar!"
wuw_GER_monroe.10.t:	"[FROM.GetNameDefCap] demontiert teilweise die Monroe-Doktrin"
wuw_GER_monroe.10.desc:	"Unsere Bemühungen haben sich endlich ausgezahlt. Der Führer von [FROM.GetNameDef], [FROM.GetLeader], hat soeben die Abschaffung der Monroe-Doktrin angekündigt, aber nur teilweise. [FROM.GetLeader.GetSheHe] erklärt weiter, dass sie die Unabhängigkeit all derer garantieren wollen, die sich nicht gegen die Monroe-Doktrin aufgelehnt haben, weil sie das für richtig halten. Das könnte unseren Fortschritt in der Region behindern, aber auch das können wir sicher überwinden."
wuw_GER_monroe.10.a:	"Vorwärts"
wuw_GER_monroe.11.t:	"[FROM.GetNameDefCap] Teilweise Abschaffung der Monroe-Doktrin"
wuw_GER_monroe.11.desc:	"Unsere Bemühungen haben sich endlich ausgezahlt. Der Führer von [FROM.GetNameDef], [FROM.GetLeader] hat soeben die Abschaffung der Monroe-Doktrin angekündigt, aber nur teilweise. [FROM.GetLeader.GetSheHe] erklärt weiter, dass sie beabsichtigen, die Unabhängigkeit derjenigen zu garantieren, die die Monroe-Doktrin noch unterstützen. Auch wenn es jetzt weniger sind, behaupten sie, dass sie so stark sind wie eh und je. Das könnte unser Vorankommen in der Region behindern, hat uns aber keine große Hürde in den Weg gelegt. Sicherlich werden wir auch dies überwinden."
wuw_GER_monroe.11.a:	"Vorwärts"
wuw_GER_monroe.12.t:	"Krieg zwischen [USA.GetNameDef] und [GER.GetNameDef] beendet Streit um Monroe-Doktrin"
wuw_GER_monroe.12.desc:	"Der Streit um die Monroe-Doktrin, der auf niedrigem Niveau und mit geringer Intensität geführt wurde, ist verebbt, nachdem unsere beiden Länder in einen Krieg verwickelt wurden. Diplomatie und verdeckte Operationen in fremden Ländern erscheinen selbst den Politikern weit weg von der Front allzu bedeutungslos, da unsere Länder viel direkter aufeinandertreffen."
wuw_GER_monroe.12.a:	"Wir werden das Problem stattdessen mit Waffen lösen!"
wuw_GER_monroe.13.t:	"Ausländische Mächte, die auf eine Destabilisierung der Region abzielen"
wuw_GER_monroe.13.desc:	"Wir haben festgestellt, dass das Interesse von [GER.GetAdjective] Akteuren in der Region gestiegen ist. Unser Bericht enthält nur wenige Informationen, aber es hat den Anschein, dass versucht wird, die Monroe-Doktrin zu destabilisieren und im weiteren Verlauf sogar zu demontieren."
wuw_GER_monroe.13.a:	"Oh je..."
wuw_GER_monroe_news.1.t:	"Der Untergang der Monroe-Doktrin"
wuw_GER_monroe_news.1.desc:	"Nach umfangreichem Druck und diplomatischen Bemühungen von [GER.GetNameDef] ist die so genannte Monroe-Doktrin gefallen. Die Doktrin wurde von [USA.GetNameDef] eingeführt, um Amerika zu schützen, und hat den Frieden auf dem Kontinent zumindest bis zu einem gewissen Grad gesichert. Die Motive der [GER.GetAdjective], dies zu tun, bleiben unklar."
wuw_GER_monroe_news.1.a:	"Wahrlich wunderbar"
wuw_GER_monroe_news.1.b:	"Wie furchtbar"
wuw_GER_monroe_news.1.c:	"Ein großartiger Tag!"
wuw_GER_monroe_news.1.d:	"Ein furchtbarer Tag!"
GER_crushed_the_monroe_doctrine_good:	"Zerschmetterte die Monroe-Doktrin"
GER_crushed_the_monroe_doctrine_bad:	"Zerschlug die Monroe-Doktrin"
GER_saved_the_monroe_doctrine_bad:	"Verstärkt die Monroe-Doktrin"
GER_supported_the_monroe_doctrine_good:	"Unterstützte die Monroe-Doktrin"
GER_opposed_the_monroe_doctrine_good:	"Gegen die Monroe-Doktrin"
germany_mefo_bills.1.t:	"Die Zukunft des deutschen Aufrüstungsprogramms"
germany_mefo_bills.1.desc:	"Die finanziellen Belastungen des Aufrüstungsprogramms drohen unsere Wirtschaft zusammenbrechen zu lassen. Wenn wir die Rüstungsproduktion auf dem gleichen Niveau wie bisher halten wollen, müssen wir nach neuen Wegen der Finanzierung suchen - oder unsere Prioritäten ändern."
germany_mefo_bills.1.a:	"Aufrüstung war schon immer unser Ziel"
germany_mefo_bills.1.b:	"Das Programm ist zu teuer"
germany_mefo_bills.2.t:	"Wachsende Kosten der Aufrüstung"
germany_mefo_bills.2.desc:	"Unser Aufrüstungsprogramm, das zwar notwendig und mit edlen Absichten verbunden ist, bereitet einigen unserer Wirtschaftswissenschaftler Sorgen. Sie befürchten, dass die militärische Produktion immer mehr Mittel benötigen wird, um sich selbst zu erhalten. Wir müssen ein wachsames Auge darauf haben, dass die Militärausgaben nicht außer Kontrolle geraten."
germany_mefo_bills.2.a:	"Wir werden es schon schaffen"
germany_mefo_bills.3.t:	"Wachsende Besorgnis über Aufrüstung"
germany_mefo_bills.3.desc:	"Während unsere Aufrüstungsbemühungen immer stärker werden, wächst auch die Last, die Programme finanziert zu halten. Die militärische Produktion beansprucht inzwischen einen beträchtlichen Teil der Finanzen unserer Nation, was immer mehr Menschen um die Stabilität unserer Wirtschaft besorgt macht. Wenn es uns nicht gelingt, die Militärausgaben niedrig zu halten, wird dies unsere Wirtschaft schwer beeinträchtigen."
germany_mefo_bills.3.a:	"Wir müssen alternative Mittel finden"
germany_mefo_bills.4.t:	"Militärische Produktion verursacht Wirtschaftskrise"
germany_mefo_bills.4.desc:	"Die Militärausgaben haben ein noch nie dagewesenes Niveau erreicht und unsere Finanzen stark belastet. Ohne eine sofortige Finanzierung wird unsere Rüstungsproduktion zum Stillstand kommen, und unsere Wirtschaft insgesamt wird unter der Last des Versuchs, sie anzukurbeln, unter Druck geraten."
germany_mefo_bills.4.a:	"Wir können nicht zulassen, dass diese Krise weitergeht!"
GER_mefo_bills_warning_tt:	"§Y[GetMilitaryProductionModifierName]§! hat $MODIFIER_CONSUMER_GOODS_FACTOR$ erreicht: §Y[?ROOT.GER_industrial_consumer_goods_factor|1%]§!"
wuw_GER_military_events.2.t:	"Pilot spart [USA.GetAdjective] Bomberbesatzung"
wuw_GER_military_events.2.desc:	"Nach intensiven Bombenangriffen auf unsere Militärindustrie ist eine unwahrscheinliche Geschichte aufgetaucht. Trotz des klaren Befehls, jedes feindliche Flugzeug, das unseren Luftraum verletzt, abzuschießen, hat sich ein Kampfpilot geweigert, dies zu tun. Der Pilot, ein gewisser Franz Stigler, stieß kurz nach einem Bombenangriff auf einen verkrüppelten Bomber und entschied sich, das Feuer auf ihn nicht zu eröffnen. Er rechtfertigt sein Handeln damit, dass der verkrüppelte Bomber sich nicht von Männern in Fallschirmen unterscheidet und dass es genauso abscheulich wäre, auf sie zu schießen. Nachdem er zunächst versucht hatte, mit der Besatzung des Bombers zu kommunizieren, um sie zur Landung in [GER.GetNameDef] und zur Kapitulation zu bewegen oder zumindest auf neutrales Territorium zu fliegen, gab Stigler diese anständigen Bemühungen auf und eskortierte stattdessen den feindlichen Bomber in Sicherheit.\n\nFranz Stigler ist ein talentierter Pilot, aber wenn man ihn so weitermachen lässt, könnten er und seine trotzigen Aktionen uns Probleme bereiten."
wuw_GER_military_events.2.a:	"Wir werden ihn am Leben lassen, aber das darf sich nicht wiederholen!"
wuw_GER_military_events.2.b:	"Statuieren Sie ein Exempel an ihm!"
wuw_GER_military_events.2.c:	"Kein einziges Wort darüber."
wuw_GER_diplomacy.1.t:	"[FROM.GetNameDefCap] bietet eine Handelspartnerschaft an"
wuw_GER_diplomacy.1.a:	"Wir werden beide davon profitieren."
wuw_GER_diplomacy.1.b:	"Dieser Handel wird nur für einen von uns von Vorteil sein..."
wuw_GER_diplomacy.2.t:	"[FROM.GetNameDefCap] hat unser Handelsangebot angenommen"
wuw_GER_diplomacy.2.desc:	"[FROM.GetLeader] scheint ein vernünftiger Führer zu sein, der die besten Interessen von [FROM.GetLeader.GetHerHis] Land im Auge hat. Zufälligerweise liegt dies auch im Interesse unseres Landes. Wir werden die zusätzlichen Ressourcen von [FROM.GetName] gut nutzen."
wuw_GER_diplomacy.3.t:	"[FROM.GetNameDefCap] hat unseren Handelsvorschlag abgelehnt"
wuw_GER_diplomacy.3.desc:	"[FROM.GetLeader] scheint ein unvernünftiger und unkluger Führer zu sein, dem das Beste für [FROM.GetLeader.GetHerHis] Land völlig egal ist. Wir werden uns anderswo umsehen, um zu finden, was wir suchen."
wuw_GER_diplomacy.3.a:	"Ihr Verlust."
wuw_GER_diplomacy.10.a:	"Wir wagen es nicht, Nein zu sagen...."
wuw_GER_diplomacy.10.b:	"Das ist inakzeptabel!"
wuw_GER_diplomacy.11.t:	"[FROM.GetNameDefCap] durchkreuzt unsere Pläne"
wuw_GER_diplomacy.11.desc:	"In unmissverständlichen Worten haben uns [FROM.GetLeader] von [FROM.GetName] wissen lassen, was [FROM.GetLeader.GetSheHe] von unserem jüngsten Versuch hält, ihre Innenpolitik zu beeinflussen. Unnötig zu erwähnen, dass unsere Diplomaten Teile der Nachricht umformulieren mussten, bevor sie sie [ROOT.GetLeader] vorlegen konnten."
wuw_GER_diplomacy.11.a:	"Eine Frechheit!"
wuw_GER_diplomacy.20.t:	"Eine Einladung an den [FROM.GetFactionName]"
wuw_GER_diplomacy.20.desc:	"[FROM.GetLeader] hat persönlich eine Einladung an den [FROM.GetFactionName] zum [ROOT.GetLeader] ausgesprochen. Vertreter des [FROM.GetAdjective] Oberkommandos versichern uns, dass wir zusammen mit ihrer bereits formidablen Allianz unsere gemeinsamen Feinde mühelos besiegen und die Vorherrschaft des [ROOT.GetAdjective] in unserer Umgebung sicherstellen werden."
wuw_GER_diplomacy.20.a:	"Gemeinsam für den Sieg!"
wuw_GER_diplomacy.20.b:	"Wir haben andere Pläne"
wuw_GER_diplomacy.21.t:	"[FROM.GetNameDefCap] schließt sich dem [ROOT.GetFactionName] an"
wuw_GER_diplomacy.21.desc:	"Unser militärisches Oberkommando hat es zusammen mit geschickten Diplomaten geschafft, [FROM.GetLeader] und die [FROM.GetAdjective] Regierung davon zu überzeugen, sich mit uns zu verbünden, um unsere gemeinsamen Feinde zu vernichten. Natürlich brauchen wir ihre Hilfe nicht wirklich, um unsere Feinde zu vernichten, aber ihre Soldaten werden sich als Kanonenfutter eignen, während unsere Männer jeden Widerstand niederschlagen."
wuw_GER_diplomacy.21.a:	"Willkommen in der Herde!"
wuw_GER_diplomacy.22.t:	"[FROM.GetNameDefCap] lehnt unsere Einladung ab"
wuw_GER_diplomacy.22.desc:	"Trotz unserer besten Bemühungen und der offensichtlichen Vorteile, die [FROM.GetNameDef] durch den Zusammenschluss unserer Streitkräfte gewinnen würde, haben [FROM.GetLeader] und die [FROM.GetAdjective] Regierung die irrige Entscheidung getroffen, unsere Einladung zum Beitritt in die [ROOT.GetFactionName] abzulehnen. Das wird für uns natürlich nicht viel ändern, denn diese Einladung war eher zum Nutzen von [FROM.GetName]."
wuw_GER_diplomacy.22.a:	"Mal sehen, wie lange sie alleine bleiben"
wuw_GER_diplomacy.23.t:	"[FROM.GetNameDefCap] Erbitten Kontrolle über ehemalige Kolonien"
wuw_GER_diplomacy.23.desc:	"Der [FROM.GetAdjective] Anführer [FROM.GetLeader] ist mit einem Vorschlag für einen Deal an uns herangetreten, der, zumindest laut [FROM.GetLeader.GetHerHis], von beiderseitigem Nutzen ist. [FROM.GetLeader.GetHerHis] möchte seine ehemaligen Kolonien zurückhaben, bietet aber im Gegenzug Einblick in seine Panzerproduktion und ein Friedensversprechen zwischen unseren Ländern."
wuw_GER_diplomacy.23.a:	"Die [FROM.GetADjective] machen ein überzeugendes Argument"
wuw_GER_diplomacy.23.b:	"Das nützt uns überhaupt nichts!"
wuw_GER_diplomacy.24.t:	"Die [FROM.GetAdjective] übertragen ehemalige [ROOT.GetAdjective] Kolonien"
wuw_GER_diplomacy.24.desc:	"Wir haben eine höchst willkommene Nachricht von [FROM.GetNameDef] erhalten. Sie haben die Vorteile des von uns vorgeschlagenen Deals erkannt und alle unsere alten Kolonien, die bisher unter ihrer Kontrolle standen, in unseren Besitz überführt."
wuw_GER_diplomacy.24.a:	"Wunderbare Neuigkeiten!"
wuw_GER_diplomacy.25.t:	"Die [FROM.GetAdjective] lehnt es ab, unsere alten Kolonien an uns zu übertragen."
wuw_GER_diplomacy.25.desc:	"Wir hielten [FROM.GetLeader] von [FROM.GetNameDef] für einen äußerst vernünftigen Mann, aber es scheint, dass wir uns geirrt haben könnten. Die [FROM.GetAdjective] weigern sich hartnäckig, den von uns vorgeschlagenen Deal anzunehmen, trotz der offensichtlichen Vorteile, die er ihnen gebracht hätte. Wir werden einfach auf unsere alten Kolonien verzichten müssen."
wuw_GER_diplomacy.25.a:	"Eine schlechte Entscheidung von ihrer Seite..."
wuw_GER_diplomacy.26.t:	"Ein Vorschlag für gemeinsame Forschung"
wuw_GER_diplomacy.26.desc:	"Der [FROM.GetAdjective] Anführer [FROM.GetLeader] ist mit einem Vorschlag für eine wissenschaftliche Zusammenarbeit an uns herangetreten. [FROM.GetLeader.GetSheHeCap] erklärt, dass wir zwar ähnliche Ideologien haben, aber sehr unterschiedliche Schwerpunkte in Bezug auf die Führung unserer Flotten, so dass sich hier eine gute Gelegenheit zur Zusammenarbeit bietet. Wenn wir diesem Pakt zustimmen, müssen wir einige unserer Erkenntnisse mit ihnen teilen, aber wir können auch von ihnen lernen."
wuw_GER_diplomacy.26.a:	"Hört sich fair an"
wuw_GER_diplomacy.26.b:	"Das ist für uns nicht von Interesse"
wuw_GER_diplomacy.27.t:	"[FROM.GetNameDefCap] Vereinbart gemeinsame Forschungsanstrengungen"
wuw_GER_diplomacy.27.desc:	"Die [FROM.GetAdjective] Führung hat sehr positiv auf unsere vorgeschlagenen gemeinsamen Forschungsbemühungen reagiert. Da sich unsere Bemühungen im Bereich der Marine stark unterscheiden, sehen auch sie den Wert darin, voneinander zu lernen, damit wir gemeinsam immer stärker werden."
wuw_GER_diplomacy.27.a:	"Großartig!"
wuw_GER_diplomacy.28.t:	"[FROM.GetNameDefCap] lehnt unseren Forschungsvorschlag ab"
wuw_GER_diplomacy.28.desc:	"Die Antwort von [FROM.GetNameDef] war nicht das, was wir uns erhofft hatten. Sie scheinen nicht gewillt zu sein, ihre Erkenntnisse auf dem Gebiet der Schiffstechnik mit uns zu teilen, selbst wenn wir ihnen ein äußerst vorteilhaftes Angebot machen, indem wir ihnen anbieten, unsere eigenen Erkenntnisse mit ihnen zu teilen. Zusammen mit der Ablehnung kommt die Aussage, dass die [FROM.GetAdjective] Marine unserer eigenen weit überlegen ist und dass, solange wir keine bedeutenden Fortschritte in der Marinetechnik gemacht haben, jede Art von Deal wie dieser vom Tisch ist."
wuw_GER_diplomacy.29.t:	"Alter Verbündeter schlägt Handelsabkommen vor"
wuw_GER_diplomacy.29.desc:	"Es gab Zeiten, in denen wir [FROM.GetNameDef], oder zumindest ihren Vorläufer, als unseren Verbündeten betrachteten. In den letzten Jahren haben wir uns auseinandergelebt, aber es scheint, dass sie die Freundschaft wieder aufleben lassen wollen. Mit dem Vorschlag eines für beide Seiten vorteilhaften Handelsabkommens haben uns die [FROM.GetAdjective] wieder einmal die Hand gereicht."
wuw_GER_diplomacy.29.a:	"Unerwartet, aber willkommen!"
wuw_GER_diplomacy.29.b:	"Das klingt dubios..."
wuw_GER_diplomacy.30.t:	"[FROM.GetAdjective] Akzeptanz des Handelsvorschlags"
wuw_GER_diplomacy.30.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat positiv auf unser vorgeschlagenes Handelsabkommen reagiert. Wir hatten schon früher sehr vorteilhafte Handelsabkommen mit ihnen und [ROOT.GetLeader] ist sehr zuversichtlich, dass uns dies viel Gewinn bringen wird."
wuw_GER_diplomacy.30.a:	"Großartige Neuigkeiten!"
wuw_GER_diplomacy.31.t:	"[FROM.GetAdjective] Ablehnung unseres Handelsvorschlags"
wuw_GER_diplomacy.31.desc:	"Trotz unserer historischen Bindungen und des klaren Nutzens für sie hat [FROM.GetNameDef] das von uns vorgeschlagene Handelsabkommen abgelehnt. Das Abkommen hätte mehr Handel zwischen unseren beiden Ländern ermöglicht und unsere Freundschaft gefestigt. Leider scheint es, dass die [FROM.GetAdjective] andere Vorstellungen hatten."
wuw_GER_diplomacy.31.a:	"Ihr Verlust"
wuw_GER_diplomacy.32.t:	"[FROM.GetAdjective] Antrag auf Wiederaufnahme der Pacht von [743.GetName]"
wuw_GER_diplomacy.32.desc:	"In Verhandlungen im Jahr 1898 wurde [743.GetName] an das damalige Deutsche Reich verpachtet. Heute hat sich deren Nachfolger, [FROM.GetNameDef], an uns gewandt und möchte diesen Pachtvertrag wieder aufnehmen. Der ursprüngliche Pachtvertrag sollte bis 1997 laufen, wurde aber durch den Ersten Weltkrieg und die Besetzung durch [JAP.GetAdjective] unterbrochen."
wuw_GER_diplomacy.32.a:	"Wir haben kein Interesse daran, diesen Pachtvertrag wieder aufzunehmen."
wuw_GER_diplomacy.32.b:	"Wir werden unseren ursprünglichen Vertrag einhalten"
wuw_GER_diplomacy.33.t:	"[FROM.GetNameDefCap] weigert sich, zu unserer Abmachung zurückzukehren"
wuw_GER_diplomacy.33.desc:	"Unser Deal von 1898 war klar, [743.GetName] gehörte uns bis 1997, doch die [FROM.GetAdjective] scheinen kalte Füße bekommen zu haben. Sie scheinen zu glauben, dass nur wegen dieses Krieges und der anschließenden [JAP.GetAdjective] Besatzung unser Abkommen nicht mehr gültig ist. Der Deal enthält keine solche Klausel, aber es scheint, dass wir kaum eine Wahl haben. Wenn wir [743.GetName] zurückhaben wollen, müssen wir vielleicht zu drastischeren Maßnahmen greifen."
wuw_GER_diplomacy.33.a:	"Wie unhöflich von denen!"
wuw_GER_diplomacy.34.t:	"[FROM.GetNameDefCap] kehrt zum [743.GetName] Pachtvertrag zurück"
wuw_GER_diplomacy.34.desc:	"Die [FROM.GetAdjective] haben sich als die treuesten Partner erwiesen. Ursprünglich unterzeichneten wir den 99-jährigen Pachtvertrag für [743.GetName] im Jahr 1898, aber der Pachtvertrag wurde unterbrochen, als der Große Krieg über die Welt hereinbrach. Nachdem das Gebiet eine Zeit lang von [JAP.GetNameDef] besetzt war, wurde es an [FROM.GetNameDef] zurückgegeben, aber glücklicherweise werden sie unseren Vertrag einhalten."
wuw_GER_diplomacy.34.a:	"Wunderbare Neuigkeiten!"
wuw_GER_diplomacy.35.t:	"[FROM.GetNameDefCap] bittet um Kontrolle über ehemalige Kolonien"
wuw_GER_diplomacy.35.desc:	"Wir haben eine Nachricht von [FROM.GetAdjective] Anführer [FROM.GetLeder] erhalten. [FROM.GetLeader.GetSheHe] möchte die Kontrolle über seine ehemaligen Kolonien zurückgewinnen, die sich derzeit unter unserer Kontrolle befinden. Die Mitteilung scheint harmlos zu sein, aber in Anbetracht des aktuellen Stands der Politik von [FROM.GetNameDef] könnte es schlimme Folgen haben, sollten wir ablehnen."
wuw_GER_diplomacy.35.a:	"Dieses Land gehört ihnen nicht!"
wuw_GER_diplomacy.35.b:	"Es ist das Risiko nicht wert, sie abzulehnen!"
wuw_GER_diplomacy.36.t:	"[FROM.GetAdjective] Weigerung, unsere Kolonien zu übertragen"
wuw_GER_diplomacy.36.desc:	"Wir dachten, wir hätten [FROM.GetNameDef] klargemacht, dass die Übertragung unserer rechtmäßigen Kolonien nicht optional ist. Dennoch weigern sie sich hartnäckig, das zu tun, was richtig und das Beste für sie ist. Wir erheben immer noch Anspruch auf dieses Gebiet, und sie haben kein Recht, sich uns in den Weg zu stellen!"
wuw_GER_diplomacy.36.a:	"Dieses Land gehört uns!"
wuw_GER_diplomacy.37.t:	"[FROM.GetNameDefCap] Tritt Territorium an uns ab"
wuw_GER_diplomacy.37.desc:	"Unsere Bitte, unsere Kolonien von [FROM.GetNameDef] zurückzubekommen, wurde von [FROM.GetLeader] mit Verständnis und Nachsicht beantwortet. Mit dem Hinweis, dass sie unsere Beziehungen höher einschätzen als das Territorium, haben sie uns das Land, das rechtmäßig uns gehört, gnädigerweise wieder zurückgegeben."
wuw_GER_diplomacy.37.a:	"Eine weise Entscheidung"
wuw_GER_diplomacy.38.t:	"[FROM.GetAdjective] Fordert Territorium"
wuw_GER_diplomacy.38.desc:	"[GetGERAfricanColonyOverlordDesc]"
GER_is_not_colonial_overlord_desc:	"Wir haben Forderungen erhalten, unser Territorium an [FROM.GetNameDef] abzutreten. Aus historischen Gründen behaupten sie, dass sie die rechtmäßigen Besitzer dieser Ländereien sind. Die Forderung ist recht harsch formuliert, aber wir haben immer noch die Möglichkeit, nach unseren eigenen Vorstellungen zu reagieren."
GER_is_colonial_overlord_desc:	"Wir hatten befürchtet, dass dieser Tag kommen würde, und doch gehofft, dass er nicht kommen würde. [FROM.GetLeader] von [FROM.GetNameDef] hat verlangt, dass wir als [FROM.GetLeader.GetHerHis] Untertanen unsere Unabhängigkeit aufgeben und Teil von [FROM.GetNameDef] selbst werden. Unsere Meinung spielt in dieser Frage keine Rolle mehr, wir können nichts anderes tun, als uns zu fügen."
wuw_GER_diplomacy.38.a:	"[GetGERAfricanColonyOverlordOption]"
GER_is_not_colonial_overlord_option:	"Vorsicht ist besser als Nachsicht..."
GER_is_colonial_overlord_option:	"Wir hatten einen guten Lauf"
wuw_GER_diplomacy.38.b:	"Auf gar keinen Fall!"
wuw_GER_diplomacy.39.t:	"[FROM.GetNameDefCap] Tritt Territorium an uns ab"
wuw_GER_diplomacy.39.desc:	"Unsere Forderungen an die [FROM.GetAdjective]-Führung sind auf widerwillige Zustimmung gestoßen. Sie scheinen zwar nicht sehr glücklich darüber zu sein, ihr Territorium abzugeben, aber das geht uns nichts an, wir wollen das Territorium, das uns rechtmäßig gehört."
wuw_GER_diplomacy.39.a:	"Großartig!"
wuw_GER_diplomacy.40.t:	"[FROM.GetNameDefCap] lehnt unsere territorialen Forderungen ab"
wuw_GER_diplomacy.40.desc:	"Trotz des immer stärkeren Drucks auf [FROM.GetAdjective] Anführer [FROM.GetLeader] und den Rest der [FROM.GetAdjective] Führung werden sie nicht nachgeben. Wir werden nicht in der Lage sein, friedlich die Kontrolle über unsere alten Kolonien zu übernehmen, die sich derzeit unter ihrer Kontrolle befinden."
wuw_GER_diplomacy.40.a:	"Wir werden einen anderen Weg finden"
wuw_GER_diplomacy.100.t:	"[FROM.GetAdjective] Besatzungskosten-Zahlungen gestoppt"
wuw_GER_diplomacy.100.desc:	"Der Botschafter von [FROM.GetName] hat uns wissen lassen, dass wir die vereinbarte Zahlung der Besatzungskosten nicht mehr erhalten werden."
wuw_GER_diplomacy.100.a:	"So sei es"
wuw_GER_diplomacy.50.t:	"[FROM.GetNameDefCap] will die Entwicklungszusammenarbeit der Marine einleiten"
wuw_GER_diplomacy.50.desc:	"\nDiplomaten und Marineingenieure von [FROM.GetNameDef] sind mit einem merkwürdigen Angebot an uns herangetreten. Sie behaupten, dass sie ein umfangreiches Programm zur Zusammenarbeit im Bereich der Marine starten wollen, um Entwicklungen und Techniken zwischen unseren beiden Ländern auszutauschen. Das könnte für uns von Vorteil sein, birgt aber auch das Risiko, dass geheime Informationen an die [FROM.GetAdjective] durchsickern. Was sagen wir dazu?"
wuw_GER_diplomacy.50.a:	"Großartig!"
wuw_GER_diplomacy.50.b:	"Keine Zusammenarbeit mit den Krauts!"
wuw_GER_diplomacy.51.t:	"[FROM.GetNameDefCap] Akzeptiert Entwicklungszusammenarbeit der Marine"
wuw_GER_diplomacy.51.desc:	"[FROM.GetLeader] hat sich heute für den Deal ausgesprochen, den wir ihnen vor kurzem für die Zusammenarbeit bei der Marine vorgeschlagen haben, und behauptet, dass [FROM.GetAdjective] Marineingenieure bereits nächste Woche mit der gemeinsamen Entwicklung und Erforschung von Marineschiffen und Waffen beginnen wollen. Dies ist ein großer Tag für [ROOT.GetNameDef] und ihre Marine!"
wuw_GER_diplomacy.51.a:	"Unsere Marine wird wieder stark werden"
wuw_GER_diplomacy.52.t:	"[FROM.GetNameDefCap] lehnt Zusammenarbeit bei der Marineentwicklung ab"
wuw_GER_diplomacy.52.desc:	"[FROM.GetLeader] hat sich heute gegen den Deal ausgesprochen, den wir ihnen kürzlich für die Zusammenarbeit im Marinebereich vorgeschlagen haben, und behauptet, dass es sich dabei um einen klaren und offensichtlichen Trick handelt, um [FROM.GetAdjective] technische Geheimnisse zu stehlen..."
wuw_GER_diplomacy.52.a:	"Eine törichte Entscheidung"
wuw_GER_diplomacy.53.t:	"[FROM.GetNameDefCap] bietet eine Handelspartnerschaft an"
wuw_GER_diplomacy.53.desc:	"Diplomaten von [FROM.GetNameDef] haben sich wegen eines lukrativen Angebots an uns gewandt. Sie möchten die Rechte an bestimmten Rohstoffvorkommen in unseren Kolonien erwerben und bieten im Gegenzug industrielle Hilfe an. Sollten wir dieses Angebot annehmen?"
wuw_GER_diplomacy.53.a:	"Wir können beide davon profitieren."
wuw_GER_diplomacy.53.b:	"Von diesem Geschäft wird nur einer von uns profitieren..."
wuw_GER_diplomacy.54.t:	"[FROM.GetNameDefCap] hat unser Handelsangebot angenommen"
wuw_GER_diplomacy.54.desc:	"[FROM.GetLeader] scheint ein vernünftiger Führer zu sein, der die Interessen von [FROM.GetLeader.GetHerHis] Land im Auge hat. Zufälligerweise liegt dies auch im Interesse unseres Landes. Wir werden die zusätzlichen Ressourcen von [FROM.GetName] gut nutzen."
wuw_GER_diplomacy.54.a:	"Perfekt!"
wuw_GER_diplomacy.55.t:	"[FROM.GetNameDefCap] hat unser Handelsangebot abgelehnt"
wuw_GER_diplomacy.55.desc:	"[FROM.GetLeader] scheint ein unvernünftiger und unkluger Anführer zu sein, dem es egal ist, was das Beste für [FROM.GetLeader.GetHerHis] Land ist. Wir werden uns anderswo umsehen, um zu finden, was wir suchen."
wuw_GER_diplomacy.55.a:	"Ihr Verlust."
wuw_GER_diplomacy.56.t:	"[FROM.GetNameDefCap] leert unsere Konten"
wuw_GER_diplomacy.56.desc:	"[FROM.GetAdjective] Beamte und Banker haben uns den Zugang zu unseren Konten in Deutschland abgeschnitten und sie geleert. Das bedeutet, dass [GER.GetNameDef] unser Geld aus dem Gömbös-Handelsvertrag beschlagnahmt hat und ihn damit im Grunde zunichte macht. Wir können ihrem Wort nie wieder trauen..."
wuw_GER_diplomacy.56.a:	"Wie können sie es wagen!"
wuw_GER_diplomacy.57.t:	"[FROM.GetNameDefCap] Fordert die Rückgabe von Nordschleswig"
wuw_GER_diplomacy.57.desc:	"\nDie Rhetorik von [FROM.GetLeader] und der [FROM.GetAdjective] Regierung ist in letzter Zeit sehr viel feindseliger uns gegenüber geworden. Sie behaupten, dass die Volksabstimmungen von 1920 in Schleswig unrechtmäßig und betrügerisch waren, und fordern nun, dass wir das Gebiet an sie zurückgeben. Wir wissen, dass dies nicht stimmt, aber vielleicht wäre es das Beste, einen offenen Konflikt mit [FROM.GetNameDef] zu vermeiden?"
wuw_GER_diplomacy.57.a:	"Wir wollen keinen Konflikt, also müssen wir nachgeben..."
wuw_GER_diplomacy.57.b:	"Sie können kommen und es sich holen!"
wuw_GER_diplomacy.58.t:	"[FROM.GetNameDefCap] gibt unseren Forderungen nach"
wuw_GER_diplomacy.58.desc:	"[FROM.GetLeader] hat erklärt, dass sie nicht in einen bewaffneten Konflikt gegen uns eintreten wollen und sich daher dafür entschieden haben, das 1920 bei der Volksabstimmung in Schleswig gewonnene Gebiet zurückzugeben. Die Menschen in der Region jubeln, denn sie sind wieder in den Schoß der Gemeinschaft zurückgekehrt."
wuw_GER_diplomacy.58.a:	"Ein großer Tag für das [ROOT.GetAdjective] Volk!"
wuw_GER_diplomacy.59.t:	"[FROM.GetNameDefCap] Bleibt bei der Volksabstimmung in Schleswig standhaft"
wuw_GER_diplomacy.59.desc:	"\nDer übermütige [FROM.GetLeader] hat verfügt, dass Nordschleswig immer [FROM.GetAdjective] ist und bleiben wird. [FROM.GetNameDefCap]s Truppen haben mobilisiert und werden schnell an unsere Grenze verlegt, denn es scheint, dass sie sich für einen Krieg rüsten. Wie sollen wir auf diese Provokation reagieren?"
wuw_GER_diplomacy.59.a:	"Dann werden wir es ihnen aus ihren kalten Händen reißen!"
wuw_GER_diplomacy.59.b:	"Wir sollten wirklich nicht eskalieren..."
wuw_GER_mutual_guarantees.1.t:	"[FROM.GetNameDefCap] Bittet um gegenseitige Zusammenarbeit"
wuw_GER_mutual_guarantees.1.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] ist mit einem Angebot für gegenseitige Garantien und Zusammenarbeit an uns herangetreten. Das Angebot würde sich auf den gegenseitigen Schutz der Ländereien des jeweils anderen erstrecken und könnte sich in der Zukunft zu etwas noch Größerem entwickeln. Was sagen wir dazu?"
wuw_GER_mutual_guarantees.1.a:	"Es ist ein für beide Seiten vorteilhaftes Geschäft"
wuw_GER_mutual_guarantees.1.b:	"Wir sehen keinen Wert in diesem Pakt"
wuw_GER_mutual_guarantees.2.t:	"[FROM.GetNameDefCap] Begrüßt die gegenseitige Zusammenarbeit"
wuw_GER_mutual_guarantees.2.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unser Ersuchen um gegenseitige Zusammenarbeit und Garantien akzeptiert und unsere Diplomaten mit offenen Armen empfangen. Er behauptet, dass wir unsere Nationen nur gemeinsam vor fremden Mächten schützen können, die das Gleichgewicht bedrohen."
wuw_GER_mutual_guarantees.2.a:	"Großartig"
wuw_GER_mutual_guarantees.3.t:	"[FROM.GetNameDefCap] verweigert gegenseitige Zusammenarbeit"
wuw_GER_mutual_guarantees.3.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unser Ersuchen um einen Pakt des gegenseitigen Schutzes und der Zusammenarbeit abgelehnt und behauptet, dies sei ein Weg für uns, nicht nur heimlich die Herzen ihres Volkes zu infiltrieren, um es zu schwächen, sondern auch ein Trick, um schließlich die Herrschaft über ihren Staat zu erlangen. Sie begreifen wirklich nicht, welches Angebot sie sich entgehen lassen..."
wuw_GER_mutual_guarantees.3.a:	"Sie begehen einen großen Fehler"
wuw_GER_weltpolitik.1.t:	"[FROM.GetName] fordert die Rückgabe der ehemaligen Kolonialgebiete"
wuw_GER_weltpolitik.1.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat sich mit einer interessanten Bitte an uns gewandt. Sie bitten darum, dass wir ihnen alte [FROM.GetAdjective] Kolonialgebiete zurückgeben, im Austausch für eine Vertiefung der Beziehungen zwischen unseren Ländern und ihre offizielle Unterstützung unserer Regierung auf globaler Ebene. Das scheint ein wenig einseitig zu sein, aber vielleicht ist es ja das Beste?"
wuw_GER_weltpolitik.1.a:	"Alles für unsere Freunde"
wuw_GER_weltpolitik.1.b:	"Nein, sie gehören jetzt uns"
wuw_GER_weltpolitik.2.t:	"[FROM.GetNameDefCap] gibt unsere Kolonien zurück"
wuw_GER_weltpolitik.2.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat unsere Bitte um die Rückgabe unserer ehemaligen Kolonien akzeptiert und erklärt, dass sie in unseren Händen besser aufgehoben sind. Die Menschen feiern auf den Straßen, denn es scheint, dass das [ROOT.GetAdjective] Kolonialreich endlich wieder auf der Landkarte steht."
wuw_GER_weltpolitik.2.a:	"Wir nähern uns schnell einem neuen Goldenen Zeitalter!"
wuw_GER_weltpolitik.3.t:	"[FROM.GetNameDefCap] gibt unsere Kolonien nicht zurück"
wuw_GER_weltpolitik.3.desc:	"\n[FROM.GetLeader] von [FROM.GetNameDef] hat unsere Bitte um die Rückgabe unserer alten Kolonien abgelehnt und behauptet, es handele sich um einen einseitigen Deal, bei dem sie wenig bis gar nichts zu gewinnen hätten."
wuw_GER_weltpolitik.3.a:	"Das sollte es nicht sein..."
wuw_GER_diplomacy.60.t:	"[FROM.GetNameDefCap] Fordert Nordschleswig"
wuw_GER_diplomacy.60.desc:	"\nDie Rhetorik von [FROM.GetLeader] und der [FROM.GetAdjective] Regierung ist gegenüber unseren lokalen Verwaltern in [912.GetName] feindseliger geworden. Sie behaupten, dass Nordschleswig schon immer deutsch war und immer deutsch sein wird, und fordern nun, dass wir das Gebiet an sie zurückgeben. Wir wissen, dass dies nicht stimmt, aber vielleicht wäre es das Beste, einen offenen Konflikt mit [FROM.GetNameDef] zu vermeiden?"
wuw_GER_diplomacy.60.a:	"Sie haben Recht"
wuw_GER_diplomacy.60.b:	"Sind sie wahnhaft?"
wuw_GER_diplomacy.61.t:	"[FROM.GetNameDefCap] beugt sich unseren Forderungen"
wuw_GER_diplomacy.61.desc:	"[FROM.GetLeader] hat erklärt, dass sie nicht in einen bewaffneten Konflikt mit uns eintreten wollen und sich daher für die Rückgabe des Gebiets von [912.GetName] entschieden haben. Die Menschen in der Region jubeln, denn sie sind wieder in den Schoß des Staates zurückgeholt worden."
wuw_GER_diplomacy.61.a:	"Ein großer Tag für das [ROOT.GetAdjective] Volk!"
wuw_GER_diplomacy.62.t:	"[FROM.GetNameDefCap] Steht fest in [912.GetName]"
wuw_GER_diplomacy.62.desc:	"\nDer übermütige [FROM.GetLeader] hat verfügt, dass Nordschleswig immer [FROM.GetAdjective] ist und bleiben wird. Die Truppen von [FROM.GetNameDefCap] sind mobilisiert und werden in der Region stationiert, um eine Invasion zu verhindern. Wie sollten wir auf diese Provokation reagieren?"
wuw_GER_diplomacy.62.a:	"Wir werden keine Kompromisse bei der Freiheit unseres Volkes eingehen!"
wuw_GER_diplomacy.62.b:	"Wir sollten die Sache wirklich nicht eskalieren lassen..."
wuw_GER_diplomacy.63.t:	"[FROM.GetNameDefCap] Ergreift [912.GetName]"
wuw_GER_diplomacy.63.desc:	"\nUnser Oberherr [FROM.GetLeader] hat verfügt, dass Nordschleswig immer [FROM.GetAdjective] ist und bleiben wird. [FROM.GetNameDefCap]s Truppen sind in die Region eingezogen, und ihre neuen lokalen Verwalter haben unsere Politiker gezwungen, ein Gesetz zu unterzeichnen, das ihnen das Gebiet für die nächsten 100 Jahre überlässt."
wuw_GER_diplomacy.63.a:	"Leider können wir nicht viel tun, um sie aufzuhalten..."
GER_seized_north_schleswig:	"Deutschland hat Nordschleswig beschlagnahmt"
wuw_GER_chinese_diplomacy.1.t:	"[FROM.GetNameDefCap] Schickt uns Waffen und Material"
wuw_GER_chinese_diplomacy.1.desc:	"\nUnsere großen Verbündeten im Westen, die [FROM.GetAdjective], haben uns eine Lieferung von Waffen und Munition geschickt. Das ist aber noch nicht alles, denn sie haben uns auch eine Gruppe von Ingenieuren und Industriellen geschickt, die uns bei der Entwicklung unserer eigenen Waffen helfen werden, damit unsere Militärwirtschaft nach den Jahrhunderten der Demütigung wieder auf die Beine kommen kann."
wuw_GER_chinese_diplomacy.1.a:	"Das wird sich als nützlich erweisen"
wuw_GER_chinese_diplomacy.2.t:	"[FROM.GetNameDefCap] Bietet industrielle Hilfe im Austausch für Ressourcenrechte"
wuw_GER_chinese_diplomacy.2.desc:	"\nUnsere großen Verbündeten im Westen, die [FROM.GetAdjective]s, haben uns eine Delegation geschickt. Die Delegation erklärt, dass sie bereit sind, in unsere Industrien zu investieren, um im Gegenzug Rechte für bessere Handelsabkommen in Bezug auf unsere natürlichen Ressourcen zu erhalten. Sie sind wirklich ein guter Freund."
wuw_GER_chinese_diplomacy.2.a:	"In der Tat ein guter Freund"
wuw_GER_chinese_diplomacy.2.b:	"Wir können unsere natürlichen Ressourcen nicht hergeben"
wuw_GER_chinese_diplomacy.3.t:	"[FROM.GetNameDefCap] Nimmt unser Angebot an"
wuw_GER_chinese_diplomacy.3.desc:	"\nUnsere Delegationen sind mit glänzenden Neuigkeiten zurückgekehrt. Sie erklären, dass die [FROM.GetAdjective] Regierung mehr als glücklich war, das von uns vorgeschlagene Abkommen zu unterzeichnen, und dass der Pakt sofort in Kraft treten wird. Wir haben uns also erfolgreich Zugang zu ihren natürlichen Ressourcen verschafft, und zwar zu dem geringen Preis, dass wir ihnen bei ihrer Industrialisierung helfen."
wuw_GER_chinese_diplomacy.3.a:	"Großartig"
wuw_GER_chinese_diplomacy.4.t:	"[FROM.GetNameDefCap] lehnt unser Angebot ab"
wuw_GER_chinese_diplomacy.4.desc:	"\nUnsere Delegationen sind mit enttäuschenden Nachrichten zurückgekehrt. Sie erklären, dass die [FROM.GetAdjective] Regierung sich geweigert hat, das Abkommen zu unterzeichnen, weil sie behauptet, wir würden versuchen, sie unter dem Deckmantel der Industriehilfe auszubeuten."
wuw_GER_chinese_diplomacy.4.a:	"Wahrlich enttäuschend"
wuw_GER_diplomacy.64.t:	"[FROM.GetNameDefCap] bietet Schutz im Austausch für Tribut"
wuw_GER_diplomacy.64.desc:	"\n[FROM.GetLeader] von [FROM.GetNameDef] ist an uns herangetreten und hat uns Schutz gegen die östliche Bedrohung angeboten. Dieser Schutz wird jedoch nicht kostenlos sein, denn es wurde erklärt, dass wir den [FROM.GetAdjective] einen gewissen Tribut zahlen müssen, wenn wir Schutz wünschen."
wuw_GER_diplomacy.64.a:	"Wenn es das ist, was es braucht"
wuw_GER_diplomacy.64.b:	"Es ist einfach zu teuer, um es zu akzeptieren..."
wuw_GER_diplomacy.65.t:	"[FROM.GetNameDefCap] Nimmt unsere Bedingungen an"
wuw_GER_diplomacy.65.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat auf unser Angebot reagiert und erklärt, dass unsere Bedingungen erfüllt werden, um die Zukunft von [FROM.GetAdjective] zu sichern, und dass die geforderten Zahlungen ab sofort geleistet werden."
wuw_GER_diplomacy.65.a:	"Es kommt alles zusammen!"
wuw_GER_diplomacy.66.t:	"[FROM.GetNameDefCap] lehnt unsere Bedingungen ab"
wuw_GER_diplomacy.66.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat auf unser Angebot geantwortet und erklärt, dass die Bedingungen für unseren Schutz zu hart sind und die damit verbundenen Kosten viel zu hoch sind. Sie können auf sich selbst aufpassen und brauchen nicht die Hilfe einer Möchtegern-Preußenarmee."
wuw_GER_diplomacy.66.a:	"Nun gut"
wuw_GER_diplomacy.66.b:	"Sie brauchen trotzdem Schutz, auch wenn sie sich weigern, dafür zu bezahlen!"
wuw_GER_diplomacy.67.t:	"[FROM.GetNameDefCap] bietet einen Geheimpakt an"
wuw_GER_diplomacy.67.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] ist im Geheimen an uns herangetreten und hat uns angeboten, unsere Nachbarn in einem Pakt aufzuteilen, in dem wir uns miteinander verbünden und Einflusssphären in den Niederungen errichten würden. Sollten wir ihr zwielichtiges Angebot annehmen?"
wuw_GER_diplomacy.67.a:	"Das wird uns sicher zum Vorteil gereichen"
wuw_GER_diplomacy.67.b:	"Das ist unethisch!"
wuw_GER_diplomacy.68.t:	"[FROM.GetNameDefCap] stimmt dem Pakt zu"
wuw_GER_diplomacy.68.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat auf unser Angebot geantwortet und erklärt, dass sie dem Pakt zustimmen und Einflusssphären einrichten werden, um die Zukunft von [FROM.GetAdjective] zu sichern."
wuw_GER_diplomacy.68.a:	"Dann ist es Zeit zuzuschlagen!"
wuw_GER_diplomacy.68.b:	"Großartige Neuigkeiten. Aber wir müssen geduldig sein."
wuw_GER_diplomacy.69.t:	"[FROM.GetNameDefCap] lehnt den Pakt ab"
wuw_GER_diplomacy.69.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat auf unser Angebot geantwortet und erklärt, dass der Gedanke, seinen Nachbarn zu zerstückeln und ihm in den Rücken zu fallen, sich einfach nicht richtig anfühlt und dass wir uns anderweitig Verbündete suchen sollten, wenn wir in zukünftigen Konflikten Aggressoren sein wollen."
wuw_GER_diplomacy.69.a:	"Wir werden uns andere Verbündete suchen müssen"
warning_they_may_instead_apporach_our_neighbor_tt:	"§R[FROM.GetNameDefCap] können stattdessen auf unseren Nachbarn§! zugehen"
wuw_GER_diplomacy.70.t:	"_[FROM.GetNameDefCap] mischt sich in unsere Politik ein"
wuw_GER_diplomacy.70.desc:	"[FROM.GetAdjective] Propagandisten haben vor kurzem damit begonnen, unsere Bevölkerung zu beeinflussen und auf ihre Seite zu ziehen, indem sie unserem Volk eine große Zukunft versprechen, wenn wir uns ihrem Staat als Verbündete anschließen würden. Das ist nicht unbedingt eine Bedrohung für unsere Unabhängigkeit, aber ganz sicher ein Akt der Aggression gegen unsere derzeitige Regierung. Viele neu verteilte Zeitungen predigen über die Schwächen unseres Systems. Vielleicht könnten wir einen weiteren Freund in der Welt gebrauchen, obwohl dies wahrscheinlich nicht das Letzte sein wird, was wir von [FROM.GetLeader] und [FROM.GetLeader.GetHerHis] Bauern hören."
wuw_GER_diplomacy.70.a:	"Keine schlechte Idee, wir könnten einen weiteren Verbündeten gebrauchen."
wuw_GER_diplomacy.70.b:	"Keine Zusammenarbeit mit den [FROM.GetAdjective]s, bringen Sie diese Propagandisten sofort zum Schweigen!"
wuw_GER_diplomacy.71.t:	"Die Einrichtung des Volkskommissariats [ROOT.GetNonIdeologyName]"
wuw_GER_diplomacy.71.desc:	"Unsere Oberherren in [FROM.GetNameDef] haben uns gerade über eine Umstrukturierung unseres derzeitigen Abkommens informiert. In dem Bestreben, alle Arbeiter zu vereinen, werden wir gebeten, ihnen Zugang zu einem größeren Teil unserer Industrie zu gewähren, damit sie diesen zum Wohle unseres Volkes einsetzen können. Obwohl wir kein Mitspracherecht hatten, haben wir keinen Grund, uns zu beschweren. Als sie uns ihre Hilfe anboten, wussten wir, dass dies der Preis sein könnte, den wir zahlen müssen."
wuw_GER_diplomacy.71.a:	"Es ist im besten Interesse unseres Volkes."
wuw_GER_diplomacy.72.t:	"Kommunistische Einflüsse von [FROM.GetNameDef]"
wuw_GER_diplomacy.72.desc:	"Wir sind darauf aufmerksam geworden, dass derzeit [FROM.GetAdjective] Zellen in unserem Land aktiv sind, die kommunistische Gefühle verbreiten. Obwohl dies an sich harmlos genug erscheint, scheint ein Teil der Propaganda eher revolutionärer Natur zu sein. Es häufen sich die Berichte darüber, dass Arbeiter ermutigt werden, sich zu organisieren und zusammenzuschließen, und nach der jüngsten Geschichte zu urteilen, können wir nicht sicher sein, dass dies nicht ein ausgeklügelter Trick der [GER.GetAdjective]-Führung ist, um uns letztendlich zu integrieren."
wuw_GER_diplomacy.72.a:	"Wir haben keinen Grund, ihnen zu misstrauen."
wuw_GER_diplomacy.72.a_tt:	"§Wenn die kommunistischen Unterstützer den Bürgerkrieg gewinnen, könnte [FROM.GetNameWithFlag] versuchen, uns zu unterjochen!§!"
wuw_GER_diplomacy.72.b:	"Wir werden nicht darauf hereinfallen!"
wuw_GER_diplomacy.73.t:	"[FROM.GetNameDefCap] erlaubt es uns, kommunistische Gefühle zu stärken."
wuw_GER_diplomacy.73.desc:	"Unsere Agenten, die in [FROM.GetNameDef] operieren, um die kommunistische Bewegung zu stärken, wurden von der Führung des Landes bemerkt. Zum Glück scheint sie dem wachsenden Anteil der Menschen, die die Sache des Proletariats unterstützen, weitgehend gleichgültig gegenüberzustehen, und wir können unsere Bemühungen fortsetzen."
wuw_GER_diplomacy.73.a:	"Für das Proletariat!"
wuw_GER_diplomacy.74.t:	"[FROM.GetNameDefCap] verbietet politische Beeinflussungsaktionen"
wuw_GER_diplomacy.74.desc:	"Unsere Agenten, die in [FROM.GetNameDef] tätig sind, um die kommunistische Bewegung zu stärken, sind von der Führung des Landes bemerkt worden. Wir haben einen strengen Brief von ihr erhalten, in dem sie uns auffordert, diese Operation sofort einzustellen. Es scheint, dass wir die Arbeiter in guter Absicht über ihre Rechte informiert haben und [FROM.GetLeader] sein wahres Gesicht als Feind des einfachen Mannes gezeigt hat."
wuw_GER_diplomacy.74.a:	"Wir müssen unsere [FROM.GetAdjective] Kameraden befreien!"
wuw_GER_diplomacy.75.t:	"Bürgerkrieg in [ROOT.GetNameDef]"
wuw_GER_diplomacy.75.desc:	"Nach einer langen Periode wachsender kommunistischer Gefühle scheint es, dass das [ROOT.GetAdjective] Proletariat des Wartens auf einen friedlichen Regierungswechsel überdrüssig geworden ist. Nach intensiven Gesprächen scheint die Diplomatie gescheitert zu sein und ein bewaffneter Konflikt ist entstanden."
wuw_GER_diplomacy.75.a:	"Für das Proletariat!"
wuw_GER_diplomacy.75.b:	"Wir müssen diesen Wahnsinn stoppen!"
wuw_GER_diplomacy.76.t:	"[FROM.GetNameDefCap] Fordert die Unterwerfung"
wuw_GER_diplomacy.76.desc:	"Nachdem sich der Bürgerkrieg endlich beruhigt hat, ist [FROM.GetNameDef] zu uns zurückgekehrt, um unsere Unterwerfung zu fordern. Wir ahnten, dass dies kommen würde, aber wir haben es ignoriert, um ihre Hilfe beim Sturz unserer früheren Regierung zu erhalten. Bisher haben sie sich uns gegenüber als recht wohlwollend erwiesen, so dass die Hoffnung besteht, dass dies nicht so schlimm für uns sein könnte."
wuw_GER_diplomacy.76.a:	"Das ist der Preis, den wir zahlen."
wuw_GER_diplomacy.77.t:	"[FROM.GetNameDefCap] verlangt, dass wir ein Referendum abhalten, um uns ihnen anzuschließen"
wuw_GER_diplomacy.77.desc:	"Unsere Nachbarn im Norden haben uns aufgefordert, ein Referendum abzuhalten, um sich ihnen anzuschließen. Mit der Begründung, dass unser Volk dem ihren sehr ähnlich ist und es verdient, vereint zu leben, haben sie erklärt, dass wir uns ihnen unterwerfen sollen. Wir werden immer noch ein gewisses Maß an Freiheit haben, aber unsere Außenpolitik und andere Dinge werden von den [FROM.GetAdjective]s überwacht und bestimmt werden."
wuw_GER_diplomacy.77.a:	"Warum nicht?"
wuw_GER_diplomacy.77.b:	"Auf keinen Fall!"
wuw_GER_diplomacy.78.t:	"[FROM.GetNameDefCap] reiht sich ein"
wuw_GER_diplomacy.78.desc:	"Nach dem Sieg der [FROM.GetAdjective], die sich uns in ihrem jüngsten Referendum anschließen wollten, ist die Führung von [FROM.GetNameDef] mit einer positiven Antwort zu uns zurückgekehrt. Von nun an werden sie sich uns zum Wohle unseres Volkes unterwerfen."
wuw_GER_diplomacy.78.a:	"Ein Tag, der es wert ist, gefeiert zu werden!"
wuw_GER_diplomacy.79.t:	"Die [FROM.GetNameDefCap]-Führung weigert sich, sich uns anzuschließen"
wuw_GER_diplomacy.79.desc:	"Die negative Antwort der [FROM.GetAdjective]-Führung hat uns viel zu schnell erreicht, als dass wir glauben könnten, dass es überhaupt ein Referendum gegeben hat. Trotz klarer Hinweise darauf, dass es ihrem Volk unter unserer sicheren Führung viel besser gehen würde, hat sich [FROM.GetLeader] für [FROM.GetLeader.GetHerHis] eigene Macht entschieden und nicht für das Beste von [FROM.GetLeader.GetHerHis] Volk."
wuw_GER_diplomacy.79.a:	"Wir müssen sie befreien!"
wuw_GER_diplomacy.80.t:	"[FROM.GetNameDefCap] Investiert in unsere Industrie"
wuw_GER_diplomacy.80.desc:	"Die [FROM.GetAdjective] Regierung hat beträchtliche Investitionen getätigt, um unsere Industrie auf den gleichen Standard zu bringen wie ihre. Sie stellen dies als ein für beide Seiten vorteilhaftes Abkommen dar. Wir als Land bekommen eine besser entwickelte Industrie, und wenn unsere Kapazität wächst, werden auch sie davon Gebrauch machen."
wuw_GER_diplomacy.80.a:	"Großartig!"
wuw_GER_diplomacy.81.t:	"Die Integration von [ROOT.GetNameDef]"
wuw_GER_diplomacy.81.desc:	"Unsere Zeit als Volkskommissariat ist zu Ende gegangen. Die [FROM.GetAdjective]-Führung ist sehr zufrieden mit unseren Bemühungen und betrachtet das Land nun als mehr als nur einen Untertanenstaat. Als solche wollen sie uns belohnen, indem sie uns erlauben, Teil ihres großen Landes zu werden, anstatt nur ein Untertan zu sein. Das bedeutet natürlich, dass uns keine Unabhängigkeit mehr gewährt wird, aber sie versichern uns, dass sie sich gut um unser Volk kümmern werden."
wuw_GER_diplomacy.81.a:	"Kaum eine Belohnung, aber welche Wahl haben wir schon?"
wuw_GER_diplomacy.82.t:	"[FROM.GetAdjective] Unterstützung für den Aufstand"
wuw_GER_diplomacy.82.desc:	"Unsere Genossen in [FROM.GetNameDef] haben uns eine Ladung Gewehre geschickt, um uns in unserem Kampf gegen den Kapitalismus und die Bourgeoisie zu unterstützen. Diese Hilfe wird später wahrscheinlich etwas kosten, aber wer sind wir, dass wir ihre Hilfe ablehnen?"
wuw_GER_diplomacy.82.a:	"Machen Sie guten Gebrauch von diesen Gewehren!"
wuw_GER_diplomacy.83.t:	"[GER.GetNameDefCap] lädt uns zum [GER.GetFactionName] ein"
wuw_GER_diplomacy.83.desc:	"Nach unserem Erfolg im Bürgerkrieg und der anschließenden Hinwendung zum Kommunismus hat uns [GER.GetNameDef] die Hand in Kameradschaft gereicht. Inwieweit die Unterstützung durch die [GER.GetAdjective] tatsächlich eine Rolle gespielt hat, bleibt am besten ungesagt. Da wir nun ähnliche Ideologien teilen, haben sie uns dieses Angebot gemacht. Inwieweit wir in dieser Angelegenheit wirklich eine Wahl haben, bleibt ein wenig unklar."
wuw_GER_diplomacy.83.a:	"Natürlich werden wir mitmachen"
wuw_GER_diplomacy.83.b:	"Wir würden es vorziehen, allein zu bleiben."
wuw_GER_diplomacy.84.t:	"[FROM.GetNameDefCap] Forderung nach mehr proletarischer Solidarität"
wuw_GER_diplomacy.84.desc:	"[GetIsRootProletarianSubject]"
GER_root_is_proletarian_subject:	"Da unser Land nun rechtmäßig von Vertretern der Arbeiter und des Proletariats geführt wird, haben sich die [FROM.GetAdjective]s an uns gewandt. Sie sprechen von so genannter proletarischer Solidarität und davon, dass wir als ihre Untertanen ihnen einen Teil unserer Industrie zur Verfügung stellen sollten, als Gegenleistung für ihre Hilfe beim Aufbau unseres Landes."
GER_root_not_proletarian_subject:	"Da unser Land nun rechtmäßig von Vertretern der Arbeiter und des Proletariats geführt wird, haben sich die [FROM.GetAdjective]s an uns gewandt. Sie sprechen von Solidarität zwischen den kommunistischen Nationen, um das Leben unserer Völker zu verbessern. Die Zulassung des Handels zwischen unseren Ländern könnte den Arbeitern in beiden Ländern zugute kommen und verhindert dennoch Einflüsse aus kapitalistischen Ländern, die das politische System, das wir so sorgfältig aufgebaut haben, aushöhlen würden."
wuw_GER_diplomacy.84.a:	"Wir sind einverstanden, Solidarität für alle!"
wuw_GER_diplomacy.84.b:	"Das klingt für sie vorteilhafter."
wuw_GER_diplomacy.85.t:	"[FROM.GetNameDefCap] Fordert unsere Integration"
wuw_GER_diplomacy.85.desc:	"Eine scharf formulierte Forderung der [FROM.GetAdjective] hat uns erreicht. Sie finden, dass unsere derzeitige Zusammenarbeit zwar nützlich, aber nicht gut genug ist. Ihre Lösung ist die Forderung, dass wir uns in [FROM.GetNameDef] integrieren. Obwohl keine Konsequenzen für eine Weigerung genannt werden, kann man nur vermuten, dass eine Weigerung nicht leichtfertig erfolgen sollte."
wuw_GER_diplomacy.85.a:	"Wir haben keine Wahl"
wuw_GER_diplomacy.85.b:	"Wenn wir kämpfen müssen, dann kämpfen wir!"
wuw_GER_diplomacy.86.t:	"[FROM.FROM.GetNameDefCap] Übergibt Territorien in unserem Einflussbereich"
wuw_GER_diplomacy.86.desc:	"Heute erreichte uns eine höchst erfreuliche Nachricht: Nachdem wir die Kontrolle über [FROM.GetAdjective] Gebiete in unserem Einflussbereich erlangt haben, hat [FROM.FROM.GetNameDef] beschlossen, unsere Vereinbarung einzuhalten. Das Gebiet innerhalb unserer Einflusssphäre ist in unseren Besitz übergegangen."
wuw_GER_diplomacy.86.a:	"Großartig!"
wuw_GER_diplomacy.87.t:	"Anerkennung der Einflusssphären"
wuw_GER_diplomacy.87.desc:	"Als Ergebnis unseres Sieges im jüngsten Krieg müssen wir eine Entscheidung treffen. Einige der Länder, die wir erobert haben, liegen nicht in unserer Einflusssphäre. Gemäß der Vereinbarung müssen wir diese Länder abtreten. Die Vereinbarung wurde jedoch nie schriftlich festgehalten, so dass man argumentieren könnte, sie sei nicht bindend..."
wuw_GER_diplomacy.87.a:	"Wir müssen die Vereinbarung einhalten!"
wuw_GER_diplomacy.87.b:	"Wir haben das Land fair und ehrlich gewonnen!"
wuw_GER_diplomacy.88.t:	"[FROM.GetNameDefCap] Übergibt Territorien in unserem Einflussbereich"
wuw_GER_diplomacy.88.desc:	"Heute erreichte uns eine höchst erfreuliche Nachricht: Nachdem wir die Kontrolle über [FROM.GetAdjective] Gebiete in unserem Einflussbereich erlangt haben, hat [FROM.FROM.GetNameDef] beschlossen, unsere Vereinbarung einzuhalten. Das Gebiet innerhalb unserer Einflusssphäre ist in unseren Besitz übergegangen."
wuw_GER_diplomacy.88.a:	"Großartig!"
wuw_GER_diplomacy.89.t:	"[FROM.GetNameDefCap] Errichtet den Einflussbereich"
wuw_GER_diplomacy.89.desc:	"[FROM.GetNameDefCap] hat uns mitgeteilt, dass sie einen Einflussbereich eingerichtet hat. Das betrifft uns zwar nicht direkt, da es keine formelle Vereinbarung gibt, aber wir sollten uns dessen bewusst sein. Sie könnten versuchen, es uns aufzudrängen oder Territorium von uns zu fordern, sollten wir die Kontrolle darüber erlangen."
wuw_GER_diplomacy.89.a:	"Also gut..."
wuw_GER_diplomacy.89.b:	"Inakzeptabel"
wuw_GER_diplomacy.90.t:	"[FROM.GetNameDefCap] bittet um einen Nichtangriffspakt"
wuw_GER_diplomacy.90.desc:	"[FROM.GetLeader] hat sich mit einer Bitte an uns gewandt. [FROM.GetLeader.GetSheHe] möchte einen gegenseitigen Nichtangriffspakt mit uns unterzeichnen, um den Gedanken zu festigen, dass wir zwar nicht wirklich Verbündete, aber ganz sicher keine Feinde sind. Ein solcher Pakt schränkt zwar unsere Handlungsfreiheit ein, falls wir uns jemals mit den [FROM.GetAdjective] zerstreiten sollten, aber er hat auch das Potenzial, das Risiko zu minimieren, dass so etwas jemals passiert."
wuw_GER_diplomacy.90.a:	"Das wird uns stärken!"
wuw_GER_diplomacy.90.b:	"Wir können uns nicht an sie binden."
wuw_GER_diplomacy.91.t:	"[FROM.GetNameDefCap] äußert den Wunsch, sich anzugleichen"
wuw_GER_diplomacy.91.desc:	"Wir haben soeben eine Mitteilung von der [FROM.GetAdjective]-Führung erhalten, dass sie sich unserer politischen Doktrin anschließen möchte. Sie hoffen, dass dies eine gute Grundlage für eine weitere Zusammenarbeit in der Zukunft sein kann, betonen aber, dass solche Pläne nicht jetzt in die Tat umgesetzt werden müssen. Dies ist eine hervorragende Gelegenheit für uns, ihre politische Elite zu beeinflussen."
wuw_GER_diplomacy.91.a:	"Wir kennen einen Mann..."
wuw_GER_diplomacy.92.t:	"[FROM.GetNameDefCap] befürwortet unsere Ausrichtung"
wuw_GER_diplomacy.92.desc:	"Die Reaktion unserer Genossen in [FROM.GetNameDef] ist positiv. Sie begrüßen unsere Ausrichtung auf ihre politische Doktrin und teilen unsere Hoffnung auf eine gute Zusammenarbeit in der Zukunft. In der Frage, wie dies am besten geschehen kann, haben sie einen Vorschlag für uns, um diesen Übergang einfacher und schneller zu gestalten. Sie schlagen vor, dass wir unseren politischen Führer auswechseln. Obwohl Ernst Thälmann sicherlich ein fähiger Führer ist, sind sie sicher, dass Walter Ulbricht eine bessere Basis für unsere zukünftige Zusammenarbeit bieten könnte."
wuw_GER_diplomacy.92.a:	"Ulbricht ist genauso fähig, wir werden wechseln."
wuw_GER_diplomacy.92.b:	"Nein, wir werden nicht zulassen, dass sie sich einmischen!"
wuw_GER_diplomacy.93.t:	"[FROM.GetNameDef] Installiert Walter Ulbricht"
wuw_GER_diplomacy.93.desc:	"Vielleicht überraschend war die [FROM.GetAdjective]-Führung bereit, Ernst Thälmann auszutauschen. Sie haben diesen Wechsel im Interesse guter Beziehungen zu uns vollzogen und um sicherzustellen, dass unsere politischen Agenden so ähnlich sind, dass unsere Zusammenarbeit reibungslos verläuft. Das muss als Erfolg gewertet werden!"
wuw_GER_diplomacy.93.a:	"Großartig!"
wuw_GER_diplomacy.94.t:	"[FROM.GetNameDefCap] Weigert sich, Ernst Thälmann abzulösen"
wuw_GER_diplomacy.94.desc:	"Obwohl unser Vorschlag der am besten gemeinte Versuch war, unseren [FROM.GetAdjective] Genossen zu helfen, haben sie sich hartnäckig geweigert, unseren Rat zu befolgen. Es scheint, dass sie den Vorschlag als einen Versuch betrachteten, sich in ihre Politik einzumischen, obwohl das überhaupt nicht in unserer Absicht lag."
wuw_GER_diplomacy.94.a:	"Hartnäckig [FROM.GetAdjective]s..."
wuw_GER_diplomacy.95.t:	"Vorschlag zur industriellen Zusammenarbeit"
wuw_GER_diplomacy.95.desc:	"Die [FROM.GetAdjective]-Führung ist mit einem Vorschlag für eine industrielle Zusammenarbeit zwischen unseren Ländern an uns herangetreten. Ihr Vorschlag zeigt auf, wie wir unsere industriellen Bemühungen gemeinsam verbessern und ausweiten könnten. Ob wir tatsächlich davon profitieren werden oder ob es sich lediglich um etwas handelt, das den [FROM.GetAdjective] zugute kommt, wird sich zeigen."
wuw_GER_diplomacy.95.a:	"Das klingt fair"
wuw_GER_diplomacy.95.b:	"Sie müssen uns für dumm halten."
wuw_GER_diplomacy.96.t:	"[FROM.GetNameDefCap] stimmt der industriellen Zusammenarbeit zu"
wuw_GER_diplomacy.96.desc:	"Die Antwort auf unseren Vorschlag an die [FROM.GetAdjective]s für eine industrielle Zusammenarbeit ist auf Zustimmung gestoßen. In Zukunft werden wir bei der Ausweitung und Effektivierung unserer Industrie zusammenarbeiten."
wuw_GER_diplomacy.96.a:	"Großartig!"
wuw_GER_diplomacy.97.t:	"[FROM.GetNameDefCap] lehnt unseren Vorschlag ab"
wuw_GER_diplomacy.97.desc:	"Unser Vorschlag an die [FROM.GetAdjective] ist auf Ablehnung gestoßen. Obwohl das Geschäft sowohl für uns als auch für sie sehr vorteilhaft ist, haben sie sich geweigert, uns anzuhören. Auch wenn dieser Plan gescheitert ist, können wir immer noch Teile unseres Vorhabens verwirklichen. Wir können unsere industrielle Expansion immer noch aus eigener Kraft bewerkstelligen."
wuw_GER_diplomacy.97.a:	"Dann werden wir auf eigene Faust expandieren."
wuw_GER_diplomacy.98.t:	"[FROM.GetNameDefCap] lädt uns zur Technology Sharing Initiative ein"
wuw_GER_diplomacy.98.desc:	"Unsere Genossen in [FROM.GetNameDef] haben uns kürzlich angesprochen, ob wir nicht eine Initiative gründen wollen, um unser Wissen über Industrie und Produktion zu bündeln. Wir würden unser Wissen mit ihnen teilen, und im Gegenzug würden sie ihr Wissen mit uns teilen. Das alles könnte unseren Arbeitern und unseren Produktionslinien zugute kommen."
wuw_GER_diplomacy.98.a:	"Das ist eine großartige Initiative"
wuw_GER_diplomacy.98.b:	"Denen kann man nicht trauen."
wuw_GER_diplomacy.99.t:	"[FROM.GetNameDefCap] Schließt sich der Initiative zum Technologieaustausch an."
wuw_GER_diplomacy.99.desc:	"Sehr zu unserer Freude scheinen die [FROM.GetAdjective]s den Nutzen der von uns vorgeschlagenen Technologie-Sharing-Gruppe erkannt zu haben. Von nun an werden wir Zugang zu ihrem Wissen haben, genau wie sie zu unserem. Das sollte uns große Fortschritte in den Bereichen Industrie und Produktion bescheren."
wuw_GER_diplomacy.99.a:	"Großartig"
wuw_GER_diplomacy.101.t:	"[FROM.GetNameDefCap] missbilligt die Initiative zum Technologieaustausch"
wuw_GER_diplomacy.101.desc:	"Trotz der offensichtlichen Vorteile für alle Parteien hat sich [FROM.GetNameDef] geweigert, sich unserer Initiative zum Technologieaustausch anzuschließen. Mit der Begründung, dass man uns ihre Technologie nicht anvertrauen könne, hat sie unser Angebot abgelehnt und uns gebeten, ihr solche Torheiten nicht zu empfehlen."
wuw_GER_diplomacy.101.a:	"Unvernünftig [FROM.GetAdjective]s..."
wuw_GER_diplomacy.102.t:	"[FROM.GetNameDefCap] stimmt dem Nichtangriffspakt zu"
wuw_GER_diplomacy.102.desc:	"Unsere Bitte, einen Nichtangriffspakt mit [FROM.GetNameDef] zu schließen, ist auf Zustimmung gestoßen. Von nun an werden wir beide auf Aggressionen gegeneinander verzichten. Wir sind sicher, dass dies für unsere beiden Nationen von großem Nutzen sein wird."
wuw_GER_diplomacy.102.a:	"Großartig"
wuw_GER_diplomacy.103.t:	"[FROM.GetNameDefCap] lehnt den Nichtangriffspakt ab"
wuw_GER_diplomacy.103.desc:	"Trotz der offensichtlichen Vorteile für uns beide hat [FROM.GetNameDef] den vorgeschlagenen Nichtangriffspakt abgelehnt. Wir wissen nicht, was die Gründe dafür waren, aber ihre Ablehnung ist ziemlich beunruhigend. Wir werden sie genau im Auge behalten."
wuw_GER_diplomacy.103.a:	"In Bezug auf"
wuw_GER_diplomacy.104.t:	"[FROM.GetNameDefCap] stimmt der Einrichtung von Einflusssphären zu"
wuw_GER_diplomacy.104.desc:	"Wir haben von den [FROM.GetAdjective] erfahren, dass sie der Idee zustimmen, unsere Einflusssphären einzurichten. Dies wird Feindseligkeiten verhindern und das Risiko von Konflikten um Ländereien in unserer unmittelbaren Umgebung verringern."
wuw_GER_diplomacy.104.a:	"Großartig!"
wuw_GER_diplomacy.105.t:	"[FROM.GetNameDefCap] lehnt die Einrichtung von Einflusssphären ab"
wuw_GER_diplomacy.105.desc:	"Wir haben von den [FROM.GetAdjective] erfahren, dass sie sich weigern werden, unsere Einflusssphären anzuerkennen. Sie haben erklärt, dass sie über ihre eigenen Einflusssphären selbst entscheiden werden, ohne dass wir uns daran beteiligen. Das könnte zu einigen Spannungen in der Region führen."
wuw_GER_diplomacy.105.a:	"Wie unhöflich!"
wuw_GER_diplomacy.107.t:	"Die [FROM.GetAdjective]s bieten Industrie für Ressourcen an"
wuw_GER_diplomacy.107.desc:	"Wir haben ein Angebot von [FROM.GetNameDef] erhalten. Sie sind an einem langfristigen Handel mit Ressourcen interessiert, wenn sie im Gegenzug einen Teil ihrer Industrie verlagern. Derzeit haben sie ein Auge auf die Ressourcen in [FROM.FROM.GetName] geworfen, von denen sie einen Teil erhalten möchten."
wuw_GER_diplomacy.107.a:	"Warum eigentlich nicht?"
wuw_GER_diplomacy.107.b:	"Dies ist kein guter Zeitpunkt"
wuw_GER_diplomacy.107.c:	"Ein unfaires Angebot, schlagen Sie das nie wieder vor!"
wuw_GER_diplomacy.108.t:	"[FROM.GetAdjective] Zustimmung zur industriellen Verlagerung"
wuw_GER_diplomacy.108.desc:	"Wir haben eine Nachricht von den [FROM.GetAdjective] über unsere Bitte erhalten, die Industrie im Gegenzug für einige ihrer Ressourcen zu verlagern. Es scheint, dass wir uns über die Vorteile dieses Deals einig sind und sie haben diesem Deal gerne zugestimmt. Wir werden die Ressourcen in Kürze erhalten."
wuw_GER_diplomacy.108.a:	"Großartig"
wuw_GER_diplomacy.109.t:	"[FROM.GetAdjective] Industrieverlagerungs-Deal ablehnen"
wuw_GER_diplomacy.109.desc:	"Obwohl die [FROM.GetAdjective] unserem Vorschlag größtenteils neutral gegenüberstehen, haben sie sich letztendlich entschieden, unseren Vorschlag abzulehnen, Industrien im Gegenzug für Ressourcen zu ihnen zu verlagern. Sie behaupten, dass dies kein guter Zeitpunkt sei und lassen es so klingen, als ob wir in der Zukunft vielleicht eine Einigung erzielen könnten, sobald wir unsere Beziehungen weiter gefestigt haben."
wuw_GER_diplomacy.109.a:	"Wenn Sie anfangs keinen Erfolg haben..."
wuw_GER_diplomacy.110.t:	"[FROM.GetAdjective] Lehnt Deal zur Industrieansiedlung harsch ab"
wuw_GER_diplomacy.110.desc:	"Es scheint, dass der sehr faire Deal, den wir den [FROM.GetAdjective]s vorgelegt haben, auf kalte Ablehnung gestoßen ist. Nicht nur das, sie haben uns auch deutlich zu verstehen gegeben, dass sie nicht wünschen, dass wir uns jemals wieder mit ihnen in dieser Angelegenheit in Verbindung setzen. Wenn wir diese Ressourcen wollen, müssen wir vielleicht... andere Wege finden."
wuw_GER_diplomacy.110.a:	"Egoistisch [FROM.GetAdjective]s..."
GER_SOV_have_had_enough_tt:	"§RRemoves §YDecisions§! to Relocate Industries to §Y[SOV.GetNameWithFlag]§! in Return for Resources§!"
wuw_GER_diplomacy.111.t:	"Vertrag über die Entwicklung der Wirtschaftsbeziehungen"
wuw_GER_diplomacy.111.desc:	"Diplomaten aus [FROM.GetNameDef] haben darauf bestanden, dass wir ihren Vorschlag für einen deutsch-rumänischen Vertrag zur Entwicklung der Wirtschaftsbeziehungen zwischen beiden Ländern unterzeichnen. Sie behaupten, dass dieses Abkommen beiden Ländern zugute kommen wird, da sie unsere natürlichen Ressourcen für ihre Industrien benötigen und wir einen besseren Preis für deutsche Rüstungsgüter erhalten. Dieses Abkommen scheint für uns nicht so vorteilhaft zu sein, wie die Deutschen behaupten, aber es abzulehnen, wird sie sicherlich verärgern..."
wuw_GER_diplomacy.111.a:	"Wir haben keine andere Wahl als zu akzeptieren..."
wuw_GER_diplomacy.111.b:	"Wir können das nicht akzeptieren, verdammt seien die Konsequenzen!"
wuw_GER_diplomacy.112.desc:	"[FROM.GetLeader] scheint ein vernünftiger Führer zu sein, der das Beste für [FROM.GetLeader.GetHerHis] Land im Auge hat. Wie es der Zufall will, ist dieses einseitige Abkommen auch im besten Interesse unseres Landes. Wir werden die zusätzlichen Ressourcen von [FROM.GetName] gut nutzen."
wuw_GER_diplomacy.113.desc:	"[FROM.GetLeader] scheint ein unvernünftiger und unkluger Führer zu sein, dem das Beste für [FROM.GetLeader.GetHerHis] Land völlig egal ist. Das [FROM.GetAdjective] Volk wird unter dieser Torheit leiden."
wuw_GER_diplomacy.113.b:	"Krieg ist angesagt!"
wuw_GER_diplomacy.117.a:	"Wir können nicht hoffen, dass wir ihnen widerstehen können..."
wuw_GER_diplomacy.117.b:	"Wir werden uns niemals unterwerfen!"
wuw_GER_diplomacy.118.t:	"[FROM.GetNameDefCap] unterwirft sich"
wuw_GER_diplomacy.118.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat angekündigt, dass sich die [FROM.GetAdjective] Nation unserer Herrschaft unterwerfen wird. Das ist das Beste, denn sie haben nicht die Macht, uns aufzuhalten, und ein Kampf würde nur Zerstörung für ihr Land und ihr Volk bringen."
wuw_GER_diplomacy.119.t:	"[FROM.GetNameDefCap] Weigert sich zu unterwerfen"
wuw_GER_diplomacy.119.desc:	"Die starrköpfigen [FROM.GetAdjective] haben unseren Vorschlag abgelehnt, unsere Länder zu einer stärkeren Einheit zu vereinen. Ist das der Dank für all das, was wir für sie getan haben?"
wuw_GER_weltpolitik.4.t:	"[FROM.GetLeader] will den Kongo aufteilen"
wuw_GER_weltpolitik.4.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat sich in der Frage der verlorenen [FROM.GetAdjective] Kolonien an uns gewandt, da sie sich durch Versailles beraubt fühlen. Sie verlangen nun, dass wir einen Pakt mit der [GER.GetAdjective] Nation unterzeichnen, um den Kongo in Einflusssphären aufzuteilen, wobei sie gemeinsam die Forderung stellen, dies zu tun. Sollten wir ihnen nachgeben und einen solchen Pakt unterzeichnen?"
wuw_GER_weltpolitik.4.a:	"Es ist ein Abkommen zum beiderseitigen Vorteil"
wuw_GER_weltpolitik.4.b:	"Wir werden diese Aggression nicht unterstützen"
wuw_GER_weltpolitik.5.t:	"[FROM.GetLeader] fordert, dass wir den Kongo aufgeben"
wuw_GER_weltpolitik.5.desc:	"In einer gemeinsamen Erklärung mit [GER.GetLeader] ist [FROM.GetLeader] von [FROM.GetNameDef] an uns herangetreten und fordert, dass wir den Kongo an die beiden Staaten, die sie vertreten, abtreten. Sollen wir sie in dieser Angelegenheit bekämpfen, oder sollen wir einfach einknicken und ihnen den Kongo überlassen?"
wuw_GER_weltpolitik.5.a:	"Leider können wir nicht viel dagegen tun"
wuw_GER_weltpolitik.5.b:	"Wir können das nicht akzeptieren"
wuw_GER_weltpolitik.6.t:	"[FROM.GetLeader] lehnt den Deal ab"
wuw_GER_weltpolitik.6.desc:	"[FROM.GetLeader] hat erklärt, dass [FROM.GetLeader.GetSheHe] für alle tapferen Bürger von [FROM.GetNameDef] steht, wenn [FROM.GetLeader.GetSheHe] sagt, dass sie unsere haarsträubenden Ideen, den Kongo, einen Staat, der mit keinem unserer Staaten verbunden ist, aufzuteilen, nicht unterstützen werden. Es scheint, dass die Entscheidung endgültig ist."
wuw_GER_weltpolitik.6.a:	"In diesem Fall wird alles uns gehören!"
wuw_GER_weltpolitik.6.b:	"Wir sollten nicht weiter drängen"
wuw_GER_weltpolitik.7.t:	"[BEL.GetNameDefCap] Plänen, unsere Freiheit aufzugeben"
wuw_GER_weltpolitik.7.desc:	"[BEL.GetLeader] von [BEL.GetNameDef] hat den gemeinsamen Forderungen von [GER.GetAdjective] und [ENG.GetAdjective] nachgegeben und beschlossen, unsere Nation zu überschreiben, um unter ihnen aufgeteilt zu werden, was effektiv jede Art von Unabhängigkeit beenden wird, die wir derzeit besitzen. Sollen wir uns wirklich so einfach mit einem solchen Schicksal abfinden?"
wuw_GER_weltpolitik.7.a:	"Wir können nicht dagegen ankämpfen..."
wuw_GER_weltpolitik.7.b:	"Wir können das nicht akzeptieren, zu den Waffen!"
wuw_GER_weltpolitik.8.t:	"[BEL.GetNameDefCap] wird den Kongo aufgeben"
wuw_GER_weltpolitik.8.desc:	"[BEL.GetLeader] von [BEL.GetNameDef] hat unseren Forderungen nachgegeben und erklärt, dass der Kongo ab sofort an uns überschrieben wird. Es ist noch nicht sicher, dass die Menschen und Gouverneure im Kongo dies akzeptieren werden, aber zumindest haben die [BEl.GetAdjective] nachgegeben."
wuw_GER_weltpolitik.8.a:	"Perfekt"
wuw_GER_weltpolitik.9.t:	"[BEL.GetNameDefCap] Weigert sich, den Kongo aufzugeben"
wuw_GER_weltpolitik.9.desc:	"[BEL.GetLeader] von [BEL.GetNameDef] hat beschlossen, sich unseren Forderungen zu widersetzen und erklärt, dass die [BEL.GetAdjective]-Armee nicht vor dem Widerstand zurückweichen und bis zum letzten Mann um den Kongo kämpfen wird. Sie wissen nicht, mit wem sie sich anlegen."
wuw_GER_weltpolitik.9.a:	"Dann werden sie vernichtet werden"
wuw_GER_weltpolitik.9.b:	"Es gibt also keinen Grund, darauf zu drängen"
wuw_GER_weltpolitik.10.t:	"Die Kongo-Krise"
wuw_GER_weltpolitik.10.desc:	"Der Vertrag ist offiziell unterzeichnet, und das Land soll übergeben werden. Es gibt jedoch Widerstand im Kongo, Widerstand, mit dem wir umgehen müssen..."
wuw_GER_weltpolitik.10.a:	"Wir werden es mit Gewalt einnehmen"
wuw_GER_weltpolitik.10.b:	"Heute ist ein guter Tag"
wuw_GER_weltpolitik.11.t:	"Die Kongo-Krise"
wuw_GER_weltpolitik.11.desc:	"Unsere Gouverneure im Kongo berichten uns, dass sie das Schicksal, das wir für sie gewählt haben, nicht akzeptieren und an der [COG.GetAdjective] Autonomie festhalten werden. Wir werden ihren Widerstand brechen müssen, damit sie nicht der Untergang unserer Nation sind, vorausgesetzt, [ENG.GetNameDef] und [GER.GetNameDef] sehen dies als einen Akt des Widerstands unsererseits."
wuw_GER_weltpolitik.11.a:	"Wir müssen sie für die Sicherheit unseres Volkes vernichten!"
wuw_GER_chinese_diplomacy.5.t:	"Das Chinesisch-Deutsche Gemeinsame Forschungsprogramm"
wuw_GER_chinese_diplomacy.5.desc:	"Unsere großen Verbündeten im Westen, die [FROM.GetAdjective], haben uns eine Delegation geschickt, die uns bittet, bei der Entwicklung neuer Technologien zusammenzuarbeiten und ihr neues geplantes Programm als 'Sino-German Joint Research Program' bezeichnet. Sollten wir uns ihnen anschließen?"
wuw_GER_chinese_diplomacy.5.a:	"Eine großartige Initiative!"
wuw_GER_chinese_diplomacy.5.b:	"Wir glauben nicht, dass uns das helfen wird."
wuw_GER_chinese_diplomacy.6.t:	"[FROM.GetNameDefCap] erklärt sich zur Zusammenarbeit bereit"
wuw_GER_chinese_diplomacy.6.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat beschlossen, unserem Vorschlag zuzustimmen, und hat großes Interesse an unserem Gemeinsamen Chinesisch-Deutschen Forschungsprogramm bekundet. Nun, lassen Sie uns mit der Arbeit beginnen!"
wuw_GER_chinese_diplomacy.6.a:	"Prächtig"
wuw_GER_chinese_diplomacy.7.t:	"[FROM.GetNameDefCap] weigert sich zu kooperieren"
wuw_GER_chinese_diplomacy.7.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat beschlossen, unser Angebot abzulehnen, und behauptet, dass sie auch ohne westliche Technologie zurechtkommen. Es ist, wie es ist..."
wuw_GER_chinese_diplomacy.7.a:	"Sie wissen nicht, was sie sich entgehen lassen."
wuw_GER_weltpolitik.12.t:	"[FROM.GetName] Fordert die Rückgabe ehemaliger Kolonialgebiete"
wuw_GER_weltpolitik.12.desc:	"\n[FROM.GetLeader] von [FROM.GetNameDef] ist mit einer interessanten Bitte an uns herangetreten. Sie bitten darum, dass wir ihnen alte [FROM.GetAdjective] Kolonialgebiete zurückgeben, im Austausch für eine Vertiefung der Beziehungen zwischen unseren Ländern und ihre offizielle Unterstützung unserer Regierung auf globaler Ebene. Das scheint ein wenig einseitig zu sein, aber vielleicht ist es ja das Beste?"
wuw_GER_weltpolitik.12.a:	"Alles für unsere Freunde"
wuw_GER_weltpolitik.12.b:	"Nein, sie gehören jetzt uns"
wuw_GER_weltpolitik.13.t:	"[FROM.GetNameDefCap] Gibt unsere Kolonien zurück"
wuw_GER_weltpolitik.13.desc:	"\n[FROM.GetLeader] von [FROM.GetNameDef] hat unsere Bitte um die Rückgabe unserer ehemaligen Kolonien akzeptiert und erklärt, dass sie in unseren Händen besser aufgehoben sind. Die Menschen feiern auf den Straßen, denn es scheint, dass das [ROOT.GetAdjective] Kolonialreich endlich wieder auf der Landkarte steht."
wuw_GER_weltpolitik.13.a:	"Der Imperialismus ist zurück auf der Speisekarte!"
wuw_GER_weltpolitik.14.t:	"[FROM.GetNameDefCap] gibt unsere Kolonien nicht zurück"
wuw_GER_weltpolitik.14.desc:	"\n[FROM.GetLeader] von [FROM.GetNameDef] hat unsere Bitte um die Rückgabe unserer alten Kolonien abgelehnt und behauptet, es handele sich um einen einseitigen Deal, bei dem sie wenig bis gar nichts zu gewinnen hätten."
wuw_GER_weltpolitik.14.a:	"Das sollte es nicht sein..."
wuw_GER_weltpolitik.15.t:	"[FROM.GetNameDefCap] Übergibt Land an [GER.GetNameDefCap]"
wuw_GER_weltpolitik.15.desc:	"\n[FROM.GetLeader] von [FROM.GetNameDef] hat überraschend beschlossen, alle alten [GER.GetAdjective] Kolonialgebiete an sie zurück zu überschreiben, einschließlich derer, die wir gehalten haben. Leider können wir nicht viel tun, um das neue Gesetz zu stoppen, aber wir können zumindest eine Form der Entschädigung von ihnen verlangen."
wuw_GER_weltpolitik.15.a:	"Wir fordern irgendeine Form der Entschädigung!"
wuw_GER_reichskommissariats.1.t:	"Die Führung von Belgien-Nordfrankreich"
wuw_GER_reichskommissariats.1.desc:	"Nun, da wir eine neue Zivilverwaltung in Belgien und Nordfrankreich eingerichtet haben, müssen wir nicht nur über den Zweck unseres neuen Subjekts entscheiden, sondern auch darüber, wer die Menschen in der Region führen und sicherstellen wird, dass unsere Politik ordnungsgemäß umgesetzt wird. Sollen wir einen [ROOT.GetAdjective] Politiker in das Amt des Reichskommissars einsetzen oder einen lokalen Kollaborateur?"
wuw_GER_reichskommissariats.1.a:	"Sie brauchen einen deutschen Beamten"
wuw_GER_reichskommissariats.1.b:	"Es könnte klug sein, einen lokalen Kollaborateur einzusetzen"
