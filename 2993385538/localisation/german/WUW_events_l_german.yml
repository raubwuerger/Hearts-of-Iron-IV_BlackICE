wuw_GER_reichskommissariats.25.b:	"Es könnte klug sein, einen lokalen Kollaborateur einzusetzen"
wuw_GER_reichskommissariats.26.t:	"Die Führung von Ostasien"
wuw_GER_reichskommissariats.26.desc:	"Nun, da wir eine neue Zivilverwaltung in Ostasien eingerichtet haben, müssen wir nicht nur über den Zweck unseres neuen Subjekts entscheiden, sondern auch darüber, wer die Menschen in der Region führen und sicherstellen wird, dass unsere Politik ordnungsgemäß umgesetzt wird. Sollen wir einen [ROOT.GetAdjective] Politiker in das Amt des Reichskommissars einsetzen oder einen lokalen Kollaborateur?"
wuw_GER_reichskommissariats.26.a:	"Sie brauchen einen deutschen Beamten"
wuw_GER_reichskommissariats.26.b:	"Es könnte klug sein, einen einheimischen Kollaborateur einzusetzen"
wuw_GER_reichskommissariats.27.t:	"Die Führung von Australasien"
wuw_GER_reichskommissariats.27.desc:	"Nun, da wir eine neue Zivilverwaltung in Australasien eingerichtet haben, müssen wir nicht nur über den Zweck unseres neuen Subjekts entscheiden, sondern auch darüber, wer die Menschen in der Region führen und sicherstellen wird, dass unsere Politik ordnungsgemäß umgesetzt wird. Sollen wir einen [ROOT.GetAdjective] Politiker in das Amt des Reichskommissars einsetzen oder einen lokalen Kollaborateur?"
