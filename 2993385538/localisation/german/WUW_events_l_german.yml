l_german:
 # News events 
 
wuw_GER_news.1.a:	"Deutschland ist endlich wieder vereint"
wuw_GER_news.1.b:	"Dies ist erst der Anfang"

wuw_GER_news.2.b:	"Sie haben es schon einmal versucht und sind gescheitert"
wuw_GER_news.2.c:	" Dies ist unsere Chance!"
wuw_GER_news.2.d:	"Hoffen wir, dass sie diesmal Erfolg haben"



 # Austrian events

AUS_political_events.2.t:	"Phönix-Versicherungsskandal"
AUS_political_events.2.desc:	"Kurz nach dem Tod ihres geliebten Generaldirektors Wilhelm Berliner ist die Phönix-Versicherung in weitere Schwierigkeiten geraten. Der neu ernannte Direktor Eberhard Reininghaus hat die Regierung auf gefälschte Bilanzen aufmerksam gemacht, die ein Defizit aus dem Jahr 1929 offenlegen, das sich auf über 250 Millionen Schilling beläuft. \n \n Das Unternehmen hat Insolvenz angemeldet und den Betrieb sofort eingestellt. Die überaus beliebte Kriegsteilnehmerversicherung hat ein jähes Ende gefunden, was bei vielen, die auf die Versicherungsleistungen angewiesen waren, für Empörung sorgt."
AUS_political_events.2.a:	"Wie schrecklich!"
AUS_political_events.2.b:	"Wir werden die Auszahlungen übernehmen!"
AUS_political_events.2.b_tt:	"Durch die Übernahme der Versicherung können wir die Phönix-Versicherung wiederbeleben."
AUS_political_events.3.t:	"Deutsche Remilitarisierung sorgt für weit verbreitete Besorgnis"
AUS_political_events.3.desc:	"Die jüngste Remilitarisierung des Rheinlandes hat in unserer Bevölkerung große Besorgnis ausgelöst. Innerhalb unserer Regierung wird die Frage gestellt: "Könnten wir die Nächsten sein?" Obwohl der Führer immer wieder versichert hat, dass die Annexion Österreichs nicht in seinem Interesse liege, müssen wir davon ausgehen, dass eine solche Maßnahme nicht mehr völlig ausgeschlossen ist."
AUS_political_events.3.a:	"Wir sollten uns auf das Schlimmste vorbereiten ..."


AUS_political_events.6.t:	" [FROM.GetNameDefCap] Akzeptiert unseren Vorschlag und gewährt uns Zugang zum Kauf von Ausrüstung"

AUS_political_events.6.a:	"Ein Toast auf eine großartige Partnerschaft!"
AUS_political_events.7.t:	"[FROM.GetNameDefCap] Nimmt unseren Vorschlag an"
AUS_political_events.7.desc:	"[FROM.GetNameDefCap] hat recht positiv auf unseren jüngsten Vorschlag reagiert, beim jeweiligen Aufbau unserer Luftstreitkräfte zusammenzuarbeiten. Zwar können sie keine materielle Unterstützung anbieten, doch haben sie zugestimmt, einige ihrer neuesten Methoden zur Pilotenausbildung mit uns zu teilen."
AUS_political_events.7.a:	"Großartig!"

AUS_political_events.8.desc:	"[FROM.GetNameDefCap] hat unser Angebot abgelehnt. Sie begründen dies damit, dass die Vereinbarung unausgewogen sei, ihnen keinen Nutzen bringe und dass wir uns durch unser Handeln im Ersten Weltkrieg selbst in diese Lage gebracht hätten."
AUS_political_events.8.a:	"Und inwiefern würde diese Situation ihnen zugutekommen?"
AUS_air_force_partnership_big:	"Umfassende Partnerschaft mit der Luftwaffe"
AUS_air_force_partnership_small:	"Partnerschaft mit der Luftwaffe"
AUS_rejected_air_force_partnership:	"Partnerschaft mit der Luftwaffe abgelehnt"

AUS_political_events.9.a:	"Die [GER.GetAdjective] sind also sowohl Lügner als auch Mörder..."


AUS_political_events.11.t:	"[GER.GetNameDefCap] äußert Abneigung gegenüber unserem militärischen Oberkommando"

AUS_political_events.12.a:	"Das kam unerwartet, ist aber sehr willkommen."
AUS_political_events.13.t:	"[FROM.GetNameDefCap] Lehnt das Embargo gegen [ITA.GetNameDef] ab"
AUS_political_events.13.a:	"Die [AUS.GetAdjective] haben kein Recht, dies zu fordern."
AUS_political_events.13.b:	"Gut."
AUS_political_events.14.t:	"[FROM.GetNameDefCap] spricht sich gegen das gegen uns verhängte Embargo aus"

AUS_political_events.14.a:	"Ein mutiger Schritt seitens der [FROM.GetAdjective]s"
AUS_political_events.15.t:	"[FROM.GetNameDefCap] Verbietet DNSAP"
AUS_political_events.15.desc:	" Soeben hat uns die Nachricht erreicht, dass die [FROM.GetAdjective]-Regierung in [FROM.GetNameDef] ein Verbot von DNSAP erlassen hat. Ein "weiches" Verbot bestand bereits seit 1934, wurde jedoch von den politischen Parteien und der Regierung gleichermaßen weitgehend ignoriert. Dies bedeutet eine Änderung im Tonfall der [FROM.GetAdjective] Führung uns gegenüber. \n\nAbgesehen von der offensichtlichen Beleidigung, die dies darstellt, könnte dies auch unseren Einfluss auf [FROM.GetNameDef] beeinträchtigen."

AUS_political_events.15.c:	"Dafür haben wir jetzt keine Zeit!"
AUS_banned_dnsap:	"DNSAP gesperrt"
AUS_meddling_with_our_politics:	"Einmischung in unsere Politik"
AUS_political_events.16.t:	"Nazis in der Regierung"

AUS_political_events.16.a:	"Wir müssen ihn genau im Auge behalten."
AUS_political_events.16.b:	"Auf keinen Fall!"

AUS_political_events.17.a:	"Sie haben kein Recht, sich in unsere Politik einzumischen."

AUS_political_events.19.desc:	"Unser erfolgreichster Jagdflieger aus dem Ersten Weltkrieg hat sich an uns gewandt und uns erneut seine Dienste angeboten, da wir uns im Krieg befinden. Obwohl er nicht mehr jung ist und nach dem Beinahe-Unfall im Jahr 1936 nicht mehr so fliegen kann wie früher, hat er angeboten, unsere Luftwaffe vom Boden aus zum Sieg zu führen. Unsere derzeitigen Piloten zollen ihm nach wie vor großen Respekt, und es herrscht die weit verbreitete Ansicht, dass er unsere Flieger so weit ausbilden könnte, dass sie zu einer Größe heranwachsen, die seiner eigenen in nichts nachsteht."

AUS_political_events.20.desc:	" [GetGuarantorFlavorText]"
AUS_guarantor_is_italy_key:	"[FROM.GetNameDefCap] hat den General und von Zeit zu Zeit den Militärattaché Emil Liebitzky zu uns geschickt, um um Hilfe zu bitten. Er und andere innerhalb der [FROM.GetAdjective] Führung haben besorgniserregende Tendenzen seitens [GER.GetNameDef] beobachtet und wünschen sich nun formellere Unterstützung von uns für den Fall, dass ihre Einschätzung der Lage tatsächlich zutrifft. \n\nAls Unterzeichner des Vertrags von Saint-Germain -En-Laye, wird von uns wahrscheinlich erwartet, dass wir ihnen zu Hilfe kommen, obwohl sich im Text wahrscheinlich Lücken finden lassen."


AUS_political_events.21.desc:	"Gemäß den Bestimmungen des Vertrags von Saint-Germain-En -Laye [FROM.GetNameDef] zugestimmt, unsere Unabhängigkeit zu garantieren. Zur Sicherheit gewähren sie uns zudem die Möglichkeit, Ausrüstung zu beschaffen, da wir derzeit nicht in der Lage sind, diese selbst herzustellen."
AUS_political_events.22.desc:	" Unter Ausnutzung einiger weniger bekannter Klauseln und des Kleingedruckten hat [FROM.GetNameDef] beschlossen, uns keine Garantie zu geben, sondern uns im Falle einer Invasion lediglich diplomatische Unterstützung anzubieten. Sie behaupten, sie seien sicher, dass ihre Worte [GER.GetLeader] ebenso überzeugen könnten wie die Androhung einer Intervention, und sehen daher keinen Grund, Truppen für uns bereitzuhalten."

AUS_political_events.22.b:	"Diplomatie und Ausrüstung werden uns nicht retten!"
AUS_political_events.23.t:	"[FROM.GetNameDefCap] bietet bedingt eine Garantie an"

AUS_political_events.23.b:	"Sie versuchen, aus unserer misslichen Lage Profit zu schlagen – auf keinen Fall. "
AUS_political_events.24.t:	"[FROM.GetNameDefCap] Lehnt unsere Bitte um Unterstützung ab"
AUS_political_events.24.desc:	"Indem sie sich auf eine Vielzahl von Grenzfällen, Kleingedrucktem und obskuren Klauseln im Vertrag von Saint-Germain-En -Laye [FROM.GetNameDef] hat es irgendwie geschafft, sich der Unterstützung für uns zu entziehen. In den Dokumenten steht eindeutig, dass wir externe Hilfe erhalten sollen, als Gegenleistung dafür, dass uns keine anständige Armee gestattet wird, doch wie sich herausstellt, hat [FROM.GetNameDef] entschieden, dass dies für sie nicht gilt. Wir werden uns selbst behelfen müssen."

AUS_political_events.24.b:	"Wir werden ihnen einen Anreiz bieten!"
AUS_political_events.25.desc:	"[FROM.GetNameDefCap] hat auf unsere Forderung, ihre Ansprüche auf unser Territorium zurückzuziehen, reagiert, indem sie diesen Forderungen nachgegeben hat. Sie hat die Idee, diese Territorien im Gegenzug für unsere Unterstützung einzunehmen, vollständig aufgegeben."
AUS_political_events.25.a:	"Großartige Neuigkeiten!"
AUS_political_events.26.t:	"[FROM.GetNameDefCap] Weigert sich, ihre Ansprüche zurückzuziehen"

AUS_political_events.26.a:	"Dann gibt es absolut keine Hilfe für sie."
AUS_political_events.27.a:	"Sie werden keinen Schaden anrichten."
AUS_political_events.27.b:	"Auf keinen Fall."
AUS_political_events.28.t:	"Die Garantiemächte stimmen der Wiederaufrüstung zu"
AUS_political_events.28.desc:	"Wir haben endlich die Antworten der Garantiemächte erhalten, und das Warten hat sich gelohnt. Nach vielen Diskussionen und Gesprächen untereinander haben sie zugestimmt, dass wir wieder aufrüsten dürfen, und den Vertrag von Saint-Germain-en-Laye für hinfällig erklärt. Wir sind nicht länger an die Handlungen unserer Vorfahren gebunden."
AUS_political_events.28.a:	"Ausgezeichnet!"

AUS_political_events.29.desc:	"Nach langen Diskussionen und zahlreichen Debatten haben die Garantiemächte beschlossen, unserem Antrag auf Wiederaufrüstung nicht stattzugeben. Wir haben versucht, sie zur Vernunft zu bringen, doch ihre Antwort bleibt unverändert, trotz der offensichtlichen Gefahr für unsere Souveränität und Unabhängigkeit."
AUS_political_events.29.a_tt:	"§RWenn Sie diese Option wählen, werden Sie den Vertrag von Saint-Germain-en-Laye endgültig aufheben, doch dies könnte Konsequenzen haben§!"

AUS_political_events.29.c:	"Sie haben uns zum Scheitern verurteilt, aber was können wir tun?"
AUS_political_events.30.t:	" [AUS.GetNameDefCap] Bricht den Vertrag von Saint-Germain-en-Laye"

AUS_political_events.30.a:	"Wir können sie nicht aufhalten, aber wir können sie bremsen."
AUS_political_events.30.b:	"Na gut, dann sollen sie es doch tun."

AUS_political_events.31.desc:	"Nachdem sich der Staub nach dem Bürgerkrieg gelegt hat, wurden wir von den [FROM.GetAdjective] bezüglich der Entschädigung für ihre Bemühungen im Bürgerkrieg kontaktiert. Sie fordern eine Form der Entschädigung für die geleistete Arbeit, die gefallenen Männer und die Waffen, die von ihren Freiwilligen eingesetzt und beschädigt wurden."

AUS_political_events.31.c:	"Ihre Unterstützung war vernachlässigbar"

AUS_political_events.33.desc:	"Unsere Forderung nach Entschädigung wurde von den [SPA.GetAdjective] erhört, und als Zeichen der Dankbarkeit haben sie uns einen Teil der Ausrüstung geschickt, die sie während des Bürgerkriegs von ihren Gegnern erbeutet haben, um uns für einen Teil der Ausrüstung zu entschädigen, die wir durch unsere Hilfe an sie verloren haben."

AUS_political_events.34.desc:	"Nachdem wir den [SPA.GetAdjective] in ihrem Bürgerkrieg geholfen hatten, erwarteten wir zumindest eine Art Entschädigung und Dankbarkeit, aber anscheinend haben wir uns zu viel erhofft. Mit der Begründung, unsere Hilfe sei nichts Besonderes gewesen, lehnt die Führung von [SPA.GetNameDef] die Vorstellung ab, dass wir für die geleistete Unterstützung irgendeine Art von Entschädigung erhalten sollten."
AUS_political_events.34.a:	"Wie unhöflich ..."


AUS_political_events.36.a:	"Zu gegebener Zeit werden wir bekannt sein als [GetGrossosterreichCosmeticIdeology]"
AUS_grossosterreich_neutrality_key:	"das Großösterreichische Reich"
AUS_political_events.36.b:	"Wir werden als Süddeutschland bekannt sein"
AUS_political_events.37.t:	"Ultimatum von [FROM.GetNameDef]"

AUS_integration_target_is_not_poland_key:	"Die [FROM.GetAdjective] Regierung hat uns ein Ultimatum gestellt. Entweder wir fügen uns [Get37PuppetOrNotDesc] bereitwillig, oder wir müssen uns auf dem Schlachtfeld der Macht ihrer nun wiederaufgebauten Kriegsmaschinerie stellen. Ganz gleich, welchen Weg wir in dieser Frage einschlagen, es scheint, dass es keinen Weg nach vorne ohne Konsequenzen geben wird."
AUS_political_events.37.a:	"Wir werden uns ihnen nicht unterwerfen!"
AUS_political_events.37.b:	"Wir haben keine Chance gegen sie"
37DescIsNotPuppet:	"ihre alten Staaten"
AUS_political_events.38.t:	"[FROM.GetNameDefCap] Lehnt unsere Forderungen ab"
AUS_political_events.38.desc:	"Wir wollten den [FROM.GetAdjective] eine Chance [Get38PuppetOrNotDesc] in unserer Gesellschaft geben, aber es scheint, dass unser großzügigstes Angebot nicht angenommen wurde. Letztendlich sind wir uns sehr wohl bewusst, dass es den [FROM.GetNameDef] unter unserer Führung viel besser gehen wird."

AUS_political_events.38_tt:	"Erstellt ein §YErobertes Gebiet§! Kriegsziel gegen §Y[FROM.FROM.OWNER.GetNameWithFlag]§!"
38DescIsNotPuppet:	"friedlich zu integrieren"
AUS_political_events.39.t:	"[FROM.GetNameDefCap] Kapituliert"

AUS_political_events.40.t:	 "[FROM.GetNameDefCap] Möchte sich [ROOT.GetFactionName] anschließen"
AUS_political_events.40.desc:	"[FROM.GetNameDefCap] hat sich an uns gewandt und darum gebeten, unserer Fraktion beizutreten. Sie haben mit der Aufrüstung begonnen und den Wunsch geäußert, zusammenzuarbeiten, um uns beide stärker zu machen. Historisch gesehen war diese Nation eine bedeutende Macht auf dem Schlachtfeld, und obwohl sie nun geschwächt ist, versichern sie uns dennoch, dass sie für uns die nützlichsten Verbündeten sein werden."
AUS_political_events.40.a:	"Sie sind herzlich willkommen, sich uns anzuschließen"

AUS_political_events.41.t:	"[FROM.GetNameDefCap] Stimmt unserem Beitritt zu [FROM.GetFactionName]"
AUS_political_events.41.a:	"Gemeinsam sind wir stärker!"

AUS_political_events.42.desc:	"Unser Antrag auf Beitritt zur [FROM.GetFactionName] wurde kühl abgelehnt. Wir haben versucht, unsere Nützlichkeit zu begründen, doch leider hat [FROM.GetNameDef] seine Entscheidung bereits getroffen. Auch wenn dies äußerst ärgerlich ist, lassen wir uns davon nicht entmutigen, sondern suchen stattdessen nach anderen Lösungen."

43TitleIsNotPuppet:	"Unsere Unterwerfung"
AUS_political_events.43.desc:	"Die scharf formulierte Forderung von [FROM.GetNameDef] erreichte uns heute Morgen mit der Aufforderung, unverzüglich [Get43PuppetOrNotDesc]. Kaum verhüllte Drohungen mit Gewalt durchziehen die Forderung, und es scheint wahrscheinlich, dass Feindseligkeiten folgen könnten, sollten wir diesen Vorschlag von ihnen ablehnen."
43DescIsPuppet:	"die Kontrolle über [FROM.FROM.OWNER.GetNameDef] an sie zu übergeben"
43DescIsNotPuppet:	"uns ihren Forderungen zu unterwerfen und ein Untertan unter ihrer Herrschaft zu werden"
AUS_political_events.43.a:	"Wir sind nicht in der Lage, uns zu wehren"

AUS_political_events.43.b:	"Nur über unsere Leichen"
AUS_political_events.43.c:	"Wir waren nie ihre Untertanen, aber sie können die Staaten haben, die früher zu ihnen gehörten."
43TtIsNotPuppet:	"[ROOT.GetNameDefCap]"
AUS_political_events.44.desc:	" Die Reaktion auf unsere Forderungen gegenüber [FROM.GetNameDef] war äußerst erfreulich. Sie werden sich [Get44PuppetOrNotDesc] unserer Herrschaft unterwerfen und mit sofortiger Wirkung zu unseren Untertanen werden. Dies ist ein großer Erfolg für uns in unseren Bemühungen, unser Reich wiederherzustellen!"
44DescIsPuppet:	"[FROM.FROM.OWNER.GetNameDef]"

AUS_political_events.45.desc:	 "In einer Demonstration offensichtlicher Respektlosigkeit und Missachtung ihrer eigenen Sicherheit [FROM.GetNameDef] hat beschlossen, unseren Vorschlag abzulehnen. Das Abkommen wäre für uns beide von Vorteil gewesen, doch sie scheinen unsere Ansichten diesbezüglich nicht zu teilen."
AUS_political_events.45.a:	"Dann kämpfen wir darum!"
AUS_political_events.46.b:	"Nein. Wir wollen sie unter unserer Kontrolle haben!"
AUS_political_events.47.t:	"[FROM.GetNameDefCap] Lehnt den Vorschlag ab"

AUS_political_events.48.desc:	" Angesichts der Geschichte von [FROM.GetNameDef] war es unvermeidlich, dass sie sich als unsere Oberherren früher oder später in unsere Innenpolitik einmischen würden. Uns wurde mitgeteilt, dass sie [ROOT.GetLeader] als Staatsoberhaupt unseres Landes eingesetzt haben."
AUS_political_events.49.t:	"[FROM.GetNameDefCap] fordert die Übergabe Schlesiens"

AUS_political_events.50.t:	"[FROM.GetNameDefCap] Übergeben Sie Schlesien"
AUS_political_events.50.desc:	"Wir haben eine Rückmeldung von den [FROM.GetAdjective]bezüglich unseres Wunsches erhalten, Schlesien für sie zu erwerben. Sie haben diesem Deal freundlicherweise zugestimmt und werden uns die Provinzen umgehend übertragen. Im Gegenzug haben wir ihnen einige Fabriken in Provinzen ihrer Wahl errichtet,"

AUS_political_events.52.t:	"[FROM.GetNameDefCap] fordert unsere Eingliederung"

AUS_political_events.52.b:	"Die Habsburger haben kein Recht auf Habsburg!"

AUS_political_events.53.a:	"Endlich!"
AUS_political_events.54.desc:	"Wir haben die Antwort der Führung von [FROM.GetAdjective] erhalten; sie werden unseren Forderungen nicht nachkommen. Indem sie unsere familiären Ansprüche auf die Stadt Habsburg missachten, verweigern sie uns das rechtmäßige Eigentumsrecht an dem Land und beflecken unsere Ehre. Dies kann nicht toleriert werden!"

AUS_political_events.55.t:	"[FROM.GetNameDefCap] Möchte eine Einigung über das Eigentumsrecht an [39.GetName] und [850.GetName] erzielen"
AUS_political_events.55.desc:	"Die Führung von [FROM.GetAdjective] hat sich mit einem Vorschlag an uns gewandt. Seit langem schon möchten sie [39.GetName] und [850.GetName] von uns erwerben. Sie sind mit dem Angebot an uns herangetreten, uns im Gegenzug einige Fabriken anzubieten, sollten wir ihnen diese Staaten praktisch verkaufen."
AUS_political_events.56.desc:	" [GetHostilityItalianClaimDesc56]"

AUS_political_events.57.t:	"[GetHostilityItalianClaimTitle57]"

AUS_political_events.57.desc:	"[GetHostilityItalianClaimDesc57] "
AUS_makes_demands_desc_57:	"Unsere an die Führung der [FROM.GetAdjective] gerichteten Forderungen wurden nicht wohlwollend aufgenommen. Sie lehnen unsere Forderungen ab und lassen uns keinerlei Spielraum, weiter nachzufassen oder einen weiteren Versuch zu unternehmen, solche Forderungen zu stellen."
AUS_political_events.58.t:	"[FROM.GetNameDefCap] fordert das Eigentumsrecht an [39.GetName] und [850.GetName]"

AUS_political_events.58.a:	"Gut"

AUS_political_events.59.a:	"Er muss weg!"
AUS_political_events.59.b:	"Das ist ihre Entscheidung"
AUS_political_events.60.t:	"[FROM.GetNameDefCap] lehnt Alfred Jansas Verteidigungsplan ab"

AUS_political_events.60.b:	"Umso mehr Grund, warum Alfred Jansa bleiben muss!"
AUS_political_events.60.b_tt:	"§YAlfred Jansa§! wird weiterhin als Chef der Armee zur Verfügung stehen"
AUS_political_events.61.t:	"[FROM.GetNameDefCap] Ersetzt Alfred Jansa"

AUS_political_events.61.a:	"Ausgezeichnet!"
AUS_political_events.62.desc:	"Trotz unserer Forderungen, dass [FROM.GetNameDef] den sogenannten Jansa-Plan nicht umsetzt und sicherstellt, dass dieser Mann keinerlei Macht oder Einfluss ausübt, haben die [FROM.GetAdjective]s es abgelehnt, unseren Forderungen nachzukommen. Wir können nur vermuten, dass dies nichts Gutes für unsere zukünftigen Beziehungen verheißt."

AUS_political_events.63.desc:	"Der Anschluss von [AUS.GetNameDef] hat dazu geführt, dass viele [AUS.GetAdjective], die sich dieser Entwicklung widersetzten, aus ihrer früheren Heimat verbannt wurden. Einige dieser Dissidenten sind nun in [ROOT.GetNameDef] angekommen und bieten ihre Dienste in den Fabriken, auf den Straßen und an der Front an."
AUS_political_events.63.a:	"Wir können ihre Loyalität nicht garantieren"
AUS_political_events.63.b:	"Wir könnten ihre Hilfe gut gebrauchen"

AUS_industrial_help:	"Industrielle Unterstützung"

AUS_political_events.65.desc:	"Anscheinend ohne besonderen Anlass haben die [FROM.GetAdjective] sich an uns gewandt und uns einen Preisnachlass auf ihre Ausrüstung auf dem internationalen Markt angeboten. Ob dies ein Trick ist, um uns dazu zu bringen, mehr bei ihnen zu kaufen, oder ein aufrichtiges Angebot, bleibt unklar. "
AUS_political_events.65.a:	"Es ist auf jeden Fall nützlich!"
AUS_market_help:	"Marktunterstützung"

AUS_political_events.66.a:	"Das klingt nach einem fairen Deal"
AUS_political_events.66.b:	"Davon profitieren wir überhaupt nicht!"

AUS_political_events.67.a:	"Großartig!"
AUS_political_events.68.t:	"[FROM.GetNameDefCap] Lehnt den Beitritt zur Föderativen Union ab"

AUS_political_events.68.b:	"Wir werden sie genau im Auge behalten"
AUS_political_events.69.desc:	"[GetHowAvoidedAnschluss]"

AUS_political_events.69.b:	"Sicherheit für unsere Zeit!"
AUS_political_events.69.a_tt:	"Hebt die §YAnti-Anschluss-Maßnahmen§!-Beschlüsse auf."

AUS_political_events.70.desc:	 "\n[FROM.GetLeader] von [FROM.GetNameDef] hat sich diesmal persönlich an uns gewandt. Unsere bisherigen Gespräche verliefen nicht so, wie sie es sich erhofft hatten, und sie haben beschlossen, uns ein neues Angebot zu unterbreiten, in der Hoffnung, unsere Meinung zu ändern.\n\nDa dies für sie eine sehr ernste Angelegenheit ist, haben sie angeboten, die Kosten für zwei neue Fabriken in unserem Land mitzutragen, und sie versichern uns, dass wir ihre Dankbarkeit genießen würden, sollten wir unsere Meinung ändern und ihnen eine Garantie geben."
AUS_political_events.70.a:	"Das ändert die Lage!"
AUS_political_events.70.b:	"Unsere Antwort bleibt bestehen. Nein."
AUS_political_events.71.desc:	"Unsere Bemühungen, den [FROM.GetAdjective] Anführer [FROM.GetLeader] zu überzeugen, haben sich ausgezahlt. Wir werden verpflichtet sein, den Bau von zwei Fabriken für sie zu unterstützen, und obwohl dies höchstwahrscheinlich unsere eigenen industriellen Bemühungen behindern wird, können wir nun etwas beruhigter sein, da wir wissen, dass wir sie im Falle eines Angriffs auf unsere Souveränität auf unserer Seite haben."
AUS_political_events.71.a:	"Endlich einmal gute Nachrichten! "
AUS_political_events.72.t:	"[FROM.GetNameDefCap] Weigert sich trotz Entschädigungsangebot, zu helfen"

AUS_political_events.73.t:	"[FROM.GetNameDef] schlägt eine Revision des Vertrags von Saint-Germain-en-Laye vor"
AUS_political_events.73.desc:	"\nUnbeirrt in ihren Bemühungen, die Wiederaufrüstung zu erwirken, [FROM.GetAdjective] haben sie erneut Kontakt aufgenommen und einen überarbeiteten, weniger strengen Vertrag vorgeschlagen, der es uns ermöglichen würde, das Tempo ihrer Wiederaufrüstung zu kontrollieren. Die Überarbeitung würde es ihnen gestatten, mit der Ausbildung von Truppen zu beginnen, ihre Industrie jedoch noch ein weiteres Jahr lang eingeschränkt bliebe."
AUS_political_events.73.a_tt:	"Wir werden die von [FROM.GetNameDef] vorgeschlagene Revision unterstützen. Alle Garanten müssen zustimmen, damit die Überarbeitung in Kraft treten kann."
AUS_political_events.73.b_tt:	"Wir werden §Rnicht§! die von [FROM.GetNameDef] vorgeschlagene Überarbeitung unterstützen. Alle Garanten müssen zustimmen, damit die Änderung in Kraft treten kann."

AUS_political_events.74.t:	"Die Garantiemächte stimmen der Revision des Vertrags zu"
AUS_political_events.74.a:	"Die diplomatischen Bemühungen haben sich gelohnt!"

AUS_political_events.75.desc:	"Ungeachtet unserer Bemühungen bleiben die Garantiemächte unnachgiebig. Eine Wiederaufrüstung darf uns unter keinen Umständen gestattet werden. Unsere diplomatischen Bemühungen, sie zu überzeugen und Kompromisse vorzuschlagen, stießen auf taube Ohren. Die [ROOT.GetAdjective] Bevölkerung hegt nun starken Groll gegen diese Garantiemächte."
AUS_political_events.75.a:	"Wir müssen einfach durchhalten"

AUS_political_events.77.t:	"Eine unmittelbare Bedrohung"
AUS_political_events.77.desc:	"Einige unserer erfahrensten und kompetentesten Diplomaten beobachten seit langem das Risiko, dass [GER.GetNameDef] die Pläne umsetzen könnte, die von [GER.GetLeader] mal bestätigt, mal dementiert werden. Es scheint, als habe sich in letzter Zeit eine ziemlich radikale Wende vollzogen, und unsere Quellen gehen nun davon aus, dass ein Versuch, uns zu annektieren, sehr wohl unmittelbar bevorstehen könnte."
AUS_political_events.77.a:	"Machen Sie sich auf den Aufprall gefasst ..."

AUS_political_events.78.b:	"Wir haben Besseres zu tun"

AUS_political_events.79.a:	"Großartig!"
AUS_political_events.80.t:	"[FROM.GetNameDefCap] lehnt unseren Hilferuf ab"

AUS_political_events.80.a:	"Wir hatten wirklich geglaubt, sie würden uns helfen!"

AUS_aligned_with_our_values:	"Im Einklang mit unseren Werten"
AUS_political_events.82.t:	"[FROM.GetNameDefCap] bietet Garantie"
AUS_political_events.82.desc:	" Unsere Entscheidung, uns stärker an der politischen Ideologie von [FROM.GetLeader] auszurichten, wurde positiv aufgenommen. [FROM.GetNameDefCap] hat uns eine Garantie angeboten und wird uns unterstützen, sollten wir Feindseligkeiten ausgesetzt sein."

AUS_political_events.83.desc:	"Unsere Entscheidung, uns stärker an der politischen Ideologie von [FROM.GetLeader] auszurichten, wurde positiv aufgenommen. [FROM.GetNameDefCap] hat zum Ausdruck gebracht, dass sie diesen Schritt als einen Schritt in die richtige Richtung zu schätzen und dass sie hoffen, uns in Zukunft als Verbündete zu sehen."

AUS_political_events.84.b:	"Verbieten Sie sie!"
AUS_political_events.84.b_tt:	"§RDies könnte schwerwiegende Folgen haben!§!"

AUS_political_events.85.a_tt:	 "Schaltet Entscheidungen frei, um §Ydie Befreiung der Arbeiter zu fordern§!, sobald der Schwerpunkt §Ydie Befreiung der Arbeiter zu fordern§! abgeschlossen ist"
AUS_political_events.85.2.a_tt:	"Schaltet die Entscheidung frei, §Ydie Befreiung der Arbeiter in [FROM.GetNameDef]§!zu fordern."

AUS_political_events.86.b:	"Wir werden dieser Feindseligkeit ein Ende setzen!"
AUS_political_events.87.t:	 "[FROM.GetAdjective] Forderungen nach einem kommunistischen Regime"

AUS_political_events.87.b:	"Wir treffen unsere eigenen Entscheidungen."
AUS_political_events.88.desc:	"Unsere unermüdlichen Bemühungen in [FROM.GetNameDef] haben sich endlich ausgezahlt. Die Arbeiter jubeln, als der neue Führer [FROM.GetLeader] die Führung des Landes übernimmt."
AUS_political_events.88.a:	"Willkommen, Genossen!"
AUS_political_events.89.t:	"[FROM.GetNameDefCap] Lehnt unsere Forderungen ab"

AUS_political_events.90.t:	"Die Ergebnisse unserer Wahl"

AUS_political_events.90.c:	"Vinzenz Schumy kann die meisten Wähler ansprechen!"

AUS_political_events.91.a_tt:	"Die neue Hauptstadt wird §YVaduz§! heißen."
AUS_political_events.91.a_tt2:	 "§YOtto von Habsburg§! wird §YFähigkeit 2§! Feldmarschall"

AUS_political_events.92.b:	"Wir haben keine Verwendung für [463.GetName]"
AUS_political_events.93.t:	"[FROM.GetNameDefCap] uns [463.GetName] verkauft"
AUS_political_events.93.a:	"Großartig"
AUS_political_events.94.t:	" [FROM.GetNameDefCap] Weigert sich zu verkaufen [463.GetName]"

AUS_political_events.94.b:	"Wir werden sie befreien!"

AUS_political_events.95.a:	"Willkommen bei [ROOT.GetNameDef]!"
AUS_political_events.96.desc:	"[FROM.GetLeader] aus dem kürzlich demokratisch gewordenen [FROM.GetName] hat sich mit der Bitte an uns gewandt, [ROOT.GetFactionName] beizutreten. Obwohl sie seit dem Ende des Großen Krieges auf sich allein gestellt waren, haben das aktuelle politische Klima und die zunehmenden Spannungen in der Welt sie zu einem Sinneswandel bewogen. Da sie nun wieder eine echte Demokratie sind, haben sie beschlossen, sich an uns zu wenden, und versichern uns, dass sie eine große Bereicherung für die Fraktion sein werden!"

AUS_political_events.96.b:	"Wir trauen ihnen nicht."
AUS_political_events.97.t:	" [FROM.GetNameDefCap] Heißt uns willkommen bei der [ROOT.GetFactionName]"
AUS_political_events.97.desc:	"Unser Antrag auf Beitritt zur [ROOT.GetFactionName] wurde genehmigt! Auch wenn wir fest davon überzeugt sind, dass dieser radikale Kurswechsel genau das war, was unser Land brauchte, ist die Lage dennoch ernst. Nach dem Großen Krieg haben wir alle Bündnisse aufgelöst, in der Hoffnung, dass sich eine ähnliche Situation nie wieder ereignen möge. Während wir uns nun in der relativen Sicherheit unseres neuen Bündnisses einleben, tun wir dies in dem Bewusstsein, dass Frieden in der Tat eine zerbrechliche Sache ist."

AUS_political_events.98.b:	"Es sieht so aus, als müssten wir alles selbst erledigen!"

AUS_political_events.99.desc:	"[GetRejectionAmounts]"
AUS_has_not_rejected_before:	"[FROM.GetLeader] der [FROM.GetAdjective] Führung hat auf unsere Forderungen geantwortet. Der Brief ist diplomatisch formuliert, enthält jedoch dennoch einen beleidigenden Unterton. Unsere Bedenken wurden abgetan, als wären sie nichts, was bedeutet, dass unsere Bedenken bezüglich [FROM.GetNameDef] tatsächlich berechtigt waren. Aus den Reihen unserer Führung wurden Stimmen laut, wir sollten weiterhin Druck auf die [FROM.GetAdjective] ausüben, damit sie nachgeben, da dies die Umsetzung unserer Zukunftspläne für sie erleichtern könnte; eine Minderheit vertritt jedoch die Ansicht, wir sollten in Erwägung ziehen, den [FROM.GetAdjective] diesen sinnlosen Sieg zuzugestehen."
AUS_GER_cannot_take_a_no:	"Trotz anhaltenden und zunehmenden Drucks auf [FROM.GetNameDef] hält [FROM.GetLeader] an [FROM.GetLeader.GetHerHis] fest. Arthur Seyss-Inquart wird nicht als Berater in die Regierung aufgenommen werden, ganz gleich, was wir sagen oder tun. Wir werden einen Weg finden müssen, dies zu umgehen; es wird nur eine geringfügige Unannehmlichkeit sein."

AUS_political_events.99.b:	"Lassen Sie sie das haben, lassen Sie sie ihre Wachsamkeit verringern ..."
AUS_bullied_austria:	"Eingeschüchtert [AUS.GetNameDef]"
AUS_political_events.100.desc:	" \nTrotz unserer früheren Ablehnung, Arthur Seyss-Inquart in unsere Regierung zu berufen, wird der [FROM.GetAdjective] Führer [FROM.GetLeader] nicht aufhören, dies zu fordern. Auch wenn der Druck auf uns dadurch zugenommen hat, behalten wir dennoch unsere Souveränität und die Kontrolle über unsere eigene Politik, und die Entscheidung liegt weiterhin bei uns."

AUS_political_events.100.b:	"Wir riskieren Vergeltungsmaßnahmen, wenn wir uns weigern"

AUS_political_events.101.a:	"Endlich"
AUS_political_events.102.t:	"Der Führer plant die Expansion"
AUS_political_events.102.desc:	"Bei einer kürzlich von [ROOT.GetLeader] einberufenen Konferenz teilte der Führer einige seiner Ambitionen für die zukünftige Expansion von [ROOT.GetNameDef] mit. Die erste dieser Expansionen ist eine, die [ROOT.GetLeader.GetSheHe] als risikoarm einschätzt. Das Volk von [AUS.GetAdjective] unterscheidet sich nicht von unserem, und es vertritt größtenteils ähnliche Ansichten, wie das politische Klima im Land belegt. Der Führer ist der Ansicht, dass eine solche Erweiterung auf diplomatischem Wege erreicht werden kann, sofern genügend Zeit bleibt, damit [ROOT.GetAdjective]-freundliche Gefühle innerhalb von [AUS.GetNameDef] wachsen können."
AUS_political_events.102.a:	"Eine wunderbare Idee!"

AUS_political_events.103.a:	"Das ist schlimm."

AUS_political_events.104.desc:	"Heute Morgen fand ein höchst ungewöhnliches Treffen statt. Unsere Führung stand einem seltsamen Mann gegenüber, bei dem sie das Gefühl nicht loswurden, ihn schon einmal gesehen zu haben; sogar seine Stimme kam ihnen bekannt vor. Dieser Mann behauptet, er sei ein aufstrebender Künstler, er sei aus [GER.GetNameDef] angereist und wolle uns helfen. Er gibt an, ein fähiger Anführer zu sein, und dass unser Land dringend einen solchen benötige.\n\nAuf Nachfrage bei unseren Grenzbeamten bestreiten diese, dass jemand mit diesem Namen die Grenze überquert habe, und dass eine gewisse Elizabeth Hiedler die größte Ähnlichkeit aufweise."
AUS_political_events.104.b:	"Was könnte schon schiefgehen?"

AUS_british_monarch:	"Die Anführerin stammt aus einer langen Linie britischer Königinnen"
AUS_political_events.105.t:	"[FROM.GetNameDefCap] zieht seine Unterstützung zurück"
AUS_political_events.105.desc:	"Da [GER.GetNameDef] immer aggressiver darauf drängte, dass wir uns von ihnen annektieren lassen, dachten wir, wir könnten uns auf die [ITA.GetAdjective] und ihre Garantie verlassen. Es scheint, dass dies nicht der Fall war. Als sie mit der Bedrohung durch die Aggression von [GER.GetAdjective] konfrontiert wurden, zogen sie sich sofort zurück und ließen uns in einer prekären Lage zurück. Es scheint, als seien ihre Versprechen nichts als leere Worte gewesen."

AUS_political_events.106.desc:	"Angesichts der jüngsten Feindseligkeiten seitens [GER.GetNameDef] haben die [ITA.GetAdjective] sich an uns gewandt, um ihre Unterstützung zu bekräftigen. Ungeachtet der Drohungen werden sie unsere Unabhängigkeit garantieren, und sollte es zu einem bewaffneten Konflikt kommen, werden sie an unserer Seite kämpfen."
AUS_political_events.106.a:	"Die [GER.GetAdjective] werden ihre Handlungen bereuen!"
AUS_political_events.107.t:	"[FROM.GetNameDefCap] gibt dem Druck der [GER.GetAdjective] nach "

AUS_political_events.107.b:	"Es ist eine aussichtslose Sache"
AUS_political_events.108.t:	"[FROM.GetNameDefCap] führt eine Militärübung an unserer Grenze durch"
AUS_political_events.108.desc:	 "Uns ist zu Ohren gekommen, dass die [FROM.GetAdjective] Armee direkt an unserer Grenze eine ziemlich große Militärübung begonnen hat. Obwohl keine Drohung ausgesprochen wurde, können wir das Gefühl nicht abschütteln, dass dies eine Art Warnung vor dem ist, was noch kommen wird. Wir müssen bei unseren Handlungen ihnen gegenüber vorsichtig sein, damit sie nicht noch heftiger zurückschlagen."

AUS_political_events.109.a:	"Beunruhigend. .."
AUS_political_events.110.t:	"Anti-[ROOT.GetAdjective]-Stimmungen nehmen in [FROM.GetNameDef] zu"

AUS_political_events.111.t:	"[FROM.GetNameDefCap] bietet Nichtangriffspakt an"

AUS_political_events.112.desc:	" Unsere Pläne für [FROM.GetNameDef] sind heute einen Schritt vorangekommen, da wir nun einen Nichtangriffspakt unterzeichnet haben. Wir werden unsere Bemühungen fortsetzen, sie noch enger an uns zu binden. Die Zukunft ist noch ungeschrieben, doch sollten wir unsere Pläne weiter vorantreiben wollen."
AUS_political_events.112.a:	"Ausgezeichnet"
AUS_political_events.113.t:	"[FROM.GetNameDefCap] Lehnt den Nichtangriffspakt ab"

AUS_political_events.114.t:	"[FROM.GetNameDef] Bietet industrielle Unterstützung an"
AUS_political_events.114.desc:	"Angesichts unserer jüngsten Vereinbarung über den Frieden zwischen unseren Ländern haben die [FROM.GetAdjective] uns industrielle Unterstützung angeboten. Obwohl unser Industriesektor normalerweise unseren Standards entspricht, ist ihre Hilfe natürlich willkommen. Es wurden einige warnende Stimmen laut, die behaupten, dass [FROM.GetNameDefCap] dies sicherlich aus einem bestimmten Grund tut."
AUS_political_events.114.a:	"Richten Sie unseren Dank aus."
AUS_political_events.115.t:	"Vorgeschlagene [FROM.GetAdjective]-[ROOT.GetAdjective] Militärübung"

AUS_political_events.115.b:	"Das klingt verdächtig ..."
AUS_political_events.116.t:	"[ROOT.GetAdjective]-[FROM.GetAdjective] Militärübung abgeschlossen"
AUS_political_events.116.desc:	" Heute findet die [ROOT.GetAdjective]-[FROM.GetAdjective] Militärübung ihren Abschluss. Unsere Truppen haben von dieser Übung sehr profitiert, und wir hoffen, dass auch die [FROM.GetAdjective] davon profitiert hat. Ein genauerer Einblick in die Operationen der [FROM.GetAdjective] Armee verschafft uns zudem einen guten Überblick darüber, womit wir mit wem wir zusammenarbeiten müssen, sobald unsere Pläne bezüglich ihrer Zukunft verwirklicht sind."
AUS_political_events.116.a:	"Ausgezeichnet!"

AUS_political_events.118.t:	"Organisation eines Imperiums"
AUS_political_events.118.desc:	"Da wir den Weg zum Wiederaufbau unseres Reiches eingeschlagen haben, stellt sich uns erneut die Frage, wie wir das Reich organisieren wollen. Unsere Vorgänger sind in dieser Frage gescheitert, was zu einem großen, aber unorganisierten Reich geführt hat. Uns wurde der Vorschlag unterbreitet, eine Fraktion zu bilden, um sicherzustellen, dass unsere Vasallen uns treu bleiben, aber auch darauf verzichten, untereinander zu streiten."
AUS_political_events.118.a:	"Sie werden sich uns anschließen müssen"
AUS_political_events.118.c:	"Wir werden hierfür eine geeignete Organisation einrichten! "

AUS_political_events.119.desc:	"Obwohl sie bereits beträchtliche Ansprüche auf dem Balkan gestellt haben, scheinen die [FROM.GetAdjective]s immer noch mehr zu wollen. Die Forderungen, die sie dieses Mal stellen, würden unseren Interessenbereich beeinträchtigen, sollten wir zustimmen; gleichzeitig könnten die von ihnen erwähnten Konsequenzen einer Ablehnung sehr wohl verheerend sein."

AUS_political_events.120.desc:	"Unsere territorialen Forderungen an die Führung der [FROM.GetAdjective] wurden positiv aufgenommen. Obwohl wir dies erwartet hatten, ist es dennoch sehr erfreulich, keine drastischeren Maßnahmen ergreifen zu müssen, um unser rechtmäßiges Territorium zu sichern."
AUS_political_events.120.a:	"Herrlich."

AUS_political_events.121.a:	"Wir werden dieses Land zurückerobern!"
AUS_political_events.122.t:	"Das Geräusch von [ROOT.GetAdjective] U-Booten?"
AUS_political_events.122.a:	"Fantastisch, nehmen Sie ihn in die Marine auf!"

AUS_political_events.123.t:	"Die [FROM.GetAdjective]Reformen der Mittelmächte"
AUS_political_events.123.a:	"Wir werden zusammenstehen!"

AUS_political_events.125.t:	"[FROM.GetNameDefCap] Lehnt unsere Einladung ab"

AUS_political_events.125.a:	"Wenn sie nicht auf unserer Seite stehen ..."
AUS_news_events.1.t:	"[AUS.GetNameDefCap] lehnt [GER.GetAdjective] den Anschluss ab"
AUS_news_events.1.desc:	"Angesichts eines weitaus stärkeren Feindes hat die Führung von [AUS.GetAdjective] beschlossen, den jüngsten Forderungen nach Unterwerfung und Anschluss an [GER.GetAdjective] nicht nachzugeben. Truppen aus [GER.GetNameDef] haben sich an der [AUS.GetAdjective] Grenze aufgestellt, doch bleibt abzuwarten, ob eine groß angelegte Invasion eingeleitet wird.\n\nDiese Ereignisse folgen auf Jahre der Verschlechterung der Beziehungen zwischen den Ländern und den zunehmenden Druck seitens der [GER.GetAdjective] auf [AUS.GetNameDef], sich in [GER.GetNameDef] zu integrieren."

AUS_news_events.1.c:	"Östfrei!"
AUS_news_events.3.b:	"Tragisch"
AUS_news_events.4.t:	"Jägerass entgeht knapp einer Katastrophe"

AUS_news_events.5.desc:	 "\n[AUS.GetLeader] von [AUS.GetNameDef] hat kürzlich seine Absicht bekundet, den Vertrag von Saint-Germain-en-Laye ein für alle Mal aufzuheben und erneut aufzurüsten. Der Vertrag wurde nach dem Großen Krieg geschlossen, um [AUS.GetNameDef] davon abzuhalten, die Taten zu wiederholen, die den Krieg ausgelöst und zur Machterweiterung geführt hatten. Theoretiker vermuten, dass dies eine Reaktion auf die langsam steigenden Spannungen in der Welt ist; ob diese Militarisierungsbemühungen defensiven oder aggressiven Zwecken dienen sollen, bleibt abzuwarten."
AUS_news_events.5.b:	"Endlich!"
AUS_news_events.6.t:	"[AUS.GetNameDefCap] Reformiert die Mittelmächte"

AUS_news_events.6.b:	"Ein großartiger Tag!"
AUS_news_events.7.t:	"Otto von Habsburg kehrt nach [AUS.GetNameDef] zurück"

AUS_news_events.8.desc:	"Unter der Herrschaft von [AUS.GetLeader] [AUS.GetNameDef] hat die Stadt Habsburg zurückerobert. Nachdem sie die [SWI.GetAdjective] ihrem Willen unterworfen hatten, bestand die Absicht darin, die Macht der Habsburger zu stärken, was eine deutliche Rückkehr zu einer weitaus imperialistischeren [AUS.GetName] markiert."
AUS_news_events.8.a:	"Warum sollten sie das tun?"

AUS_news_events.9.t:	"Kommunistischer Staatsstreich in [FROM.GetNameDef]"
AUS_news_events.9.desc:	"Nach einer über einen langen Zeitraum hinweg wachsenden Unterstützung für [FROM.GetCommunistParty] in [FROM.GetNameDef] ist in [FROM.GetNameDef] ein friedlicher Staatsstreich erfolgt. Die Kommunisten haben friedlich die Macht im Land übernommen und sich ohne nennenswerten Widerstand in der Regierung etabliert. \n\nDies markiert eine drastische Wende gegenüber dem, was [FROM.GetNameDef] in den letzten Jahrzehnten geprägt hat."

AUS_news_events.9.c:	"Endlich!"
AUS_news_events.10.desc:	" In [FROM.GetNameDef] ist ein gewaltsamer Bürgerkrieg ausgebrochen. Die Kommunisten [FROM.GetCommunistParty] haben einen Aufstand gegen die regierende [FROM.GetNeutralParty] begonnen. Da sie in jüngster Zeit beträchtliche Unterstützung gewonnen haben, sind die Kommunisten in [FROM.GetNameDef] zu einer ernstzunehmenden Kraft geworden."
AUS_news_events.10.b:	"Gute Arbeit und viel Glück!"

AUS_news_events.11.b:	"Wir wünschen ihnen alles Gute!"
AUS_news_events.11.c:	"Ein großartiger Tag für [AUS.GetNameDef]!"

AUS_news_events.12.desc:	 "\nZum ersten Mal seit dem 11. September 1930 [AUS.GetNameDef] hat demokratische Wahlen abgehalten. Die Wahlbeteiligung war hoch, und als die Auszählung der Stimmen zu Ende ging, [AUS.GetLeader] von [AUS.GetDemocraticParty] steht als Sieger fest. Ihm steht nun die schwierige Aufgabe, das Land auf einen neuen, demokratischeren Weg zu führen."

WW_hungary.1.a:	"Zweifellos ein Segen"
WW_hungary.2.t:	"[FROM.GetAdjective] Waffenlieferungen treffen ein"
WW_hungary.2.desc:	"Die [FROM.GetAdjective] Regierung hat sich in unseren Kriegsanstrengungen offen für unser Land eingesetzt. Als Teil ihrer neuen Unterstützung hat sie uns Waffenlieferungen geschickt. Dies wird uns in diesem Krieg sicherlich helfen."
 
WW_hungary.3.b:	"Lösen Sie diese Szegeder Faschisten sofort auf!"

HUN_gombos_has_died_flag:	"§YGyula Gömbös§! ist verstorben"
WW_hungary.4.t:	"[HUN.GetNameDefCap] fordert Siebenbürgen"

WW_hungary.5.t:	"[FROM.GetNameDefCap] übergibt Siebenbürgen"
WW_hungary.5.desc:	"Anstatt sich der Macht unserer Armeen zu stellen, haben die feigen [FROM.GetAdjective] beschlossen, unsere rechtmäßigen Gebiete zurückzugeben. Ihre gesamten kontrollierten Gebiete in Siebenbürgen wurden unserer Verwaltung übergeben, und unsere Streitkräfte haben die volle Kontrolle übernommen."

WW_hungary.6.desc:	"Die arroganten Anführer in [FROM.getNameDef] haben unser Friedensangebot abgelehnt und behaupten, dass Krieg ihnen lieber sei, als Siebenbürgen an uns zu übergeben. Vielleicht haben sie unseren Bluff durchschaut, oder vielleicht ist jetzt der richtige Zeitpunkt, um gegen sie vorzugehen. Nur die Zeit wird es zeigen."
WW_hungary.6.a:	"Dann soll es Krieg geben"
WW_hungary.6.b:	"Es ist die Mühe einfach nicht wert"

WW_hungary.7.desc:	"Der unbesonnene [FROM.GetLeader] hat kürzlich unsere, wie er es nannte, unrechtmäßige Besetzung der [FROM.GetAdjective] Südslowakei angeprangert. Nun haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir reagieren?"

WW_hungary.8.a:	"Wir brauchen jede Hilfe, die wir bekommen können ..."
WW_hungary.8.b:	"Und wie viel ist ihre Garantie genau wert?"


WW_hungary.11.t:	"[FROM.GetNameDefCap] Fordert die Kontrolle über unsere [SLO.GetAdjective] Gebiete"
WW_hungary.11.desc:	"Der Unbesonnene [FROM.GetLeader] hat kürzlich unsere, wie er es nannte, unrechtmäßige Besetzung der [FROM.GetAdjective] Slowakei angeprangert. Nun haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir reagieren?"


WW_hungary.13.desc:	"Obwohl nicht völlig unerwartet, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation nach Erhalt unseres Ultimatums in höchste Alarmbereitschaft versetzt und einen Gesandten entsandt, der erklärte, dass sie in dieser Streitfrage keinen einzigen Schritt zurückweichen werden."
WW_hungary.13.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.13.b:	"Wir müssen dies auf sich beruhen lassen"

WW_hungary.15.t:	" [FROM.GetNameDefCap] Überträgt die Vojvodina"
WW_hungary.15.a:	"Großartig"

WW_hungary.16.desc:	"In einem angespannten Treffen mit [FROM.GetLeader] wurde unserer Delegation mitgeteilt, dass die Souveränität der Vojvodina nicht zur Diskussion stehe und dass die [FROM.GetAdjective]-Regierung sich unter keinen Umständen einem solchen Druck beugen werde. Die Bevölkerung der Vojvodina hatte 1919 ihr Wort, und sie entschied sich damals gegen einen Beitritt zu uns. Was die [FROM.GetAdjective]-Regierung betrifft, ist die Angelegenheit damit abgeschlossen."
WW_hungary.16.b:	"Sie werden diesen Tag bereuen"
WW_hungary.17.t:	"[HUN.GetName] fordert die Besetzung des Westbanats"

WW_hungary.17.b:	"Was glauben die eigentlich, wer sie sind?"

WW_hungary.19.t:	"Der törichte [FROM.GetLeader] hat unser Ultimatum abgelehnt"
WW_hungary.19.desc:	"Der törichte [FROM.GetLeader] von [FROM.GetNameDef] hat uns unseren rechtmäßigen Anspruch verweigert, und nun ist es an der Zeit, [FROM.GetNameDef] mit einem einzigen, schnellen Angriff zu vernichten. Dies wird unsere Ansprüche auf Westbanat für die nahe Zukunft sicherlich sichern."

WW_hungary.20.a:	"Dies ist kein Konflikt, den wir gewinnen können"
WW_hungary.21.t:	"[FROM.GetNameDefCap] überträgt Karpatenrussland"
WW_hungary.21.a:	"Großartig"
WW_hungary.22.desc:	"Obwohl nicht völlig unerwartet, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation nach Erhalt unseres Ultimatums in höchste Alarmbereitschaft versetzt und einen Gesandten entsandt, der erklärt, dass sie in Bezug auf den Streit in Karpatenrussland keinen einzigen Schritt zurückweichen werden."

WW_hungary.22.b:	"Wir müssen dies auf sich beruhen lassen"
WW_hungary.23.t:	"[FROM.GetNameDefCap] fordert das Burgenland"
WW_hungary.23.desc:	"Die [HUN.GetAdjective] Regierung hat begonnen, in der Burgenland-Frage mehr Druck auszuüben, und erklärt, dass es während des Kaiserreichs zu Ungarn gehörte und daher zurückgegeben werden müsse. Sie behaupten, dass die Lajtabánság in dem Gebiet wiederhergestellt werden müsse und dass unsere Regierungsführung illegitim sei. Wie sollen wir reagieren?"

WW_hungary.24.t:	"[FROM.GetNameDefCap] Überträgt das Burgenland"

WW_hungary.25.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.25.b:	"Wir müssen dies auf sich beruhen lassen"

WW_hungary.26.a:	"Sie sind herzlich willkommen, sich uns anzuschließen"
WW_hungary.26.b:	"Wir haben keine Verwendung für sie"
WW_hungary.27.t:	"[FROM.GetNameDefCap] Lassen Sie uns ihnen beitreten"

WW_hungary.28.desc:	" Der widerwärtige [FROM.GetLeader] von [FROM.GetNameDef] hat unseren Antrag abgelehnt und damit im Grunde alle Möglichkeiten einer Zusammenarbeit zwischen unseren Staaten in naher Zukunft zunichte gemacht. Wir werden daher andere Bündnisse suchen oder auf uns allein gestellt sein müssen."
WW_hungary.28.a:	"Es sollte einfach nicht sein"

WW_hungary.29.desc:	" Die Regierung in [FROM.GetNameDef] hat ihre Absicht bekannt gegeben, die Pragmatische Sanktion von 1713 wieder in Kraft zu setzen, wodurch faktisch erneut ein Habsburger den Thron besteigen könnte – was unseren Forderungen nach dem Ersten Weltkrieg zuwiderläuft. Wir können es nicht wirklich rechtfertigen, deswegen in den Krieg zu ziehen, aber da sie bald eine Bedrohung für uns darstellen könnten, sollten wir vielleicht versuchen, Druck auf sie auszuüben?"
WW_hungary.29.b:	"Embargo und Protest verhängen"

WW_hungary.30.b:	"Sie können uns nicht dazu zwingen!"
HUN_habsburg_refused_promises_of_peace:	"Friedensversprechen an die Kleine Entente abgelehnt"

WW_hungary.32.t:	"[FROM.GetLeader] Fordert, dass wir die Herrschaft der Habsburger wiederherstellen"
WW_hungary.32.desc:	"Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] hat gefordert, dass wir die cisleithanischen Gebiete zurückgeben und erneut einen Habsburger als unseren Monarchen krönen. Dies würde im Grunde unsere Unabhängigkeit beenden, könnte uns jedoch vor einer vollständigen Annexion bewahren. Nehmen wir einen Platz in der neuen kaiserlichen Föderation an? "
WW_hungary.32.a:	"Sie haben recht"
WW_hungary.32.b:	"Die Habsburger wurden aus gutem Grund ins Exil geschickt!"

WW_hungary.33.desc:	" Die weise Führung in [FROM.GetNameDef] hat beschlossen, gemäß unseren Forderungen einen Habsburger Monarchen zu krönen und zugunsten ihres neuen Königs abzutreten. Ein neuer Morgen wird über unserer imperialen Föderation anbrechen!"
WW_hungary.34.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, nicht von ihren Ämtern zurückzutreten, da sie irgendwie glaubt, weiser zu sein als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Joseph August auf ihren Thron setzen, ob es ihnen gefällt oder nicht!"

WW_hungary.35.a:	"Sie sind herzlich willkommen, sich uns anzuschließen"
WW_hungary.35.b:	"Wir haben keine Verwendung für sie"

WW_hungary.36.a:	"Lassen Sie uns gemeinsam unsere Zukunft gestalten!"
WW_hungary.37.desc:	"Der widerwärtige [FROM.GetLeader] von [FROM.GetNameDef] hat unseren Antrag abgelehnt und damit im Grunde alle Möglichkeiten einer Zusammenarbeit zwischen unseren Staaten in naher Zukunft zunichte gemacht. Wir werden daher andere Bündnisse suchen oder auf uns allein gestellt sein müssen."
WW_hungary.38.t:	"[FROM.GetNameDefCap] lädt uns zu den Mittelmächten ein"

WW_hungary.38.a:	"Sie werden niemals allein dastehen"
WW_hungary.38.b:	"Sie sind nur eine Belastung"
WW_hungary.39.t:	"[FROM.GetNameDefCap] tritt den Mittelmächten bei"
 
WW_hungary.40.desc:	"Der abscheuliche [FROM.GetLeader] von [FROM.GetNameDef] hat unseren Antrag abgelehnt und damit im Grunde alle Möglichkeiten einer Zusammenarbeit zwischen unseren Staaten in naher Zukunft zunichte gemacht. Wir werden daher andere Bündnisse suchen müssen, da sie nicht bereit sind, eines mit uns einzugehen."
WW_hungary.40.b:	" Wir müssen einen anderen Ansatz versuchen"
WW_hungary.41.t:	"[FROM.GetNameDefCap] Möchte die Große Allianz wiederherstellen"


 # Hungarian country events

WW_hungary.42.desc:	" Der große und ehrenwerte [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, ein neues Militärbündnis zu bilden. Unser Volk ist auf die Straßen gegangen, um diesen bedeutsamen Anlass zu feiern, da er die Wiedergeburt des Staates [ROOT.GetAdjective] und den Beginn einer neuen Ära für sein Volk markiert."
WW_hungary.42.a:	"Lassen Sie uns gemeinsam unsere Zukunft schützen!"

WW_hungary.44.t:	"[FROM.GetLeader] fordert die Wiederherstellung der Herrschaft von Wied"

WW_hungary.44.a:	"Sie haben recht"
WW_hungary.44.b:	"Die Wiedisten wurden aus gutem Grund verbannt!"
WW_hungary.45.t:	"[FROM.GetNameDefCap] Akzeptiert einen wiedistischen Monarchen"
WW_hungary.45.a:	"Sie haben die richtige Entscheidung getroffen"

WW_hungary.47.t:	"[FROM.GetLeader] Fordert die Wiederherstellung der Habsburger Herrschaft"
WW_hungary.47.desc:	"Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] hat gefordert, dass wir die Herrschaft der Habsburger über unsere Länder wiederherstellen, wie es im Gesetz vom 5. November vereinbart wurde, und erneut einen Habsburger als unseren Monarchen krönen. Dies würde uns mit ihnen verbünden und uns ermöglichen, ihrem Bündnis beizutreten, ohne unsere Unabhängigkeit vollständig aufzugeben. "
WW_hungary.47.a:	"Es ist unsere Pflicht"

WW_hungary.48.a:	"Sie haben die richtige Entscheidung getroffen"

WW_hungary.49.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, nicht von ihren Ämtern zurückzutreten, da sie irgendwie glaubt, weiser zu sein als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Karl Albrecht auf ihren Thron setzen, ob es ihnen gefällt oder nicht!"

WW_hungary.51.t:	"[FROM.GetLeader] Fordert, dass wir die Herrschaft der Habsburger wiederherstellen"
WW_hungary.51.a:	"Es ist unsere Pflicht"
WW_hungary.51.b:	"Was glauben die eigentlich, wer sie sind?"

WW_hungary.52.desc:	"Die weise Führung in [FROM.GetNameDef] hat beschlossen, gemäß unseren Forderungen einen Habsburger Monarchen zu krönen und zugunsten ihres neuen Königs abzutreten."
WW_hungary.52.a:	"Sie haben die richtige Entscheidung getroffen"

WW_hungary.54.t:	"[FROM.GetNameDefCap] Weist uns einen Habsburger Monarchen zu"
WW_hungary.54.desc:	"[FROM.GetNameDefCap] hat Vasyl Vyshyvanyi von Habsburg zum neuen König unserer Nation ernannt. Dies wird unser Regime sicherlich stärken."
WW_hungary.54.a:	"In der Tat"

WW_hungary.55.desc:	"Angesichts der jüngsten dramatischen Veränderungen in der politischen Landschaft des Balkans ist die Frage nach unserem Verhältnis zum neuen Österreichisch-Ungarischen Reich wiederholt aufgekommen. Heute hat der ungarische Botschafter eine offizielle Note übergeben, in der er uns förmlich auffordert, unsere Haltung gegenüber dem Reich zu erklären. Die Habsburger behaupten, dass Böhmen und Mähren als alte Kronländer zu ihnen gehören. \n\nAllerdings hat [HUN.GetLeader] angedeutet, dass er eine Kompromisslösung akzeptieren würde, bei der er nominell Staatsoberhaupt unseres Landes wäre, jedoch nur über sehr geringe tatsächliche Macht verfügen würde."
WW_hungary.55.a:	"Wir werden zum Reich zurückkehren."
WW_hungary.55.b:	"Wir werden niemals unsere Freiheit für Sicherheit aufgeben!"

WW_hungary.57.t:	"[CZE.GetNameDefCap] lehnt Annäherungsversuche ab"
WW_hungary.57.desc:	" [CZE.GetNameDefCap] hat sich geweigert, irgendeine Art von Einigung oder Vereinbarung bezüglich ihrer zukünftigen Beziehung zu uns in Betracht zu ziehen. Als unser Botschafter im Außenministerium eintraf, um die zuvor überbrachte offizielle Note zu erörtern, wurde ihm mitgeteilt, dass es nichts zu besprechen gäbe, und man führte ihn zügig zur Tür hinaus. Der [CZE.GetAdjective] Botschafter bei unserer Regierung hat erklärt, dass, seine Regierung zwar eine friedliche und freundschaftliche Beziehung zwischen unseren Nationen anstrebe, es jedoch keine Möglichkeit gebe, [CZE.GetNameDef] in das Österreichisch-Ungarische Reich einzugliedern."

WW_hungary.58.t:	"[FROM.GetNameDefCap] fordert die Kontrolle über Galizien und die Bukowina"
WW_hungary.58.desc:	"Der unbesonnene [FROM.GetLeader] hat kürzlich unsere, wie er es nannte, unrechtmäßige Besetzung unserer galizischen und bukowinischen Gebiete angeprangert. Nun haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir reagieren?"
WW_hungary.58.a:	"Es lohnt sich nicht, dafür Blut zu vergießen"

WW_hungary.59.t:	"[FROM.GetNameDefCap] übergibt ihre Gebiete in Galizien und der Bukowina"

WW_hungary.60.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.60.b:	"Wir müssen dies auf sich beruhen lassen"
WW_hungary.61.t:	"[FROM.GetNameDefCap] stellt die Herrschaft von Iturbide wieder her"
WW_hungary.61.desc:	"[FROM.GetNameDefCap] hat María Josepha Sophia de Iturbide zur neuen Königin unserer Nation ernannt. Dies wird unser Regime sicherlich stärken."

WW_hungary.62.desc:	" Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] hat gefordert, dass wir die Herrschaft der Iturbide-Habsburger über unsere Länder wiederherstellen, wie es von 1821 bis 1823 und von 1864 bis 1867 der Fall war, und erneut einen Monarchen krönen. Dies würde uns mit ihnen in Einklang bringen und uns ermöglichen, ihrem Bündnis beizutreten, ohne unsere Unabhängigkeit vollständig aufzugeben."

WW_hungary.63.t:	"[FROM.GetNameDefCap] Akzeptiert die kaiserliche Herrschaft"
WW_hungary.63.a:	"Sie haben die richtige Wahl getroffen"

WW_hungary.65.t:	"[FROM.GetNameDefCap] Ernennt uns einen Habsburger Monarchen"
 WW_hungary.17.a: "They can have it"##### NOT TRANSLATED #####

WW_hungary.66.desc:	"Kaiser [FROM.GetLeader] von [FROM.GetNameDefCap] hat gefordert, dass wir die Herrschaft der Habsburger über unsere Länder wiederherstellen, wie es bis zur Auflösung des Österreichisch-Ungarischen Reiches der Fall war, und erneut einen Habsburger als unseren Monarchen zu krönen. Sie versprechen uns jedoch mehr Autonomie als zuvor, verbunden mit großen Versprechungen einer sogenannten Dreikönigreichsordnung. Was sagen wir dazu?"
WW_hungary.66.a:	"Das ist genau das, was wir schon immer wollten!"
WW_hungary.66.b:	"Was glauben die eigentlich, wer sie sind?"

WW_hungary.68.t:	"[FROM.GetNameDefCap] Lehnt einen Habsburger-Monarchen ab"

WW_hungary.68.a:	"Sie haben eine unkluge Entscheidung getroffen ..."
WW_hungary.69.t:	"[FROM.GetLeader] fordert, dass wir die Herrschaft der Habsburger wiederherstellen"
WW_hungary.69.a:	"Wir würden uns gerne anschließen"

WW_hungary.70.desc:	"Die weise Führung in [FROM.GetNameDef] hat beschlossen, gemäß unseren Forderungen einen Habsburger Monarchen zu krönen und zugunsten ihres neuen Königs abzutreten."

WW_hungary.71.desc:	"Die dekadente Führung in [FROM.GetNameDef] hat beschlossen, in ihren derzeitigen Ämtern zu verbleiben, in der irrigen Annahme, sie seien weiser als ein von Gott selbst gewählter Monarch. Wir werden sie stürzen und Robert auf ihren Thron setzen, ob es ihnen gefällt oder nicht! "
WW_hungary.72.t:	"[FROM.GetNameDefCap] fordert die Kontrolle über unsere [SIL.GetAdjective] Gebiete"

WW_hungary.73.desc:	"Die vernünftige [FROM.GetLeader] Seite [FROM.GetNameDef] hat zugestimmt, ihre Gebiete in Schlesien zu übergeben, und ihren Truppen befohlen, sich zurückzuziehen und das Gebiet zu verlassen. Wir stehen erneut als Sieger da!"
WW_hungary.73.a:	"Dies ist ein großartiger Tag!"

WW_hungary.74.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.74.b:	"Wir müssen dies auf sich beruhen lassen"

WW_hungary.75.desc:	"Der unbesonnene [FROM.GetLeader] hat die Besetzung des Heiligen Landes durch [FROM.GetAdjective]-Truppen gefordert und verlangt, dass wir das Gebiet übergeben und unsere eigenen Truppen aus der Region abziehen. Die Situation könnte möglicherweise außer Kontrolle geraten, wenn wir nicht vorsichtig sind. Wie sollen wir reagieren?"
WW_hungary.75.a:	"Die Verteidiger des Katholizismus können es haben"

WW_hungary.76.a:	"Dies ist ein großartiger Tag!"
WW_hungary.77.t:	"[FROM.GetNameDefCap] bleibt im Heiligen Land standhaft"

WW_hungary.78.desc:	"[FROM.GetNameDefCap] hat einen neuen Papst zum Führer unserer Nation ernannt. Dies wird unser Regime sicherlich stärken."
WW_hungary.78.a:	"In der Tat"

WW_hungary.79.desc:	"[FROM.GetNameDefCap] hat einen neuen Monarchen zum Anführer unserer Nation ernannt. Dies wird unser Regime sicherlich stärken."

WW_hungary.80.a:	"Es ist, wie es sein sollte"
WW_hungary.81.t:	"[FROM.GetNameDefCap] akzeptiert die Integration"

WW_hungary.82.t:	"[FROM.GetNameDefCap] lehnt die Integration ab"
WW_hungary.82.desc:	"[FROM.GetNameDefCap] hat beschlossen, unsere Forderung nach der Wiedereingliederung ihrer Gebiete in die Krone von Österreich-Ungarn abzulehnen. Wir werden dies daher mit Gewalt durchsetzen müssen..."
WW_hungary.82.a:	"Wir werden sie dafür bezahlen lassen"

WW_hungary.83.b:	"[975.GetName] ist [ROOT.GetAdjective]! "
WW_hungary.84.t:	"[FROM.GetNameDefCap] verkauft uns [975.GetName]"
WW_hungary.84.desc:	 "Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, uns [975.GetName] zu übergeben, und hat die Zahlung wie versprochen erhalten. Heute ist ein großartiger Tag für das [ROOT.GetAdjective] Volk!"


WW_hungary.86.desc:	 "Rebellen, die [FROM.GetAdjective] paramilitärischen Organisationen angehören, haben die Kontrolle über wichtige Gebäude in der [975.GetName] Region übernommen und hastig ein Referendum über den Wiedereintritt in [FROM.GetNameDef] abgehalten, wobei die offensichtlich manipulierten Ergebnisse deutlich dafür sprachen. Unsere Truppen stehen in der Nähe bereit, warten jedoch auf Befehle, um zu entscheiden, ob ein Eingreifen die richtige Vorgehensweise ist oder nicht."
WW_hungary.86.b:	"Sie werden ihre Entscheidung noch bereuen!"

WW_hungary.87.desc:	"[FROM.GetLeader] hat sich nach einem Besuch in unserer Hauptstadt an uns gewandt und behauptet, im Namen aller [FROM.GetAdjective] Menschen zu sprechen; er wünscht sich, dass unsere beiden Nationen ein militärisches Bündnis eingehen, mit dem Ziel, die Bevölkerung sowohl der [ROOT.GetAdjective] als auch der [FROM.GetAdjective] Nation zu schützen."
WW_hungary.87.b:	"Wir haben keine Verwendung für sie"

WW_hungary.88.desc:	"Der [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, ein neues Militärbündnis zu bilden, wodurch die Verbindung zwischen unseren Nationen gestärkt wird. Unsere Bevölkerung ist auf die Straßen gegangen, um diesen bedeutsamen Anlass zu feiern, da er die Wiedergeburt des Staates [ROOT.GetAdjective] und den Beginn einer neuen, sichereren Ära für seine Bevölkerung markiert."
WW_hungary.88.a:	"Lassen Sie uns gemeinsam unsere Zukunft gestalten!"

WW_hungary.90.t:	"Krönung eines apostolischen Königs"
WW_hungary.90.desc:	"Nun wurde beschlossen, die Monarchie offiziell wieder einzuführen, doch wir stehen vor einem Problem. Es haben sich keine geeigneten Kandidaten gefunden, doch der Regent muss bald eine Entscheidung treffen. Er könnte sich selbst krönen, obwohl dies weitgehend unpopulär wäre, oder vielleicht einen alternativen Weg einschlagen und seinen Sohn István Horthy krönen, der beim Volk sehr beliebt ist. Wer sollte für dieses Amt ausgewählt werden?"

WW_hungary.91.t:	"[FROM.GetNameDefCap] schlägt eine Union vor"
WW_hungary.91.a:	"Nun gut, wir nehmen an"

WW_hungary.92.desc:	"Der vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, die Regierungsgewalt an uns zu übergeben, womit der Prozess der Vereinigung unserer beiden Nationen unter einem König beginnt. Wir stehen erneut als Sieger da!"

WW_hungary.94.t:	"Wahl eines neuen [ROOT.GetAdjective] Präsidenten"
WW_hungary.94.desc:	"Die Nation benötigt dringend einen gewählten Volksvertreter, nun da sich der Staub des Bürgerkriegs gelegt hat. In der einen Ecke steht der beliebte Mihály Károlyi, konservativer Politiker und ehemaliger Ministerpräsident Ungarns. Auf der anderen Seite stehen die Kommunisten, von denen einige die Rückkehr von Béla Kun, dem Führer der ehemaligen Ungarischen Sowjetrepublik, an die Macht befürworten, während andere den Stalinisten Mátyás Rákosi unterstützen, der sich kürzlich durch seinen Einsatz an der Front Lob verdient hat. Wer soll das Land in die Zukunft führen? "

WW_hungary.94.b:	"Mátyás Rákosi hat sich den Respekt des Volkes verdient"
WW_hungary.95.t:	"Die erste Präsidentschaftswahl der Zweiten Republik"

WW_hungary.95.c:	"János Zichy kann uns helfen, wieder auf die Beine zu kommen"
WW_hungary.96.t:	"[FROM.GetNameDefCap] fordert die Kontrolle über unsere [SLO.GetAdjective] Gebiete"
WW_hungary.96.desc:	"Der Unbesonnene [FROM.GetLeader] hat kürzlich unsere, wie er es nannte, unrechtmäßige Besetzung der [FROM.GetAdjective] Slowakei angeprangert. Nun haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir reagieren?"

WW_hungary.96.b:	"Dann kommen Sie und holen Sie es sich!"

WW_hungary.98.t:	"[FROM.GetNameDefCap] bleibt in der Slowakei standhaft"
WW_hungary.98.desc:	"Obwohl nicht völlig unerwartet, hat der törichte [FROM.GetLeader] von [FROM.GetNameDef] die Truppen der Nation nach Erhalt unseres Ultimatums in höchste Alarmbereitschaft versetzt und einen Gesandten entsandt, der erklärte, dass sie in Bezug auf den Streit keinen einzigen Schritt zurückweichen werden."
WW_hungary.98.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.98.b:	"Wir müssen dies auf sich beruhen lassen"

WW_hungary.99.a:	"Für eine gerechtere Welt!"

WW_hungary.101.t:	"[FROM.GetName] verweigert uns unser Protektorat Székelyföld"

WW_hungary.101.b:	"Wir können nicht viel tun"
WW_hungary.102.t:	"Der Marsch auf Budapest"
WW_hungary.102.desc:	"Nach monatelangen Kampagnen und Protesten gegen Regent Miklós Horthy sind die faschistischen Bewegungen, inspiriert vom Aufstand der Sichelkreuzler und Mussolinis Marsch auf Rom, nun in unsere Hauptstadt einmarschiert und fordern, dass Horthy zurücktritt, damit der sympathischere Gyula Gömbös sein Amt übernehmen kann."

WW_hungary.103.b:	"Wir werden ihren Bedingungen zustimmen, unter einer Bedingung"

WW_hungary.104.desc:	"Der Unbesonnene [FROM.GetLeader] hat kürzlich unsere, wie er es nannte, unrechtmäßige Besetzung unserer kroatischen Gebiete angeprangert. Nun haben wir ein [FROM.GetAdjective] Ultimatum erhalten, und ihre Truppen sammeln sich an unserer Grenze. Wie sollen wir reagieren?"
WW_hungary.104.a:	"Es lohnt sich nicht, dafür Blut zu vergießen"

WW_hungary.105.desc:	" Die vernünftige [FROM.GetLeader] von [FROM.GetNameDef] hat zugestimmt, ihre Gebiete in Kroatien zu übergeben, und ihren Truppen befohlen, sich zurückzuziehen und das Gebiet zu verlassen. Wir stehen erneut als Sieger da!"
WW_hungary.106.t:	"[FROM.GetNameDefCap] bleibt standhaft"

WW_hungary.106.a:	"Sie werden ihre Entscheidung noch bereuen!"
WW_hungary.106.b:	"Wir müssen dies auf sich beruhen lassen"
WW_hungary.108.t:	"[FROM.GetNameDefCap] will Hermann Göring zum König krönen"

WW_hungary.108.b:	"Das wäre nicht angemessen"

WW_hungary.110.t:	"[FROM.GetLeader] verweigert Görings Krönung"

WW_hungary.111.desc:	"Seit einem Monat findet in [664.GetName] ein öffentliches Referendum statt, mit dem Ziel zu entscheiden, ob man dem [HUN.GetNameDef] beitreten möchte oder nicht. Da es von internationalen Beobachtern genehmigt wurde, kann man davon ausgehen, dass es kaum zu Wahlbetrug gekommen ist. Die Ergebnisse liegen nun vor, und ein großer Teil der Bevölkerung hat für den Austritt aus unserem Land gestimmt. Sollten wir dies akzeptieren?"
WW_hungary.111.a:	"Wenn es der Wunsch des Volkes ist"
WW_hungary.111.b:	"Das Referendum war manipuliert"


WW_hungary.113.a:	"Wir werden es akzeptieren müssen"

WW_hungary.115.t:	"[FROM.GetNameDefCap] akzeptiert das Referendum"
WW_hungary.115.desc:	" Die Führung in [FROM.GetNameDef] hat sich öffentlich zu Wort gemeldet und ihre unerschütterliche Unterstützung für die Selbstbestimmung der Bevölkerung in der Region [73.GetName] bekundet. Es sei an der Zeit, dass diese selbst entscheiden könne, in welchem Staat sie leben wolle, erklärte [FROm.GetLeader] Anfang dieser Woche und verzichtete damit im Wesentlichen auf ihre Ansprüche auf das Gebiet."
WW_hungary.115.a:	"Eine vernünftige Reaktion"
 
WW_hungary.117.t:	"Referendum über den Beitritt zum Staat [HUN.GetAdjective]"

WW_hungary.118.desc:	"Die Führung in [FROM.GetNameDef] hat öffentlich ihre unerschütterliche Unterstützung für die Selbstbestimmung der Bevölkerung in der Region [45.GetName] bekundet. Es ist an der Zeit, dass sie selbst entscheiden können, in welchem Staat sie leben möchten, erklärte [FROm.GetLeader] Anfang dieser Woche und verzichtete damit im Wesentlichen auf ihre Ansprüche auf das Gebiet."

WW_hungary.119.desc:	"Die Führung in [FROM.GetNameDef] hat öffentlich erklärt, dass die Ergebnisse der Referenden, die Anfang dieses Monats in der Region [45.GetName] abgehalten wurden, unrechtmäßig seien, und behauptet, die Wahlbeteiligung und die internationalen Beobachter seien in hohem Maße manipuliert gewesen und hätten eindeutig eine Voreingenommenheit gegenüber der [ROOT.GetAdjective] Regierung."
WW_hungary.119.a:	"Wir werden es akzeptieren müssen"

WW_hungary.120.desc:	"Seit einem Monat findet in [76.GetName] ein öffentliches Referendum statt, mit dem Ziel zu entscheiden, ob man dem [HUN.GetNameDef] beitreten möchte oder nicht. Da es von internationalen Beobachtern gebilligt wurde, kann man davon ausgehen, dass kaum Wahlbetrug stattgefunden hat. Die Ergebnisse liegen nun vor, und ein großer Teil der Bevölkerung hat für den Austritt aus unserem Land gestimmt. Sollten wir dies akzeptieren?"
WW_hungary.120.a:	"Wenn es der Wunsch des Volkes ist"

WW_hungary.122.desc:	" Die Führung in [FROM.GetNameDef] hat öffentlich erklärt, dass die Ergebnisse der Referenden, die Anfang dieses Monats in der Region [76.GetName] abgehalten wurden, unrechtmäßig seien, und behauptet, dass die Wahlbeteiligung und die internationalen Beobachter in hohem Maße manipuliert waren und eindeutig eine Voreingenommenheit gegenüber der Regierung von [ROOT.GetAdjective] zeigten."

WW_hungary.123.t:	"Der Marsch des Sensenkreuzes auf Budapest"
WW_hungary.123.a:	"Vertreiben Sie sie und verhaften Sie ihren erbärmlichen Anführer!"
WW_hungary.123.b:	"Eröffnen Sie das Feuer und verscheuchen Sie sie"

HUN_bohemia_and_silesia_tt:	"§YTschechoslowakei§! wird bekannt sein als §Ydas Königreich Böhmen -Mähren und Schlesien§!.\n"

WW_hungary.124.desc:	" Am frühen Morgen berichteten die Behörden in Gori von einem Mann, der die Rückgabe eines landwirtschaftlichen Anwesens forderte, von dem er behauptet, es habe ihm einst gehört, und erklärte, er habe es erst kürzlich geschafft, in seine Heimat zurückzukehren und den Fängen der russischen Bedrohung zu entkommen. Er versprach zudem, dass er, sollte man ihm den Einstieg in die Politik gestatten, unsere Nation zu Ruhm führen könne, da er offenbar aus einer Linie erfolgreicher Politiker stamme. Ist dies der Mann, den wir brauchen, um unsere Träume von einem größeren Georgien wiederzubeleben?"
WW_hungary.124.a:	"Geben Sie diesem Mann sofort ein Amt!"
WW_hungary.124.b:	"Was auch immer er sagt, wir können ihm nicht vertrauen"

wuw_HUN_news_events.1.a:	"Sie rüsten für etwas auf ..."
wuw_HUN_news_events.1.b:	"Das wird unsere Zukunft sichern!"

wuw_HUN_news_events.2.d:	"Nach der Unterzeichnung eines neuen Paktes zur gegenseitigen Unterstützung und zur Förderung der jeweiligen nationalen Ziele haben [GER.GetLeader] und [HUN.GetLeader] heute den Beitritt von [HUN.GetNameDef] zur [GER.GetAdjective]-Fraktion bekannt gegeben."

wuw_HUN_news_events.3.desc:	" \nDa es in ihrer unmittelbaren Umgebung keine tragfähigen Optionen für Bündnisse gibt [HUN.GetNameDef] hat das Land erneut begonnen, die Mittelmächte zu reformieren. Nachdem es sich von den ihm auferlegten Verträgen befreit hat, hat das Land rasch Kurs auf eine Remilitarisierung genommen. Ob dieses neue Bündnis ihrem Namensvetter aus dem Ersten Weltkrieg ähneln wird oder nicht, bleibt abzuwarten."
wuw_HUN_news_events.3.a:	"Sehr besorgniserregend"
wuw_HUN_news_events.3.b:	"Wir werden unseren früheren Ruhm zurückerobern!"

wuw_HUN_news_events.4.t:	"[HUN.GetNameDefCap] erklärt die weltweite Vorherrschaft"

wuw_HUN_news_events.5.t:	"[HUN.GetLeader] übernimmt die ungarische Krone"
wuw_HUN_news_events.5.a:	"Endlich ein König!"

wuw_HUN_news_events.5.c:	"Ein potenzieller Verbündeter?"
wuw_HUN_news_events.6.desc:	"Auf der Suche nach einem König für ihr Land haben die [HUN.GetAdjective]s nach langen Verhandlungen und Vorbereitungen Anfang dieser Woche Joseph August von Habsburg, den letzten Palatin von Ungarn, Erzherzog von Österreich und Fürsten von Ungarn und Böhmen sowie Feldmarschall der ehemaligen österreichisch-ungarischen Armee, offiziell gekrönt. Heute wurde er unter großem Jubel und Feierlichkeiten in einer feierlichen Zeremonie im Königspalast in Budapest zum König von Ungarn gekrönt.\nAls Vitez und Habsburger Adliger sind die ideologischen Neigungen des neuen Königs klar, und er hat bereits erklärt, dass er "Ungarn die Größe bringen wird, die es verdient, ohne die Verträge zu brechen, die das Österreichisch-Ungarische Reich aufgelöst haben". Zusammen mit dem Versprechen des Königs, "die Ungerechtigkeiten, die uns in der Vergangenheit widerfahren sind, rückgängig zu machen", ist es daher unwahrscheinlich, dass diese Krönung zu einer Entspannung der Lage in der Region führen wird."

wuw_HUN_news_events.6.b:	"Ein neuer Feind erhebt sich"
wuw_HUN_news_events.7.t:	"Wiederherstellung der Ungarischen Sowjetrepublik"

wuw_HUN_news_events.7.b:	"Was in aller Welt haben sie vor?"
wuw_HUN_news_events.7.c:	"Revisionistische Poser ..."
wuw_HUN_news_events.8.t:	"Proklamation der Ungarischen Volksrepublik"

wuw_HUN_news_events.8.a:	"Endlich!"

wuw_HUN_news_events.9.desc:	"Anfang dieser Woche marschierten [HUN.GetAdjective] Truppen in Eisenstadt ein und besetzten das Gebiet. Sie behaupten, dies sei eine Maßnahme zum Schutz der [HUN.GetAdjective] Bevölkerung in der Region, die erst kürzlich aus Protest gegen die ihrer Meinung nach illegale Besetzung der Region nach dem Trianon-Vertrag auf die Straße gegangen war. Wird dies vielleicht zu einem neuen Krieg auf dem Balkan führen, oder wird es lediglich eine geringfügige Grenzbereinigung sein?"
wuw_HUN_news_events.9.a:	"Wieder in den richtigen Händen"

ww_BEL_event_political.1.desc:	"Der Druck auf die Regierung aufgrund des anhaltenden Korruptionsskandals führte schließlich zu ihrem Zusammenbruch. Ermittler unter der Leitung von Leon Degrelle, dem Anführer der faschistischen Rexisten-Bewegung, haben mehrere Jahre lang die Bestechung von Ministern untersucht, was zur Aufdeckung zahlreicher Zahlungen führte. \n\nIn dem Bestreben, seine Legitimität wiederzuerlangen, hat der unter Druck stehende Premierminister Paul van Zeeland vorgezogene Neuwahlen angesetzt, um Glaubwürdigkeit und Legitimität zurückzugewinnen, und die Ergebnisse liegen nun vor. \n\nDie Parti Ouvrier Belge (Belgische Arbeiterpartei) unter der Führung von Emile Vandervelde schnitt am besten ab und profitierte von der Unbeliebtheit ihres politischen Rivalen. Er könnte diesen Sieg nutzen, um eine Minderheitsregierung zu bilden, oder mit der katholischen Partei von Paul van Zeeland zusammenarbeiten, um eine stabilere Mehrheit zu erreichen und eine Regierung der nationalen Einheit zu bilden. \n\nEs sei auch darauf hingewiesen, dass die Rexisten-Partei von Léon Degrelle ebenfalls sehr gut abschnitt, wobei sich seine Haltung gegen Korruption als sehr populär erwies."
BEL_paul_van_zeeland_remains_tt:	"§YPaul van Zeeland§! bleibt Ministerpräsident und führt eine breite Koalition aus §Ydemokratischen§! Parteien an. "

ww_BEL_event_political.2.desc:	"Der Korruptionsskandal, der die katholische Partei von Paul van Zeeland derzeit heimsucht, hat sich heute verschärft, da bekannt wurde, dass der Ministerpräsident selbst "Spenden" angenommen hat! Es scheint nur eine Frage der Zeit zu sein, bis seine Regierung erneut zusammenbricht ..."
ww_BEL_event_political.2.a:	"Nimmt die Korruption denn kein Ende?! "

ww_BEL_event_political.3.b:	"Entscheiden Sie sich für den Rexisten Leon Degrelle, um Recht und Ordnung wiederherzustellen"
ww_BEL_event_political.4.t:	"Haushaltskrise"
ww_BEL_event_political.4.desc:	"Trotz erster Anzeichen einer wirtschaftlichen Erholung stehen wir erneut vor einer Finanzkrise. Premierminister [BEL.GetLeader] ist es nicht gelungen, [BEL.GetHerHis] den Haushalt durch das Parlament zu bringen, da er keinen breiten Konsens über die notwendigen Steuerreformen erzielen konnte, die zur Bekämpfung der sich verschlechternden Lage der öffentlichen Finanzen erforderlich waren, was erneut zum Zusammenbruch der Regierung führte. \n\nDies führte zu einer raschen Machtübergabe an Paul -Henri Spaak, einem aufstrebenden Star der Arbeiterpartei und dem ersten sozialistischen Premierminister Belgiens."

ww_BEL_event_political.5.t:	"Adriaan-Martens-Krise"

ww_BEL_event_political.6.t:	"Die flämische Frage"
ww_BEL_event_political.6.a:	"Niederländisch sollte Vorrang haben. "

ww_BEL_event_political.6.c:	"Belgien wird gleichermaßen von beiden Kulturen geprägt."
ww_BEL_event_political.7.t:	"Die vorgezogene Wahl"
ww_BEL_event_political.7.a:	"Hubert Pierlot und die Katholische Partei werden denen, die uns bedrohen, weiterhin trotzig entgegenstehen."

ww_BEL_event_political.8.desc:	" Unser Volk ist seit langem durch die Sprache gespalten. Die Wallonen sprechen Französisch, und die Flamen sprechen Niederländisch, was eine Kluft zwischen den Gruppen schafft und verhindert, dass sich eine stärkere Einheit [ROOT.GetName] entwickelt. Wir müssen eine Entscheidung darüber treffen, was unsere Amtssprache ist, andernfalls werden Missverständnisse zwischen Freunden, falsch ausgeführte militärische Befehle und Justizirrtümer immer Teil des täglichen [ROOT.GetAdjective]."
ww_BEL_event_political.8.a:	"Niederländisch ist unsere Sprache"


ww_BEL_event_diplomatic.2.t:	"[FROM.GetNameDefCap] Fordert unsere Annexion"
ww_BEL_event_diplomatic.2.desc:	"[FROM.GetLeader] hat sich auf die Bande der Vergangenheit sowie unser gemeinsames Erbe und unsere gemeinsame Sprache berufen, um unsere Annexion in ihre Nation zu sichern."
ww_BEL_event_diplomatic.2.a:	"Gemeinsam sind wir stärker."

ww_BEL_event_diplomatic.4.t:	"[FROM.GetNameDefCap] Lehnt ab!"

ww_BEL_event_diplomatic.4.a:	"Sie haben die falsche Entscheidung getroffen"
ww_BEL_event_diplomatic.5.t:	"Wie sollen wir Calais einnehmen?"
ww_BEL_event_diplomatic.5.desc:	"Wir haben beschlossen, Calais von Frankreich einzufordern, doch müssen wir noch entscheiden, wie wir es einnehmen wollen. Natürlich können unsere mächtigen Armeen dieses Land ohne Probleme einnehmen, doch sollten wir die Möglichkeit von Kollateralschäden im Auge behalten, weshalb wir vielleicht eine alternative Methode der Aneignung verfolgen sollten. Die Art und Weise der Vereinigung ist für uns nicht wichtig, solange wir nur das bekommen, was uns rechtmäßig zusteht!"
ww_BEL_event_diplomatic.5.a:	"Drohen Sie mit Krieg."

ww_BEL_event_diplomatic.5.c:	"Finanzielle Entschädigung anbieten."
ww_BEL_event_diplomatic.6.t:	"Belgien fordert Calais"

ww_BEL_event_diplomatic.6.b:	"Wir können uns derzeit keinen weiteren Feind leisten."
ww_BEL_event_diplomatic.7.desc:	" Wir haben soeben ein interessantes Angebot von der [BEL.GetAdjective]-Delegation erhalten. Sie haben einen Gebietstausch vorgeschlagen: Calais gegen einen großen Teil des Kongo. Wir würden uns die Staaten Coquilhatville und Stanleyville sichern, die an unsere derzeitigen Gebiete in der Region grenzen. Es gab einige implizite Drohungen seitens ihrer Diplomaten für den Fall, dass wir dieses Angebot ablehnen sollten, und dies wäre eine bedeutende Erweiterung unserer afrikanischen Besitzungen, aber ist es den Preis wert?"

ww_BEL_event_diplomatic.8.t:	"Belgien möchte Calais kaufen"

ww_BEL_event_diplomatic.9.t:	"Coquilhatville und Stanleyville an Frankreich verkauft!"
ww_BEL_event_diplomatic.9.desc:	"Unser Kolonialgouverneur wurde soeben darüber informiert, dass [BEL.GetName] eine Vereinbarung mit [FRA.GetName] getroffen hat, Calais gegen einige unserer Staaten, nämlich Coquilhatville und Stanleyville, einzutauschen. Wieder einmal verändern die europäischen Herrscher die Grenzen Afrikas, ohne dass wir, die wir hier tatsächlich leben, dabei ein Mitspracherecht haben!"
ww_BEL_event_diplomatic.9.a:	"Wir müssen unsere Landkarten aktualisieren … schon wieder."

ww_BEL_event_diplomatic.11.t:	"Eskalierende Spannungen um Calais"
ww_BEL_event_diplomatic.11.desc:	" Unsere Delegation in Paris hat mitgeteilt, dass die Verhandlungen um Calais gescheitert sind und wir möglicherweise auf Gewalt zurückgreifen müssen, um dieses Land zu sichern, das rechtmäßig uns gehört. Wir haben versucht, mit unseren Angeboten vernünftig zu sein, doch sie haben uns bei jedem Schritt abgelehnt. Es ist an der Zeit, ihnen die wahre Stärke der militärischen Macht von [BEL.GetAdjective] zu zeigen."

ww_BEL_event_diplomatic.12.t:	"[FROM.GetNameDefCap] bittet um unsere Hilfe"
ww_BEL_event_diplomatic.12.a:	"Sie sollen unsere Hilfe erhalten!"

ww_BEL_event_diplomatic.13.t:	"[FROM.GetNameDefCap] Sichert unsere Unabhängigkeit"
ww_BEL_event_diplomatic.13.a:	"Dies wird uns Sicherheit bieten"

ww_BEL_event_diplomatic.14.desc:	"Trotz der offensichtlichen Bedrohungen für unsere Existenz hat die [FROM.GetAdjective] Führung unsere Bitte um eine Garantie abgelehnt. Wir haben versucht, sie zur Vernunft zu bringen, doch sie weigern sich, die Schwere der Lage einzusehen. Es scheint, als müssten wir uns selbst helfen."
ww_BEL_event_diplomatic.14.a:	"Wie unhöflich von ihnen!"
ww_BEL_event_diplomatic.15.t:	"[FROM.GetNameDefCap] Ausrüstung angefordert"

ww_BEL_event_diplomatic.16.t:	"[FROM.GetNameDefCap] Anforderung von Fabriken"
ww_BEL_event_diplomatic.16.a:	"Selbstverständlich werden wir helfen"

ww_BEL_event_diplomatic.17.desc:	"Die im Exil lebende Regierung von [FROM.GetNameDef] hat sich an uns gewandt, um eine gemeinsame Initiative zum Austausch militärischer Erfahrungen zwischen unseren Armeen vorzuschlagen. Dies könnte für uns ebenso von Vorteil sein wie für sie."
ww_BEL_event_diplomatic.17.a:	"Eine großartige Idee!"
ww_BEL_event_diplomatic.17.b:	"Das ist die Zeit nicht wert"

ww_BEL_event_diplomatic.19.desc:	"Unsere vorgeschlagenen Maßnahmen zur Stärkung unserer Position und zum Wiederaufbau unserer Armee zur Rückeroberung des Heimatlandes sind von [FROM.GetNameDef] abgelehnt worden. Wir hatten gehofft, dass dies ein Sprungbrett für die Zukunft sein würde, aber es scheint, als seien diese Pläne zunichte gemacht worden."

ww_BEL_event_diplomatic.20.desc:	"Wir haben eine formelle Einladung von [FROM.GetNameDef] erhalten, dem [FROM.GetFactionName] beizutreten. Dies ist ihre neue Initiative zur Förderung der Zusammenarbeit innerhalb der Region; sie hoffen, dass diese Initiative die Region stabilisieren und bessere diplomatische Beziehungen fördern wird."
ww_BEL_event_diplomatic.20.a:	"Eine großartige Initiative!"
ww_BEL_event_diplomatic.20.b:	"Das klingt verdächtig ..."


ww_BEL_event_diplomatic.23.t:	"[FROM.GetNameDefCap] lädt uns zu ihren Forschungsbemühungen ein"
ww_BEL_event_diplomatic.23.desc:	"Eine [FROM.GetAdjective] Delegation hat sich an uns gewandt, um eine [FROM.GetFactionName]-weite Forschungsinitiative vorzuschlagen. Als enge Verbündete müssen wir unsere Technologien untereinander teilen, um den Fortschritt aller in der Union voranzutreiben."
ww_BEL_event_diplomatic.23.b:	"Unsere eigene Technologie bleibt unser Eigentum"

ww_BEL_event_diplomatic.24.desc:	"Unsere Initiative, eine Plattform für den Technologieaustausch unter unseren Verbündeten zu schaffen, stieß bei [FROM.GetNameDef] auf Zustimmung. Sie haben sich der Initiative angeschlossen und werden ihre technologischen Fortschritte mit uns und unseren gemeinsamen Verbündeten teilen, so wie wir unsere mit ihnen teilen werden."
ww_BEL_event_diplomatic.24.a:	"Ausgezeichnet!"
ww_BEL_event_diplomatic.25.t:	"[FROM.GetNameDefCap] weigert sich, der Forschungsgruppe der Europäischen Union beizutreten"

ww_BEL_event_diplomatic.26.t:	"[FROM.GetNameDefCap] fordert begrenzte Föderalisierung"
ww_BEL_event_diplomatic.26.desc:	"Wir haben eine Anfrage von [FROM.GetNameDef] erhalten. Als Präsident der [ROOT.GetFactionName] ist man zu der Erkenntnis gelangt, dass ein stärker föderalisiertes Europa die Verteidigungs- und Handelsbemühungen des Blocks stärken würde, und hat uns gebeten, uns dieser Initiative anzuschließen."

ww_BEL_event_diplomatic.27.desc:	"[FROM.GetNameDefCap] hat unserem Antrag zugestimmt, sich enger an [FROM.GetFactionName] zu binden. Wir erhalten gewisse Befugnisse über deren Außenpolitik, und der Handel zwischen uns allen wird vereinfacht."

ww_BEL_event_diplomatic.28.t:	"[FROM.GetNameDefCap] Lehnt begrenzte Föderalisierung ab"
ww_BEL_event_diplomatic.28.desc:	"Trotz der offensichtlichen Vorteile hat sich [FROM.GetNameDef] entschieden, sich unserer Idee eines föderalen Europas nicht anzuschließen. Sie behaupten, dass ihre eigene Souveränität über dem Wohlergehen des gesamten $EU_tech_sharing_group_name$ steht, was eine recht besorgniserregende Haltung ist, die aus den Reihen der Union kommt."
ww_BEL_event_diplomatic.28.a:	"Das ist sehr besorgniserregend"

ww_BEL_event_diplomatic.29.desc:	"Wir haben ein Unterstützungsangebot von einer Person erhalten, von der wir etwas überrascht sind. Otto von Habsburg mag zwar der Erbe Karls I., Kaiser von Österreich, König von Ungarn und König von Kroatien, sein, doch scheint es, dass Otto im Gegensatz zu seinem Vater viel mehr zur Zusammenarbeit innerhalb Europas neigt. Er würdigt unsere Bemühungen und bietet uns seine Hilfe auf diplomatischer Ebene an; sein weitreichendes diplomatisches Netzwerk könnte für uns von Vorteil sein, und es ist eine Hilfe, die er uns gerne anbieten würde."
ww_BEL_event_diplomatic.30.t:	"[FROM.GetNameDefCap] Anträge auf Beitritt zur [ROOT.GetFactionName]"

ww_BEL_event_diplomatic.30.a:	"Sie sind hier willkommen"
ww_BEL_event_diplomatic.31.t:	"[FROM.GetNameDefCap] nimmt uns in die [FROM.GetFactionName] auf"

ww_BEL_event_diplomatic.32.t:	"[FROM.GetNameDefCap] Verweigert uns die Mitgliedschaft in der [FROM.GetFactionName]"

ww_BEL_event_diplomatic.33.desc:	"Die Neutralität hat unserem Land sehr gute Dienste geleistet, doch wenn wir neutral bleiben, könnten andere uns lediglich als passive Zuschauer und Zielscheibe betrachten. Wir müssen die Zukunft unserer Außenpolitik und unsere Haltung gegenüber bewaffneten Konflikten sorgfältig abwägen, da es den Anschein hat, dass uns ein Konflikt in naher Zukunft erreichen könnte."
ww_BEL_event_diplomatic.33.a:	"Wir müssen die Fesseln sprengen und uns vorbereiten!"

ww_BEL_event_diplomatic.34.desc:	"Ganz gleich, wie gut wir bewaffnet sind, wir müssen uns mit der Tatsache abfinden, dass unser südlicher Nachbar wahrscheinlich immer über mehr Kapazitäten verfügen wird als wir. Wir müssen uns einigen: Betrachten wir sie als Freunde oder als Feinde?"
ww_BEL_event_diplomatic.34.a:	"Die [FRA.GetAdjective] sind unsere Freunde"
ww_BEL_event_diplomatic.34.b:	"Den [FRA.GetAdjective] kann man nicht trauen! "

ww_BEL_event_diplomatic.35.a:	"Aber natürlich!"
ww_BEL_event_diplomatic.35.b:	"Nein, wir sehen darin keinen Vorteil."

ww_BEL_event_diplomatic.36.desc:	"Die Führung von [FROM.GetNameDef] ist der Ansicht, dass wir beide von einer Vertiefung unserer diplomatischen Beziehungen profitieren könnten. Wir können in dieser zunehmend feindseligen Welt auf sie als unsere Freunde und Verbündeten zählen."

ww_BEL_event_war.1.t:	"Verlegte Luftfahrtindustrie aktiviert"
ww_BEL_event_war.1.desc:	"Unsere Weitsicht, gute Arbeitsbeziehungen zu ausländischen Industrieunternehmen aufzubauen, hat sich ausgezahlt. Deren Anlagen sind bereit, sofort die Produktion aufzunehmen."
ww_BEL_event_war.1.a:	"Deshalb planen wir voraus!"

ww_BEL_event_war.2.desc:	 "König Leopold III. lebte im Schatten seines Vaters, König Albert, des "Soldatenkönigs", der dafür berühmt war, Belgien im Ersten Weltkrieg im Krieg gehalten und dem Deutschen Reich den Sieg verwehrt zu haben. Obwohl sein Land dabei zum Schlachtfeld wurde, blieb der militärische Stolz der Nation ungetrübt, und das Ansehen Belgiens auf der Weltbühne stieg. \n\nNun, da Belgien erneut im Krieg steht, wird die wahre Bewährungsprobe für Leopolds Charakter beginnen, und bereits jetzt gibt es Unruhen, die uns Anlass zur Sorge geben. \n\nUnter dem Vorwand, das Leben seines Volkes bewahren zu wollen, hat der König bereits Friedenssignale ausgesendet, und wir vermuten, dass der König frühzeitig kapitulieren könnte, sollten Brüssel, Lüttich oder Antwerpen fallen sollten, der König frühzeitig kapitulieren könnte, ungeachtet des demokratischen Willens des Volkes, weiterzukämpfen."
ww_BEL_event_war.2.a:	"König Leopold wird uns zum Sieg führen."

ww_BEL_event_war.3.desc:	"Der König hat als Oberbefehlshaber der Streitkräfte heute die bedingungslose Kapitulation von [BEL.GetName] angeboten, ohne zuvor die Ratifizierung durch das [BEL.GetAdjective] Parlament abzuwarten. Technisch gesehen hat er als Oberbefehlshaber die Befugnis, das Militär zu kapitulieren, nicht jedoch das Land selbst. \n\nDas zivile Parlament ist bereits ins Exil geflohen und und damit seine Absicht deutlich gemacht, den Krieg unter Einsatz aller Ressourcen des [BEL.GetAdjective]-Reiches fortzusetzen."
ww_BEL_event_war.3.a:	"Es ist der Wille des Königs!"
ww_BEL_event_war.3.b:	"Kämpft weiter!"
ww_BEL_event_war.3.c:	"Er hatte kein Recht dazu! Stellen Sie den König unter Hausarrest."


ww_BEL_event_war.5.desc:	"Nach einer beherzten Verteidigung der Nation hat König Leopold III. schließlich die Kapitulation von [BEL.GetName] angeboten, und unsere Regierung wurde ins Exil gezwungen. Leopold hat sich entschieden, bei seinem Volk zu bleiben und in seinem eigenen Haus zum Gefangenen zu werden. Wir können uns weiterhin auf den guten Willen unserer Verbündeten verlassen und auf die Ressourcen des [BEL.GetAdjective]-Reiches zurückgreifen, um so mit der Zeit unser Heimatland wiederzuerlangen."
ww_BEL_event_war.5.a:	"Die Zukunft ist ungewiss."
ww_BEL_event_war.6.t:	"Generalsekretäre"

ww_BEL_event_war.6.b:	"Interessante Idee, wir werden ihr Angebot prüfen."
ww_BEL_event_war.6.c:	" Dies ist lediglich ein Vorwand für legitimen Widerstand. Nein."
BEL_set_secretaries_general_tt:	"§YGeneralsekretäre§! werden als §YBesetzungsgesetz§! in ganz Belgien hinzugefügt"

BEL_no_secretaries_general_tt:	 "§YGeneralsekretäre§! werden als §YBesatzungsgesetz§! in Belgien entfernt"
ww_BEL_event_war.7.t:	"Möglicher begrenzter Krieg – Paris muss fallen!"

ww_BEL_event_war.7.a:	"Unsere Truppen werden schon bald durch die Straßen von Paris marschieren!"

ww_BEL_event_war.8.b:	"Kämpft weiter! Dieser Krieg ist noch nicht vorbei."
ww_BEL_event_war.9.a:	"Wir nehmen an! Calais für den Frieden."

ww_BEL_event_war.10.t:	"Paris unter [ROOT.GetAdjective] Kontrolle"
ww_BEL_event_war.10.desc:	" Die Ziele, die uns in den Gesprächen zu Beginn unseres Krieges gegen die [FRA.GetAdjective] gesetzt wurden, sind erreicht. Paris liegt unter unserer Kontrolle, und man könnte daher annehmen, dass die [FRA.GetAdjective] nun so unter Druck stehen, dass ein Angebot, unsere Truppen zurückzuziehen, im Gegenzug dafür, dass sie uns Calais überlassen, auf widerstrebende Zustimmung stoßen könnte. \n\nGleichzeitig werden Stimmen laut: Wir sind schon so weit gekommen, und die [FRA.GetAdjective] sind offensichtlich nicht in der Lage, uns aufzuhalten. Warum sollten wir jetzt aufhören?"
ww_BEL_event_war.10.a:	"Wir haben bekommen, wofür wir gekommen sind, bitten Sie um Frieden!"

ww_BEL_event_spanish_interaction.1.t:	"[FROM.GetNameDefCap] schickt Ausrüstung"
ww_BEL_event_spanish_interaction.1.a:	"Wir werden sie gut nutzen!"

ww_BEL_event_spanish_interaction.2.a:	"Schicken Sie mehr Gewehre!"

ww_BEL_event_spanish_interaction.3.desc:	"Wir haben eine weitere Lieferung von [FROM.GetAdjective] Ausrüstung erhalten. Ihre Unterstützung wird uns im Kampf gegen die nationalistische Plage, die unsere Heimatländer verwüstet, äußerst hilfreich sein."
ww_BEL_event_spanish_interaction.3.a:	"Großartig!"
ww_BEL_event_spanish_interaction.4.desc:	"Uns wurde mitgeteilt, dass vor einigen Stunden in [FROM.GetNameDef] eine Kundgebung und eine Rede zu unserer Unterstützung stattfanden. Die Führung von [FROM.GetAdjective] hat erneut ihre Unterstützung für uns bekräftigt, in der Hoffnung, dass uns dies mehr Handlungsspielraum verschafft, da unser Volk mehr Vertrauen in uns gewinnt."

ww_BEL_event_spanish_interaction.5.t:	"Förderung der [FROM.GetAdjective] Auswanderung"


 



 ### HUN news events ###

ww_BEL_event_spanish_interaction.8.a:	"Wie unhöflich!"
ww_BEL_event_spanish_interaction.9.t:	"[FROM.GetNameDefCap] löst $BEL_SPR_alliance$ auf"

ww_BEL_event_misc.1.desc:	"Émile Vandervelde, mit dem Spitznamen "le patron" (der Boss), der langjährige sozialistische Politiker und Premierminister von [BEL.GetName], ist verstorben. Er war bekannt als Mitglied der belgischen Delegation bei der Pariser Friedenskonferenz, die den Ersten Weltkrieg beendete, und hatte sich zu einem entschiedenen Gegner des Faschismus entwickelt, wobei er sich sogar für eine direkte Intervention auf Seiten der Republikaner im Spanischen Bürgerkrieg einsetzte. \n\nHenri de Man hat das Amt des neuen Premierministers übernommen und wird noch heute vom König vereidigt."
ww_BEL_event_misc.2.t:	"Die schwarze Insel"
ww_BEL_event_misc.2.desc:	"Hergés jüngster Comic-Band ist gerade mit großem kommerziellem Erfolg erschienen und zeigt den geheimnisvollen Abenteurer Tim, der wegen eines Verbrechens, das er nicht begangen hat, nach Schottland gejagt wird. Der belgische Autor soll bereits fleißig an dem nächsten Band der Reihe "Die Abenteuer von Tim und Struppi" arbeiten."
ww_BEL_event_misc.2.a:	"Wohin führen Tintins Abenteuer ihn als Nächstes?"

ww_BEL_event_misc.3.desc:	"Cockerill ist das Unternehmen, das genau im Herzen der belgischen Fertigungsindustrie angesiedelt ist. Im Laufe seines Bestehens hat es sich nicht nur der Herstellung von Eisen und Stahl gewidmet, sondern auch der Fertigung von Präzisionsmaschinen, darunter Dampfmaschinen, Züge und sogar Schlachtschiffe. Es erwarb sich einen hervorragenden Ruf und stieg zu einer bedeutenden Kraft in der Stahlindustrie Westeuropas auf. \n\nAdolphe Greiner, der Generaldirektor, blieb ebenso wie andere Mitglieder der Geschäftsleitung während der Belagerung von Lüttich im Ersten Weltkrieg auf ihren Posten und sorgte dafür, dass die Arbeitsplätze für die Belegschaft so lange wie möglich erhalten blieben. Nach der Besetzung weigerte sich das Unternehmen, für die Besatzungsmächte zu produzieren, und wurde daher um den Großteil seiner schweren Stahlbearbeitungsanlagen gebracht. \n\nSeitdem hat es sich in der Zwischenkriegszeit wieder erholt und ist nach wie vor ein führendes Industrieunternehmen."
ww_congo.1.a:	"Ein großer Segen"
ww_congo.4.t:	"Raoul van Overstraeten kehrt nach Belgien zurück"

ww_congo.5.t:	"[COG.GetLeader] will die Nahrungsmittelproduktion im Kongo steigern"
ww_congo.5.desc:	"Unser Gouverneur im Kongo, [COG.GetLeader], hat seinen Wunsch geäußert, die Nahrungsmittelproduktion durch eine Reduzierung der Bergbauproduktion zu steigern, als Teil seiner Bemühungen, "die sozialen Bedingungen der Kolonialbevölkerung zu verbessern". Dies würde der Rentabilität der Kolonie zwar vorerst schaden, sie aber auf lange Sicht mit ziemlicher Sicherheit verbessern."
ww_congo.5.a:	"Das würde die Gewinne schmälern!"

CONGO_accepted_increased_food_production:	"Unser Oberherr hat unseren Plan zur Steigerung der Nahrungsmittelproduktion genehmigt"
ww_congo.6.desc:	"Die Kolonialverwaltung in [BEL.GetNameDef] hat unseren Antrag abgelehnt, die Nahrungsmittelproduktion durch eine Reduzierung der Bergbauproduktion zu steigern, mit dem Ziel, "die sozialen Bedingungen der Kolonialbevölkerung zu verbessern"."

ww_congo.7.desc:	"Die Kolonialverwaltung in [BEL.GetNameDef] hat unserem Antrag zugestimmt, die Nahrungsmittelproduktion durch eine Reduzierung der Bergbauproduktion zu steigern, mit dem Ziel, "die sozialen Bedingungen der Kolonialbevölkerung zu verbessern"."
ww_congo.8.t:	"Die Entstehung einer neuen Mittelschicht"
ww_congo.8.a:	"Wir werden abwarten müssen, wie sich das entwickelt"

ww_congo.9.t:	"Évolué beginnen, in die [ROOT.GetAdjective] Politik einzusteigen"
ww_congo.9.desc:	"Angesichts unserer seit kurzem wachsenden Mittelschicht und der Tatsache, dass viele Menschen in städtischen Gebieten über eine weiterführende Schulbildung verfügen, haben viele [COG.GetAdjective] begonnen, die Werke politischer Theoretiker zu lesen, und zahlreiche neue Politiker sowie Unabhängigkeitsbefürworter treten nun auf den Plan. Dies läutet einen neuen Aufbruch für die [COG.GetAdjective] Nation ein!"

ww_congo.10.b:	"Niemals!"
ww_congo.11.d:	"Die Franzosen haben unseren Forderungen zugestimmt, und ihre Stützpunkte und Einrichtungen in [772.GetName] stehen uns uneingeschränkt zur Verfügung. Sie haben uns faktisch die vollständige Kontrolle über ihre Kolonie übergeben."
ww_congo.11.a:	"Ein kluger Schachzug."

ww_congo.12.d:	"Die Franzosen haben unsere Forderungen auf empörende Weise abgelehnt! Es scheint, als müssten wir [772.GetName] mit Gewalt einnehmen, wenn wir es haben wollen!"
ww_congo.13.d:	"Kongolesische Streitkräfte sind entlang unserer Grenze positioniert und fordern die vollständige Kontrolle über unsere Stützpunkte, Institutionen und Einrichtungen! Wenn wir ihrer Forderung nachgeben, beenden wir faktisch unsere Unabhängigkeit und werden Teil ihrer Nation. Andererseits verfügen wir nicht gerade über die Mittel, um sie in dieser Frage zu bekämpfen."
ww_congo.13.a:	"Gemeinsam werden wir stärker!"





 ##### Belgian events #####

 #### Historical ####
 ### Political Events

 #Government Resigns
ww_congo.17.t:	"Unabhängigkeit des Kongo erreicht"
ww_congo.17.a:	"Das Kräfteverhältnis in Afrika hat sich verschoben"
ww_congo.17.b:	"Es ist an der Zeit zu beweisen, dass wir zwei gleichberechtigte und unabhängige Länder sind"

 #Corrupt Zeeland
ww_congo.18.a:	"Das Zeitalter des Imperialismus ist noch nicht zu Ende"

 #Royal Appointment
ww_congo.19.a:	"Das Zeitalter des Imperialismus ist zu Ende"
ww_congo.19.b:	"Wir sind siegreich!"
ww_congo.19.c:	"Ein vernichtender Schlag ..."

  #Budgetary Crisis
ww_congo.21.d:	"Angesichts des sehr lockeren Zugriffs unserer Regierung auf das Ruanda-Urundi-Mandat und der Ausbreitung nationalistischer Stimmungen in der gesamten Region hat Mwami Mwambutsa IV., König von Burundi, die Nation zu einem unabhängigen Staat erklärt und damit die Verbindungen zu unserer Zentralregierung gekappt. Sollten wir eingreifen?"

  #Adriaan Martens Crisis
attempted_diplomacy_opinion_modifier:	"Sie haben versucht, diplomatisch auf uns zuzugehen"
BEL_commonwealth_faction:	"Das Belgische Commonwealth"
ww_congo.22.t:	"[COG.GetLeader] fordert verstärkte Auswanderung in den Kongo"

  #The Flemish Question
ww_congo.23.t:	"Die [FROM.GetAdjective] genehmigen unser Einwanderungsprogramm"
ww_congo.23.a:	"Perfekt"

  #The Snap Election
ww_congo.25.desc:	"Der belgische Kolonialminister Albert de Vleeshauwer, ein enger Verbündeter von Pierre Ryckmans, hat beschlossen, ins Ausland zu reisen, um bei unseren neuen Verbündeten um Unterstützung zu werben, da die Lage aussichtslos erscheint und die Politiker auf dem Festland sich weigern zu handeln. Vielleicht können wir dank seiner Hilfe einige vorteilhafte Vereinbarungen erzielen?"
ww_congo.26.t:	"[FROM.GetNameDefCap] besetzt [796.GetName]!"

 #Communist Language Problems
ww_congo.26.b:	" "Für wen halten die sich eigentlich?"
ww_congo.27.a:	"Fangen Sie sie ein und statuieren Sie an Mukalabushi ein Exempel"
ww_congo.27.b:	"Es ist ein Zeichen dafür, dass tiefgreifende Veränderungen notwendig sind"

 ### Diplomatic Events

 #Repudiate Treaties
COG_coquilatville_and_lusambo_will_join_the_belgian_loyalsits_tt:	" §Y[538.GetName]§! und §Y[888.GetName]§! werden sich den §Ypro-belgischen Loyalisten§! anschließen, wenn der Unabhängigkeitskrieg beginnt"
ww_congo.29.t:	"Kongolesische Nationalisten bitten uns um Hilfe"
ww_congo.29.desc:	"Kongolesische Nationalisten, die sich selbst als Nationales Befreiungskomitee bezeichnen, bereiten einen Unabhängigkeitskrieg gegen ihren Oberherrn vor. Sie versprechen uns, dass sie sich nach dem gewonnenen Krieg enger an uns anschließen werden, sofern wir ihnen zu Beginn der Kämpfe Waffen liefern, und behaupten, dass ein geschwächtes [BEL.GetName] in unserem Interesse liege."

 #Luxembourg Receives Ultimatum - to LUX
ww_congo.31.t:	"[FROM.GetNameDefCap] Beschließt, uns nicht zu helfen"

 #Luxembourg Yields - to BEL
ww_congo.32.t:	"Der Simba-Staatsstreich"
ww_congo.32.desc:	"Die Simba-Bewegung hat in letzter Zeit große Unterstützung im Land gewonnen. Nun sind sie in den Nationalkongress eingezogen und fordern einen Führungswechsel. Unseren Politikern bleibt kaum etwas anderes übrig, als die Situation zu akzeptieren. Die Frage ist jedoch: Wer soll unseren Staat nun führen?"
ww_congo.32.a:	"Cyrille Adoula ist ein guter Staatsmann"

 #Luxembourg Resists - to BEL
ww_congo.33.a:	"Cyrille Adoula ist ein guter Staatsmann, er darf nicht gehen"

 ##Demand Calais Events

 # To Belgium : What can we offer?
ww_congo.35.b:	"Die Zeit für Afrika ist gekommen"
ww_congo.36.desc:	"Botschafter aus [FROM.GetNameDef] haben unseren Friedensvorschlag abgelehnt. Sie argumentieren, dass unser Angriff gegen sie völlig ungerechtfertigt war, und daher werden sie von uns nichts als bedingungslose Kapitulation akzeptieren, da wir eine Bedrohung für den regionalen Frieden darstellen."

 # To France : Belgium demand Calais
ww_congo.37.a:	"Wir werden unser Gebiet nicht aufgeben."
ww_congo.37.b:	"Wir haben keine andere Wahl, als zuzustimmen."

 # To France : Belgium offers Congo land for Calais
ww_congo.39.t:	"Die ersten kongolesischen Wahlen"
ww_congo.39.a:	"Kasa-Vubu ist ein guter Staatsmann, wir brauchen ihn"
ww_congo.40.t:	"Kasa-Vubus erstes Kabinett"

 # To France : Belgium offers payment for Calais
ww_congo.41.desc:	" \n [FROM.GetLeader], Anführer von [FROM.GetNameDef] und der Allianz der Bakongo, hat sich an uns gewandt und fordert, dass wir alle Gebiete mit Bakongo-Mehrheit an sie abtreten. Wie sollen wir darauf reagieren?"
ww_congo.41.a:	" "Es ist zum Wohle der Allgemeinheit"
ww_congo.41.b:	"Auf keinen Fall!"

# To Congo : Belgium just handed land over to France

 # To Belgium : France accepted! We got the land.
ww_congo.44.t:	"Das Haus von Água Rosada"
ww_congo.44.desc:	 "Der Rat hat beschlossen, dass der legitimste Herrscher des Kongo Dom Pedro VII. wäre, der derzeitige Thronanwärter des kürzlich aufgelösten Königreichs Kongo, das einst in unseren westlichen Provinzen sowie im heutigen Cabinda und Angola lag. Sicherlich könnte er für Stabilität sorgen und die Vereinigung des Volkes der Bakongo erreichen?"
ww_congo.44.a:	"Er ist der legitimste Kandidat, den wir uns nur wünschen können!"

 # To Belgium : France refused. Escalate?
ww_congo.45.b:	"Nein, wir brauchen jemand anderen!"
ww_congo.46.t:	"Der Mâ Loango"

 #To ENG/FRA/SOV: Belgium requests guarantee
ww_congo.47.t:	"Das Haus Ntwero von Burundi"
ww_congo.47.a:	"Er kann uns zumindest einen legitimen Anspruch auf Burundi gewähren ..."

 #To Belgium: Gets guarantee from ENG/FRA/SOV
ww_congo.48.a:	"Er kann uns zumindest einen legitimen Anspruch auf Ruanda gewähren ..."

 #To Belgium: Does not get guarantee from ENG/FRA/SOV
ww_congo.49.a:	"Er wird es wohl tun müssen..."

 #To GER/FRA/ENG: Exiled Belgium Requests equipment
ww_congo.51.t:	"[FROM.GetNameDefCap] Stimmt dem Abschluss eines Bündnisses zu"
ww_congo.51.desc:	" \n[FROM.GetNameDefCap] hat unsere Bitte um ein Bündnis mit ihnen begeistert aufgenommen und alle notwendigen Dokumente unterzeichnet, um dies offiziell zu machen. Wir werden nicht länger allein gegen diejenigen kämpfen, die uns bedrohen!"
ww_congo.51.a:	 "Gemeinsam sind wir stärker!"

 #To GER/FRA/ENG: Exiled Belgium Requests factories
ww_congo.53.t:	"[FROM.GetLeader] fordert die Wiedervereinigung des burundischen Volkes"
ww_congo.53.a:	"Es ist zum Wohle der Allgemeinheit"

 #To GER/USA/ENG: BEL requests military experience sharing
ww_congo.54.desc:	" \n [FROM.GetLeader], Anführer von [FROM.GetNameDef], hat zugestimmt, alle Gebiete mit einem hohen Anteil an burundischer Bevölkerung zu übergeben, und wünscht uns alles Gute für die Zukunft. Heute ist ein großer Tag für die kongolesische Nation."

 #To BEL: Generic accept
ww_congo.56.t:	"[FROM.GetLeader] fordert die Wiedervereinigung des ruandischen Volkes"
ww_congo.56.desc:	" \n [FROM.GetLeader], Anführer von [FROM.GetNameDef] und des ruandischen Volkes, hat sich an uns gewandt und verlangt, dass wir alle Gebiete mit ruandischer Mehrheit an sie abtreten. Wie sollen wir darauf reagieren?"
ww_congo.56.a:	"Es dient dem Allgemeinwohl"

 #To BEL: generic reject
ww_congo.57.desc:	"\n [FROM.GetLeader], Anführer von [FROM.GetNameDef], hat zugestimmt, alle Gebiete mit einem hohen Anteil an ruandischer Bevölkerung zu übergeben, und wünscht uns alles Gute für die Zukunft. Heute ist ein großer Tag für die kongolesische Nation."
ww_congo.58.t:	"[FROM.GetLeader] Übergibt keine ruandischen Gebiete "

ww_congo.58.a:	"Wir können nicht viel tun"

ww_congo.59.b:	"Nein!"
ww_congo.60.t:	"[FROM.GetLeader] akzeptiert unsere Bitte, ihr Protektorat zu werden"
ww_congo.60.desc:	"\n [FROM.GetLeader], Anführer von [FROM.GetNameDef], hat beschlossen, unsere Bitte anzunehmen und uns zu gestatten, erneut ein Protektorat ihrer Nation zu werden. Wahrlich, das Gleichgewicht in Afrika ist wiederhergestellt!"

ww_congo.61.t:	"[FROM.GetLeader] Lehnt unseren Antrag ab, ihr Protektorat zu werden"
ww_congo.61.desc:	"\n [FROM.GetLeader], Anführer von [FROM.GetNameDef], hat beschlossen, unseren Antrag abzulehnen, da er unserer Region wenig Wert beimisst und behauptet, dass wir ihnen kaum etwas bieten könnten, was sie nicht bereits besitzen."
ww_congo.61.a:	"Heute ist ein denkwürdiger Tag ..."

ww_congo.63.t:	"[FROM.GetLeader] möchte uns Uran verkaufen"

ww_congo.63.b:	"Wir werden uns nicht zu kriminellen Handlungen herablassen"

ww_congo.65.desc:	"\n [FROM.GetLeader], Anführer von [FROM.GetNameDef], hat unsere Bitte, Uran gegen Bezahlung in sein Land zu schmuggeln, abgelehnt und erklärt, dass er sich nicht auf das Niveau eines internationalen Verbrechers herablassen werde."
ww_congo.65.a:	"Schade ..."

ww_congo.67.t:	"[FROM.GetLeader] lädt uns zu einem Uranentwicklungsfonds ein"
ww_congo.67.desc:	"\n [FROM.GetLeader], der Anführer von [FROM.GetNameDef], ist mit einem interessanten Angebot auf uns zugekommen. Sie möchten, dass wir dem gemeinsamen Uranentwicklungsfonds beitreten und nukleares Material sowie Forschungsergebnisse miteinander teilen. Es könnte zwar leichter zu Informationslecks kommen, aber für das Uran, das wir so dringend benötigen, könnte es sich durchaus lohnen."
ww_congo.67.a:	"Gerne!"

ww_congo.68.t:	"[FROM.GetLeader] tritt dem Uranentwicklungsfonds bei"
ww_congo.68.a:	"Ausgezeichnet!"

ww_congo.70.desc:	"Unser Pilot Jan Zumbach hat uns verlassen und beschlossen, für die RAF zu kämpfen. Seine Entscheidung, seine Kameraden zu verlassen, fiel ihm nicht leicht, doch wir müssen ihn dafür loben, dass er für ein unabhängiges Polen, frei von Unterdrückung, weiterkämpfen möchte."

ww_congo.71.t:	"Jan Zumbach möchte in den Kongo aufbrechen"
ww_congo.71.a:	"Lassen Sie ihn gehen"
ww_congo.71.b:	"Verhindern Sie seine Ausreise!"

ww_congo.72.a:	"Wir werden ihn einsetzen"
ww_congo.73.desc:	"[FROM.GetAdjective] Diplomaten haben sich mit einem Friedensangebot an uns gewandt. Das Angebot hängt davon ab, dass wir zustimmen, unsere Ansprüche auf bestimmte afrikanische Besitzungen aufzugeben und unsere Truppen aus der Region abzuziehen. Nehmen wir dies an?"

congo_independence_struggle.1.t:	"Die Flüstern der Unabhängigkeit"
congo_independence_struggle.1.d:	"Seit unser Kontinent von den Europäern unter sich aufgeteilt wurde, sehnen wir uns nach Freiheit und der Möglichkeit, unsere eigene Zukunft zu gestalten. Unsere eigene Vergangenheit als Kolonie von [BEL.GetNameDefCap] war geprägt von Ausbeutung und Entmenschlichung, doch wir wurden stets durch unsere eigene Uneinigkeit und ihre überlegene Feuerkraft unterdrückt. \n\nWieder sind aufrührerische Stimmen in den Straßen und im Dschungel zu hören, da unser Volk seinen Traum von einem Kongo ohne koloniale Einmischung laut werden lässt. Ein Kongo, der frei ist, seine eigenen Gesetze zu erlassen und durchzusetzen, ein Kongo, der frei ist, von seiner eigenen harten Arbeit zu profitieren, ein Kongo, der frei ist, seine eigene Zukunft zu gestalten."

congo_independence_struggle.2.t:	"[FROM.GetNameDefCap] hat sich bezüglich ihrer Unabhängigkeit an uns gewandt"
congo_independence_struggle.2.d:	"Wir wurden soeben von einer Gruppe angesprochen, die behauptet, die Unabhängigkeitsbewegung unseres Kolonialuntertanen [COG.GetNameDef] zu vertreten. Obwohl sich die Kolonialverwaltung dort seit einiger Zeit der wachsenden Unabhängigkeitsstimmung bewusst ist, hat die Dreistigkeit, tatsächlich danach zu fragen, sie doch etwas überrascht. Sie warnen uns, dass es vor Ort breite Unterstützung für das Ziel einer freien und unabhängigen Nation gibt und dass eine zu harte Reaktion unsererseits zu Gewalt und möglicherweise sogar zu einem Krieg führen könnte. \n\nWir müssen auch unsere globalen Verpflichtungen und unser Ansehen berücksichtigen. Daher wäre das diplomatischste Angebot, ihnen zu gestatten, sich uns als gleichberechtigte Partner in einem [BEL.GetAdjective] Commonwealth. \n\nAndererseits stammt ein erheblicher Teil unseres Reichtums aus diesem Gebiet, und unsere Finanzen würden durch ihren Verlust außerordentlich hart getroffen werden. Wir könnten sie bitten, uns für ihre Freiheit zu bezahlen – zu einem recht hohen Preis. \n\nSchließlich können wir einfach Nein sagen und unsere Streitkräfte mobilisieren, um vor einem möglichen Aufstand zu warnen. "
congo_independence_struggle.2.a:	"Solange sie weiterhin an unserer Seite kämpfen"

congo_independence_struggle.2.c:	"Wir werden sie niemals freiwillig gehen lassen!"
congo_independence_struggle.3.a:	"Das klingt sehr vernünftig. Wir nehmen an!"

congo_independence_struggle.4.t:	"[FROM.GetNameDefCap] wird uns die Freiheit gewähren, wenn wir eine Entschädigung zahlen"

congo_independence_struggle.5.d:	"Wir haben soeben eine Nachricht vom neuen Botschafter aus [COG.GetName] erhalten, in der angekündigt wird, dass sie das Angebot zur Unabhängigkeit von der [BEL.GetAdjective] Kolonialherrschaft im Austausch für den Beitritt zum [BEL.GetAdjective] Commonwealth als vollwertiges und gleichberechtigtes Mitglied angenommen haben. Nun beginnt die Arbeit, die Verwaltung aus dem Kolonialamt herauszulösen und diese Verantwortung stattdessen der neuen Regierung zu übertragen."
congo_independence_struggle.5.a:	"Unsere Mission ist beendet!"

congo_independence_struggle.6.b:	"Dann wird es keine Verhandlungen geben"
congo_independence_struggle.7.t:	"[FROM.GetNameDef] gehen lassen"

congo_independence_struggle.7.a:	"Unsere Mission ist beendet, aber unsere Gewinne nicht!"
congo_independence_struggle.8.t:	"[FROM.GetNameDefCap] möchte, dass wir ein Übersee-Departement werden"
congo_independence_struggle.8.d:	" [BEL.GetName] scheint zu glauben, dass wir nicht in der Lage sind, uns mit Gewalt von ihnen unabhängig zu machen, und hat unseren Bluff durchschaut. Sie haben uns die "Möglichkeit" angeboten, ein Übersee-Departement zu werden, was uns im Wesentlichen zu einem Ableger ihrer Nation macht – mit Bürgerrechten, aber ohne die Autonomie, unsere eigene Zukunft zu gestalten. Sie mögen Recht haben, dass uns die militärische Stärke fehlt, uns dem zu widersetzen, doch die Entscheidung liegt letztendlich bei uns. "


