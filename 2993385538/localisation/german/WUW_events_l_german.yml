wuw_GER_reichskommissariats.17.desc:	"Mit der Eroberung der strategischen Zone in der Slowakei stellt sich die Frage, wie mit der Region umgegangen werden soll. Einige Pläne sehen das Gebiet als Teil des Balkans vor, während andere vorschlagen, es könnte vielleicht dem böhmischen Staat angegliedert oder möglicherweise sogar in den Großdeutschen Staat integriert werden. Was meinen Sie?"
wuw_GER_reichskommissariats.17.a:	"Ungarn sollte belohnt werden"
wuw_GER_reichskommissariats.17.b:	"Es sollte in den Balkan eingegliedert werden"
