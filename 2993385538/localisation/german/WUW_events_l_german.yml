wuw_GER_reichskommissariats.23.desc:	"Mit der Eroberung der strategischen Zone der amerikanischen Westküste stellt sich die Frage, wie mit dieser Region verfahren werden soll. Einige Pläne sehen vor, das Gebiet in Nordamerika einzugliedern, während andere vorschlagen, es möglicherweise dem kolumbianischen Staat anzuschließen. Manche befürworten sogar, es [JAP.GetNameDef] zu übertragen. Was meinen Sie dazu?"
wuw_GER_reichskommissariats.23.c:	"Es sollte in Kolumbus eingegliedert werden"
