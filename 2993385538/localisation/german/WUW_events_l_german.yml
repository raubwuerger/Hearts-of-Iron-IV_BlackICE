wuw_GER_reichskommissariats.9.t:	"Der Status von Wolgadeutschland"
wuw_GER_reichskommissariats.9.desc:	"[ROOT.GetLeader] hat den Wunsch geäußert, die wolgadeutsche Kolonie in ein Reichsgebiet umzuwandeln und sie so weit wie möglich zu integrieren. Viele lokale Verwaltungsbeamte halten es jedoch für klüger, die Kolonie von einem näher gelegenen Staat aus zu verwalten. Wie sollte man mit dieser Frage umgehen?"
wuw_GER_reichskommissariats.9.a:	"Es sollte in ein Reichsgebiet umgewandelt werden!"
wuw_GER_reichskommissariats.9.b:	"Es sollte Moskowien einverleibt werden."
wuw_GER_reichskommissariats.9.c:	"Es sollte in Turkestan eingegliedert werden."
wuw_GER_reichskommissariats.10.t:	"Der Status des Südurals"
wuw_GER_reichskommissariats.10.desc:	"Mit der Eroberung der strategischen Zone Südural stellt sich die Frage, wie mit der Region verfahren werden soll. Einige Pläne sehen vor, das Gebiet in Moskowien einzugliedern, während andere vorschlagen, dass es vielleicht als eigener Staat oder sogar als Teil von Turkestan bestehen könnte. Was sagen wir dazu?"
wuw_GER_reichskommissariats.10.a:	"Es sollte sein eigenes Reichskommissariat sein"
wuw_GER_reichskommissariats.10.b:	"Es sollte in Moskowien eingegliedert werden"
wuw_GER_reichskommissariats.10.c:	"Es sollte in Turkestan eingegliedert werden"
wuw_GER_reichskommissariats.11.t:	"Der Status von Ostkarelien"
wuw_GER_reichskommissariats.11.desc:	"Mit der Eroberung der strategischen Zone Ostkarelien stellt sich die Frage, wie mit dieser Region verfahren werden soll. Einige Pläne sehen vor, das Gebiet in Moskowien einzugliedern, während andere vorschlagen, dass es vielleicht dem finnischen Staat angegliedert werden könnte. Was sagen wir dazu?"
wuw_GER_reichskommissariats.11.a:	"Finnland sollte belohnt werden"
wuw_GER_reichskommissariats.11.b:	"Es sollte in Moskowien eingegliedert werden"
wuw_GER_reichskommissariats.12.t:	"Die Führung des Generalgouvernements"
wuw_GER_reichskommissariats.12.desc:	"Nun, da wir eine neue Zivilverwaltung in Südpolen eingerichtet haben, müssen wir nicht nur über den Zweck unseres neuen Subjekts entscheiden, sondern auch darüber, wer die Menschen in der Region führen und sicherstellen soll, dass unsere Politik ordnungsgemäß umgesetzt wird. Sollen wir einen [ROOT.GetAdjective] Politiker zum Generalgouverneur ernennen, oder sollen wir einen lokalen Kollaborateur einsetzen?"
