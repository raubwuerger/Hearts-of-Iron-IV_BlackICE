wuw_GER_chinese_diplomacy.5.t:	"Das chinesisch-deutsche gemeinsame Forschungsprogramm"
wuw_GER_chinese_diplomacy.5.a:	"Eine großartige Initiative!"
wuw_GER_chinese_diplomacy.5.b:	"Wir glauben nicht, dass uns das helfen wird"

wuw_GER_chinese_diplomacy.6.desc:	" [FROM.GetLeader] von [FROM.GetNameDef] hat beschlossen, unserem Vorschlag zuzustimmen, und großes Interesse an unserem chinesisch-deutschen gemeinsamen Forschungsprogramm bekundet. Nun kann die Arbeit beginnen!"
wuw_GER_chinese_diplomacy.6.a:	"Hervorragend"
wuw_GER_chinese_diplomacy.7.t:	"[FROM.GetNameDefCap] Weigert sich, mitzuarbeiten"
wuw_GER_chinese_diplomacy.7.desc:	"[FROM.GetLeader] von [FROM.GetNameDef] hat beschlossen, unser Angebot abzulehnen, und behauptet, dass sie ohne westliche Technologie alleine zurechtkommen. Es ist, wie es ist..."

wuw_GER_weltpolitik.12.desc:	"\n[FROM.GetLeader] von [FROM.GetNameDef] ist mit einer interessanten Bitte an uns herangetreten. Sie bitten uns, ihnen alte [FROM.GetAdjective] Kolonialgebiete zurückzugeben, im Gegenzug für eine Vertiefung der Beziehungen zwischen unseren Ländern und ihre offizielle Unterstützung unserer Regierung auf globaler Ebene. Es scheint ein wenig einseitig, aber vielleicht ist es zum Besten?"
wuw_GER_weltpolitik.12.a:	"Alles für unsere Freunde"

wuw_GER_weltpolitik.13.a:	"Der Imperialismus ist wieder im Kommen!"
wuw_GER_weltpolitik.14.a:	"Es sollte einfach nicht sein ..."

wuw_GER_weltpolitik.15.a:	"Wir fordern eine Form  der Entschädigung!"
