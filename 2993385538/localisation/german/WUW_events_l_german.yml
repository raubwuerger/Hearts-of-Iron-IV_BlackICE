wuw_GER_reichskommissariats.21.desc:	"Nun, da wir eine neue Zivilverwaltung in der Karibik eingerichtet haben, müssen wir nicht nur über den Zweck unseres neuen Subjekts entscheiden, sondern auch darüber, wer die Menschen in der Region führen und sicherstellen wird, dass unsere Politik ordnungsgemäß umgesetzt wird. Sollen wir einen [ROOT.GetAdjective] Politiker in die Position des Reichskommissars setzen oder einen lokalen Kollaborateur verwenden?"
