wuw_GER_realpolitik.13.desc:	" [FROM.GetLeader] von [FROM.GetNameDef] hat verlangt, dass wir uns ihrer Herrschaft unterwerfen und ein Vasallenstaat von ihnen werden, mit der Begründung,  dass dies dazu diene, uns leichter vor der Bedrohung durch die [SOV.GetAdjective] zu schützen. Sollten wir ihren Forderungen nachgeben?"
