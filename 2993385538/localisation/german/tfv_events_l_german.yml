tfv_south_africa.104.t:0	"Freiheit für [LBA.GetName]"
tfv_south_africa.104.d:0	"Das Volk von [LBA.GetName] hat sich aus der Gewalt seiner kolonialen Unterdrücker befreit und ist nun bereit, sein Schicksal selbst in die Hand zu nehmen. Sie haben eine provisorische Regierung gebildet und eine Verfassung ausgearbeitet. Jetzt muss nur noch die Autorität von unseren Militärgouverneuren auf die neue [LBA.GetAdjective] Regierung übertragen werden."
tfv_south_africa.64.c:0	"Die Situation lässt dies noch nicht zu."
tfv_new_zealand.7.t:0	"Michael Joseph Savage stirbt"
tfv_new_zealand.7.desc:0	"Auf tragische Weise ist der beliebte neuseeländische Premierminister Michael Joseph Savage an einem Krebsleiden verstorben. Das ganze Land trauert um den Mann, den viele für den Begründer des neuseeländischen Wohlfahrtssystems halten. Die Geschichte wird sich an seinen Mut und seine Freundlichkeit gegenüber seinen Mitmenschen erinnern."
tfv_new_zealand.7.a:0	"Wir werden ihn vermissen."
tfv_raj.1.t:0	"Fighter Funds"
tfv_raj.1.desc:0	"Überall im Empire wurden in den Gemeinden "Fighter Funds" eingerichtet, um Geld für neue Kampfflugzeuge für die Royal Air Force zu sammeln. Auch reiche Privatpersonen haben sich an der Anschaffung von Flugzeugen für das Militär beteiligt. Der Nizam von Hyperabad hat genug Geld gespendet, um den Kauf von 2 kompletten Staffeln zu finanzieren. Die Frage ist, wo sie stationiert werden sollen."
tfv_raj.1.a:0	"Sie sollten in das Vereinigte Königreich gehen."
tfv_raj.1.b:0	"Wir brauchen sie für die Landesverteidigung!"
tfv_raj.2.t:0	"Indischer Prinz spendet Kampfflugzeuge"
tfv_raj.2.desc:0	"Der Nizam von Hyperabad, ein indischer Prinz, hat großzügig das Geld für den Kauf von zwei kompletten Staffeln unserer modernsten Kampfflugzeuge für die Royal Air Force gespendet. Die Regierung hat sich dafür bedankt und erklärt, dass das erste Flugzeug den Namen "Spirit of Hyperabad" erhalten wird."
tfv_raj.2.a:0	"Sie werden sich als sehr nützlich erweisen."
tfv_raj.3.t:	"Stämme im Nordwesten befriedet"
tfv_raj.3.desc:	"Britischen Raj-Truppen gelang es, die Rebellen aus ihren Verstecken zu vertreiben und der Region Sicherheit und Stabilität zu bringen."
tfv_raj.3.a:	"Große Neuigkeiten"
tfv_raj.4.desc:	"Nach einer brutalen Schlacht haben die Truppen des British Raj nach schweren Verlusten in der North Western Frontier schließlich die Ordnung wiederhergestellt"
tfv_raj.4.b:	"Wir müssen aus diesem Debakel lernen"
tfv_raj.6.t:0	"Unruhen brechen in Bombay aus"
tfv_raj.6.desc:0	"POLIZEI SCHIESST AUF MENSCHENMENGEN. Truppen werden angefordert. Die Kämpfe zwischen Muslimen und Hindus gehen heftiger denn je weiter. Am Samstag wurden neun Menschen getötet und 100 verletzt. Die Zahl der Opfer beläuft sich nun auf 46 Tote und 440 Verletzte. Plünderungen, Messerstechereien und Brandstiftungen gehen in verschiedenen Vierteln der Stadt weiter, und die Unruhen weiten sich auf die Baumwollspinnereien aus. Britische Truppen wurden angefordert und 16 Lastwagen mit Männern der Durham Light Infantry patrouillieren in den Unruhegebieten.\n Die Polizei eröffnete sechsmal das Feuer auf gefährliche Menschenmengen, wobei acht Personen getötet und zahlreiche verwundet wurden. Die Polizei schoss auf eine Menge von Hindus, die versuchten, eine Moschee niederzubrennen. Andernorts wurde ein Hindu-Tempel in Brand gesetzt. Die Feuerwehr löschte l8 Brände. Ein muslimischer Polizist widersetzte sich im Alleingang einer 300-köpfigen Menschenmenge, die drohte, eine Hindu-Familie, bestehend aus fünf Frauen, vier Kindern und einem alten Mann, zu verbrennen, bis Verstärkung eintraf. Allein in einem Krankenhaus gibt es 50 Fälle von Messerstecherei.\n APPEL DER FÜHRER. Hindu- und Moslemführer haben nach einer Konferenz gemeinsam an ihre Gemeinschaften appelliert, den Frieden wiederherzustellen und eine Beilegung des Streits auf dem Verhandlungsweg versprochen."
tfv_raj.6.a:0	"Wir müssen die Ordnung wiederherstellen"
tfv_raj.8.t:0	"Waffenproduktion durch Unruhen gestoppt!"
tfv_raj.8.d1:	"Ein gewalttätiger Mob hat heute eine Waffenfabrik gestürmt, die Produktion unterbrochen und wichtige Produktionsbereiche in Brand gesetzt, bevor die Behörden die Ordnung wiederherstellen konnten. Maschinen wurden beschädigt, Rohstoffe geplündert und die Belegschaft in die Flucht getrieben. Durch die Verlangsamung der Produktion ist unsere Fähigkeit, Waffen für laufende Operationen zu liefern, vorübergehend beeinträchtigt worden."
tfv_raj.8.d2:	"Die Demonstranten überwältigten die Sicherheitskräfte, zertrümmerten die Ausrüstung und warfen fertige Gewehre auf die Straße, bevor sie einen Vorrat an Schießpulver in Brand setzten. Das Chaos zwang die Arbeiter, ihre Posten zu verlassen und die Fabrik in Trümmern zurückzulassen. Die Behörden befürchten, dass sich die gestohlenen Waffen nun in den Händen nationalistischer Milizen befinden könnten, die die britische Herrschaft herausfordern wollen."
tfv_raj.8.d3:	"Streikende Arbeiter, die über schlechte Arbeitsbedingungen und politische Missstände verärgert waren, sabotierten wichtige Fließbänder und legten die Produktion für Wochen lahm. Viele trugen Transparente mit der Forderung nach Unabhängigkeit und einem freien Indien. Der Verlust von kritischer Produktionszeit wird unsere Fähigkeit beeinträchtigen, die militärischen Vorräte aufzufüllen, wenn sich die Unruhen ausbreiten."
tfv_raj.8.d4:	"Bei einem plötzlichen Aufstand vor einem Waffendepot kam es zu Plünderungen und der Zerstörung von gelagerter Munition. Es wird vermutet, dass der Angriff von Mitgliedern der Hindustan Socialist Republican Association organisiert wurde, deren Ziel es war, die britische Militärproduktion lahmzulegen und lokale Revolutionäre zu bewaffnen."
tfv_raj.8.d5:	"Hinduistische und muslimische nationalistische Gruppierungen gerieten in einem Industriegebiet aneinander, bevor sie ihre Wut auf eine nahe gelegene Waffenfabrik richteten. Sie beschuldigten sich gegenseitig des Verrats im Unabhängigkeitskampf und die Kämpfe eskalierten schnell. Als die Behörden die Ordnung wiederherstellten, lag die Fabrik in Trümmern und die gestohlenen Waffen zirkulierten nun unter den Widerstandsgruppen im Untergrund."
tfv_raj.8.d6:	"Eine nationalistische Miliz, die Berichten zufolge mit einer Widerstandsbewegung im Untergrund verbunden ist, stürmte eine Waffenfabrik, plünderte Waffen und setzte die Produktionsanlagen in Brand, bevor die britischen Behörden reagieren konnten. Die Anlage wurde zwar gesichert, aber die gestohlenen Schusswaffen werden wahrscheinlich in zukünftigen Aufständen gegen die Kolonialherrschaft eingesetzt werden."
tfv_raj.8.d7:	"Kommunale Spannungen kochten über, als rivalisierende Gruppierungen, die beide behaupteten, für die Zukunft Indiens zu kämpfen, in der Nähe eines Waffendepots aufeinander trafen. Was als Streit um die Rekrutierung begann, entwickelte sich zu einer regelrechten Schlacht, in deren Verlauf eine Waffenfabrik geplündert und wichtige Infrastrukturen zerstört wurden. Die britischen Behörden kamen zu spät, um den Schaden zu verhindern, und viele vermuten, dass Elemente sowohl aus hinduistischen als auch aus muslimischen nationalistischen Bewegungen daran beteiligt waren."
tfv_raj.8.d8:	"Radikale mit bekannten Verbindungen zu einer antikolonialen paramilitärischen Gruppe drangen in eine Waffenfabrik ein, überwältigten die Sicherheitskräfte und setzten die gelagerte Munition in Brand. Die britischen Streitkräfte gewannen schnell die Kontrolle zurück, aber die Angreifer verschwanden in den umliegenden Hügeln und hinterließen Parolen, in denen sie die Fremdherrschaft verurteilten."
tfv_raj.9.t:0	"Fabrikarbeiter revoltieren - Produktion unterbrochen!"
tfv_raj.9.d1:	"In einem Industriegebiet kam es zu einer Welle von Unruhen, die darin gipfelten, dass Randalierer in eine zivile Fabrik einbrachen und große Zerstörungen anrichteten. Werkzeuge und Maschinen wurden zerstört, während Baumaterialien auf mysteriöse Weise verschwanden. Die Behörden vermuten, dass die gestohlenen Materialien weitere Unruhen in der Region auslösen werden."
tfv_raj.9.d2:	"Die Demonstranten gingen auf die Straße, setzten Textilfabriken in Brand und plünderten Fertigwaren, bevor sie sich in der Stadt zerstreuten. Viele der Demonstranten schwenkten Banner der Kongresspartei und prangerten die britische Herrschaft an, während andere Schilder mit der Forderung nach einem Hindu Rashtra trugen."
tfv_raj.9.d3:	"Eine Fabrik, die Stahlkomponenten für den Ausbau der Eisenbahn herstellte, wurde überrannt, ihr Inventar geplündert und die Arbeitszeiten auf unbestimmte Zeit verschoben. Eine Gruppe militanter Arbeiter, die Berichten zufolge mit kommunistischen Organisatoren in Verbindung steht, erklärte die Zerstörung zu einem notwendigen Schlag gegen den imperialen Kapitalismus, bevor sie in den Slums verschwand."
tfv_raj.9.d4:	"Maschinen wurden zerschlagen und Arbeiter flohen, als nationalistische Parolen durch die Fabrikhallen hallten und die Produktion auf unbestimmte Zeit zum Stillstand kam. Britisch loyale Angestellte, die versuchten, Widerstand zu leisten, wurden geschlagen und vertrieben, was die Spaltung zwischen den indischen Fraktionen und den Kolonialbehörden weiter vertiefte."
tfv_raj.9.d5:	"Aktivisten der Muslimliga führten einen Marsch gegen die britischen Industrieinteressen an, wurden aber von bewaffneten Hindu-Nationalisten empfangen. Die beiden Gruppen gerieten im Fabrikviertel aneinander, bevor beide ihren Zorn gegen britische Unternehmen richteten, indem sie in einem Akt des Trotzes Lagerhäuser niederbrannten und Vorräte plünderten."
tfv_raj.9.d6:	"Arbeiter, die einer nationalistischen Untergrundbewegung angehören, verließen heute eine zivile Fabrik und weigerten sich, unter britischer Herrschaft weiter zu produzieren. Der Protest eskalierte schnell zu einem Aufstand, bei dem Regierungstreue gegen Streikende vorgingen. Bevor die Behörden eingreifen konnten, wurde die Fabrik geplündert und wichtige Maschinen zerstört."
tfv_raj.9.d7:	"Eine Gruppe, die mit einer radikalen Unabhängigkeitsgruppe in Verbindung steht, sabotierte eine Textilfabrik, kappte Stromleitungen und zertrümmerte Maschinen, bevor sie Rohmaterialien in Brand setzte. Die Ermittlungen deuten darauf hin, dass die Agitatoren in den lokalen Gewerkschaften verankert sind und im Geheimen daran arbeiten, die britischen Wirtschaftsinteressen zu beeinträchtigen."
tfv_raj.9.d8:	"Ein antikoloniales Syndikat, das zum Massenwiderstand gegen die britische Industrie aufrief, orchestrierte die Plünderung eines Stahlwerks. Baumaterialien und Werkzeuge verschwanden über Nacht und wurden wahrscheinlich in klandestine Werkstätten umgeleitet, in denen behelfsmäßige Waffen für zukünftige Unruhen hergestellt wurden."
tfv_raj.9.d9:	"Die Demonstranten gingen auf die Straße, setzten Textilfabriken in Brand und plünderten Fertigwaren, bevor sie sich in der Stadt zerstreuten. Viele der Demonstranten schwenkten Banner der Kongresspartei und prangerten die britische Herrschaft an, während andere Schilder mit der Forderung nach einem Hindu Rashtra trugen."
tfv_raj.10.t:0	"Wichtige Infrastruktur sabotiert!"
tfv_raj.10.d1:	"Eine wichtige Eisenbahnbrücke wurde von nationalistischen Milizen gesprengt, wodurch wichtige Versorgungswege abgeschnitten und der Transport von Waren und Personal behindert wurde. Die Reparaturen sind zwar im Gange, aber die Verzögerungen werden sowohl den zivilen als auch den militärischen Transport beeinträchtigen und die Stabilität der Region schwächen."
tfv_raj.10.d2:	"Eisenbahnschienen, die zu einem Industriezentrum führen, wurden entwurzelt und in Brand gesetzt, so dass Versorgungskonvois zum Stillstand kamen. Die Angreifer, die Berichten zufolge mit der Azad Hind Bewegung in Verbindung stehen, hinterließen Botschaften, in denen sie ein Ende der britischen wirtschaftlichen Ausbeutung forderten."
tfv_raj.10.d3:	"Eine Gruppe von Saboteuren drang in ein Kraftwerk ein und zündete Sprengsätze, die das regionale Stromnetz lahmlegten und zu Stromausfällen führten. Die Angreifer kritzelten nationalistische Slogans an die Wände, bevor sie in der Nacht verschwanden und die Stadt ohne Strom und durch Angst gelähmt zurückließen."
tfv_raj.10.d4:	"Mitglieder der Khaksar-Bewegung, einer militanten muslimischen Gruppe, übernahmen die Kontrolle über eine Brücke und demontierten wichtige Bauteile, bevor die britischen Truppen eintrafen. Ihr Ziel war klar - die koloniale Kontrolle zu schwächen und ihre Fähigkeit zu demonstrieren, die Regierung nach Belieben zu stören."
tfv_raj.10.d5:	"Eine militante Zelle, die mit einer separatistischen Gruppierung verbündet war, zündete Sprengsätze unter einer wichtigen Eisenbahnbrücke, wodurch die Versorgungsleitungen unterbrochen und der Transport in der Region verzögert wurde. Geheimdienstinformationen zufolge sollte diese Tat eine Demonstration der Stärke gegenüber den Kolonialbehörden sein und eine weitere Eskalation der Unabhängigkeitsbewegung signalisieren."
tfv_raj.10.d6:	"Saboteure, die mit einem revolutionären Untergrundnetzwerk in Verbindung stehen, demontierten Eisenbahnlinien außerhalb eines wichtigen Industriezentrums und hinterließen Botschaften, in denen sie die britische Herrschaft verurteilten und volle Selbstverwaltung forderten. Die Behörden gehen davon aus, dass sie von außen unterstützt wurden, wahrscheinlich von nationalistischen Führern im Exil, die den Widerstand finanzieren."
tfv_raj.10.d7:	"Ein Flughafen musste geschlossen werden, nachdem Tausende von Spitzhacken auf der Start- und Landebahn verstreut entdeckt worden waren - ein koordinierter Sabotageakt, der vermutlich von antikolonialen Extremisten verübt wurde. Der Angriff hat den regionalen Flugbetrieb vorübergehend unterbrochen und die nationalistischen Widerstandsbewegungen weiter ermutigt."
tfv_raj.10.d8:	"Mitglieder der Khaksar-Bewegung, einer militanten muslimischen Gruppe, übernahmen die Kontrolle über eine Brücke und demontierten wichtige Bauteile, bevor die britischen Truppen eintrafen. Ihr Ziel war klar: die koloniale Kontrolle zu schwächen und ihre Fähigkeit zu demonstrieren, die Regierung nach Belieben zu stören."
tfv_raj.10.d9:	"Eine Reihe von koordinierten Brandanschlägen hat die britischen Tee- und Baumwollplantagen verwüstet. Die Täter, von denen vermutet wird, dass sie mit radikalen Agrarfraktionen in Verbindung stehen, behaupten, dass die Zerstörung notwendig sei, um die britische wirtschaftliche Kontrolle zu schwächen. Die Brände konnten zwar eingedämmt werden, doch die Schäden an den Ernten und der Infrastruktur sind erheblich."
tfv_raj.11.t:	"Chaos auf den Straßen!"
tfv_raj.11.d1:	"Eine Serie von Bombenanschlägen auf einem belebten Marktplatz hat Dutzende von Toten und viele weitere Verletzte gefordert, die Spannungen angeheizt und die örtlichen Behörden überfordert. Der Anschlag hat Panik ausgelöst und die Region weiter destabilisiert. Die Identität der Täter ist nach wie vor unbekannt, aber viele vermuten radikale Elemente sowohl aus der hinduistischen als auch der muslimischen nationalistischen Bewegung."
tfv_raj.11.d2:	"Die Demonstranten stürmten Regierungsgebäude, plünderten Akten und störten die Verwaltung. Viele schwenkten Flaggen des Indischen Nationalkongresses, während andere Symbole der Sikh-Autonomiebewegung zeigten. Die Zerstörung hat die Regierungsarbeit in der Stadt zum Erliegen gebracht, so dass die Behörden verzweifelt versuchen, die Kontrolle wiederzuerlangen."
tfv_raj.11.d3:	"Ein gewaltsamer Generalstreik hat einen ganzen Bezirk lahmgelegt und Produktion und Handel zum Erliegen gebracht, da die Arbeiter Autonomie fordern. Es wird gemunkelt, dass die Kommunistische Partei Indiens hinter der Eskalation steckt und den Streik als Plattform für die Forderung nach einer sozialistischen Revolution nutzt."
tfv_raj.11.d4:	"Eine nationalistische Gruppe setzte britische Verwaltungsbüros in Brand, löschte wichtige Unterlagen und legte die regionale Verwaltung lahm. Die Angreifer, bei denen es sich vermutlich um Anhänger von Subhas Chandra Bose handelte, hinterließen Flugblätter, in denen sie zum Massenaufstand aufriefen, bevor sie im Umland verschwanden."
tfv_raj.11.d5:	"Ein koordinierter Angriff einer nationalistischen paramilitärischen Gruppe hat eine Großstadt lahmgelegt, während in wichtigen Stadtteilen Bombenanschläge und Unruhen ausbrachen. Regierungsbüros wurden gestürmt, Fahnen für die Unabhängigkeit wurden hochgehalten und britische Sicherheitskräfte wurden in brutale Straßenschlachten gezwungen, um die Ordnung wiederherzustellen."
tfv_raj.11.d6:	"Ein extremistischer Flügel einer nationalistischen politischen Bewegung ging auf die Straße, überwältigte die Ordnungskräfte und setzte Märkte und Verwaltungsgebäude in Brand. Während die britischen Behörden die Rebellion schließlich niederschlugen, kursiert nun antikoloniale Propaganda in der Stadt, die den zukünftigen Widerstand ermutigt."
tfv_raj.11.d7:	"Eine Miliz der Unabhängigkeitsbefürworter zündete Sprengsätze in einem dicht besiedelten Regierungszentrum und löste damit eine Massenpanik aus, die auch Opfer unter der Zivilbevölkerung forderte. Der Anschlag hat die Region schockiert und Befürchtungen geweckt, dass radikalere Gruppen größere Aufstände vorbereiten könnten."
tfv_raj.11.d8:	"In mehreren Distrikten sind Bauernaufstände ausgebrochen, die durch den Unmut über hohe Steuern und die britische Landpolitik ausgelöst wurden. Die Bewegung wird von Basisorganisatoren angeführt, die lokale Bauern davon überzeugt haben, keine Steuern mehr zu zahlen und sich gegen Zwangsräumungen zu wehren. Berichten zufolge haben einige der Protestführer Verbindungen zu revolutionären Zellen im Untergrund."
tfv_raj.12.t:	"Ermordung eines lokalen Führers!"
tfv_raj.12.d1:	"Ein Bezirksbeamter wurde auf einer Reise durch das Land überfallen und ermordet. Der Anschlag, der vermutlich von radikalen Hindutva-Elementen verübt wurde, hat die Region weiter destabilisiert und die Oppositionsbewegungen ermutigt."
tfv_raj.12.d2:	"Ein religiöser Führer wurde am helllichten Tag erschossen und löste Unruhen und Vergeltungsmaßnahmen in der Stadt aus. Die Muslimische Liga und die Hindu Mahasabha beschuldigen sich gegenseitig und machen das Attentat zu einem Katalysator für weit verbreitete Unruhen."
tfv_raj.12.d3:	"Ein britischer Richter wurde tot aufgefunden, hingerichtet von unbekannten Angreifern in einer offenbar gezielten politischen Tötung. Seine Leiche wurde als Warnung in den Straßen aufgehängt. Die Behörden vermuten, dass es sich um Revolutionäre handelt, die mit der Fraktion des Vorwärtsblocks von Subhas Chandra Bose verbunden sind."
tfv_raj.12.d4:	"Eine aufstrebende nationalistische Persönlichkeit wurde ermordet, obwohl die Identität der Täter unbekannt bleibt - was zu Verschwörungstheorien und wachsender öffentlicher Unruhe führt. Der Indian National Congress ruft zur Ruhe auf, während militante Gruppen im Untergrund Rache schwören. Die Atmosphäre ist von Paranoia geprägt, und der Kreislauf der Gewalt scheint nicht zu enden."
tfv_raj.12.d5:	"Ein pro-britischer lokaler Verwalter wurde bei einem gezielten Attentat von Mitgliedern einer nationalistischen Gruppierung erschossen. Der Mord hat die Regierung erschüttert, da er ein Zeichen für die zunehmende Kühnheit der in der Region operierenden antikolonialen Milizen ist."
tfv_raj.12.d6:	"Ein Beamter, der einer separatistischen Bewegung angehört, wurde am helllichten Tag erschossen, wahrscheinlich von Rivalen, die seine Bewegung als Verrat am Unabhängigkeitskampf betrachten. Die Ermordung hat gewaltsame Straßenkämpfe zwischen konkurrierenden nationalistischen Gruppierungen ausgelöst, die sich gegenseitig die Schuld an den Unruhen geben."
tfv_raj.12.d7:	"Ein Richter, der für sein hartes Durchgreifen gegen nationalistische Aktivitäten bekannt ist, wurde ermordet, während er unter schwerer Bewachung unterwegs war. Der Hinterhalt war schnell, präzise und wurde mit militärischer Disziplin ausgeführt, was darauf hindeutet, dass die Widerstandsgruppen im Untergrund begonnen haben, ausgefeiltere Aufstandstaktiken anzuwenden."
food_stolen_tt:	"5k an Lebensmitteln gehen aus unseren Lagern verloren"
tfv_raj.13.t:	"Massenüberfälle auf Lebensmittelvorräte!"
tfv_raj.13.d1:	"Eine nationalistische Gruppe, die die britische Kontrolle über die landwirtschaftlichen Ressourcen stören will, hat ein Getreidelager überfallen und Tausende von Säcken mit Lebensmitteln beschlagnahmt, um sie unter ihren Anhängern zu verteilen. Die Behörden befürchten, dass dies zu weiteren Angriffen auf die Versorgungsketten ermutigen könnte."
tfv_raj.13.d2:	"Die Spannungen zwischen den Gemeinden explodierten, als religiöse Extremisten Lebensmittelvorräte rivalisierender Sekten plünderten und abfackelten. Ganze Dörfer sind nun vom Hungertod bedroht, da die Fraktionen in einem eskalierenden Kreislauf der Gewalt die Versorgungslinien der jeweils anderen angreifen."
tfv_raj.13.d3:	"Rebellen, die für die Unabhängigkeit eintreten, überfielen einen Lebensmittelkonvoi der Regierung, so dass die Lieferwagen in Flammen aufgingen und die Fahrer um ihr Leben flohen. Der Angriff war koordiniert, gut geplant und präzise ausgeführt worden, was Anlass zu Besorgnis über die wachsende Organisation der militanten Zellen gegen die Briten gibt."
tfv_raj.13.d4:	"Ein Konvoi mit Getreide, das für die Verteilung in einem mehrheitlich muslimischen Bezirk bestimmt war, wurde von nationalistischen Hindu-Gruppen abgefangen und geplündert. Die Angreifer beschuldigten die lokale muslimische Bevölkerung, antibritischen Radikalen Unterschlupf zu gewähren, und setzten mehrere verbleibende Getreidewagen in Brand. Lokale Beamte warnen, dass die Spannungen einen Siedepunkt erreichen und weitere Vergeltungsmaßnahmen unvermeidlich sind."
tfv_raj.13.d5:	"Ein großes Dorf, das mehrheitlich von Hindus bewohnt wird, berichtete von massenhaften Lebensmitteldiebstählen, nachdem eine bewaffnete Gruppe muslimischer Nationalisten Getreidespeicher und Lagerhäuser gestürmt und die Kontrolle über die lebenswichtigen Lebensmittelvorräte übernommen hatte. Mehrere Hindu-Bauern, die versuchten, Widerstand zu leisten, wurden verprügelt und ihre Häuser niedergebrannt. Die Muslimische Liga hat eine Erklärung abgegeben, in der sie eine Beteiligung bestreitet, aber Berichte deuten darauf hin, dass regionale Milizen die Dinge zunehmend selbst in die Hand nehmen."
tfv_raj.13.d6:	"Eine Sikh-Bauerngemeinde wurde von einer Koalition aus extremistischen Hindu- und Moslemgruppen überfallen, die die Sikhs beschuldigten, ihren jeweiligen Gemeinschaften Lebensmittel vorzuenthalten. Die Angreifer zerstörten Hunderte von Scheffeln Weizen und setzten Scheunen in Brand, bevor sie mit den örtlichen Sikh-Verteidigern zusammenstießen. Die Region ist nun in höchster Alarmbereitschaft, da sich die Befürchtung ausbreitet, dass weitere religiöse Gewalt ausbrechen könnte."
tfv_raj.13.d7:	"Religiöse Extremisten überfielen eine Viehfarm, die einem Sikh-Grundbesitzer gehörte, schlachteten das Vieh und setzten die Getreidelager in Brand. Sowohl muslimische als auch hinduistische Milizen beschuldigten die Sikhs, von der anhaltenden Knappheit zu profitieren, während Sikh-Führer den Angriff als Versuch verurteilten, ihr Volk von ihrem Land zu vertreiben. Da das Vertrauen zwischen den Gemeinschaften schwindet, scheinen weitere Gewaltakte unvermeidlich."
tfv_raj.13.d8:	"Tausende von Landwirten haben sich trotz der britischen Agrarpolitik geweigert, Getreide an Regierungsbeamte zu verkaufen, und fordern faire Preise und ein Ende der Zwangsquoten. Es wird vermutet, dass viele von nationalistischen Bewegungen beeinflusst werden, insbesondere von solchen, die für Eigenständigkeit und Agrarreformen eintreten. Die Kolonialbehörden befürchten, dass eine Ausweitung des Boykotts zu einer ernsten Lebensmittelknappheit führen könnte."
tfv_raj.13.d9:	"Dörfer in der ganzen Region haben begonnen, nicht zu kooperieren, weigern sich, auf den britischen Plantagen zu arbeiten und unterbrechen wichtige landwirtschaftliche Lieferketten. Die Demonstranten haben von den Briten eingesetzte Dorfbeamte abgesetzt und lokale Räte unter nationalistischer Führung wieder eingesetzt. Wenn diese Auflehnung nicht eingedämmt wird, könnte die ländliche Verwaltung völlig zusammenbrechen."
tfv_raj.14.t:	"Religiöse Spannungen lösen weitere Unruhen aus!"
tfv_raj.14.d1:	"Zwischen hinduistischen und muslimischen nationalistischen Gruppierungen ist es zu heftigen Zusammenstößen gekommen, bei denen sich beide Seiten gegenseitig des Verrats am Unabhängigkeitskampf beschuldigen. In den städtischen Zentren bilden sich rivalisierende Milizen, und britische Beamte befürchten, dass die konfessionelle Gewalt bald den antikolonialen Widerstand selbst überschatten könnte."
tfv_raj.14.d2:	"Ein bekannter religiöser Führer, der für ein separates Heimatland eintrat, wurde von mutmaßlichen Mitgliedern einer rivalisierenden nationalistischen Gruppe ermordet und löste damit weit verbreitete Gewalt aus. Vergeltungsangriffe haben bereits begonnen, und die regionalen Behörden haben Mühe, die wachsenden Feindseligkeiten einzudämmen."
tfv_raj.14.d3:	"Extremistische Elemente innerhalb einer nationalistischen Gruppierung haben einen Marsch durch eine Stadt angeführt und dabei gezielt religiöse Minderheiten angegriffen. Die Gewalt hat Tausende gezwungen, aus ihren Häusern zu fliehen und die ohnehin schon angespannte politische Landschaft weiter zu destabilisieren."
tfv_raj.14.d4:	"Die Gewalt ist zwischen hinduistischen und muslimischen Gemeinschaften ausgebrochen, und die Zusammenstöße haben sich auf mehrere Städte ausgeweitet. Die Muslimische Liga und die Rashtriya Swayamsevak Sangh haben sich gegenseitig beschuldigt, die Unruhen angezettelt zu haben, während die britischen Behörden versuchen, die Situation unter Kontrolle zu halten."
tfv_raj.14.d5:	"Sikh-Tempel wurden angegriffen, was zu Unmut und Rufen nach Vergeltung führte. Extremistische Elemente sowohl innerhalb der hinduistischen als auch der muslimischen Fraktionen betrachten die Neutralität der Sikhs als eine inakzeptable Haltung, was zu verstärkten Spannungen führt. Viele Sikhs sprechen nun offen von der Errichtung eines unabhängigen Khalistan."
tfv_raj.14.d6:	"Berichten zufolge wurden mehrheitlich muslimische Dörfer von hindunationalistischen Gruppen ins Visier genommen, was zu sektiererischer Gewalt führte. Die All-India Muslim League hat die Angriffe verurteilt, während die Führer der Hindu Mahasabha die britische Politik des Teilens und Herrschens für die wachsende Feindseligkeit verantwortlich machen."
tfv_raj.14.d7:	"Ein Hindu-Festumzug endete in einem Aufruhr, der zu Massenverhaftungen führte und die regionalen Spannungen verschärfte. Muslimische Aktivisten behaupten, die Veranstaltung sei eine absichtliche Provokation gewesen, während Hindu-Nationalisten argumentieren, es sei ihr Recht, ungestört zu feiern. Die Gewalt hat jeden Anschein von Einheit in der Region zunichte gemacht."
tfv_raj.14.d8:	"Religiöse Führer in den ländlichen Gebieten haben sich für die Umverteilung von Land eingesetzt und fordern die Vertreibung der britischen Großgrundbesitzer und die Rückgabe von Ackerland an indische Landwirte. Hindus, Moslems und Sikhs erheben Anspruch auf riesige Landstriche, was die konfessionellen Spannungen weiter anheizt. Britische Beamte warnen, dass diese Streitigkeiten zu einem bewaffneten Konflikt führen könnten."
tfv_raj.14.d9:	"Inspiriert von nationalistischen Aufrufen zur Selbstversorgung haben die ländlichen Gemeinden begonnen, Lebensmittel zu horten und die Versorgungswege zu den von den Briten kontrollierten Städten abzuschneiden. Händler, die weiterhin an die Kolonialbehörden verkaufen, sehen sich Einschüchterungen und Drohungen von Einheimischen ausgesetzt. Wenn man dieser Bewegung nicht Einhalt gebietet, könnte sie sich zu einem ausgewachsenen wirtschaftlichen Aufstand ausweiten."

















tfv_raj.21.t:0	"Die bengalische Hungersnot"
tfv_raj.21.desc:0	"In Bengalen hat es schon früher Hungersnöte gegeben, aber dieses Mal haben sich die Ereignisse so verschworen, dass die Lage noch viel schlimmer ist als sonst. Die umwerfend inkompetente Kolonialverwaltung hat sich als völlig unfähig - oder vielleicht sogar unwillig - erwiesen, angemessen auf einen Zyklon zu reagieren, der einen Großteil der Reisernte in Bengalen vernichtet hat. Angesichts des Zustroms von Flüchtlingen aus den Kriegsgebieten des Landes steigt die Nachfrage nach Lebensmitteln täglich, während das Angebot knapp wird. \nie Lebensmittelpreise sind dramatisch gestiegen, was dazu führt, dass die Menschen ihrer Arbeit fernbleiben, die nicht mehr genug einbringt, um ihre Familien zu ernähren. Auch die Rekrutierungszahlen für die Armee sind erheblich zurückgegangen, da sich immer mehr Menschen weigern, ihre Häuser zu verlassen, um für eine Regierung zu kämpfen, die nichts für sie tut."
tfv_raj.21.a:0	"Das ist eine Katastrophe!"
tfv_raj_focus_paratrooper_tt:0	"Die Fallschirmjäger des Battaglione Azad Hindoustan werden in Italien stationiert."
tfv_raj.201.t:0	"Das Battaglione Azad Hindoustan"
tfv_raj.201.desc:0	"Die aus Kriegsgefangenen rekrutierten Soldaten des Battaglione Azad Hindoustan haben geschworen, ihr Leben für die Freiheit Indiens zu geben. Ausgebildet in Sabotage und Infiltration, sind diese Elitesoldaten auch in der Lage, mit dem Fallschirm abzuspringen, um hinter den feindlichen Linien Verwüstung anzurichten."
tfv_raj.201.a:0	"Schlagt aus der Luft zu, Brüder!"
tfv_raj.210.t:0	"Sabotage?"
tfv_raj.210.desc:0	"Die örtlichen Arbeiter hatten gerade Mittagspause gemacht, als eine heftige Explosion eine unserer Fabriken erschütterte. Das Gebäude wurde erheblich beschädigt, und mehrere Arbeiter wurden durch umherfliegendes Glas verletzt. Glücklicherweise scheinen die Werkzeugmaschinen weitgehend unversehrt geblieben zu sein. Polizei und Armee haben eine Absperrung errichtet, während Ermittler in den Trümmern nach Hinweisen auf die Ursache der Explosion suchen. Es gibt Gerüchte, dass es sich um eine Widerstandszelle der Quit-India-Bewegung handelte, die ihren Protest in ihrem Kampf für Freiheit in Gewalt umwandelte."
tfv_raj.210.a:0	"Beunruhigend."
tfv_raj.211.t:0	"Sabotage!"
tfv_raj.211.desc:0	"Nur wenige Wochen nach der ersten Explosion wurde plötzlich eine zweite Fabrik zerstört, wiederum kurz nachdem die Arbeiter das Hauptgebäude zum Mittagessen verlassen hatten. Es besteht kaum ein Zweifel daran, dass dies das Werk einer organisierten Widerstandsgruppe ist, die eine gut geplante Sabotage- und Terrorkampagne durchführt. Die dreisten Anschläge am helllichten Tag zeigen, dass die Angreifer sehr selbstsicher zu sein scheinen. "
tfv_raj.211.a:0	"Wird sie niemand aufhalten?"
tfv_raj.212.t:0	"Der Feind im Inneren"
tfv_raj.212.desc:0	"Eine dritte Explosion hat eine Fabrik in einem unserer Bundesstaaten verwüstet. Diesmal haben die Angreifer offenbar das falsche Timing gewählt, denn die Bombe explodierte mitten in der Schicht. Dutzende von Arbeitern wurden getötet und Dutzende weitere werden noch vermisst. Die Ermittler gehen mehreren Spuren nach, und eine Reihe von Häusern wurde bereits durchsucht. Die Ergebnisse sind zutiefst beunruhigend und reichen von "Quit India"-Propaganda bis hin zu Werkzeugen, die zur Herstellung von rohem Sprengstoff verwendet werden könnten. \neiner der Festgenommenen scheint jedoch der Anführer zu sein, und sie haben sich bisher geweigert, zu reden."
tfv_raj.212.a:0	"Die Sache gerät außer Kontrolle."
tfv_raj_quit_india_unrest_tt:0	"Von den Anhängern der Bewegung wird erwartet, dass sie Veränderungen fordern."
tfv_raj.15.t:	"Rufe nach gewaltfreiem Widerstand nehmen zu"
tfv_raj.15.d1:	"Mahatma Gandhis Aufrufe zur friedlichen Nichtzusammenarbeit finden in der indischen Bevölkerung, insbesondere in den städtischen Zentren, weiterhin großen Anklang. Viele Aktivisten befürworten Boykotte, Proteste und Steuerverweigerung anstelle des bewaffneten Kampfes. Diese Bewegung schwächt zwar direkte aufständische Aktivitäten, untergräbt aber auch die Rekrutierung für militantere nationalistische Fraktionen."
tfv_raj.15.d2:	"Eine massive gewaltfreie Demonstration in einer Großstadt hat die lokale Verwaltung lahmgelegt. Zehntausende Demonstranten füllten die Straßen und weigerten sich, sich zu zerstreuen, bis ihren Forderungen nach mehr Selbstverwaltung nachgekommen wird. Britische Beamte haben von Gewaltanwendung abgesehen, da sie befürchten, dies könnte weitere Unruhen auslösen."
tfv_raj.15.d3:	"Die wachsende Unterstützung für den pazifistischen Nationalismus hat zu Spannungen innerhalb der Unabhängigkeitsbewegung geführt. Während viele einen friedlichen Übergang zur Selbstverwaltung fordern, argumentieren Hardliner-Fraktionen, dass bewaffneter Widerstand der einzige Weg nach vorne sei. Berichten zufolge beginnen einige militante Gruppen, gewaltfreie Aktivisten eher als Hindernisse denn als Verbündete zu betrachten."
tfv_raj.15.d4:	"Britische Beamte berichten von einem Rückgang gewalttätiger nationalistischer Aktivitäten in Regionen, in denen die pazifistische Bewegung an Einfluss gewonnen hat. Dies hat jedoch auch zu massiven Arbeitsniederlegungen, Steuerboykotten und einem allgemeinen Rückgang der wirtschaftlichen Produktivität geführt, was die Regierungsführung weiter belastet."
tfv_raj.15.d5:	"Religiöse Führer verschiedener Glaubensrichtungen haben sich den Aufrufen zum gewaltfreien Widerstand angeschlossen und stellen die Kolonialherrschaft eher als moralisches denn als politisches Problem dar. Dieser Wandel hat Unterstützung bei der ländlichen Bevölkerung gefunden, von der viele zuvor zögerten, sich an der Unabhängigkeitsbewegung zu beteiligen."
tfv_raj.15.d6:	"Jainistische Friedensaktivisten haben in den großen Städten umfangreiche religiöse Versammlungen abgehalten, die Unterstützung von gemäßigten Fraktionen sowohl innerhalb der muslimischen als auch der hinduistischen Gemeinschaft fanden – und alle Inder dazu ermutigten, ihre Differenzen beiseite zu legen und eine gemeinsame Basis zu finden, in der Hoffnung auf gegenseitigen Wohlstand und Frieden sowohl innerhalb als auch außerhalb der Grenzen des Raj."
tfv_raj.16.t:	"Züge durch Aufständische entgleist!"
tfv_raj.16.d1:	"Ein schwer beladener Truppentransportzug wurde in einem abgelegenen Bezirk entgleist, nachdem die Schienen durch über Nacht platzierte Sprengsätze aufgerissen worden waren. Zeugen berichten, dass bewaffnete Männer, die wahrscheinlich mit nationalistischen Milizen in Verbindung stehen, Überlebende angriffen, bevor sie im Dschungel verschwanden. Die britischen Behörden haben Mühe, die Bahnstrecken zu sichern, da diese koordinierten Angriffe immer häufiger werden."
tfv_raj.16.d2:	"Saboteure sprengten eine Brücke entlang einer wichtigen Eisenbahnstrecke in die Luft, wodurch ein voll beladener Güterzug in den darunterliegenden Fluss stürzte. Die Angreifer, mutmaßliche Mitglieder einer Untergrund-Widerstandsbewegung, hinterließen nationalistische Parolen, die entlang der verbliebenen Gleise gekritzelt waren. Bergungsarbeiten sind im Gange, doch die Behebung der Störung wird Wochen dauern."
tfv_raj.16.d3:	"Bewaffnete Aufständische überfielen einen britischen Panzerzug, der Vorräte und Munition transportierte, und zwangen ihn unter schwerem Beschuss zum Anhalten, bevor sie Sprengsätze entlang der Gleise anbrachten. Als der Zug in Flammen aufging, verschwanden die Angreifer in der Nacht. Britische Streitkräfte verstärken nun die Patrouillen entlang gefährdeter Abschnitte des Eisenbahnnetzes."
tfv_raj.16.d4:	"Ein Abschnitt der Eisenbahnstrecke in Bengalen wurde durch versteckte Minen zerstört, wodurch ein staatlicher Postzug in den Dschungel stürzte. Die Behörden gehen davon aus, dass dieser Angriff von Radikalen geplant wurde, die die Kolonialverwaltung stören wollten. Das Wrack hat den Bahnverkehr in der Region lahmgelegt, und lokale Beamte befürchten weitere Angriffe."
tfv_raj.16.d5:	"Ein Bahnhof in Punjab wurde überraschend von nationalistischen Paramilitärs angegriffen, die das Gelände stürmten, den Bahnwächtern die Waffen abnahmen und Versorgungslager sowie Lokomotiven in Brand setzten. Britische Verstärkung traf zu spät ein und fand nur noch schwelende Trümmer und unbrauchbar verbogene Gleise vor."
tfv_raj.16.d6:	"Eine Reihe koordinierter Bombenanschläge auf wichtige Versorgungsstrecken hat ganze Bezirke ohne regulären Schienenverkehr zurückgelassen. Berichten zufolge wurden die Angriffe von einer hochorganisierten Untergrund-Widerstandsbewegung verübt, die darauf abzielt, die britischen Versorgungsbemühungen lahmzulegen und die lokalen Behörden in die Defensive zu drängen."
tfv_raj.16.d7:	"Die Proteste haben sich verschärft, da die Eisenbahngewerkschaften sich weigern, britisches Militärpersonal oder Kolonialbeamte zu befördern, was ganze Teile der Eisenbahnindustrie zum Erliegen gebracht hat. Obwohl sich der Streik noch nicht landesweit ausgebreitet hat, sind seine Auswirkungen in wichtigen Provinzen zu spüren, was die britische Verwaltung in eine schwierige Lage bringt."
tfv_raj.16.d8:	"Gruppen von Demonstranten haben Bahnhöfe im gesamten Raj überflutet und britische Truppen und Beamte daran gehindert, in Züge einzusteigen. Diese Proteste, obwohl gewaltfrei, haben den gesamten Fahrplan durcheinandergebracht und Regierungsmitarbeiter in wichtigen Städten gestrandet. Das Eingreifen der Polizei hat die Unruhen nur weiter angeheizt."
tfv_raj.16.d9:	"Aktivisten und Studenten, die mit nationalistischen Bewegungen verbunden sind, haben Eisenbahnschienen entfernt und Signalanlagen beschädigt, wodurch britische Bahnbetreiber aus Angst vor Unfällen den Betrieb einstellen mussten. Auch wenn die Sabotage nicht offen zerstörerisch ist, hat die Störung die militärischen und kommerziellen Versorgungslinien durcheinandergebracht."
