AI_MESSAGE_CAT1_MES3:0	"Lerne2spielen, $OTHER_ADJ$ Noob."
AI_MESSAGE_CAT1_MES4:0	"Besitzt $OTHER$ so sehr, dass er einem fast leid tut."
AI_MESSAGE_CAT1_MES5:0	"Vielleicht ist dieses Spiel zu hardcore für dich, $OTHER$. Du solltest mal ein dreckiges Casual Game wie Europa Universalis ausprobieren."
AI_MESSAGE_CAT1_MES6:0	"Ich wette, $OTHER$ hat nicht mal 2 Stunden damit verbracht, sein OOB zu konfigurieren. Scrub!"
AI_MESSAGE_CAT1_MES7:0	"Oh, schau dir all das $OTHER_ADJ$ Land an, das ich jetzt habe. Ich schätze, sie haben es nicht gebraucht!"
AI_MESSAGE_CAT1_MES8:0	"Hey $OTHER$, vielleicht solltest du das nächste Mal versuchen, dich zu wehren? Denn wenn du dich gewehrt hast, dann hat man das nicht gesehen!"
AI_MESSAGE_CAT1_MES9:0	"Warum weint $OTHER$? Weil sie gerade getunkt wurden!"
AI_MESSAGE_CAT1_MES10:0	"Fühlt sich sicher gut an, meinen Lebensraum zu erweitern, nicht wahr, $OTHER$?"
AI_MESSAGE_CAT2_MES1:0	"Ich werde dir die Scheiße aus dem Leib prügeln, $OTHER$!"
AI_MESSAGE_CAT2_MES2:0	"Bald wird jeder in $OTHER$ $US_ADJ$ sprechen."
AI_MESSAGE_CAT2_MES3:0	"Seht euch diesen $OTHER_ADJ$-Mistkerl an, der versucht, meine überlegenen $US_ADJ$-Truppen zu schlagen. Es wäre lustig, wenn es nicht so traurig wäre!"
AI_MESSAGE_CAT2_MES4:0	"Du nennst das einen Krieg, $OTHER$? Ich nenne es einen Schwächling."
AI_MESSAGE_CAT2_MES5:0	"Sorgt dafür, dass die $OTHER_ADJ$-Fabriken schön poliert sind, ich werde sie bald benutzen!"
AI_MESSAGE_CAT2_MES7:0	"Hey $OTHER$, vielleicht würde es dir nicht so schlecht gehen, wenn du aufhören würdest, wegzulaufen und tatsächlich versuchen würdest zu kämpfen?"
AI_MESSAGE_CAT2_MES8:0	"LOL, schau dir $COUNTRY$ an, wie sie versuchen, gegen mich zu kämpfen! Als hätte man einem komatösen Frettchen das Kommando über eine Armee gegeben!"
AI_MESSAGE_CAT2_MES9:0	"Die Aussicht in $COUNTRY$ ist um diese Jahreszeit wirklich schön. Meine Armeen genießen es wirklich!"
AI_MESSAGE_CAT2_MES10:0	"Gib endlich auf, $COUNTRY$! Du verschwendest hier wirklich nur meine Zeit."
AI_MESSAGE_CAT3_MES1:1	"$OTHER|U$ ist ein Hacker! Keine Chance, dass sie mich legal schlagen!"
AI_MESSAGE_CAT3_MES2:0	"Dieses Spiel ist so unausgewogen! $OTHER_ADJ$ Space Marines sind unmöglich zu schlagen, während $US_ADJ$ Truppen nur nasses Papier sind."
AI_MESSAGE_CAT3_MES3:0	"Als ob ich nicht ohnehin Besseres zu tun hätte, als dieses blöde Spiel zu spielen."
AI_MESSAGE_CAT3_MES4:0	"Ich hätte nicht gegen $OTHER$ verloren, wenn Paradox es nicht explizit so programmiert hätte, dass meine Verbündeten dümmer als zwei Tonnen Granit sind, während der Feind buchstäblich über Präkognition verfügt!"
AI_MESSAGE_CAT3_MES5:0	"ffaSJLgapigjaslgmag s asv lajvlvSCREW YOU $OTHER$ I AM NEVER PLAYING WITH YOU AGAIN!!!1"
AI_MESSAGE_CAT3_MES6:0	"gg $OTHER$ Nächstes Mal könnt ihr vielleicht versuchen, einen fairen Kampf daraus zu machen?"
AI_MESSAGE_CAT3_MES7:0	"Wow, diese eine Spielmechanik hat mich komplett verarscht. Kein Wunder, dass ich gegen $OTHER$ verloren habe."
AI_MESSAGE_CAT3_MES8:0	"WOW! Hätten sie $OTHER$ im letzten Patch nicht VOLLSTÄNDIG UNBALANCIERT, wäre es vielleicht sogar ein fairer Kampf geworden!"
AI_MESSAGE_CAT3_MES9:0	"Das ist der Grund, warum Hearts of Iron 3 ein besseres Spiel war, in HOI3 hätte mich $OTHER$ niemals auf so eine spielerische Art und Weise besiegen können:"
