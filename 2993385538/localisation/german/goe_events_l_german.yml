l_german:
AFG_industrial_events.10.t:		"[FROM.GetNameDefCap] bietet Ölkonzessionen an"
AFG_industrial_events.10.desc:		"Die Regierung von [FROM.GetNameDef] hat ein Joint Venture vorgeschlagen, bei dem wir sie bei der Erschließung kürzlich entdeckter Ölfelder unterstützen würden und im Gegenzug langfristige Konzessionen für das geförderte Öl erhalten. Obwohl der Vorschlag aufrichtig erscheint, können wir nicht garantieren, dass wir den Zugang zum Öl behalten, sollte sich die Laune der Regierung von [FROM.GetAdjective] ändern."
AFG_industrial_events.10.a:		"Dies liegt in unserem strategischen Interesse.  "
AFG_industrial_events.10.b:		"Wir haben kein Bedürfnis, in [FROM.GetAdjective] interne Angelegenheiten verwickelt zu werden."
AFG_industrial_events.11.t:		"[FROM.GetNameDefCap] stimmt dem Öl-Deal zu"
AFG_industrial_events.11.desc:		"Die [FROM.GetAdjective] Regierung hat sich bereit erklärt, in die Erschließung unserer Ölressourcen zu investieren und im Gegenzug einen langfristigen Anteil daran zu erhalten, sobald die Produktion beginnt."
AFG_industrial_events.11.a:		"Dies soll ein großer Schritt in Richtung Industrialisierung sein.  "
AFG_industrial_events.12.t:		"[FROM.GetNameDefCap] lehnt den Öl-Deal ab"
AFG_industrial_events.12.desc:		"Die engstirnige [FROM.GetAdjective] Regierung hat unseren Vorschlag zur gemeinsamen Erschließung unserer Ölvorkommen abgelehnt."
AFG_industrial_events.12.a:		"Wir werden einen anderen Partner für das Projekt finden. "
AFG_industrial_events.13.t:		"[FROM.GetNameDefCap] Verstaatlicht die Ölindustrie"
AFG_industrial_events.13.desc:		"Die [FROM.GetAdjective] Regierung hat ihre Ölindustrie verstaatlicht, obwohl wir viel in sie investiert haben. Die Verstaatlichung hat zu einem sofortigen Stopp der langfristigen Ölkonzession geführt, die wir vereinbart hatten. Die Region hält nun den Atem an und wartet auf unsere Antwort."
AFG_industrial_events.13.a:		"Wir haben ein Glücksspiel gemacht und verloren. "
AFG_industrial_events.13.b:		"Diese Ressourcen werden wir uns mit Gewalt zurückholen."
AFG_industrial_events.14.t:		"[FROM.GetName] erklärt dem [ROOT.GetName] den Krieg"
AFG_industrial_events.14.desc:		"Das arrogante [FROM.GetAdjective]-Regime hat seine Absicht erklärt, unsere rechtschaffene Regierung zu stürzen, weil sie unsere natürlichen Ressourcen zum Wohle unseres eigenen Volkes genutzt hat. Es ist noch nicht klar, wie sie ihre Drohungen in die Tat umsetzen wollen, aber wir sollten mit den Vorbereitungen für einen militärischen Einmarsch in unser Gebiet beginnen."
AFG_industrial_events.14.a:		"Wir lassen uns nicht zur Unterwerfung zwingen.  "
AFG_industrial_events.15.t:		"[FROM.GetNameDefCap] bietet wenig Widerstand gegen Verstaatlichung"
AFG_industrial_events.15.desc:		"Die Regierung von [FROM.GetNameDef] hat eine harte Rhetorik bezüglich unserer Verstaatlichung der Ölindustrie geäußert. Es gibt jedoch keine Anzeichen dafür, dass sie die Angelegenheit weiter vorantreiben will."
AFG_industrial_events.15.a:		"Die Angelegenheit ist abgeschlossen.  "
AFG_industrial_events.16.t:		"[FROM.GetAdjective] Ölkonzession suspendiert"
AFG_industrial_events.16.desc:		"Aufgrund der jüngsten Feindseligkeiten zwischen unseren Nationen hat die Regierung von [FROM.GetNameDef] unsere Ölkonzessionen in diesem Land ausgesetzt. Selbst wenn die Feindseligkeiten enden, werden sie wahrscheinlich die Kontrolle über ihre eigenen Ressourcen behalten wollen."
AFG_industrial_events.16.a:		"Das war zu erwarten. "
AFG_industrial_events.20.t:		"[FROM.GetName] Investitionschance"
AFG_industrial_events.20.desc:		"Die Regierung von [FROM.GetAdjective] verfolgt eine Politik zur Steigerung ausländischer Investitionen im Land und hat sich in unserem eigenen Interesse gemeldet. Auch wenn wir wirtschaftlich nicht viel von diesem Abkommen profitieren können, wäre es eine hervorragende Gelegenheit, die [FROM.GetAdjective] Regierung in unserem Sinne zu beeinflussen."
AFG_industrial_events.20.a:		"Es ist wichtig, unseren Einfluss in der Region zu stärken."
AFG_industrial_events.20.b:		"[FROM.GetNonIdeologyName] spielt in unseren langfristigen Plänen keine Rolle."
AFG_industrial_events.21.t:		"[FROM.GetAdjective] Regierung kündigt Investition an"
AFG_industrial_events.21.desc:		"Unsere Freunde in [FROM.GetNameDef] haben angekündigt, dass sie erhebliche Summen in die Industrialisierung unseres Landes investieren wollen. Während dies für uns wirtschaftlich von großem Nutzen ist, müssen wir wachsam bleiben, dass die [FROM.GetAdjective]'s dies nicht dazu nutzen, unsere Politik zu stark zu beeinflussen."
AFG_industrial_events.21.a:		"Ausgezeichnete Nachrichten!"
AFG_industrial_events.22.t:		"$bftb_greece.194.t$"
AFG_industrial_events.22.desc:		"$bftb_greece.194.desc$"
AFG_industrial_events.22.a:		"$bftb_greece.194.a$"
AFG_industrial_events.30.t:		"[FROM.GetNameDefCap] Ändert Flusslauf des Helmand"
AFG_industrial_events.30.desc:		"In den letzten Jahren hat die [FROM.GetAdjective] Regierung eine Reihe von Staudamm- und Bewässerungsprojekten entlang ihrer Flüsse durchgeführt. Dies hat zu einer Reihe von Veränderungen am Helmand-Fluss geführt, der in unsere östlichen Provinzen fließt. Der Wasserstand des Flusses, der über die Grenze fließt, nimmt von Jahr zu Jahr spürbar ab und unsere Bevölkerung ist besorgt, dass sie den Fluss nicht mehr nutzen kann, wenn das so weitergeht. Wir müssen entscheiden, ob wir das Problem einfach intern regeln oder die Angelegenheit mit den [FROM.GetAdjective]s besprechen."
AFG_industrial_events.30.a:		"Wir werden Verhandlungen mit [AFG.GetNonIdeologyName] über die Entwicklung des Flusses fordern."
AFG_industrial_events.30.b:		"Wir können im Moment keine diplomatische Krise riskieren."
AFG_industrial_events.31.t:		"[FROM.GetAdjective] Regierung fordert Flussverhandlungen"
AFG_industrial_events.31.desc:		"Die [FROM.GetNameDefCap] Regierung hat Verhandlungen über unsere jüngsten Veränderungen am Helmand-Fluss gefordert. Sie behauptet, dass unsere Dämme und Bewässerungssysteme die Strömung des Flusses über die Grenze auf ein gefährliches Niveau reduzieren. Einige in unserem Kabinett haben vorgeschlagen, ein Abkommen zu schließen, um den Wasserfluss über die Grenze zu regulieren. Das würde wahrscheinlich bedeuten, dass wir die Vorteile unserer derzeitigen Veränderungen entlang des Flusses einschränken müssten, aber es würde auch die Auswirkungen auf die [FROM.GetAdjective] Menschen jenseits der Grenze mindern."
AFG_industrial_events.31.a:		"Vielleicht können wir einen Wasservertrag abschließen?"
AFG_industrial_events.31.b:		"Das Wasser gehört uns und wir können damit machen, was wir wollen."
AFG_industrial_events_31_tt:		"§Diese Vorgehensweise könnte zu einem Krieg mit [FROM.GetNameDefCap] führen!§!"
AFG_industrial_events.32.t:		"[FROM.GetAdjective] Regierung schlägt Wasservertrag vor"
AFG_industrial_events.32.desc:		"[FROM.GetNameDefCap] Regierung hat einen Wasservertrag zwischen unseren Nationen vorgeschlagen, um die Wassermenge zu regeln, die sie für Bewässerungsprojekte nutzen können, während uns ein Mindestfluss an Wasser über die Grenze garantiert wird. Obwohl die Vorschläge vernünftig erscheinen, ist es wahrscheinlich, dass wir dafür einen gewissen Verlust an Wasserfluss im Vergleich zu dem, was wir in der Vergangenheit genossen haben, in Kauf nehmen müssten."
AFG_industrial_events.32.a:		"Das erscheint vernünftig."
AFG_industrial_events.32.b:		"Nur eine vollständige Rückgängigmachung der Änderungen wird uns zufrieden stellen."
AFG_industrial_events.33.t:		"[FROM.GetNameDefCap] Weigert sich, weiter zu verhandeln"
AFG_industrial_events.33.desc:		"Die Regierung von [FROM.GetNameDefCap] hat weitere Verhandlungen über die Entwicklung des Helmand-Flusses mit der Begründung abgelehnt, dass sie mit dem Wasser, das durch ihr Gebiet fließt, machen kann, was sie will. Ein Nachgeben in diesem Punkt könnte sie letztlich dazu ermutigen, den Wasserfluss in Zukunft vollständig zu unterbrechen. Jede weitere Eskalation würde jedoch voraussetzen, dass wir auf einen bewaffneten Konflikt zurückgreifen."
AFG_industrial_events.33.a:		"Wir haben nicht die Mittel, um eine militärische Eskalation einzuleiten."
AFG_industrial_events.33.b:		"Dann werden wir die Situation mit Gewalt bereinigen."
AFG_industrial_events.34.t:		"[FROM.GetNameDefCap] stimmt einem Wasservertrag zu"
AFG_industrial_events.34.desc:		"Die Regierung von [FROM.GetAdjective] hat einem Wasservertrag zwischen unseren Nationen zugestimmt, unter der Bedingung, dass sie ihnen einen akzeptablen Mindestfluss an Wasser über die Grenze garantiert. Dies wird uns zwar dazu zwingen, unsere Dämme nicht voll auszunutzen, wie wir es bisher getan haben, aber es wird zumindest jede Möglichkeit eines Konflikts um den Helmand-Fluss in naher Zukunft vermeiden."
AFG_industrial_events.34.a:		"Eine Krise ist abgewendet."
AFG_industrial_events.35.t:		"[FROM.GetNameDefCap] lehnt Wasservertrag ab"
AFG_industrial_events.35.desc:		"[FROM.GetNameDefCap] hat sich geweigert, einen Vertrag zu akzeptieren und fordert stattdessen die vollständige Rückgängigmachung aller Projekte entlang des Helmand-Flusses, die dessen Durchfluss für sie verringern. Es scheint, dass sie bereit sind, ihren Willen mit Gewalt durchzusetzen, sollten wir uns weigern."
AFG_industrial_events.35.a:		"Wir dürfen nicht zulassen, dass diese Situation weiter eskaliert."
AFG_industrial_events.35.b:		"Wenn sie nicht vernünftig sind, hat es keinen Sinn, weiter zu verhandeln."
AFG_industrial_events.36.t:		"[FROM.GetAdjective] erklärt sich bereit, Änderungen in Helmand rückgängig zu machen"
AFG_industrial_events.36.desc:		"Die [FROM.GetAdjective]-Regierung hat zugestimmt, viele der Veränderungen, die sie am Helmand-Fluss vorgenommen hat, rückgängig zu machen. Das hat zweifellos großen Unmut über uns ausgelöst, aber wir konnten eine bewaffnete Konfrontation vorerst vermeiden."
AFG_industrial_events.36.a:		"Es wird Zeit."
AFG_industrial_events.37.t:		"[FROM.GetAdjective] Streitkräfte bereiten sich auf Invasion vor"
AFG_industrial_events.37.desc:		"[FROM.GetAdjective] bewaffnete Kräfte entlang unserer Grenze bereiten sich Berichten zufolge auf eine Invasion des Helmand River Valley vor, nachdem die Verhandlungen zwischen unseren Regierungen gescheitert sind. Es scheint, als hätten wir keine andere Wahl, als auch unsere eigenen Streitkräfte zu mobilisieren."
AFG_industrial_events.37.a:		"Was für eine absurde Eskalation."
AFG_industrial_events.38.t:		"[FROM.GetAdjective] Regierung schweigt zu Helmand-Änderungen"
AFG_industrial_events.38.desc:		"Trotz wochenlanger hitziger Verhandlungen zwischen unseren jeweiligen Regierungen scheint es, als hätten die [FROM.GetAdjective]s es vorerst aufgegeben, unsere Staudamm- und Bewässerungsprojekte zu stören. Es bleibt abzuwarten, ob sie das Thema in Zukunft wieder aufgreifen werden."
AFG_industrial_events.38.a:		"Für den Moment scheinen die Veränderungen sicher zu sein."
AFG_industrial_events.40.t:		"Mehr Universitätsabsolventen werden radikalisiert"
AFG_industrial_events.40.desc:		"Unsere Bemühungen um eine Ausweitung des Hochschulwesens haben zu einer Gegenreaktion der neuen Hochschulabsolventen geführt, die nicht in der Lage sind, eine Beschäftigung zu finden, bei der ihre Fähigkeiten genutzt werden. Dies hat zu einer Enttäuschung unter den Absolventen geführt, die sich nun radikaler Politik zuwenden, um ihrer Frustration Luft zu machen."
AFG_industrial_events.40.a:		"Eine beunruhigende Entwicklung."
AFG_industrial_events.50.t:		"Der paschtunische Widerstand fasst Fuß"
AFG_industrial_events.50.desc:		"Durch die Nutzung der grenzüberschreitenden Verbindungen unserer paschtunischen Bevölkerung ist es uns gelungen, ihre Verwandten jenseits der Grenze zu regierungsfeindlichen Protesten und Forderungen nach einer Vereinigung unter unserer Herrschaft zu bewegen. "
AFG_industrial_events.50.a:		"Sie werden bald befreit sein!"
AFG_industrial_events.51.t:		"Paschtunischer Widerstand entlang der [AFG.GetAdjective]-Grenze"
AFG_industrial_events.51.desc:		"Aufrührer aus [FROM.GetNonIdeologyName] scheinen die Grenze zu überqueren, um Unruhe unter der paschtunischen Bevölkerung zu stiften. Es gibt Gespräche über die Vereinigung der Paschtunen unter der Herrschaft von [FROM.GetAdjective] statt unter unserer eigenen."
AFG_industrial_events.51.a:		"Eine beunruhigende Situation."
AFG_industrial_events.52.t:		"[FROM.GetAdjective] Regierung schlägt Gebietsabtretung vor"
AFG_industrial_events.52.desc:		"Aufgrund der anhaltenden Spannungen in einigen unserer überwiegend paschtunischen Gebiete hat die [FROM.GetAdjective] Regierung die Dreistigkeit besessen, uns anzubieten, die Kontrolle über die widerspenstigen Regionen zu übernehmen. Es besteht der Verdacht, dass sie die ganze Zeit hinter den jüngsten Unruhen steckte."
AFG_industrial_events.52.a:		"Das Gebiet ist ein größeres Problem als es wert ist."
AFG_industrial_events.52.b:		"Dies ist unser souveränes Territorium, ungeachtet ihrer Ansprüche."
AFG_industrial_events.53.t:		"[FROM.GetAdjective] Regierung überträgt Territorium"
AFG_industrial_events.53.desc:		"Die Regierung von [FROM.GetNameDef] ist mit dringenderen Problemen beschäftigt und hat sich bereit erklärt, einen Teil ihres Territoriums abzutreten, in dem die paschtunischen Unruhen außer Kontrolle geraten sind. Allerdings haben wir die Beziehungen zu unseren [FROM.GetAdjective] Nachbarn durch unsere Einmischung in ihre inneren Angelegenheiten möglicherweise irreparabel beschädigt."
AFG_industrial_events.53.a:		"Großartig"
AFG_industrial_events.54.t:		"[FROM.GetNameDefCap] lehnt Territoriumstransfer ab"
AFG_industrial_events.54.desc:		"Trotz unserer vorsichtigen Manipulation der Situation entlang der Grenze zu [FROM.GetNameDef] hat sich deren Regierung geweigert, uns die Kontrolle über irgendein paschtunisches Gebiet zu überlassen. Es scheint, dass unser einziger Weg, das Gebiet zu erobern, darin besteht, die Situation mit der Drohung einer militärischen Intervention zu eskalieren."
AFG_industrial_events.54.a:		"Wir haben kein Interesse an einer Eskalation dieser Situation."
AFG_industrial_events.54.b:		"Wir haben keine Angst, das Gebiet mit Gewalt zu befreien."
AFG_industrial_events.55.t:		"[FROM.GetNameDefCap] droht mit Krieg"
AFG_industrial_events.55.desc:		"Die [FROM.GetAdjective] Regierung hat eine Erklärung abgegeben, in der sie unsere Besetzung von angeblich paschtunischem Land verurteilt und angedeutet hat, dass sie bereit ist, das Gebiet notfalls mit Gewalt zu befreien. Es kann natürlich sein, dass sie blufft, aber wir haben keine Möglichkeit, ihre wahren Absichten zu diesem Zeitpunkt zu erkennen."
AFG_industrial_events.55.a:		"Wir haben nur wenige Möglichkeiten, sie zu beschwichtigen."
AFG_industrial_events.55.b:		"Wir sind bereit, unser Territorium um jeden Preis zu verteidigen."
AFG_industrial_events.56.t:		"[FROM.GetNameDefCap] lehnt Ultimatum ab"
AFG_industrial_events.56.desc:		"Es überrascht nicht, dass die sturen Narren in [FROM.Capital.GetCapitalVictoryPointName] sich geweigert haben, uns unser rechtmäßiges Territorium an der Grenze zu überlassen. Daher müssen wir entweder unsere Drohung einer militärischen Invasion wahr machen oder riskieren, auf der internationalen Bühne unser Gesicht zu verlieren."
AFG_industrial_events.56.a:		"Es ist an der Zeit, dass wir unsere Drohungen wahr machen."
AFG_industrial_events.56.b:		"Wir müssen uns zurückziehen."
AFG_industrial_events.57.t:		"[FROM.GetAdjective] Regierung gibt Anspruch auf"
AFG_industrial_events.57.desc:		"Die [FROM.GetAdjective] Regierung ist endlich zur Vernunft gekommen und hat beschlossen, die Situation entlang der Grenze zu deeskalieren. Sie hat ihre Ansprüche auf das unruhige Grenzgebiet zurückgenommen, in dem die Spannungen in letzter Zeit eskaliert sind."
AFG_industrial_events.57.a:		"Ein Sieg für internationales Recht und Ordnung."
AFG_industrial_events.58.t:		"[FROM.GetNameDefCap] bietet Friedensbedingungen an"
AFG_industrial_events.58.desc:		"[FROM.GetAdjective] Diplomaten haben sich mit einem Friedensangebot an uns gewandt, unter der Bedingung, dass wir ihre Kontrolle über das umstrittene paschtunische Gebiet entlang der Grenze anerkennen. Da sie das Gebiet derzeit besetzen, haben wir keine Garantie, dass wir sie in absehbarer Zeit verdrängen können. Dies würde jedoch einen Präzedenzfall schaffen, dass [FROM.GetNameDef] unsere Grenzen Stück für Stück abtragen kann."
AFG_industrial_events.58.a:		"Lassen Sie uns diesen Konflikt beenden."
AFG_industrial_events.58.b:		"Wir werden sie aus unserem Land vertreiben."
AFG_industrial_events.59.t:		"[FROM.GetNameDefCap] lehnt die Friedensbedingungen ab"
AFG_industrial_events.59.desc:		"Die Regierung von [FROM.GetNameDef] hat unser jüngstes Friedensangebot abgelehnt. Sie glauben offensichtlich, dass sie immer noch in der Lage sind, uns von unserem rechtmäßigen Territorium zu vertreiben."
AFG_industrial_events.59.a:		"Dann werden wir unser Territorium weiterhin verteidigen."
AFG_political_events.01.t:		"Vorschlag zur zentralasiatischen Einigung"
AFG_political_events.01.desc:		"Vertreter von [FROM.GetNameDef] sind mit einem kühnen Vorschlag zur Neuordnung Zentralasiens an uns herangetreten. Ihr Vorschlag sieht vor, dass wir ihnen die Kontrolle über eine Reihe von Staaten entlang der Grenze zu [FROM.GetAdjective] übergeben und eine neue sozialistische Föderation unter der Verwaltung von [FROM.Capital.GetCapitalVictoryPointName] gründen. Damit könnten wir den Aufbau eines mächtigen Pufferstaates in der Region unterstützen, der einen Teil unserer Verteidigungslasten in der Region übernehmen kann und unser Militär für Einsätze in anderen Regionen freimacht."
AFG_political_events.01.a:		"Ein verlockender Vorschlag."
AFG_political_events.01.b:		"Wir haben alternative Pläne für die Region."
AFG_political_events.02.t:		"[FROM.GetName] nimmt den Vorschlag an"
AFG_political_events.02.desc:		"[FROM.GetNameDefCap] hat unseren Vorschlag akzeptiert, Zentralasien als eine einzige politische Einheit unter unserer Kontrolle zu vereinen. Es scheint, dass nach Jahrzehnten der Instabilität eine neue Ära für unser Volk angebrochen ist."
AFG_political_events.02.a:		"Ausgezeichnet!"
AFG_political_events.03.t:		"[FROM.GetName] lehnt den Vorschlag ab"
AFG_political_events.03.desc:		"[FROM.GetNameDefCap] hat unseren Vorschlag zur Vereinigung Zentralasiens zu einer einzigen politischen Einheit unter unserer Kontrolle abgelehnt. Obwohl dies ein massiver Rückschlag ist, ist der Traum noch nicht tot. Wir müssen nur die Zeit abwarten und auf die richtige Gelegenheit warten."
AFG_political_events.03.a:		"Sie können sich uns nicht ewig in den Weg stellen."
AFG_political_events.10.t:		"[FROM.GetNameDefCap] schlägt Konföderation vor"
AFG_political_events.10.desc:		"Die Regierung von [FROM.GetNonIdeologyName] hat einen faszinierenden Vorschlag gemacht, um unsere beiden Nationen zu stärken, indem wir eine Konföderation bilden. Dies würde bedeuten, dass wir unsere Grenzen in einem einzigen Wirtschaftsmarkt füreinander öffnen und eine gemeinsame Außenpolitik auf der Weltbühne betreiben. Allerdings würde dies letztlich unsere eigene Handlungsfreiheit einschränken."
AFG_political_events.10.a:		"Wir unterstützen diese Initiative."
AFG_political_events.10.b:		"Wir haben bereits einen Oberherrn abgeschüttelt und brauchen keinen weiteren."
AFG_political_events.11.t:		"[FROM.GetName] stimmt der Konföderation zu"
AFG_political_events.11.desc:		"Die [FROM.GetAdjective] Regierung hat unserem Konföderationsvorschlag zugestimmt. Wir können nun damit beginnen, unsere beiden politischen und wirtschaftlichen Systeme in ein einziges zu integrieren. Dies sollte hoffentlich in naher Zukunft als Abschreckung für unsere regionalen Widersacher dienen."
AFG_political_events.11.a:		"Ausgezeichnet!"
AFG_political_events.12.t:		"[FROM.GetName] lehnt Konföderation ab"
AFG_political_events.12.desc:		"Die Regierung von [FROM.GetAdjective] hat unseren Vorschlag, eine Konföderation aus unseren beiden Nationen zu bilden, abgelehnt. Dies ist ein massiver außenpolitischer Rückschlag für uns und hat die Frage aufgeworfen, wie unsere langfristigen Beziehungen zu [FROM.GetNameDef] nun aussehen werden."
AFG_political_events.12.a:		"Eine verpasste Gelegenheit."
AFG_political_events.20.t:		"[FROM.GetName] strebt Investitionen an"
AFG_political_events.20.desc:		"Die Diplomaten von [FROM.GetNameDefCap] sind mit einem wirtschaftlichen Vorschlag an uns herangetreten, in ihre Wirtschaft zu investieren. Sie argumentieren, dass wir von allen zukünftigen Exporten profitieren würden, wenn wir dort Industrien für sie entwickeln würden. Außerdem machten sie deutlich, dass dies zweifellos die [SOU.GetAdjective]s und [ENG.GetAdjective] verärgern würde, die in der Vergangenheit die Hauptakteure in [FROM.GetNonIdeologyName] waren."
AFG_political_events.20.a:		"Die Untergrabung des feindlichen Einflusses in der Nation wird uns zugute kommen."
AFG_political_events.20.b:		"Wir haben kein Interesse an [FROM.GetNonIdeologyName]"
AFG_political_events.21.t:		"[FROM.GetName] erklärt sich bereit, in unsere Wirtschaft zu investieren"
AFG_political_events.21.desc:		"[FROM.GetAdjective] Diplomaten haben angekündigt, dass ihre Regierung unseren Vorschlag unterstützt, in [ROOT.GetNonIdeologyName] zu investieren. Ingenieure und Unternehmer sind bereits unterwegs, um neue Industrien im ganzen Land aufzubauen."
AFG_political_events.21.a:		"Ein großzügiger Beitrag!"
AFG_political_events.22.t:		"[FROM.GetName] weigert sich, in unsere Wirtschaft zu investieren"
AFG_political_events.22.desc:		"[FROM.GetAdjective] Diplomaten haben angekündigt, dass ihre Regierung sich weigert, in [ROOT.GetNonIdeologyName] zu investieren. Sie argumentieren, dass unsere langfristigen Beweggründe noch unklar sind und dass sie einer Nation, die letztendlich in den Einflussbereich ihrer Feinde fallen könnte, keine wirtschaftliche Hilfe anbieten wollen."
AFG_political_events.22.a:		"Wir werden uns das merken."
AFG_political_events.30.t:		"Die Zukunft von [ROOT.GetNonIdeologyName]"
AFG_political_events.30.desc:		"Nach Jahren der politischen Reformen und Kompromisse zwischen den verschiedenen Fraktionen in unserer Nation haben wir nun die Möglichkeit, die Fesseln des Monarchismus ein für alle Mal abzuschütteln. Allerdings müssen wir neu definieren, wer wir als Nation sind."
AFG_political_events.30.a:		"Dies ist ein Neuanfang und Wir werden die [ROOT.GetAdjective] Republik sein"
AFG_political_events.30.b:		"Wir sind die Nation der Paschtunen über alles andere"
AFG_political_events.30.c:		"Die Verschmelzung von Demokratie und Islam ist der Weg nach vorne"
AFG_political_events.40.t:		"[FROM.GetNameDefCap] Stellt Ultimatum"
AFG_political_events.40.desc:		"Die Vertreter der [FROM.GetAdjective]-Botschaft haben unserer Regierung ein Ultimatum gestellt. Sie verlangen, dass wir den ausländischen Einfluss in unserem Land einschränken, der die Interessen von [FROM.GetAdjective] gefährden könnte, oder wir müssen mit einer möglichen Militärintervention rechnen, um unsere Regierung zu ersetzen."
AFG_political_events.40.a:		"Wir sind nicht in der Lage, zu argumentieren."
AFG_political_events.40.b:		"Das ist nur Getöse und wir lassen uns davon nicht einschüchtern."
AFG_political_events.41.t:		"[FROM.GetNameDefCap] gibt den Forderungen nach"
AFG_political_events.41.desc:		"Die [FROM.GetAdjective] Regierung hat unseren Forderungen nach einem Ende der ausländischen Einmischung in ihrem Land, die unsere Interessen in der Region untergraben könnte, zugestimmt. Sie sind zwar sicherlich unzufrieden mit unserer Einmischung, aber es scheint, dass sie in naher Zukunft wenig Lust auf einen Kampf haben. "
AFG_political_events.41.a:		"Wir werden sie weiterhin sorgfältig beobachten."
AFG_political_events.42.t:		"[FROM.GetNameDefCap] lehnt Forderungen ab"
AFG_political_events.42.desc:		"Die Regierung von [FROM.GetAdjective] hat unsere Forderungen nach einem Ende der ausländischen Einmischung in ihrem Land zurückgewiesen. Sie argumentiert, dass wir kein Recht haben, uns in ihre inneren Angelegenheiten und die Vereinbarungen, die sie mit anderen Nationen ausgehandelt haben, einzumischen."
AFG_political_events.42.a:		"Wir werden andere Mittel einsetzen müssen, um sie auszurichten."
AFG_political_events.42.b:		"Sie lassen uns keine andere Wahl."
AFG_political_events.43.t:		"Ausländische Einmischung in [FROM.GetNameDefCap]"
AFG_political_events.43.desc:		"Unser Botschafter in [FROM.GetNameDefCap] hat uns darüber informiert, dass kürzlich eine Art von Abkommen mit Vertretern eines anderen Landes in [FROM.Capital.GetCapitalVictoryPointName] unterzeichnet wurde. Während die Details des Abkommens unklar sind, kann es kaum Zweifel daran geben, dass die Regierung von [FROM.GetAdjective] von Nationen beeinflusst wird, die möglicherweise unsere Interessen in der Region untergraben wollen."
AFG_political_events.43.a:		"Wir werden die Situation im Auge behalten."
AFG_political_events.51.t:		"$AFG_amunullah_khan$ von [AFG.GetNonIdeologyName] bittet um Hilfe"
AFG_political_events.51.desc:		"In einer diskreten Botschaft hat sich $AFG_amunullah_khan$, der ehemalige Herrscher von [FROM.GetNonIdeologyName], an unsere Regierung gewandt und um Unterstützung für seine Wiedereinsetzung auf den Thron gebeten. Er verspricht, dass er mit deutscher Unterstützung eine starke, modernisierte Nation aufbauen wird, die mit unseren Interessen im Einklang steht."
AFG_political_events.51.a:		"Wir könnten mehr Verbündete in der Region gebrauchen."
AFG_political_events.51.b:		"Warum sollten wir uns in so fernen Ländern einmischen?"
AFG_political_events.52.t:		"[FROM.GetNameDefCap] lehnt den Plan ab"
AFG_political_events.52.desc:		"Die Regierung von [FROM.GetAdjective] hat auf unsere Anfrage geantwortet und lehnt es bedauerlicherweise ab, die Wiedereinsetzung von $AFG_amunullah_khan$ auf den Thron zu unterstützen. Unter Berufung auf Bedenken wegen möglicher Verstrickungen und des derzeitigen geopolitischen Klimas hat [FROM.GetAdjective] beschlossen, sich auf andere strategische Prioritäten zu konzentrieren."
AFG_political_events.52.a:		"Wie können sie es wagen, uns zu verraten!"
AFG_political_events.53.t:		"[FROM.GetNameDefCap] erklärt sich bereit, uns zu unterstützen"
AFG_political_events.53.desc:		"Als Antwort auf unsere Bitte hat die Regierung von [FROM.GetName] zugestimmt, die Wiederherstellung von $AFG_amunullah_khan$ auf dem Thron von [ROOT.GetNonIdeologyName] zu unterstützen. Diese Unterstützung wird auch militärische Hilfe und Ausrüstung umfassen, um den Erfolg unseres Vorhabens zu gewährleisten."
AFG_political_events.53.a:		"Die Zukunft von [AFG.GetNonIdeologyName] gehört uns!"
AFG_political_events.54.t:		"[GER.GetNonIdeologyName] Unterstützung trifft ein"
AFG_political_events.54.desc:		"Wie bereits vereinbart, hat uns [FROM.GetAdjective] seit dem Ausbruch des Bürgerkriegs Ausrüstung zur Verfügung gestellt. Ihre Agenten in [ROOT.Capital.GetCapitalVictoryPointName] haben uns auch versichert, dass verdeckte [FROM.GetAdjective] Truppen bald das Land erreichen werden, um uns im Kampf zu unterstützen."
AFG_political_events.54.a:		"Ausgezeichnet!"
AFG_political_events.60.t:		"$AFG_turko_persian_union$ Einladen"
AFG_political_events.60.desc:		"Die Regierung von [FROM.GetNameDef] schmiedet eine neue politische Einheit, die sie die Türkisch-Persische Union nennt. Es scheint eine Bewaffnung ihres türkischen und persischen Erbes zu sein, um alle unsere Völker unter einer Regierung zu vereinen. Der erste Schritt dazu ist die Gründung eines Militärbündnisses zwischen uns. Wenn wir zustimmen, werden sie mit der Zeit zweifellos auf eine stärkere Integration unter ihrer Führung drängen."
AFG_political_events.60.a:		"Wir werden uns unserem gemeinsamen Schicksal stellen!"
AFG_political_events.60.b:		"Wer sind sie, dass sie im Namen des [ROOT.GetAdjective] Volkes sprechen?"
AFG_political_events.61.t:		"[FROM.GetNonIdeologyName] schließt sich $AFG_turko_persian_union$ an"
AFG_political_events.61.desc:		"[FROM.GetNameDefCap] hat sich bereit erklärt, unserer Turko-Persischen Union beizutreten. Gemeinsam werden unsere Streitkräfte in der Lage sein, Aggressionen unserer gemeinsamen Gegner besser abzuwehren. Aber was noch wichtiger ist, wir haben ein Standbein, um ihre Unabhängigkeit mit der Zeit zu untergraben."
AFG_political_events.61.a:		"Großartig!"
AFG_political_events.62.t:		"[FROM.GetNonIdeologyName] lehnt $AFG_turko_persian_union$ ab"
AFG_political_events.62.desc:		"[FROM.GetNameDefCap] hat die Mitgliedschaft in der Turko-Persischen Union abgelehnt. Sie sind wütend über unsere vermeintliche Arroganz bei dem Versuch, für alle [TUR.GetAdjective] und [PER.GetAdjective] Völker zu sprechen."
AFG_political_events.62.a:		"Sie werden mit der Zeit den Fehler ihres Handelns erkennen."
AFG_political_events.62.b:		"Wenn sie nicht auf unserer Seite sind, sind sie unsere Feinde!"
AFG_political_influence_major_warning_tt:		"Wenn [FROM.GetNameDefCap] mehr als §R40%§! Unterstützung für eine Ideologie erhält, die nicht mit unserer eigenen übereinstimmt, werden wir die Fähigkeit erlangen, zu intervenieren und möglicherweise über §Y$AFG_foreign_intervention_category$§! Entscheidungen in sie einzudringen"
AFG_political_events_51_tt:		"Wenn der [AFG.GetNonIdeologyName] Bürgerkrieg beginnt: "
AFG_political_events.70.t:		"[FROM.GetNonIdeologyName] Lehnt die Durand-Linie ab"
AFG_political_events.70.desc:		"Die Durand-Linie, die 1893 als Grenze zwischen Britisch-Indien und [FROM.GetNonIdeologyName] festgelegt wurde, ist seit langem eine Quelle des Streits. Mit dem Aufkommen des [FROM.GetAdjective] Nationalismus und dem Wunsch, die paschtunischen Stämme auf beiden Seiten der Grenze zu vereinen, hat die Regierung von [FROM.GetLeader] die Durand-Linie offiziell abgelehnt. [FROM.Capital.GetCapitalVictoryPointName] fordert nun die Neuverhandlung der Grenzen und beruft sich dabei auf historische Missstände und die ungerechte Aufteilung des paschtunischen Landes und droht sogar mit Krieg, falls wir keine Einigung erzielen."
AFG_political_events.70.a:		"Einen Konflikt können wir uns derzeit nicht leisten."
AFG_political_events.70.b:		"Wir können uns einen Krieg nicht leisten, aber wir brauchen die Zustimmung von [ROOT.OVERLORD.capital.GetCapitalVictoryPointName]."
AFG_political_events.70.c:		"Die Grenzen sind eine beschlossene Sache und werden nicht weiter diskutiert. "
AFG_political_events.71.t:		"[FROM.GetNameDefCap] stimmt der Neuverhandlung der Grenzen zu"
AFG_political_events.71.desc:		"Gegen alle Widerstände hat [FROM.GetNameDef] unseren Forderungen nach einer Neuverhandlung der Durand-Linie zugestimmt. Unter immensem Druck und nicht gewillt, einen längeren Konflikt in der Region zu riskieren, hat [FROM.GetAdjective] zugestimmt, die Grenzen neu zu ziehen und unseren rechtmäßigen Anspruch auf das paschtunische Land anzuerkennen. Dieser diplomatische Sieg eint nicht nur unser Volk, sondern stärkt auch die Legitimität der Herrschaft von [ROOT.GetLeader]. [ROOT.GetNameDef] steht geeinter und stärker denn je da."
AFG_political_events.71.a:		"Ein glorreicher Sieg für Afghanistan!"
AFG_political_events.72.t:		"[FROM.GetNameDef] schlägt territoriale Zugeständnisse vor"
AFG_political_events.72.desc:		"Die politische Situation in [AFG.GetNameDef] hat einen kritischen Punkt erreicht. Ihre Regierung hat die Durand-Linie offiziell abgelehnt und fordert eine Neuverhandlung der Grenzen, um die paschtunischen Stämme zu vereinen. Die Regierung von [AFG.GetAdjective] hat deutlich gemacht, dass die Nichterfüllung dieser Forderungen zu einer Kriegserklärung führen wird. Angesichts der Aussicht auf einen kostspieligen und langwierigen Konflikt hat [FROM.GetNameDef] vorgeschlagen, das umstrittene Gebiet an [AFG.GetNameDef] abzutreten, um die regionale Stabilität zu erhalten und eine weitere Eskalation zu vermeiden."
AFG_political_events.72.a:		"Wir müssen vermeiden, in einen weiteren Konflikt verwickelt zu werden."
AFG_political_events.72.b:		"Wir werden uns nicht zu territorialen Zugeständnissen zwingen lassen."
AFG_political_events.73.t:		"[FROM.GetNameDefCap] nimmt territoriale Zugeständnisse an"
AFG_political_events.73.desc:		"Angesichts der gegenwärtigen globalen Spannungen und des Potenzials für einen kostspieligen Konflikt in der Region hat [FROM.Capital.GetCapitalVictoryPointName] entschieden, dass es in seinem besten Interesse ist, das umstrittene Gebiet an [AFG.GetNonIdeologyName] abzutreten. Wir sind angewiesen, dieser Anweisung nachzukommen, um die Stabilität zu erhalten und einen unnötigen Krieg zu vermeiden."
AFG_political_events.73.a:		"Eine pragmatische Lösung."
AFG_political_events.74.t:		"[FROM.GetNameDefCap] lehnt territoriales Zugeständnis ab"
AFG_political_events.74.desc:		"Die Forderungen von [AFG.GetNonIdeologyName], die Durand-Linie neu zu verhandeln und paschtunische Gebiete abzutreten, sind auf den entschiedenen Widerstand von [FROM.Capital.GetCapitalVictoryPointName] gestoßen. Trotz des Konfliktpotenzials hat die [FROM.GetAdjective]-Regierung beschlossen, dass die Abtretung dieser Gebiete einen gefährlichen Präzedenzfall schaffen und ihre Position in der Region schwächen würde. Wir sind angewiesen, die Forderungen von [AFG.GetNonIdeologyName] zurückzuweisen und uns darauf vorzubereiten, die Grenze notfalls zu verteidigen."
AFG_political_events.74.a:		"Wir werden tun, was wir tun müssen."
AFG_political_events.75.t:		"Lehnt Neuverhandlung der Grenze ab"
AFG_political_events.75.desc:		"Trotz unserer Forderungen und des eindeutigen Wunsches des paschtunischen Volkes nach Einheit hat sich [FROM.GetNameDef] rundheraus geweigert, die Grenzen neu zu verhandeln. Ihre Reaktion ist entschlossen, sie lehnen jeden Gedanken an Gebietsabtretungen ab und warnen vor einer weiteren Eskalation. Es scheint, dass der einzige Weg zur Befreiung der Gebiete ein Konflikt sein wird."
AFG_political_events.75.a:		"Dann müssen wir uns auf einen Krieg vorbereiten."
AFG_political_events.80.t:		"[FROM.GetNameDefCap] Fordert außenpolitische Annäherung"
AFG_political_events.80.desc:		"In einem kühnen Schachzug, um die Vorherrschaft in der islamischen Welt zu behaupten, hat [FROM.GetNameDef] ein Ultimatum gestellt. Sie verlangen, dass wir uns ihrer wachsenden Allianz anschließen, die darauf abzielt, die islamischen Nationen unter der Führung von [FROM.GetAdjective] zu vereinen und zu stärken. Wenn wir dieser Forderung nicht nachkommen, wird es offenbar zu einer groß angelegten Invasion kommen."
AFG_political_events.80.a:		"Das ist in unserem besten Interesse."
AFG_political_events.80.b:		"Sie haben kein Recht, uns ihre Politik zu diktieren."
AFG_political_events.81.t:		"[FROM.GetNameDefCap] stimmt dem Beitritt zu"
AFG_political_events.81.desc:		"Als Reaktion auf unser Ultimatum hat [FROM.GetNameDef] beschlossen, sich unseren Forderungen zu fügen. Sie haben zugestimmt, unserer Allianz beizutreten, da sie die Stärke und Führungsrolle von [ROOT.GetNameDef] bei der Vereinigung der islamischen Welt anerkennen. Dieser strategische Schritt vergrößert nicht nur unseren Einfluss, sondern festigt auch unsere Position als dominierende Macht in der Region. Mit ihnen auf unserer Seite rückt unsere Vision einer vereinten islamischen Front immer näher an die Realität heran."
AFG_political_events.81.a:		"Sie hatten nicht wirklich eine Wahl."
AFG_political_events.82.t:		"[FROM.GetNameDefCap] verweigert den Beitritt"
AFG_political_events.82.desc:		"Unter Missachtung unseres Ultimatums hat [FROM.GetNameDef] unsere Forderung abgelehnt, unserer Allianz beizutreten. Die irakische Regierung beharrt auf ihrer Unabhängigkeit und ist nicht bereit, sich unserer Autorität zu unterwerfen."
AFG_political_events.82.a:		"Dann werden sie vernichtet werden."
AFG_political_events.85.t:		"[FROM.GetNameDefCap] bittet um Schutz"
AFG_political_events.85.desc:		"In einer verdeckten Mitteilung hat sich die [FROM.GetAdjective]-Regierung mit einem Vorschlag für einen Verteidigungspakt an uns gewandt. Sie streben ein gegenseitiges Abkommen an, um sich im Falle eines Krieges gegenseitig zu verteidigen, da sie die strategischen Vorteile einer Partnerschaft mit uns gegenüber unseren Feinden erkannt haben. Das Bestreben Afghanistans, eine dominante Macht in der islamischen Welt zu werden, könnte sich mit unseren breiteren geopolitischen Interessen decken."
AFG_political_events.85.a:		"Dies könnte zu unserem Vorteil sein."
AFG_political_events.85.b:		"Wir werden uns nicht in [FROM.GetAdjective] Politik verwickeln lassen."
AFG_political_events.86.t:		"[FROM.GetNameDefCap] stimmt dem Pakt zu"
AFG_political_events.86.desc:		"[FROM.GetNameDefCap] hat unserem Vorschlag für einen Verteidigungspakt zugestimmt. Dieser Pakt stellt sicher, dass sich unsere beiden Nationen im Falle eines Krieges gegenseitig unterstützen und unsere strategische Position stärken werden. Mit der militärischen Stärke von [FROM.GetNameDef] im Rücken sind unsere Ambitionen, eine dominierende Macht in der islamischen Welt zu werden, nun leichter zu erreichen. "
AFG_political_events.86.a:		"Dann werden wir mit unserer Expansion in der gesamten Region beginnen."
AFG_political_events.87.t:		"[FROM.GetNameDefCap] lehnt den Pakt ab"
AFG_political_events.87.desc:		"In einer sorgfältig formulierten Antwort hat [FROM.GetNameDef] unseren Vorschlag für einen Verteidigungspakt abgelehnt. Obwohl sie die potenziellen strategischen Vorteile anerkennen, haben sie sich entschieden, anderen Partnerschaften den Vorrang zu geben und bleiben vorsichtig, wenn es darum geht, sich zu diesem Zeitpunkt auf ein solches Abkommen mit uns einzulassen."
AFG_political_events.87.a:		"Es wird Zeit brauchen, aber wir werden unsere Ziele aus eigener Kraft erreichen."
AFG_political_events.90.t:		"[AFG.GetNameDefCap] Unterstützung von Reaktionären in Zentralasien."
AFG_political_events.90.desc:		"Es sind Berichte aufgetaucht, dass [AFG.GetNameDef] unter der Herrschaft von [AFG.GetLeader] aktiv reaktionäre Aktivitäten in unseren zentralasiatischen Republiken fördert. Es wird vermutet, dass [AFG.GetAdjective]-Agenten Unruhen schüren und anti-[ROOT.GetAdjective]-Stimmungen unter der lokalen Bevölkerung fördern. Dieses subversive Verhalten stellt eine direkte Herausforderung für unsere Autorität in der Region dar und bedroht die Stabilität unserer zentralasiatischen Territorien. Wir müssen dieser ausländischen Einmischung entgegentreten und die Kontrolle über unsere Republiken behalten."
AFG_political_events.90.a:		"Wir müssen zusätzliche Sicherheitskräfte einsetzen, um die Unruhen zu unterdrücken."
AFG_political_events_90_tt:		"Entriegeln Sie §Y[AFG_get_turkik_people_name_key]§! Entscheidungen zur Beseitigung von Widerstandszellen in zentralasiatischen Staaten. §AWenn wir die Widerstandszellen nicht entfernen und uns in einem Krieg mit [FROM.GetNameDef] befinden, werden die Staaten gegen uns rebellieren!§!"
AFG_political_events.91.t:		"Zentralasiatische Republiken revoltieren"
AFG_political_events.91.desc:		"Mit dem Ausbruch des Krieges mit [AFG.GetNameDef] hat die Lage in unseren zentralasiatischen Republiken einen kritischen Punkt erreicht. Inspiriert durch die Einmischung von [AFG.GetAdjective] und ermutigt durch den aktuellen Konflikt, haben sich mehrere Republiken erhoben und ihre Unabhängigkeit von [ROOT.GetNameDef] erklärt. Diese weit verbreitete Rebellion droht, die gesamte Region zu destabilisieren und unsere militärischen Ressourcen noch mehr auszuhöhlen. Wir müssen schnell handeln, um die Aufstände niederzuschlagen und die Ordnung wiederherzustellen, oder wir riskieren, die Kontrolle über Zentralasien zu verlieren."
AFG_political_events.91.a:		"Wir müssen die Aufstände niederschlagen und unsere Autorität wiederherstellen."
AFG_political_events.95.t:		"[GER.GetAdjective] Truppen aktiv in [FROM.GetNonIdeologyName] "
AFG_political_events.95.desc:		"Der jüngste Bürgerkrieg, der die belagerte Nation von [AFG.GetNonIdeologyName] erfasst hat, hat in [ROOT.Capital.GetCapitalVictoryPointName] Alarm ausgelöst. Die Situation hat jedoch eine neue Dringlichkeit angenommen, da Berichte aus der Region darauf hindeuten, dass [GER.GetAdjective] Truppen die Kräfte von [AFG.GetLeader] unterstützen, um die rechtmäßige Regierung zu stürzen. Wir können nur vermuten, dass dies auf eine Annäherung von [AFG.GetLeader] an [GER.GetNameDef] hindeutet, was eine große Bedrohung für unsere Interessen in der Region darstellen würde. Mitglieder der Streitkräfte haben uns daher Pläne zur Genehmigung vorgelegt, die es uns ermöglichen würden, der rechtmäßigen Regierung verdeckt zu helfen und eine faschistische Übernahme des Landes zu verhindern."
AFG_political_events.95.a:		"Dies ist für die Sicherheit in der Region unerlässlich, genehmigt."
AFG_political_events.95.b:		"[AFG.GetNonIdeologyName] geht uns nichts an."
AFG_political_events.100.t:		"Khorasan Pufferstaat"
AFG_political_events.100.desc:		"Die Regierung von [FROM.GetNameDef] hat die strategische Notwendigkeit erkannt, einen Pufferstaat im Osten von [PER.GetNonIdeologyName] zu errichten. Zu diesem Zweck hat sie formell die Übertragung der Kontrolle über eine Reihe von Gebieten im Ostiran beantragt, um die Gründung des Staates Khorasan zu erleichtern. Sie argumentieren, dass dieser neue Pufferstaat als stabilisierende Kraft in der Region dienen wird. "
AFG_political_events.100.a:		"Wenn dies zu einem langfristigen Frieden führt, wer sind wir, dass wir das bestreiten?"
AFG_political_events.100.b:		"Wir werden nichts dergleichen tun."
AFG_political_events.101.t:		"[FROM.GetNameDefCap] stimmt der Gründung eines Pufferstaates zu"
AFG_political_events.101.desc:		"Die Regierung von [FROM.GetNameDef] hat zugestimmt, die Kontrolle über die bezeichneten Gebiete im Osten von [PER.GetNonIdeologyName] abzugeben. Diese Übertragung wird es uns ermöglichen, den Pufferstaat Khorasan wie geplant zu errichten. "
AFG_political_events.101.a:		"Unsere Westflanke ist endlich sicher."
AFG_political_events.102.t:		"[FROM.GetNameDefCap] lehnt Vorschlag für Pufferstaat ab"
AFG_political_events.102.desc:		"Die Regierung von [FROM.GetNameDef] hat unseren Vorschlag, die Kontrolle über die angeforderten Gebiete im Osten von [PER.GetNonIdeologyName] zu übertragen, bedauerlicherweise abgelehnt. Sie hat ihre Besorgnis über die Auswirkungen eines solchen Transfers und die möglichen Folgen für die regionale Stabilität zum Ausdruck gebracht."
AFG_political_events.102.a:		"Wir werden unsere Agenda mit anderen Mitteln verfolgen."
AFG_political_events.110.t:		"[FROM.GetNameDefCap] Ersucht Territorium"
AFG_political_events_110_desc_balochistan:		"Die Regierung von [FROM.GetNameDef] hat die Territorien von Belutschistan angefordert. Sie behauptet, dass diese Gebiete rechtmäßig zu ihr gehören sollten und argumentiert, dass die derzeitigen Grenzen ihr Volk und ihr Territorium ungerechterweise aufteilen."
AFG_political_events_110_desc_durand:		"Die Regierung von [FROM.GetNameDef] hat eine Reihe unserer Gebiete entlang ihrer Grenze angefordert. Sie behaupten, dass diese Gebiete rechtmäßig ihnen gehören sollten und argumentieren, dass die derzeitigen Grenzen ihr Volk und ihr Territorium ungerechterweise aufteilen."
AFG_political_events.110.a:		"Wenn es sie uns vom Hals hält."
AFG_political_events.110.b:		"Wir werden keinen Zentimeter nachgeben."
AFG_political_events.111.t:		"[FROM.GetNameDefCap] stimmt zu, Territorium abzutreten"
AFG_political_events.111.desc:		"[FROM.GetNameDefCap] hat zugestimmt, die von uns geforderten Staaten abzutreten. Nach jahrzehntelangem Streit können wir endlich unser lange verlorenes Volk wieder in der Gemeinschaft willkommen heißen."
AFG_political_events.111.a:		"Ausgezeichnet!"
AFG_political_events.112.t:		"[FROM.GetNameDefCap] weigert sich, Territorium abzutreten"
AFG_political_events.112.desc:		"[FROM.GetNameDefCap] hat sich geweigert, die von uns geforderten Staaten abzutreten. Es scheint, dass wir in Zukunft andere Wege finden müssen, um unser rechtmäßiges Territorium wiederzuerlangen."
AFG_political_events.112.a:		"Es war einen Versuch wert."
AFG_political_events.112.b:		"Dann werden wir es uns mit Gewalt nehmen."
AFG_political_events.120.t:		"[FROM.GetNameDefCap] Bittet um Unterstützung"
AFG_political_events.120.desc:		"Vertreter der kommunistischen Bewegung in [AFG.GetNonIdeologyName] haben sich an uns gewandt und um Unterstützung für ihre aufkeimende Revolution gebeten. Es ist zwar fraglich, ob die angeschlagene Nation in der Lage ist, eine sozialistische Wirtschaft zu unterstützen, aber wir können nicht übersehen, wie wichtig es ist, die Grenzen des Sozialismus weiter nach Zentralasien und darüber hinaus zu verschieben."
AFG_political_events.120.a:		"Dies steht im Einklang mit unseren strategischen Zielen in diesen Regionen."
AFG_political_events.120.b:		"[SOU.GetAdjective] Blut wird niemals in [FROM.GetNonIdeologyName] vergossen werden!"
AFG_political_events.121.t:		"[FROM.GetNameDefCap] stimmt zu und kommt uns zu Hilfe"
AFG_political_events.121.desc:		"Als Zeichen ihres Engagements für die Ideale der internationalen Solidarität hat sich [FROM.GetNameDefCap] bereit erklärt, uns in unserem Kampf zu unterstützen, und teilt uns mit, dass voll ausgerüstete Freiwillige ihrer Streitkräfte in Kürze zu uns unterwegs sein werden."
AFG_political_events.121.a:		"Vielen Dank, liebe Genossen!"
AFG_political_events.122.t:		"[FROM.GetNameDefCap] verweigert Unterstützung"
AFG_political_events.122.desc:		"[FROM.GetNameDefCap] hat unsere Bitte um Unterstützung abgelehnt. Sie argumentieren, dass unsere Revolution verfrüht und zum Scheitern verurteilt ist. Unser Volk wird wahrscheinlich auf absehbare Zeit einen tiefen Groll gegen [FROM.GetNameDef] hegen."
AFG_political_events.122.a:		"Ein Verrat an den sozialistischen Idealen."
AFG_political_events.130.t:		"[FROM.GetNameDefCap] Fordert Territorium"
AFG_political_events.130.desc:		"Die Regierung von [FROM.GetNonIdeologyName] hat uns bezüglich eines Vorschlags konsultiert, ihre Nation zu stärken, indem sie eine Konföderation mit einem Teil unseres Territoriums entlang der Grenze zu [ROOT.GetAdjective] bildet. Dies würde eine Anpassung unserer Grenzen bedeuten, könnte aber dazu beitragen, einen starken Verbündeten in der Region zu schaffen."
AFG_political_events.130.a:		"Wir unterstützen diese Initiative."
AFG_political_events.130.b:		"Sie sind dumm, uns überhaupt zu konsultieren."
AFG_political_events.131.t:		"[FROM.GetName] stimmt der Konföderation zu"
AFG_political_events.131.desc:		"Die [FROM.GetAdjective] Regierung hat unserem Konföderationsvorschlag zugestimmt. Wir können nun damit beginnen, unser neues Territorium in unser politisches und wirtschaftliches System zu integrieren. Dies sollte hoffentlich in naher Zukunft als Abschreckung für unsere regionalen Widersacher dienen."
AFG_political_events.131.a:		"Ausgezeichnet!"
AFG_political_events.132.t:		"[FROM.GetName] lehnt die Konföderation ab"
AFG_political_events.132.desc:		"Die [FROM.GetAdjective] Regierung hat unseren Vorschlag, eine Konföderation zu bilden, abgelehnt. Dies ist ein massiver außenpolitischer Rückschlag für uns und hat die Frage aufgeworfen, wie unsere langfristigen Beziehungen zu [FROM.GetNameDef] nun aussehen werden."
AFG_political_events.132.a:		"Eine verpasste Gelegenheit."
AFG_political_events.140.t:		"Wahlergebnisse"
AFG_political_events.140.desc:		"Diese Wahl war etwas chaotisch, da die Nation noch keine Erfahrung mit solchen Ereignissen hat. Dennoch haben sich einige Kandidaten mit breit angelegten Programmen als Spitzenkandidaten herauskristallisiert. Nach Schließung der Wahllokale scheint es jedoch, als ob die Wähler von den Kandidaten überzeugt waren:"
AFG_political_events.140.a:		"Der jugendliche Charme von Mohammad Daoud Khan."
AFG_political_events.140.b:		"Der stets beständige Sardar Shah Mahmud Khan."
AFG_political_events.140.c:		"Der standhafte und traditionelle Muhammad Ibrahim Khan."
GOE_RAJ.1.t:		"[FROM.GetName] bittet um Erlaubnis zur Invasion [BHU.GetName]"
GOE_RAJ.1.desc:		"Unser Untertan [FROM.GetNameDef] hat eine Gelegenheit ins Auge gefasst, unseren Einfluss auf dem indischen Subkontinent auszuweiten, indem er das [BHU.GetAdjective] Einsiedlerkönigreich unterwirft. Dies könnte ein Tor nach Innerasien öffnen."
GOE_RAJ.1.a:		"Eine großartige Idee"
GOE_RAJ.1.b:		"Das wäre zu aggressiv"
GOE_RAJ.2.t:		"[FROM.GetName] stimmt zu"
GOE_RAJ.2.desc:		"[FROM.GetName] hat unsere Bitte um territoriale Expansion gebilligt. Es dürfte kaum Widerstand geben, der sich uns in den Weg stellt."
GOE_RAJ.2.a:		"Großartig"
GOE_RAJ.3.t:		"[FROM.GetName] Lehnt ab"
GOE_RAJ.3.desc:		"[FROM.GetName] hat unsere Bitten um territoriale Expansion mit der Begründung abgelehnt, dass es nicht im Interesse der Krone sei, den Subkontinent zu diesem Zeitpunkt zu destabilisieren."
GOE_RAJ.3.a:		"Eine Schande"
GOE_RAJ.4.t:		"[FROM.GetName] Fordert Unterwerfung"
GOE_RAJ.4.desc:		"Da sich die Sicherheitslage auf dem Kontinent rapide verschlechtert, hat [FROM.GetNameDef] gefordert, dass unser Königreich fest in ihre Einflusssphäre integriert wird. Die [FROM.GetAdjective] Regierung hat betont, dass wir eine gewisse Unabhängigkeit behalten würden, aber dass sie potenzielle Sicherheitsrisiken für den Staat nicht länger akzeptieren kann."
GOE_RAJ.4.a:		"Unannehmbare Bedingungen"
GOE_RAJ.4.b:		"Wir müssen passen"
GOE_RAJ.5.t:		"[FROM.GetName] weigert sich"
GOE_RAJ.5.desc:		"[FROM.GetName] hat unsere Forderungen abgelehnt und betont, dass es ein unabhängiges Königreich mit eigenen Regeln und Anliegen ist."
GOE_RAJ.5.a:		"Inakzeptabel"
GOE_RAJ.6.t:		"[FROM.GetName] Gibt nach"
GOE_RAJ.6.desc:		"[FROM.GetName] hat unsere Forderungen akzeptiert und sein Land damit in einen Untertanenstaat verwandelt."
GOE_RAJ.6.a:		"Großartig!"
GOE_RAJ.7.t:		"Subhas Chandra Bose schlägt vor, die [GetRajAdjective] Regierung zu stürzen."
GOE_RAJ.7.desc:		"In seinem Bemühen um die Unabhängigkeit von [GetRajName] ist der Nationalistenführer Chandra Bose mit dem Vorschlag an uns herangetreten, den [GetRajAdjective] Kontinent zu destabilisieren. Sollten wir zustimmen, würden wir aufgefordert werden, beim Sturz der imperialen Besatzung von [GetRajAdjective] zu helfen, wenn die Zeit reif ist."
GOE_RAJ.7.a:		"Wir werden ihm helfen."
GOE_RAJ.7.a_tt:		"§YWir werden aufgerufen, in den Krieg gegen [RAJ.GetName] zu ziehen, wenn Chandra Bose seine Revolution startet§!"
GOE_RAJ.7.b:		"Wir haben andere Pläne"
GOE_RAJ.8.t:		"[FROM.GetName] erklärt sich bereit, uns zu helfen"
GOE_RAJ.8.desc:		"[FROM.GetName] hat signalisiert, dass es uns in unserem Kampf für die Unabhängigkeit unterstützen wird."
GOE_RAJ.8.a:		"Einen Schritt näher an der Unabhängigkeit"
GOE_RAJ.9.t:		"[FROM.GetName] lehnt es ab, uns zu helfen"
GOE_RAJ.9.desc:		"[FROM.GetName] hat erklärt, dass sie Pläne hat, die gefährdet wären, wenn sie in einen Krieg gegen die [ENG.GetAdjective] verwickelt würde, und wird uns daher nicht helfen."
GOE_RAJ.9.a:		"Wir brauchen sowieso keine Hilfe "
GOE_RAJ.10.t:		"[FROM.GetName] ruft [JAP.GetName] auf, seinen Schwur zu erfüllen."
GOE_RAJ.10.desc:		"Subhas Chandra Bose hat seine Revolution gestartet. Ein Telegramm ist eingetroffen, in dem es heißt: Wenn wir unser Versprechen einhalten wollen, ist jetzt der richtige Zeitpunkt. \nDies hat die Chance, einen wichtigen Gegner im asiatischen Raum vollständig auszuschalten."
GOE_RAJ.10.a:		"Wir kämpfen"
GOE_RAJ.10.b:		"Wir müssen unseren Schwur brechen"
GOE_RAJ.11.t:		"[FROM.GetName] Hält sein Versprechen"
GOE_RAJ.11.desc:		"[FROM.GetName] ist voll mobilisiert und steht bereit, uns in unserem Kampf zu unterstützen"
GOE_RAJ.11.a:		"Blut und Freiheit!"
GOE_RAJ.12.t:		"[FROM.GetName] bricht seinen Schwur"
GOE_RAJ.12.desc:		"Kein [FROM.GetAdjective] Soldat steht bereit, um uns zu helfen. Die versprochene Hilfe ist nirgends zu sehen und Tokio schweigt. Wir können nur annehmen, dass wir allein sind."
GOE_RAJ.12.a:		"Eidbrüchige!"
GOE_RAJ.13.t:		"Übergeben Sie die Andamanen-Inseln an [GetRajName]?"
GOE_RAJ.13.desc:		"Die Regierung von Azad Hind könnte eine eigene Hauptstadt für Verwaltungszwecke gebrauchen, die weit von der Front entfernt ist, bis ihr Sieg gefestigt ist.\nDie kürzlich eroberten Andamanen-Inseln könnten dafür perfekt sein. "
GOE_RAJ.13.a:		"Übergeben Sie sie"
GOE_RAJ.13.b:		"Eigentlich brauchen wir sie"
GOE_RAJ.14.t:		"[JAP.GetName] Übergibt die Andamanen"
GOE_RAJ.14.desc:		"Die [JAP.GetAdjective] hat die Andamanen erfolgreich erobert. Sie haben beschlossen, die Kontrolle an uns zu übergeben, damit wir dort eine ordentliche Regierung einsetzen können. "
GOE_RAJ.14.a:		"Großartig"
GOE_RAJ.14.tt:		"Wir können unsere Hauptstadt an die Andamanen übertragen, indem wir den §Y$RAJ_shaheed_and_swara$j§! Fokus abschließen."
GOE_RAJ.15.t:		"[RAJ.GetNameDefCap] behält die Kontrolle über [992.GetName]"
GOE_RAJ.15.desc:		"[RAJ.GetNameDefCap] hat uns darüber informiert, dass sie beabsichtigen, den Hafen von Aden unter ihrer Kontrolle zu behalten, trotz früherer Pläne, die Kontrolle an die Krone zu übergeben. Wie zu erwarten, hat dies im Parlament für Aufregung gesorgt, insbesondere bei Winston Churchill, aber derzeit sind keine disziplinarischen Maßnahmen geplant."
GOE_RAJ.15.a:		"Was haben sie vor?"
GOE_RAJ.16.t:		"[FROM.GetNameDefCap] übergibt [992.GetName] "
GOE_RAJ.16.desc:		"Wie im Government of India Act von 1935 vorgesehen, hat die [GetRajAdjective] Verwaltung die Verwaltungsaufgaben der [992.GetName] an uns übergeben."
GOE_RAJ.16.a:		"Weniger Verwaltungsaufwand."
GOE_RAJ.17.t:		"[RAJ.GetName] geht gegen [TIB.GetName] vor"
GOE_RAJ.17.desc:		"In einem aggressiven Schritt hat [RAJ.GetName] an der Grenze zu [TIB.GetName] Stellung bezogen und erklärt, dass sie ihre Sicherheitszone ausweiten wollen, um ihr Kernland zu schützen. Dies läuft unseren Interessen in der Region kategorisch zuwider."
GOE_RAJ.17.a:		"Bieten Sie [TIB.GetName] Garantien"
GOE_RAJ.17.b:		"Wir können es uns nicht leisten, eine weitere Front zu eröffnen."
GOE_RAJ.18.t:		"[RAJ.GetLeader] fordert die Rückgabe kolonialer Besitztümer"
GOE_RAJ.18.desc:		"Während [RAJ.GetNameDefCap] das Joch seiner Vergangenheit abwirft, ist [RAJ.GetLeader] dreist genug geworden, die Rückgabe unserer kolonialen Besitztümer in der Region zu fordern. Die Vereinigung des Subkontinents zu einem starken Staat scheint für das neugeborene Land von äußerster Wichtigkeit zu sein."
GOE_RAJ.18.a:		"Sie werden es sich mit Gewalt nehmen müssen."
GOE_RAJ.18.b:		"Wir können uns einen Krieg so weit weg von zu Hause nicht leisten"
GOE_RAJ.19.t:		"[FROM.GetName] weigert sich, die Kolonien zu übergeben"
GOE_RAJ.19.desc:		"Die [FROM.GetAdjective] Regierung hat sich hartnäckig geweigert, rechtmäßiges [GetRajAdjective] Land zu übergeben, trotz wiederholter Warnungen, dass der Status quo inakzeptabel ist"
GOE_RAJ.19.a:		"Dann werden wir es uns mit Gewalt nehmen müssen"
GOE_RAJ.20.t:		"[FROM.GetName] übergibt Kolonien"
GOE_RAJ.20.desc:		"[FROM.GetName] hat unsere Forderungen zähneknirschend akzeptiert. Sie machen deutlich, dass diese Art von Politik mit der Hand nicht lange Bestand haben wird und nur als kleine Gegenleistung machbar ist."
GOE_RAJ.20.a:		"Die Gerechtigkeit hat gesiegt"
GOE_RAJ.21.t:		"Die Kette, die zerbrach"
GOE_RAJ.21.desc:		"Die alte Regierung unter dem Joch des imperialistischen Britanniens hat kapituliert und ihre Regierung ist aus dem Land geflohen. Da wir dabei sind, die Kontrolle über den Subkontinent zu festigen, müssen wir entscheiden, wie wir mit unseren alten Oberherren umgehen"
GOE_RAJ.21.a:		"Bieten Sie ihnen Frieden an"
GOE_RAJ.21.b:		"Es kann keinen Frieden für die Imperialisten geben"
GOE_RAJ.22.t:		"Das britische Raj ist gefallen"
GOE_RAJ.22.desc:		"Ein verzweifeltes Telegramm von Lord Linlithgow hat uns darüber informiert, dass die Rebellen unter der Führung von [RAJ.GetLeader] die Kontrolle über das Land übernommen haben.\nLinlithgow ist auf dem Weg ins Land mit einem Friedensangebot von [RAJ.GetLeader], unter der Bedingung, dass wir alle Ansprüche auf Indien abtreten."
GOE_RAJ.22.a:		"Kein Kompromiss"
GOE_RAJ.22.b:		"Der Osten ist gefallen"
GOE_RAJ.23.t:		"[ENG.GetName] lehnt das Friedensangebot ab"
GOE_RAJ.23.desc:		"[ENG.GetName] hat unser Friedensangebot abgelehnt. Es ist die Absicht von [ENG.GetAdjective], diesen Krieg fortzusetzen, bis ihre Perle zurückerobert ist."
GOE_RAJ.23.a:		"So soll es sein."
GOE_RAJ.24.t:		"[ENG.GetName] nimmt das Friedensangebot an"
GOE_RAJ.24.desc:		"[ENG.GetName] hat unser Friedensangebot zähneknirschend angenommen. [GetRajName] ist frei, sein eigenes Schicksal zu schmieden"
GOE_RAJ.24.a:		"Blut wurde vergossen"
GOE_RAJ.25.t:		"[RAJ.GetName] Weißer Frieden mit [ENG.GetName]"
GOE_RAJ.25.desc:		"Die [RAJ.GetAdjective] hat einen Frieden mit ihren ehemaligen Oberherren geschlossen und ist damit endlich völlig unabhängig von der imperialen Herrschaft. Wir haben jetzt die Möglichkeit, dasselbe zu tun und dabei einen großen moralischen Sieg davonzutragen."
GOE_RAJ.25.a:		"Unterzeichnen Sie den Frieden"
GOE_RAJ.25.b:		"Wir sind noch nicht fertig"
GOE_RAJ.26.t:		"Subhas Chandra Bose aus dem Gefängnis befreit"
GOE_RAJ.26.desc:		"Wir haben unseren Führer erfolgreich aus dem Gefängnis befreit. Ein großer Segen, der unserer Sache Struktur verleihen wird."
GOE_RAJ.26.a:		"Großartig!"
GOE_RAJ.27.t:		"[GetRajName] wünscht sich weißen Frieden"
GOE_RAJ.27.desc:		"Nachdem sie sich von den Ketten ihrer Unterdrücker befreit haben, wünscht [GetRajName] nicht länger, dass unsere Länder in einen fruchtlosen Krieg verwickelt werden. "
GOE_RAJ.27.a:		"Nein, der Krieg muss weitergehen"
GOE_RAJ.27.b:		"Klingt wie ein Deal"
GOE_RAJ.28.t:		"[FROM.GetName] weigert sich, einen weißen Frieden zu unterzeichnen"
GOE_RAJ.28.desc:		"[FROM.GetName] hat unseren Versuch abgelehnt, den Konflikt zu beenden. Wird dies unser Untergang sein, oder der ihre? "
GOE_RAJ.28.a:		"Ominös"
GOE_RAJ.29.t:		"Neuer Vizekönig für [RAJ.GetName]"
GOE_RAJ.29.desc:		"Da das Ende der Amtszeit von Freeman-Freeman Thomas als Vizekönig für Indien näher rückt, müssen wir entscheiden, ob wir ihn durch einen geeigneten Kandidaten ersetzen oder ob wir die Amtszeit des Marquess of Willingdons weiter verlängern wollen."
GOE_RAJ.29.a:		"Victor Hope wird den Earl ersetzen"
GOE_RAJ.29.b:		"Freeman-Freeman behalten"
GOE_RAJ.30.t:		"Die britische RAJ-Verwaltung fällt"
GOE_RAJ.30.desc:		"Nach jahrhundertelanger Herrschaft zieht sich die [ENG.GetAdjective] Verwaltung endlich aus Indien zurück. Die Beamten packen ihre Büros, die Kolonialverwalter verfassen ihre letzten Berichte und der Union Jack wird von den Regierungsgebäuden herabgelassen. Der Übergang verläuft jedoch alles andere als reibungslos. Fragen zu den Grenzen und der militärischen Kontrolle bleiben ungelöst, was zu einer Verzögerung der endgültigen Unabhängigkeit führt."
GOE_RAJ.30.a:		"Endlich werden wir frei sein."
GOE_RAJ.30.b:		"Nein, uns gefällt es hier"
GOE_RAJ.30_we_are_leaving_tt:		"§Y[RAJ.GetName]§! wird vorübergehend unter unserer Kontrolle bleiben, während wir sie ihre Verwaltung in Ordnung bringen lassen. Aber sie werden sich schließlich befreien."
GOE_RAJ.31.t:		"Preis-Chaos in [RAJ.GetName]"
GOE_RAJ.31.desc:		"Während [RAJ.GetName] versucht, sich von der Großen Depression zu erholen, scheint die Preiskontrolle das Land zu destabilisieren. Die Bindung der Rupie an das Pfund Sterling birgt das Risiko, unsere beiden Länder in wirtschaftliche Turbulenzen zu stürzen.\n Ein Konglomerat von Privatpersonen ist mit dem Vorschlag an uns herangetreten, den Raj in zwei Teile aufzuspalten, um die finanzielle Belastung des Staates zu verringern. Ein Teil unter privater Kontrolle, der andere unter der Kontrolle der Krone. Wenn wir nichts tun, riskieren wir ein noch schlechteres Ergebnis."
GOE_RAJ.31.a:		"Wir müssen"
GOE_RAJ.31.a_tt:		"Die Ostindien-Kompanie wird gegründet und übernimmt Teile von Indien."
GOE_RAJ.31.b:		"Niemals"
GOE_RAJ.32.t:		"Die Frage von Aden"
GOE_RAJ.32.desc:		"Wie von der [ENG.GetAdjective]-Regierung geplant, sollen wir die Provinz Aden an sie übergeben, aber wir könnten wahrscheinlich darauf drängen, sie zu behalten, wenn wir dies wünschen."
GOE_RAJ.32.a:		"Übergeben Sie sie"
GOE_RAJ.32.b:		"Behalten"
GOE_RAJ.32.b_tt:		"Wir werden die Kontrolle über §Ydie Provinz Aden§! behalten, so dass wir den Schwerpunkt §YHandelshafen§! abschließen können"
GOE_RAJ.33.t:		"Aufstand im Nordwesten Indiens!"
GOE_RAJ.33.desc:		"Eine Gruppe, die behauptet, die rechtmäßigen Erben eines längst untergegangenen Imperiums zu sein, hat im äußersten Nordwesten Indiens den Unabhängigkeitskrieg erklärt und unzufriedene Fraktionen unter ihrem Banner versammelt. Während der größte Teil Indiens unter Kontrolle bleibt, bedroht diese Rebellion die Stabilität. Wird dies eine Fußnote in der Geschichte sein oder die Rückkehr eines Imperiums?"
GOE_RAJ.33.a:		"Das wird nicht standhalten"
GOE_RAJ.33.b_tt:		"Der Verlust der Kontrolle über Gujarat und Delhi wird einen weißen Frieden erzwingen"
GOE_RAJ.33.b:		"Wir haben andere Sorgen"
GOE_RAJ.33.c:		"Auf den Sieg!"
GOE_RAJ_33_c_tt:		"§A Wir müssen 1 Jahr lang überleben, bis ein Waffenstillstand angeboten wird. Wenn wir [440.GetName], [988.GetName], [442.GetName] und [439.GetName] zum Zeitpunkt des Waffenstillstandes besetzen, werden wir größere territoriale Zugeständnisse erhalten!§!"
GOE_RAJ.34.t:		"[UK_INDIA.GetName] Verwaltung bricht zusammen"
GOE_RAJ.34.desc:		"Katastrophe in der [UK_INDIA.GetName]! Die lokale Verwaltung ist aufgrund des anhaltenden Krieges im Westen zusammengebrochen. Um die Kontrolle über das Land zu behalten, hat sie den Rebellen einen territorialen Kompromiss angeboten. Wir mögen diese Rebellen nicht anerkennen, aber der Krieg ist vorerst verloren."
GOE_RAJ.34.a:		"Eine Katastrophe!"
GOE_RAJ.35.t:		"[ENG.GetName] lässt uns gehen"
GOE_RAJ.35.desc:		"Ohne einen Schuss abzugeben, ist der Raj nicht mehr da. Wir haben seine Kontrolle über Indien gefestigt, und die Regierung Seiner Majestät ist der Lasten des Imperiums überdrüssig und hat sich entschieden, nicht einzugreifen."
GOE_RAJ.35.a:		"Das war unerwartet"
GOE_RAJ_famine.1.t:		"Ausbruch der Braunfleckenkrankheit in [?global.famine_state.GetName]"
GOE_RAJ_famine.1.desc:		"Die Braunfleckenkrankheit wurde in [?global.famine_state.GetName] entdeckt. Die Behörden sind besorgt, dass sich diese Pilzkrankheit weiter ausbreiten und die Winterernte beeinträchtigen könnte."
GOE_RAJ_famine.1.a:		"Oje"
GOE_RAJ_famine.2.t:		"Wirbelsturm trifft [?global.famine_state.GetName]"
GOE_RAJ_famine.2.desc:		"Ein großer Zyklon, gefolgt von mehreren Stürmen, hat [?global.famine_state.GetName] getroffen. Die Schäden sind zwar beträchtlich, aber die Braunfleckenkrankheit breitet sich zusätzlich in einem größeren Gebiet aus, was die Auswirkungen des Pilzes noch verschlimmert."
GOE_RAJ_famine.2.a:		"Das war's dann wohl"
GOE_RAJ_famine.3.t:		"Unzuverlässige Erntevorhersagen"
GOE_RAJ_famine.3.desc:		"Die offiziellen Prognosen für die Ernteerträge in diesem Jahr sagen einen erheblichen Rückstand voraus. Es ist jedoch allgemein bekannt, dass diese Prognosen in der Vergangenheit falsch waren."
GOE_RAJ_famine.3.a:		"Hoffentlich liegen sie wieder falsch."
GOE_RAJ_famine.4.t:		"Provinzielle Handelsschranken"
GOE_RAJ_famine.4.desc:		"Die indischen Provinzen und Fürstentümer haben aus Angst vor steigenden Lebensmittelpreisen begonnen, Handelsschranken zwischen den Provinzen zu errichten. Diese Handelsschranken bergen die Gefahr, dass die Lebensmittelpreise weiter in die Höhe getrieben werden, da die Provinzen immer mehr isoliert werden."
GOE_RAJ_famine.4.a:		"Das Vertriebsnetz für Lebensmittel wird abgewürgt."
GOE_RAJ_famine.5.t:		"Preischaos in [?global.famine_state.GetName]"
GOE_RAJ_famine.5.desc:		"Da die Getreidepreise gestiegen sind, hat die lokale Regierung versucht, die Preise zu kontrollieren, um der Bevölkerung zu helfen. Leider hat dies nur dazu geführt, dass große Mengen an Getreide auf dem Schwarzmarkt verschwunden sind oder in großen Lagerhäusern gelagert wurden. Die lokale Regierung hat die Maßnahmen bereits gelockert, aber es herrscht immer noch der weit verbreitete Glaube, dass es ein großes Defizit an Getreide gibt, was zu einer zügellosen Inflation führt."
GOE_RAJ_famine.5.a:		"Dies wird immer schlimmer"
GOE_RAJ_famine.6.t:		"Vorrangige Verteilung in [?global.famine_state.GetName]"
GOE_RAJ_famine.6.desc:		"Die lokale Regierung hat ein Programm zur vorrangigen Versorgung der oberen und mittleren Bevölkerungsschichten genehmigt, die für die Schwerindustrie des Staates wichtig sind und westlichen Werten und der Modernisierung positiv gegenüberstehen. Dies hat die Lebensmittelpreise weiter in die Höhe getrieben."
GOE_RAJ_famine.6.a:		"..."
GOE_RAJ_famine.7.t:		"Zustand der Hungersnot in [?global.famine_state.GetName]"
GOE_RAJ_famine.7.desc:		"In [?global.famine_state.GetName] sind Massenunruhen ausgebrochen. Der Mangel an Grundnahrungsmitteln hat die große Landbevölkerung auf der Suche nach Hilfe in die überfüllten Städte getrieben."
GOE_RAJ_famine.7.a:		"Das ist nicht gut."
GOE_RAJ_famine.7.tt:		"§YDie Hungersnot könnte sich jeden Monat auf die angrenzenden Staaten ausbreiten, wenn keine Präventivmaßnahmen ergriffen werden\nDie Entscheidungskategorie Hungersnot wird freigeschaltet."
GOE_RAJ_famine.9.t:		"[FROM.Getname] bittet um Hungersnothilfe"
GOE_RAJ_famine.9.tt:		"Aktiviert §YFamine§!Entscheidungen"
GOE_RAJ_famine.9.desc:		"[FROM.Getname] sieht sich mit einer sich verschlechternden Situation konfrontiert, in der sich ein Teil seines Landes im Zustand der Hungersnot befindet. Die Regierung bittet die internationale Gemeinschaft um jede Hilfe, die sie entbehren kann, um das Leid zu lindern und die Notlage zu beenden."
GOE_RAJ_famine.9.a:		"Tut mir leid, alter Knabe. Wir können nichts entbehren."
GOE_RAJ_famine.9.b:		"Wir werden eine große Menge an Hilfe schicken"
GOE_RAJ_famine.9.c:		"Wir werden eine kleine Menge an Hilfe schicken"
GOE_RAJ_famine.10.t:		"[FROM.GetName] verweigert uns die Hilfe"
GOE_RAJ_famine.10.desc:		"[FROM.GetName] hat uns mitgeteilt, dass es uns keine Hilfe zukommen lassen wird. Es lehnt die Vorstellung ab, dass es in einer solchen weltweiten Krise irgendeine Verpflichtung gegenüber unserem Staat hat."
GOE_RAJ_famine.10.a:		"Kaltherzige Narren"
GOE_RAJ_famine.11.t:		"[FROM.GetName] bietet ein großes Hilfspaket an"
GOE_RAJ_famine.11.desc:		"[FROM.GetName] hat uns großzügig ein großes Hilfspaket zur Verfügung gestellt, um die Hungersnot zu lindern und ihre weitere Ausbreitung auf die Nachbarstaaten zu verhindern."
GOE_RAJ_famine.11.a:		"Großartig!"
GOE_RAJ_famine.12.t:		"[FROM.GetName] Bietet ein kleines Hilfspaket an"
GOE_RAJ_famine.12.desc:		"[FROM.GetName] hat uns ein kleines Hilfspaket zur Verfügung gestellt, um die Hungersnot zu lindern und ihre weitere Ausbreitung auf die Nachbarstaaten zu verhindern. Sie könnten sicherlich mehr tun, aber das ist besser als nichts."
GOE_RAJ_famine.12.a:		"Gut!"
GOE_RAJ_famine.13.t:		"Die [?global.famine_state.GetName] Hungersnot Peters ist vorbei"
GOE_RAJ_famine.13.desc:		"Das Schlimmste der Hungersnot scheint vorbei zu sein. Eine gute Ernte hat das Schlimmste gemildert und die Lebensmittelpreise sinken wieder. Es wird zwar noch eine Weile dauern, bis wieder ein Gefühl der Normalität einkehrt, aber es ist ein erster Schritt zur Heilung der Region.\nAngesichts der großen Tragödie, die sich ereignet hat, müssen wir uns fragen, was der wahre Preis des Sieges ist."
GOE_RAJ_famine.13.a:		"Miles hat mit dem Schmerz des Volkes gewonnen."
goe_japan.1.t:		"Bose bietet Unterstützung für die Burma-Kampagne an"
goe_japan.1.desc:		"Subhas Chandra Bose, der Anführer der Indischen Nationalarmee, ist mit einem Angebot an uns herangetreten. Seine Streitkräfte sind bereit, unseren Vormarsch nach [BRM.GetName] zu unterstützen. Er sieht darin den ersten Schritt zur Befreiung Indiens von der [ENG.GetAdjective]-Herrschaft und glaubt, dass wir durch einen Angriff auf Burma das britische Raj schwächen können. Seine Männer sind hartgesottene Nationalisten, und ihre Kenntnisse des Terrains könnten sich als unschätzbar erweisen. Akzeptieren wir?"
goe_japan.1.a:		"Ja, natürlich"
goe_japan.1.b:		"Nein"
RAJ_famine_scripted_timeframe_reveal:		"[GetFamineTimeframe]\n$RAJ_famine_prevention_stats$"
RAJ_famine_scripted_timeframe_reveal_desc:		"Wir haben festgestellt, dass die Hungersnot noch §Y[?RAJ_famine_spread_times]§! Monate andauern wird."
RAJ_famine_scripted_timeframe_non_reveal_desc:		"Wir erwarten, dass die Hungersnot §Y[?RAJ_famine_spread_times_min]§! - §Y[?RAJ_famine_spread_times_max]§! weitere Monate andauern wird."
RAJ_famine_risk_scripted_gui_desc:		"Die Wahrscheinlichkeit, dass Präventivmaßnahmen die Ausbreitung der Hungersnot auf benachbarte Staaten verhindern: §G[?RAJ_famine_shield]%§!\nRisiko der Ausbreitung der Hungersnot: §R[?RAJ_famine_spreads]%§!"
RAJ_famine_prevention_stats:		"Unsere Präventivmaßnahmen haben \n- die Ausbreitung der Hungersnot gestoppt: §Y[?RAJ_times_shield_has_blocked_spread]§! mal\n-Verkürzte die Dauer der Hungersnot um: §Y[?RAJ_famine_reduction_from_shield]§! Monate"
RAJ_famine_shield_tt:		"Chance, dass Präventivmaßnahmen die Ausbreitung der Hungersnot stoppen: §G+$RIGHT|0$%§!"
RAJ_partition_1.t:		"Protest in [FROM.GetName] artet in Gewalt aus."
RAJ_partition_1.desc:		"Was als ziviler Protest begann, endete in Gewalt, als lokale Polizeikräfte gegen die entrechtete Bevölkerung vorgingen. Die [ENG.GetAdjective] Polizei behauptet, sie habe unter Androhung von Gewalt gehandelt, während die Demonstranten darauf beharren, dass sie sich strikt an die Gewaltlosigkeit gehalten haben. Niemand wurde getötet, aber 2 lokale Beamte erlitten leichte Verletzungen und 1 Demonstrant wurde mit einer Gehirnerschütterung in das örtliche Krankenhaus gebracht."
RAJ_partition_1.a:		"Nicht hinnehmbar."
GOE_RAJ_partition.2.t:		"Weitverbreitete Proteste in [?unrest_target_state.GetName]"
GOE_RAJ_partition.2.desc:		"In [?unrest_target_state.GetName] sind Proteste gegen die Herrschaft von [ENG.GetAdjective] ausgebrochen. Die örtlichen Polizeibehörden berichten von eskalierenden gewalttätigen Zusammenstößen zwischen Demonstranten und Behörden."
GOE_RAJ_partition.2.a:		"Die Polizei muss sich zurückhalten."
GOE_RAJ_partition.2.b:		"Lösen Sie die Menge auf."
GOE_RAJ_partition.3.t:		"Unruhen in [?unrest_target_state.GetName]"
GOE_RAJ_partition.3.desc:		"Die Spannungen in [?unrest_target_state.GetName] haben ein kritisches Niveau erreicht, da die örtliche Polizei darum kämpft, die zunehmend unruhigen Menschenmengen einzudämmen. Fabriken, die mit der Regierung verbunden sind, sind zu Hauptzielen der Aufwiegler geworden. Inmitten der eskalierenden Unruhen kommt es häufig zu Sabotageakten."
GOE_RAJ_partition.3.a:		"Setzen Sie die Nationalgarde ein"
GOE_RAJ_partition.3.b:		"Versuchen Sie, mit den Unruhestiftern zu schlichten"
GOE_RAJ_partition.4.t:		"Religiöse Gewalt"
GOE_RAJ_partition.4.desc:		"Während die Unabhängigkeitsbestrebungen an Schwung gewinnen, zeichnet sich eine tiefe und wachsende Kluft ab. Die Hindus, die entschlossen sind, ein geeintes Indien zu bewahren, geraten zunehmend in Konflikt mit den Muslimen, die aus Angst vor einer Marginalisierung in einem mehrheitlich von Hindus bewohnten Staat die Schaffung eines separaten Heimatlandes fordern. Diese eskalierenden Spannungen haben gewaltsame Zusammenstöße zwischen extremistischen Gruppierungen beider Gemeinschaften ausgelöst und die Stabilität des Landes ernsthaft gefährdet."
GOE_RAJ_partition.4.a:		"Ist das unsere Schuld?"
GOE_RAJ_partition.4.b:		"Kampagne zum Abbau der Spannungen "
GOE_RAJ_partition.4.c:		"Inhaftieren Sie die Aufwiegler"
GOE_RAJ_partition_become_free_to_stop_the_chaos_tt:		"Wir müssen damit rechnen, dass die Instabilität anhält, bis wir die Unabhängigkeit erlangen"
GOE_RAJ_partition.5.t:		"Zusammenstöße zwischen Hindus und Muslimen"
GOE_RAJ_partition.5.desc:		"Da die Stimmen der Muslime in [GetRajName] immer lauter werden, die ein eigenes, von Indien getrenntes Heimatland fordern, sind Hindu-Nationalisten auf die Straße gegangen, um gegen den wachsenden Einfluss der Muslime im Land zu protestieren, was häufig zu gewaltsamen Zusammenstößen führt."
GOE_RAJ_partition.5.a:		"Die Situation entwickelt sich ..."
GOE_RAJ_partition.5.b:		"Verstärkte Polizeibemühungen"
GOE_RAJ_partition.6.t:		"Rendezvous mit dem Schicksal"
GOE_RAJ_partition.6.desc:		"Vor vielen Jahren haben wir ein Rendezvous mit dem Schicksal geschlossen, und nun ist die Zeit gekommen, in der wir unser Versprechen einlösen werden, zwar nicht ganz oder in vollem Umfang, aber doch ganz erheblich. Wenn die Mitternachtsstunde schlägt, wenn die Welt schläft, wird Indien zu Leben und Freiheit erwachen. Es kommt ein Moment, der in der Geschichte nur selten vorkommt, in dem wir vom Alten zum Neuen aufbrechen, in dem ein Zeitalter endet und in dem die Seele einer Nation, die lange unterdrückt wurde, zum Ausdruck kommt"
GOE_RAJ_partition.6.a:		"Wir alle, egal welcher Religion wir angehören, sind gleichermaßen die Kinder Indiens."
GOE_RAJ_partition.7.t:		"Eine Frage der Führerschaft"
GOE_RAJ_partition.7.desc:		"Während unsere Nation ein von Unterdrückung geprägtes Kapitel abschließt, beginnt ein neues Kapitel der Selbstbestimmung "
GOE_RAJ_partition.7.a:		"Nehru ist die klare Wahl"
GOE_RAJ_partition.7.b:		"Der Mann, der so viel geopfert hat, Gandhi"
GOE_RAJ_partition.7.c:		"Jinnah verdient eine Chance"
GOE_RAJ_partition.7.d:		"Louis Mountbatten, wir brauchen immer noch ihre Hilfe"
GOE_RAJ_partition.8.t:		"Gandhi überlebt Attentatsversuch."
GOE_RAJ_partition.8.desc:		"Ein Mann, der als Nathuram Godse identifiziert wurde, versuchte während eines multireligiösen Gebetstreffens ein Attentat auf Mahatma Gandhi zu verüben, wurde jedoch von Mitgliedern der Leibwache des Präsidenten festgenommen, bevor er seine Waffe abfeuern konnte.\nGandhi ist in Sicherheit und wurde in ein sicheres Gebiet gebracht; Sprecher sagten, dass er von der Tortur erschüttert war und offenbar tief über den zukünftigen Zustand der Welt und seinen Platz darin nachgedacht hat."
GOE_RAJ_partition.8.a:		"Was mag er in dem dunklen Abgrund gesehen haben?"
GOE_RAJ_partition.9.t:		"[ENG.GetName] bereitet sich darauf vor, sich zu engagieren"
GOE_RAJ_partition.9.desc:		"[ENG.GetName] hat seine tiefe Besorgnis über die Feindseligkeiten auf dem indischen Subkontinent zum Ausdruck gebracht. Ihre Regierung hat uns gegenüber deutlich gemacht, dass sie nicht will, dass beide Länder in einen blutigen Krieg verwickelt werden, und dass sie, wenn nötig, mit Gewalt eingreifen wird, um ihn zu beenden."
GOE_RAJ_partition.9.a:		"Wir haben nur wenig Zeit"
GOE_RAJ_partition.10.t:		"Krieg auf dem indischen Subkontinent"
GOE_RAJ_partition.10.desc:		"Auf dem indischen Subkontinent ist ein Krieg ausgebrochen. Da wir erheblichen Einfluss auf beide Länder haben, wäre es vielleicht angebracht, einzugreifen und diesem Wahnsinn ein Ende zu setzen."
GOE_RAJ_partition.10.a:		"Wir haben keine Zeit"
GOE_RAJ_partition.10.b:		"Wir müssen dem Ganzen ein Ende setzen"
GOE_RAJ_eic.2.t:		"Ernennen Sie einen CEO"
GOE_RAJ_eic.2.desc:		"Ein Unternehmen braucht eine starke Hand, um sein Wachstum zu lenken, und wir müssen eine Führungspersönlichkeit auswählen, die die höchste Investitionsrendite erzielt. Ihre Persönlichkeit wird sich auf den Rest der Führungsgruppe auswirken, daher ist es wichtig, dass wir dies richtig machen."
GOE_RAJ_eic.2.a:		"Sie müssen flexibel sein"
GOE_RAJ_eic.2.b:		"Sie müssen genügsam sein"
GOE_RAJ_eic.2.c:		"Sie müssen gute Beziehungen zur Regierung haben"
GOE_RAJ_eic.2.d:		"Sie müssen rücksichtslos sein"
GOE_RAJ_eic.3.t:		"[RAJ.GetName] fordert, dass wir uns den Opiumhandel zu eigen machen"
GOE_RAJ_eic.3.desc:		"[FROM.GetName] fordert, dass wir Opium frei zwischen unseren Ländern fließen lassen. Wenn die Menschen bereit sind, dafür zu bezahlen, wer sind wir dann, ihnen ihr Recht auf Konsum zu verweigern? Es mag moralisch falsch sein und dem Einzelnen schaden, aber wer sind wir, sie daran zu hindern, wenn sie bereit sind zu zahlen?  Das einzige Problem ist, dass die [FROM.GetAdjective] Regierung auch einen Vertragshafen fordert, um die...Waren weiter zu verbreiten."
GOE_RAJ_eic.3.a:		"Sind die denn verrückt geworden?"
GOE_RAJ_eic.3.b:		"Lasst den blauen Lotus fließen"
GOE_RAJ_eic.4.t:		"[FROM.GetName] weigert sich rundheraus"
GOE_RAJ_eic.4.desc:		"[FROM.GetName] lehnt unsere Forderungen rundheraus ab und erinnert uns daran, dass sie ein souveränes Land mit eigenen Gesetzen sind. Die Tatsache, dass wir versuchen würden, ihnen unsere Forderungen aufzuzwingen, grenzt an Blasphemie."
GOE_RAJ_eic.4.a:		"Wir haben es mit dem Zuckerbrot versucht, jetzt kommt die Peitsche."
GOE_RAJ_eic.5.t:		"[FROM.GetName] stimmt zu"
GOE_RAJ_eic.5.desc:		"[FROM.GetName] hat zugestimmt, große Mengen Opium zwischen unseren Ländern zu handeln. Mit dem neuen Vertragshafen sind wir in der Lage, die Ware direkt in die ganze Welt zu verteilen. Dieser Konsum soll Freunde und Feinde näher zusammenbringen."
GOE_RAJ_eic.5.a:		"Ein Deal ohne grobe Schnörkel"
GOE_RAJ_eic.6.t:		"[RAJ.GetName] möchte [RAJ_i_want_to_buy_this_land.GetName] kaufen"
GOE_RAJ_eic.6.desc:		"[RAJ.GetName], der seine Geschäftstätigkeit ausweiten möchte, hat uns ein Angebot unterbreitet, [RAJ_i_want_to_buy_this_land.GetName] im Austausch für eine beträchtliche Investition in unserem Land zu erwerben."
GOE_RAJ_eic.6.a:		"Wir sind nicht bereit, dieses Land zu verkaufen."
GOE_RAJ_eic.6.a_tt:		"[FROM.GetName] wird diesen Staat nicht mehr beantragen können, kann aber andere Staaten beantragen."
GOE_RAJ_eic.6.b:		"Niemals"
GOE_RAJ_eic.6.b_tt:		"[FROM.GetName] wird kein weiteres Land von uns anfordern können"
GOE_RAJ_eic.6.c:		"Klingt wie ein Deal "
GOE_RAJ_eic.7.t:		"[FROM.GetName] ist nicht bereit, sich von seinem Land zu trennen"
GOE_RAJ_eic.7.desc:		"[FROM.GetName] ist nicht bereit, sich von diesem Grundstück zu trennen, schließt aber für die Zukunft andere Möglichkeiten für andere Landübertragungen nicht aus."
GOE_RAJ_eic.7.a:		"Sie werden schon noch kommen"
GOE_RAJ_eic.8.t:		"[FROM.GetName] schließt jede Übertragung aus"
GOE_RAJ_eic.8.desc:		"[FROM.GetName] hat jegliche Übertragung von Land an uns ausgeschlossen und erklärt, dass es ein Affront gegen den Anstand ist, so etwas auch nur vorzuschlagen."
GOE_RAJ_eic.8.a:		"Ungewöhnliche Haltung"
GOE_RAJ_eic.9.t:		"[FROM.GetName] akzeptiert"
GOE_RAJ_eic.9.desc:		"[FROM.GetName] hat den Handel akzeptiert. Wir werden ihnen das Geld in Kürze überweisen und die Übertragung der Vermögenswerte steht unmittelbar bevor."
GOE_RAJ_eic.9.a:		"Großartige Geschäfte!"
GOE_RAJ_princely.1.t:		"Wählen Sie einen Prinzen als Anführer [ROOT.GetNameDef]"
GOE_RAJ_princely.1.desc:		"Das historische Reich von Babur war riesig und wohlwollend und beherrschte den Subkontinent viele hundert Jahre lang. Es liegt noch viel Arbeit vor uns, wenn wir diesem Erbe gerecht werden wollen. Obwohl viele aus der Gurkani-Linie überleben, kann nur einer uns zu Ruhm und Ehre führen."
GOE_RAJ_princely.1.a:		"Mir Osman Ali Khan wird unser Reich zu Größe führen."
GOE_RAJ_princely.1.b:		"Mirza Khurshid Jah Bahadur ist die vernünftigste Option"
GOE_RAJ_princely.1.c:		"Ahmad Yar Khan wird uns beschützen!"
GOE_RAJ_princely.1.d:		"Huseyn Shaheed Suhrawardy wird uns in die Zukunft führen!"
GOE_RAJ_princely.2.t:		"Wählen Sie einen Prinzen als Anführer [ROOT.GetNameDef]"
GOE_RAJ_princely.2.desc:		"$GOE_RAJ_princely.1.desc$"
GOE_RAJ_princely.2.a:		"Huseyn Shaheed Suhrawardy wird uns in die Zukunft führen!"
GOE_RAJ_princely.2.b:		"Maharaja Hari Singh hat den Willen des Volkes!"
GOE_RAJ_princely.2.c:		"Bodh Chandra Singh ist unser größter Stratege!"
GOE_RAJ_princely.2.d:		"Keiner von ihnen ist gut genug."
GOE_RAJ_princely.3.t:		"Wählen Sie einen Prinzen als Anführer [ROOT.GetNameDef]"
GOE_RAJ_princely.3.desc:		"$GOE_RAJ_princely.1.desc$"
GOE_RAJ_princely.3.a:		"Umed Singh hat einen guten Draht zum Volk."
GOE_RAJ_princely.3.b:		"Pratap Singh Rao Gaekwad ist die offensichtliche Wahl!"
GOE_RAJ_princely.3.c:		"Maharaja Jayachamarajendra Wadiyar ist der Beste."
GOE_RAJ_princely.3.d:		"Vielleicht sollten wir die erste Liste noch einmal überdenken."
GOE_RAJ_navy.1.t:		"[RAJ.GetNameDefCap] schlägt ein Flottenabkommen vor"
GOE_RAJ_navy.1.desc:		"[RAJ.GetLeader] hat uns einen Vorschlag für ein Seehandelsabkommen zwischen den Verwaltungen von [RAJ.GetAdjective] und [ENG.GetAdjective] übermittelt. \nDies wird eine gegenseitige Zusammenarbeit bei der Marineproduktion ermöglichen und die Tür für weitere Handelsabkommen in der Zukunft öffnen."
GOE_RAJ_navy.1.a:		"Davon werden wir beide sehr profitieren!"
GOE_RAJ_navy.1.b:		"Wir sind nicht interessiert."
GOE_RAJ_navy.2.t:		"[FROM.GetNameDefCap] Nimmt an!"
GOE_RAJ_navy.2.desc:		"Beamte von [FROM.GetNameDefCap] haben dem vorgeschlagenen Marineabkommen zugestimmt und das Abkommen unterzeichnet. Das wird uns in Zukunft sehr zugute kommen."
GOE_RAJ_navy.2.a:		"Perfekt"
GOE_RAJ_navy.3.t:		"[ENG.GetNameDefCap] lehnt das Handelsabkommen ab."
GOE_RAJ_navy.3.desc:		"Beamte von [FROM.GetNameDefCap] haben unser vorgeschlagenes Marineabkommen abgelehnt, weil es ihnen keinen Nutzen bringt und eindeutig einseitig ist."
GOE_RAJ_navy.3.a:		"Das ist eine Schande."
GOE_RAJ_navy.4.t:		"[RAJ.GetNameDefCap] fordert die Versetzung des Marinekommandanten"
GOE_RAJ_navy.4.desc:		"Beamte von [RAJ.GetNameDefCap] haben uns gebeten, einen unserer Marinekommandeure in die Königlich Indische Marine zu versetzen, um sie bei ihren Bemühungen zu unterstützen, zu expandieren und bei der Ausbildung neuer Marinesoldaten zu helfen. Das ist ein kostspieliges Unterfangen, aber sie bieten eine saftige Bezahlung."
GOE_RAJ_navy.4.a:		"Das Opfer ist es wert."
GOE_RAJ_navy.4.b:		"Unter keinen Umständen werden wir dem zustimmen!"
GOE_RAJ_navy.5.t:		"[ENG.GetNameDefCap] Nimmt an!"
GOE_RAJ_navy.5.desc:		"Beamte von [FROM.GetNameDefCap] haben sich bereit erklärt, einen ihrer Kommandeure nach [RAJ.GetNameDefCap] zu schicken, um uns bei der Expansion der Marine zu unterstützen."
GOE_RAJ_navy.5.a:		"Perfekt"
GOE_RAJ_navy.6.t:		"[ENG.GetNameDefCap] hat das Angebot abgelehnt."
GOE_RAJ_navy.6.desc:		"Die Beamten von [FROM.GetNameDefCap] haben sich geweigert, einen ihrer Kommandeure nach [RAJ.GetNameDefCap] zu schicken, und bestehen darauf, dass wir stattdessen unsere eigenen Kommandeure ausbilden."
GOE_RAJ_navy.6.a:		"Das ist eine Schande."
GOE_RAJ_navy.7.t:		"[RAJ.GetNameDefCap] fordert den Kauf unserer ausgemusterten Schiffe"
GOE_RAJ_navy.7.desc:		"[FROM.GetLeader] hat um den Kauf unserer alten, ausgemusterten Schiffe gebeten. Sie werden derzeit nicht genutzt, aber [FROM.GetLeader] besteht darauf, dass [FROM.GetNameDefCap] sie nutzen kann. Sie bieten eine saftige Zahlung"
GOE_RAJ_navy.7.a:		"Es ist ja nicht so, dass wir sie sowieso benutzen würden!"
GOE_RAJ_navy.7.b:		"Wir sind nicht interessiert."
GOE_RAJ_navy.8.t:		"[ENG.GetNameDefCap] nimmt unser Handelsangebot an!"
GOE_RAJ_navy.8.desc:		"[FROM.GetLeader] hat unsere Anfrage zum Kauf ihrer ausgemusterten Schiffe angenommen. Sie sollten in Kürze in Indien eintreffen."
GOE_RAJ_navy.8.a:		"Das sind großartige Neuigkeiten für die Royal Indian Navy!"
GOE_RAJ_navy.9.t:		"[ENG.GetNameDefCap] hat das Angebot abgelehnt."
GOE_RAJ_navy.9.desc:		"[FROM.GetLeader] hat unser Angebot, ihre Schiffe zu kaufen, abgelehnt, und wir müssen nun eine Alternative finden, um unsere Marine zu erweitern."
GOE_RAJ_navy.9.a:		"Das ist eine Schande."
GOE_RAJ_navy.10.t:		"[RAJ.GetNameDefCap] fordert Rechte an modernen Schiffsverträgen."
GOE_RAJ_navy.10.desc:		"Beamte von [RAJ.GetNameDefCap] haben darum gebeten, die Rechte an unseren modernen Schiffskontrakten zu erwerben, und fordern das Recht, unsere 1936er Kreuzer für die Royal Indian Navy zu entwickeln. Sie bieten uns an, für die Verträge großzügig zu zahlen."
GOE_RAJ_navy.10.a:		"Eine für beide Seiten vorteilhafte Vereinbarung!"
GOE_RAJ_navy.10.b:		"Wir sind nicht interessiert."
GOE_RAJ_navy.11.t:		"[ENG.GetNameDefCap] erklärt sich bereit, uns moderne Schiffsverträge zu erteilen!"
GOE_RAJ_navy.11.desc:		"Beamte von [ENG.GetNameDefCap] haben auf unsere Anfrage reagiert und zugestimmt, uns verbesserte Schiffsverträge zu gewähren. Wir haben zunächst fünf Kreuzer erhalten, die jetzt eintreffen werden."
GOE_RAJ_navy.11.a:		"Das ist eine großartige Nachricht für die Royal Indian Navy!"
GOE_RAJ_navy.12.t:		"[ENG.GetNameDefCap] hat das Angebot abgelehnt."
GOE_RAJ_navy.12.desc:		"Beamte von [ENG.GetNameDefCap] haben auf unsere Anfrage geantwortet und sich geweigert, uns verbesserte Schiffsverträge zu gewähren, mit der Begründung, unser Angebot sei viel zu niedrig."
GOE_RAJ_navy.12.a:		"Das ist eine Schande."
GOE_RAJ_goa.1.t:		"[RAJ.GetNameDefCap] fordert Goa"
GOE_RAJ_goa.1.desc:		"[RAJ.GetLeader] hat die Rückeroberung von Goa gefordert. [RAJ.GetLeader] besteht darauf, dass Goa [RAJ.GetAdjective] Territorium ist und droht mit militärischen Maßnahmen, wenn wir es nicht an sie aushändigen."
GOE_RAJ_goa.1.a:		"Das ist den potenziellen Konflikt nicht wert."
GOE_RAJ_goa.1.b:		"Ganz und gar nicht. Goa gehört uns!"
GOE_RAJ_goa.2.t:		"[FROM.GetNameDefCap] gibt Goa frei"
GOE_RAJ_goa.2.desc:		"[FROM.GetLeader] hat beschlossen, die Angelegenheit fallen zu lassen und uns zu erlauben, Goa zu annektieren, um einen Konflikt zu vermeiden."
GOE_RAJ_goa.2.a:		"Goa gehört uns!"
GOE_RAJ_goa.3.t:		"[FROM.GetNameDefCap] lehnt die Übertragung von Goa ab"
GOE_RAJ_goa.3.desc:		"[FROM.GetLeader] ist auf unsere Forderungen eingegangen und hat uns das Recht auf Goa trotz unserer Drohungen mit militärischen Aktionen verweigert."
GOE_RAJ_goa.3.a:		"Das bedeutet Krieg!"
GOE_RAJ_goa.3.b:		"Wenn ich es mir recht überlege, sollten wir uns zurückziehen."
GOE_RAJ_goa.4.t:		"[RAJ.GetNameDefCap] tritt zurück."
GOE_RAJ_goa.4.desc:		"[RAJ.GetLeader] hat auf unsere Drohungen mit militärischen Aktionen reagiert und [RAJ.GetAdjective] Soldaten wurden aus Goa abgezogen."
GOE_RAJ_goa.4.a:		"Großartig."
GOE_RAJ_generals.1.t:		"Kolonialer Kadettenaustausch"
GOE_RAJ_generals.1.desc:		"[RAJ.GetLeader] hat darum gebeten, [RAJ.GetAdjective] Truppen nach [ENG.GetNameDefCap] zu schicken, um von britischen Soldaten ausgebildet zu werden, und bietet eine saftige Bezahlung für diesen Dienst."
GOE_RAJ_generals.1.a:		"Aber natürlich!"
GOE_RAJ_generals.1.b:		"Wir sind nicht interessiert."
GOE_RAJ_generals.2.t:		"[ENG.GetNameDefCap] nimmt an!"
GOE_RAJ_generals.2.desc:		"[ENG.GetLeader] ist auf unseren Vorschlag eingegangen und hat zugestimmt, dass wir unsere Truppen nach [ENG.GetNameDefCap] schicken."
GOE_RAJ_generals.2.a:		"Großartig!"
GOE_RAJ_generals.3.t:		"[ENG.GetNameDefCap] lehnt unser Angebot ab."
GOE_RAJ_generals.3.desc:		"[ENG.GetLeader] hat auf unseren Vorschlag geantwortet und erklärt, dass sie nicht interessiert sind."
GOE_RAJ_generals.3.a:		"Das ist eine Schande."
