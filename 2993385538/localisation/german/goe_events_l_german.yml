PER_industrial_events.1.t:		"[FROM.GetNameDefCap] bietet Ressourcenrechte an"
PER_industrial_events.1.desc:		"Die Regierung von [PER.GetAdjective] ist heute an uns herangetreten und hat uns Ressourcenrechte für ihr neu erworbenes Öl in $STATE_413$ angeboten. Das fragliche Gebiet ist reich an dieser wichtigen Ressource. Vielleicht ist dieses Angebot eine Überlegung wert?"
PER_industrial_events.1.a:		"Das klingt nach einem guten Geschäft"
PER_industrial_events.1.b:		"Wir haben keinen Bedarf dafür."
PER_industrial_events.2.t:		"[FROM.GetNameDefCap] Nimmt unser Handelsangebot an"
PER_industrial_events.2.desc:		"[FROM.GetNameDefCap] hat unser Angebot bezüglich des neu gewonnenen Öls gnädig angenommen. Dies wird nur dazu dienen, unser riesiges Erdölimperium zu vergrößern."
PER_industrial_events.2.a:		"Es ist einfach ein gutes Geschäft!"
PER_industrial_events.3.t:		"[FROM.GetNameDefCap] Lehnt unser Handelsangebot ab"
PER_industrial_events.3.desc:		"Leider hat [FROM.GetNameDef] unser großzügiges Handelsangebot von [PER.GetAdjective] Öl abgelehnt. Vielleicht ist es besser, wenn wir unsere Geschäfte woanders abwickeln?"
PER_industrial_events.3.a:		"Es ist ihr Verlust!"
PER_imperial_events.1.t:		"[FROM.GetNameDefCap] möchte über Nichtangriffsmaßnahmen verhandeln"
PER_imperial_events.1.desc:		"Heute Morgen traf ein Abgesandter von [PER.Capital.GetCapitalVictoryPointName] in [SOU.Capital.GetCapitalVictoryPointName] ein, mit dem Angebot des Schahs von [PER.GetNameDef], einen Nichtangriffspakt zu unterzeichnen, um die Sicherheit unserer beiden Nationen zu gewährleisten. Angesichts der Nähe von [PER.GetNameDef] zu unseren südlichen Grenzen sollten wir dies in Betracht ziehen."
PER_imperial_events.1.a:		"Wir sind einverstanden. Das ist das Beste für Sie."
PER_imperial_events.1.b:		"Wir können dem nicht zustimmen."
PER_imperial_events.2.t:		"[SOU.GetNameDefCap] stimmt dem Nichtangriffspakt zu"
PER_imperial_events.2.desc:		"Gute Nachrichten! Unser Diplomat ist von [SOU.Capital.GetCapitalVictoryPointName] mit der Nachricht zurückgekehrt, dass [SOU.GetNameDef] sich uns in einem Nichtangriffspakt anschließen möchte. Damit können wir unsere Kriegspläne weiter ausarbeiten, ohne dass sich die lästigen [SOU.GetAdjective] einmischen."
PER_imperial_events.2.a:		"Ausgezeichnete Neuigkeiten."
PER_imperial_events.3.t:		"[SOU.GetNameDefCap] lehnt unser Angebot ab"
PER_imperial_events.3.desc:		"Leider ist es uns nicht gelungen, [SOU.GetNameDef] zur Unterzeichnung eines Nichtangriffspakts zu bewegen. Das bedeutet, dass wir uns vor einer Bedrohung aus dem Norden in Acht nehmen müssen, wenn wir mit unseren Expansionsplänen fortfahren."
PER_imperial_events.3.a:		"Eine unglückliche Wendung der Ereignisse..."
PER_imperial_events.10.t:		"[FROM.GetNameDefCap] Fordert Gebiete in Belutschistan"
PER_imperial_events.10.desc:		"Wir haben heute eine Nachricht vom Schah von [PER.GetNameDef] erhalten, in der er uns auffordert, die Kontrolle über die Region Belutschistan an ihn abzugeben. Nach Ansicht der [PER.GetAdjective]-Regierung gehört dieses Gebiet ihnen mit göttlichem Recht. Wir müssen vorsichtig sein. Wenn wir sie provozieren, könnten sie uns den Krieg erklären."
PER_imperial_events.10.a:		"Wir haben keine andere Wahl, als ihnen nachzugeben."
PER_imperial_events.10.b:		"Vielleicht können wir sie dazu bringen, dafür zu bezahlen?"
PER_imperial_events.10.c:		"Sie können es uns aus unseren kalten, toten Händen nehmen."
PER_imperial_events.11.t:		"[FROM.GetNameDefCap] Einigen sich auf die Abtretung von Belutschistan"
PER_imperial_events.11.desc:		"Großartige Neuigkeiten. [FROM.GetNameDefCap] haben die kluge Entscheidung getroffen, die Gebiete in Belutschistan unter unsere Kontrolle zu stellen. Endlich haben wir in der Indus-Region Fuß gefasst."
PER_imperial_events.11.a:		"Ausgezeichnete Arbeit."
PER_imperial_events.12.t:		"[FROM.GetNameDefCap] bietet an, Belutschistan zu verkaufen"
PER_imperial_events.12.desc:		"Es hat den Anschein, dass die [RAJ.GetAdjective] Regierung nicht darauf erpicht ist, Belutschistan ohne eine Art von Entschädigung aus ihrem Territorium zu entlassen. Wir können entweder auf ihre Forderungen eingehen oder ihnen einfach den Krieg erklären. Sie haben die Wahl."
PER_imperial_events.12.a:		"Gut, wenn wir müssen."
PER_imperial_events.12.b:		"Dann werden wir es mit Gewalt einnehmen."
PER_imperial_events.12.c:		"Das war alles zu riskant. Brechen Sie die Verhandlungen ab."
PER_imperial_events.13.t:		"[FROM.GetNameDefCap] willigt ein, Belutschistan zu kaufen"
PER_imperial_events.13.desc:		"Ausgezeichnete Nachrichten! Der Schah von [PER.GetNameDef] hat zugestimmt, uns für die Übergabe von Belutschistan an ihn zu bezahlen. Wir haben zwar ein kleines Stück unseres Territoriums verloren, aber das Geld wird uns bei unseren eigenen Bemühungen helfen."
PER_imperial_events.13.a:		"Fantastisch!"
PER_imperial_events.14.t:		"[FROM.GetNameDefCap] erklärt den Krieg"
PER_imperial_events.14.desc:		"Ich fürchte, unser Glücksspiel hat sich nicht ausgezahlt, denn nach Erhalt unserer Mitteilung hat der Schah von [PER.GetNameDef] unserem Land offiziell den Krieg erklärt. Seine Truppen bereiten sich darauf vor, den Indus zu stürmen und sich mit Gewalt zu nehmen, was sie wollen. Das ist eine traurige Angelegenheit."
PER_imperial_events.14.a:		"Rufen Sie unsere Truppen zusammen!"
PER_imperial_events.15.t:		"[FROM.GetNameDefCap] macht einen Rückzieher"
PER_imperial_events.15.desc:		"Es scheint, dass [PER.GetNameDef] beschlossen hat, dass der Versuch, uns die Region Belutschistan abzunehmen, das Risiko nicht wert war. Wenigstens können wir vorerst Frieden haben."
PER_imperial_events.15.a:		"Gott sei Dank."
PER_imperial_events.16.t:		"[FROM.GetNameDefCap] Weigert sich, Belutschistan aufzugeben"
PER_imperial_events.16.desc:		"Es scheint, dass die [RAJ.GetAdjective]-Regierung sich strikt weigert, die Gebiete von Belutschistan aufzugeben. Es ist an der Zeit, dass wir bei unseren Waffen bleiben und [RAJ.GetNameDef] den Krieg erklären!"
PER_imperial_events.16.a:		"Dann ist es eben Krieg."
PER_imperial_events.20.t:		"Reza Shah Pahlavi ermordet!"
PER_imperial_events.20.desc:		"Heute Nachmittag ertönten im Zentrum von Teheran Schüsse, als Reza Schah Pahlavi während einer Rede an die Nation von einer Kugel getroffen wurde und sich in einem kritischen Zustand befand. Trotz aller Bemühungen der Rettungskräfte erlag der Schah leider seinen Verletzungen. Es stellte sich heraus, dass es sich bei den Tätern um Offiziere der [PER.GetAdjective] Armee handelte, die mit der Führung des Schahs nicht einverstanden waren. Der Sohn von Reza Schah Pahlavi, Mohammed Reza Pahlavi, soll als neuer Schah von [PER.GetNameDef] vereidigt werden. Hoffen wir, dass seine Herrschaft weniger turbulent sein wird."
PER_imperial_events.20.a:		"Ein trauriger Tag für [PER.GetNameDef]..."
PER_imperial_events.30.t:		"Feierlichkeiten zum Persischen Reich"
PER_imperial_events.30.desc:		"Um die Gründung des antiken Achämenidenreiches durch Kyros den Großen zu feiern, hat der Schah von [PER.GetNameDef] eine opulente Demonstration organisiert, um die antike Zivilisation und Geschichte von [PER.GetNonIdeologyName] hervorzuheben und die zeitgenössischen Fortschritte unter seiner Herrschaft zu präsentieren. Große Staatsoberhäupter aus allen großen Nationen der Welt sind zu dieser Feier eingeladen, aber unter den ärmeren Menschen in [PER.GetNameDef] macht sich schnell Unmut breit, denn sie halten die Vorführung für Geldverschwendung. Aber alle Gäste amüsieren sich prächtig, essen exquisite Speisen und werden Zeugen einer großen Militärparade."
PER_imperial_events.30.a:		"Was für eine exquisite Zeit!"
PER_imperial_events.40.t:		"Die Wahl eines Shahbanu"
PER_imperial_events.40.desc:		"In seiner Zeit, in der er sich auf die Übernahme des Schahsamtes vorbereitete, hatte Mohammed Reza Pahlavi reichlich Gelegenheit, nach Liebe zu suchen. Es gibt drei Frauen, die ihm aufgefallen sind, aber nur eine kann zur Schahbanu gekrönt werden und an seiner Seite als Regentin von [PER.GetNameDef] regieren. Da ist Fawzia von Ägypten, eine Prinzessin eines Sultans; Iran Teymourtash, die erste Schwärmerei des Schahs; und Irandokht, eine ehemalige Qajar-Prinzessin, die den Schah in der Schweiz kennengelernt hat."
PER_imperial_events.40.a:		"Der Schah soll Fawzia von Ägypten heiraten"
PER_imperial_events.40.b:		"Der Schah wird Iran Teymourtash heiraten"
PER_imperial_events.40.c:		"Der Schah soll Irandokht Qajar heiraten"
PER_imperial_events.50.t:		"Reza Schah Pahlavi überlebt Attentat!"
PER_imperial_events.50.desc:		"Heute Nachmittag fielen im Zentrum von Teheran Schüsse, als Reza Schah Pahlavi während einer Rede an die Nation bei einem vereitelten Attentatsversuch beinahe von einer Kugel getroffen wurde. Die Täter wurden sofort festgenommen und entpuppten sich als Offiziere der [PER.GetAdjective] Armee, die mit der Führung des Schahs nicht einverstanden waren. Der Schah hat dieses Attentat genutzt, um das Volk für seine Sache zu gewinnen."
PER_imperial_events.50.a:		"Gott sei Dank ist das gut so! "
PER_imperial_events.60.t:		"[FROM.GetNameDefCap] Möchte über Nichtangriffsmaßnahmen verhandeln"
PER_imperial_events.60.desc:		"Heute Morgen ist ein Gesandter von [PER.Capital.GetCapitalVictoryPointName] in [GER.Capital.GetCapitalVictoryPointName] eingetroffen und hat das Angebot des Schahs von [PER.GetNameDef] erhalten, einen Nichtangriffspakt zu unterzeichnen, um die Sicherheit unserer beiden Nationen zu gewährleisten. Angesichts der enormen Produktion von [PER.GetNameDef] an lebenswichtigen Ressourcen wie Öl sollten wir dies in Betracht ziehen."
PER_imperial_events.60.a:		"Wir sind einverstanden. Das ist das Beste für uns."
PER_imperial_events.60.b:		"Wir können dem nicht zustimmen."
PER_imperial_events.61.t:		"[GER.GetNameDefCap] stimmt dem Nichtangriffspakt zu"
PER_imperial_events.61.desc:		"Gute Nachrichten! Unser Diplomat ist von [GER.Capital.GetCapitalVictoryPointName] mit der Nachricht zurückgekehrt, dass [GER.GetNameDef] sich uns in einem Nichtangriffspakt anschließen möchte. In Anbetracht der Ziele von [GER.GetNameDef] ist dies das Beste, was wir tun können, um die Sicherheit unseres Landes zu gewährleisten."
PER_imperial_events.61.a:		"Ausgezeichnete Nachrichten."
PER_imperial_events.62.t:		"[GER.GetNameDefCap] lehnt unser Angebot ab"
PER_imperial_events.62.desc:		"Leider ist es uns nicht gelungen, [GER.GetNameDef] zur Unterzeichnung eines Nichtangriffspakts zu bewegen. Das ist schade, aber es könnte uns trotzdem erlauben, ihrer Fraktion in Zukunft beizutreten."
PER_imperial_events.62.a:		"Eine unglückliche Wendung der Ereignisse... "
PER_imperial_events.70.t:		"Reza Shah Pahlavi wünscht einen Besuch [GER.GetNameDef]"
PER_imperial_events.70.desc:		"Wir haben heute Morgen einen Brief erhalten, der uns direkt aus dem Palast von Sa'dabad in Teheran geschickt wurde, [PER.GetNameDef]. Es war eine Botschaft des guten Willens von Reza Schah Pahlavi selbst, der sein Interesse an einem Besuch in Berlin bekundete, in der Hoffnung, die Beziehungen zwischen unseren beiden Nationen zu verbessern. Der Führer war bestrebt, [PER.GetNameDef] auf gutem Fuß zu halten. Was sollten wir tun?"
PER_imperial_events.70.a:		"Ein angenehmes Angebot. Sprechen Sie die Einladung aus."
PER_imperial_events.70.b:		"Wir haben keine Zeit für solche Frivolitäten."
PER_imperial_events.71.t:		"[GER.GetNameDefCap] Erweitert die Einladung zum Besuch"
PER_imperial_events.71.desc:		"Als Antwort auf unseren Brief des guten Willens an [GER.GetNameDef] hat [GER.GetLeader] Interesse an einem Besuch in Berlin bekundet, in der Hoffnung, die Beziehungen zwischen unseren neuen Nationen zu verbessern. Es muss eine kurze Reise sein, da wir in Teheran viel zu tun haben, aber angesichts der angespannten Weltlage würde es sich lohnen, [GER.GetNameDef] auf unserer Seite zu haben."
PER_imperial_events.71.a:		"Ich habe gehört, dass das Brandenburger Tor um diese Jahreszeit wunderschön ist!"
PER_imperial_events.72.t:		"[GER.GetNameDefCap] ist zu beschäftigt, um Gastgeber zu sein"
PER_imperial_events.72.desc:		"Als Antwort auf unseren Brief des guten Willens an [GER.GetNameDef] hat [GER.GetLeader] unser Angebot, Berlin zu besuchen, leider abgelehnt. Das ist schade, denn es wäre wahrscheinlich eine gute Gelegenheit gewesen, mit einem mächtigen Staatsoberhaupt auf Tuchfühlung zu gehen. Aber leider hat es nicht geklappt."
PER_imperial_events.72.a:		"Nun gut, dann zurück an die Arbeit."
PER_imperial_events.80.t:		"Die Lage in [PER.GetNameDef]"
PER_imperial_events.80.desc:		"Leider hat der jüngste Vorstoß der [PER.GetAdjective]-Armee zu zahlreichen Verlusten auf unserer Seite geführt, zumal sie die Kontrolle über eine Reihe unserer Regionen behauptet. Die Situation in [PER.GetNameDef] hat sich für uns ungünstig entwickelt, und wir sollten in Erwägung ziehen, unsere Verluste zu konsolidieren und unsere Truppen aus der Region abzuziehen. Das wird allerdings dazu führen, dass wir einige verlorene Gebiete an die [PER.GetAdjective]s abtreten."
PER_imperial_events.80.a:		"Wir haben anderswo größere Probleme. Ziehen Sie unsere Truppen zurück"
PER_imperial_events.80.b:		"Nein! Wir müssen weitermachen!"
PER_imperial_events.100.t:		"Der Vertrag von Teheran"
PER_imperial_events.100.desc:		"Nachdem es uns gelungen war, die Invasoren zu vertreiben und sie in ihr eigenes Land zurückzuschicken, konnten wir unseren Feinden die Hand reichen und ihre Diplomaten nach Teheran einladen, um Friedensgespräche aufzunehmen. Glücklicherweise waren sie für den Vorschlag empfänglich, und nach stundenlangen Gesprächen haben wir uns darauf geeinigt, dass sie die Angriffe auf [PER.GetNameDef] einstellen und als Gegenleistung ihre Grenzgebiete abtreten werden."
PER_imperial_events.100.a:		"Mögen sie nie wieder versuchen, uns anzugreifen."
PER_imperial_events.101.t:		"Gescheiterte Verhandlungen"
PER_imperial_events.101.desc:		"Nachdem es uns gelungen war, die Invasoren zu vertreiben und sie weiter in ihr eigenes Land zurückzuschicken, konnten wir unseren Feinden die Hand reichen und ihre Diplomaten nach Teheran einladen, um Friedensgespräche aufzunehmen. Leider waren sie für unsere Friedensgespräche nicht empfänglich, und so geht der Krieg weiter."
PER_imperial_events.101.a:		"Wir werden sie in ihre Hauptstadt zurückdrängen!"
PER_imperial_events.110.t:		"$PER_imperial_events.80.t$"
PER_imperial_events.110.desc:		"$PER_imperial_events.80.desc$"
PER_imperial_events.110.a:		"$PER_imperial_events.80.a$"
PER_imperial_events.110.b:		"$PER_imperial_events.80.b$"
PER_imperial_events.111.t:		"Sicherung unserer Pufferstaaten"
PER_imperial_events.111.desc:		"Nachdem es uns gelungen war, die [SOV.GetAdjective]s zu vertreiben und sie weiter in ihr eigenes Land zurückzuschicken, konnten wir unseren Feinden die Hand reichen und ihre Diplomaten nach Teheran einladen, um Friedensgespräche aufzunehmen. Glücklicherweise waren sie für den Vorschlag empfänglich, und nach stundenlangen Gesprächen haben wir uns darauf geeinigt, dass sie ihre Grenzgebiete als Kompromiss abtreten werden, um einen längeren Krieg zu vermeiden."
PER_imperial_events.111.a:		"Unser Plan hat funktioniert!"
PER_imperial_events.112.t:		"Gescheiterte Verhandlungen"
PER_imperial_events.112.desc:		"Nachdem es uns gelungen war, die [SOV.GetAdjective]s zu vertreiben und sie weiter in ihr eigenes Land zurückzuschicken, konnten wir unseren Feinden die Hand reichen und ihre Diplomaten nach Teheran einladen, um Friedensgespräche aufzunehmen. Leider waren sie für unsere Friedensgespräche nicht empfänglich, und so geht der Krieg weiter."
PER_imperial_events.112.a:		"Wir werden sie in ihre Hauptstadt treiben!"
PER_imperial_events.120.t:		"[PER.GetNameDefCap] verhandelt über ihre Kapitulation"
PER_imperial_events.120.desc:		"Heute Morgen hat uns die Regierung von [PER.GetAdjective] mitgeteilt, dass sie beabsichtigt, sich zu ergeben und den Kapitulationsprozess einzuleiten. Als Teil davon sind sie bereit, uns zu erlauben, ihr Land zu besetzen, während sie ihre Monarchie als Marionettenführer beibehalten. Wie sollen wir darauf reagieren?"
PER_imperial_events.120.a:		"Ja, das hört sich gut an"
PER_imperial_events.120.b:		"Auf keinen Fall, drängen Sie in die Hauptstadt."
PER_imperial_events.121.t:		"[ENG.GetNameDefCap] Nimmt unseren Vorschlag an"
PER_imperial_events.121.desc:		"Glücklicherweise hat die [ENG.GetAdjective]-Regierung zugestimmt, uns zu erlauben, die [PER.GetNameDef] unter ihrem wachsamen Auge weiter zu führen. Hoffentlich wird das Blutvergießen und der Tod damit ein Ende haben."
PER_imperial_events.121.a:		"Das ist eine Erleichterung..."
PER_imperial_events.122.t:		"[ENG.GetNameDefCap] lehnt unseren Vorschlag ab"
PER_imperial_events.122.desc:		"Leider hat die [ENG.GetAdjective] Regierung unseren Vorschlag zur Kapitulation abgelehnt. Das bedeutet, dass wir die Kämpfe fortsetzen müssen, aber wenn wir verlieren, dann werden wir uns wahrscheinlich zu ihren Bedingungen ergeben."
PER_imperial_events.122.a:		"Es sind dunkle Zeiten..."
PER_imperial_events.130.t:		"[PER.GetNameDefCap] verhandelt über ihre Kapitulation"
PER_imperial_events.130.desc:		"Heute Morgen hat uns die [PER.GetAdjective]-Regierung mitgeteilt, dass sie die Absicht hat, sich zu ergeben und den Kapitulationsprozess einzuleiten. Als Teil dieses Prozesses ist sie bereit, ihre nördlichen Gebiete an uns abzutreten und zuzulassen, dass sie in unser Land eingegliedert werden. Was sollen wir tun?"
PER_imperial_events.130.a:		"Ja, das hört sich gut an"
PER_imperial_events.130.b:		"Auf keinen Fall, drängen Sie in die Hauptstadt."
PER_imperial_events.131.t:		"[SOU.GetNameDefCap] Nimmt unseren Vorschlag an"
PER_imperial_events.131.desc:		"Glücklicherweise hat die Regierung von [SOU.GetAdjective] unserem Vorschlag zugestimmt. Wir haben zwar unsere nördlichen Gebiete verloren, aber zumindest haben wir den weiteren Vormarsch der [SOU.GetAdjective] Armee verhindert..."
PER_imperial_events.131.a:		"Das ist eine Erleichterung..."
PER_imperial_events.132.t:		"[SOU.GetNameDefCap] lehnt unseren Vorschlag ab"
PER_imperial_events.132.desc:		"Leider hat die [SOU.GetAdjective] Regierung unseren Vorschlag zur Kapitulation abgelehnt. Das bedeutet, dass wir weiterkämpfen müssen, aber wenn wir verlieren, werden wir wahrscheinlich zu ihren Bedingungen kapitulieren."
PER_imperial_events.132.a:		"Dies sind dunkle Zeiten..."
PER_imperial_events.140.t:		"[FROM.GetNameDefCap] Erklärt die Unabhängigkeit"
PER_imperial_events.140.desc:		"[FROM.GetLeader] hat erklärt, dass [FROM.GetNameDef] die Oberherrschaft von [ROOT.GetAdjective] nicht länger akzeptieren wird. [FROM.GetNameDefCap] möchte nach Möglichkeit gute Beziehungen zu [ROOT.GetNameDef] aufrechterhalten, aber [FROM.GetLeader] erklärt, dass sie bereit sind, zu den Waffen zu greifen und für ihre Unabhängigkeit zu kämpfen, falls nötig."
PER_imperial_events.140.a:		"Man muss ihnen eine Lektion erteilen"
PER_imperial_events.140.b:		"Wir müssen an wichtigere Dinge denken"
PER_imperial_events.142.t:		"[PER.GetAdjective] Ehre wiederhergestellt"
PER_imperial_events.142.desc:		"In einer eher überraschenden Wendung der Ereignisse akzeptierte [FROM.GetLeader] die [ROOT.GetAdjective] Unabhängigkeitserklärung. Von nun an hat [FROM.GetNameDef] keinen Einfluss mehr auf [ROOT.GetAdjective] Politik, weder intern noch extern. Eine riesige Menschenmenge, die die Führung von [ROOT.GetLeader] feiert, hat sich auf dem Hauptplatz von [ROOT.Capital.GetCapitalVictoryPointName] versammelt."
PER_imperial_events.142.a:		"Das Joch ist weg"
PER_imperial_events.141.t:		"Der Kampf geht weiter"
PER_imperial_events.141.desc:		"Wie erwartet hat [FROM.getLeader] die Bitte um formelle Unabhängigkeit von [ROOT.GetLeader] abgelehnt. Da dies eine erwartete Wendung der Ereignisse war, sichern die [ROOT.GetAdjective] Streitkräfte bereits Schlüsselpositionen im Land. Die Nation ist dieses Mal viel besser vorbereitet."
PER_imperial_events.141.a:		"Azadi! Wir werden bis zum letzten Mann kämpfen!"
PER_imperial_events.150.t:		"[FROM.GetNameDefCap] Fordert weißen Frieden"
PER_imperial_events.150.desc:		"Mit dem Fortschreiten des Krieges waren wir nicht in der Lage, unsere Ziele in der von uns gesetzten Zeit zu erreichen. Daher haben wir kürzlich eine Nachricht von der [FROM.GetAdjective] Regierung erhalten, die ein Ende der Feindseligkeiten fordert. Wir könnten weitermachen, aber wir müssen unsere eigenen Verluste einkalkulieren."
PER_imperial_events.150.a:		"Die Situation ist nicht zu unseren Gunsten..."
PER_imperial_events.150.b:		"Wir müssen weitermachen! Wir werden siegen!"
PER_imperial_events.151.t:		"[FROM.GetNameDefCap] Zieht seine Streitkräfte zurück"
PER_imperial_events.151.desc:		"Großartige Neuigkeiten! [FROM.GetNameDefCap] hat unseren Forderungen nach Frieden zugestimmt und damit begonnen, seine Truppen von unseren Grenzen abzuziehen. Wir haben lange und hart gekämpft, um sie in Schach zu halten, und dies ist ein Tag, der auf Jahre hinaus gefeiert werden sollte!"
PER_imperial_events.151.a:		"Dies ist als Sieg zu betrachten!"
PER_imperial_events.152.t:		"[FROM.GetNameDefCap] Weigert sich, nachzugeben"
PER_imperial_events.152.desc:		"Es ist ein dunkler Tag. Unser Feind hat beschlossen, trotz seiner Verluste und unserer Forderungen nach Frieden weiter in unser Gebiet vorzudringen. Wenn sie einen Kampf wollen, dann werden sie ihn auch bekommen."
PER_imperial_events.152.a:		"Sie werden es bereuen, dass sie die Chance zum Aufgeben nicht genutzt haben!"
PER_imperial_events.160.t:		"[FROM.GetNameDefCap] Fordert unsere Kapitulation"
PER_imperial_events.160.desc:		"Mit dem Fortschreiten des Krieges haben wir unsere Ziele nicht in der vorgesehenen Zeit erreichen können. Tatsächlich ist es denjenigen, in die wir einzudringen versuchten, gelungen, uns in unser eigenes Land zurückzudrängen. Deshalb hat uns die [FROM.GetAdjective]-Regierung vor kurzem mit der Forderung nach einem Ende der Feindseligkeiten kontaktiert. Sollten wir kapitulieren, verlangt [PER.GetNameDef], dass wir unsere Grenzgebiete als Entschädigung an sie abtreten. Wir könnten weitermachen, aber wir müssen unsere eigenen Verluste in Kauf nehmen."
PER_imperial_events.160.a:		"Die Situation ist nicht zu unseren Gunsten..."
PER_imperial_events.160.b:		"Wir müssen weitermachen! Wir werden siegen!"
PER_imperial_events.161.t:		"[FROM.GetNameDefCap] Zieht seine Streitkräfte zurück"
PER_imperial_events.161.desc:		"Großartige Neuigkeiten! [FROM.GetNameDefCap] hat unseren Forderungen nach Frieden zugestimmt und damit begonnen, seine Truppen von unseren Grenzen abzuziehen. Sie haben auch damit begonnen, ihre benachbarten Grenzgebiete an uns abzutreten. Wir haben lange und hart gekämpft, um sie in Schach zu halten, und dies ist ein Tag, der auf Jahre hinaus gefeiert werden sollte!"
PER_imperial_events.161.a:		"Dies ist als Sieg zu betrachten!"
PER_imperial_events.162.t:		"[FROM.GetNameDefCap] Weigert sich, nachzugeben"
PER_imperial_events.162.desc:		"Es ist ein dunkler Tag. Unser Feind hat beschlossen, trotz seiner Verluste und trotz unserer Friedensforderungen weiter in unser Gebiet vorzudringen. Ihr Unwille, für ihre Übertretungen zu bezahlen, ist eine Beleidigung für alles, was hier geschehen ist. Wenn sie einen Kampf wollen, dann werden sie einen Kampf bekommen."
PER_imperial_events.162.a:		"Sie werden es bereuen, dass sie die Chance nicht genutzt haben, aufzuhören!"
PER_imperial_events.170.t:		"[FROM.GetNameDefCap] verlangt, dass wir uns ergeben"
PER_imperial_events.170.desc:		"Im Laufe des Krieges ist es uns nicht gelungen, unsere Ziele in der gesetzten Zeit zu erreichen. Tatsächlich ist es denjenigen, die wir angreifen wollten, gelungen, uns in unser eigenes Land zurückzudrängen. Deshalb hat uns die [FROM.GetAdjective]-Regierung vor kurzem mit der Forderung nach einem Ende der Feindseligkeiten kontaktiert. Wenn wir uns ergeben würden, müssten wir wahrscheinlich einige Jahre lang leiden, da wir unsere Kriegsreparationen zahlen müssen. Wir könnten weitermachen, aber wir müssen unsere eigenen Verluste einkalkulieren."
PER_imperial_events.170.a:		"Die Situation ist nicht zu unseren Gunsten..."
PER_imperial_events.170.b:		"Wir müssen weitermachen! Wir werden siegen!"
PER_imperial_events.171.t:		"[FROM.GetNameDefCap] Zieht seine Streitkräfte ab"
PER_imperial_events.171.desc:		"Großartige Neuigkeiten! [FROM.GetNameDefCap] hat unseren Forderungen nach Frieden zugestimmt und damit begonnen, seine Truppen von unseren Grenzen abzuziehen. Ihre Verfehlungen während des Krieges bedeuten, dass wir in der Lage sind, Reparationen für die Invasion zu erhalten. Wir haben lange und hart gekämpft, um sie in Schach zu halten, und dies ist ein Tag, der in den kommenden Jahren gefeiert werden sollte!"
PER_imperial_events.171.a:		"Dies ist als ein Sieg zu betrachten!"
PER_imperial_events.172.t:		"$PER_imperial_events.162.t$"
PER_imperial_events.172.desc:		"$PER_imperial_events.162.desc$"
PER_imperial_events.172.a:		"$PER_imperial_events.162.a$"
PER_imperial_events.180.t:		"[FROM.GetNameDefCap] Angebote zum Treueschwur"
PER_imperial_events.180.desc:		"Heute Morgen erreichte uns das Angebot der [PER.GetAdjective] Regierung, die Feindseligkeiten zu beenden und sich im Gegenzug als Marionette unter unserer Aufsicht regieren zu lassen. Das würde den Krieg schnell beenden und uns erlauben, uns auf unsere größeren Ziele zu konzentrieren."
PER_imperial_events.180.a:		"Das ist für alle Beteiligten von Vorteil."
PER_imperial_events.180.b:		"Das ist keine Option, setzen Sie den Krieg fort."
PER_imperial_events.181.t:		"[FROM.GetNameDefCap] Zustimmen zu unseren Bedingungen"
PER_imperial_events.181.desc:		"Es scheint, dass die [FROM.GetAdjective] unserem Angebot zugestimmt und begonnen haben, unsere Kapitulationsbedingungen zu formulieren. Obwohl dies nicht die idealste Situation ist, würden wir unzählige Leben retten, indem wir uns unter das Joch der [FROM.GetNameDef] begeben."
PER_imperial_events.181.a:		"Ein Pyrrhussieg, aber es ist das Beste, was wir haben."
PER_imperial_events.182.t:		"[FROM.GetNameDefCap] verweigert unsere Bedingungen"
PER_imperial_events.182.desc:		"Es ist ein dunkler Tag. Unser Feind hat beschlossen, trotz seiner Verluste und trotz unserer Friedensforderungen weiter in unser Gebiet vorzudringen. Ihre Weigerung, uns zu erlauben, den Krieg mit ihrem Sieg zu beenden, ist enttäuschend, und wir haben keine andere Wahl, als weiter zu kämpfen."
PER_imperial_events.182.a:		"Das ist eine Schande..."
PER_imperial_events.190.t:		"[FROM.GetNameDefCap] Möchte über Kapitulationsbedingungen verhandeln"
PER_imperial_events.190.desc:		"Heute Morgen erhielten wir eine Nachricht von der [PER.GetAdjective] Regierung mit dem Angebot, die Feindseligkeiten zu beenden und uns im Gegenzug Zugang zu großen Mengen ihrer natürlichen Ressourcen zu gewähren. Dies würde ein schnelles Ende des Krieges bedeuten und uns erlauben, uns auf unsere größeren Ziele zu konzentrieren. Und nicht nur das: Mit ihren Ölkonzessionen wären wir in einer guten Position, um künftige Kriegsanstrengungen fortzusetzen."
PER_imperial_events.190.a:		"Wir können diesen Bedingungen zustimmen"
PER_imperial_events.190.b:		"Das ist nicht vorteilhaft für uns, setzen Sie den Krieg fort."
PER_imperial_events.191.t:		"[FROM.GetNameDefCap] Stimmen Sie unseren Bedingungen zu"
PER_imperial_events.191.desc:		"Es scheint, dass die [FROM.GetAdjective] unserem Angebot zugestimmt und begonnen haben, unsere Kapitulationsbedingungen zu formulieren. Das bedeutet, dass wir einige unserer natürlichen Ressourcen verlieren werden, aber es ist weitaus günstiger, als vollständige Untertanen unter der Kontrolle von [FROM.GetNameDef] zu werden."
PER_imperial_events.191.a:		"Das ist das Beste, was wir für [PER.GetNameDef] tun können."
PER_imperial_events.192.t:		"[FROM.GetNameDefCap] lehnt unsere Bedingungen ab"
PER_imperial_events.192.desc:		"Es ist ein dunkler Tag. Unser Feind hat beschlossen, trotz seiner Verluste und trotz unserer Forderungen nach Frieden weiter in unser Gebiet vorzudringen. Ihre Weigerung, uns zu erlauben, den Krieg zu beenden und ihnen unsere Ressourcen zu überlassen, ist enttäuschend, und wir haben keine andere Wahl, als weiter zu kämpfen."
PER_imperial_events.192.a:		"Das ist eine Schande..."
PER_imperial_events.200.t:		"Der Saadabad-Pakt"
PER_imperial_events.200.desc:		"[FROM.GetLeader] ist an [ROOT.GetLeader] mit dem Vorschlag herangetreten, einen gegenseitigen Nichtangriffspakt zu unterzeichnen, der die Aussicht auf eine weitere Zusammenarbeit in der Zukunft offen lässt. Die Diplomaten von [FROM.GetAdjective] haben hart an ihrem Vorschlag gearbeitet, indem sie ausführlich auf die gemeinsame Geschichte und die Interessen unserer beiden Nationen eingingen, gefolgt von einem ernsthaften Appell zum Frieden zwischen brüderlichen Nationen. Das Hin und Her der Verhandlungen war angenehm, aber die Entscheidung, ob wir unterschreiben oder nicht, liegt letztendlich bei uns."
PER_imperial_events.200.a:		"Natürlich werden wir diesen Freundschaftspakt unterzeichnen!"
PER_imperial_events.200.b:		"Wir sind nicht verwandt, [FROM.GetNameDef]: wir kennen Sie nicht."
PER_imperial_events.210.t:		"[FROM.GetName] Fordert unsere Grenzgebiete!"
PER_imperial_events.210.desc:		"[FROM.GetLeader] hat einen langatmigen Brief an [ROOT.GetLeader] geschrieben, in dem er sie über [PER.GetAdjective] Forderungen informiert, einen Teil des Grenzgebiets an sie abzutreten. Das ist zwar ein ungeheuerlicher Versuch, unsere Souveränität zu missachten, aber es könnte auch bedeuten, dass [PER.GetNameDef] drastische Maßnahmen ergreift, um diese Gebiete zu sichern, wenn wir uns weigern. Wie sollten wir vorgehen?"
PER_imperial_events.210.a:		"Geben Sie das Gebiet ab..."
PER_imperial_events.210.b:		"Sie werden uns niemals unser Land wegnehmen."
PER_imperial_events.211.t:		"[FROM.GetName] Stimmt unseren Forderungen zu!"
PER_imperial_events.211.desc:		"Heute Morgen erhielten wir die Nachricht von [FROM.GetNameDef], dass sie widerwillig unseren Forderungen zustimmen und damit den Prozess der Abtretung ihres Grenzgebiets an uns begonnen haben. Sie ahnen nicht, dass dies nur dazu dienen wird, uns bei unseren weiteren Machenschaften zu helfen."
PER_imperial_events.211.a:		"Diese Narren..."
PER_imperial_events.212.t:		"[FROM.GetName] lehnt unsere Forderungen ab!"
PER_imperial_events.212.desc:		"Heute Morgen erhielten wir eine Nachricht von [FROM.GetNameDef], dass sie unsere Forderungen entschieden ablehnen. Das stellt zwar nur ein kleines Problem für unsere Pläne dar, aber es bedeutet, dass wir das Gebiet auf die altmodische Art und Weise einnehmen müssen."
PER_imperial_events.212.a:		"Sie werden dies bedauern."
PER_imperial_events.220.t:		"Wahlkampfzeit"
PER_imperial_events.220.desc:		"Aufgrund einer massiven Umstrukturierung der [PER.GetAdjective] Regierung wurden Wahlen ausgerufen, damit das Volk von [PER.GetNameDef] seinen neuen Premierminister wählen kann. Während viele Bürger zu den Wahllokalen im ganzen Land strömen, stechen zwei Kandidaten besonders hervor. Mohammad Mosaddegh und Mohammad Ali Foroughi. Wie wird die Nation am Ende abstimmen?"
PER_imperial_events.220.a:		"Mosaddegh ist die offensichtliche Wahl"
PER_imperial_events.220.b:		"Vielleicht wird Foroughi die bessere Wahl sein?"
PER_imperial_events.220.c:		"Kashani wird die Unterstützung des Klerus stärken."
PER_imperial_events.201.t:		"[FROM.GetName] Unterzeichnet den Saadabad-Pakt"
PER_imperial_events.201.desc:		"[FROM.GetLeader] war sehr enthusiastisch, als er unsere Vorschläge für einen Freundschaftsvertrag und einen Nichtangriffspakt präsentierte, und verschwendete keine Zeit damit, uns ihre Unterschrift unter unseren Vertrag zu geben. Mit ihrer Zustimmung sind wir dem Frieden zu Hause und dem Frieden in der Welt einen Schritt näher gekommen!"
PER_imperial_events.201.a:		"Sie werden für [ROOT.GetNameDef] immer ein guter Freund sein."
PER_imperial_events.202.t:		"[FROM.GetName] lehnt den Saadabad-Pakt ab!"
PER_imperial_events.202.desc:		"[FROM.GetLeader] schrieb einen langatmigen Brief an [ROOT.GetLeader], in dem er ihnen mitteilte, dass das Angebot eines Freundschaftsvertrags und eines Nichtangriffspakts nicht das Papier und die Tinte wert sei, auf denen es konzipiert wurde. [FROM.GetLeader] schrieb weiter, dass alles, was nicht zu einem formalisierten Bündnis zwischen [FROM.GetNameDef] und [ROOT.GetNameDef] führe, reine Zeitverschwendung sei und dass sie es vorziehen würden, von nun an von allen zukünftigen [ROOT.GetAdjective] Plänen ausgenommen zu werden."
PER_imperial_events.202.a:		"... Sie hätten einfach 'nein' sagen können."
PER_islamic_revolution_events.1.t:		"Instabilität innerhalb des Klerus"
PER_islamic_revolution_events.1.desc:		"Es scheint, dass einige der Entscheidungen, die wir im Hinblick auf die Entwicklung unserer Nation getroffen haben, einige Mitglieder des Klerus verärgert haben. Da ihre Abneigung weiter anhält, müssen wir Vorsicht walten lassen, um sie nicht noch weiter auszugrenzen."
PER_islamic_revolution_events.1.a:		"Wir sollten vorsichtig sein, wie wir vorgehen."
PER_islamic_revolution_events.2.t:		"Islamische Revolutionäre sind in Aufruhr"
PER_islamic_revolution_events.2.desc:		"Unsere Aktionen haben den Klerus weiter geächtet, so dass viele hochrangige Mitglieder des Islams beginnen, Unterstützung in der Bevölkerung von [PER.GetNameDef] zu gewinnen. Unsere Zeit wird knapp und wir haben es mit einer potenziellen Revolution zu tun. Wie sollten wir vorgehen?"
PER_islamic_revolution_events.2.a:		"Gehen Sie hart gegen diese Revolutionäre vor."
PER_islamic_revolution_events.2.b:		"Beschwichtigen Sie den Klerus sofort."
PER_islamic_revolution_events.2.c:		"Lassen Sie es sie versuchen!"
PER_foreign_policy_events.1.t:		"Druck von [FROM.GetNameDef]"
PER_foreign_policy_events.1.desc:		"Es scheint, dass die [FROM.GetAdjective]-Regierung wegen unserer diplomatischen Situation zunehmend nervös wird. In der vergangenen Woche hat sich der [FROM.GetAdjective] Botschafter nicht weniger als sechs Mal mit [THIS.GetLeader] getroffen und bei der letzten Verhandlungsrunde praktisch ein Ultimatum gestellt. \n\n Entweder wir schließen uns [FROM.GetNameDef] in einem Verteidigungspakt an und akzeptieren \"ein gewisses Maß an Konsultationen in innenpolitischen Angelegenheiten\", oder [FROM.GetNameDef] wird wahrscheinlich zu einer militärischen Intervention in unserem Land greifen."
PER_foreign_policy_events.1.a:		"Kämpfen wäre sinnlos."
PER_foreign_policy_events.1.b:		"Sollen sie doch kommen!"
PER_foreign_policy_events.2.t:		"[FROM.GetNameDefCap] weigert sich"
PER_foreign_policy_events.2.desc:		"Unsere Versuche, unsere offenen Fragen mit [FROM.GetNameDef] auf diplomatischem Wege zu lösen, scheinen gescheitert zu sein. Als unser Botschafter die [FROM.GetLeader] zu einer weiteren Verhandlungsrunde aufforderte, wurde ihm brüsk mitgeteilt, dass die [FROM.GetAdjective] ihre Position klar gemacht hätten und dass es nichts mehr zu besprechen gäbe."
PER_foreign_policy_events.2.a:		"Wir werden sie nicht weiter drängen... vorerst."
PER_foreign_policy_events.2.b:		"Bereiten Sie die Invasion von [FROM.GetNameDef] vor!"
PER_foreign_policy_events.2.c:		"Wir müssen eine gemeinsame Invasion mit der [SOU.GetAdjective] vorbereiten."
PER_foreign_policy_events.3.t:		"Anglo-[SOV.GetAdjective] Invasion des Iran"
PER_foreign_policy_events.3.desc:		"Wir haben eine diplomatische Note von [FROM.GetNameDef] erhalten, in der eine gemeinsame militärische Operation gegen [PER.GetNameDef] vorgeschlagen wird. Das [FROM.GetAdjective] Kommando bekräftigt, dass diese Operation es uns ermöglichen wird, die iranischen Ölfelder und unsere Nachschublinien zu [FROM.GetNameDef] zu sichern und gleichzeitig einen möglichen feindlichen Vorstoß von [TUR.GetNameDef] durch [PER.GetName] in Richtung der Ölfelder von Baku und [RAJ.GetNameDef] zu verhindern."
PER_foreign_policy_events.3.a:		"Wir müssen den Persischen Korridor sichern!"
PER_foreign_policy_events.3.b:		"Wir werden die [PER.GetAdjective] Unabhängigkeit respektieren."
PER_foreign_policy_events.4.t:		"Anglo-[SOV.GetAdjective] Invasion des Iran"
PER_foreign_policy_events.4.desc:		"Der Botschafter von [FROM.GetAdjective] hat eine Note überreicht, in der [FROM.GetNameDef] zustimmt, eine gemeinsame militärische Operation gegen [PER.GetNameDef] zu organisieren und durchzuführen. Sowohl das [ROOT.GetAdjective] als auch das [FROM.GetAdjective] Kommando sind zuversichtlich, dass dies eine schnelle und effektive Operation gegen einen zahlenmäßig und technologisch unterlegenen Feind sein wird, die es uns ermöglichen wird, die iranischen Ölfelder und [FROM.GetAdjective] Versorgungslinien zu [ROOT.GetNameDef] zu sichern und gleichzeitig einen möglichen feindlichen Vorstoß von [TUR.GetNameDef] durch [PER.GetName] in Richtung der Ölfelder von Baku und [RAJ.GetNameDef] zu verhindern."
PER_foreign_policy_events.4.a:		"Beginnen Sie mit den Vorbereitungen!"
PER_foreign_policy_events.5.t:		"Die [FROM.GetAdjective] Regierung weigert sich."
PER_foreign_policy_events.5.desc:		"Nach mehreren entnervenden Treffen zwischen [ROOT.GetAdjective] und [FROM.GetAdjective] Diplomaten hat [FROM.GetNameDef] beschlossen, sich nicht an unseren Plänen für [PER.GetNameDef] zu beteiligen. [FROM.GetLeader] selbst hat es sogar gewagt zu unterstellen, dass dieser Vorschlag nichts weiter als ein Versuch war, unsere territorialen Ambitionen zu rechtfertigen. \nEs scheint, dass wir uns mit [PER.GetNameDef] selbst auseinandersetzen müssen."
PER_foreign_policy_events.5.a:		"Immer so unzuverlässig..."
PER_revolution_events.1.t:		"Putsch steht bevor"
PER_revolution_events.1.desc:		"Heute Morgen haben die Oppositionsparteien eine Koalition gebildet und nachdem sie unser Militär infiltriert haben, haben sie nun die Waffen gegen uns erhoben! Ihre Streitkräfte bereiten sich darauf vor, auf den Saadabad-Komplex zu marschieren! Wir müssen uns darauf vorbereiten, zurückzuschlagen, um die Souveränität von [PER.GetNameDef] zu schützen!"
PER_revolution_events.1.a:		"Versammeln Sie die Truppen!"
PER_communist_events.1.t:		"Radikale Aktivitäten nehmen zu"
PER_communist_events.1.desc:		"Die Radikalen, die für die Unabhängigkeit von uns eintreten, sind in den letzten Tagen aktiver geworden. Es ist noch nicht klar, was diesen Anstieg der Aktivitäten ausgelöst hat, aber die lokalen Behörden sind besorgt über die Zunahme nationalistischer und sozialistischer Rhetorik, die auf den Straßen zu hören ist. Wenn wir eine Eskalation der Situation verhindern wollen, werden wir wahrscheinlich hart durchgreifen müssen."
PER_communist_events.1.a:		"Eine besorgniserregende Entwicklung."
PER_communist_events_1_tt:		"Entriegeln Sie §Y$PER_anti_gulf_decisions_cat$§! Entscheidungen zur Niederschlagung des Widerstands."
PER_communist_events.2.t:		"Niederschlagung der kurdischen Unabhängigkeitsbewegung"
PER_communist_events.2.desc:		"Die [FROM.GetAdjective] Behörden haben ein hartes Vorgehen gegen kurdische Unabhängigkeitsbewegungen in der gesamten Region inszeniert. Unsere Kontakte in der Region sind deshalb untergetaucht oder über die Grenze nach [ROOT.GetNameDef] geflohen."
PER_communist_events.2.a:		"Wir werden unsere Bemühungen verdoppeln."
PER_communist_events.3.t:		"Kurdische Rebellion könnte unmittelbar bevorstehen"
PER_communist_events.3.desc:		"Die Aktivitäten der kurdischen Separatisten und Sozialisten haben in den letzten Tagen einen fieberhaften Höhepunkt erreicht. Es gibt auch immer mehr Hinweise darauf, dass im ganzen Land Waffen verteilt werden, um einen Aufstand in den kommenden Wochen vorzubereiten. Wenn wir nicht bald handeln, könnte ein offener Krieg unvermeidlich sein."
PER_communist_events.3.a:		"Wir müssen diese Eskalation verhindern!"
PER_communist_events_3_tt:		"§AWir müssen hart gegen Andersdenkende vorgehen, wenn wir einen Aufstand der Kurden und einen Krieg verhindern wollen!§!"
PER_communist_events.4.t:		"Verstärkter Widerstand an der [PER.GetAdjective]-Grenze"
PER_communist_events.4.desc:		"In den letzten Tagen hat der Widerstand gegen unsere Besetzung des Gebiets um die [PER.GetAdjective] Grenze deutlich zugenommen. Während der Auslöser dafür ungewiss bleibt, wächst die Sorge, dass jemand gegen _[ROOT.GetAdjective] Stimmung macht, in der Hoffnung, unsere Präsenz in dem Gebiet zu schwächen."
PER_communist_events.4.a:		"Wer steckt dahinter?"
PER_communist_events_4_tt:		"§Die Staaten am Persischen Golf könnten in den kommenden Monaten auf verstärkten Widerstand stoßen!"
PER_communist_events.5.t:		"Die Krise am Persischen Golf"
PER_communist_events.5.desc:		"Es scheint, dass ein Großteil der jüngsten Unruhen im Persischen Golf und den umliegenden Gebieten ihren Ursprung in [FROM.GetNameDef] hat. Nach einer Reihe strategischer Siege in der Region fühlen sie sich nun offenbar ermutigt genug, ihren bisher größten Schritt zu tun. In einer strengen Warnung an unsere Regierung hat das [FROM.GetAdjective]-Regime unseren vollständigen Rückzug von der Arabischen Halbinsel und dem Persischen Golf gefordert und sogar seine Bereitschaft angedeutet, den Golf zu blockieren, sollten wir dem nicht nachkommen.  "
PER_communist_events.5.a:		"Wir werden uns unter Protest zurückziehen."
PER_communist_events.5.b:		"Sie und wessen Flotte?"
PER_communist_events.6.t:		"[FROM.GetNameDefCap] Stimmt dem Rückzug zu"
PER_communist_events.6.desc:		"Trotz des großen diplomatischen Getöses haben die [FROM.GetAdjective] Streitkräfte begonnen, sich aus der Region zurückzuziehen. Dies ist ein großer strategischer Sieg für unsere Regierung und wurde von vielen in der ganzen Welt als Zeichen des kolonialen Niedergangs begrüßt. "
PER_communist_events.6.a:		"Unsere Arbeit ist noch nicht getan!"
PER_communist_events.7.t:		"[FROM.GetNameDefCap] weigert sich, sich zurückzuziehen"
PER_communist_events.7.desc:		"Es überrascht nicht, dass die sturen Narren in [FROM.Capital.GetCapitalVictoryPointName] sich weigern, sich aus den umkämpften Gebieten am Persischen Golf und in Arabien zurückzuziehen. Sie scheinen zu glauben, dass wir nicht entschlossen genug sind, unsere Drohungen wahr zu machen und die Seewege zu blockieren, wenn sie sich weigern. "
PER_communist_events.7.a:		"Dann werden wir unsere Entschlossenheit demonstrieren."
PER_communist_events.7.b:		"Wir können es uns nicht leisten, die Sache eskalieren zu lassen."
PER_communist_events.8.t:		"[FROM.GetNameDefCap] Blockade des Persischen Golfs"
PER_communist_events.8.desc:		"In einer deutlichen Eskalation der Golfkrise hat [FROM.GetNameDef] seine Drohungen wahr gemacht und begonnen, die zivile Schifffahrt und Flugzeuge in der Region zu blockieren. Nachrichtendienstliche Informationen deuten außerdem darauf hin, dass ihr Militär seine Bereitschaft in Erwartung eines Konflikts mit unseren Streitkräften erhöht hat. "
PER_communist_events.8.a:		"Bereiten Sie die Kanonenboote vor."
PER_communist_events.8.b:		"Sie haben sich klar ausgedrückt, geben Sie den Befehl zum Rückzug."
PER_communist_events.9.t:		"[FROM.GetNameDefCap] mildert die Rhetorik"
PER_communist_events.9.desc:		"Es scheint, dass die jüngste Angeberei von [FROM.GetNameDef] durch unsere unerschütterliche Entschlossenheit, unsere Interessen in diesem Gebiet zu verteidigen, zunichte gemacht wurde. In einer demütigen Rede bekräftigte [FROM.GetLeader] ihren unerschütterlichen Wunsch, den Frieden in der Region zu erhalten. Ihre Verbündeten sind wahrscheinlich erschüttert über die scheinbare Aufgabe von [FROM.GetAdjective] Prinzipien. "
PER_communist_events.9.a:		"Das wird sie lehren."
PER_communist_events.10.t:		"[FROM.GetNameDefCap] schickt die Marine"
PER_communist_events.10.desc:		"Jede Chance auf eine diplomatische Lösung der sich entwickelnden Golfkrise hat sich mit der Entscheidung von [FROM.GetNameDef] verflüchtigt, eine Marine-Taskforce zu entsenden, um unsere Blockade in der Region zu durchbrechen. Wenn wir das Überraschungsmoment bewahren wollen, sollten wir sofort einen Präventivschlag starten. Andernfalls sollten wir wahrscheinlich die Eskalationsleiter hinunterklettern. "
PER_communist_events.10.a:		"Wir werden zuschlagen, solange wir noch im Vorteil sind."
PER_communist_events.10.b:		"Zeit, etwas Demut zu empfinden."
PER_communist_events.11.t:		"[FROM.GetNameDefCap] Fordert Militärtechnologie an"
PER_communist_events.11.desc:		"Die Regierung von [FROM.GetNonIdeologyName] hat um technische Unterstützung bei der Entwicklung von Anti-Schiffs-Technologien gebeten, damit sie geeignete Gegenmaßnahmen gegen die Bedrohung durch die Kolonialmächte im Persischen Golf entwickeln kann. Sie haben sich verpflichtet, alle zukünftigen Entwicklungen mit uns zu teilen."
PER_communist_events.11.a:		"Ihre Sicherheit ist wichtig für unsere eigene."
PER_communist_events.11.b:		"Wir werden keine Staatsgeheimnisse austauschen."
PER_communist_events.12.t:		"[FROM.GetNameDefCap] stimmt dem Technologietransfer zu"
PER_communist_events.12.desc:		"Unsere Ingenieure erwarten sehnsüchtig die Ankunft vertraulicher [FROM.GetAdjective] Forschungen und Entwürfe, nachdem [FROM.GetAdjective] beschlossen hat, einige militärische Technologien mit uns zu teilen. Dies wird unsere eigenen Entwürfe erheblich beschleunigen."
PER_communist_events.12.a:		"Ausgezeichnet!"
PER_communist_events.13.t:		"[FROM.GetNameDefCap] lehnt den Technologietransfer ab"
PER_communist_events.13.desc:		"Die [FROM.GetAdjective]-Regierung hat unsere Bitte um Technologie abgelehnt, die uns helfen würde, den Persischen Golf besser gegen fremde Seemächte zu verteidigen. Das ist ein Schlag für unsere Ingenieure, aber sie sind entschlossen, die Entwicklung allein weiterzuführen."
PER_communist_events.13.a:		"Wir werden auch ohne sie erfolgreich sein."
PER_communist_events.14.t:		"[FROM.GetNameDefCap] Liefert Design"
PER_communist_events.14.desc:		"Gemäß unserer Vereinbarung mit [FROM.GetNameDef] haben sie ein Waffendesign geliefert, von dem sie glauben, dass es in der Lage sein wird, die Imperialisten aus dem Persischen Golf zu vertreiben. Es bleibt abzuwarten, ob das Design für unsere Bedürfnisse geeignet ist."
PER_communist_events.14.a:		"Gut, dass sie ihr Wort gehalten haben."
PER_fascist_events.1.t:		"Imperialer Rat tagt"
PER_fascist_events.1.desc:		"Der Kaiserliche Rat ist zusammengetreten, um zu entscheiden, wer das prestigeträchtige Amt des Schahs übernehmen soll. Einige plädieren für eine Wiederherstellung der Qajar-Dynastie, andere schlagen vor, einen Pahlavi auf dem Thron zu belassen, um die Legitimität in den Augen des Volkes sicherzustellen. Parteitreue plädieren unterdessen für die Gründung einer neuen Dynastie."
PER_fascist_events.1.a:		"Ein Marionetten-Pahlavi passt uns gut."
PER_fascist_events.1.b:		"Eine neue Dynastie für einen neuen Iran."
IRQ_political_events.10.t:		"[FROM.GetNonIdeologyName] Widerruft den Vertrag"
IRQ_political_events.10.desc:		"Der anglo-irakische Vertrag wurde 1930 ausgehandelt, um der jungen Nation mehr Autonomie zu gewähren und sie gleichzeitig im Wesentlichen an unsere Außenpolitik zu binden. Die Regierung hat den Vertrag jedoch aufgekündigt und verlangt, dass wir uns vollständig aus [FROM.GetAdjective] Gebiet zurückziehen. Da wir vom Öl aus der Region abhängig sind, könnte dies unsere gesamte nationale Sicherheit gefährden, sollte die [FROM.GetAdjective]-Regierung beschließen, unsere Versorgung zu unterbrechen."
IRQ_political_events.10.a:		"Wir werden intervenieren und unsere Freunde wieder an die Macht bringen."
IRQ_political_events.10.b:		"Geben Sie einen diplomatischen Protest ab."
IRQ_political_events.11.t:		"[FROM.GetNameDef] Erhebt diplomatischen Protest"
IRQ_political_events.11.desc:		"Zu unserer Überraschung hat die [FROM.GetAdjective]-Regierung nichts weiter als einen scharf formulierten diplomatischen Protest an unseren Botschafter bezüglich unseres Rückzugs aus dem anglo-irakischen Vertrag gerichtet. Es scheint, als müssten wir vorerst keine ernsthaften Konsequenzen seitens der [FROM.GetAdjective] befürchten."
IRQ_political_events.11.a:		"Ein Sieg für die arabische Welt!"
IRQ_political_events.12.t:		"[FROM.GetNameDefCap] Fordert Territorium"
IRQ_political_events.12.desc:		"Die Regierung von [FROM.GetNameDef] hat gefordert, dass wir unser westliches Territorium abtreten, in dem es eine bedeutende arabische Minderheit gibt. Sie argumentiert, dass dies dem Schutz der Araber in diesem Gebiet dient. In denselben Gebieten befindet sich jedoch auch eine große Menge an Öl-Infrastruktur, die wahrscheinlich ihrer Wirtschaft zugute kommen würde. Wenn wir dieses Ultimatum ablehnen, werden sie wahrscheinlich versuchen, sich das Land mit Gewalt zu nehmen."
IRQ_political_events.12.a:		"Wir werden unser Territorium verteidigen."
IRQ_political_events.12.b:		"Das ist einen Krieg nicht wert."
IRQ_political_events.13.t:		"[FROM.GetNameDefCap] stimmt der Abtretung des Territoriums zu"
IRQ_political_events.13.desc:		"Die Regierung von [FROM.GetNameDefCap] hat zugestimmt, das von uns geforderte Territorium abzutreten. Unser Militär war zwar bereit, wegen der Region in den Krieg zu ziehen, aber es scheint, dass wir kampflos gewonnen haben. "
IRQ_political_events.13.a:		"Ein weiterer Sieg für die arabische Welt."
IRQ_political_events.14.t:		"[FROM.GetNameDefCap] Weigert sich, Territorium zu übertragen"
IRQ_political_events.14.desc:		"[FROM.GetNameDefCap] Regierung hat sich geweigert, das von uns geforderte Gebiet zu übertragen. Es scheint, dass wir uns auf unsere Streitkräfte verlassen müssen, wenn wir die Region von der [FROM.GetAdjective] Herrschaft befreien wollen."
IRQ_political_events.14.a:		"Dann werden wir sie mit Gewalt einnehmen."
IRQ_political_events.14.b:		"Sie haben unseren Bluff durchschaut."
IRQ_political_events.15.t:		"Spannungen mit [FROM.GetNameDef] nehmen ab"
IRQ_political_events.15.desc:		"Es scheint, dass die [FROM.GetAdjective] Streitkräfte ihre erhöhte Bereitschaft an der Grenze zurücknehmen. Wir waren zwar darauf vorbereitet, unser Territorium zu verteidigen, aber es ist eine willkommene Erleichterung, dass ein Krieg vorerst vermieden werden konnte."
IRQ_political_events.15.a:		"In der Tat eine Erleichterung."
IRQ_political_events.16.t:		"[FROM.GetNameDefCap] bittet um Kontrolle von [455.GetName]"
IRQ_political_events.16.desc:		"Nachdem die Regierung von [FROM.GetAdjective] ihre Loyalität zu uns bewiesen hat, indem sie die an [GER.GetAdjective] angelehnten Offiziere aus ihrem Militär eliminiert hat, hat sie um die Möglichkeit gebeten, ihren Nachbarstaat [455.GetName] zu integrieren. Es bestehen bereits Verbindungen zwischen den königlichen Familien beider Nationen und es würde uns eine gewisse administrative Last abnehmen."
IRQ_political_events.16.a:		"Wir werden sie belohnen, solange die Einheimischen kein Problem damit haben."
IRQ_political_events.16.b:		"Man kann ihnen nicht trauen. "
IRQ_political_events.17.t:		"[FROM.FROM.GetNonIdeologyName] will über uns herrschen"
IRQ_political_events.17.desc:		"[FROM.FROM.GetNonIdeologyName] versucht, seine Zuständigkeiten im Einflussbereich von [FROM.GetAdjective] auszuweiten, indem er die Verwaltung von [ROOT.GetNameDef] übernimmt. Wenn wir zustimmen, werden wir nicht mehr direkt dem [FROM.GetAdjective] unterstellt sein, aber uns werden immer noch die Mittel fehlen, um auf der Weltbühne unabhängig zu handeln."
IRQ_political_events.17.a:		"Dies ist eine willkommene Änderung."
IRQ_political_events.17.b:		"Wir sind mit der derzeitigen Regelung zufrieden."
IRQ_political_events.18.t:		"[FROM.GetNameDefCap] stimmt dem Transfer zu"
IRQ_political_events.18.desc:		"Heute ist ein freudiger Tag für unsere Nation, da wir offiziell die Kontrolle über die Verwaltung von [455.GetName] übernehmen. Dies ist ein bedeutender Schritt auf dem Weg, die größere arabische Welt unter unserer Herrschaft zu vereinen. "
IRQ_political_events.18.a:		"Zeit zum Feiern!"
IRQ_political_events.19.t:		"[FROM.GetNameDefCap] lehnt Übertragung ab"
IRQ_political_events.19.desc:		"Aufgrund einer Unzahl von Komplikationen hat [FROM.GetNameDef] unseren Plan, die Verantwortung für [455.GetName] zu übernehmen, abgelehnt. Trotz all unserer Bemühungen, die [FROM.GetAdjective] zufrieden zu stellen, scheinen sie uns immer noch mit Verachtung und Misstrauen zu betrachten."
IRQ_political_events.19.a:		"Ein schlimmer Tag für [ROOT.GetNonIdeologyName] und [455.GetName]."
IRQ_political_events.20.t:		"Die Verwaltung von [FROM.GetNameDef] lehnt den Vorschlag ab"
IRQ_political_events.20.desc:		"Die Regierung von [FROM.GetAdjective] hat den Plan abgelehnt, die Verantwortung für ihr Land an [IRQ.GetNonIdeologyName] zu übertragen. Wir hatten gedacht, dass sie sich darüber freuen würden, aber es scheint, dass sie lieber bei dem Teufel bleiben, den sie kennen."
IRQ_political_events.20.a:		"Das ist sicherlich überraschend."
IRQ_political_events.21.t:		"[FROM.GetNameDefCap] fordert die Kontrolle über [454.GetName]"
IRQ_political_events.21.desc:		"Die Regierung von [FROM.GetNameDef] hat unseren sofortigen Rückzug aus [PAL.GetName] nach den jüngsten Gewaltausbrüchen in dem Gebiet gefordert. Sie argumentieren, dass sie besser für die Verwaltung des Mandats geeignet sind und dass unsere Verwaltung ihren arabischen Mitbürgern schadet. Während ein Rückzug für unser Militär von Vorteil wäre, könnte der außenpolitische Schaden erheblich sein."
IRQ_political_events.21.a:		"Treffen Sie Vorkehrungen für den Transfer, aber konsultieren Sie zuerst die Einheimischen."
IRQ_political_events.21.b:		"Sie vergessen ihren Platz."
IRQ_political_events.22.t:		"[FROM.FROM.GetNonIdeologyName] Plans to Take Over"
IRQ_political_events.22.desc:		"Die [FROM.GetAdjective] Regierung plant den Rückzug aus [ROOT.GetName] und die Übergabe der Verwaltung an [IRQ.GetNameDef]. Wenn wir nicht sofort Pläne schmieden, um den Prozess zu stören, werden wir innerhalb weniger Tage Befehle von [IRQ.Capital.GetCapitalVictoryPointName] entgegennehmen."
IRQ_political_events.22.a:		"Die derzeitige Regelung ist unhaltbar..."
IRQ_political_events.22.b:		"Wir haben unsere eigene Agenda."
IRQ_political_events.23.t:		"[ENG.GetNameDefCap] stimmt dem Transfer zu"
IRQ_political_events.23.desc:		"Die Regierung von [ENG.GetAdjective] hat verstanden, dass die Situation für ihre Streitkräfte unhaltbar war, und hat sich bereit erklärt, sich aus [454.GetName] zurückzuziehen und uns die Autorität für die Region zu übertragen."
IRQ_political_events.23.a:		"Die arabische Solidarität hat heute gewonnen."
IRQ_political_events.24.t:		"[FROM.GetNameDefCap] lehnt Übergabe ab"
IRQ_political_events.24.desc:		"Aufgrund einer Vielzahl von Komplikationen hat [FROM.GetNameDef] unseren Plan, die Verantwortung für [454.GetName] zu übernehmen, abgelehnt. Obwohl wir eine Option angeboten haben, die es den [ENG.GetAdjective] ermöglicht hätte, sich friedlich aus der Region zurückzuziehen, haben sie sich stattdessen dafür entschieden, ihre blutige und teure Besetzung der Region fortzusetzen, koste es, was es wolle."
IRQ_political_events.24.a:		"Die arabische Welt weint heute."
IRQ_political_events.24.b:		"Wir werden das nicht hinnehmen. Unsere Zusammenarbeit mit [FROM.GetNameDefCap] ist beendet."
IRQ_political_events.25.t:		"Die Verwaltung von [FROM.GetNameDef] lehnt den Vorschlag ab"
IRQ_political_events.25.desc:		"Die Regierung von [FROM.GetAdjective] hat den Plan abgelehnt, die Verantwortung für ihr Land an [IRQ.GetNonIdeologyName] zu übertragen. Wir dachten, das würde sie erfreuen, aber es scheint, dass sie lieber bei dem Teufel bleiben, den sie kennen."
IRQ_political_events.25.a:		"Imperialistische Lakaien"
IRQ_political_events.26.t:		"[FROM.GetNameDefCap] bietet Föderationsmitgliedschaft an"
IRQ_political_events.26.desc:		"Diplomaten von [FROM.GetNameDef] sind mit einem Angebot zur Mitgliedschaft in ihrer Föderation an uns herangetreten. Obwohl ein Beitritt zweifellos wirtschaftliche und sicherheitspolitische Vorteile hätte, müssten wir einen Großteil unserer Autonomie aufgeben."
IRQ_political_events.26.a:		"Gemeinsam sind wir stärker."
IRQ_political_events.26.b:		"Wir sind im Moment nicht daran interessiert."
IRQ_political_events.26.c:		"Wir werden niemals unsere Souveränität aufgeben!"
IRQ_political_events.27.t:		"[FROM.GetNameDefCap] stimmt der Föderationsmitgliedschaft zu"
IRQ_political_events.27.desc:		"[FROM.GetNameDefCap] hat weise entschieden, die Mitgliedschaft in der Föderation zu akzeptieren. Unsere Beamten und Diplomaten treffen alle Vorkehrungen für einen zügigen Integrationsprozess."
IRQ_political_events.27.a:		"Gemeinsam sind wir stärker."
IRQ_political_events.28.t:		"[FROM.GetNameDefCap] lehnt die Mitgliedschaft in der Föderation ab"
IRQ_political_events.28.desc:		"[FROM.GetNameDefCap] hat törichterweise beschlossen, die Mitgliedschaft in der Föderation abzulehnen. Sie haben jedoch nicht angedeutet, dass sie gegen einen Beitritt in der Zukunft sind, wenn ihr Volk vielleicht empfänglicher ist."
IRQ_political_events.28.a:		"Vielleicht ändern sie ihre Meinung ja noch?"
IRQ_political_events.29.t:		"[FROM.GetNameDefCap] ist gegen die Föderation"
IRQ_political_events.29.desc:		"[FROM.GetNameDefCap] hat unser Angebot, der Föderation beizutreten, schroff zurückgewiesen. Sie beharren darauf, dass sie eine solche Vereinbarung niemals freiwillig akzeptieren werden, weil sie sich Sorgen über die Auswirkungen auf ihr Land machen. "
IRQ_political_events.29.a:		"Wie kurzsichtig von ihnen..."
rejected_hashemite_federation_tt:		"§Wir werden nicht länger in der Lage sein, [FROM.GetNameDef] in unsere Föderation einzuladen!"
IRQ_regent_turned_down_absolute_powers:		"§YAbd Al-Ilah§! hat eine Gelegenheit zur Wiederherstellung der absoluten Monarchie abgelehnt."
IRQ_political_events.30.t:		"[FROM.GetNameDef] fordert die Kontrolle über [553.GetName]"
IRQ_political_events.30.desc:		"Die Regierung von [FROM.GetNameDef] hat uns kühn aufgefordert, die Kontrolle über den Libanon abzugeben. Sie beruft sich auf ihre Pflicht, die arabischen Völker der Region zu schützen und zu vereinen. Während sie ihre Forderungen in der Sprache des Panarabismus formulieren, ist es klar, dass die strategische Lage und das wirtschaftliche Potenzial des Territoriums, einschließlich seiner wertvollen Häfen und Infrastruktur, für ihre Ambitionen von zentraler Bedeutung sind. Wenn wir ihre Forderungen ablehnen, ist es unwahrscheinlich, dass sie die Angelegenheit friedlich ruhen lassen."
IRQ_political_events.30.a:		"Wir können uns keinen weiteren Krieg leisten."
IRQ_political_events.30.b:		"Sie bluffen."
IRQ_political_events.31.t:		"[FROM.GetNameDefCap] fordert die Kontrolle über [553.GetName]"
IRQ_political_events.31.desc:		"Die Regierung von [FROM.GetNameDef] hat nach den jüngsten Gewaltausbrüchen in dem Gebiet unseren sofortigen Rückzug aus [PAL.GetName] gefordert. Sie argumentieren, dass sie besser für die Verwaltung des Mandats geeignet sind und dass unsere Verwaltung ihren arabischen Mitbürgern schadet. Während ein Rückzug für unser Militär von Vorteil wäre, könnte der außenpolitische Schaden erheblich sein."
IRQ_political_events.31.a:		"Treffen Sie Vorkehrungen für den Transfer, aber konsultieren Sie zuerst die Einheimischen."
IRQ_political_events.31.b:		"Sie vergessen ihren Platz."
IRQ_political_events.32.t:		"[FROM.FROM.GetNonIdeologyName] Plans to Take Over"
IRQ_political_events.32.desc:		"Die [FROM.GetAdjective] Regierung plant den Rückzug aus [ROOT.GetName] und die Übergabe der Verwaltung an [IRQ.GetNameDef]. Wenn wir nicht sofort Pläne schmieden, um den Prozess zu stören, werden wir innerhalb weniger Tage Befehle von [IRQ.Capital.GetCapitalVictoryPointName] entgegennehmen."
IRQ_political_events.32.a:		"Die derzeitige Regelung ist unhaltbar..."
IRQ_political_events.32.b:		"Wir haben unsere eigene Agenda."
IRQ_political_events.33.t:		"[ENG.GetNameDefCap] stimmt der Versetzung zu"
IRQ_political_events.33.desc:		"Die Regierung von [ENG.GetAdjective] hat verstanden, dass die Situation für ihre Streitkräfte unhaltbar war, und hat sich bereit erklärt, sich aus [454.GetName] zurückzuziehen und uns die Autorität für die Region zu übertragen."
IRQ_political_events.33.a:		"Die arabische Solidarität hat heute gewonnen."
IRQ_political_events.34.t:		"[FROM.GetNameDefCap] lehnt Übergabe ab"
IRQ_political_events.34.desc:		"Aufgrund einer Vielzahl von Komplikationen hat [FROM.GetNameDef] unseren Plan, die Verantwortung für [553.GetName] zu übernehmen, abgelehnt. Obwohl wir eine Option angeboten haben, die es den [ENG.GetAdjective] ermöglicht hätte, sich friedlich aus der Region zurückzuziehen, haben sie sich stattdessen dafür entschieden, ihre blutige und teure Besetzung der Region fortzusetzen, koste es, was es wolle."
IRQ_political_events.34.a:		"Die arabische Welt weint heute."
IRQ_political_events.35.t:		"Regierung von [FROM.GetNameDef] lehnt Vorschlag ab"
IRQ_political_events.35.desc:		"Die Regierung von [FROM.GetAdjective] hat den Plan abgelehnt, die Verantwortung für ihr Land an [IRQ.GetNonIdeologyName] zu übertragen. Wir hatten geglaubt, dies würde sie erfreuen, aber es scheint, dass sie lieber bei dem Teufel bleiben, den sie kennen."
IRQ_political_events.35.a:		"Imperialistische Lakaien"
IRQ_political_events.40.t:		"[FROM.GetNameDefCap] Fordert Syrien"
IRQ_political_events.40.desc:		"Die Regierung von [FROM.GetNameDef] hat uns formell gebeten, die Kontrolle über Syrien an ihre Behörde zu übergeben. Sie argumentieren, dass Syrien als integraler Bestandteil der arabischen Welt mit [FROM.GetNameDef] unter einer einzigen Verwaltung vereint werden sollte, um Stabilität und Wohlstand in der Region zu gewährleisten. Während sie ihre Forderung als einen Schritt in Richtung panarabische Einheit darstellen, würde die Abtretung Syriens unseren Einfluss im Nahen Osten erheblich schmälern. Eine Ablehnung ihres Vorschlags könnte die Beziehungen weiter belasten und möglicherweise zu einer Eskalation führen."
IRQ_political_events.40.a:		"Wir haben keine andere Wahl."
IRQ_political_events.40.b:		"Auf keinen Fall!"
IRQ_political_events.41.t:		"[FROM.GetNameDefCap] Beabsichtigt, uns zu versetzen"
IRQ_political_events.41.desc:		"In einer überraschenden Entwicklung hat die Regierung von [FROM.GetNameDef] zugestimmt, die Autorität über uns an [FROM.FROM.GetNameDef] zu übertragen. Viele in unserer Regierung fragen sich, ob dieses Abkommen wirklich unsere Interessen widerspiegelt oder ob wir nur als Spielball in einem größeren geopolitischen Spiel benutzt werden. Es ist an der Zeit zu entscheiden, ob wir diese Übertragung akzeptieren oder uns gegen die Auferlegung einer ausländischen Kontrolle wehren."
IRQ_political_events.41.a:		"Wir werden besser dran sein."
IRQ_political_events.41.b:		"Das derzeitige Arrangement passt zu uns."
IRQ_political_events.42.t:		"[FROM.GetNameDefCap] lehnt den Antrag ab"
IRQ_political_events.42.desc:		"Die Regierung von [FROM.GetNameDef] hat unseren Vorschlag, Syrien unserer Autorität zu unterstellen, rundweg abgelehnt und unsere Vision von arabischer Einheit und regionaler Stabilität zurückgewiesen. Diese Weigerung untergräbt die Bemühungen um eine Konsolidierung der arabischen Welt und verwehrt dem syrischen Volk die Chance, sich einem stärkeren, geeinten Staat anzuschließen. Die Frage ist nun, ob wir den diplomatischen Weg weiter verfolgen oder uns auf eine energischere Lösung dieses Streits vorbereiten."
IRQ_political_events.42.a:		"Wir sollten das Thema nicht forcieren."
IRQ_political_events.42.b:		"Wir haben andere Möglichkeiten, das Land zu erobern."
IRQ_political_events.43.t:		"[FROM.GetNameDefCap] stimmt der Bitte zu"
IRQ_political_events.43.desc:		"[FROM.GetNameDef] hat unserem Vorschlag zugestimmt, Syrien unserer Autorität zu unterstellen, was einen bedeutenden Schritt zur Vereinigung der arabischen Welt darstellt. Dieses historische Abkommen stärkt unsere Führungsposition in der Region und bringt uns der Verwirklichung der Vision einer geeinten und wohlhabenden arabischen Nation näher."
IRQ_political_events.43.a:		"Ausgezeichnet!"
IRQ_political_events.50.t:		"[FROM.GetNameDefCap] bittet Kuwait"
IRQ_political_events.50.desc:		"Die Regierung von [FROM.GetNameDef] hat uns förmlich gebeten, die Kontrolle über Kuwait an sie zu übertragen. Sie argumentieren, dass Kuwait als integraler Bestandteil der arabischen Welt mit [FROM.GetNameDef] unter einer einzigen Verwaltung vereint werden sollte, um Stabilität und Wohlstand in der Region zu gewährleisten. Während sie ihre Forderung als einen Schritt in Richtung panarabische Einheit darstellen, würde die Abtretung von Kuwait unseren Einfluss im Nahen Osten erheblich schmälern. Eine Ablehnung ihres Vorschlags könnte die Beziehungen weiter belasten und möglicherweise zu einer Eskalation führen."
IRQ_political_events.50.a:		"Wir haben keine andere Wahl."
IRQ_political_events.50.b:		"Auf keinen Fall!"
IRQ_political_events.51.t:		"[FROM.GetNameDefCap] Beabsichtigt, uns zu versetzen"
IRQ_political_events.51.desc:		"In einer überraschenden Entwicklung hat die Regierung von [FROM.GetNameDef] zugestimmt, die Autorität über uns an [FROM.FROM.GetNameDef] zu übertragen. Viele in unserer Regierung fragen sich, ob dieses Abkommen wirklich unsere Interessen widerspiegelt oder ob wir nur als Spielball in einem größeren geopolitischen Spiel benutzt werden. Es ist an der Zeit zu entscheiden, ob wir diese Übertragung akzeptieren oder uns gegen die Auferlegung einer ausländischen Kontrolle wehren."
IRQ_political_events.51.a:		"Wir werden besser dran sein."
IRQ_political_events.51.b:		"Das derzeitige Arrangement passt zu uns."
IRQ_political_events.52.t:		"[FROM.GetNameDefCap] lehnt den Antrag ab"
IRQ_political_events.52.desc:		"Die Regierung von [FROM.GetNameDef] hat unseren Vorschlag, Kuwait unserer Autorität zu unterstellen, rundweg abgelehnt und unsere Vision von arabischer Einheit und regionaler Stabilität zurückgewiesen. Diese Ablehnung untergräbt die Bemühungen um eine Konsolidierung der arabischen Welt und verwehrt dem kuwaitischen Volk die Chance, sich einem stärkeren, geeinten Staat anzuschließen. Die Frage ist nun, ob wir den diplomatischen Weg weiter verfolgen oder uns auf eine energischere Lösung dieses Streits vorbereiten sollen."
IRQ_political_events.52.a:		"Wir sollten das Thema nicht forcieren."
IRQ_political_events.52.b:		"Wir haben andere Möglichkeiten, das Land zu erobern."
IRQ_political_events.53.t:		"[FROM.GetNameDefCap] stimmt der Bitte zu"
IRQ_political_events.53.desc:		"[FROM.GetNameDef] hat unserem Vorschlag zugestimmt, Kuwait unserer Autorität zu unterstellen, was einen bedeutenden Schritt zur Vereinigung der arabischen Welt darstellt. Dieses historische Abkommen stärkt unsere Führungsposition in der Region und bringt uns der Verwirklichung der Vision einer geeinten und wohlhabenden arabischen Nation näher."
IRQ_political_events.53.a:		"Ausgezeichnet!"
IRQ_political_events.60.t:		"[FROM.GetNameDefCap] Bietet Frieden"
IRQ_political_events.60.desc:		"Angesichts des zunehmenden Drucks der Alliierten haben die Usurpatoren in [FROM.GetNonIdeologyName] ein Friedensangebot gemacht. Sie bieten an, den Regenten wieder einzusetzen und unsere Autorität wiederherzustellen, wenn die Feindseligkeiten eingestellt werden und ihre territoriale Integrität gewahrt bleibt. Auch wenn dieser Vorschlag die Vergeblichkeit weiteren Widerstands einräumt, stellt er eine deutliche Abkehr von den Ambitionen des Goldenen Quadrats dar und könnte zu Unruhen unter ihren Anhängern führen."
IRQ_political_events.60.a:		"Nun gut."
IRQ_political_events.60.b:		"Man kann ihnen nicht trauen."
IRQ_political_events.61.t:		"[FROM.GetNameDefCap] nimmt Friedensabkommen an"
IRQ_political_events.61.desc:		"[FROM.GetNameDefCap] hat unserem Friedensangebot zugestimmt. Die Bedingungen sehen vor, dass wir uns der Autorität von [FROM.GetAdjective] unterwerfen und damit den Konflikt beenden. Auch wenn der Krieg vorbei ist, könnte diese Entscheidung interne Unruhen auslösen, da diejenigen, die für Souveränität und Unabhängigkeit gekämpft haben, mit der Wiedererlangung der Kontrolle über die Nation durch das Ausland konfrontiert sind."
IRQ_political_events.61.a:		"Wenigstens können wir das Blutvergießen beenden."
IRQ_political_events.62.t:		"[FROM.GetNameDefCap] lehnt Friedensabkommen ab"
IRQ_political_events.62.desc:		"[FROM.GetNameDefCap] hat unseren Friedensvorschlag abgelehnt und besteht auf vollständiger Unterwerfung ohne Kompromisse. Da die Verhandlungen scheitern, wird der Konflikt weitergehen und wir müssen uns der ganzen Macht der Alliierten stellen. Der vor uns liegende Weg wird voller Herausforderungen sein, aber unsere Entschlossenheit zur Unabhängigkeit bleibt unerschüttert."
IRQ_political_events.62.a:		"Dann werden wir bis zum bitteren Ende kämpfen."
IRQ_political_events.70.t:		"$IRQ_bakr_sidqi$ überlebt Attentatsversuch"
IRQ_political_events.70.desc:		"In Mosul war $IRQ_bakr_sidqi$ heute das Ziel eines Attentats durch den Gefreiten Abdullah Al-Talafari, als der junge Mann eine Waffe auf Sidqi und seine rechte Hand Muhmmad Ali Jawad richtete. Bei dem Versuch wurde Jawad schwer verletzt, aber Sidqi kam ohne einen Kratzer davon."
IRQ_political_events.70.a:		"Wie viel Glück kann ein Mann haben?"
IRQ_political_events.71.t:		"Legitimierung unserer Herrschaft"
IRQ_political_events.71.desc:		"Viele im Land akzeptieren das Goldene Quadrat immer noch nicht als legitime Herrscher und betrachten uns als Usurpatoren und illegitime Schurken. Um dieses Problem zu lösen, haben sich unsere Minister einige Lösungen einfallen lassen. Entweder wir ignorieren einfach die Rufe des Volkes und hoffen, dass sie mit der Zeit verstummen, oder wir setzen den Emir von Taif als neuen Regenten für Faisal II. ein. Es gibt jedoch immer die Möglichkeit, sich zu einer Republik zu reformieren, auch wenn das bei unserer religiösen Bevölkerung sehr unpopulär sein könnte..."
IRQ_political_events.71.a:		"Wir sind schon legitim genug"
IRQ_political_events.71.b:		"$IRQ_sharaf_bin_rajeh$ wird genügen"
IRQ_political_events.71.c:		"Wir brauchen einen Präsidenten, keinen König!"
IRQ_political_events.72.t:		"Der Tod von Ghazi I"
IRQ_political_events.72.desc:		"Wie wir erfahren haben, ist unser großer König Ghazi I. heute auf tragische Weise bei einem Autounfall ums Leben gekommen, als er mit seinem Sportwagen in Bagdad unterwegs war. Einige behaupten, es sei einfach ein Unfall gewesen, während andere spekulieren, dass es auf Befehl von Nuri al-Said geschah, weil der König die Vereinigung mit Kuwait plante, aber niemand weiß es genau. Eines ist jedoch klar: Jemand muss die Fackel in die Hand nehmen und seinen Platz einnehmen, jetzt wo er nicht mehr da ist."
IRQ_political_events.72.a:		"Abd Al-Ilah wird die Regentschaft antreten"
IRQ_political_events.72.b:		"Faisal II. sollte ihn direkt ersetzen!"
IRQ_political_events.73.t:		"Wachsende Unterstützung für absolute haschemitische Herrschaft"
IRQ_political_events.73.desc:		"Nach den jüngsten Trauerzügen für den verstorbenen Ghazi I. ist die Stimmung in der Bevölkerung für den Monarchen aufgeheizt. Dies ist eine gute Gelegenheit für Abd Al-Ilah, die Macht der Premierminister, die unsere absolute Herrschaft seit langem untergraben haben, zurückzudrängen und damit einen ersten Schritt zur vollständigen Wiederherstellung der haschemitischen Herrschaft in Arabien zu tun."
IRQ_political_events.73.a:		"Abd Al-Ilah wird das haschemitische Geburtsrecht zurückfordern"
IRQ_political_events.73.b:		"Es ist unerlässlich, dass wir den konstitutionellen Charakter unserer Monarchie beibehalten!"
IRQ_kurdistan_events.1.t:		"Kurdische Nationalisten bitten uns um Hilfe"
IRQ_kurdistan_events.1.desc:		"Wir haben soeben Mitteilungen von kurdischen Nationalisten in [IRQ.GetNameDefCap] erhalten, die uns um Hilfe für ihre Revolution bitten."
IRQ_kurdistan_events.1.a:		"Natürlich werden wir helfen!"
IRQ_kurdistan_events.1.b:		"Wir sind nicht an einer kleinen Revolution in [IRQ.GetNameDefCap] interessiert."
IRQ_kurdistan_events.2.t:		"[FROM.GetNameDefCap] erklärt sich bereit, uns zu helfen."
IRQ_kurdistan_events.2.desc:		"Unsere Kontakte in [FROM.GetNameDefCap] haben auf unsere Bitte um Hilfe reagiert und sich bereit erklärt, uns zu unterstützen."
IRQ_kurdistan_events.2.a:		"Das sind großartige Neuigkeiten!"
IRQ_kurdistan_events.3.t:		"[FROM.GetNameDefCap] weigert sich, uns zu helfen"
IRQ_kurdistan_events.3.desc:		"Unsere Kontakte in [FROM.GetNameDefCap] haben auf unsere Bitte um Hilfe reagiert und sich leider geweigert, uns zu helfen. Wir sind auf uns allein gestellt."
IRQ_kurdistan_events.3.a:		"Wir dürfen uns davon nicht entmutigen lassen!"
GOE_IRQ_news.1.t:		"Die große palästinensische Revolte"
GOE_IRQ_news.1.d:		"Nach Jahren der Unzufriedenheit über die Verwaltung von [ENG.GetAdjective] und die Migration in die Region seit dem Großen Krieg ist die arabische Bevölkerung von [PAL.GetName] in einen Aufstand ausgebrochen. Die Beteiligten der Revolte fordern den Abzug der [ENG.GetAdjective] Streitkräfte und die volle Unabhängigkeit Palästinas. Obwohl es unwahrscheinlich ist, dass die [ENG.GetAdjective] diese Forderungen akzeptieren werden, ist es klar, dass die Verwaltung des Territoriums für sie zu einem immer kostspieligeren Unterfangen wird."
GOE_IRQ_news.1.a:		"Wir stehen auf der Seite der Rebellen."
GOE_IRQ_news.1.b:		"Wie wird [ENG.GetNameDef] reagieren?"
GOE_IRQ_news.1.c:		"Wir müssen die Kontrolle über die Situation zurückgewinnen."
the_1936_PAL_revolt_has_happened:		"§Der palästinensische Aufstand hat stattgefunden und die [ENG.GetAdjective] haben Dissidenten ins Exil geschickt."
GOE_IRQ_news.2.t:		"[FROM.GetNameDefCap] lehnt den Vertrag von Ankara ab"
GOE_IRQ_news.2.d:		"In einem mutigen Schritt hat die Regierung von [FROM.GetNameDef] den Vertrag von Ankara offiziell abgelehnt und die darin enthaltenen territorialen Vereinbarungen als Relikte einer vergangenen Ära abgetan. Diese Entscheidung stellt die bestehenden Grenzen und Vereinbarungen zwischen [TUR.GetNameDef], [PER.GetNameDef] und [FROM.GetNonIdeologyName] direkt in Frage und stürzt die Region in politische Unsicherheit. Sowohl [TUR.Capital.GetCapitalVictoryPointName] als auch [PER.Capital.GetCapitalVictoryPointName] haben sich in der Öffentlichkeit über diese Missachtung empört, und die Spannungen nehmen zu, während die Rufe nach einer entschlossenen Antwort auf [FROM.GetNameDef]s einseitiges Vorgehen lauter werden."
GOE_IRQ_news.2.a:		"Wir sollten uns entsprechend vorbereiten."
GOE_RAJ_mughals_peace_deal.1.t:		"[UK_INDIA.GetName] bietet territoriale Zugeständnisse an"
GOE_RAJ_mughals_peace_deal.1.desc:		"Endlich haben sich die wirtschaftlichen Härten eines andauernden Krieges als zu groß für die [UK_INDIA.GetAdjective] Regierung erwiesen. Trotz der Einwände ihres Oberherrn hat sie uns im Gegenzug für den Frieden bedeutende territoriale Zugeständnisse angeboten."
GOE_RAJ_mughals_peace_deal.1.a:		"Prächtig"
