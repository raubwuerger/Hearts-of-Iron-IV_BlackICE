GOE_RAJ_generals.6.a:		""
GOE_RAJ_generals.7.t:		"[RAJ.GetNameDefCap] bittet um den Kauf von Versorgungsgütern"
GOE_RAJ_generals.7.desc:		"[RAJ.GetLeader] hat uns eine Anfrage zum Kauf von Versorgungsgütern von [ENG.GetAdjective] zivilen Industrien geschickt. Man hat uns angeboten, für die Vermittlung dieser Geschäfte eine saftige Provision zu erhalten."
GOE_RAJ_generals.7.a:		"Eine für beide Seiten vorteilhafte Vereinbarung!"
GOE_RAJ_generals.7.b:		"Wir sind nicht interessiert."
GOE_RAJ_generals.8.t:		"[ENG.GetNameDefCap] nimmt an!"
GOE_RAJ_generals.8.desc:		"[ENG.GetLeader] ist auf unseren Vorschlag eingegangen und hat zugestimmt, dass wir von ihnen Versorgungsgüter kaufen."
GOE_RAJ_generals.8.a:		"Großartig!"
GOE_RAJ_generals.9.t:		"[ENG.GetNameDefCap] lehnt unser Angebot ab."
GOE_RAJ_generals.9.desc:		"[ENG.GetLeader] hat auf unser Angebot geantwortet und erklärt, dass sie nicht interessiert sind."
GOE_RAJ_generals.9.a:		"Das ist sehr schade."
