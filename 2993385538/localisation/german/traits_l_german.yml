seawolf:0	"Seewolf"
seawolf_desc:0	"§LDer Seewolf ist besonders geschickt im Konvoiüberfall§!"
superior_tactician:0	"Überlegener Taktiker"
superior_tactician_desc:0	"§LA ist Meister der Flottenpositionierung§!"
old_guard:0	"Alte Garde"
old_guard_desc:0	"§LEr ist zwar nicht der brillanteste Offizier, aber es ist unwahrscheinlich, dass er Ärger macht§!"
old_guard_navy:0	"Alte Garde"
old_guard_navy_desc:0	"§LAuch wenn er nicht der brillanteste Offizier ist, wird er wahrscheinlich keinen Ärger machen§!"
trickster:0	"Trickster"
trickster_desc:0	"§LWenn du im Kampf das Unerwartete tust, kannst du dir einen großen Vorteil verschaffen§!"
logistics_wizard:0	"Logistik-Zauberer"
logistics_wizard_desc:0	"§Lieferungen kommen nie zu spät, aber auch nie zu früh. Sie kommen genau dann an, wenn ich sie brauche§!"
defensive_doctrine:0	"Defensiv-Doktrin"
defensive_doctrine_desc:0	"§LIch bin besonders geübt im Kampf in der Defensive!§!"
offensive_doctrine:0	"Offensiv-Doktrin"
offensive_doctrine_desc:0	"§LMehr auf Offensive bedacht als die meisten anderen!§!"
winter_specialist:0	"Winterspezialist"
winter_specialist_desc:0	"§LVerfügt über ein intuitives Verständnis für die Schwierigkeiten des Kampfes unter kalten Bedingungen.§!"
trait_engineer:0	"Ingenieur"
trait_engineer_desc:0	"§LBeherrscht die Kunst, Flüsse zu überqueren und Feldbefestigungen zu bauen.§!"
fortress_buster:0	"Festungsknacker"
fortress_buster_desc:0	"§LDer Angriff auf eine Festung stellt für diesen Offizier kein Hindernis dar!§!"
panzer_leader:0	"Panzerführer"
panzer_leader_desc:0	"§LEin Naturtalent mit Panzern und mechanisierten Streitkräften§!"
commando_trait:0	"Kommando"
commando_trait_desc:0	"§LErfahren in amphibischen Operationen, Luftangriffen und kalten Wetterbedingungen - das Kommandospezialist ist ein Mann mit vielen Talenten.§!"
fast_planner:0	"Schneller Planer"
fast_planner_desc:0	"§LKennt alle Abkürzungen bei der Vorbereitung auf eine Schlacht - Effizienz ist der Schlüssel§!"
thorough_planner:0	"Gründlicher Planer"
thorough_planner_desc:0	"§LEr ist ein strategischer Meisterdenker. Mit der Zeit wird der gut ausgearbeitete Plan der beste sein!§!"
organisational_leader:0	"Verstärkungsspezialist"
organisational_leader_desc:0	"§LKennt jeden Trick, um schneller als jeder andere Verstärkung zu bekommen!§!"
inspirational_leader:0	"Charismatisch"
inspirational_leader_desc:0	"§LEin natürlicher Anführer. Männer stellen sich ihren schlimmsten Ängsten, wenn sie von einem mächtigen Anführer unterstützt werden.§!"
desert_fox:0	"Wüstenfuchs"
desert_fox_desc:0	"§LFühlt sich beim Kampf in der Wüste pudelwohl!§!"
swamp_fox:0	"Sumpfkämpfer"
swamp_fox_desc:0	"§LDer Sumpfkampfexperte ist zwar etwas durchnässt, kennt sich aber in Sümpfen und Tümpeln aus!§!"
trait_mountaineer:0	"Gebirgsjäger"
trait_mountaineer_desc:0	"§LEin hervorragender Bergsteiger und erfahren in der Kriegsführung in den Bergen!§!"
trait_paratrooper:0	"Fallschirmjäger"
trait_paratrooper_desc:0	"§LExperte für die Organisation und Durchführung von Luftangriffen.§!"
hill_fighter:0	"Hügelkämpfer"
hill_fighter_desc:0	"§LKann hervorragend in hügeligem Gelände kämpfen!§!"
jungle_rat:0	"Dschungelratte"
jungle_rat_desc:0	"§Lässt sich von Nagetieren ungewöhnlicher Größe nicht abschrecken und ist geschickt im Dschungelkrieg.§!"
ranger:0	"Waldjäger"
ranger_desc:1	"§LRanger gehen voran, besonders wenn es um den Kampf in Wald- oder Dschungelgebieten geht.§!"
urban_assault_specialist:0	"Stadtkampfspezialist"
urban_assault_specialist_desc:0	"§LEin Experte im Kampf in fremden Häusern und im Verursachen von Chaos auf den Straßen der Menschen.§!"


blockade_runner:0	"Blockadebrecher"
blockade_runner_desc:0	"§LKann sich schnell aus dem Seegefecht zurückziehen!§!"


fly_swatter:0	"Fliegenklatsche"
fly_swatter_desc:0	"§LDie Fliegenklatsche ist sich der Gefahr bewusst, die selbst für unsere stärksten Schiffe durch Flugzeuge besteht, und beseitigt schnell alles, was fliegt.§!"


air_controller:0	"Fluglotse"
air_controller_desc:0	"§LAls Experte auf dem aufstrebenden Gebiet der Marinefliegerei ist der Fluglotse die natürliche Wahl für das Kommando über Flugzeugträger§!"


bearer_of_artillery:0	"Artillerie Experte"
bearer_of_artillery_desc:0	"§LMacht ausgezeichneten Gebrauch von der Artillerie§!"


