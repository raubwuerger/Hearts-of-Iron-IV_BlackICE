political.9.d_nl:0	"Manche werden sagen, sie hätten es kommen sehen. Sowohl diejenigen, die vor den Gefahren des Faschismus gewarnt haben, als auch diejenigen, die ihn als Retter von [Root.GetName] gepriesen haben, haben heute gesehen, wie ihre Prophezeiungen Wirklichkeit wurden, da [Root.GetLeader] in [Root.Capital.GetName] verkündet hat, dass [CHI.GetName] den faschistischen Weg einschlagen wird. Alle oppositionellen Stimmen werden innerhalb weniger Stunden zum Schweigen gebracht.\n\n[Root.GetLeader] hat zudem nicht vor, Widerstand aufkommen zu lassen. Der Ausnahmezustand wurde verhängt, und angesichts der derzeitigen Veränderungen ist es unwahrscheinlich, dass sich die Lage danach wesentlich ändern wird. "
political.10.d_nl:1	"Zwar waren die Versuche der faschistischen Bewegung, nationalistische Gefühle wiederzubeleben, teilweise erfolgreich, doch der Widerstand gegen diese Ideen ist nach wie vor groß. [Root.GetLeader] ist enttäuscht über den Mangel an Vertrauen, den die [Root.GetAdjective] Bevölkerung selbst in [Root.GetRulingParty] zu haben scheint. \n\n[Root.GetLeader] sind weiterhin davon überzeugt, dass das Volk schließlich seinen Stolz wiederfinden wird, zögert jedoch, welche Vorgehensweise gewählt werden soll. Einige der Anhänger fordern, dass jetzt ein Staatsstreich durchgeführt wird, bevor die Feinde von [Root.GetName] Maßnahmen ergreifen. Dies bei begrenzter öffentlicher Unterstützung zu tun, würde die Nation jedoch in einen Bürgerkrieg stürzen."
