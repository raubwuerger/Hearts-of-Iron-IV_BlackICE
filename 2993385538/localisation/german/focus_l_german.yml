SOV_allied_advice_desc:0	"Obwohl die Feindseligkeiten an unserer Front nicht annähernd mit den früheren Zusammenstößen der westlichen Staaten mit Deutschland vergleichbar sind und uns wahrscheinlich nicht viel helfen werden, sollten wir dennoch beginnen, Informationen militärischer Art auszutauschen - schließlich haben die westlichen Alliierten vor uns begonnen, die Deutschen zu bekämpfen."
MR_agreement_TT:0	"Nach den Bedingungen des Molotow-Ribbentrop-Paktes müssen die Deutschen einer Reihe von Forderungen zustimmen.\n derzeit haben wir sie §G[?SOV.refused_MR]§! mal abgelehnt und sie §G[?GER.refused_MR]§! \n die ihnen erlauben, §G[?GER.allowed_MR]§! weitere Male abzulehnen\n"
