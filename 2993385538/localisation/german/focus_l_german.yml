uk_extra_tech_slot_desc:5	"Unsere Investitionen in die Industrie haben sich ausgezahlt. Unsere Forschungsmöglichkeiten sind nun erweitert."
ENG_peace_has_failed_desc:0	"Unsere Feinde haben die Grenze überschritten, und wir müssen uns zur Wehr setzen, bevor es zu spät ist. Wir werden alles aufbieten, was wir haben, und unsere Feinde bezwingen."
ENG_defend_the_commonwealth:0	"Verteidige das Commonwealth"
ENG_defend_the_commonwealth_desc:0	"Wir befinden uns im Krieg und unsere Kolonien und Protektorate sind in tödlicher Gefahr. Kein britischer Untertan, ob er nun in London oder auf der anderen Seite der Welt lebt, darf unseren Feinden in die Hände fallen!"
ENG_BEF:0	"Das britische Expeditionskorps"
ENG_BEF_desc:0	"Bilden Sie das britische Expeditionskorps"
ENG_defend_ast:0	"Australien verteidigen"
ENG_defend_ast_desc:0	"Die Japaner haben einen großen Teil des Pazifiks überrannt. Australien ist unsere Grenze im Sand, sie darf nicht fallen!"
ENG_seek_help_from_usa:0	"Suchen Sie Hilfe bei den Amerikanern"
ENG_seek_help_from_usa_desc:0	"Selbst nach Jahren der Aufrüstung fehlt es uns immer noch an wichtiger Ausrüstung, um diesen Krieg zu führen. Die Amerikaner haben uns im letzten großen Krieg geholfen, unsere Freunde jenseits des Atlantiks werden uns sicher wieder helfen."
ENG_purchase_usa_planes:0	"Kauf von amerikanischen Kampfflugzeugen"
ENG_purchase_usa_planes_desc:0	"Rosevelt hat angeboten, uns trotz der Einwände des amerikanischen Kongresses einige alte Kampfflugzeuge zu verkaufen. Wir sollten dieses Angebot schnell annehmen, bevor sie es sich anders überlegen."
ENG_purchase_usa_L_tanks:0	"Kauf amerikanischer leichter Panzer"
ENG_purchase_usa_L_tanks_desc:0	"Die Amerikaner haben zugestimmt, uns einige ihrer alten leichten Panzer zu verkaufen."
ENG_purchase_usa_M_tanks:0	"Kauf amerikanischer mittlerer Panzer"
ENG_purchase_usa_M_tanks_desc:0	"Die Amerikaner haben sich bereit erklärt, uns einige ihrer mittleren Sherman-Panzer zu verkaufen."
ENG_home_front:0	"Kümmern Sie sich um die Heimatfront"
ENG_home_front_desc:0	"Unser Volk ist nicht glücklich über den Ausbruch des Krieges. Wir müssen den Patriotismus in unserer Bevölkerung wecken, wenn wir diesen Sturm überstehen wollen."
ENG_peoples_war:0	"Der Krieg des Volkes"
ENG_peoples_war_desc:0	"Wir haben uns diesen Krieg nicht ausgesucht, aber wir werden ihn gewinnen!"
ENG_propaganda_posters:0	"Propaganda-Plakate"
ENG_propaganda_posters_desc:0	"Das Volk soll ständig an die Kriegsanstrengungen erinnert werden."
ENG_women_land_army:0	"Die Landarmee der Frauen"
ENG_women_land_army_desc:0	"Die Women's Land Army (WLA) war eine britische Zivilorganisation, die während des Zweiten Weltkriegs gegründet wurde, um Frauen die Möglichkeit zu geben, in der Landwirtschaft zu arbeiten, und die eine im Ersten Weltkrieg aufgelöste Organisation wiederbelebte und die zum Militär einberufenen Männer ersetzte. Die Frauen, die für die WLA arbeiteten, wurden gemeinhin als Land Girls bezeichnet. Die Land Army vermittelte Frauen an landwirtschaftliche Betriebe, die Arbeitskräfte benötigten, wobei die Landwirte ihre Arbeitgeber waren. Sie ernteten die Feldfrüchte und erledigten alle Arbeiten, die auch die Männer erledigen würden. Zu den namhaften Mitgliedern gehörte Joan Quennell, die später Parlamentsabgeordnete wurde."
ENG_national_registration_act:0	"Nationales Registrierungsgesetz"
ENG_national_registration_act_desc:0	"Das Gesetz führte ein nationales Register ein, das am 29. September 1939 (Tag der nationalen Registrierung) in Betrieb genommen wurde, sowie ein System von Identitätskarten und die Vorschrift, dass diese auf Verlangen vorzulegen oder innerhalb von 48 Stunden bei einer Polizeistation vorzulegen sind. Im Laufe des Zweiten Weltkriegs wurden etwa 45 Millionen Personalausweise ausgestellt.\n\nDrei Hauptgründe für die Einführung der Personalausweise waren:\n\n1. Die durch die Mobilisierung und die Massenevakuierung verursachte große Dislokation der Bevölkerung sowie die Notwendigkeit einer vollständigen Kontrolle und Planung der Arbeitskräfte in Kriegszeiten, um die Effizienz der Kriegswirtschaft zu maximieren.\n2. Die Wahrscheinlichkeit der Rationierung (eingeführt ab Januar 1940).\n3. Die Bevölkerungsstatistik. Da die letzte Volkszählung im Jahr 1931 stattgefunden hatte, gab es kaum genaue Daten, auf die man sich bei wichtigen Planungsentscheidungen stützen konnte. Das Nationale Register war de facto eine sofortige Volkszählung, und der National Registration Act ähnelt in vielerlei Hinsicht dem Census Act von 1920."
ENG_emergency_draft:0	"Notstandskonskription"
ENG_emergency_draft_desc:0	"Großbritannien ist überfallen! Alle loyalen Untertanen müssen aufstehen und kämpfen!"
ENG_bbc_cricket:0	"BBC Cricket im Fernsehen"
ENG_bbc_cricket_desc:0	"BBC Radio war der erste Sender, der über jeden Ball eines Testspiels berichtete. Live-Übertragungen von Kricket gab es bereits seit 1927, aber ursprünglich war man der Meinung, dass Testspiele zu langsam seien, um jeden einzelnen Ball kommentieren zu können. Seymour de Lotbiniere ("Lobby"), der für die Live-Sportberichterstattung zuständig war und später ein herausragender Leiter für Außenübertragungen bei der BBC wurde, erkannte jedoch, dass der ballgenaue Kommentar im Radio überzeugend sein könnte. Mitte der 1930er Jahre brachte er Howard Marshall dazu, Kricket zu kommentieren, anstatt nur zu berichten. Von Mitte der 1930er bis in die 1950er Jahre nahm der Anteil der Ball-by-Ball-Kommentare allmählich zu, aber erst mit dem Start von TMS im Jahr 1957 wurde jeder Ball für das britische Publikum behandelt. \nobert Hudson war für die Einführung von TMS verantwortlich. Er schrieb 1956 an seinen Chef von Outside Broadcasts, Charles Max-Muller, und schlug vor, die Tests vollständig zu übertragen, anstatt nur über bestimmte Zeiträume zu berichten, und schlug vor, die Frequenz des Dritten Programms (damals BBC Radio 3) zu nutzen, da das Dritte Programm damals nur abends sendete."
ENG_ration_civ_clothing:0	"Anforderung von Zivilkleidung"
ENG_ration_civ_clothing_desc:0	" "
ENG_canada_force:0	"Kanadische Panzerdivision"
ENG_canada_force_desc:0	" "
ENG_anzac_force:0	"ANZAC-Divisionen"
ENG_anzac_force_desc:0	" "
ENG_british_india_army:0	"Britisch-indische Armee"
ENG_british_india_army_desc:0	"Die Britisch-Indische Armee war die wichtigste militärische Kraft des britischen Raj, bevor sie 1947, als Indien die Unabhängigkeit erlangte, aufgelöst wurde. Einheiten der indischen Armee spielten während des Krieges eine Schlüsselrolle: Sie verteidigten Afrika, unterstützten die Invasion des Irak und des Iran und waren sogar im Pazifik im Einsatz. Bei Ausbruch des Zweiten Weltkriegs zählte die indische Armee 205.000 Mann. Im weiteren Verlauf des Zweiten Weltkriegs wurde die indische Armee zur größten Freiwilligenarmee der Geschichte und wuchs auf über 2,5 Millionen Mann an."
ENG_seek_help_abroad:0	"Hilfe im Ausland suchen"
ENG_seek_help_abroad_desc:0	"So sehr wir uns auch bemühen, unsere eigene Industrie und unsere eigenen Arbeitskräfte reichen einfach nicht aus, um unsere Feinde zu bekämpfen. Wir müssen uns an unsere Kolonien und unsere internationalen Freunde wenden, um unsere Kriegsanstrengungen zu unterstützen."
ENG_time_is_now:0	"Großbritannien steht allein da"
ENG_time_is_now_desc:0	"Das Undenkbare ist geschehen, Frankreich ist gefallen! Während der deutsche Moloch durch Europa rollt, ist das Schicksal Großbritanniens ungewiss. Wenn wir uns den Deutschen allein stellen müssen, dann werden wir das tun."
ENG_motorized_focus:5	"Eine motorisierte Armee"
ENG_motorized_focus_desc:5	"Seit kurzem experimentiert die Armee mit vollmotorisierten Infanterieeinheiten. Bisher wurden noch keine vollmotorisierten Divisionen gebildet, aber mit den richtigen Worten des Kriegsministers könnte dies bald möglich sein."
ENG_tank_focus:5	"Königliches Panzerregiment"
ENG_tank_focus_desc:5	"Großbritannien hat den Panzer erfunden, und daher sollte das Royal Tank Regiment mit den besten Panzern der Welt ausgestattet sein, was aber derzeit nicht der Fall ist. Der Ausschuss für die Entwicklung von Spezialfahrzeugen schlägt vor, ein modernes Design zu erforschen und zu entwickeln, um Großbritannien an der Spitze der Panzerentwicklung zu halten."
ENG_home_defence:5	"Landesverteidigung"
ENG_home_defence_desc:5	"Ein riesiges Imperium nützt nichts, wenn wir das britische Volk nicht schützen können. Wir sollten unsere Anstrengungen darauf konzentrieren, das Heimatland sicher zu halten."
ENG_issue_gasmasks:5	"Ausgabe von Gasmasken"
ENG_issue_gasmasks_desc:5	"Die Welt erweist sich jeden Tag als gefährlicher. Wir sollten die Zivilbevölkerung vor jeglichen Giftgasangriffen schützen. Großbritannien soll ruhig atmen können."
ENG_military_training_act:5	"£tech_mod Gesetz zur militärischen Ausbildung"
ENG_military_training_act_desc:5	"Der Große Krieg hat bei unserem Volk den Eindruck hinterlassen, dass es nicht noch einmal zu kämpfen braucht. Da die Welt immer gefährlicher wird, müssen wir sicherstellen, dass alle fähigen jungen Männer eine militärische Grundausbildung erhalten."
ENG_embargo_germany:5	"Deutschland-Embargo"
ENG_embargo_germany_desc:5	"Die deutsche Wiederaufrüstung ist eine Beleidigung und eine große Bedrohung für den Weltfrieden. Wir werden ihnen nicht die Ressourcen liefern, die sie brauchen, um ihre Kriegsmaschinerie anzuheizen."
ENG_war_with_germany:5	"Krieg mit Deutschland"
ENG_war_with_germany_desc:5	"Die Deutschen haben uns keine andere Wahl gelassen. Um der freien Welt und der Zukunft unserer Kinder willen. Es ist Zeit für einen Krieg."
ENG_swedish_intervention:5	"Schwedische Intervention"
ENG_swedish_intervention_desc:5	"Die schwedischen Bewegungen gegen die Demokratie haben einen besorgniserregenden Einfluss erlangt. Wir können nicht riskieren, dass schwedischer Stahl als Waffen in den Händen unserer Feinde landet. Die Schweden sollen frei bleiben, aber wir müssen uns ein gewisses Maß an Einfluss auf ihr Land sichern."
ENG_norwegian_intervention:5	"Norwegische Intervention"
ENG_norwegian_intervention_desc:5	"Die norwegische Demokratiebewegung ist weiter auf dem Vormarsch. Wir sollten dafür sorgen, dass ihre Politik mit unseren eigenen Interessen in Einklang steht, auch wenn wir dazu Gewalt anwenden müssen."
ENG_danish_intervention:5	"Dänische Intervention"
ENG_danish_intervention_desc:5	"Die dänische Unterstützung für die Feinde des Weltfriedens hat weiter zugenommen. Es gibt nur einen Weg, um sicherzustellen, dass sie auf unserer Seite bleiben. Wir sollten Dänemark nutzen, um ein strategisches Standbein in der Region aufzubauen, falls eine Landinvasion in Europa notwendig wird."
ENG_benelux_intervention:5	"Benelux-Intervention"
ENG_benelux_intervention_desc:5	"Das politische Umfeld in der Benelux-Region steht uns zunehmend feindlich gegenüber. Wir sollten eine klare Warnung aussenden, dass jeder Feind der Demokratie nicht geduldet wird und wir bereit sind, wenn nötig, Gewalt anzuwenden."
ENG_belgium_security:5	"Belgien sichern"
ENG_belgium_security_desc:5	"Eine Warnung war eindeutig nicht genug. Wenn die politischen Tendenzen so weitergehen wie bisher, wird Belgien eine direkte Bedrohung für unsere Gewässer darstellen. Wir müssen intervenieren und ein strategisches Standbein auf dem europäischen Festland aufbauen."
ENG_dutch_security:5	"Die Niederlande sichern"
ENG_dutch_security_desc:5	"Die politischen Bewegungen in den Niederlanden unterstützen weiterhin unsere Feinde. Die Niederlande müssen unterworfen werden, um ein freies Europa zu gewährleisten."
ENG_war_with_japan:5	"Krieg mit Japan"
ENG_war_with_japan_desc:5	"Alle anderen Möglichkeiten sind erschöpft, und die Japaner weigern sich, ihren Expansionsdrang aufzugeben. Für die Sicherheit des Britischen Reiches und der Menschen in Asien müssen wir die Japaner unterwerfen."
ENG_war_with_italy:5	"Krieg mit Italien"
ENG_war_with_italy_desc:5	"Die Italiener weigern sich, ihre Pläne für ein neues Reich aufzugeben, und haben bewiesen, dass sie bereit sind, für die Erweiterung ihrer Grenzen in den Krieg zu ziehen. Wir müssen alles in unserer Macht Stehende tun, um diese Bedrohung zu beseitigen, bevor es zu spät ist."
ENG_embargo_ussr:5	"Embargo gegen die UdSSR"
ENG_embargo_ussr_desc:5	"Die Sowjetunion wird immer mächtiger und nutzt britische Ressourcen, um ihre militärischen Anstrengungen voranzutreiben. Wir sollten ihnen den Zugang zu unserem Handel verwehren."
ENG_war_with_ussr:5	"Krieg mit der UdSSR"
ENG_war_with_ussr_desc:5	"Die Bedrohung durch die Sowjetunion nimmt trotz unserer Einwände weiter zu. Wir können eine aggressive Sowjetunion nicht dulden und haben keine andere Wahl, als für eine bessere Zukunft in den Krieg zu ziehen."
ENG_On_to_East_Africa:5	"Auf dem Weg nach Ostafrika"
ENG_On_to_East_Africa_desc:5	"Freigabe der DMZ, die Ostafrika blockiert"
ENG_general_rearmament_focus:5	"Das Aufrüstungsprogramm von 1936"
ENG_general_rearmament_focus_desc:5	"Die jüngsten Bestrebungen Deutschlands und anderer faschistischer Mächte in der Welt deuten darauf hin, dass wir in unserer Zeit vielleicht keinen Frieden haben werden. Um uns darauf vorzubereiten, sollten wir damit beginnen, die Weichen für unsere eigene Aufrüstung zu stellen, falls sich die Lage weiter verschlechtert."
ENG_artillery_focus:5	"Königliche Artillerieregimenter aufrüsten"
ENG_artillery_focus_desc:5	" "
ENG_Port_Garrisons:5	"Hafenverteidigung"
ENG_Port_Garrisons_desc:5	" "
ENG_HomeGuard:5	"Die Heimwehr"
ENG_HomeGuard_desc:5	" "
ENG_skies:5	"Blick zum Himmel"
ENG_skies_desc:5	" "
ENG_AA:5	"Luftverteidigung II"
ENG_AA_desc:5	" "
ENG_pillbox:5	"Stärkung der irischen Grenze"
ENG_pillbox_desc:5	" "
ENG_ire_guard:5	"Finanzierung der Irish Homeguard"
ENG_ire_guard_desc:5	" "
ENG_industrial_programme_focus:5	"Industrielles Programm"
ENG_industrial_programme_focus_desc:5	"Es sieht so aus, als wäre ein weiterer großer Krieg unvermeidlich. Wenn es nicht Hitler ist, wird es das Mikado sein, oder sogar die Sowjets... Die öffentliche Meinung hat sich soweit geändert, dass wir ein Programm zur allgemeinen Aufrüstung einleiten können."
ENG_industrial_programme_focus2:5	"Sparmaßnahmen"
ENG_industrial_programme_focus2_desc:5	" "
ENG_GHQ_Line:5	"Die GHQ-Linie"
ENG_GHQ_Line_desc:5	"Die GHQ Line (General Headquarters Line) war eine Verteidigungslinie, die während des Zweiten Weltkriegs im Vereinigten Königreich errichtet wurde, um eine erwartete deutsche Invasion abzuwehren. Die britische Armee hatte nach der Evakuierung von Dünkirchen den größten Teil ihrer Ausrüstung in Frankreich zurückgelassen. Daher wurde beschlossen, ein statisches System von Verteidigungslinien um Großbritannien herum zu errichten, die das Land abtrennen und die Deutschen so lange aufhalten sollten, bis mobilere Kräfte einen Gegenangriff starten konnten. Über 50 Verteidigungslinien wurden um Großbritannien herum errichtet. Nach den Küstenbefestigungen war die GHQ-Linie die längste und wichtigste, die London und das industrielle Zentrum Großbritanniens schützen sollte und die letzte Verteidigungsmöglichkeit Großbritanniens darstellte."
ENG_Limited_Liability:5	"Planung mit beschränkter Haftung"
ENG_Limited_Liability_desc:5	" "
ENG_continental_warfare:5	"£tech_mod Planung der kontinentalen Kriegsführung"
ENG_continental_warfare_desc:5	" "
ENG_tube_alloy:5	"Rohrlegierungen"
ENG_tube_alloy_desc:	"Anderson und Akers haben sich den Namen Tube Alloys ausgedacht. Er wurde absichtlich so gewählt, dass er nichtssagend ist und den Anschein von Wahrscheinlichkeit erweckt."
ENG_radar_networks:5	"Das Radarnetz"
ENG_radar_networks_desc:5	"Chain Home, kurz CH, war der Codename für den Ring von Küsten-Frühwarnradarstationen, die von der Royal Air Force (RAF) vor und während des Zweiten Weltkriegs errichtet wurden, um Flugzeuge zu entdecken und zu verfolgen. Die Bezeichnung bezog sich auch auf die Radaranlagen selbst, bis sie 1940 den offiziellen Namen Air Ministry Experimental Station Type 1 (AMES Type 1) erhielten. Chain Home war das erste Frühwarnradarnetz der Welt und das erste militärische Radarsystem, das den operationellen Status erreichte. Sein Einfluss auf den Ausgang des Krieges machte es zu einer der mächtigsten Waffen des heute als "Zauberkrieg" bezeichneten Krieges."
ENG_hurricane:5	"Hawker Hurricane Forschung"
ENG_hurricane_desc:5	"Der Jungfernflug des ersten Serienflugzeugs, das von einem Merlin II-Motor angetrieben wurde, fand am 12. Oktober 1937 statt.  Die ersten vier Flugzeuge, die bei der RAF in Dienst gestellt wurden, kamen im darauffolgenden Dezember zur 111 Squadron RAF in RAF Northolt.  Bis zum Ausbruch des Zweiten Weltkriegs wurden fast 500 Hurricanes produziert, mit denen 18 Geschwader ausgerüstet wurden."
ENG_spitfire:5	"Supermarine Spitfire Forschung"
ENG_spitfire_desc:5	"Die Einsatzgeschichte der Spitfire bei der RAF begann mit der ersten Mk Is K9789, die am 4. August 1938 bei der 19 Squadron der RAF Duxford in Dienst gestellt wurde.  Die Spitfire erlangte während der Luftschlacht um Großbritannien Legendenstatus, ein Ruf, der durch den berühmten Spitfire Fund gefördert wurde, der von Lord Beaverbrook, dem Minister für Flugzeugproduktion, organisiert und geleitet wurde. Obwohl das Hauptziel des Fighter Command darin bestand, die Bomber der Luftwaffe zu stoppen, bestand die Taktik in der Praxis darin, die Spitfires gegen die deutschen Begleitjäger, insbesondere die Bf 109, einzusetzen, während die Hurricane-Staffeln die Bomber angriffen."
ENG_beaverbrook:5	"Ernennung von Lord Beaverbrook"
ENG_beaverbrook_desc:5	"William Maxwell Aitken, 1st Baron Beaverbrook, Während des Zweiten Weltkriegs, im Mai 1940, ernannte sein Freund Winston Churchill, der britische Premierminister, Beaverbrook zum Minister für Flugzeugproduktion. Mit Churchills Segen überarbeitete Beaverbrook alle Aspekte der kriegsbedingten Flugzeugproduktion; er erhöhte die Produktionsziele um 15 %, übernahm die Kontrolle über die Flugzeugreparaturen und die RAF-Lagereinheiten, ersetzte die Leitung von Werken, die nicht die erwarteten Leistungen erbrachten, und entließ deutsch-jüdische Ingenieure aus der Internierung, um in den Fabriken zu arbeiten. Er beschlagnahmte Material und Ausrüstung, die für andere Abteilungen bestimmt waren, und lag ständig im Streit mit dem Luftfahrtministerium. Sein Aufruf, Töpfe und Pfannen 'für den Bau von Spitfires' zu beschaffen, wurde später von seinem Sohn Sir Max Aitken als reine Propagandaübung entlarvt. Dennoch erklärte das Time Magazine in einer Titelgeschichte: Selbst wenn Großbritannien in diesem Herbst untergeht, wird es nicht Lord Beaverbrooks Schuld sein. Wenn es durchhält, wird es sein Triumph sein. Dieser Krieg ist ein Krieg der Maschinen. Er wird am Fließband gewonnen werden. Unter Beaverbrook wurde die Produktion von Kampfflugzeugen und Bombern so stark gesteigert, dass Churchill erklärte: Seine persönliche Kraft und sein Genie machten dies zu Aitkens bester Stunde. Beaverbrooks Einfluss auf die Kriegsproduktion ist viel diskutiert worden, aber er hat die Produktion in einer Zeit angekurbelt, in der sie dringend gebraucht wurde. Es wurde jedoch argumentiert, dass die Flugzeugproduktion bereits anstieg, als Beaverbrook die Leitung übernahm, und dass er das Glück hatte, ein System zu erben, das gerade begann, Früchte zu tragen. Air Chief Marshal Lord Dowding, Leiter des Jagdkommandos während der Schlacht um Großbritannien, schrieb: Wir hatten die Organisation, wir hatten die Männer, wir hatten den Geist, der uns den Sieg in der Luft bringen konnte, aber wir hatten nicht den Vorrat an Maschinen, der notwendig war, um den Strapazen eines ständigen Kampfes standzuhalten. Lord Beaverbrook gab uns diese Maschinen, und ich glaube nicht, dass ich übertreibe, wenn ich sage, dass kein anderer Mann in England dies hätte tun können."
ENG_cruiser_tanks:5	"Schwerpunkt Kreuzerpanzer"
ENG_cruiser_tanks_desc:5	"Konzentration auf schnelle, wendige Kavalleriepanzer, die den sich zurückziehenden Feind ausnutzen."
ENG_infantry_tanks:5	"Schwerpunkt Infanteriepanzer"
ENG_infantry_tanks_desc:5	"Konzentration unserer Forschung auf immer leistungsfähigere Infanteriepanzer"
ENG_civil_programmes:5	"Zivile Programme"
ENG_civil_programmes_desc:5	"Beginn einer Reihe von Programmen, die die britische Gesellschaft besser auf die kommenden dunklen Zeiten vorbereiten sollen"
ENG_K6:5	"K6 Rote Telefonzelle Service"
ENG_K6_desc:5	"Entworfen von Sir Giles Gilbert Scott im Jahr 1935 anlässlich des Jubiläums von König Georg V. Leider erlebte der König die Aufstellung dieser Telefonzellen nicht mehr.  Ursprünglich als "Jubilee Kiosk" bekannt, wurden zwischen 1936 und 1968 etwa 70 000 Exemplare im Vereinigten Königreich aufgestellt."
ENG_BBC:5	"BBC-Fernsehdienst"
ENG_BBC_desc:5	"Am 2. November 1936 begann im Alexandra Palace in London die regelmäßige Ausstrahlung von Fernsehsendungen mit elektronischer Abtastung für nur wenige hundert Zuschauer in der näheren Umgebung.  Er erreichte schätzungsweise 25.000 bis 40.000 Haushalte, bevor der Zweite Weltkrieg ausbrach und der Dienst im September 1939 eingestellt wurde. Die UKW-Übertragungen wären ein ideales Funkfeuer für deutsche Bomber gewesen, die London ansteuerten, und die Ingenieure und Techniker des Dienstes wurden für die Kriegsanstrengungen, das RADAR-Programm, benötigt."
ENG_POA:5	"Gesetz zur öffentlichen Ordnung"
ENG_POA_desc:5	"Die Menschen in East London versammeln sich in der Cable Street und drängen den Marsch des Faschisten Oswald Mosley und seiner Schwarzhemden durch die Straßen des East End zurück.  THEY SHALL NOT PASS, Die Schlacht in der Cable Street war ein wichtiger Faktor für die Verabschiedung des Gesetzes über die öffentliche Ordnung (Public Order Act) von 1936, das eine polizeiliche Genehmigung für politische Aufmärsche vorschrieb und das Tragen von politischen Uniformen in der Öffentlichkeit verbot.  Dies wird weithin als ein wesentlicher Faktor für den politischen Niedergang der BUF vor dem Zweiten Weltkrieg angesehen. Das Gesetz verbot das Tragen von politischen Uniformen an öffentlichen Orten oder bei öffentlichen Versammlungen.  Außerdem war für die Durchführung politischer Aufmärsche die Zustimmung der Polizei erforderlich.  Das Gesetz verbot auch die Organisation, Ausbildung oder Ausrüstung einer Vereinigung von Personen mit dem Ziel, sie in die Lage zu versetzen, die Funktionen der Polizei oder der Streitkräfte der Krone zu übernehmen oder körperliche Gewalt zur Förderung eines politischen Ziels anzuwenden oder zu zeigen.\n\n Das Gesetz hatte indirekt zur Folge, dass sich die Position der BUF verbesserte.  Der erzwungene Verzicht auf paramilitärische und bewaffnete Taktiken verbesserte die Beziehungen der Partei zur Polizei und steigerte die Attraktivität der BUF bei den traditionell konservativen Bürgern der Mittelschicht, die in den Jahren nach der Verabschiedung des Gesetzes über die öffentliche Ordnung von 1936 zur Hauptbasis der Partei wurden, indem es sie respektabler machte."
ENG_EPA:5	"Gesetz über Notstandsbefugnisse"
ENG_EPA_desc:5	"Der Emergency Powers (Defence) Act 1939 war ein Notstandsgesetz, das kurz vor Ausbruch des Zweiten Weltkriegs vom Parlament des Vereinigten Königreichs verabschiedet wurde, um die britische Regierung in die Lage zu versetzen, Notstandsbefugnisse zu ergreifen, um den Krieg wirksam zu führen. Es enthielt Klauseln, die der Regierung weitreichende Befugnisse zur Schaffung von Verteidigungsverordnungen gaben, die fast jeden Aspekt des täglichen Lebens im Land regelten. Zwei Verstöße gegen die Verordnungen wurden mit dem Tod bestraft."
ENG_NSA:5	"Gesetz über den Nationaldienst (Nr. 2)"
ENG_NSA_desc:5	"Alle Männer und Frauen im Alter von 18 bis 60 Jahren sind nun verpflichtet, irgendeine Form des Nationaldienstes zu leisten, einschließlich des Militärdienstes für Männer unter 51 Jahren und unverheiratete Frauen zwischen 20 und 30 Jahren.  Die erste militärische Registrierung von 18-Jährigen findet statt.  Die Liste der reservierten Berufe wird aufgegeben"
ENG_bevin_boys_coal:5	"Bevin Boys-Industrie"
ENG_jarrow_appease:5	"Jarrow-Kreuzzug beschwichtigen"
ENG_atlantic_charter:5	"Atlantik-Charta"
ENG_atlantic_charter_desc:5	"Premierminister Churchill und Präsident Roosevelt treffen sich in einer Anchorage in Neufundland und erarbeiten die Atlantik-Charta.  Die Charta bringt "das Recht aller Völker zum Ausdruck, die Regierungsform zu wählen, unter der sie leben wollen"."
ENG_churchill_speech_I:5	"Churchills Rede - Blut, Mühsal, Tränen, Schweiß!"
ENG_churchill_speech_II:5	"Churchills Rede - NIE AUFGEBEN !!!"
ENG_commando_raids_III:5	"Kommandoüberfall 3"
ENG_commando_raids_IV_desc:5	"Starten Sie einen zufälligen Kommandoangriff auf das besetzte Frankreich. Sie können versuchen, den Überfall zu evakuieren, ihn zu unterstützen oder ihn einfach ignorieren."
ENG_commando_raids_V:5	"Kommandoüberfall 5"
ENG_commando_raids_VIII:5	"Kommandoüberfall 8"
ENG_commando_raids_IX:5	"Kommandoüberfall 9"
ENG_commando_raids_IX_desc:5	"Starten Sie einen zufälligen Kommandoangriff auf das besetzte Frankreich. Sie können versuchen, den Überfall zu evakuieren, ihn zu unterstützen oder ihn einfach ignorieren."
ENG_commando_raids_X_desc:5	"Starten Sie einen zufälligen Kommandoangriff auf das besetzte Frankreich. Sie können versuchen, den Überfall zu evakuieren, ihn zu unterstützen oder ihn einfach zu ignorieren."
ENG_Irish_force_desc:5	"Irland hat eine kleine Truppe von Freiwilligen entsandt, um an der Seite des Vereinigten Königreichs zu kämpfen."
ENG_DEI:5	"Übergabe von Niederländisch-Ostindien"
ENG_DEI_desc:5	"Übergeben Sie Niederländisch-Ostindien an Großbritannien, nachdem Holland zusammengebrochen ist."
ENG_requistion_trucks:5	"Requirierung ziviler Lastwagen"
ENG_requistion_cars:5	"Requisition ziviler Autos"
ENG_requistion_motorcycles:5	"Requirierung von Motorrädern für Zivilisten"
ENG_requistion_motorcycles_desc:5	"Zivilisten müssen für den Kriegseinsatz auf Motorräder verzichten."
ENG_ration_petrol:5	"Rationierung von zivilem Benzin"
ENG_collect_metals:5	"Schrottsuche"
ENG_collect_metals_desc:5	"Ermuntern Sie die Zivilbevölkerung, Gegenstände aus Metall zu finden und an die Sammelstellen zu schicken, damit diese eingeschmolzen und für den Krieg wiederverwendet werden können. Jeder kleine Kochtopf zählt!"
ENG_bouncing_bomb:5	"Hüpfende Bombe"
ENG_bouncing_bomb_desc:5	"Eine Abprallbombe ist eine Bombe, die so konstruiert ist, dass sie über das Wasser zu einem Ziel abprallt, um Hindernissen wie Torpedonetzen auszuweichen, und dass sowohl die Geschwindigkeit der Bombe bei ihrer Ankunft am Ziel als auch der Zeitpunkt ihrer Detonation im Voraus festgelegt werden können, ähnlich wie bei einer regulären Wasserbombe der Marine. Der Erfinder der ersten Bombe dieser Art war der britische Ingenieur Barnes Wallis, dessen "Upkeep"-Hüpfbombe bei der RAF-Operation "Chastise" im Mai 1943 eingesetzt wurde, um in deutschen Staudämmen aufzuspringen und unter Wasser zu explodieren, mit einem ähnlichen Effekt wie bei der unterirdischen Detonation der ebenfalls von ihm erfundenen "Grand Slam"- und "Tallboy"-Erdbebenbomben."
ENG_grand_slam_bomb:5	"Grand Slam-Bombe"
ENG_grand_slam_bomb_desc:5	"Die Grand Slam war eine 10.000 kg schwere Erdbebenbombe, die während des Zweiten Weltkriegs vom RAF Bomber Command gegen strategische Ziele eingesetzt wurde. Offiziell hieß sie Bomb, Mittlere Kapazität, 22,000 lb und war eine vergrößerte Version der Tallboy-Bombe, die der ursprünglichen Größe näher kam, die der Erfinder der Bomben, Barnes Wallis, im Sinn hatte, als er seine Idee der Erdbebenbombe entwickelte. Sie erhielt auch den Spitznamen "Ten-ton Tess". Sie war die stärkste nicht-atomare Fliegerbombe, die im Kampf eingesetzt wurde, bis 2017 eine US-amerikanische GBU-43/B MOAB bei einem Angriff gegen ISIL-Kräfte in Afghanistan eingesetzt wurde."
ENG_tall_boy_bomb:5	"Tallboy-Bombe"
ENG_tall_boy_desc:5	"Tallboy oder Bomb, Mittlere Kapazität, 12,000 lb, war eine Erdbebenbombe, die von dem britischen Luftfahrtingenieur Barnes Wallis entwickelt und von der RAF während des Zweiten Weltkriegs eingesetzt wurde. Mit einem Gewicht von 5 langen Tonnen (5,1 t) konnte sie nur von dem schweren Bomber Avro Lancaster getragen werden. Sie erwies sich als wirksam gegen massive und gehärtete Strukturen, gegen die herkömmliche Bombenangriffe wirkungslos waren."
ENG_global_navy:5	"Eine globale Marine"
ENG_global_navy_desc:5	"Nur mit der Macht der Royal Navy können wir hoffen, unser Imperium zu verteidigen."
ENG_global_navy_range:5	"Erweitern Sie unsere Reichweite"
ENG_global_navy_range_desc:5	"Bessere Versorgungslinien und effektive Kommunikation bedeuten, dass unsere Flotte Zugang zu einem größeren Teil der Ozeane als je zuvor hat."
ENG_global_navy_speed:5	"Erhöhen Sie unsere Geschwindigkeit"
ENG_global_navy_speed_desc:5	""
ENG_navy_commonwealth:5	"Die Flotte des Commonwealth"
ENG_navy_commonwealth_desc:5	"Die königliche Flotte muss nicht allein kämpfen, wir können unser Imperium auffordern, ein fleißiges Schiffbauprogramm zu starten."
ENG_support_spain:5	"Unterstützen Sie die spanischen Republikaner"
ENG_support_spain_desc:5	"Die demokratischen Unterstützer im spanischen Bürgerkrieg werden von den faschistischen Kräften und dem internen Aufstieg des Kommunismus hart bedrängt. Unsere Unterstützung sollte den pro-demokratischen Elementen helfen, die Nase vorn zu behalten."
ENG_support_france:5	"Unterstützung für das freie Frankreich"
ENG_support_france_desc:5	 "Obwohl Frankreich gefallen ist und ein Teil des Landes einem Waffenstillstand mit der Achse zugestimmt hat, können wir weiterhin diejenigen unterstützen und bewaffnen, die für ein freies Frankreich kämpfen."
ENG_ally_china:5	"Verbündet euch mit China"
ENG_ally_china_desc:5	"Wir haben die Chinesen zu lange allein kämpfen lassen. Wir werden unsere Kräfte besser koordinieren können, wenn wir wirklich auf der gleichen Seite stehen."
ENG_ready_commonwealth:5	"Das Commonwealth vorbereiten"
ENG_ready_commonwealth_desc:5	"Es reicht nicht aus, dass sich nur das britische Volk denjenigen widersetzt, die unser Imperium bedrohen, wir müssen die Macht des Commonwealth aufbieten, um seine Grenzen zu verteidigen"
ENG_inchindown_tanks:5	"Errichtet die Inchindown Öltanks"
ENG_inchindown_tanks_desc:5	"offiziell "Inchindown, Royal Navy Fuel Tanks" genannt und auch als "Invergordon Oil Fuel Depot" bekannt. Der Komplex wird aus sechs Tanks bestehen: fünf sind 237 Meter lang und 9 Meter breit, mit gewölbten Dächern, die 13,5 Meter hoch sind; ein kleinerer sechster Tank hat die gleiche Höhe und Breite, ist aber weniger lang."
FRA_not_in_crisis_tooltip:0	"Frankreich befindet sich nicht in einem §RCRIS!§!"
FRA_in_crisis_tooltip:0	"Frankreich ist in einem §RCRIS!§!"
Unlock_nationalisation:0	"Schaltet den Fokus §CReckless Rearmament§! frei."
Unlock_balanced:0	"Schaltet den Fokus §CBalanced Rearmament§! frei."
No_inflation_yet:0	"Dieser Fokus wird freigeschaltet, wenn ihr §YInflation!§! habt."
Your_econ_sucks_too_much:0	"Verfügt nicht über den Nationalen Geist §YStagnierende Wirtschaft§!"
Get_dat_inflation:0	"Hat Nationalgeist §YInflation§!"
FRA_support_SPR_event:0	"Wir werden Waffen und Arbeitskräfte an die spanischen Republikaner schicken. Deutschland kann sich entscheiden, den Konflikt zu entschärfen. Wenn Deutschland den Krieg erklärt, wird Großbritannien höchstwahrscheinlich neutral bleiben!"
FRA_screw_SPR_event:0	"Das französische Volk - insbesondere die Kommunisten - unterstützen die spanischen Republikaner. Wenn wir uns dafür entscheiden, neutral zu bleiben, könnte dies später eine KRISE auslösen."
FRA_uk_intervention_likely:0	"\nDas §YVereinigte Königreich§! wird wahrscheinlich §GSUPPORT§! eine Intervention unterstützen.\n\n"
