CIV_navy_desc:5	"Mit dem Verlust fast aller unserer Marinekommandos ist unsere Marine für diesen Krieg nicht in Form, wir haben viele Niederlagen erlitten und müssen uns reformieren, wenn wir die Meere halten wollen"
CIV_com_pwr:5	"Kommunistische Revolution"
