CIV_supplies:5	"Sowjetische Lebensmittel"
CIV_supplies_desc:5	"Der Krieg fordert seinen Tribut und die dringend benötigten Lebensmittel werden von unseren Kommissaren geliefert"
CIV_comintern:5	"Treten Sie der Komintern bei"
