IEA_rats_desc:5	"Es gibt viele, die die Solomon-Dynastie immer noch lieben, kümmert euch um sie"
IEA_kings:5	"Nehmt ehemalige Palastmitarbeiter fest."
IEA_yem_desc:5	"Einige unserer besten Kämpfer kamen aus dem Jemen, um die IEA zu gründen und nun ihre Grenzen zu verteidigen. Wir sollten uns die Zeit nehmen, ihnen ein Dankeschön zu schicken"
IEA_safe_tt:5	"Die Rebellen wurden besiegt"
