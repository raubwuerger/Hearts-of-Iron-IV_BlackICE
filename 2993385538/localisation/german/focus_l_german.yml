RAJ_terminate_ottawa:0	"Beendigung des Ottawa-Handelsabkommens"
RAJ_terminate_ottawa_desc:0	"Die Ottawa-Abkommen waren 12 bilaterale Handelsabkommen, die gegenseitige Zollzugeständnisse und bestimmte andere Verpflichtungen vorsahen. Sie wurden vom 20. Juli bis zum 20. August 1932 in Ottawa ausgehandelt, haben uns aber nur wenig gebracht, außer dass sie Indien noch mehr von seinem Reichtum geraubt haben."
RAJ_temple_proc:0	"Geben Sie die Temple Entry Proclamation"
RAJ_Jim_Corbett_National_Park:0	"Hailey-Nationalpark gründen"
RAJ_Jim_Corbett_National_Park_desc:0	"Der erste Nationalpark im britischen Raj, benannt nach dem Gouverneur William Malcolm Hailey."
RAJ_federal_court:0	"Der Bundesgerichtshof von Indien"
RAJ_federal_court_desc:0	"Der Federal Court of India wurde in Indien gemäß den Bestimmungen des Government of India Act, 1935, mit einer ursprünglichen, einer Berufungs- und einer beratenden Gerichtsbarkeit eingerichtet."
