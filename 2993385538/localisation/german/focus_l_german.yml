PER_flexible_navy:5	"Flexible Marine"
PER_flexible_navy_desc:5	"Die Neuerfindung der Seekriegsführung, um den Fortschritten in der U-Boot-Technologie Rechnung zu tragen, wird es uns ermöglichen, effizient gegen feindliche Konvois vorzugehen."
PER_large_navy:5	"Große Marine"
PER_large_navy_desc:5	"Die Anpassung unserer Marinedoktrinen an große Schiffe und die Gewährleistung der Sicherheit unserer Handelskonvois wird uns viel darüber lehren, welche Art von Schiffen wir brauchen."
PER_submarine_effort:5	"U-Boot-Forschung"
PER_submarine_effort_desc:5	"Die U-Boot-Kriegsführung ist die aufregendste Entwicklung in der Marine seit der Erfindung des Torpedoboots. Wir täten gut daran, uns nicht nur vor U-Booten zu schützen, sondern sie auch gegen feindliche Schiffe einzusetzen."
PER_cruiser_effort:5	"Kreuzerforschung"
PER_cruiser_effort_desc:5	"Bevor wir in die moderne Schlachtschiffforschung einsteigen, müssen unsere kleineren Kreuzer ersetzt werden."
PER_destroyer_effort:5	"Zerstörerforschung"
PER_destroyer_effort_desc:5	"Indem wir die Konstruktion und den strategischen Einsatz von U-Booten studiert haben, haben wir auch gelernt, wie wir diese Strategien kontern können. Zerstörer werden dafür entscheidend sein."
PER_capital_ships_effort:5	"Forschung an Großkampfschiffen"
PER_capital_ships_effort_desc:5	"Die Nation mit den meisten Schlachtschiffen wird die Weltmeere beherrschen. Schlachtschiffe und Flugzeugträger stehen für die alte und die neue Überlegenheit der Seestreitkräfte."
