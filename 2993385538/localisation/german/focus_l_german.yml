FRA_need_fuel_silos:0	"§RErforscht §YTreibstofflager§! um diesen Fokus freizuschalten!\n§!"
FRA_spanish_intervention_tt:0	"Wenn das §YVereinigte Königreich§! den Schwerpunkt §YGlobale Verteidigung§! abschließt, wird diese Anforderung reduziert."
FRA_britain_alliance_tt:0	"§YFrankreich§! und das §YVereinigte Königreich§! sind beide unabhängig, in Frieden und haben eine §YDemokratische Regierung§!"
FRA_britain_alliance_refused_tt:0	"Da wir uns entschieden haben, in den Spanischen Bürgerkrieg zu intervenieren, wird die Sicherung eines Bündnisses mit dem §YVereinigten Königreich§! nun voraussetzen, dass wir zumindest §G50§! positive Beziehungen zu ihnen haben.\n"
FRA_research_treaty_uk:0	"§RDieses Forschungszentrum wird im §YVereinigten Königreich§! gespawnt werden.§!"
FRA_heavy_armor_div_tt:0	"Ihr erhaltet eine kostenlose Designvorlage für §Yschwere Panzer§!.\n"
FRA_sack_gamelin_tt:0	"Durch das Abschließen dieses Fokus wird §YMaurice Gamelin§! vom Kommando entfernt!"
