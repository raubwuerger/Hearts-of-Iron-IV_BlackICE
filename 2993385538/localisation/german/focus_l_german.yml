RAJ_hilda:0	"Hilda"
RAJ_hilda_desc:0	"Die deutsche Invasion Dänemarks hat die Lieferungen dänischer Produkte gestoppt, doch die Notwendigkeit, während des Krieges Schiffe zu reparieren, umzurüsten und zu entmagnetisieren, bietet L&T eine Chance. Deshalb wird ein neues Unternehmen, Hilda Ltd, gegründet, um diese Arbeiten durchzuführen. Wir können auch Schiffe reparieren und fabrizieren."
