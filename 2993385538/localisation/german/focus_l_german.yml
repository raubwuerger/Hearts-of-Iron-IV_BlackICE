SIK_sov_mines:5	"Sowjetische Minenentwicklung"
SIK_sov_mines_desc:5	"§TErlaubt dem sowjetischen Spieler, Ressourcen auf unseren Kerngebieten zu entwickeln§!"
SIK_purge:5	"Die Säuberung"
SIK_purge_desc:5	"In unseren Reihen lauern viele Verräter, wir müssen sie beseitigen, bevor wir in einen weiteren Bürgerkrieg gestürzt werden"
SIK_police:5	"Gründet die Pao-an-tui"
SIK_police_desc:5	"Das Pao-an-tui oder Sicherheitskorps wird die Sicherheit unserer Bürger vor inneren Bedrohungen gewährleisten."
SIK_purge2_desc:5	"Es gibt immer noch Verräter in unserem Nebel."
