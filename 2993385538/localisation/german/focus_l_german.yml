PER_paint_desc:5	"Rangsazi Iran - Iran Paint Manufacturing Company, wurde 1939 als erster Farbenhersteller im Iran und im Nahen Osten gegründet."
PER_king:5	"Lang lebe der König"
PER_king_desc:5	"Der König hat uns den Weg zur Modernisierung gezeigt, möge er lange regieren"
PER_53:5	"Verhaftet die 53"
PER_53_desc:5	"Die Dreiundfünfzig waren eine Gruppe von 53 Iranern, die 1937 wegen ihrer Beteiligung an kommunistischen politischen Aktivitäten verhaftet und im November 1938 vor Gericht gestellt wurden."
PER_election:5	"Halten Sie eine Wahl ab"
