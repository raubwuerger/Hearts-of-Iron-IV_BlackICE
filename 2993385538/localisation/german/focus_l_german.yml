FRA_formed_little_entente:0	"Oder wir haben die §CLittle Entente§! gebildet und §YYJugoslawien§!, §YRumänien§! und §YPolen§! eingeladen."
FRA_econ_warfare_focus:0	"Verlangen Sie, dass alle §CNeutralen Europäischen Nationen§! die §YDeutschland§! noch unterstützen, sofort jeden Handel einstellen. Die folgenden Nationen unterstützen Deutschland:"
