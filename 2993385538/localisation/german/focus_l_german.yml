GER_enigma2:5	"Einsatz der M1"
GER_enigma3_desc:5	"Am 1. Februar 1942 führte die Marine für den U-Boot-Verkehr eine Enigma mit vier Rotoren ein, die sie M4 nannte (bei den Alliierten war das Netz als Triton oder Shark bekannt). Der zusätzliche Rotor wurde auf demselben Raum angebracht, indem der Reflektor in eine Kombination aus einem dünnen Reflektor und einem dünnen vierten Rotor geteilt wurde."
GER_enigma_jap:5	"Austausch von Enigma-Geräten mit Japan"
GER_western_knowledge_desc:5	"Da ein großer Teil Europas unter der Kontrolle des Reichs stand, konnten wir auf einen riesigen Wissensschatz zurückgreifen. Sowohl über wissenschaftliche Einrichtungen als auch über erbeutete Waffen und Blaupausen."
GER_Schutzstaffel_foreign_ss_units:5	"Rekrutierung ausländischer SS-Einheiten"
GER_Nazi_party_secret_projects:5	"Geheime Projekte der Nazipartei"
GER_Nazi_party_secret_projects_desc:5	"Die seltsamen, verdrehten und geradezu bösen Geheimprojekte und Obsessionen Hitlers und seiner Handlanger! Bwahahaawahhhaaa !!!"
GER_Himmlers_occult_quests_desc:5	"Himmler begann seine Karriere als Landwirt, was ihn dazu brachte, die Bedeutung des Mythos "Blut und Boden" sowie die Notwendigkeit der Lebensreform zu betonen. Himmler beschäftigte sich auch mit Astrologie, Spiritismus und Kräuterkunde. Himmler beauftragte ein spezielles Büro für SS-Archäologie, das sich um die Wiederentdeckung verlorener arischer Zivilisationen bemühte. Karl Maria Wiligut spielte eine wichtige Rolle als Okkultist für Himmlers SS. Darüber hinaus suchte Himmler die Wewelsburg als geistiges Zentrum des SS-Ordens."
GER_Project_Riese:5	"Projekt Riese"
GER_Project_Riese_desc:5	"Der Codename für ein Bauprojekt des nationalsozialistischen Deutschlands in den Jahren 1943-1945, das aus sieben unterirdischen Bauten im Eulengebirge und der Burg Książ in Niederschlesien, ehemals Deutschland, heute polnisches Staatsgebiet, bestand. Keines der Bauwerke wurde fertiggestellt; alle befinden sich in unterschiedlichen Stadien der Fertigstellung, wobei nur ein kleiner Teil der Tunnel mit Beton verstärkt ist. Der Zweck des Projekts bleibt ungewiss, da es keine Dokumentation gibt. Einigen Quellen zufolge waren alle Bauwerke Teil des Führerhauptquartiers, anderen zufolge handelte es sich um eine Kombination aus Hauptquartier und Rüstungsindustrie, aber ein Vergleich mit ähnlichen Anlagen kann darauf hindeuten, dass nur das Schloss als Hauptquartier oder andere offizielle Residenz eingerichtet wurde und die Tunnel im Eulengebirge als Netz unterirdischer Fabriken geplant waren."
GER_Complex_Rzeczka:5	"Komplex Rzeczka"
GER_Complex_Wlodarz_desc:5	"Der Komplex befindet sich im Inneren des Włodarz-Bergs. Es handelt sich um ein Netz von Tunneln und großen unterirdischen Hallen, die bis zu 12 m hoch sind. Weniger als ein Prozent ist durch Beton verstärkt. Der Zugang erfolgte über vier in den Fuß des Berges gebohrte Stollen mit Kammern für Wachräume. Ein Schacht mit einem Durchmesser von 4 m führt an die Oberfläche. Einige Tunnel haben höhere, zweite Ebenen, die durch kleine Schächte verbunden sind. Dies ist eine Phase des Baus unterirdischer Hallen. Zwei Tunnel wurden übereinander gebohrt, und dann wurde die Decke eingestürzt, um einen großen Raum zu schaffen. Einige Teile des Komplexes sind überflutet, aber mit dem Boot erreichbar. Oberirdisch befinden sich Maschinenfundamente, zahlreiche unvollendete oder zerstörte Gebäude, ein Bunker, zwei Wasserreservoirs und Baustoffdepots, darunter Tausende versteinerter Zementsäcke. Das Schmalspurbahnnetz, das die Tunnel mit dem Anschlussgleis im Dorf Olszyniec verband, wurde nach dem Krieg demontiert und verschrottet."
GER_Complex_Sokolec_desc:5	"Der Komplex befindet sich in der Nähe des Dorfes Sokolec, im Inneren des Gontowa-Gebirges. Er besteht aus zwei unterirdischen Bauwerken auf verschiedenen Ebenen. Die Tunnel Nr. 1 und 2 mit Kammern für Wachräume führen in den Untergrund, der bis zu 5 m hoch ist. Er ist an vielen Stellen eingestürzt, da die Anlage in weichen Sandstein gebohrt wurde. 2011 wurde mit der Ausgrabung des Tunnels Nr. 3 (145 m) begonnen, der seit Kriegsende wegen seines eingestürzten Eingangs nicht mehr zugänglich ist. Er liegt 600 m entfernt und 60 m unter den Tunneln 1 und 2. Tunnel 4 wurde 1994 eröffnet, einer von nur zwei kurzen Tunneln, die mit bergmännischen Geräten aus dem Jahr 1945 gefunden wurden. Er liegt 250 m von Tunnel 3 entfernt, auf der gleichen Ebene, ist aber nicht mit ihm verbunden. Die Gesamtlänge des Komplexes beträgt 1.090 m. Er ist nicht mit Beton verstärkt. Oberirdisch befinden sich Fundamente von Gebäuden, Maschinen und zwei Rampen für den Transport von Grubenwagen auf verschiedene Ebenen. Eine Stützmauer wurde gebaut, um eine neue Straße zu sichern. Eine Schmalspurbahn verband die Stollen mit dem Anschlussgleis im Dorf Ludwikowice Kłodzkie"
GER_Complex_Jugowice:5	"Komplex Jugowice"
GER_Complex_Sobon:5	"Komplex Sobon"
GER_Complex_Sobon_desc:5	"Der Komplex befindet sich im Inneren des Berges Soboń und ist über die Tunnel 1 und 2 zugänglich. Der Tunnel Nummer 3 ist nicht mit der Hauptunterführung verbunden. Er ist in seinem ersten Teil auf einer Länge von 83 m eingestürzt. 2013 wurde er erforscht, als ein Schacht von oben gegraben wurde, der 86 m Stollen mit Bergbauausrüstung aus dem Jahr 1945 zum Vorschein brachte. Die Gesamtlänge des Komplexes beträgt 700 m. Weniger als ein Prozent davon ist mit Beton bewehrt. Über Tage befinden sich Maschinenfundamente und eine Pumpstation, ein Wasserreservoir, Baustoffdepots, zahlreiche unfertige oder zerstörte Gebäude, ein Bunker und Erdarbeiten in großem Umfang. Ein Schmalspurbahnnetz verband die Tunnel mit dem Bahnhof in dem Dorf Głuszyca Górna"
GER_Ahnenerbe_studies_desc:5	"War ein Projekt in Nazi-Deutschland zur Erforschung der archäologischen und kulturellen Geschichte der arischen Rasse. Die am 1. Juli 1935 von Heinrich Himmler, Herman Wirth und Richard Walther Darré gegründete Ahnenerbe-Gruppe führte später Experimente durch und startete Expeditionen, um zu beweisen, dass mythologische nordische Völker einst die Welt beherrscht hatten. Ursprünglich bestand der offizielle Auftrag von Ahnenerbe darin, neue Beweise für das rassische Erbe der Germanen zu finden; aufgrund von Himmlers Besessenheit vom Okkultismus wurde die Gruppe jedoch schnell zu seinem eigenen okkulten Werkzeug und begann, Pseudowissenschaft zu betreiben. Die Gruppe trug früher den Namen Studiengesellschaft für Geistesurgeschichte' Deutsches Ahnenerbe, wurde aber 1937 in Forschungs- und Lehrgemeinschaft des Ahnenerbes umbenannt."
GER_Wewelsburg_castle:5	"Schloss Wewelsburg"
GER_Wewelsburg_castle_desc:5	"Die Wewelsburg, das Hauptquartier der SS, war Schauplatz von Initiationsritualen für SS-"Ritter", die der Artussage nachempfunden waren. Die magischen Kräfte der Runen wurden beschworen, und das Logo des Ahnenerbes trägt einen Schriftzug im Runenstil. Hellseher und Astrologen wurden eingesetzt, um den Feind anzugreifen und Taktiken auf der Grundlage der Sternenkonstellation zu planen."
GER_angora_rabbits:5	"Angora-Projekt"
GER_Hitlers_Dog_desc:5	"war Adolf Hitlers Deutscher Schäferhund, der 1941 von Martin Bormann als Welpe geschenkt wurde. Blondi blieb auch nach Hitlers Einzug in den Führerbunker unter dem Garten der Reichskanzlei am 16. Januar 1945 bei ihm. Blondi spielte in der nationalsozialistischen Propaganda eine Rolle, indem er Hitler als Tierliebhaber darstellte. Hunde wie Blondi waren als "germanische Urhunde", die dem Wolf nahe standen, begehrt und kamen in der Nazizeit in Mode."
GER_Goerings_art_desc:5	"Hermann Görings persönliches Kunsttagebuch ist eine verdrehte Schatzkarte, ein Leitfaden für Plünderungen und Schenkungen unter den Nazis und ein Kontrollmechanismus für die Besetzung Europas durch die Nazis. Es ist seit langem bekannt, dass Göring zu den eifrigsten Kunstsammlern der Nazis gehörte: Am Ende des Krieges packte er die in Carinhall gelagerte Beute in Züge und floh nach Süden in Richtung Berchtesgaden in Bayern, während er Carinhall hinter sich in die Luft jagte. Die Sammlung wurde von alliierten Soldaten entdeckt, und 1945 schätzte die New York Times den Wert der Werke auf zweihundert Millionen Dollar (laut Nancy Yeide, der Autorin von Beyond the Dreams of Avarice: Die Sammlung Hermann Göring). Der Katalog von Görings Kunstwerken ist ein faszinierender Gradmesser für den sich wandelnden Geschmack eines Mannes, der für seine persönlichen Exzentrizitäten ebenso bekannt war wie für seine entsetzliche Brutalität. Zu Beginn liegt der Schwerpunkt auf der nordeuropäischen Romantik und der nackten weiblichen Figur. Aber die Sammlung ändert sich, wird umfangreicher und umgeht gelegentlich die Nazi-Gesetze über die so genannte entartete Kunst, um einige der modernen Größen zu sammeln. Ich gebe voll und ganz zu, dass ich eine Leidenschaft für das Sammeln hatte, sagte Göring im Zeugenstand in Nürnberg mit einem 'vulgären' Lächeln, wie Janet Flanner, die für The New Yorker über den Prozess berichtete, feststellte. Und wenn sie beschlagnahmt werden sollten, wollte ich meinen kleinen Anteil daran haben."
GER_Goebbels_massmedia:5	"Goebbels' Massenmedien"
GER_Berghof:5	"Berghof"
GER_Berghof_desc:5	"Der Berghof war Adolf Hitlers Wohnsitz auf dem Obersalzberg in den bayerischen Alpen bei Berchtesgaden, Bayern, Deutschland. Abgesehen von der Wolfsschanze, seinem Hauptquartier in Ostpreußen für den Überfall auf die Sowjetunion, verbrachte Hitler während des Zweiten Weltkriegs mehr Zeit auf dem Berghof als irgendwo sonst. Er war auch eines der bekanntesten seiner Hauptquartiere."
GER_Fuhrerbunker_desc:5	"Der Führerbunker war ein Luftschutzbunker in der Nähe der Reichskanzlei in Berlin, Deutschland. Er war Teil eines unterirdischen Bunkerkomplexes, der in zwei Phasen gebaut wurde, die 1936 und 1944 abgeschlossen wurden. Er war der letzte der von Adolf Hitler während des Zweiten Weltkriegs genutzten Führerhauptquartiere. Hitler zog am 16. Januar 1945 in den Führerbunker ein, der bis zur letzten Woche des Zweiten Weltkriegs in Europa das Zentrum des NS-Regimes war. In der letzten Aprilwoche 1945 heiratete Hitler hier Eva Braun, kurz bevor sie Selbstmord begingen."
GER_Wolfsschanze:5	"Wolfsschanze Führerhauptquartiere"
GER_Wolfsschanze_desc:5	"Die Wolfsschanze war das erste militärische Hauptquartier von Adolf Hitler an der Ostfront im Zweiten Weltkrieg. Der Komplex, der zu einem von mehreren Führerhauptquartieren in verschiedenen Teilen Osteuropas wurde, wurde für den Beginn der Operation Barbarossa - den Überfall auf die Sowjetunion - im Jahr 1941 errichtet. Es wurde von der Organisation Todt gebaut. Die streng geheime Hochsicherheitsanlage befand sich in den masurischen Wäldern, etwa 8 km östlich der kleinen ostpreußischen Stadt Rastenburg. Drei Sicherheitszonen umgaben den zentralen Komplex, in dem sich der Führerbunker befand. Diese wurden von Mitarbeitern des SS-Reichssicherheitsdienstes und der gepanzerten Führerbegleitbrigade der Wehrmacht bewacht. Trotz der Sicherheitsvorkehrungen wurde das bedeutendste Attentat auf Hitler in der Wolfsschanze am 20. Juli 1944 verübt. Hitler traf erstmals am 23. Juni 1941 im Hauptquartier ein. Insgesamt verbrachte er innerhalb von 3,5 Jahren bis zu seiner endgültigen Abreise am 20. November 1944 mehr als 800 Tage in der Wolfsschanze. Mitte 1944 begannen die Arbeiten zur Erweiterung und Verstärkung vieler ursprünglicher Gebäude der Wolfsschanze. Aufgrund des schnellen Vormarsches der Roten Armee während der Baltischen Offensive Ende 1944 wurden die Arbeiten nie abgeschlossen. Am 25. Januar 1945 wurde der Komplex gesprengt und 48 Stunden vor dem Eintreffen der sowjetischen Streitkräfte aufgegeben."
GER_Wolfsschlucht_I:5	"Wolfsschlucht I Führerhauptquartiere"
GER_Wolfsschlucht_II_desc:5	"Wolfsschlucht II oder W2 war der Codename für eines der militärischen Hauptquartiere Adolf Hitlers im Zweiten Weltkrieg an der Westfront in Margival, 10 km nordöstlich von Soissons im Departement Aisne in Frankreich. Es war eines von vielen anderen Führerhauptquartieren in ganz Europa, wurde aber nur ein einziges Mal von Adolf Hitler benutzt, und zwar am 16. und 17. Juni 1944 für ein Treffen mit den Feldmarschällen Rommel und von Rundstedt über die Normandiefront. Bei diesem Treffen sprach sich Rommel unter anderem für die Beendigung des Krieges aus, sehr zum Ärger Hitlers. Während des Treffens zwang ein alliierter Luftangriff die Gruppe, sich in einen Luftschutzkeller zurückzuziehen. Später schlug dort eine V-1-Fliegerbombe ein, woraufhin Hitler nach Deutschland abreiste und nicht mehr zurückkehrte."
GER_Anlage_Sud_desc:5	"Die Anlage Sud war ein Eisenbahnhauptquartier, das während des Zweiten Weltkriegs für Adolf Hitler im von den Nazis besetzten Teil Südpolens gebaut wurde. Zwei verstärkte Tunnel wurden in der Nähe der Bahnlinie zwischen Rzeszów und Jasło gebaut. Der erste massive Zugbunker (mit angrenzendem Konferenzbunker) befand sich in dem Dorf Stępina, der andere in der Stadt Strzyżów. Sie wurden zunächst für ein zweitägiges Treffen zwischen Hitler und dem italienischen Faschistenführer Benito Mussolini am 27. und 28. August 1941 genutzt."
GER_Felsennest:5	"Felsennest Führerhauptquartiere"
GER_Kehlsteinhaus:5	"Kehlsteinhaus"
GER_Kehlsteinhaus_desc:5	"Das Kehlsteinhaus ist ein Gebäude aus der Zeit des Dritten Reichs, das auf dem Gipfel des Kehlsteins errichtet wurde, einem Felsvorsprung, der sich über dem Obersalzberg in der Nähe von Berchtesgaden erhebt. Es wurde ausschließlich von Mitgliedern der NSDAP für Regierungssitzungen und gesellschaftliche Zusammenkünfte genutzt. Er wurde von Adolf Hitler insgesamt 14 Mal besucht."
GER_Werwolf_desc:5	"Führerhauptquartier Werwolf war der Codename für eines der militärischen Hauptquartiere Adolf Hitlers im Zweiten Weltkrieg an der Ostfront, das sich in einem Kiefernwald etwa 12 Kilometer nördlich von Winnyzja in der Ukraine befand und zwischen 1942 und 1943 genutzt wurde. Es war eines von mehreren Führerhauptquartieren in ganz Europa und das am weitesten östlich gelegene, das von Hitler persönlich genutzt wurde."
GER_Arctic_weather_base:5	"Arktische Wetterstation"
GER_Arctic_weather_base_desc:5	"Die als Schatzgräber bekannte Basis war eine Wetterstation, die die Bemühungen der Nazis in der Arktis unterstützen sollte. Die Region war eine wichtige Konvoiroute für die alliierten Truppen, auf der mehr als 1.000 amerikanische, kanadische, französische und britische Handelsschiffe im Rahmen des Lend-Lease-Programms Nachschub an die Sowjetunion lieferten. Schatzgräber wurde gebaut, um U-Boote und deutsche Patrouillen dabei zu unterstützen, diese Konvois zu behindern und zu versenken, was ihr mit gemischtem Erfolg gelang."
GER_nibelungen_works_desc:5	"Die Nibelungenwerke waren das größte und modernste Panzermontagewerk des Deutschen Reiches. In dem von Steyr-Daimler-Puch betriebenen Werk wurde bis zum Ende des Zweiten Weltkriegs mehr als die Hälfte aller Panzer IV hergestellt. Von den 8500 Panzern IV, die Deutschland während des Krieges produzierte, stammten etwa 4800 von hier. Im Rahmen des deutschen Vierjahresplans wurde nach dem Anschluss Österreichs in Linz ein Rüstungszentrum geschaffen, das unter anderem die Herstellung von Panzerplatten in der Oberen Donauhütte für die Nibelungenwerke umfasste, die ihrerseits für die Endmontage von Panzern zuständig war. Letzteres resultierte aus Plänen aus dem Jahr 1939, für 65 Millionen Reichsmark eine Rüstungsfabrik in der Eisenbahnknotenpunktstadt Sankt Valentin zu errichten. Die offizielle Eröffnung fand 1942 statt. Nach der Fertigstellung war eine monatliche Produktionskapazität von 320 Panzern vorgesehen, die jedoch nie erreicht wurde. Gegen Ende des Krieges (Anfang 1945) wurde die Fabrik auch für die Reparatur von Panzern genutzt, die von der Front kamen (die zu diesem Zeitpunkt nur noch wenige Kilometer entfernt war). Es wird geschätzt, dass etwa 50 Panther im Nibelungenwerk repariert wurden."
GER_panzer_training_grounds_tooltip:5	"§YPanzertruppenschule§! wendet die folgenden Modifikatoren auf alle §YPanzerbataillone§! an!;\n £breakthrough_texticon §WDurchbruch§! §G+10%§!\n £defence_texticon §WVerteidigung§! §G+5%§!\n £attack_texticon §WAngriff gegen weiche Ziele§! §G+5%§!\n £attack_texticon §WAngriff gegen gepanzerte Ziele§! §G+5%§!."
GER_wehrmacht_fuhrungsamt_desc:5	"Auflösung des Reichskriegsministeriums und Ersetzung durch das OKW unter der Leitung des ergebenen Generals Wilhelm Keitel im Rang eines Reichsministers, mit Alfred Jodl als Chef des Operationsstabes."
GER_Wehrmachtfuhrungsstab:5	"Führungsstab der Wehrmacht"
GER_Wehrmachtfuhrungsstab_TT:5	"Verringert den Zorn des OKW um 8"
GER_Reichskolonialbund:5	"Der Reichskolonialbund"
GER_Reichskolonialbund_Papua:5	"Der Reichskolonialbund blickt auf den Pazifik"
GER_Reichskolonialbund_Papua_desc:5	"Wir haben beschlossen, unsere verlorenen deutschen Kolonien im Pazifik zurückzufordern"
GER_china_resources:5	"Import von Wolfram und Antimon aus China"
GER_china_industry_desc:5	"Durch die ständige Versorgung mit Rohstoffen macht unsere Industrie große Sprünge nach vorne."
GER_china_experience:5	"Militärische Erfahrung"
GER_operation_lila:5	"Unternehmen Lila"
GER_operation_lila_desc:5	"Starten Sie das Unternehmen Lila mit dem Ziel, Toulon zu besetzen und die Flotte zu kapern. Aus Elementen der 7. Panzerdivision und der 2. SS-Panzerdivision zusammengesetzt, werden vier Kampfgruppen gegen 4:50 Uhr in die Stadt eindringen."
GER_expand_austrian_oil_desc:5	"Wir brauchen dringend mehr Öl. Aus diesem Grund sollten wir Spezialisten nach Österreich schicken, um zu sehen, ob wir die Ölförderung aus den kleinen, aber gut dokumentierten Vorkommen erhöhen können."
GER_Japan_Tech_EXPL:5	"Japan wird nach dem Krieg die §HAchse Forschung§! verlassen."
GER_wartime_technology_sharing_act_desc:5	"Wir haben ein gemeinsames Ziel mit den Japanern und daher ist es in unserem Interesse, ein Programm zum Technologieaustausch zwischen unseren Nationen einzurichten. Aber wenn unsere Ziele erreicht sind..."
GER_falkenhausen_return_to_duty:5	"Von Falkenhausens Rückkehr zum Dienst"
GER_falkenhausen_return_to_duty_desc:5	"Wir müssen von Falkenhausen in sein Heimatland zurückrufen, wo er einem größeren Zweck dienen wird, als nur ein paar chinesischen Mods den Umgang mit einer Waffe beizubringen."
GER_deutsche_arbeitsfront:5	"Deutsche Arbeitsfront"
GER_ostwall_forts_2:5	"§YTartu§!\n§YPskov§!\n§YNevel§!\n§YVitebsk§!\n§YMinsk§!\n§YBobruysk§!\n§YMozyr§!\n§YKiev§!\n§YCherkasy§!\n§YDnipropetrovsk§!\n§YZaporozhe§!\n"
GER_form_the_reichskommissariats:5	"Bildung des Reichskommissariats"
GER_form_the_reichskommissariats_desc:5	"Bilden Sie die Reichskommissariate mehrerer eroberter Gebiete.\n\n§YReichskommissariat Norwegen§!\n§YReichskommissariat Niederlande§!\n§YReichskommissariat Belgiem-Nordfrankreich§!\n§YReichskommissariat Ostland§!\n§YReichskommissariat Ukraine§!"
GER_reichswerke_desc:5	"Die "Reichswerke Hermann Göring" wurden als Antwort auf das Zögern bereits etablierter deutscher Unternehmen gegründet, den Vierjahresplan zu erfüllen. Die "Reichswerke Hermann Göring" sollen also immer dann zum Einsatz kommen, wenn Großunternehmen nicht bereit sind, staatlich gewünschte Geschäfte zu tätigen."
GER_reichsarbeitsdienst:5	"Reichsarbeitsdienst"
GER_reichsarbeitsdienst_I:5	"Erweiterter Reichsarbeitsdienst"
GER_reichsarbeitsdienst_I_desc:5	"Mit einer viel größeren Kontrolle über Europa kommt auch ein viel größerer Reichsarbeitsdienst."
GER_reichsarbeitsdienst_I_tt:5	"Dies wird den nationalen Geist Ihres Reichsarbeitsdienstes stärken."
GER_DEA:5	"Deutsche Erdöl AG"
GER_ig_farben_desc:5	"Die Interessen Gemeinschaft Farbenindustrie AG, allgemein bekannt als IG Farben, war ein deutscher Chemie- und Pharmakonzern. Er entstand 1925 aus dem Zusammenschluss von sechs Chemieunternehmen - BASF, Bayer, Hoechst, Agfa, Chemische Fabrik Griesheim-Elektron und Chemische Fabrik vorm. In seiner Blütezeit war die IG Farben das größte Unternehmen in Europa und das größte Chemie- und Pharmaunternehmen der Welt. Wissenschaftler der IG Farben leisteten grundlegende Beiträge zu allen Bereichen der Chemie und der pharmazeutischen Industrie. Otto Bayer entdeckte 1937 die Polyaddition zur Synthese von Polyurethan, und mehrere Wissenschaftler des Unternehmens wurden mit dem Nobelpreis ausgezeichnet: Carl Bosch und Friedrich Bergius 1931 "für ihre Beiträge zur Erfindung und Entwicklung chemischer Hochdruckverfahren" und Gerhard Domagk 1939 "für die Entdeckung der antibakteriellen Wirkung von Prontosil". Anfang der 1930er Jahre war das Unternehmen ein Spender der NSDAP und nach der Machtübernahme durch die Nationalsozialisten 1933 ein wichtiger staatlicher Auftragnehmer, der wichtige Materialien für die deutschen Kriegsanstrengungen lieferte."
GER_synthetic_rubber:5	"Synthetischer Kautschuk"
GER_synthetic_rubber_desc:5	" "
GER_WIFO_desc:5	"Die Wirtschaftliche Forschungsgesellschaft war eine Gesellschaft, die im Rahmen des Vierjahresplans gegründet wurde. Ihre Aufgabe war der Bau von Treibstofflagern als Kriegsvorbereitung gegen ein mögliches Embargo."
GER_fuel_silo:5	"Brennstofflagerung"
GER_expand_coop_mil_civ_industry:5	"Industrie verzahnen"
GER_expand_coop_mil_civ_industry_desc:5	"Die Zusammenarbeit zwischen unserer Rüstungsindustrie und unserer zivilen Industrie kann die Effizienz erhöhen und ihnen helfen, Synergien zu finden. Diese Idee stammt von einem General namens Georg Thomas, der seit einiger Zeit die Rüstungsabteilung der Wehrmacht leitet."
GER_organisation_todt:5	"Organisation Todt"
GER_mobilize_the_reich_desc:5	"In den Worten des deutschen Außenministers: "Wir verlangen nichts mehr, wir wollen den Krieg". Und wir haben ihn bekommen."
GER_strengthen_the_tankforce:5	"Verstärkung der Panzertruppen"
GER_expand_opel_werke:5	"Ausbau der Opel-Werke"
GER_expand_opel_werke_desc:5	"Der Ausbau der industriellen Kapazitäten zur Herstellung von motorisiertem Gerät wie Lastkraftwagen oder mechanisierten Halbkettenfahrzeugen ist für die mobilen Kräfte der Armee von großer Bedeutung."
GER_take_over_skoda_desc:5	"Mit der Gründung des Protektorats Böhmen und Mähren steht es Deutschland frei, mit den verschiedenen tschechischen Unternehmen - auch mit Škoda - zu verfahren, wie es will."
GER_take_over_CKD:5	"CKD-Übernahme"
GER_synthetic_oil_refinery:5	"Raffinerien für synthetisches Öl"
GER_synthetic_oil_refinery_desc:5	"Das Reich braucht mehr Öl, wir können uns nicht auf den Überseehandel verlassen, um den ständig wachsenden Bedarf unserer Streitkräfte zu decken."
GER_synthetic_rubber_refinery:5	"Synthetische Kautschukraffinerien"
GER_defence_economy_and_armament_office_desc:5	" "
undergroud_factories_tech_bonus:5	"Bonus für unterirdische Fabriken"
GER_bank_of_german_aviation_desc:5	"Wir können eine Bank gründen, die Geld in private Luftfahrtunternehmen investiert, um die Forschung in diesem wichtigen Bereich zu fördern, ohne dass unsere Feinde direkt von unseren wahren Absichten erfahren. Die Unternehmen können im Ausland gegründet werden, z.B. in Schweden und den Niederlanden, um das Misstrauen noch weiter zu verringern."
GER_expand_aircraft_factories:5	"Ausweitung der Flugzeugfabriken"
GER_expand_oil_bohemia:5	"Erweitern Sie die Ölförderung in Böhmen"
GER_expand_oil_bohemia_desc:5	"Wir haben Ölvorkommen in unserem Hinterhof, die wir nutzen sollten!"
GER_expand_oil_poland_desc:5	"Wir haben Ölvorkommen in unserem Hinterhof, die wir nutzen sollten!"
GER_power_reich:0	"Neue Kraftwerke"
GER_power_reich_desc:0	"Wir müssen neue Kraftwerke bauen, um unsere wachsende Wirtschaft zu unterstützen!" GER_reorganise_the_industry:5 "Reorganisation unserer Industrie"
GER_revenge_versailles:5	"Rache für Versailles"
GER_sonderkraftfahrzeug_desc:5	"Das Sonderkraftfahrzeug (SdKfz) 251 ist der erste gepanzerte Mannschaftstransportwagen (APC) der Welt und eines der wichtigsten AFVs der deutschen Armee. Dank seiner soliden Konstruktion werden wir später in der Lage sein, seine Nützlichkeit auf bestimmte Aufgaben zu spezialisieren, die die Leistungsfähigkeit gepanzerter und mechanisierter Einheiten drastisch erhöhen werden."
GER_Begin_Carrier_Building_Program_desc:5	""
GER_New_Carrier_Designs:5	"Neue Trägermodelle"
GER_Introduce_New_Carriers:5	"Graf Zeppelin bestellen"
GER_Introduce_New_Carriers_desc:5	"Der deutsche Flugzeugträger Graf Zeppelin war das führende Schiff einer Klasse von zwei Flugzeugträgern gleichen Namens, die von der Kriegsmarine des nationalsozialistischen Deutschlands in Auftrag gegeben wurden. Sie war der einzige deutsche Flugzeugträger und Teil des Versuchs der Kriegsmarine, eine ausgewogene Hochseeflotte zu schaffen, die in der Lage war, die deutsche Seemacht weit über die engen Grenzen der Ost- und Nordsee hinaus zu demonstrieren. Der Flugzeugträger hätte über eine Besatzung von 42 Jagdflugzeugen und Sturzkampfbombern verfügt. Der Bau der Graf Zeppelin begann am 28. Dezember 1936 mit der Kiellegung auf der Werft der Deutschen Werke in Kiel. Das nach Graf Ferdinand von Zeppelin benannte Schiff lief am 8. Dezember 1938 vom Stapel und war bis zum Ausbruch des Zweiten Weltkriegs im September 1939 zu 85 % fertiggestellt."
GER_order_bismarck_class_ships_desc:5	"Die Bismarck war das erste von zwei Schlachtschiffen der Bismarck Klasse, die für die Kriegsmarine des nationalsozialistischen Deutschlands gebaut wurden. Das nach dem Reichskanzler Otto von Bismarck benannte Schiff wurde im Juli 1936 auf der Werft Blohm & Voss in Hamburg gebaut und lief im Februar 1939 vom Stapel. Die Arbeiten waren im August 1940 abgeschlossen, als das Schiff in die deutsche Flotte aufgenommen wurde. Die Bismarck und ihr Schwesterschiff Tirpitz waren die größten jemals von Deutschland gebauten Schlachtschiffe und zwei der größten, die je von einer europäischen Macht gebaut wurden."
GER_Battleship_Armament:5	"Bestellung von Schlachtschiffen der Bismarck Klasse"
GER_new_battleship_designs:5	"Entwicklung neuer Schlachtschiffdesigns"
GER_Convoy_Interdiction_Philosophy_desc:5	""
GER_new_lr_uboat_designs:5	"Neue U-Boot-Entwürfe mit großer Reichweite"
GER_modern_battlefleet:5	"£tech_mod Moderne Schlachtflotte"
GER_modern_battlefleet_desc:5	"Der Herrscher der Welt muss auch die Wellen beherrschen - deshalb muss das Vaterland seine Seemacht demonstrieren."
GER_operation_paukenschlag_desc:5	"Das Unternehmen Paukenschlag steht für einen neuen Ansatz im Umgang mit den Briten: Anstatt nur die Konvois zu versenken, die nach Großbritannien geschickt werden, sollen so viele Konvois wie möglich versenkt werden."
GER_Expand_Deutsche_Werke:5	"Ausbau der Werften der Deutschen Werke"
GER_Milchkuh:5	"Milchkuh"
GER_Milchkuh_desc:5	"Mit der Einführung von "Milchkuh"-U-Booten werden unsere U-Boote in der Lage sein, in viel größeren Entfernungen als bisher zu operieren."
GER_french_naval_bases:5	"Marinestützpunkte in Frankreich"
GER_war_with_usa_desc:5	"Trotz Deutschlands bester Versuche, die Amerikaner neutral zu halten, bedeutet die ständige Unterstützung, die sie dem Vereinigten Königreich und seinen Verbündeten gewähren, dass die Vereinigten Staaten ihre Rolle in dem, was ein gerechter europäischer Krieg hätte werden sollen, gewählt haben. Es ist an der Zeit, sie offiziell daran zu erinnern."
GER_Argentine_U_Boat_Resupply:5	"Argentinische U-Boot Stützpunkte"
GER_operation_margarethe:5	"Unternehmen Margarethe"
GER_operation_margarethe_desc:5	"Unternehmen Margarethe"
GER_operation_margarethe_II_desc:5	"Unternehmen Margarethe II"
GER_war_with_england:5	"Krieg mit England"
GER_operation_sealion:5	"Unternehmen Seelöwe"
GER_operation_sealion_desc:5	"Unternehmen Sealion"
GER_battle_of_britain:5	"Schlacht um Großbritannien"
GER_reintegrate_westpreussen_desc:5	"Reintegration Westpreußens"
GER_align_hungary:5	"Bündnis mit dem Königreich Ungarn"
GER_germanization_balkan:5	"Germanisierung des Balkans"
GER_germanization_balkan_desc:5	"Eindeutschung des Balkans"
GER_invasion_of_malta_desc:5	"Invasion von Malta"
GER_invasion_of_gibraltar:5	"Invasion von Gribraltar"
GER_rationing_desc:5	"Als Albert Speer die Nachfolge von Fritz Todt antrat, wurde der Schritt zu härteren Kriegsmaßnahmen vollzogen. Es werden strengere Rationen eingeführt, aber gleichzeitig ist eine stetige Steigerung der militärischen Leistung zu beobachten."
GER_total_war:5	"Der totale Krieg"
GER_total_war_desc:5	"Die Feinde Deutschlands haben sich als stärker erwiesen als bisher angenommen. Damit das Vaterland diesen Krieg gewinnen kann, bedarf es der Zusammenarbeit und des vollen Einsatzes des gesamten deutschen Volkes für die Kriegsanstrengungen."
GER_Expand_Kummersdorf_Testing_Grounds:5	"£tech_mod Erweiterung Versuchsgelände Kummersdorf"
GER_schwerer_gustav_desc:5	"Eisenbahngeschütz \"Schwerer Gustav\""
GER_Volksgemeinschaft_Welfare_desc:5	"Wir werden ein Wohlfahrtsprogramm für Menschen deutscher Volkszugehörigkeit ins Leben rufen und den Schwachen in unserer Gesellschaft wirtschaftliche Unterstützung und Schutz bieten."
GER_Volksdeutsche:5	"Volksdeutsche"
GER_Expand_the_Labor_Front:5	"£tech_mod Die Arbeitsfront ausbauen"
GER_Expand_the_Labor_Front_desc:5	"Wir brauchen jeden fähigen Geist und Körper zur Arbeit"
GER_Establish_Volkswagen_desc:5	""
GER_kdf_wagen:5	"KdF-Wagen"
GER_kdf_wagen_desc:5	"Wir werden unseren Bürgern die Möglichkeit geben, ihr eigenes zukünftiges "Volksauto" über ein Sparprogramm zu erwerben, mit dem wir wiederum den Bau der Fabriken finanzieren werden, in denen diese Autos schließlich gebaut werden."
GER_1940_waffen_ss_expansion:5	"Ausbau der Waffen-SS 1940"
GER_1941_waffen_ss_expansion:5	"Ausbau der Waffen-SS 1941"
GER_1943_waffen_ss_expansion:5	"Ausbau der Waffen-SS 1943"
GER_1943_waffen_ss_expansion_desc:5	"Erweiterung der Waffen-SS 1943"
GER_modernize_support_desc:5	"Mit neuerer und besserer Ausrüstung können wir die Hauptanstrengungen im Angriff und in der Verteidigung durch eine Division besser unterstützen."
GER_achtung_minen:5	"Achtung Minen"
GER_achtung_minen_effect:5	"Ermöglicht §HAchtung Minen§!\n§HWüstenunterstützungsabteilungen\n Wüste§!\n Verteidigung: §G+10%§!\n"
achtung_minen:5	"Achtung Minen"
achtung_minen_desc:5	"Durch den Einsatz einer großen Anzahl von Minen können wir uns einen defensiven Vorteil verschaffen."
GER_operation_tannenbaum_desc:5	"Die Schweiz besitzt das ekelhafteste und miserabelste Volk und politische System. Wir haben jetzt endlich Zeit, uns um diese Todfeinde des neuen Deutschlands zu kümmern."
GER_german_swiss_trade_agreement_bonus:5	"§0Wenn sie zustimmen, gewinnen wir 4 Militärfabriken (ausserhalb der Karte), verlieren aber 8 Stahl, wenn Italien in unserer Fraktion ist, gewinnen sie auch 1 Militärfabrik (ausserhalb der Karte)!§!"
GER_Mittelafrika_Claim_EXPL:5	"§HDie Reichskolonie Mittelafrika§! erhebt §Hcore§! und §Hclaims§! über die östlichen, mittleren und südlichen Regionen Afrikas.\n"
GER_Mittelafrika_Claim_desc:5	"Unsere afrikanischen Kolonien sind uns am Ende des Großen Krieges genommen worden. Dieser Verrat muss durch die Wiederverwirklichung des Planes Mittelafrika, eines riesigen Staates in Afrika, der von Deutschen für Deutsche regiert wird, vergolten werden."
GER_Mittelafrika_EXPL:5	"Wenn wir oder unsere Verbündeten Gebiete kontrollieren, die von der §HReichscollony Mittelafrika§! beansprucht werden, werden wir diese Gebiete an sie abtreten.\n"
GER_Mittelafrika_desc:5	"Wir haben erfolgreich Territorium in Afrika erobert und werden nun dessen Selbstverwaltungssystem ausrufen. Mit diesem Schritt ist Deutschland um so stärker."
GER_State_Matters_desc:5	""
GER_Volkssturm:5	"Volkssturm bilden"
GER_Volkssturm_EXPL:5	"In Deutschland werden 24 §HVolkssturm§!-Divisionen gebildet."
GER_Emergency_Gun_Production_desc:5	""
GER_Empower_Nat:5	"Ausländische Nationalisten unterstützen"
GER_Finnish_Tiger_EXPL:5	"Deutsch-finnische Diplomatie im Fokus"
GER_Finnish_Aliance:5	"Antisowjetisches Bündnis vorschlagen"
GER_Hitler_Speech:5	"Hitlers Reden"
GER_Hitler_Speech_tt:5	"Entscheidung freischalten: §HÖffentliche Reden§!"
GER_Economic_Assistance_To_Italy:5	"Wirtschaftliche Hilfe für Italien"
GER_Economic_Assistance_To_Italy_desc:5	"Wir werden Mussolini helfen, sein Land zu entwickeln. Italien ist auf die Führung eines modernen Krieges völlig unvorbereitet. Die durch den Krieg in Äthiopien entstandenen Kosten haben der italienischen Staatskasse die Mittel entzogen, die sie zur Modernisierung ihrer Streitkräfte benötigt. Unsere Hilfe wird wesentlich zur Entwicklung der Waffenbestände und der industriellen Kapazitäten des Landes beitragen."
GER_Support_Italian_Claims:5	"Unterstützung der italienischen Forderungen"
GER_Help_Develop_Italian_Refineries_desc:5	"In Norditalien gibt es ungenutzte Mineralienreserven. Wir werden die Italiener bei der Entwicklung der Infrastruktur unterstützen, die für die Förderung des äußerst wertvollen Öls, das sie besitzen, erforderlich ist."
GER_italian_workers:5	"Italienische Arbeiter"
GER_panther_wall:5	"Pantherstellung"
GER_panther_wall_desc:5	"Pantherstellung"
GER_loot_force_one_desc:5	"Verbesserte Ausrüstungseroberung"
GER_train_panzergrenadiere:5	"Zug Panzergrenadiere"
GER_counter_soviet_armor:5	"Gegen sowjetische Panzer"
GER_counter_soviet_armor_desc:5	"Sowjetische Panzer bekämpfen"
GER_winter_equipment_production:5	"Produktion von Winterausrüstung"
GER_besiege_fortified_cities_desc:5	"Belagern Sie befestigte Städte"
GER_learn_from_soviet_armor_tooltip:5	"Nachdem dieser Schwerpunkt abgeschlossen ist, werden §YPz V 'Panther'-Forschung§! und §YPz VI 'Königstiger'-Forschung§! automatisch vervollständigt, wenn andere Voraussetzungen erfüllt sind."
GER_the_war_behind_the_front_desc:5	"Der Krieg hinter der Front"
GER_Suply_I:5	"Permanente Nachschublinien"
GER_Support_Nat_Spain:5	"Unterstützen Sie das nationalistische Spanien"
GER_Support_Nat_Spain_Expl:5	"Wir werden §HNationalistisches Spanien§! zur Verfügung stellen! 3000 an Infanterieausrüstung. Wenn wir mehr als 100 Stück Artillerie auf Lager haben, können wir auch diese schicken."
GER_Lessons_From_Spain:5	"Lehren aus dem Spanienfeldzug"
GER_Lessons_From_Spain_desc:5	"Der Spanische Bürgerkrieg ist gewonnen! Mit unserer Hilfe sind in ganz Spanien nationalistische Fahnen zu sehen. Und da wir im Südwesten einen starken gleichgesinnten Verbündeten gewonnen haben, haben wir auch unschätzbare Erfahrungen aus dem bewaffneten Konflikt gewonnen, an dem wir beteiligt waren."
GER_Surrender_desc:5	""
GER_Total_Krieg_desc:5	"Ich frage euch: Wollt ihr den totalen Krieg? Wollt ihr ihn, wenn nötig, totaler und radikaler, als wir ihn uns heute überhaupt erst vorstellen können?\n Nun, Volk, steh auf und Sturm brich los!"
GER_Gestapo_Div_desc:5	""
GER_Germania_desc:5	"Die von Albert Speer entworfene und vom Führer selbst genehmigte Welthauptstadt Germania wird ein leuchtendes Beispiel für das neue Deutschland und Europa sein. Von der Großehalle bis zur Siegessäule wird die Stadt mit den modernsten Einrichtungen, den luxuriösesten Restaurants und den schönsten Parks ausgestattet sein - alles zum Ruhme des Führers und der deutschen Nation."
GER_Germania_Volkshalle:5	"Die Volkshalle der Germania"
GER_Germania_Defence_Sector:5	"Germanias Verteidigungssektor"
GER_Germania_Defence_Sector_desc:5	"Um die Sicherheit unserer großen Welthauptstadt zu gewährleisten, werden wir in den Aufbau einer starken Rundumverteidigung investieren. Dazu gehören moderne Bunker, Raketensysteme, Luftabwehrtürme und professionelles militärisches Personal für den Betrieb."
GER_Germania_Research:5	"Germanias Laboratorien ausbauen"
GER_Germania_Research_desc:5	"Eine große Stadt bringt viele große Köpfe hervor. Unsere Priorität muss der Bau moderner Forschungskomplexe sein, um ihnen ein geeignetes Gelände zu bieten, auf dem sie arbeiten können."
GER_Lebensborn_desc:5	""
GER_Superpower_desc:5	"Europa gehört uns. Von Gibraltar bis Moskau, von London bis Athen wehen deutsche Fahnen.\nIst der Endsieg erreicht? Sollen wir den Unterzeichnern des Dreiparteienpaktes die volle Unabhängigkeit von Deutschland lassen?\n Wir müssen einen Gipfel organisieren und diese Dinge ein für alle Mal lösen."
GER_One_Reichs_Navy_EXPL_2:5	"Wir werden sowohl ihre §HSchiffe§! als auch ihre §HAdmirale§!.\n"
GER_heavy_fighter_focus:5	"Bonus für schwere Jagdflugzeuge"
GER_heavy_fighter_focus_desc:5	"Unsere schweren Jäger müssen in der Lage sein, die anfälligeren Bomberflugzeuge zu unterstützen. Dies erfordert eine stärkere Bewaffnung und eine größere Reichweite auf Kosten einer gewissen Geschwindigkeit."
GER_night_fighter_focus:5	"Nachtjäger-Bonus"
GER_Finnish_weapons:0	"Rüstung und Nachschub für den Tiger"
GER_Finnish_weapons_desc:0	"Ein starker Verbündeter ist ein guter Verbündeter"
GER_aid_hun_air_desc:0	""
GER_long_winter:0	"Vorbereiten auf den langen Winterkrieg"
GER_kick_in_door:0	"Tritt die Tür ein"
GER_kick_in_door_TT:0	"Sobald wir die Invasion der Sowjets starten, erhalten wir für 90 Tage"
GER_soviet_treaty_research_tt:5	"\nSperren Sie £tech_mod §CForschungsplatz§! für §CPanzer§! und §CPanzertechnologien§! sowohl für §Y[GER.GetName]§! als auch für §Y[SOV.GetName]§! auf. Wenn der Vertrag abgelehnt wird, steht uns dieser Slot über den Fokus £tech_mod §YErweiterung des Kummersdorfers Testgelände§! und über den Fokus §Y[SOV.GetName]§! zur Verfügung."
SOV_german_treaty_research_tt:5	"Schalte £tech_mod §CForschungsplatz§! für §CAPanzer§! und §CPanzertechnologien§! sowohl für den §Y[SOV.GetName]§! als auch für den §Y[GER.GetName]§! frei.\n\nWenn der Vertrag abgelehnt wird, ist dieser Slot für uns über den Fokus £tech_mod §YTankograd§! und für den §Y[GER.GetName]§! über den Fokus verfügbar.\n\n"
GER_unlock_tank_research_kummersdorf_no_tt:5	"£tech_mod §CForschungsplatz§! nicht verfügbar, da §YDeutsch-Sowjetischer Vertrag§! unterzeichnet wurde.\n\n"
SOV_unlock_tank_research_tankograd_yes_tt:5	"£tech_mod §CForschungsplatz§! verfügbar, da §YDeutsch-Sowjetischer Vertrag§! nicht unterzeichnet wurde.\n\n"
mr_accepted:0	"Molotow-Ribbentrop-Pakt geehrt"
ITA_eth_develope_desc:5	"Das Gebiet um die Hauptstadt von Africa Orientale Italiana muss weiter entwickelt werden"
ITA_reformed_military:5	"Moderne Armee"
ITA_eastern_front_desc:5	"Deutschland kämpft gegen die rote Bestie, und wenn wir unsere Offensivfähigkeiten nicht auf gut geölte Weise kombinieren, wird diese Bestie uns beide fressen!"
ITA_ethiopian_war_logistics:5	"Die äthiopische Kriegslogistik"
ITA_fortification_effort:5	"Festungsbau"
ITA_fortification_effort_desc:5	"Wir müssen unsere Küsten und Grenzen gegen Angriffe der schwindenden und dekadenten imperialen Mächte Frankreich und Großbritannien verteidigen. Die westliche Grenze ist eine natürliche Linie, die mit zusätzlichen Festungen und Minenfeldern uneinnehmbar wird."
ITA_learn_from_the_ethiopian_war:5	"£tech_mod Lehren aus dem Äthiopienkrieg"
ITA_learn_from_the_ethiopian_war_desc:5	"Der Äthiopienkrieg endete mit einem schnellen Sieg, aber wir können wichtige Lehren aus diesem Konflikt ziehen."
ITA_victory_by_any_means:5	"Siegen mit allen Mitteln"
ITA_victoryinETH_desc:5	"Nach unserem Sieg in Äthiopien haben wir rechtmäßig den Status eines Kolonialreichs erreicht. Mussolini wird eine Ansprache an die Nation halten und dem König die Kaiserkrone von Äthiopien anbieten!"
ITA_inf_guy:5	"Förderung von Mario Berti"
ITA_regia_marina_desc:5	"Unsere königliche Marine ist eine der besten der Welt, wir müssen sie jedoch verbessern, wenn wir den Mittelmeerraum beherrschen wollen."
ITA_modernisation_attempt:5	"Modernisierungsversuch"
ITA_capital_ships:5	"Moderne Großkampfschiffe"
ITA_capital_ships_desc:5	"Die Admiralität ist der Meinung, dass Schlachtschiffe immer noch die Zukunft der Seekriegsführung sind, die alliierten Flugzeugträger werden von unseren überlegenen Kanonen vernichtet werden."
ITA_ship_fuel_desc:5	"Angesichts der Ölknappheit müssen wir jeden Knoten ausnutzen."
ITA_ship_design:5	"Flexible Entwürfe"
ITA_ship_design_desc:5	"Die Fähigkeit, unsere Marine schnell zu aktualisieren und anzupassen, wird sich auf lange Sicht als unschätzbar erweisen"
ITA_malta:5	"Der unsinkbare Flugzeugträger"
ITA_Escape_the_cage_desc:5	"Um sich aus dem Mittelmeerraum zu befreien, müssen wir uns dieselben Technologien aneignen, über die die britische Marine verfügt."
ITA_Modern_naval_bomber_effort_desc:5	"Die Royal Navy ist zahlenmäßig überlegen, wir brauchen einen modernen Marinebomber, um im Mittelmeer zu gewinnen."
ITA_Navy_Airforce_Coordination:5	"Koordinierung von Marine und Luftwaffe"
ITA_Regia_Aeronautica:5	"Regia Aeronautica"
ITA_Regia_Aeronautica_desc:5	"Die königliche Luftwaffe mag nicht die beste oder die schwächste sein, aber sie hat viele Veteranen aus dem Ersten Weltkrieg in ihren Reihen."
ITA_Fiat_g50_Freccia_desc:5	"Unsere Ingenieure sind der Meinung, dass der Doppeldecker immer noch ein guter Entwurf ist, und deshalb werden wir ihn weiter verwenden."
ITA_Learn_from_the_Luftwaffe:5	"Lernen Sie von der Luftwaffe"
ITA_Learn_from_the_Luftwaffe_desc:5	"Die Luftwaffe hat großartige Flugzeuge und Taktiken, wir müssen von ihnen lernen, wenn wir eine Chance gegen die britische Luftwaffe haben wollen."
ITA_Picchiatello2:5	"Mehr Stukas"
ITA_Macchi_MC_202_desc:5	"Der Doppeldecker hat sich gegen moderne Flugzeuge als unwirksam erwiesen, wir müssen auch den Eindecker übernehmen."
ITA_Artillery_Modernisation_desc:5	"Die Regio Esercito ist theoretisch eine der größten Armeen der Welt. Leider gibt es keine Möglichkeit, all diese Männer angemessen auszurüsten. Das Schlimmste aber ist, dass der Großteil unserer Artillerie aus dem Jahr 1918 stammt!"
ITA_Convert_WW1_Weapons_and_equipment:5	" Konvertieren Sie WW1-Waffen und -Ausrüstung"
ITA_Convert_WW1_Weapons_and_equipment_desc:5	"Wir können alte Ausrüstung und Waffen aus dem 1. Weltkrieg umbauen und wiederverwenden, anstatt sie in Lagern verrotten zu lassen."
ITA_Expand_Northern_Italy_weapons_manifactures:5	"Norditalienische Rüstungshersteller"
ITA_Alpini:5	"Alpini"
ITA_Alpini_desc:5	"Die Alpini sind unsere bergsteigerischen Elitetruppen. Sie haben im Ersten Weltkrieg tapfer gedient und werden dies auch im nächsten Krieg tun."
ITA_ARMIR:5	"ARMIR"
ITA_Learn_from_the_Wehrmacht_desc:5	"Die Wehrmacht erwies sich als eine beeindruckende Macht, und wir können viele wertvolle Lektionen von den Deutschen lernen."
ITA_Legacy_of_the_Arditi:5	"Das Vermächtnis der Arditi"
ITA_Divisione_di_fanteria_pesante_unit_tt:5	"Erhalten Sie eine Vorlage mit §Y9 Infanterie§!, §Y3 Artillerie§! und §Y1 Panzerabwehr§! Bataillonen."
ITA_AVANTI:5	"AVANTI!"
ITA_Modern_Warfare:5	"Moderne Taktik"
ITA_Modern_Warfare_desc:5	"Wir haben Bereiche identifiziert, in denen wir unsere Taktik verbessern können"
ITA_Stable_Leaders_desc:5	"Die königliche Armee hat seit ihrer Gründung noch nie einen Krieg verloren. Es wäre töricht, mitten im Krieg die Pferde zu wechseln."
ITA_6_Million_Bayonets:5	"8 Millionen Bajonette"
ITA_6_Million_Bayonets_desc:5	"Mussolini glaubt, dass Italien eine riesige Armee aufstellen kann, die jeden Gegner zahlenmäßig vernichten kann."
ITA_Innovative_theories:5	"Innovative Theorien"
ITA_Divisione_motorizzata_unit_tt:5	"Erhalten Sie eine Vorlage mit §Y9 Motorisierte§!, §Y3 Motorisierte Artillerie§! und §Y1 Motorisierte Panzerabwehr§! Bataillone."
ITA_Reform_the_army_command_structure:5	"Reform der Kommandostruktur der Armee"
ITA_Reform_the_army_command_structure_desc:5	"Messe hat die Probleme der Heeresleitung erkannt und wird sie lösen."
ITA_The_industrial_triangle:5	"Das industrielle Dreieck"
ITA_Dockyards_effort:5	"£tech_mod Schiffsaufträge an CRDA"
ITA_Dockyards_effort_desc:5	"Wir können die CRDA (Vereinigte Werften in der Adria) mit der Produktion von Schiffen beauftragen, was für den Aufbau einer modernen Marine sehr hilfreich wäre."
ITA_Prioritise_naval_industry:5	"Priorisierung der Marineindustrie"
ITA_arms_factory:5	"Erhöhung der Fabrikproduktion"
ITA_Italian_tank_divisions_desc:5	"Jetzt, wo wir richtige Panzer haben, werden wir eine moderne Panzerdivision aufstellen."
ITA_modern_tank_divisions:5	"Moderne Panzerdivision"
ITA_Divisione_corazzata_43_unit_tt:5	"Erhalten Sie eine Vorlage mit §Y3 mittleren Panzern§!, §Y2 Motorisiert§!, §Y1 Mechanisiert§!, §Y2 Motorisierte Artillerie§!, §Y1 Motorisierte mittlere Artillerie§! und §Y1 gepanzerte Artillerie§! Bataillonen.\n"
ITA_Increase_factory_output:5	"£tech_mod Steigerung der Rüstungsproduktion"
ITA_Increase_factory_output_desc:5	"Uns fehlt es an militärischen Fabriken, wir können Mittel aus den Militärwerften abzweigen, um dieses Problem zu lösen."
ITA_Exploit_the_new_empire:5	"Das neue Reich ausbeuten"
ITA_libyan_infrastructure_desc:5	"Unsere riesigen Ländereien in Nordafrika hinken in Bezug auf die Infrastruktur noch immer hinter dem Rest unseres Reiches her. Wir sollten unsere Anstrengungen darauf konzentrieren, sie auf den gleichen Stand zu bringen."
ITA_Lybian_oil_fields:5	"Ardito Desio-Expedition"
ITA_Autarchia_desc:5	"Mussolini ist von der Autarkie besessen, und nach den Sanktionen der Liga der Nationen ist klar, dass die Autarkie unsere einzige Option ist."
ITA_Istituto_LUCE:5	"Istituto LUCE"
ITA_Istituto_LUCE_desc:5	"Die staatliche Filmagentur, jeder in den 20er und 30er Jahren in Italien produzierte Film wurde von LUCE hergestellt, es war ein sehr effektives Propagandamittel und kann für militärische Ausbildungsfilme verwendet werden."
ITA_Hitler_visits_Rome:5	"Hitler besucht Rom"
ITA_Hitler_visits_Rome_desc:5	"Hitler wird bald unsere Hauptstadt besuchen, wir werden neue Straßen und ein großes Hotel bauen, um ihn zu empfangen."
ITA_corpo_truppe_volontarie:	"Corpo truppe volontarie"
ITA_send_planes_to_Franco:5	"Schickt Flugzeuge zu Franco"
Send_planes_to_franco:5	"Indem wir einige Flugzeuge zur Unterstützung Francos schicken, können wir einige Flugerfahrungen sammeln."
ITA_send_ships_to_Franco:5	"Schiffe zu Franco schicken"
ITA_send_ships_to_Franco_desc:5	"Die Nationalisten brauchen mehr Schiffe, um den Kommunisten Paroli bieten zu können. Wir könnten ihnen einige unserer alten Schiffe schicken."
ITA_join_the_axis:5	"Schließen Sie sich der Achse an"
ITA_join_the_axis_desc:5	"Frankreich wurde zerschlagen und der deutsche Sieg scheint sicher zu sein, wir müssen jetzt in den Krieg eintreten, um auf der baldigen Friedenskonferenz um Land bitten zu können."
ITA_army_primacy:5	"Vorrang der Armee"
ITA_army_primacy_desc:5	"Industriell hinkt Italien immer noch hinter den dekadenten Kolonialreichen hinterher. Wir müssen uns entscheiden, ob wir dem Heer oder der Marine den Vorrang geben. Die Entscheidung liegt auf der Hand: Wie das antike Römische Reich auf seine Legionen angewiesen war, so muss es auch das neue Italienische Reich sein!"
ITA_modernized_artillery:5	"Modernisierte Artillerie"
ITA_modernized_artillery_desc:5	"Die Regio Esercito ist theoretisch eine der größten Armeen der Welt. Leider gibt es keine Möglichkeit, all diese Männer angemessen auszurüsten. Das Schlimmste ist, dass der Großteil unserer Artillerie aus dem Jahr 1918 stammt!"
ITA_modernized_army:5	"Modernisierte Armee"
ITA_modernized_army_desc:5	"Eine bessere Artillerie wird unsere Kampfkraft erheblich steigern, aber wir brauchen auch neue Taktiken und Doktrinen."
ITA_bomber_effort_desc:5	"Die Zeiten sind vorbei, in denen Armeen Kriege gewinnen konnten, ohne in die Luft zu blicken. Wir müssen unsere taktischen Bomber weiterentwickeln, um unseren Soldaten die nötige Luftunterstützung zu geben."
ITA_marines_and_landing_craft:5	"Marineinfanterie und Landungsboote"
ITA_yugoslavia_war_goal_desc:5	"In Jugoslawien gibt es immer noch eine bedeutende italienische Bevölkerung, die zumindest auf die glorreichen Zeiten Venedigs zurückgeht. Die Wiederherstellung dieser Regionen unter italienischer Herrschaft ist ein wichtiger Schritt zur Wiederherstellung des Römischen Reiches!"
ITA_expand_claims:5	"Wiederherstellung von Ansprüchen"
ITA_expand_claims_desc:5	"Nach dem Vertrag von London gehören diese Gebiete uns"
ITA_zara:5	"Integrieren Sie Zara"
ITA_zara_desc:5	"Es ist italienisches Land"
ITA_yugoslavia_friend:5	"Freundschaft mit Jugoslawien"
ITA_yugoslavia_friend_desc:5	"Anstatt Jugoslawien jetzt zu verärgern, können wir seine eventuelle Eroberung auf einen günstigeren Zeitpunkt verschieben. Stattdessen könnten wir uns mit dem Regime anfreunden und das Land in unsere Einflusssphäre bringen."
ITA_support_nationalist_spain_desc:5	"Spanien befindet sich mitten in einem Bürgerkrieg, der darüber entscheiden wird, ob es in Zukunft ein möglicher faschistischer Verbündeter sein oder eine nutzlose Republik bleiben wird - oder schlimmer noch, ob es dem Kommunismus oder der Anarchie verfällt. Wir müssen die wahren Spanier unterstützen, bevor es zu spät ist!"
ITA_demand_balearic_islands:5	"Anfrage Balearen"
ITA_demand_balearic_islands_desc:5	"Nachdem wir unsere Unterstützung für Francos neues Regime bewiesen haben, können wir verlangen, dass eines der wichtigen Gebiete, für deren Verteidigung wir gekämpft haben, die Balearen, für zwei Jahre an Italien ausgeliehen wird, um unsere strategische Position im Mittelmeer zu stärken."
ITA_raid_gib:5	"Überfall auf Gibraltar"
ITA_raid_gib_desc:5	"Der mächtige Felsen von Gibraltar ist auf dem Seeweg fast uneinnehmbar, doch da die Briten nun auf dem Rückzug sind, könnten wir Spanien davon überzeugen, das, was ihnen gehört, zurückzunehmen."
ITA_bulgaria_friend:5	"Freundschaft mit Bulgarien"
ITA_bulgaria_friend_desc:5	"Bulgarien liegt in unserer Einflusssphäre. Der sichere Anschluss an Italien ist der Schlüssel zu unseren Ambitionen auf dem Balkan."
ITA_albania_war_goal:1	"Albanische Besatzung"
ITA_albania_war_goal_desc:1	"Albanien ist ein leicht zu besetzendes Ziel für unsere Truppen. Es ist unwahrscheinlich, dass wir auf großen Widerstand stoßen werden. Wir müssen der Welt die Macht Italiens zeigen und den Ruhm des Römischen Reiches wiederherstellen!"
ITA_pact_of_steel:5	"Patto d'Acciaio"
ITA_claims_on_france:5	"Ansprüche auf Frankreich"
ITA_go_after_france:5	"Verfolgen Sie Frankreich"
ITA_spanish_italian_faction_desc:5	"Franco und die spanischen Nationalisten sind unsere natürlichen Verbündeten, geeint durch Religion, Kultur und Ideologie. Gemeinsam könnten wir Gibraltar einnehmen und der Royal Navy das Leben sehr schwer machen..."
ITA_italian_highways:5	"Autostrade"
ITA_italian_highways_desc:5	"Wir müssen unsere Infrastruktur ausbauen, um die Mobilität unserer Truppen in unserem Reich zu gewährleisten. Angesichts von Feinden in jedem Winkel der Welt ist dies ein entscheidender Faktor für die Verteidigung des gesamten italienischen Bodens."
ITA_greece_war_goal:5	"Krieg mit Griechenland"
ITA_greece_friend:5	"Freundschaft mit Griechenland"
ITA_greece_friend_desc:5	"Die Griechen sind ein befreundetes antikes Volk und die Wiege der westlichen Zivilisation. Es sollte nicht unmöglich sein, ihre Ziele mit unseren in Einklang zu bringen..."
ITA_turkey_friend:5	"Freundschaft mit der Türkei"
ITA_turkey_friend_desc:5	"Die Türken haben nach dem italienisch-türkischen Krieg und dem Großen Krieg keinen Grund, uns zu lieben. Die Realpolitik hat jedoch Vorrang vor alten Streitigkeiten, und die aktuelle Situation im Mittelmeer könnte unsere beiden Sterne in Einklang bringen."
ITA_portugal_friend:5	"Freundschaft mit Portugal"
ITA_portugal_friend_desc:5	"Portugal ist ebenso wie Spanien ein natürlicher Verbündeter des italienischen Volkes. Wir müssen diese Freundschaftsbande stärken."
ITA_anti_uk_war_goals:5	"Krieg mit dem Vereinigten Königreich"
ITA_anti_uk_war_goals_desc:5	"Das zerfallende britische Empire hat uns im Mittelmeerraum eingesperrt und wird uns niemals freiwillig die Schlüssel überlassen. Wir müssen die Engländer angreifen, sobald die Zeit reif ist!"
ITA_japan_friend:5	"Freundschaft mit Japan"
ITA_japan_friend_desc:5	"Die Japaner sind uns sehr ähnlich: eine junge, hungrige Macht mit einer positiven Demografie, die durch den Handel mit schwindenden Plutodemokratien wie dem Vereinigten Königreich und den Niederlanden erpresst wird. Wir sollten uns mit ihnen zusammenschließen, um eine lebendige Seemacht über die Ozeane hinweg zu bilden!"
ITA_seek_help_from_german_scientists:5	"Suche Hilfe von deutschen Wissenschaftlern"
ITA_computing_desc:5	"Das Regio Istituto Elettronico Comunicazioni (RIEC) stellt das Erbe von Guglielmo Marconi dar und ist das führende Forschungsinstitut im Bereich der Funkkommunikation."
ITA_navi_moderne:5	"Moderne Schiffe"
ITA_innovazione:5	"Innovation"
ITA_innovazione_desc:5	"Ideen verändern Menschen und Menschen verändern die Welt."
ITA_pigs:5	"Schweine"
ITA_pigs_desc:5	"Das SLC oder Siluro a Lenta Corsa, auch bekannt als Maiale: Schwein. Es handelt sich um ein kleines U-Boot, das zwei Soldaten mit Taucherausrüstung und einer Sprengladung transportiert, um den Rumpf eines ankernden feindlichen Schiffes anzugreifen."
ITA_maiali:5	"Verbessern Sie die Pigs"
ITA_maiali_desc:5	"Jetzt, wo wir das Mittelmeer unter unserer Kontrolle haben, brauchen wir neue Schiffe, um weiter und schneller zuzuschlagen."
ITA_nemo:5	"U-Boot-Blaupausen"
ITA_nemo_desc:5	"Wir tauchen 20.000 Seemeilen unter das Meer."
ITA_coast_defense:5	"Küstenbefestigungen"
ITA_coast_defense_desc:5	""
ITA_portaerei:5	"Einsatz von Flugzeugträgern"
ITA_a_new_colombo:5	"Ein neues Colombo"
ITA_a_new_colombo_desc:5	"Zeit, in die neue Welt zu segeln!"
ITA_tu_vuo_fa_lamericano:5	"Strahltriebwerk Technologie"
ITA_tu_vuo_fa_lamericano_desc:5	"Neue Triebwerke für schnellere Flugzeuge."
ITA_per_il_duce:5	"Armiamoci e Partite"
ITA_per_il_duce_desc:5	"Armiamoci e Partite! War ein Kriegsslogan unseres Duce, der manchmal einen seltsamen Sinn für Humor hat."
ITA_atomo:5	"Atomare Dämmerung"
ITA_atomo_desc:5	"Was für Geheimnisse sind vor unseren Augen verborgen?"
ITA_anti_air_focus:5	"Luftabwehr-Fokus"
ITA_anti_air_focus_desc:5	"Früher oder später werden wir es mit den Briten am Himmel zu tun haben. Sorgen wir dafür, dass die Jungs, die die Geschütze bedienen, das richtige Werkzeug haben!"
ITA_air_support:5	"Landgestützte Luftunterstützung"
ITA_fanteria:5	"Fanteria"
ITA_fanteria_desc:5	"Immer noch das Bollwerk der Armee."
ITA_better_trucks:5	"Standardisierung von Lastkraftwagen"
ITA_better_trucks_desc:5	"Gotta Keep on Truckin"
ITA_squadre_di_supporto:5	"Unterstützung"
ITA_squadre_di_supporto_desc:5	"Im Kampf brauchen wir alle Arten von Unterstützung für unsere Truppen. Ingenieure, Sanitäter, Logistikexperten usw... Vielleicht können wir alles, was wir brauchen, bei Amazon kaufen."
ITA_the_alps:5	"Die Alpen"
ITA_the_alps_desc:5	"Unsere Elitetruppen brauchen die beste Ausrüstung."
ITA_Ferrea:5	"Ferreo Cuore"
ITA_Ferrea_desc:5	"Wer braucht schon Nachschub?"
ITA_adaption:5	"Was auch immer nötig ist"
ITA_radio_military:5	"Marconi's Funkgeräte"
ITA_radio_military_desc:5	"Guglielmo Giovanni Maria Marconi war einer der größten Erfinder des letzten Jahrhunderts sowie ein bedeutender italienischer Unternehmer und Politiker. Er war verantwortlich für die Erfindung und Entwicklung eines effektiven Fernmeldesystems über Radiowellen, nämlich die drahtlose Telegrafie oder Radiotelegrafie. Die unglaubliche Verbreitung und Entwicklung der Funktelegrafie führte zur Entwicklung des Radios und des Fernsehens und dann aller modernen Funkkommunikationssysteme und -methoden, die drahtlose Kommunikation nutzen. Im Jahr 1909 teilte er sich den Nobelpreis für Physik mit Carl Ferdinand Braun. Leider verstarb er am 20. Juli 1937. Während des Zweiten Weltkriegs waren die Unternehmen Radiomarelli, Safar und Allocchio Bacchini führend in der Entwicklung und Produktion von Funksystemen in Italien."
ITA_forze_speciali:5	"Forze Speciali"
ITA_forze_speciali_desc:5	"Harte Ausbildung und Disziplin machen sie zu Spezialeinheiten."
ITA_gentile_reform:5	"Riforma Gentile"
ITA_gentile_reform_desc:5	"Im Jahr 1923 veränderte die Reform von Giovanni Gentile das Bildungssystem in Italien. Heute, nach 13 Jahren, können wir sagen, dass sie ein großer Erfolg war!"
ITA_armi_chimiche:5	"Armi Chimiche"
ITA_armi_chimiche_desc:5	"Äthiopien ist schwieriger, als wir dachten. Vielleicht brauchen wir ein wenig Hilfe mit einigen chemischen Waffen. Ich habe ein Paar alte Socken, die nie gewaschen wurden..."
ITA_asse_roma_berlino:5	"Asse Roma-Berlino"
ITA_asse_roma_berlino_desc:5	"Der spanische Bürgerkrieg ist die perfekte Gelegenheit, sich Deutschland anzunähern. Mit dem Vorwand, die Freiwilligen zu koordinieren, können wir einige Fortschritte im Kampf gegen den Bolschewismus erzielen."
ITA_infrastructure_in_corno_dafrica:5	"Corno D'Africa"
ITA_the_new_shah:5	"Der neue Schah"
ITA_the_new_shah_desc:5	"Unter einem neuen persischen Marionettenführer können wir die Erschließung von mehr Ölquellen erzwingen und die Fördermengen verdoppeln!"
ITA_rome_was_not_build_in_a_day:5	"Rom wurde auch nicht an einem Tag erbaut."
ITA_rome_was_not_build_in_a_day_desc:5	"Bauforschung zur Verbesserung von Transport und Bauqualität im privaten Sektor."
ITA_expand_the_industries:5	"Ausweitung der industriellen Basis"
ITA_expand_the_industries_desc:5	"Schaffen wir Platz für neue Gebäude."
ITA_AT:5	"Panzerabwehr-Artillerie"
ITA_AT_desc:5	"Unsere Artillerie gehört zu den besten der Welt. Während wir uns um bessere Panzerabwehrmodelle bemühen, sollten wir auch unsere Linienartillerie weiter verbessern."
hiddentech_ita_art_effect:5	"Ermöglicht §HAccurate Artillerie§!\n§HMedium Artillerie§!\n Soft Attack: §G+5%§!\n Zuverlässigkeit: §G+5%§!\n Moral: §G+10%§!\n \n§HLeichte Artillerie§!\n Weicher Angriff: §G+5%§!\n Zuverlässigkeit: §G+5%§!\n Moral: §G+10%§!\n \n§H-Bergartillerie§!\n Weicher Angriff: §G+5%§!\n Zuverlässigkeit: §G+5%§!\n Moral: §G+10%§!\n"
ITA_defend_desc:5	"Es ist an der Zeit, einige Verteidigungsanlagen um schwieriger zu verteidigende Gebiete, wie Inseln und Kolonien, vorzubereiten."
ITA_ilva_desc:5	"Die große Krise hat auch die großen Industrien hart getroffen. Der Duce hat die ILVA vor dem Konkurs bewahrt. Hat er das aus eigener Tasche bezahlt?"
ITA_iri:5	"IRI"
ITA_iri_desc:5	"1937 machte die Regierung das IRI zu einem ständigen Institut für die Entwicklung der italienischen Industrie."
ITA_fight_the_burocracy:5	"Bürokratie"
ITA_fight_the_burocracy_desc:5	"Der Staat ist überall und wir müssen alles im Auge behalten."
ITA_Increase_research_founding:5	"£tech_mod Universität von Triest"
ITA_Increase_research_founding_desc:5	"Am 19.09.1938 weiht der Duce die neue Universität in Triest ein."
ITA_sea_warfare:5	"Battaglia Navale"
ITA_sea_warfare_desc:5	"Colpito e affondato!"
ITA_ciclone:5	"Ciclone"
ITA_ciclone_desc:5	"Flugzeugträger und Schlachtschiffe brauchen beide Zerstörer zur Unterstützung."
ITA_cl:5	"Leichte Kreuzer"
ITA_cinecitta_desc:5	"1937 wurde Cinecittà von Mussolini unter dem Motto "Kino ist die stärkste Waffe" gegründet, im ersten Jahr wurden 18 Filme produziert. Darunter auch "Il Signor Max" von Mario Camerini, der erste Film mit Vittorio de Sica."
ITA_dux_mea_lux:5	"Dux Mea Lux"
ITA_dux_mea_lux_desc:5	"Nach dem Triumph in Afrika ist Mussolini unantastbar. Niemand in der italienischen Politik kann sich ihm widersetzen."
fascism_low:	"Aufgrund einer geringeren Unterstützung als §Y80%§! für [ITA.GetRulingParty]\n wird §R[?cost]§!£political_power_texticon §YPolitical Power§! kosten"
ITA_riforma_bancaria:5	"Bankenreform"
ITA_riforma_bancaria_desc:5	"Wir müssen dem Staat eine bessere Kontrolle über das Geldsystem geben. Zumindest sagen das die Faschisten."
ITA_balilla:5	"Heldenhafte Märchen"
ITA_balilla_desc:5	"Die italienischen Kinder werden Balilla genannt, zu Ehren des jungen Märtyrers, der während der Kriege für die Einigung Italiens getötet wurde."
ITA_marconi:5	"Marconi's Vermächtnis"
ITA_marconi_desc:5	"Guglielmo Marconi erhielt 1909 den Nobelpreis für Physik für seine Studien zur drahtlosen Telegrafie. Er starb am 20. Juli 1937 in Rom. Prof. Ugo Tiberio, Leiter des RIEC, des Königlichen Instituts für Elektrokommunikation, entwickelte nach den Studien von Marconi das Radar LINCE: ein Parabolradar mit 60k Reichweite."
ITA_guidonia:5	"Versuchszentrum von Guidonia"
ITA_beretta:5	"Beretta"
ITA_enemigos:5	"Konfrontation mit Spanien"
ITA_enemigos_desc:5	"Wenn Sie nicht für uns sind, sind Sie gegen uns!"
ITA_door_to_the_atlantic:5	"Das Tor zum Atlantik"
ITA_amigos:5	"Mit Spanien befreundet"
ITA_amigos_desc:5	"Spanien ist bereits ein wichtiger Akteur im Mittelmeerraum, der uns helfen kann, unsere Position zu stärken."
ITA_join_the_party:5	"Treten Sie der Partei bei"
ITA_join_the_party_desc:5	"Der Letzte, der der Partei beitritt, zahlt das Bier!"
ITA_eyes_on_north_africa:5	"Augen auf Nordafrika"
ITA_eyes_on_north_africa_desc:5	"Wir haben uns einen Preis verdient und jetzt werden wir ihn uns holen!"
ITA_claims_on_north_africa_tt:5	"§YVichy Frankreich§! existiert und kontrolliert §YNordAfrika§!"
ITA_the_new_world_desc:5	"Wir haben die alte Welt beherrscht, jetzt ist es an der Zeit, die neue zu erobern!"
ITA_esploratori_del_deserto_desc:5	"Das ist wie Rimini, nur mit mehr Sand."
ITA_yemen:5	"Bedroht das Sultanat"
ITA_yemen_desc:5	"Mit uns vor der Tür wird das Sultanat keine andere Wahl haben, als sich unserem Imperium anzuschließen."
ITA_looking_for_oil_desc:5	"Das neue römische Imperium muss versuchen, den alten Kolonialmächten den Griff auf den Nahen Osten zu entreißen!"
ITA_backdoor_to_russia:5	"Hintertür zu Russland."
ITA_backdoor_to_russia_desc:5	"Persien war in der Antike ein furchtbarer Feind, unsere Militärberater halten es für eine leichte Beute!"
ITA_far_ally:5	"Ein Freund von Afghanistan"
ITA_far_ally_desc:5	"Der russische Bär ist riesig, wir brauchen alle Freunde, die wir bekommen können"
ITA_backstab_germany:5	"Deutschland hintergehen"
ITA_backstab_germany_desc:5	"Jetzt, wo die Deutschen mit dem Kampf gegen die Sowjets beschäftigt sind, können wir einen schnellen Sieg erringen!"
ITA_traditional_support_desc:5	""
ITA_construct_desc:5	"Impresa Pizzarotti & C. S.p.A. wurde 1910 von Gino Pizzarotti gegründet. Das Unternehmen hat seine Position im Bausektor gefestigt und ist zu einem der wichtigsten und kompetentesten Unternehmen des Landes aufgestiegen, was durch die Ausführung großer öffentlicher und infrastruktureller Arbeiten im Auftrag sowohl staatlicher Einrichtungen als auch der größten Privatunternehmen Italiens erreicht wurde. Das Unternehmen hat sich stets um eine kontinuierliche Entwicklung bei den Bauarbeiten für Straßen und Autobahnen, zivile und militärische Flughäfen, Bewässerungs- und Wasserbauarbeiten, Deiche, industrielle Infrastruktur, Eisenbahnbau und Gefängnisbau bemüht."
ITA_med_friends:5	"Freundschaft mit Syrien und Libanon"
ITA_med_friends_desc:5	"Obwohl sie unter Vichy-Herrschaft stehen, können wir die kleinen Staaten Syrien und Libanon nutzen, um unsere Ziele im Mittelmeerraum zu fördern"
ITA_med_access_desc:5	"Wenn wir den Libanon oder Syrien in zukünftigen Konflikten unterstützen wollen, müssen wir sicherstellen, dass unsere Truppen sicher landen können."
ITA_oil_friend:5	"Irakische Rebellen ausrüsten"
ITA_oil_friend_desc:5	"Am 2. Mai 1941 führten die Iraker unter Rashid Gaylani einen Staatsstreich gegen die britischen Besatzer an. Da sie für die Achse sind und einen gemeinsamen Feind haben, sollten wir ihnen in ihrem Kampf um Unabhängigkeit von der britischen Krone helfen. Wenn wir ihnen helfen, versprechen sie, uns das dringend benötigte Öl für unsere eigenen Kriegsanstrengungen zu liefern."
SOV_mortar_prototype:0	"Mörser-Prototypen"
soviet_focus:5	"Sowjetischer nationaler Fokus"
SOV_finish_five_year_plan:5	"Der 2. Fünfjahresplan"
five_year:0	"Im 2. Fünfjahresplan"
SOV_third_five_year_plan:5	"£tech_mod Beginn des 3. Fünfjahresplans"
SOV_third_five_year_plan_b_desc:5	"Der dritte Fünfjahresplan hatte eine Laufzeit von nur drei Jahren, bis 1941, als Deutschland im Zweiten Weltkrieg in die Sowjetunion einmarschierte. Je näher der Krieg rückte, desto mehr Ressourcen wurden in die Entwicklung von Rüstungsgütern, Panzern und Waffen sowie in den Bau weiterer Militärfabriken östlich des Uralgebirges gesteckt. Die ersten beiden Jahre des dritten Fünfjahresplans erwiesen sich als noch größere Enttäuschung im Hinblick auf die verkündeten Produktionsziele. Dennoch wurde in der Sowjetunion in den 1930er Jahren ein jährliches industrielles Wachstum von 12 bis 13 % erreicht. Der Plan sah vor, sich auf Konsumgüter zu konzentrieren. Die Sowjetunion investierte hauptsächlich in die Entwicklung von Waffen und baute bei Bedarf zusätzliche Militärfabriken. Bis 1952 war die Industrieproduktion fast doppelt so hoch wie 1941 ("Fünfjahrespläne"). Stalins Fünfjahrespläne trugen dazu bei, die Sowjetunion von einer unausgebildeten Bauerngesellschaft in eine fortschrittliche Industriegesellschaft zu verwandeln."
SOV_novosibirsk_desc:0	"1929 wurde in der Stadt Nowosibirsk das Unternehmen "Sibkombain" gegründet, das später in "Sibmetallstroy" umbenannt wurde. 1934-1936 begann das Werk, neben Landmaschinen auch neue Produkte herzustellen: Heizgeräte, Sortiergeräte, Ausrüstungen für den Eisenbahn- und Wassertransport, Ersatzteile für Autos und Traktoren, Textilmaschinen, kleine und mittlere Motoren.\n Es wird vorgeschlagen, die Produktionspalette um Dreh- und Schneidedrehbänke der Modelle "161" und "PL-25" zu erweitern und das Werk in "Kombinat Nr. 179" umzubenennen."
SOV_khimavtomatika:0	"£tech_mod KB Khimavtomatika"
SOV_khimavtomatika_desc:0	"Es wurde vorgeschlagen, in Woronesch ein Konstruktionsbüro einzurichten, das mit der Entwicklung von Direkteinspritzanlagen für Flugzeugtriebwerke und andere Flüssigkeitsantriebe beginnen wird."
SOV_molot_oruzhiye:0	"Vyatskiye Polyany Maschinenbaubetrieb"
SOV_molot_oruzhiye_desc:0	"Im Dorf Vyatskiye Polyany wurde auf dem Gelände einer Spulenfabrik die Errichtung eines Werks zur Herstellung von Maschinenpistolen vorgeschlagen, um den wachsenden Bedarf unserer Armee an dieser Art von persönlichen Waffen zu decken."
SOV_zlatoust:0	"Industrialisierung von Zlatoust"
SOV_motocycles_2:0	"Die Flotte ausbauen"
SOV_ural_diesel_desc:0	"Der Arbeits- und Verteidigungsrat hat den Bau eines Turbinenwerks in Swerdlowsk beschlossen. Es wird den Namen Ural-Turbinenwerk (UTZ) tragen. Dem Projekt zufolge sollte das Werk Turbinen für die Marine herstellen.\n Auf dem Gelände kann auch eine Dieselmotorenproduktion für den Bedarf der Panzerindustrie errichtet werden. Nennen wir es das Ural-Dieselmotorenwerk (UDMZ)"
SOV_stalinsk:0	"Militarisierung von Stalinsk"
SOV_izhevsk_mechanical_plant:0	"Izhevsker Rüstungsbetrieb"
SOV_izhevsk_mechanical_plant_desc:0	"Die Izhevsker Waffenfabrik ist eine der ältesten waffenproduzierenden Einrichtungen in unserem Land. Die Eröffnung des Waffenbüros der Fabrik fand am 10. Juni 1807 statt.\nDas Werk wird derzeit rekonstruiert. Eines der Hauptziele dieses groß angelegten Umbaus des Werks ist die Entwicklung einer Reihe neuer Waffentypen. Zur Entwicklung des Designs und der Produktion von Waffen wurde 1933 im Werk das "Büro für neue Designs" eröffnet. Darüber hinaus wurde die Technologie für die Herstellung von Flugzeuggeschützen, Luftkanonen und Panzerabwehrgewehren entwickelt."
SOV_IZMIRAN:0	"£tech_mod IZMIRAN"
SOV_vtz_desc:0	"Um den Bedarf der Volkswirtschaft an landwirtschaftlichen Maschinen zu decken, soll in der Stadt Wladimir ein neues Traktorenwerk gebaut werden. Der Bauplatz wurde am nördlichen Stadtrand von Wladimir gewählt, in der Gegend hinter dem alten Außenposten von Jurjewsk. In dem Werk sollen Radtraktoren der Baureihe "Universal" hergestellt werden."
SOV_ltz:0	"Traktorenwerk Lipetsk"
SOV_ltz_desc:0	"Es wird vorgeschlagen, in Lipezk ein Traktorenwerk in den Produktionsanlagen des Werks "Stankostroy" zu errichten. Parallel dazu soll eine Wohnsiedlung entstehen. Es ist geplant, dort Raupentraktoren "Kirovets-35" mit Benzinmotor herzustellen."
SOV_mtz:0	"Minsker Traktorenwerk"
SOV_pivdenmash:0	"Juschmasch"
SOV_pivdenmash_desc:0	"In Dnepropetrowsk hat das Staatliche Verteidigungskomitee (GKO) einen Beschluss über den Bau eines neuen Automobilwerks gefasst, in dem zivile Ausrüstungen - Lastwagen, Kipper und Autokräne - hergestellt werden sollen."
SOV_krasnoyarsk_combine_plant:0	"Kombinat in Krasnojarsk"
SOV_Bezhetskselmash:0	"Bezhetskselmasch"
SOV_Bezhetskselmash_desc:0	"Auf Anordnung des Rates der Volkskommissare der UdSSR sollte in der Stadt Bezhetsk, Gebiet Kalinin, mit dem Bau eines Landmaschinenwerks begonnen werden. Seine Spezialisierung war klar definiert: die Herstellung von Maschinen für die Ernte und die Erstverarbeitung von Flachs sowie von Ersatzteilen für diese Maschinen."
SOV_extra_tech_slot_early:5	"Massiver Fokus auf Bildung"
SOV_extra_tech_slot_early_desc:5	"Massive Verbesserungen im Bildungswesen: Bau von Tausenden von Schulen, Akademien und Hochschulen, Kinos, Theatern und kulturellen Einrichtungen für das einfache Volk."
SOV_buildup_steel_industry:5	"Aufbau der Stahlindustrie"
SOV_buildup_steel_industry_desc:5	"Der zweite Fünfjahresplan räumte der Schwerindustrie oberste Priorität ein, so dass die Sowjetunion nicht weit hinter Deutschland zu den wichtigsten stahlproduzierenden Ländern der Welt gehörte."
SOV_defense_of_moscow:5	"Verteidigung von Moskau"
SOV_evac_capital:0	"Evakuieren Sie die Hauptstadt nach Kuybyschew"
SOV_infrastructure_effort:5	"Bemühung um Infrastruktur"
SOV_specialized_defense_industry:5	"Spezialisierte Verteidigungsindustrie"
SOV_specialized_defense_industry_desc:5	"In der UdSSR wurde die Verteidigungsindustrie als eine Reihe separater und miteinander verbundener Arten der militärischen Produktion in den 1920er Jahren ins Leben gerufen. Vor dem Hintergrund der ständig wachsenden internationalen Spannungen ist es wichtig, den Sektor der Verteidigungsindustrie weiter zu entwickeln, um die Kampfkraft unserer Armee zu gewährleisten."
SOV_ivankovo:0	"Iwankowskoje-Stausee"
SOV_tyre_factory_desc:5	"Um die Nachfrage nach Auto- und Flugzeugreifen zu befriedigen, werden wir die Jaroslawler Reifenfabrik SK-1 ausbauen."
SOV_soviet_women_workers:5	"Weibliche Arbeitskräfte"
SOV_soviet_women_workers_desc:5	"Zwischen 800.000 und 1 Million Frauen dienten in den sowjetischen Streitkräften. Andere beteiligten sich als Partisaninnen am Widerstand. Die meisten leisteten jedoch kriegswichtige Arbeit in landwirtschaftlichen Betrieben und Fabriken sowie bei der Vorbereitung der Verteidigungsanlagen in den bedrohten Städten. Am Ende des Krieges waren vier von fünf Beschäftigten in Kolchosen Frauen, und der Anteil der Frauen im öffentlichen Dienst stieg von zwei Fünfteln vor dem Krieg auf fast drei Fünftel im Jahr 1944."
SOV_light_weapons:0	"Leichte Waffen"
SOV_expand_gaz:0	"Erweitern Sie Gorkovsky Avtomobilny Zavod"
SOV_expand_gaz_desc:0	"GAZ ist das größte LKW-Werk in der UdSSR. Am 17. April 1935 lief das einhunderttausendste Auto vom Fließband des Werks. Es handelte sich um einen Pkw GAZ-A.\n Es ist notwendig, die Produktion weiter auszubauen. Es ist geplant, einen Geländewagen GAZ-64 mit Allradantrieb für die Armee, eine 5-sitzige Limousine GAZ-M-1 sowie neue Typen von Armee- und Zivilfahrzeugen herzustellen."
SOV_collectivist_propaganda:5	"Kollektivistische Propaganda"
SOV_production_effort_desc:5	"Wenn man Schlepper bauen kann, kann man auch Panzer bauen! Wir dürfen nicht zulassen, dass unsere militärische Produktionskapazität hinterherhinkt."
SOV_militarized_schools:5	"Militarisierte Schulen"
SOV_militarized_schools_desc:5	"Sowjetische Kinder sollten in militärischer Disziplin und sozialistischen Tugenden wie Selbstaufopferung und Solidarität unterrichtet werden. Junge Köpfe sind leichter zu formen."
SOV_workers_culture:5	"Arbeiterkultur"
SOV_workers_culture_desc:5	"Der Sozialismus ist nicht nur ein Wirtschaftssystem und der Marxismus nicht nur eine Wissenschaft; wir müssen die Struktur der sowjetischen Gesellschaft umgestalten, um alle Überbleibsel bürgerlicher Sitten und Traditionen auszurotten."
SOV_new_soviet_man:5	"Der neue Sowjetmensch"
SOV_progress_cult:5	"Fortschrittskult"
SOV_socialist_science_desc:5	"Die Welt ist, wie der Geist, in ständiger Bewegung. Die Natur befindet sich in einem Zustand des ständigen Fortschritts, ja sogar der Revolution. Die Prinzipien des dialektischen Materialismus lassen sich sowohl auf die Natur- als auch auf die Sozialwissenschaften anwenden..."
SOV_art_affairs_committee:5	"Staatliches Komitee für die Künste"
SOV_aviation_cult:5	"Luftfahrtkult"
SOV_aviation_cult_desc:5	"Die Sowjetunion wird die Welt mit erstaunlichen Leistungen in der Luftfahrt beeindrucken. Unsere heldenhaften Piloten sind die Ritter der bolschewistischen Kultur und des Fortschritts und demonstrieren unsere technische Beherrschung der Natur. Wie weit haben wir es seit den Tagen des Zaren gebracht!"
SOV_develop_cas:5	"Konzentration auf die Luftnahunterstützung"
SOV_women_pilots_desc:5	"Genossin Raskowa, unsere heldenhafte Langstreckenfliegerin, sollte die Erlaubnis erhalten, im Rahmen ihres Programms Luftfahrtgruppe 122 einige reine Frauenfliegerregimenter zu bilden."
SOV_women_snipers:5	"Scharfschützinnen"
SOV_women_snipers_desc:5	"Etwa 8,7 Meilen von Moskau entfernt, in Wischnjakow, wurde im März 1942 die Zentrale Frauenschule für Scharfschützenausbildung gegründet. Rekrutiert wurden Frauen im Alter von 18 bis 26 Jahren, die körperlich in der Lage waren, eine mindestens siebenjährige Ausbildung zu absolvieren. Bis zum Ende des Zweiten Weltkriegs hatten rund 1.885 Scharfschützen und Ausbilder die Schule absolviert. Frauen wurden für die Scharfschützenpositionen in Betracht gezogen, da sie den Stress und die Kälte viel besser ertragen konnten und geduldiger waren - eine Fähigkeit, die von größter Bedeutung war, da sie still liegen und manchmal stundenlang auf einen perfekten Schuss warten mussten."
SOV_night_witches_tt:5	"Bei Ausbruch eines größeren Krieges wird das 588. Nachtbomberregiment wird in Moskau aktiv."
SOV_socialist_realism_desc:5	"Alle Kunstwerke in der Sowjetunion müssen danach streben, das Volk über die Ziele und den Sinn des Kommunismus zu erziehen, indem sie das Proletariat in realistischen und typischen Szenen des Alltagslebens darstellen. Die sowjetischen Künstler sind die Ingenieure der Seelen!"
SOV_conduct_Census:5	"Durchführung der Volkszählung von 1937"
SOV_conduct_Census_II_desc:5	"Alle zwei Jahre werden wir eine Volkszählung durchführen, um festzustellen, wie es um unsere Bevölkerung bestellt ist. Auch das ist eine gute Möglichkeit, den Überblick über die Menschen zu behalten... Aber seien Sie vorsichtig, nur Informationen zu sammeln, die unserem Führer gefallen!"
SOV_biysk_ti_desc:0	"Wir haben einen akuten Lehrermangel, der die Bildung in ländlichen Gebieten behindert.\n Um hier Abhilfe zu schaffen, hat der Ministerrat der RSFSR den Beschluss Nr. 318 "Über die Reorganisation der pädagogischen Schulen des Volkskommissariats für Bildung der RSFSR" verabschiedet, der die Umwandlung von 48 pädagogischen Schulen in zweijährige pädagogische Institute vorsieht. Das Biysker Institut wird als eines dieser Institute dienen."
SOV_gusinoozyorsk:0	"Kraftwerk Gusinoozyorsk"
SOV_gusinoozyorsk_desc:0	"Das Kraftwerk Gusinoozyorsk wird das größte Kondensationskraftwerk in Transbaikalien und eines der größten Unternehmen in Burjatien sein. Das Kraftwerk versorgt Verbraucher in Burjatien und den angrenzenden Regionen mit Strom sowie die Stadt Gusinoozyorsk mit Wärmeenergie. Der Hauptbrennstoff für das Kraftwerk wird Braunkohle aus dem Tagebau Okino-Klyuchevsky und der Lagerstätte Gusinoozyorskoye sein. Der Startbrennstoff ist Heizöl."
SOV_ventprom:0	"Artjomowsky-Maschinenbauwerk"
SOV_ventprom_desc:0	"In der Stadt Artjomowskij, Gebiet Swerdlowsk, wurde die Errichtung eines Maschinenbaubetriebs vorgeschlagen, der den Bedarf der Bergbauindustrie decken und Bergbauausrüstung sowie Ersatzteile für Bohranlagen herstellen soll."
SOV_gold_baley:0	"Goldabbau in Baley"
SOV_seltso_rail_forge_desc:0	"Das Brjansker Maschinenbaubetrieb (auch bekannt als Red Profintern) ist der älteste Hersteller von Transportmitteln in Russland. Das 1873 gegründete Werk stellt heute Schienen, gepanzerte Züge, 19 % der Dampflokomotiven des Landes und 60 % der schweren Waggons her. Im laufenden Fünfjahresplan ist eine Verdoppelung der Produktion geplant, insbesondere eine Steigerung der Produktion neuer Lokomotiven der Baureihe SO und eine Verbesserung der Konstruktion dieser Maschinen."
SOV_SeAZ:0	"SMZ"
SOV_SeAZ_desc:0	"Der Wirtschaftsrat beim Rat der Volkskommissare der UdSSR schlägt die Gründung des Motorradwerks Serpuchow (SMZ) vor, um die Produktion von Motorrädern mit kleinem Hubraum zu organisieren und den wachsenden Bedarf der Bevölkerung an Fahrzeugen zu decken."
SOV_zelectroapparat_desc:0	"Es wurde vorgeschlagen, ein großes elektrotechnisches Werk in Taschkent zu errichten. Es wird in der Lage sein, verschiedene Arten von Schaltern, Steckdosen, Klemmensätzen, die für die elektrische Ausrüstung von Maschinen benötigt werden, Paketschalter und Schalter, Sicherungen zu produzieren.\ns sind auch große Werksdesign- und Technologieabteilungen geplant - sie werden in der Lage sein, vor Ort ganz neue Arten von elektrischen Produkten zu schaffen."
SOV_bogoslovsk:0	"Bogoslovsker Aluminiumhüttenwerk"
SOV_bogoslovsk_desc:0	""
SOV_art_museum:0	"Staatliche Kunstgalerie Minsk"
SOV_art_museum_desc:0	"Gemäß dem Regierungsdekret des Rates der Volkskommissare der BSSR soll in Minsk eine staatliche Kunstgalerie eingerichtet werden. Wir werden sie in fünfzehn Sälen des Gebäudes der Höheren Kommunistischen Landwirtschaftsschule unterbringen.\neben den Abteilungen für Malerei, Bildhauerei und Grafik sollte in der Galerie durch einen besonderen Erlass eine Abteilung für Kunstindustrie eingerichtet werden. Die Leitung der Galerie kann dem berühmten Keramikkünstler Nikolai Mikholap anvertraut werden."
SOV_officer_house:0	"Haus der Roten Armee und Flotte"
SOV_officer_house_desc:0	"1934 wurde der begabte Architekt Joseph Langbard mit der Planung des Zentrums der Armeekultur der BSSR beauftragt. Der Komplex sollte nicht nur ein Erholungs- und Unterhaltungszentrum für das Kommandopersonal werden, sondern auch ein Ort zur Auffrischung und Vertiefung der Kenntnisse - eine echte Akademie für den Befehlshaber der Roten Armee. Zu diesem Zweck wurden dort pädagogische und wissenschaftliche Räume geschaffen, in denen viele militärische Disziplinen gelehrt wurden."
SOV_improve_railway_desc:5	"Unser erster Fünfjahresplan erwies sich als zu erfolgreich. Der massive Ausbau der Schwerindustrie hat die Sowjetunion in eine viel stärkere Verteidigungsposition gebracht, aber das sowjetische Eisenbahnnetz ist auf einige kritische Engpässe gestoßen. Das Volkskommissariat für Eisenbahnwesen NKPS hat einen ehrgeizigen Plan, um diese Engpässe zu schließen und sicherzustellen, dass wir das Mutterland verteidigen können."
SOV_transpolar_flights:5	"Transpolarflüge"
SOV_ocean_going_navy_desc:5	"Obwohl die Union ein größeres Landgebiet als jede andere Nation auf dem Planeten umfasst, werden die Ozeane der Welt erst noch von unseren Schiffen beherrscht werden. Schwer gepanzerte Schlachtschiffe werden Teil unserer künftigen Hochseeflotte sein."
SOV_peoples_commissariat_desc:5	"Das Volkskommissariat für Verteidigungsindustrie der UdSSR wird ein Ministerium für Schwerindustrie sein, das sich auf unsere militärischen Industrieprojekte konzentriert. Langfristig kann die Arbeitsbelastung weitere Unterteilungen des Ministeriums erforderlich machen."
SOV_anti_fascist_diplomacy:5	"Antifaschistische Diplomatie"
SOV_anti_fascist_diplomacy_desc:5	"Obwohl alle westlichen Regime repressiv und korrupt sind, gibt es keine schlimmeren als diejenigen, die vorgeben, fortschrittlich oder sogar sozialistisch zu sein! Durch die Förderung eines solchen falschen Bewusstseins unter dem Proletariat versuchen sie, die Revolution zu verzögern und die Arbeiter in ständiger Knechtschaft zu halten."
SOV_operation_zet:5	"Unternehmen Zet"
SOV_operation_zet_desc:5	"Obwohl die Kuomintang reaktionär ist, scheint es unwahrscheinlich, dass Mao und seine Art von Kommunismus in China die Oberhand gewinnen werden. Wir sollten uns bemühen, die Beziehungen zu Chiang zu verbessern; das lächerlich anachronistische Kaiserreich Japan wird ohnehin bald zusammenbrechen."
SOV_annex_tannu_tuva:5	"Anhang Tannu Tuva"
SOV_improve_stalin_line_desc:5	"Unsere Westgrenze muss besser vor faschistischen Angriffen geschützt werden. Die Stalin-Linie sollte ausgebaut und modernisiert werden."
SOV_far_east_fortification_forts_1:5	"Fügen Sie §Y6 Landforts§! an der japanischen Grenze hinzu.\n"
SOV_far_east_fortification_forts_2:5	"Fügen Sie §Y8 Landforts§! an der japanischen Grenze hinzu.\n"
SOV_fortify_brest_fortress:5	"Festung Brest-Litowsk"
SOV_fortify_brest_fortress_desc:5	"Die Zitadelle war von 3 Festungen als Brückenköpfe umgeben, die aus Flussarmen des Mukhavets und Gräben bestanden, die durch 10 m hohe Erdwälle mit Kasematten aus rotem Backstein im Inneren befestigt waren. Die 3 Festungsanlagen wurden nach zwei Städten benannt: Kobrin in Weißrussland, Terespol in Polen und Volyn, eine Region in der Ukraine. Die Festung Kobrin war die größte der Festung, sie befand sich im nordöstlichen Teil, hatte die Form eines Hufeisens und verfügte über 4 Festungsvorhänge, 3 freistehende Ravelins und eine Lünette im westlichen Teil, das Ostfort und das Westfort. Die Festung Terespol war der westliche Brückenkopf mit 4 freistehenden Lünetten. Die Festung Volyn war der südöstliche Brückenkopf mit 2 Festungsvorhängen und 2 freistehenden Lünetten."
SOV_expand_the_stalin_line:0	"Die Stalin-Linie ausbauen"
SOV_expand_the_molotov_line_desc:0	"Angesichts der wachsenden Spannungen in Europa wurde ein Plan zum Ausbau der Molotow-Linie ausgearbeitet."
SOV_Improve_the_molotov_line:0	"Verbesserung der Molotow-Linie"
SOV_Improve_the_molotov_line_desc:0	"Die Stärkung der Offensivfähigkeiten potenzieller Gegner machte einen Plan zur Modernisierung und Verstärkung der Molotow-Linie erforderlich."
SOV_directive:0	"Richtlinie Nr.154-16ss"
SOV_new_officer:0	"Neue Kommandeure"
SOV_new_officer_TT:0	"Wir erhalten 8 neue Generäle und 11 Admiräle"
tractor_made_tt:0	"Produziert wurde mindestens der §Y[?temp]§! £tractor \n"
SOV_armoured_doctrine:0	"Gepanzerte Doktrin"
SOV_Tank_Corps_focus:5	"Panzerkorps"
SOV_Tank_Corps_desc:5	"Bildung von Panzerkorps zur Bekämpfung der deutschen Panzer"
SOV_Tank_Corps_wave_two_focus:5	"Panzerkorps Welle II"
SOV_Tank_Corps_wave_two_desc:5	"Aufstellen weiterer Panzerkorps"
SOV_Tank_Corps_wave_three_focus:5	"Panzerkorps Welle III"
SOV_Mechanised_Corps_II_desc:5	"Erhalten Sie eine bessere Vorlage für Mechanisierte Korps und fügen Sie weitere Einheiten hinzu"
SOV_Tank_Corps_wave_five_focus:5	"Panzerabwehrkanonen"
SOV_Tank_Corps_wave_five_desc:5	"Verbessern Sie das Panzerkorps um Panzerabwehrkanonen und stellen Sie zwei weitere Korps auf."
SOV_Tank_Corps_upgrade_one_desc:5	"Ersetzen Sie Panzerabwehrkanonen durch mobilere Einheiten SU-76, SU-122, SU-152"
SOV_Tank_Corps_upgrade_two_focus:5	"Nur mittlere Panzer"
SOV_Tank_Corps_upgrade_two_desc:5	"Entfernen Sie leichte Panzer aus der Aufstellung und ersetzen Sie sie durch mehr T-34"
SOV_soviet_naval_research:5	"£tech_mod Sowjetische Marineforschung"
SOV_soviet_naval_research_desc:5	"Wenn wir wollen, dass unsere Flotte mit denen anderer Mächte vergleichbar ist, müssen wir neue Technologien für unsere Schiffe entwickeln."
SOV_anti_colonialist_rebels:5	"Die Komintern"
SOV_anti_colonialist_rebels_desc:5	"Da das kapitalistische System in die Phase des endgültigen Zusammenbruchs eintritt, muss die richtige Haltung aller kommunistischen Parteien eine äußerst aggressive, kämpferische, ultralinke Linie sein. Wir fordern die kommunistischen Parteien der Welt auf, ihre Energien der Zerstörung der gemäßigten Linken zu widmen."
SOV_southern_thrust_desc:5	"Die Annektierung des Irans und des Iraks würde sowohl ihre riesigen Ölreserven für die Revolution sichern als auch direkten Druck auf die britischen Imperialisten in Ägypten und Indien ausüben."
SOV_pan_slavic_rhetoric:5	"Panslawische Rhetorik"
SOV_claims_on_baltic_desc:5	"Peter der Große hatte Recht, als er den Zugang zu den Häfen im Westen suchte. Die baltischen Staaten, die nach der Revolution verloren gegangen sind, sollten durch sowjetische Truppen geschützt werden."
SOV_baltic_security:5	"Sicherheit der Ostsee"
SOV_baltic_security_desc:5	"Die Ostsee ist unser Vorgarten und muss um jeden Preis geschützt werden. Karelien muss beschlagnahmt werden, um Leningrad eine sichere Pufferzone zu geben, und wir müssen dafür sorgen, dass in Skandinavien freundliche Regierungen herrschen."
FIN_not_isolated:0	"Bei der derzeitigen Weltlage wird der §Y[FIN.Getname]§! wahrscheinlich mächtige Verbündete suchen, wir müssen sicherstellen, dass sie isoliert sind."
SOV_north_pole_1:0	"Nordpol 1"
SOV_north_pole_1_desc:0	"Otto Yulievich Schmidt, der Leiter der sowjetischen Arktis-Expedition, schlug eine Luftexpedition zum Nordpol und die Errichtung der ersten Driftstation der Welt in diesem Gebiet vor. Der Plan sieht vor, eine Zwischenbasis auf der Inselgruppe Novaya Zemlya zu errichten, die Ausrüstung und das Personal auf dem Luftweg zum Pol zu bringen und sie dann mit einem Eisbrecherschiff zu evakuieren. Die Leitung der Station, die den Namen "Nordpol-1" trägt, kann dem berühmten Polarforscher Iwan Dmitrijewitsch Papanin anvertraut werden."
SOV_central_tv:0	"Das sowjetische Zentralfernsehen"
SOV_amurlag_desc:0	"Es wurde vorgeschlagen, Bamlag aufzulösen und Amurlag (Amur-Eisenbahn-Arbeitslager) auf seiner Struktur als unabhängige Einheit hauptsächlich für den Eisenbahnbau zu schaffen.\nDie Verwaltung von Amurlag wird in der Stadt Svobodny angesiedelt sein. In der operativen Führung wird er der Eisenbahnbaudirektion der Fernöstlichen Hauptdirektion für Strafarbeitslager des NKWD unterstellt sein.\n Die Höchstzahl der Häftlinge kann gleichzeitig über 125.000 betragen."
SOV_more:0	"Juschnaja-Totschka-Werft"
SOV_more_desc:0	"Die Regierung der UdSSR erlässt einen Erlass über die Errichtung der Werft "Juschnaja Tochka" östlich von Feodosia. Es ist geplant, mit dem Bau in der Nähe der kleinen Dörfer Dalnie Kamyshi und Khafuz zu beginnen und sowohl die Werft selbst als auch das Dorf für die Arbeiter zu errichten."
SOV_zalyv_desc:0	"Anfang der 1930er Jahre beschloss die Regierung der UdSSR, neue Fabriken am Schwarzen Meer zu errichten, um die Schiffbaubasis der Marine zu erweitern. Eine Kommission wurde eingesetzt, um einen geeigneten Standort für das künftige Werk in Kertsch auszuwählen. Die Bucht der Meerenge von Kertsch, die vor den östlichen Winden geschützt ist, war der perfekte Ort. Im Mai 1934 wurde der Befehl zum Bau des Schiffsreparatur- und Schiffbauwerks des Volkskommissariats für Wassertransport unterzeichnet."
SOV_support_mao:5	"Unterstützung für Mao und das kommunistische China"
SOV_support_mao_desc:5	"Wir sollten uns darauf konzentrieren, die fortschrittlichen chinesischen Kräfte unter der Führung von Mao Zedong, unseren engsten ideologischen Verbündeten in China, zu unterstützen."
SOV_Trotsky_dead_desc:5	"Nach Trotzkis Tod müssen wir entscheiden, wie wir die weltweite Revolution am besten fortsetzen."
SOV_Trotskyites_unite:5	"Trotzkisten vereinigen sich"
SOV_Trotskyites_unite_desc:5	"Wir sind viele"
SOV_nkvd_troika:5	"NKVD-Troika"
SOV_nkvd_restored:0	"NKVD wiederherstellen"
SOV_nkvd_restored_desc:0	""
SOV_kulaks_collectivisation:5	"Die Kulaksche Kollektivierung"
assassinate_trotsky_TT:0	"Gewährt Zugang zu einer §CSpionageoperationen§!, die auf §Y[MEX.GetNameDef]§! verwendet werden kann!"
SOV_rehabilitated_military:5	"Rehabilitiertes Militär"
SOV_rehabilitated_military_desc:5	"Nachdem das Offizierskorps endlich vom Makel des Trotzkismus befreit ist, könnte es möglich sein, dem Militär wieder eine gewisse Freiheit von politischer Einmischung zu gewähren."
SOV_military_reorganization:5	"Militärische Reorganisation"
SOV_military_reorganization_desc:5	"Die Säuberung hat das Militär nicht in einem guten Zustand zurückgelassen. Die neue Führung ist grün und ineffektiv, und es wurde nicht an der Entwicklung unserer Doktrinen gearbeitet. Wir müssen diese Situation sofort korrigieren!"
maintain_army_xp_TT:0	"§YIhr müsst mindestens 100 £army_experience haben, damit dieser Schwerpunkt weiter fortschreiten kann§!\n"
SOV_nkvd_divisions:5	"NKVD-Abteilungen"
SOV_lessons_of_war_desc:5	"Mit den in begrenzten Kriegen gesammelten Erfahrungen sollten wir in der Lage sein, einige Durchbrüche in der gepanzerten Kriegsführung zu erzielen und vielleicht sogar endlich das dezimierte Offizierskorps auf Vordermann zu bringen!"
SOV_smersh:5	"SMERSH"
SOV_smersh_tt:5	"§YDie Gefahr eines Staatsstreichs wird dadurch beseitigt.§!"
SOV_partisan_suppression:5	"Unterdrückung von Partisanen"
SOV_partisan_suppression_desc:5	"SMERSH sollte ausgebaut werden, um besser in der Lage zu sein, alle Formen der Partisanentätigkeit in den besetzten Gebieten zu infiltrieren und rücksichtslos zu unterdrücken."
SOV_has_not_officers_purged_tt:5	"Hat keinen nationalen Geist §YOfficers Purged§!"
SOV_war_with_japan_desc:5	"Es scheint, dass die Japaner nicht vorhaben, sich zurückzuziehen. Die einzige wirksame Abschreckung wird der Krieg sein. Sie werden es bereuen, sich unseren Forderungen widersetzt zu haben, wenn die Rote Armee sie niedertrampelt."
border_strength_war_tt:0	"Unsere Grenzstärke ist höher als 8, derzeit bei [?SOV.border_strength]"
SOV_claim_on_the_straits:5	"Beansprucht die Meerengen"
SOV_ultimatum_to_greece:5	"Ultimatum an Griechenland"
SOV_ultimatum_to_greece_desc:5	"Die Ägäischen Inseln sind der letzte strategische Punkt, den wir brauchen, um sicherzustellen, dass die Rote Flotte frei operieren kann. Die Griechen werden von allen Seiten unter Druck gesetzt und werden höchstwahrscheinlich ein kleines Gebiet aufgeben, um einen totalen Krieg zu vermeiden."
SOV_research_city_experiment:5	"Experiment Forschungsstadt"
SOV_war_since_purge:5	"Seit dem Abschluss der Großen Säuberung hat es einen Krieg gegeben."
SOV_fortify_molotov_line:5	"Bau der Molotow-Linie"
SOV_fortify_molotov_line_desc:5	"Unsere neuen Territorien müssen ebenfalls geschützt werden. Befestigt die Schlüsselbereiche der neuen Molotow-Linie."
SOV_Moiseyev_Dance_troupe:5	"Igor Moiseyev Dance Troupe"
SOV_Moiseyev_Dance_troupe_desc:5	"Hat Stalin gelacht?...Seit Anfang der 1930er Jahre führte Moiseyev akrobatische Paraden auf dem Roten Platz auf und kam schließlich auf die Idee, das Theater der Volkskunst zu gründen. 1936 übertrug ihm Wjatscheslaw Molotow die Leitung der neuen Tanztruppe, die seither als Moissejew-Ballett bekannt ist. Unter den etwa 200 Tänzen, die er für seine Kompanie schuf, stellten einige auf humorvolle Weise das Fußballspiel und den Guerillakrieg dar. Nach einem Besuch in Weißrussland choreografierte er einen weißrussischen Volkstanz Bulba ("Kartoffel"), der im Laufe der Jahre tatsächlich zu einem weißrussischen Volkstanz wurde. Moiseyevs Arbeit wurde vor allem für das Gleichgewicht zwischen authentischem Volkstanz und theatralischer Effektivität bewundert."
SOV_stakhanovite_movement:5	"Stachanow-Bewegung"
SOV_zenit_desc:0	"Um die Bürger zu vereinen, die sich mit Körperkultur, Sport und Tourismus beschäftigen, um die Probleme der Entwicklung der Massenkörperkultur, des Sports und des Tourismus zu lösen und um Abzeichen "Bereit für die Arbeit und die Verteidigung der UdSSR" auszubilden, ist es notwendig, große Sportorganisationen auf sektoraler Basis zu gründen - eine von ihnen ist "Zenit", eine freiwillige allunionsweite Sportgesellschaft, die Mannschaften von Amateursportlern aus einer Reihe von Branchen der Verteidigungsindustrie vereint."
SOV_soyuzmultfilm:0	"Sojusmultfilm"
SOV_soyuzmultfilm_desc:0	"Auf persönlichen Beschluss von J.V. Stalin ist es notwendig, ein Kinderkinostudio einzurichten. Nennen wir es 'Sojusmultfilm' und vereinen wir unter seiner Leitung die kleinen Animationsteams 'Sovkino', 'Mezhrabpomfilm' und 'Mosfilm'. Die gesamte Produktion sollte nach der allgemeinen Technologie des 'Zelluloidförderers' organisiert werden. Ein guter Start in den Anfangsjahren des Studios können Kurzfilme für Kinder sein, die auf Tierfiguren im Disney-Stil basieren."
SOV_novo_spaask_desc:0	"Das Zementwerk Glukhoozersk wurde im Juli 1897 in Betrieb genommen und ist eines der ältesten des Landes.\n Bis 1914 waren in der Umgebung von Volsk vier Zementwerke in Betrieb, die insgesamt etwa 14 % der Zementproduktion im Russischen Reich ausmachten.\n In der Sowjetzeit, nach der Verstaatlichung, wurde das Werk in Glukhoozersk umbenannt - es heißt jetzt 'Bolschewistisches Zementwerk'. Es ist an der Zeit, es zu modernisieren und zu erweitern, um unseren ständig wachsenden Baustoffbedarf zu decken."
SOV_modernise_dynamo:0	"Dynamo modernisieren"
SOV_modernise_dynamo_desc:0	"Dieses Werk wurde am 12. Mai 1897 in Moskau gegründet und trug zunächst den Namen "Zentrale Elektrizitätsgesellschaft". Seinen modernen Namen Dynamo erhielt das Unternehmen 1913. Nach der Oktoberrevolution wurde das Werk verstaatlicht. 1932 stellte das Werk die ersten Traktionsmotoren für Elektrolokomotiven in der UdSSR her, und am 6. November wurde die erste Elektrolokomotive sowjetischer Bauart, die VL19, gebaut.\nDie kontinuierliche Weiterentwicklung dieses fortschrittlichen Werks ist eine Priorität für die elektromechanische Industrie."
SOV_ufimsky_refinery_desc:0	"Nach der Entdeckung der Ishinbay-Ölfelder im Wolgagebiet in den 1920-30er Jahren entstanden in diesem Gebiet die ersten Öl-Destillationsanlagen. So wurde 1935 im Rahmen des zweiten Fünfjahresplans mit dem Bau der Ufa-Ölraffinerie begonnen.\n Innerhalb von 6 Jahren sollen drei Stufen für die Herstellung von Straight-Run-Benzin in Betrieb genommen werden. Die Fertigstellung des Baus ist wichtig für die Versorgung unserer ständig wachsenden Industrie mit Treibstoff und die Erschließung der natürlichen Ressourcen Baschkortostans."
SOV_2nd_baku:0	"Das 2. Baku"
SOV_2nd_baku_desc:0	"Das neue Erdölgebiet im Osten, das "Zweite Baku", wird in der Brennstoffbilanz unseres Landes eine herausragende Stellung einnehmen. Noch vor einigen Jahren wurde in Geologenkreisen über seine Ölförderkapazität gestritten, doch neue Entdeckungen zeigen ein enormes Potenzial. Das Land scheut keine Mühen und Ressourcen, um fast im Zentrum des Landes eine weitere mächtige Ölbasis zu schaffen, und zwar in einem Tempo, das das alte Baku nicht kennt. Die enorme politische, wirtschaftliche und verteidigungspolitische Bedeutung dieser Tatsache kann kaum überschätzt werden."
SOV_ural_coal_mines:0	"Kohleabbau im Ural"
SOV_kandalakskii_alumi:0	"Aluminiumwerk Kandalakskii"
SOV_kandalakskii_alumi_desc:0	"In der Nähe des eisfreien Hafens von Murmansk soll mit dem Bau eines Nichteisenmetallurgiewerks begonnen werden, um die natürlichen Ressourcen des sowjetischen Nordens in Verbindung mit dem großen Bedarf des Landes an Aluminium, auch für die Rüstungsindustrie, zu erschließen.\n Es wird die einzige Aluminiumhütte der Welt sein, die jenseits des Polarkreises liegt."
SOV_klimovsk_plant:0	"Werk Klimowsk"
SOV_rockets:0	"212 Rakete"
SOV_rockets_desc:0	""
SOV_alternate_materials:0	"Alternative Materialien"
SOV_alternate_materials_desc:0	""
SOV_Uralvagonzavod:0	"Uralwagonsawod"
SOV_Uralvagonzavod_desc:0	"Das Werk wurde von dreitausend sowjetischen Ingenieuren unter der Leitung von A. W. Iwankow entworfen, der die Waggonproduktion in Amerika studiert hatte. Es wurde das Prinzip des direkten Flusses umgesetzt: mehrere Werkstätten, die durch einen technologischen Prozess verbunden sind, werden als eine einzige Förderlinie gebaut. Dies war eines der ersten Projekte eines großen Maschinenbauunternehmens mit kontinuierlicher Produktion, das von sowjetischen Ingenieuren ohne die Beteiligung ausländischer Spezialisten durchgeführt wurde. E. Dzerzhinskogo."
SOV_ordzhoni-kidze_zinc:0	"Zinkwerk Ordzhonikidse"
SOV_konstantinovka_zinc_desc:0	"In der Stadt Konstantinovka wurde während des ersten Fünfjahresplans ein mit modernsten Anlagen ausgestattetes Zinkwerk fertiggestellt. Das Werk wurde am 7. November 1930 in Betrieb genommen - eineinhalb Jahre früher als geplant. Um den wachsenden Bedarf der Region an Zink zu decken, ist es notwendig, die Produktion dieser Anlage zu erweitern."
SOV_the_east_threat:0	"Die Bedrohung durch den Osten"
SOV_far_east_supply:0	"Versorgung der sibirischen Streitkräfte"
SOV_far_east_supply_desc:0	"Die militärische Infrastruktur der transuralen Militärbezirke entspricht nicht den modernen Anforderungen für die Durchführung militärischer Operationen und muss daher modernisiert werden."
SOV_supply_chi:0	"Nachschub für China"
SOV_aid_tan_desc:0	"Tuwa ist ein kleiner Staat, der hauptsächlich von Menschen bewohnt wird, die eine veraltete, nomadische Lebensweise führen. Es liegt in unserem Interesse, die tuwinische Industrie zu entwickeln und den Bewohnern zu einem modernen Lebensstil zu verhelfen."
SOV_the_west_threat:0	"Die westliche Bedrohung"
SOV_the_west_threat_desc:0	"Mit der Machtübernahme Adolf Hitlers im Jahr 1933 hat sich Deutschland auf den Weg gemacht, die wichtigste reaktionäre Kraft des internationalen Militarismus zu werden.\nDas Buch "Mein Kampf" des Führers beschreibt das Konzept "Lebensraum im Osten", das die deutsche territoriale Expansion nach Mittel- und Osteuropa rechtfertigt. Die UdSSR wird unweigerlich zum Haupthindernis für die Umsetzung dieses Konzepts werden.\nSo ist es notwendig, sich auf einen Zusammenstoß mit den deutschen Faschisten vorzubereiten."
SOV_puppet_baltic:0	"Druck auf die baltischen Staaten"
SOV_annex_lit:0	"Willkommen in Litauen"
SOV_annex_lat_desc:0	"Die neue lettische Linksregierung unter der Führung von August Kirchenstein organisierte Parlamentswahlen, bei denen einstimmig für den Beitritt Lettlands zur UdSSR gestimmt wurde.\nWillkommen in der Union, Brüder."
SOV_annex_est:0	"Willkommen Estland"
SOV_invade_baltic:0	"Baltische Aggression"
SOV_invade_baltic_desc:0	"Wir haben keine Zeit für diplomatische Annäherungsversuche im Baltikum. Die militärische Lösung wird die schnellste sein."
SOV_almaty_zoo:0	"Der Zoo von Almaty"
SOV_almaty_zoo_desc:0	"Im Januar 1935 beschloss der Rat der Volkskommissare der Kasachischen SSR die Errichtung eines Zoos in Alma-Ata. Die Wahl eines Ortes für den Bau des ersten Zoos in der Republik und seine Einrichtung wurde von einem erfahrenen Jäger und ausgezeichneten Kenner der Semiretschye, Murzachan Tolebajew, durchgeführt. Für den Bau des Zoos wählte Tolebajew den östlichen Rand des Gorki-Parks für Kultur und Freizeit. Auf Beschluss des Stadtrats von Almaty wurde ein 46 Hektar großes Grundstück am rechten Ufer des Flusses Kazachka in einem Obstgarten für den Bau zugewiesen. Das zugewiesene Gelände ermöglichte es aufgrund seines Reliefs, es ohne hohe Kosten für den vorgesehenen Zweck einzurichten."
SOV_paris_37_world:0	"Vorbereitungen für die Pariser Weltausstellung"
SOV_paris_37_world_desc:0	"Um der Welt die Errungenschaften der sowjetischen Wissenschaft und Technik zu demonstrieren, müssen wir auf der Pariser Weltausstellung eine beeindruckende Exposition schaffen. Das Projekt des UdSSR-Pavillons von Boris Michailowitsch Iofan sieht ein Gebäude für die Unterbringung der Exposition vor, das mit Marmor aus Samarkand verkleidet ist. Der Eingang des Pavillons wird mit Flachreliefs des Bildhauers I. M. Tschaikow geschmückt: die Wappen der UdSSR und der 11 Unionsrepubliken. \nDas Symbol des sowjetischen Pavillons wird eine 24 Meter hohe Skulpturengruppe \"Arbeiter und kollektive Landfrauen\" aus Edelstahl sein, die von Vera Ivanovna Mukhina entworfen wurde und den Errungenschaften der sozialistischen Industrialisierung gewidmet ist."
SOV_technical_aid:0	"Technische Hilfe gegen die Faschisten"
SOV_spainish_lessons_desc:0	"Mit unserer Hilfe haben die fortschrittlichen Kräfte den spanischen Bürgerkrieg gewonnen. Wir standen auch den Kräften unserer wahrscheinlichen Gegner aus dem Lager der reaktionären europäischen Militaristen gegenüber.\nDie Lehren aus diesem Konflikt sollten gründlich studiert werden."
SOV_spainish_ally:0	"Der iberische Verbündete"
SOV_iron_curtain:0	"Der Eiserne Vorhang"
SOV_iron_curtain_desc:0	"Angesichts der zunehmenden Spannungen in der Welt sollten zusätzliche Maßnahmen ergriffen werden, um unser militärisches und industrielles Potenzial geheim zu halten und den Kampf gegen feindliche Spione zu verstärken."
SOV_iron_curtain_army:0	"Den Vorhang für die Armee schließen"
new_fair_TT:0	"Ein gut gebauter Pavillon wird unser weltweites Ansehen steigern und den Aufstieg von §R[Root.GetRulingIdeologyNoun]§! in Amerika fördern."
SOV_new_york_39_world:0	"Vorbereitungen für die New Yorker Weltausstellung"
SOV_new_york_39_world_desc:0	"Nach dem Erfolg der sowjetischen Exposition auf der Weltausstellung in Paris ist es notwendig, unsere Errungenschaften in Nordamerika zu demonstrieren.\nDer Autor des Pavillons ist der bewährte Architekt Boris Michailowitsch Iofan; von der Hauptskulptur \"Arbeiter mit einem Stern" - Wjatscheslaw Andrejewitsch Andrejew.\nie Ausstellung umfasst Denkmäler für W.I. Lenin und I.W. Stalin aus rosafarbenem Granit des Bildhauers S.D. Merkurow, das Projekt der U-Bahn-Station Majakowskaja (Architekt A. Duschkin, Künstler A. Deineka), eine der lebensgroßen Sektionen. Ein weiteres Exponat - ein Gemälde von Vasily Svarog \"I. V. Stalin und Mitglieder des Politbüros unter Kindern im M. Gorki Central Park of Culture and Leisure\"."
SOV_moscow_military_music_college:0	"Moskauer Schule der Militärmusiker der Roten Armee"
SOV_Biokhimiya:0	"Biokhimiya"
SOV_Biokhimiya_desc:0	"Das erste biochemische Institut der Akademie der Wissenschaften wurde am 18. Dezember 1934 gegründet. Seine Gründer waren herausragende Wissenschaftler - die Akademiker A.N.Bach und A.I. Oparin.\n Diese Einrichtung ist für die fortschreitende Forschung in der Lebensmittel-, Medizin-, Mikrobiologie-, Vitamin-, Enzym- und anderen Industrien in unserem Land notwendig. Die biotechnologischen Entwicklungen des Instituts werden zweifellos eine breite Anwendung in der Praxis der Volkswirtschaft finden und erhebliche Vorteile bringen."
SOV_balkans:0	"Einfluss auf dem Balkan"
SOV_extra_tech_slot:5	"Die Sowjetische Akademie der Wissenschaften erweitert sich"
SOV_extra_tech_slot_desc:5	"Zusammenlegung der Sowjetischen Akademie der Wissenschaften und der Kommunistischen Akademie für eine besser koordinierte und kontrollierte, Forschung"
SOV_Reinstate_Dual_command:5	"Einrichtung eines Doppelkommandos"
SOV_Reinstate_Dual_command_desc:5	"Politische Kommissare in der Kommandostruktur der Roten Armee, um sicherzustellen, dass Stalins Befehle befolgt werden."
SOV_Rescind_Dual_command:5	"Duales Kommando abschaffen"
SOV_Rescind_Dual_command_desc:5	""
SOV_naval_infantry:5	"Spezialeinheiten der Marine-Infanterie"
SOV_guards_armyunits_desc:5	"Die Erfahrungen, die die Armee mit ihren Gardeformationen gemacht hat, sind sehr nützlich."
SOV_guards_horsey:5	"Kavallerie Gardebataillone"
SOV_guards_skymen:0	"Fallschirmjäger Gardebataillone"
SOV_guards_mobile:0	"Mobile Gardebataillone"
SOV_guards_armor:0	"Gepanzerte Gardebataillone"
SOV_guards_strengthen:5	"Verbessert die Rote Garde"
SOV_guards_strengthen_desc:5	"Erhöht die Kampfwerte der Gardeeinheiten."
SOV_OMSDON_NKVD:5	"OMSDON NKVD Spezialeinheiten"
SOV_OMSDON_NKVD_desc:5	""
SOV_OSNAZ_desc:5	""
SOV_communist_militia:5	"Kommunistische Miliz rekrutieren"
SOV_Sikorski_Mayski_agreement_desc:5	"Als sich die internationale Lage der Sowjetunion mit dem Ausbruch des deutsch-sowjetischen Krieges 1941 änderte, suchte Stalin Hilfe bei anderen Ländern, die sich gegen Deutschland stellten. Auf Anregung des britischen Außenministers Anthony Eden nahm Sikorski am 5. Juli 1941 Verhandlungen mit dem sowjetischen Botschafter in London, Iwan Mayski, über die Wiederaufnahme diplomatischer Beziehungen zwischen Polen und der Sowjetunion auf. Stalin erklärte sich bereit, alle früheren Pakte mit Nazideutschland für null und nichtig zu erklären, die sowjetisch-deutsche Teilung Polens vom September 1939 für ungültig zu erklären und Zehntausende von polnischen Kriegsgefangenen, die in sowjetischen Lagern festgehalten wurden, freizulassen. Gemäß einer Vereinbarung zwischen der polnischen Exilregierung und Stalin gewährten die Sowjets am 12. August 1941 vielen polnischen Bürgern eine Amnestie, aus denen eine 40.000 Mann starke Armee (Anders-Armee, später als Polnisches II. Korps bekannt) unter General Władysław Anders gebildet wurde."
SOV_polish_army_desc:5	"Die polnischen Einheiten haben sich im Krieg gut bewährt. Es ist notwendig, diese Initiative auszuweiten und eine vollwertige Streitkraft aus Polen und Menschen polnischer Herkunft zu schaffen, die die Ideale unseres Landes teilen."
SOV_katyusha:5	"Die Katjuscha"
SOV_katyusha_desc:5	"Erhöhen Sie die Forschung für motorisierte Raketenartillerie"
SOV_artillery_divisions:5	"Schaffung von Artillerie-'Zerstörer'-Divisionen"
SOV_artillery_divisions_desc:5	"Eine neue Formation mit konzentrierter Artillerie, Panzerfäusten und schwerer Angriffsinfanterie."
SOV_proletariat_divisions:5	"Narodnoye Opoltschenie"
SOV_Operation_Kutuzov_desc:5	"Die Operation Kutusow war die erste der beiden Gegenoffensiven, die die Rote Armee im Rahmen der strategischen Offensive von Kursk startete. Sie begann am 12. Juli 1943 im zentralen russischen Hochland gegen die Heeresgruppe Mitte der deutschen Wehrmacht. Die Operation wurde nach General Michail Kutusow benannt, dem russischen General, dem die Rettung Russlands vor Napoleon während der französischen Invasion Russlands im Jahr 1812 zugeschrieben wird. Die Operation Kutusow war eine von zwei groß angelegten sowjetischen Operationen, die als Gegenoffensive zur Operation Zitadelle gestartet wurden. Die Operation begann am 12. Juli und endete am 18. August 1943 mit der Einnahme von Orel und dem Zusammenbruch des Orel-Buckels."
SOV_Operation_Suvorov:5	"Operation Suworow (Historische Offensive)"
SOV_Operation_Suvorov_desc:5	"Die zweite Schlacht um Smolensk (7. August bis 2. Oktober 1943) war eine strategische Offensivoperation der Roten Armee im Rahmen des Sommer-Herbst-Feldzugs 1943. Sie fand fast zeitgleich mit der Offensive am Unteren Dnjepr (13. August bis 22. September) statt, dauerte zwei Monate und wurde von General Andrej Jeremenko, Befehlshaber der Kalinin-Front, und Wassili Sokolowski, Befehlshaber der Westfront, geleitet. Ihr Ziel war es, die deutsche Präsenz in den Regionen Smolensk und Brjansk zu beseitigen. Smolensk war seit der ersten Schlacht von Smolensk im Jahr 1941 von den Deutschen besetzt."
SOV_Icebreaker_desc:5	"Der Molotow-Ribbentrop-Pakt hat seine Aufgabe erfüllt - wir sind jetzt bereit für den Krieg mit Deutschland."
SOV_Icebreaker_tt:	"Eine Kriegserklärung an §Y[GER.GetNameWithFlag]§! wird unsere §RArmy Purges§! nicht erhöhen"
SOV_Icebreaker_trigger:	"Wird von §RAxis§! kontrolliert oder hat eine §RAxis§! Einheit anwesend"
SOV_onethousanders:0	"Besatzung der Fabriken"
SOV_onethousanders_desc:0	"Mit der Ausweitung der militärischen Produktion in der Zeit der Mobilisierung kam es in den Rüstungsbetrieben zu einem ernsthaften Arbeitskräftemangel, der sich negativ auf das Produktionsvolumen auswirkte.\n Wir können einige der mobilisierten Menschen, insbesondere mit spezieller Ausbildung, in die Rüstungsbetriebe schicken, um dieses Problem zu lösen."
SOV_Moskva_Volga_canal_desc:5	"Der Rat der Volkskommissare der UdSSR ordnete am 10. Oktober 1931 den Bau von Bauwerken zur Wasserversorgung Moskaus, den Bau eines Hafens in Moskau und die Schaffung einer Wasserstraße, die Moskau mit der Wolga verbindet, innerhalb von sechs Jahren an. \nit der Fertigstellung des Kanals ist Moskau an Russlands einheitliches Tiefwassersystem angeschlossen, ein System von Kanälen und Flüssen im europäischen Russland, das Zugang zu fünf Meeren bietet: dem Weißen Meer, der Ostsee, dem Kaspischen Meer, dem Asowschen Meer und dem Schwarzen Meer."
SOV_lend_lease:5	"Alliierter Leihvertrag"
SOV_lend_lease_desc:5	"Infolge der deutschen Militäraktionen leiden wir unter einem ernsten Mangel an Waffen und Ausrüstung.\n Plötzlich stehen wir auf derselben Seite wie zuvor feindlich gesinnte kapitalistische Staaten - wir sollten sie um materielle Hilfe bitten."
SOV_lend_lease_TT:5	"Erlauben Sie den Alliierten, mit der Verschiffung ihrer Ausrüstung zur Unterstützung der Kriegsanstrengungen zu beginnen. Die Verwendung ausländischer Ausrüstung ist vielleicht etwas gewöhnungsbedürftig, aber die zusätzliche Ausrüstung wird sehr nützlich sein. Löst Ereignisse für Lend-Lease aus."
SOV_allied_technical_aid_desc:0	"Unsere Ingenieur- und Technikschule unterscheidet sich von der westlichen, aber dennoch sollte für militärische Operationen gegen einen gemeinsamen Feind der Austausch von Forschungsinformationen erlaubt sein."
