SIK_army_effort:5	"Einsatz der Armee"
SIK_army_effort_desc:5	"Trotz der zunehmenden Möglichkeiten der Luft- und Seekriegsführung wird der Bodenkampf auch in den Kriegen von morgen entscheidend sein. Mit den richtigen Vorbereitungen können wir vermeiden, die Hölle der Schützengräben erneut zu erleben."
SIK_equipment_effort:5	"Aufwand für Ausrüstung"
SIK_equipment_effort_desc:5	"Die Grenzen der Ausrüstung, die von unserer Infanterie getragen werden kann, werden ständig verschoben. Wir werden uns darauf konzentrieren, unseren Truppen die besten verfügbaren Werkzeuge zur Verfügung zu stellen."
SIK_engines:	"Inländische Motoren"
SIK_engines_desc:	""
SIK_doctrine_effort:5	"Bemühungen um Doktrinen"
SIK_doctrine_effort_desc:5	"Die Militärdoktrinen, die den Bodenkampf im Ersten Weltkrieg bestimmten, sind überholt. Wir müssen unsere besten Köpfe mit der Aufgabe betrauen, das militärische Denken von morgen zu gestalten."
SIK_equipment_effort_2:5	"Ausrüstungsbemühungen II"
SIK_equipment_effort_2_desc:5	"Wir werden unsere Bemühungen fortsetzen, um sicherzustellen, dass unsere Infanterie- und Unterstützungstruppen mit der bestmöglichen Ausrüstung unserer Zeit ausgestattet sind."
SIK_mechanization_effort:5	"Mechanisierungsbestrebungen"
SIK_mechanization_effort_desc:5	"Wir werden die Möglichkeiten der motorisierten Infanterie neu überdenken und die Grenzen dessen, was heute an Fahrzeugen gebaut werden kann, verschieben."
SIK_special_forces:5	"Spezialtruppen"
SIK_special_forces_desc:5	"Wir brauchen Elitespezialkräfte; Gebirgsjäger und Fallschirmjäger sollten unsere Priorität sein."
SIK_fighter_focus:5	"Schwerpunkt Jagdflugzeuge"
SIK_fighter_focus_desc:5	"Die Luftkämpfe des Großen Krieges sind noch nicht vorbei. Ein Entwicklungsvorsprung bei Kampfflugzeugen wird uns in der Zukunft einen Vorteil verschaffen."
SIK_bomber_focus:5	"Schwerpunkt Bomber"
SIK_bomber_focus_desc:5	"Wenn die Menschen der Zukunft über die Schrecken der heutigen Kriege sprechen, wird das Feuer, das vom Himmel herabregnet, im Vordergrund stehen. Wir müssen dafür sorgen, dass diese Geschichten von unseren Feinden erzählt werden."
SIK_aviation_effort_2:5	"Bemühungen um die Luftfahrt"
SIK_aviation_effort_2_desc:5	"Weitere Fortschritte in der Luftfahrt werden notwendig sein, um unsere Luftwaffe in die anderen Bereiche des Militärs zu integrieren."
SIK_CAS_effort:5	"Sturzkampfbomber Einsatz"
SIK_CAS_effort_desc:5	"Eine moderne Armee braucht Unterstützung durch Fahrzeuge nicht nur am Boden, sondern auch in der Luft."
SIK_anti:5	"Imperialisten anprangern"
SIK_anti_desc:5	"Die Imperialisten behaupten, sie hätten unsere Interessen im Sinn, aber alles, was sie tun, ist, ihre Imperien zu ernähren."
SIK_anti_USA:5	"Amerikanische Investoren vertreiben"
SIK_anti_USA_desc:5	"Es sind die Amerikaner, die diese so genannte "Politik der offenen Tür" eingefädelt haben, die uns jetzt in den Fängen der Imperialisten hält."
SIK_anti_JAP:5	"Vertreiben Sie japanische Investoren"
SIK_anti_JAP_desc:5	"Japan hat bereits gezeigt, dass es mehr als bereit ist, den Aggressor zu spielen. Wir sollten ihnen jeden wirtschaftlichen Vorteil nehmen, den sie aus uns ziehen."
