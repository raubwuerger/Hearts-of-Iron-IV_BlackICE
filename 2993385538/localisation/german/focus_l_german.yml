PER_marble_palace:5	"Bau des Marmorpalastes"
PER_marble_palace_desc:5	"Der Palast ist von einem Garten umgeben. Die Außenfläche des Palastes besteht aus weißem Marmor. Der steinerne Eingang des Palastes, an dem zwei Statuen achämenidischer Soldaten mit Pfeilen aufgestellt wurden, spiegelt den eklektischen Baustil besonders gut wider."
PER_ramsar_palace:5	"Bau des Ramsar-Palastes"
PER_aioc:5	"AIOC-Verhandlungen"
PER_aioc_desc:5	"Das derzeitige Abkommen mit AIOC ist für uns nicht zufriedenstellend. Wir werden eine Delegation zu den Briten schicken, um bessere Bedingungen auszuhandeln."
PER_aioc2:5	"AIOC aufkündigen"
PER_aioc2_desc:5	"Wenn die Verhandlungen scheitern, werden wir die AIOC als Betrug anprangern, der sie ist."
PER_treaty_sov:5	"Vertrag über Handel und Schifffahrt"
PER_treaty_sov_desc:5	"Der Vertrag über Handel und Schifffahrt wurde am 25. März 1940 zwischen Vertretern des Iran und der Sowjetunion unterzeichnet. Dieses Abkommen trug dazu bei, die Grundsätze des Gründungs-, Handels- und Schifffahrtsvertrags zu bekräftigen. Auf der Grundlage des Vertrags stimmten beide Unterzeichner zu, die 10-Meilen-Fischereigrenze für alle Handelsschiffe im Kaspischen Meer zu verstärken."
PER_museum:5	"Das Pars-Museum"
PER_museum_desc:5	"Das Pars-Museum ist ein Museum in Shiraz, Provinz Fars, Südiran, und befindet sich im Nazar-Garten"
