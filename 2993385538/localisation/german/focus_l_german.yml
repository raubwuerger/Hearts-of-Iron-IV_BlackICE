IEA_safe_desc:5	""
IEA_Trade_Fleet_desc:5	"Wir müssen eine Flotte von Handelsschiffen bauen."
IEA_military_dockyards:5	"Militärische Werften"
IEA_military_dockyards_desc:5	"Wir brauchen eine Flotte, um unsere Küsten zu verteidigen. Militärische Werften sind der erste Schritt zum Aufbau dieser Flotte."
IEA_surface_fleet:5	"Überwasserflotte"
IEA_army_effort_desc:5	"Trotz der zunehmenden Möglichkeiten der Luft- und Seekriegsführung wird der Bodenkampf auch in den Kriegen von morgen entscheidend sein. Mit den richtigen Vorbereitungen können wir die Hölle der Schützengräben vermeiden."
IEA_division_cmd:5	"Verbesserung der Divisionsführung"
IEA_division_cmd_desc:5	"Effiziente Kommandostrukturen mit klar definierten Rollen werden sich auszahlen."
IEA_equipment_effort:5	"Beretta Investments"
IEA_equipment_effort_desc:5	"Die Grenzen der Ausrüstung, die von unserer Infanterie getragen werden kann, werden ständig verschoben. Wir werden uns darauf konzentrieren, unseren Truppen die bestmögliche Ausrüstung zur Verfügung zu stellen."
IEA_motorization_effort:5	"Motorisierung"
IEA_motorization_effort_desc:5	"Mobilität und Schutz sind von entscheidender Bedeutung, um unsere Infanterie sicher ins und aus dem Feld zu bringen. Wenn wir uns auf diese Bereiche konzentrieren, werden wir uns schneller verbessern können."
IEA_doctrine_effort:5	"Bemühungen um Doktrinen"
IEA_doctrine_effort_desc:5	"Die Militärdoktrinen, die den Bodenkampf im Ersten Weltkrieg bestimmten, sind überholt. Wir müssen unsere besten Köpfe mit der Aufgabe betrauen, das militärische Denken von morgen zu gestalten."
IEA_equipment_effort_2:5	"Ausrüstungsbemühungen"
IEA_equipment_effort_2_desc:5	"Wir werden unsere Bemühungen fortsetzen, um sicherzustellen, dass unsere Infanterie- und Unterstützungstruppen mit der bestmöglichen Ausrüstung unserer Zeit ausgestattet sind."
IEA_doctrine_effort_2:5	"Doktrin Anstrengung II"
IEA_doctrine_effort_2_desc:5	"Das Schlachtfeld hat sich nicht nur in den Jahren zwischen den beiden Weltkriegen, sondern auch im Laufe der jüngsten Konflikte verändert. Wir müssen unsere Doktrinen ständig neu bewerten, um diesem Umstand Rechnung zu tragen."
IEA_equipment_effort_3:5	"Ausrüstung Anstrengung III"
IEA_equipment_effort_3_desc:5	"Anstatt ausländische Ausrüstung zu imitieren oder zu kaufen, sollten wir danach streben, bei den Infanteriewaffen weltweit führend zu werden."
IEA_armor_effort:5	"Panzerungsanstrengungen"
IEA_armor_effort_desc:5	"Durch die Anwendung der bei der Mechanisierung unserer Infanterie gewonnenen Erkenntnisse können wir auch unsere gepanzerten Fahrzeuge verbessern."
IEA_special_forces_desc:5	"Wir brauchen Elitespezialkräfte; Gebirgsjäger und Fallschirmjäger sollten unsere Priorität sein."
IEA_Horse_effort_desc:5	""
IEA_Linea:5	"Kaiserliche Linie"
IEA_Linea_desc:5	"Die Imperiale Linie (italienisch Linea dell'Impero oder Linea Imperiale) war eine Flugroute der nationalen italienischen Fluggesellschaft Ala Littoria während der faschistischen Ära. Sie war die längste Strecke im italienischen Kolonialreich in Afrika und \"das Juwel in der Krone von Ala Littoria\". Sie verband Rom mit Benghazi (Libyen), Asmara (Eritrea), Addis Abeba (Äthiopien) und Mogadischu (Somalia). Sie beförderte Passagiere und Post"
IEA_CAS_effort_desc:5	"Eine moderne Armee braucht Unterstützung durch Fahrzeuge nicht nur am Boden, sondern auch in der Luft."
IEA_fort_capital:5	"Die Hauptstadt verteidigen"
IEA_fort_capital_desc:5	"Angesichts der zunehmenden Spannungen in der Welt müssen wir bereit sein, unseren Sitz der Macht zu verteidigen"
IEA_forts:5	"Befestigungstechniken"
IEA_forts_desc:5	"In der Vergangenheit konnten wir uns auf das feindliche Terrain verlassen, um unsere Grenzen zu verteidigen, aber die jüngsten Fortschritte in der Kriegsführung bedeuten, dass wir bauen müssen, um unsere Grenzen zu schützen."
IEA_Elec_Fort:5	"Elektrische Verteidigungsanlagen"
IEA_Elec_Fort_desc:5	"Jüngste Durchbrüche bei Funk und RADAR werden den Weg für unsere Verteidigungsstrategien weisen"
IEA_horn:0	"Abhörhorn"
IEA_horn_desc:0	""
IEA_Listen:5	"Schwerpunkt Detektion"
IEA_Listen_desc:5	"Der Schlüssel zu einer guten Verteidigung liegt darin, zu wissen, was unsere Gegner tun. Wir werden aktiv auf dem Äther lauschen."
IEA_Hide:5	"Scrambling-Techniken"
IEA_Hide_desc:5	"Sicherheit ist dann gegeben, wenn man nicht gefunden werden kann."
IEA_Walls:5	"Defensive Bauten"
IEA_Walls_desc:5	"Wir bauen Befestigungen und Waffenlager, um unser Land zu verteidigen."
IEA_Walls_ground:5	"Bodenverteidigung"
IEA_Walls_ground_desc:5	"Die Stiefel auf dem Boden, verschanzt und bereit, bieten die beste Verteidigung"
IEA_Walls_Air:5	"Luftverteidigung"
IEA_Walls_Air_desc:5	"Wir können nicht darauf hoffen, unseren Himmel mit unserer kleinen Luftwaffe zu verteidigen, stattdessen werden wir Verteidigungsanlagen auf dem Boden installieren."
IEA_War_Command:5	"Kriegskommando"
IEA_War_Command_desc:5	"Die Welt brennt um uns herum, wir müssen alles nutzen, was wir gelernt haben, um im Einsatz zu bestehen"
IEA_build_up:5	"Die Maschine hochfahren"
IEA_build_up_desc:5	"Wir müssen unsere Nation auf Hochtouren bringen, um auf die drohenden Gefahren vorbereitet zu sein"
