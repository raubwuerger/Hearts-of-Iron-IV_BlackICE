SOV_nkvd_upgrade_tooltip:1	"§YDer NKVD§! ist nun enger in unsere Armee integriert und sorgt dafür, dass die Moral der Soldaten und der Glaube an die Partei hoch sind.\n'§YNKVD§!' gewährt außerdem eine verbesserte Verstärkungsrate!\n"
ger_sov_buddies_tooltip_2:5	"Dadurch wird [Root.GetFactionName] aufgelöst und die Fraktion §YBerlin-Moskau§! geschaffen."
ger_sov_buddies_tooltip:5	"§RWenn die Sowjets unser Angebot annehmen, werden wir durch diese Änderung der Politik einen gewissen Verlust an nationaler Einheit erleiden. Unnötig zu sagen, dass unsere faschistischen Mitstreiter und die demokratischen Mächte durch diese Wendung der Ereignisse ebenfalls verärgert sein werden.§!\n"
purged_kalinin:5	" Von Stalin gesäubert"
purged_khrushchev:5	" Säuberung durch Stalin"
purged_yezhov:5	" Säuberung durch Stalin"
purged_beria:5	" Von Stalin gesäubert"
purge_1_group_a:5	" Von Stalin gesäubert"
purge_1_group_b:5	" Geläutert von Stalin"
purge_2_group_a:5	" Geläutert von Stalin"
purge_2_group_b:5	" Geläutert durch Stalin"
counter_purge:5	" Gesäubert von Trotzki"
limited_rearmament_focus:5	"Begrenzte Wiederaufrüstung"
limited_rearmament_focus_desc:5	"Die jüngsten Aufregungen in Deutschland und anderen faschistischen Mächten in der Welt deuten darauf hin, dass wir in unserer Zeit vielleicht keinen Frieden haben werden. Um uns darauf vorzubereiten, sollten wir damit beginnen, die Weichen für unsere eigene Aufrüstung zu stellen, falls sich die Lage weiter verschlechtert."
uk_empire_focus:5	"Verstärkung des Imperiums"
uk_empire_focus_desc:5	"Unser Reich ist riesig und trotz unserer Macht nur schwach verteidigt. Um dem entgegenzuwirken, müssen wir den imperialen Patriotismus im gesamten Reich fördern."
uk_service_focus:5	"Dienst in Übersee"
uk_service_focus_desc:5	"Durch die Rotation von Armeeangehörigen zu Kolonialstationen und wieder zurück in die Heimat können sie die Bedingungen an verschiedenen Fronten kennenlernen, Erfahrungen sammeln und diese mit ihren Kameraden in der Heimat teilen."
uk_mediterranean_focus:5	"Bollwerk im Mittelmeer"
uk_mediterranean_focus_desc:5	"Die Route durch das Mittelmeer ist eine lebenswichtige Abkürzung nach und von Indien. Daher ist es von größter Bedeutung, sie offen und in unserer Hand zu halten."
uk_rock_focus_desc:5	"Gibraltar kontrolliert nicht nur den Eingang zum Mittelmeer, sondern bietet auch einen stark verteidigten Hafen, von dem aus Schiffe sowohl im Atlantik als auch im Mittelmeer operieren können. Als solcher muss er unbedingt stark bewacht werden."
uk_greece_focus:5	"Griechenland unter Druck setzen"
uk_greece_focus_desc:5	"Es liegt in unserem Interesse, Stützpunktrechte in Griechenland zu haben, und offen gesagt sind die Griechen nicht in der Lage, uns diese zu verweigern."
uk_malta_focus:5	"Malta befestigen"
uk_malta_focus_desc:5	"Malta hat eine hervorragende Position im zentralen Mittelmeer, eine wichtige Station entlang unserer Lebensader durch Ägypten und den Suezkanal nach Indien und in den Fernen Osten. Die Zeit, die wir für eine stärkere Befestigung aufwenden, darf nicht vergeudet werden."
ENG_mot_focus_tooltip:5	"Wir können jetzt motorisierte Infanteriedivisionen einsetzen."
uk_canada_focus:5	"Entwicklung in Kanada"
uk_canada_focus_desc:5	"Eine Investition in die kanadische Industrie und die kanadischen Werften wird die Wirtschaft des Landes ankurbeln und sie in die Lage versetzen, im Falle eines Krieges einen größeren Beitrag zu leisten."
uk_australia_focus:5	"Entwicklung in Australien"
uk_australia_focus_desc:5	"Investitionen in die australischen Werften und die Industrie werden die australische Wirtschaft ankurbeln und es ihr ermöglichen, im Kriegsfall einen größeren Beitrag zu leisten."
uk_commonwealth_knowledge:5	"£tech_mod Commonwealth-Wissen"
uk_commonwealth_knowledge_desc:5	"Das zusätzliche Wissen und die wissenschaftlichen Fähigkeiten unserer Commonwealth-Verbündeten werden unsere eigenen wissenschaftlichen Durchbrüche fördern."
uk_protect_suez:5	"Suez beschützen"
uk_protect_suez_desc:5	"Die Kontrolle des Suez-Kanals ist ein Teil der Kontrolle des Britischen Empire über die Meere. Ein Verlust dieser Region wäre katastrophal. Es müssen Maßnahmen ergriffen werden, um sie zu befestigen."
uk_balkan_strategy:5	"Balkan-Strategie"
uk_balkan_strategy_desc:5	"Viele der Nationen auf dem Balkan sind pro-britisch und sehen die gleiche Bedrohung aus Mitteleuropa wie wir. Wenn wir die Gelegenheit ergreifen und sie frühzeitig unterstützen, können wir uns ihre Loyalität sichern, wenn auch auf Kosten der Verärgerung ihrer rachsüchtigen Nachbarn."
uk_new_zealand_focus:5	"Neuseeland entwickeln"
uk_new_zealand_focus_desc:5	"Neuseeland hat eine starke Bindung zu unserer Nation und hat vor der faschistischen Bedrohung gewarnt. Ihr Beitrag im Falle eines Krieges ist gewiss, und wir sollten ihnen helfen, sich entsprechend vorzubereiten."
uk_south_africa_focus:5	"Entwicklung Südafrikas"
uk_south_africa_focus_desc:5	"Die politische Lage in Südafrika ist ungewiss. Wir können nicht uneingeschränkt darauf vertrauen, dass sie unsere Kriegsanstrengungen unterstützen werden, aber indem wir ihnen bei der Stärkung ihrer Industrie helfen, können wir hoffen, die Unterstützung für die britische Sache zu erhöhen."
uk_ireland_focus:5	"Irland entwickeln"
uk_ireland_focus_desc:5	"Die politische Lage in Irland ist besorgniserregend, viele drängen darauf, das Commonwealth zu verlassen, aber indem wir ihnen bei der Stärkung ihrer Industrie helfen, können wir hoffen, die Unterstützung für die britische Sache zu erhöhen."
USA_reinforce_monroe_doctrine_tt:5	"Erhöht die Handelsmeinung mit allen amerikanischen Nationen."
1939_bookmark_threat:5	"Jüngster faschistischer Expansionismus"
kamikaze_focus_tooltip:5	"Ermöglicht §YKamikaze Strike§! Luftmissionen, Selbstmordangriffe auf feindliche Schiffe."
NATIONAL_FOCUS_MUTUALLY_EXCLUSIVE_TREE:5	"Die Zweige schließen sich gegenseitig aus."
NATIONAL_FOCUS_EXCLUSIVE_INFO_DESC:5	"Gegenseitig exklusiv mit"
NATIONAL_FOCUS_EXCLUSIVE_INFO_ENTRY:5	"$FOCUS|Y$"
NATIONAL_FOCUS_NO_CURRENT_EFFECT:5	"Dieser Fokus hat derzeit keine Auswirkung. Änderungen der Weltsituation können dies jedoch beeinflussen."
IRE_abolish_the_senate:5	"Den Senat abschaffen"
IRE_remove_the_king:5	"Entfernen Sie den König als Staatsoberhaupt"
IRE_remove_the_king_desc:5	"Jetzt, da sich Großbritannien mitten in der Abdankungskrise befindet, werden wir die Gelegenheit nutzen und durch den Executive Authority Act Verweise auf die Monarchie vollständig aus unserer Verfassung streichen. Das Büro des Generalgouverneurs sollte diese Entscheidung begleiten die folgende Verfassungsänderung, aber unser Generalstaatsanwalt hat aufgrund rechtlicher Mängel und technischer Probleme etwas anderes empfohlen. Nichtsdestotrotz werden wir endlich den Schritt unternehmen, die Monarchie aus Irland zu entfernen und endlich unser eigenes Staatsoberhaupt einzusetzen: einen Präsidenten."
IRE_dismiss_the_governor:5	"Den Generalgouverneur entlassen"
IRE_dismiss_the_governor_desc:5	"Es ist an der Zeit, dass wir den Generalgouverneur, den Vertreter des Königs in Dublin Castle, von allen möglichen Macht- und Einflussmöglichkeiten entbinden. Obwohl wir ihm eine staatliche Rente anbieten werden, wird der Generalgouverneur dauerhaft von allen Macht- und Einflussmöglichkeiten entbunden."
IRE_ratify_constitution:5	"Eine neue Verfassung ratifizieren"
IRE_coalcattle_pact:5	"Kohle-Vieh-Pakt"
IRE_coalcattle_pact_desc:5	"Der anglo-irische Handelskrieg wurde im Oktober 1932 von Präsident de Valera begonnen, kurz nach dem Wahlsieg von Fianna Fáil. Die Briten weigerten sich, die von der britischen Regierung vor dem Unabhängigkeitskrieg ausgegebenen Landrenten zu zahlen, und schlugen Vergeltung durch die Einführung von Zöllen auf den irischen Handel mit Großbritannien. Da Großbritannien Irlands größter Handelspartner war, litt die Wirtschaft natürlich stark. Dies stand im Einklang mit der protektionistischen Politik der Regierung, die darauf abzielte, die heimische Industrie und Produktion Irlands auszuweiten – zum Nachteil von Irland Preise und Lebenshaltungskosten. Nach mehreren Jahren wirtschaftlicher Not ist klar, dass die irische Industrie, die größtenteils auf der Landwirtschaft basiert, nicht in der Lage ist, sich ohne umfassenden Handel mit Großbritannien zu behaupten. Es ist an der Zeit, mit der Lösung des Handelskrieges zu beginnen, der sich zwischen ihnen entwickelt hat Unsere beiden Nationen. Unter dem Deckmantel des Industrie- und Handelsministers Seán Lemass haben die Gespräche begonnen und Großbritannien hat zugestimmt, den Kohle-Vieh-Pakt mit Irland zu unterzeichnen – ein großer Fortschritt im diplomatischen Prozess zwischen Irland und dem Vereinigten Königreich."
IRE_sci:5	"£tech_mod Elektrifizierte Laboratorien"
IRE_sci_desc:5	"Unser Erfolg beim Bau des größten Wasserkraftwerks der Welt am Fluss Shannon zeigt, dass wir im Bereich der Elektrizität und ihrer Weiterentwicklung viel zu bieten haben. Lassen Sie die Elektrizitätsversorgungsbehörde Pläne für die Entwicklung weiterer Technologien ausarbeiten, um das Wachstum der Nation zu fördern und uns auf diesem Gebiet mit unseren Nachbarn gleichziehen zu lassen."
IRE_emergency:5	"Gesetz über Notstandsbefugnisse"
IRE_emergency_desc:5	"Es herrscht Krieg in Europa und Irland ist in Gefahr. Wir müssen den Notstand ausrufen und den irischen Staat schützen."
IRE_neut:5	"Erklärung der irischen Neutralität"
IRE_neut_desc:5	"Wir werden erklären, dass Irland in diesem Konflikt neutral bleiben wird, obwohl viele in Irland antifaschistische Gefühle hegen, während andere aus Bosheit gegenüber den Briten mit ihnen sympathisieren."
IRE_iraban:5	"Gesetz über Straftaten gegen den Staat"
IRE_iraban_desc:5	"Die IRA darf seit dem Ende des Bürgerkriegs weiter bestehen, doch angesichts des drohenden Krieges in Irland kann dies nicht länger hingenommen werden. Wir werden die prominenten IRA-Mitglieder verhaften und sie entwaffnen."
IRE_war:5	"Auf den Krieg vorbereiten"
IRE_war_desc:5	"Das irische Volk schreit nach Rache an den Briten, und während sich in Europa ein Sturm zusammenbraut, bricht Großbritannien zusammen. Irland wird nicht tatenlos zusehen, wie Europa ausbricht, wir werden in den Krieg ziehen!"
IRE_opkath:5	"Operation Kathleen"
IRE_opkath_desc:5	"Die IRA ist wieder aktiv und wir haben einen Plan zur Invasion Nordirlands entdeckt, den sie mit den Deutschen ausgeheckt hat. Es ist möglich, dass wir diesen Plan selbst anwenden können, wenn wir uns den Schutz Deutschlands sichern können."
IRE_coast_fort:5	"Die Häfen befestigen"
IRE_coast_fort_desc:5	"Mit der Rückgabe der Vertragshäfen an uns tragen wir auch die Verantwortung für deren Verteidigung."
IRE_planw:5	"Plan W"
IRE_planw_desc:5	"Die deutsche Aggression ist nicht unbemerkt geblieben. Die Briten haben uns gesicherte Informationen über eine deutsche Invasion in Großbritannien mit dem Codenamen "Operation Seelöwe" und eine Invasion in Irland mit dem Codenamen "Operation Grün" übermittelt. Wir müssen Maßnahmen ergreifen, um uns dagegen zu schützen, auch wenn dies bedeutet, sich mit den Alliierten zu verbünden."
IRE_irapower:5	"Ermächtigung der IRA"
IRE_irapower_desc:5	"Mit der Entscheidung Irlands, in den Krieg zu ziehen, wird die IRA unruhig. Wir könnten sie mit Diplomatie unterdrücken, aber da sie mit unserer Sache sympathisieren, könnten wir sie in unsere Armee integrieren und ihre Erfahrungen mit Guerillataktiken nutzen."
IRE_axisalign:5	"Verbünden Sie sich mit der Achse"
IRE_axisalign_desc:5	"Wenn wir in den Krieg gegen Großbritannien ziehen wollen, können wir das nicht allein tun. Irland muss sich mit den Achsenmächten verbünden und hoffentlich ein Bündnis anstreben, um Nordirland zurückzuerobern."
IRE_unite:5	"Irland vereint"
IRE_unite_desc:5	"Seit dem Unabhängigkeitskrieg von 1921 haben wir die Vereinigung Irlands angestrebt. Jetzt, da die Welt vom Krieg bedroht ist und Großbritannien schwach ist, ist es an der Zeit, dass wir dieses Ziel verwirklichen!"
IRE_ourpeople:5	"Sie sind unser Volk"
IRE_ourpeople_desc:5	"Der Belfast Blitz war zwar über Nordirland gegen die Briten gerichtet, aber dennoch ein Angriff auf das irische Volk auf irischem Boden. Sie sind unser Volk, wir sind ein und dasselbe, und ihr gegenwärtiges Leid ist auch unser Leid."
IRE_malcmcdonald:5	"Malcolm MacDonald"
IRE_malcmcdonald_desc:5	"Malcolm MacDonald, der 1937 mit dem irischen Freistaat über die Beilegung von Handelsstreitigkeiten verhandelte, ist mit einem verlockenden Angebot nach Irland zurückgekehrt."
IRE_pol:5	"Verfassung für Irland"
IRE_pol_desc:5	"Wir müssen eine Verfassung schaffen, die die Herrschaft der Oireachtas über Irland festschreibt. Diese Verfassung wird den irischen Staat als "Irland" festschreiben."
Irish_independance:5	"Irische Verfassung"
IRE_refer:5	"Ein Referendum abhalten"
IRE_refer_desc:5	"Nachdem die neue Verfassung ausgearbeitet wurde, müssen wir nun ein Referendum zu ihrer Annahme abhalten."
IRE_indi:5	"Wahre Unabhängigkeit"
IRE_indi_desc:5	"Es ist an der Zeit, dass wir uns vollständig von England lösen und unser Schicksal selbst in die Hand nehmen"
IRE_sugar:5	"Bau von Zuckerrübenfabriken"
IRE_sugar_desc:5	"Frühe Produktionsbemühungen in den 1800er Jahren bewiesen, dass Irland in der Lage war, Zucker von guter Qualität zu produzieren. Die erste Verarbeitungsanlage wurde 1926 in Carlow eröffnet, und es folgten schnell weitere. Die regierende Partei Fianna Fail erkannte das Potenzial und gründete 1933 die Cómlucht Siúicre Eireann (Irische Zuckergesellschaft). Die Minister der Regierung forderten eine Steigerung der Produktion und Industrialisierung, was im folgenden Jahr zum Bau weiterer Fabriken führte."
IRE_electric:5	"Ausbau des Stromnetzes"
IRE_electric_desc:5	"Mit dem Electricity Supply Act von 1927 wurde das Bord Soláthair an Leictreachais (Electricity Supply Board - ESB) gegründet, nachdem das Wasserkraftwerk Ardnacrusha am Fluss Shannon - damals das größte der Welt - erfolgreich in Betrieb genommen worden war. Bis 1935 produzierte das Kraftwerk 80 % der Elektrizität des Landes. Die Verfügbarkeit von Elektrizität wurde nach und nach erweitert und trug zur Modernisierung des Landes bei. Die ESB plante weitere Wasserkraftwerke und begann mit Projekten, die den Zugang zur Stromversorgung in ländlichen Gebieten verbessern sollten, auch wenn viele dieser Projekte durch den Ausbruch des Zweiten Weltkriegs verzögert wurden."
IRE_nat:5	"Die Nationale Unternehmenspartei"
IRE_civil:5	"Lehren aus dem Bürgerkrieg"
IRE_armyone:5	"An Chéad Chathlán Coisithe"
IRE_armyone_desc:5	"Wir haben nur eine kleine Verteidigungsarmee, aber wenn wir Irland gegen seine Feinde verteidigen wollen, müssen wir innovativ sein."
IRE_armytwo:5	"Nationale Armee"
IRE_armythree:5	"Spezialinfanteriekorps"
IRE_treet:5	"Vertragshäfen zurückfordern"
IRE_coa:5	"Eire (Confirmation of Agreements) Act"
IRE_magfort_desc:5	"Nach dem Abzug des britischen Militärs im Jahr 1921 übernahmen die Iren die Kontrolle über die Festungsanlagen im ganzen Land, darunter auch das Magazine Fort in der Hauptstadt Dublin. Die Regierung setzte die Praxis fort, Waffen und Munition dort zentral zu lagern... ein Zustand, der von der IRA genau überwacht wurde."
IRE_xmas:5	"Rückforderung von IRA-Munition"
IRE_air2:5	"Gloster Gladiators"
IRE_air3:5	"Hawker Hurricanes"
IRE_air3_desc:5	"Wenn wir vor einer Invasion sicher sein wollen, müssen wir das Air Corps modernisieren, angefangen mit den Hawker Hurricane-Jägern."
IRE_navy1_desc:5	"Ein Krieg steht bevor, und wenn wir neutral bleiben wollen, müssen wir unsere Gewässer verteidigen. Da sich die Royal Navy aus den Vertragshäfen zurückzieht, können wir wieder eine Marine aufbauen."
IRE_navy2_desc:5	"Der Marine- und Küstendienst wächst und schützt zivile Schiffe in unseren Gewässern und darüber hinaus. Wir werden ihn daher in 'The Marine Service' umbenennen."
IRE_navy3:5	"Der Marinedienst"
IRE_navy3_desc:5	"Es ist klar, dass der Marinedienst nicht ausreicht, deshalb werden wir ihn auflösen und den Marinedienst als ständigen Teil unserer Verteidigungsstreitkräfte einrichten."
IRE_inf:5	"Bord na Móna"
IRE_nuke:5	"Das ESB modernisieren"
IRE_secwep:5	"Geheime Verteidigungsstreitkräfte"
IRE_secwep_desc:5	"Mit unseren jetzt modernisierten Verteidigungsstreitkräften können wir möglicherweise Schritte zur Erforschung "geheimer" Waffen wie Atom- oder Raketentechnologie unternehmen."
IRE_rocketeffort:5	"Modernes Luftkorps"
IRE_indoct:5	"Neuer Treueschwur"
IRE_indoct_desc:5	"Bevor Artikel 17 aus der Verfassung gestrichen wurde, mussten die Mitglieder der Regierung einen Eid auf den britischen König schwören. Wir könnten dies wieder einführen, wobei sich der Eid stattdessen auf das irische Staatsoberhaupt beziehen sollte, um Loyalität zu erzeugen."
IRE_fanaticism:5	"Widerstand gegen den anglo-irischen Vertrag"
IRE_fanaticism_desc:5	"Da unser Staat jetzt unter einer einheitlichen Führung stärker ist, können wir uns dem anglo-irischen Vertrag widersetzen und ein selbstverwalteter Staat werden, frei von den Briten."
IRE_militarism:5	"Éire Nua"
IRE_militarism_desc:5	"Irland ist eine Nation und wir werden dafür sorgen, dass sie geeint ist! Wir werden die Idee eines neuen, vereinigten Irlands unter unserer Regierung stärken."
IRE_youth:5	"Fianna Éireann"
IRE_youth_desc:5	"Die Fianna Éireann war eine nationalistische Jugendorganisation, die bei vielen Ereignissen im Vorfeld des Unabhängigkeitskrieges eine wichtige Rolle spielte - vor allem beim Osteraufstand. Wir können unter unserer Regierung einen ähnlichen Orden gründen, um die Jugend Irlands zu rekrutieren."
IRE_commissars:5	"Oifigeach Polaitiúil"
IRE_commissars_desc:5	"Die Komintern war sehr einflussreich bei James Larkins Aufstieg zur Macht und der Gründung seiner Partei. Wir können viel von der Sowjetunion lernen, einschließlich ihres Systems der politischen Offiziere."
IRE_paramilitarism:5	"Óglaigh na hÉireann"
IRE_paramilitarism_desc:5	"Irland hat eine stolze Geschichte von Kriegern, wir sind eine Nation, die auf dem Krieg aufgebaut wurde, und bald werden wir den größten Krieg aller Zeiten erleben. Wir müssen unsere Kriegskultur wieder aufbauen, um den kommenden Bedrohungen zu begegnen."
IRE_techshare:5	"Stärkung der irischen Technologie"
IRE_techshare_desc:5	"Durch den Austausch von technologischen Fortschritten mit unseren Verbündeten wird unsere Fraktion in der Lage sein, Forschung und Entwicklung im Krieg effizienter zu betreiben."
IRE_extra_tech_slot:5	"£tech_mod Industrielle Forschung"
IRE_extra_tech_slot_desc:5	"Unsere industrielle Expansion und andere Fortschritte der letzten Zeit könnten es uns ermöglichen, mehr Forschung und Entwicklung parallel zu betreiben."
IRE_extra_tech_slot_2:5	"£tech_mod Fortgeschrittene Forschung"
IRE_extra_tech_slot_2_desc:5	"Die rasche Industrialisierung unseres Landes hat neue Möglichkeiten in Forschung und Entwicklung eröffnet, die wir nutzen sollten."
IRE_demo:5	"Fianna Fáil"
IRE_demo_desc:5	"Die Fianna Fáil Party wurde von Éamon de Valera gegründet und ist die wichtigste demokratische Partei in Irland. Sie ist seit 1932 an der Macht und muss es auch bleiben, wenn Irland in diesen unruhigen Zeiten demokratisch bleiben soll."
IRE_def:5	"Inselverteidigung"
IRE_def_desc:5	"Irland hat gerade erst seine Unabhängigkeit erlebt, und es gibt viele Bedrohungen, die sich gegen uns richten. Nach Jahren des blutigen Krieges ist es an der Zeit, unsere Verteidigung auszubauen."
IRE_intervene:5	"Intervenieren"
IRE_intervene_desc:5	"Auch wenn Irland nur eine kleine Insel ist, können wir eine große Armee aufstellen, die in den Krieg mit unseren demokratischen Verbündeten geschickt werden könnte, was allerdings bedeutet, dass wir unsere Heimatfront vernachlässigen würden."
IRE_gallowglass:5	"Gallóglaigh"
IRE_gallowglass_desc:5	"Anglisiert als "Gallowglass" waren die Gallóglaigh in erster Linie nordisch-schottische Söldner, die von den alten irischen Königen eingesetzt wurden. Der Begriff kann "fremde Krieger" bedeuten, und wir können dieses Prinzip jetzt nutzen, um unsere eigenen fremden Legionen zu unseren Verbündeten zu schicken."
IRE_why_we_fight:5	"Kanal der Mór-ríoghain"
IRE_why_we_fight_desc:5	"Die Morrigan waren drei Schwestergöttinnen, die mit dem Krieg verbunden sind. Sie sind ein Symbol für die stolze und uralte Geschichte des Krieges in Irland, und selbst in diesen modernen Zeiten des Friedens können wir der Welt zeigen, wie stolz die Iren sein können."
IRE_dominion:5	"Ein Platz im Commonwealth"
IRE_aid:5	"Britische Wirtschaftshilfe"
IRE_unified:5	"Wieder vereint unter britischer Herrschaft"
IRE_war_ready:5	"Die Wirtschaft auf den Krieg vorbereiten"
IRE_monitor:5	"Altantische Wetterüberwachungsstationen"
IRE_brit_tech:5	"Commonwealth-Forschung"
IRE_constitution_passed:5	" Referendum angenommen"
IRE_steel:5	"Irischer Stahl"
IRE_steel_desc:5	""
IRE_munster:5	"Cork Harbor entwickeln"
IRE_munster_desc:5	"Der Hafen von Cork ist nach Sydney in Australien der zweitgrößte Hafen der Welt. Während der britischen Herrschaft in Irland war er ein wichtiger Hafen, und es besteht die Möglichkeit, ihn zum Herzstück des irischen Seehandels und des Ausbaus der Marine zu machen."
IRE_military:5	"Militärische Entwicklung"
IRE_military_desc:5	"Der Verlust von Waffen und Munition an die IRA brachte die irische Regierung in Verlegenheit und machte deutlich, dass sie nicht in der Lage war, verlorene oder gestohlene Ausrüstung zu ersetzen. Die Entwicklung der Rüstungsindustrie wird dafür sorgen, dass die Streitkräfte versorgt werden und bereit sind, die Nation zu verteidigen."
IRE_support_desc:5	""
IRE_cross:0	"Gründung der Irischen Rotkreuz-Gesellschaft"
IRE_cross_desc:0	"Die Gesellschaft wurde am 6. Juli 1939 auf der Grundlage des Rotkreuzgesetzes von 1938 formell gegründet. Sie ist der Internationalen Föderation der Rotkreuz- und Rothalbmond-Gesellschaften angeschlossen."
IRE_brit_air_desc:5	""
IRE_limerick_air:0	"Offener Flughafen Shannon"
IRE_limerick_air_desc:0	"Der internationale Flughafen Shannon liegt 20 km westlich der Stadt Limerick und wird Transatlantikflüge anbieten."
MCK_more_opium_tt:0	"Das Verteilen von Opium in besetzten Gebieten verringert leicht den Kampfwillen der Einheimischen.\n"
MCK_some_keibigun_tt:0	"5 Kenpeitai werden sich in Hsinking versammeln.\n"
MCK_contact_white_tt:0	"§RDie RFP könnte unsere Unterstützung bei der Vernichtung der Bolschewiki anfordern, wenn wir erfolgreich unsere Unabhängigkeit erklärt haben.§!"
MCK_river_force_tt:0	"2 Marines werden sich in Hsinking versammeln."
MCK_royal_guards_tt:0	"5 königliche Wachen werden sich in Hsinking versammeln."
MCK_militias_tt:0	"An verschiedenen Orten erheben sich Milizen."
MCK_assassination_tt:0	"Einige japanische Beamte werden eliminiert."
MCK_rfr_arm_forces:0	"Einige RFP-Streitkräfte werden unter unsere direkte Kontrolle geraten.\n"
MCK_will_join_usa_in_war_against_japan_tt:0	"§YWird den USA beitreten, wenn sie oder Japan einander den Krieg erklären.§!"
MCK_restoration_tt:0	"§YBonuseffekte erscheinen in Abständen von 10 %.§!\n\n"
MCK_reclaim_central_plain_tt:0	"§YErhalten Sie ein Kriegsziel gegen Nationen, die unsere Kernstaaten in China halten.§!"
MCK_restore_frontier_tt:0	"§YErhalten Sie ein Kriegsziel gegen Nationen, die unsere Kernstaaten außerhalb Chinas halten.§!"
MCK_acquire_the_north_manchu_railway:0	"Erwerbe die Nordmandschu-Eisenbahn"
MCK_acquire_the_north_manchu_railway_desc:0	"Obwohl die Nord-Mandschu-Eisenbahn innerhalb unserer Grenzen liegt, wird sie tatsächlich von den Russen kontrolliert. Glücklicherweise kann dieses Problem mit etwas Geld gelöst werden."
MCK_five_race_under_one_union:0	"Fünf Rassen unter einer Union"
MCK_five_race_under_one_union_desc:0	"Angesichts der vielfältigen ethnischen Zugehörigkeit in unserem Reich können wir sagen, dass unser Prinzip "Fünf Rassen unter einer Union" angemessen repräsentiert wird."
MCK_showa_steel_mill:0	"Showa-Stahlwerk"
MCK_showa_steel_mill_desc:0	"Showa Steel Work ist ein wichtiger Teil unserer Branche. Durch weitere Verbesserungen können wir mehr Gewinn aus der örtlichen Eisenlagerstätte ziehen."
MCK_showa_steel_mill2:0	"Lizenzieren Sie den Krupp-Renn-Prozess"
MCK_showa_steel_mill2_desc:0	"Im Rahmen des neuen Geschäftsplans lizenzierte Shōwa Steel das Krupp-Renn-Verfahren von deutschen Stahlherstellern und schickte Mitarbeiter zur Schulung nach Deutschland. Von Krupp erhaltene Ausrüstung wurde installiert, wodurch die Produktionseffizienz erheblich gesteigert wurde."
MCK_support_aikawa_yoshisuke:0	"Unterstütze Aikawa Yoshisuke"
MCK_support_aikawa_yoshisuke_desc:0	"Der japanische Industrielle Aikawa Yoshisuke schlägt einen Plan vor, der die Schaffung einer staatlich kontrollierten Industrieeinheit zur Verbesserung der Mandschukuo-Industrie vorsieht, im Gegensatz zu Hoshino Naokis syndikalistischer Vision, bei der das Militär Monopole eines Unternehmens pro Branche zuweist."
MCK_support_naoki_hoshino:0	"Unterstützt Hoshino Naoki"
MCK_support_naoki_hoshino_desc:0	"Hoshino Naoki hat sich eine syndikalistische Zukunft für unsere Branche vorgestellt, in der das Militär Monopole von einem Unternehmen pro Branche zuteilen wird. Ein solcher Plan würde dem Militär großen Nutzen bringen, aber der zivile Sektor wird ignoriert."
MCK_request_zaibatsu_investment_on_industry:0	"Zaibatsu-Investition in die Industrie"
MCK_request_zaibatsu_investment_on_industry_desc:0	"Mit der Finanzierung durch Zaibatsu hat sich unsere Branche nun in jeder Hinsicht verbessert."
MCK_aluminium_deposit_in_liaoning_desc:0	"Bei einer aktuellen Prospektion wurde in Liaoning ein großes Vorkommen von Aluminiummineralien entdeckt. Solche Nachrichten werden sicherlich mehr Investoren aus Japan anziehen und unsere Branche weiter verbessern."
MCK_manchu_society_for_light_metal:0	"£tech_mod Manchu Society For Light Metal"
MCK_manchu_society_for_light_metal_desc:0	"Um das Aluminiumvorkommen in Liaoning so weit wie möglich auszubeuten, soll eine spezielle Gruppe zur Gewinnmaximierung gegründet werden."
MCK_prepare_for_war_desc:0	"Angesichts der zunehmenden Spannungen in unserer Umgebung sind Kriege vorprogrammiert. Unsere Nation muss auf das vorbereitet sein, was danach kommt, entweder um zu überleben oder um unseren Anteil an der Beute zu sichern."
MCK_for_the_emperor:0	"Für den Kaiser"
MCK_expand_military_district:0	"Militärbezirk erweitern"
MCK_manzhouli_secret_meeting:0	"Geheimes Treffen in Manzhouli"
MCK_restore_the_empire_desc:0	"Der verräterische Yuan Shi-kai hat den Kaiser während der Xinhai-Revolution zur Abdankung verleitet und die Gebiete an die abscheuliche Republik China verloren. Nachdem das Imperium nun zurückgekehrt ist, werden diese Gebiete an ihren rechtmäßigen Besitzer zurückgegeben!"
MCK_restore_the_old_frontier_desc:0	"Da die Zentralebene nun unter Kontrolle ist, besteht der nächste Schritt im Plan darin, die verlorenen Außengebiete zurückzugewinnen."
MCK_revive_zongli_yamen:0	"£tech_mod Zongli Yamen wiederbeleben"
MCK_revive_zongli_yamen_desc:0	"Die Zongli Yamen waren eine Organisation, die hauptsächlich für die Außenpolitik und den technologischen Fortschritt des Qing-Reiches zuständig war. Wenn das Imperium mit den Westmächten konkurrieren soll, wird die Zongli Yamen ein unverzichtbarer Teil davon sein."
MCK_if_aikawa:0	"\nWenn §YAikawa Yoshisuke§! in der Regierung ist, gewähren Sie außerdem den folgenden Effekt:\n"
MCK_if_naoki:0	"\nWenn §YHoshino Naoki§! in der Regierung ist, gewähren Sie außerdem den folgenden Effekt:\n"
MCK_if_aikawa_random_ic_in_state:0	"Baue §Y1 Zivilfabrik§! in einem zufällig kontrollierten Zustand.\n"
MCK_industrial_effort_3:0	"Bauaufwand III"
MCK_industrial_effort_3_desc:0	"Der Ausbau unseres Infrastrukturnetzwerks hat unsere Baukapazitäten deutlich verbessert."
MCK_if_aikawa_random_ic_infra_in_state:0	"Bauen Sie §Y1 zivile Fabrik§! und §Ymaximale Infrastruktur§! in einem zufällig kontrollierten Zustand.\n"
MCK_if_naoki_s:0	"\nWenn §YHoshino Naoki§! in der Regierung ist, gewähren Sie außerdem die folgenden Effekte:\n"
MCK_has_partisan_tt:0	"Hat Nationalgeist §YDongbei-Partisanen§!"
MCK_no_partisan_tt:0	"Hat keinen Nationalgeist §YDongbei Partisans§！"
MCK_secret_recuitment:0	"Geheime Rekrutierung"
MCK_vassal_tt:0	"Besitzt alle Staaten in der folgenden Region:\n §YMandschurei§!\n §YNordchina§!\n §YOstchina§!\n §YWestchina§!\n §YQinghai (außer [601.GetName] )§!\n §YSüdchina (außer [729.GetName], [728.GetName] und [326.GetName])§!"
FIN_prepare_for_winter:5	"Bereiten Sie sich auf den Winter vor"
FIN_prepare_for_winter_desc:5	"Es liegen zweifellos schwierige Zeiten vor uns. Angesichts ehemaliger Feinde im Osten, wachsender Spannungen im Süden und Bedrohungen unserer Lebensweise aus dem Ausland muss sich unsere Regierung darauf einigen, wie wir das finnische Volk am besten schützen können, und zwar schnell."
FIN_rapala:0	"Rapala"
FIN_rederi:0	"Rederi Ab Sally"
FIN_rederi_desc:0	""
FIN_rethink_front:0	"Frontlinien neu denken"
FIN_rethink_front_desc:0	""
FIN_vaisala:0	"Vaisala Oyj"
FIN_vaisala_desc:0	"Ein Elektronikunternehmen namens Vaisala ist im letzten Jahrzehnt exponentiell gewachsen. Vielleicht ist es an der Zeit, dass wir uns an sie wenden und sie damit beauftragen, uns bei der Entwicklung unserer Elektroniktechnologie zu unterstützen."
FIN_suunto_oy:0	"Suunto Oy"
FIN_military_production:0	"Alte Fabrikrenovierung"
FIN_store_fuel_desc:0	"Wir sollten Treibstoffreserven für militärische Operationen aufbauen und uns gegen feindliche Blockaden absichern."
FIN_prepare_for_war_desc:5	"Wir können es uns nicht leisten, im Falle einer ausländischen Invasion unvorbereitet zu sein. Es ist besser, militärische Ausrüstung zu bauen und nie zu benutzen, als sie nicht zu haben, wenn sie am dringendsten benötigt wird."
FIN_stockpile_rations_desc:5	"Ein harter Winter bedeutet weniger Nahrung für unser Volk und, was vielleicht noch wichtiger ist, für unsere Truppen. Wenn unsere Männer unsere glorreiche Nation verteidigen sollen, müssen wir unsere Infrastruktur verbessern."
FIN_imitate_sweden_desc:5	"Wir sollten unseren Nachbarn nacheifern und versuchen, Allianzen zu schmieden, um unsere gemeinsamen Interessen zu schützen."
FIN_expand_the_mines_desc:5	"Die Minen im Norden sind reich an Ressourcen. Wenn wir uns entscheiden, in sie zu investieren, könnten wir mehr Ressourcen für den Export oder den heimischen Gebrauch gewinnen."
FIN_wolf_divisions:5	"Wolfsdivisionen"
FIN_wolf_divisions_desc:5	"Da unsere Armee sowohl an Größe als auch an Stärke zunimmt, sollten wir anfangen, uns auf aggressivere Taktiken zu konzentrieren. Unsere Truppen sind nicht mehr nur eine Verteidigungsmacht."
FIN_the_karjala_agreement:5	"Das Karjala-Abkommen"
FIN_southern_foothold:5	"Südlicher Fußabdruck"
FIN_theft_and_learning:5	"Diebstahl und Lernen"
FIN_theft_and_learning_desc:5	"Dank früherer Kriegseinsätze sind wir noch immer im Besitz vieler erbeuteter Panzer. Wenn wir uns mehr auf diese "geliehenen" Panzer konzentrieren, können wir das gesamte Forschungsprojekt sowohl billiger als auch schneller machen!"
FIN_aviation_effort:5	"Anstrengungen in der Luftfahrt"
FIN_aviation_effort_tt:5	"Nicht genug Bauplätze für §YLuftwaffenstützpunkt§!"
FIN_aviation_effort_desc:5	"Nirgendwo ist der technologische Fortschritt so rasant wie in der Luftkriegsführung. Die Luftfahrt ist ein Bereich, den jede moderne Nation beherrschen muss."
FIN_fighter_focus:5	"Schwerpunkt Jagdflugzeuge"
FIN_fighter_focus_desc:5	"Die Luftkämpfe des Großen Krieges sind noch nicht vorbei. Wenn wir bei der Entwicklung von Kampfflugzeugen die Nase vorn haben, werden wir in Zukunft einen Vorteil haben."
FIN_bomber_focus:5	"Schwerpunkt Bomber"
FIN_aviation_effort_2_desc:5	"Weitere Fortschritte in der Luftfahrt werden notwendig sein, um unsere Luftwaffe gut mit anderen Teilstreitkräften zu integrieren."
FIN_rocket_effort_desc:5	"Raketen- und Düsentriebwerke ermöglichen sowohl für unbemannte als auch für bemannte Schiffe nie dagewesene Geschwindigkeiten. Die Vorreiterrolle bei diesen Technologien wird es uns ermöglichen, den Feind zu überrumpeln."
FIN_naval_effort:5	"Marineanstrengungen"
FIN_naval_effort_desc:5	"Der Ausbau unserer Marine sollte unsere Priorität sein. Weisen Sie alle verfügbaren Ressourcen für neue Werften und die Erforschung von leichten Überwasserschiffen zu."
FIN_flexible_navy:5	"Flexible Marine"
FIN_flexible_navy_desc:5	"Wenn wir die Seekriegsführung neu erfinden, um den Fortschritten in der U-Boot-Technologie Rechnung zu tragen, können wir effizient gegen feindliche Konvois vorgehen."
FIN_large_navy:5	"Große Marine"
FIN_large_navy_desc:5	"Die Anpassung unserer Marinedoktrinen an große Schiffe und die Gewährleistung der Sicherheit unserer Handelskonvois wird uns viel darüber lehren, welche Art von Schiffen wir brauchen."
FIN_submarine_effort:5	"U-Boot-Einsatz"
FIN_submarine_effort_desc:5	"Die U-Boot-Kriegsführung ist die aufregendste Entwicklung in der Marine seit der Erfindung des Torpedoboots. Wir täten gut daran, uns nicht nur vor U-Booten zu schützen, sondern sie auch gegen feindliche Schiffe einzusetzen."
FIN_cruiser_effort:5	"Einsatz von Kreuzern"
FIN_cruiser_effort_desc:5	"Bevor wir in die moderne Schlachtschiffforschung einsteigen, müssen die kleineren Kreuzer ersetzt werden."
FIN_destroyer_effort:5	"Zerstörer Bemühungen"
FIN_destroyer_effort_desc:5	"Durch das Studium der Konstruktion und des strategischen Einsatzes von U-Booten haben wir auch gelernt, wie wir diesen Strategien begegnen können. Zerstörer werden dabei eine entscheidende Rolle spielen."
FIN_capital_ships_effort:5	"Aufwand für Großkampfschiffe"
FIN_capital_ships_effort_desc:5	"Die Nation mit den meisten Schlachtschiffen wird die Weltmeere beherrschen. Schlachtschiffe und Flugzeugträger stehen für die alte und die neue Überlegenheit der Seestreitkräfte."
FIN_further_artillery_support:5	"Weitere Artillerieunterstützung"
FIN_further_artillery_support_desc:5	"Die Artillerieunterstützung hat sich für unsere Armeen als unschätzbar erwiesen. Die weitere Verbesserung und der Einsatz neuer Technologien sollte oberste Priorität haben, um noch mehr Leben unserer Landsleute zu retten."
FIN_fortress_aland:5	"Festung Åland"
FIN_fortress_aland_desc:5	"Durch die Befestigung der Insel können wir sie in einen beeindruckenden Marinestützpunkt verwandeln. Der Ausbau der Marinewerften wird uns auch die Mittel an die Hand geben, um eine Überlegenheit aufzubauen und zu erhalten."
FIN_marines_and_landing_craft:5	"Marineinfanterie und Landungsboote"
FIN_marines_and_landing_craft_desc:5	"Kriege werden nicht allein durch Seemacht gewonnen; wir müssen auch in der Lage sein, unsere Armeen über die Wellen zu transportieren und sie sicher an Land zu bringen..."
FIN_paratroopers_and_air_bases:5	"Fallschirmjäger und Luftwaffenstützpunkte"
FIN_paratroopers_and_air_bases_desc:5	"Kriege werden nicht allein durch Flugzeuge gewonnen; wir müssen auch in der Lage sein, unsere Armeen über den Himmel zu transportieren und sie sicher hinter die feindlichen Linien zu bringen..."
FIN_flying_lottas:5	"Fliegende Lottas"
FIN_flying_lottas_desc:5	"Während anderswo im Lande von einer "Lotta Svärd"-Organisation für Hilfskräfte die Rede ist, hat auch die Luftwaffe begonnen, über die Einbeziehung von Frauen zu diskutieren. Die finnischen Damen haben ihre Entschlossenheit unter Beweis gestellt, und die meisten Führungskräfte sind bereit, sie in die Reihen unserer Piloten aufzunehmen."
FIN_rethink_iso:0	"Isolation neu überdenken"
FIN_rethink_iso_desc:0	""
FIN_military_agreements:0	"Militärabkommen mit dem Reich"
FIN_military_agreements_desc:0	""
FIN_winter_base:0	"Winter Basis"
FIN_winter_base_desc:0	""
FIN_continuation_war:0	"Der Fortsetzungskrieg"
FIN_support:0	"Verbessern Sie die Unterstützung"
FIN_support_desc:0	""
FIN_flee_karjala:0	"Flucht aus Karjala"
FIN_flee_karjala_desc:0	""
FIN_recruitment:0	"Rekrutierungsaufwand"
FIN_recruitment_desc:0	"Unsere Verteidigungskräfte brauchen dringend mehr Arbeitskräfte. Wir sollten unser Netzwerk an Rekrutierungsbüros erweitern, um mehr junge Männer zur Rekrutierung zu ermutigen."
winter_over:0	"Der Winterkrieg ist beendet"
finland.17.t:5	"Einladung zur Zweiten Kalmarer Union"
finland.17.d:5	"In dem Bestreben, den Norden zu stärken und das mögliche Wiederaufleben des aggressiven Expansionismus aus dem Osten und Süden einzudämmen, hat Finnland darum gebeten, dass wir uns ihm in einem Bündnis anschließen, das diese Nationen zusammenbringen soll."
finland.17.a:5	"Sehr gerne. Die Kalmarer Union muss wiederaufgebaut werden."
finland.17.b:5	"[Root.GetName] geht seinen eigenen Weg."
finland.18.t:5	"[From.GetName] tritt der Zweiten Kalmarer Union bei"
finland.18.d:5	"Unser Plan, eine Skandinavische Union zu gründen, ist erfolgreich. [From.GetLeader] befürwortet unsere Bemühungen und hat unsere Einladung zu einem Bündnis angenommen."
finland.18.a:5	"Wir sind dem Wiederaufbau der Kalmarer Union einen Schritt näher gekommen."
finland.19.t:5	"[From.GetName] lehnt die Zweite Kalmarer Union ab"
finland.19.d:5	"Trotz unserer Bemühungen, die Zweite Kalmar-Union zu unterstützen, ist unser jüngster Versuch, eine der Nationen zu erreichen, auf Skepsis gestoßen. [From.GetLeader] hat sich geweigert, dem Bündnis beizutreten, vielleicht weil sie an unseren Motiven zweifelt oder weil sie befürchtet, dass eine zu enge Verbindung mit uns sie zur Zielscheibe machen würde."
finland.19.a:5	"Sie könnten bereits ein Ziel sein, soweit sie wissen!"
finland.29.t:5	"Großbritannien akzeptiert Bündnisanfragen"
finland.29.d:5	"Die Geschichte hat gezeigt, wie viel erreicht werden kann, wenn große Nationen Seite an Seite stehen. Wir sind stolz darauf, Sie nicht nur als Freunde, sondern als Verbündete begrüßen zu dürfen. Gemeinsam werden wir ein strahlendes Leuchtfeuer der Freiheit in einer Welt sein, die von der Dunkelheit der Unterdrückung heimgesucht wird!'\n\nUnsere Bitte, Großbritannien als Verbündeten beizutreten, wurde angenommen. Wir können in den vor uns liegenden turbulenten Zeiten auf ihre volle Unterstützung zählen."
finland.29.a:5	"Gemeinsam werden wir die Linie halten!"
finland.30.d:5	"Während wir in der Vergangenheit gute Beziehungen hatten, können wir eine Eskalation der Konflikte jenseits des Kanals nicht riskieren. Deutschland hat sich unser Vertrauen durch die Einhaltung unseres Flottenpaktes verdient, und wir haben keinen Grund, die Sowjetunion zu verärgern. Wir werden uns verteidigen, wenn sich das Feuer ausbreitet, wir werden nicht riskieren, die Flammen zu schüren. Frieden muss immer das Ziel jeder demokratischen Nation sein.'\n\nnser Ersuchen, Großbritannien als Verbündeten beizutreten, wurde abgelehnt. Die britische Regierung ist nicht gewillt, Deutschland oder die Sowjetunion weiter zu verärgern, und wird den derzeitigen Frieden nicht gefährden."
finland.30.a:5	"Noch eine Nation vergisst Finnland. Wir werden es ihnen zeigen!"
finland.25.t:5	"Finnland will sich den Alliierten anschließen"
finland.25.d:5	"Die Welt wird immer unsicherer. Großbritannien und Finnland bleiben Bastionen der Demokratie und Freiheit in Europa, und Finnland schlägt nun vor, sich den Alliierten anzuschließen."
finland.25.a:5	"Ja"
finland.25.b:5	"Nein"
finland.31.t:5	"Deutschland nimmt das Ersuchen um einen Bündnispartner an"
finland.31.d:5	"Die Geschichte hat gezeigt, wie viel erreicht werden kann, wenn große Nationen Seite an Seite stehen. Wir sind stolz darauf, Sie nicht nur als Freunde, sondern auch als Mitglieder der verbündeten Achse willkommen zu heißen. Gemeinsam werden wir Ordnung in eine Welt bringen, die von der Dunkelheit des Kommunismus und der Schwäche der Alliierten bedroht ist!'\n\nUnsere Bitte, Deutschland als Achsenmitglied beizutreten, wurde angenommen. Wir können in den kommenden turbulenten Zeiten auf ihre volle Unterstützung zählen."
finland.31.a:5	"Gemeinsam werden wir die Linie halten!"
finland.32.t:5	"Deutschland lehnt Antrag auf Bündnispartnerschaft ab"
finland.32.d:5	"Wir begrüßen zwar Ihr Ersuchen, unserer glorreichen Fraktion beizutreten, aber wir haben keinen Grund, die Sowjetunion zu verärgern und die Alliierten weiter zu provozieren, nur weil ein unbedeutendes Land dabei ist. Unser Ersuchen, der Achse beizutreten, wurde abgelehnt. Die deutsche Regierung ist nicht gewillt, die Sowjetunion oder eine andere wichtige Fraktion weiter zu verärgern, und wird den gegenwärtigen Frieden nicht gefährden."
finland.32.a:5	"Noch eine Nation vergisst Finnland. Wir werden es ihnen zeigen!"
finland.333.t:5	"Finnland will sich der Achse anschließen"
finland.333.d:5	"Die Welt wird immer unsicherer. Deutschland und Finnland sind nach wie vor Bollwerke des Nationalstolzes und der militärischen Stärke in Europa, und nun schlägt Finnland vor, sich der Achse anzuschließen."
finland.333.a:5	"Ja"
finland.333.b:5	"Nein"
finland.355.t:5	"Finnland will der Komintern beitreten"
finland.355.d:5	"Die Welt wird immer unsicherer. Die Sowjetunion und Finnland sind nach wie vor eine der wenigen Bastionen der proletarischen Macht in dieser Welt. Finnland schlägt nun vor, der Komintern beizutreten und unsere karelischen Gebiete im Tausch gegen Karjala zu erhalten.\nie sollen wir antworten?"
finland.355.a:5	"Ja"
finland.355.b:5	"Nein"
finland.33.t:5	"Die Sowjetunion nimmt das Ersuchen des Verbündeten an"
finland.33.d:5	"Die Geschichte hat gezeigt, wie viel wir zu verlieren haben, wenn unsere Länder die Zusammenarbeit verweigern. Wir sind stolz darauf, Sie nicht nur als Freunde, sondern als Kameraden begrüßen zu dürfen. Gemeinsam werden wir für Gleichheit und Gerechtigkeit sorgen, die von der Finsternis des Kapitalismus und der faschistischen Gesinnung bedroht sind!'\n\nUnser Antrag auf Beitritt zur UdSSR als Mitglieder der Komintern wurde angenommen. Wir können in den kommenden turbulenten Zeiten auf ihre volle Unterstützung zählen."
finland.33.a:5	"Gemeinsam werden wir der Revolution helfen!"
finland.34.t:5	"Sowjetunion lehnt Antrag der Verbündeten ab"
finland.34.d:5	"Wir begrüßen Ihr Ersuchen, sich unserer glorreichen Revolution anzuschließen, aber wir haben keinen Grund, wegen eines einzigen unbedeutenden Landes die Spannungen zu erhöhen und unsere Beziehungen zu den anderen Großmächten zu gefährden. Unser Ersuchen, der Komintern beizutreten, wurde abgelehnt. Die sowjetische Regierung ist nicht gewillt, die Sowjetunion oder die Alliierten zu verärgern oder zu riskieren, andere Fraktionen zu provozieren, und wird den derzeitigen Frieden nicht gefährden."
finland.34.a:5	"Wieder einmal vergisst eine Nation Finnland. Wir werden es ihnen zeigen!"
finland.920.t:5	"Großbritannien akzeptiert das finnische Bündnis"
finland.920.d:5	"Finnland hat unter Berufung auf nicht näher bezeichnete Bedrohungen für die Stabilität Europas um ein formelles Bündnis mit Großbritannien ersucht. Heute wurde das Ersuchen vom britischen Parlament gebilligt, und Finnland ist der [ENG.GetFactionName] beigetreten."
finland.920.a:5	"Wir stehen zusammen."
finland.920.b:5	"Sie bereiten sich auf das Schlimmste vor."
finland.920.c:5	"Sie tun sich zusammen wie in die Enge getriebene Ratten."
finland.920.e:5	"Großbritannien hat sein Schicksal aufgegeben."
finland.921.t:5	"Großbritannien lehnt Bündnis mit Finnland ab"
finland.921.d:5	"In einer überraschenden Wendung hat das britische Parlament heute den Antrag von [FIN.GetName] auf ein formelles Bündnis zwischen den beiden Nationen abgelehnt. Begründet wurde dies damit, dass man das ohnehin fragile Gleichgewicht auf dem europäischen Kontinent nicht stören wolle. \nie finnische Regierung hat dies als politischen Schachzug verurteilt, der die finnische Sicherheit den britischen Interessen opfert."
finland.921.a:5	"Sie hätten netter fragen sollen."
finland.921.c:5	"Ein dunkler Tag für Finnland."
finland.922.t:5	"Die Zweite Kalmarer Union"
finland.922.d:5	"In dem Bestreben, eine gemeinsame Front gegen gemeinsame Feinde zu bilden, hat [From.GetName] Schweden das Angebot unterbreitet, die \"Kalmarer Union\" zu reformieren, um sich gegen gemeinsame Feinde zu vereinigen. Der britische Premierminister bot zwar einen Platz in dem Verteidigungspakt an, stellte aber klar, dass Großbritannien das Bündnis nicht als "nützlich für den Schutz der europäischen Freiheit" betrachtet. \n\nFinnland hat dennoch diplomatische Beziehungen zu anderen Nationen aufgenommen, die sich bedroht fühlen könnten, und fördert die Einheit, um das diplomatische Gleichgewicht in Skandinavien aufrechtzuerhalten und zukünftige Konflikte zu verhindern. Es wird sich zeigen, ob sie Erfolg haben werden."
finland.922.a:5	"Kommen Sie also später nicht heulend zu uns!"
finland.922.b:5	"Länge leve Kalmarunionen!"
finland.922.e:5	"Skandinavien muss sich gegen faschistische und kommunistische Aggressoren vereinen!"
finland.922.f:5	"Ein Zeichen für wachsende europäische Spannungen."
finland.928.a:5	"Wir stehen zusammen."
finland.928.b:5	"Sie bereiten sich auf das Schlimmste vor."
finland.928.c:5	"Sie schließen sich zusammen wie in die Enge getriebene Ratten."
finland.928.e:5	"Deutschland hat sein Los verworfen."
finland.929.t:5	"Deutschland lehnt Bündnis mit Finnland ab"
finland.929.d:5	"In einer überraschenden Wendung hat der deutsche Bundeskanzler heute den Antrag von [FIN.GetName] auf ein formelles Bündnis zwischen den beiden Nationen abgelehnt. Zur Begründung hieß es, man wolle das ohnehin fragile Gleichgewicht auf dem europäischen Kontinent nicht stören. \nie finnische Regierung hat dies als politischen Schachzug verurteilt, der die finnische Sicherheit den deutschen Interessen opfert."
finland.929.a:5	"Sie hätten netter fragen sollen."
finland.929.b:5	"Die demokratischen Narren sind gespalten."
finland.929.c:5	"Ein dunkler Tag für Finnland."
finland.998.t:5	"Das Karjala-Abkommen"
finland.998.d:5	"In dem Bestreben, die beiden Nationen zu versöhnen, hat Finnland um ein formelles Bündnis mit der Sowjetunion gebeten, wobei es sich auf nicht näher bezeichnete Bedrohungen für die Stabilität Europas und seine eigene Sicherheit beruft. Um die Spannungen weiter abzubauen, hat Finnland zugestimmt, Karjala an die Sowjetunion abzutreten und im Gegenzug die Staaten Murmansk und Onega zu erhalten, in denen eine große Anzahl finnischer Minderheiten lebt.\n\nHeute wurde das Abkommen vom Ministerpräsidenten der Sowjetunion gebilligt, und Finnland ist der [SOV.GetFactionName]"
finland.998.a:5	"Wir stehen zusammen."
finland.998.b:5	"Sie bereiten sich auf das Schlimmste vor."
finland.998.c:5	"Sie schließen sich zusammen wie in die Enge getriebene Ratten."
finland.998.e:5	"Die UdSSR hat ihr Los gestreut."
finland.999.t:5	"Sowjetunion lehnt Karjala-Abkommen ab"
finland.999.d:5	"Überraschend hat der sowjetische Premierminister den Antrag von [FIN.GetName] auf ein formelles Bündnis zwischen den beiden Nationen abgelehnt. Der Grund dafür war, dass das Karjala-Abkommen nicht als für beide Seiten vorteilhaft angesehen wurde, sondern lediglich als eine Möglichkeit, Finnlands Grenzen zu erweitern"
finland.999.a:5	"Sie hätten netter fragen sollen."
finland.999.b:5	"Die kommunistischen Narren sind gespalten."
finland.999.c:5	"Ein schwarzer Tag für die Revolution."
finland.952.t:5	"Finnland erhebt Ansprüche auf estnisches Territorium"
finland.952.d:5	"In einer Ansprache an die finnische Bevölkerung entlang der Ostseeküste hat [From.GetLeader] angekündigt, dass [From.GetName] das finnischsprachige Gebiet in [EST.GetName] als rechtmäßigen Teil von [From.GetName] betrachtet. [From.GetLeader] verwies auch auf die strategische Bedeutung der estnischen Region und behauptet, dass durch die Vereinigung der beiden Länder unter dem finnischen mehr Menschen vor größeren Bedrohungen aus dem Ausland geschützt werden können. \nine offizielle Erklärung untermauerte diese Behauptungen und machte deutlich, dass [From.GetName] bereit ist, das Gebiet notfalls mit Gewalt zu erobern."
finland.952.a:5	"Das ist estnisches Land, nicht finnisches!"
finland.952.b:5	"Sie stören das ohnehin fragile Gleichgewicht in der Region."
finland.952.c:5	"Diese Gebiete scheinen eher finnisch als estnisch zu sein."
FIN_gwtank:5	"Wir können jetzt Panzerdivisionen aus dem Großen Krieg einsetzen."
FIN_fighters:5	"Wir können jetzt frühe Kampfflugzeuge einsetzen \n"
FIN_bomber:5	"Wir können jetzt frühe Bomberflugzeuge einsetzen \n"
FIN_savofort:5	"Hinzufügen von 15 Festungen an der sowjetischen Grenze \n"
FIN_karjalafort:5	"Hinzufügen von 9 Festungen an der sowjetischen Grenze"
FIN_cedeland:5	"Finnland wird Karjala an die Sowjetunion abtreten im Austausch für Murmansk, Onega und eine Mitgliedschaft in der Komintern. \n"
civilian_kitchens_idea:5	"Zivile Feldküchen"
civilian_kitchens_idea_desc:5	"Finnland hatte ein großes Defizit bei der Versorgung mit Zelten, Öfen und anderen Ausrüstungsgegenständen, doch dank der freiwilligen Helfer aus der Zivilbevölkerung, die Küchen einrichteten und die Truppen im Feld mit Lebensmitteln versorgten, konnten viele Todesfälle vermieden werden."
FIN_motitus_tactics:5	"Motti-Taktik"
FIN_motitus_tactics_desc:5	"Motti ist der finnische Militärjargon für eine völlig eingekesselte feindliche Einheit. Ein Motti ist ein doppeltes Umfassungsmanöver, bei dem die Fähigkeit leichter Truppen, sich über unwegsames Gelände zu bewegen, genutzt wird, um feindliche Truppen auf einer Straße einzukesseln. Diese Taktik ist besonders nützlich für zahlenmäßig stark unterlegene, aber mobile Truppen, vor allem im verschneiten Klima Finnlands."
FIN_white_guard_idea:5	"Die Weiße Garde"
FIN_white_guard_idea_desc:5	"Im Winterkrieg war die Weiße Garde für die Durchführung der Mobilmachung zuständig. Ein Viertel der Truppenstärke des Feldheeres bestand aus Mitgliedern der Garde. Dieser Beitrag erwies sich als wichtig, da die Gardisten das am besten ausgebildete und ausgerüstete Personal in einer Armee waren, der es selbst an der Grundversorgung mangelte."
FIN_mannerheim_legacy_idea:5	"Mannerheims Vermächtnis"
FIN_communism_banned_desc:5	"Der Aufstieg rechtsradikaler Parteien in Finnland und die zunehmend angespannten Beziehungen zur UdSSR haben dazu geführt, dass viele kommunistische Parteien in Finnland verboten wurden, vor allem die kominternfreundliche SKP."
defence_of_korea:5	"Letztes Gefecht in Korea"
defence_of_korea_desc:5	"Unsere Armee ist in der Defensive. Wir müssen verhindern, dass wir unsere Stellung auf dem asiatischen Festland verlieren. Wir können die Einheimischen im nördlichen Teil Koreas "zwangsverpflichten", uns eine Verteidigungslinie von Pjöngjang und entlang des gesamten Flusses bis zur Ostküste Koreas zu errichten."
JAP_Northern:5	"Doktrin der Norderweiterung"
JAP_Southern:5	"Doktrin der Süderweiterung"
JAP_Coup:5	"Radikale Fraktionen in der IJA"
JAP_North_Ports:5	"Ausbau der Häfen"
JAP_DMZ_desc:5	"Es ist an der Zeit, mit dem Aufbau unserer Truppen an der sowjetischen Grenze zu beginnen. Zunächst müssen wir die Infrastruktur vor Ort verbessern."
JAP_military_science:5	"Militärwissenschaft"
POR_desenvolver_o_interior:5	"Entwicklung des Inneren"
POR_construir_fabricas:5	"Fabriken bauen I"
POR_construir_fabricas_desc:5	"Die portugiesische Regierung hat versprochen, die Produktion in Portugal zu steigern. Es ist nun an der Zeit, dass sie diese Versprechen einhält."
POR_construir_fabricas_2_desc:5	"Wenn Portugal wieder eine Großmacht werden soll, müssen wir mehr Waffen produzieren. So soll es sein."
POR_acores_desc:5	"Die Azoren sind eine strategische Inselgruppe im Atlantik. Wir müssen sie ausbauen, wenn wir die Kontrolle über den Atlantik erlangen wollen."
POR_acores_fort:5	"Befestigen Sie die Azoren"
POR_acores_fort_desc:5	"Die Azoren sind eine strategische Inselgruppe im Atlantik. Wir müssen sie befestigen, wenn wir die Kontrolle über den Atlantik erlangen wollen."
POR_madeira:5	"Madeira ausbauen"
POR_extra_tech_slot:5	"£tech_mod Industrielle Forschung"
POR_extra_tech_slot_desc:5	"Zusätzliche Mittel für Wissenschaftler in unserem Land werden größere Forschungskapazitäten ermöglichen."
POR_minas_de_ferro:5	"Stahlminen von Aljustrel"
POR_minas_de_ferro_desc:5	"Die Stahlminen von Aljustrel waren während des Zweiten Weltkriegs eine wichtige Bergbauanlage. Sie wurden 1847 nach der Entdeckung einer Stahlquelle gegründet."
POR_minas_de_cromio_desc:5	"Die Chromminen von Grandola waren im 2. Weltkrieg ein wichtiger Bergbaubetrieb. Sie wurden im Jahr 1900 nach der Entdeckung einer Chromquelle gegründet."
POR_prospect_for_oil:5	"Das Ultramar"
POR_prospect_for_oil_desc:5	"Wir müssen uns rüsten und unsere Entwicklungspolitik auf die Kolonialgebiete ausdehnen. Die Ultramar war eine Bezeichnung für die portugiesischen Kolonien, als der Krieg gegen die portugiesischen Kolonien 1961 in Angola ausbrach. Dieser Krieg endete mit der Revolution von 1974."
POR_angola_refineries:5	"Bau von Raffinerien in Angola"
POR_angola_refineries_desc:5	"Um neue Ressourcen für unser Imperium zu sichern, müssen wir Raffinerien bauen, wenn möglich in mehreren Staaten. Wir beginnen jetzt mit Angola."
POR_timor:5	"Erschließen Sie Osttimor"
POR_timor_desc:5	"Timor ist eine Hochburg in Ozeanien. Es könnte eine gute Option sein, es zu entwickeln, damit wir unsere militärische Macht in der Region ausbauen können."
POR_angola_fabricas:5	"Angola Militärische Fabriken"
POR_angola_fabricas_desc:5	"Es ist ratsam, unsere afrikanische Bastion weiter auszubauen. Der Bau von Militärfabriken wird unser Militär stärken."
POR_timor_2:5	"Kautschuk auf Osttimor"
POR_timor_2_desc:5	"Wir haben auf Osttimor eine kleine Kautschukquelle entdeckt. Wir sollten eine Anlage zur Gewinnung dieser Ressource errichten."
POR_army_primacy:5	"Die portugiesische Armee"
POR_army_primacy_desc:5	"Eine starke Armee macht eine kämpferische Nation aus. Wir müssen unsere Armee sowohl in der Technik als auch in der Produktion von militärischer Ausrüstung weiterentwickeln."
POR_modernized_artillery:5	"Unterstützung von Waffen"
POR_modernized_artillery_desc:5	"Die Verbesserung unserer Artillerie- und Panzerabwehrausrüstung ist für unsere Armee unerlässlich."
POR_modernized_army:5	"Neue Armeetaktiken"
POR_modernized_army_desc:5	"Die Konzentration auf Landdoktrinen ist wichtig, ebenso wie Aufklärungskompanien."
POR_special_forces:5	"Spezialtruppen"
POR_special_forces_desc:5	"Wir brauchen Elitetruppen; Gebirgsjäger und Fallschirmjäger sollten unsere Priorität sein."
POR_armored_effort:5	"Panzerbestrebungen"
POR_armored_effort_desc:5	"Mit den Erkenntnissen aus der Mechanisierung unserer Infanterie können wir auch unsere gepanzerten Fahrzeuge verbessern."
POR_mare_nostrum:5	"Helden der See"
POR_mare_nostrum_desc:5	"In der Vergangenheit haben wir mit der Eroberung der Neuen Welt ein mächtiges Imperium geschmiedet. Jetzt werden wir uns wieder erheben."
POR_capital_ships:5	"Anstrengung der Großkampfschiffe"
POR_capital_ships_desc:5	"Die Nation mit den meisten Schlachtschiffen wird die Weltmeere beherrschen. Wir dürfen nicht zulassen, dass die Royal Navy uns im Mittelmeer unterlegen ist..."
POR_bomber_effort:5	"Bombereinsatz"
POR_bomber_effort_desc:5	"Die Zeiten, in denen Armeen Kriege gewinnen konnten, ohne auf den Himmel zu schauen, sind vorbei. Wir müssen unsere taktischen Bomber weiterentwickeln, um unseren Soldaten die notwendige Luftunterstützung zu geben."
POR_atlantic_fleet:5	"Atlantikflotte"
POR_atlantic_fleet_desc:5	"Sobald wir uns aus dem britischen Käfig befreit haben, müssen wir unsere Macht über die Ozeane ausdehnen. Dies muss unsere Priorität sein."
POR_marines_and_landing_craft:5	"Marineinfanterie und Landungsboote"
POR_marines_and_landing_craft_desc:5	"Kriege werden nicht allein durch Seemacht gewonnen; wir müssen auch in der Lage sein, unsere Armeen über die Wellen zu transportieren und sie sicher an Land zu bringen..."
POR_jet_engine_effort:5	"Bemühungen um Strahltriebwerke"
POR_jet_engine_effort_desc:5	"Portugal sollte dank der brillanten Arbeit von Secondo Campini bei der Entwicklung von Strahltriebwerken an vorderster Front stehen. Wir sollten ihm alle Mittel zur Verfügung stellen, die er benötigt, um seine Entwürfe für die Regio Aeronautica weiter zu verbessern."
POR_light_ship_effort:5	"Bemühungen um leichte Schiffe"
POR_light_ship_effort_desc:5	"Die Konvois zu unseren überseeischen Gebieten müssen geschützt werden. Wir müssen sowohl neue Doktrinen als auch modernere Zerstörer entwickeln."
POR_escort_effort:5	"Geleitschutzbemühungen"
POR_escort_effort_desc:5	"Wir sollten weitere Anstrengungen unternehmen, um unsere gefährdeten Geleitzüge im Atlantik zu schützen."
POR_sea_wolves:5	"Seewölfe"
POR_air_innovation_desc:5	"Moderne Kriege können nicht ohne die Beherrschung des Luftraums gewonnen werden. Wir müssen alles in unserer Macht Stehende tun, um die Luftwaffe zu entwickeln!"
POR_air_innovation_2:5	"Innovationen in der Luft II"
POR_air_innovation_2_desc:5	"Jeder Vorteil, den wir in der Luft gewinnen können, ist wertvoll. Wir sollten alle unsere Anstrengungen auf die Entwicklung unserer Kampfflugzeuge konzentrieren."
POR_naval_air_effort:5	"Luftangriffe der Marine"
POR_salazar:5	"Politische Spiele"
POR_salazar_desc:5	"Portugal ist immer eine Bühne des Machtkampfes. Lassen Sie uns damit etwas Macht gewinnen."
POR_collectivist_ethos:5	"Portugal zuerst"
POR_liberty_ethos:5	"Schützt unsere Freiheit"
POR_liberty_ethos_desc:5	"In dieser Zeit der ideologischen Fanatiker, die den menschlichen Geist zu ersticken suchen, werden wir die individuellen Freiheiten und die Freiheit schützen."
POR_militarism:5	"Militarismus"
POR_militarism_desc:5	"Diejenigen, die das Militär als notwendiges Übel betrachten, sind dazu verdammt, im Angesicht des Krieges zu zögern. Wir werden den Militarismus in unserer Kultur verankern, um ein Volk von Soldaten zu werden."
POR_political_correctness:5	"Politische Korrektheit"
POR_political_correctness_desc:5	"Menschen, die leicht kontroverse oder anderweitig peinliche Meinungen vertreten, scheinen besorgt zu sein, dass es eine weitreichende Verschwörung gegen sie gibt. Dies scheint eine ausgezeichnete Idee zu sein."
POR_neutrality_focus:5	"Schwerpunkt Neutralität"
POR_neutrality_focus_desc:5	"Während andere behaupten, es erfordere Mut und Weisheit, in einem globalen Konflikt Partei zu ergreifen, wissen wir, dass es mehr erfordert, sich zu verweigern."
POR_interventionism_focus:5	"Interventionismus"
POR_interventionism_focus_desc:5	"Wir schätzen die Freiheit aller Menschen, nicht nur die unserer eigenen Bürger. Wenn die Verhinderung von Tyrannei Krieg bedeutet, dann soll es so sein."
POR_military_youth:5	"Salazar-Jugend"
POR_military_youth_desc:5	"Organisationen zur Förderung von Disziplin und politischer Bildung der jungen Menschen in unserem Land werden Loyalität und Selbstaufopferung schon früh fördern."
POR_deterrence:5	"Abschreckung"
POR_deterrence_desc:5	"Wenn wir allein dastehen, nützt uns ein Krieg nur selten. Zum Glück wissen wir, dass die beste Verteidigung eine ist, die so bekannt ist, dass man sie nie anwenden muss."
POR_volunteer_corps:5	"Freiwilligenkorps"
POR_volunteer_corps_desc:5	"Unser Volk zu zwingen, für die Ideale der Freiheit zu sterben, wäre eine Übung in Ironie, aber die Schaffung von Mitteln für diejenigen, die Menschen im Ausland helfen wollen, ist es nicht."
POR_paramilitarism:5	"Para-Militarismus"
POR_paramilitarism_desc:5	"Militärische Grundsätze finden auch außerhalb des Militärs Anwendung. Mit der Entwicklung von halbmilitärischen Einheiten, die unsere Streitkräfte ergänzen, werden mehr Menschen eine militärische Ausbildung erhalten."
POR_indoctrination_focus:5	"Indoktrination"
POR_indoctrination_focus_desc:5	"Nachdem wir festgestellt haben, dass unsere Ideologie auf der Wahrheit beruht, kann sie als Wahrheit gelehrt werden. Bildung und Medien müssen diese Lektion widerspiegeln."
POR_foreign_expeditions:5	"Ausländische Expeditionen"
POR_foreign_expeditions_desc:5	"Da unsere Feinde bereit sind, im Namen ihrer Ideale in ferne Konflikte einzugreifen, müssen wir bereit sein, dasselbe für unsere Ideale zu tun."
POR_why_we_fight:5	"Warum wir kämpfen"
POR_why_we_fight_desc:5	"Die Welt wird immer unsicherer. Unser Volk muss die Grausamkeiten sehen, die von denen begangen werden, die nach Macht streben. Es ist an der Zeit, die Menschen für unsere Sache zu gewinnen und sicherzustellen, dass alle bereit sind, für unsere Freiheit zu kämpfen."
POR_political_commissars:5	"Politische Kommissare"
POR_political_commissars_desc:5	"Um sicherzustellen, dass unsere Politik in der militärischen Praxis befolgt wird, werden wir politisch ernannte Beamte in die militärischen Ränge einführen."
POR_internationalism_focus:5	"Álvaro Cunhal Ideen"
POR_internationalism_focus_desc:5	"Álvaro Barreirinhas Cunhal, der den Namen Álvaro Cunhal verwendete, war ein portugiesischer kommunistischer Revolutionär und Politiker. Er war einer der wichtigsten Gegner des diktatorischen Regimes des Estado Novo. Von 1961 bis 1992 war er Generalsekretär der Portugiesischen Kommunistischen Partei (PCP). Er war einer der sowjetfreundlichsten kommunistischen Führer Westeuropas und unterstützte häufig die Außenpolitik der Sowjetunion, unter anderem bei der Intervention in der Tschechoslowakei im Jahr 1968."
POR_nationalism_focus:5	"Ministerpräsident Salazar"
POR_policia_estado_desc:5	"Die PVDE, später Polícia Internacional e de Defesa do Estado, war eine portugiesische Sicherheitsbehörde, die während des Estado Novo-Regimes von António de Oliveira Salazar bestand. Formal waren die Hauptaufgaben der PIDE die Grenz-, Einwanderungs- und Auswanderungskontrolle sowie die innere und äußere Staatssicherheit. Sie wurde jedoch vor allem durch ihre politische Polizeiarbeit bekannt."
POR_befriend_spain:5	"Freundschaft mit Spanien"
POR_demand_ceuta:5	"Fordern Sie Ceuta von Spanien"
POR_demand_ceuta_desc:5	"Ceuta war im Jahr 1415 ein portugiesischer Staat. Wir haben es an Spanien verloren, als unser König Filipe II. den wahren Herrscher von Ceuta verriet. Wir müssen es für unsere Herrschaft zurückfordern."
POR_demand_rhodesia:5	"Fordern Sie Rhodesien von Großbritannien"
POR_demand_ceylon:5	"Fordern Sie Ceylon vom Vereinigten Königreich"
POR_demand_ceylon_desc:5	"Ceylon war gegen Ende des Jahrhunderts ein portugiesischer Staat. Wir haben es an Spanien verloren, als sie unseren schwachen König D. Carlos I. erpressten."
POR_ceuta_desc:5	"Ceuta ist eine strategische Bastion in Nordafrika. Wir müssen es sichern und entwickeln, wenn wir die Kontrolle über Afrika erlangen wollen."
POR_economic:0	"Gesetz zur wirtschaftlichen Erholung"
POR_economic_desc:0	""
POR_cork_export:0	"Kork-Exporte"
POR_cork_export_desc:0	""
POR_textiles:0	"Textilindustrie ausbauen"
POR_textiles_desc:0	""
ana_p:5	"ANA - Gesellschaft für Marineflugzeuge"
news.703.t:5	"Vereinigtes Königreich lehnt portugiesische Forderungen ab"
portugal.40.a:5	"Das Unvermeidliche akzeptieren..."
portugal.41.d:5	"Es ist uns gelungen, das Vereinigte Königreich von unserer wahrhaften Sache über Ceylon zu überzeugen. Sie haben zugestimmt, Ceylon der portugiesischen Herrschaft zu überlassen. Wenn wir unsere Karten richtig ausspielen, könnten wir dies nutzen, um unseren Einfluss auf dem afrikanischen Kontinent zu stärken."
portugal.41.a:5	"Wir begrüßen Ceylon"
news.706.t:5	"Die Achse wächst"
news.706.d:5	"Der Einfluss der Achsenmächte ist mit dem Beitritt Portugals zu dieser Fraktion gewachsen. Es gibt noch keinen Konsens darüber, welche Folgen dies langfristig für die geopolitische Stabilität haben wird."
news.706.o:5	"Wer hätte das gedacht?"
news.707.d:5	"Es wurde bekannt, dass Portugal der Achse beitreten möchte. Deutschland hat den Antrag jedoch mit der Begründung abgelehnt, dass dies in der gegenwärtigen Situation für beide Seiten kein kluger Schritt wäre."
news.707.o:5	"Vielleicht war das auch besser so."
portugal.20.b:5	"Sie sind auf sich allein gestellt"
portugal.22.d:5	"Unser Antrag auf Beitritt zur Komintern ist angenommen worden! Dieser Tag wird in Portugal noch lange in Erinnerung bleiben. In den kommenden Konflikten werden wir froh sein, diese neu gewonnenen Freunde an unserer Seite zu haben."
portugal.22.o:5	"Gemeinsam sind wir stark."
portugal.21.t:5	"Sowjets lehnen portugiesischen Antrag ab"
portugal.21.o:5	"Nun, dann werden sie eben keinen Schnaps bekommen."
news.708.t:5	"Die Komintern wächst"
news.708.d:5	"Der Einfluss der Komintern ist mit dem Beitritt Portugals zur Fraktion gewachsen. Welche Folgen dies langfristig für die geopolitische Stabilität haben wird, darüber herrscht noch keine Einigkeit."
news.708.o:5	"Wer hätte das gedacht?"
news.709.t:5	"Sowjets lehnen portugiesischen Antrag ab"
news.709.o:5	"Vielleicht war es auch besser so."
news.710.a:5	"Unsere Nationen stehen als Freunde zusammen."
news.710.b:5	"Es wird Frieden in Iberien herrschen."
news.710.c:5	"Es wird interessant sein, zu sehen, wo das endet."
australian_focus:5	"Nationaler Fokus Australien"
AST_UAP_desc:5	"Die Regierung von Lyon geht jetzt in das letzte Jahr ihrer zweiten Amtszeit. Wir sind zwar nicht ganz dort, wo wir gedacht haben, aber wir sind immer noch beliebt und das Commonwealth ist stabil."
AST_five_years_good_governance:5	"Fünf Jahre gute Regierungsführung"
AST_remember_the_emus:0	"Lernen Sie aus dem Großen Emu-Krieg"
AST_income_tax_assessment_act_desc:5	"Die Einkommenssteuergesetze unseres Landes sind sehr veraltet und von Großbritannien übernommen. Es gibt Tausende von Seiten mit Ergänzungsanforderungen und Gesetzen über walisische und schottische Schafe, die weniger als ein englisches Gesetz sind, das hier wirklich keine Relevanz hat. Es ist an der Zeit, die roten Zahlen zu rationalisieren. Wir wollen die Steuer sparen, die Kosten senken und unsere Steuergesetzgebung umschreiben, damit alle Australier ihre Steuern einfacher einreichen können und wir schneller bezahlt werden. Wir können sogar einige neue Steuererhöhungen einführen, um unsere Bilanz auszugleichen."
AST_manufacturing_led_recovery_desc:5	"Die Fertigung wird uns voranbringen."
AST_devalue_the_currency_desc:5	"Unsere Exportwirtschaft wurde durch die Auswirkungen der Weltwirtschaftskrise lahmgelegt. Unsere größten Handelspartner, die Vereinigten Staaten und Großbritannien, haben nicht mehr so ​​viele Waren von uns gekauft wie zuvor, was zu einem Einbruch der Exporte geführt hat. Durch eine Wertminderung des australischen Pfunds im Vergleich zu ihren Währungen vielleicht können wir sie dazu bewegen, australische Pfund zu kaufen."
companies_founded_tt:0	"Muss mindestens 5 §C-Gesellschaften§! oder die Nationale Börse gegründet haben"
AST_grain_export_focus:	"Kornkammer des Empire "
AST_recover_rabaul:	"Rabaul neu aufbauen"
destroyed_state:	"Zerstörter Zustand"
AST_national_security_act_desc:5	"Um es der Regierung besser zu ermöglichen, den Krieg zu führen, wird das Nationale Sicherheitsgesetz es der Regierung ermöglichen, abweichende Meinungen einzuschränken, die Wehrpflicht einzuführen, die Verbreitung "richtiger" Informationen voranzutreiben sowie einen besseren Übergang in den Kriegszustand zu ermöglichen. Im Gegensatz dazu 1914 wird Australien auf alle Eventualitäten vorbereitet sein."
AST_civil_constructional_corps_desc:5	"Das Civil Construction Corps (CCC) wird eine organisierte Arbeitskraft von Männern sein, die sich freiwillig melden oder eingezogen werden, um die für den Sieg erforderliche Kriegsinfrastruktur bereitzustellen."
AST_defence_act:5	"Verteidigungsgesetz (Bürgermilitärkräfte)"
AST_defence_act_desc:5	"Es ist klar geworden, dass unser Militär ... Schwierigkeiten hat, wenn es im Ausland eingesetzt wird. Sogar unsere regulären Streitkräfte sind durch den Mangel an Unterstützung und Ersatzkräften gelähmt, da viele professionelle Militäreinheiten auf Garnisonsgebieten in der Nähe von Australien verschwendet werden. Die Verteidigung (CMF ) Das Gesetz wird es uns ermöglichen, mit dem Einsatz der Miliz im Ausland zu beginnen, ihnen einen neuen Namen zu geben und ihre Doktrinen und Ausbildung weiter zu reformieren. Danach wird die australische Armee eine erstklassige Streitmacht sein, die in der Lage ist, es mit dem Kampfgeist jedes Feindes aufzunehmen."
AST_advisory_war_council:5	"Der Beratende Kriegsrat"
AST_advisory_war_council_desc:5	"Da eine Regierung der nationalen Einheit wie die des Vereinigten Königreichs in unserer politischen Situation nicht realisierbar ist, werden wir einen Beratenden Kriegsrat bilden, der sich aus allen großen Parteien zusammensetzt, die im Bundesparlament sitzen. Es wird keinen geben Wir haben zwar konkrete Macht, aber das bedeutet, dass wir damit beginnen können, Probleme zu lösen und Fragen anzusprechen, bevor sie dem Parlament vorgelegt werden, was den Gesetzgebungsprozess beschleunigen sollte."
AST_womens_land_army:5	"Frauen-Landarmee"
AST_womens_land_army_desc:5	"Australische Männer werden an der Front benötigt. Wir müssen unsere Frauen mobilisieren, traditionell männliche Landwirtschaftsjobs anzunehmen, um Arbeitskräfte für die Front freizusetzen. Es wird nicht beliebt sein, aber wir müssen es tun."
AST_the_kakoda_campaign:5	"Die Kakoda-Kampagne"
AST_brace_for_the_inevitable_desc:5	"Da die Feinde immer näher kommen, ist es an der Zeit, sich einzugraben und unsere Küsten zu befestigen. Wir können vielleicht nicht gewinnen, aber wir werden dafür sorgen, dass es sie teuer zu stehen kommt, uns zu besiegen."
AST_not_one_step_back_desc:5	"Lasst die Bastarde versuchen, unser Land einzunehmen, um es mit einem pompösen S.O.B. zu sagen: "Wir werden sie an den Stränden bekämpfen, wir werden sie in den Pubs bekämpfen, wir werden sie auf den von Spinnen verseuchten Straßen bekämpfen." Wir werden niemals aufgeben!"
AST_womens_emergency_signalling_corps_desc:5	"Das Women's Emergency Signaling Corps (WESC) wurde von einer Frau namens Florence McKenzie gegründet, als die Spannungen als Freiwilligenorganisation in Sydney zunahmen. Als sich der Zweite Weltkrieg abzeichnete, erkannte McKenzie dies aufgrund ihrer Qualifikationen und Lehrfähigkeiten und ihrer Wahrnehmung für eine Bedarf an Menschen mit Kenntnissen in der drahtlosen Kommunikation, etwas, das sie einer Gruppe von Frauen bei Bedarf schnell beibringen konnte, und eine Rolle übernehmen konnte, die viele Menschen für eine Frau als günstig erachteten. Die Ironie ist natürlich, dass jetzt der Krieg gegen die 120 Frauen gekommen ist Sie müssen nicht nur mehr Frauen ausbilden, um ihre Organisation auszubauen, sondern wir müssen sie auch dazu auffordern, unsere Männer in den Künsten der Telegrafie und Signaltechnik auszubilden."
AST_australian_womens_navy_service_desc:5	"Das zivile Women's Emergency Signaling Corps (WESC) hat großartige Arbeit für die Kriegsanstrengungen geleistet, indem es Soldaten und Frauen in der Kunst des Signalisierens ausgebildet und Männer für die Frontlinien entlastet hat. Es ist an der Zeit, einige von ihnen zu rekrutieren Wir sollten dies versuchsweise tun, um zu sehen, ob sie in der Lage sind, ordnungsgemäße militärische Signalarbeit zu leisten, sodass wir noch mehr Männer für den Dienst an Bord freisetzen können Obwohl dies möglicherweise nicht ideal ist, wird der durch den Krieg bedingte Bedarf an Seepersonal dazu führen, dass die WRANS offiziell als Frauenhilfsdienst eingerichtet werden, falls sich diese Wege als erfolgreich erweisen."
AST_australian_womens_army_serivce:5	"Australischer Frauen-Armeedienst"
AST_australian_womens_army_serivce_desc:5	"Der Australian Women's Army Service (AWAS) wird ein nichtmedizinischer Frauendienst sein, der geschaffen wurde, um Männer aus bestimmten Militäreinheiten zu entlassen, um mehr Kampfrollen zu übernehmen. Wir gehen davon aus, dass der Dienst seinen Höhepunkt bei 15.000 bis 25.000 Mann erreichen und Personal bereitstellen wird um verschiedene Unterstützungsfunktionen zu übernehmen, darunter Verwaltung, Fahren, Verpflegung, Signale und Geheimdienst. Wenn es darauf ankommt, können diese Frauen auch die letzte Verteidigungslinie gegen eine einfallende kaiserlich-japanische Armee bilden, also lasst uns sie richtig ausbilden."
AST_women_do_their_part:5	"Australische Frauen leisten ihren Beitrag"
AST_women_do_their_part_desc:5	"Australische Frauen haben sich den Kriegsanstrengungen angeschlossen und große Mengen an Arbeitskräften für die Fronten freigesetzt. Wir haben uns hier ziemlich ausgepowert, aber das Opfer wird sich lohnen. Die Leute mögen murren und die Unterstützung für den Krieg könnte nachlassen, aber wir müssen arbeiten." mit dem, was wir haben, um den Sieg zu erringen.
AST_together_for_victory:5	"Gemeinsam für den Sieg!"
AST_together_for_victory_desc:5	"Der Krieg war eine echte Belastung für unser kleines Insel-Commonwealth. Aber unsere Leute, Männer und Frauen, haben sich der Situation gewachsen. Nicht nur australische Männer marschieren in die Schlacht und arbeiten in den Fabriken, um das für den Sieg notwendige Material herzustellen, sondern auch australische Frauen. In einem gemeinsamen Ziel vereint marschiert das australische Volk vorwärts, gemeinsam zum Sieg!"
AST_lolly_water:	"Lolly Water"
AST_lolly_water_desc:	"Der Australian Army Canteen Service kann seine eigenen kohlensäurehaltigen Zuckergetränke in Wasserfabriken hinter der Front in Darwin, Katherine, Adelaide River und Noonamah für die Kriegsanstrengungen herstellen. Wir werden braune Longneck-Bierflaschen sammeln, sie mit Dampf aus einem befeuerten Kessel waschen, neu befüllen und verschließen, bevor wir sie in wiederverwendeten Kisten und Kästen verteilen und in den Kantinen der Einheiten verkaufen."
AST_department_of_supply:5	"Abteilung Versorgung und Entwicklung"
AST_department_of_supply_desc:5	"Wir müssen zugeben, dass Australien trotz unseres grenzenlosen Potenzials kein wichtiger Akteur auf der Weltbühne ist und dies wahrscheinlich auch in mindestens einem Jahrhundert oder länger nicht sein wird. Das bedeutet nicht, dass wir keinen Einfluss auf den Krieg haben können. Wenn unsere industrielle Basis richtig geplant und koordiniert wird, können wir die Güter produzieren, die wir benötigen, um ein Stellvertreter für Großbritannien im Pazifik zu sein. Unsere Fabrikeffizienz, Bergbaubetriebe und Materialbeschaffung werden unübertroffen sein!"
AST_maribyrnong_artillery_factory:5	"Artilleriefabrik Maribyrnong"
AST_maribyrnong_artillery_factory_desc:5	"Es wird immer deutlicher, dass wir uns nicht darauf verlassen können, dass andere Nationen uns die schwere Ausrüstung zur Verfügung stellen, die wir für unsere Landesverteidigung benötigen. Deshalb hat die australische Regierung den Bau eines neuen Artilleriefabrikkomplexes genehmigt, dem ersten seiner Art in diesem Jahr." Australien. Damit werden unsere Truppen über die gesamte Artillerie verfügen, die sie benötigen, um die feindlichen Linien zu durchbrechen, unabhängig von der Unterstützung anderer Nationen.
AST_lithgow_expansion:5	"Lithgow-Arme erweitern"
AST_lithgow_expansion_desc:5	"Seit 1912 produziert die Lithgow Government Arms Factory hochwertige Dienstgewehre, Bajonette und Maschinengewehre für unsere ständige Armee und Miliz. Während sie während des Ersten Weltkriegs stark expandierte, wurde sie während der Mobilisierung in Größe und Umfang reduziert. Wir müssen nach vorne schauen Modernisierung der Anlage und Erweiterung der Produktionskapazitäten."
AST_cac_expansion:5	"Unterstützt die Commonwealth Aircraft Corporation"
AST_cac_expansion_desc:5	"Die Commonwealth Aircraft Corporation wurde 1936 auf Anraten von Essignton Lewis gegründet. Seine Vorhersage, dass ein Konflikt Europa verschlingen und Australien erneut in den Krieg ziehen würde, hat sich bewahrheitet. Zum Glück haben wir seine Warnung beherzigt und CAC in Port Melbourne gegründet. Das Unternehmen hat seitdem damit begonnen, die notwendige Ingenieurserfahrung aufzubauen, um Flugzeuge und deren Motoren unabhängig von den Lizenzinhabern zu entwerfen und zu bauen."
AST_government_aircraft_factories:5	"Abteilung für Flugzeugproduktion"
AST_government_aircraft_factories_desc:5	"Trotz der Gründung und des subventionierten Ausbaus von CAC zu Australiens führendem Flugzeughersteller wird klar, dass sie nicht ausreichen werden, um Flugzeuge für unseren Bedarf zu bauen. Das Ministerium für Versorgung und Entwicklung hat daher die Abteilung für Flugzeugbau angewiesen, staatlich geführte Einrichtungen zu schaffen, um die private Industrie zu unterstützen."
AST_an_aussie_fighter:5	"Ein australischer Kämpfer"
AST_an_aussie_fighter_desc:5	"Nein, wir reden unten im Pub nicht über Stevo. Da das Vereinigte Königreich jedes Flugzeug braucht, das es herstellen kann, hat die Commonwealth Aircraft Corporation vorgeschlagen, dass wir mit der Produktion einer Reihe von Flugzeugen beginnen, die sie "Boomerang"-Serie nennen. Alle Sie brauchen grünes Licht von uns und garantieren einen einheimischen Jäger für unsere Luftverteidigungsbedürfnisse."
AST_supply_shipping:0	"Abteilung für Versorgung und Versand"
AST_flying_kangaroo:5	"Fliegendes Känguru"
AST_flying_kangaroo_desc:5	"Während die Boomerang-Serie ... ausreichend war, ist CAC mit einem ehrgeizigen Plan zurückgekehrt, ein Flugzeug mit Propellerantrieb zu entwickeln, das alles übertreffen kann, was die Amerikaner, Briten, Deutschen oder Japaner haben. Obwohl es faszinierend ist, besteht kein Zweifel daran, dass dieses Flugzeug wird teuer sein und Jahre in der Herstellung dauern. Da die Briten mit der Entwicklung von Düsenflugzeugen beginnen, fragen sich einige, ob wir das beste Propellerflugzeug bauen werden, um dann in die Ära der Düsenflugzeuge einzusteigen."
AST_accept_our_limits:5	"Eine kleine Hilfe von unseren Freunden"
AST_accept_our_limits_desc:5	"Obwohl die Commonwealth Aircraft Corporation auf eine inländische australische Flugzeugindustrie hinarbeitet, gehen die meisten Experten davon aus, dass ein wirklich großartiges australisches Jagdflugzeug frühestens 1944, möglicherweise 1945–1946, existieren wird, falls unvorhergesehene Verzögerungen auftreten. Ebenso ist keine gepanzerte Entwicklung zu erwarten bis 1943 einen Weltklasse-Panzer zu produzieren. Bis dahin werden wir auf australische Kreationen von durchschnittlicher Qualität und lizenzierte Bauausrüstung angewiesen sein. Aber wir werden mit ein wenig Hilfe von unseren Freunden auskommen."
AST_licence_american_designs:0	"Lizenz American Designs"
AST_licence_american_designs_desc:0	"Es ist klar, dass Australien keine eigene groß angelegte inländische Luftfahrtentwicklung und -produktion von Flugzeugen haben kann. Vor diesem Hintergrund haben wir uns an die Amerikaner gewandt, die offenbar sehr daran interessiert sind, unsere heimische Industrie dabei zu unterstützen, ihre Entwürfe für eine Weile in Lizenz zu produzieren Bagatellgebühr. Der genaue Wortlaut lautete: "Man verlangt von einem Nachbarn nicht, dass er seinen Schlauch benutzt, um ein Feuer zu löschen." Ich bin mir nicht sicher, was zum Teufel sie meinen, aber wir nehmen, was sie uns geben."
AST_department_of_munitions:5	"Munitionsministerium"
AST_department_of_munitions_desc:5	"Wir haben eine ziemlich starke industrielle Basis geschaffen, auf der wir eine beeindruckende Streitmacht aufbauen können. Jetzt müssen wir uns der Herausforderung stellen, eine Armee zu versorgen, die um ein Vielfaches größer ist, als unsere industrielle Basis unterstützen sollte. Versorgungsfabriken, Die zunehmende Zahl von Frauen am Arbeitsplatz und die Zwangsarbeit müssen genügen, während wir gleichzeitig dafür sorgen, dass die Stimmung hoch und motiviert bleibt. Das ist nicht allzu schwer, wenn die Gefahr direkt vor der Haustür liegt."
AST_sailsbury_munitions_factory:5	"Sailsbury Munitionsfabrik"
AST_sailsbury_munitions_factory_desc:5	"In Sailsbury, Südaustralien, wurde ein neuer Standort für eine riesige Sprengstoff- und Waffenfabrik gefunden. Dies wird unsere Kapazitäten für die Verteidigungsproduktion weiter steigern."
AST_ford_and_holden:5	"Vertrag Ford und Holden"
AST_ford_and_holden_desc:5	"Australien verfügt zwar über begrenzte Produktionskapazitäten für Lastkraftwagen und andere Nutzfahrzeuge. Es ist an der Zeit, diese zu nutzen."
AST_small_arms_ammunition_factory:5	"Kleinwaffenmunitionsfabriken"
AST_small_arms_ammunition_factory_desc:5	"Es ist klar geworden, dass das große Militär, das Australien sich vorstellt, irgendwie versorgt werden muss. Während das Munitionsministerium akribische Pläne aufgestellt hat, müssen wir jetzt die Einrichtungen bauen, die diese Pläne unterstützen können. Dies wird auch den Nebeneffekt haben." einigen Fabriken, die derzeit Munition herstellen, zu gestatten, uns auf andere Weise zu unterstützen.
AST_tanks_from_down_under:5	"Panzer aus Down Under"
AST_tanks_from_down_under_desc:5	"Die Lehren aus Europa haben uns gezeigt, was mit Ländern passiert, die sich nicht an die gepanzerte Realität des heutigen Krieges anpassen. Da Großbritannien jeden Panzer, den es herstellt, für seine eigene Verteidigung benötigt, wird Australien angreifen. Der Umbau von zwei Eisenbahnanlagen in Islington, Südaustralien und Chullora Railway Workshops in New South Wales werden die Grundlage für ein riesiges australisches Panzerkorps mit mindestens drei Panzer- und drei motorisierten Divisionen bilden."
AST_the_commonwealth:5	"Das Commonwealth"
AST_the_commonwealth_desc:5	"Am besten lässt es sich als eine Familie von Nationen beschreiben. Das Commonwealth of Nations stellt die endgültige Form des Britischen Empire dar. Viele Nationen arbeiten als grundsätzlich unabhängige Reiche innerhalb eines größeren Imperiums zusammen, das von verantwortungsvoller Regierung und Demokratie geleitet wird. Das Commonwealth ist bereit, sich jedem zu stellen Fordern Sie uns heraus, gehen Sie auf jede Verpflichtung ein und sichern Sie die Freiheit des Reiches von Tyrannei und Unterdrückung. Die Australier werden stolz ihrer Verpflichtung nachkommen und noch mehr!"
AST_the_red_white_and_blue:5	"Big Mac und das Sternenbanner"
AST_us_army_services_of_supply:5	"Versorgungsdienste der US-Armee – SWPA"
AST_us_army_services_of_supply_desc:5	"Das SWPA-Kommando befindet sich am Ende einer sehr langen Nachschubroute. Es wird ein formelles, dediziertes Kommando eingerichtet, das gestrafft und von den Kampfeinheiten getrennt ist und sich der Unterstützung australischer, niederländischer und amerikanischer Truppen widmet, um Vorräte effizient dorthin zu liefern, wo sie benötigt werden. werden benötigt."
AST_allied_intelligence_bureau:5	"Allied Intelligence Bureau"
AST_allied_intelligence_bureau_desc:5	"Das Allied Intelligence Bureau (AIB) wurde uns als gemeinsame Geheimdienst- und Spezialoperationsagentur der Vereinigten Staaten, Australiens, der Niederlande und Großbritanniens vorgeschlagen, die in der SWPA operieren wird. Angesichts früherer geheimdienstlicher Misserfolge ist dies kein schlechter Vorschlag Aus logistischen und praktischen Gründen wird es seinen Sitz hier in Australien haben, obwohl es die Planungsverantwortung auf alle teilnehmenden Mitglieder verteilt. Wir werden für den Löwenanteil der Finanzierung, Leitung und allgemeinen Unterstützung aller vom Büro und seinen Hilfsorganisationen durchgeführten Geheimdienstoperationen verantwortlich sein."
AST_the_coastwatchers:5	"Die Küstenwächter"
AST_the_coastwatchers_desc:	"Sektion C, Allied Intelligence Bureau, sind unsere militärischen Geheimdienstmitarbeiter, die auf abgelegenen pazifischen Inseln stationiert sind, um feindliche Bewegungen zu beobachten und gestrandetes alliiertes Personal zu retten. Mit etwas Glück werden sie eine bedeutende Rolle im Operationsgebiet Pazifik und Südwestpazifik spielen insbesondere als Frühwarn- und Rettungsnetzwerk. Wer weiß, vielleicht retten sie eines Tages sogar einen zukünftigen Präsidenten."
AST_south_west_pacific_area:5	"Kommando Südwestpazifikgebiet"
AST_south_west_pacific_area_desc:5	"South West Pacific Area (SWPA) ist der Name des obersten Militärkommandos der Alliierten im Südwestpazifik. Es ist eines von vier großen alliierten Kommandos im Pazifikkrieg und das wichtigste für Australien. Derzeit ist das SWPA umfasst die Philippinen, Borneo, Niederländisch-Ostindien (ohne Sumatra), Osttimor, Australien, die Gebiete Papua und Neuguinea sowie den westlichen Teil der Salomonen. Um die Operationen im Pazifik zu rationalisieren, hat die Regierung Maßnahmen ergriffen Unser gesamtes Militär steht unter dem Kommando von US-General Douglas MacArthur, der von seinem Hauptquartier in Queensland aus die australischen, niederländischen und amerikanischen Truppen befehligt, deren Aufgabe es ist, den japanischen Vormarsch abzuwehren."
AST_south_west_pacific_area_tt:5	"Ermöglicht den Vereinigten Staaten, dringend benötigte §YAusrüstung§! und §YTruppen§! und §YIndustrielle Unterstützung§! zu schicken, um den Kampf um den Südpazifik zu unterstützen."
AST_a_new_sheriff:5	"Ein neuer Sheriff…"
AST_a_new_sheriff_desc:5	"Da Großbritannien in Europa beschäftigt ist, scheint ein neuer Sheriff angekommen zu sein."
AST_needs_a_good_deputy:5	"... braucht einen guten Stellvertreter"
AST_needs_a_good_deputy_desc:5	"Und jeder Sheriff braucht einen guten Stellvertreter, um sicherzustellen, dass er seine Arbeit gut machen kann. Stellen wir sicher, dass wir es sind. Großbritannien hat uns gute Dienste geleistet, aber sie können uns nicht mehr helfen. Die Zukunft ist voller Sterne."
AST_special_unit:5	"M/Z-Spezialeinheiten"
AST_raaf_reform:5	"RAAF-Reform"
AST_citizens_air_force:5	"Bürgerluftwaffe"
AST_citizens_air_force_desc:5	"Lassen Sie uns die Finanzierung eines alten Programms wieder aufnehmen, um sicherzustellen, dass es eine große Anzahl ziviler Piloten gibt, die in Krisenzeiten schnell mobilisiert werden können."
AST_revitalise_the_army:5	"Die Armee wiederbeleben"
AST_revitalise_the_army_desc:5	"Die Militar und die reguläre Armee sind in einem sehr traurigen Zustand. Seit dem Ende der Wehrpflicht und dem Beginn der Weltwirtschaftskrise im Jahr 1929 waren unsere Streitkräfte unglaublich unterdurchschnittlich und nicht in der Lage, auch nur die laxsten Standards einzuhalten. Es ist irgendwie unglaublich, dass es uns überhaupt gelingt, Milizformationen aufrechtzuerhalten, da viele davon nur auf dem Papier existieren. Eine ernsthafte Umstrukturierung unserer Bodentruppen wird erforderlich sein, damit wir nicht unvorbereitet auf den Krieg bleiben. Wir werden mit einer Säuberung all derjenigen beginnen, die sich nicht treffen können die absoluten Mindeststandards an Fitness und Kompetenz."
AST_cut_domestic_market:0	"Inlandsmarkt einschränken"
AST_cut_domestic_market_desc:0	""
AST_hume_dam:0	"Beenden Sie den Hume-Damm"
AST_hume_dam_desc:0	""
AST_army_officers:5	"Australische Offiziere"
AST_army_officers_desc:5	"In Duntroon ausgebildete Offiziere erwiesen sich als ebenso fähig wie ihre gleichaltrigen Absolventen aus Sandhurst, Westpoint oder der École spéciale militaire. Seitdem haben unsere Budgetkürzungen und unser... laxer Ansatz zur Disziplin dazu geführt, dass sich viele ehemalige Absolventen aus dem Dienst zurückgezogen haben ein massiver Braindrain. Nachdem wir unsere Offiziersanwärter nun wieder in ein renoviertes College verlegt haben, müssen wir uns daran machen, die Standards für die Auswahl unserer Offiziersanwärter zu stärken und diejenigen, die im Ruhestand sind, einzustellen, um diese Offizieranwärter zu unterrichten und zu betreuen. Es hat gewonnen Es ist natürlich nicht billig, aber es ist notwendig."
AST_prove_ourselves:5	"Um uns zu beweisen"
AST_prove_ourselves_desc:5	"Australien hat in den letzten Jahren große Fortschritte gemacht. Wir haben nicht nur eine der modernsten und modernsten Offiziersausbildungsschulen wieder aufgebaut, sondern auch hohe Standards für diejenigen gesetzt, die unsere Söhne und Brüder in die Schlacht führen würden. Das Einzige, was noch übrig ist Was wir tun müssen, ist, unsere britischen "Kapitäne" loszuwerden. Wir müssen ihnen beweisen, dass wir völlig in der Lage sind, völlig unabhängig von ihren "hilfreichen" Ratschlägen zu arbeiten. Vielleicht kann eine Militärübung arrangiert werden, damit sie sehen können, dass unsere Armee dem gewachsen ist Aufgabe?"
AST_royal_aussie_arty:0	"Aussie Arty"
AST_royal_aussie_arty_desc:0	"Von Australiens ersten Geschützen, die von der HMS Sirius entladen wurden und in einer kleinen irdenen Schanze untergebracht waren, bis hin zu unserem modernen Arsenal an selbstgebauten Waffen. Australische Artillerie war im gesamten asiatisch-pazifischen Raum ein Goldstandard. Die Weiterentwicklung dieser Geschütze stellt die Weiterentwicklung von dar das australische Militär von einer örtlichen Miliz zu einer stolzen Kampftruppe, die in der Lage ist, jeden Feind anzugreifen und zu besiegen."
AST_the_second_australian_imperial_force:5	"Mobilisiere den 2. AIF"
AST_the_second_australian_imperial_force_desc:0	"Während sich überall auf der Welt Gewitterwolken zusammenziehen, müssen wir den Grundstein für eine zweite australische imperiale Streitmacht legen. Die Mobilisierung der Miliz und ihre Integration in die Ständige Militärmacht ist unsere oberste Priorität. Nur so kann Australien bereit sein, sich zu verteidigen und das Empire."
AST_armoured_corps:5	"Ein australisches Panzerkorps gegründet"
AST_armoured_corps_desc:5	"Im letzten Jahrzehnt oder so hat sich das australische Panzerkorps als unglaublich nützlicher Aktivposten bei der Entwicklung der Panzertruppe unseres Landes erwiesen. Berichte aus Europa scheinen jedoch darauf hinzuweisen, dass isolierte und nicht unterstützte Panzereinheiten im Kampf nicht erfolgreich sein können. Mit Aufgrund unseres begrenzten Personal- und Panzerbestands können wir es nicht zulassen, dass Panzer unnötig verloren gehen. Vor diesem Hintergrund haben hochrangige Militärangehörige vorgeschlagen, die Kavallerie und berittene Einheiten in unsere Panzereinheiten zu integrieren und sie mit gepanzerten Trägern auszustatten, um sich selbst zu schützen. Ihre kombinierte Geschwindigkeit und Feuerkraft werden dies tun wird für jeden Sieg in künftigen Konflikten von entscheidender Bedeutung sein, und Australien wird in dieser Hinsicht die Speerspitze sein."
AST_indigenous_tank_development:5	"Entwicklung indigener Panzer"
AST_light_infantry_tactics:5	"Leichte Infanterie-Taktik"
AST_light_infantry_tactics_desc:5	""
AST_to_the_warrior_his_arms:5	"Dem Krieger seine Arme"
AST_to_the_warrior_his_arms_desc:5	"Seit vier Jahrzehnten beschafft, testet und verteilt das Ordnance Corps der australischen Armee Waffen und Ausrüstung an die australische Armee. Unsere Verteidigungskürzungen in der Zeit der Depression machten sie in den letzten Jahren weniger relevant, aber jetzt, wo wir uns im Krieg befinden und ihre Fähigkeiten mobilisiert haben, sind sie es lebenswichtig. Wenn wir erfolgreich sein wollen, muss das Ordnance Corps gut finanziert sein, damit unsere Männer gut versorgt werden können."
AST_milita_reform:5	"Militärreform"
AST_milita_reform_desc:5	"Der Zustand unserer Milizkräfte ist komisch. Wir müssen die Miliz zu etwas reformieren, das tatsächlich kämpfen und einen Krieg gewinnen kann …"
AST_the_great_scrap_flotilla:5	"Die große Schrottflottille"
AST_the_great_scrap_flotilla_desc:5	"Der Zustand der Royal Australian Navy ist nicht besonders gut. Wir haben den Schlachtkreuzer HMAS Australia I im Jahr 1921 aufgelöst, um dem Washingtoner Flottenvertrag zu entsprechen, und unsere Marinedoktrin und -entwicklung ist seitdem im Grunde genommen dem Weg des Dodo gefolgt. Dies ist inakzeptabel, wenn Australien zum Stellvertreter der Demokratie im asiatisch-pazifischen Raum werden soll. Unsere Marine- und politische Führung hat zwei Pläne formuliert, denen wir folgen könnten. Der eine ist sehr ehrgeizig und führt dazu, dass wir unsere Hoffnungen auf eine heimische Flugzeugindustrie aufgeben. Das andere ist ein schrittweiser Aufbau, der den Kauf einiger neuer Großkampfschiffe beinhaltet."
AST_joint_overseas_operational_training_school:5	"Errichten Sie amphibische Assauly-Schulen"
AST_joint_overseas_operational_training_school_desc:5	"Unsere Verbündeten haben unser Defizit an strategischen Fähigkeiten sehr schnell beurteilt und Ermutigung und Unterstützung angeboten, um unsere begrenzten Fähigkeiten in der Marineinfanterie weiterzuentwickeln. Auch wenn wir denken, dass es sich um pompöse, verdammte Drongos handelt, müssen wir doch zugeben, dass sie Recht haben. Daher sind Pläne im Gange, eine Reihe von Schulen in Nelson Bay für die Marine und Toorbul Point für die Armee zu eröffnen."
AST_anglo_australian_naval_officer_exchange:5	"Anglo-australischer Marineaustausch"
AST_anglo_australian_naval_officer_exchange_desc:0	"Der Anglo-Australian Naval Exchange war ein Programm, das auf Empfehlung von Admiral Jelicoe nach seinem Besuch in unserem Commonwealth im Jahr 1921 ins Leben gerufen wurde. Damals hatten wir versucht, eine Weltklasse-Marine aufzubauen, die es mit jeder Macht im Pazifik aufnehmen konnte, mit Ausnahme der Der Washingtoner Flottenvertrag und die Weltwirtschaftskrise haben dafür gesorgt, dass dieser Ambition ein Ende gesetzt wurde. Da die Spannungen erneut zunehmen, sollten wir versuchen, dieses Abkommen wiederzubeleben."
AST_a_change_in_course_desc:5	"Seien wir ehrlich, John Jellicoes ehrgeizige Marine war für unsere junge Nation immer eine sehr unwahrscheinliche Aussicht. Obwohl wir sicherlich die Fähigkeit haben, den Plan zu verwirklichen, wären große Opfer und Opportunitätskosten erforderlich, damit er realisierbar wäre. Darüber hinaus würde die einstmals beeindruckende Flotte im Pazifik heute im Vergleich zu dem, was unsere Rivalen mitbringen könnten, in den Schatten gestellt werden. Stattdessen wird sich Australien auf den Aufbau einer Weltklasse-Unterstützungsmarine konzentrieren. Australische "Minensuchschiffe", die in großen Stückzahlen gebaut werden, könnten für den Angriff eingesetzt werden und Landungen so lange verzögern, dass alliierte Marinen mit mehr Großkampfschiffen einrücken und den entscheidenden Schlag versetzen können. In der Zwischenzeit werden australische U-Boote unter dem Meer lauern, bereit, verwundbare Schiffe zu versenken. Ja, das ist kein Ruhm, aber es ist ehrliche Arbeit."
AST_submarine_focus:5	"Aussie Submarine Service"
AST_corvettes:5	"Australische Korvetten"
AST_corvettes_desc:5	"Offiziell sind es Minenräumer, in Wirklichkeit haben wir Pläne für den Bau einer neuen Klasse von Korvetten ausgearbeitet, die mit unserer begrenzten Marineinfrastruktur in Massenproduktion hergestellt werden können. Sie sind nicht so auffällig wie Zerstörer oder sogar Fregatten, aber sie Ich werde die Arbeit erledigen und unseren zukünftigen Stolz der Flotte beschützen."
AST_fast_carrier_force_desc:5	"Alles läuft darauf hinaus, dass die U-Boote und Korvetten zur Ablenkung desorganisieren und abschirmen, während unsere beiden Träger und ihre Eskorten für die Durchschlagskraft unserer Seestreitkräfte sorgen. Diese Träger werden als Kraftmultiplikatoren fungieren und von unserem Boden unterstützt werden Flugzeuge werden jeden vernichten, der an unseren schönen Küsten landen will."
AST_revisit_jellicos_recomendations:5	"Jellicoes Empfehlungen noch einmal besuchen"
AST_the_delusional_dream_desc:5	"Es ist verdammt gekochter Kumpel."
AST_cockatoo_island_revitalisation_shipyards:5	"Revitalisierung der Kakadu-Insel"
AST_cockatoo_island_revitalisation_shipyards_desc:5	"Seit der Unterzeichnung des Washingtoner Flottenvertrags im Jahr 1922 wird Cockatoo Island nicht mehr als bedeutende Schiffbauanlage genutzt. Obwohl es immer noch häufig zu Reparaturzwecken genutzt wird, ist es unwahrscheinlich, dass das Dock ohne Bauarbeiten zeitnah ein Schiff bauen könnte einige ziemlich gefährliche Fehler. Da nun wieder Mittel für die Marine fließen, sollten wir der Finanzierung dieser wichtigen Marineeinrichtung Priorität einräumen."
AST_morts_dockyard_expansion:5	"Morts Dockyard-Erweiterung"
AST_morts_dockyard_expansion_desc:5	"Da Australien ein ... ehrgeizigeres Marinebauprogramm verfolgt, benötigt Mort's Drydock in Balmain Sydney möglicherweise einen massiven staatlichen Zuschuss, um für den Bau einiger neuer Schiffe in einem Ausmaß bereit zu sein, das in Australien noch nicht hergestellt wurde."
AST_the_state_dockyard:5	"NSW State Dockyard erweitern"
AST_the_state_dockyard_desc:5	"Australiens Marinebedarf kann nicht in Gebieten gedeckt werden, die durch Zersiedelung und nicht unbedingt erforderliche Industriebebauung begrenzt sind. Dyke Point in der Nähe von Newcastle wurde ausgewählt und obwohl es sich zunächst um einen bescheidenen Standort handelt, ist das Expansionspotenzial größer als die Stadt ansässige Cousins."
AST_garden_island_drydock:5	"HM Shipyard Garden Island"
AST_garden_island_drydock_desc:5	"Ehrlich gesagt ist das, was wir tun, verrückt. Es war bereits geplant, auf dem neugewonnenen Land zwischen Garden Island und Potts Point eine riesige Werft zu bauen, aber mit etwas mehr Investitionen haben wir alles gegeben. Eine komplette Marinewerft mit zwei Werften Die HM Shipyard Garden Island wird das Kronjuwel im australischen Marineprogramm sein. Sie lachten, sie spotteten. ABER WER LACHT JETZT?!?!?"
AST_create_drb:5	"Einrichtung des DRB"
AST_urban_planning:5	"Ziviles Baukorps"
AST_urban_planning_desc:5	"Im April 1942 wurde das CCC gegründet, um Arbeitskräfte für den Bau von Infrastrukturen wie Flugplätzen, Geschützstellungen, Kasernen, Straßen und anderen Projekten während des Zweiten Weltkriegs in Australien bereitzustellen. Bis zum Ende des Zweiten Weltkriegs hatten 77 500 Männer im CCC gedient und 218 Todesopfer zu beklagen."
AST_construction:5	"Industrielle Anstrengungen der Oststaaten"
AST_construction_desc:5	"Da die Tage in Europa immer dunkler werden, müssen wir Maßnahmen ergreifen, um sicherzustellen. Wir müssen sicherstellen, dass unsere Nation wirtschaftlich in der Lage ist, eine Armee zu unterhalten, die in der Lage ist, das Festland zu verteidigen. Als ersten Schritt zum Aufbau einer Zukunft für unsere Nation müssen wir uns an die Oststaaten wenden."
AST_construction_2:5	"Industrielle Anstrengungen der Weststaaten"
AST_construction_2_desc:5	"Wenn die Oststaaten gestärkt sind, wird die Entwicklung der Industrie im Westen der Wirtschaft weiter helfen."
AST_construction_3:5	"Zusätzliche Bauanstrengungen"
AST_construction_3_desc:5	"Der Ausbau unseres Infrastrukturnetzes hat unsere Kapazitäten für den Bau in der westlichen Region erheblich verbessert."
AST_infrastructure:5	"Autobahnen in den östlichen Bundesländern"
AST_infrastructure_desc:5	"Ein Land ohne angemessene Infrastruktur kann keine fortschrittlichen Projekte oder Bauvorhaben durchführen."
AST_infrastructure_2:5	"Bau der indisch-pazifischen Eisenbahnlinie"
AST_infrastructure_2_desc:5	"Der weitere Ausbau unserer Infrastruktur ermöglicht den Transport und die Kommunikation, die für geheime High-Tech-Projekte erforderlich sind."
AST_create_csir:5	"Finanzierung des CSIR"
AST_create_csir_desc:5	"1926 wurde das Institut durch das Wissenschafts- und Industrieforschungsgesetz (Science and Industry Research Act) durch den "Rat für wissenschaftliche und industrielle Forschung" (CSIR) ersetzt."
AST_radio_efforts:5	"Einrichtung eines Beratungsgremiums für Radiophysik"
AST_radio_efforts_desc:5	"Die Forschung im Bereich der Radar- oder Funkortungstechnologie in Australien wurde vom Radiophysics Advisory Board koordiniert, das innerhalb des Council for Scientific and Industrial Research (CSIR) eingerichtet wurde."
AST_nuclear_efforts_desc:5	"Australien untersuchte den Erwerb von taktischen Atomwaffen aus dem Vereinigten Königreich oder den Vereinigten Staaten und empfahl den Erwerb von taktischen Atomwaffen zur Bewaffnung der australischen English Electric Canberra-Bomber und CAC Sabre-Jäger."
AST_secret_weapons:5	"Geheimwaffen"
AST_secret_weapons_desc:5	"Im September 1947 wurde Burnet eingeladen, dem Unterausschuss für chemische und biologische Kriegsführung des New Weapons and Equipment Development Committee beizutreten, und er verfasste einen Geheimbericht mit dem Titel \"Anmerkung zum Krieg aus einem biologischen Blickwinkel\"."
AST_military_logistics:5	"Alliierter Betriebsrat"
AST_military_logistics_desc:5	"Der im Februar 1942 gegründete Alliierte Betriebsrat sollte die militärischen Bauarbeiten in Australien während des Zweiten Weltkriegs überwachen und organisieren. Edward Granville Theodore wurde zum Generaldirektor des Rates ernannt."
AST_armament:5	"Erweiterung der Lithgow Arms Factory"
AST_armament_desc:5	"Die Lithgow-Fabrik kann dem Bedarf an Waffen nicht mehr gerecht werden. In Bathurst, etwa 40 Meilen westlich von Lithgow, wird ein neues Nebenwerk errichtet. Es folgt die Errichtung von Zulieferfabriken in den umliegenden Städten Orange, Forbes, Wellington, Mudgee, Cowra, Young, Dubbo, Parkes, Portland und Katoomba."
AST_armament_2:5	"John Lysaght Fabriken"
AST_armament_2_desc:5	"Die John Lysaght-Fabriken in Port Kembla und Newcastle stellten die Waffen her. Zwischen März 1942 und Februar 1943 wurden 28.000 Owen-Geschütze produziert."
AST_armament_3:5	"Zusätzliche Munitionsfabriken"
AST_fortification:5	"Schützen Sie das Festland"
AST_aif_organisation:5	"Die 2. AIF wird organisiert"
AST_aif_organisation_desc:5	"Nach der Weltwirtschaftskrise war die Bürgerwehr auf dem Papier auf 35.000 Mann geschrumpft, und mehr als die Hälfte der Freiwilligen war nicht in der Lage, regelmäßig ihren Beitrag zu leisten. Fehlende finanzielle Mittel und Gesetze zur Unterstützung der CMF wurden als die beiden Hauptursachen für den rapiden Rückgang der CMF identifiziert. Angesichts des drohenden Krieges in Europa müssen wir Maßnahmen ergreifen, um diese Probleme zu lösen, bevor es zu spät ist."
AST_desert_doctrine_desc:5	"Die Vorkriegsdoktrin der australischen Armee war auf die konventionelle Kriegsführung in einem europäischen Umfeld ausgerichtet. Diese Doktrin und die dazugehörigen Ausbildungshandbücher waren für alle Commonwealth-Länder gleich. Nach Ausbruch des Krieges konzentrierte sich das Heer weiterhin auf die Vorbereitung seiner Einheiten auf den Kampf in Europa und Nordafrika."
AST_infantry_forces_desc:5	"Bei Ausbruch des Krieges verfügte Australien nicht über moderne Waffen und Ausrüstung. Da die Briten aufgrund ihrer eigenen Mobilisierung keine Hilfe leisten konnten, mussten wir unsere eigenen Fertigungsstraßen entwickeln."
AST_elite_forces_desc:5	"Die Lehren aus dem Ersten Weltkrieg brachten viele kreative Anwendungen und Innovationen hervor. Der Dingo basierte auf einem handelsüblichen Ford 30-cwt, der mit einem Allradantrieb, einem leichten Bren-Maschinengewehr und einem Mk19-Funkgerät ausgestattet war."
AST_night_ops:5	"Nachteinsätze"
AST_night_ops_desc:5	"Die Idee des Nachtkampfes gibt es schon seit Jahrhunderten, aber sie wurde erst im Zweiten Weltkrieg verwirklicht. Im pazifischen Raum setzten die Japaner Nachtoperationen ein, um einen zahlenmäßig überlegenen Feind wirksam zu bekämpfen. Wir können lernen, diese Taktiken nicht nur anzuwenden, um einen überlegenen Feind zu besiegen, sondern auch, um Nachtangriffe unserer Feinde abzuwehren."
AST_local_planes:5	"Lokale Designs unterstützen"
AST_foreign_planes:5	"Kauf ausländischer Konstruktionen"
AST_foreign_planes_desc:5	"Der Erwerb ausländischer Konstruktionen für schwere Flugzeuge wird Langstreckeneinsätzen zugute kommen."
AST_air_doctrine_desc:5	"Mit dem Beginn des Pazifikkriegs - und dem raschen Vormarsch der japanischen Streitkräfte - wurde das australische Festland zum ersten Mal in seiner Geschichte bedroht. Die RAAF war auf den Ernstfall nicht vorbereitet und verfügte zunächst nur über geringe Kräfte für den Einsatz im Pazifik. Dies müssen wir korrigieren."
AST_expand_cac_desc:5	"Wir müssen die Commonwealth Aircraft Corporation ausbauen, um mit den Anforderungen der ständig wachsenden Kriegsanstrengungen Schritt zu halten."
AST_found_wraaf:5	"Gründung der WRAAF"
AST_found_wraaf_desc:5	"Die Gründung der Women's Royal Australian Air Force (WRAAF) geht auf die beträchtliche Lobbyarbeit von dienstwilligen Frauen und des Chefs des Luftwaffenstabs zurück, der männliches Personal für den Einsatz in Übersee freistellen will."
AST_jet_effort:5	"Entwicklung von Strahltriebwerken"
AST_fund_ran_desc:5	"Bei Kriegsausbruch war die Royal Australian Navy relativ bescheiden, auch wenn sie wohl die kampfbereiteste der drei Teilstreitkräfte war. Im Gegensatz zu den Vereinbarungen mit der britischen Admiralität zu Beginn des Ersten Weltkriegs blieben die Schiffe der RAN während des Zweiten Weltkriegs unter australischem Kommando."
AST_underdog_focus:5	"Außenseitertaktik"
AST_underdog_focus_desc:5	"Wir haben weder die Industrie noch die Arbeitskräfte, um eine Flotte zu unterhalten, die unseren Gegnern zahlenmäßig überlegen oder ebenbürtig ist. Um potenzielle Feinde wirksam bekämpfen zu können, müssen wir nicht härter, sondern intelligenter kämpfen."
AST_british_navy_desc:5	"Wir sind ein Mitglied des Commonwealth! Wir haben wenig zu befürchten, wenn wir Seite an Seite mit der Royal Navy kämpfen, und daher werden wir unsere Marine ähnlich ausbauen, wie sie die ihre ausgebaut hat."
AST_commerce_focus:5	"Handel im Fokus"
AST_commerce_focus_desc:5	"Unsere Verbündeten und Handelspartner sind weit weg, und unsere eigene Industrie ist letztlich begrenzt. Wenn wir uns auf die Produktion von Begleitschiffen und Transportern konzentrieren, können wir unsere lebenswichtigen Handelsverbindungen wirksam schützen und ausbauen."
AST_fleet_hub:5	"Bau von Flottenstützpunkten"
AST_fleet_hub_desc:5	"Die australischen Häfen gehören zu den wichtigsten im Osten. Während des Zweiten Weltkriegs waren australische Häfen wie Fremantle und Brisbane Dreh- und Angelpunkte der alliierten Kriegsanstrengungen im Südostasien- und Pazifikraum. Der nördlichste Hafen von Darwin, der Ausgangspunkt für unsere Operationen im Norden, wird um das Zehnfache erweitert, um unsere Ziele zu erreichen."
AST_cruiser_focus:5	"Kreuzergeschwader"
AST_cruiser_focus_desc:5	"Der erste Schritt zum Ausbau unserer Flotte besteht in der Verbesserung unserer Kreuzer. Kreuzer sind das Herzstück jeder Marine, denn sie sind die vielseitigsten Schiffe mit ausgewogener Geschwindigkeit, Reichweite, Panzerung und Feuerkraft."
AST_sea_wolves:5	"Wiederbelebung der RANSS"
AST_sea_wolves_desc:5	"U-Boote haben ihren Wert als äußerst kosteneffiziente Kriegsschiffe mit den Erfolgen der deutschen U-Boote im Ersten Weltkrieg unter Beweis gestellt. Zweimal zuvor ist der U-Boot-Dienst der Royal Australian Navy aufgrund wirtschaftlicher Umstände oder einfach wegen defekter Maschinen gescheitert. Die dritte Gründung des RANSS wird seine Zukunft als Kernstück der RAN sichern."
AST_destroyer_force:5	"Die Schrottflottille"
AST_destroyer_force_desc:5	"Die Schrottflottille war der Name, den der Nazi-Propagandaminister Joseph Goebbels der fünf Schiffe umfassenden Zerstörerflottille der RAN gab. Nach australischer Manier werden wir die so genannte Schrotteisenflottille zur mächtigsten Zerstörerflotte auf hoher See ausbauen und dann sehen, was ein ausländischer Propagandaminister dazu zu sagen hat!"
AST_arm_coast:5	"Bewaffnung der Küste"
AST_arm_coast_desc:5	"Da sich die Spannungen in der Welt zuspitzen, ist es jetzt von größter Wichtigkeit, den Schutz unserer lebenswichtigen Häfen zu verbessern, um sie vor Angriffen von See aus zu schützen."
AST_battleship_focus:5	"Unterstützung der Cockatoo-Werften"
AST_battleship_focus_desc:5	"Während des Zweiten Weltkriegs war Cockatoo Island die wichtigste Schiffsreparaturanlage im südwestlichen Pazifik. Etwa 250 Schiffe wurden auf der Insel umgebaut oder repariert."
AST_carrier_focus:5	"Aufbau der Flottenluftwaffe"
AST_carrier_focus_desc:5	"Nachdem die Qualität und Bedeutung der Marinefliegerei zugenommen hatte, wurde 1947 die Fleet Air Arm gegründet, die die alte Australian Navy Aviation Group ablöste. Die FAA bildete die Kernstreitkraft der neuen Royal Australian Navy."
AST_trade_interdiction:5	"Veröffentlichung der australischen Marinedoktrin"
AST_trade_interdiction_desc:5	"Durch den Einsatz überlegener Technologie, fachmännisch ausgebildeter Seeleute und einer flexiblen, soliden Doktrin wird sich die Royal Australian Navy unabhängig von der Anzahl der Schiffe als die Beste der Besten profilieren."
AST_rule_waves:5	"Gemeinsam beherrschen wir die Wellen"
AST_rule_waves_desc:5	"Seite an Seite mit der Royal Navy werden die Schiffe, die unter dem Union Jack und unter dem Commonwealth segeln, ihren Status als ewige Herrscher über die Wellen behaupten!"
AST_leave_commonwealth:5	"Verlassen Sie das Commonwealth"
AST_leave_commonwealth_desc:5	"Zu lange haben wir uns unter der Verachtung unserer britischen Oberherren geplagt. Es ist an der Zeit, Stellung zu beziehen und ein neues Schicksal für die australische Nation zu schmieden."
AST_create_board:5	"Beratenden Kriegsrat einrichten"
AST_create_board_desc:5	"1940 akzeptierte Menzies widerwillig Curtins Vorschlag, einen Beratenden Kriegsrat einzurichten, in dem Regierung und Opposition gleichberechtigt vertreten sein sollten und den die Regierung in allen Fragen der Kriegsführung informieren und konsultieren konnte."
AST_stay_commonwealth:5	"Den Kurs beibehalten"
AST_stay_commonwealth_desc:5	"Die Demokratie ist die wahrhaftigste und gerechteste Form, ein Land in der heutigen Zeit zu regieren. Den Commonwealth hinter sich zu lassen, wäre nicht töricht und würde uns ausländischen Widrigkeiten völlig ausliefern."
AST_nationalism_focus:5	"Faschist werden"
AST_nationalism_focus_desc:5	"Stärke ist die einzige Eigenschaft, die es wert ist, verfolgt zu werden. Andere haben sich diese Wahrheit zu eigen gemacht, wir auch."
AST_intervention_nationalists:5	"Nationalistische Intervention"
AST_intervention_nationalists_desc:5	" Die Nationalisten sind in Spanien endlich auf dem Vormarsch. Ihre Sache ist gerecht, und jeder, der bereit ist, für sie zu kämpfen, sollte das auch dürfen."
AST_militarism_focus:5	"Nationaler Militarismus"
AST_militarism_focus_desc:5	"Diejenigen, die das Militär als notwendiges Übel betrachten, sind dazu verdammt, im Angesicht des Krieges zu zögern. Wir werden den Militarismus in unserer Kultur verankern, um ein Volk von Soldaten zu werden."
AST_demand_nz:5	"Fordern Sie Neuseeland"
AST_demand_nz_desc:5	"Jetzt, da wir unsere Unabhängigkeit von den Briten erreicht haben, sollten sie verstehen, dass sich dieser Anspruch auf alle ihre Ländereien in dieser Region erstreckt."
AST_war_propaganda:5	"Die Anzac-Legende"
AST_war_propaganda_desc:5	"Nachdem wir festgestellt haben, dass unsere Ideologie auf der Wahrheit beruht, kann sie als Wahrheit gelehrt werden. Bildung und Medien müssen diese Lektion widerspiegeln."
AST_claim_indonesia:5	"Anspruch auf Indonesien"
AST_ban_communism_desc:5	"Wir haben die Kontrolle über das Land erlangt, aber wir sind nicht völlig sicher. Der Kommunismus, der Erzfeind der von uns verfolgten ultranationalistischen Doktrinen, wird fortan aus Veröffentlichungen, Politik und Öffentlichkeit verbannt."
AST_fascist_faction:5	"Australien zuerst"
AST_fascist_faction_desc:5	"Um uns wirklich von unseren früheren schwachen Oberherren zu unterscheiden, müssen wir unsere eigene Fraktion gründen, eine Fraktion, die das australische Volk, die australischen Interessen und den australischen Ehrgeiz an erste Stelle setzt!"
AST_join_axis:5	"Schließen Sie sich der Achse an"
AST_asian_thrust:5	"Asiatischer Vorstoß"
AST_asian_thrust_desc:5	"Da der europäische Einfluss in der indopazifischen Region auf einem historischen Tiefpunkt angelangt ist, ist es an der Zeit, unseren Einfluss in Übersee auf den großen eurasischen Kontinent auszudehnen - die ersten Schritte auf unserem Weg zur Größe!"
AST_german_research:5	"Deutscher Forschungspakt"
AST_communism_focus:5	"Kommunistisch werden"
AST_communism_focus_desc:5	"Nur wenn wir unser Volk vereinen, können wir uns gegen die Feinde durchsetzen, die uns zu vernichten drohen."
AST_workers_state:5	"Der Arbeiterstaat"
AST_workers_state_desc:5	"Wir sind ein Land der endlosen Wälder, der bodenlosen Minen, der fruchtbaren Böden und der pulsierenden Städte. Wir sind ein Land der Möglichkeiten, mit einem Arbeitsplatz für jeden Menschen und einem Menschen für jeden Arbeitsplatz."
AST_intervention_republicans:5	"Republikanische Intervention"
AST_intervention_republicans_desc:5	"Das republikanische Spanien braucht unsere Hilfe! \neder, der bereit ist, für die Sache zu kämpfen, sollte das auch dürfen. Wir können nicht zulassen, dass ein weiteres faschistisches Regime an Boden gewinnt."
AST_influence_neighbours:5	"Einflussnahme auf die Nachbarn"
AST_influence_neighbours_desc:5	"Der Kommunismus konzentriert sich auf die Menschen. Nicht das Volk einer Nation, sondern das Volk aller Nationen. Unsere Nachbarn sympathisieren mit dem Kommunismus, und es ist unsere Pflicht, ihnen den wahren Weg zu zeigen."
AST_communist_industry:5	"Großer Sprung nach vorn"
AST_communist_industry_desc:5	"Durch umfangreiche Investitionen in den Industriesektor und die Suche nach Ressourcen wurden neue Bergbaumöglichkeiten entdeckt. Große Bauxitvorkommen in der Weipa-Region in Queensland, die Coobina-Chromitmine in der Pilbara in Westaustralien und die Middleback Ranges in Südaustralien enthielten Arrium in Hülle und Fülle."
AST_mobalise_unions:5	"Mobilisieren Sie die Gewerkschaften"
AST_mobalise_unions_desc:5	"Gewerkschaften sind ein Mittel für die vielen Arbeiter, sich gegen die wenigen Eliten zu wehren. Jetzt, wo das Land vom Volk regiert wird, ist es an der Zeit, die Gewerkschaften in die Regierung zu integrieren, als eine echte Gewerkschaft des Volkes!"
AST_socialist_science:5	"Sozialistische Wissenschaft"
AST_socialist_science_desc:5	"Zu lange wurden die Wissenschaften vernachlässigt, unterfinanziert und von den Massen ignoriert. Damit ist jetzt Schluss. Nie wieder sollen die großen Geister unserer Zeit der Gnade der Elite ausgeliefert sein. Die Wissenschaft wird eines der Hauptziele unserer Nation sein, und sie wird die Finanzierung und Unterstützung erhalten, die sie benötigt, denn sie ist der Wegweiser für die Zukunft!"
AST_join_comintern:5	"Treten Sie der Komintern bei"
AST_join_comintern_desc:5	"Unsere Zukunft liegt im Kommunismus, also müssen wir uns unseren Genossen in aller Welt in diesem globalen Kampf anschließen. Papa Joe wird uns den Weg zeigen und die Arbeiter in Australien und überall sonst in ein glorreiches Morgen führen."
AST_communist_faction:5	"Boykottiert die Komintern"
AST_communist_faction_desc:5	"Stalin hat den Kommunismus korrumpiert! Die Komintern ist nicht die utopische Arbeitergesellschaft, von der die großen Marx und Lenin träumten, sie ist ein System, das nur zur systematischen Unterdrückung von Minderheiten und zur Aufblähung von Stalins Ego existiert! Wir werden uns niemals an einer solch verdrehten, degenerierten Gesellschaft beteiligen, und wir werden der Welt zeigen, was Kommunismus wirklich ist!"
AST_anti_japanese:5	"Anti-japanische Posen"
AST_anti_japanese_desc:5	"Unser Land ist ein Ziel des japanischen Ultranationalismus, sie glauben, dass wir nur ein Sprungbrett auf ihrem Weg zum Ruhm sind. Wir werden die Japaner wissen lassen, dass wir kein bloßer Stein sind, auf den man treten kann, wir sind das Volk, und wir werden uns wehren!"
AST_convert_nz:5	"Bekehrung Neuseelands"
AST_convert_nz_desc:5	"Das neuseeländische Volk ist seiner Regierung überdrüssig, die der britischen Krone wie ein Schoßhündchen dient. Wir werden nicht länger zulassen, dass ein solcher Missbrauch fortbesteht. Wir werden Forderungen stellen; Forderungen an das Vereinigte Königreich, Neuseeland von seinem imperialistischen Imperium zu befreien, und Forderungen an die neuseeländische Regierung, dass sie dem Volk dient und nicht, dass das Volk ihr dient."
AST_usa_pact:5	"Der Feind unseres Feindes"
AST_usa_pact_desc:5	"Amerika mag eines Tages unser Feind sein, aber an diesem Tag sind sie der Feind unseres Feindes. Der japanische Imperialismus muss eingedämmt und niedergeschlagen werden, und Amerika teilt den Wunsch, Japans Ambitionen zu zügeln."
AST_befriend_siam:5	"Siam unter Druck setzen"
AST_befriend_siam_desc:5	"Siam ist ein Bollwerk des indochinesischen Volkes, umgeben vom europäischen Kolonialismus und Imperialismus. Unsere Propagandabemühungen unter dem siamesischen Volk haben Wurzeln geschlagen, aber es ist an der Zeit, zu handeln, das Volk das Volk führen zu lassen und Siam den Kommunismus annehmen zu lassen."
AST_strengthen_white_australia:5	"Stärkung der Politik des Weißen Australiens"
AST_deterrence_desc:5	"Im Februar 1942 glaubten viele Australier, dass die Japaner in Australien einmarschieren würden. In Erwartung eines feindlichen Luftangriffs wurden Verdunkelungsvorschriften erlassen und Anweisungen zur Warnung vor Luftangriffen herausgegeben. Außerdem wurde an vielen Stränden der Ostküste Stacheldraht angebracht."
AST_volunteer_corps:5	"Rekrutierungspropaganda"
AST_foreign_expeditions:5	"Ausländische Expeditionen"
AST_foreign_expeditions_desc:5	"Da unsere Feinde bereit sind, für ihre Ideale in ferne Konflikte einzugreifen, müssen wir bereit sein, das Gleiche für unsere Ideale zu tun."
AST_why_we_fight:5	"Alle einbeziehen"
AST_british_tech:5	"Britische Technologien"
AST_british_tech_desc:5	"Durch den Austausch von technologischen Fortschritten mit unseren Verbündeten wird unsere gesamte Fraktion in der Lage sein, Forschung und Entwicklung im Krieg effizienter zu betreiben."
AST_weaken_white_australia:5	"Schwächung der White Australia Policy"
AST_social_security:5	"Gesetz zur sozialen Sicherheit"
AST_social_security_desc:5	"Das Sozialversicherungsgesetz von 1935 garantierte den Bundesstaaten Zuschüsse für die Altershilfe, Bundesleistungen für das Alter, Zuschüsse an die Bundesstaaten für die Arbeitslosenunterstützung, Beihilfen für unterhaltsberechtigte Kinder und viele andere Verbesserungen für das australische Volk. Australien wird sich von der Welt als ein Ort abheben, an dem alle das Recht haben, so zu leben, wie sie wollen, in Luxus zu leben und in Frieden zu leben."
AST_acdf_research_desc:5	"Die Forschungsentwicklung der Inselstaaten hat in allen möglichen Bereichen erstaunliche Leistungen hervorgebracht."
AST_offshore_cac:5	"Entwickeltes Offshore-CAC"
AST_tank_allow_infantry_tank_tt:5	"Ermöglicht die Erforschung und Herstellung des Infanteriepanzers Valentine und seiner Nachfolger\n"
AST_airborne_defence:5	"Luftverteidigung"
AST_expand_northern_presence_desc:5	"Da sich unsere Städte größtenteils an der Ost- und Westküste der Insel befinden, ist die Nordgrenze Australiens im Falle einer Invasion oder eines Angriffs nicht ausreichend verteidigt oder vorbereitet. Neue militärische Strukturen in diesem Gebiet werden willkommen sein."
AST_naval_bombers:5	"Marinebomber"
AST_dominate_the_skies:5	"Beherrschung des Luftraums"
AST_dominate_the_skies_desc:5	"Australien ist von vielen feindlichen Luftwaffenstützpunkten weit entfernt, daher sollte es unser Ziel sein, in unserem Teil der Welt die totale Luftüberlegenheit zu erlangen."
AST_cockatoo_island_shipyards:5	"Cockatoo Island Schiffswerften"
AST_cockatoo_island_shipyards_desc:5	"Der Ausbau und die Verbesserung der Cockatoo Island Shipyards ist eine wichtige Priorität für unsere Regierung. Sydney Harbour hat den besten Zugang zu Arbeitskräften und Ressourcen, und dort sollten wir unsere Bemühungen im Marinebau konzentrieren."
AST_cruisers_desc:5	"Wir können die Schlachtschiffe und Flugzeugträger den großen Hunden überlassen, denn eine Masse von Schiffen in Kreuzergröße wird unseren Bedarf mehr als decken."
AST_expand_lithgow_small_arms_factory_desc:5	"Unsere Vickers und Brens kommen aus der Lithgow Small Arms Factory. Je größer sie wird, desto leichter wird es uns fallen, unsere Kampfkraft zu erhöhen."
AST_expand_the_northern_railway:5	"Ausbau der Nordbahn"
AST_australian_arms_production_desc:5	"Die langen Transportzeiten bedeuten, dass Australien eine größere Verantwortung für die Produktion seiner eigenen Waffen übernehmen muss als andere Dominions. Wir haben die Fabriken, und wir haben das Know-how."
AST_establish_advisory_war_council:5	"Beratenden Kriegsrat einrichten"
AST_establish_advisory_war_council_desc:5	"Die australischen Politiker müssen ideologische und parteipolitische Meinungsverschiedenheiten beiseite lassen und zusammenkommen, um sich zu beraten und über die Kriegsführung zu informieren."
AST_rats_of_tobruk:5	"Ratten von Tobruk"
AST_strengthen_ties_with_uk_desc:5	"Unsere Loyalität gilt dem Mutterland. Wir werden dorthin gehen, wohin es uns folgt, und uns verpflichten, seine Feinde zu bekämpfen. Gott schütze den König."
AST_commonwealth_aircraft_corporation:5	"Commonwealth Aircraft Corporation"
AST_commonwealth_aircraft_corporation_desc:5	"Die Commonwealth Aircraft Corporation ist der wichtigste Hersteller von Flugzeugen und Flugzeugmotoren in Australien. Sie hat eine nachgewiesene Erfolgsbilanz, und ihre Unterstützung wird unseren Piloten das erforderliche Material liefern."
AST_sever_ties_with_uk:5	"Abbruch der Beziehungen zu Großbritannien"
AST_protect_the_homeland:5	"Das Heimatland beschützen"
AST_protect_the_homeland_desc:5	"Australien ist groß, aber seine Küsten können geschützt werden. Die Sicherheit unserer eigenen Nation hat höchste Priorität."
AST_the_swpa_menace:5	"Die SWPA-Bedrohung"
AST_woo_usa:5	"Umwerben Sie die USA"
AST_protect_the_dutch_colonies:5	"Die niederländischen Kolonien beschützen"
AST_protect_the_dutch_colonies_desc:5	"Die Niederlande sind ein schwacher und weit entfernter Herr über ihre indonesischen Kolonien. Sie können sie nicht gegen Angriffe aus Japan, China oder anderen potenziell feindlichen Nationen verteidigen. Wir müssen zum Wohle der Allgemeinheit die Kontrolle übernehmen."
AST_the_south_west_pacific_initiative:5	"Die Südwestpazifik-Initiative"
AST_preemptive_intervention:5	"Präventive Intervention"
AST_preemptive_intervention_desc:5	"Japans Aufbau eines Imperiums im letzten Jahrzehnt stellt eine Bedrohung für jedes freie Volk im Pazifik dar. Wir können es uns nicht leisten zu warten, bis es seine hungrigen Augen in unsere Richtung richtet. Die Zeit zum Handeln ist jetzt gekommen."
AST_research_cooperation:5	"Forschungszusammenarbeit"
AST_research_cooperation_desc:1	"Die Australier sind ein intelligentes und einfallsreiches Volk, aber wir haben weder die Infrastruktur noch die Bevölkerung für ein ernsthaftes wissenschaftliches Programm. Wir werden mit unseren Verbündeten zusammenarbeiten und Wissen und Durchbrüche zum gegenseitigen Nutzen teilen."
AST_abandon_the_westminster_system:5	"Abschaffung des Westminster-Systems"
AST_support_the_centre_party:5	"Unterstützen Sie die Zentrumspartei"
AST_support_the_centre_party_desc:5	"In New South Wales hat sich eine energische antikommunistische Bewegung gebildet. Unterstützt von ihren Verbündeten der Neuen Garde könnte die Zentrumspartei der Schlüssel zur Stärkung Australiens sein."
AST_demand_new_zealand:5	"Fordern Sie Neuseeland"
AST_demand_new_zealand_desc:5	"Die Kiwis sind seit langem unsere engsten Verbündeten und Freunde. Wir haben an denselben Stränden gekämpft und sind in denselben nutzlosen imperialen Kriegen gestorben. Es ist an der Zeit, unsere beiden Länder unter einer Flagge zu vereinen."
AST_protect_the_south_west_pacific:5	"Schützen Sie den Südwestpazifik"
AST_protect_the_south_west_pacific_desc:5	"Es ist an der Zeit, unsere regionale Macht zu nutzen, um den gesamten Südwestpazifik in unsere Einflusssphäre zu bringen. Nur wir können die Menschen und Ressourcen vor Außenstehenden schützen, die unser Erbe plündern wollen."
AST_a_deal_with_japan_desc:5	"Mit dem Südwestpazifik in unserer Einflussphäre können wir eine Annäherung mit dem Kaiserreich Japan erreichen. Wenn es im Nordwesten bleibt und uns unsere Sphäre überlässt, gibt es für uns keinen Grund, zu kämpfen."
AST_japan_tech_sharing:5	"Gemeinsame Nutzung japanischer Technologie"
AST_war_on_japan:5	"Krieg gegen Japan"
AST_delegation_to_china_desc:5	"Das chinesische Volk, das seit langem von imperialer Gier zerrissen ist, braucht einen Freund. Und wir brauchen einen regionalen Verbündeten gegen den Faschismus. Dieses offizielle Treffen mit der chinesischen Regierung wird uns näher zusammenbringen."
AST_commitment_to_the_cause_desc:5	"Es ist an der Zeit, die Fesseln eines fremden Königs abzuschütteln und ein Arbeiterparadies zu errichten, das frei ist von der imperialistischen Kriegstreiberei, die ganz Australien gefährdet."
AST_direct_support_desc:5	"Zu den Waffen, Kameraden! Hört den Ruf unserer chinesischen Brüder, die im Krieg gegen den Faschismus leiden! Unterschreibt und schließt euch dem weltweiten Kampf aller Arbeiter an!"
CAN_war_measures:0	"Gesetz über Kriegsmaßnahmen"
CAN_quebec:0	"Die Wahlen in Quebec beeinflussen"
CAN_home:0	"Behalte sie zu Hause"
CAN_prairies:0	"Die Prärien entwickeln"
CAN_bombing:0	"Präzisionsbombardierung"
CAN_trans_airline:0	"Trans-Canada Airlines"
CAN_eastern:0	"Ostkommando"
CAN_spits:0	"Die zwei Brüder"
CAN_sea_patrol:0	"Auf den Meeren patrouillieren"
CAN_air_slot:0	"£tech_mod Luftforschung"
CAN_aerodrome:0	"Flugplatz der Demokratie"
CAN_ww1:0	"Erbe des Ersten Weltkriegs"
CAN_firefly:0	"Firefly AT Tank"
CAN_conference:0	"Konferenz der Verteidigungsverbände"
CAN_ca:0	"Panzerkreuzer"
CAN_mobile_airfields:0	"Mobile Flugplätze"
CAN_algoma:0	"Algoma Steel modernisieren"
CAN_windsor:0	"Revitalisierung des Montagewerks Windsor"
CAN_science_materials:0	"Die Wissenschaft der Materialien"
CAN_labrador:0	"Verantwortung für Labrador übernehmen"
CAN_prov_power:0	"Bennetts New Deal durchschlagen"
CAN_crown_corporations_desc:5	"Um wesentliche Dienstleistungen bereitzustellen und das wirtschaftliche und industrielle Wachstum zu fördern, muss Kanada viele neue staatliche Unternehmen gründen. Wo die Privatwirtschaft nicht einspringen will, muss die Regierung einspringen."
CAN_war_bonds:5	"Kriegsanleihen"
CAN_war_bonds_desc:5	"Wir können die Kriegsanstrengungen nicht auf der Grundlage unserer mageren Steuerbasis oder unserer Rohstoffexporte finanzieren. Das patriotische kanadische Volk muss in sein Land investieren und die Kriegsanstrengungen durch Kriegsanleihen unterstützen."
CAN_defence_of_canada_regulations:5	"Verordnungen zur Verteidigung Kanadas"
CAN_defence_of_canada_regulations_desc:5	"In Kriegszeiten müssen die Bürgerrechte beschnitten werden, um eine Unterwanderung der Kriegsanstrengungen zu verhindern. Dies bedeutet Einschränkungen für die Presse, Dissidentengruppen und einige gesetzliche Rechte."
CAN_national_housing_act:5	"Nationales Wohnungsbaugesetz"
CAN_national_housing_act_desc:5	"Ein sich modernisierendes Dominion braucht landesweit einheitliche Vorschriften für den Wohnungsbau. Wir müssen die Lebensbedingungen für alle Kanadier verbessern."
CAN_dollar_a_year_men:5	"Dollar-Jahres-Menschen"
CAN_dollar_a_year_men_desc:5	"Die kanadische Industrie hat Probleme mit der Effizienz, aber eine Reihe wohlhabender Geschäftsleute haben ihre Dienste und Ratschläge gegen eine symbolische Summe angeboten. Diese kleine Gruppe von Beratern wird uns voranbringen."
CAN_maritime_colonial_railway:5	"Maritime Koloniale Eisenbahn"
CAN_retool_angus_shops:5	"Umrüstung der Angus Shops"
CAN_retool_angus_shops_desc:5	"Eine moderne Armee braucht Panzer, und die Angus Shops der CPR sind für deren Bau geeignet. Rüsten Sie diese Infrastruktur für den Bau von Panzern um und rüsten Sie sie um."
CAN_imperial_oil:5	"Imperiales Öl"
CAN_imperial_oil_desc:5	"Imperial Oil möchte die Exploration in Westkanada finanzieren. Dies wird unsere Erdölreserven erhöhen und die Kriegsmaschinerie schmieren."
CAN_department_of_munitions_and_supply:5	"Ministerium für Munition und Versorgung"
CAN_department_of_munitions_and_supply_desc:5	"Wir werden die Kontrolle und Verwaltung der nationalen Ressourcen Kanadas unter C.D. Howe im Ministerium für Munition und Versorgung zusammenfassen."
CAN_national_resources_mobilization_act:5	"Gesetz zur Mobilisierung der nationalen Ressourcen"
CAN_national_resources_mobilization_act_desc:5	"Kanada ist groß und seine Bevölkerung ist über das ganze Land verstreut. Es sollte ein System entwickelt werden, um den Beschäftigungsstatus zu verfolgen und sicherzustellen, dass jeder, der für den Dienst in Übersee in Frage kommt, ausfindig gemacht werden kann."
CAN_wartime_prices_and_trade_board:5	"Amt für Kriegspreise und Handel"
CAN_wartime_prices_and_trade_board_desc:5	"Um Wucher und Hortung zu verhindern, wurden Preiskontrollen eingeführt, um die meisten Kanadier mit Waren zu versorgen."
CAN_bits_and_pieces_program:5	"Programm Bits and Pieces"
CAN_bits_and_pieces_program_desc:5	"Das "Bits and Pieces"-Programm mobilisiert für die Kriegsanstrengungen eine Reihe von kleinen Fabriken, die sich der Herstellung kleinerer Konsumgüter verschrieben haben. Eine Fahrradfabrik kann Kapazitäten für eine Reihe von nützlichen Kriegsgütern finden."
CAN_fund_the_national_research_council:5	"£tech_mod Finanzierung des Nationalen Forschungsrats"
CAN_fund_the_national_research_council_desc:5	"Kanada hat eine lange Geschichte der Wissenschaft und des Fortschritts, aber der Bedarf an Forschern ist größer denn je. Es ist an der Zeit, dem NRC mehr Gewicht zu verleihen."
CAN_mine_the_shield:5	"Abbau des Schildes"
CAN_mine_the_shield_desc:5	"Der Kanadische Schild ist reich an Nickel, Kupfer, Gold und Silber. Die Natur hat uns mit Mineralien reichlich beschenkt. Es ist an der Zeit, diese weiter auszubeuten."
CAN_canada_wheat_board:5	"Kanadisches Weizenamt"
CAN_canada_wheat_board_desc:5	"Die verheerenden Folgen der Depression für unsere westlichen Landwirte können behoben werden, wenn wir das Canada Wheat Board wiederbeleben und die Preise für den Verkauf von Weizen, Gerste, Hafer und anderen Feldfrüchten festlegen."
CAN_victory_aircraft_limited:5	"Victory Aircraft Limited"
CAN_victory_aircraft_limited_desc:5	"Victory Aircraft wurde mit dem Bau von Kanadas Bomberflotte beauftragt. Lancaster ist für alle da!"
CAN_alberta_coal_towns:5	"Alberta Kohle-Städte"
CAN_alberta_coal_towns_desc:5	"Entlang der Rocky Mountains gibt es Kohlelagerstätten, die darauf warten, ausgebeutet zu werden. Wir können die Auswanderung zu diesen neuen Minenstandorten fördern und die Beschäftigung im Westen verbessern."
CAN_commit_to_the_war:5	"Engagieren Sie sich für den Krieg"
CAN_commit_to_the_war_desc:5	"Die Welt brennt, und Kanada hat eine Rolle zu spielen. Wir geloben, die Demokratie und den britischen Lebensstil zu schützen."
CAN_john_inglis_and_company_desc:5	"John Inglis and Company sollte angewiesen werden, neue Maschinengewehre und Kanonen für die kanadische Armee zu bauen."
CAN_polymer_corporation:5	"Polymer Corporation"
CAN_national_steel_car:5	"National Steel Car"
CAN_national_steel_car_desc:5	"Die National Steel Car Company hat zwar mit der Depression zu kämpfen, verfügt aber über das Fachwissen und die Erfahrung, um beim Bau der Fahrzeuge zu helfen, die wir für die erweiterte Eisenbahn und die Armee benötigen."
CAN_send_in_the_zombies:5	"Schickt die Zombies rein"
CAN_send_in_the_zombies_desc:5	"Es ist an der Zeit, alle tauglichen Männer Kanadas in die Armee zu schicken. Wir haben durch die NRMA viele Männer für die Arbeit in der Industrie mobilisiert, aber jetzt sollten sie nach Übersee geschickt werden."
CAN_if_day:5	"Wenn Day"
CAN_if_day_desc:5	"Die Kanadier nehmen die Bedrohung durch die Fremdherrschaft nicht ernst, also werden wir eine Nazi-Besetzung von Winnipeg simulieren, um die Angst zu vertreiben. Das wird sicherlich den Absatz von Siegesanleihen steigern."
CAN_defense_research_grants:5	"£tech_mod Zuschüsse für die Verteidigungsforschung"
CAN_defense_research_grants_desc:5	"Jetzt, da Kanada eine souveräne Nation ist, haben wir nicht mehr wie früher Zugang zu Militärberatern und Theoretikern. Wir müssen dafür sorgen, dass wir unseren Feinden immer einen Schritt voraus sind und technologisch nicht ins Hintertreffen geraten."
CAN_uranium_mining:5	"Uranabbau"
CAN_uranium_mining_desc:5	"Unsere Verbündeten arbeiten an einem geheimen Projekt, für das Uran benötigt wird. Glücklicherweise hat das Unternehmen Eldorado das seltene Mineral entdeckt und eine Stadt rund um die Minen errichtet - Port Radium. Die Regierung muss die Kontrolle über dieses Unternehmen übernehmen und dieses hochsensible Mineral schützen."
CAN_long_branch_arsenal:5	"Long Branch Arsenal"
CAN_long_branch_arsenal_desc:5	"Das Long Branch Arsenal im Westen Torontos wird unser Zentrum für die Gewehrproduktion sein. Wir brauchen Tausende von Lee-Enfields, und die zentrale Lage des Arsenals wird uns bei der Verteilung im ganzen Land helfen."
CAN_independent_command_desc:5	"Im Ersten Weltkrieg waren die kanadischen Truppen letztlich britischen Offizieren unterstellt, was zu einem sinnlosen Gemetzel an der Somme und in Passchendaele führte. Dieses Mal wird Kanada sein eigenes Kommando haben."
CAN_forced_quebec_conscription:5	"Zwangseinberufung in Quebec"
CAN_forced_quebec_conscription_desc:5	"Genau wie 1917 wehren sich unsere frankokanadischen Bürger in Quebec gegen die Idee einer nationalen Wehrpflicht, um mehr Männer in die Armee zu bringen. Wir werden nicht tatenlos zusehen, wie sich eine Minderheit über den Willen des Parlaments hinwegsetzt."
CAN_compromise_with_quebec:5	"Kompromiss mit Québec"
CAN_war_fueled_economy:5	"Der Krieg beflügelt die Wirtschaft"
CAN_war_fueled_economy_desc:5	"Die Nachfrage aus Übersee nach Rohstoffen und Fertigwaren holt Kanada aus der Depression. Unser natürlicher Reichtum an Wäldern und Mineralien kann die Kriegsmaschinerie der Alliierten speisen und die Nation bereichern."
CAN_army_modernization:5	"Modernisierung der Armee"
CAN_army_modernization_desc:5	"Zu lange hat sich Kanada in seinem feuerfesten Haus, weit weg von brennbaren Stoffen, abgesichert und seine Armee mit veralteter Ausrüstung und Ausbildung auskommen lassen. Wir müssen die Modernisierung in Angriff nehmen, bevor es zu spät ist."
CAN_canadian_infantry_corps:5	"Kanadisches Infanteriekorps"
CAN_royal_regiment_of_canadian_artillery_desc:5	"Trotz des Mangels an modernen Kanonen müssen wir damit beginnen, unsere Artilleristen für einen modernen Krieg auszubilden, einschließlich des Einsatzes von Flugabwehrkanonen und neuen 25-Pfündern."
CAN_a_motorized_army:5	"Eine motorisierte Armee"
CAN_a_motorized_army_desc:5	"Kanadas Erfahrung in der Herstellung von Lastwagen und Motoren verschafft uns einen Vorsprung bei der Forschung und Entwicklung motorisierter Streitkräfte."
motorised_template_TT:0	"Erhalten Sie eine kostenlose motorisierte Vorlage"
CAN_montreal_shipyards:0	"Montreal Shipyards"
CAN_red_deer_training_camp:5	"Ausbildungslager Red Deer"
CAN_red_deer_training_camp_desc:5	"Das Red Deer Training Camp wird der Hauptstandort für die Ausbildung unserer neuen Armee sein. Mit einem kompletten Waffenarsenal und nahe gelegenen Flugplätzen ist Red Deer ideal gelegen."
CAN_the_walkie_talkie:5	"Das Walkie-Talkie"
CAN_the_walkie_talkie_desc:5	"Donald Hings hat ein neues tragbares Zwei-Wege-Kommunikationsgerät erfunden und zum Patent angemeldet, das mit Funkwellen arbeitet. Dies wird die Kommunikation und die Zielerfassung erheblich verbessern."
CAN_1st_canadian_parachute_battalion:5	"1. kanadisches Fallschirmjägerbataillon"
CAN_1st_canadian_parachute_battalion_desc:5	"Trotz des Widerstands derjenigen, die es vorziehen würden, dass wir uns auf die Landesverteidigung konzentrieren, braucht die moderne Luftlandekriegsführung ein spezielles Fallschirmjägerbataillon, um unsere Feinde zu überwältigen."
CAN_the_black_devils_desc:5	"Eine spezielle Kommandoeinheit muss für gefährliche Einsätze zur Verfügung stehen. Die Zusammenarbeit mit unseren amerikanischen Verbündeten bei der Aufstellung der Devil's Brigade wurde bereits vereinbart."
CAN_the_valentine_tank:5	"Der Valentine-Panzer"
CAN_the_valentine_tank_desc:5	"Kanada sollte mit der Produktion des Valentine-Panzers beginnen, einem robusten Infanteriepanzer britischer Bauart."
CAN_the_cruiser_tanks:5	"Die Cruiser-Panzer"
CAN_the_cruiser_tanks_desc:5	"Kanada sollte sich um die Produktion der hochmobilen britischen Kreuzerpanzer bemühen."
CAN_heavy_cruiser_tanks:5	"Schwere Kreuzerpanzer"
CAN_heavy_cruiser_tanks_desc:5	"Um mit der raschen Entwicklung von Panzern Schritt zu halten, müssen wir dem britischen Beispiel folgen und schwerere und leistungsfähigere Kreuzerpanzer herstellen."
CAN_the_american_mediums:5	"Die amerikanischen mittleren Panzer"
CAN_the_american_mediums_desc:5	"Die Vereinigten Staaten haben eine rasante Entwicklung ihrer mittleren Panzer erlebt - unsere gemeinsame Grenze macht den Technologietransfer zur Herstellung unserer eigenen Versionen dieser Panzer einfach."
CAN_tank_allow_valentine_tt:5	"Ermöglicht die Erforschung und Produktion des Valentine-Panzers und seiner Nachfolger\n"
CAN_tank_allow_cruiser_tank_tt:5	"Ermöglicht die Erforschung und Herstellung von leichten Kreuzerpanzern bis zum Mk.VI\n\n"
CAN_tank_allow_cruiser_tank_heavy_tt:5	"Ermöglicht die Erforschung und Herstellung schwerer Kreuzerpanzer\n\n"
CAN_tank_allow_usa_mediums_tt:5	"Ermöglicht die Erforschung und Herstellung der Panzer Ram und Grizzly\n\n"
CAN_the_rocky_mountain_rangers_desc:5	"Die Heimatverteidigung im Westen wird von den Rocky Mountain Rangers übernommen, die in Kamloops stationiert sind."
CAN_strengthen_the_commonwealth_ties:5	"Stärkung der Commonwealth-Bindungen"
CAN_shadow_factories:5	"Schattenfabriken"
CAN_shadow_factories_desc:5	"Wir brauchen Flugzeugfabriken, aber es ist einfacher und sicherer, die Herstellung der Teile auf andere Fabriken zu verteilen, insbesondere in der Nähe von Automobilwerken. Dies fördert die Geheimhaltung und Sicherheit."
CAN_montreal_laboratory_collaboration_desc:1	"Das Montrealer Laboratorium ist zu einem Anziehungspunkt für Wissenschaftler aus der ganzen Welt geworden. Französische und britische Wissenschaftler haben sich besonders willkommen gefühlt und bringen dringend benötigtes Fachwissen in die Bemühungen der Dominions ein."
CAN_the_plan:5	"Der Plan"
CAN_supply_the_empire_desc:5	"Gibt es eine Nation, die so reich an Holz, Eisen, Nickel und Kohle ist? Solange unsere Konvois und Eisenbahnen sicher sind, können wir Rohstoffe zu unseren Häfen und dann zu unseren imperialen Partnern verschiffen."
CAN_aluminium_company_of_canada:5	"Kanadische Aluminiumgesellschaft"
CAN_aluminium_company_of_canada_desc:5	"Aluminium ist leicht und rostfrei. Durch die Ausweitung des Abbaus und der Produktion von Aluminium können wir sicherstellen, dass unsere Fabriken und Fließbänder immer versorgt sind."
CAN_turner_valley_oilfield:5	"Turner Valley-Ölfeld"
CAN_turner_valley_oilfield_desc:5	"Das 1914 entdeckte Turner Valley bei Calgary hat sich zu einem der größten Ölfelder des Empire entwickelt. Die weitere Erschließung sollte für die Industrie und die Regierung oberste Priorität haben."
CAN_patriation:5	"Patriation"
CAN_patriation_desc:5	"Für Kanada ist es an der Zeit, seine Bindungen an Mutter England zu lösen. Wir sind eine gewachsene Nation mit einem eigenen Schicksal, die auf den Kontinent und den Pazifik ebenso schaut wie auf England und Europa."
CAN_permanent_joint_defense_board:5	"Ständiger Gemeinsamer Verteidigungsausschuss"
CAN_permanent_joint_defense_board_desc:5	"Geografie und gemeinsames Erbe verbinden uns mit den Vereinigten Staaten, aber der Kontinent ist zu groß, als dass einer von uns ihn allein verteidigen könnte. Zur Beratung und Planung des Schutzes Nordamerikas ist ein gemeinsames Verteidigungsgremium erforderlich."
CAN_alaska_highway:0	"Alaska Highway"
CAN_habakkuk_carrier_desc:5	"Das Projekt Habakkuk ist unser Plan, einen Anti-U-Boot-Träger aus einem Material zu bauen, das aus Zellstoff und Eis besteht. Dadurch wird Stahl für wichtigere Zwecke frei, und die kanadische Wissenschaft wird gefördert."
CAN_rcaf_station_borden:5	"RCAF-Station Borden"
CAN_rcaf_station_borden_desc:5	"Kanadas Fliegerkorps wurde in Borden, Ontario, geboren, und dieser Stützpunkt sollte für die Ausbildung einer neuen Generation von Piloten genutzt werden."
CAN_we_have_the_hurricane:5	"Wir haben den Hurricane"
CAN_we_have_the_hurricane_desc:5	"Das Vereinigte Königreich hat uns die Genehmigung erteilt, eine Reihe von Hurricane-Jagdflugzeugen zu bauen. Diese Flugzeuge werden den Kern unserer Luftstreitkräfte bilden."
CAN_the_pacific_coast_air_defence_radar_system:5	"Das Luftverteidigungsradarsystem für die Pazifikküste"
CAN_the_pacific_coast_air_defence_radar_system_desc:5	"Die Küste von British Columbia ist felsig und mit Ausnahme des Südens nur dünn besiedelt. Wir werden uns auf Frühwarnsysteme wie eine Kette von Radarstationen verlassen müssen, um alles Ungewöhnliche zu erkennen, das über den Pazifik kommt."
CAN_commonwealth_air_training_plan:5	"Gemeinsames Luftkampftraining des Commonwealth"
CAN_commonwealth_air_training_plan_desc:5	"Die Luftkampfausbildung wird mit unseren Verbündeten aus dem Commonwealth und dem Dominion koordiniert. Dies ist effizienter und kann in großer Zahl und sicher auf unseren Flugplätzen durchgeführt werden."
CAN_fund_fairchilds_development:5	"Finanzierung der Entwicklung von Fairchild"
CAN_fund_fairchilds_development_desc:5	"Das Fairchild-Flugzeugwerk in Quebec sollte die Mittel erhalten, die es zur Steigerung der Produktion von Bomberteilen benötigt. Wir sollten in der Lage sein, die Zahl der Arbeitsplätze in diesem Werk um Tausende zu erhöhen."
CAN_cookie_carriers:5	"Flugzeugträger"
CAN_cookie_carriers_desc:5	"Der strategische Luftkrieg erfordert schwere Bomber, die Leckerbissen auf unsere Feinde abwerfen."
CAN_the_sabre_project:5	"Das Sabre-Projekt"
CAN_the_sabre_project_desc:5	"Düsenflugzeuge werden den Himmel der Zukunft beherrschen, daher sollten wir in die Produktion unserer eigenen Varianten ausländischer Düsenflugzeuge investieren."
CAN_halifax_shipyards:5	"Halifax-Werften"
CAN_destroyer_effort:5	"Zerstörer Bemühungen"
CAN_destroyer_effort_desc:5	"Die Bedrohung durch U-Boot Angriffe auf Nachschub- und Truppenkonvois macht es erforderlich, dass wir uns auf den Bau von Zerstörern konzentrieren, um diese Unterwassergefahren zu jagen und zu vernichten."
CAN_light_cruiser_effort:5	"Bemühungen um leichte Kreuzer"
CAN_light_cruiser_effort_desc:5	"Wir werden nie in der Lage sein, viele Großkampfschiffe zu bauen, aber kleinere Kreuzer, die in großer Zahl gebaut werden, können immer noch eine große Wirkung haben."
CAN_heavy_cruiser_effort:5	"Schwere Kreuzer"
CAN_heavy_cruiser_effort_desc:5	"Wir können unsere Flotten um schwere Kreuzer herum aufbauen und verfügen über mehr als genug Häfen, um diese Strategie praktikabel zu machen."
CAN_escort_fleet:5	"Geleitflotte"
CAN_escort_fleet_desc:5	"Die Ozeane trennen uns von den meisten Unruhen der Welt. Wenn unsere Armeen also kämpfen und versorgt werden sollen, müssen wir Geleitschutzformationen und der U-Boot-Bekämpfung Vorrang einräumen."
CAN_fleet_in_being:5	"Präsenzflotte (Fleet in being)"
CAN_fleet_in_being_desc:5	"Wenn wir eine große Seestreitmacht aufbauen, kann ihre bloße Existenz eine Bedrohung für unsere Feinde darstellen, selbst wenn wir sie nie einsetzen. Allein der Gedanke, dass unsere Schiffe auslaufen und ihre Seewege angreifen, zwingt sie zur Vorsicht."
CAN_trade_fleet_desc:5	"Kanada ist eine Handelsnation. Bauen Sie mehr Frachter und Konvois."
CAN_french_unity:0	"Anglo-französische Einheit"
CAN_french_unity_TT:0	"§Y$CAN_french_unity$§! ändern durch: \n"
CAN_french_unity_set_TT:0	"§Y$CAN_french_unity$§! wird gesetzt auf: \n"
french_conscription_factor_TT:0	"     $MODIFIER_CONSCRIPTION_FACTOR$: $RIGHT|%+=0$."
french_party_drift_TT:0	"     $neutrality_drift$: $RIGHT|-=2$"
french_stability_TT:0	"     $MODIFIER_STABILITY_WEEKLY$: $RIGHT|%+=2$"
SAF_emergency_workers_desc:5	"Es ist an der Zeit, einen größeren Teil der südafrikanischen Bevölkerung für die Kriegsanstrengungen zu mobilisieren. Auch Frauen können zu geringeren Kosten in den Fabriken eingesetzt werden."
SAF_reconstitute_the_cape_corps_desc:5	"In der Vergangenheit konnten wir einen Teil unserer farbigen Bevölkerung zum Dienst an der Verteidigung Südafrikas verpflichten. Dies ist nicht bei allen im Lande beliebt, aber es wird weißen Südafrikanern die Möglichkeit geben, in Übersee zu dienen."
SAF_work_for_all_poor:5	"Arbeit für alle Armen"
SAF_work_for_all_poor_desc:5	"In den letzten Jahren sind arme Afrikaner vom Land auf der Suche nach Arbeit in die Städte geströmt, und wir haben wenig getan, um ihnen zu helfen. Bis jetzt. Die Industrialisierung und der staatliche Schutz ihres Zugangs zur Arbeit werden dieser Bevölkerung helfen."
SAF_outlaw_strikes:5	"Streiks verbieten"
SAF_outlaw_strikes_desc:5	"Arbeitsniederlegungen und Arbeitsunterbrechungen sind in Zeiten der Krise unpatriotisch. Streiks werden hiermit für illegal erklärt, und die Regierung wird die Menschen wieder zur Arbeit zwingen."
SAF_buffelspoort:	"Buffelspoort-Staudamm"
SAF_hospital:	"Groote-Schuur-Krankenhaus"
SAF_windhoeker:	"Windhoeker Maschinenfabrik"
SAF_police_windhoek:5	"Polizei Windhoek"
SAF_joint_air_training_scheme:5	"Gemeinsames Lufttrainingsprogramm"
SAF_joint_air_training_scheme_desc:5	"Die Commonwealth-Staaten bündeln ihre Ressourcen und Erfahrungen, um die Ausbildung von Piloten und Flugpersonal zu erleichtern und zu beschleunigen."
SAF_desert_equipment:5	"Ausrüstung für die Wüste"
SAF_desert_equipment_desc:5	"Der Krieg in Nordafrika erfordert spezielle Ausrüstung, und da unsere Streitkräfte an dieser Front eingesetzt werden könnten, wird die Bereitstellung und Lieferung dieser Ausrüstung zu einer wichtigen logistischen Angelegenheit."
SAF_suppress_the_stormjaers_desc:5	"Die faschistische pro-deutsche Ossewabrandwag (OB) hat einen paramilitärischen Flügel nach dem Vorbild ähnlicher europäischer Gruppen. Sie stören die Bemühungen der Regierung, Truppen zu rekrutieren und eine sichere und einheitliche Kriegspolitik zu betreiben. Die Stormjaers müssen aufgelöst werden."
SAF_secure_interests_in_africa_desc:5	"Die Union von Südafrika grenzt an eine Reihe britischer Kolonien, die unserer Verwaltung anvertraut werden könnten. Wir sollten auch alles in unserer Macht Stehende tun, um unser Mandat über Südwestafrika dauerhaft zu sichern."
SAF_native_laws_amendment_act:5	"Gesetz zur Änderung der Eingeborenengesetze"
SAF_native_laws_amendment_act_desc:5	"Um der afrikanischen Bevölkerung weiterhin Arbeit zu garantieren, müssen wir die Ansiedlung von schwarzen Südafrikanern in den Städten begrenzen. Nur diejenigen, die schon lange in der Gemeinde ansässig sind, erhalten ein Aufenthaltsrecht."
SAF_voortrekker_monument_desc:5	"Ein Denkmal für die Voortrekker, die den Großen Treck unternahmen, wird den nationalen Geist und die Einheit in diesen schwierigen Zeiten stärken."
SAF_commemorate_the_battle_of_blood_river:5	"Gedenken an die Schlacht am Blood River"
SAF_commemorate_the_battle_of_blood_river_desc:5	"Im Jahr 1838 hielt eine Wagenburg von Buren-Siedlern Zehntausende von Zulu-Kriegern auf und versetzte der Zulu-Macht in Natal einen vernichtenden Schlag. Dies war sicherlich ein göttliches Zeichen für die Richtigkeit unserer Sache."
SAF_south_african_railways:5	"Südafrikanische Eisenbahnen"
SAF_south_african_railways_desc:5	"Die südafrikanische Eisenbahngesellschaft muss ausgebaut werden. Junge Menschen können dort ausgebildet werden und die notwendigen Fähigkeiten erhalten, um sowohl im Land zu arbeiten als auch in Übersee zu dienen."
SAF_expand_the_mining_industry:5	"Ausbau der Bergbauindustrie"
SAF_expand_the_mining_industry_desc:5	"Südafrikas Mineralienreichtum ist legendär, und wir haben gerade erst begonnen, seine tiefen Reserven an Gold, Chrom und Platin zu erschließen."
SAF_heavy_engineering:5	"Schwermaschinenbau"
SAF_heavy_engineering_desc:5	"Es ist wichtig, dass Südafrika auf dem neuesten Stand der Ingenieurtechnik bleibt. Auch wenn unsere industrielle Basis klein ist, sollten wir in Schwermaschinen und -technik investieren, um schnell zu unseren Konkurrenten aufzuschließen."
SAF_infrastructure_effort:5	"Infrastrukturanstrengungen"
SAF_infrastructure_effort_desc:5	"Ein Großteil Südafrikas ist nach wie vor ländlich und unterentwickelt. Mehr Straßen und Eisenbahnen können den natürlichen Reichtum des Landes zu seinen hungrigen Häfen bringen."
SAF_armament_effort:5	"Rüstungsanstrengungen"
SAF_south_african_steel:5	"Südafrikanischer Stahl"
SAF_south_african_steel_desc:5	"Wir haben die Kohle und das Eisen. Jetzt haben wir den Grund. Die Erweiterung des Iscor-Stahlwerks in Pretoria wird das Land mit dem für moderne Waffen erforderlichen schweren Stahlblech versorgen."
SAF_pretoria_arms:5	"Pretoria-Waffen"
SAF_pretoria_arms_desc:5	"Das bestehende Stahlwerk in Pretoria hat sich auf Grobblech konzentriert. Mit einigen Werkzeugmaschinen können wir jedoch einen Teil des Werks in ein Zentrum für die Produktion von Kleinwaffen umwandeln."
SAF_expand_the_rand_mines:5	"Ausweitung der Rand-Minen"
SAF_expand_the_rand_mines_desc:5	"Die Rand-Minen gehören zu den tiefsten Goldminen der Welt - und das sogar mit der Technologie des 19. Jahrhunderts. Wir sind jetzt zu so viel mehr in der Lage. Graben Sie tief! Und gierig, sogar."
SAF_fund_the_university_of_south_africa:5	"£tech_mod Fund der Universität von Südafrika"
SAF_fund_the_university_of_south_africa_desc:5	"Die Universität von Südafrika in Pretoria ist eine der besten Universitäten des Kontinents, ja sogar der südlichen Hemisphäre. Wenn wir in sie investieren, können wir unsere eigenen Talente ausbilden, anstatt unsere jungen Leute ins Ausland zu schicken."
SAF_establish_the_atomics_energy_board:5	"Einrichtung des Atomics Energy Board"
SAF_establish_the_atomics_energy_board_desc:5	"Atomwaffen werden der größte militärische Durchbruch seit dem Schießpulver sein, ganz zu schweigen von der friedlichen Nutzung dieser Kraft, wenn wir das Atom nutzbar machen können. Versammeln Sie unsere besten Wissenschaftler, um dies zu untersuchen."
SAF_the_cape_defense_institute:5	"£tech_mod Das Kap-Verteidigungsinstitut"
SAF_the_cape_defense_institute_desc:5	"Jetzt, da Südafrika eine souveräne Nation ist, haben wir nicht mehr wie früher Zugang zu fortschrittlichen Prototypen und Entwürfen. Wir müssen sicherstellen, dass wir unseren Feinden immer einen Schritt voraus sind und technologisch nicht ins Hintertreffen geraten."
SAF_defense_collaboration_initiative:5	"£tech_mod Initiative zur Zusammenarbeit im Verteidigungsbereich"
SAF_defense_collaboration_initiative_desc:5	"Die Briten haben uns gezeigt, wie vorteilhaft es ist, wenn enge Verbündete wissenschaftliche Fortschritte miteinander teilen. Unsere gesamte Fraktion wird in der Lage sein, Forschung und Entwicklung im Krieg effizienter zu betreiben, wenn wir die notwendigen Schritte zur Koordinierung unternehmen."
SAF_special_service_battalion:5	"Spezialbataillon"
SAF_special_service_battalion_desc:5	"Südafrika ist voll von jungen, arbeitslosen Männern, die etwas Nützliches zu tun haben müssen. Das Special Service Battalion wird für die dringend benötigte Disziplin und Organisation sorgen."
SAF_improve_the_three_oh_three:5	"Verbesserung der Three Oh Three"
SAF_improve_the_three_oh_three_desc:5	"Südafrikas Truppen werden in unterschiedlichen Klimazonen kämpfen, und wir haben das Glück, dass das Lee-Enfield-Gewehr leicht anzupassen ist. Die Patrone .303 wurde bereits mehrfach von anderen Ländern an ihre Bedürfnisse angepasst."
SAF_q_services_corps:5	"Q-Dienste-Korps"
SAF_q_services_corps_desc:5	"Das Q Services Corps wird die zentrale Behörde sein, die für die Logistik und die Versorgung der ständigen Armee verantwortlich ist. Es wird die Verteilung von Öl, Rationen, Munition und Uniformen übernehmen."
SAF__south_african_military_college:5	"Südafrikanische Militärakademie"
SAF__south_african_military_college_desc:5	"Südafrika sollte eine Militärakademie nach dem Vorbild von West Point in den Vereinigten Staaten einrichten. Dies wird uns ein professionelles, unionsloyales Offizierskorps bescheren."
SAF_expand_the_south_african_artillery:5	"Ausbau der südafrikanischen Artillerie"
SAF_expand_the_south_african_artillery_desc:5	"Das Artilleriekorps wurde 1934 vereinheitlicht. Jetzt ist es an der Zeit, seine Größe und Kapazität zu erhöhen."
SAF_sa_engineer_corps:5	"Südafrikanisches Ingenieurkorps"
SAF_sa_engineer_corps_desc:5	"Das südafrikanische Ingenieurkorps hat kaum 600 Mann in Uniform. Das ist in einer modernen Armee inakzeptabel. Wir brauchen mehr Männer und eine bessere Ausbildung für diese wichtige Aufgabe."
SAF_equipment_effort:5	"Anstrengungen bei der Ausrüstung"
SAF_south_african_special_forces_desc:5	"Südafrika braucht eine einheimische Kommandotruppe, die schwierige Aufgaben an schwer zugänglichen Orten übernimmt."
SAF_mechanization_effort:5	"Mechanisierungsbestrebungen"
SAF_mechanization_effort_desc:5	"Der motorisierte und mechanisierte Krieg steht uns bevor. Der Große Treck der Zukunft wird von Ketten- und Radfahrzeugen geführt werden."
SAF_armor_effort:5	"Kreuzer-Panzer"
SAF_tank_allow_cruiser_tank_tt:5	"Ermöglicht die Forschung und Produktion von leichten Kreuzerpanzern bis zum Mk.VI\n\n"
SAF_commit_to_the_five_year_plan:5	"Bekenntnis zum Fünf-Jahres-Plan"
SAF_commit_to_the_five_year_plan_desc:5	"Wir haben einen Fünf-Jahres-Plan für die Modernisierung und den Ausbau der südafrikanischen Luftstreitkräfte entwickelt. Die Regierung muss sich öffentlich dazu verpflichten, nicht hinter diesen Zeitplan zurückzufallen."
SAF_improve_the_hawker_hartbees_desc:5	"Die Hawker Hartbees, über die wir verfügen, sind nicht die modernsten Kampfflugzeuge der Welt, aber wir werden damit auskommen. Verbesserte Mechanik und Ausbildung werden das Beste aus diesen Doppeldeckern herausholen."
SAF_replace_the_blenheim:5	"Ersetzen Sie die Blenheim"
SAF_replace_the_blenheim_desc:5	"Die Bristol Blenheim war ein brauchbarer leichter Bomber für die RAF und für die Dominions. Aber es könnte an der Zeit sein, etwas Robusteres mit einer größeren Reichweite zu finden."
SAF_perfect_the_cab_rank_technique:5	"Perfektionieren Sie die "Cab-Rank"-Technik. Technik"
SAF_perfect_the_cab_rank_technique_desc:5	"Die \"Cab-Rank\" Technik schlagen mehrere Bomber in einer langen Reihe nacheinander auf ein Ziel ein. Dies hält den Druck auf den Feind aufrecht, erfordert aber ein hohes Maß an Geschick."
SAF_desert_air_force:5	"Wüsten-Luftwaffe"
SAF_desert_air_force_desc:5	"Der Wüstenhimmel ist klar, und die Hitze und der Sand erfordern besondere Aufmerksamkeit für die Mechanik unserer Flugzeuge. In dieser unbarmherzigen Umgebung können wertvolle Fähigkeiten erlernt werden."
SAF_secure_the_cape_sea_route:5	"Sichern Sie den Kap-See-Weg"
SAF_secure_the_cape_sea_route_desc:5	"Sollte der Suez fallen, wird das Kap wieder das Tor zum Osten sein. Verteidigen Sie ihn um jeden Preis."
SAF_retain_experienced_pilots:5	"Erfahrene Piloten halten"
SAF_retain_experienced_pilots_desc:5	"Zu oft wechseln unsere erfahrenen Piloten zur RAF, anstatt bei unserer eigenen Truppe zu bleiben. Die RAF hat bessere Aufstiegs- und Kampfmöglichkeiten. Aber wir sollten uns bemühen, unsere ausgebildeten Piloten in der Nähe ihrer Heimat zu halten, wo sie andere Südafrikaner inspirieren und ausbilden können."
SAF_seaward_defence_force:5	"Seaward Defence Force"
SAF_seaward_defence_force_desc:5	"Die Seaward Defence Force hat zwei Jahrzehnte lang als unsere Kriegsmarine gedient. Ihre Mittel sollten aufgestockt werden."
SAF_protect_the_trade:5	"Schutz des Handels"
SAF_protect_the_trade_desc:5	"Der letzte Krieg hat gezeigt, wie wichtig Konvois und Geleitschutz sind. Südafrika liegt an einer wichtigen Handelsroute und sollte dafür sorgen, dass die Waren an ihr Ziel gelangen."
SAF_disrupt_the_trade:5	"Den Handel unterbrechen"
SAF_disrupt_the_trade_desc:5	"Der letzte Krieg hat gezeigt, wie wichtig Konvois und Geleitschutz sind. Südafrika liegt an einer wichtigen Handelsroute und ist ideal gelegen, um feindliche Schiffe abzufangen und zu zerstören."
SAF_expand_the_simons_town_base:5	"Ausbau der Basis in Simon's Town"
SAF_expand_the_simons_town_base_desc:5	"Simon's Town am Kap ist seit den 1790er Jahren der wichtigste Marinestützpunkt im südlichen Afrika. Er sollte umgerüstet und erweitert werden, um mehr und größere Schiffe aufnehmen zu können."
SAF_anti_submarine_tactics:5	"Anti-U-Boot-Taktik"
SAF_anti_submarine_tactics_desc:5	"U-Boote bedrohen die Schiffe, die das Kap der Guten Hoffnung passieren. Wir müssen sie finden und zerstören."
SAF_submarine_warfare:5	"U-Boot-Kriegsführung"
SAF_submarine_warfare_desc:5	"Feindliche Handelskonvois nutzen weiterhin die Passage durch das Kap der Guten Hoffnung. Wir werden sie von unten angreifen."
SAF_prepare_overseas_offensive:5	"Übersee-Offensive vorbereiten"
SAF_prepare_overseas_offensive_desc:5	"Mit seinen kilometerlangen Küsten ist Südafrika in der Lage, seine Soldaten im amphibischen Krieg zu trainieren. Dies ist eine der schwierigsten Fähigkeiten, aber unsere Jungs können es schaffen."
SAF_strengthen_the_cape_garrison_artillery:5	"Verstärkung der Kap-Garnisonsartillerie"
SAF_strengthen_the_cape_garrison_artillery_desc:5	"Die Geschütze der Kap-Garnison müssen aufgerüstet und verstärkt werden, um das Kap vor feindlichen Angriffen zu schützen."
scw_in_progress_tt:5	"Spanien befindet sich in einem Bürgerkrieg."
NZL_factories_desc:0	"Mit dem Factories Amendment Act 1936 legte die Labour-Regierung eine 40-Stunden-Woche als Standard für die meisten Arbeiter in Fabriken und Werkstätten fest."
NZL_westland:	"Westland Milk"
NZL_bi_department_of_housing_construction:0	"Abteilung für Wohnungsbau"
NZL_bi_department_of_housing_construction_desc:0	"Eine Politik der gewählten Regierung von 1935, wir können Ausschreibungen für den Massenbau neuer Häuser für unsere Bürger herausgeben. Solche groß angelegten Vorhaben erfordern eine weitaus größere Standardisierung von Teilen und Ausstattungen, als dies zuvor in unserem Land der Fall war ."
NZL_bi_public_works_department_desc:0	"Die meisten öffentlichen Arbeiten werden von der Arbeitslosenbehörde durchgeführt und konzentrieren sich auf die Linderung der Arbeitslosigkeit. Wir können diese an die Abteilung für öffentliche Arbeiten übertragen und die eigentlichen Bauaktivitäten durch den Import von Erdbewegungsmaschinen ausweiten."
NZL_bi_bureau_of_industry:0	"Industriebüro"
NZL_bi_bureau_of_industry_desc:0	"Wir wollen unsere Wirtschaft diversifizieren und die Produktion steigern. Diese neue Abteilung wird die Gründung neuer Industrien fördern."
NZL_bi_highway_construction:0	"Autobahnen und Straßenarbeiten"
NZL_bi_extra_tech_slot:0	"£tech_mod DSIR"
NZL_bi_pass_social_security_act_desc:0	"Das Social Security Act von 1938 sollte die Neuseeländer von der Wiege bis zur Bahre schützen, indem es ein umfassendes Spektrum an Sozialleistungen mit einer kostenlosen Gesundheitsversorgung am Ort der Inanspruchnahme kombinierte. Es stellte ein Sicherheitsnetz aufrecht und Vertrauen in die Regierung während der bevorstehenden schwierigen Entscheidungen, aber Kritiker behaupteten, der Sozialstaat sei zu teuer und fördere die Abhängigkeit."
NZL_bi_maori_volunteers:0	"Das Maori-Bataillon"
NZL_bi_civilian_manpower_controls:0	"Zivilpersonalkontrollen einführen"
NZL_bi_duplicate_rolling_mill:0	"Stahl und Eisen"
NZL_bi_truck_assembly_plant:0	"Lkw-Montagewerke"
NZL_bi_domestic_designs_desc:0	"Nachdem der Verkauf im Ausland eingestellt wurde, haben eine Reihe von Bürgern einfache Designs für leichte Panzer vorgeschlagen, die wir selbst konstruieren können, darunter das berüchtigte Design von Bob Semple. Historisch gesehen war das beste davon der Schofield-Panzer. Schnell von motivierten Einzelpersonen in einem Land als Prototyp entwickelt Ohne vorheriges Panzerungsdesign fehlten diese im Vergleich zu zeitgenössischen Großpanzermodellen, wären aber besser gewesen als gar kein Panzer."
NZL_big_bob_tank:	"Der große Bob"
NZL_big_bob_tank_desc:	"Zeit, groß zu werden oder nach Hause zu gehen"
NZL_bi_armor_m3_desc:0	"Sollten sich britische Entwürfe als ungeeignet erweisen oder sich verzögern, können wir die Hilfe des großen Arsenals der Demokratie in Anspruch nehmen. In der Vergangenheit baute Kanada lizenzierte M3-Fahrgestell für seine Ram Tanks, obwohl diese nicht im Einsatz waren."
NZL_bi_armor_m4:0	"Lizenz M4 Sherman Design"
NZL_bi_armor_m4_desc:0	"Der M3 wurde vom überlegenen Sherman abgelöst. In der Vergangenheit einigten sich die Alliierten darauf, den M4 als Standard zu verwenden, und Kanada produzierte unter Lizenz eine eigene Version als Grizzly."
NZL_bi_NZR_ships_desc:0	"Dieser Krieg wird weit von unseren Küsten entfernt gewonnen. Wir können einige unserer erfahrenen Eisenbahnwerkstattingenieure zu unseren Werften entsenden."
NZL_bi_reorganise_army_desc:0	"Zu unseren Defiziten gehört ein Mangel an Ausbildung in modernen Militärtechniken. Wir können Armeeschulen eröffnen, Ausbildungseinrichtungen verbessern und eine verstärkte Mechanisierung unserer Infanterie- und Unterstützungswaffen umsetzen."
NZL_bi_home_guard:0	"Bilden Sie die Heimwehr"
NZL_bi_coastal_forts_desc:0	"Wir haben eine Reihe veralteter Küstenbefestigungen aus dem Ersten Weltkrieg oder dem russischen Terror von 1885. Diese können modernisiert und neue Stützpunkte errichtet werden."
NZL_bi_operations_middle_east:0	"Planungsschwerpunkt für den Nahen Osten"
NZL_bi_operations_middle_east_desc:0	"So wie wir im Ersten Weltkrieg im Suez, Sinai und Palästina gekämpft haben, werden wir möglicherweise gebeten, erneut im sengenden Sand zu kämpfen. Unsere Nachschublinien sind hier kürzer und das Commonwealth sieht uns als robuste Kolonialherren an, die dafür geeignet sind bis hin zu hartem Gelände."
NZL_bi_expand_rnzaf_desc:0	"Angesichts der zunehmenden Spannungen in Europa ist eine maßvolle Ausweitung unserer Luftwaffe ratsam."
NZL_bi_assist_RAF_desc:0	"Wohin Großbritannien geht, gehen wir. Wo es steht, stehen wir. Wir haben eine Kaufoption für 30 Bomber mit Ausbildung der Besatzung im Vereinigten Königreich. Bieten wir diese der RAF an. Historisch gesehen damals der neuseeländische Wellington-Bomberflug wurde No.75 (NZ) Squadron RAF."
NZL_bi_singapore_focus:0	"Die Singapur-Strategie"
NZL_bi_singapore_focus_desc:0	"Seit den 1920er Jahren bestand unsere Kernverteidigungspolitik darin, sich auf die Unterstützung der Royal Navy zu verlassen, die durch einen befestigten Marinestützpunkt gestützt wurde. Sein Status als Symbol des imperialen Engagements trug dazu bei, die wachsenden strategischen Schwächen der Strategie zu verschleiern. Historisch gesehen half Neuseeland bei der Finanzierung der Marinestützpunkt, der 1939 fertiggestellt wurde."
NZL_bi_singapore_forts_desc:0	"Im Guten wie im Schlechten gehen die Arbeiten an der großartig benannten \"Festung Singapur\" nur langsam voran. Die Singapur-Strategie in ihrer schriftlichen Fassung verlangt, dass Australasien durchhält, bis die Royal Navy eintreffen kann. Einen Beitrag zu den Verteidigungsarbeiten zu leisten, ist eine Option, die wir wählen können . Historisch gesehen begann das Vereinigte Königreich mit der Arbeit an Bodenbefestigungen, die zum Zeitpunkt der Invasion noch nicht abgeschlossen waren."
NZL_bi_navy_doctrine:0	"Seestrategie"
NZL_bi_form_rnzn:0	"RNZN ​​bilden"
NZL_bi_form_rnzn_desc:0	"Als neuseeländische Division der Royal Navy sind unsere Streitkräfte aufgrund der Expansion weitgehend autark und unabhängig von der Royal Navy. Die Identifizierung unserer Marine als unsere eigene erkennt diese Tatsache an. Historisch gesehen geschah dies am 1. Oktober 1941."
NZL_bi_minesweepers:0	"Minensuchboote bauen"
NZL_bi_fairmiles_desc:0	"Unsere Gewässer brauchen Verteidiger. Als Kriegshilfsmittel können wir schnell Fachkräfte aus anderen Berufen unter der Aufsicht von Schiffbauern umschulen und kleinere Schiffe bauen. In der Vergangenheit wurden Motorbarkassen gebaut, die bei den Inselkampagnen zum Einsatz kamen. Insgesamt wurden fast 500 Schiffe gebaut während des Krieges und zumindest teilweise Reparaturen an über 1000 US-Schiffen."
NZL_bi_commerce_protection:0	"Handelsschutz"
NZL_bi_commerce_protection_desc:0	"Wir sollten unsere bescheidene Marine auf den Schutz wesentlicher Versorgungslinien konzentrieren."
NZL_bi_cruiser_effort_desc:0	"Kreuzer patrouillieren seit langem im Südpazifik und sind ein vielseitiges und ausgewogenes Schiff mit ausreichender Reichweite. Vielleicht ist es an der Zeit, dass wir unser eigenes Schiff bauen."
NZL_bi_commerce_interdiction:0	"Alternative Mittel"
NZL_bi_commerce_interdiction_desc:0	"Obwohl es ihnen möglicherweise an Vielseitigkeit und Ausdauer mangelt, machen U-Boote dies durch ihre Kosteneffizienz wett. Wir können einen offensiveren Ansatz bei der Kontrolle unserer Schifffahrtsrouten in Betracht ziehen."
NZL_bi_us_programme:0	"Programm der Vereinigten Staaten"
NZL_bi_us_programme_desc:0	"Die Vereinigten Staaten haben sich erkundigt, ob unser Land kleinere Schiffe wie Schleppboote, Schlepper und angetriebene Leichter für den Pazifik bauen kann. Wir haben keine Stahlarbeiter, die nicht bereits mit wesentlichen Arbeiten beschäftigt sind. Wir können jedoch schnell umschulen und überwachen Tischler und andere Auszubildende, nutzen Karosseriebaufirmen und holen Stahlarbeiter aus den Eisenbahnwerkstätten. Historisch gesehen wurden über 100 Schiffe gebaut."
NZL_bi_navy_build_desc:0	""
NZL_bi_commonwealth_focus:0	"Commonwealth-Bindungen"
NZL_bi_commonwealth_focus_desc:0	"Wir sind eine kleine Handelsnation, wahrscheinlich weit entfernt von den Schlachtfeldern. Durch die Zusammenarbeit mit unseren Dominion-Kollegen und dem Mutterland können wir dem gemeinsamen Interesse am besten dienen."
NZL_bi_look_beyond_commonwealth:0	"Schauen Sie über das Commonwealth hinaus"
NZL_bi_look_beyond_commonwealth_desc:0	"Im Pazifik entstehen neue Mächte, und Großbritannien wird in Europa immer weiter entfernt besetzt. Wir müssen anderswo nach der Zukunft unseres Landes suchen."
NZL_bi_political_effort_desc:0	"Im Pazifik entstehen neue Mächte, und Großbritannien wird in Europa immer weiter entfernt besetzt. Auch wenn unsere Verbindungen zu Großbritannien bestehen bleiben, könnten die Bedürfnisse unseres Landes es erforderlich machen, dass wir uns auch mit anderen Optionen befassen."
NZL_bi_liberty_ethos:0	"Freiheitsethos"
NZL_bi_liberty_ethos_desc:0	"In dieser Zeit ideologischer Fanatiker, die den menschlichen Geist ersticken wollen, werden wir die individuellen Freiheiten und Freiheiten schützen."
NZL_bi_independent_new_zealand:0	"Unabhängiges Neuseeland"
NZL_bi_develop_relations_with_us:0	"Beziehungen zu den USA entwickeln"
NZL_bi_why_we_fight_desc:0	"Die Dunkelheit ist in der Welt weit verbreitet. In diesem entscheidenden Moment wird uns nichts fehlen."
NZL_bi_john_lee_desc:0	"Lee, ein ausgezeichneter Kriegsamputierter aus dem Ersten Weltkrieg, ist ein bekennender Sozialist und einflussreicher Politiker. Er ist der Meinung, dass unsere Maßnahmen zu vorsichtig sind und dass nur ein sozialistisches Programm die Probleme der Gesellschaft lösen kann. Seine Unterstützer sind lautstark und vielleicht ist es an der Zeit auf ihre Forderungen einzugehen."
NZL_bi_exporting_the_struggle_desc:0	"Die Not unserer Kameraden im Ausland muss angegangen werden. Wir müssen die Stärken unserer Gesellschaft nutzen, um unsere Sache zu unterstützen."
NZL_bi_CMT:0	"Obligatorische Militärausbildung"
ANZAC_people_desc:0	"Lasst uns die Reisebeschränkungen zwischen unseren beiden Ländern lockern"
ANZAC_ppl:0	"Erhöhte Einwanderung"
ANZAC_econ:0	"Gemeinsamer Eisenbahnbau"
ANZAC_navy:0	"Gemeinsame Marineoperationen"
POL_demand_zaolzie_threat:5	"Polen fordert Zaolzie"
miedzymorze.3.t:5	"Polen fordert Zaolzie."
miedzymorze.3.d:5	"Polen fordert dieses kleine Gebiet, in dem eine polnische Bevölkerung lebt, schon lange... Aber jetzt haben sie ein Ultimatum gestellt - Zaolzie oder Krieg."
miedzymorze.3.a:5	"Wir sind nicht bereit für einen Krieg."
miedzymorze.3.b:5	"Zaolzie ist tschechisch!"
miedzymorze.4.t:5	"Die Tschechoslowakei verzichtet auf Zaolzie."
miedzymorze.4.d:5	"Aus Angst vor der polnischen Intervention beschloss die tschechische Regierung, Zaolzie aufzugeben. Die polnische Armee ist in das Gebiet eingedrungen und hat die neue Grenze gesichert."
miedzymorze.4.a:5	"Großartig!"
miedzymorze.5.a:5	"Sie wissen nicht, worauf sie sich einlassen."
POL_pression_on_hungary_desc:5	"Eine faschistische ungarische Regierung kann für das gesamte Intermarium gefährlich sein. Sie sind unsere Brüder, mit Flasche und Schwert, und wir müssen sie vor dem faschistischen Regime retten!"
miedzymorze.6.a:5	"Wir wollen keinen Krieg. Forderung akzeptiert... jetzt lasst uns zusammen Wodka trinken!"
miedzymorze.6.b:5	"Wir werden für unsere Regierung kämpfen!"
miedzymorze.7.t:5	"Ungarn kapituliert."
miedzymorze.7.d:5	"Ungarn hat sich unserem Druck gebeugt und eine Marionettenregierung gebildet. Unsere Interessen in diesem Land sind sicher... eigentlich."
miedzymorze.7.a:5	"Intermarium wird immer stärker!"
miedzymorze.8.t:5	"Ungarn weigert sich."
miedzymorze.8.d:5	"Die ungarische Regierung hat unsere Forderungen abgelehnt und die Mobilisierung angekündigt. Wenn wir unser Ziel erreichen wollen, ist uns der Krieg sicher."
POL_treaty_with_yugoslavia_desc:5	"Der Beitritt Jugoslawiens zu unserer Fraktion wird es uns ermöglichen, Einfluss im Mittelmeerraum zu gewinnen und uns vor einem eventuellen Angriff aus dem Westen zu schützen."
miedzymorze.9.t:5	"Zagreber Gipfel"
miedzymorze.9.d:5	"Vertreter Jugoslawiens und aller Länder des Intermariums trafen sich in Zagreb, um die Bedingungen der künftigen Zusammenarbeit auszuhandeln. Wie erwartet, hat Polen Jugoslawien angeboten, der Fraktion beizutreten."
miedzymorze.9.a:5	"Jugoslawien braucht dieses Bündnis. Slawen müssen zusammen sein!"
miedzymorze.9.b:5	"Jugoslawien ist allein stärker... Und jetzt weg mit dem Kebab!"
POL_treaty_with_finland_desc:5	"Finnland kann ein starker Verbündeter gegen die Sowjetunion sein. Wir sollten die Zusammenarbeit mit dieser tapferen Nation vertiefen."
POL_east_secured:5	"Der Osten ist gesichert."
POL_east_secured_desc:5	"Wenn die Sowjetunion angreift, werden wir bereit sein!"
miedzymorze.10.t:5	"Der Vorschlag des Nordpaktes"
miedzymorze.10.a:5	"Finnland braucht diese Zusammenarbeit."
miedzymorze.10.b:5	"Wir brauchen so einen Verbündeten nicht."
intermarial_influance:5	"Der Einfluss von Intermarium"
intermarial_influance_desc:5	"Die Zusammenarbeit mit Intermarium und Polen hat unsere Macht gestärkt, die vor einiger Zeit in unserer Politik noch unwichtig war."
miedzymorze.11.t:5	"Die Tschechoslowakei hat den Vorschlag angenommen."
miedzymorze.11.d:5	"Es ist uns gelungen, die Streitigkeiten der Vergangenheit zu vergessen und unsere Unabhängigkeitsgarantien zu unterzeichnen. Das ist ein großer Erfolg für die polnische Diplomatie, aber auch eine Chance für die Tschechoslowakei. In ihrem Land haben sie begonnen, Gruppen zu gründen, deren Hauptziel die Zusammenarbeit mit Polen ist."
miedzymorze.11.a:5	"Großartig!"
miedzymorze.12.t:5	"Die Tschechoslowakei weigert sich, den Vorschlag anzunehmen."
miedzymorze.12.d:5	"Polnische Erklärungen und Versprechen beeindrucken die tschechoslowakische Regierung nicht. Sie hat unseren Vorschlag nicht angenommen und sich geweigert, Polen die Unabhängigkeit zu garantieren. Was soll man jetzt tun?"
miedzymorze.12.a:5	"Wir werden ihre Unabhängigkeit trotzdem garantieren!"
miedzymorze.12.b:5	"Vergessen Sie alle Vorschläge! Lasst uns jetzt über Zaolzie sprechen!"
miedzymorze.12.c:5	"Wir werden eine Unterwerfung mit Gewalt garantieren!"
KMT_internal_stability_desc:5	"Während die Japaner eine Krankheit der Haut sind, sind die kommunistischen Banditen eine Krankheit des Herzens. Um China zu retten, müssen wir es zuerst von allen Verrätern säubern."
KMT_focus:5	"Kuomintang-Schwerpunkt"
KMT_SHX_offer:5	"Das Shanxi-Angebot"
KMT_SHX_offer_desc:5	"Yans Lehnsherrschaft verwehrt uns den militärischen Zugang. Wenn wir ihn mit Gewalt zur Unterwerfung zwingen, können wir die Kommunisten einkesseln und sie ein für alle Mal vernichten."
KMT_strike_PRC:5	"Schlag gegen die kommunistischen Banditen"
KMT_strike_PRC_desc:5	"Die Banditen erholen sich noch immer von dem Langen Marsch. Wir müssen zuschlagen, wenn sie schwach sind!"
KMT_preparation:5	"Anti-Kommunistischer Aufbau"
KMT_preparation_desc:5	"Nach ihrer Beinahe-Zerstörung während des Langen Marsches verstecken sich die kommunistischen Banditen in der Region Shaanxi. Wir müssen angreifen, bevor sie sich erholen können!"
KMT_prep_tt:5	"Füge 4 §YInfrastruktur§! in allen Nachbarstaaten der VR China hinzu"
KMT_warlord:5	"China vereinen"
KMT_external_defense:5	"Äußere Bedrohung in den Vordergrund rücken"
KMT_external_defense_desc:5	"Obwohl die Kommunisten eine schreckliche Bedrohung darstellen, hat Japan die Fähigkeit, die gesamte chinesische Nation auszulöschen. Sie werden sich nicht mit der Mandschurei begnügen. Eines Tages werden sie versuchen, auch den Rest Chinas zu erobern. Wir müssen alles tun, um uns auf diesen Sturm vorzubereiten."
KMT_fortify_land_desc:5	"Als die Japaner die Gegend um Peking erkundeten, wurden ihre Absichten deutlich. Wir müssen unsere Grenzen befestigen. Wir werden ihnen keinen Zentimeter des heiligen chinesischen Bodens überlassen!"
KMT_fortify_coast:5	"Zentrale Festungsanlagen"
KMT_fortify_coast_desc:5	"Da die Japaner die Meere kontrollieren, werden sie im Falle eines Krieges zweifellos Invasionen an der Küste starten. Wir müssen uns vorbereiten, solange wir noch können. Das Paris des Orients wird nicht kampflos aufgegeben werden!"
KMT_national_def_propaganda:5	"Propaganda zur Landesverteidigung"
KMT_national_def_propaganda_desc:5	"Um uns gegen die japanische Bedrohung zu verteidigen, muss das chinesische Volk so geeint wie möglich sein. Während wir sowohl die kommunistischen Banditen als auch die Kriegsherren hassen, muss jeder Mann, jede Frau und jedes Kind bereit sein, gemeinsam für die Verteidigung Chinas zu kämpfen und zu sterben."
KMT_alone_or_peace_faction_tt:5	"nicht in einer Fraktion ist oder in einer Fraktion ist, die mit [CHI.GetNameDef] im Frieden ist."
KMT_tibet_march:5	"Verlangen Sie Tibet"
KMT_tibet_friend:5	"Befreunde dich mit Tibet"
KMT_tibet_friend_desc:5	"Tibet ist für Chinas Verteidigung und künftige Expansion unerlässlich. Allerdings erlangte Tibet nach der Revolution von 1911 seine Unabhängigkeit. Wir müssen uns mit dem Dalai Lama verbünden und unsere Flanken sichern."
KMT_redraw_mcmahon_tt:5	"Entweder §Y[CHI.GetName]§! oder §Y[TIB.GetName]§! ist der Eigentümer von §YXikang§! und §YTibet§!"
KMT_redraw_mcmahon:5	"Die McMahon-Linie neu ziehen"
KMT_redraw_mcmahon_cancel_tt:5	"weder §Y[CHI.GetName]§! noch §Y[TIB.GetName]§! ist Eigentümer von §YXikang§! und §YTibet§!."
KMT_burma_road_tt:5	"Fügen Sie maximal §YInfrastruktur§! in §YYunnan§!"
KMT_the_big_rear_concept_tt:5	"§YShanghai§! ist im aktuellen Krieg in der Hand des Feindes"
big_rear_concept_bp_tt:5	"Nicht genügend Bauplätze in §YXikang§!"
demand_taiwan_tt:5	"Im Frieden mit dem Besitzer von §YTaiwan§!"
KMT_ocean_hub_tt:5	"Nicht genügend Bauplätze in §YTaiwan§!"
land_bonus:5	"Armee Ausrüstungsbonus"
KMT_pioneering_the_north_east_tt:5	"Füge maximal §YInfrastruktur§! in §YSouth Chahar§!, §YChahar§!, §YEast Herbei§!, §YJehol§!, §YLiaotung§!, §YLiaoning§!, §YKirin§!, §YSongkiang§! und §YHeilungkiang§!"
KMT_north_plan_effect_tt:5	"Erreichen eines Kriegsziels gegen die ausländischen Eigentümer der genannten Staaten."
KMT_voting_rights_tt:5	"\n§CWahlen abhalten§!"
plan_empire_tt:5	"Regierungspartei auf §YFaschistisch§! einstellen. \n"
KMT_armament_effort_desc:5	"Das Arsenal von Jiangnan versorgte die Qing-Dynastie mit modernster Ausrüstung. Wir sollten den Namen für einen militärisch-industriellen Komplex übernehmen, der als Kern für unsere wachsende Rüstungsindustrie dienen kann."
KMT_gain_control_of_the_sea:5	"Die Marine ausbauen"
KMT_gain_control_of_the_sea_desc:5	"Unsere Seemachtüberlegenheit ist seit langem verloren, da sie in der Schlacht am Yalu-Fluss gebrochen wurde. Da die japanische Marine unseren Handel bedroht, müssen wir einige Anstrengungen unternehmen, um unsere Handelsschiffe auf hoher See zu verteidigen."
KMT_the_big_rear_concept:5	"Der große Plan von hinten"
KMT_the_big_rear_concept_desc:5	"Während im Osten Chinas der Krieg tobt, bleibt unser Westen vergleichsweise sicher. Wir müssen versuchen, diese rückwärtigen Gebiete zu entwickeln, damit sie ebenfalls zum Krieg gegen China beitragen können."
KMT_increase_funding_of_german_weaponary:5	"Übernahme von Ausrüstung nach deutschem Vorbild"
KMT_increase_funding_of_german_weaponary_desc:5	"Obwohl wir von deutschen Beratern wie von Falkenhausen unterstützt werden und einige deutsche Ausrüstungen importiert haben, sind unsere lokal produzierten Modelle von minderer Qualität. Indem wir deutsche Ausrüstung als Vorlage in unserem Herstellungsprozess verwenden, können wir unsere Qualität um das Achtfache steigern!"
KMT_lure_them_in_strategy:5	"Köder-Strategie"
KMT_lure_them_in_strategy_desc:5	"Mit dem riesigen Territorium unseres Landes und dem unwegsamen Gelände können wir es uns leisten, uns zurückzuziehen und Invasoren auf ein Schlachtfeld unserer Wahl zu locken. Sollen die Imperialisten doch versuchen, uns zu jagen! Sie werden an jeder Ecke auf einen Hinterhalt und bei jedem Schritt auf eine Sprengfalle stoßen!"
KMT_air_effort:5	"Reorganisieren Sie die ROCAF"
KMT_air_effort_desc:5	"Unsere Luftwaffe ist immer vernachlässigt worden. Wenn wir in der Lage sein wollen, in der Luft zu kämpfen, muss dieser Bereich ernsthaft reformiert werden."
KMT_study_foreign_ship:5	"Studium ausländischer Schiffskonstruktionen"
KMT_study_foreign_ship_desc:5	"Bei der Schiffskonstruktion liegen wir hinter anderen Nationen zurück. Wenn wir eines Tages eine erstklassige Marine haben wollen, dann müssen wir lernen, was ihre Schiffe auszeichnet, damit wir unsere eigenen bauen können."
KMT_demand_taiwan:5	"Fordern Sie Taiwan"
KMT_demand_taiwan_desc:5	"Das Volk von Taiwan muss von seinem derzeitigen Herrscher befreit und uns zurückgegeben werden. Die lange geteilte Nation muss sich vereinen."
KMT_taiwan_fleet_hub:5	"Flottenstützpunkt Taiwan"
KMT_taiwan_fleet_hub_desc:5	"Die Fremden haben in Taiwan eine umfangreiche Infrastruktur hinterlassen. Wir sollten diese Basis ausbauen und die gesamte Insel zu einem Flottenstützpunkt und Produktionszentrum machen."
KMT_pacific_fleet_desc:5	"Wenn China sein volles Potenzial entfalten soll, dürfen wir uns nicht auf diese Seite des Pazifiks beschränken. Wir müssen eine Flotte bauen, die an Taiwan und Japan vorbeisegeln kann."
KMT_sea_fleet:5	"Ziehen Sie die Neun-Strich-Linie"
KMT_sea_fleet_desc:5	"Das Südchinesische Meer enthält viele wichtige Handelsrouten. Wenn wir diese Passage für uns beanspruchen, können wir die Vorherrschaft in Südostasien anstreben. Wir müssen jedoch über eine Flotte verfügen, die in der Lage ist, unsere Ansprüche zu untermauern und jeden feindlichen Handel in ein nasses Grab zu verwandeln."
KMT_pacific_expansion:5	"Durchbrechen Sie die zweite Inselkette"
KMT_pacific_expansion_desc:5	"Nachdem wir nun eine Flotte haben, die in der Lage ist, den Kampf an Japan vorbei zu führen, müssen wir nun eine Flotte bauen, die jede Nation im Pazifik den Zorn Chinas spüren lässt. Wir werden Zheng He stolz machen."
KMT_sea_expansion_desc:5	"Es scheint, dass es nicht ausreicht, unsere Ansprüche auf das Südchinesische Meer zu formulieren. Wir müssen den Ausbau unserer Marine fortsetzen, damit wir den Imperialisten die Gerechtigkeit unserer Sache mit Gewalt vor Augen führen können!"
KMT_modernize_army:5	"Armee modernisieren"
KMT_north_plan:5	"Rückeroberung der Mandschurei"
KMT_north_plan_desc:5	"Dongbei, von den Westlern Mandschurei genannt, ist erst vor wenigen Jahren an die Japaner und ihre Marionetten gefallen. Wir müssen es zurückerobern!"
KMT_pioneering_the_north_east_desc:5	"Obwohl die Japaner Teile der Mandschurei erschlossen haben, sind große Landstriche unberührt geblieben. Wir sollten eine große Anstrengung unternehmen, um diese einst barbarischen Gebiete vollständig in die moderne Welt zu integrieren."
KMT_extra_research_slot:5	"£tech_mod Die Peking-Universität ausbauen"
KMT_national_institute_desc:5	"Im Angesicht von Verfolgung und Tod in Europa haben viele Juden begonnen, sich in Shanghai niederzulassen. Wir sollten unsere Grenzen für alle jüdischen Flüchtlinge öffnen, damit wir im Gegenzug von ihrem Know-how profitieren können. Jüdische Ingenieure haben uns bereits polnische und deutsche Waffenkonzepte gebracht. Was können sie noch für ihre neuen Beschützer tun?"
KMT_military_science:5	"Militärische Wissenschaft"
KMT_military_science_desc:5	"Sowohl die zivile Wissenschaft als auch die militärische Wissenschaft sind wichtig für die Stärke einer Nation. Eine angemessene Finanzierung der letzteren wird unsere Armee noch schlagkräftiger machen."
KMT_ballistic_weapon:5	"Das Guandi-Raketensystem"
KMT_ballistic_weapon_desc:5	"Das Zeitalter der Raketen in der Kriegsführung ist angebrochen. Wir müssen dieses neue Waffensystem übernehmen, wenn unsere Armeen auf dem modernen Schlachtfeld überleben sollen. Lassen Sie unsere Feinde den Zorn des Kriegsgottes spüren!"
KMT_electronics_research:5	"Verstaatlichung der Elektronikindustrie"
KMT_electronics_research_desc:5	"Während die Elektrizität das Land noch nicht erreicht hat, sind unsere Wissenschaftler bereits damit beschäftigt, einheimische Elektronikprodukte für die Märkte in Shanghai und Hongkong herzustellen. Wir sollten die Kontrolle über Ch'eng-kung übernehmen und es für die staatliche Forschung nutzen."
KMT_extra_research_slot_2:5	"£tech_mod Bildung für die Nation"
KMT_bold_hypothesis:5	"Mutige Wissenschaft"
KMT_nuclear_physics:5	"Nuklearphysik"
KMT_nuclear_physics_desc:5	"Wenn die Theorien Einsteins richtig sind, dann könnte die Spaltung des Atoms eine Waffe von ungeahnter Macht hervorbringen. Diese Möglichkeit sollte weiter erforscht werden."
KMT_fighter_focus:5	"Schwerpunkt Kampfflugzeuge"
KMT_fighter_focus_desc:5	"Die Luftüberlegenheit ist unser oberstes Gebot im Luftkampf, und die Jäger sind dafür zuständig."
KMT_bomber_focus:5	"Schwerpunkt Bomber"
KMT_bomber_focus_desc:5	"Die Zerstörung von Nachschublinien und Fabriken des Gegners ist die beste Option im Luftkrieg. Daher sollten wir uns an den Bomber halten."
KMT_cas_effort:5	"Sturzkampfbomber Einsatz"
KMT_cas_effort_desc:5	"Die Luftnahunterstützung ist für den Vormarsch unserer Armee am Boden äußerst nützlich. Diese strahlengetriebene Sturzkampfbomber werden den Krieg für uns gewinnen."
KMT_nav_effort:5	"NAV-Einsatz"
KMT_nav_effort_desc:5	"Marinebomber sind hervorragend in der Lage, feindliche Schiffe und Häfen zu zerstören, weshalb sie ein unverzichtbarer Bestandteil der Seekriegsführung sind."
KMT_political_effort:5	"Nationale Reform"
KMT_political_effort_desc:5	"Unsere Regierung ist weit davon entfernt, vom einfachen Volk geliebt zu werden. Wir müssen mit der Beseitigung der Korruption beginnen, wenn wir überleben wollen."
KMT_government_reform:5	"Überdenken Sie die Republik"
KMT_government_reform_desc:5	"Unsere derzeitige Regierungsform ist unerwünscht, wir müssen einen anderen Weg suchen."
KMT_strengthen_the_republic_desc:5	"Unsere Bürger sind mit der Republik zufrieden. Wir müssen unsere Wurzeln fest im Gedankengut von Sun Yat-sen bewahren, um ihr Vertrauen zu stärken."
KMT_democratic_republic_desc:5	"Unsere Bürger sind jetzt bereit für die Demokratie. Nach dem Willen von Sun Yat-sen werden wir die Ära der Einparteienherrschaft beenden und Wahlen abhalten, sobald sie ordnungsgemäß organisiert werden können."
KMT_unitary_semi_presidential_republic:5	"Die Vormundschaft des Volkes fortsetzen"
KMT_unitary_semi_presidential_republic_desc:5	"Obwohl wir große Fortschritte gemacht haben, ist das Volk noch nicht bereit für die Demokratie. Wir müssen uns weiterhin von der KMT leiten lassen."
KMT_promote_nationalism:5	"Wiederbelebung der Bewegung des Neuen Lebens"
KMT_promote_nationalism_desc:5	"Unsere Nation wurde lange Zeit wegen ihrer Schwäche und Unfähigkeit verspottet. Wir sollten unsere früheren Bemühungen fortsetzen, um eine nationalistische Bürgerschaft zu schaffen, die China wieder groß machen kann."
KMT_become_communism:5	"In den Kommunismus"
KMT_become_communism_desc:5	"Nach einer langen Debatte zwischen Funktionären haben wir beschlossen, dass der Kommunismus der Weg in die Zukunft ist. Wir sollten unsere Kräfte mit dem Genossen Mao vereinen."
KMT_neutrality_focus:5	"Zurück in die Isolation"
KMT_neutrality_focus_desc:5	"Während andere behaupten, es erfordere Mut und Weisheit, in einem globalen Konflikt Partei zu ergreifen, wissen wir, dass es mehr erfordert, sich zu verweigern."
KMT_interventionism_focus:5	"Exportieren Sie die nationale Revolution"
KMT_volunteer_corps:5	"Die Sun Yat-sen-Brigaden"
KMT_centralizing_power:5	"Zentralisierung der Macht"
KMT_centralizing_power_desc:5	"Die Phase der Volksvormundschaft ermöglicht es uns langsam, alle Macht, sowohl die lokale als auch die regionale, in den Händen der Zentralregierung zu zentralisieren. Wir werden die Fehler von 1912 und 1916 nicht wiederholen. In einem vereinigten China kann es keinen Föderalismus geben."
KMT_into_despotism:5	"Despotismus"
KMT_voting_rights:5	"Eine neue Verfassung"
KMT_voting_rights_desc:5	"Die bisherige Verfassung reicht nicht aus, um Tyrannei und Korruption zu verhindern. Um vollständig zu einer demokratischen Republik überzugehen, müssen wir eine neue Verfassung schreiben. Das Wahlrecht, das Recht auf Freiheit und die gegenseitige Kontrolle müssen unbedingt eingeführt werden. China muss eine Nation der Gesetze und nicht eine Nation der Menschen werden."
KMT_universal_sufferage_desc:5	"Im Mittelpunkt des Denkens von Sun Yat-sen stehen die drei Prinzipien des Volkes: Demokratie, Nationalismus und das Wohlergehen des Volkes. Während wir in der Vergangenheit nur den Nationalismus erreicht haben, marschieren wir jetzt auf die vollständige Verwirklichung von Sun's Traum zu."
KMT_knowledge_of_the_citizens_desc:5	"In der Vergangenheit war die Bildung für viele Menschen nicht zugänglich. Durch den Ausbau des nationalen Schulsystems mit einem Lehrplan, der darauf abzielt, Bürger und nicht Untertanen zu erziehen."
KMT_westernization:5	"£tech_mod Verwestlichung"
KMT_westernization_desc:5	"Das Wissen der westlichen Welt liegt jenseits unserer Vorstellungskraft, die Übernahme ihres Wissens würde eine ganze Kampagne erfordern."
KMT_fascism_focus:5	"Alle Macht den Blueshirts"
KMT_fascism_focus_desc:5	"Die vom Deutschen Reich gezeigte Stärke ist sehr faszinierend. Unsere Nation muss ihrem Weg zum Ruhm folgen. Wir müssen diejenigen zu Hause unterstützen, die große Leidenschaft für unsere Nation gezeigt haben."
KMT_isolation_tactic:5	"Antisowjetische Isolationstaktik"
KMT_war_propaganda:5	"Kriegspropaganda"
KMT_war_propaganda_desc:5	"Die Gehirnwäsche unseres Volkes mit den Vorzügen von Krieg und Sieg ist ein hervorragendes Mittel, um unser Volk zu einen und ein starkes Militär zu schaffen."
KMT_war_fanaticism_desc:5	"Es reicht nicht aus, zu kämpfen und zu sterben. Wir müssen kämpfen und siegen, koste es, was es wolle. Unser Blut soll China wieder zum Mittelpunkt der Welt machen! ZHONGGUO WANSUI!"
KMT_claim_territory_desc:5	"Wir haben sowohl unser eigenes Land als auch unsere Tributpflichtigen an die Imperialisten verloren. Da die Tributpflichtigen formell zu Vasallen des Throns werden, könnten wir Ansprüche auf viele Orte in Ostasien erheben..."
KMT_recognize_maos_government:5	"Maos Regierung anerkennen"
KMT_recognize_maos_government_desc:5	"Die Anerkennung ihrer Regierung ist ein guter Weg, um unsere Beziehungen zu verbessern und die Spannungen abzubauen."
KMT_privilege_to_proletarians:5	"Privilegierung der Proletarier"
KMT_integration_of_government:5	"Integration der Regierung"
KMT_hundred_flowers_campaign:5	"Hundert-Blumen-Kampagne"
KMT_hundred_flowers_campaign_desc:5	"Einige Reaktionäre befinden sich immer noch in unserer Mitte. Der beste Weg, sie zu entlarven, ist, ihnen die Möglichkeit zu geben, ihre Meinung zu äußern."
KMT_great_leap_forawrd:5	"Großer Sprung nach vorn"
KMT_join_comintern:5	"Der Komintern beitreten"
KMT_join_comintern_desc:5	"Da wir von Feinden umgeben sind, ist es eine gute Idee, Sicherheit in den Reihen unserer Kameraden aus anderen Nationen zu finden. Durch den Beitritt zur Komintern können wir unsere Position sichern und die Sache des Kommunismus weltweit voranbringen."
kmt_integrate_mao_tt:5	"Regierungspartei auf Kommunismus einstellen"
KMT_socialist_science:5	"£tech_mod Sozialistische Wissenschaft"
KMT_socialist_science_desc:5	"Die Welt ist, wie der Geist, in ständiger Bewegung. Die Natur befindet sich in einem Zustand des ständigen Fortschritts, ja sogar der Revolution. Die Prinzipien des dialektischen Materialismus lassen sich sowohl auf die Naturwissenschaften als auch auf die..."
KMT_socialist_future_science:5	"Moderne sozialistische Wissenschaft"
KMT_socialist_future_science_desc:5	"Die Welt ist, wie der Geist, in ständiger Bewegung. Die Natur befindet sich in einem Zustand des ständigen Fortschritts, ja sogar der Revolution. Die Prinzipien des dialektischen Materialismus lassen sich sowohl auf die Natur- als auch auf die Sozialwissenschaften..."
KMT_demand_soviet_puppets:5	"Fordern Sie Zentralsteppe und Sinkiang"
KMT_demand_soviet_puppets_desc:5	"Territoriale Streitigkeiten müssen nicht in blutigen Kriegen enden, auch diplomatische Wege sind gangbare Wege. Wenn sie zu einem Kompromiss bereit sind..."
KMT_demand_soviet_puppets_tt:5	"Der Besitzer der Zentralsteppenstaaten ( §YMongolei§! und §YTannu Tuva§! ) und des §YSinkiang§! Gebiet wird die Forderung erhalten."
KMT_demand_indochina:5	"Forderung Indochina"
KMT_demand_indochina_tt:5	"Der Besitzer der Staaten §YLaos§!, §YTonkin§! und §YIndochina§! wird die Forderung erhalten."
KMT_special_force_training:5	"Ausbildungsprogramm für Spezialeinheiten"
KMT_special_force_training_desc:5	"Wir haben Bedarf an Elitetruppen. Wir müssen unsere Soldaten ausbilden, damit sie die Besten werden."
KMT_improve_burma_road:5	"Verbesserung der Burma Road"
KMT_improve_burma_road_desc:5	"Obwohl die Briten die Burma Road gebaut haben, um den Krieg gegen die Japaner zu unterstützen. Die Straße selbst ist nicht sehr effizient, wir sollten sie verbessern."
KMT_boycott_the_comitern:5	"Komintern boykottieren"
KMT_boycott_the_comitern_desc:5	"Die Komintern ist ein stinkendes Höllenloch voller Revisionistenschweine. Wir werden unsere eigene Fraktion gründen und den wahren Weg des Marxismus-Leninismus gehen."
kmt_ftf_tt:5	"Erhalten Sie Kampfflugzeuge und Piloten aus den USA.\n"
KMT_sinkiang_integration:5	"Das Schicksal von Sinkiang"
KMT_sinkiang_integration_desc:5	"Sinkiang ist rechtmäßiges chinesisches Land. Jetzt, wo wir beide unter der Führung der Großen Sowjetunion stehen, können wir die Chance nutzen, Sinkiang an China zurückzufordern."
KMT_invite_sik:5	"Sinkiang einladen"
KMT_invite_sik_desc:5	"Wenn wir dem wahren Weg des Marxismus-Leninismus folgen wollen, müssen wir Verbündete suchen, die sich gegen die revisionistischen Schweine in der Komintern stellen."
KMT_war_with_sik:5	"Krieg mit Sinkiang"
KMT_war_with_sik_desc:5	"Sinkiang ist zweifellos nur eine weitere Nation, die von revisionistischen Schweinen infiziert ist. Wir müssen sie beseitigen!"
KMT_force_sik_into_democracy:5	"Druck auf Sinkiang"
KMT_force_sik_into_democracy_desc:5	"Angesichts des Status von Sinkiang müssen wir verhindern, dass sie der Komintern beitreten! Die kommunistische Welt darf nicht noch größer werden!"
KMT_reclaim_sik:5	"Ultimatum an Sinkiang"
KMT_reclaim_sik_desc:5	"Chiang beschließt, dass Sinkiang an die Chinesen zurückgegeben werden muss. Ein Ultimatum wird an den Führer von Sinkiang gestellt. Chiang glaubt, dass sie weise sein und die richtige Option wählen werden..."
kmt_force_sik_bp_tt:5	"Sie oder mit Ihnen verbündete Nationen befinden sich mit §YSinkiang§! im Krieg."
KMT_trade_port_neutral:5	"Die ungleichen Verträge umstoßen"
KMT_trade_port_neutral_desc:5	"Aufgrund der zahlreichen ungleichen Verträge, die die inkompetente Qing-Dynastie mit den westlichen Nationen unterzeichnet hat, befindet sich ein Teil unseres Landes noch immer in ungerechten Händen. Wir müssen unser Volk unter einer Fahne vereinen!"
KMT_trade_port_fascism:5	"Die chinesischen Häfen"
KMT_trade_port_fascism_desc:5	"Die Abtretung der Handelshäfen in den ungleichen Verträgen ist für die Chinesen eine große Demütigung, da unser Handel nun von den Westlern behindert und unser Land geteilt wird. Wir müssen diese Länder zurückerobern und China wieder groß machen!"
KMT_trade_port_commie_comintern:5	"Bitte um sowjetische Anwesenheit"
KMT_trade_port_commie_own:5	"Handelshäfen einfordern"
KMT_trade_port_commie_own_desc:5	"Wir müssen die Handelshäfen von der westlichen Welt zurückerobern, sie gehören von Rechts wegen uns."
KMT_industrialization_NW:5	"Lokale Industrialisierung: Nordwesten"
KMT_excavation_NW:5	"Ausgrabungen im Nordwesten"
KMT_excavation_NW_desc:5	"Wir müssen nach weiteren Ressourcen in unserem Land suchen, damit wir von importierten Ressourcen unabhängig werden."
KMT_industrialization_S:5	"Lokale Industrialisierung: Süden"
KMT_industrialization_S_desc:5	"Der Süden mag eines der am stärksten industrialisierten Gebiete sein, aber er kann noch viel besser werden."
KMT_excavation_S:5	"Kautschukplantagen"
KMT_excavation_S_desc:5	"Das Klima im Süden ist sehr gut für den Kautschukanbau geeignet, das sollten wir uns zunutze machen."
KMT_excavation_NE:5	"Prospektion im Nordosten"
KMT_excavation_NE_desc:5	"Die Japaner haben in diesem Gebiet zahlreiche Werkzeuge hinterlassen, die wir nutzen können, um neue Ressourcen in diesem Gebiet zu entdecken."
KMT_ledo_road:5	"Ledo-Straße"
KMT_ledo_road_desc:5	"Die Burma Road wurde von den Invasoren abgeschnitten, wir müssen eine weitere Straße von Indien aus für den Nachschub bauen."
kmt_pekingu_tt:5	"Senke die Strafe von §YÖffentlicher Analphabetismus§!\n"
kmt_neutral_tp_mc:5	"§YMacau§! ist nicht im Besitz von China und der Besitzer ist im Frieden mit China"
kmt_neutral_tp_hk:5	"§YHongkong§! ist nicht im Besitz von China und der Besitzer ist in Frieden mit China"
kmt_demo_tp_mc:5	"§YPortugal§! ist Eigentümer von §YMacau§!, hat keinen Bürgerkrieg und befindet sich im Frieden mit China"
kmt_demo_tp_gzw:5	"§YFrankreich§! besitzt §YGuangzhouwan§!, hat keinen Bürgerkrieg und befindet sich im Frieden mit China"
kmt_demo_tp_hk:5	"§YGroßbritannien§! besitzt §YHongkong§!, hat keinen Bürgerkrieg und befindet sich im Frieden mit China"
KMT_dare_to_die_corps:5	"Sich trauen zu sterben Abteilungen"
KMT_dare_to_die_corps_desc:5	"Wenn wir den Krieg gegen die Invasoren gewinnen wollen, muss unser Volk so mutig sein, dass es keine Angst vor dem Tod hat."
KMT_air_base_expansion:5	"Erweiterung des Flugplatzes"
KMT_air_base_expansion_desc:5	"Wir brauchen Flugplätze, auf denen unsere Flugzeuge starten und landen können, sonst sind sie nur noch ein Haufen Ausstellungsstücke im Lager."
KMT_national_resources_commission:5	"Nationale Ressourcen-Kommission"
KMT_national_resources_commission_desc:5	"Die Nationale Rohstoffkommission (NRC) ist ein Institut, das für die Erkundung und den Abbau von Rohstoffen in China zuständig ist. Ihre Einrichtung wird unsere Bemühungen um die Gewinnung natürlicher Ressourcen erheblich verstärken."
KMT_national_defense_council:5	"Nationaler Verteidigungsrat"
KMT_national_defense_council_desc:5	"Da die Japaner und die kommunistischen Banditen unserer Nation Schaden zufügen, müssen wir einen Weg finden, unsere Verteidigung gegen sie zu organisieren. Wir sollten auch versuchen, moderne Ausrüstung aus dem Ausland zu importieren."
KMT_revive_jiangnan_shipyard:5	"Ausbau der Jiangnan-Werftgruppe"
KMT_revive_jiangnan_shipyard_desc:5	"Wir sollten die Fähigkeit von Jiangnan Arsenal zum Bau von Schiffen ausbauen. Dies wird uns eine bessere Marine geben, um zukünftigen Bedrohungen zu begegnen."
KMT_revive_hanyang_armory:5	"Wiederbelebung des Hanyang-Arsenals"
CHI_dirty_tricks_desc:5	""
CHI_dams:5	"Sprengung der Dämme"
generic_doctrine_slot:5	"£tech_mod Militärtheorie"
generic_doctrine_slot_desc:5	""
generic_naval_research_desc:5	""
KMT_evacuate_forbidden_city_artefacts:5	"Artefakte der Verbotenen Stadt evakuieren"
KMT_evacuate_forbidden_city_artefacts_desc:5	"Angesichts der japanischen Bedrohung haben wir die Artefakte des Verbotenen Palastes bereits 1933 nach Shanghai evakuieren lassen, um sie im Falle eines Kriegsausbruchs zu schützen. Jetzt, da der Feind so nahe an Shanghai herangerückt ist, müssen wir die Schätze erneut evakuieren, damit sie nicht in feindliche Hände fallen!"
kmt_forbidden_city_tt:5	"Die Artefakte werden nach §YChongching§! gebracht!"
CHI_naval_effort_desc:5	"Zeit, die Zehen ins Wasser zu halten"
CHI_navy_sci:5	"£tech_mod Marineforschung"
CHI_modern_farming:0	"Moderne Landwirtschaft"
CHI_coal:0	"Die Maschine befeuern"
CAN_rocky_mountain_rangers:5	"Rocky Mountain Ranger"
CAN_winter_lessons:5	"Der kalte Norden"
CAN_artificial_rubber:5	"Polymer Corp."
CAN_human_capital_desc:5	"Wir werden der Welt beweisen, dass nicht nur die Quantität der Arbeitskräfte allein über die Produktivität einer Nation entscheidet, sondern auch die Qualität der fleißigen Menschen."
CAN_waste_not_want_not:5	"Canadian Cycle and Motor Co. Ltd."
CAN_military_focus:5	"Kanadische Streitkräfte"
CAN_general_motors_company_desc:5	"Wir sind keine Fremden in der industriellen Welt. Indem wir die GM-Fabriken umfunktionieren, können wir Lastwagen herstellen, die es uns ermöglichen, unsere Armeen zu motorisieren."
CAN_rouse_their_hearts:5	"Der Norden taut auf"
CAN_british_columbian_dockyard:5	"Esquimalt Royal Schiffswert"
CAN_british_columbian_dockyard_desc:5	"Wir dürfen den pazifischen Raum nicht vergessen. Daher wäre es am besten, wenn wir unsere Marinewerft auf Vancouver Island ausbauen würden."
CAN_aviation_focus:5	"Königlich Kanadische Luftwaffe"
CAN_aviation_focus_desc:5	"Die Royal Canadian Air Force hat noch viel zu tun, um mit ihrem großen britischen Bruder, der RAF, gleichzuziehen. Was ihr an Zahl fehlt, hat sie an Qualität."
CAN_defence_of_canada_desc:5	"In Europa braut sich ein Krieg zusammen. Obwohl ein Ozean von uns entfernt, können wir diese Bedrohung nicht einfach ignorieren. Durch die Entsendung von Freiwilligen zu unseren Verbündeten können wir die Kriegsanstrengungen unterstützen und so hoffentlich verhindern, dass die Schrecken des Krieges unsere Küsten besuchen."
CAN_volunteers_abound:5	"Wir alle, die tapferen Kanadier"
CAN_communism_abroad_desc:5	"Angesichts der wachsenden kommunistischen Stimmung auf der ganzen Welt werden wir diejenigen unterstützen, die gegen ihre Regierungen kämpfen und als eine vereinte Front auftreten. Sowohl in China als auch in Spanien wächst eine solche Stimmung, die Unterstützung gebrauchen könnte."
CAN_honorary_soviets_desc:5	"Unser Volk hat sich verändert; wir folgen nicht mehr den Launen einer fremden Krone, sondern gehen unseren eigenen Weg. Die Sowjets begrüßen unsere jüngsten Aktionen und sind bereit, uns Unterstützung zukommen zu lassen; wir müssen nur darum bitten."
CAN_swastika_clubs:5	"Hakenkreuzvereine"
CAN_canadian_parachute_battalion_desc:5	"Durch den Einsatz einer qualitativ und nicht quantitativ überlegenen Spezialtruppe können wir tief in das feindliche Gebiet eindringen und den Nachschub abschneiden. Dies sind jedoch gefährliche Missionen, die speziell ausgebildetes Personal erfordern."
CAN_d_day:5	"D-Day"
CAN_d_day_desc:5	"Eine Seeinvasion ist ein unvermeidlicher Teil des Krieges. Wir sollten dies im Voraus planen, damit wir schneller geeignete Pläne für einen Angriff an der gegnerischen Küste erstellen können."
CAN_lay_east_claims:5	"Das Referendum in Neufundland"
CAN_lay_more_east_claims:5	"Anspruch auf St. Pierre und Miquelon"
CAN_reason_with_quebec_desc:5	"Sie sind ein Teil unserer Nation, ihr Volk ist unser Volk. Wir sollten mit ihnen diplomatisch verhandeln, sicher werden sie unsere Sache verstehen. Vor allem in Anbetracht der Ergebnisse der Volksabstimmung könnten sie ihre Meinung ändern."
CAN_quebec_propaganda_desc:5	"Unabhängig von ihrer Entscheidung können wir uns der Kriegspropaganda bedienen, um den Rest von Québec zum Zuhören zu bewegen."
NZL_department_of_housing_construction_desc:5	"Dank der Politik der 1935 gewählten Regierung können wir Ausschreibungen für den Massenbau neuer Wohnungen für unsere Bürger durchführen. Solche Großprojekte erfordern eine Standardisierung von Teilen und Ausstattungen in einem weitaus größeren Umfang als bisher in unserem Land."
NZL_public_works_department:5	"Abteilung für öffentliche Arbeiten"
NZL_public_works_department_desc:5	"Die meisten öffentlichen Arbeiten werden von der Arbeitslosenkasse durchgeführt und sind auf die Bekämpfung der Arbeitslosigkeit ausgerichtet. Wir können diese Arbeiten auf das Ministerium für öffentliche Arbeiten übertragen und durch den Import von Erdbewegungsmaschinen eine echte Bautätigkeit ausweiten."
NZL_highway_construction_desc:5	"Wir haben die Effizienz unserer öffentlichen Arbeiten erhöht. Jetzt können wir die Abteilung für öffentliche Arbeiten ausbauen und neue Straßen für unser Land bauen."
NZL_diversification_of_economy:5	"Förderung der Privatwirtschaft"
NZL_diversification_of_economy_desc:5	"Durch staatliche Aufträge und Subventionen können wir die Entwicklung der lokalen Produktion fördern."
NZL_extra_tech_slot_desc:5	"Wir haben unsere Wirtschaft so entwickelt, dass sie autarker ist. Es werden neue Ideen entwickelt und getestet. Wir können verschiedene Projekte finanzieren, um die Entwicklung unseres Landes voranzutreiben. In der Vergangenheit spielten das DSIR und die Universität von Auckland eine herausragende Rolle. Das berühmteste Projekt war Project Seal, ein fehlgeschlagener Versuch, eine Tsunami-Bombe mit Sprengstoff zu bauen, der vor einer feindlichen Küste ausgelegt wurde."
NZL_enact_social_policy:5	"Sozialpolitik einführen"
NZL_enact_social_policy_desc:5	"Die neuseeländische Labour-Regierung von 1935 wurde mit dem Ziel gewählt, das erste Sozialversicherungssystem der westlichen Welt zu schaffen, einschließlich einer kostenlosen Gesundheitsversorgung."
NZL_accept_maori_battalion:5	"Angebot eines Maori-Bataillons annehmen"
NZL_accept_maori_battalion_desc:5	"Als der Krieg unvermeidlich schien, schlugen Sir Apirana Ngata und andere Maori-Führer die Bildung einer Einheit vor, die aus freiwilligen Maori bestand. Das Maori-Bataillon wurde das am meisten ausgezeichnete neuseeländische Bataillon während des Krieges."
NZL_civilian_manpower_controls:5	"Zivile Personalkontrollen einführen"
NZL_pass_the_manpower_act:5	"Verabschiedung des Manpower Act"
NZL_pass_the_manpower_act_desc:5	"Aufgrund historisch gewachsener Tarifverträge fehlen vielen wichtigen Industrien qualifizierte Arbeitskräfte durch unterschiedliche Lohnsätze. Versuche, diese Bedingungen neu zu verhandeln, stoßen auf offenkundigen Widerstand und Streiks. Dieses Gesetz ermöglicht es uns, unsere knappen Arbeitskräfte für Arbeiten von nationaler Bedeutung einzusetzen, einschließlich Frauen. Der Sinn unseres Landes für gemeinsame Opfer erlaubt es uns, diese Maßnahme zu ergreifen, sozusagen eine industrielle Wehrpflicht."
NZL_early_rearmament:5	"Aufrüstung"
NZL_early_rearmament_desc:5	"Historisch gesehen war die Aufrüstung in der Vorkriegszeit politisch unpopulär. Was aber, wenn die Regierung ihre Popularität nach der Verabschiedung ihres Sozialprogramms für die Wiederbewaffnung genutzt hätte?"
NZL_peace_to_war_desc:5	"Unsere Friedenslieferanten haben die Produktion auf ihren eigenen Bedarf umgestellt. Wir müssen unsere Rüstungsindustrie entwickeln, um autarker zu werden."
NZL_military_factory:5	"Militärische Industrie"
NZL_military_factory3_desc:5	"Die Anforderungen der modernen Kriegsführung sind unaufhörlich. Neue Militärfabriken können errichtet werden."
NZL_cool_storage:5	"Vergrößerung der Kühllagerung"
NZL_cool_storage_desc:5	"Wir sind ein Agrarland mit 30 Millionen Schafen und 2 Millionen Milchkühen, und in Kriegszeiten kann es zu Engpässen beim Transport kommen. Unser größter Beitrag zu den Kriegsanstrengungen besteht darin, die Versorgung der Bürger und Soldaten im Ausland mit lebenswichtigen Lebensmitteln aufrechtzuerhalten. Die Möglichkeit, verderbliche Lebensmittel zu lagern, ist entscheidend für die Aufrechterhaltung unserer Wirtschaft und die Versorgung unserer Verbündeten."
NZL_duplicate_rolling_mill:5	"Stahl und Eisen auf der Südinsel"
NZL_duplicate_rolling_mill_desc:5	"Wir haben ein Stahlwalzwerk in Dunedin und reiche Vorkommen an hochwertigem Eisenerz in Onekaka. Wir können die Eisenverhüttung in Onekaka wieder aufnehmen und das Walzwerk duplizieren, um den Bedarf unserer Wirtschaft zu decken."
NZL_canning_desc:5	"Fleischkonserven benötigen keinen Kühlraum, und es besteht ein großer Bedarf an Rationen für die amerikanischen Streitkräfte im Pazifik. Historisch gesehen wurde die Fleischkonservenproduktion während des Krieges ausgeweitet, insbesondere als Reaktion auf den amerikanischen Pazifikfeldzug."
NZL_colonial_ammunition_desc:5	"Neuseelands einziger industrieller Hersteller von Munition bei Kriegsbeginn. Sie betreibt eine umfangreiche Anlage und ist bereit, die Produktion zu erweitern."
NZL_workshop_production:5	"Charlton Motor Workshops"
NZL_workshop_production_desc:5	"Während des Wiederaufbaus des Vereinigten Königreichs sind britische Waffen Mangelware. Ein Ingenieur namens Philip Charlton hat einen Bausatz entwickelt, um Gewehre aus der Zeit des Burenkrieges in leichte Maschinengewehre umzubauen. Historisch gesehen wurden 1500 Stück gebaut. Obwohl es als minderwertig gegenüber einem neu gebauten Bren angesehen wurde, war es verfügbar, leichter und funktionierte bei Tests perfekt und zuverlässig."
NZL_truck_assembly_plant_desc:5	"Wir verfügen über eine Reihe von Montagewerken für Pkw und Lkw, die meisten davon in der Region Wellington. Wir können die Produktion ausweiten, indem wir Lizenzteile in kleinen Werkstätten herstellen und unsere bestehenden Werke für die Montage nutzen."
NZL_armor_vickers:5	"Lizenz Vickers Light Tank Design"
NZL_armor_valentine:5	"Lizenz für die Valentine-Panzerkonstruktion"
NZL_armor_m4:5	"Lizenz M4 Sherman Design"
NZL_2NZEF:5	"Bildung der 2NZEF"
NZL_commonwealth_focus:5	"Commonwealth-Beziehungen"
NZL_commonwealth_focus_desc:5	"Wir sind eine kleine Handelsnation, wahrscheinlich weit entfernt von den Schlachtfeldern. Wir können dem gemeinsamen Interesse am besten durch die Zusammenarbeit mit unseren historischen Verbündeten dienen."
NZL_technology_sharing_comm:5	"Gegenseitige Hilfe im Commonwealth"
NZL_destroyer_effort2_desc:5	"Unsere Gewässer brauchen Verteidiger. Wir können mit der Planung für den Bau kleinerer Schiffe in Eigenregie beginnen. In der Vergangenheit wurden Motorboote gebaut, die in den Inselkampagnen zum Einsatz kamen. Insgesamt wurden während des Krieges fast 500 Schiffe gebaut, und an über 1000 US-Schiffen wurden zumindest Teilreparaturen vorgenommen."
NZL_collectivist_ethos:5	"Kollektivistisches Ethos"
NZL_collectivist_ethos_desc:5	"Unsere Feinde mögen kleinere Nationen spalten und erobern, aber unser Volk wird zusammenhalten. Alle für einen und einer für alle."
NZL_liberty_ethos:5	"Freiheitsethos"
NZL_liberty_ethos_desc:5	"In dieser Zeit der ideologischen Fanatiker, die den menschlichen Geist zu ersticken suchen, werden wir die individuellen Freiheiten und die Freiheit schützen."
NZL_militarism:5	"Militarismus"
NZL_militarism_desc:5	"Diejenigen, die das Militär als notwendiges Übel betrachten, sind dazu verdammt, im Angesicht des Krieges zu zögern. Wir werden den Militarismus in unserer Kultur verankern, um ein Volk von Soldaten zu werden."
NZL_political_correctness:5	"Politische Korrektheit"
NZL_political_correctness_desc:5	"Menschen, die leicht kontroverse oder anderweitig peinliche Meinungen vertreten, scheinen besorgt zu sein, dass es eine weitreichende Verschwörung gegen sie gibt. Dies scheint eine ausgezeichnete Idee zu sein."
NZL_interventionism_focus:5	"Interventionismus Schwerpunkt"
NZL_interventionism_focus_desc:5	"Wir schätzen die Freiheit aller Menschen, nicht nur die unserer eigenen Bürger. Wenn die Verhinderung von Tyrannei Krieg bedeutet, dann soll es so sein."
NZL_military_youth:5	"Militärische Jugend"
NZL_military_youth_desc:5	"Organisationen zur Förderung von Disziplin und politischer Bildung junger Menschen in unserem Land werden Loyalität und Selbstaufopferung früh fördern."
NZL_deterrence:5	"Abschreckung"
NZL_deterrence_desc:5	"Wenn wir allein dastehen, nützt uns ein Krieg nur selten. Zum Glück wissen wir, dass die beste Verteidigung eine ist, die so bekannt ist, dass man sie nie anwenden muss."
NZL_volunteer_corps:5	"Freiwilligenkorps"
NZL_volunteer_corps_desc:5	"Unser Volk zu zwingen, für die Ideale der Freiheit zu sterben, wäre eine Übung in Ironie, aber die Schaffung von Mitteln für diejenigen, die Menschen im Ausland helfen wollen, ist es nicht."
NZL_paramilitarism:5	"Para-Militarismus"
NZL_paramilitarism_desc:5	"Militärische Grundsätze finden auch außerhalb des Militärs Anwendung. Mit der Entwicklung von halbmilitärischen Einheiten, die unsere Streitkräfte ergänzen, werden mehr Menschen eine militärische Ausbildung erhalten."
NZL_indoctrination_focus:5	"Indoktrination"
NZL_indoctrination_focus_desc:5	"Nachdem wir festgestellt haben, dass unsere Ideologie auf der Wahrheit beruht, kann sie als Wahrheit gelehrt werden. Bildung und Medien müssen diese Lektion widerspiegeln."
NZL_foreign_expeditions:5	"Ausländische Expeditionen"
NZL_foreign_expeditions_desc:5	"Da unsere Feinde bereit sind, im Namen ihrer Ideale in weit entfernte Konflikte einzugreifen, müssen wir bereit sein, das Gleiche für unsere Ideale zu tun."
NZL_why_we_fight:5	"Warum wir kämpfen"
NZL_why_we_fight_desc:5	"Die Welt wird immer unsicherer. Unser Volk muss die Grausamkeiten sehen, die von denen begangen werden, die nach Macht streben. Es ist an der Zeit, die Menschen für unsere Sache zu gewinnen und sicherzustellen, dass alle bereit sind, für unsere Freiheit zu kämpfen."
NZL_political_commissars:5	"Politische Kommissare"
NZL_political_commissars_desc:5	"Um sicherzustellen, dass unsere Politik in der militärischen Praxis befolgt wird, werden wir politisch ernannte Beamte in die militärischen Ränge einführen."
NZL_internationalism_focus:5	"Internationalismus im Fokus"
NZL_internationalism_focus_desc:5	"Ideologie kennt keine Grenzen. Eine andere Nation mag sich souverän nennen, aber unsere Überzeugungen stehen über solchen Ansprüchen."
NZL_nationalism_focus:5	"Schwerpunkt Nationalismus"
NZL_nationalism_focus_desc:5	"Unsere Nation ist einzigartig, und unsere politischen Errungenschaften konnten nur hier entstehen. Wir müssen um jeden Preis für sie kämpfen."
NZL_ideological_fanaticism:5	"Ideologischer Fanatismus"
FIN_USA_In_Fac_Get_Slot:5	"Gemeinsame Nutzung amerikanischer Technologie"
CAN_USA_In_Fac_Get_Slot_desc:5	"Die USA sind einer der Weltmarktführer, wenn nicht sogar der Weltmarktführer, in der Forschung. Für sie arbeiten Wissenschaftler aus der ganzen Welt. Da wir nun mit ihnen im Kampf gegen das Böse zusammenstehen, könnten wir davon profitieren."
