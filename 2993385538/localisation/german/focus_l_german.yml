IEA_Road_desc:5	"Der Zugang zur Hauptstadt ist schlecht, wir sollten unser Straßennetz in der Region ausbauen"
IEA_land_desc:5	"Ein großer Teil unseres Landes liegt brach und ist für die Industrie ungeeignet. Mit dem Fortschritt der Maschinen können wir das ändern."
