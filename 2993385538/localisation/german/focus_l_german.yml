uk_anglo_soviet_occupation:5	"Anglo-sowjetische Invasion in Persien"
uk_anglo_soviet_occupation_desc:5	"Die anglo-sowjetische Invasion in Persien fand vom 25. August 1941 bis zum 17. September 1941 statt. Die Alliierten und die Sowjetunion kooperierten gegen die persische Armee, um die persischen Ölfelder zu sichern und eine sichere und zuverlässige Versorgungsroute zwischen den Alliierten und der Sowjetunion zu schaffen."
uk_arab:5	"Die Entwicklung Arabiens"
uk_arab_desc:5	"Obwohl die arabischen Länder reich an Öl sind, eignen sie sich kaum für einen Konflikt. Viele der dortigen Volkswirtschaften befinden sich in einer schwierigen Lage und würden britische Investitionen gut gebrauchen können."
uk_bhutan:5	"Ausbau der Maultierpfade in Bhutan"
uk_bhutan_desc:5	"Der Bau eines effektiven Straßennetzes in Bhutan übersteigt unsere derzeitigen Möglichkeiten, aber wir können die Maultierpfade ausbauen, um den Zugang zu verbessern."
army_support:5	"Unterstützung durch die Streitkräfte suchen"
army_support_desc:5	"Das Militär ist eine Kraft, die nicht ignoriert werden kann. Es lohnt sich, die Unterstützung von Schlüsselpersonen zu verstärken."
