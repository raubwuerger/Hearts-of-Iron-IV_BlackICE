BUL_bulgarian_will:5	"Slawische Mentalität"
BUL_acquire_panzer_iv:5	"Erwerb des Panzer IV"
BUL_maintain_soviet_diplomats:5	"Unterhalt sowjetischer Diplomaten"
BUL_reinforce_tsarist_navy:5	"Verstärkung der zaristischen Marine"
BUL_podvodnik:5	"Podvodnik"
BUL_dockyards_of_varna:5	"Werften von Varna"
BUL_mobile_navy:5	"Mobile Marine"
BUL_license_soviet_equipment:5	"Lizenz Sowjetische Ausrüstung"
BUL_krali_marko_line:5	"Krali-Marko-Linie"
BUL_black_sea_operations:5	"Schwarzmeeroperationen"
