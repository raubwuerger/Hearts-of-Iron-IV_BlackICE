Matignon_promise:0	"Die Erfüllung dieses Schwerpunkts wird das Matignon-Abkommen stärken - §GStabilität§! und §Reduzierung der Wirtschaft§! §OSie müssen mindestens zwei Schwerpunkte \"Versprechen\" erfüllen, um das Matignon-Abkommen zu unterzeichnen!§!"
Matignon_agreement_full:0	"§CSie haben ein starkes und vollständiges Matignon-Abkommen versprochen!\n§R!!RWichtig:§!§!"
Matignon_agreement_weak:0	"§CSie haben derzeit ein schwaches und unvollständiges Matignon-Abkommen versprochen. Erfüllen Sie alle vier \"Versprechen\", um mehr Stabilität auf Kosten der Wirtschaft zu erhalten.\n§R!!Wichtig:§!§!"
FRA_clear_crisis:0	"§GWenn Sie diesen Schwerpunkt abschließen, wird die derzeitige Krise beendet.\n§R!!RWichtig:§!§!"
FRA_election_tooltip:0	"Die Wahl von 1936 ist beendet."
FRA_intervention_tooltip_BiceE:0	"Das §YVereinigte Königreich§! will, dass sich alle Nationen aus dem Spanischen Bürgerkrieg heraushalten. §RWenn wir uns einmischen§!, könnten sie ein Bündnis mit uns ablehnen.\n§RWichtig:§!"
FRA_improve_econ_first:0	"Unsere §CStagnant Economy§! ist stabil genug, um diesen Schwerpunkt abzuschließen. Vervollständigen Sie den Fokus in dem wirtschaftlichen Zweig des Fokusbaums, der Ihre §CStagnierende Wirtschaft§! anspricht."
