SIK_SOV:5	"Freundschaft mit der Sowjetunion"
SIK_SOV_desc:5	"Wann immer wir Hilfe brauchten, waren die Sowjets für uns da, und sie werden im wahrsten Sinne des Wortes der Weg zur Größe sein"
SIK_friend_PRC_desc:5	"Die Revolution kann nur gelingen, wenn die Kommunisten zusammenstehen. Natürlich müssen wir sicherstellen, dass keine gegenreaktionären Elemente innerhalb der Partei versuchen, die Revolution zum Entgleisen zu bringen, bevor sie überhaupt begonnen hat."
SIK_PRC_ministers:5	"Kommunistische Berater einladen"
