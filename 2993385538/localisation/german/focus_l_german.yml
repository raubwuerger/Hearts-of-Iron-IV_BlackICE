SIK_embrace_the_opium_trade:5	"Umarmung des Opiumhandels"
SIK_embrace_the_opium_trade_desc:1	"Ein Land braucht Geld, um zu funktionieren. In unserer derzeitigen Situation können wir uns die Quellen nicht aussuchen."
SIK_SOV_arms:5	"Lernen Sie von den Sowjets"
SIK_SOV_arms_desc:5	"Die Rote Armee ist riesig und unaufhaltsam, wir sollten von ihr lernen, was wir können."
