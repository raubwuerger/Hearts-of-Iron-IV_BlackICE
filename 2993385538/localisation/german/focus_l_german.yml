USA_magic:1	"MAGIC"
USA_magic_desc:1	"Die Marine glaubt, die japanischen Verschlüsselungscodes knacken zu können, was es uns ermöglichen würde, ihren gesamten Nachrichtenverkehr, einschließlich der Schiffsbewegungen, zu lesen."
USA_neutrality_act:1	"Neutralitätsgesetz"
USA_reestablish_the_gold_standard_desc:1	"Ohne den Goldstandard ist Geld kaum mehr als ein Glaubensartikel, während die zügellose Inflation die Ersparnisse unserer Bürger auffrisst und ihre Arbeit entwertet. Wir müssen diesen fiskalisch unverantwortlichen Weg aufgeben."
USA_adjusted_compensation_act:1	"Gesetz über angepasste Entschädigungen"
USA_adjusted_compensation_act_desc:1	"Unseren Veteranen des Ersten Weltkriegs wurde eine angemessene Rente versprochen. Viele von ihnen sind in letzter Zeit durch die Depression in eine schwierige Lage geraten. Wir müssen tun, was wir können, um denen zu helfen, die dem Ruf der Republik in der Stunde der Not gefolgt sind."
USA_protectionist_tariffs_desc:1	"Der freie Handel hat unsere Märkte für ausländische Konkurrenten geöffnet, von denen viele ihre eigenen Zölle und Abgaben erhoben haben. Unsere Unternehmen sind einem harten Wettbewerb ausgesetzt, während die ausländischen Unternehmen die Sicherheit der Zollmauer genießen. Das muss ein Ende haben."
USA_income_tax_reform:2	"Einkommensteuerreform"
USA_income_tax_reform_desc:1	"Die Einkommenssteuer nimmt jedem Amerikaner Geld aus dem Portemonnaie - Geld, das unsere Bürger für den Kauf anderer Dinge und die Unterstützung ihrer lokalen Wirtschaft ausgeben könnten. Wir werden den Amerikanern die Autonomie über ihre eigenen Finanzen zurückgeben."
USA_america_first_desc:2	"Manche wollen, dass wir unsere Schätze und das Blut unserer Jugend in fremden Kriegen ausgeben. Wir dürfen uns von diesen Kriegstreibern nicht beeinflussen lassen und werden stattdessen nach einer einfachen Maxime leben: America First - Everyone Else Second."
USA_extend_the_chinese_exclusion_acts:1	"Verlängern Sie die Chinese Exclusion Acts"
USA_extend_the_chinese_exclusion_acts_desc:2	"Angesichts des vom Krieg verwüsteten Chinas müssen wir Maßnahmen ergreifen, um die chinesische Einwanderung zu begrenzen, damit wir nicht in Flüchtlingswellen ertrinken."
USA_voter_registration_act_desc:1	"Wahlen sind der wichtigste Teil einer Demokratie. Es ist völlig unvernünftig zu fordern, dass es keine Kontrolle darüber geben sollte, wer an ihnen teilnehmen kann - oder vielleicht haben die Leute, die für unkontrollierte Wahlen plädieren, finstere Motive und wollen den Prozess durch Wahlbetrug unterlaufen..."
USA_national_prosperity_program:1	"Nationales Wohlstandsprogramm"
USA_national_prosperity_program_desc:1	"Der Schlüssel zu einer raschen Erholung und dauerhaftem Wohlstand liegt nicht in unkontrollierten Märkten, sondern in sorgfältig gesteuerten Programmen, die private und öffentliche Unternehmen miteinander verbinden."
USA_de_regulate_the_banking_sector_desc:1	"Nach einer Korrektur auf den Finanzmärkten, die im Wirtschaftszyklus völlig normal ist, haben frühere Regierungen ziemlich unvernünftige Beschränkungen für Finanzaktivitäten eingeführt. Diese Beschränkungen sind zwar zweifellos gut gemeint, schaden aber eindeutig mehr als sie nützen."
USA_national_employment_strategy:1	"Nationale Beschäftigungsstrategie"
USA_national_employment_strategy_desc:1	"Arbeitslosigkeit entsteht aus einer einfachen Tatsache: Die Menschen passen nicht zu den angebotenen Arbeitsplätzen. Fabriken liegen brach, weil die Arbeitgeber nicht die Leute finden, die sie brauchen, während die Menschen in anderen Teilen des Landes hungern. Wir werden eine neue Strategie einführen, die sicherstellt, dass jeder Arbeitgeber die Menschen finden kann, die er für sein Unternehmen braucht."
USA_send_lindbergh_to_germany_desc:1	"Der berühmte Flieger hat angeboten, nach Europa zu reisen, um zu untersuchen, wie Deutschland sich nach dem letzten Krieg wiederaufgebaut hat. Das sollte uns wertvolle Erfahrungen bringen. Lindbergh hat auch angedeutet, dass er bereit wäre, der Regierung in einer beratenden Funktion zur Seite zu stehen."
USA_work_with_the_bund:1	"Zusammenarbeit mit dem Bund"
USA_work_with_the_bund_desc:1	"Der Deutsch-Amerikanische Bund hat uns angeboten, uns bei der Vermittlung unserer Positionen an die vielen Amerikaner deutscher Abstammung zu helfen. Das würde sicherstellen, dass wir in ihren Staaten eine sympathische Basis haben."
USA_honor_the_confederacy:1	"Ehre der Konföderation"
USA_honor_the_confederacy_desc:1	"Zu lange wurde die Geschichte des Bürgerkriegs aus der Sicht des Nordens erzählt - die Geschichte einer zum Scheitern verurteilten Rebellion. Es ist an der Zeit, dass auch die andere Seite gehört wird."
USA_war_powers_act_desc:1	"In einer Welt immer schnellerer Flugzeuge mit immer größeren Bombenladungen, in einer Welt von U-Booten und chemischen Waffen ist es eine Einladung zur Katastrophe, wenn der Präsident nur mit Zustimmung des Kongresses das tun kann, was zur Verteidigung des Landes notwendig ist."
USA_eliminate_the_southern_threat_desc:1	"Mexiko ist seit einer Generation ein instabiles Chaos. Ob die Gewalt über unsere Grenze schwappt oder jemand das Land eint und nach Norden marschiert, spielt keine Rolle - wir müssen unsere Südflanke sichern."
USA_the_canadian_corridor:1	"Der kanadische Korridor"
USA_the_canadian_corridor_desc:1	"Ein schmaler Streifen dünn besiedelten kanadischen Territoriums trennt Alaska von den unteren Teilen der USA. Seine Verteidigung ist daher vom guten Willen Kanadas abhängig. Der wahrscheinlichste Angreifer ist jedoch Kanada. So kann es nicht weitergehen."
USA_strategic_interests_desc:1	"Die Welt ist stärker vernetzt als je zuvor. Eine Bedrohung in einem Teil der Welt kann sich leicht zu einer Gefahr für die ganze Welt ausweiten. Wir müssen ein Netz von sich gegenseitig unterstützenden Stützpunkten rund um den Globus aufbauen, damit wir in jeder Situation schnell reagieren können."
USA_protect_south_america:1	"Südamerika schützen"
USA_protect_south_america_desc:1	"Der südliche Teil unseres Doppelkontinents ist seit seiner Entdeckung der Spielplatz von Imperien gewesen. Es ist an der Zeit, dass jemand es auf sich nimmt, dafür zu sorgen, dass diese Nationen ungestört sind und in eine produktivere Zukunft geführt werden."
USA_secure_asia_desc:1	"Die Kolonialnationen in Europa scheinen entweder nicht willens oder nicht in der Lage zu sein, ihre asiatischen Kolonien wirksam zu verteidigen. Wir müssen diese Last für sie übernehmen, damit diese Gebiete nicht zu Sprungbrettern für weitere Aggressionen werden."
USA_global_hegemony:1	"Globale Hegemonie"
USA_global_hegemony_desc:1	"Wir stehen an der Schwelle zu einer globalen Vormachtstellung, die es uns ermöglichen wird, Konflikte allein durch unsere bloße Existenz zu verhindern. Wir müssen nur dafür sorgen, dass die übrigen Großmächte der Welt unsere Position anerkennen."
USA_reorganization_act_desc:1	"Der Reorganization Act geht auf den Ruf des damaligen Gouverneurs Roosevelt zurück, die Regierung des Bundesstaates zu reorganisieren, um Effizienz zu erreichen. Im Jahr 1937 legte das Brownlow-Komitee Roosevelts einen Plan vor, der vorsah, das Personal des Präsidenten zu erweitern, leitende Agenturen in das Executive Office of the President zu integrieren, das Verdienstsystem auszuweiten, unabhängige Agenturen in die bestehenden Abteilungen auf Kabinettsebene einzugliedern und die Buchhaltungs- und Finanzverfahren zu modernisieren. Das Court Packing Schema verdammte die Bemühungen bis 1939, als das Repräsentantenhaus und der Senat dem Reorganisationsgesetz von 1939 zustimmten, das eine Klausel enthielt, die besagte, dass der Kongress 60 Tage Zeit hatte, um Änderungen zu beanstanden. Der Kongress erhob nie Einwände gegen eine Reorganisation der Exekutive."
USA_intervention_in_the_americas:1	"Intervention auf dem amerikanischen Kontinent"
USA_intervention_in_the_americas_desc:1	"Unsere erste Aufgabe muss es sein, sicherzustellen, dass wir auf alle Eventualitäten in unserer eigenen Hemisphäre vorbereitet sind."
USA_war_plan_crimson_desc:1	"Auch wenn Kanada jetzt ein freundlicher Nachbar ist, wird dies nicht immer der Fall sein."
USA_war_plan_gray:1	"Kriegsplan Grau"
USA_war_plan_gray_desc:1	"Die Geschichte hat gezeigt, dass die Nationen in der Karibik recht instabil sind. Wir müssen möglicherweise schnell handeln, um die amerikanischen Interessen zu schützen, falls eines dieser Länder in eine instabile Lage gerät."
USA_intervention_in_europe_desc:1	"Weniger als zwei Jahrzehnte nach dem Ende des Ersten Weltkriegs stehen die europäischen Nationen erneut kurz vor einem Krieg. Wir müssen vorbereitet sein, falls die Situation ein schnelles Eingreifen erfordert."
USA_war_plan_gold:1	"Kriegsplan Gold"
USA_war_plan_gold_desc:1	"Frankreich leidet unter innerer Spaltung und zunehmendem politischen Radikalismus, ist aber auch eine der größten Militärmächte Europas. Diese Kombination bereitet vielen Menschen Unbehagen."
USA_anti_bolshevist_aid_desc:1	"Jedes Gewehr, jede Granate, jede Kugel und jedes Paar Stiefel, das wir denjenigen geben können, die gegen die Ausbreitung des Kommunismus kämpfen, wird letztendlich helfen, uns zu verteidigen."
USA_war_plan_ruby:1	"Kriegsplan Rubin"
USA_war_plan_ruby_desc:1	"Indien beherbergt ungezählte Millionen von Menschen, auf die wir vorbereitet sein müssen, falls wir in einen Konflikt geraten."
USA_intervention_in_asia_desc:1	"Asien, das oft von den Entwicklungen in Europa überschattet wird, hat seine eigenen Krisenherde und zwingt uns, uns auf eine Intervention vorzubereiten."
USA_war_plan_yellow:1	"Kriegsplan Gelb"
USA_war_plan_yellow_desc:1	"China befindet sich seit mehr als einer Generation im Bürgerkrieg. Es ist nicht abzusehen, wann sich die Lage so weit verschlechtert, dass wir eingreifen müssen."
USA_selective_training_act_desc:1	"Der Selective Training and Service Act von 1940 war die erste Einberufung in Friedenszeiten in der Geschichte der USA. Alle Männer im Alter von 21 bis 36 Jahren mussten sich registrieren lassen, wobei die Auswahl der Wehrpflichtigen durch eine nationale Lotterie erfolgte. Die Wehrpflichtigen sollten 12 Monate im aktiven Dienst und 10 Jahre in der Reserve dienen. Der Kongress verlängerte die aktive Dienstzeit im Jahr 1941 auf 30 Monate, was zum Service Extension Act von 1941 führte. Weitere Gesetze verlängerten die Altersgrenze von 18 bis 64 Jahren, so dass bis zum Auslaufen des Gesetzes im Jahr 1947 insgesamt 10 Millionen Männer eingezogen wurden."
USA_louisiana_maneuvers:1	"Louisiana-Manöver"
USA_louisiana_maneuvers_desc:1	"Das Louisiana Maneuvers wurde konzipiert, um verschiedene Aspekte der Modernisierung der US-Armee zu testen, wobei der Schwerpunkt auf der Mechanisierung und der Fähigkeit einer solchen Truppe lag, über große Entfernungen zu operieren. Das Konzept der gepanzerten Divisionen wurde als solide angesehen, und die daraus gezogenen Lehren sollten im Laufe des Krieges zur Bildung von 16 gepanzerten Divisionen führen."
USA_army_of_the_united_states:1	"Armee der Vereinigten Staaten"
USA_army_of_the_united_states_desc:1	"Vor dem Ausbruch des Krieges war die US-Armee klein und veraltet. Mit der Ernennung von George Marshall zum Generalstabschef im Jahr 1939 begann die Armee in rasantem Tempo zu expandieren und zu modernisieren und sollte das Rückgrat der alliierten Streitkräfte gegen die Achsenmächte bilden. Im Laufe des Krieges dienten 11,2 Millionen Amerikaner in der US-Armee."
USA_womens_armed_service_integration_act:1	"Gesetz zur Integration von Frauen in den bewaffneten Dienst"
USA_tank_destroyer_doctrine:1	"Jagdpanzer Doktrin"
USA_tank_destroyer_doctrine_desc:1	"Eine umstrittene Theorie, die von einigen Artillerieoffizieren entwickelt wurde und besagt, dass ein schnelles, leicht gepanzertes, aber schwer bewaffnetes Fahrzeug die beste Waffe gegen einen gepanzerten Durchbruch ist."
USA_main_battle_tanks:1	"Hauptkampfpanzer"
USA_assault_carbines:5	"M2-Karabiner"
USA_assault_carbines_desc:5	"Der M2 war eine Abwandlung des M1 Carbine, der sich aufgrund seines geringeren Gewichts und des größeren Magazins großer Beliebtheit erfreute. Der M2 verfügte über einen Feuerwahlschalter, der das automatische Abfeuern eines 30-Schuss-Magazins ermöglichte - die erste tragbare automatische Waffe der USA. Für einen breiten Einsatz in Europa kam die Waffe zu spät, doch in der Schlacht um Okinawa bewährte sie sich aufgrund ihrer Fähigkeit, schnelles Unterdrückungsfeuer zu geben. Sie bot ein perfektes Gleichgewicht zwischen der Genauigkeit auf große Entfernungen und der Fähigkeit, auf kurze Entfernungen zu schießen, was zur Priorität für alle künftigen US-Dienstgewehre wurde. Das M2 war eine der wichtigsten US-Waffen für die Truppen im Koreakrieg und blieb bis in die 1960er Jahre im Einsatz."
USA_build_the_pentagon:1	"Bau des Pentagons"
USA_escort_fighters:1	"Begleitjäger"
USA_escort_fighters_desc:1	"Der Bomber mag immer durchkommen, sein Flügelmann aber nicht - es sei denn, beide werden von befreundeten Jägern geschützt."
USA_us_army_airforce:1	"US Army Airforce"
USA_second_vinson_act:1	"Zweite Vinson-Akte"
USA_second_vinson_act_desc:1	"In den 1920er Jahren wurden die Verwundbarkeiten großer kapitaler Schiffe gegenüber Flugzeugen aufgedeckt, was zum Aufstieg der Marinefliegerei führte. Die japanische "Kido Butai" bewies die Schlagkraft einer trägergestützten Flotte, und nach dem Verlust der meisten US-Schlachtschiffe beim Angriff auf Pearl Harbor wandten sich die USA dem Ausbau ihrer eigenen trägergestützten Flotte zu. Der große Sieg in der Schlacht von Midway im Jahr 1942 bestätigte die neue Ausrichtung der USA. Der Flugzeugträger veränderte das Gesicht der Seekriegsführung und wurde während des gesamten Zweiten Weltkriegs zum wichtigsten Instrument jeder größeren Flotte."
USA_second_vinson_act_tt:1	"Je nach dem Status der §CFlottenabkommen§! können die Anforderungen für diesen Schwerpunkt reduziert werden."
USA_maritime_commission_desc:1	"Während sich die meisten Laien nur auf die Kriegsschiffe konzentrieren, wissen die wahren Experten, dass es die einfachen Frachtschiffe sind, die Kriege gewinnen. Um die Anzahl der in Kriegszeiten verfügbaren Schiffe zu erhöhen, wird ein spezielles Gremium gebildet, das den Bau koordiniert."
USA_advanced_basing:1	"Erweiterte Basis"
USA_advanced_basing_desc:1	"Je weiter wir den Feind von unseren Küsten fernhalten können, desto besser."
USA_fleet_submarines_desc:1	"Unsere wahrscheinlichsten Gegner im Seekrieg sind beide auf den Außenhandel angewiesen, der sich als sehr anfällig für U-Boote erwiesen hat. Diese U-Boote müssten eine sehr große Reichweite haben, damit sie die Ozeane überqueren und nahe an der gegnerischen Küste operieren können."
USA_unrestricted_submarine_warfare:1	"Uneingeschränkte U-Boot-Kriegsführung"
USA_unrestricted_submarine_warfare_desc:1	"Die Geschichte hat gezeigt, dass jeder noch so gut gemeinte Vertrag zur Kontrolle der U-Boot-Kriegsführung das Papier nicht wert ist, auf dem er geschrieben steht. Wir sollten uns nicht an etwas binden, das unsere Feinde ohnehin ignorieren werden."
USA_great_depression_cooldown:5	"Neue Gesetzgebung wird noch ausgearbeitet"
USA_great_depression_cooldown_tt:5	"Nach der Verabschiedung dieses Gesetzes wird es §Y230 Tage§! dauern, bis weitere New Deal-Gesetze ausgearbeitet und unterschriftsreif sind.\n\n"
USA_limited_intervention_tt:5	"\n\nDie Verabschiedung dieses Gesetzes wird es §RErheblich schwieriger§! machen, Ihre Wirtschaft zu mobilisieren.\n\n"
GER_train_panzergrenadiere_TT:5	"Schaltet die Fähigkeit §YAusbruch aus der Umzingelung§! für alle Truppenführer frei.\n"
GER_german_focus:5	"Führer-Direktiven"
GER_Wunderwaffen_TT:5	"§YWunderwaffen§! Entscheidungen werden in den kommenden Wochen erscheinen.\n"
GER_Moscow_autobahn:5	"Ausbau der Rollbahn Minsk-Moskau"
GER_Moscow_autobahn_desc:5	"Die berühmte Autobahn von Minsk nach Moskau sollte für unsere glorreichen Panzer ausgebaut werden. Sobald wir die Staaten kontrollieren, durch die die Autobahn führt, können wir sie ausbauen."
GER_Kiev_autobahn:5	"Ausbau der Rollbahn Gomel-Kiew"
GER_Leningrad_autobahn:5	"Ausbau der Rollbahn Witebsk-Leningrad"
GER_Leningrad_autobahn_desc:5	"Die Autobahn nach Leningrad sollte für unsere ruhmreichen Panzer ausgebaut werden. Sobald wir die Staaten kontrollieren, durch die die Autobahn führt, können wir sie ausbauen."
GER_Goering_Plan:5	"Görings Vierjahresplan"
GER_autobahn_I_desc:5	"Seit seinem Beginn im Jahr 1933 war das Autobahnprojekt ein glorreicher Erfolg. Die Bauarbeiten haben die Arbeitslosigkeit verringert, und die breiten Straßen sind ein Denkmal für den wirtschaftlichen Aufschwung Deutschlands. Es bleibt jedoch noch viel zu tun."
GER_autobahn_II_tt:5	"1 Stufe §YInfrastruktur§! in §YSachsen§!, §YBrandenburg§!, §YThüringen§!, §YHannover§! und §YFranken§! hinzufügen"
GER_autobahn_IV_tt:5	"1 Stufe §YInfrastruktur§! in §YHessen§!, §YWestfalen§!, §YWeser-Ems§!, §YSchlegwig-Holstein§!, §YMecklenburg§!, §YWestpommern§! und §YPommern§! hinzufügen"
GER_westwall_desc:5	"Der Westwall verläuft parallel zu Frankreichs gepriesener Maginot-Linie und nimmt einen Großteil des Geländes ein, das die Siegfried-Linie im letzten Weltkrieg eingenommen hat. Die Verstärkung der Verteidigungsanlagen wird es uns ermöglichen, die Grenze mit weniger Männern zu halten, so dass Divisionen frei werden, die an möglichen Ostfeldzügen teilnehmen können."
GER_westwall_tt:5	"§RWenn das Rheinland remilitarisiert wird, erhalten Sie außerdem:§!\n"
GER_westwall_forts:5	" Fügen Sie §Y12 Landforts§! an der französischen Grenze hinzu.\n"
GER_atlantic_wall_med_focus_desc:5	"Baut mittlere Küstenforts entlang der Atlantikküste"
GER_ostwall:5	"Ostwall"
GER_ostwall_desc:5	"Baut Befestigungen in Ost Oderland"
GER_west_wall_lite_forts:5	" Fügen Sie §Y12 Landforts§! an der französischen Grenze hinzu.\n"
GER_west_wall_lite_forts_6:5	" Fügen Sie §Y6 Landforts§! an der französischen Grenze hinzu.\n"
GER_west_wall_med:5	"Westwall mittlere Festungen"
GER_west_wall_med_forts_6:5	" Fügen Sie §Y6 Landforts§! an der französischen Grenze hinzu.\n"
GER_west_wall_Hv:5	"Westwall starke Festungen"
GER_west_wall_Hv_desc:5	"Der Westwall verläuft parallel zu Frankreichs gepriesener Maginot-Linie und nimmt einen Großteil des Geländes ein, das auch die Siegfried-Linie im letzten Weltkrieg eingenommen hat. Die Verstärkung der Verteidigungsanlagen ermöglicht es uns, die Grenze mit weniger Männern zu halten, wodurch Divisionen frei werden, die an möglichen Ostfeldzügen teilnehmen können."
GER_industrial_effort_36:5	"£tech_mod  Rohstoffindustrie erweitern"
GER_industrial_effort_36_desc:5	"Konzentration all unserer politischen Bemühungen auf den Aufbau der Rohstoffindustrie in einem großen Sprung nach vorn."
GER_industrial_effort_38_desc:5	"Konzentrieren Sie all Ihre politischen Bemühungen auf den Aufbau der militärischen und zivilen Industrie in einem großen Sprung nach vorn."
GER_industrial_effort_39:5	"Militärindustrie erweitern"
GER_industrial_effort_39_desc:5	"Mit eisernem Willen und einer unerbittlichen Arbeitsmoral können wir die Menschen für eine große militärisch-industrielle Anstrengung mobilisieren."
GER_synthetic_effort_42_desc:5	"Die Verknappung von Öl und Gummi zwingt uns zum Bau weiterer synthetischer Ölfabriken."
GER_synthetic_effort_43:5	"Ausbau der deutschen Synthetikfabriken II"
GER_synthetic_effort_43_desc:5	"Der Mangel an Öl und Gummi zwingt uns, noch mehr synthetische Ölfabriken zu errichten."
GER_collect_metals_desc:5	"Die Bürger werden aufgefordert, Metallgegenstände zu sammeln und sie an Sammelstellen abzugeben, damit sie für den Kriegseinsatz verschrottet werden können."
GER_requistion_trucks:5	"Anforderung von zivilen Lastwagen"
GER_requistion_trucks_desc:5	"Wir brauchen alle Lastwagen, die wir finden können, für die Kriegsanstrengungen."
GER_requistion_motorcycles_desc:5	"Wir brauchen alle Motorräder, die wir finden können, für den Kriegseinsatz."
GER_round_up_horses_I:5	"Deutsche Pferde zusammentreiben"
GER_round_up_horses_I_desc:5	"Unser Militär braucht mehr Pferde! Wir können sie von den Bauernhöfen und Zivilisten nehmen. Das wird nicht populär sein und kann unsere Wirtschaft beeinträchtigen. Aber die militärischen Bedürfnisse müssen an erster Stelle stehen!"
GER_round_up_horses_III_desc:5	""
GER_sturmgewehr:5	"Sturmgewehr"
GER_sturmgewehr_desc:5	"Das Sturmgewehr 44 war das erste erfolgreiche Sturmgewehr. Es zeichnete sich unter anderem durch eine Zwischenpatrone, kontrollierbares automatisches Feuer, eine kompaktere Bauweise als ein Kampfgewehr mit höherer Feuerrate aus und war in erster Linie für die Bekämpfung von Zielen innerhalb einiger hundert Meter konzipiert."
GER_air_innovation_2_desc:5	"Die Aufgaben des Reichsluftfahrtministeriums sind von überragender Bedeutung. Die Luftwaffe muss die modernste Luftwaffe der Welt sein!"
GER_jets_focus_engines:5	"Fortschrittliche Triebwerksforschung"
GER_jets_focus_engines_desc:5	" "
GER_jets_focus_II_desc:5	" "
GER_jets_focus_III:5	"Strahltriebwerk Forschungsanstrengungen III"
GER_jets_focus_III_desc:5	" "
GER_jets_focus_V_desc:5	" "
GER_jets_focus_VI:5	"Strahltriebwerk Forschungsanstrengungen VI"
GER_jets_focus_VI_desc:5	" "
GER_jets_focus_VIII_desc:5	" "
GER_jets_focus_IX:5	"Strahltriebwerk Forschungsanstrengungen IX"
GER_jets_focus_IX_desc:5	" "
GER_Flak_defences_I_desc:5	" "
GER_Flak_defences_II:5	"Flakverteidigung II"
GER_Flak_defences_II_desc:5	" "
GER_Flak_defences_IV_desc:5	" "
GER_Flak_defences_V:5	"Flakverteidigung V"
GER_Flak_defences_V_desc:5	" "
GER_luftwaffe_ground_troops_focus_one_desc:5	"Die Luftwaffe wird einige Fähigkeiten verlieren. Auf der Grundlage von Vorschlägen zur Stärkung des Heeres formulierte Hermann Göring einen Plan zur Schaffung eigener Infanteriedivisionen unter Verwendung von 200.000-250.000 Boden-, Unterstützungs- und anderen überschüssigen Kräften. Die Divisionen wurden nach dem Vorbild von zwei Jägerregimentern mit je drei Bataillonen sowie Artillerie- und anderen Unterstützungseinheiten organisiert. Göring beabsichtigte, die Einheiten auf Verteidigungsaufgaben an ruhigeren Fronten zu beschränken, aber viele Einheiten wurden an der Ostfront eingesetzt."
GER_luftwaffe_ground_troops_focus_two:5	"Luftwaffen Felddivisionen II"
GER_luftwaffe_ground_troops_focus_two_desc:5	"Die Luftwaffe wird zusätzliche Fähigkeiten verlieren. Der Durst nach Männern zur Verstärkung des Heeres ist ungebrochen. Hermann Göring wird zusätzliches Boden-, Unterstützungs- und sonstiges Personal zur Verfügung stellen, um die Kriegsanstrengungen zu unterstützen."
GER_naval_bomber_focus_desc:5	"Marine-Angriffsbomber"
GER_naval_patrol:5	"Seeaufklärungsgruppe (SAGr)"
GER_naval_patrol_desc:5	"Seeaufklärungsbomber"
GER_Ural_Bomber_desc:5	"General Wever sagt, dass wir mit schweren Bombern großen Erfolg haben werden, also sollten wir Ressourcen in ihre Erforschung stecken."
wever_alive:5	"§YWalther Wever lebt§!"
GER_Amerika_Bomber:5	"Amerika Bomber"
GER_divebomber_focus:5	"Sturzkampfbomben"
GER_divebomber_focus_desc:5	"Während des Ersten Weltkriegs wurden Bombenangriffe aufgrund der Unfähigkeit früherer Flugzeuge, einen vertikalen Sturzflug durchzuführen, oft zu Selbstmordmissionen. Jüngste Fortschritte in der Luftfahrttechnik könnten es uns jedoch ermöglichen, brauchbare Sturzkampfflugzeuge herzustellen, die nicht nur präziser sind als herkömmliche Bomber in der Ebene, sondern auch flexibler und kostengünstiger. Ein solches Flugzeug könnte den Namen Sturzkampfflugzeug oder kurz "Stuka" tragen..."
GER_fighter_air_effort:5	"Jagdgeschwader (Jagdflugzeuge)"
GER_nightfighter_effort:5	"Nachtjagdgeschwader (Nachtjäger)"
GER_nightfighter_effort_desc:5	"Nachtjagdgeschwader Forschung"
GER_wildesau:5	"Wilde Sau- Einmotorige Nachtjäger"
GER_fighter_air_doctine:5	"Jagdgeschwader Doktrin"
GER_fighter_air_doctine_desc:5	"Die Fähigkeit der Luftwaffe, Operationen durchzuführen, hängt von der Erlangung der Luftüberlegenheit ab. Wir müssen für unsere Jagdgeschwader wendige und wirksame Kampfflugzeuge entwickeln, um die gegnerischen Jagdflugzeuge vom Himmel fernzuhalten."
GER_fighter_air_effort_a:5	"Jagdgeschwader (Bf-109E)"
GER_fighter_air_effort_c:5	"Jagdgeschwader (Bf-109F)"
GER_fighter_air_effort_c_desc:5	""
GER_fighter_air_effort_d:5	"Jagdgeschwader (He-10)"
GER_fighter_air_effort_f:5	"Jagdgeschwader (Fw-190)"
GER_fighter_air_effort_f_desc:5	""
GER_fighterbomber_effort_a:5	"Schlachtgeschwader (Sturzkampfbomber) I"
GER_divebomber_focus_a:5	"Sturzkampfgeschwader (Ju-87 A)"
GER_divebomber_focus_a_desc:5	"Während des Ersten Weltkriegs wurden Bombenangriffe aufgrund der Unfähigkeit früherer Flugzeuge, einen vertikalen Sturzflug durchzuführen, häufig zu Selbstmordmissionen. Jüngste Fortschritte in der Luftfahrttechnik könnten es uns jedoch ermöglichen, brauchbare Sturzkampfflugzeuge herzustellen, die nicht nur präziser als herkömmliche Flächenbomber sind, sondern auch flexibler und kostengünstiger. Ein solches Flugzeug könnte den Namen Sturzkampfflugzeug oder kurz "Stuka" tragen..."
GER_divebomber_focus_b:5	"Schlachtgeschwader (He-118)"
GER_divebomber_focus_d:5	"Schlachtgeschwader (Hs-129)"
GER_divebomber_focus_d_desc:5	""
GER_divebomber_focus_e:5	"Sturzkampfgeschwader (Ju-87 D)"
GER_levelbomber_focus_a:5	"Schnellkampfgeschwader (Do-17)"
GER_levelbomber_focus_a_desc:5	"Leichte Schnellbomber"
GER_levelbomber_focus_b:5	"Kampfgeschwader (He-111 B)"
GER_levelbomber_focus_d:5	"Kampfgeschwader (He-111 H)"
GER_levelbomber_focus_d_desc:5	""
GER_levelbomber_focus_e:5	"Schnellkampfgeschwader (Ju-288)"
GER_tactical_air_effort:5	"Taktische Luftwaffe"
GER_tactical_air_effort_desc:5	"Der Sieg wird durch die Vernichtung der gegnerischen Bodentruppen errungen. Wir müssen uns darauf konzentrieren, unsere eigenen Armeen mit taktischen Schlägen gegen Nah- und Fernziele zu unterstützen."
GER_strategic_air_effort:5	"Strategische Luftwaffe"
GER_advanced_science_funding:5	"Ressourcen in die synthetische Industrie umleiten"
GER_advanced_science_funding_desc:5	"Wir müssen beginnen, in unsere fortschrittlichen wissenschaftlichen Experimente und Konzepte zu investieren."
GER_rocketry_Peenemunde:5	"Heeresforschungszentrum Peenemünde"
GER_rocketry_v1:5	"Vergeltungswaffe 1 (V1-Fliegerbombe)"
GER_rocketry_v1_desc:5	"Die fliegende Bombe V-1 (Vergeltungswaffe 1) - bei den Alliierten auch als Buzz Bomb oder Doodlebug und in Deutschland als Kirschkern oder Maikäfer bekannt - war ein früher Marschflugkörper und das einzige Serienflugzeug, das einen Impulsstrahl als Antrieb verwendete."
GER_rocketry_v2:5	"Vergeltungswaffe 2 (V2-Rakete)"
GER_rocketry_rheinbote:5	"Rheinbote (V4)"
GER_rocketry_rheinbote_desc:5	"Der Rheinbote (V4) war eine von Rheinmetall-Borsig in Berlin-Marienfelde entwickelte ballistische Kurzstreckenrakete. Sie sollte die Großkaliberartillerie ersetzen oder zumindest ergänzen, indem sie in leicht transportabler Form Feuerunterstützung auf große Entfernungen bot."
GER_rocketry_r4m:5	"Rakete, 4Kilogramm, Minenkopf (R4M)"
GER_norwegian_Hv_water:5	"Norwegisches Schweres Wasser"
GER_norwegian_Hv_water_desc:5	"Die Mitglieder des Uranvereins haben Norwegens schweres Wasser als einen der besten Kandidaten für einen Neutronenmoderator identifiziert. Als die deutschen Truppen 1940 einmarschierten, war die Anlage in Vemork ein Aktivposten, den sie sich schnell schnappen wollten. Unter verschärften Sicherheitsvorkehrungen verdoppelten die deutschen Wissenschaftler die Produktionskapazität für schweres Wasser und begannen, das Material in Fässern zu den Waffenlabors in Berlin zu transportieren. Die norwegischen Zivilarbeiter wussten nichts von Atombomben oder Neutronenmoderatoren, aber das auffällige Interesse der Nazis an der Substanz veranlasste Mitglieder des Widerstands, die Aktivitäten dem britischen Geheimdienst zu melden."
GER_goliah:5	"Leichter Ladungsträger Goliath"
GER_V3_cannon:5	"V-3-Kanone"
GER_V3_cannon_desc:5	"Die V-3 (Vergeltungswaffe 3) war eine Superkanone, die nach dem Prinzip der Mehrfachladung arbeitete, bei dem sekundäre Treibladungen abgefeuert werden, um die Geschwindigkeit eines Geschosses zu erhöhen. Die Waffe sollte zur Bombardierung Londons von zwei großen Bunkern in der nordfranzösischen Region Pas-de-Calais aus eingesetzt werden, die jedoch durch alliierte Bombenangriffe vor der Fertigstellung unbrauchbar gemacht wurden. Zwei ähnliche Geschütze wurden von Dezember 1944 bis Februar 1945 zur Bombardierung Luxemburgs eingesetzt. Die V-3 wurde auch als Hochdruckpumpe (HDP) bezeichnet, ein Codename, der den eigentlichen Zweck des Projekts verschleiern sollte. Sie war auch unter dem Namen Fleißiges Lieschen (Busy Lizzie) bekannt."
GER_vortex_cannon:5	"Vortex-Kanone"
GER_Landkreuzer:5	"Landkreuzer P. 1000 Ratte"
GER_Landkreuzer_desc:5	"Der Landkreuzer P. 1000 'Ratte' war ein Entwurf für einen superschweren Panzer, der im Juni 1942 von Krupp-Direktor Edward Grotte vorgeschlagen wurde. Die eingereichten Entwürfe und Zeichnungen des Panzers liefen unter den Namen OKH-Auftrag Nr. 30404 und E-30404/1, die im Dezember 1942 vorgelegt wurden. Der Panzer sollte 1000 Tonnen wiegen und damit deutlich schwerer sein als der Panzer VIII "Maus", der schwerste jemals gebaute Panzer (188 Tonnen). Die Hauptbewaffnung der Ratte sollte ein doppelter 280 mm SK C/28 Geschützturm sein. Es handelte sich dabei um denselben Turm, der auch auf dem deutschen Großkampfschiff Gneisenau verwendet wurde, jedoch durch die Entfernung eines der Geschütze und des dazugehörigen Lademechanismus modifiziert wurde. Das Entfernen der dritten Kanone ermöglichte die Unterbringung von zusätzlicher Munition und reduzierte das Gesamtgewicht des Panzers um 50 Tonnen. Die für die Ratte verwendeten Geschütze hätten die für andere Marinegeschütze entwickelte Munition verschossen. Sie umfasste auch panzerbrechende Geschosse mit 8,1 kg Sprengstoff und hochexplosive Geschosse mit 17,1 kg Sprengstoff. Die weitere Bewaffnung sollte aus einer 128-mm-Panzerabwehrkanone vom Typ Jagdtiger oder Maus, zwei 15-mm-Mauser MG 151/15-Autokanonen und acht 20-mm-Flak-38-Flugabwehrkanonen bestehen, von denen wahrscheinlich mindestens vier als Flakvierling montiert waren. Die genaue Position der 128-mm-Panzerabwehrkanone auf der Ratte ist unter Historikern umstritten. Die meisten glauben, dass sie im Hauptturm montiert wurde, während einige andere einen kleineren Sekundärturm am Heck der Ratte für logischer halten. Es existieren einige Konzeptzeichnungen, die eine flexible Montage auf der Glacisplatte nahelegen. Der Panzer sollte mit einem Fahrzeugschacht ausgestattet werden, in dem zwei BMW R12-Motorräder für Aufklärungszwecke untergebracht werden konnten, sowie mit mehreren kleineren Stauräumen, einem kompakten Sanitätsbereich und einem eigenständigen Toilettensystem. Das Projekt fand die Zustimmung Adolf Hitlers, der sein Interesse an der Entwicklung des Panzers bekundet hatte, wurde aber Anfang 1943 von Rüstungsminister Albert Speer gestrichen. Aufgrund seiner Größe und seines Gewichts wäre der Panzer nicht in der Lage gewesen, Brücken zu überqueren, da die Gefahr bestand, dass sie einstürzen würden, und das Befahren von Straßen hätte diese bald zerstört. Obwohl die vorgesehene Höchstgeschwindigkeit bei 40 Stundenkilometern lag, wäre er aufgrund seiner enormen Größe und guten Sichtbarkeit extrem anfällig für Luftangriffe und Artilleriebeschuss gewesen. Aufgrund seiner Größe wäre auch ein Transport nahezu unmöglich gewesen - kein vorhandener Eisenbahn- oder Zugwaggon hätte sein Gewicht tragen können, und seine Breite war zu groß für die vorhandenen Tunnel."
GER_mol_rib_pact:5	"Molotow-Ribbentrop-Pakt"
GER_soviet_ally:5	"Bündnis mit der UdSSR"
GER_soviet_ally_desc:5	"Vielleicht ist es möglich, unsere ideologischen Differenzen mit den Sowjets beiseite zu schieben und stattdessen zu betonen, was uns eint: der Hass auf den egoistischen Liberalismus und den dekadenten Westen. Mit der UdSSR als Verbündeten hätten wir Zugang zu allen Ressourcen, die wir brauchen - zusätzlich zu ihrer militärischen Macht natürlich..."
GER_turkey_puppet:5	"Marionette Türkei"
GER_rhineland_ultimatum:5	"§RDie Remilitarisierung kann rückgängig gemacht werden, wenn Sie konfrontiert werden und zurückweichen.§!\n"
GER_japan_friend:5	"Freundschaft mit Japan"
GER_japan_friend_desc:5	"Wir haben seit langem eine fruchtbare Beziehung zu China, aber unseren Ambitionen wäre vielleicht besser gedient, wenn wir uns stattdessen mit der uns verwandten Kriegskultur Japans verbünden würden, auch wenn das bedeutet, China den Wölfen zum Fraß vorzuwerfen..."
GER_anti_comitern_pact_desc:5	"Die Einmischung der Kommunistischen Internationale in die inneren Angelegenheiten der Nationen gefährdet nicht nur ihren inneren Frieden und ihr soziales Wohlergehen, sondern stellt auch eine Bedrohung für den Weltfrieden dar! Wir werden viele der nichtkommunistischen Länder auffordern, den Pakt zu unterzeichnen, und dafür sorgen, dass wir die rote Gefahr in Schach halten."
GER_anti_soviet_pact:5	"Antisowjetischer Pakt"
GER_anti_soviet_pact_desc:5	"Wir können den Anti-Komintern-Pakt noch einen Schritt weiterführen und alle Mitglieder bitten, sich zu einer Koalition gegen die Sowjetunion zu verpflichten. Wenn einer der Unterzeichner in einen Krieg mit der UdSSR gerät, müssen alle anderen Mitglieder ebenfalls den Krieg erklären."
GER_ussr_war_goal_desc:5	"Wir können unsere Propagandaanstrengungen darauf konzentrieren, das deutsche Volk - und die Welt - auf einen gerechten Krieg gegen die Sowjetunion vorzubereiten."
GER_turkey_friend:5	"Freundschaft mit der Türkei"
GER_turkey_friend_desc:5	"Die Türkei unter Atatürk ist auf einem bewundernswerten Weg der Modernisierung, und das Land kontrolliert den Zugang zum Schwarzen Meer durch den Bosporus und die Dardanellen. Die Türkei in unsere Einflusssphäre zu holen, sollte unsere erste Priorität sein!"
GER_demand_memel:5	"Östliche Ansprüche wieder geltend machen"
GER_demand_memel_desc:5	"Im Ersten Weltkrieg verliert Deutschland mit der Wiedererstehung Polens und der Abtretung von Memel an Litauen einen Großteil seines Territoriums im Osten. Beiden Nationen wird ein Ultimatum gestellt, aber zumindest Polen wird sich wahrscheinlich nicht auf bloße Worte einlassen."
GER_demand_memel_threat:5	"Deutschland bekräftigt Ost-Ansprüche"
GER_danzig_or_war_POL_faction_GER_leader:5	"§R[This.GetName] muss dem Abkommen zustimmen, damit die Boni wirksam werden. Sie werden [Root.GetFactionName] verlassen, wenn der Krieg erklärt wird.§!\n"
GER_danzig_or_war_POL_faction_GER_noleader:5	"§R[This.GetName] muss dem Abkommen zustimmen, damit die Boni in Kraft treten können. Sie werden [Root.GetFactionName] die Fraktion verlassen, wenn der Krieg erklärt wird.§!\n"
GER_danzig_or_war_desc:5	"Danzig war deutsch, Danzig ist deutsch geblieben, und Danzig soll von nun an deutsch sein! Wenn Polen das Gebiet nicht abtritt, müssen wir das deutsche Volk auf den unvermeidlichen Krieg vorbereiten. Danzig und die umliegenden Gebiete werden zu Deutschland zurückkehren!"
GER_demand_sudetenland:5	"Rückeroberung des Sudetenlandes"
GER_demand_sudetenland_desc:5	"Das Schicksal der Sudetendeutschen war eine der größten Ungerechtigkeiten des Versailler Vertrages. Sie müssen unter unseren Schutz gestellt werden, ungeachtet aller möglichen Einwände."
GER_first_vienna_award:5	"Erster Wiener Schiedsspruch"
GER_first_vienna_award_desc:5	"Die Ungarn waren eines der Völker, die nach dem Ersten Weltkrieg am meisten gelitten haben. Nach der Zerschlagung der österreichisch-ungarischen Monarchie waren viele Ungarn auf dem Boden gestrandet, den sie seit Hunderten von Jahren als ihr Eigentum betrachtet hatten. Wir könnten unsere Beziehungen zu Ungarn erheblich verbessern, wenn wir ihnen einige Gebiete der Tschechoslowakei überlassen würden."
GER_second_vienna_award:5	"Zweiter Wiener Schiedsspruch"
GER_italy_ally_desc:5	"Die Italiener mögen unzuverlässig sein - das haben sie im Ersten Weltkrieg bewiesen -, aber Mussolini und seine faschistische Bewegung haben gezeigt, dass es für Italien noch Hoffnung gibt. Deutschland kann durch ein Bündnis mit Italien doch nur gewinnen, oder nicht?"
GER_condor_legion:5	"Legion Condor"
GER_nationalist_spain_ally_tt:5	"Verstärkt die diplomatischen Beziehungen mit dem §YNationalistischen Spanien§!"
GER_poland_friend:5	"Mit Polen befreundet"
GER_poland_friend_desc:5	"Obwohl Polen keinen Zugang mehr zum Meer hat, haben wir unsere guten Absichten bewiesen, indem wir ihm die Slowakei überlassen haben. Vielleicht können wir sie durch vage Versprechungen über künftige Gebietsgewinne im Osten noch näher an uns heranführen."
GER_war_with_france_desc:5	"Nachdem Deutschland die Frage seiner Ostgrenze vorläufig zufriedenstellend gelöst hat, ist es nun an der Zeit, unsere Aufmerksamkeit nach Westen zu richten. Der Verlust von Elsaß-Lothringen ist ein Schandfleck auf der Ehre des deutschen Volkes, den wir nur durch einen gerechten Krieg wieder gutmachen können."
GER_war_with_france_threat:5	"Ansprüche auf französisches Gebiet"
GER_naval_rearmament_2:5	"Vollständiger Schiffbauersatzplan"
GER_naval_air_effort_desc:5	"Marineflieger der Kriegsmarine"
GER_Akagi_blueprints:5	"Akagi Blaupausen"
GER_plan_z:5	"Plan Z"
GER_plan_z_desc:5	"Plan Z war der Name für die geplante Umrüstung und Erweiterung der Kriegsmarine, die Adolf Hitler Anfang 1939 in Auftrag gab. Die Flotte sollte die Seemacht des Vereinigten Königreichs herausfordern und bis 1948 fertiggestellt werden. Die Entwicklung des Plans begann 1938, aber er spiegelte die Entwicklung des strategischen Denkens des Oberkommandos der Marine in den zwei Jahrzehnten nach dem Ersten Weltkrieg wider."
GER_u_boat_effort:5	"U-Boot-Einsatz"
GER_trade_interdiction_desc:5	"Unsere Werften produzieren fleißig U-Boote, aber wir müssen bessere Methoden entwickeln, um diese "Wolfsrudel" zu nutzen. Geben Sie den Admirälen alles, was sie für ihre Simulationen und Kriegsspiele brauchen..."
GER_submarine_pens:5	"U-Boot-Stifte"
GER_denmark_friend:5	"Freundschaft mit Dänemark"
GER_denmark_friend_desc:5	"Die Kanonenbootdiplomatie ist noch nicht tot. Unserem kleinen nördlichen Nachbarn sind unsere Pläne zum Ausbau der Flotte wohl bekannt. In Kombination mit ihrer Furcht vor unseren weit überlegenen Armeen sollte es ein Leichtes sein, sie in unsere Einflusssphäre einzuschüchtern."
GER_dutch_friend:5	"Freundschaft mit den Niederlanden"
GER_sweden_friend_desc:5	"Die skandinavischen Länder sind wie Dominosteine; sie stehen und fallen zusammen. Wenn Norwegen und Dänemark in unserer Sphäre sind, wird Schweden sicher folgen."
GER_improve_national_spirit:5	"Eine wiedergeborene Nation"
GER_improve_national_spirit_tooltip:5	"Wir oder unsere Fraktionsmitglieder müssen London und Paris und die Staaten, in denen sie liegen, kontrollieren."
needs_approval:5	"§R[This.GetName] muss dem Abkommen zustimmen, damit die Boni wirksam werden.§!"
GER_balkan_dominance:5	"Vorherrschaft auf dem Balkan"
GER_BUL_roads_desc:0	"Bulgarien leidet derzeit unter einem Mangel an brauchbaren Schienen- und Straßennetzen. Mit Hilfe unserer Ingenieure können wir die Versorgung der dort stationierten Truppen sicherstellen."
GER_first_ljubljana_award:5	"Jugoslawien aufspalten"
GER_first_ljubljana_award_desc:5	"Die heuchlerischen Westmächte haben nationale Selbstbestimmung gepredigt und gleichzeitig viele Minderheiten der Herrschaft der Serben ausgeliefert. Wir sind in der Lage, dieses historische Unrecht zu korrigieren und uns gleichzeitig Freunde zu machen. Gegenüber denjenigen, die sich in der europäischen Ordnung auf unsere Seite stellen wollen, können wir sehr großzügig sein."
GER_fate_of_yugoslavia_desc:5	"Der jugoslawische Staat war immer ein künstliches Konstrukt, und die zentrale Autorität hat begonnen, zu zerfallen. Wir müssen eingreifen, um die Ordnung wiederherzustellen. Die einzige Frage, die sich uns stellt, ist, wie wir dies am besten tun können."
GER_second_ljubljana_award:5	"Zweiter Ljubljana-Preis"
GER_war_with_greece:5	"Krieg mit Griechenland"
GER_fate_of_greece_desc:5	"Griechenland hat bewiesen, dass es mit den neuen Kräften, die auf Europa losgelassen wurden, nicht fertig wird. Es ist an der Zeit, ihm den Schutz zu bieten, den nur Deutschland bieten kann."
GER_weserubung:5	"Unternehmen Weserübung"
GER_around_maginot:5	"Rund um Maginot"
GER_around_maginot_desc:5	"Wenn wir uns einen taktischen Vorteil gegen Frankreich sichern wollen, müssen wir in der Lage sein, sie von allen Seiten zu treffen. Sie werden nicht mit einem Angriff aus dem Norden rechnen, und genau von dort werden wir sie angreifen, sobald wir einige Hindernisse aus dem Weg geräumt haben."
GER_alone_or_peace_faction_tt:5	"ist nicht in einer Fraktion oder befindet sich in einer Fraktion im Frieden mit [GER.GetNameDef]."
GER_alsace_lorraine_threat:5	"Deutschland erhebt erneut Anspruch auf Elsass-Lothringen"
GER_army_innovation:5	"Ausweitung der Wehrmacht"
GER_army_innovation_2:5	"Ausbau der Wehrmacht"
GER_army_innovation_2_desc:5	"Die in unseren Einrichtungen in der UdSSR gewonnenen Erkenntnisse werden es uns ermöglichen, unsere Doktrinen und unsere Ausrüstung weiter zu verbessern. Doch dieses Mal werden wir die Fortschritte für uns behalten!"
GER_artillery_expansion:5	"Divisionsartillerie"
GER_artillery_medium_focus_desc:5	"Der Vertrag von Versailles wollte die deutsche Feldartillerie auf insgesamt 284 Stück beschränken, aber diese lächerliche Beschränkung ist heute kein Hindernis mehr für das Reich. Ein starkes Deutschland braucht ein starkes Heer, und ein starkes Heer braucht starke Geschütze!"
GER_artillery_heavy_focus:5	"Schwere Artilleriekorps"
GER_infanterie_tactics:5	"Infanterietaktik"
GER_infanterie_tactics_desc:5	"Die Taktik der Infanterie hat sich seit dem Ersten Weltkrieg stark weiterentwickelt. Wenn wir die jüngsten Fortschritte im militärischen Denken des Generalstabs auf reale Erfahrungen anwenden, könnte das Rückgrat der Wehrmacht unerschütterlicher werden als je zuvor."
GER_Heavy_panzer:5	"Schwere Panzer (Pz VI 'Tiger' Ausf.E)"
GER_Heavy_panzer_2_desc:5	""
GER_panther:5	"Mittlerer Panzer (Pz V 'Panther')"
GER_Panzer_mkIII:5	"Mittlere Panzer (Pz III Ausf.E)"
GER_Panzer_mkIII_desc:5	"Die Pz II haben sich als zu dünnhäutig erwiesen, um ihre Aufgabe als Panzer zu erfüllen, aber nicht wendig genug, um die Kavallerie vollständig zu ersetzen. Die nächste Generation von Panzern muss eine stärkere Panzerung und eine leistungsfähigere Bewaffnung haben, auch wenn dies auf Kosten der Geschwindigkeit geht."
GER_Panzer_mkIII2:5	"Mittlere Panzer (Pz III Ausf.J)"
GER_Panzer_mkIV2_desc:5	"Forschung und Entwicklung der nächsten Generation von mittleren Pz IV-Panzern"
GER_Panzer_mkIII3:5	"Mittlere Panzer (Pz III Ausf.M)"
GER_Panzer_mkIV3:5	"Mittlere Panzer (Pz IV Ausf.H)"
GER_Panzer_mkIV3_desc:5	"Forschung und Entwicklung der nächsten Generation von mittleren Panzern Pz IV"
GER_Lt_TD:5	"Leichte Fahrgestelle Unterstützungspanzer"
GER_Med_TD_desc:5	""
GER_Hv_TD:5	"Schwere Fahrgestelle Unterstützungspanzer"
GER_unlock_doctrine_research_tt:5	"£tech_mod §CForschungsbereich§! für §CLanddoktrin§!, §CLuftwaffendoktrin§! und §CMarinedoktrin§! freischalten, nachdem §YWehrmacht Kommando (OKH)§!, §YLuftwaffe Kommando (OKL)§! und §YKriegsmarine Kommando (OKM)§! fertiggestellt sind."
GER_Wehrmacht:5	"Oberkommando des Heeres (OKH)"
GER_Grossdeutschland_desc:5	"In den Monaten vor dem Zweiten Weltkrieg marschierten die Männer des Wach-Regiments Berlin jeden Sonntag die Straße Unter den Linden auf und ab, während der Rest des Wehrmachtsheeres ins Saarland, nach Österreich und in die Tschechoslowakei marschierte. Doch lange sollten sie nicht an der Front bleiben. In der ersten Woche des Jahres 1939 befahl Hitler, das Wach-Regiment in Infanterie-Regiment Großdeutschland umzubenennen. Die Einheit war nun ein ständiger Kader, und im Gegensatz zu anderen Regimentern des deutschen Heeres (die aus einer Region aufgestellt wurden) sollten die Rekruten des Regiments Großdeutschland aus dem ganzen Land stammen. Die Einheit wurde am 14. Juni 1939 offiziell aktiviert, und der Anlass wurde mit einer Parade durch die Straßen der Hauptstadt begangen. Das Regiment wurde im September 1939 reorganisiert und nahm nicht am "Fall Weiss" (dem Überfall auf Polen) teil, was den Stolz des Regiments, das den Namen der Nation auf dem Ärmel trug, etwas trübte. Im Mai 1940 wurde das Regiment jedoch der Panzergruppe Kleist von Generalfeldmarschall Ewald von Kleist unterstellt und nahm ab dem Beginn des Falles Gelb, dem Einmarsch in den Westen, am 10. Mai 1940 an den Kämpfen teil."
GER_afrika_korps:5	"Das Afrika Korps aufstellen"
GER_afrika_korps_desc:5	"Die Italiener sind in Afrika auf verlorenem Posten. Wir müssen ihnen in Afrika helfen."
GER_devils_gardens_desc:5	"Bei diesem Nachschub ist die beste Offensive die Verteidigung."
GER_feldmarshall:5	"Rommel fördern"
GER_german_slovak_treaty_desc:5	"Schutzzone in der Slovakei"
GER_norwegian_airbases:5	"Aufbau der norwegischen Luftwaffenstützpunkte"
GER_norwegian_airbases_desc:5	"Aufbau norwegischer Luftwaffenstützpunkte"
GER_pressure_sweden_desc:5	"Druck auf Schweden"
GER_defend_ploiesti_oil:5	"Sicherung der rumänischen Ölversorgung"
GER_unlock_rk_ukraine_desc:5	"Reichskommissariat Ukraine"
GER_unlock_ostland:5	"Reichskommissariat Ostland"
GER_unlock_ostland_desc:5	"Reichskommissariat Ostland"
GER_cans_desc:5	"Erstmals entwickelt vom Ingenieurbüro Müller in Schwelm nach einem Entwurf ihres Chefingenieurs Vinzenz Grünvogel. Die Wehrmacht hatte u.a. vorgeschrieben, dass ein Soldat entweder zwei volle oder vier leere Behälter tragen können sollte, weshalb die dreifachen Griffe angebracht wurden. Um die geforderte Füll- und Entleerungsgeschwindigkeit zu erreichen, wurde er mit einem großen Ausguss und einem Klappverschluss ausgestattet. Ein Loch in der Verschlusshalterung ermöglichte die Anbringung eines Sicherungsstifts oder eines Drahtes mit Plombe. Die rechteckige Form machte sie stapelbar. Die vertiefte Schweißnaht steifte den Behälter aus und schützte die Naht vor Schlagschäden. Die Vertiefungen sorgten dafür, dass eine volle Dose bei einem Sturz von einem Fahrzeug nicht schwer beschädigt wurde, und eine Tauchlackierung auf der Innenseite schützte sie vor Korrosion."
GER_ostruppen:5	"Osttruppen"
GER_Schutzstaffel_focus_desc:5	"Die Schutzstaffel oder "SS" ist eine paramilitärische Gruppe, die direkt im Dienste Adolf Hitlers und der NSDAP steht. Was als einfaches Sicherheitskommando für NSDAP-Versammlungen begann, entwickelte sich unter der Führung von Heinrich Himmler zu einer mächtigen und gefürchteten Organisation."
GER_VT_Division:5	"SS-Verfügungsdivision"
GER_VT_Division_desc:5	""
GER_Schutzstaffel_divisions_II:5	"SS-Polizei-Division"
GER_Schutzstaffel_divisions_III:5	"SS-Division Das Reich (mot.)"
GER_Schutzstaffel_divisions_desc:5	""
GER_Schutzstaffel_divisions_IV_desc:5	""
GER_Schutzstaffel_divisions_V_desc:5	""
GER_Schutzstaffel_Expansion_desc:5	""
GER_hitler_youth_law:5	"Hitlerjugend"
GER_hitler_youth_war_duties_desc:5	"Am 1. Mai 1940 wurde Artur Axmann zum Stellvertreter von Schirach ernannt, dem er am 8. August 1940 als Reichsjugendführer der Hitlerjugend folgte. Axmann begann, die Gruppe zu einer Hilfstruppe umzugestalten, die Kriegsaufgaben übernehmen konnte. Die Hitlerjugend engagierte sich in den deutschen Feuerwehren und half beim Wiederaufbau der von den alliierten Bombenangriffen betroffenen deutschen Städte. Die Hitlerjugend half auch in Organisationen wie der Reichspost, der Reichsbahn und anderen Regierungsstellen, Mitglieder der HJ unterstützten auch das Heer und dienten in der Flugabwehr."
GER_Schutzstaffel_junkerschulen:5	"£tech_mod SS-Junkerschule Bad Tölz"
GER_Schutzstaffel_junkerschulen_desc:5	"Um die SS-Angehörigen zu professionalisieren, wurde 1934 in Bad Tölz in Bayern und 1935 in Braunschweig die erste Führungsschule eingerichtet. Die erste Schule stand unter dem Kommando von SS-Standartenführer Paul Lettow, die zweite Schule unter dem Kommando von SS-Oberführer Paul Hausser. Im Jahr 1937 wurden die Schulen zu Ehren des preußischen Adels in Junkerschulen umbenannt. Der Hauptzweck der Schulen bestand darin, den deutschen Streitkräften eine angemessene nationalsozialistische Weltanschauung und Einstellung zu vermitteln."
GER_Schutzstaffel_junkerschule_klagenfurt_desc:5	"Mit der Expansion der Waffen-SS wurde es Zeit, weitere Junkerschulen für die Ausbildung der Mitglieder zu gründen. Weitere Schulen wurden 1943 in Klagenfurt und Posen-Treskau und 1944 in Prag gegründet."
GER_Schutzstaffel_foreign_units:5	"Rekrutierung ausländischer SS-Einheiten"
GER_ahistorical_Schutzstaffel_desc:5	""
GER_Das_Reich_division:5	"Das Reich - 1940"
GER_Das_Reich_division_desc:5	"Die 2. SS-Panzerdivision "Das Reich" war eine von 38 Divisionen der Waffen-SS des nationalsozialistischen Deutschlands während des Zweiten Weltkriegs. Das Reich diente während des Einmarsches in Frankreich und nahm an mehreren großen Schlachten an der Ostfront teil, unter anderem in der Schlacht von Prochorowka gegen die 5. Panzerarmee in der Schlacht von Kursk. Anschließend wurde sie in den Westen verlegt und nahm an den Kämpfen in der Normandie und der Ardennenoffensive teil, die den Krieg in Ungarn und Österreich beendete. Das Reich verübte die Massaker von Oradour-sur-Glane und Tulle."
GER_Wiking_division_desc:5	"Die 5. SS-Panzerdivision Wiking war eine Elite-Panzerdivision unter den achtunddreißig Waffen-SS-Divisionen des nationalsozialistischen Deutschlands. Sie wurde aus ausländischen Freiwilligen in Dänemark, Norwegen, Schweden, Finnland, Estland, den Niederlanden und Belgien rekrutiert und stand unter dem Kommando von deutschen Offizieren. Während des Zweiten Weltkriegs war die Division an der Ostfront im Einsatz. Sie kapitulierte im Mai 1945 vor den amerikanischen Streitkräften in Österreich."
GER_Totenkopf_division:5	"Totenkopf-1941"
GER_SS_Kavallerie_brigade_desc:5	""
GER_2_ss_infantry_brigade:5	"2.SS-Infanterie-Brigade(mot.)"
GER_2_ss_infantry_brigade_desc:5	"Die 2. SS-Infanterie-Brigade (mot.) wurde am 15. Mai 1941 unter dem Kommando von Karl Fischer von Treuenfeld mit dem 4. und 5. SS-Infanterie-Regiment (ehemals Totenkopf-Regiment) aufgestellt und begann im September ihren Einsatz im rückwärtigen Bereich der Heeresgruppe Nord, unter dessen Kommando sie ihr gesamtes Bestehen verbringen sollte. Nach und nach werden auch die SS-Auslandslegionen in den Einsatz einbezogen. Nach dem Abzug der Legionen aus dem Westen zur Aufrüstung begann sie mit lettischen Freiwilligenverbänden zu operieren und wurde schließlich am 18. Mai 1943 zur 2. lettischen SS-Infanterie-Brigade umbenannt und im Januar 1944 als Kader bei der Aufstellung der Waffen-Grenadier-Division der SS (2. lettische) eingesetzt."
GER_SS_Brigade_Schuldt_desc:5	"Die SS-Brigade Schuldt war eine Formation der Waffen-SS während des Zweiten Weltkriegs. Sie wurde nach ihrem Kommandeur Brigadeführer Hinrich Schuldt benannt. Sie diente an der Ostfront und setzte sich aus Einheiten der Leibstandarte SS Adolf Hitler, Das Reich, Polizei-Divisionen und einer Abteilung der Luftwaffe zusammen."
GER_ss_geb_prinz_eugen:0	"SS Fre.Geb.-Div. 'Prinz Eugen'"
GER_SS_Serbis:5	"Frei-korps der SS 'Serbis'"
GER_SS_RONA_desc:5	"29. Waffen-SS-Grenadier-Division 'RONA' (1. Russische) (auch bekannt als Waffen-Sturm-Brigade der SS RONA und Kaminski-Brigade) war eine kollaborierende Formation, die sich aus sowjetischen Staatsangehörigen aus dem Gebiet der Lokot-Autonomie in den von der Achse besetzten Gebieten der RSFSR in der Sowjetunion während des Deutsch-Sowjetischen Krieges von 1941 bis 1945 zusammensetzte. Sie wurde Ende 1941 als Hilfspolizei mit 200 Mitarbeitern gegründet. Bis Mitte 1943 war sie auf 10.000-12.000 Mann angewachsen, ausgerüstet mit erbeuteten sowjetischen Panzern und Artillerie. Bronislaw Kaminski, der Anführer der Einheit, nannte sie Russische Nationale Befreiungsarmee (russisch "Русская освободительная народная армия (РОНА)", umgangssprachlich "Russkaya Osvoboditelnaya Narodnaya Armiya", (RONA))."
