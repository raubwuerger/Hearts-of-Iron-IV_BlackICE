ENG_eden_malbran_desc:	"Das Roca-Runciman-Abkommen besteht seit 1933 und sichert den Zugang zu Rindfleischexporten mit den [ARG.GetName]. Angesichts der jüngsten Entwicklungen in unserer Wirtschaft könnte es jedoch an der Zeit sein, einen neuen Vertrag mit den [ARG.GetAdjective] auszuhandeln und uns ein noch besseres Handelsabkommen zu verschaffen."
