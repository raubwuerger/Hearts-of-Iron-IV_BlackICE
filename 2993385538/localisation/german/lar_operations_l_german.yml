lar_operative_event.15.desc:	"[This.GetName], ein Agent von [From.GetNameDef], stand heute kurz davor, einen unserer Geheimdienstinformanten in deren Streitkräften zu enttarnen. Unser Informant ergriff umgehend alle notwendigen Vorsichtsmaßnahmen, um sie abzuschütteln."
lar_operative_event.16.t:	"[From.GetAdjective] Ziviler Informant aufgedeckt!"
lar_operative_event.16.desc:	"Heute hat [This.GetName], der mit der Spionageabwehr gegen ausländische Bedrohungen beauftragt ist, erfolgreich einen [From.GetAdjective] Geheimdienstinformanten ausgeschaltet, der innerhalb unserer Wirtschaft operierte."
