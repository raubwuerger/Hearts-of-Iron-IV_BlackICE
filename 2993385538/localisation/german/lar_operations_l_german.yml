heavy_water_exfiltration_outcome_fail:0	"Deutsche Quellen haben die Gefangennahme des Teams der Operation Gunnerside bekannt gegeben. Es scheint, dass das Team bei seiner Flucht aus der Anlage in Schwierigkeiten geraten ist."
bruneval_infiltration_outcome:0	"Die Angriffseinheit ist erfolgreich gelandet, wobei Minen aus dem Paradrop verstreut wurden."
bruneval_attack_outcome:0	"Die Fallschirmjäger bewegten sich auf das Ziel zu und zerstörten die schwache Garnison in einem kurzen, aber heftigen Feuergefecht."
bruneval_exfiltration_outcome:0	"Die Truppe schiffte sich auf Landungsboote ein, um zurück zu unseren Linien zu gelangen, und nahm einen feindlichen Radartechniker zum Verhör mit."
bruneval_exfiltration_outcome_fail:0	"Nach der Evakuierung nach Großbritannien wurde festgestellt, dass unser Agent nicht unter den am Strand geborgenen Personen war. Es ist unklar, wann genau der Kontakt verloren ging, aber wir müssen vom Schlimmsten ausgehen."
capture_tito_attack_outcome:0	"Weitere Informationen über den Ausgang der Operation finden Sie im beigefügten Bericht."
organise_cells_outcome:0	"Mehrere revolutionäre Zellen wurden organisiert und haben begonnen, im Rücken des Feindes zu operieren."
infiltrate_civil_service_outcome:0	"Wir haben eine Reihe von zuverlässigen Personen in Machtpositionen gebracht, die es ihnen ermöglichen, die Verwaltung der befreiten Gebiete schnell zu übernehmen."
workers_militia_outcome:0	"Mehrere Bataillone der Arbeitermiliz stehen bereit, um wichtige Einrichtungen zu bewachen."
organize_strikes_outcome:0	"Unser Agent hat Gewerkschafter und Arbeiter erfolgreich davon überzeugt, einen großen Streik zu beginnen."
preposition_units_outcome:0	"Unsere Anlagen im Land wurden so platziert, dass sie bei Beginn des Aufstandes kritische Infrastrukturen einnehmen."
launch_coup_exfiltration_outcome:0	"Nach Erhalt des Startsignals hat unser Agent mehrere Einheiten angeführt, um die ihnen zugewiesenen Ziele einzunehmen. Die Rebellen haben erfolgreich einen Teil des Landes unter ihre Kontrolle gebracht."
launch_coup_exfiltration_outcome_fail:0	"In den Wirren des Aufstandes haben wir den Kontakt zu unserem Agenten verloren. Wir werden vielleicht nie herausfinden, was passiert ist."
free_agency_upgrade_tt:0	"Gewinnen Sie eine zufällige §YSpionageabteilungsverbesserung§!"

operation_warsaw_uprising_desc:0	"Die tapferen Widerstandskämpfer Polens sehnen sich danach, Warschau, unser Land, von unseren Feinden zu befreien. Wir müssen ihnen nur das Signal geben und Polen wird wieder leben!"

raid_trotskys_villa:0	"Stürmen Sie Trotzkis Villa"


raid_trotskys_villa_attack:0	"Stürmen Sie die Villa"
raid_trotskys_villa_attack_desc:0	"Eine kleine Gruppe unter der Führung eines NKVD-Offiziers wird in die Villa eindringen, alle Wachen überwältigen, Trotzki finden und ihn wegen Verbrechen gegen den Staat hinrichten."


murder_trotsky_desc:0	"Ein direkter Angriff ist unwahrscheinlich. Wir sollten subtilere Mittel einsetzen, um an Trotzki heranzukommen und ihn dann niederzuschlagen, während er uns den Rücken zuwendet."
murder_trotsky_outcome_tt:0	"Wir werden versuchen, Trotzki mit Hilfe eines Agenten zu ermorden, den wir in seinem Umfeld platziert haben."


murder_trotsky_infiltration_outcome:0	"Unser Agent hat sich erfolgreich das Vertrauen von Trotzki und seinen Wachen erschlichen, indem er den Zugang zu seinem gefälschten Pass genutzt hat."
murder_trotsky_attack:0	"Attentat"


murder_trotsky_exfiltration:0	"Flucht"
murder_trotsky_exfiltration_desc:0	"Unser Agent wird versuchen, die Verwirrung und das Chaos zu nutzen, um zu fliehen und sich einem Verhör zu entziehen."


nuclear_espionage:0	"Atomwaffenprogramm infiltrieren"
nuclear_espionage_desc:0	"Unser Atomwaffenprogramm ist anderen Ländern hinterher. Wir sollten eine Operation planen, um ausländische Atomwaffenprogramme zu infiltrieren und an wichtige Blaupausen und Daten zu gelangen."


sabotage_burn_fuel_storage:0	"Brennstoff-Silo verbrennen"
sabotage_burn_fuel_storage_desc:0	"Unsere Agenten haben Lagereinheiten entdeckt, die hochentzündliche Verbindungen enthalten. Im Schutze der Nacht werden unsere Agenten das Lager in Brand setzen und sich dann in dem anschließenden Durcheinander zurückziehen."



sabotage_fuel_explosives_outcome:0	"Das Team platzierte den Sprengstoff erfolgreich und brachte die Anlage zum Einsturz. Es wurden umfangreiche Schäden an den Treibstoffsilos gemeldet, wobei eine Menge Treibstoff vernichtet wurde."
sabotage_burn_oil_refinery:0	"Brennstoffraffinerie verbrennen"
sabotage_burn_oil_refinery_desc:0	"Unsere Agenten haben Lagereinheiten entdeckt, die hochentzündliche Verbindungen enthalten. Im Schutze der Nacht setzen unsere Agenten das Lager in Brand und ziehen sich dann in dem darauf folgenden Durcheinander zurück."



sabotage_oil_explosives_outcome:0	"Das Team platzierte den Sprengstoff erfolgreich und brachte die Anlage zum Einsturz. Die Ölraffinerie wurde erheblich beschädigt, die Produktion kam vollständig zum Stillstand."
sabotage_burn_radar:0	"Radar verbrennen"
sabotage_burn_radar_desc:0	"Unsere Agenten haben Elektronik entdeckt, die durch einfache Brandstiftung stark beschädigt werden kann. Im Schutze der Nacht schleichen sie sich zur Radarstation und zünden sie an."



sabotage_radar_explosives_outcome:0	"Das Team hat den Sprengstoff erfolgreich platziert und die Anlage zum Einsturz gebracht. Es wurden erhebliche Schäden an der Radarstation gemeldet. Der Feind ist nun völlig blind in der Luft!"
sabotage_burn_port:0	"Hafen verbrennen"
sabotage_burn_port_desc:0	"Unsere Agenten haben ein großes Konvoischiff entdeckt, das derzeit im Hafen angedockt ist. Sie werden sich an Bord schleichen, ein Feuer legen und so den gesamten Hafen für andere Schiffe mit den entstehenden Trümmern blockieren."



sabotage_port_explosives_outcome:0	"Das Team platziert den Sprengstoff erfolgreich und bringt die Anlage zum Einsturz. Es wurden umfangreiche Schäden an der Marinebasis gemeldet. Feindliche Schiffe werden Schwierigkeiten beim Andocken haben."
target_leader_suitcase_bomb:	"Aktenkoffer-Bombe"
target_leader_suitcase_bomb_desc:	"Unsere Agenten infiltrieren das feindliche Armeehauptquartier und schmuggeln eine Bombe in einer Aktentasche mit sich. Sie platzieren sie im Besprechungsraum und zünden sie, wenn die Offiziere ihre Besprechung beginnen."



target_leader_ambush_outcome:	"Durch die Blockade der Straße mit einem Lastwagen gelingt es unseren Agenten, den feindlichen Konvoi anzugreifen. Der General wurde verwundet und kam nur knapp mit dem Leben davon. Unsere Agenten mussten sich zurückziehen, bevor die feindliche Verstärkung eintraf."
target_leader_sabotage_vehicle:	"Fahrzeug sabotieren"
target_leader_sabotage_vehicle_desc:	"Unsere Agenten werden das persönliche Fahrzeug des feindlichen Anführers sabotieren und ein paar Schrauben entfernen. Dann erledigen Zeit und Geschwindigkeit den Rest."



target_attache_suitcase_bomb_outcome:	"Unsere Agenten haben das Hauptquartier der Armee erfolgreich infiltriert und die Aktentasche platziert. Die Bombe wurde mit Hilfe eines zeitgesteuerten Sprengstoffs gezündet, als die Offiziere mit ihrer Besprechung begannen."
target_attache_ambush:	"Überfall auf der Straße"
target_attache_ambush_desc:	"In Zusammenarbeit mit unserem lokalen Netzwerk erhalten unsere Agenten Informationen über die genauen Routen, die der Feind nehmen wird. Sie legen einen Hinterhalt auf der Straße und feuern auf den Attache und seine Eskorte."



target_attache_sabotage_vehicle_outcome:	"Unsere Agenten haben das persönliche Fahrzeug des feindlichen Attachés erfolgreich sabotiert. Dem Funkverkehr zufolge kam es kurz darauf zu einem Unfall, bei dem der Attache verwundet wurde."
compliance_drop_leaflets:	"Flugblätter abwerfen"
compliance_drop_leaflets_desc:	"Unsere Agenten werden Flugblätter über die wahre Lage an den Fronten an die Zivilbevölkerung verteilen und sie über die Gräueltaten der Besatzungstruppen informieren."



compliance_uncover_propaganda_outcome:	"Unsere Agenten haben erfolgreich Radios an die Bevölkerung verteilt und werden sie häufig über den wahren Stand des Krieges informieren."
