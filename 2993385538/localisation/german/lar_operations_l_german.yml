OUTCOME_GOOD:0	"§GGOOD§!"
OUTCOME_VGOOD:0	"§GEXCELLENT§!"
enemy_has_equal_or_better_radar_tech_trigger_tt:0	"Der Feind verfügt über eine gleichwertige oder bessere Radartechnologie."
OPERATION_BONUS_REWARD:0	"Die Operation war ein großer Erfolg und brachte §Gbonus-Belohnungen§!!"
intelligency_agency_resistance_boost_tt:0	"Geheimdienstliche Operationen: $VALUE|=-%0$"
targeted_sabotage_resources_2_tt:0	"Der lokale Widerstand in [From.From.GetName] wird seine Bemühungen verstärkt auf die Sabotage der lokalen Ressourcengewinnung konzentrieren."
targeted_sabotage_resources_3_tt:0	"Der lokale Widerstand in [From.From.GetName] wird große Anstrengungen unternehmen, um die lokale Rohstoffgewinnung zu sabotieren."
targeted_sabotage_industry_2_tt:0	"Der lokale Widerstand in [From.From.GetName] wird sich mehr auf die Sabotage lokaler Fabriken konzentrieren."
targeted_sabotage_industry_3_tt:0	"Der lokale Widerstand in [From.From.GetName] wird große Anstrengungen unternehmen, um die lokalen Fabriken zu sabotieren."
targeted_sabotage_infrastructure_2_tt:0	"Der lokale Widerstand in [From.From.GetName] wird sich mehr auf die Sabotage der lokalen Infrastruktur konzentrieren."
targeted_sabotage_infrastructure_3_tt:0	"Der lokale Widerstand in [From.From.GetName] wird große Anstrengungen unternehmen, um die lokale Infrastruktur zu sabotieren."
GER_heavy_water_production_underway:0	"Produktion von schwerem Wasser im Gange"
heavy_water_infiltration_outcome:0	"Das Team ist erfolgreich mit dem Fallschirm in dem Gebiet abgesprungen."
heavy_water_attack_outcome:0	"Das Team ist erfolgreich in die Anlage eingedrungen und hat alle Wachen umgangen. Weniger als eine Stunde später zerstörte eine große Explosion die Anlage."
heavy_water_exfiltration_outcome:0	"Wir haben seit dem Überfall nichts mehr von dem Team gehört, aber das ist zu erwarten."
heavy_water_exfiltration_outcome_fail:0	"Deutsche Quellen haben die Gefangennahme des Teams der Operation Gunnerside bekannt gegeben. Es scheint, dass das Team bei seiner Flucht aus der Anlage in Schwierigkeiten geraten ist."
bruneval_infiltration_outcome:0	"Die Angriffseinheit ist erfolgreich gelandet, wobei Minen aus dem Paradrop verstreut wurden."
bruneval_attack_outcome:0	"Die Fallschirmjäger bewegten sich auf das Ziel zu und zerstörten die schwache Garnison in einem kurzen, aber heftigen Feuergefecht."
bruneval_exfiltration_outcome:0	"Die Truppe schiffte sich auf Landungsboote ein, um zurück zu unseren Linien zu gelangen, und nahm einen feindlichen Radartechniker zum Verhör mit."
bruneval_exfiltration_outcome_fail:0	"Nach der Evakuierung nach Großbritannien wurde festgestellt, dass unser Agent nicht unter den am Strand geborgenen Personen war. Es ist unklar, wann genau der Kontakt verloren ging, aber wir müssen vom Schlimmsten ausgehen."
capture_tito_attack_outcome:0	"Weitere Informationen über den Ausgang der Operation finden Sie im beigefügten Bericht."
organise_cells_outcome:0	"Mehrere revolutionäre Zellen wurden organisiert und haben begonnen, im Rücken des Feindes zu operieren."
infiltrate_civil_service_outcome:0	"Wir haben eine Reihe von zuverlässigen Personen in Machtpositionen gebracht, die es ihnen ermöglichen, die Verwaltung der befreiten Gebiete schnell zu übernehmen."
workers_militia_outcome:0	"Mehrere Bataillone der Arbeitermiliz stehen bereit, um wichtige Einrichtungen zu bewachen."
organize_strikes_outcome:0	"Unser Agent hat Gewerkschafter und Arbeiter erfolgreich davon überzeugt, einen großen Streik zu beginnen."
preposition_units_outcome:0	"Unsere Anlagen im Land wurden so platziert, dass sie bei Beginn des Aufstandes kritische Infrastrukturen einnehmen."
launch_coup_exfiltration_outcome:0	"Nach Erhalt des Startsignals hat unser Agent mehrere Einheiten angeführt, um die ihnen zugewiesenen Ziele einzunehmen. Die Rebellen haben erfolgreich einen Teil des Landes unter ihre Kontrolle gebracht."
launch_coup_exfiltration_outcome_fail:0	"In den Wirren des Aufstandes haben wir den Kontakt zu unserem Agenten verloren. Wir werden vielleicht nie herausfinden, was passiert ist."
free_agency_upgrade_tt:0	"Gewinnen Sie eine zufällige §YSpionageabteilungsverbesserung§!"
operation_warsaw_uprising:0	"Der Warschauer Aufstand"
operation_warsaw_uprising_desc:0	"Die tapferen Widerstandskämpfer Polens sehnen sich danach, Warschau, unser Land, von unseren Feinden zu befreien. Wir müssen ihnen nur das Signal geben und Polen wird wieder leben!"
warsaw_uprising_operation_tt:0	"Lösen Sie einen Volksaufstand in Polen aus und schaffen Sie neue Einheiten in den Staaten."
raid_trotskys_villa:0	"Stürmen Sie Trotzkis Villa"
raid_trotskys_villa_desc:0	"Trotzki hat sich in seiner Villa verschanzt und mit anderen Parteimitgliedern korrespondiert, um ein Komplott gegen den Sowjetstaat zu schmieden. Wir können ein kleines Team losschicken, um sein Haus anzugreifen und dem ein Ende zu setzen."
raid_trotskys_villa_outcome_tt:0	"Eine kleine Gruppe von Attentätern wird zu Trotzkis Villa geschickt, um zu versuchen, ihn zu töten."
raid_trotskys_villa_attack:0	"Stürmen Sie die Villa"
raid_trotskys_villa_attack_desc:0	"Eine kleine Gruppe unter der Führung eines NKVD-Offiziers wird in die Villa eindringen, alle Wachen überwältigen, Trotzki finden und ihn wegen Verbrechen gegen den Staat hinrichten."
raid_trotskys_villa_attack_outcome:0	"Das Team verschafft sich Zugang zur Villa und liefert sich ein Feuergefecht mit Trotzkis Wachen."
murder_trotsky:0	"Subtiles Attentat"
murder_trotsky_desc:0	"Ein direkter Angriff ist unwahrscheinlich. Wir sollten subtilere Mittel einsetzen, um an Trotzki heranzukommen und ihn dann niederzuschlagen, während er uns den Rücken zuwendet."
murder_trotsky_outcome_tt:0	"Wir werden versuchen, Trotzki mit Hilfe eines Agenten zu ermorden, den wir in seinem Umfeld platziert haben."
murder_trotsky_infiltration:0	"Gefälschte Dokumente"
murder_trotsky_infiltration_desc:0	"Mit einem gefälschten kanadischen Pass wird unser Agent zu Trotzkis Aufenthaltsort reisen und sich mit seinen Wachen anfreunden."
murder_trotsky_infiltration_outcome:0	"Unser Agent hat sich erfolgreich das Vertrauen von Trotzki und seinen Wachen erschlichen, indem er den Zugang zu seinem gefälschten Pass genutzt hat."
murder_trotsky_attack:0	"Attentat"
murder_trotsky_attack_desc:0	"Unser Agent wird Trotzki von seinen Wachen isolieren, indem er ihm einen Artikel zeigt, den er unter vier Augen besprechen möchte. Sobald er allein ist, wird er Trotzki mit einem Eispickel ermorden."
murder_trotsky_attack_outcome:0	"Der Agent schaffte es, Trotzki allein zu erwischen und versetzte ihm einen schweren Schlag mit einem Eispickel. Trotzki wurde dadurch nicht sofort getötet, sondern starb später im Krankenhaus."
murder_trotsky_exfiltration:0	"Flucht"
murder_trotsky_exfiltration_desc:0	"Unser Agent wird versuchen, die Verwirrung und das Chaos zu nutzen, um zu fliehen und sich einem Verhör zu entziehen."
murder_trotsky_exfiltration_outcome:0	"In der Verwirrung nach dem Angriff gelang es unserem Agenten, zu entkommen, ohne dass jemand sein Gesicht sehen konnte."
murder_trotsky_exfiltration_outcome_fail:0	"Unser Agent wurde von Trotzkis Wachmannschaft festgenommen und den Behörden übergeben. Er wurde wegen Mordes angeklagt."
nuclear_espionage:0	"Atomwaffenprogramm infiltrieren"
nuclear_espionage_desc:0	"Unser Atomwaffenprogramm ist anderen Ländern hinterher. Wir sollten eine Operation planen, um ausländische Atomwaffenprogramme zu infiltrieren und an wichtige Blaupausen und Daten zu gelangen."
nuclear_espionage_outcome_tt:0	"Wir werden einen Agenten in das [FROM.GetAdjective] Atomforschungsprogramm einschleusen, der versuchen wird, technische Unterlagen weiterzugeben, die für unser eigenes Atomprojekt verwendet werden können."
SWI_boost_resistance_buff:0	"\nDie Operation §YStrengthen Resistance§! wird deutlich effektiver."
sabotage_burn_fuel_storage:0	"Brennstoff-Silo verbrennen"
sabotage_burn_fuel_storage_desc:0	"Unsere Agenten haben Lagereinheiten entdeckt, die hochentzündliche Verbindungen enthalten. Im Schutze der Nacht werden unsere Agenten das Lager in Brand setzen und sich dann in dem anschließenden Durcheinander zurückziehen."
sabotage_burn_fuel_storage_outcome:0	"Das Team hat die örtlichen Treibstoffsilos erfolgreich in Brand gesetzt und dabei Hunderte von Tonnen gelagerten Treibstoffs zerstört und die Fähigkeit, einen Vorrat zu halten, stark beeinträchtigt."
sabotage_fuel_explosives:0	"Sprengstoff in der Fabrik"
sabotage_fuel_explosives_desc:0	"In Zusammenarbeit mit unserem lokalen Netzwerk infiltrieren unsere Agenten das Treibstoffsilo mitten in der Nacht, platzieren Sprengstoff in der Nähe kritischer Schwachpunkte und zerstören so gleichzeitig das gesamte Treibstofflager."
sabotage_fuel_explosives_outcome:0	"Das Team platzierte den Sprengstoff erfolgreich und brachte die Anlage zum Einsturz. Es wurden umfangreiche Schäden an den Treibstoffsilos gemeldet, wobei eine Menge Treibstoff vernichtet wurde."
sabotage_burn_oil_refinery:0	"Brennstoffraffinerie verbrennen"
sabotage_burn_oil_refinery_desc:0	"Unsere Agenten haben Lagereinheiten entdeckt, die hochentzündliche Verbindungen enthalten. Im Schutze der Nacht setzen unsere Agenten das Lager in Brand und ziehen sich dann in dem darauf folgenden Durcheinander zurück."
sabotage_burn_oil_refinery_outcome:0	"Das Team hat die örtlichen Treibstoffsilos erfolgreich in Brand gesetzt und dabei Hunderte von Tonnen gelagerten Treibstoffs zerstört und die Fähigkeit, einen Vorrat zu halten, stark beeinträchtigt, so dass die Produktion zum Stillstand kam."
sabotage_oil_explosives:0	"Sprengstoff im Werk"
sabotage_oil_explosives_desc:0	"In Zusammenarbeit mit unserem lokalen Netzwerk infiltrieren unsere Agenten die Ölraffinerie mitten in der Nacht, platzieren Sprengstoff an kritischen Schwachstellen und zerstören so die gesamte Anlage."
sabotage_oil_explosives_outcome:0	"Das Team platzierte den Sprengstoff erfolgreich und brachte die Anlage zum Einsturz. Die Ölraffinerie wurde erheblich beschädigt, die Produktion kam vollständig zum Stillstand."
sabotage_burn_radar:0	"Radar verbrennen"
sabotage_burn_radar_desc:0	"Unsere Agenten haben Elektronik entdeckt, die durch einfache Brandstiftung stark beschädigt werden kann. Im Schutze der Nacht schleichen sie sich zur Radarstation und zünden sie an."
sabotage_burn_radar_outcome:0	"Das Team setzt die Radarstation erfolgreich in Brand, zerstört wichtige Komponenten und legt das gesamte Radar für längere Zeit lahm."
sabotage_radar_explosives:0	"Sprengstoff herstellen"
sabotage_radar_explosives_desc:0	"In Zusammenarbeit mit unserem lokalen Netzwerk infiltrieren unsere Agenten die Radarstation mitten in der Nacht, platzieren Sprengstoff in der Nähe kritischer Schwachstellen und zerstören so die gesamte Anlage."
sabotage_radar_explosives_outcome:0	"Das Team hat den Sprengstoff erfolgreich platziert und die Anlage zum Einsturz gebracht. Es wurden erhebliche Schäden an der Radarstation gemeldet. Der Feind ist nun völlig blind in der Luft!"
sabotage_burn_port:0	"Hafen verbrennen"
sabotage_burn_port_desc:0	"Unsere Agenten haben ein großes Konvoischiff entdeckt, das derzeit im Hafen angedockt ist. Sie werden sich an Bord schleichen, ein Feuer legen und so den gesamten Hafen für andere Schiffe mit den entstehenden Trümmern blockieren."
sabotage_burn_port_outcome:0	"Das Team hat sich erfolgreich an Bord des Schiffes geschlichen und ein Feuer gelegt. Das Wrack hat den Marinestützpunkt auf absehbare Zeit verstopft."
sabotage_port_explosives:0	"Sprengstoff herstellen"
sabotage_port_explosives_desc:0	"In Zusammenarbeit mit unserem lokalen Netzwerk werden unsere Agenten den Marinestützpunkt mitten in der Nacht infiltrieren, Sprengsätze in der Nähe kritischer Schwachpunkte platzieren und so den gesamten Stützpunkt unbrauchbar machen."
sabotage_port_explosives_outcome:0	"Das Team platziert den Sprengstoff erfolgreich und bringt die Anlage zum Einsturz. Es wurden umfangreiche Schäden an der Marinebasis gemeldet. Feindliche Schiffe werden Schwierigkeiten beim Andocken haben."
target_leader_suitcase_bomb:	"Aktenkoffer-Bombe"
target_leader_suitcase_bomb_desc:	"Unsere Agenten infiltrieren das feindliche Armeehauptquartier und schmuggeln eine Bombe in einer Aktentasche mit sich. Sie platzieren sie im Besprechungsraum und zünden sie, wenn die Offiziere ihre Besprechung beginnen."
target_leader_suitcase_bomb_outcome:	"Unsere Agenten haben das Hauptquartier der Armee erfolgreich infiltriert und die Aktentasche platziert. Die Bombe wurde mit Hilfe eines zeitgesteuerten Sprengstoffs gezündet, als die Offiziere mit ihrer Besprechung begannen."
target_leader_ambush:	"Überfall auf der Straße"
target_leader_ambush_desc:	"In Zusammenarbeit mit unserem lokalen Netzwerk erhalten unsere Agenten Informationen über die genauen Routen, die der Feind nehmen wird. Sie werden einen Hinterhalt auf der Straße legen und auf den General und seine Eskorte feuern."
target_leader_ambush_outcome:	"Durch die Blockade der Straße mit einem Lastwagen gelingt es unseren Agenten, den feindlichen Konvoi anzugreifen. Der General wurde verwundet und kam nur knapp mit dem Leben davon. Unsere Agenten mussten sich zurückziehen, bevor die feindliche Verstärkung eintraf."
target_leader_sabotage_vehicle:	"Fahrzeug sabotieren"
target_leader_sabotage_vehicle_desc:	"Unsere Agenten werden das persönliche Fahrzeug des feindlichen Anführers sabotieren und ein paar Schrauben entfernen. Dann erledigen Zeit und Geschwindigkeit den Rest."
target_leader_sabotage_vehicle_outcome:	"Unsere Agenten haben das persönliche Fahrzeug des feindlichen Anführers erfolgreich sabotiert. Dem Funkverkehr zufolge kam es kurz darauf zu einem Unfall, in dessen Folge der General verwundet wurde."
target_attache_suitcase_bomb:	"Aktenkoffer-Bombe"
target_attache_suitcase_bomb_desc:	"Unsere Agenten infiltrieren das feindliche Armeehauptquartier und schmuggeln eine Bombe in einer Aktentasche mit sich. Sie platzieren sie im Besprechungsraum und zünden sie, wenn die Offiziere ihre Besprechung beginnen."
target_attache_suitcase_bomb_outcome:	"Unsere Agenten haben das Hauptquartier der Armee erfolgreich infiltriert und die Aktentasche platziert. Die Bombe wurde mit Hilfe eines zeitgesteuerten Sprengstoffs gezündet, als die Offiziere mit ihrer Besprechung begannen."
target_attache_ambush:	"Überfall auf der Straße"
target_attache_ambush_desc:	"In Zusammenarbeit mit unserem lokalen Netzwerk erhalten unsere Agenten Informationen über die genauen Routen, die der Feind nehmen wird. Sie legen einen Hinterhalt auf der Straße und feuern auf den Attache und seine Eskorte."
target_attache_ambush_outcome:	"Durch die Blockade der Straße mit einem Lastwagen gelingt es unseren Agenten, den feindlichen Konvoi anzugreifen. Der Attache wurde verwundet und kam nur knapp mit dem Leben davon. Unsere Agenten mussten sich zurückziehen, bevor die feindliche Verstärkung eintraf."
target_attache_sabotage_vehicle:	"Fahrzeug sabotieren"
target_attache_sabotage_vehicle_desc:	"Unsere Agenten sabotieren das persönliche Fahrzeug des feindlichen Attachés und entfernen ein paar Schrauben. Dann erledigen Zeit und Geschwindigkeit den Rest."
target_attache_sabotage_vehicle_outcome:	"Unsere Agenten haben das persönliche Fahrzeug des feindlichen Attachés erfolgreich sabotiert. Dem Funkverkehr zufolge kam es kurz darauf zu einem Unfall, bei dem der Attache verwundet wurde."
compliance_drop_leaflets:	"Flugblätter abwerfen"
compliance_drop_leaflets_desc:	"Unsere Agenten werden Flugblätter über die wahre Lage an den Fronten an die Zivilbevölkerung verteilen und sie über die Gräueltaten der Besatzungstruppen informieren."
compliance_drop_leaflets_outcome:	"Unsere Agenten haben erfolgreich Flugblätter über das Land verteilt. Die Einheimischen sind entsetzt über das Vorgehen der Besatzungstruppen."
compliance_uncover_propaganda:	"Propaganda für Streitigkeiten"
compliance_uncover_propaganda_desc:	"Unsere Agenten verteilen Radios, um die Bevölkerung über den wahren Stand des Krieges zu informieren, die feindliche Propaganda zu widerlegen und ihren Kampfeswillen zu erneuern."
compliance_uncover_propaganda_outcome:	"Unsere Agenten haben erfolgreich Radios an die Bevölkerung verteilt und werden sie häufig über den wahren Stand des Krieges informieren."
