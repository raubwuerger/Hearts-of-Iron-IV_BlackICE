lar_operative_event.7.t:	"[From.GetAdjective] Marineeinheit entdeckt!"
lar_operative_event.7.desc:	"Heute [This.GetName], beauftragt mit der Spionageabwehr gegen ausländische Bedrohungen, hat erfolgreich eine [From.GetAdjective] Spionageeinheit ausgeschaltet, die innerhalb unserer Seestreitkräfte operierte."
