l_german:
operation_boost_resistance:0	"Widerstand stärken"
operation_boost_resistance_desc:0	"§Die Partisanen in den vom Feind besetzten Gebieten suchen verzweifelt nach Unterstützung, um den Kampf fortzusetzen. Sie binden erhebliche Mengen feindlicher Truppen und wären eine sehr effektive Investition.§!"
operation_capture_cipher:0	"Chiffre kapern"
operation_capture_cipher_desc:0	"§YDie Erbeutung eines feindlichen Codebuchs oder die Beschaffung desselben auf andere Weise würde unseren Codeknackern einen entscheidenden Vorteil bei ihren Bemühungen verschaffen.§!"
infiltration_paradrop:0	"Infiltration per Fallschirm"
infiltration_paradrop_desc:0	"Die Agenten werden per Fallschirm in dem Gebiet abgesetzt. Sie fliegen niedrig und bei Nacht, um Störungen durch feindliche Kampfflugzeuge zu vermeiden."
infiltration_submarine:0	"Einsatz per U-Boot"
infiltration_submarine_desc:0	"Die Agenten werden von einem unserer U-Boote in Küstennähe abgesetzt. Wir haben bereits mögliche Landeplätze und den Zeitpunkt der feindlichen Patrouillen erkundet, um eine Entdeckung zu vermeiden."
infiltration_border:0	"Infiltration über eine neutrale Grenze"
infiltration_border_desc:0	"Die Agenten werden über eine neutrale Grenze eindringen. Wir gehen davon aus, dass die Grenzbeamten in diesem Gebiet weniger wachsam sind, und wir haben bereits eine Reihe von Gebieten identifiziert, in denen die Grenzpatrouillen sehr selten sind."
infiltration_diplomatic:0	"Diplomatische Pässe"
infiltration_diplomatic_desc:0	"Die Agenten werden Diplomatenpässe benutzen, um in das Land einzureisen und sich dort zu bewegen. Wir gehen davon aus, dass die feindliche Spionageabwehr versuchen wird, sie zu beschatten, aber das kann mit ausreichendem Training überwunden werden."
resistance_support_arms_depots:0	"Nachschub-Caches anlegen"
resistance_support_arms_depots_desc:0	"Unsere Agenten werden eine Reihe von versteckten Verstecken mit Sprengstoff und anderer Ausrüstung anlegen, um einen allgemeinen Aufstand vorzubereiten, sobald der Widerstand stark genug ist."
resistance_support_distribute_weapons:0	"Verteilen Sie Waffen"
resistance_support_distribute_weapons_desc:0	"Unsere Agenten werden eine Reihe von Waffenabwürfen organisieren und koordinieren. Die Waffen werden dann an vertrauenswürdige Mitglieder des lokalen Widerstands übergeben."
resistance_support_organize_training:0	"Organisieren Sie Trainingscamps"
resistance_support_organize_training_desc:0	"Unsere Agenten werden Kurse in Flucht- und Ausweichmanövern sowie in grundlegenden Feldtechniken abhalten. Die vielversprechendsten Schüler werden dann an einer Grundausbildung an Schusswaffen teilnehmen."
resistance_support_coordinate_groups:0	"Koordinieren Sie Widerstandsgruppen"
resistance_support_coordinate_groups_desc:0	"Unsere Agenten werden herumreisen, um verschiedene Widerstandsgruppen zu koordinieren. Es wird nicht ganz einfach sein, ein Bündnis zwischen den politisch zersplitterten Einheiten zu schmieden."
exfiltration_air_pickup:0	"Abholung per Flugzeug"
exfiltration_air_pickup_desc:0	"Eines unserer Flugzeuge wird nachts in feindliches Gebiet eindringen, ein markiertes Feld finden, landen und unsere Agenten abholen."
exfiltration_submarine_pickup:0	"Abholung durch ein U-Boot"
exfiltration_submarine_pickup_desc:0	"Eines unserer U-Boote wird an einem bestimmten Abholpunkt an der Küste stationiert sein. Das Timing ist von entscheidender Bedeutung, da feindliche Seepatrouillen das Gebiet abdecken."
exfiltration_border:0	"Wanderung über die Grenze"
exfiltration_border_desc:0	"Unsere Agenten werden entkommen, indem sie die Grenze nachts an einem abgelegenen Ort überqueren. Einheimische Führer stehen bereit, um bei der Navigation durch das tückische Gebiet zu helfen."
exfiltration_go_to_ground:0	"Auf den Boden gehen"
exfiltration_go_to_ground_desc:0	"Unsere Agenten werden untertauchen und sich unter die Bevölkerung mischen, bis sie für die nächste Mission bereit sind. Sollte sich eine Gelegenheit ergeben, auf andere Weise zu exfiltrieren, werden sie diese wahrnehmen."
operation_make_resistance_contacts:0	"Kontakte zum Widerstand knüpfen"
operation_make_resistance_contacts_desc:0	"§A Jede Unterstützung, die wir den hinter den feindlichen Linien aktiven Partisanen anbieten können, wäre weitaus effektiver, wenn wir eine Möglichkeit hätten, mit ihnen zu kommunizieren und uns mit ihnen abzustimmen.§!"
capture_cyphers_bribe:0	"Soldat bestechen"
capture_cyphers_bribe_desc:1	"Wir haben einen Insider und werden ihn mit den nötigen Mitteln ausstatten, um ein Codebuch zu stehlen und es unserem Agenten zu übergeben."
capture_cyphers_raid:0	"Kommandoüberfall"
capture_cyphers_raid_desc:0	"Unser Agent wird das Gebiet auskundschaften und eine Kommandoeinheit an Land schicken, um Codebücher und Verschlüsselungsgeräte zu erbeuten. Wir werden auch versuchen, einen oder zwei Verschlüsselungsspezialisten zum Verhör gefangen zu nehmen."
capture_cyphers_seduction:0	"Verführung einsetzen"
capture_cyphers_seduction_desc:0	"Unser Agent nimmt Kontakt mit einer Person auf, die Zugang zu den Chiffriergeräten hat, und nutzt ihren Charme - oder andere Mittel - um eine Kopie zu erhalten."
capture_cyphers_reverse_engineer:0	"Reverse Engineer"
capture_cyphers_reverse_engineer_desc:0	"Eine einfachere Version der Hauptverschlüsselungsmaschine des Landes ist im Handel erhältlich. Wir werden eine Version legal erwerben und sie dann verwenden, um eine Entschlüsselungsmaschine nachzubauen."
resistance_contacts_radio_circuits:0	"Erstellen von Funkschaltungen"
resistance_contacts_radio_circuits_desc:0	"Das Team wird Funkgeräte an die Mitglieder des Widerstands verteilen und ihnen die Grundlagen des Funkprotokolls beibringen, insbesondere im Hinblick auf die Vermeidung der feindlichen Funkpeilung."
resistance_support_pidgeons:0	"Verteilen Sie Tauben"
resistance_support_pidgeons_desc:0	"Das Team wird trainierte Brieftauben an verschiedene Züchter verteilen, die mit dem Widerstand verbunden sind. Sie werden Nachrichten zu unseren Linien zurückbringen."
resistance_contacts_briefings:0	"Strategiebesprechungen"
resistance_contacts_briefings_desc:0	"Unser Agent wird die Anführer der verschiedenen Widerstandsgruppen über die geplanten Operationen informieren, um die Unterstützung des Widerstands zu koordinieren."
capture_cyphers_smuggle:0	"Cyphers schmuggeln"
capture_cyphers_smuggle_desc:0	"Einer unserer Doppelagenten wird eine neue Kopie der derzeit aktiven Chiffre anfordern, um sie zu übermitteln. Die Koordinierung mit anderen Diensten ist im Gange, um sicherzustellen, dass die Übergabe nicht unterbrochen wird."
operation_steal_tech_airforce:1	"Blaupausen der Luftfahrtindustrie stehlen"
operation_steal_tech_airforce_desc:0	"§AWir haben eine Reihe von sehr beunruhigenden Berichten erhalten, dass der Feind uns in mehreren Bereichen der Flugzeugentwicklung voraus ist. Wenn dies der Fall ist, könnten wir versuchen, herauszufinden, wie weit sie uns voraus sind, und diese Erkenntnisse nutzen, um unsere eigene Forschung voranzutreiben.§!"
operation_infiltrate_armed_forces_navy:0	"Marine infiltrieren"
operation_infiltrate_armed_forces_navy_desc:0	"§Während die engmaschigen Besatzungen der [From.GetAdjective] Schiffe nur wenige Möglichkeiten der Infiltration bieten, ist das Unterstützungspersonal zu Hause eine andere Sache. Einen Insider zu bekommen, würde uns wertvolle Informationen liefern und uns die Möglichkeit geben, später schwierigere Operationen zu unterstützen.§!"
operation_infiltrate_civilian:0	"Infiltrieren Sie die zivile Verwaltung"
operation_infiltrate_civilian_desc:0	"§Die [From.GetAdjective] Regierung hat zahlreiche Schwachstellen, durch die wir einen Agenten in ihre Operationen einschleusen könnten. Dies würde uns wertvolle Einblicke in die internen Abläufe von [From.GetNameDef] geben und uns die Möglichkeit geben, diesen Agenten in zukünftigen Operationen gegen [From.GetNameDef] einzusetzen.§!"
operation_infiltrate_armed_forces_airforce:0	"Luftwaffe infiltrieren"
operation_infiltrate_armed_forces_airforce_desc:0	"§Die [From.getAdjective] Luftwaffe ist die jüngste der [From.GetAdjective] Streitkräfte. Als solche hat sie in ihren Reihen viele Menschen mit ungewöhnlichen Hintergründen. Wir könnten einige von ihnen ausnutzen, um einen Mann im Inneren zu bekommen.§!"
operation_infiltrate_armed_forces_army:0	"Armee infiltrieren"
operation_infiltrate_armed_forces_army_desc:0	"§ADie [From.GetAdjective] Armee hat eine Reihe von Personen in ihren Reihen, die dazu gebracht werden könnten, zusätzliche Informationen und Unterstützung für zukünftige Operationen zu liefern.§!"
operation_steal_tech_army:1	"Militärische Blaupausen stehlen"
operation_steal_tech_army_desc:0	"§Unsere Geheimdienstanalysten glauben, dass [From.GetNameDef] bedeutende Fortschritte auf dem Gebiet der Bodenkriegsführung und der Militärtechnik gemacht hat. Eine gründlichere Untersuchung, gepaart mit einigen direkteren Methoden, könnte wertvolle Erkenntnisse für unsere eigenen Forschungsprojekte liefern.§!"
operation_steal_tech_civilian:1	"Industrielle Blaupausen stehlen"
operation_steal_tech_civilian_desc:0	"§Es scheint, dass unsere Industrie in mehreren Bereichen hinter [From.GetNameDef] zurückbleibt. Mit ein wenig List und Tücke können wir den Rückstand vielleicht erheblich aufholen.§!"
operation_steal_tech_navy:1	"Blaupausen für die Marine stehlen"
operation_steal_tech_navy_desc:0	"§Es gibt Berichte, dass die [From.GetAdjective] uns in einigen Bereichen der Marinetechnik voraus zu sein scheinen. Wir könnten in der Lage sein, etwas von dieser Technologie für Reverse Engineering zu erwerben.§!"
infiltrate_military_bribe:0	"Bestechung anbieten"
infiltrate_military_bribe_desc:1	"Unser Agent wird eine Person in finanziellen Schwierigkeiten ausfindig machen und uns eine beträchtliche Summe anbieten, um uns zu unterstützen. Das Geld wird aus der Staatskasse zur Verfügung gestellt."
infiltrate_military_seduction:0	"Charme anwenden"
infiltrate_military_seduction_desc:1	"Unser Agent geht eine sehr enge und intime Beziehung zu einem Insider ein, um Informationen zu erhalten und Druck auf ihn auszuüben."
infiltrate_military_turned_pow:0	"Kriegsgefangenen verwandeln"
infiltrate_military_turned_pow_desc:0	"Wir werden einen brauchbaren Kriegsgefangenen in unserer Obhut ausfindig machen, ihn auf unsere Seite ziehen und ihn dann zurückbringen. Er wird zweifellos verhört werden, aber mit dem richtigen Training wird er in der Lage sein, dies zu überstehen."
infiltrate_military_ideological_supporter:0	"Ideologische Unterstützer kontaktieren"
infiltrate_military_ideological_supporter_desc:1	"Wir werden diplomatische Rückkanäle nutzen, um Mitglieder der [From.GetAdjective]-Regierung mit politischen Ansichten, die von ihrer Regierung nicht geteilt werden, zu identifizieren und zu kontaktieren und sie zu ermutigen, für uns zu arbeiten."
steal_blueprints_bribe:0	"Bestechung anbieten"
steal_blueprints_bribe_desc:0	"Unser Agent wird einem an dem Projekt beteiligten Ingenieur eine beträchtliche Summe anbieten."
steal_blueprints_seduction:0	"Charme anwenden"
steal_blueprints_seduction_desc:0	"Unser Agent wird sich einer Person nähern, die mit dem Projekt zu tun hat, und ihren Charme einsetzen, um zusätzliche Erkenntnisse zu gewinnen. Wir erwarten zwar nicht, dass jemand einen kompletten Satz Baupläne für ein paar schöne Stunden in Gesellschaft aushändigt, aber Bettgeflüster ist oft unbedenklich."
steal_blueprints_infiltrate_naval_design_office:0	"Infiltrieren Sie das Konstruktionsbüro der Marine"
steal_blueprints_infiltrate_naval_design_office_desc:0	"Unser Agent wird als kleiner Angestellter bei einem kleineren Zulieferer im Marinebau eindringen und diese Position nutzen, um Kopien der verfügbaren Pläne anzufertigen."
steal_blueprints_steal_prototype:0	"Prototyp stehlen"
steal_blueprints_steal_prototype_desc:0	"Nach einer grundlegenden Flugausbildung und in Begleitung eines Testpiloten unserer Luftwaffe verschafft sich unser Agent Zugang zu einem Prototyp und fliegt ihn zu unseren Linien. Es wird eine Eskorte von Kampfflugzeugen organisiert, um sicherzustellen, dass der Prototyp unversehrt bei uns ankommt."
steal_blueprints_middle_manager:0	"Infiltrieren Sie das mittlere Management"
steal_blueprints_middle_manager_desc:0	"Unser Agent wird die ihm zur Verfügung gestellten Referenzen und einen gefälschten Lebenslauf nutzen, um eine Anstellung im mittleren Management eines großen Unternehmens zu erhalten. Von dieser Position aus sollte er in der Lage sein, Informationen über dieses Unternehmen und die gesamte Branche zu liefern."
lar_communist_uprising_organise_cells:0	"Organisieren Sie revolutionäre Zellen"
lar_communist_uprising_organise_cells_desc:0	"Unsere Agenten werden mit einigen ausgewählten Arbeitern zusammenarbeiten, um Revolutionäre Aktionskomitees zu bilden, die die Saat der Revolution in jede Fabrik tragen."
lar_communist_uprising_infiltrate_civil_service:0	"Infiltrieren Sie den öffentlichen Dienst"
lar_communist_uprising_infiltrate_civil_service_desc:0	"Unsere Agenten werden dafür sorgen, dass mehrere vertrauenswürdige Personen in den öffentlichen Dienst eintreten, um den Kern für eine zivile Verwaltung nach dem Erfolg der Revolution zu bilden."
lar_communist_uprising_train_workers_militia:0	"Arbeitermiliz ausbilden"
lar_communist_uprising_train_workers_militia_desc:0	"Unser Agent wird eine Grundausbildung für eine Reihe handverlesener Genossen organisieren, die dann den Kader der Milizeinheiten bilden werden."
lar_communist_uprising_organize_strikes:0	"Organisieren Sie Streiks"
lar_communist_uprising_organize_strikes_desc:0	"Unser Agent wird Gewerkschaften und andere politisch verlässliche Personen, die in Schlüsselindustrien arbeiten, ansprechen und ihnen helfen, einen Streik zu organisieren, der bei Kriegsbeginn durchgeführt wird."
lar_fra_coup_pre_position_units:0	"Einheiten vorbereiten"
lar_fra_coup_pre_position_units_desc:0	"Unser Agent wird eine Reihe von sympathischen Armeeeinheiten in dem Gebiet übernehmen und ihnen Ziele zuweisen, die bei Beginn der Operation eingenommen werden sollen."
lar_fra_launch_coup:0	"Coup starten"
lar_fra_launch_coup_desc:0	"Die Operation beginnt mit dem Empfang eines verschlüsselten Funksignals."
FRA_instigate_workers_revolution_britain:0	"Starten Sie eine Arbeiterrevolution in Großbritannien"
FRA_instigate_workers_revolution_italy:0	"Stiften Sie eine Arbeiterrevolution in Italien an."
FRA_instigate_workers_revolution_spain:0	"Starten Sie eine Arbeiterrevolution in Spanien"
FRA_instigate_workers_revolution_germany:0	"Leiten Sie eine Arbeiterrevolution in Deutschland ein."
FRA_coup_in_north_africa:0	"Putsch in Nordafrika vorbereiten"
FRA_coup_in_north_africa_flag:0	"Putsch in Nordafrika vorbereiten"
FRA_coup_in_north_africa_desc:0	"Viele Franzosen in Nordafrika sind immer noch erpicht darauf, wieder in den Kampf gegen die Invasoren einzusteigen. Wir müssen nur auf sie zugehen."
FRA_coup_in_syria:0	"Putsch in Syrien vorbereiten"
FRA_coup_in_syria_flag:0	"Putsch in Syrien vorbereiten"
FRA_coup_in_syria_desc:0	"Viele Franzosen in Syrien sind immer noch bereit, sich wieder am Kampf gegen die Invasoren zu beteiligen. Wir müssen ihnen nur die Hand reichen."
FRA_coup_in_indochina:0	"Coup in Indochina vorbereiten"
FRA_coup_in_indochina_flag:0	"Putsch in Indochina vorbereiten"
FRA_coup_in_indochina_desc:0	"Viele Franzosen in Indochina sind immer noch erpicht darauf, sich wieder am Kampf gegen die Invasoren zu beteiligen. Wir müssen ihnen nur die Hand reichen."
FRA_coup_in_central_africa:0	"Coup in Zentralafrika vorbereiten"
FRA_coup_in_central_africa_flag:0	"Putsch in Zentralafrika vorbereiten"
FRA_coup_in_central_africa_desc:0	"Viele Franzosen in Zentralafrika sind immer noch erpicht darauf, wieder in den Kampf gegen die Invasoren einzusteigen. Wir müssen ihnen nur die Hand reichen."
FRA_coup_in_west_africa:0	"Coup in Westafrika vorbereiten"
FRA_coup_in_west_africa_flag:0	"Coup in Westafrika vorbereiten"
FRA_coup_in_west_africa_desc:0	"Viele Franzosen in Westafrika sind immer noch erpicht darauf, wieder in den Kampf gegen die Invasoren einzusteigen. Wir müssen ihnen nur die Hand reichen."
FRA_coup_in_madagascar:0	"Coup in Madagaskar vorbereiten"
FRA_coup_in_madagascar_flag:0	"Putsch in Madagaskar vorbereiten"
FRA_coup_in_madagascar_desc:0	"Viele Franzosen in Madagaskar sind immer noch erpicht darauf, sich wieder am Kampf gegen die Invasoren zu beteiligen. Wir müssen nur auf sie zugehen."
targeted_sabotage_organize_more_meetings:0	"Organisieren Sie mehr Versammlungen"
targeted_sabotage_organize_more_meetings_desc:0	"Befragungen von Arbeitern haben gezeigt, dass ausgedehnte Versammlungen zur Erörterung kleinerer Probleme zu einer drastischen Verlangsamung der Produktion führen, und das bei minimalen Kosten für unsere Arbeiter."
targeted_sabotage_destroy_bridge:0	"Brücke zerstören"
targeted_sabotage_destroy_bridge_desc:0	"Der lokale Widerstand hat eine Brücke ausgemacht, die einen Dreh- und Angelpunkt für die feindlichen Nachschubbemühungen in der Region darstellt. Unsere Agenten werden die Brücke mit ein paar Pfund Sprengstoff zum Einsturz bringen."
targeted_sabotage_collapse_tunnel:0	"Tunnel einstürzen lassen"
targeted_sabotage_collapse_tunnel_desc:0	"Die Haupteisenbahnlinie des Staates verläuft durch einen engen Tunnel. Unsere Agenten haben die strukturellen Schwachstellen in der Konstruktion identifiziert und werden Sprengstoff einsetzen, um den Tunnel zum Einsturz zu bringen."
targeted_sabotage_remove_roadsigns:0	"Straßenschilder entfernen"
targeted_sabotage_remove_roadsigns_desc:0	"Unsere Agenten werden Straßenschilder abreißen und andere umdrehen, um den feindlichen Truppen die Navigation zu erschweren."
targeted_sabotage_immobilize_rolling_stock:0	"Rollendes Material lahmlegen"
targeted_sabotage_immobilize_rolling_stock_desc:0	"Eine Handvoll Sand in den Schmierstellen eines Eisenbahnwaggons führt dazu, dass dieser zum Stillstand kommt und eine Bahnstrecke blockiert, bis sie repariert werden kann. Schon eine kleine Anzahl von lahmgelegten Waggons kann das gesamte System zum Erliegen bringen."
targeted_sabotage_burn_storage:0	"Brandlager"
targeted_sabotage_burn_storage_desc:0	"Der örtliche Widerstand hat Lagerräume ausfindig gemacht, die hochentzündliche Stoffe enthalten. Im Schutze der Nacht werden unsere Agenten das Lager in Brand setzen und sich dann in dem anschließenden Durcheinander zurückziehen."
targeted_sabotage_destroy_mining_equipment:0	"Zerstören Sie die Bergbauausrüstung"
targeted_sabotage_destroy_mining_equipment_desc:0	"Lokale Widerstandsgruppen haben darauf hingewiesen, dass viele der im Bergbau verwendeten schweren Geräte extrem anfällig sind. Unsere Agenten werden Sprengstoff einsetzen, um einige kritische Teile außer Gefecht zu setzen und so den gesamten Bergbaubetrieb zum Erliegen zu bringen."
operation_targeted_sabotage_industry:0	"Sabotage in der Industrie"
operation_targeted_sabotage_industry_desc:0	"§ADer Widerstand im feindlichen Gebiet hat um Unterstützung bei der Sabotage einer lokalen Industrieanlage gebeten.§!"
operation_targeted_sabotage_infrastructure:0	"Sabotage Infrastruktur"
operation_targeted_sabotage_infrastructure_desc:0	"§Der Widerstand im feindlichen Gebiet hat einen unauffälligen Versuch unternommen, die feindliche Infrastruktur zu zerstören, aber bisher fehlten ihm die Mittel, um eine große Wirkung zu erzielen.§!"
operation_targeted_sabotage_resources:0	"Sabotage Ressourcen"
operation_targeted_sabotage_resources_desc:0	"§Der Widerstand im feindlichen Gebiet hat uns über feindliche Bemühungen informiert, Ressourcen im Land zu gewinnen. Ein gut platzierter Schlag gegen diese Pläne würde das verhindern.§!"
operation_rescue_operative:0	"Rettung eines gefangenen Agenten"
operation_rescue_operative_desc:0	"§Einer unserer Aktivposten wurde vom Feind aus dem Spiel genommen. Wir müssen ihn zurückholen, und zwar schnell, bevor er endgültig aus dem Spiel genommen wird.§!"
free_operative_free_in_transit:0	"Frei auf dem Transportweg"
free_operative_free_in_transit_desc:0	"Unser Agent wird mit einem Auto zwischen dem Gefängnis, in dem er festgehalten wird, und dem Ort, an dem er verhört wird, transportiert. Wir kennen die Route und werden eine kleine Einheit losschicken, um einen Hinterhalt zu legen, die Wachen zu töten und unseren Agenten zu befreien."
free_operative_liberate_camp:0	"Lager befreien"
free_operative_liberate_camp_desc:0	"Während des Verhörs wird unser Agent mit anderen wichtigen Gefangenen in einem Lager festgehalten. Wir greifen das Lager mit einer kleinen Einheit an, überwältigen alle anwesenden Wachen und befreien unseren Agenten."
free_operative_smuggle_in_escape_gear:0	"Fluchtausrüstung einschmuggeln"
free_operative_smuggle_in_escape_gear_desc:0	"Unsere Wissenschaftler haben eine Reihe von Fluchtmitteln entwickelt. Wir haben einen lokalen Kontakt, der sich bereit erklärt hat, das Paket entgegenzunehmen. Unser Agent wird sich dann mit den gegebenen Hilfsmitteln auf den Weg zum Rendez-vouz machen, um dort zu entkommen."
operation_outcome_consumes_token_tt:1	"Diese Operation könnte einen §YInfiltrated Asset§! verbrennen."
operation_outcome_sabotage_industry_tt:0	"Konzentriert den lokalen Widerstand auf die Industrie und erhöht die Chance auf erfolgreiche Angriffe."
operation_outcome_sabotage_infrastructure_tt:0	"Konzentriert den lokalen Widerstand auf die Infrastruktur und erhöht die Chance auf erfolgreiche Angriffe."
operation_outcome_sabotage_resources_tt:0	"Konzentriert den lokalen Widerstand auf den Abbau von Ressourcen und erhöht die Chance auf erfolgreiche Angriffe."
operation_coup_government:0	"Coup orchestrieren"
operation_coup_government_desc:0	"§A[From.GetNameDefCap] ist reif für einen Regimewechsel. Ein paar gute, verlässliche Leute - mit der richtigen Unterstützung - könnten die Wurzelstruktur stürzen, die die [From.GetAdjective]-Regierung stützt.§!"
collaboration_government_set_up_planning_committees:0	"Planungskomitees einrichten"
collaboration_government_set_up_planning_committees_desc:0	"Unser Team wird sich mit einigen sympathischen Politikern treffen, um die Möglichkeit der Bildung einer neuen Regierung zu erörtern, die [From.GetNameDef] nach unserer Besetzung verwalten soll, und einige kleine Arbeitsgruppen bilden, die die Details ausarbeiten werden."
collaboration_government_train_paramilitary_forces:0	"Paramilitärische Truppen ausbilden"
collaboration_government_train_paramilitary_forces_desc:0	"Unser Team wird einige Einheiten organisieren und ausbilden, um die neue Regierung bei der Aufrechterhaltung von Recht und Ordnung zu unterstützen. Bis die neue Regierung organisiert ist, werden sie dabei helfen, die hinteren Gebiete zu sichern."
collaboration_government_contact_military_officers:0	"Militärische Offiziere kontaktieren"
collaboration_government_contact_military_officers_desc:0	"Unser Team wird einigen Hinweisen nachgehen, die darauf hindeuten, dass einige pensionierte Militäroffiziere mit der derzeitigen [From.GetAdjective]-Regierung sehr unzufrieden sind und bereit wären, uns bei der Bildung einer neuen Regierung nach unserer Besetzung zu helfen."
operation_collaboration_government:0	"Kollaborationsregierung vorbereiten"
operation_collaboration_government_desc:0	"§AEine befreundete Regierung in [From.GetNameDef] würde es uns ermöglichen, uns auf unsere anderen Feinde zu konzentrieren und Truppen für andere Ziele freizusetzen.§!"
fake_intel_decoy_tanks:0	"Täuschungspanzer"
fake_intel_decoy_tanks_desc:0	"Wir haben billige Attrappen erfunden, die aus der Ferne wie Panzer aussehen. Wir werden sie an leicht zu beobachtenden Stellen platzieren und dafür sorgen, dass der Feind genügend Zeit hat, sie zu bemerken."
fake_intel_radio_deception:0	"Funk-Täuschung"
fake_intel_radio_deception_desc:0	"Wir werden eine kleine Einheit von Funkspezialisten aufstellen, die sich als Signalabteilung einer viel größeren Formation ausgibt. Sie werden auch eine ältere Version unserer Chiffriergeräte verwenden, um es dem Feind zu erleichtern, ihre Nachrichten zu lesen."
fake_intel_deliberate_leaks:0	"Vorsätzliche Lecks"
fake_intel_deliberate_leaks_desc:0	"Einige unserer Agenten im Ausland sorgen dafür, dass sie sich in der Nähe der richtigen Leute indiskret verhalten und so sicherstellen, dass der Feind die gewünschten Informationen aus 'vertrauenswürdigen' Quellen erhält."
fake_intel_press_releases:0	"Presseerklärungen"
fake_intel_press_releases_desc:0	"Wir werden Reporter einladen, sehr detaillierte Berichte über einige der Dinge zu schreiben, von denen wir möchten, dass der Feind sie erfährt."
fake_intel_utilize_double_agents:0	"Setzen Sie Doppelagenten ein"
fake_intel_utilize_double_agents_desc:0	"Wir haben eine Reihe von Junior-Informanten des feindlichen Geheimdienstes umgedreht. Sie werden ermutigt, die andere Seite mit der richtigen Art von Informationen zu versorgen."
fake_intel_plant_evidence:0	"Beweise platzieren"
fake_intel_plant_evidence_desc:0	"Wir werden eine kleine Operation an einem Ort durchführen, den der Feind kontrolliert, an dem wir aber im Moment nicht interessiert sind, und dafür sorgen, dass wir eine Menge Beweise hinterlassen."
fake_intel_release_pow:0	"Freilassung von Pow"
fake_intel_release_pow_desc:0	"Ein gefangener feindlicher Offizier soll aus humanitären Gründen in seine Heimat zurückgebracht werden. Bevor er abreist, sorgen wir dafür, dass er zufällig eine Reihe von Dingen sieht."
operation_fake_intel:0	"Falsche Informationen einschleusen"
operation_fake_intel_desc:0	"§Wir wissen, dass der [From.GetAdjective] Geheimdienst in unserem Land aktiv ist. Manchmal ist es besser, jemandem, der nach Informationen sucht, genau das zu geben, was er hören will.§!"
heavy_water_raid:0	"Operation Gunnerside"
heavy_water_raid_desc:0	"§Die Deutschen haben in einer Anlage in Norwegen mit der Produktion von schwerem Wasser begonnen, das möglicherweise mit einem Programm zur Entwicklung einer Atombombe in Verbindung steht. Selbst wenn das produzierte schwere Wasser nicht ausreicht, um eine solche Waffe zu bauen, würde es ihnen zweifellos bei ihren Forschungen helfen.§!"
heavy_water_infiltration:0	"Abwurf eines Angriffsteams und von Vorräten aus der Luft"
heavy_water_infiltration_desc:0	"Ein modifizierter Bomber setzt ein kleines Team norwegischer Kommandosoldaten in dem Gebiet ab, um sich mit einem Vorauskommando und dem örtlichen Widerstand zu verbinden."
heavy_water_attack:0	"Sabotage der Schwerwasseranlage"
heavy_water_attack_desc:0	"Die Sicherheitsvorkehrungen in der Anlage sind Berichten zufolge lax. Wir haben ein Mitglied des Widerstands im Inneren, das uns mit Patrouillenplänen versorgt hat. Sobald wir drinnen sind, wird unser Team Sprengstoff platzieren und Beweise dafür hinterlassen, dass dies eine reguläre Militäroperation war."
heavy_water_exfiltration:0	"Exfiltration"
heavy_water_exfiltration_desc:0	"Das Team wird sich aufteilen und sich entweder lokalen Widerstandseinheiten anschließen oder versuchen, zu den befreundeten Linien zurückzukehren."
bruneval_raid:0	"Operation Bissig"
bruneval_raid_desc:0	"§Es scheint, dass der Feind uns bei der Entwicklung von Radargeräten voraus ist. Wir haben eine feindliche Radaranlage an einer verwundbaren Stelle identifiziert, die unserer Meinung nach durch einen ausreichend entschlossenen Angriff einer kleinen Truppe eingenommen werden könnte, um weitere Informationen zu erhalten."
bruneval_infiltration:0	"Paradrop-Sturmtruppe"
bruneval_infiltration_desc:0	"Es wird eine Kompanie Luftlandetruppen zusammengestellt, die nachts aus geringer Höhe in der Nähe des Ziels abgeworfen wird."
bruneval_attack:0	"Eroberung der Radaranlage"
bruneval_attack_desc:0	"Der Angriffstrupp teilt sich in vier Einheiten auf, um die Anlage einzunehmen und den Evakuierungsstrand zu räumen. Ein Spezialist wird die Radaranlage zerlegen und fotografieren. Die Einheit wird auch versuchen, einen feindlichen Techniker zum Verhör gefangen zu nehmen."
bruneval_exfiltration:0	"Evakuierung per Landungsboot"
bruneval_exfiltration_desc:0	"Eine Flottille von Landungsbooten, die Truppen für die Evakuierung an Bord haben, landet und holt die Angriffstruppe ab. Eine Eskorte durch befreundete Seestreitkräfte wird arrangiert."
capture_tito:0	"Unternehmen Rösselsprung"
capture_tito_desc:0	"§NUR die jugoslawischen Partisanen haben an Stärke gewonnen und rücken immer weiter vor. In vielen Gebieten kontrollieren sie effektiv das Land, blockieren Straßen und operieren ungestraft. Der Schlüssel dazu ist der Partisanenführer Tito, der diese Operationen koordiniert und kontrolliert hat. Ihn auszuschalten würde dem Widerstand in diesen Gebieten einen schweren Schlag versetzen.§!"
capture_tito_infiltration:0	"Land-Luftlandetruppen"
capture_tito_infiltration_desc:0	"Die erste Welle von Fallschirmjägern wird per Gleitflugzeug fast über dem vermuteten Versteck von Tito abgesetzt. Mit Hilfe von Schnelligkeit und Überraschung überwältigen sie Titos Wachen und nehmen Tito entweder gefangen oder töten ihn selbst."
capture_tito_attack:0	"Hauptangriff"
capture_tito_attack_desc:0	"Eine motorisierte Kolonne rückt vor, um sich mit den Luftlandeeinheiten zu verbinden und dabei alle größeren Partisaneneinheiten zu vernichten, die stehen und kämpfen."
capture_tito_exfiltration:0	"Sichern Sie das Gebiet"
capture_tito_exfiltration_desc:0	"Sobald sich die beiden Angriffstruppen zusammengeschlossen haben, werden sie das Gebiet sichern und die überlebenden Feinde aufreiben."
rescue_mussolini:0	"Retten Sie Benito Mussolini"
rescue_mussolini_desc:0	"§A Nachdem er von [ITA.GetLeader] abgesetzt wurde, wurde Mussolini in einem kleinen Hotel in den Apenninen unter Arrest gestellt. Wir haben ein kleines Zeitfenster, um ihn zu retten und zu unseren Linien zurückzubringen, wo er zweifellos bei der Verwaltung der italienischen Gebiete nach unserem Sieg helfen würde.§!"
rescue_mussolini_infiltration:0	"Gleitflugzeuge in der Nähe des Gefängnisses landen"
rescue_mussolini_infiltration_desc:0	"Eine speziell ausgewählte Einheit wird an Bord von Gleitern gehen und so nah wie möglich an dem Ort landen, an dem Mussolini laut unserem Geheimdienst festgehalten wird."
rescue_mussolini_attack:0	"Stürmen Sie das Gefängnis"
rescue_mussolini_attack_desc:0	"Die Angriffseinheit wird das Hotel angreifen und einnehmen und Mussolini befreien. Im Idealfall wird sich die Garnison zurückziehen, anstatt sich zu wehren. Schnelligkeit und Überraschung sind von entscheidender Bedeutung."
rescue_mussolini_exfiltration:0	"Befreiung per Flugzeug"
rescue_mussolini_exfiltration_desc:0	"Ein kleines Flugzeug mit ausgezeichneten Kurzstreckenfähigkeiten wird landen und Mussolini abholen, dann umdrehen und ihn zu einem befreundeten Flugplatz fliegen."
GER_rescued_mussolini:0	"Geretteter Mussolini"
infiltration_paradrop_outcome:0	"Trotz einiger Schwierigkeiten, den Absetzplatz in der Dunkelheit zu finden, ist das Team sicher gelandet."
infiltration_submarine_outcome:0	"Nachdem ein erster Versuch durch hohe Wellen zunichte gemacht wurde, war ein zweiter Landeversuch am nächsten Tag erfolgreich und brachte das Team sicher an die Küste."
infiltration_border_outcome:0	"Bei sehr schlechtem Wetter fand unser Team den zuvor ausgekundschafteten Weg und überquerte die Grenze ohne weitere Probleme."
infiltration_diplomatic_outcome:0	"Das Team hatte keine Probleme, in das Land zu gelangen und wich geschickt der Verfolgung durch die feindliche Spionageabwehr aus."
exfiltration_air_pickup_outcome:0	"Das kleine Kurierflugzeug fand den Abholpunkt ohne Probleme und brachte das Team sicher zu unseren Linien zurück."
exfiltration_submarine_pickup_outcome:0	"Nach mehreren angespannten Tagen des Versteckspiels mit einer örtlichen feindlichen Patrouille gelang es unserem Team, eine Abholung zu arrangieren und das Gebiet unentdeckt zu verlassen."
exfiltration_border_outcome:0	"Das Team entkam, indem es im Schutze der Nacht die Grenze überquerte und einen einheimischen Führer benutzte, der ihnen half, einen Weg durch die Grenzverteidigung zu finden."
exfiltration_go_to_ground_outcome:0	"Unser Team hat sich unter die örtliche Zivilbevölkerung gemischt und schmiedet derzeit Pläne, entweder zu unseren Linien zurückzukehren oder für weitere Aufträge in der Gegend zu bleiben."
fake_intel_decoy_tanks_outcome:0	"Der Feind hat zwar einige Aufklärungsflüge in der Gegend durchgeführt, aber wir können nicht sicher sein, dass er die Köder entdeckt hat und von ihnen überzeugt war. Wir warten auf die Bestätigung aus anderen Quellen, dass sie den Köder geschluckt haben."
fake_intel_radio_deception_outcome:0	"Unsere Funker produzierten eine Menge Verkehr. Ob der Feind tatsächlich etwas davon abgehört hat, ist schwer zu sagen."
fake_intel_deliberate_leaks_outcome:0	"Wir haben dafür gesorgt, dass die feindlichen Agenten mit einer Reihe von kleinen Lecks versorgt wurden, die ein ganz anderes Bild der Realität zeichnen. Ob die andere Seite uns das abgekauft hat, bleibt abzuwarten."
fake_intel_press_releases_outcome:0	"Unsere Abteilung für Öffentlichkeitsarbeit hat dafür gesorgt, dass die Presseberichterstattung in befreundeten und neutralen Zeitungen in etwa so aussieht, wie wir es wollen."
fake_intel_utilize_double_agents_outcome:0	"Unsere Doppelagenten haben die andere Seite mit einer großzügigen Portion an Informationen versorgt - einige davon waren sogar richtig, damit der Feind ihnen weiterhin vertraut."
fake_intel_plant_evidence_outcome:0	"Die Razzia, die wir durchgeführt haben, war ein voller Erfolg, und die andere Seite hat jede Menge Beweise für unsere Operation sichergestellt. Erste Berichte deuten darauf hin, dass es bereits einige Truppenbewegungen als Reaktion darauf gegeben hat."
fake_intel_release_pow_outcome:0	"Der Offizier wurde in die Nähe mehrerer Militärlager gefahren und durfte eine Vielzahl von Einheitsabzeichen für Divisionen bemerken, die es eigentlich gar nicht gibt."
targeted_sabotage_organize_more_meetings_outcome:0	"Unser Agent ist erfolgreich in das mittlere Management des Zielunternehmens eingedrungen und hat die Prozesse aggressiv umstrukturiert, um größere Synergien zu erzielen, indem er die Zusammenarbeit mit den wichtigsten Interessengruppen fördert. Die Produktivität ist deutlich gesunken."
targeted_sabotage_destroy_bridge_outcome:0	"Das Team hat den Sprengstoff platziert und den Zünder so eingestellt, dass er mit einem vorbeifahrenden Zug zusammenfällt. Durch die Explosion und den Schaden durch den entgleisten Zug ist die gesamte Spannweite in den Fluss gestürzt."
targeted_sabotage_collapse_tunnel_outcome:0	"Nachdem das Team strukturelle Schwachstellen identifiziert hatte, platzierte es den Sprengstoff und zog sich zurück. Die Schäden am Tunnel sind zwar reparabel, aber es wird einige Zeit dauern, bis der Tunnel wieder voll nutzbar ist."
targeted_sabotage_remove_roadsigns_outcome:0	"Das Team entfernte erfolgreich Straßenschilder an einer Reihe von wichtigen Kreuzungen und ersetzte Schilder an anderen Stellen, was bei ortsunkundigen Autofahrern für große Verwirrung sorgte."
targeted_sabotage_immobilize_rolling_stock_outcome:0	"Das Team infiltrierte ein Eisenbahndepot und sabotierte erfolgreich eine Reihe von Fahrzeugen. Die Auswirkungen sollten sich erst bemerkbar machen, wenn das Fahrzeug ein paar Kilometer weit gefahren ist und auf offener Strecke liegen geblieben ist."
targeted_sabotage_burn_storage_outcome:0	"Das Team hat erfolgreich die örtlichen Lagerbereiche in Brand gesetzt und dabei Hunderte von Tonnen gelagerter Ressourcen zerstört und die Fähigkeit, einen Vorrat zu halten, stark beeinträchtigt."
targeted_sabotage_destroy_mining_equipment_outcome:0	"Dem Team gelang es, den Großteil der schweren Bergbauausrüstung zu sabotieren. Auch wenn einige der Schäden nur oberflächlich sind, werden sie dennoch zu ernsthaften Engpässen im Produktionsfluss führen."
steal_blueprints_bribe_outcome:0	"Wir haben Kontakt zu einem Ingenieur aufgenommen, der in finanziellen Schwierigkeiten steckt, und ihn davon überzeugt, sich im Gegenzug für konvertierbare Währung von einigen Geheimpapieren zu trennen."
steal_blueprints_seduction_outcome:0	"Unser Agent hat einen Ingenieur ausfindig gemacht, der persönliche Gesellschaft braucht und sehr offen über seine Arbeit gesprochen hat."
steal_blueprints_infiltrate_naval_design_office_outcome:0	"Unser Agent infiltrierte erfolgreich einen Marineausrüstungslieferanten und fertigte Kopien einer Reihe von Blaupausen für Schlüsselkomponenten an."
steal_blueprints_steal_prototype_outcome:0	"Der Prototyp wurde erfolgreich geborgen und zu einem befreundeten Flugplatz geflogen. Unsere Ingenieure nehmen ihn jetzt auseinander."
steal_blueprints_middle_manager_outcome:0	"Die Zeit, die unser Agent im Management eines kleinen Unternehmens verbracht hat, hat unser Verständnis für die feindliche Wirtschaft erheblich verbessert. Wir gehen immer noch Berichten nach, wonach die Produktivität gestiegen ist, während unser Agent dort tätig war."
capture_cyphers_bribe_outcome:0	"Unser Agent hat eine vollständige Kopie des Codebuchs von einer ungenannten Quelle im Tausch gegen einige Wertgegenstände erhalten."
capture_cyphers_raid_outcome:0	"Eine kleine Kommandoeinheit überfiel erfolgreich einen Radiosender und schaffte es, Kopien der aktuellen Chiffre zu erhalten, bevor sie zerstört werden konnte."
capture_cyphers_seduction_outcome:0	"Unserem Agenten ist es gelungen, eine Person, die im Besitz der Chiffren ist, davon zu überzeugen, sie herauszugeben."
capture_cyphers_smuggle_outcome:0	"Unserem Agenten ist es gelungen, ihren Kontakt in [From.GetNameDef] davon zu überzeugen, ihnen eine vollständige Kopie der zur Kommunikation mit ihnen verwendeten Chiffriergeräte zu schicken."
capture_cyphers_reverse_engineer_outcome:0	"Unser Agent hat erfolgreich ein Beispiel für die Verschlüsselungsmaschine des Feindes beschafft. Sie ist zwar weniger leistungsfähig als die militärischen Modelle, aber sie wird uns dennoch einen großen Einblick in ihre Operationen geben."
collaboration_government_set_up_planning_committees_outcome:0	"Das Team hat eine Reihe von Planungsgruppen eingerichtet, um die neue Regierung zu organisieren und einen reibungslosen Übergang der Macht nach Beendigung der Kampfhandlungen zu gewährleisten."
collaboration_government_train_paramilitary_forces_outcome:0	"Das Team hat eine Reihe zuverlässiger Männer, einige mit militärischer Erfahrung, in kleinen paramilitärischen Einheiten organisiert, die bei der Bewachung der Rückseite unserer vorrückenden Armee helfen werden."
collaboration_government_contact_military_officers_outcome:0	"Unser Team hat einige Kontakte zu pensionierten Militäroffizieren geknüpft, die vielleicht davon überzeugt werden können, beim Aufbau einer neuen Regierung zu helfen, solange sie dabei eine Rolle spielen können."
free_operative_free_in_transit_outcome:0	"Mit der Unterstützung einer kleinen Kommandoeinheit gelang es unserem Team, einen Hinterhalt zu legen und unseren Agenten zu bergen, während er an einen neuen Ort gebracht wurde."
free_operative_liberate_camp_outcome:0	"Wenige Stunden bevor die Gefangenen verlegt werden sollten, gelang es einer kleinen Kommandoeinheit, das Gefängnis zu befreien, in dem unser Agent gefangen gehalten wurde."
free_operative_smuggle_in_escape_gear_outcome:0	"Unser Agent erhielt das Fluchtmaterial und brach im Schutze der Nacht erfolgreich aus dem Gefängnis aus, wobei er mehrere Tage lang Suchteams und Patrouillen auswich, bevor er Kontakt aufnehmen konnte."
infiltrate_military_bribe_outcome:0	"Unser Agent hat erfolgreich einen Soldaten im aktiven Dienst davon überzeugt, für uns zu arbeiten und dafür eine beträchtliche Geldsumme zu erhalten."
infiltrate_military_seduction_outcome:0	"Unser Agent hat eine Beziehung zu einem aktiven Soldaten aufgenommen, der zu einer recht zuverlässigen Informationsquelle geworden ist."
infiltrate_military_turned_pow_outcome:0	"Unsere Abteilung für psychologische Operationen hat einen Kriegsgefangenen erfolgreich von der Gerechtigkeit unserer Sache überzeugt und ihn auf die andere Seite zurückgeschickt."
infiltrate_military_ideological_supporter_outcome:0	"Unser Agent hat Kontakt zu einer Reihe von Offizieren aufgenommen, die das derzeitige [From.GetAdjective] Regime nicht mehr unterstützen."
resistance_contacts_radio_circuits_outcome:0	"Das Team hat Kontakt zu mehreren Widerstandseinheiten aufgenommen und sie in der Funktechnik unterwiesen, wobei jedem ein Funker zur Seite gestellt wurde."
resistance_support_pidgeons_outcome:0	"Eine Reihe von Tauben wurde hinter den feindlichen Linien abgeworfen, mit Anweisungen, wie sie zu füttern und zu versorgen sind."
resistance_contacts_briefings_outcome:0	"Das Team informierte die Mitglieder des Widerstands über die geplanten Operationen in ihrem Sektor, setzte Prioritäten für das Sammeln von Informationen und arrangierte Nachschublieferungen."
resistance_support_arms_depots_outcome:0	"Das Team richtete mehrere Waffen- und Munitionsdepots an versteckten Orten ein, um die Schlagkraft des Widerstands zu verbessern."
resistance_support_distribute_weapons_outcome:0	"Das Team verteilte Waffen an eine Reihe von Widerstandszellen und wies die Mitglieder in deren Gebrauch ein."
resistance_support_organize_training_outcome:0	"Das Team hielt Kurse in grundlegendem Feldhandwerk, Wartung von Handfeuerwaffen und Sprengungen ab."
resistance_support_coordinate_groups_outcome:0	"Das Team versammelte Vertreter der größten Widerstandsgruppen, um Operationen in größerem Umfang zu koordinieren und sicherzustellen, dass die Lieferungen dorthin geleitet werden, wo sie am dringendsten benötigt werden."
heavy_water_raid_outcome_tt:0	"Wir werden versuchen, die deutsche Schwerwasseranlage zu zerstören, um einen Durchbruch in ihrem Atomforschungsprojekt zu verhindern."
bruneval_raid_outcome_tt:0	"Wir werden versuchen, Komponenten der feindlichen Radartechnologie zu sichern, um unsere eigene Forschung zu unterstützen."
capture_tito_outcome_tt:0	"Wir werden versuchen, Tito gefangen zu nehmen oder zu töten. Dies ist eine riskante Operation, die scheitern könnte."
rescue_mussolini_outcome_tt:0	"Wir werden versuchen, Mussolini zu befreien. Dies ist eine riskante Operation, die scheitern könnte."
coordinated_strike_scout_target:0	"Ziele auskundschaften"
coordinated_strike_scout_target_desc:0	"Das Team wird die Ziele auskundschaften, Fotos machen und die neuesten Informationen über den Standort von hochwertigen Zielen liefern."
coordinated_strike_scout_target_outcome:0	"Das Team lieferte nur Stunden vor Beginn des Angriffs genaue Informationen über die Lage des feindlichen Hauptquartiers und anderer wichtiger Orte."
coordinate_strike_mark_targets:0	"Ziele markieren"
coordinate_strike_mark_targets_desc:0	"Das Team verwendet vorab vereinbarte Signale und Markierungen, damit unsere Streitkräfte hochwertige Ziele leichter aufspüren können."
coordinate_strike_mark_targets_outcome:0	"Obwohl dies kurzfristig und in der Dunkelheit geschehen musste, waren die Markierungen sehr erfolgreich, um unsere Truppen zu den wichtigsten Zielen zu leiten."
coordinated_strike_sabotage_communications:0	"Kommunikation sabotieren"
coordinated_strike_sabotage_communications_desc:0	"Unser Team kappt Telefonleitungen und lockt Nachrichtenübermittler in einen Hinterhalt, um die feindliche Kommunikation in den entscheidenden ersten Stunden zu stören."
coordinated_strike_sabotage_communications_outcome:0	"Unser Team hat die feindliche Kommunikation erfolgreich unterbrochen, was zu einer langsamen Reaktion auf unseren Angriff führte."
coordinated_strike_direct_units:0	"Direkte Einheiten"
coordinated_strike_direct_units_desc:0	"Wenn der Angriff beginnt, wird unser Team unsere Einheiten per Funk zu den wichtigsten Zielen dirigieren."
coordinated_strike_direct_units_outcome:0	"Unser Team war sehr erfolgreich bei der Lenkung unserer Einheiten, wodurch der Schaden für den Feind erhöht wurde."
coordinated_strike_occupy_bridges:0	"Brücken besetzen"
coordinated_strike_occupy_bridges_desc:0	"Unser Team wird die Brücken in der Gegend einnehmen, um ihre Zerstörung zu verhindern und feindliche Gegenangriffe zu blockieren."
coordinated_strike_occupy_bridges_outcome:0	"Das Team hat erfolgreich die Wachen an einer wichtigen Brücke überwältigt und die Drähte für die Sprengladungen durchtrennt, so dass unsere Truppen ungehindert vorrücken konnten."
operation_coordinated_strike:0	"Koordinierter Angriff"
operation_coordinated_strike_desc:1	"§Die Operateure am Boden werden unsere Luftwaffe mit präzisen Bombenzielen und Flugrouten versorgen und so ohne Risiko für unsere Piloten enormen Bombenschaden anrichten."
coordinated_strike_tt:1	"Wir werden §Y[From.GetNameDef]§! durch einen Überraschungsangriff den Krieg erklären. Bei Aktivierung werden alle vorbereiteten Hafenangriffe und strategischen Bombenangriffe in der Zielregion mehrfach ausgeführt, ohne dass die Luftabwehr sie abfangen kann."
exfiltration_air_pickup_outcome_fail:0	"§Unser Pilot fand den vorgesehenen Landeplatz hell erleuchtet von den Scheinwerfern mehrerer feindlicher Luftabwehreinheiten und entschied, dass die Operation gefährdet war."
exfiltration_submarine_pickup_outcome_fail:0	"§Das U-Boot wartete mehrere Stunden lang am vereinbarten Abholort, aber es kam keine Nachricht von der Küste, dass unsere Mannschaft zum Abholen bereit war. Die Besatzung berichtete von verstärkten feindlichen Aktivitäten an der Küste während dieser Zeit."
exfiltration_border_outcome_fail:0	"§Der Führer auf der anderen Seite der Grenze wartete vergeblich auf das Erscheinen unseres Teams, bis er seinen Posten wegen einer herannahenden feindlichen Patrouille aufgeben musste."
exfiltration_go_to_ground_outcome_fail:0	"§Das Team hat es bisher versäumt, während des vereinbarten Zeitplans Kontakt aufzunehmen. Wir haben keine weiteren Informationen darüber, was mit ihnen geschehen ist.§!"
OPERATION_OUTLOOK_LABEL:0	"Ausblick"
OPERATION_RISK_HEADER:0	"§HRisk:§! $VAL|-%0$"
OPERATION_OUTCOME_HEADER:0	"§Kritischer Erfolgschancen-Multiplikator:§! $VAL|+%0$"
