lar_operative_event.7.desc:	"Heute hat [This.GetName], beauftragt mit der Abwehr ausländischer Bedrohungen, erfolgreich einen [From.GetAdjective] Geheimdienstagenten liquidiert, der innerhalb unserer Marinestreitkräfte operiert."
