operation_warsaw_uprising:0	"Der Warschauer Aufstand"
warsaw_uprising_operation_tt:0	"Lösen Sie einen nationalen Aufstand in Polen aus und schaffen Sie neue Einheiten in den dortigen Provinzen."
raid_trotskys_villa_desc:0	"Trotzki hat sich in seiner Villa verschanzt und korrespondiert mit anderen Parteimitgliedern, um gegen den Sowjetstaat zu intrigieren. Wir können ein kleines Team entsenden, um sein Haus anzugreifen und dem ein Ende zu setzen."
raid_trotskys_villa_outcome_tt:0	"Eine kleine Gruppe von Attentätern wird zu Trotzkis Villa geschickt, um zu versuchen, ihn zu töten."
raid_trotskys_villa_attack_outcome:0	"Das Team drang in die Villa ein und lieferte sich ein Feuergefecht mit Trotzkis Wachen."
murder_trotsky:0	"Diskrete Ermordung"
murder_trotsky_infiltration:0	"Gefälschte Dokumente"
murder_trotsky_infiltration_desc:0	"Mit einem gefälschten kanadischen Pass wird unser Agent zu Trotzkis Aufenthaltsort reisen und sich mit dessen Leibwächtern anfreunden."
murder_trotsky_attack_desc:0	"Unser Agent wird Trotzki von seinen Leibwächtern isolieren, indem er ihm einen Artikel zeigt, den er unter vier Augen besprechen möchte. Sobald sie allein sind, wird er Trotzki mit einem Eispickel ermorden."
murder_trotsky_attack_outcome:0	"Dem Agenten gelang es, Trotzki allein zu erwischen, und er versetzte ihm einen schweren Schlag mit einem Eispickel. Dies tötete Trotzki nicht sofort, doch er starb später im Krankenhaus."
murder_trotsky_exfiltration_outcome:0	"In der Verwirrung nach dem Angriff gelang es unserem Agenten zu fliehen, ohne dass jemand sein Gesicht genau erkennen konnte."
murder_trotsky_exfiltration_outcome_fail:0	"Unser Agent wurde von Trotzkis Leibwache festgenommen und den Behörden übergeben. Er wurde wegen Mordes angeklagt."
nuclear_espionage_outcome_tt:0	"Wir werden einen Agenten in das [FROM.GetAdjective] Atomforschungsprogramm einschleusen, der versuchen wird, technische Unterlagen weiterzugeben, die für unser eigenes Atomprojekt genutzt werden können."
SWI_boost_resistance_buff:0	"\nDie §YOperation "Widerstand stärken"§! wird deutlich effektiver."
sabotage_burn_fuel_storage_outcome:0	"Dem Team gelang es, die örtlichen Brennstoffsilos in Brand zu setzen, wodurch Hunderte Tonnen gelagerten Brennstoffs zerstört wurden und die Fähigkeit zur Aufrechterhaltung der Vorräte erheblich beeinträchtigt wurde."
sabotage_fuel_explosives:0	"Sprengstoff in der Anlage"
sabotage_fuel_explosives_desc:0	"In Zusammenarbeit mit unserem lokalen Netzwerk werden unsere Agenten mitten in der Nacht in das Treibstoffsilo eindringen, Sprengstoff an kritischen Schwachstellen anbringen und so die gesamte Treibstofflagerstätte gleichzeitig zerstören."
sabotage_burn_oil_refinery_outcome:0	"Das Team hat die örtlichen Treibstoffsilos erfolgreich in Brand gesetzt, wodurch Hunderte Tonnen gelagerten Treibstoffs zerstört und die Fähigkeit zur Aufrechterhaltung der Vorräte erheblich beeinträchtigt wurden, was die Produktion zum Erliegen brachte."
sabotage_oil_explosives:0	"Sprengstoff in der Anlage"
sabotage_oil_explosives_desc:0	"In Zusammenarbeit mit unserem lokalen Netzwerk werden unsere Agenten mitten in der Nacht in die Ölraffinerie eindringen, Sprengstoff an kritischen Schwachstellen anbringen und so die gesamte Anlage zerstören."
sabotage_burn_radar_outcome:0	"Das Team hat die Radarstation erfolgreich in Brand gesetzt, dabei kritische Komponenten zerstört und das gesamte Radarsystem für lange Zeit außer Betrieb gesetzt."
sabotage_radar_explosives:0	"Sprengstoff anbringen"
sabotage_radar_explosives_desc:0	"In Zusammenarbeit mit unserem lokalen Netzwerk werden unsere Agenten mitten in der Nacht die Radarstation infiltrieren, Sprengstoff an kritischen Schwachstellen anbringen und so die gesamte Anlage zerstören."
sabotage_burn_port_outcome:0	"Das Team hat sich erfolgreich an Bord des Schiffes geschlichen und ein Feuer gelegt. Das Wrack blockiert den Marinestützpunkt auf absehbare Zeit."
sabotage_port_explosives:0	"Sprengstoff platzieren"
sabotage_port_explosives_desc:0	"In Zusammenarbeit mit unserem lokalen Netzwerk werden unsere Agenten mitten in der Nacht in die Marinebasis eindringen, Sprengstoff an kritischen Schwachstellen platzieren und so die gesamte Basis unbrauchbar machen."
target_leader_suitcase_bomb_outcome:	"Unsere Agenten sind erfolgreich in das Armeehauptquartier eingedrungen und haben den Koffer platziert. Mithilfe eines zeitgesteuerten Sprengsatzes detonierte die Bombe genau in dem Moment, als die Offiziere ihre Besprechung begannen."
target_leader_ambush:	"Straßenüberfall"
target_leader_ambush_desc:	"In Zusammenarbeit mit unserem lokalen Netzwerk werden unsere Agenten Informationen über die genauen Routen des Feindes beschaffen. Sie werden einen Straßenüberfall vorbereiten und auf den General und seine Eskorte schießen."
target_leader_sabotage_vehicle_outcome:	"Unsere Agenten haben das Privatfahrzeug des feindlichen Anführers erfolgreich sabotiert. Laut Funkverkehr kam es kurz darauf zu einem Unfall, bei dem der General verletzt wurde."
target_attache_suitcase_bomb:	"Aktentaschenbombe"
target_attache_suitcase_bomb_desc:	"Unsere Agenten werden das Hauptquartier der feindlichen Armee infiltrieren und eine Bombe in einer Aktentasche einschmuggeln. Sie werden diese im Besprechungsraum platzieren und sie detonieren lassen, sobald die Offiziere ihre Besprechung beginnen."
target_attache_ambush_outcome:	"Durch das Blockieren der Straße mit einem Lkw gelang es unseren Agenten, den feindlichen Konvoi anzugreifen. Der Attaché wurde verwundet und entkam nur knapp mit dem Leben. Unsere Agenten mussten sich zurückziehen, bevor feindliche Verstärkung eintraf."
target_attache_sabotage_vehicle:	"Fahrzeugsabotage"
target_attache_sabotage_vehicle_desc:	"Unsere Agenten werden das Privatfahrzeug des feindlichen Attachés sabotieren und einige Schrauben entfernen. Dann werden Zeit und Geschwindigkeit den Rest erledigen."
compliance_drop_leaflets_outcome:	"Unsere Agenten haben erfolgreich Informationsflugblätter über das Land verteilt. Die Einheimischen sind entsetzt über die Handlungen der Besatzungsmächte."
compliance_uncover_propaganda:	"Propaganda widerlegen"
compliance_uncover_propaganda_desc:	"Unsere Agenten werden Radios verteilen, um die Bevölkerung über den wahren Stand des Krieges zu informieren, die feindliche Propaganda zu widerlegen und ihren Kampfeswillen zu stärken."
