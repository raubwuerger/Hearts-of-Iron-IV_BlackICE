GER_assassinate_mussolini_ww:	"Attentat auf Mussolini"
GER_assassinate_mussolini_ww_desc:	"Die Zeit ist gekommen, um dem Dreh- und Angelpunkt des [ITA.GetAdjective] Faschismus das Ende zu bereiten. Deutsche Hände werden den Führer ermorden, woraufhin die [ITA.GetAdjective] Royalisten in einer schnellen Bewegung die Macht ergreifen werden."
GER_prepare_italian_coup_ww:	"Bereiten Sie [ITA.GetAdjective] Coup vor"
GER_prepare_italian_coup_ww_desc:	"Der Sturz Italiens in den Faschismus muss rückgängig gemacht werden. Wir werden den [ITA.GetAdjective] Royalisten einen Vorschlag für einen Putsch mit unserer Unterstützung unterbreiten."
