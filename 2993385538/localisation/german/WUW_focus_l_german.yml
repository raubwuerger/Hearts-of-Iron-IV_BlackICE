wuw_HUN_enlarge_the_ganz_danubius_division_tt:	"Fügen Sie §G3§! §YNaval Dockyards§! in einem zufällig kontrollierten §YCoastal State§! hinzu"
wuw_HUN_renew_the_shipping_industry_tt:	"Fügen Sie §G3§! §YNaval Dockyards§! in einem zufällig kontrollierten §YCoastal State§! hinzu"
wuw_HUN_economic_intervention:	"Wirtschaftliche Intervention"
wuw_HUN_economic_intervention_desc:	"Wir müssen reichlich politische Mittel einsetzen, um unsere Wirtschaft zu steuern. Sie ist zwar ausreichend, aber wir können sie noch stärker und effizienter machen."
wuw_HUN_avoid_interventionalist_destablilization:	"Interventionistische Destabilisierung vermeiden"
wuw_HUN_avoid_interventionalist_destablilization_desc:	"Wir müssen das Beste aus den uns zur Verfügung stehenden Ressourcen machen. Ein gut geplanter und ausgeglichener Haushalt ist der Schlüssel zum Erfolg unserer Regierung."
wuw_HUN_secret_rearmament:	"Geheime Aufrüstung"
wuw_HUN_secret_rearmament_desc:	"Die Beschränkungen, die uns durch den Vertrag von Trianon auferlegt wurden, verbieten es uns, unsere Armee zu vergrößern. Dennoch wird das politische Klima in der Welt immer turbulenter und ein Konflikt zeichnet sich am Horizont ab. Wir können nicht wehrlos bleiben und müssen mit der Aufrüstung beginnen, auch wenn dies bedeutet, dass wir insgeheim gegen die Bestimmungen des Friedensvertrags verstoßen, der uns nach dem Großen Krieg auferlegt wurde."
wuw_HUN_forcefully_revitalize_the_industries:	"Die Industrien mit Nachdruck wiederbeleben"
wuw_HUN_forcefully_revitalize_the_industries_desc:	"Wir müssen unseren nationalen Industrien einen Schock versetzen und sie wachrütteln, damit sie sich von unserer wirtschaftlichen Depression erholen können. Das mag unserer Wirtschaft in der Zwischenzeit schaden, ist aber sicherlich eine lohnende Investition in die Zukunft unserer Nation."
wuw_HUN_reintigrate_the_imperial_railroads:	"Reintegrieren Sie die Reichsbahn"
wuw_HUN_reintigrate_the_imperial_railroads_desc:	"Die Eisenbahnnetze, die das alte österreichisch-ungarische Reich umspannen, sind seit seiner Auflösung in unabhängige Nationen zersplittert. Wir sollten auf die anderen ehemaligen Teilstaaten zugehen und eine Reintegration unserer Eisenbahnnetze vorschlagen, um die Infrastruktur insgesamt zu verbessern."
wuw_HUN_promote_increased_urbanization:	"Fördern Sie die zunehmende Urbanisierung"
wuw_HUN_promote_increased_urbanization_desc:	"Immer mehr Menschen verlassen die Dörfer und kleineren Städte, um in die großen städtischen Zentren zu ziehen und dort Arbeit in neuen Fabriken zu suchen. Auch wenn wir ihnen nicht sofort Arbeit anbieten können, können wir neue Stadtviertel bauen, um den Weg für eine spätere Expansion zu bereiten."
wuw_HUN_expand_the_ganz_muvek:	"Erweitern Sie das Ganz Müvek"
wuw_HUN_expand_the_ganz_muvek_desc:	"Die Eisen- und Maschinenfabrik Ganz und Partner sollte erweitert werden und verschiedene kleinere Industrien in sich aufnehmen, um unsere industriellen Kapazitäten besser zu zentralisieren und die Mittel besser für die industrielle Entwicklung in der Zukunft einzusetzen."
wuw_HUN_devalue_the_pengo:	"Aufwertung der Pengö"
wuw_HUN_devalue_the_pengo_desc:	"Der Pengö befindet sich derzeit in einer sehr schlechten Verfassung, da er einer der schlimmsten Fälle von Hyperinflation in der Geschichte ist. Wir müssen drastische Maßnahmen ergreifen, um die Währung aufzuwerten und zu stärken, auch wenn sie völlig unpopulär sind."
wuw_HUN_announce_the_gyor_program:	"Kündigen Sie das Györi-Programm an"
wuw_HUN_announce_the_gyor_program_desc:	"Unser Militär ist gefährlich schwach und wir müssen unbedingt seine Größe und Kampffähigkeit erhöhen. Dazu müssen wir unsere Industrie erheblich stärken, um mit den wachsenden Anforderungen an die Ausrüstung Schritt zu halten. Das auf fünf Jahre angelegte Györi-Programm wird die Ausgaben der Regierung nicht nur für das Militär selbst, sondern auch für untergeordnete Bereiche wie Industrie, Landwirtschaft, Infrastruktur und Bildung erhöhen."
wuw_HUN_enlarge_the_ganz_danubius_division:	"Vergrößerung der Ganz Danubius Division"
wuw_HUN_enlarge_the_ganz_danubius_division_desc:	"Die Ganz Danubius Division der Ganz-Werke in Budapest konstruiert und repariert zivile Schiffe und Schiffe der Kriegsmarine. Wir sollten ihre Aufgaben ausweiten und für sie neue Fabriken an unserer neu gewonnenen Küstenlinie errichten."
wuw_HUN_support_for_our_finnish_brothers:	"Unterstützung für unsere finnischen Brüder"
wuw_HUN_support_for_our_finnish_brothers_desc:	"Erst vor etwa hundert Jahren wurde allgemein akzeptiert, dass unsere Abstammung mit der der Finnen verflochten ist, aber viele in unserem Land sehen sie jetzt als unsere Blutsbrüder an. Jetzt, da sie sich im Krieg befinden, müssen wir ihnen Freiwillige und Ausrüstung schicken, um sie in ihrem Kampf zu unterstützen."
wuw_HUN_support_for_our_finnish_brothers_tt:	"Die Finnen müssen eine Regierung haben, die der unseren gefügig ist."
wuw_HUN_undercover_air_maneuvers:	"Verdeckte Luftmanöver"
wuw_HUN_undercover_air_maneuvers_desc:	"Wir müssen reichlich Mittel für die Ausarbeitung neuer Theorien zur Luftkriegsführung aufwenden. Wenn wir in den Krieg ziehen, werden die dabei entwickelten Theorien von unschätzbarem Wert sein, und das verdeckte Training wird unsere Piloten im Kampf besser machen."
wuw_HUN_hold_war_games:	"Halten Sie Kriegsspiele ab"
wuw_HUN_hold_war_games_desc:	"Indem wir kleine Kriegsspiele durchführen, können wir Schwachstellen in unserer derzeitigen Militärstruktur aufdecken und die gewonnenen Erfahrungen nutzen, um Mängel zu beheben."
wuw_HUN_negotiate_the_restrictions:	"Verhandeln Sie die Beschränkungen"
wuw_HUN_negotiate_the_restrictions_desc:	"Eine heimliche Aufrüstung in kleinem Maßstab wird nicht ausreichen. Wir müssen auf unsere Nachbarn zugehen und um eine Aufhebung des Vertrags bitten, der uns nach dem Ersten Weltkrieg auferlegt wurde. Ungarn hat ein gleiches Recht auf Aufrüstung."
wuw_HUN_reinstate_the_navy:	"Stellen Sie das Haditengerészet wieder her"
wuw_HUN_reinstate_the_navy_desc:	"Nachdem wir eine Küstenlinie zurückgewonnen haben, müssen wir unsere Anstrengungen auf den Wiederaufbau einer Flotte konzentrieren, die einer Großmacht würdig ist."
wuw_HUN_make_the_magyar_legiero_known:	"Machen Sie die Magyar Légierö bekannt"
wuw_HUN_make_the_magyar_legiero_known_desc:	"Die Magyar Légierő ist die Luftwaffenabteilung unseres Militärs. Es war uns verboten, Militärflugzeuge zu besitzen. Dennoch wurde unter dem Deckmantel ziviler Flugvereine nach und nach eine geheime Luftwaffe aufgebaut. Jetzt, da neue Verträge in Kraft sind, können wir ihre Existenz der Welt bekannt geben."
wuw_HUN_initiate_army_maneuvers:	"Armee-Manöver einleiten"
wuw_HUN_initiate_army_maneuvers_desc:	"Unsere Armee muss für mögliche künftige bewaffnete Konflikte wieder in Form gebracht werden. Wir werden sie auf Manöver schicken, um neue Taktiken und Strategien zu entwickeln."
wuw_HUN_invest_in_ludovica_academy:	"In die Ludovica-Akademie investieren"
wuw_HUN_invest_in_ludovica_academy_desc:	"Die Königlich Ungarische Ludovica-Verteidigungsakademie ist die Ausbildungsstätte für unsere Offiziersanwärter. Sie sollte ausgebaut werden, damit unsere Generäle alle besser ausgebildet werden können."
wuw_HUN_expand_the_diosgyor_machinery_factory:	"Erweitern Sie die Diósgyör-Maschinenfabrik"
wuw_HUN_expand_the_diosgyor_machinery_factory_desc:	"Die Diósgyőri Gépgyár sollte auf weitere Sektoren ausgeweitet werden, um eine schnellere Produktion von Industriematerialien und Werkzeugen, Motoren und Motorrädern und vielem mehr zu ermöglichen."
wuw_HUN_manred_weiss_steel_and_metal_works:	"Manfréd Weiss Stahl- und Metallwerk"
wuw_HUN_manred_weiss_steel_and_metal_works_desc:	"Das Stahl- und Metallwerk Manfréd Weiss, das gemeinhin als Csepel Művek bezeichnet wird, weist ein großes Potenzial auf und muss so weit wie möglich ausgebaut werden, um die weitere Entwicklung unserer Nation zu unterstützen."
wuw_HUN_expand_the_hungarian_academy_of_sciences:	"Die Ungarische Akademie der Wissenschaften ausbauen"
wuw_HUN_expand_the_hungarian_academy_of_sciences_desc:	"Die Ungarische Akademie der Wissenschaften ist die wichtigste und prestigeträchtigste Gelehrtengesellschaft von [ROOT.GetName]. Ihre Hauptaufgaben sind die Pflege der Wissenschaft, die Verbreitung wissenschaftlicher Erkenntnisse, die Unterstützung von Forschung und Entwicklung und die Vertretung der [ROOT.GetAdjective] Wissenschaft im Inland und in der Welt."
wuw_HUN_expand_the_lignite_industry:	"Die Braunkohleindustrie ausbauen"
wuw_HUN_expand_the_lignite_industry_desc:	"Unsere Braunkohleindustrie ist groß, aber noch relativ unterentwickelt. Wir sollten neue Minen und Fabriken erschließen, damit unsere natürlichen Ressourcen nicht vergeudet werden."
wuw_HUN_tap_newfound_oil_deposits:	"Erschließen Sie neu entdeckte Ölvorkommen"
wuw_HUN_tap_newfound_oil_deposits_desc:	"Viele kleinere Ölquellen wurden in unserem Land entdeckt, zum Beispiel von der Magyar-Amerikai Olajipari Rt, auch bekannt als MAORT. Besonders hervorzuheben ist der Ölfund von Budafapusztas, der so schnell wie möglich ausgebeutet werden sollte."
wuw_HUN_hungarian_autarky:	"[ROOT.GetAdjective] Autarkie"
wuw_HUN_hungarian_autarky_desc:	"Wir sind viel zu abhängig von ausländischen Ölquellen. Wir sollten den deutschen Bemühungen bei der Entwicklung von synthetischem Öl nacheifern und unsere Wirtschaft stärken, damit wir auf eigenen Füßen stehen können."
wuw_HUN_invite_foreign_investors:	"Ausländische Investoren einladen"
wuw_HUN_invite_foreign_investors_desc:	"[ROOT.GetNameDefCap] liegt im Herzen Osteuropas, und wir könnten unsere zentrale Lage gut nutzen, um ausländische Investoren anzuziehen, die an der Verbesserung unserer Infrastruktur und Industrie interessiert sind."
wuw_HUN_hungarian_tradition:	"[ROOT.GetAdjective] Tradition"
wuw_HUN_hungarian_tradition_desc:	"[ROOT.GetAdjective] Tradition ist stark in der Landwirtschaft in der pannonischen Steppe verwurzelt, und wir müssen uns bemühen, diese Traditionen zu bewahren und unsere Erträge zu steigern, um uns weiter zu entwickeln."
wuw_HUN_magyar_allamvasutak:	"Magyar Államvasutak"
wuw_HUN_magyar_allamvasutak_desc:	"Unsere staatliche Eisenbahngesellschaft, die MÁV, sollte in ihren Aufgaben erweitert werden, damit sie alle Züge im Lande betreiben kann. Dies wird uns eine bessere Kontrolle über unsere Gleise ermöglichen und eine effizientere Nutzung unseres Schienennetzes erlauben."
wuw_HUN_expand_the_aluminum_industry:	"Die Aluminiumindustrie ausbauen"
wuw_HUN_expand_the_aluminum_industry_desc:	"Wir benötigen alle verfügbaren Ressourcen, sowohl für den Export als auch für den heimischen Gebrauch. Unsere Aluminiumindustrie ist zwar bereits expansiv, hat aber noch Raum für weitere Verbesserungen, und wir sollten die Ressourcen sofort darauf ausrichten."
wuw_HUN_budapest_university_of_technology_and_economics:	"Erweitern Sie die Technische Universität von Budapest"
wuw_HUN_budapest_university_of_technology_and_economics_desc:	"Wir brauchen mehr kluge Köpfe, um bahnbrechende Entdeckungen zu machen, die uns in den kommenden Konflikten helfen werden. Durch den Ausbau der Universität unserer Hauptstadt können wir den Pool an qualifizierten Ingenieuren und Wissenschaftlern für unsere Militärindustrie vergrößern."
wuw_HUN_the_matyasfold_fighter_factory:	"Die Kampfflugzeugfabrik Mátyásföld"
wuw_HUN_the_matyasfold_fighter_factory_desc:	"Weiss Manfréd Acél- és Fémművek sollte in Mátyásföld, Budapest, eine neue Flugzeugproduktionsstätte eröffnen, in der die von ihnen selbst entwickelten Kampfflugzeugmodelle hergestellt werden."
wuw_HUN_expand_on_the_weiss_wm_16:	"Die Weiss WM-16 ausbauen"
wuw_HUN_expand_on_the_weiss_wm_16_desc:	"Wir sollten die Weiss WM-16 Budapest Modelle ausbauen, um einen neuen technologischen Durchbruch für unsere Bomberproduktion zu erreichen."
wuw_HUN_develop_the_weiss_wm_21_solyom:	"Entwickeln Sie den Weiss WM-21 Sólyom"
wuw_HUN_develop_the_weiss_wm_21_solyom_desc:	"Wir sollten die Lehren aus unseren früheren Misserfolgen bei der Flugzeugentwicklung ziehen und den leichten Bomber Weiss WM-21 Sólyom entwickeln. Dieser Falke wird in der Lage sein, unsere Feinde vom Himmel zu holen, ganz gleich, wo sie stehen."
wuw_HUN_weiss_manfred_wm_23_ezust_nyil:	"Weiss Manfréd WM-23 Ezüst Nyíl"
wuw_HUN_weiss_manfred_wm_23_ezust_nyil_desc:	"Wir müssen so schnell wie möglich ein neues Kampfflugzeug entwickeln. Unsere Wissenschaftler bei Weiss Manfréd Acél- és Fémművek haben Blaupausen für den so genannten Ezüst Nyíl, den Silberpfeil, entwickelt und warten auf die Bestätigung, mit der Produktion zu beginnen."
wuw_HUN_establish_the_mavag_aircraft_factory:	"Gründung der MÁVAG-Flugzeugfabrik"
wuw_HUN_establish_the_mavag_aircraft_factory_desc:	"István Horthy wird mit der MÁVAG zusammenarbeiten, um neue Fabriken für die Produktion von Flugzeugen zu errichten, und wird umgehend mit der Lieferung neuer Technologie an die Magyar Légierő beginnen."
wuw_HUN_the_mavag_heja:	"Die MÁVAG Héja"
wuw_HUN_the_mavag_heja_desc:	"Die Flugzeugabteilung der MÁVAG hat einen neuen Prototyp entwickelt, den sie Hawk genannt hat und der auf dem italienischen Modell Reggiane Re.2000 basiert. Wir sollten sie dabei unterstützen, jetzt so viele Exemplare dieses neuen Flugzeugmodells wie möglich zu produzieren."
wuw_HUN_repulo_muszaki_intezet:	"Repülö Muszaki Intézet"
wuw_HUN_repulo_muszaki_intezet_desc:	"Die Luft ist zu einem neuen Aspekt der Kriegsführung geworden, dessen Bedeutung von vielen unterschätzt wird. Wir müssen lernen, diese neue Dimension zu beherrschen, und Ressourcen für die Entwicklung neuer Doktrinen und Ausrüstungen bereitstellen, die uns dies ermöglichen."
wuw_HUN_develop_laszlo_vargas_design:	"Entwickeln Sie den Entwurf von László Varga"
wuw_HUN_develop_laszlo_vargas_design_desc:	"Unser großer Luftfahrtwissenschaftler László Varga hat viele einheimische Entwürfe für unser Militär entwickelt, darunter auch den Prototyp Varga RMI-1 X/H. Wir sollten seine Aktivitäten weiter finanzieren, damit unsere Entwicklung und unser Fortschritt nicht auf der Stelle treten."
wuw_HUN_the_szekesfehervar_sosto_plant:	"Werk Székesfehérvár-Sóstó"
wuw_HUN_the_szekesfehervar_sosto_plant_desc:	"Wir sollten ein neues Flugzeugwerk eröffnen, das vom Aeronautic Technology Institute kontrolliert wird und die von ihm entworfenen Flugzeuge produzieren und testen kann, um sicherzustellen, dass sie ordnungsgemäß funktionieren."
wuw_HUN_joint_air_development:	"Gemeinsame Entwicklung von Flugzeugen"
wuw_HUN_joint_air_development_desc:	"Das beste Mittel zur Entwicklung neuer Flugzeugmodelle ist die Zusammenarbeit mit unseren Verbündeten. Wenn wir die klügsten Köpfe aller unserer Nationen zusammenbringen, werden wir die besten Ergebnisse erzielen."
wuw_HUN_the_arado_ar_96:	"Die Arado Ar 96"
wuw_HUN_the_arado_ar_96_desc:	"Wir sollten die Produktion des Flugzeugherstellers Arado Flugzeugwerke [GER.GetAdjective] in Lizenz nehmen und im Gegenzug unseren Schwerpunkt bei der Produktion und Nutzung von Flugzeugen auf die Luftaufklärung verlagern."
wuw_HUN_extensive_licensing_programs:	"Umfassendes Lizenzierungsprogramm"
wuw_HUN_extensive_licensing_programs_desc:	"Ausländische Luftstreitkräfte haben bereits bewiesen, dass sie über bewährte Konstruktionen von sehr hoher Qualität verfügen. Anstatt das Schicksal herauszufordern und uns auf unser noch nicht vorhandenes Luftfahrt-Know-how zu verlassen, sollten wir darum bitten, diese ausländischen Modelle in Lizenz produzieren zu dürfen."
wuw_HUN_allied_manufacturing_programs:	"Verbündete Fertigungsprogramme"
wuw_HUN_allied_manufacturing_programs_desc:	"Unsere Industrie mag für sich genommen stark sein, aber sie kann mit keiner der Weltmächte konkurrieren. Wir sollten daher neue Flugzeuge in verbündeten Einrichtungen produzieren lassen, die wir im Gegenzug mit Pengö bezahlen."
wuw_HUN_danuvia_submachine_guns:	"Danuvia-Maschinenpistolen"
wuw_HUN_danuvia_submachine_guns_desc:	"Unsere Infanterie benötigt gute Waffen, um ihre Effektivität zu verbessern. Die ersten Prototypen der Danuvia 43M haben sich in Tests gut bewährt. Wenn wir die Mittel für ihre Entwicklung aufstocken, können wir vielleicht bald mit der Massenproduktion der Waffe beginnen."
wuw_HUN_form_the_gyorshadtest:	"Bilden Sie den Gyorshadtest"
wuw_HUN_form_the_gyorshadtest_desc:	"Wir sollten uns bemühen, ein Schnelles Korps zu bilden, eine moderne und gut ausgerüstete mechanisierte Einheit, die feindliche Bataillone im Kampf übertreffen kann. Zu diesem Zweck werden zwei solche Gyorshadtest-Divisionen gebildet, eine unter Generalmajor Jenö Major und die andere unter Generalmajor Ferenc Bisza."
wuw_HUN_establish_the_mavag_army_division:	"Aufstellung der MÁVAG Armee-Division"
wuw_HUN_establish_the_mavag_army_division_desc:	"Die Königlichen Ungarischen Staatlichen Eisen-, Stahl- und Maschinenfabriken, auch bekannt unter ihrem Akronym MÁVAG, erfüllen viele verschiedene Aufgaben und versorgen unser Militär mit einer Vielzahl von Ausrüstungsgegenständen. Wir sollten einen weiteren Ausbau ihrer Anlagen beantragen, damit sie mit der Produktion von selbstfahrenden Sturmgeschützen und Luftabwehrpanzern beginnen können."
wuw_HUN_doctrinal_studies:	"Doktrinale Studien"
wuw_HUN_doctrinal_studies_desc:	"Wir haben durch den Austausch von Offizieren und Strategiesitzungen mit unseren Verbündeten sowie durch unseren militärischen Nachrichtendienst viel gelernt. Die Kombination solch unterschiedlicher Standpunkte hat uns an den Rand eines doktrinären Durchbruchs gebracht."
wuw_HUN_award_military_promotions:	"Militärische Beförderungen vergeben"
wuw_HUN_award_military_promotions_desc:	"Es gibt wirklich viele großartige Männer im [ROOT.GetAdjective] Militär, aber viele von ihnen haben derzeit keine Positionen inne, die ihrem verdienten Rang entsprechen. Wir sollten daher Maßnahmen ergreifen, um diejenigen zu befördern, die wir für geeignet halten, und unsere Armee stärker zu machen, als sie heute ist."
wuw_HUN_magyar_kiralyi_csendorseg:	"Magyar Királyi Csendörség"
wuw_HUN_magyar_kiralyi_csendorseg_desc:	"Wir sollten uns bemühen, die [ROOT.GetAdjective] Gendarmerie auszubauen und ihr mehr Autonomie zuzugestehen. Wir sollten ihr mehr Handlungsfreiheit bei der Niederschlagung von Aufständen und der Bekämpfung von feindlichen Plänklern geben."
wuw_HUN_legacy_of_the_black_legion:	"Das Erbe der Schwarzen Armee"
wuw_HUN_legacy_of_the_black_legion_desc:	"Damit unsere Kavallerie und Militärpolizei besser funktionieren, sollten wir sie nach dem Vorbild der Schwarzen Armee unseres legendären Königs Matthias Corvinus ausbilden, die wiederum vom großen Militär des römischen Generals und Kaisers Julius Caesars Legionen inspiriert wurde."
wuw_HUN_light_infantry_divisions_doctrine:	"Doktrin der leichten Infanteriedivisionen"
wuw_HUN_light_infantry_divisions_doctrine_desc:	"Wir müssen mit der begrenzten Anzahl von Soldaten auskommen, die uns zur Verfügung stehen. Wenn wir mehr Divisionen wollen, müssen sie zwangsläufig kleiner sein. Leichte Infanteriedivisionen bieten eine optimale Mischung aus Schlagkraft und Größe, und wir werden sie zum Rückgrat unseres Militärs machen."
wuw_HUN_szent_laszlo_infantry_division:	"Szent László-Infanteriedivision"
wuw_HUN_szent_laszlo_infantry_division_desc:	"Wir sollten uns bemühen, neue Infanterieeinheiten zu bilden, um unser Heimatland angemessen gegen die herannahende Bedrohung zu verteidigen. Wir können diese neue Infanteriedivision nach dem heiligen Ladislaus benennen, dem König von Ungarn von 1077 bis 1095 und Schutzpatron der Militärs und Exilanten."
wuw_HUN_quantity_over_quality:	"Qualität statt Quantität"
wuw_HUN_quantity_over_quality_desc:	"Auch wenn unsere Armee nicht so groß ist, kann sie dennoch stark sein und dies ausgleichen. Der Weg dazu ist, unsere technologische Überlegenheit gegenüber unseren Feinden zu verbessern und hochmoderne Einheiten einzusetzen, die feindliche Einheiten, die ihnen zahlenmäßig weit überlegen sind, schlagen können."
wuw_HUN_expand_the_army:	"Erweitern Sie die Honvédség"
wuw_HUN_expand_the_army_desc:	"Unser derzeitiges stehendes Heer, die Honvéd, ist viel zu klein, um eine echte Chance gegen unsere Nachbarn zu haben. Wir müssen daher versuchen, die Armee so schnell wie möglich zu vergrößern."
wuw_HUN_the_botond:	"Der Botond"
wuw_HUN_the_botond_desc:	"Um unseren Versorgungs- und Transportbedarf angemessen zu decken, benötigen wir eine neue Form von Lastwagen. Erste Entwürfe des Rába 38M Botond haben sich in Versuchen als erfolgreich erwiesen, und mit den entsprechenden Ressourcen können wir das Design fertigstellen und mit der Produktion beginnen."
wuw_HUN_the_turan:	"Der Turán"
wuw_HUN_the_turan_desc:	"Auf der Grundlage des Prototyps des mittleren Panzers Škoda T-21 können wir einen eigenen mittleren Panzer konstruieren, der selbst die am stärksten befestigten feindlichen Linien durchbrechen kann. Wir werden diesem neuen Projekt einen Namen geben, um den ungarischen Turanismus zu fördern und ihn in der ganzen Welt bekannt zu machen."
wuw_HUN_assault_gun_focus:	"Sturmgeschütz-Fokus"
wuw_HUN_assault_gun_focus_desc:	"Anstatt uns auf vollwertige Panzer zu konzentrieren, werden wir uns stattdessen auf Sturmgeschütze verlassen, um unserer Infanterie bei Durchbrüchen Luft zu verschaffen, da dies eine kostengünstigere Alternative ist."
wuw_HUN_the_toldi:	"Der Toldi"
wuw_HUN_the_toldi_desc:	"Auf der Basis des schwedischen Landsverk L-60 können wir einen eigenen leichten Panzer konstruieren, der in der Lage ist, große Mengen von Feinden schnell einzukesseln. Wir werden diesen neuen Panzer nach dem ungarischen Ritter Miklós Toldi aus dem 14. Jahrhundert benennen."
wuw_HUN_invest_in_the_special_forces:	"Investieren Sie in die Spezialeinheiten"
wuw_HUN_invest_in_the_special_forces_desc:	"Unsere Armee hat jetzt die Männer, die sie braucht, um einen ordentlichen Kampf zu führen, aber es wäre von großem Vorteil, wenn wir unsere neu gewonnenen Soldaten so gut wie möglich ausbilden würden, indem wir in neue Programme für Spezialkräfte investieren."
wuw_HUN_construct_the_arpad_line:	"Errichten Sie die Árpád-Linie"
wuw_HUN_construct_the_arpad_line_desc:	"Um unser Volk vor den Bedrohungen im Osten zu schützen, müssen wir in den transsylvanischen Bergen eine ausgedehnte Linie von Festungsanlagen errichten. Sie sollen nach dem großen Großfürsten Árpád benannt werden, dem Oberhaupt der Konföderation der magyarischen Stämme an der Wende vom 9. zum 10. Jahrhundert."
wuw_HUN_transylvanian_mountaineers:	"Siebenbürgische Bergbewohner"
wuw_HUN_transylvanian_mountaineers_desc:	"Die siebenbürgischen Berge gehören zu den höchsten in unserer Region und sind der perfekte Ort für die Ausbildung unserer Gebirgsjäger."
wuw_HUN_expand_the_arpad_line:	"Erweitern Sie die Árpád-Linie"
wuw_HUN_expand_the_arpad_line_available_tt:	"Sie können mindestens 2 §YLand Forts§! entlang der nördlichen und östlichen Grenzen von §Y[73.GetName]§! und §Y[76.GetName]§! errichten."
wuw_HUN_expand_the_arpad_line_desc:	"Die Árpád-Linie hat sich bisher als effektiv erwiesen, aber wenn wir wirklich in der Lage sein wollen, die Flut der Angriffe aufzuhalten, müssen wir sie ausweiten, nicht nur in der Größe, sondern auch in der Reichweite."
wuw_HUN_construct_the_szeretfalva_deda_railway_line:	"Die Eisenbahnlinie Szeretfalva-Déda"
wuw_HUN_construct_the_szeretfalva_deda_railway_line_desc:	"Um unsere Grenztruppen, die die Árpád-Linie in den transsylvanischen Bergen besetzen, besser versorgen zu können, müssen wir neue Eisenbahnlinien und Nachschubknotenpunkte bauen, damit unsere Truppen unsere Bevölkerung besser schützen können."
wuw_HUN_the_szekel_command:	"Das Szekler-Kommando"
wuw_HUN_the_szekel_command_desc:	"Mit unserer jüngsten Rückeroberung von [76.GetName] und damit des Szeklerlandes haben wir die Möglichkeit, unsere Szekler, Ungarn, die Experten im Navigieren und Kämpfen in den Bergen sind, als Elitetruppen in unseren Streitkräften einzusetzen."
wuw_HUN_renew_the_shipping_industry:	"Erneuern Sie die Schifffahrtsindustrie"
wuw_HUN_renew_the_shipping_industry_desc:	"Da wir die Wiederherstellung unserer Grenzen fest im Blick haben, müssen wir mit dem Aufbau einer Mittelmeerflotte beginnen, die es mit unserem früheren Ruhm aufnehmen kann."
wuw_HUN_embrace_navy_traditions:	"Umarmung der Marine-Traditionen"
wuw_HUN_embrace_navy_traditions_desc:	"Wir können keine Zeit damit verschwenden, mit neuen und unbewährten Technologien zu experimentieren. Wir werden uns an bewährte und erprobte Designs aus den Tagen des alten Imperiums halten."
wuw_HUN_a_reformed_navy:	"Eine reformierte Marine"
wuw_HUN_a_reformed_navy_desc:	"Es macht wenig Sinn, eine Marine aufzubauen, die auf veralteten Ideen beruht. Wir haben die Möglichkeit erhalten, eine neue Marine von Grund auf zu schaffen, ohne den Ballast der alten. Wir sollten sie nutzen, um die modernste und fähigste Marine aufzubauen, die wir können."
wuw_HUN_invest_in_destroyer_models:	"Investieren Sie in Zerstörer-Modelle"
wuw_HUN_invest_in_destroyer_models_desc:	"Zerstörer sind ein wichtiger, aber oft übersehener Teil der Flotte. Zusammen mit den niedrigen Kosten sind sie ein guter Start für jedes Flottenerweiterungsprogramm."
wuw_HUN_cruiser_investments:	"Investitionen in Kreuzer"
wuw_HUN_cruiser_investments_desc:	"Selbst die stärkste Streitmacht ist nutzlos, wenn sie den Feind nicht finden oder sich nicht gegen Flugzeuge schützen kann. Die Entwicklung neuer leichter und schwerer Kreuzer hilft uns, aus einer Ansammlung von Schiffen eine echte Flotte zu machen."
wuw_HUN_wolfs_of_the_sea:	"Wölfe der Meere"
wuw_HUN_wolfs_of_the_sea_desc:	"U-Boote waren im letzten Krieg nahe dran, die mächtigste Marine des Planeten zu schlagen. Wir können als moderne Marine nicht ernst genommen werden, wenn wir nicht über eigene U-Boote verfügen."
wuw_HUN_bringing_the_air_battle_to_the_seas:	"Die Luftschlacht auf die Meere bringen"
wuw_HUN_bringing_the_air_battle_to_the_seas_desc:	"Das Schlachtschiff ist ein Relikt aus einer längst vergangenen Zeit. Die Zukunft der Seekriegsführung sind Flugzeugträger und Flugzeuge. Wir werden bei dieser Entwicklung an vorderster Front stehen."
wuw_HUN_capital_ship_efforts:	"Bemühungen um Großkampfschiffe"
wuw_HUN_capital_ship_efforts_desc:	"Das Herzstück einer Marine ist das Schlachtschiff. Wir müssen die verlorene Zeit wieder aufholen und so schnell wie möglich mit dem Bau neuer Schiffe beginnen."
wuw_HUN_a_new_pride_of_the_fleet:	"Ein neuer Stolz der Flotte"
wuw_HUN_a_new_pride_of_the_fleet_desc:	"Die Geschichte unserer Marinetradition ist eine Geschichte der Prüfungen, des Leids und des Verrats. In dem Bemühen, den Stolz auf unser Erbe wiederherzustellen, schlagen unsere Admiräle ein neues Flaggschiff vor, das die ganze Nation inspirieren soll."
wuw_HUN_degauss_ship_hulls:	"Schiffsrümpfe entmagnetisieren"
wuw_HUN_degauss_ship_hulls_desc:	"Wir werden damit beginnen, unsere Schiffsrümpfe zu entmagnetisieren, um ihre magnetische Signatur zu verringern. Dies schützt sie vor magnetischen Minen und reduziert das elektronische Profil der Schiffe."
wuw_HUN_continue_the_regency:	"Die Regentschaft fortsetzen"
wuw_HUN_continue_the_regency_desc:	"Seit Admiral Horthy während der Bürgerkriege, die unser Land in den frühen 20er Jahren heimsuchten, das Kommando übernommen hat, ist [HUN.GetNameDef] wieder auf Kurs, trotz der Auswirkungen, die der Crash an der Wall Street auf unser Land hatte. Die Regentschaft muss fortgesetzt werden, wenn wir weiterhin Wohlstand wünschen."
wuw_HUN_strengthen_horthys_reign:	"Horthys Regentschaft stärken"
wuw_HUN_strengthen_horthys_reign_desc:	"Auch wenn unser faschistischer Premierminister andere Vorstellungen hat, ist der beste Weg, den Frieden im Land zu bewahren und [ROOT.GetNameDef] zu seinem früheren Glanz zurückzuführen, dass der Regent seine Kontrolle festigt und persönlich dafür sorgt, dass sein Wille ausgeführt wird."
wuw_HUN_pass_statute_xix:	"Statut XIX verabschieden"
wuw_HUN_pass_statute_xix_desc:	"Da [ROOT.GetLeader] kränklich ist, wäre es von Vorteil, Statut XIX zu verabschieden, das die Einsetzung eines Nationalen Rates vorsieht, wenn der Sitz des Regenten vakant ist. Dies ermöglicht uns die Schaffung eines Országtanács, der einen neuen Regenten auswählt, sobald unser derzeitiger verstorben ist. Manche mögen dies als Versuch einer Dynastiegründung ansehen, aber wir sind damit einverstanden."
wuw_HUN_restrict_voting_rights:	"Stimmrecht einschränken"
wuw_HUN_restrict_voting_rights_desc:	"Um dem wachsenden kommunistischen und linksdemokratischen Einfluss einen Riegel vorzuschieben, wird es notwendig sein, das Wahlrecht einzuschränken, die Anforderungen zu verschärfen und sicherzustellen, dass nur diejenigen an den Wahlen teilnehmen dürfen, die das Beste für unser Land im Sinn haben."
wuw_HUN_renounce_the_treaty_of_trianon:	"Den Vertrag von Trianon aufkündigen"
wuw_HUN_renounce_the_treaty_of_trianon_desc:	"Die Ungerechtigkeit, die unserer Nation am Ende des Ersten Weltkriegs auferlegt wurde, indem zwei Drittel des Territoriums und der Bevölkerung unserer einstmals großen Nation weggerissen wurden, übertrifft die Schande, die Deutschland durch den Vertrag von Versailles widerfahren ist, und muss rückgängig gemacht werden."
wuw_HUN_renew_the_rome_protocols:	"Erneuern Sie die Römischen Protokolle"
wuw_HUN_renew_the_rome_protocols_desc:	"Angesichts des anhaltenden Revisionismus von [GER.GetNameDef] müssen wir die Römischen Protokolle erneuern, die 1934 ausgearbeitet und unterzeichnet wurden. Die Vereinbarungen würden nicht nur dazu dienen, die Bedrohungen durch [GER.GetAdjective] und [YUG.GetAdjective] weiter zu isolieren, sondern auch als möglicher Vorläufer einer tatsächlichen Allianz."
wuw_HUN_join_the_axis:	"Beitritt zur Achse"
wuw_HUN_join_the_axis_desc:	"Da unsere Wirtschaft bereits so stark von den Deutschen abhängig ist, ist es nur logisch, dass wir ihnen in den Krieg folgen werden. Wir werden sie um einen formellen Beitritt zum Bündnis der Achsenmächte bitten."
HUN_can_not_trust_germany_again_flag:	"Deutschland hat uns zu seinem eigenen Vorteil ausgebeutet"
wuw_HUN_an_alliance_with_italy:	"Bündnis mit [ITA.GetNameDef]"
wuw_HUN_an_alliance_with_italy_desc:	"Die ersten Annäherungsversuche, die in den Protokollen von Rom gemacht wurden, können nun ausgeweitet werden. Wir werden eine Delegation nach Italien entsenden, um ein verbindliches Abkommen über eine umfassende militärische Zusammenarbeit zu erörtern, sowohl defensiv als auch offensiv."
wuw_HUN_joint_aluminum_mining_company:	"Gemeinsame Aluminium-Bergbaugesellschaft"
wuw_HUN_joint_aluminum_mining_company_desc:	"Da Aluminium ein wesentlicher Bestandteil der modernen Kriegsindustrie ist, könnten wir leicht [GER.GetAdjective] Unterstützung für den Ausbau der Minen im Norden unseres Landes erhalten."
wuw_HUN_reestablish_the_rongyos_garda:	"Wiedereinführung der Rongyos Gárda"
wuw_HUN_reestablish_the_rongyos_garda_desc:	"Die paramilitärische Lumpengarde wurde erstmals 1921 gegründet, um den Vertrag von Trianon zu bekämpfen. Sie half uns im Kampf gegen die Österreicher im Lajtabánság und kämpfte während der Bürgerkriege an der Seite von Horthys Nationaler Armee. Ihr Hauptmann Pál Prónay steht jetzt wieder bereit, uns zu helfen, und so würden wir von der Wiedergründung einer solchen Gruppe profitieren."
wuw_HUN_the_hungarian_life_and_renewal_party:	"Parteien des ungarischen Lebens und der Erneuerung "
wuw_HUN_the_hungarian_life_and_renewal_party_desc:	"Um die Gesellschaft besser im Griff zu haben, sollten wir unseren Premierminister veranlassen, neue politische Parteien zu gründen, die als Vorhut gegen die radikale Linke fungieren. "
wuw_HUN_act_of_defense:	"Akt der Verteidigung"
wuw_HUN_act_of_defense_desc:	"Während sich die Welt aufheizt, braut sich ein Konflikt zusammen. Wir müssen uns auf den Sturm vorbereiten, der kommen wird. Es ist an der Zeit, dass wir neue Gesetze erlassen, die uns helfen, unser Land zu verteidigen, wenn nötig bis zum letzten Mann!"
wuw_HUN_seek_german_contracts:	"Suchen Sie [GER.GetAdjective]Verträge"
wuw_HUN_seek_german_contracts_desc:	"Unsere Industrie wächst wieder, aber wenn wir in der Lage sein wollen, alle benötigten Ausrüstungen zu produzieren, wäre es von Vorteil, [GER.GetAdjective] Architekten und Baufirmen mit dem Bau neuer Anlagen zu beauftragen."
wuw_HUN_license_fiat_tankettes:	"Fiat-Tanketten"
wuw_HUN_license_fiat_tankettes_desc:	"Um unsere Militärindustrie zu stärken und unsere Aufklärungsbataillone zu erweitern, wäre es klug, mit dem [ITA.GetAdjective] Fahrzeughersteller Fiat zusammenzuarbeiten, um leichte Panzer und Tanketten für unsere neuen mechanisierten Gruppen zu produzieren."
wuw_HUN_strenghten_the_order_of_vitez:	"Den Orden von Vitéz stärken"
wuw_HUN_strenghten_the_order_of_vitez_desc:	"Der 1920 gegründete Verdienstorden, der Vitézi Rend, wird derzeit von Seiner Durchlaucht Miklós Horthy geleitet. Er könnte daher mehr Mittel und Männer für die Kommandeure des Ordens bereitstellen, um sie so gut wie möglich zu stärken."
wuw_HUN_absolute_rule_of_the_national_unity_party:	"Nutzen Sie die Partei der Nationalen Einheit"
wuw_HUN_absolute_rule_of_the_national_unity_party_desc:	"Indem er sich die derzeitige Partei des Premierministers, die Egységes Párt, zunutze macht, kann [ROOT.GetLeader] eine starke Kontrolle über die Politik von [ROOT.GetAdjective] aufrechterhalten und die Situation effektiv monopolisieren, ohne Wahlen völlig zu verbieten."
wuw_HUN_spur_on_the_trianon_trauma:	"Ansporn für das Trauma von Trianon"
wuw_HUN_spur_on_the_trianon_trauma_desc:	"Es ist allgemein bekannt, dass [ROOT.GetNameDef] in der Vergangenheit besser war als in der Gegenwart. In jenem verfluchten Vertrag von Trianon haben wir zwei Drittel unseres rechtmäßigen Landes an unsere Nachbarn verloren, die unsere schwache Position ausgenutzt haben. Sie alle werden den Tag fürchten, an dem die [ROOT.GetAdjective] Armeen anrücken, um alles zurückzufordern!"
wuw_HUN_outlaw_the_party_of_national_will:	"Verbieten Sie die Partei des Nationalen Willens"
wuw_HUN_outlaw_the_party_of_national_will_desc:	"Die nationalsozialistische Partei des Nationalen Willens unter der Führung von Ferenc Szálasi ist eine Bedrohung für unsere derzeitige Herrschaft, da sie bei den [GER.GetAdjective] Nazis beliebter ist und die fast absolute Herrschaft unseres derzeitigen Führers ablehnt."
wuw_HUN_carrying_on_arpads_legacy:	"Das Erbe von Árpád weiterführen"
wuw_HUN_carrying_on_arpads_legacy_desc:	"Der große Árpád, Oberhaupt der Konföderation der magyarischen Stämme an der Wende vom 9. zum 10. Jahrhundert, ist eine große Inspiration für [ROOT.GetLeader], und seine Dynastie setzte sich lange Zeit fort und machte [ROOT.GetnameDef] zum Besten, was es sein konnte. Wir sollten uns eine Seite aus seinem Buch nehmen und seinem Beispiel folgen."
wuw_HUN_the_turul_association:	"Die Turul-Vereinigung"
wuw_HUN_the_turul_association_desc:	"Die Turul-Vereinigung wurde 1919 als Universitätsbewegung in Budapest gegründet. Sie stand während des Bürgerkriegs und in der Schlacht von Budaőrs im Herbst 1921 fest an der Seite von Miklós Horthy. Mit rund 40000 Mitgliedern könnten wir sie nutzen, um das Bildungswesen unseres Landes zu kontrollieren."
wuw_HUN_demand_transylvania:	"Fordern Sie Siebenbürgen"
wuw_HUN_demand_transylvania_desc:	"Wenn wir unsere Gebiete, die wir nach dem Großen Krieg verloren haben, ohne Blutvergießen zurückgewinnen können, umso besser. Wir werden den unrechtmäßigen Besatzern unserer szeklerischen Brüder ein Ultimatum stellen und die Rückgabe unserer rechtmäßigen Ländereien fordern."
wuw_HUN_strengthen_the_turani_vadaszok:	"Stärken Sie das Turáni Vadászok"
wuw_HUN_strengthen_the_turani_vadaszok_desc:	"Im Jahr 1927 gründete Gyula Gömbös die faschistische paramilitärische Truppe mit dem Namen Verband der Turanischen Jäger. Obwohl sie faschistisch sind, lehnen sie die Ideen des deutschen Nationalsozialismus ab und stützen sich auf die Ideale des Ungarentums und des ungarischen Turanismus. Wir können sie als solche zu unserem Vorteil nutzen, wenn wir das wollen."
wuw_HUN_demand_southern_slovakia:	"Fordern Sie [664.GetName]"
wuw_HUN_demand_southern_slovakia_desc:	"Die ethnische [ROOT.GetAdjective]-Minderheit in [664.GetName] wird derzeit von der Besatzungsregierung misshandelt und ausgenutzt. Deshalb müssen wir dafür sorgen, dass die [ROOT.GetAdjective]s und die Region, in der sie leben, wieder unter unsere Kontrolle gebracht werden."
wuw_HUN_claim_overlordship_over_slovakia:	"Beanspruchen Sie die Oberherrschaft über [SLO.GetNameDef]"
wuw_HUN_claim_overlordship_over_slovakia_desc:	"Der Rest der Slowakei muss ebenfalls wieder in den ungarischen Staat eingegliedert werden, entweder direkt oder durch die Aufnahme in eine Abhängigkeit. Wir werden ein weiteres Ultimatum stellen."
wuw_HUN_invite_german_investors:	"Laden Sie [GER.GetAdjective] Investoren ein"
wuw_HUN_invite_german_investors_desc:	"Wie bereits in unseren früheren Handelsabkommen festgelegt, ist es derzeit nur [GER.GetAdjective]s und [ROOT.GetAdjective]s erlaubt, in unserem Land zu prospektieren. Daher wäre es zumindest klug, dies auszunutzen und Investoren in unser Land einzuladen."
wuw_HUN_protect_austria:	"Schützen Sie [AUS.GetNameDef]"
wuw_HUN_protect_austria_desc:	"Um uns weiter gegen [GER.GetNameDef] zu wehren, müssen wir ihren offenen Ambitionen zur Vereinigung mit [AUS.GetNameDef] widerstehen. Wir können ihnen eine Garantie gewähren, die der jetzigen Regierung die politische Stärke gibt, die sie hoffentlich braucht, um sich gegen pro-[GER.GetAdjective] Elemente zu behaupten, vorausgesetzt, sie geben uns das Burgenland zurück."
wuw_HUN_proclaim_greater_hungary:	"Proklamieren Sie Großungarn"
wuw_HUN_proclaim_greater_hungary_desc:	"Nachdem wir das uns zustehende Territorium zurückgewonnen haben, ist die Größe unseres Landes auf unsere historischen Grenzen angewachsen. Wir können nun voller Zuversicht der Welt die Bildung von Großungarn verkünden und neue Ziele ins Auge fassen."
wuw_HUN_demand_the_return_of_slovakia:	"Fordern Sie [SLO.GetAdjective] Integration"
wuw_HUN_demand_the_return_of_slovakia_desc:	"[SLO.GetNameDef] war lange Zeit ein Teil Großungarns, und jetzt, da wir wieder unseren Platz in der Welt einnehmen, sollten wir unser Eigentum an der Region behaupten."
wuw_HUN_promote_hungarianism:	"Förderung des Ungarentums"
wuw_HUN_promote_hungarianism_desc:	"Um unseren vergangenen Ruhm wiederzuerlangen, müssen wir diejenigen unterstützen, die sich nichts sehnlicher wünschen als das, so radikal sie auch sein mögen. Deshalb sollten wir die aufkommenden Ideen des Ungarismus fördern, die auf der Grundlage der Lehren des katholischen Bischofs Ottokár Prohászka entwickelt wurden, und seine Idee, für die ungarischen Interessen einzutreten, koste es, was es wolle."
wuw_HUN_demand_the_vojvodina:	"Fordern Sie die Vojvodina"
wuw_HUN_demand_the_vojvodina_desc:	"Die Region Bácska ist seit langem ein integraler Bestandteil unserer Nation, doch wurde sie uns nach dem Ende des Großen Krieges von der [YUG.GetAdjective] Regierung entrissen. Wir müssen diese historische Ungerechtigkeit rückgängig machen und das zurückfordern, was uns gehört!"
wuw_HUN_demand_carpathian_ruthenia:	"Fordern Sie Karpaten-Ruthenien"
wuw_HUN_demand_carpathian_ruthenia_desc:	"Die [ROOT.GetAdjective] in der Region Karpaten-Ruthenien haben viel zu lange Unterdrückung durch fremde Regime erlebt, seit die verräterische Huzulenrepublik 1919 ihre Unabhängigkeit von uns erklärt hat. Wir müssen dieses Land zurückfordern, um unseres Volkes willen!"
wuw_HUN_demand_burgenland:	"Fordern Sie das Burgenland"
wuw_HUN_demand_burgenland_desc:	"Die tapferen Rongyos Gárda gründeten einst den Lajtabánság am Ende des Ersten Weltkriegs, um die Kontrolle über das Land zu erlangen und die [HUN.GetAdjective] Herrschaft über das Gebiet wiederherzustellen, doch dann wurde es uns entrissen und Österreich einverleibt. Wir müssen diese Region zurückerobern, wenn wir unseren Stolz jemals wiedererlangen wollen."
wuw_HUN_reaffirm_territorial_claims:	"Territoriale Ansprüche bekräftigen"
wuw_HUN_reaffirm_territorial_claims_desc:	"Nach der Ablehnung des Vertrags von Trianon müssen wir nun unsere Ansprüche auf die Gebiete, die uns gestohlen wurden, bekräftigen."
wuw_HUN_end_the_regency:	"Beenden Sie die Regentschaft"
wuw_HUN_end_the_regency_desc:	"Horthy hat sich als Regent bewährt, aber es ist nun an der Zeit, sich erneut nach einem König umzusehen, der bereit ist, den [ROOT.GetAdjective] Thron zu besteigen. Ob es nun ein Habsburger ist oder jemand, der mehr den Wünschen der Kleinen Entente entspricht, wir brauchen einen neuen Monarchen."
wuw_HUN_crack_down_on_radicals:	"Hartes Durchgreifen gegen Radikale"
wuw_HUN_crack_down_on_radicals_desc:	"Es gibt viele Milizen und politische Organisationen im Land, die gegen die Wiederherstellung der Monarchie sind. Wir müssen dafür sorgen, dass ihr Einfluss begrenzt wird und alle paramilitärischen Gruppen aufgelöst werden, damit sie später nicht zu einem Problem für uns werden."
wuw_HUN_reach_out_to_candidates:	"Auf die Kandidaten zugehen"
wuw_HUN_reach_out_to_candidates_desc:	"Wir müssen ein Komitee gründen, das potenzielle Kandidaten für den Thron finden soll. Die naheliegendsten Kandidaten sind Otto, der derzeitige Erbe des Habsburgerreichs, und Joseph August, unser jüngster König, ebenfalls ein Habsburger. Die Kleine Entente hat uns jedoch untersagt, einen König habsburgischer Abstammung zu haben, so dass wir uns nach anderen Möglichkeiten umsehen müssen."
wuw_HUN_subvert_gombos_troops:	"Gömbös' Truppen unterwandern"
wuw_HUN_subvert_gombos_troops_desc:	"Der faschistische und extremistische Premierminister Gyula Gömbös ist für mehrere paramilitärische Milizen verantwortlich, von denen die größte die Ungarische Nationale Verteidigungsvereinigung ist. Wir müssen dafür sorgen, dass diese Gruppen ausgeschaltet werden, bevor sie eine Bedrohung für unser neues Königreich darstellen können."
wuw_HUN_reinstate_the_pragmatic_sanction:	"Setzen Sie die Pragmatische Sanktion von 1713 wieder ein"
wuw_HUN_reinstate_the_pragmatic_sanction_desc:	"Die Pragmatische Sanktion von 1713 wurde vom Kaiser des Heiligen Römischen Reiches, Karl VI., erlassen, um sicherzustellen, dass die Habsburger Monarchie ungeteilt an eine Tochter vererbt werden kann, und um unsere Nation für die Zukunft als Habsburger Land zu betrachten. Nach dem erfolglosen Putschversuch von Karl IV. wurde dies widerrufen. Um diese Herrschaft wiederherzustellen, müssen wir versuchen, sie gegen den Willen der Kleinen Entente wieder einzuführen."
wuw_HUN_aid_the_carlist_struggle:	"Unterstützen Sie den Kampf der Karlisten"
wuw_HUN_aid_the_carlist_struggle_desc:	"Die spanischen Karlisten kämpfen einen edlen Kampf, um die traditionellen Werte ihrer Nation wiederherzustellen und wieder einen richtigen Monarchen auf den Thron zu setzen. Wenn wir uns für die Zukunft einen potenziellen Verbündeten in der Region wünschen, wäre es klug, eine Fraktion, die so eng mit uns verbunden ist, in ihrem Kampf um den Sieg im spanischen Bürgerkrieg zu unterstützen."
wuw_HUN_invite_otto_to_the_throne:	"Laden Sie Otto auf den Thron ein"
wuw_HUN_invite_otto_to_the_throne_desc:	"Lange haben die Habsburger Ungarn regiert, und unter ihrer Herrschaft war das Land Teil eines der größten Reiche Europas. Die Rückkehr eines Habsburgers ans Ruder, der die Absicht hat, Österreich-Ungarn wiederherzustellen, wird uns sicherlich wieder zu Größe führen. Da er der legitime Erbe des gesamten Reiches ist, wäre er unser Schlüssel zur Wiederherstellung Österreich-Ungarns."
wuw_HUN_attempt_economic_independence:	"Wirtschaftliche Unabhängigkeit anstreben"
wuw_HUN_attempt_economic_independence_desc:	"Wenn wir unseren früheren Ruhm wiedererlangen wollen, können wir uns nicht auf ausländische Mächte verlassen, um unsere Wirtschaft zu verbessern und zu betreiben. Nur durch unsere Hände muss unser Land wieder aufblühen!"
wuw_HUN_the_lands_of_the_crown_of_saint_stephen:	"Die Länder der Krone von Sankt Stephan"
wuw_HUN_the_lands_of_the_crown_of_saint_stephen_desc:	"Als Teil des österreichisch-ungarischen Reiches waren wir als die Länder der Krone des Heiligen Stephan bekannt, oder kurz Transleithanien. Als ersten Schritt zur Rückeroberung des Reiches sollten wir uns bemühen, diesen Namen wieder anzunehmen. Das wird der Welt zeigen, was unsere wahren Absichten sind."
wuw_HUN_the_old_habsburg_king:	"Der alte Habsburger König"
wuw_HUN_the_old_habsburg_king_desc:	"Erzherzog Joseph August von Österreich war der letzte Pfalzgraf von Ungarn und war der Reichsverweser für Karl, bis die Entente seine Abdankung verlangte, da sie einen habsburgischen König nicht anerkennen wollte. Jetzt ist er bereit, seinen Thron wieder zu besteigen und Ungarn als heiliger König zu regieren. Als ehemaliger Feldmarschall werden seine Kenntnisse der Kriegsführung sicherlich von Nutzen sein."
HUN_feldmarchall_augusts_expertise:	"Feldmarschall Joseph Augusts Expertise"
wuw_HUN_secure_army_loyalty:	"Die Loyalität der Armee sichern"
wuw_HUN_secure_army_loyalty_desc:	"Um sicherzustellen, dass die Armee auf unserer Seite steht und wir sicher in sie investieren können, müssen wir uns von allen Kommandeuren trennen, deren Loyalität zur Krone auch nur annähernd fraglich ist."
wuw_HUN_royal_hussars:	"Königliche Husaren"
wuw_HUN_royal_hussars_desc:	"Unser Volk hat eine lange und stolze Tradition, was den Einsatz von Kavallerie angeht, und das wird auch heute nicht anders sein. Es muss eine Elitetruppe der Kavallerie geschaffen werden, die als königliche Garde die Sicherheit unserer Majestät gewährleisten kann."
wuw_HUN_abide_by_the_little_ententes_stipulations:	"Halten Sie sich an die Bestimmungen der Kleinen Entente"
wuw_HUN_abide_by_the_little_ententes_stipulations_desc:	"Seit dem Ende des Großen Krieges hat die Kleine Entente, bestehend aus Rumänien, der Tschechoslowakei und Jugoslawien, festgelegt, dass wir nie wieder einen habsburgischen König haben dürfen. Offen gesagt, ist uns das ganz recht, denn wir haben einen anderen Kandidaten für den Thron im Auge."
wuw_HUN_elect_a_democratic_king:	"Wählen Sie einen demokratischen König"
wuw_HUN_elect_a_democratic_king_desc:	"Wir müssen einen König suchen, der die demokratischen Prinzipien unserer Nation und die Rechte unseres Volkes hochhält. Dazu müssen wir unseren Blick auf die sozialdemokratischen konstitutionellen Monarchien Nordeuropas richten und sehen, ob sie vielleicht einen potenziellen Kandidaten haben, dem wir unseren Thron anbieten können."
wuw_HUN_honor_the_great_war_veterans:	"Ehren Sie die Veteranen des Großen Krieges"
wuw_HUN_honor_the_great_war_veterans_desc:	"Auch wenn neue und kluge Kommandeure die Zukunft in ihren Händen halten, dürfen wir nicht vergessen, was wir unseren Veteranen des Greta-Krieges schulden, die für uns gekämpft haben, um die Heimat unseres Volkes zu schützen. Wir sollten sie auszeichnen und dafür sorgen, dass noch mehr bereit sind, in Zukunft das zu werden, was sie heute sind."
wuw_HUN_the_legacy_of_the_isonzo_front:	"Das Vermächtnis der Isonzofront"
wuw_HUN_the_legacy_of_the_isonzo_front_desc:	"Seine Majestät Joseph August diente Österreich-Ungarn und führte viele Schlachten sowohl an der russischen, serbischen als auch an der italienischen Front. Vor allem aber fand er die Taktiken, die in den vielen Schlachten an der Isonzofront angewandt wurden, inspirierend und versuchte, die an der Front formulierten militärischen Strategien umzusetzen."
wuw_HUN_the_bastion_of_catholicism:	"Die Bastion des Katholizismus"
wuw_HUN_the_bastion_of_catholicism_desc:	"Unser Land ist mehrheitlich katholisch, und das gilt auch für seinen Monarchen. Es ist höchste Zeit, dass das Apostolische Königreich Ungarn seine Position als Verteidiger des Christentums einnimmt und die gottlosen Kommunisten von unserem Kontinent vertreibt."
wuw_HUN_enact_agrarian_reform:	"Führen Sie eine Agrarreform durch"
wuw_HUN_enact_agrarian_reform_desc:	"Unser Agrarsektor bietet reichlich Raum für Verbesserungen. Wenn wir ihn rationalisieren und seine Effizienz verbessern, werden Arbeitskräfte frei, die in anderen Bereichen wie dem Baugewerbe und der Waffenproduktion eingesetzt werden können."
wuw_HUN_demand_austrian_restoration:	"Fordern Sie die österreichische Restauration"
wuw_HUN_demand_austrian_restoration_desc:	"Österreich, oder wie es damals hieß, Cisleithanien, war ein integraler Bestandteil unseres föderativen Imperiums. Es ist jetzt wichtiger denn je, die Herrschaft der Habsburger über ihr Land wiederherzustellen und unsere Königreiche unter einer Föderation zu vereinen."
wuw_HUN_seek_an_alliance_with_the_kaiser:	"Suchen Sie ein Bündnis mit dem Kaiser"
wuw_HUN_seek_an_alliance_with_the_kaiser_desc:	"Nachdem das alte [GER.GetAdjective] Reich wiederhergestellt ist, wäre es klug, unsere alten Bande mit [GER.GetLeader] zu erneuern, um die schrecklichen Taten, die uns beiden am Ende des Großen Krieges zugefügt wurden, ungeschehen zu machen."
wuw_HUN_a_grand_habsburg_alliance:	"Eine habsburgische Allianz"
wuw_HUN_a_grand_habsburg_alliance_desc:	"Es gibt niemanden, dem man mehr vertrauen kann als den eigenen Verwandten, und wir haben im Laufe der Geschichte gelernt, dass jeder gegen die große Familie der Habsburger ist. Daher sollten wir unsere Bündnisse innerhalb unserer Familie halten und eine Fraktion bilden, die nur aus von den Habsburgern regierten Staaten besteht."
wuw_HUN_the_old_grand_alliance:	"Die Große Allianz wiederherstellen"
wuw_HUN_the_old_grand_alliance_desc:	"Damals, 1689, haben wir zusammen mit Wilhelm III. im Namen der Niederländischen Republik und Englands einen Vertrag unterzeichnet. Das Ziel war es, eine Allianz zu bilden, um die Expansionspolitik Frankreichs zu stoppen. Jetzt steht die Welt wieder in Flammen, und wir müssen den Kontinent sichern, indem wir uns erneut um die Wiederherstellung dieses alten Bündnisses bemühen."
wuw_HUN_demand_wiedist_restoration:	"Fordern Sie die Wiederherstellung der Wiedisten"
wuw_HUN_demand_wiedist_restoration_desc:	"Prinz Wilhelm von Wied regierte einst als Verbündeter der Mittelmächte das Fürstentum Albanien. Am Ende des Großen Krieges wurde er jedoch ungerechterweise abgesetzt und nach vielen Jahren stahl der bedauernswerte Prätendent Ahmet Zogu den albanischen Thron. Wir müssen diesen Fehler sofort rückgängig machen!"
wuw_HUN_a_habsburg_poland:	"Ein habsburgisches Polen"
wuw_HUN_a_habsburg_poland_desc:	"Die polnischen Länder waren einst ein potentielles Habsburgerreich, und es ist wieder an der Zeit, die von den Habsburgern kontrollierten Gebiete zu erweitern. Wir sollten uns an die polnische Regierung wenden und sie auffordern, das Königreich wiederherzustellen und Karl Albrecht auf den Thron zu setzen."
wuw_HUN_habsburg_ascension_in_spain:	"Habsburgs Aufstieg in Spanien"
wuw_HUN_habsburg_ascension_in_spain_desc:	"Lange Zeit herrschten die Habsburger über die Spanier. Wir sollten versuchen, die Monarchie in Spanien wiederherzustellen und die Spanier nutzen, um die Habsburger Allianz zu erweitern und unsere Gegner in Westeuropa zu flankieren."
wuw_HUN_reenlist_the_sich_riflemen:	"Rekrutieren Sie die ukrainischen Sich Riflemen wieder"
wuw_HUN_reenlist_the_sich_riflemen_desc:	"Die ukrainischen Sich-Schützen haben während des Ersten Weltkriegs für uns gekämpft und haben dann während des russischen Bürgerkriegs für einen freien ukrainischen Staat gekämpft. Wir sollten diese Militäreinheit unter einem ihrer alten und beliebten Befehlshaber, dem habsburgischen Erzherzog Wilhelm Franz von Österreich, der ihnen unter dem Namen Vasyl Vyshyvanyi bekannt ist, neu formieren."
wuw_HUN_the_kingdom_of_ukraine:	"Das Königreich der Ukraine"
wuw_HUN_the_kingdom_of_ukraine_desc:	"Nach dem Großen Krieg versuchten wir, mit Hilfe des Deutschen Reiches einen neuen ukrainischen Staat zu gründen. Er wurde dann von den Bolschewiken zerschlagen, aber jetzt kontrollieren wir wieder das ukrainische Heimatland und können versuchen, ein neues, von den Habsburgern geführtes Königreich in der Ukraine zu errichten."
wuw_HUN_restore_the_georgian_monarchy:	"Stellen Sie die georgische Monarchie wieder her"
wuw_HUN_restore_the_georgian_monarchy_desc:	"Unsere Kontakte haben den im Exil lebenden Prinzen George Bagration von Mukhrani, den legitimen Erben des georgischen Throns, kontaktiert. Er hat uns ewige Unterstützung zugesagt, wenn wir versprechen, sein Heimatland zu befreien und die Monarchie dort wieder einzuführen. Der Ball liegt nun in unserem Feld."
wuw_HUN_protect_czechoslovakia:	"Beschützen Sie die Tschechoslowakei"
wuw_HUN_protect_czechoslovakia_desc:	"Die Tschechoslowakei ist seit ihrer Unabhängigkeit mächtig und fleißig geworden, aber ihre Ländereien werden von ihren Nachbarn gierig beäugt. Wir werden ihnen unseren Schutz gegen diese Bedrohungen anbieten, entweder indem wir sie wieder als integralen Bestandteil unseres Reiches aufnehmen oder indem wir ihnen den Status einer Assoziation gewähren."
wuw_HUN_reclaim_transylvania:	"Transsilvanien zurückerobern"
wuw_HUN_reclaim_transylvania_desc:	"Am Ende des Großen Krieges besetzten die [ROM.GetAdjective]s Siebenbürgen, das jahrhundertelang von uns regiert worden war. Seitdem ist nicht viel Zeit vergangen, und unser Volk erinnert sich nur zu gut daran. Es ist an der Zeit, dieses Land für uns zurückzuerobern."
wuw_HUN_a_hungarian_galicia:	"A [ROOT.GetAdjective] Galizien"
wuw_HUN_a_hungarian_galicia_desc:	"Früher wurden Galizien und die Bukowina von Cisleithanien regiert, aber da wir jetzt der dominierende Partner im Reich sind, wäre es nur logisch, dass wir diese Gebiete schützen und verwalten."
wuw_HUN_reintigrate_slovakia:	"Reintegrieren Sie die Slowakei"
wuw_HUN_reintigrate_slovakia_desc:	"Die Slowakei war jahrhundertelang ein fester Bestandteil des [ROOT.GetAdjective] Reiches, und mit dem verachtenswerten Vertrag von Trianon wurden uns diese Ländereien entrissen. Es ist höchste Zeit, dass wir uns unsere nördlichen Regionen einverleiben und sie wieder in den Schoß aufnehmen."
wuw_HUN_press_maximilians_and_the_iturbides_claims:	"Presse Maximilians und die Iturbides-Ansprüche"
wuw_HUN_press_maximilians_and_the_iturbides_claims_desc:	"Mexiko wurde zunächst unter dem Haus Iturbide zum Kaiserreich ausgerufen und später, während des zweiten Kaiserreichs, von Maximilian von Habsburg regiert, bis er zu Unrecht hingerichtet wurde. Die derzeitige Erbin des kaiserlichen Throns ist María Josepha Sophia de Iturbide, die einst von ihm adoptiert wurde, und wir werden dafür sorgen, dass sie ihre Krone wieder zurückerobern kann!"
wuw_HUN_the_triple_kingdom:	"Die Dreifach-Monarchie"
wuw_HUN_the_triple_kingdom_desc:	"Am Ende des Ersten Weltkriegs und auch schon davor gab es Stimmen, die die Abschaffung der Doppelmonarchie zugunsten einer Monarchie mit drei Kronen diskutierten, darunter die Krone von Kroatien-Slawonien. Wir sollten versuchen, diese Versprechen jetzt zu erfüllen, damit unser Reich in Zukunft nicht wieder zusammenbricht."
wuw_HUN_restore_the_lombardo_venetian_kingdom:	"Stellen Sie das Königreich Lombardei-Venetien wieder her"
wuw_HUN_restore_the_lombardo_venetian_kingdom_desc:	"Das Königreich Lombardei-Venetien war von 1815 bis 1866 ein Bestandteil unseres Reiches und wurde uns im dritten italienischen Unabhängigkeitskrieg vom neu gegründeten Königreich Italien weggenommen. Es ist höchste Zeit, dass wir auf die Halbinsel zurückkehren und versuchen, in diesen alten Kronländern wieder einen Habsburger auf den Thron zu setzen."
wuw_HUN_restore_the_duchy_of_teschen:	"Stellen Sie das Herzogtum Teschen wieder her"
wuw_HUN_restore_the_duchy_of_teschen_desc:	"Die schlesischen Länder wurden lange Zeit von Böhmen regiert und später mit diesem zusammen in das Reich eingegliedert. Nach dem Österreichischen Erbfolgekrieg wurde es uns jedoch von Preußen gestohlen, ein Verlust, den wir nicht vergessen haben. Wir müssen uns revanchieren und dieses Land wieder für uns zurückerobern!"
wuw_HUN_reclaim_the_holy_city:	"Fordern Sie die Heilige Stadt zurück"
wuw_HUN_reclaim_the_holy_city_desc:	"Das Königreich Jerusalem wurde nach seiner Eroberung durch die ägyptischen Mamelucken im Jahr 1291 abgeschafft, aber unser Kaiser trägt durch das Haus Lothringen Leopold I. immer noch den Titel König von Jerusalem. Es ist höchste Zeit, dass wir, die Beschützer des katholischen Glaubens, die heilige Stadt Jerusalem zurückfordern und das tun, was die Kreuzfahrer nicht konnten."
wuw_HUN_a_holy_empire:	"Ein Heiliges Reich"
wuw_HUN_a_holy_empire_desc:	"Jetzt, da das heilige Land unter der Kontrolle des wahren Königs von Jerusalem steht, können wir uns an den Papst wenden und um seinen Segen bitten, denn das Königreich Jerusalem ist endlich wiederhergestellt. Dies wird es den Menschen in unserem Reich ermöglichen, die Rolle der Monarchen in unseren Nationen zu verstehen und zu begreifen, dass sie wirklich von Gott auserwählt wurden."
wuw_HUN_a_holy_empire_tt:	"§YOtto von Habsburg§! und seine Vasallen werden vom Papst gesegnet werden"
wuw_HUN_a_multi_ethnic_empire:	"Ein multiethnisches Reich"
wuw_HUN_a_multi_ethnic_empire_desc:	"Unser Reich umfasst viele verschiedene Völker und Kulturen, und das ist etwas, das wir in vollem Umfang annehmen müssen, indem wir den verschiedenen Orten unseres Reiches weitgehende Autonomie gewähren, damit unsere Bürger auch in Zukunft ein Teil von uns bleiben wollen."
wuw_HUN_reverse_the_risorgimento:	"Das Risorgimento rückgängig machen"
wuw_HUN_reverse_the_risorgimento_desc:	"Die Einigung Italiens war ein Fehler, der der Welt durch eine Reihe von unverantwortlichen Entscheidungen der Herrscher und Tragödien für das österreichisch-ungarische Reich zugefügt wurde. Dieser Fehler muss rückgängig gemacht werden, wenn sich die Welt jemals davon erholen soll!"
wuw_HUN_reverse_the_risorgimento_tt:	"§Y[ROOT.GetNameDefCap]§! wird §YPre-Risorgimento§! Staaten auf der §YItalienischen Halbinsel§! als §YSubjects§! freigeben und sie stärken"
wuw_HUN_integrate_bohemian_and_austrian_industries:	"Integrieren Sie die böhmische und österreichische Industrie"
wuw_HUN_integrate_bohemian_and_austrian_industries_desc:	"Die anderen Gliedstaaten unseres Reiches verfügen über eigene starke Industrien. Es wäre klug, sie in unser Reich zu integrieren, jetzt, da sie wieder in den Schoß des Reiches zurückgeholt wurden."
wuw_HUN_renovato_imperii:	"Renovatio Imperii"
wuw_HUN_renovato_imperii_desc:	"Renovatio imperii Romanorum, die Erneuerung des Römischen Reiches war eine Formel, mit der die Absicht erklärt wurde, das Römische Reich wiederherzustellen oder wiederzubeleben, und sie wurde seit ihrer Prägung oft verwendet. Wir sollten das Gleiche tun und offiziell unsere Absicht verkünden, das österreichisch-ungarische Reich wiederherzustellen und es zur Größe zu führen!"
wuw_HUN_renovato_imperii_tt:	"Schaltet Entscheidungen zur §YIntegration der kaiserlichen Untertanen§! zurück in das Reich frei, sowie die Fähigkeit, §YCore the Old Austro-Hungarian Lands§!"
wuw_HUN_revenge_for_the_brusilov_offensive:	"Revanche für die Brusilov-Offensive"
wuw_HUN_revenge_for_the_brusilov_offensive_desc:	"Die Russen haben uns zu Beginn des Großen Krieges gedemütigt, insbesondere während ihrer äußerst erfolgreichen Brusilov-Offensive. Wir müssen dafür sorgen, dass es im Sinne unserer Nation ist, uns an denen zu rächen, die uns Unrecht getan haben, insbesondere an den Russen. Dabei können wir auch einen neuen Versuch unternehmen, eine habsburgische Ukraine zu errichten."
wuw_HUN_purchase_burgenland:	"Kauf des Burgenlandes"
wuw_HUN_purchase_burgenland_desc:	"Die Regionen, die die [AUS.GetAdjective] als Burgenland kennen, waren viele Jahrhunderte lang Teil des [ROOT.GetAdjective] Reiches, nur um uns durch den Vertrag von Trianon gestohlen zu werden. Wir sollten ihrer Regierung einen Vorschlag unterbreiten und ihr anbieten, eine große Geldsumme für die Region zu zahlen, da ihre Wirtschaft derzeit am Boden liegt."
wuw_HUN_the_legacy_of_arpad_andrew_and_matthias:	"Das Vermächtnis von Árpád, Andreas und Matthias"
wuw_HUN_the_legacy_of_arpad_andrew_and_matthias_desc:	"Árpád, Andreas III. der Venezianer und Matthias Corvinus sind drei der größten heldenhaften Herrscher unserer alten Nation. Wenn Joseph August ihren Legenden jemals gerecht werden will, muss er das, was ihnen einst gehörte, für sich beanspruchen, sie vollständig verkörpern und ihren Geist in die Zukunft tragen."
wuw_HUN_a_declaration_of_intentions:	"Eine Absichtserklärung"
wuw_HUN_a_declaration_of_intentions_desc:	"Es ist höchste Zeit, dass wir der ganzen Welt unsere Absichten deutlich machen und ihr zeigen, was das [ROOT.GetAdjective] Volk wirklich ist."
wuw_HUN_undoing_the_yugoslav_mistake:	"Den jugoslawischen Fehler rückgängig machen"
wuw_HUN_undoing_the_yugoslav_mistake_desc:	"Die Gründung Jugoslawiens war einer der größten Fehler der Menschheitsgeschichte, und wir müssen alles in unserer Macht Stehende tun, um das alte Land des Staates der Slowenen, Kroaten und Serben zurückzuerobern. Ungarn wird sich wieder erheben!"
wuw_HUN_undoing_the_yugoslav_mistake_tt:	"Schaltet die Entscheidungen zur §YReintegration der alten ungarischen Gebiete§! frei, die im alten Staat der Slowenen, Kroaten und Serben liegen"
wuw_HUN_reclaim_the_slovak_possessions:	"Die slowakischen Besitztümer zurückfordern"
wuw_HUN_reclaim_the_slovak_possessions_desc:	"Die Slowakei ist seit langem ein Teil unserer Nation und war in den Kriegen nach dem Vertrag von Trianon kurz davor, wieder mit uns vereint zu werden. Wir sollten unsere Füße wieder in die Region setzen und sie wieder für uns beanspruchen!"
wuw_HUN_reclaim_the_slovak_possessions_tt:	"Schaltet Entscheidungen zur §YReintegration der alten ungarischen Gebiete§! frei, die in der Slowakei liegen"
wuw_HUN_revenge_for_1919:	"Revanche für 1919"
wuw_HUN_revenge_for_1919_desc:	"1919 demütigten uns die [ROM.GetAdjective]s in einem Konflikt um unsere rechtmäßigen siebenbürgischen Ländereien und besetzten nicht nur die gesamte Region, sondern nahmen auch Budapest ein und paradierten in unserer Hauptstadt herum. Diese Schande dürfen wir nicht zulassen, wenn die [ROOT.GetAdjective] Nation jemals wieder zu Ruhm und Ehre aufsteigen soll."
wuw_HUN_revenge_for_1919_tt:	"Schaltet Entscheidungen zur §YReintegration der alten ungarischen Territorien§! frei, die in Transsilvanien liegen"
wuw_HUN_a_bulwark_against_communism:	"Das Bollwerk gegen den Kommunismus"
wuw_HUN_a_bulwark_against_communism_desc:	"Die bolschewistische Bedrohung hat sich bereits viel zu weit ausgebreitet und droht noch weiter vorzudringen, wenn niemand bereit ist, sie aufzuhalten. Wir müssen den Mantel des Beschützers der Erde ergreifen und sie gegen diese Plage abschirmen!"
wuw_HUN_on_a_high_horse:	"Auf einem hohen Ross"
wuw_HUN_on_a_high_horse_desc:	"Die [ROOT.GetAdjective] Menschen sind wahrlich die Herren dieser Welt, wie uns die jüngsten Entwicklungen bewiesen haben. Es ist an der Zeit, dass wir unseren rechtmäßigen Platz an der Sonne einnehmen und uns in den Strahlen der Herrlichkeit sonnen, während wir die Erde hegemonisieren! Das Apostolische Königreich wird über Gottes Kinder herrschen."
wuw_HUN_cancel_the_german_trade_deal:	"Kündigen Sie das [GER.GetAdjective] Handelsabkommen"
wuw_HUN_cancel_the_german_trade_deal_desc:	"Der Faschist Gyula Gömbös, unser ehemaliger Premierminister, hat einen Pakt mit dem Teufel geschlossen, als er den Handelsvertrag mit den [GER.GetAdjective]s abschloss. Er bindet uns an sie und zerstört langsam aber sicher die Seele unserer Nation. Wir müssen das Abkommen so schnell wie möglich beenden."
wuw_HUN_establishing_a_royal_guard:	"Aufstellung einer königlichen Garde"
wuw_HUN_establishing_a_royal_guard_desc:	"Es ist allgemein bekannt, dass jeder König seine persönliche Garde braucht, und Horthy ist da nicht anders. Es ist an der Zeit, dass wir dem nachkommen, jetzt, da unsere Nation wieder einen König auf dem Thron hat."
wuw_HUN_magyar_cserkeszszovetseg:	"Magyar Cserkészszövetség"
wuw_HUN_magyar_cserkeszszovetseg_desc:	"Der 1912 gegründete ungarische Pfadfinderverband hat viele talentierte junge [ROOT.GetAdjective]s darin ausgebildet, für sich selbst zu sorgen und bei paramilitärischen Einsätzen zu helfen. Es ist an der Zeit, sie offiziell in unsere königliche Garde zu integrieren und den Führern der Organisationen aristokratische Titel zu verleihen."
wuw_HUN_magyar_cserkeszszovetseg_tt:	"Ändern Sie §YRoyal Guard§! um \nRekrutierbare Bevölkerung Faktor §G+10%§! \nIdeologie Drift Defense §G+15%§! \n§Y$category_support_battalions$:§! Organisation: §G+10§!, HP: §G+5§!"
wuw_HUN_dissolve_the_volksbund:	"Lösen Sie den Volksbund auf"
wuw_HUN_dissolve_the_volksbund_desc:	"Der Volksbund ist eine DNSAP-nahe Organisation der ethnischen [GER.GetAdjective]s in unserer Nation. Sie erhalten Gelder von [GER.GetNameDef] und machen ihre Botengänge in unserem Land. Wir müssen sie auflösen, bevor sie der Stabilität unseres Landes Schaden zufügen können."
wuw_HUN_an_airforce_to_be_reckoned_with:	"Eine Luftwaffe der Zukunft"
wuw_HUN_an_airforce_to_be_reckoned_with_desc:	"Unsere Luftwaffe muss modernisiert und gestärkt werden, um besser mit unseren Feinden konkurrieren zu können. Kombinierte Waffen sind der Weg der Zukunft, und das ist eine Tatsache, die wir uns zu eigen machen müssen."
wuw_HUN_a_mobile_army:	"Eine mobile Armee"
wuw_HUN_a_mobile_army_desc:	"Da unsere Armee keine Weltmächte in Bezug auf die bloße Anzahl der Soldaten schlagen kann, sollten wir uns auf technologische Überlegenheit konzentrieren. Panzer und andere landgestützte Fahrzeuge, die feindliche Einheiten durchschlagen und einkesseln können, sind die Zukunft der Kriegsführung, und wir müssen uns diese Tatsache zu eigen machen."
wuw_HUN_royalist_education_initiative:	"Royalistische Bildungsinitiative"
wuw_HUN_royalist_education_initiative_desc:	"Dem Volk muss nicht nur beigebracht werden, wie man handelt, sondern auch das Wichtigste, um es auf die glorreiche Zukunft vorzubereiten, die wir uns wünschen, und in der Zwischenzeit viele neue und kluge [ROOT.GetAdjective] Wissenschaftler hervorzubringen."
wuw_HUN_a_unifying_heritage:	"Ein verbindendes Erbe"
wuw_HUN_a_unifying_heritage_desc:	"Das [ROOT.GetAdjective] Volk mag über viele verschiedene Nationen verstreut gewesen sein, aber das hindert uns nicht daran, uns untereinander solidarisch zu fühlen. Wir sollten uns zu unserem Pan-Ungarnismus bekennen und eher früher als später darauf hinarbeiten, alle [ROOT.GetAdjective] Völker unter einem Banner zu vereinen."
wuw_HUN_stage_an_uprising_in_leitha:	"Inszenieren Sie einen Aufstand in der Leitha"
wuw_HUN_stage_an_uprising_in_leitha_desc:	"Der Aufstand gegen die Österreicher im Lajtabánság im Jahr 1921 hat bewiesen, dass die Menschen in [975.GetName] Teil unserer großen Nation sein wollen. Wir sollten Agenten entsenden, um dasselbe ein zweites Mal zu versuchen, indem wir ihnen sofort Schutz bieten und die Region besetzen."
wuw_HUN_stage_an_uprising_in_leitha_tt:	"§Dies könnte zu einem Krieg mit dem Besitzer von [975.GetName] führen!§!"
wuw_HUN_anglo_hungarian_alliance:	"Anglo-ungarisches Bündnis"
wuw_HUN_anglo_hungarian_alliance_desc:	"Die Horthys haben schon immer enge Beziehungen zu den Briten unterhalten, und da die Spannungen um uns herum zunehmen, ist es höchste Zeit, dass unser Land ein Bündnis anstrebt. Die Briten sind natürlich der natürliche Partner für eine Zusammenarbeit, denn ihre Hilfe kann es uns ermöglichen, uns auf unsere eigenen Angelegenheiten auf dem Kontinent zu konzentrieren, während sie sich auf andere Dinge konzentrieren."
wuw_HUN_establishing_a_new_dynasty:	"Eine neue Dynastie gründen"
wuw_HUN_establishing_a_new_dynasty_desc:	"Da die Habsburger nicht auf den Thron zurückkehren dürfen, gibt es keinen klaren Sieger, was die Ansprüche auf unser Königreich angeht. Eine Möglichkeit wäre, unseren Regenten zum König zu krönen, auch wenn er unbeliebt ist, oder einen sichereren Weg zu gehen und seinen Sohn, den beliebten und beliebten István Horthy zum neuen König von Ungarn zu krönen."
wuw_HUN_establishing_a_new_dynasty_tt:	"Wir werden die Wahl haben, entweder §YMiklós Horthy§! oder seinen Sohn §YIstván Horthy§! zum §YKönig von Ungarn§! zu krönen."
HUN_fascist_uprising_mission_activation_tt:	"§ADie ungarischen Faschisten beginnen mit den Vorbereitungen für einen Staatsstreich!§!"
wuw_HUN_elect_a_fascist_king:	"Wählen Sie einen faschistischen König"
wuw_HUN_elect_a_fascist_king_desc:	"Unsere Nation braucht einen mächtigen Führer, der sie durch die kommenden turbulenten Jahre lenkt. Unser Herrscher muss jemand sein, zu dem das Volk aufschauen kann und den unsere Feinde fürchten können."
wuw_HUN_guarantee_religious_liberties:	"Garantieren Sie religiöse Freiheiten"
wuw_HUN_guarantee_religious_liberties_desc:	"Viele sind aus unserem Land geflohen, als es zur Unterdrückung derjenigen überging, die nicht katholisch waren. Um diese Abwanderung umzukehren, müssen wir diese Gesetze ändern und auf einen säkularen Staat hinarbeiten. Dies sollte es den vielen klugen Köpfen, die aus unserem Land geflohen sind, ermöglichen, zu uns zurückzukehren."
wuw_HUN_joint_oil_exploitation_company:	"Gemeinsame Ölerschließungsgesellschaft"
wuw_HUN_joint_oil_exploitation_company_desc:	"Mit der Aussicht auf mögliche Ölfelder in unserem Gebiet haben wir die Aufmerksamkeit des Auslands auf uns gezogen. Befreundete Mächte sind begierig darauf, unsere Ölindustrie mit ihrem technischen Know-how zu unterstützen, und dies wäre eine lukrative Gelegenheit, von ihren Fortschritten zu lernen."
wuw_HUN_join_the_allies:	"Schließen Sie sich den Alliierten an"
wuw_HUN_join_the_allies_desc:	"Die Zukunft Ungarns und seiner demokratischen Werte liegt bei den großen westlichen Demokratien und ihrem Bündnis. Als Mitglied dieses Bündnisses können wir ihnen unsere Kraft zur Verfügung stellen und auch selbst auf ihre Unterstützung zählen."
wuw_HUN_a_responsible_government:	"Eine verantwortungsvolle Regierung"
wuw_HUN_a_responsible_government_desc:	"Traditionell ist die Regierung letztlich dem König unterstellt, so dass sie den Willen des Volkes ignorieren kann. Wir werden die Verfassung ändern, um sicherzustellen, dass das Volk und nicht der Herrscher die Verantwortung für die Regierung trägt."
wuw_HUN_the_balkan_pact:	"Der Balkan-Pakt"
wuw_HUN_the_balkan_pact_desc:	"Die Demokratien des Westens sind zu weit weg, um uns zu helfen, und so müssen wir Verbündete in der Nähe suchen. Als Anführer des Balkanpakts werden wir ihnen unseren Schutz anbieten und sie zum Sieg führen!"
wuw_HUN_the_balkan_pact_tt:	"Schaltet Entscheidungen frei, um §YBalkan-Länder§! in unsere Fraktion einzuladen"
wuw_HUN_the_balkan_pact_invitation_tt:	"[ROM.GetNameDef] Erhält das Ereignis: §Y[ROOT.GetNameDefCap] lädt [ROM.GetNameDef] in den Balkanpakt§! ein"
wuw_HUN_end_the_white_terror:	"Beenden Sie den Weißen Terror"
wuw_HUN_end_the_white_terror_desc:	"Während die meisten in diesem Land behaupten, dass der Weiße Terror bereits vorbei ist, kennen wir die Wahrheit... Miklós Horthy und seine paramilitärischen Schläger jagen immer noch diejenigen, die von einer besseren Zukunft träumen, und wir müssen seiner Herrschaft durch eine gewaltsame Revolution ein Ende setzen, wenn unsere Verfolgung jemals enden soll."
wuw_HUN_parade_istvan_bethlens_platform:	"Die neue Opposition von István Bethlen"
wuw_HUN_parade_istvan_bethlens_platform_desc:	"Unzufrieden mit der aktuellen Lage und besorgt über die zunehmende autoritäre Rhetorik von Premierminister Gyula Gömbös hat der ehemalige Premierminister István Bethlen eine neue Opposition gegründet. Wir müssen diese Gelegenheit nutzen, um den Admiral und seine faschistischen Lakaien weiter zu schwächen."
wuw_HUN_politicize_the_levente_associations:	"Politisieren Sie die Levente-Vereinigungen"
wuw_HUN_politicize_the_levente_associations_desc:	"Die paramilitärischen Levente-Jugendverbände helfen dabei, die [ROOT.GetAdjective] Jugend zu organisieren und sie für den Umgang mit Konflikten auszubilden, wenn diese unweigerlich in unserem Land auftauchen. Wir sollten versuchen, diese Gruppen zu infiltrieren und dafür sorgen, dass ihre Mitglieder wissen, wem gegenüber sie loyal sein sollten."
wuw_HUN_politicize_the_levente_associations_tt:	"Wenn der §Y[ROOT.GetAdjective] Bürgerkrieg§! beginnt, werden die §YLevente Associations§! loyal auf unserer Seite stehen und wir werden zusätzlich §G+8000§! Manpower gewinnen"
wuw_HUN_salami_slicing_tactics:	"Salami-Slicing-Taktik"
wuw_HUN_salami_slicing_tactics_desc:	"Indem wir eine Reihe von vielen kleinen anti-Horthyistischen Aktionen nutzen, um ein viel größeres Ergebnis zu erzielen, das schwierig oder sogar ungesetzlich wäre, wenn wir alles auf einmal durchführen würden, könnten wir die Herrschaft potenziell so weit untergraben, dass fast keine Soldaten mehr bereit wären, seine Politik zu verteidigen."
wuw_HUN_salami_slicing_tactics_tt:	"Wenn der §Y[ROOT.GetAdjective] Bürgerkrieg§! beginnt, wird ein etwas größerer Teil der §YArmed Forces§! uns gegenüber loyal sein."
wuw_HUN_undermine_the_volksbund:	"Untergraben Sie die faschistischen Paramilitärs"
wuw_HUN_undermine_the_volksbund_desc:	"Viele faschistische paramilitärische Gruppen, wie die deutsch-ungarische Organisation namens Volksbund, die enge Verbindungen zu den deutschen Faschisten hat, werden wahrscheinlich zu den Waffen greifen, um sich uns entgegenzustellen, wenn wir eine Revolution versuchen sollten. Wir müssen versuchen, sie alle von innen oder außen zu vernichten, bevor es zu spät ist."
wuw_HUN_undermine_the_volksbund_tt:	"Wenn der §Y[ROOT.GetAdjective] Bürgerkrieg§! beginnt, erhält die gegnerische Seite keine zusätzlichen §YVolksbund§! Einheiten und wir erhalten zusätzlich §G+15%§! Kriegsunterstützung und §G+75§! politische Macht"
wuw_HUN_reviving_the_spirit_of_1848:	"Den Geist von 1848 wiederbeleben"
wuw_HUN_reviving_the_spirit_of_1848_desc:	"Die ungarische Revolution und der Unabhängigkeitskrieg von 1848-1849 war eine von vielen europäischen Revolutionen des Jahres 1848, und obwohl sie uns nicht die Unabhängigkeit brachte, die wir uns wünschten, ebnete sie den Weg für den Geist und die Ideale, nach denen wir heute alle leben. Wir sollten die Flammen der Revolution neu entfachen und die Despoten, die sich unserer Freiheit in den Weg stellen, zu Fall bringen!"
wuw_HUN_reviving_the_spirit_of_1848_tt:	"Die verschiedenen monarchistischen und faschistischen Elemente im Lande werden §YMiklós Horthy§! in einem §RBürgerkrieg§! gegen uns folgen!"
wuw_HUN_reviving_the_spirit_of_1848_requirements_tt:	"Die Unterstützung für die §YKommunisten§! oder die §YDemokraten§! ist größer als die Unterstützung für die §YNEP§! und die §YMNSP§!"
wuw_HUN_officialize_the_rakosi_battalion:	"Offizialisierung des Rákosi Bataillons"
wuw_HUN_officialize_the_rakosi_battalion_desc:	"Die tapferen [ROOT.GetAdjective] Männer streben immer nach einer besseren Zukunft, auch im Ausland. Deshalb müssen wir uns bemühen, Männer wie diese offiziell zu unterstützen und die Revolution zu den Bedürftigen zu bringen."
wuw_HUN_elections_in_the_revolutionary_council:	"Wahlen zum Revolutionsrat"
wuw_HUN_elections_in_the_revolutionary_council_desc:	"Jetzt, da der Bürgerkrieg vorbei ist, kann es als sicher gelten, Wahlen im Revolutionsrat abzuhalten, der eingerichtet wurde, um den Übergang des Landes in eine Republik zu überwachen. Derzeit scheinen die kommunistischen Kandidaten favorisiert zu werden, aber vielleicht ist die Demokratie noch eine Option?"
wuw_HUN_join_the_comintern:	"Treten Sie der Komintern bei"
wuw_HUN_join_the_comintern_desc:	"Der Weg nach vorne für die Revolution liegt in der Komintern. Gemeinsam mit unseren Genossen werden wir die kapitalistische Ungerechtigkeit und die faschistische Bedrohung, die sich im Westen abzeichnet, beiseite fegen."
wuw_HUN_restore_the_socialist_federative_republic:	"Die Sozialistische Föderative Republik wiederherstellen"
wuw_HUN_restore_the_socialist_federative_republic_desc:	"Die Komintern hat den Kampf gegen den Imperialismus aufgegeben und sich stattdessen mit der Koexistenz zufrieden gegeben. Wenn die Arbeiter der Welt frei sein sollen, müssen wir die Fackel von Marx und Lenin weitertragen - wenn es sein muss, auch gegen die Sowjetunion."
wuw_HUN_restore_the_hungarian_red_army:	"Stellen Sie die ungarische Rote Armee wieder her"
wuw_HUN_restore_the_hungarian_red_army_desc:	"Alle heimatverbundenen Patrioten müssen ihre Pflicht zur Verteidigung des Vaterlandes erfüllen. Wir werden nach dem Vorbild der Sowjets im Osten eine ungarische Rote Armee aufstellen, die unsere junge Revolution schützen wird."
wuw_HUN_instate_a_socialist_economy:	"Eine sozialistische Wirtschaft einführen"
wuw_HUN_instate_a_socialist_economy_desc:	"Um unsere Gesellschaft wirklich zum Besseren zu verändern, müssen wir die Art und Weise ändern, in der das Geld fließt, und die Konzernchefs absetzen, die ihre Positionen nur durch Vetternwirtschaft erlangt haben. Der arbeitende Mensch wird wieder ein Mitspracherecht in seinem Land haben, und alle [ROOT.GetAdjective]s werden gleich sein!"
wuw_HUN_nationalize_key_industries:	"Verstaatlichen Sie Schlüsselindustrien"
wuw_HUN_nationalize_key_industries_desc:	"In unserem Land gibt es immer noch viele Fabriken und Unternehmen, die von ausländischen Firmen und Geschäftsleuten geführt werden, trotz der versuchten Sozialisierung der Wirtschaft. Der nächste Schritt auf dem Weg zum Sozialismus ist daher die Verstaatlichung des ausländischen Vermögens."
wuw_HUN_invest_in_universal_education:	"Investieren Sie in die allgemeine Bildung"
wuw_HUN_invest_in_universal_education_desc:	"Die Menschen sind diejenigen, die dieses Land regieren, und wenn sie nicht so gebildet sind, dass sie ihr eigenes Bestes kennen, werden sie es mit Sicherheit in den Ruin führen. Wir müssen daher in eine allgemeine und kostenlose Bildung für alle investieren, damit jeder [ROOT.GetAdjective] Mensch gebildet ist und bei seiner Stimmabgabe beurteilen kann, was das Beste ist."
wuw_HUN_kadars_hussars:	"Kádárs Husaren"
wuw_HUN_kadars_hussars_desc:	"Die Pufajkás, unsere Regimenter der Revolutionären Macht, sind die militärischen Polizeieinheiten unserer Roten Armee, die vom Kriegsministerium aufgestellt wurden und deren Hauptziel die Unterdrückung dissidenter Aktivitäten ist. Wir sollten weiter in diese Einheiten investieren, um die vollständige Sicherheit unseres Volkes und seines Staates zu gewährleisten."
wuw_HUN_reinstate_the_lenin_boys:	"Wiedereinführung der Lenin Boys"
wuw_HUN_reinstate_the_lenin_boys_desc:	"Die Lenin-Boys waren die paramilitärische Einheit der Kommunistischen Partei, die 1919 in der Sowjetrepublik operierte und zur Ausrottung und Unterdrückung konterrevolutionärer Dissidenten im Land eingesetzt wurde. Wir sollten diese paramilitärische Organisation zurückholen und sie in unsere Streitkräfte integrieren."
HUN_lenin_boys_militia_recruitment:	"Gewinnen Sie zwei Lenin-fiúk §YMilitia§! Einheiten"
wuw_HUN_promote_revanchist_sentiment:	"Fördern Sie revanchistisches Gedankengut"
wuw_HUN_promote_revanchist_sentiment_desc:	"Die Abscheulichkeit, die als Vertrag von Trianon bekannt ist, hat uns mehr als die Hälfte unserer Bevölkerung genommen und Tausende von [ROOT.GetAdjective]s obdachlos und vertrieben zurückgelassen. Wir müssen diese große historische Ungerechtigkeit ein für alle Mal ungeschehen machen und unserem Volk einen großen Sinn für Revanchismus einflößen."
wuw_HUN_denounce_marxism_leninism:	"Denunzieren Sie den Marxismus-Leninismus"
wuw_HUN_denounce_marxism_leninism_desc:	"Der abscheuliche Iosif Stalin hat unsere Ideale mit Füßen getreten und sich unsere Begriffe schon viel zu lange angeeignet. Seine faschistische und autoritäre Politik beweist uns, dass er nicht mehr ist als ein Lügner und ein Verräter an der Revolution, und es ist an der Zeit, dass wir seiner erbärmlichen Scharade ein Ende setzen."
wuw_HUN_proclaim_greater_hungary_core_states_requirement:	"Alle beginnenden ungarischen Staaten werden vollständig kontrolliert"
wuw_HUN_a_revolutionary_greater_hungary_tt:	"Wir werden bekannt sein als §Ydie Union der Pannonischen Sozialistischen Republiken§!"
wuw_HUN_a_revolutionary_greater_hungary:	"Eine pannonische sozialistische Union"
wuw_HUN_a_revolutionary_greater_hungary_desc:	"Jetzt, da unsere Grenzen wiederhergestellt sind, ist es an der Zeit, unser wahres Ziel ins Auge zu fassen. Wir müssen die Gelegenheit ergreifen und eine Union der Pannonischen Sozialistischen Republiken als einen Staat für alle Menschen, unabhängig von ihrer Nation, ausrufen. Dies wird es uns ermöglichen, unsere Aufmerksamkeit auf unser größeres Ziel zu lenken, die Weltrevolution zu verbreiten."
HUN_hero_of_the_revolution:	"Held der Revolution"
HUN_hero_of_the_revolution_desc:	"Mit der Rückeroberung der alten Gebiete und der Ausrufung der Union der Pannonischen Sozialistischen Republiken ist es offensichtlich, dass Béla Kun ein Held der internationalen Revolution ist."
HUN_balkan_ambitions:	"Ambitionen auf dem Balkan"
HUN_balkan_ambitions_desc:	"Die Arbeiter auf dem Balkan stehen unter der Knute der Kapitalisten, Monarchisten und Faschisten, die allesamt ausgesprochene Feinde der Weltrevolution sind. Wir müssen sie befreien, wenn wir auf dem Balkan Frieden haben wollen."
wuw_HUN_revenge_for_the_romanian_humiliations:	"Rache für die rumänischen Demütigungen"
wuw_HUN_revenge_for_the_romanian_humiliations_desc:	"Im ungarisch-rumänischen Krieg von 1918-1919 wurden wir gedemütigt und unsere siebenbürgischen Gebiete wurden uns gestohlen. Um unsere Ehre wiederherzustellen, müssen wir diese Gebiete, die uns rechtmäßig gehören, zurückfordern."
wuw_HUN_the_second_northern_campaign:	"Der zweite Nordfeldzug"
wuw_HUN_the_second_northern_campaign_desc:	"Unser erster Feldzug im Norden, der 1919 stattfand, war leider ein Fehlschlag, und das slowakische Volk fiel in die Hände der Tschechen. Wir müssen schnell handeln, um nicht nur die Ungarn, sondern auch die Slowaken in den Gebieten zu befreien, die durch den Vertrag von Trianon verloren gingen."
wuw_HUN_march_south:	"Marsch nach Süden"
wuw_HUN_march_south_desc:	"Wir haben einst nicht nur Gebiete im Norden, Osten und Westen verloren, sondern auch im Süden, was größtenteils auf die Gründung Jugoslawiens zurückzuführen ist. Wir müssen die Ungerechtigkeiten, die unserem Volk in der Vojvodina und im Banat auferlegt wurden, eher früher als später ungeschehen machen."
wuw_HUN_soviet_hungarian_military_academy:	"Sowjetisch-ungarische Militärakademie"
wuw_HUN_soviet_hungarian_military_academy_desc:	"Unsere Armee ist nichts ohne ihre Führung. Die Sowjets haben weitaus mehr Erfahrung in militärischen Angelegenheiten, so dass es von Vorteil sein kann, mit ihnen bei der Ausbildung unserer besten militärischen Köpfe zusammenzuarbeiten. Zu diesem Zweck werden wir eine Militärakademie mit den fähigsten Ausbildern aus unseren beiden Nationen einrichten."
wuw_HUN_goulash_communism:	"Gulasch-Kommunismus"
wuw_HUN_goulash_communism_desc:	"Aufgrund des Mangels an qualifizierten Mitarbeitern nach einem blutigen Bürgerkrieg sind viele junge Talente schnell aufgestiegen. Unter ihnen ist János Kádár und mit ihm die Idee des Gulaschkommunismus, ein System, das einen hohen Lebensstandard gewährleisten und die Bevölkerung unter unserer Regierung vereinen soll. In Ungarn soll sich jeder Bürger eine leckere Schüssel Gulasch leisten können!"
wuw_HUN_joint_hungarian_soviet_research_effort:	"Gemeinsame sowjetisch-ungarische Forschungsanstrengungen"
wuw_HUN_joint_hungarian_soviet_research_effort_desc:	"Um unsere eigene nationale Akademie der Wissenschaften zu stärken, sollten wir sowjetische Denker und Ingenieure einladen und ihre Hilfe bei der Entwicklung neuer Gedanken und Technologien in Anspruch nehmen, von denen unsere Nation profitieren kann."
wuw_HUN_soviet_hungarian_war_indsutry:	"Sowjetisch-ungarische Kriegsindustrie"
wuw_HUN_soviet_hungarian_war_indsutry_desc:	"Um unsere Zusammenarbeit weiter zu stärken, sollten wir die Sowjets bitten, in unsere Militärindustrie zu investieren, damit wir unseren Verpflichtungen nachkommen und unsere kommunistischen Verbündeten gegen jeden verteidigen können, der es wagt, sie zu bedrohen."
wuw_HUN_state_protection_authority:	"Die staatliche Schutzbehörde"
wuw_HUN_state_protection_authority_desc:	"Um den Schutz unserer stolzen Bürger zu gewährleisten und sicherzustellen, dass konterrevolutionäre Elemente nicht mehr auftauchen können, müssen wir eine Geheimpolizei einrichten, die die volle Befugnis hat, jede Person auszurotten, die ihrer Meinung nach gegen unsere Regierung handelt."
wuw_HUN_central_military_planning_committee:	"Zentrales Militärisches Planungskomitee"
wuw_HUN_central_military_planning_committee_desc:	"Wenn die Weltrevolution als Ganzes jemals erfolgreich sein soll, müssen wir eine Kommission für eine stärkere strategische und militärische Zusammenarbeit zwischen uns und unseren Verbündeten einrichten und sicherstellen, dass unsere Armee mit voller Effizienz arbeitet und jederzeit bereit ist, unsere Feinde anzugreifen."
wuw_HUN_a_cult_of_personality:	"Ein Personenkult"
wuw_HUN_a_cult_of_personality_desc:	"Die Kinder von [ROOT.GetNameDef] brauchen eine Figur, zu der sie aufschauen können, eine revolutionäre Seele, der sie ihren größten Respekt zollen können. Daher müssen wir die Macht um Mátyás Rákosi herum zentralisieren und einen Personenkult aufbauen, der seinen Willen in die Köpfe seines Volkes trägt und sie die wahren Werte lehrt, auf die sie sich verlassen müssen."
wuw_HUN_pressure_romania:	"Druck [ROM.GetNameDef]"
wuw_HUN_pressure_romania_desc:	"Während wir uns auf die faschistische Gefahr im Westen konzentrieren, können wir nicht zulassen, dass eine potenzielle Bedrohung in unserem Rücken weiter existiert, vor allem nicht, wenn sie zwischen uns und unseren Verbündeten im Osten liegt. Rumänien muss als kommunistischer Bruderstaat gesichert werden, oder die wichtigen Landwege zu unseren Verbündeten müssen übergeben werden, damit wir ihre Unterstützung erhalten können."
wuw_HUN_intervene_in_czechoslovakia:	"Intervenieren Sie in [CZE.GetNameDef]"
wuw_HUN_intervene_in_czechoslovakia_desc:	"Den Tschechoslowaken wurden einige der Gebiete zugesprochen, die uns im Vertrag von Trianon abgenommen wurden. Gleichzeitig wissen wir von den deutschen Plänen auf ihr Land. Vielleicht könnten wir einen Handel arrangieren; unser rechtmäßiges Land im Gegenzug für eine Garantie der sowjetischen militärischen Unterstützung im Falle einer deutschen Aggression."
wuw_HUN_the_bulwark_against_the_west:	"Das Bollwerk gegen den Westen"
wuw_HUN_the_bulwark_against_the_west_desc:	"Als stolzes Mitglied der internationalen kommunistischen Bewegung müssen wir jederzeit bereit sein, unsere Lebensweise zu verteidigen, und die größte Bedrohung sind im Moment die Faschisten und Kapitalisten des Westens. Wir müssen wie ein Bollwerk stehen, ein unbewegliches Objekt, das niemals wanken darf, wenn wir weiterhin stark bleiben wollen."
wuw_HUN_establish_the_second_republic:	"Errichten Sie die Zweite Republik"
wuw_HUN_establish_the_second_republic_desc:	"Wir dürfen nicht vergessen, dass die erste ungarische Republik, die zwischen 1918 und 1920 mit Unterbrechungen existierte, von den Kommunisten und den Nationalisten mit vereinten Kräften zerschlagen wurde, wobei die einen ihre Sowjetrepublik errichten und die anderen das Königreich wiederherstellen wollten, wobei letztere erfolgreicher waren. Wir müssen uns jetzt für den Erhalt unserer Demokratie einsetzen, damit sie uns nicht wieder für immer genommen wird!"
wuw_HUN_reverse_the_brain_drain:	"Machen Sie den Brain Drain rückgängig"
wuw_HUN_reverse_the_brain_drain_desc:	"Viele prominente Wissenschaftler haben unser Land verlassen, als es anfing, unterdrückende und diskriminierende Gesetze einzuführen, um die Kontrolle über unsere Gesellschaft zu erlangen. Wir müssen uns bemühen, diese Menschen zurückzuholen und die Wissenschaft gemeinsam weiter [ROOT.GetAdjective]!"
wuw_HUN_the_spirit_of_the_aster_revolution:	"Der Geist der Aster-Revolution"
wuw_HUN_the_spirit_of_the_aster_revolution_desc:	"Am Ende des Großen Krieges strebten Mihály Károlyi und das ungarische Volk nach Demokratie und Unabhängigkeit. Auch wenn die Republik untergegangen ist, sollten wir uns auf den Geist und die Solidarität berufen, die unser Volk während dieser Chrysanthemenrevolution empfunden hat, und gemeinsam auf die Zukunft hinarbeiten."
wuw_HUN_promote_entrepreneurship:	"Fördern Sie das Unternehmertum"
wuw_HUN_promote_entrepreneurship_desc:	"Eines der wichtigsten Dinge, die eine wachsende und sich ständig weiterentwickelnde Gesellschaft braucht, sind Unternehmer, die bereit und willens sind, Risiken einzugehen, um das Land, in dem sie leben, zu verbessern, und die Kapital zurück in das Land investieren werden. Wir sollten diese Art von Verhalten fördern, um unsere Heimat so wohlhabend wie möglich zu machen."
wuw_HUN_uplift_the_dragon_movement:	"Beleben Sie die Drachenbewegung"
wuw_HUN_uplift_the_dragon_movement_desc:	"Die Drachenbewegung, auch bekannt als Union der autochthonen Ungarn, ist eine Gruppe, die in erster Linie die Interessen der Mittelschicht vertritt, mit dem Motto 'Ungarn gehört den Ungarn!' Sie fordern eine ungarisch geführte Intelligenz und eine ungarisch orientierte Donautalpolitik für ein Großungarn mit alten Werten. Wir sollten sie unterstützen, denn ihre Ideen stimmen weitgehend mit unseren überein."
wuw_HUN_a_danubian_federation:	"Eine donauschwäbische Föderation"
wuw_HUN_a_danubian_federation_desc:	"Mit unserer einzigartigen Lage in der Mitte Europas haben wir das Potenzial, sehr einflussreich zu werden, ohne dass wir explizit territoriale Gewinne erzielen müssen. Genauso wichtig wie die Macht unserer Armee ist die Macht, die unsere Worte und diplomatischen Aktionen haben. Durch die Bildung einer Gemeinschaft rund um die Donau könnten wir eine diplomatische Reichweite und Macht weit über unsere eigenen Grenzen hinaus haben."
AUS_otto_von_habsburg_has_joined_austria_flag:	"Otto von Habsburg ist nach Österreich zurückgekehrt"
wuw_HUN_ward_against_extremism:	"Kampf gegen Extremismus"
wuw_HUN_ward_against_extremism_desc:	"Da der Extremismus immer näher rückt, müssen die Donaunationen stolz als Bollwerk der Freiheit und Demokratie dastehen und alle Feinde der Freiheit abwehren. Gemeinsam müssen wir die Demokratie verteidigen!"
wuw_HUN_ward_against_extremism_tt:	"Jedes Fraktionsmitglied wird auch diesen nationalen Geist erlangen"
wuw_HUN_bringing_down_the_giants:	"Die Giganten zu Fall bringen"
wuw_HUN_bringing_down_the_giants_desc:	"Es gibt viele so genannte Großmächte, die uns herausfordern und versuchen, unserer Freiheit ein Ende zu setzen. Das werden wir nicht zulassen, und um die Sicherheit unseres Volkes zu gewährleisten, müssen wir jede dieser Nationen präventiv niederschlagen, damit wir ein für alle Mal ohne die ständig drohende Vernichtung leben können."
HUN_bringing_down_the_giants_tt:	"Erreicht §Y[GetWargoalBasedOnGovernment]§! Kriegsziel gegen wichtige nicht-demokratische Nationen in Europa:"
wuw_HUN_the_cult_of_arpad:	"Der Kult von Árpád"
wuw_HUN_the_cult_of_arpad_desc:	"Der große Árpád, das Oberhaupt der Konföderation der magyarischen Stämme an der Wende vom 9. zum 10. Jahrhundert, ist eine große Inspiration für das ungarische Volk, und seine Dynastie hielt sich lange und machte [ROOT.GetnameDef] das Beste, was es sein konnte. Wir sollten uns eine Scheibe von ihm abschneiden und seinem Beispiel folgen, während wir ihn als Helden der Legenden hochleben lassen."
wuw_HUN_demand_szekely_autonomy:	"Fordern Sie die Autonomie der Székelys"
wuw_HUN_demand_szekely_autonomy_desc:	"Die in Siebenbürgen lebenden Szekler wünschen sich die Wiedervereinigung mit ihren ungarischen Brüdern so sehr wie jeder andere, und wir müssen dafür sorgen, dass das Szeklerland seine Unabhängigkeit erlangt, vorausgesetzt natürlich, dass es unter unserer Verwaltung steht."
wuw_HUN_approach_the_diasporas:	"Annäherung an die Diaspora"
wuw_HUN_approach_the_diasporas_desc:	"Seit dem Vertrag von Trianon gibt es eine ungarische Diaspora außerhalb unseres Landes in fast allen erdenklichen Richtungen. Wir müssen uns diesen Menschen wieder annähern und ihnen ein großes Gefühl von Nationalstolz und Patriotismus gegenüber dem ungarischen Staat einflößen, um sie auf ihre letztendliche Befreiung von ihren tyrannischen Unterdrückern vorzubereiten."
wuw_HUN_revive_the_tribal_consolidation:	"Die ungarische Nation wiederbeleben"
wuw_HUN_revive_the_tribal_consolidation_desc:	"Viele Menschen werden die vergangene Größe der ungarischen Nation vergessen haben, aber die Drachenbewegung hat das nicht. Es ist höchste Zeit, dass wir uns das zurückholen, was uns gehört, und unsere Gesellschaft so reformieren, dass sie in die von der Drachenbewegung geplante Form passt."
wuw_HUN_reclaim_the_pannonian_steppe:	"Die pannonische Steppe zurückerobern"
wuw_HUN_reclaim_the_pannonian_steppe_desc:	"Vor langer Zeit kamen die Magyaren in das Pannonische Becken und beanspruchten es als ihr Eigentum, indem sie die Konsolidierung der ungarischen Stämme bildeten. Jetzt besetzen fremde Eindringlinge unser angestammtes Land und verletzen damit eindeutig unsere angestammten Rechte. Wir müssen schnell zuschlagen und Pannonien von unseren Feinden zurückerobern."
wuw_HUN_undermine_the_admiral:	"Untergraben Sie den Admiral"
wuw_HUN_undermine_the_admiral_desc:	"Der Konteradmiral Miklós Horthy hat seine Zeit auf dem leeren [ROOT.GetAdjective] Thron schon viel zu lange genossen und könnte anfangen, eine Dynastie zu errichten. Wir müssen seiner Regentschaft ein Ende setzen und einen weiseren Mann wie Gyula Gömbös mit der Regentschaft betrauen. Die MOVE kann dazu beitragen, dass dies Wirklichkeit wird."
wuw_HUN_integrate_the_volksbund:	"Integrieren Sie den Volksbund"
wuw_HUN_integrate_the_volksbund_desc:	"Um Horthy zu stürzen, bräuchten wir eine Menge Männer. Solche Männer können wir in der nationalsozialistischen Bewegung, dem Volksbund der Deutschen in Ungarn, finden, so unbedeutend sie auch sein mögen. Wenn wir sie auf unsere Seite ziehen, könnten wir sie nicht nur für unsere Machtübernahme, sondern später auch als paramilitärische Truppe einsetzen."
wuw_HUN_volksbund_der_deutschen_in_ungarn:	"Volksbund der Deutschen in Ungarn"
wuw_HUN_volksbund_der_deutschen_in_ungarn_desc:	"Die von der DNSAP geförderte nationalsozialistische Bewegung, der Volksbund der Deutschen in Ungarn, wäre eine perfekte Organisation von Wachen und Milizen, die unserem neuen deutschen Monarchen treu ergeben sind. Wir sollten auf sie zugehen und die Zusammenarbeit mit ihrer Führung fördern."
franz_and_henrik_available_tt:	"§YFranz Anton Basch§! und §YHenrik Werth§! werden als Stufe 2 §YGeneral§! bzw. Stufe 3 §YFeldmarschall§! verfügbar"
HUN_volksbund_militia_recruitment_tt:	"Gewinnen Sie vier Volksbund §YMilitia§! Einheiten"
wuw_HUN_empower_the_greenshirts:	"Ermächtigen Sie die Grünhemden"
wuw_HUN_empower_the_greenshirts_desc:	"Die Ungarische Nationalsozialistische Partei und ihre Anhänger sind, obwohl sie ideologische Unterschiede zu Gömbös aufweisen, ein guter Verbündeter, da ihre Loyalität nicht bei Horthy liegt. Auch wenn es riskant ist, könnte es hilfreich sein, Waffen an ihre Partei zu schmuggeln, damit sie uns bei der Ablösung des Regenten helfen können."
wuw_HUN_the_march_on_budapest:	"Der Marsch auf Budapest"
wuw_HUN_the_march_on_budapest_desc:	"Jetzt, da die Faschisten organisiert und bewaffnet sind, können wir sie auf die Hauptstadt marschieren lassen und den Rücktritt des Regenten Miklós Horthy fordern. Auf diese Weise kann Gömbös seinen rechtmäßigen Platz als Herrscher des Landes einnehmen und umgehend die Ordnung wiederherstellen, indem er sich selbst zum Präsidenten von Ungarn erklärt."
wuw_HUN_government_of_national_unity:	"Regierung der nationalen Einheit"
wuw_HUN_government_of_national_unity_desc:	"Gömbös stärkte und bewaffnete unter anderem die Partei des Nationalen Willens, um Horthy die Regentschaft zu entreißen. Was er jedoch nicht erkannt hat, ist, dass sie nun die wahre Macht innehaben und dass es nun niemanden mehr gibt, der sich dem Aufstieg ihres Führers Ferenc Szálasi in den Weg stellt."
wuw_HUN_institute_corporatism:	"Institut für Korporatismus"
wuw_HUN_institute_corporatism_desc:	"Um unser Land nach den Verwüstungen und Demütigungen durch den Ersten Weltkrieg und den Vertrag von Trianon wieder auf die Beine zu bringen, müssen wir Mussolinis Wirtschaftsmodell übernehmen und eine Vielzahl von korporatistischen Reformen durchführen."
wuw_HUN_a_roman_catholic_state:	"Ein römisch-katholischer Staat"
wuw_HUN_a_roman_catholic_state_desc:	"Unser Land ist schon seit langer Zeit christlich. Einige der ersten ungarischen Konvertiten waren die Häuptlinge Harka Bulcsú und Gyula Geula um das Jahr 950. Wir sind auch heute noch streng katholisch und werden trotz aller Widrigkeiten nicht von unserem Weg abkommen."
wuw_HUN_incorporate_the_hungarian_life_movement:	"Die ungarische Lebensbewegung"
wuw_HUN_incorporate_the_hungarian_life_movement_desc:	"Wir sollten uns bemühen, den rechtsgerichteten Politiker Béla Imrédy und seine Bewegung des Ungarischen Lebens in unsere Organisation aufzunehmen und ihm einen Platz in unserer Regierung zu ermöglichen."
wuw_HUN_wherever_the_cross_points:	"Wo immer das Kreuz hinzeigt"
wuw_HUN_wherever_the_cross_points_desc:	"Wie das Symbol unserer Bewegung, das Pfeilkreuz, zeigt, muss Ungarn sein Geburtsrecht zurückfordern und sich in jede Richtung ausdehnen, in die die Pfeile zeigen. Die Zeit ist gekommen, das zurückzufordern, was rechtmäßig uns gehört!"
wuw_HUN_the_war_on_atheism:	"Der Krieg gegen den Atheismus"
wuw_HUN_the_war_on_atheism_desc:	"In den letzten Jahren haben die Menschen begonnen, Gott zu vergessen. Die immer größer werdende Geißel des Atheismus wird sich weiter ausbreiten, wenn wir sie nicht im Kern treffen. Wir müssen die Kommunisten jetzt zu Fall bringen, damit diese Ketzerei nicht ewig andauert."
wuw_HUN_heirs_of_the_huns:	"Erben der Hunnen"
wuw_HUN_heirs_of_the_huns_desc:	"Es gibt viele verschiedene Vorstellungen darüber, woher unser Volk stammt, wie z.B. die finno-ugrische oder die türkische Abstammung. Auch wenn eine dieser Vorstellungen bis zu einem gewissen Grad zutreffen mag, so muss doch bekräftigt werden, dass wir die wahren Erben der Hunnen sind und dass wir jeden vernichten werden, der sich uns widersetzt."
wuw_HUN_sway_the_count:	"Beeinflussen Sie den Grafen"
wuw_HUN_sway_the_count_desc:	"Graf Fidél Pálffy ab Erdőd ist ein Adliger und ein großer Befürworter des Nazismus deutscher Prägung in unserem Land. Er scheint bei den NSDAP-Kontakten sehr beliebt zu sein und könnte sehr nützlich sein, wenn wir versuchen, mit gleichgesinnten Staaten diplomatisch zu verhandeln."
HUN_hire_fidel_palffy_tt:	"Stellt §YCount Fidél Pálffy§! als Berater ein"
wuw_HUN_our_ancestral_lands:	"Unser angestammtes Land"
wuw_HUN_our_ancestral_lands_desc:	"Indem wir unsere Ansprüche nicht nur auf die alten finno-ugrischen Ländereien, sondern auch auf die alten türkischen Ländereien dank unseres behaupteten turanischen Erbes untermauern, können wir alle unsere alten Ländereien für uns beanspruchen und uns das zurückholen, was rechtmäßig uns gehört."
wuw_HUN_demand_croatian_reintigration:	"Fordern Sie die kroatische Reintegration"
wuw_HUN_demand_croatian_reintigration_desc:	"Da unsere Sicherheit und unser Weg dank unserer neuen Allianzen gesichert sind, können wir uns auf die wichtigeren Dinge konzentrieren. Große Teile des heutigen Kroatiens gehörten bis zum Ende des Großen Krieges zu unserem Königreich, und jetzt müssen wir unsere Ansprüche auf die Region durchsetzen."
wuw_HUN_increase_economic_cooperation:	"Wirtschaftliche Zusammenarbeit ausbauen"
wuw_HUN_increase_economic_cooperation_desc:	"Da unsere Regierung nun offener für die Zusammenarbeit mit Nachbarn und internationalen Akteuren ist, sollten wir uns um neue Handelsabkommen und Wirtschaftspakte mit unseren neu gefundenen Verbündeten bemühen."
HUN_increase_economic_cooperation_tt:	"Wir erhalten für jedes Startland im §YWestlichen Balkan§!, im §YÖstlichen Balkan§! und im §YNördlichen Balkan§!, das eine höhere als die §G85§! §Yopinion§! von uns hat, eine Off-Map §YCivilian Factory§!. Dies gilt auch für §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§!, §Y[TRA.GetNameDef]§! und §Y[SLO.GetNameDef]§!."
wuw_HUN_hold_territorial_referendums:	"Halten Sie territoriale Volksabstimmungen ab"
wuw_HUN_hold_territorial_referendums_desc:	"Nach dem Ersten Weltkrieg wurden uns viele Gebiete mit einem hohen Anteil an Ungarn ohne einen von internationalen Beobachtern überwachten demokratischen Prozess entrissen, wie es bei den Regionen in Schlesien und Schleswig der Fall war. Wir sollten diplomatisch auf unsere Nachbarn zugehen und um die Abhaltung solcher Referenden bitten, damit die Menschen entscheiden können, in welcher Nation sie leben möchten."
wuw_HUN_hold_territorial_referendums_tt:	"Schaltet Entscheidungen zu §YAbhaltung von Volksabstimmungen in verlorenen Gebieten§! frei, um zu versuchen, sie wiederzugewinnen"
wuw_HUN_sailing_the_danube:	"Schifffahrt auf der Donau"
wuw_HUN_sailing_the_danube_desc:	"Die große Donau ist seit langem das Lebenselixier unserer Nation, und wir haben eine lange und stolze Tradition, sie zu befahren, sei es für den Transport von Waren oder für die Verlegung unserer Armeen. Daher sollten wir in unsere Flussmarine investieren und dafür sorgen, dass unsere Schifffahrt auf dem Fluss weiterhin so reibungslos wie möglich funktioniert."
AUS_totalitarian_safety:	"Totalitäre Sicherheit"
AUS_totalitarian_safety_desc:	"1933 brachte Engelbert Dolfuss [AUS.GetNameDef] in den heutigen politischen Zustand, um die Sicherheit unserer Nation zu gewährleisten. Diese Entscheidung, das Parlament vollständig abzuschaffen, war bei unserem Volk umstritten, aber wir glauben, dass sie notwendig war, um unsere Sicherheit zu gewährleisten. Dolfuss mag nicht mehr unter uns weilen, aber wir sollten diesen Kurs zu unserer eigenen Sicherheit beibehalten."
AUS_clamp_down_on_dnsap:	"DNSAP einschränken"
AUS_clamp_down_on_dnsap_desc:	"Politische Parteien jenseits unserer Vaterländischen Front sind schon lange aus unserem Land verbannt worden. Trotzdem gibt es immer noch einige, und am beunruhigendsten ist die sogenannte DNSAP. Mit der falschen Behauptung, sie vertrete den wahren Austrofaschismus, argumentieren sie, dass wir unsere Souveränität aufgeben und uns mit [GER.GetNameDef] zusammenschließen sollten. Wir sollten uns sofort mit ihnen auseinandersetzen!"
AUS_clamp_down_on_dnsap_tt:	"§Y$AUS_kurt_schuschnigg$§! wird der Führer von §Y$AUS_fascism_vaterlandische_front_long$§! und die Regierungspartei wird zum §YFaschismus§! wechseln."
AUS_supporting_italy_in_ethiopia_focus:	"Unterstützen Sie [ITA.GetNameDef] in [ETH.GetNameDef]"
AUS_supporting_italy_in_ethiopia_focus_desc:	"Seit langem ist [ITA.GetNameDef] auf unserer Seite. Als einer der Garanten unserer Unabhängigkeit ist es von äußerster Wichtigkeit, dass wir mit ihnen auf gutem Fuß stehen und uns nicht von [GER.GetAdjective] Überredungsversuchen beeinflussen lassen. Indem wir den [ITA.GetAdjective] in [ETH.GetNameDef] helfen, bauen wir Vertrauen zwischen unseren Ländern auf und erhöhen die Chance, dass sie uns zu Hilfe kommen, wenn es nötig ist."
AUS_supporting_italy_in_ethiopia_focus_tt:	"Schaltet Entscheidungen zur §YS-Unterstützung von [ITA.GetNameDef] im Italo-Ethiopischen Krieg§! frei"
AUS_reach_out_to_italy:	"Erreichen Sie Italien"
AUS_reach_out_to_italy_desc:	"Obwohl wir unseren gerechten Anteil an Meinungsverschiedenheiten hatten, bleibt Italien der vertrauenswürdigste Verbündete, den wir in unserer derzeitigen Situation haben. Da die Unruhen und Spannungen in unserer Umgebung zunehmen, wäre es sinnvoll, sie um Unterstützung zu bitten."
AUS_approach_democratic_guarantors:	"Wenden Sie sich an die demokratischen Garantiemächte"
AUS_approach_democratic_guarantors_desc:	"Nach der Unterzeichnung des Vertrags von Saint-Germain-En-Laye standen wir mit einer viel zu kleinen Armee da, um uns zu verteidigen. Wenn wir uns in einer zunehmend gefährlichen Situation durchsetzen wollen, brauchen wir Unterstützung. Auch wenn wir mit den anderen Unterzeichnern des Vertrages meist nicht einer Meinung sind, sollten wir ihnen die Hand reichen und sie um Unterstützung bitten, falls der kalte Konflikt um uns herum heiß wird"
AUS_approach_democratic_guarantors_tt:	"§Auswirkungen für das jeweilige Land, wenn sie zustimmen:§!"
AUS_refine_vaterlandische_front:	"Verfeinern Sie die Vaterländische Front"
AUS_refine_vaterlandische_front_desc:	"Die Vaterländische Front ist seit langem ein Zusammenschluss von politischen Parteien, die durch die Selbstauflösung des Parlaments zu einer einzigen verschmolzen sind. Die ursprüngliche Ideologie des Austrofaschismus hat sich im Laufe der Zeit in einer Weise verändert, die nicht gerade zu unseren Gunsten war. Es ist an der Zeit, dass wir uns wieder auf den richtigen Kurs bringen."
AUS_seek_agreement_for_rearmament:	"Suchen Sie eine Einigung für die Wiederaufrüstung"
AUS_seek_agreement_for_rearmament_desc:	"Nachdem wir unsere Innenpolitik nun etwas besser im Griff haben, ist es an der Zeit, den Blick nach außen zu richten. Wir sind immer noch an den ungerechten Vertrag von Saint-Germain-En-Laye gebunden, der unser militärisches Wachstum und unsere Fähigkeit, uns zu verteidigen, behindert. Da wir in Bezug auf unsere Sicherheit ein wenig von den anderen Unterzeichnern abhängig sind, wäre es klug, sie über unsere Absicht, aufzurüsten, zu informieren und ihre Zustimmung einzuholen."
AUS_seek_agreement_for_rearmament_tt:	"Ein Event wird an §Y[ITA.GetFlag][ITA.GetName], [ENG.GetFlag][ENG.GetName] [FRA.GetFlag][FRA.GetName],§! und §Y[USA.GetFlag][USA.GetName]§! gesendet, damit sie der Anfrage zustimmen oder sie ablehnen können. Unabhängig von der Antwort kann die Entscheidung zur Wiederbewaffnung immer noch getroffen werden."
AUS_rearmament_and_guarantees_tt:	"§Sich gegen die Wünsche der Garantiegeber zu stellen, könnte diplomatische Konsequenzen nach sich ziehen, die von einer herabgesetzten Meinung bis hin zu zurückgezogenen Garantien reichen!§!"
AUS_disregard_the_treaties:	"Missachtung der Verträge"
AUS_disregard_the_treaties_desc:	"Wir respektieren zwar den Wunsch der Unterzeichner, uns an den Vertrag von Saint-Germain-En-Laye zu binden, aber die derzeitige Weltlage erlaubt es uns nicht mehr, die Vorgaben des Vertrags zu befolgen. Es kann sehr gut sein, dass diese Aktionen unsere Vertragspartner verärgern und dass wir die Konsequenzen tragen müssen, aber wir können uns nicht länger binden lassen."
AUS_rapid_rearmament:	"Schnelle Aufrüstung"
AUS_rapid_rearmament_desc:	"Endlich frei von den Fesseln des Vertrages müssen wir jetzt sofort aufrüsten. Unsere Armee und unsere Luftwaffe sind im letzten Jahrzehnt stark vernachlässigt worden, und es werden erhebliche Anstrengungen nötig sein, um uns wieder auf ein akzeptables Niveau zu bringen."
AUS_spanish_intervention:	"Intervention in Spanien"
AUS_spanish_intervention_desc:	"Die iberische Halbinsel ist von den Flammen eines Bürgerkriegs verschlungen worden. Viele äußere Kräfte mischen sich ein, während Nationalisten und Republikaner in einem gewaltsamen Konflikt aufeinanderprallen, und wir sehen keinen Grund, warum wir nicht auch eingreifen sollten. Durch ein Eingreifen könnten unsere Truppen mehr Erfahrung mit moderner Kriegsführung sammeln und einen Maßstab dafür bekommen, wie gut unsere Truppen dem heutigen Standard standhalten."
AUS_demand_part_of_spanish_winnings:	"Fordern Sie einen Teil des spanischen Gewinns"
AUS_demand_part_of_spanish_winnings_desc:	"Während die Flammen des Konflikts auf der iberischen Halbinsel langsam erlöschen und unsere Freunde in [SPA.GetNameDef] siegreich dastehen, ist es an der Zeit, dass wir einen Blick darauf werfen, was wir bei diesem Unterfangen gewonnen haben. Unsere Hilfe für die [SPA.GetAdjective] sollte uns in ihre Gunst gebracht haben, und es scheint nur recht und billig, dass wir eine Entschädigung für unsere Hilfe verlangen."
AUS_volunteer_effort_SPA_flag:	"Hat Freiwillige nach [SPA.GetFlag]§Y[SPA.GetNameDef]§! geschickt"
AUS_invite_spanish_refugees:	"Spanische Nationalisten einladen"
AUS_invite_spanish_refugees_desc:	"Trotz unserer besten Bemühungen im Bürgerkrieg konnten wir unseren [SPA.GetAdjective] Brüdern nicht zum Sieg verhelfen. Obwohl dies sicherlich ein sehr enttäuschendes Ergebnis ist, könnten wir ihnen und uns dennoch helfen, sich zu erholen, indem wir diejenigen, die für dieselbe Sache gekämpft haben, zu uns einladen und sie in die [AUS.GetAdjective] Gesellschaft und die Armee integrieren."
AUS_integrate_dnsap_remnants:	"Integrieren Sie die Überreste der DNSAP"
AUS_integrate_dnsap_remnants_desc:	"Es gibt immer noch Überbleibsel der DNSAP in [AUS.GetNameDef] trotz des strengeren Verbots. Während die meisten von ihnen sich hinter der Großdeutschen Volkspartei versammelt haben, existieren einige noch in einem politischen Vakuum. Wir sollten versuchen, sie für die Vaterländische Front zu rekrutieren, um weitere Aufstände von ihnen zu verhindern."
AUS_heimwehr_support:	"Gewinnen Sie die Unterstützung der Heimwehr"
AUS_heimwehr_support_desc:	"In den Jahren, in denen wir unter dem Vertrag von Saint-Germain-En-Laye [AUS.GetNameDef] lebten, stieg die Zahl der paramilitärischen Organisationen rapide an. Diese waren im Allgemeinen verboten und die meisten hatten eine politische Agenda, die sie vorantreiben wollten. Die Ideale der Heimwehr waren nie so weit von unseren eigenen entfernt. Wenn wir ihre Unterstützung gewannen, konnten wir sie überreden, Seite an Seite mit unserem Bundesheer zu kämpfen."
AUS_frontmiliz_focus:	"Frontmiliz"
AUS_frontmiliz_focus_desc:	"Jetzt, da wir das Vertrauen der [GetMilitiaName] gewonnen haben, müssen wir ihre rasche Integration in das Bundesheer sicherstellen. Auch wenn sie weiterhin ihre eigenen, separaten Einheiten bleiben, müssen wir dafür sorgen, dass beide Parteien nahtlos zusammenarbeiten. Dies wird unseren Erfolg sowohl auf dem Schlachtfeld als auch auf den Straßen unseres Landes sicherstellen."
AUS_fit_for_fight:	"Bereit zuzuschlagen"
AUS_fit_for_fight_desc:	"Wir haben einen weiten Weg zurückgelegt, um unsere Nation aus dem erbärmlichen Zustand, in dem sie sich befand, wieder aufzubauen, aber wir können hier nicht stehen bleiben. Während sich die Auswirkungen unserer Bemühungen um Wiederbewaffnung und Wiederaufbau bemerkbar machen, müssen wir unser Rechtssystem vorbereiten, damit unsere Gesetze unsere Bemühungen nicht behindern."
AUS_form_nachrichtenabteilun:	"Formular Nachrichtenabteilung"
AUS_form_nachrichtenabteilun_desc:	"Wir sind seit langem entwaffnet, und obwohl dies schreckliche Folgen hatte, gab es auch positive Seiten daran. Die Welt sieht in uns nur einen kleinen Emporkömmling, der sich nur auf seine Armee konzentriert. Wenn wir uns jetzt auf Geheimdienst und Spionage konzentrieren, können wir ihre eigenen Annahmen über uns zu unserem Vorteil nutzen."
nachrichtenabteilung_bonus:	"Bonus der Nachrichtenabteilung"
AUS_wienfilm_propaganda_effort:	"Wien-Film Propaganda"
AUS_wienfilm_propaganda_effort_desc:	"Wenn in der Welt Krieg wütet, ist es unerlässlich, dass wir unsere eigene Nation in Schach halten. In letzter Zeit haben wir gesehen, wie Länder ihre Filmindustrie nutzen, um die Stimmung ihres Volkes zu heben. Da wir unseren eigenen Wien-Film haben, sollten wir das auch tun."
AUS_consolidate_industries:	"Der Ständestaat"
AUS_consolidate_industries_desc:	"Unser Industriesektor ist in kurzer Zeit erheblich gewachsen und seine positiven Auswirkungen auf unsere Wirtschaft und unsere Armee sind unübersehbar. Um ihn weiter zu stärken, sollten wir einen Konsolidierungsplan aufstellen und sicherstellen, dass wir die bestmögliche Effizienz und Leistung aus diesen Industrien herausholen können."
AUS_universitat_graz:	"Universität Graz"
AUS_universitat_graz_desc:	"Die Universität in Graz hat uns viele kluge Köpfe und mehrere Nobelpreisträger gebracht. Eine engere Zusammenarbeit mit der Universität könnte unsere eigene Forschung erheblich beschleunigen."
AUS_recruiting_the_graduates:	"Rekrutierung aus der Universität"
AUS_recruiting_the_graduates_desc:	"Um unsere wissenschaftlichen Bemühungen langfristig aufrechtzuerhalten, müssen wir dafür sorgen, dass wir ständig neue Talente gewinnen. Durch die Zusammenarbeit mit der Universität Graz könnten wir Studenten, Absolventen und Professoren gleichermaßen für unsere eigenen Projekte gewinnen."
AUS_heritage_of_an_empire:	"Das Erbe eines Imperiums"
AUS_heritage_of_an_empire_desc:	"Wir haben nicht vergessen, was wir noch vor wenigen Jahrzehnten waren. Im Herzen ist [AUS.GetNameDef] immer noch ein Imperium, und mit harter Arbeit wird es nicht mehr lange dauern, bis wir es wieder sind. Es ist höchste Zeit, dass wir unser Volk auf diesen Übergang vorbereiten."
AUS_second_brothers_war:	"Der Zweite Bruderkrieg"
AUS_second_brothers_war_desc:	"Im Jahr 1866 begann ein Krieg zwischen uns und dem Vorgänger von [GER.GetNameDef]. Damals war es ein kleiner Streit um Schleswig-Holstein, aber die Zeiten haben sich geändert. Die [GER.GetAdjective]s sind weiterhin eine Bedrohung an unserer Nordgrenze. Es ist an der Zeit, dass wir diese brüderliche Rivalität ein für alle Mal beenden."
AUS_unlocks_reichstag_raid:	"Schaltet §YRaid§!:\nReichstagsbombenangriff auf §Y[GER.GetNameWithFlag]§! frei"
AUS_an_improved_german_state:	"Der bessere deutsche Staat"
AUS_an_improved_german_state_desc:	"Wir haben uns immer als das bessere deutsche Land in der Welt betrachtet und die letzten Zeiten haben uns Recht gegeben. Wir werden nicht länger zulassen, dass [GER.GetNameDef] den Ruf des deutschen Volkes befleckt. Es ist an der Zeit, dass wir sie in unser eigenes glorreiches Land integrieren und ihre Macht für uns nutzen!"
AUS_restoring_our_rightful_flag:	"Das Recht auf unsere Flagge wiederherstellen"
AUS_restoring_our_rightful_flag_desc:	"Als wir zu den Olympischen Spielen 1936 antraten, stellten wir fest, dass unsere Flagge die gleiche war wie die von [HAI.GetNameDef]. Widerwillig änderten wir unsere Flagge, um uns von ihnen zu unterscheiden, aber die Tatsache bleibt bestehen, dass die Flagge uns gehört, und da die [HAI.GetAdjective] sie damals nicht aufgaben, müssen wir auf andere Weise damit umgehen."
AUS_seek_to_purchase_alaska:	"Kauf der [463.GetName]"
AUS_seek_to_purchase_alaska_desc:	"1867 wurde uns von Alexander II. von Russland angeboten, [463.GetName] zu kaufen. Wir lehnten das Angebot damals ab, da der Staat uns nichts zu bieten hatte. Die Zeiten haben sich jedoch geändert, und wir sollten in Erwägung ziehen, mit dem Eigentümer von [463.GetName] in Kontakt zu treten, um einen Deal auszuhandeln."
AUS_bring_hungary_back_into_the_fold:	"Holen Sie Ungarn zurück in den Schoß"
AUS_bring_hungary_back_into_the_fold_desc:	"Es ist noch nicht lange her, dass wir und die [HUN.GetAdjective] Teil der gleichen großen Nation waren. Wir wurden nach dem Großen Krieg gewaltsam getrennt und beide durch ungerechte Verträge, die uns aufgezwungen wurden, stark geschwächt. Um zu verhindern, dass so etwas jemals wieder geschieht, sollten wir ihre vollständige Integration in [ROOT.GetNameDef] vorschlagen!"
AUS_bring_hungary_back_into_the_fold_tt:	"Schaltet Entscheidungen zu §YAnnexion der Alten Länder§! und separate Entscheidungen zu §YErhöhung der Wahrscheinlichkeit einer diplomatischen Annexion§! frei."
target_hun_tt:	"Die Entscheidungen zielen auf §Y[HUN.GetNameWithFlag]§! ab."
target_cze_tt:	"Die Beschlüsse zielen auf §Y[CZE.GetNameWithFlag]§! ab."
target_yug_tt:	"Die Entscheidungen zielen auf §Y[YUG.GetNameWithFlag]§! oder §YAny Country§!, die derzeit §Y[102.GetName]§!, §Y[109.GetName]§! und §Y[853.GetName]§! besitzen."
target_pol_tt:	"Die Entscheidungen werden §Y[POL.GetNameWithFlag]§! betreffen."
target_rom_tt:	"Die Entscheidungen werden auf §Y[ROM.GetNameWithFlag]§! abzielen."
target_alb_tt:	"Die Entscheidungen werden auf §Y[ALB.GetNameWithFlag]§! abzielen."
more_likely_to_accept_if_military_inferior_tt:	"Indem wir die Stärke unseres Militärs erhöhen, erhöhen wir die Chancen, dass sie eine friedliche Annexion akzeptieren!"
AUS_the_czechoslovakian_lands:	"Die tschechoslowakischen Gebiete"
AUS_the_czechoslovakian_lands_desc:	"Die Gebiete nördlich von uns in [CZE.GetNameDef] waren einst Teil unseres großen Reiches, bevor es zusammenbrach. Noch heute leben viele [GER.GetAdjective] sprechende Gruppen in diesen Regionen und deshalb ist es nur recht und billig, dass sie wieder Teil unseres wiedergeborenen Imperiums werden, ob sie sich friedlich anschließen wollen oder nicht, bleibt ihnen überlassen."
AUS_reclaiming_yugoslavian_territories:	"Rückeroberung der Balkan-Territorien"
AUS_reclaiming_yugoslavian_territories_desc:	"Unser großes Reich erstreckte sich einst bis zum Adriatischen Meer. Auch diese Gebiete wurden uns am Ende des Großen Krieges gestohlen. Mit der Rückforderung dieser Gebiete würden wir auch eine taktisch wichtige Küstenlinie zurückerobern. Wir sollten den Besitzern dieser Ländereien vorschlagen, sie uns friedlich zu überlassen, oder wir riskieren Konsequenzen."
AUS_reclaiming_yugoslavian_territories_tt:	"Der Besitzer von §Y[102.GetName]§!, §Y[103.GetName]§! und §Y[853.GetName]§! erhält Ereignis '§YUltimatum von [AUS.GetNameDef]§!'"
AUS_take_albania:	"Nehmen Sie Albanien"
AUS_take_albania_desc:	"[ALB.GetNameDefCap] war vielleicht nicht der wichtigste Teil unserer Ländereien, tatsächlich gehörte es nie wirklich uns, auch wenn sicherlich Pläne gemacht wurden, es dazu zu machen. Doch jetzt, da wir unsere Präsenz auf dem Balkan erneut abstecken, gibt es keinen Grund, es nicht erneut zu beanspruchen."
AUS_take_back_galicia:	"Galizien zurückerobern"
AUS_take_back_galicia_desc:	"Da unser Reich wieder zu wachsen beginnt, dürfen wir nicht davor zurückschrecken, unser rechtmäßiges Land auch von größeren Ländern zurückzufordern. [POL.GetNameDefCap] mag zumindest dem Anschein nach größer sein als wir, aber Galizien sollte trotzdem uns gehören, und wenn sie es uns nicht freiwillig überlassen, müssen wir vielleicht Gewalt anwenden."
AUS_demand_romanian_lands:	"Fordern Sie Transsilvanien und die Bukowina"
AUS_demand_romanian_lands_desc:	"Nachdem wir einige Ländereien in unserer unmittelbaren Nachbarschaft eingenommen haben, können wir nun damit beginnen, uns unsere weiter entfernten Gebiete anzusehen. Die Ländereien, die wir früher in [ROM.GetNameDef] besaßen, waren ein großer Gewinn für uns und wir sollten sie so schnell wie möglich zurückfordern. Was die [ROM.GetAdjective]-Führung denkt, spielt keine Rolle, wenn sie sich nicht bereitwillig unterwirft, müssen wir vielleicht andere Optionen in Betracht ziehen."
AUS_integrate_northwest:	"Integrieren Sie Böhmen"
AUS_integrate_northwest_desc:	"Um die Gebiete, die wir jetzt für uns beansprucht haben, besser nutzen zu können, müssen wir dafür sorgen, dass die Nation geeint bleibt. Die Staaten, die sich als die willigsten und nützlichsten erweisen, müssen so schnell wie möglich in das eigentliche Reich integriert werden. Die Territorien, die wir von [CZE.GetNameDef] beansprucht haben, haben sich als besonders vielversprechend erwiesen. Wir sollten sofort mit den Integrationsbemühungen beginnen!"
AUS_integrate_hungary:	"Integrieren Sie Ungarn"
AUS_integrate_hungary_desc:	"Um die Gebiete, die wir nun für uns beansprucht haben, besser nutzen zu können, müssen wir dafür sorgen, dass die Nation geeint bleibt. Die Staaten, die sich als die willigsten und nützlichsten erweisen, müssen so schnell wie möglich in das eigentliche Reich integriert werden. Die Territorien, die wir von [HUN.GetNameDef] beansprucht haben, haben sich als besonders vielversprechend erwiesen. Wir sollten sofort mit den Integrationsbemühungen beginnen!"
AUS_proclaim_austrian_empire:	"Rufen Sie das Österreichische Kaiserreich aus"
AUS_proclaim_austrian_empire_desc:	"Unsere Bemühungen um den Wiederaufbau und die Neugründung unseres Reiches haben sich endlich ausgezahlt. Wir haben alle unsere alten Territorien erobert und können uns mit Recht wieder ein Kaiserreich nennen!"
AUS_beyond_our_old_lands:	"Jenseits unserer alten Länder"
AUS_beyond_our_old_lands_desc:	"Da wir wieder zu einer Großmacht herangewachsen sind, stellt sich die Frage. Wir kontrollieren alle unsere alten Ländereien, aber warum hier aufhören? Mit der Macht, die wir derzeit besitzen, sollte es kein Problem sein, weiter zu expandieren."
AUS_join_the_axis:	"Stärke in Zahlen"
AUS_join_the_axis_desc:	"So stark wir auch alleine sind, es lässt sich nicht leugnen, dass die Zugehörigkeit zu einem Militärbündnis sowohl für uns als auch für das Bündnis, dem wir uns anschließen wollen, von Vorteil wäre. Wir sollten in Erwägung ziehen, uns an die Fraktion zu wenden, die uns am nächsten steht, und um Erlaubnis zu bitten, ihr beizutreten."
AUS_join_the_axis_tt:	"§Es ist sehr unwahrscheinlich, dass §R[GER.GetNameWithFlag] uns als Mitglied des [GER.GetFactionName] akzeptiert, selbst bei ausgezeichneten Beziehungen könnten sie uns ablehnen!§!"
AUS_reforming_the_central_powers:	"Reform der Zentralmächte"
AUS_reforming_the_central_powers_desc:	"Wir stimmen zwar zu, dass die Zugehörigkeit zu einem Militärbündnis unsere Stärke stärken würde, doch wenn wir uns die uns zur Verfügung stehenden Optionen ansehen, sind wir der Meinung, dass sie nicht ganz unseren Ansprüchen genügen. Während des Großen Krieges waren wir Teil der mächtigen Mittelmächte. In Ermangelung einer besseren Option sollten wir in Betracht ziehen, diese Fraktion zu reformieren."
AUS_reforming_the_central_powers_tt:	"Lädt §Y[GER.GetNameWithFlag]§!, §Y[TUR.GetNameWithFlag]§! und §Y[BUL.GetNameWithFlag]§! zu den §YCentral Powers§! ein, wenn sie §YFascist§! oder §YNon-Aligned§! sind und derzeit nicht in einer Fraktion sind."
AUS_for_a_better_future:	"Eine [AUS.GetAdjective] Zukunft"
AUS_for_a_better_future_desc:	"Wenn wir zurückblicken, war es immer unser Ziel, das wieder aufzubauen, was verloren war. Jetzt, da wir dies erreicht haben, müssen wir den Blick in die Zukunft richten."
AUS_war_against_bolshevism:	"Der Krieg gegen den Bolschewismus"
AUS_war_against_bolshevism_desc:	"Die [SOV.GetAdjective] Bolschewiken in unserem Osten waren uns ein ständiger Dorn im Auge. Um nicht überrumpelt zu werden, sollten wir sicherstellen, dass wir diejenigen sind, die zuerst zuschlagen."
AUS_crusade_on_communism:	"Kreuzzug gegen den Kommunismus"
AUS_crusade_on_communism_desc:	"Solange es Kommunisten auf dem europäischen Kontinent gibt, sind unser Land und sein Volk nicht sicher. Wir müssen dieser roten Bedrohung ein Ende setzen, bevor sie zu einer echten Quelle des Ärgers wird."
AUS_crusade_on_communism_tt:	"Gewinne §YAnnex§! Kriegsziel auf alle §YCommunist§! Nationen in §YEurope§!"
AUS_crusade_on_communism_d_tt:	"Erreicht §YTopple Government§! Kriegsziel für alle §YCommunist§! Nationen in §YEurope§!"
AUS_repeal_the_may_constitution:	"Aufhebung der Mai-Verfassung"
AUS_repeal_the_may_constitution_desc:	"Die so genannte Maiverfassung, die 1934 von Engelbert Dolfuss eingeführt wurde, hat die Politik von [AUS.GetNameDef] in den letzten Jahren behindert. Politische Parteien wurden verboten und die Nation damit aller Möglichkeiten beraubt, sich zum Besseren zu wenden. Wir müssen diese ungerechte Verfassung aufheben, wenn unser Land jemals wieder aufblühen soll."
AUS_austria_against_fascism:	"Reichsbund der Österreicher"
AUS_austria_against_fascism_desc:	"Während sich unser Land von der politischen Isolation erholt, die wir erduldet haben, ist es keine Überraschung, dass politische Gruppierungen entstehen, weil die Menschen sich endlich trauen, ihre Meinung zu sagen. Der legitimistische Reichsbund Der Österreicher ist eine solche Gruppe. Praktischerweise überschneidet sich ihre politische Agenda mit dem, was wir für die Nation geplant haben. Wir sollten sicherstellen, dass wir das Beste aus dieser Zusammenarbeit herausholen."
AUS_reinstate_the_imperial_council:	"Wiedereinführung des Herrenhauses"
AUS_reinstate_the_imperial_council_desc:	"Wie wir erwartet haben, wünscht sich unser Volk eine Rückkehr zu den alten Zeiten. Wir haben keinen Bedarf mehr an einem eindeutig fehlerhaften System, das missbraucht werden könnte, wie es die Faschisten bei der Selbstauflösung des Parlaments 1934 getan haben. Die Ein-Personen-Herrschaft war in der Doppelmonarchie immer ein sicheres und gut angenommenes System, es ist an der Zeit, dass wir es wieder einführen."
AUS_legacy_of_the_empire:	"Das Erbe eines Imperiums"
AUS_legacy_of_the_empire_desc:	"Auch wenn wir heute nur noch ein Schatten unserer Vergangenheit als mächtiges Imperium sind, spricht nichts dagegen, dass wir danach streben, das wieder aufzubauen, was wir einmal waren. Indem wir monarchistische Gefühle in unserer Nation schüren, können wir sie darauf vorbereiten, wieder eine mächtige Monarchie zu werden."
AUS_imperilalist_sentiments:	"Imperialistische Gefühle"
AUS_bring_back_the_habsburg_rule:	"Die Krone tragen"
AUS_bring_back_the_habsburg_rule_desc:	"Damit wir uns den Namen eines wahren Königreichs verdienen können, müssen wir einen König krönen, der unser Land führt. Unser derzeitiger Regent wird sicherlich ein guter König sein, und wir sollten seine Krönung unverzüglich vorbereiten."
AUS_bring_back_the_habsburg_rule_tt:	"Wenn Ihr derzeitiger Regent entweder §YOtto von Habsburg§! oder §YErnst Rüdiger Starhemberg§! ist, wird er zum Erzherzog von Österreich gekrönt und erhält die Eigenschaft:\n\n §YErzherzog von Österreich§!:\n - Politischer Machtzuwachs: §G+10%§!\n - Rekrutierbare Bevölkerung: §Y0.50%§!\n - Stabilität: §G+5%§!\n - Kriegsunterstützung: §G+5%§!\n - Tägliche Unterstützung für nicht ausgerichtete: §G+0.03§!"
AUS_repeal_the_habsburgergesetz:	"Aufhebung des Habsburgergesetzes"
AUS_repeal_the_habsburgergesetz_desc:	"Das Habsburgergesetz wurde 1919 nach dem Ersten Weltkrieg erlassen und schränkte die Rechte und Macht der Familie Habsburg stark ein. Unabhängig davon, wer unser Land jetzt regiert, war dieses Gesetz ein Schandfleck für [AUS.GetNameDef]s Ruf als Monarchie und muss sofort aufgehoben werden."
AUS_rebellious_rearmament:	"Rebellische Wiederbewaffnung"
AUS_rebellious_rearmament_desc:	"Zu lange schon ist [AUS.GetNameDef] durch den zutiefst ungerechten und höchst beunruhigenden Vertrag von Saint-Germain-En-Laye gebunden, ohne dass es einen Ausweg gibt. Mit der Wiedereinführung der Monarchie haben wir den Vertrag bereits in gewisser Weise gebrochen, und es sollte für uns auch keinen Grund geben, uns an den Rest dieser Punkte zu halten. Es ist an der Zeit, dass wir diesen katastrophalen Vertrag abschaffen!"
AUS_strengthen_legitimistische_corps:	"Legitimistische Corps stärken"
AUS_strengthen_legitimistische_corps_desc:	"Das Legitimistische Corps begann als Studentenorganisation für [AUS.GetAdjective] Adlige, die in unserem Land in der Oberstufe eingeschrieben waren. Anfangs waren sie nicht viel mehr als ein Zusammenschluss von Studenten mit ähnlichen Interessen, aber als das politische Klima härter wurde, haben sie sich zunehmend militarisiert. Wir sollten erwägen, sie zu rekrutieren, um die Einsatzzeiten zu verkürzen."
AUS_legitimistische_studentenverbindung:	"Legitimistische Studentenverbindung"
AUS_legitimistische_studentenverbindung_desc:	"Die studentische Interessenorganisation Legitimistische Studentenverbindung wendet sich an loyalistische Studenten aller Bildungsstufen. Sie ist weniger militaristisch als die Corps und setzt sich mehr für Diskurse und Debatten sowie für die Wissenschaft ein. Ihre Interessen und ihre unerschütterliche Loyalität gegenüber der Krone könnten sich für uns als äußerst nützlich erweisen!"
AUS_legitimistische_jugend:	"Legitimistische Jugend"
AUS_legitimistische_jugend_desc:	"Wir haben gesehen, dass Kinder und Jugendliche, die früh an die Monarchie und ihre Grundwerte herangeführt werden, zu loyalen und glücklichen Bürgern heranwachsen können, die für unsere Nation arbeiten und, wenn nötig, auch kämpfen. Es gibt Befürchtungen, dass dies zu viel Schlimmerem führen könnte, aber wir sind uns sicher, dass diese Erziehung für sie nur von Vorteil sein wird."
AUS_repeal_the_adelsaufhebungsgesetz:	"Aufhebung des Adelsaufhebungsgesetzes"
AUS_repeal_the_adelsaufhebungsgesetz_desc:	"Das Adelsaufhebungsgesetz trat zusammen mit dem Habsburgergesetz in Kraft und schaffte die Existenz des [AUS.GetAdjective] Adels effektiv ab. Titel, Ehrenprivilegien und Macht wurden diesen Familien im Handumdrehen entzogen. Dieses Gesetz ist offensichtlich falsch, und indem wir unsere Adligen und ihren Familienstolz wiederherstellen, können wir uns ihrer Loyalität in Zukunft versichern."
AUS_the_evidenzburo:	"Das Evidenzbureau"
AUS_the_evidenzburo_desc:	"Das Evidenzbureau wurde, wie so viele andere unserer sorgfältig ausgearbeiteten Systeme, am Ende des Großen Krieges abgeschafft. Da wir nicht mehr an diesen Vertrag gebunden sind, gibt es keinen Grund, warum wir an dieser Torheit festhalten sollten, die auch nicht mehr als Nachrichtendienst zugelassen ist."
AUS_the_evidenzburo_bonus:	"Evidenzbureau"
AUS_a_royal_alliance:	"Eine königliche Allianz"
AUS_a_royal_alliance_desc:	"Es ist einsam an der Spitze, und als eine der wenigen derzeit existierenden Monarchien scheint es nur recht und billig, dass wir uns mit denjenigen verbünden, die noch den Wert eines starken Monarchen an der Spitze ihres Landes sehen. Wir müssen uns an die Gleichgesinnten wenden und vorschlagen, dass wir uns gegen das größere Übel verbünden."
AUS_a_royal_alliance_tt1:	"Lädt §Y[ENG.GetNameWithFlag]§! zum §Y$AUS_a_royal_alliance$§! ein"
AUS_a_royal_alliance_tt2:	"Lädt §Y[FRA.GetNameWithFlag]§! zum §Y$AUS_a_royal_alliance$§! ein"
AUS_sturmscharen_support:	"Gewinnen Sie Sturmscharen-Unterstützung"
AUS_sturmscharen_support_desc:	"Die Sturmscharen haben immer als Mittelweg zwischen dem sozialdemokratischen Schutzbund und der nationalistischen Heimwehr fungiert. Obwohl sie in der Vergangenheit von unserem Gegner Kurt Schuschnigg geführt wurde, glauben wir, dass wir mit politischen Überschneidungen und unseren traditionellen Werten die Unterstützung der Ostmärkischen Sturmscharen gewinnen und sie für uns arbeiten lassen können."
AUS_eiserne_legion:	"Eiserne Legion gründen"
AUS_eiserne_legion_desc:	"Da unsere Führung nun überarbeitet wurde und paramilitärische Organisationen wieder zugelassen sind, hat sich die Möglichkeit ergeben, eine Elitewache speziell für [ROOT.GetLeader] zu gründen. Eine kleine Gruppe ehemals faschistisch ausgerichteter Beamter hat sich als Freiwillige gemeldet, um eine Elitewache zur Unterdrückung der Opposition und zur Kontrolle der Massen aufzubauen. Das ist eine große Chance für uns!"
AUS_the_royals_of_liechtenstein:	"Einladung an die Könige von Liechtenstein"
AUS_the_royals_of_liechtenstein_desc:	"Wir haben seit jeher enge Beziehungen zu Liechtenstein. Der jüngste Fürst, Franz Joseph I., nahm sich sogar eine [AUS.GetAdjective] zur Frau. Da Ferdinand kinderlos blieb, sollte die Krone entweder von Alois oder Johannes von Liechtenstein übernommen werden. Beide haben jedoch auf ihre Ansprüche auf die Krone verzichtet. Die beiden Prinzen bieten uns nun ihre Hilfe an, wir sollten dieses Angebot nutzen!"
AUS_osterreichische_akademie:	"Österreichische Akademie"
AUS_osterreichische_akademie_desc:	"Die Österreichische Akademie der Wissenschaften wurde 1846 durch ein handschriftliches Dekret von Kaiser Ferdinand I. gegründet. Seitdem hat sich die Akademie von einer kleinen wissenschaftlichen Vereinigung und Gesellschaft zu einer respektablen Akademie entwickelt, die Nobelpreisträger hervorgebracht hat. Die Akademie hatte während unserer Finanzkrise zu kämpfen, aber eine Investition von uns wird sie sicher wieder auf den richtigen Weg bringen und uns in Zukunft großen Gewinn bringen."
AUS_royal_scientific_grants:	"Königliche Wissenschaftsstipendien"
AUS_royal_scientific_grants_desc:	"Unsere Investitionen in die Österreichische Akademie der Wissenschaften haben sich sowohl für uns als auch für die Akademie als äußerst vorteilhaft erwiesen, und wir überlegen nun, ob wir diese Partnerschaft auf die nächste Stufe bringen sollen. Viele talentierte Wissenschaftler arbeiten derzeit für die Akademie und mit etwas Überzeugungsarbeit sollten wir in der Lage sein, sie auch für unsere eigenen Projekte zu gewinnen."
AUS_demand_hungarian_submission:	"Nachfrage [HUN.GetAdjective] Einreichung"
AUS_demand_hungarian_submission_desc:	"Sehr lange Zeit haben wir als Doppelmonarchie zusammen mit [HUN.GetNameDef] gediehen. Während dieses Arrangement damals funktionierte, erwiesen sie sich als weniger geschickt in der Staatskunst als wir, und das Wenige, was sie für unsere Nation taten, ließ viel zu wünschen übrig. Indem wir sie zu einem Marionettenregime von uns machten, konnten wir die besten Seiten der Doppelmonarchie nutzen, aber die schlimmsten vermeiden."
AUS_demand_hungarian_submission_tt:	"Schaltet Entscheidungen zur §YSubjugation von [HUN.GetNameDef]§! und separate Entscheidungen zur §YErhöhung der Wahrscheinlichkeit einer diplomatischen Unterwerfung§! frei."
AUS_subjugate_lands_of_old:	"Unterwerfung der alten Länder"
AUS_subjugate_lands_of_old_desc:	"Nachdem das unmittelbare Problem gelöst ist, müssen wir damit beginnen, wieder in unsere früheren Grenzen zu expandieren. Obwohl wir volles Vertrauen in unsere Diplomaten und, sollte es dazu kommen, in unsere Armee haben, wäre es klug von uns, diese Expansion schrittweise zu planen, anstatt eine totale Offensive an allen Fronten zu starten."
AUS_subjugate_lands_of_old_tt:	"Schaltet Entscheidungen zu §YSubjugate the Old Lands§! und separate Entscheidungen zu §YIncrease Probability for Diplomatic Subjugation§! frei."
AUS_the_silesian_question:	"Die schlesische Frage"
AUS_the_silesian_question_desc:	"Die schlesischen Länder waren lange Zeit ein Teil unseres riesigen Reiches. Obwohl sie nicht mit unserem Kernland verbunden sind, haben diese Staaten immer noch einen sehr hohen Wert für uns. Wir sollten diese Staaten zurückfordern."
AUS_reclaim_habsburg:	"Habsburg zurückfordern"
AUS_reclaim_habsburg_desc:	"Unsere eigenen Heimatländer sind noch immer nicht unter unserer Kontrolle. Die Habsbugs haben ihre bescheidenen Anfänge im Dorf Habsburg nicht vergessen, auch wenn die Familie adlig war, galten sie als niederer Adel. Die Dinge haben sich geändert, es ist an der Zeit, die Heimatländer zurückzuerobern."
AUS_reclaim_habsburg_tt:	"Sie werden es eher akzeptieren, wenn wir §GStärker§! sind als sie.\n\nEntscheidungen zur §YReintegration der Schweizer Staaten§!."
AUS_war_against_guarantors:	"Der Krieg gegen die Bürgschaftsgeber"
AUS_war_against_guarantors_desc:	"Die Texte im verabscheuungswürdigen Vertrag von Saint-Germain-En-Laye waren eindeutig: Sollten wir Hilfe bei der Verteidigung unserer Unabhängigkeit benötigen, sollten wir sie bekommen. Das waren jedoch nur leere Worte, um uns in Schach zu halten. Jetzt, da wir langsam wieder an die Macht kommen, ist es an der Zeit, dass wir uns rächen. Wir werden ihnen zeigen, dass sie sich nie wieder mit [ROOT.GetNameDef] anlegen werden!"
AUS_tighten_control_of_subjects:	"Die Kontrolle über die Untertanen"
AUS_tighten_control_of_subjects_desc:	"Wir haben uns in einigen unserer alten Länder als Oberherren etabliert, und obwohl das natürlich großartig ist, können wir hier nicht stehen bleiben. Unsere Marionettenvölker verdienen es, von großen Anführern geführt zu werden, genau wie wir, und zum Glück kennen wir genau diese Leute!"
AUS_tighten_control_of_subjects_tt:	"Wenn §YOtto von Habsburg§! der derzeitige Herrscher von §Y[ROOT.GetNameWithFlag]§! ist, schaltet er Entscheidungen zur §YEinsetzung eines habsburgischen Monarchen§! in §Y[HUN.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§! und §Y[POL.GetNameWithFlag]§! frei, sobald wir sie unterjocht haben."
AUS_tighten_control_of_subjects_tt2:	"Schaltet Entscheidungen zur §YEinsetzung eines Habsburger Monarchen§! in §Y[HUN.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§! und §Y[POL.GetNameWithFlag]§! frei, sobald wir sie unterworfen haben."
AUS_renew_claims_in_italy:	"Ansprüche erneuern in [ITA.GetNameDef]"
AUS_renew_claims_in_italy_desc:	"Damals, als die Gebiete nach dem Großen Krieg aufgeteilt wurden, nahmen uns die [ITA.GetAdjective] Südtirol und das Trentino ab, obwohl sie es nicht wirklich wollten. Da unsere Macht nun weitgehend wiederhergestellt ist, ist es unser gutes Recht, von ihnen zu verlangen, dass sie uns unsere rechtmäßigen Territorien zurückgeben."
AUS_extend_italian_claims:	"Erweitern Sie unsere [ITA.GetAdjective]-Ansprüche"
AUS_extend_italian_claims_desc:	"Wir haben unseren Kurs festgelegt, wie wir mit den Staaten umgehen wollen, die [ITA.GetNameDef] uns am Ende des Großen Krieges gestohlen hat. Wir haben [160.GetName] und [159.GetName] nie besessen, aber sie waren für uns immer von großem Interesse. Nachdem wir bereits beansprucht haben, was wir zuvor besaßen, warum gehen wir nicht einen Schritt weiter und nehmen uns, was wir wollten und immer noch wollen?"
AUS_extend_italian_claims_tt:	"Schaltet Entscheidungen zu §YReintegrate Italian Claims§! frei."
AUS_strike_deal_with_italy:	"Schließen Sie einen Handel mit [ITA.GetNameDef] ab"
AUS_strike_deal_with_italy_desc:	"Wir haben den Wunsch, das Trentino und Südtirol in Norditalien zu besitzen, seit sie uns am Ende des Großen Krieges weggenommen wurden. Die [ITA.GetAdjective] haben damals zum Ausdruck gebracht, dass sie nicht wollen, dass ihnen diese Gebiete nun aufgezwungen werden, nur um uns von ihnen fernzuhalten. Mit etwas diplomatischem Geschick sollten wir in der Lage sein, mit ihnen eine Einigung über diese Gebiete zu erzielen."
AUS_the_danubian_federation:	"Die Danubische Föderation"
AUS_the_danubian_federation_desc:	"Durch unsere einzigartige Lage in der Mitte Europas haben wir das Potenzial, sehr einflussreich zu werden, ohne dass wir dafür explizite territoriale Gewinne benötigen. Genauso wichtig wie die Macht unserer Armee ist die Macht, die unsere Worte und diplomatischen Aktionen haben. Durch die Bildung einer Gemeinschaft rund um die Donau könnten wir eine diplomatische Reichweite und Macht weit über unsere eigenen Grenzen hinaus haben."
AUS_invite_danubian_countries:	"Laden Sie die Donauländer ein"
AUS_invite_danubian_countries_desc:	"Jetzt, da unsere Absichtserklärung für jedermann sichtbar ist, ist es an der Zeit, diese Föderation zu erweitern, um das Beste zu erreichen, was möglich ist. Unser erster Schritt muss natürlich sein, die anderen dänischen Nationen, die derzeit allein dastehen, einzuladen, sich uns anzuschließen."
AUS_invite_danubian_countries_tt:	"Schaltet Entscheidungen zu §YEinladung der dänischen Länder in die dänische Föderation§! frei"
AUS_danubian_unity:	"Die donauländische Einheit"
AUS_danubian_unity_desc:	"Da unsere Föderation stetig wächst, müssen wir sicherstellen, dass wir auch unser eigenes Land und unsere Innenpolitik nicht vergessen. Unser Volk muss von der Größe wissen, die unsere Föderation ihm bringen wird!"
AUS_inviting_the_observers:	"Die Beobachter einladen"
AUS_inviting_the_observers_desc:	"Je mehr unsere Fraktion wächst, desto deutlicher wird, dass wir eine Kraft sein können, mit der man in Europa rechnen muss. Die Donau spielt nicht nur für die Länder, durch die sie fließt, eine wichtige Rolle, sondern auch für die Länder, die für ihre Transporte auf sie angewiesen sind. Wir sollten erwägen, diese Länder in die [ROOT.GetFactionName] einzuladen."
AUS_inviting_the_observers_tt:	"Schaltet Beschlüsse frei, um §YWeitere Nationen in den Donaubund einzuladen§!"
AUS_unexpected_alliances:	"Unerwartete Verbündete"
AUS_unexpected_alliances_desc:	"Wir müssen offen sein für alle danubischen Nationen, die sich unserer Fraktion anschließen möchten. Ungeachtet unserer früheren Differenzen müssen wir ihnen die Hand reichen und sie einladen, an unserer Seite für die Einheit Danubias zu kämpfen."
AUS_diplomatic_effort:	"Danubische Diplomatie"
AUS_diplomatic_effort_desc:	"Um die starke Führungspersönlichkeit zu bleiben, die unsere Föderation verdient, müssen wir dafür sorgen, dass wir bei allen unseren Mitgliedern beliebt sind. Wir sollten unsere diplomatischen Bemühungen verstärken, um unsere Beziehungen innerhalb der Föderation zu unterhalten und zu vertiefen."
AUS_diplomatic_effort_tt:	"Sobald wir unsere Föderation §Yexpandiert§! haben, werden wir durch diplomatische Bemühungen §Ydie Beziehungen zu den anderen Mitgliedern§! verbessern."
AUS_danubian_leader:	"Beschützer der donauländischen Interessen"
AUS_protector_of_the_danube:	"Der Beschützer der Donau"
AUS_protector_of_the_danube_desc:	" Angesichts der sich ständig verschlechternden Lage in unseren unmittelbaren Nachbarländern müssen Maßnahmen ergriffen werden, um die Langlebigkeit und Sicherheit aller unserer Mitglieder zu gewährleisten. Als Anführer der [ROOT.GetFactionName] muss diese Verantwortung auf uns fallen."
AUS_protector_of_the_danube_tt:	"Schaltet Entscheidungen frei, die [AUS.GetNameDef] vorschlagen, sich zu einem föderativen Staat zu vereinigen§! und [AUS.GetNameDef] Mitglieder auf unsere Seite zu ziehen§!\n§RGroßmächte werden dies höchstwahrscheinlich nicht akzeptieren, es sei denn, sie werden entweder erheblich geschwächt oder [AUS.GetNameDef] ist eine noch größere Macht!§!"
AUS_via_danube_to_europe:	"Über die Donau nach Europa"
AUS_via_danube_to_europe_desc:	"Wir haben eine ziemlich respektable Fraktion um uns geschart und obwohl wir hier aufhören könnten, könnten wir auch über die Donau hinaus schauen. Eine europaweite Fraktion, die sich auf die Zusammenarbeit und die Gemeinschaft innerhalb Europas konzentriert, könnte sich als ein sehr lohnendes Unterfangen erweisen."
AUS_via_danube_to_europe_tt:	"Ersetzt §Y$AUS_the_danubian_federation_category$§! Beschlüsse durch §Y$BEL_closer_european_union_cat$§! Beschlüsse, die es ermöglichen, weitere Länder einzuladen und auf eine §YLimited Federalization§!\n§RDies wird den gemeinsamen Fokus§! ''§Y$HABSBURG_an_empire_not_just_in_name$§!'' festschreiben §A, der, wenn §YNon-Aligned§!, einen §YNational Spirit§! auf alle Subjekte anwendet, wobei der §YJoint Focus Tree§! die Autonomie verringert und die vollständige Integration der Subjekte erleichtert§!."
AUS_the_right_to_rearm:	"Das Recht auf Aufrüstung"
AUS_the_right_to_rearm_desc:	"Seit dem Ersten Weltkrieg sind wir durch den Vertrag von Saint-Germain-En-Laye verpflichtet, die Größe unseres stehenden Heeres auf maximal 30000 Mann zu begrenzen. Angesichts der Entwicklungen um uns herum sind wir der Meinung, dass dies nicht länger tragbar ist und dass wir das Recht haben müssen, aufzurüsten."
AUS_the_right_to_rearm_dem_tt:	"Suchen Sie als §YDemokratisches§! Land die Zustimmung zur Wiederbewaffnung."
AUS_the_right_to_rearm_dem_instead_tt:	"Wenn [ROOT.GetNameDef] ein §YDemocratic§! Land wäre, würde es sich stattdessen um eine Zustimmung zur Wiederbewaffnung bemühen."
AUS_the_right_to_rearm_fed_tt:	"Als §YNon-Aligned§! Land rüsten Sie ohne Rücksicht auf die Konsequenzen auf."
AUS_the_right_to_rearm_fed_instead_tt:	"Wenn [ROOT.GetNameDef] ein §YNon-Aligned§! Land wäre, würde der Effekt stattdessen ohne Rücksicht auf die Konsequenzen aufrüsten."
AUS_defence_of_the_homeland:	"Die Verteidigung des Heimatlandes"
AUS_defence_of_the_homeland_desc:	"Jetzt, wo wir endlich unsere Armee wieder aufbauen können, müssen wir uns überlegen, wie wir sie spezialisieren können. Unsere geografische Lage ist derzeit ziemlich verwundbar. Es wäre von Vorteil, unsere Armee zu Meistern der Verteidigung zu machen und ihr beizubringen, wie sie unsere einzigartige Landschaft zu ihrem Vorteil nutzen kann."
AUS_the_political_front:	"Bewachung der politischen Front"
AUS_the_political_front_desc:	"Ein Krieg wird nicht nur an der Front und auf den Schlachtfeldern gewonnen, sondern ebenso sehr in den Fabriken und auf den Straßen. Durch die Stärkung unseres politischen Systems können wir sicherstellen, dass wir selbst im schlimmsten Fall die Kontrolle behalten."
AUS_austrian_aggression:	"Österreichische Aggression"
AUS_austrian_aggression_desc:	"Auch wenn die Verteidigung in diesen Zeiten eine naheliegende Option zu sein scheint, bedeutet dies doch nur, dass wir auf einen Angriff lauern. Würden wir stattdessen unsere Streitkräfte verstärken und dafür sorgen, dass unsere Armee jederzeit zum Angriff bereit ist, könnten wir potenzielle Angreifer wirksam abschrecken. Offensive ist schließlich die beste Verteidigung."
AUS_at_the_ready:	"In Bereitschaft"
AUS_at_the_ready_desc:	"Nicht nur unsere Armee muss zu Höchstleistungen und ständiger Bereitschaft gedrillt werden. Diejenigen, die unsere Armee mit Ausrüstung unterstützen, müssen sich ihrer Verantwortung für das Land bewusst werden. Indem wir dafür sorgen, dass die Arbeitnehmer immer bereit sind, unsere Streitkräfte zu unterstützen, schaffen wir die Voraussetzungen für unseren Erfolg."
AUS_form_dsn:	"DSN bilden"
AUS_form_dsn_desc:	"Unabhängig davon, ob wir aggressiv oder defensiv vorgehen, ist die Gewinnung von Informationen über potenzielle Feinde von größter Bedeutung. Wir dürfen uns weder von der Stärke, Schnelligkeit oder Koordination unserer Feinde überraschen lassen, noch dürfen wir zulassen, dass sie Informationen über uns erhalten."
AUS_form_dsn_tt:	"Angewandte Upgrades für die Agentur werden von [ROOT.GetNameDef]s Wahl zwischen §YVerteidigung des Heimatlandes§! oder §YAustrian Aggression§! abhängen"
AUS_release_imprisoned_leaders:	"Legalisieren Sie politische Opposition"
AUS_release_imprisoned_leaders_desc:	"Als unsere Nation allmählich immer autoritärer wurde, wurden diejenigen, die es wagten, sich ihr zu widersetzen, schnell inhaftiert. Diese Verhaftungen waren völlig ungerecht und rein politisch motiviert. Wir sollten die Inhaftierten freilassen und die politische Opposition wieder legalisieren."
AUS_hold_elections:	"Halten Sie Wahlen ab"
AUS_hold_elections_desc:	"Da unsere letzte Wahl am 9. November 1930 stattfand, bevor sich das Parlament 1934 selbst auflöste, hat unser Volk das Vertrauen in die [ROOT.GetAdjective]Demokratie fast verloren. Es sollte unsere oberste Priorität sein, diesen Glauben wiederherzustellen und das Volk zu Wort kommen zu lassen!"
AUS_rebuild_democratic_systems:	"Die demokratischen Systeme wieder aufbauen"
AUS_rebuild_democratic_systems_desc:	"Ein demokratisches System ist etwas sehr heikles, es ist leicht zu demontieren, aber schwer aufzubauen oder wiederherzustellen. Aber zum Wohle des Volkes muss dies sofort geschehen. Parteien, die Diktaturen fördern, müssen verboten werden, um des Volkes willen."
AUS_rebuild_democratic_systems_tt:	"Die derzeitige §YFascist§! Partei §YDNSAP§!, wird verboten und:"
AUS_a_new_constitution:	"Eine neue Verfassung"
AUS_a_new_constitution_desc:	"Unsere letzte Verfassungsrevision endete in einem Desaster mit der Mai-Verfassung und einem autoritären Regime, das das Land fest im Griff hat. Wir müssen sicherstellen, dass so etwas nie wieder passieren kann, indem wir eine streng demokratische Verfassung wieder einführen."
AUS_seek_support_from_guarantors:	"Suchen Sie die Unterstützung der Garanten"
AUS_seek_support_from_guarantors_desc:	"Der Vertrag von Saint-Germain-En-Laye bringt viele Einschränkungen für uns mit sich, aber es gibt auch einen Silberstreif am Horizont. Da wir keine respektable Armee haben dürfen, müssen uns die so genannten Garanten beschützen. Wir sollten uns an sie wenden und sie um diese Unterstützung bitten."
AUS_seek_support_from_guarantors_tt:	"Es ist wahrscheinlicher, dass sie positiv reagieren, wenn sie eine hohe§! Meinung von uns haben."
AUS_stabilize_the_political_climate:	"Stabilisieren Sie das politische Klima"
AUS_stabilize_the_political_climate_desc:	"Vielleicht ein Überbleibsel aus der Zeit, als politische Parteien noch verboten waren, ist unsere derzeitige Opposition radikal und extrem. Wir müssen sicherstellen, dass sie sich an die geltenden Gesetze halten, damit sie nicht Gefahr laufen, verboten zu werden. Diese nachsichtige Haltung sollte uns auch die Unterstützung ihrer weniger radikalen Anhänger sichern."
AUS_outlaw_the_radicals:	"Verbieten Sie die Radikalen"
AUS_outlaw_the_radicals_desc:	"Wir befinden uns in einer äußerst heiklen politischen Situation. Jetzt ist nicht die Zeit für Machtkämpfe zwischen radikalen Parteien an verschiedenen Enden des politischen Spektrums. Solange das Schlimmste noch nicht überstanden ist, können wir nicht zulassen, dass sie ihre abscheuliche Propaganda verbreiten!"
AUS_strengthen_the_cabinet:	"Stärkung des Kabinetts"
AUS_strengthen_the_cabinet_desc:	"Während sich demokratische Gefühle in [ROOT.GetNameDef] anständig schnell verbreitet haben, bleibt unser Kabinett immer noch relativ schwach. Die Macht sollte natürlich dem Volk gehören, und damit auch dem Parlament und dem Kabinett. Um effektiv regieren zu können, muss das Kabinett jedoch vorrangig behandelt werden."
AUS_pardon_political_exiles:	"Politische Exilanten begnadigen"
AUS_pardon_political_exiles_desc:	"Während der Zeit des sogenannten Korporationsstaates unter der Herrschaft des Austrofaschismus sind viele brillante Politiker aus unserem Land geflohen. Wir sollten ihnen das Angebot machen, zurückzukehren, unabhängig von ihrer politischen Einstellung."
AUS_join_the_allies:	"Schließen Sie sich den Alliierten an"
AUS_join_the_allies_desc:	"Traditionell haben wir uns immer als die Stärksten betrachtet, wenn wir auf uns allein gestellt waren. Doch da sich die Situation um uns herum immer weiter verschlechtert, müssen wir der Tatsache ins Auge sehen, dass dies vielleicht nicht stimmt. Alleine zu sein, ist nicht immer die beste Option. Wir sollten versuchen, uns einer starken demokratischen Fraktion anzuschließen."
AUS_join_the_allies_tt:	"Die Wahrscheinlichkeit, als Mitglied akzeptiert zu werden, hängt davon ab, wie demokratisch Sie sind und wie Sie zum Fraktionsführer stehen.\n\n Sollten wir abgelehnt werden, können wir stattdessen unsere eigene Fraktion gründen."
AUS_industrial_exchange:	"Austausch von Wissen"
AUS_industrial_exchange_desc:	"Wir haben viel von unseren neuen Verbündeten zu lernen, insbesondere in Sachen Bauwesen, aber auch in Bezug auf militärische Strategien. Da unsere Verbündeten diese Informationen bereitwillig mit uns teilen, sollten wir das Beste daraus machen."
AUS_alpine_federation_focus:	"Der Alpenbund"
AUS_alpine_federation_focus_desc:	"Wir sind nicht mehr der Meinung, dass ein Alleingang die beste Wahl für [ROOT.GetNameDef] ist, allerdings scheint keine andere Fraktion eine brauchbare Option zu sein. Dies wäre eine ausgezeichnete Gelegenheit für uns, den Rest der Alpenregion mit einem Vorschlag zu erreichen."
AUS_alpine_federation_focus_tt:	"Lädt §Y[SWI.GetNameWithFlag]§!, §Y[FRA.GetNameWithFlag]§! und §Y[ITA.GetNameWithFlag]§! zu Ihrer Fraktion ein, solange sie §YDemocratic§! oder §YNon-Aligned§! sind und sich derzeit nicht in einer Fraktion befinden."
AUS_invite_the_entente:	"Die Kleine Entente einladen"
AUS_invite_the_entente_desc:	"Unsere Fraktion würde von mehr Mitgliedern in der Region profitieren, auch wenn das bedeutet, dass wir uns über unsere alpinen Wurzeln hinaus ausdehnen müssen. Die kleine Entente wurde gegründet, um sich gegen die Rückkehr der Habsburger zu wehren, und da wir nun auf derselben Seite stehen, warum laden wir sie nicht ein?"
AUS_invite_the_entente_tt:	"Laden Sie §Y[YUG.GetNameWithFlag]§!, §Y[ROM.GetNameWithFlag]§! und §Y[CZE.GetNameWithFlag]§! in Ihre Fraktion ein, solange sie §YDemokratische§! oder §YNicht-Alliierte§! sind und sich derzeit nicht in einer Fraktion befinden."
AUS_offensive_on_the_fascists:	"Antifaschistische Offensive"
AUS_offensive_on_the_fascists_desc:	"Wir können nicht länger die Tatsache ignorieren, dass unser südlicher Nachbar die Ursache für viele unserer Probleme ist. Diplomatie ist zwar immer unsere bevorzugte Methode, aber manchmal ist ein drastischeres Eingreifen erforderlich."
AUS_lawmaking_leniency:	"Nachsicht bei der Gesetzgebung"
AUS_lawmaking_leniency_desc:	"Unser System zur Verabschiedung neuer Gesetze ist archaisch und bedarf dringend einer Überarbeitung. In Zeiten wie diesen müssen wir in der Lage sein, neue Gesetze schnell zu verabschieden, da sich die Situation von Tag zu Tag ändert. Wir sollten in Erwägung ziehen, uns für einen strafferen Gesetzgebungsprozess einzusetzen."
AUS_empowering_the_chancellor:	"Ermächtigung der Kanzlerin"
AUS_empowering_the_chancellor_desc:	"Die Rolle des Bundeskanzlers unseres Landes ist nicht leicht zu tragen. [ROOT.GetNameDefCap] wäre ohne [ROOT.GetLeader] nicht da, wo es heute ist, und auch wenn wir nicht zu einem Personenkult werden dürfen, sollten wir diese Wertschätzung für unseren Kanzler vielleicht kundtun."
AUS_join_the_research_program:	"Gemeinsame Forschungsprogramme"
AUS_join_the_research_program_desc:	"Da wir nun in einer Fraktion gleichgesinnter Länder sind, sollten wir versuchen, so viel wie möglich davon zu profitieren. Indem wir für uns und unsere Verbündeten eine Gruppe zur gemeinsamen Nutzung von Technologie bilden, können wir die Fraktion als Ganzes durch technologische Brillanz stärken."
AUS_join_the_research_program_tt:	"§Y[ROOT.GetNameDef]§!, und jedes Land, das mit uns in einer Fraktion ist, wird einer §YTech Sharing Group§! beitreten."
AUS_the_right_to_self_determination:	"Unser Recht auf Selbstbestimmung"
AUS_the_right_to_self_determination_desc:	"Wir haben uns schon früher auf das Recht auf Selbstbestimmung und dessen Schutz verlassen. Jetzt stehen wir auf der anderen Seite und müssen zum Beschützer jener Nationen werden, die jetzt im Angesicht gewaltsamer Unterdrückung um ihr Überleben kämpfen!"
AUS_our_brothers_in_the_east:	"Unsere Brüder im Osten"
AUS_our_brothers_in_the_east_desc:	"Auch wenn wir uns nun endlich wieder als Demokratie etabliert haben, gibt es immer noch andere, die im Schatten autoritärer Diktatoren leiden. Auch wenn wir uns kaum eine Wiedervereinigung mit unseren [HUN.GetAdjective] Brüdern wünschen, sind wir dennoch der Meinung, dass auch sie die Möglichkeit haben sollten, eine Entscheidung für sich selbst zu treffen. Die Demokratie muss auch für sie erreicht werden!"
AUS_deal_with_the_german_threat:	"Umgang mit der deutschen Bedrohung"
AUS_deal_with_the_german_threat_desc:	"[GER.GetNameDefCap] ist nun schon seit vielen Jahrzehnten eine Bedrohung an unserer nordwestlichen Grenze. Ihre Politik ist hart und mehr als einmal haben sie Drohungen gegen unsere Existenz ausgesprochen. Es ist an der Zeit, dass wir diese Bedrohung ein für alle Mal beenden."
AUS_end_european_fascism:	"Ein Ende des europäischen Faschismus"
AUS_end_european_fascism_desc:	"Niemand ist sicher, bevor wir alle sicher sind. Der Faschismus ist in Europa noch immer präsent und wird in Zukunft zweifellos weitere Probleme verursachen. Wir sollten Maßnahmen ergreifen, um die Ausbreitung dieser Ideologie zu verhindern."
AUS_end_european_fascism_tt:	"Gewinne §YPuppet§! Kriegsziel auf alle §YFascist§! Länder in §YEurope§!"
AUS_end_european_fascism_d_tt:	"Erreicht §YTopple Government§! Kriegsziel für alle §YFascist§! Länder in §YEurope§!"
AUS_austromarxism_focus:	"Austromarxismus"
AUS_austromarxism_focus_desc:	"Das Konzept des Austromarxismus, das von der Gruppe um Victor Adler, Otto Bauer, Karl Renner, Max Adler und Rudolf Hilferding entwickelt wurde, ist seit langem wegweisend. Angetrieben von ihren unterschiedlichen Perspektiven und ihrem Streben nach Verständigung entstand ein Mittelding zwischen Sozialdemokratie und Kommunismus. Er hat es ermöglicht, eine weitaus breitere Unterstützung in der Bevölkerung zu finden, als es eine der beiden Parteien für sich allein könnte."
AUS_rally_the_people:	"Das Volk versammeln"
AUS_rally_the_people_desc:	"In unserer Geschichte hat es eine Vielzahl von Putschversuchen durch diejenigen gegeben, die unsere Ideale teilen. In der Hoffnung, dass wir nicht wieder zu solchen Methoden greifen müssen, müssen wir das Volk auf unsere Seite ziehen und auf Reformen drängen."
AUS_ban_dnsap:	"Die Nationalisten ausrotten"
AUS_ban_dnsap_desc:	"Derzeit gibt es in unserem Land politische Parteien, die eine echte Bedrohung für die Gesellschaft darstellen. Auch wenn wir uns eine politische Opposition wünschen, müssen wir dafür sorgen, dass sie nicht unsere eigene Sicherheit riskiert. Die DNSAP muss wirklich verboten werden, und die Vaterländische Front muss als das erkannt werden, was sie ist!"
AUS_renounce_the_treaties:	"Verzicht auf den Vertrag"
AUS_renounce_the_treaties_desc:	"Obwohl unsere Regierung im Allgemeinen den Diskurs und die Diplomatie einem Konflikt und unüberlegten Handlungen vorzieht, haben wir in der Angelegenheit des Vertrages von Saint-Germain-En-Laye wenig Grund, zu trödeln. Während sich unsere Nation stabilisiert und wir die Kontrolle zurückgewinnen, gibt es für uns keinen Grund, an so strenge Regeln gebunden zu sein. Wir werden diesen Vertrag sofort aufheben."
AUS_emergency_measaures:	"Notfallmaßnahmen"
AUS_emergency_measaures_desc:	"Obwohl wir nie Befürworter von Revolutionen waren, wird immer deutlicher, dass wir uns nicht auf die Sozialdemokraten verlassen können, wenn es darum geht, die Veränderungen herbeizuführen, die nötig sind, damit unser Land wieder zu Wohlstand kommt. Wir müssen uns darauf vorbereiten, für die Arbeiter von [ROOT.GetNameDef] zu kämpfen!"
AUS_schutzbund_support:	"Gewinnen Sie die Unterstützung des Schutzbundes"
AUS_schutzbund_support_desc:	"Die meisten [ROOT.GetAdjective] paramilitärischen Gruppen haben eine nationalistische, legitimistische oder sogar faschistische politische Agenda, und sie sind nicht zuletzt mitverantwortlich für einige der vielen bewaffneten Konflikte in unserem Land. Der Republikanische Schutzbund hat zwar seinen Teil zu den Problemen beigetragen, aber politisch sind wir uns sehr ähnlich. Wir sollten sie für unsere Sache rekrutieren."
AUS_schutzbund_support_tt:	"§Y3§! Einheiten von §YSchutzbund-Divisionen§! werden in §Y[4.GetName]§! zu Beginn eines §YCommunist§! Bürgerkriegs spawnen.\n\nDie Gegenseite wird §Y1§! anstelle von §R2§! Einheiten von §YHeimwehr-Divisionen§! in §Y[152.GetName]§! spawnen"
AUS_intervention_in_spain:	"Intervention in Spanien"
AUS_intervention_in_spain_desc:	"Die [SPR.GetAdjective] sind derzeit in einen heftigen Bürgerkrieg verwickelt, der auf der iberischen Halbinsel wütet. Ungeachtet unserer prekären Lage sollten wir uns dennoch bemühen, ihnen zu helfen, schließlich kämpfen sie einen würdigen Kampf gegen die Nationalisten."
AUS_invite_spanish_exiles:	"Exilanten aus Spanien einladen"
AUS_invite_spanish_exiles_desc:	"Wir hatten auf einen anderen Ausgang des spanischen Bürgerkriegs gehofft. So wie wir auf dem Schlachtfeld unsere Hilfe angeboten haben, müssen wir nun auch anderswo unsere Hilfe anbieten und diejenigen aufnehmen, die vor der nationalistischen Herrschaft fliehen."
AUS_volunteer_effort_SPR_flag:	"Entsendung von Freiwilligen nach Spanien"
AUS_celebrate_spanish_victory:	"Feier des Sieges in Spanien"
AUS_celebrate_spanish_victory_desc:	"Während die gewalttätigen Auseinandersetzungen auf der iberischen Halbinsel langsam abklingen, ist klar geworden, dass die Republikaner die Kontrolle über ihr Land behalten haben. Unsere Hilfe hat wahrscheinlich auch zu diesem Sieg beigetragen, und es ist nur recht und billig, dass wir nach der Möglichkeit einer Entschädigung für unsere Bemühungen fragen."
AUS_revolution:	"Das Rote Wien zurückerobern"
AUS_revolution_desc:	"Die Zeit ist gekommen, in der es uns nicht mehr möglich ist, lediglich als Opposition zur Regierungspartei zu agieren. Unser Volk verdient etwas Besseres als das, was die derzeitige Führung bieten kann, und unsere steigende Popularität beweist, dass es jetzt an der Zeit ist, zuzuschlagen!"
AUS_revolution_tt:	"Wenn Sie den Nationalgeist §YMilitia Support§! haben, werden zu Beginn des Bürgerkriegs 3 Einheiten der §YSchutzbund Division§! aufgestellt."
AUS_revolution_tt_2:	"Die Anzahl der Truppen, die jede Seite erhält, hängt von der Popularität des §YCommunism§! ab. Wenn der §YCommunism Support§! über §Y60%§! liegt, wird der Bürgerkrieg vollständig vermieden."
AUS_seek_soviet_support:	"Suchen Sie die Unterstützung der Sowjetunion"
AUS_seek_soviet_support_desc:	"Wenn wir sowohl gegen die [GER.GetAdjective]-Bedrohung im Norden bestehen als auch unser Land in die kommunistische Gesellschaft verwandeln wollen, die es verdient, werden wir Unterstützung von außen brauchen. Wir hatten unsere leichten ideologischen Differenzen mit [SOV.GetNameDef], aber im Kern haben wir doch viele Gemeinsamkeiten."
AUS_seek_soviet_support_tt:	"§Wenn wir uns jetzt auf die Unterstützung von [SOV.GetAdjective] verlassen, werden wir später nicht in der Lage sein, sie anzugreifen!§!"
AUS_politicized_general_staff:	"Politisierter Generalstab"
AUS_politicized_general_staff_desc:	"Während wir bereits gesehen haben, wie paramilitärische Gruppen mit politischer Agenda zu einem echten Problem für uns werden können, kann man das von unserer regulären Armee nicht behaupten. Eine Armee, die sich in unserer Politik auskennt und unsere Visionen teilt, wird viel eher bereit und in der Lage sein, für unsere Sicherheit zu kämpfen!"
AUS_promote_the_worthy:	"Förderung der Würdigen"
AUS_promote_the_worthy_desc:	"Einige unserer Generäle sind sehr vielversprechend und loyal gegenüber unserer Sache und unserem Land. Indem wir an ihnen ein Exempel statuieren und sie mit Beförderungen belohnen, hoffen wir, mehr unserer Mitarbeiter zu einem solchen Verhalten zu ermutigen!"
AUS_align_with_ussr:	"Verbinden Sie sich mit den [SOU.GetAdjective]s"
AUS_align_with_ussr_desc:	"Es ist uns immer klarer geworden, warum [SOV.GetNameDef] so geführt wird, wie es geführt wird. Während wir anfangs Bedenken gegen das [SOV.GetAdjective]-System hatten, haben wir inzwischen erkannt, dass es vielleicht die beste Art ist, ein Land zu regieren. Wenn wir uns der Doktrin von [SOV.GetLeader] anschließen, werden wir nicht nur ein stabileres Land, sondern wahrscheinlich auch ihr Wohlwollen gewinnen."
AUS_align_with_ussr_tt:	"Der derzeitige Anführer von §YKPÖ§! wird eine Eigenschaft erhalten, die ihn an die Doktrin von §Y[SOV.GetFlag][SOV.GetLeader]§! anpasst, solange §Y[SOV.GetFlag][SOV.GetNameDef]§! noch §YCommunist§! ist."
AUS_raid_military_storages:	"Alte Militärlager plündern"
AUS_raid_military_storages_desc:	"Es gibt eine Menge militärischer Ausrüstung, die in alten Lagerbeständen im ganzen Land lagert. In unserer derzeitigen Situation glauben wir, dass diese in den Händen der Menschen nützlicher wären als weggeschlossen. Es ist an der Zeit, dass wir diese Ressourcen optimal nutzen."
AUS_properly_trained_militias:	"Ordnungsgemäß ausgebildete Milizen"
AUS_properly_trained_militias_desc:	"Unsere Milizen sind zu einem integralen Bestandteil der Verteidigung unseres Landes geworden, aber derzeit haben sie keine offizielle Ausbildung. Es liegt zwar in der Natur einer Miliz, dass eine vollständige Kontrolle und Ausbildung niemals möglich sein wird, aber eine Ausbildung wird uns allen gut tun."
AUS_the_peoples_army:	"Die Volksarmee"
AUS_the_peoples_army_desc:	"Unser Engagement für eine angemessene Bewaffnung des Volkes in dieser Situation hat einen unerwarteten, aber sehr willkommenen Nebeneffekt gehabt. Immer mehr Menschen wollen sich jetzt der Armee anschließen."
AUS_a_safe_harbor_for_dissidents:	"Ein sicherer Zufluchtsort für Dissidenten"
AUS_a_safe_harbor_for_dissidents_desc:	"Politische Exilanten sind in letzter Zeit zu einem häufigen Anblick in der Welt geworden, von denen einige ähnliche politische Ansichten wie wir vertreten. Wenn wir diese Exilanten für unsere Seite rekrutieren, könnten wir sehr von ihren Fähigkeiten profitieren."
AUS_a_safe_harbor_for_dissidents_tt:	"§YOlga Taratuta§!, die (§G+5%§! Kriegsunterstützung, §R-10%§! Stabilität, §G+10%§! Rekrutierbarer Bevölkerungsfaktor, §G+0.03§! Tägliche Unterstützung des Kommunismus) gewährt"
AUS_establish_rote_hilfe:	"Rote Hilfe wieder einführen"
AUS_establish_rote_hilfe_desc:	"Die Österreichische Rote Hilfe wurde im Jahr 1925 von Malke Schorr gegründet und geleitet. Seitdem und bis zum Verbot durch den korrupten austrofaschistischen Staat hat die Organisation unzähligen politischen Flüchtlingen und Asylbewerbern in [ROOT.GetNameDef] geholfen. Jetzt, da unser altes Regime nicht mehr existiert, ist es höchste Zeit, dass wir sie wieder frei agieren lassen."
AUS_a_new_beginning:	"Ein neuer Anfang"
AUS_a_new_beginning_desc:	"Während sich die Asche und der Staub legen und unsere neue Regierung ihren rechtmäßigen Platz einnimmt, müssen wir den Blick in die Zukunft richten. Dies ist erst der Anfang von [ROOT.GetNameDef], und gemeinsam werden wir wachsen!"
AUS_join_comintern:	"Treten Sie der Komintern bei"
AUS_join_comintern_desc:	"Nachdem wir uns mit der UdSSR verbündet haben, ist der Weg für uns nun ganz klar vorgezeichnet. Wir müssen uns unseren Genossen in der Komintern anschließen, das ist es, was unser Volk will und was es verdient!"
AUS_danubian_socialist_communes:	"Gründung des Danubischen Blocks"
AUS_danubian_socialist_communes_desc:	"Bis jetzt hat [ROOT.GetNameDef] allein gegen unsere Gegner gestanden. Wir wollen nicht, dass dies in Zukunft der Fall ist, aber es gibt derzeit keine Bündnisse, die mit den Idealen unseres Landes übereinstimmen. Unsere eigene Fraktion zu gründen ist eindeutig die beste Option!"
AUS_womens_education_initiative:	"Initiative für die Bildung der Frauen"
AUS_womens_education_initiative_desc:	"Seit Anfang 1900 ist es Frauen erlaubt, an Universitäten zu studieren, allerdings nur an ausgewählten Fakultäten. Eine Initiative, die darauf abzielt, dass die Universitäten für alle offen sind, würde unserer Nation wahrscheinlich gut tun."
AUS_universitat_wien:	"Universität Wien"
AUS_universitat_wien_desc:	"Wie die meisten unserer Universitäten litt auch die Universität in Wien unter der Herrschaft der Faschisten. Faschistisches Gedankengut wurde frei verbreitet, wenn auch meist von Studenten. Indem wir die Regeln verschärfen und dafür sorgen, dass dies nicht so weitergeht, können wir eine höhere Qualität der Ausbildung gewährleisten."
AUS_scientific_grants:	"Wissenschaftliche Zuschüsse"
AUS_scientific_grants_desc:	"In dem Maße, wie wir unser Budget für Wissenschaft und Forschung aufstocken, werden die potenziellen Anwendungsmöglichkeiten dieses neuen Wissens deutlich. Durch die Vergabe einer Reihe von Zuschüssen sollten wir in der Lage sein, die positiven Auswirkungen noch weiter zu verstärken."
available_scientist_tt:	"§GAvailable§! as a §YScientist§!:"
AUS_centralize_the_industrial_sector:	"Zentralisieren Sie den Industriesektor"
AUS_centralize_the_industrial_sector_desc:	"Je mehr Zeit vergeht und je mehr sich kommunistische Gefühle in der Nation breit machen, desto drastischere Maßnahmen können wir ergreifen. Noch vor ein paar Jahren wäre der bloße Gedanke an eine Zentralisierung der Industrie bei unserem Volk verpönt gewesen, jetzt scheint es nur noch der nächste logische Schritt zu sein."
AUS_cut_ties_with_the_church:	"Kappen Sie die Verbindungen zur Kirche"
AUS_cut_ties_with_the_church_desc:	"Unsere staatliche Bindung an die Kirche ist nur noch ein Überbleibsel des so genannten klerikalen Faschismus. Der Faschismus wurde bereits beseitigt, es ist an der Zeit, dass wir auch den Klerus von der politischen Macht entfernen."
generic_remove_as_political_advisor_tt:	"§RRentfernt§! als §YPolitischer Berater§!:"
AUS_spur_the_communist_resistance:	"Ermutigung zu kommunistischen Gefühlen"
AUS_spur_the_communist_resistance_desc:	"Die Welt um uns herum ist sowohl dem einfachen Mann als auch dem Arbeiter gegenüber deutlich feindlicher geworden. Während wir selbst glücklicherweise vom Schlimmsten verschont geblieben sind, können wir das Leiden unserer Brüder und Schwestern um uns herum nicht vernachlässigen."
AUS_danubian_communism_bypass_tt:	"Alle §YDanubischen§! Länder und Länder mit einem §YHistorischen Interesse§! an der Region §YDanubien§!:\nDie derzeit regierende Partei ist §YCommunist§!."
AUS_danubian_communism_bypass_has_rejected_tt:	"Hat [ROOT.GetAdjective] Versuche zurückgewiesen, den §YKommunismus§! zu stärken."
AUS_spur_the_communist_resistance_tt:	"Entfesselt Entscheidungen zur §YFörderung kommunistischer Gefühle§! in:"
AUS_rapid_revolutions:	"Schnelle Revolution"
AUS_rapid_revolutions_desc:	"Auch wenn sich unsere Lage durch unsere Aktionen zur Befreiung der ausländischen Arbeiter und zur Sicherung ihrer Produktionsmittel verschlechtert hat, bleibt keine Zeit zum Ausruhen. Wir müssen unsere Genossen so schnell wie möglich von den Fesseln des Kapitalismus befreien, auch wenn dies für unser Volk nur einen leichten und vorübergehenden Schlag bedeuten sollte."
AUS_meticulous_preparations:	"Akribische Vorbereitungen"
AUS_meticulous_preparations_desc:	"Es gibt eine echte Versuchung, die Befreiung der Arbeiter um uns herum zu überstürzen, aber das birgt das Risiko, die Heimatfront offen zu lassen. Unsere Bemühungen im Ausland haben in [ROOT.GetNameDef] einiges an Unruhe verursacht, wir sollten uns darum kümmern, bevor wir uns verpflichten, anderen zu helfen."
AUS_demand_liberation_of_workers:	"Die Forderung nach der Befreiung der Arbeiter"
AUS_demand_liberation_of_workers_desc:	"Für uns ist die Zeit zum Handeln gekommen. Indem wir den Geist des Kommunismus entlang der Donau stärken, müssen wir jetzt diejenigen befreien, die sich mit uns einig geworden sind!"
AUS_demand_liberation_of_workers_tt:	"Entfesselt Beschlüsse zur §YForderung der Befreiung der Arbeiter§! in den Ländern, in denen wir zuvor erfolgreich die kommunistische Stimmung gestärkt haben."
AUS_union_of_danubian_socialist_republics:	"Die Union der Danubischen Sozialisten"
AUS_union_of_danubian_socialist_republics_desc:	"Unser Einfluss breitet sich nun in ganz Europa aus, da die Arbeiter um uns herum befreit werden. Unser alter Name beschreibt nicht mehr, was wir wirklich sind. Wir sollten uns überlegen, wie wir bekannt sein wollen."
AUS_the_correct_communism:	"Die korrekte Form des Kommunismus"
AUS_the_correct_communism_desc:	"Es gibt viele Arten, den Kommunismus zu praktizieren, und die meisten von ihnen sind nicht nach unserem Geschmack. [SOV.GetNameDefCap] zieht den Namen unserer Ideologie in den Schmutz, so wie sie regieren. Wir dürfen nicht zulassen, dass sie weitermachen."
AUS_seize_galicia:	"Beschlagnahme der galizischen Ländereien"
AUS_seize_galicia_desc:	"Im Laufe der Jahre ist uns klar geworden, dass wir einen Teil unseres alten Reiches schmerzlich vermissen. Als wir sahen, wie Galizien in den letzten Jahren zerrissen und zwischen verschiedenen Ländern aufgeteilt wurde, waren wir umso entschlossener, es wieder in Besitz zu nehmen."
AUS_seize_galicia_tt:	"Gewinnen Sie Kerne auf §Y[88.GetName]§!,§Y[89.GetName]§! und §Y[91.GetName]§!.\n\nGewinnen Sie §YWargoals§!, um die Kerne in §YGalicia§! zurückzuerobern."
AUS_regulate_austrian_finance_sector:	"Regulierung des Finanzsektors"
AUS_regulate_austrian_finance_sector_desc:	"Die [AUS.GetAdjective] Wirtschaft kämpft immer noch, trotz unserer besten Bemühungen, sie wieder ins Gleichgewicht zu bringen. Wenn nichts unternommen wird, befürchten wir, dass ein weiterer großer Wirtschaftsabsturz mit der dazugehörigen Hyperinflation bald bevorsteht. Es ist an der Zeit, dass wir die Kontrolle über unseren Finanzsektor zurückerlangen."
AUS_regulate_austrian_finance_sector_tt:	"Schaltet die Bank §YIndustriekonzern§! frei und spezialisiert sie darauf, entweder §YProduktionseffizienz§! zu steigern oder den Bedarf an §YKonsumgütern§! zu senken. Alternativ kann die Bank auch §YBeides§! in geringerem Maße beeinflussen."
AUS_seek_papal_support:	"Suchen Sie päpstliche Unterstützung"
AUS_seek_papal_support_desc:	"Als katholisches Land haben wir immer großen Wert auf das Wort des Klerus gelegt. Durch die Unterstützung Seiner Heiligkeit könnten wir wahrscheinlich das Vertrauen unserer Bevölkerung in uns stärken."
AUS_seek_papal_support_tt:	"Veränderung der Popularität unserer derzeitigen Regierungspartei: §G5%§!"
AUS_saved_creditanstalt_flag:	"Neupriorisierung der Mittel für die Österreichische Creditanstalt"
AUS_saved_bankverein_flag:	"Neupriorisierung der Mittel für den Wiener Bankverein"
AUS_kept_creditanstalt_bankverein_flag:	"Beibehaltung der Fusion zwischen Creditanstalt und Bankverein"
AUS_invest_in_erzberg_steel_mines:	"Investitionen in die Erzbergwerke"
AUS_invest_in_erzberg_steel_mines_desc:	"[AUS.GetNameDefCap] hatte schon immer ziemlich viele Stahlminen. Die im Erzberg scheinen ein besonders fruchtbares Unterfangen zu sein. Wir sollten weitere Investitionen in Betracht ziehen, um das Beste daraus zu machen."
AUS_courting_the_princess_of_industry:	"Die Prinzessin der Industrie umwerben"
AUS_courting_the_princess_of_industry_desc:	"Es gibt viele Industriemagnaten in unserem Land, die uns wahrscheinlich unterstützen würden. Elisabeth von Gutmann, die Tochter des Gründers der Gebrüder Gutmann, die früher den Handel in Österreich beherrschten, scheint am vielversprechendsten zu sein. Wir sollten uns an sie wenden und sie um Hilfe bitten."
AUS_expand_stpoltner_steelworks:	"Erweitern Sie das St. Pöltner Stahlwerk"
AUS_expand_stpoltner_steelworks_desc:	"Die St. Pöltner Stahlwerke zeigen vielversprechende Ergebnisse. Wenn wir schnell handeln, sollten wir in der Lage sein, sie nach unseren Vorstellungen zu gestalten, um den Gewinn aus der Fabrik zu maximieren."
AUS_invest_in_semperit_synthetics:	"Investieren Sie in Semperit Synthetics"
AUS_invest_in_semperit_synthetics_desc:	"Da wir unsere Stahlversorgung geordnet haben, müssen wir auch andere Ressourcen in Betracht ziehen, die wir für unsere zukünftige Entwicklung benötigen könnten. Da wir nicht über eine gute und ausreichend große Quelle für Kautschuk und Öl verfügen, müssen wir nach anderen Möglichkeiten suchen, diese Ressourcen vor Ort zu erwerben."
AUS_invest_in_semperit_synthetics_bonus:	"Semperit Investitionen"
AUS_pulverfabrik_skodawerke:	"Investieren Sie in die Pulverfabrik Skodawerke"
AUS_pulverfabrik_skodawerke_desc:	"Die chemische Fabrik Pulverfabrik Skodawerke in Niederösterreich hat in der Vergangenheit viele Verwendungszwecke gehabt: Schießpulver, Dynamit und Chemikalien für Stahlwerke. Im Moment wäre es wahrscheinlich am besten, ihr Know-how in Richtung synthetische Rohstoffe zu lenken."
AUS_pulverfabrik_skodawerke_tt:	"§Y3x§! §G25%§! Forschungsbonus für: §YBrennstofflagerung§! und §YBrennstoffraffination§! Technologie."
AUS_pulverfabrik_skodawerke_bonus:	"Skodawerke Investitionen"
AUS_the_matzen_oil_fields:	"Erschließen Sie die Matzen-Ölfelder"
AUS_the_matzen_oil_fields_desc:	"Wir hatten vor kurzem einen Glückstreffer. In den Gebieten um Matzen im Osten von [AUS.GetNameDef] wurde Öl gefunden. Das ist eine Gelegenheit für uns, diese Ressource zu fördern und uns einen industriellen Vorsprung zu verschaffen!"
AUS_autobahn_west:	"Erweitern Sie die Autobahn West"
AUS_autobahn_west_desc:	"Unsere Infrastruktur braucht ein Update. So sehr wir uns auch gewünscht hätten, die Infrastruktur landesweit zu verstärken, die Realität unserer Wirtschaft und unserer industriellen Situation lässt das nicht zu. Der Ausbau nach Westen und die Verbindung unserer Autobahn mit [GER.GetNameDef] ist in unserer derzeitigen Situation die beste Lösung."
AUS_autobahn_south:	"Autobahn nach Süden ausbauen"
AUS_autobahn_south_desc:	"Unsere Infrastruktur muss erneuert werden. So sehr wir uns auch gewünscht hätten, die Infrastruktur landesweit zu verstärken, die Realität unserer Wirtschaft und unsere industrielle Lage lassen das nicht zu. Der Ausbau nach Süden und die Verbindung unserer Autobahn mit [ITA.GetNameDef] ist in unserer derzeitigen Situation die beste Lösung."
AUS_autobahn_east:	"Autobahn nach Osten ausbauen"
AUS_autobahn_east_desc:	"Wir haben unsere Autobahn mit unseren Partnern verbunden. Dies hat sich für beide Seiten als äußerst vorteilhaft erwiesen. Wenn wir nach Osten blicken, finden wir unseren alten Verbündeten in der Doppelmonarchie, [HUN.GetNameDef]. Wenn wir unsere Infrastrukturen miteinander verbinden würden, könnten wir wahrscheinlich auch eine bessere Beziehung zu ihnen aufbauen."
AUS_bbo_focus:	"Investieren Sie in die Bundesbahnen Österreich"
AUS_bbo_focus_desc:	"Bisher wurden unsere Eisenbahnen vernachlässigt, und der BBÖ, unserer Eisenbahngesellschaft, wurden die Mittel entzogen. Aber um ein erfolgreiches Land zu führen, egal wie groß oder klein, müssen wir eine gute Bahnabdeckung im ganzen Land sicherstellen. Wir sollten anfangen, in die BBÖ und unsere Eisenbahnen zu investieren."
AUS_bbo_focus_tt:	"§GErhöht§! die Effektivität der verfügbaren §YIndustrial Concern§!:"
AUS_architechtual_advancements:	"Architektonische Weiterentwicklungen"
AUS_architechtual_advancements_desc:	"Vor kurzem wurden wir auf einen außergewöhnlich fähigen Architekten an einer unserer Universitäten aufmerksam gemacht. Seine Gebäude besitzen sowohl die strukturelle Integrität als auch die Eleganz, die ein Land wie das unsrige verdient. Wir sollten in Erwägung ziehen, diese Person einzustellen."
AUS_economic_resuscitation:	"Wirtschaftliche Wiederbelebung"
AUS_economic_resuscitation_desc:	"Unsere Wirtschaft hat sich stabilisiert und stagniert auf einem sehr niedrigen Niveau. Manche sagen zwar, das sei gut, wir fallen nicht mehr wie ein Stein, aber wir wissen, dass wir es besser können. Es müssen noch Anstrengungen unternommen werden, und dieses Mal werden wir dafür sorgen, dass sie nicht nur kurzfristig wirken."
AUS_economic_resuscitation_tt:	"Verleiht Österreich wieder den Nationalgeist §YErholung von der wirtschaftlichen Depression§!, wenn die Wirtschaft des Landes weiter abgestürzt ist."
AUS_devalue_the_schilling:	"Entwerten Sie den Schilling"
AUS_devalue_the_schilling_desc:	"Einer der Gründe, warum unsere Wirtschaft kämpft und stagniert, ist unsere schwache Währung. Auch wenn die Inflationsrate bei weitem nicht mehr so hoch ist wie im Jahr 1929 (2877%), ist die Inflation immer noch zu hoch. Es mag nicht die populärste Entscheidung bei den Menschen sein, aber wir sollten eine Abwertung unserer Währung in Betracht ziehen."
AUS_devaluing_the_schilling_tt:	"Wenn der nationale Geist §Y$AUS_devalued_the_schilling$§! beseitigt ist, werden die Schwerpunkte §Y$AUS_bring_phonix_insurance_from_the_ashes$§! und §Y$AUS_great_austrian_economic_push$§! verfügbar."
AUS_bring_phonix_insurance_from_the_ashes:	"Phönix Versicherung aus der Asche holen"
AUS_bring_phonix_insurance_from_the_ashes_desc:	"Unsere Wirtschaft befand sich auf dem Weg der Besserung, bis uns Anfang 1936 der Phönix-Skandal ereilte. Ihre Kriegsbeteiligtenversicherung sorgte dafür, dass wir Männer für die Armee rekrutieren konnten, und hielt die Nation auch im Angesicht des Krieges bei Laune. Es könnte klug sein, Phönix aus der Asche wieder auferstehen zu lassen."
AUS_bring_phonix_insurance_from_the_ashes_tt1:	"Ersetzt den §YCovering for Phönix Insurance§! durch §YPhönix Insurance§!"
AUS_great_austrian_economic_push:	"Der große österreichische Wirtschaftsschub"
AUS_great_austrian_economic_push_desc:	"Unsere unermüdlichen Anstrengungen zahlen sich langsam aus, und unsere Wirtschaft wächst wieder. Wir könnten uns damit zufrieden geben, aber während dieses Prozesses der Wiederbelebung unserer Wirtschaft haben wir das ungenutzte Potenzial erkannt. Warum sollten wir uns mit weniger zufrieden geben, wenn wir unseren Finanzsektor noch weiter ausbauen können?"
AUS_great_austrian_economic_push_tt:	"Verbessert die Wirtschaft und die Fabrikproduktion von [ROOT.GetNameDef] weiter und ersetzt §YErholung von der wirtschaftlichen Depression§! durch §YWirtschaftsboom§!"
AUS_volkschule:	"Volksschule"
AUS_volkschule_desc:	"Während der Wirtschaftskrise war es üblich, dass Kinder nicht zur Schule gingen, sondern stattdessen arbeiten oder im Haushalt helfen mussten. Da die schlimmste Krise nun hinter uns liegt, müssen wir uns nun mit dieser Wissensschuld auseinandersetzen, damit wir nicht technologisch und wissenschaftlich ins Hintertreffen geraten. "
AUS_industrialization_effort:	"Bemühungen um Industrialisierung"
AUS_industrialization_effort_desc:	"Der [AUS.GetAdjective] Industriesektor hat unsere schwierige Lage erstaunlich gut überstanden. Angesichts der hohen Arbeitslosigkeit könnte sich dies auch als Chance erweisen. Durch den Ausbau unserer Industrien könnten wir zwei Probleme auf einmal angehen, sowohl unsere industrielle Kapazität erhöhen als auch die Arbeitslosigkeit verringern."
AUS_invest_in_alpen_elektrowerke:	"Alpen-Elektrowerke"
AUS_invest_in_alpen_elektrowerke_desc:	"Um auf dem internationalen Markt wettbewerbsfähig zu bleiben, müssen wir ständig innovativ sein und neue Lösungen entwickeln. Die Investition in ein Unternehmen wie die Alpen-Elektrowerke, das sich stark auf die Entwicklung elektronischer Geräte spezialisiert hat, könnte uns genau diesen Vorsprung verschaffen, den wir brauchen."
AUS_invest_in_kapsch:	"Telefon- und Telegrafen-Fabrik"
AUS_invest_in_kapsch_desc:	"Um auf dem internationalen Markt wettbewerbsfähig zu bleiben, müssen wir ständig innovativ sein und neue Lösungen entwickeln. Die Investition in ein Unternehmen wie die Telefon- und Telegrafen-Fabriks-Aktiengesellschaft, das sich sowohl mit Elektronik als auch mit Radar befasst, könnte uns einen Wissensvorsprung verschaffen, mit dem nur wenige Gegner mithalten können."
AUS_construction_guilds:	"Bau-Gilden gründen"
AUS_construction_guilds_desc:	"Da [AUS.GetNameDef] für die Industrie immer attraktiver wird, haben wir festgestellt, dass wir nicht mehr schnell genug neue Fabriken bauen. Die Gründung von Bauzünften würde helfen, den Bau im Land zu beschleunigen."
AUS_apprentice_programmes:	"Lehrlingsprogramme starten"
AUS_apprentice_programmes_desc:	"Nach einer langen Zeit der wirtschaftlichen Rezession und der Arbeitslosigkeit fehlt es vielen Menschen an den Fähigkeiten und der Erfahrung, die für die jetzt leicht zugänglichen Fabrikjobs benötigt werden. Durch die Einrichtung von Lehrlingsprogrammen würden wir ein Angebot schaffen, das sowohl für die Fabriken als auch für die Arbeiter von Vorteil ist."
AUS_osterreichische_luftstreitkrafte:	"Österreichische Luftstreitkräfte"
AUS_osterreichische_luftstreitkrafte_desc:	"Unsere Luftstreitkräfte wurden durch die Verträge, die uns für die Taten unserer Vorfahren auferlegt wurden, schwer und negativ beeinflusst. Um in dieser neuen, viel härteren Welt eine Chance zu haben, müssen wir den Wiederaufbau unserer Luftwaffe nach dem Standard der heutigen Zeit in Betracht ziehen."
AUS_preparing_the_industry:	"Flugzeugproduktion in den Lohner-Werken"
AUS_preparing_the_industry_desc:	"Einer unserer wichtigsten und geschätztesten Flugzeughersteller hat seit Inkrafttreten des Vertrags von Saint-Germain-En-Laye die Produktion neuer Flugzeuge vollständig eingestellt. Jetzt, da wir unsere Luftwaffe wieder aufbauen, müssen wir auch dafür sorgen, dass wir unsere Zulieferer wieder aufbauen."
AUS_purchase_foreign_designs:	"Kauf von ausländischen Flugzeugen"
AUS_purchase_foreign_designs_desc:	"Um in der Luft wirklich wettbewerbsfähig zu sein, müssen wir studieren, wie andere Länder ihre Flugzeuge konstruieren. Auch wenn die heimische Produktion ihre Vorteile hat, können wir durch den Kauf von Flugzeugen aus einer Vielzahl von Ländern die besten Flugzeuge für unsere Bedürfnisse finden, ohne dass wir dafür hohe Kosten aufwenden müssen."
AUS_seek_international_partners:	"Suchen Sie internationale Partner"
AUS_seek_international_partners_desc:	"Wenn wir in der Luft wettbewerbsfähig sein wollen, müssen wir von unseren Mitstreitern lernen, wie man eine Luftwaffe am besten führt. Indem wir von den Großmächten und Ländern lernen, die mit ähnlichen Problemen zu kämpfen hatten wie wir, können wir noch mehr erreichen als bisher."
AUS_seek_international_partners_tt:	"§YAuswirkungen für jedes Land, das akzeptiert!§!:"
AUS_seek_international_partners_tt2:	"§Y[ROOT.GetNameWithFlag]§! gewinnt 50 §YLufterfahrung§! für jedes Land, das annimmt!"
AUS_seek_international_partners_tt3:	"§Y[ROOT.GetNameWithFlag]§! erhält §YMarktzugang§! für jedes Land, das dies akzeptiert!"
AUS_air_research_boost:	"Eine innovative Luftwaffe"
AUS_air_research_boost_desc:	"_[GetAirPartners]"
AUS_has_no_air_partners:	"Trotz unserer besten Bemühungen ist es uns nicht gelungen, Partner für unsere Luftstreitkräfte zu gewinnen. Wir werden keine andere Wahl haben, als stattdessen in unsere eigene Forschung zu investieren."
AUS_has_air_partners:	"Nachdem wir nun eine Vielzahl von Flugzeugen getestet und geflogen haben, sind wir in der einzigartigen Lage, uns die Eigenschaften herauszupicken, die wir an unseren Flugzeugen mögen und die wir nicht mögen. Vielleicht sollten wir uns dieses neu gewonnene Wissen zunutze machen und einige der wünschenswertesten Eigenschaften der Flugzeuge, die wir getestet haben, zurückentwickeln."
AUS_innovative_airforce_bonus:	"Innovative Luftwaffe"
AUS_focus_on_domestic_production:	"Produktion von Flugzeugen im Inland"
AUS_focus_on_domestic_production_desc:	"Eine Luftwaffe ganz allein aufzubauen und zu unterhalten ist eine Mammutaufgabe. Aber in einer unruhigen Situation wie dieser können wir uns nicht von anderen abhängig machen, wenn es um einen wesentlichen Teil unserer Streitkräfte geht. Ungeachtet der hohen Anfangskosten müssen wir unsere Luftwaffe in die Lage versetzen, sich selbst zu versorgen."
AUS_revitalize_austrian_air_industry:	"Wiederbelebung der Luftfahrtindustrie"
AUS_revitalize_austrian_air_industry_desc:	"Vor und während des Ersten Weltkriegs hatten wir einige Flugzeughersteller in [AUS.GetNameDef]. Seit uns der Vertrag von Saint-Germain-En-Laye auferlegt wurde, ist dies jedoch unmöglich geworden. Jetzt, da der Vertrag aufgehoben ist, sollten wir schnell handeln, um unsere Industrie wieder aufzubauen und sie wiederzubeleben, falls wir sie brauchen sollten."
AUS_light_specialization:	"Initiative Jagdfliegerkompanie"
AUS_light_specialization_desc:	"Wir können nicht wirklich mit größeren Ländern konkurrieren, wenn es um größere Flugzeuge geht, aber mit überlegenen Jägern und CAS können wir sicherstellen, dass unser Feind unser Territorium nicht einmal erreicht. Luftkämpfe werden schließlich in den Dogfights gewonnen und verloren."
AUS_light_specialization_bonus:	"Jagdfliegerkompanie Initiative"
AUS_medium_specialization:	"Schlachtfliegerkompanie Initiative"
AUS_medium_specialization_desc:	"Unsere Luftwaffe muss in der Lage sein, viele Funktionen zu erfüllen. Wir haben nicht die Ressourcen, um alle Aspekte unserer Luftwaffe auszubauen, und deshalb ist es von größter Bedeutung, einen guten Kompromiss zu finden. Zweimotorige Flugzeuge können sowohl als Bomber als auch als Kampfflugzeuge eingesetzt werden und scheinen uns der perfekte Kompromiss zu sein."
AUS_medium_specialization_bonus:	"Schlachtfliegerkompanie Initiative"
AUS_heavy_specialization:	"Großflugzeugkompanie Initiative"
AUS_heavy_specialization_desc:	"Man kann davon ausgehen, dass andere von uns erwarten, dass wir eine Luftwaffe haben, die hauptsächlich aus kleineren Flugzeugen besteht. Eine schwere Luftwaffe mag unmöglich oder unpraktisch erscheinen, aber mit den richtigen Investitionen könnten wir die meisten Feinde durch schiere Kraft überwältigen."
AUS_heavy_specialization_bonus:	"Initiative Großflugzeugkompanie"
AUS_air_base_intiative:	"Bemühungen um den Bau von Luftwaffenstützpunkten"
AUS_air_base_intiative_desc:	"Es gibt zwar Luftwaffenstützpunkte in [AUS.GetNameDef], aber sie reichen nicht mehr aus, um unsere seit kurzem erheblich größere Luftwaffe unterzubringen. Um die Nutzung der Luftwaffe zu optimieren, sollten wir den Bau der notwendigen Infrastrukturen in Betracht ziehen, um unsere Flugzeuge in der Luft zu halten."
AUS_wien_anti_air_effort:	"Wiener Flaktürme"
AUS_wien_anti_air_effort_desc:	"Obwohl wir volles Vertrauen darauf haben, dass unsere Luftwaffe diese Nation vor Angriffen aus der Luft schützen wird, könnten Flaktürme in dicht besiedelten Gebieten eine willkommene zusätzliche Schutzschicht darstellen. Wir sollten die Errichtung von Flaktürmen in der Region Wien in Betracht ziehen."
AUS_radar_effort:	"Goldhaube Systems Anstrengung"
AUS_radar_effort_desc:	"Eine moderne Luftwaffe ist nicht nur auf ihre Flugzeuge angewiesen, sondern auch auf gute Technik, um sie zu führen. Mit der Entdeckung des Radars können wir es uns nicht erlauben, technologisch ins Hintertreffen zu geraten!"
AUS_flight_schools:	"Österreichische Fliegerschule"
AUS_flight_schools_desc:	"Damit wir in der Luft erfolgreich sein können, müssen nicht nur unsere Flugzeuge überlegen sein. Um unsere Vorherrschaft in der Luft zu sichern, müssen wir auch unsere Piloten bestmöglich ausbilden, um sie auf jede Situation vorzubereiten. Ähnlich wie wir unsere Bodentruppen trainieren, müssen wir auch für unsere Piloten ein Trainingsprogramm aufstellen."
AUS_neustadter_flugzeugwerke:	"Neustädter Flugzeugwerke"
AUS_neustadter_flugzeugwerke_desc:	"Kürzlich hat ein neuer Flugzeughersteller ein stillgelegtes Werk der Oesterreichischen Flugzeugfabrik erworben. Das neue Unternehmen, die Neustädter Flugzeugwerke, beabsichtigt, leichte Sportflugzeuge zu bauen, aber da das Unternehmen von zwei ehemaligen Kampfpiloten gegründet wurde, könnten wir sie vielleicht überzeugen, stattdessen für uns zu produzieren."
AUS_aerial_strategies:	"Strategien für die Luftfahrt"
AUS_aerial_strategies_desc:	"Aus seinen Erfahrungen zu lernen ist eine Tugend in Schlachten aller Art. Indem wir unsere Luftkampfstrategien ständig weiterentwickeln und verbessern, können wir sicherstellen, dass wir dem Feind immer einen Schritt voraus sind."
AUS_secret_rearmament:	"Geheimes Aufrüsten"
AUS_secret_rearmament_desc:	"Die Aufrüstungsbeschränkungen haben es über einen sehr langen Zeitraum hinweg unmöglich gemacht, irgendeine Art von Armeepräsenz aufzubauen. Der Vertrag von Saint-Germain-En-Laye gilt zwar immer noch, aber wir haben ein paar Schlupflöcher gefunden, die wir nutzen können, um eine heimliche Aufrüstung zu rechtfertigen."
AUS_militarization_effort:	"Grazer Maschinen-und Waggonbau"
AUS_militarization_effort_desc:	"Eine der Firmen, auf die sich unsere einst mächtige Armee stützte, war die Grazer Maschinen- und Waggonbau-Aktiengesellschaft. Sie baute nicht nur Fahrzeuge, sondern auch Achsen für Haubitzen und Gewehre und war einst ein Eckpfeiler unserer militärischen Kapazitäten. Wir sollten sie wieder zu einem solchen machen."
AUS_osterreichische_bundesheer:	"Österreichische[GetArmyName]"
AUS_army_is_bundesheer:	"s Bundesheer"
AUS_army_is_landwehr:	" Landwehr"
AUS_osterreichische_bundesheer_desc:	"Nachdem der Vertrag von Saint-Germain-En-Laye kein Hindernis mehr darstellt, ist es an der Zeit, mit dem Wiederaufbau zu beginnen. Wir können nicht zulassen, dass [ROOT.GetNameDefCap] überrumpelt wird, noch können wir erwarten, dass wir angesichts einer immer bedrohlicheren Welt einfach abwarten."
AUS_standardized_army_training:	"Standardisierte Armee-Ausbildung"
AUS_standardized_army_training_desc:	"Die Jahre, in denen wir keine neuen Truppen ausbilden konnten, haben ihre Spuren in den Ausbildungsregimentern unserer Divisionen hinterlassen. Wenn wir unserer Armee die bestmögliche Ausbildung bieten wollen, sollten wir über eine Aktualisierung der Ausbildungsverfahren für neue Truppen nachdenken."
AUS_osterreichische_fallschirmsjager:	"Österreichische Fallschirmjäger"
AUS_osterreichische_fallschirmsjager_desc:	"Nachdem wir sowohl unser Heer als auch unsere Luftwaffe wiederaufgebaut haben, ist es höchste Zeit, dass wir uns Gedanken darüber machen, wie wir diese beiden Unternehmungen zum Wohle der Allgemeinheit am besten miteinander verbinden können."
AUS_osterreichische_gebirgsjager:	"Österreichische Gebirgsjäger"
AUS_osterreichische_gebirgsjager_desc:	"Als sehr gebirgiges Land liegt es in unserem besten Interesse, sicherzustellen, dass unsere Truppen für Kämpfe unter diesen Bedingungen und in dieser Umgebung ausreichend ausgebildet sind."
AUS_osterreichische_gebirgsjager_tt:	"Ermöglicht §HMountain Defensive Training§!\n§HInfantry\n Mountains§!\n Defense: §G+5%§!\n Bewegung: §G+5%§!\n§HMBergsteiger\n Berge§!\n Verteidigung: §G+5%§!\n Bewegung: §G+10%§!\n"
AUS_osterreichische_seebataillon:	"Österreichisches Seebataillon"
AUS_osterreichische_seebataillon_desc:	"Wir haben viel durchgemacht, um an der Küste Fuß zu fassen, nur um festzustellen, dass unsere Armee für die Aufgabe, unter diesen Bedingungen zu kämpfen, sehr schlecht vorbereitet ist. Wir müssen herausfinden, was diesen Männern helfen könnte, effizienter zu kämpfen."
AUS_steyr_arms_investment:	"Investieren in Steyr Arms"
AUS_steyr_arms_investment_desc:	"Unser ehemaliges Flaggschiff unter den Waffenherstellern hat sehr darunter gelitten, durch den Vertrag von Saint-Germain-En-Laye gebunden zu sein. Um das Unternehmen wieder in die Lage zu versetzen, die von uns benötigten Mengen zu produzieren, sollten wir eine Investition in Betracht ziehen."
AUS_steyr_arms_investment_tt:	"Schaltet §YSteyr Arms§! als Designer frei"
AUS_improve_army_logistics:	"Verbesserte Heereslogistik"
AUS_improve_army_logistics_desc:	"Unser Land ist reich an schönen Landschaften, aber leider bedeutet dies auch, dass es reich an unwegsamem Gelände und logistischen Herausforderungen ist. Wenn wir diese nicht meistern, riskieren wir, dass unsere Kriegsanstrengungen schlechter ausfallen, als sie sollten."
AUS_reinforcing_the_supply_network:	"Verstärkung des Versorgungsnetzes"
AUS_reinforcing_the_supply_network_desc:	"Wir haben erkannt, dass die Anstrengungen, die wir unternommen haben, um unsere Versorgungslage zu verbessern, indem wir die Widerstandsfähigkeit unserer Armee gegenüber einer Unterversorgung erhöht haben, nicht ausreichen. Um die Situation ein für alle Mal zu lösen, müssen wir das Versorgungsnetz selbst verbessern."
AUS_supporting_the_troops:	"Unterstützung für die Truppen"
AUS_supporting_the_troops_desc:	"Um die Leistung unserer Truppen auf dem Schlachtfeld weiter zu verbessern, müssen wir ihnen so viel Unterstützung wie möglich bieten. Unterstützungskompanien mit Feldlazaretten, Aufklärungs- und Unterstützungsartilleriegeschützen würden uns sehr helfen."
AUS_bring_generals_out_of_retirement:	"Rufen Sie Generäle im Ruhestand in den Dienst zurück"
AUS_bring_generals_out_of_retirement_desc:	"Unsere Nation hat eine lange Geschichte des Kriegführens, die zwar ihre Schattenseiten hat, aber auch bedeutet, dass uns eine Vielzahl von talentierten Kommandeuren zur Verfügung steht. Einige von ihnen sind inzwischen in den Ruhestand getreten, aber mit etwas Überredungskunst sollten wir in der Lage sein, sie zurückzubekommen."
AUS_follow_the_jansa_plan:	"Folgen Sie dem Alfred-Jansa-Plan"
AUS_follow_the_jansa_plan_desc:	"Der erfahrene Feldmarschall Alfred Jansa arbeitet seit langem an einem Plan zur Verteidigung von [AUS.GetNameDef] im Falle eines [GER.GetAdjective]-Angriffs. Angesichts der aktuellen Lage in der Welt scheint es, dass wir diesen Plan leider brauchen könnten."
AUS_follow_the_jansa_plan_tt:	"§RWird Franz Böhme dauerhaft als möglicher Chef der Armee streichen!§!"
AUS_follow_the_jansa_plan_tt2:	"Verfügbar als §YHeereschef§!:"
AUS_fortify_the_traun_line:	"Befestigen Sie die Traunlinie"
AUS_fortify_the_traun_line_available_tt:	"Mindestens eine Provinz in §Y[152.GetName]§! oder §Y[4.GetName]§!, die an §Y[GER.GetNameWithFlag]§! grenzt, hat Platz für den Bau von §Y3§! oder mehr §YLand-Forts§!"
AUS_fortify_the_traun_line_bypass_tt:	"Keine der Provinzen in §Y[152.GetName]§! oder §Y[4.GetName]§!, die an §Y[GER.GetNameWithFlag]§! grenzen, hat Platz für den Bau von §Y3§! oder mehr §YLand Forts§!"
AUS_fortify_the_traun_line_desc:	"Der erste Schritt des von Jansa skizzierten Plans war es, Festungen entlang der Traun zu errichten, aber so wie die Dinge stehen, hat man sich entschieden, die Festungen an die [GER.GetAdjective] Grenze zu schieben. Wir sollten dieses Projekt in Angriff nehmen, bevor es nicht mehr von Nutzen ist."
AUS_fortify_the_traun_line_tt:	"Baut Stufe 3 §YLand Forts§! entlang der [GER.GetAdjective] Grenze von Linz bis Salzburg in Provinzen, die Platz dafür haben"
AUS_extend_the_traun_line:	"Erweitern Sie die Traunlinie"
AUS_extend_the_traun_line_desc:	"Während die derzeitigen Befestigungen die nordwestliche Grenze gesichert haben, haben wir immer noch einen Gebirgspass in der Nähe von Innsbruck, der unbewacht ist. Durch den Ausbau der Befestigungslinie können wir sicherstellen, dass sich kein Feind hinter unsere Befestigungen schleicht."
AUS_extend_the_traun_line_available_tt:	"Mindestens eine Provinz in §Y[153.GetName]§!, die an §Y[GER.GetNameWithFlag]§! grenzt, hat Platz, um §Y3§! oder mehr §YLand Forts§! zu bauen."
AUS_extend_the_traun_line_bypass_tt:	"Keine der Provinzen in §Y[153.GetName]§!, die an §Y[GER.GetNameWithFlag]§! grenzen, hat Platz zum Bau von §Y3§! oder mehr §YLand Forts§!"
AUS_extend_the_traun_line_tt:	"Baut Stufe 3 §YLand Forts§! entlang der [GER.GetAdjective] Grenze von Salzburg bis Innsbruck in Provinzen, die Platz dafür haben"
AUS_the_homeland_front:	"Die Heimatfront"
AUS_the_homeland_front_desc:	"Für den Fall einer groß angelegten Invasion muss jeder Österreicher seine Pflicht gegenüber dem Heimatland erfüllen. Wir sollten unsere Soldaten speziell für dieses Szenario, einen Kampf um die Heimat, ausbilden, um sicherzustellen, dass wir im Falle eines Falles gerüstet sind."
AUS_establish_bohme_plan:	"Führen Sie den Franz Böhme Plan ein"
AUS_establish_bohme_plan_desc:	"Franz Böhme, einer unserer Feldmarschälle, hat sich mit einem offensiven Schlachtplan für den Fall befasst, dass wir jenseits unserer Grenzen angreifen wollen. Bei unseren derzeitigen Ambitionen könnte dieser Plan nützlich sein."
AUS_establish_bohme_plan_tt:	"§AWird Alfred Jansa als möglichen Chef der Armee dauerhaft entfernen!"
AUS_intensify_training_efforts:	"Verstärkte Ausbildungsanstrengungen"
AUS_intensify_training_efforts_desc:	"Unsere Ausbildungsbemühungen haben sich zwar ausgezahlt, aber wir sind der Meinung, dass sie noch verbessert werden können. Durch eine effizientere Grundausbildung könnten wir die Zeit, die für die Ausbildung eines Soldaten benötigt wird, noch weiter verkürzen."
AUS_heeding_the_call_of_duty:	"Dem Ruf der Pflicht folgen"
AUS_heeding_the_call_of_duty_desc:	"Die Menschen in Österreich müssen sich mit der Situation unseres Landes abfinden. Zwar wünscht sich niemand, dass ein Krieg notwendig ist, aber es gibt keine Garantie, dass er nicht doch eintreten wird. Indem wir sicherstellen, dass unsere Nation unserem Urteilsvermögen vertraut und bereit ist, zu kämpfen, wenn die Notwendigkeit besteht, werden wir unsere Bereitschaft deutlich erhöhen."
AUS_strengthen_the_arms_industry:	"Leopold Gasser Waffenfabrik"
AUS_strengthen_the_arms_industry_desc:	"Einige unserer alten Hersteller produzieren noch immer zivile Güter, obwohl unser Bedarf an Rüstungsgütern inzwischen sehr offensichtlich ist. Mit einem finanziellen Anreiz sollten wir in der Lage sein, die Leopold Gasser Waffenfabrik dazu zu bringen, wieder ins Geschäft zu kommen und einige dringend benötigte Waffen zu produzieren."
AUS_improved_warfare_strategies:	"Verbesserte Strategien der Kriegsführung"
AUS_improved_warfare_strategies_desc:	"Nachdem wir viele Jahre unter dem Vertrag von Saint-Germain-En-Laye standen, sind unsere Strategien und Doktrinen sehr veraltet. Zwar haben wir uns bisher gut geschlagen, aber wenn wir sie nicht verbessern, sind wir zum Scheitern verurteilt."
AUS_improved_warfare_strategies_bonus:	"Verbesserte Strategien der Kriegsführung"
AUS_hirtenberger_artillery:	"Investieren Sie in Hirtenberger Artillerie"
AUS_hirtenberger_artillery_desc:	"Lange Zeit war Hirtenberger unsere erste Adresse, wenn wir Artilleriegeschütze und -munition benötigten. Jetzt hat das Unternehmen, wie auch der Rest unserer Militärindustrie, während des Vertrags von Saint-Germain-En-Laye unter Finanzierungsmangel gelitten. Wir sollten eine Investition tätigen, um sie wieder auf Kurs zu bringen. "
AUS_hirtenberger_artillery_tt:	"Schaltet §YHirtenberger Defence Systems§! als Konstrukteur frei"
AUS_saurerwerke:	"Österreichische Saurerwerke"
AUS_saurerwerke_desc:	"Die Österreichischen Saurerwerke stellen seit langem Lastwagen für verschiedene Zwecke her. In Zeiten wie diesen sollten sie sich jedoch ausschließlich auf das konzentrieren, was sie am besten können, nämlich Lastwagen für das Militär zu bauen."
AUS_graf_und_stift_focus:	"Gräf & Stift"
AUS_graf_und_stift_focus_desc:	"GRäf & Stift hat zwar praktisch nie Lastwagen für das Militär hergestellt, aber sie haben einen sehr guten Ruf für die Herstellung sehr schneller Autos und Lastwagen. Das ist zwar ein unkonventioneller Ansatz, aber er könnte sich in der Praxis durchaus als nützlich erweisen."
AUS_invite_foreign_tank_designers:	"Laden Sie ausländische Panzerentwickler ein"
AUS_invite_foreign_tank_designers_desc:	"[AUS.GetNameDefCap] fehlt derzeit ein zuverlässiger Panzerentwickler. Bisher wurde eine Vielzahl von Panzern verwendet, aber es ist an der Zeit, dass wir anfangen, unsere eigenen Panzer zu produzieren. Ansaldo einzuladen, hier zu arbeiten, ist ein guter erster Schritt."
AUS_invite_foreign_tank_designers_tt:	"Schaltet §YAnsaldo§! als Konstrukteur frei"
AUS_basic_tanks:	"Panzer-Bemühungen"
AUS_basic_tanks_desc:	"Die meisten unserer Panzer sind ein wenig veraltet und könnten eine Überarbeitung vertragen. Jetzt, wo wir jemanden haben, der die Panzer baut, könnten wir ein wenig in die Forschung investieren, wie wir unsere Panzer am besten verbessern können."
AUS_panzer_effort_bonus:	"Panzer-Aufwand"
AUS_advanced_tanks:	"Erweiterte Panzerbemühungen"
AUS_advanced_tanks_desc:	"Wenn wir uns unsere Panzer ansehen, stellen wir fest, dass sie entweder sehr schwer gepanzert und langsam sind oder sehr leicht und wendig, aber nicht so robust. Indem wir das Beste aus diesen beiden Konstruktionskonzepten auswählen, sollten wir in der Lage sein, Panzer zu bauen, die robust, aber wendig, schwer gepanzert und dennoch schnell sind."
AUS_reestablish_austrian_navy:	"Die Marine wiederaufbauen"
AUS_reestablish_austrian_navy_desc:	"Der Verlust unserer Küstenlinie am Ende des Großen Krieges bedeutete, dass wir keine Möglichkeit mehr hatten, neue Schiffe zu bauen. Widerwillig gaben wir den Rest unserer Flotte an den ausbrechenden Staat [YUG.GetNameDef] ab, der sie dann keine zwei Wochen später wieder abgab. Jetzt, da wir wieder die Möglichkeit haben, eine Flotte aufzubauen, müssen wir dafür sorgen, dass sich dieser Fehler nicht wiederholt."
AUS_build_dockyards_if_coastal:	"Wird sofort eine §YNaval Dockyard§! in einem zufälligen Küstenstaat bauen, den Österreich kontrolliert, nur verfügbar, wenn es mindestens einen Küstenstaat kontrolliert."
AUS_rebuild_the_armada:	"Bauen Sie die Armada wieder auf"
AUS_rebuild_the_armada_desc:	"Wir haben in der Vergangenheit mächtige Kriegsschiffe gebaut und die Meere beherrscht. Diese Zeiten scheinen weit weg zu sein, aber das Wissen ist noch nicht verloren. Es ist an der Zeit, dass wir die Meere zurückerobern, und was liegt näher, als eine große Flotte mit großen Schlachtschiffen aufzubauen, um alle potenziellen Angreifer abzuschrecken."
AUS_revive_stt:	"STT wiederbeleben"
AUS_revive_stt_desc:	"Stabilimento Tecnico Triestino war einst unsere bevorzugte Werft für unsere größeren Schiffe. Die Schiffe, die sie herstellten, waren von exquisiter Qualität und haben uns damals gute Dienste geleistet. Da wir nun wieder einige Werften unter unserer Kontrolle haben, sollten wir sie wieder in Betrieb nehmen."
AUS_rebuild_the_armada_bonus:	"Wiederaufbau der Armada"
AUS_streamline_production:	"Rationalisierung der Schiffsproduktion"
AUS_streamline_production_desc:	"Große Schiffe haben viele Vorteile, wie z.B. die Abschreckung von Angriffen und die Fähigkeit, unseren Gegnern schweren Schaden zuzufügen. Sie haben jedoch auch einen großen Nachteil: Die Kosten, sowohl in Bezug auf Zeit als auch auf Material, sind hoch. Unsere Schiffsingenieure haben Ideen, wie wir die Produktion beschleunigen können."
AUS_continue_old_production:	"Die alten Produktionslinien weiterführen"
AUS_continue_old_production_desc:	"Bevor wir die Kontrolle über unsere Küste verloren, hatten wir mit der Produktion von zwei glorreichen Schlachtschiffen begonnen.  Ihre Rümpfe befinden sich noch immer in unseren Händen und obwohl sie inzwischen etwas veraltet sind, könnten sie sich immer noch als wunderbare Bereicherung für unsere neuen Flottenbemühungen erweisen."
AUS_continue_old_production_tt:	"Wenn Sie die Technologie zum Bau von §YSchlachtschiffen§! noch nicht freigeschaltet haben, schalten Sie diese Technologie frei."
AUS_reclaim_dockyards:	"Alte Werften zurückgewinnen"
AUS_reclaim_dockyards_desc:	"So wie sich die Art der Seeschlacht verändert, so verändern sich auch die Bedürfnisse unserer Marine. Die Zeiten, in denen wir nur ein paar wenige, aber mächtige Schiffe in die Schlacht schicken konnten, sind längst vorbei. Moderne Seeschlachten erfordern eine viel größere Kapazität für den Bau neuer Schiffe und die Reparatur unserer eigenen. Wir sollten die Zahl der Werften ausbauen."
AUS_promote_admirals:	"Admirale befördern"
AUS_promote_admirals_desc:	"Nachdem wir so lange keine Marine hatten, ist es nur natürlich, dass wir nicht mehr so viele Admirale haben wie früher. Der Pool möglicher Admirale ist zwar nicht gerade groß, aber wir haben immer noch ein paar mit zumindest etwas Erfahrung, die unsere Flotten zum Sieg führen könnten."
AUS_promote_admirals_tt:	"Schaltet §YJohannes von Liechtenstein§! (Fertigkeit 3) und §YCarl Heinz Birnbacher§! (Fertigkeit 2) als Admirale frei"
AUS_promote_admirals_fasc_com_tt:	"Schaltet §YCarl Heinz Birnbacher§! (Fertigkeit 2) als Admiral frei"
AUS_defending_the_coast:	"Verteidigung der Küste"
AUS_defending_the_coast_desc:	"So sehr uns der Wiederaufbau unserer alten Marine in all ihrer Pracht auch reizt, wir müssen der Wahrheit ins Auge sehen. Eine groß angelegte Produktion von Kapitalschiffen ist für uns in absehbarer Zeit nicht vorgesehen. Wenn wir dieses kleine Standbein an der Küste nicht sofort nutzen, werden wir es eher verlieren, als dass wir jemals wieder eine Seeschlacht gewinnen. Große Schiffe müssen warten, denn was wir jetzt brauchen, ist eine Flotte, die unsere Küste schützen kann."
AUS_defending_the_coast_bonus:	"Die Küste verteidigen"
AUS_elin:	"ELIN"
AUS_elin_desc:	"Inspiration kann von den seltsamsten Orten kommen. ELIN, ein Hersteller vor allem von Elektronik, hat sich in letzter Zeit an den Bau experimenteller U-Boote gewagt. Die U-Boote sind erstaunlich gut. Wir sollten in Erwägung ziehen, uns an sie zu wenden und sie in Zukunft unsere U-Boote bauen zu lassen."
AUS_light_ship_bonus:	"Ein Verteidigungsschwarm"
AUS_light_ship_bonus_desc:	"Es hat nicht lange gedauert, bis unsere Schiffsingenieure Methoden entwickelt haben, um die Produktion kleinerer Schiffe und U-Boote zu beschleunigen. Wenn wir diese Methoden standardisieren, sollten wir in der Lage sein, eine große Flotte zu bauen, um unsere Küste zu schützen."
AUS_coastal_defence_forts:	"Bewachung der Küste"
AUS_coastal_defence_forts_desc:	"Was wir auf hoher See tun, ist nur ein Teil dessen, was unsere Erfolgschancen bestimmt. Ein anderer Teil ist unsere Küstenlinie und wie gut sie befestigt ist. Ein paar gut platzierte Küstenforts können schließlich selbst die am gründlichsten geplante Invasion vereiteln."
AUS_naval_efficiency:	"[ROOT.GetAdjective] Effizienz der Marine"
AUS_naval_efficiency_desc:	"Durch harte Arbeit und Hingabe haben wir trotz aller Widrigkeiten wieder eine beachtliche Marinepräsenz aufgebaut. Der Erfolg hat sowohl unsere Matrosen als auch die Arbeiter in den Werften angespornt. Daraus sollten wir Kapital schlagen, um einen letzten Schub in Richtung Exzellenz zu erhalten!"
BEL_perpetual_neutrality:	"Ewige Neutralität"
BEL_perpetual_neutrality_desc:	"Da wir das Hauptschlachtfeld waren, wurde unsere Nation nach dem Ersten Weltkrieg in Schutt und Asche gelegt. Das darf sich nie wiederholen. Daher verkünden wir, dass [BEL.GetNameDef] einen unabhängigen und immerwährend neutralen Staat bilden wird, der die gleiche Neutralität gegenüber allen anderen Staaten wahren wird."
BEL_independent_neutral_and_loyal:	"Unabhängig, neutral und loyal"
BEL_independent_neutral_and_loyal_desc:	"Während des letzten Krieges haben wir uns auf unsere Verbündeten verlassen, und unser Land wurde dadurch zu einem Schlachtfeld. Um den Krieg aus [BEL.GetNameDef] herauszuhalten, hat unser Herrscher uns daher zu Unabhängig, Neutral und Loyal erklärt. \n \n Dies wird die politischen Klassen in der Notwendigkeit zusammenführen, sich mit unserer eigenen Verteidigung zu befassen und so unsere eigene militärische Abschreckung zu entwickeln."
BEL_defensive_neutrality:	"Defensive Neutralität"
BEL_defensive_neutrality_desc:	"Nun, da wir unsere neutrale Haltung deutlich gemacht haben, ist es an der Zeit, dass wir daran arbeiten, sie durchzusetzen. Wir werden es uns zu schwer machen, uns zu erobern und damit eine Invasion undurchführbar machen."
BEL_national_redoubt_at_antwerp:	"Nationale Redoute bei Antwerpen"
BEL_national_redoubt_at_antwerp_available_tt:	"Eine der folgenden Aussagen muss wahr sein:\n 1 §Y$bunker$§! kann in der Stadt Brüssel gebaut werden\n 2 §Y$bunker$s§! kann in der Stadt Antwerpen gebaut werden"
BEL_national_redoubt_at_antwerp_bypass_tt:	"Alle der folgenden Aussagen müssen wahr sein:\n 1 §Y$bunker$§! kann NICHT in der Stadt Brüssel gebaut werden\n 2 §Y$bunker$s§! kann NICHT in der Stadt Antwerpen gebaut werden"
BEL_national_redoubt_at_antwerp_desc:	"Der historische Eckpfeiler unserer Verteidigung war schon immer Antwerpen. Wir werden die Befestigungen dort ausbauen und sie als Dreh- und Angelpunkt für die Verstärkung des restlichen Landes nutzen."
BEL_belgian_gates:	"Belgische Tore"
BEL_belgian_gates_desc:	"Diese großen Eisenkonstruktionen, die auch als Cointet-Elemente bekannt sind, wurden speziell entwickelt, um Panzern den Durchgang zu verwehren."
BEL_fortify_liege:	"Lüttich befestigen"
BEL_fortify_liege_available_tt:	"Mindestens eine Provinz in §Y[34.GetName]§!, die an die Maas grenzt, hat Platz für den Bau von 1 §Y$bunker$§!"
BEL_fortify_liege_bypass_tt:	"Keine Provinz in §Y[34.GetName]§!, angrenzend an den Fluss Meuse hat Platz um 1 zu bauen §Y$bunker$§!"
BEL_fortify_liege_tt:	"Baut Level 1 §Y$bunker$§! in §Y[34.GetName]§! entlang der Maas in Provinzen, die Platz dafür haben"
BEL_fortify_liege_desc:	"Während des Ersten Weltkriegs spielte die befestigte Stellung von Lüttich eine wichtige Rolle, um die deutschen Streitkräfte aufzuhalten und eine erfolgreiche Verteidigung zu ermöglichen. Trotzdem wurden gravierende Mängel bei der Konstruktion der Festungen festgestellt. Wir haben unsere Lehren daraus gezogen, und es ist nun an der Zeit, die Festungsanlagen wieder zu verbessern."
BEL_iron_wall:	"Eiserne Mauer"
BEL_iron_wall_desc:	"Unsere belgischen Tore haben sich in den Tests als bedeutendes Hindernis für feindliche Manöver erwiesen, daher sollten wir sie massenhaft in unserem ganzen Land einsetzen, um diejenigen aufzuhalten, die bei uns eindringen wollen."
BEL_eben_emael_fortress:	"Festung Eben Emael"
BEL_eben_emael_fortress_available_tt:	"Kann mindestens 2 §Y$bunker$s§! in §YLiège§! bauen"
BEL_eben_emael_fortress_bypass_tt:	"Kann nicht mindestens 2 §Y$bunker$s§! in §YLiège§! errichten"
BEL_eben_emael_fortress_desc:	"Eben Emael ist die größte und prächtigste Festung in unserer Linie. Sie liegt auf einem erhöhten Punkt mit Blick auf den Albertkanal und wird den umliegenden Streitkräften als Aufmarschgebiet und Artillerieunterstützung dienen und sich als unüberwindbares Hindernis für alle erweisen, die unsere Grenzen verletzen wollen."
BEL_our_southern_neighbour:	"Unser südlicher Nachbar"
BEL_our_southern_neighbour_desc:	"Dank unserer Erfahrungen im letzten Krieg haben wir die meisten unserer Verteidigungsanlagen auf unseren östlichen Nachbarn ausgerichtet, der jedoch nicht die einzige angrenzende Großmacht ist. Wir sollten sicherstellen, dass wir im Süden ähnlich gut befestigt sind."
BEL_koningshooikt_wavre_line:	"Koningshooikt-Wavre-Linie"
BEL_koningshooikt_wavre_line_desc:	"Die Koningshooikt-Wavre-Linie, oder kurz KW-Linie, ist eine zweite Verteidigungslinie zwischen Koningshooikt und Wavre. Diese Stellungen sind speziell für die Besetzung durch unsere und verbündete Streitkräfte und nicht durch Garnisonen vorbereitet und bestehen aus Schützengräben, Bunkeranlagen und belgischen Toren. Es handelt sich um eine sehr solide Verteidigungslinie, die für uns den wichtigsten Widerstandspunkt darstellen sollte."
BEL_mobilize_the_nation:	"Mobilisieren Sie die Nation"
BEL_mobilize_the_nation_desc:	"Festungsanlagen sind nicht das Einzige, was wir vorbereiten sollten, sondern die Bevölkerung selbst kann unser größtes Kapital sein. Während des letzten Krieges hat sie sich tapfer gegen die Invasoren gewehrt. Lassen Sie uns die gleiche Leidenschaft nutzen und unser Volk zur Verteidigung mobilisieren."
BEL_flooded_tank_barriers:	"Überflutete Panzerbarrieren"
BEL_flooded_tank_barriers_desc:	"Wir glauben, dass Panzer in zukünftigen Kriegen eine entscheidende Rolle spielen werden, und unsere Verteidigung sollte dies widerspiegeln. Wir können belgische Gates vorbereiten und sie im Wasser versenken, um ihre Wirksamkeit zu verdoppeln."
BEL_protect_against_france:	"Schützen Sie sich gegen Frankreich"
BEL_protect_against_france_desc:	"Die bisherigen Vorbereitungen im Süden waren eher Vorbereitungen für den Fall einer Einkreisung, aber die Realität ist, dass es zu einer groß angelegten Invasion der Franzosen kommen könnte - und wir sollten Festungen und Befestigungen entsprechend vorbereiten!"
BEL_protect_against_france_available_tt:	"Sie können §Y1 Landfort§! in §YCharleroi§!, §YKortrijik§! oder §Yder Küstenprovinz nordwestlich von Kortrijik§! bauen"
BEL_dam_the_consequences:	"Staudamm die Folgen"
BEL_dam_the_consequences_desc:	"Der gewaltige Gileppe-Damm versorgt unsere östlichen Regionen mit Wasser und Strom. Er bietet auch eine hervorragende Möglichkeit, die dortigen Gebiete zu überfluten, sollten wir einen möglichen Durchbruch des Feindes befürchten."
BEL_defensive_reorganization:	"Reorganisation der Verteidigung"
BEL_defensive_reorganization_desc:	"Wir haben getan, was wir können, um uns auf eine Invasion vorzubereiten. Jetzt müssen wir nur noch weitere strategische und hochrangige Änderungen in der Doktrin vornehmen, die sich an den modernsten Verteidigungskonzepten orientieren."
BEL_defense_bill:	"Verteidigungsgesetz"
BEL_defense_bill_desc:	"Unsere Erklärung zur immerwährenden Neutralität kam auf der internationalen Bühne nicht gerade gut an. In Wirklichkeit war dies jedoch notwendig, um die politische Unterstützung für ein bedeutendes Aufrüstungsprogramm zu konzentrieren."
BEL_royal_military_academy:	"Königliche Militärakademie"
BEL_royal_military_academy_desc:	"Die Königliche Militärakademie ist [ROOT.GetNameDef]s einziges Institut für militärische Ausbildung, aber da die globale Situation immer unsicherer wird, müssen wir sicherstellen, dass wir die Offiziere von morgen mit der besten Militärtheorie vorbereiten, und das erfordert eine Erweiterung der Akademie."
BEL_multi_language_courses:	"Mehrsprachige Kurse"
BEL_multi_language_courses_desc:	"Eines der größten Probleme für unser Militär ist die Zweisprachigkeit unserer Bevölkerung. Lassen Sie uns dies in einen Vorteil verwandeln! Wir können unseren Offizieren sowohl Französisch als auch Niederländisch beibringen und so die Vorteile eines zweisprachigen Offizierskorps nutzen."
BEL_department_of_telecommunications:	"Abteilung für Telekommunikation"
BEL_department_of_telecommunications_desc:	"Kommunikation ist für das Militär von größter Bedeutung. Deshalb müssen wir die Ausbildung auf die Nutzung neuer Technologien wie das Radio neben den alten, bewährten wie Brieftauben ausrichten."
BEL_department_of_ballistic_metrology:	"Abteilung für ballistische Metrologie"
BEL_department_of_ballistic_metrology_desc:	"Die Abteilung für Ballistische Metrologie ist auf Messungen und Ballistik spezialisiert, die eine genaue Berechnung von Flugbahnen ermöglichen."
BEL_resist_and_bite:	"Widerstehen und beißen"
BEL_resist_and_bite_desc:	"Die Chasseurs Ardennais sind eine Eliteeinheit der [ROOT.GetAdjective] Streitkräfte, die sich hauptsächlich aus Bewohnern der Provinz Luxemburg zusammensetzt, die an die schweren Wälder der Region gewöhnt sind. Ihr Motto lautet Widerstehen und beißen!."
BEL_center_for_advanced_military_studies:	"Zentrum für fortgeschrittene militärische Studien"
BEL_center_for_advanced_military_studies_desc:	"Je größer die Streitkräfte werden, desto strenger werden die Anforderungen an die Führung. Wir müssen der Entwicklung immer einen Schritt voraus sein und unser Oberkommando nach den neuesten strategischen Grundsätzen ausbilden und seine Fähigkeiten in Bereichen wie Logistik, Führung und Kontrolle sowie Integration der kombinierten Waffen ausbauen, möglicherweise auch unter Berücksichtigung der verbündeten Streitkräfte."
BEL_anti_tank_guns:	"Ausgezeichnete Panzerabwehrwaffen"
BEL_anti_tank_guns_desc:	"Die großartige Qualität der [ROOT.GetAdjective] Metallurgie hat es unseren Maschinisten ermöglicht, die feinsten Geschütze zu fertigen, und wir sollten unsere Fähigkeiten nutzen, um einige wahre Hochgeschwindigkeits-Biester zu schaffen! Wir können sogar noch einen Schritt weiter gehen und diese in alle Panzer einbauen, die wir besitzen."
BEL_junior_officer_training:	"Ausbildung junger Offiziere"
BEL_junior_officer_training_desc:	"Ein anständiger Offizier wird seine Soldaten dazu inspirieren, gegen alle Widrigkeiten anzukämpfen, aber er kann blind für eine aussichtslose Situation sein. Ein guter Anführer wird eine aussichtslose Situation richtig einschätzen, aber das Beste daraus machen, was er kann. Ein großartiger Anführer hat einen Plan parat, um sich aus dieser Situation zu befreien und von einer besseren Position aus wieder anzugreifen. Wir werden unsere Offiziere identifizieren und ausbilden, damit sie das Beste aus sich herausholen können."
BEL_belgian_special_forces:	"[ROOT.GetAdjective] Special Forces"
BEL_belgian_special_forces_desc:	"[ROOT.GetAdjective] Soldaten waren schon immer widerstandsfähig und engagiert, aber wir müssen uns fragen, wozu sie fähig sind, wenn sie von jemandem geführt werden, der so kompetent ist wie Eddy Blondeel, dann können wir darüber spekulieren, wie besonders diese Kräfte sein könnten."
BEL_senior_officer_training:	"Ausbildung der Offiziere"
BEL_senior_officer_training_desc:	"Man kann sagen, dass Offiziere zwei dieser vier Eigenschaften haben: Faulheit, Dummheit, Fleiß und Klugheit. Stabsoffiziere sollten fleißig und klug sein, Führungsoffiziere faul und klug. Auch Dummheit und Faulheit haben ihre Berechtigung. Vor allem müssen wir die Dummen und Fleißigen identifizieren, denn sie treffen die Entscheidungen, die in die Katastrophe führen, und haben den Willen und die Energie, sie durchzusetzen."
BEL_fonderie_royale_de_canons_liege:	"Fonderie Royale de Canons Lüttich"
BEL_fonderie_royale_de_canons_liege_desc:	"Die königliche Kanonengießerei in Lüttich, die 1803 von Napoleon Bonaparte gegründet wurde, als Lüttich noch zu Frankreich gehörte, war der wichtigste Entwickler von schweren Waffen in Belgien. Die Qualität der Metallverarbeitung in der Region hat dazu beigetragen, dass die hochkalibrigen Waffen einen gewissen Ruf genießen, und diese Einrichtungen verlangen geradezu nach weiteren Investitionen, um unsere Fähigkeiten weiter auszubauen."
BEL_interpreters:	"Dolmetscher"
BEL_interpreters_desc:	"Eine der großen Hürden, die unsere Streitkräfte überwinden mussten, war die natürliche Zweisprachigkeit ihres Offizierskorps, um flämische und wallonische Soldaten befehligen zu können. Jetzt kann dies zu einer unserer größten Stärken werden, da wir fast ungestraft in unseren Nachbargebieten ohne Sprachbarrieren operieren können."
BEL_interpreters_tt:	"Dieser §YNational Spirit§! wird sowohl den derzeitigen als auch den zukünftigen Fraktionsmitgliedern hinzugefügt."
BEL_center_of_nuclear_chemistry:	"Zentrum für Nuklearchemie"
BEL_center_of_nuclear_chemistry_desc:	"Wir haben die Theorien von Oppenheimer, Heisenberg und Bohr aufmerksam verfolgt und beschlossen, dass wir die Anwendung dieser Wissenschaft für uns selbst in Betracht ziehen sollten. Immerhin sind wir eine der wenigen Nationen, die leichten Zugang zu Uran aus dem Kongo haben."
BEL_strategic_doctrine_development:	"Entwicklung einer strategischen Doktrin"
BEL_strategic_doctrine_development_desc:	"Es reicht nicht aus, von Schlacht zu Schlacht zu denken, wir müssen stattdessen die strategische Ebene fest im Griff haben und unser Militär nach bestimmten Doktrinen ausrichten, um sicherzustellen, dass alle unsere Streitkräfte auf dasselbe Ziel hinarbeiten: den Sieg."
BEL_belgian_tank_development:	"[ROOT.GetAdjective] Panzerentwicklung"
BEL_belgian_tank_development_desc:	"Trotz unserer reichhaltigen Automobilindustrie haben wir uns nie besonders für die Entwicklung gepanzerter Kriegsführung interessiert. In Anbetracht der jüngsten militärischen Fortschritte ist es eindeutig an der Zeit, dass wir in unser eigenes Panzerentwicklungsprogramm investieren."
BEL_doctrinal_innovations:	"Doktrinelle Innovationen"
BEL_doctrinal_innovations_desc:	"Doktrinen können dabei helfen, eine Armee zu lenken und sicherzustellen, dass alle im gleichen Takt marschieren. Um jedoch wirklich voranzukommen, müssen Sie manchmal über den Tellerrand hinausschauen. Wir wollen über diesen Rahmen hinausgehen, den Rahmen sprengen, die Form brechen und unser eigenes Ding machen. Unsere Feinde werden es nicht kommen sehen."
BEL_modernized_army:	"Modernisierte Armee"
BEL_modernized_army_desc:	"Der Unterschied zwischen Siegern und Verlierern im Krieg besteht oft darin, wer die besten Lehren aus seinen Erfahrungen gezogen hat. Es ist an der Zeit, dass wir über all das nachdenken, was wir gewonnen und verloren haben, und dann die Armee reformieren, um sie auf neue, moderne Standards zu bringen."
BEL_increased_length_of_service:	"Längere Dienstzeit"
BEL_increased_length_of_service_desc:	"Angesichts der zunehmenden Spannungen rund um den Globus und unserer strategischen Lage zwischen militärischen Giganten müssen wir unsere Bereitschaft zeigen, uns zu verteidigen und unsere territoriale Souveränität zu sichern. Aus diesem Grund werden wir unsere Reserven in erhöhte Alarmbereitschaft versetzen und die Dienstzeit derjenigen, die derzeit dienen, verlängern."
BEL_fn_herstal:	"FN Herstal"
BEL_fn_herstal_desc:	"[ROOT.GetNameDefCap] ist mit einer weltbekannten Waffenindustrie gesegnet, wobei die Fabrique Nationale de Herstal oder FN Herstal die bekannteste ist. Dieser Waffenhersteller stellt Waffen von außergewöhnlicher Qualität her, die von den Besten der Branche entwickelt werden. Eine enge Zusammenarbeit mit der Browning Arms Company unterstreicht die wahrhaft globale Reichweite unserer Unternehmen."
BEL_legacy_of_the_great_war:	"Das Erbe des Großen Krieges"
BEL_legacy_of_the_great_war_desc:	"Wir haben seit den Schrecken des großen Krieges einen langen Weg zurückgelegt, und obwohl unsere Wunden noch nicht vollständig verheilt sind, tragen wir unsere Narben mit Stolz. Wir haben den Invasoren einmal widerstanden, wir können, nein, wir werden ihnen erneut widerstehen."
BEL_poudreries_reunies_de_belgique:	"Poudreries Réunies de Belgique"
BEL_poudreries_reunies_de_belgique_desc:	"Die Poudreries sind das zweitälteste Rüstungsunternehmen Belgiens und auf Munition spezialisiert. Wenn wir ihre Position in unserem logistischen Netzwerk optimieren, werden wir wirklich explosive Ergebnisse erzielen."
BEL_minerva_imperia:	"Minerva-Imperia"
BEL_minerva_imperia_desc:	"Belgien war nicht nur im Ersten Weltkrieg führend beim Einsatz gepanzerter Fahrzeuge, sondern hat in der Zwischenkriegszeit auch eine Spitzenposition in der Automobilindustrie eingenommen. Zwei unserer größten Hersteller, Minerva und Imperia, haben kürzlich fusioniert, und es wäre wirklich schade, wenn wir ihre Spitzenposition nicht zu unserem gemeinsamen Vorteil nutzen würden."
BEL_repudiate_treaty_with_france:	"Vertrag mit Frankreich aufkündigen"
BEL_repudiate_treaty_with_france_desc:	"[FRA.GetNameDefCap]s Weigerung, die Maginot-Linie entlang unserer Grenzen zu verlängern, lässt im Wesentlichen eine weit offene Tür, durch die ein Feind gezwungen sein wird, anzugreifen. Indem wir unsere Verträge mit ihnen aufkündigen, können wir uns von jeglichen militärischen Verpflichtungen befreien, ihnen zu helfen, aber sie werden immer noch gezwungen sein, einzugreifen, wenn wir angegriffen werden, oder eine nachfolgende Invasion in ihr unbewachtes Territorium riskieren."
BEL_german_non_aggression:	"Deutsche Nicht-Aggression"
BEL_german_non_aggression_desc:	"[GER.GetName] hat unsere Ankündigung der Neutralität begrüßt und öffentlich ihr Interesse an einem gegenseitigen Nichtangriffspakt bekundet, um diese Haltung zu bekräftigen und die Sicherheit ihrer Grenzen zu gewährleisten."
BEL_dyle_plan:	"Dyle-Plan"
BEL_dyle_plan_desc:	"Trotz all unserer öffentlichen Ankündigungen von Neutralität und militärischer Nichteinmischung arbeiten wir hinter verschlossenen Türen weiterhin mit unseren strategischen Partnern zusammen und erarbeiten Pläne und Eventualitäten für den Fall einer Invasion. Die allgemeine Idee ist, dass wir uns so lange wie möglich hinter dem Fluss Dyle halten, bis Expeditionsstreitkräfte eintreffen, um unsere Verteidigung zu stärken."
BEL_dyle_plan_tt:	"Sollte ein Krieg ausbrechen, werden §Y[ENG.GetNameWithFlag]§! und §Y[FRA.GetNameWithFlag]§! uns eher zu Hilfe kommen!"
BEL_british_guarantee:	"Britische Garantie"
BEL_british_guarantee_desc:	"Unsere guten Beziehungen zu [ENG.GetNameDef] waren nie ein Geheimnis, also lassen Sie uns diese Beziehung offiziell machen und gegenseitige militärische Garantien aussprechen."
BEL_government_resigns:	"Regierung tritt zurück"
BEL_government_resigns_desc:	"Der Druck auf die Regierung hat aufgrund der weit verbreiteten Korruptionsvorwürfe der faschistischen Organisation Rexist zugenommen, was zum Sturz der Regierung und zum Beginn der Vorbereitungen für Neuwahlen geführt hat."
BEL_auto_complete_government_resigns_tt:	"Dieser Fokus wird durch das Ergebnis des Ereignisses §YRegierung tritt zurück§! automatisch vervollständigt."
BEL_government_of_national_unity:	"Regierung der nationalen Einheit"
BEL_government_of_national_unity_desc:	"Trotz des wachsenden Widerstands der faschistischen Bewegung haben sich die demokratischen Parteien der Liberalen, der Sozialisten und der Katholiken unter Paul van Zeeland wieder vereinigt und eine neue Regierung der Nationalen Einheit gebildet."
BEL_investigate_bribery_charges:	"Untersuchung der Bestechungsvorwürfe"
BEL_investigate_bribery_charges_desc:	"Die Korruptionsvorwürfe haben die Regierung nie verlassen, und die Forderungen nach einer Untersuchung wurden lauter. Leon Degrelle, der Anführer der Faschisten-Rexisten, hat sogar Paul van Zeeland selbst direkt beschuldigt, Bestechungsgelder angenommen zu haben."
BEL_royal_intervention:	"Königliche Intervention"
BEL_royal_intervention_desc:	"Die Regierung ist erneut gestürzt und es ist an der Zeit, dass der König eingreift und Maßnahmen ergreift. Es gibt zwei Kandidaten für das Amt des Premierministers: die sichere Hand von Paul-Émile Janson oder Leon Degrelle, der die Beschwerden gegen die Korruption des vorherigen Regimes anführte. "
BEL_auto_complete_royal_intervention_tt:	"Dieser Schwerpunkt wird durch den Ausgang der Veranstaltung §YRoyal Appointment§! automatisch vervollständigt."
BEL_plan_de_man:	"Plan de Man"
BEL_plan_de_man_desc:	"Obwohl dies mit einem hohen politischen Preis verbunden ist, hat der Premierminister hart daran gearbeitet, die Reformen von Henri de Man fortzusetzen und weitere Maßnahmen zur Bekämpfung der Arbeitslosigkeit umzusetzen. Damit soll die Arbeitslosenquote von einem Höchststand von 23,5% im Jahr 1932 auf 15% gesenkt werden."
BEL_economic_recovery:	"Wirtschaftlicher Aufschwung"
BEL_economic_recovery_desc:	"Die Arbeit unserer Regierung hat trotz der zahlreichen Hindernisse, denen sie sich gegenübersah, zu einem Wachstum und einer raschen Erholung unserer Wirtschaft geführt, aber selbst dabei gibt es bereits Gerüchte, dass selbst dies nicht ausreicht."
BEL_adriaan_martens_crisis:	"Adriaan Martens-Krise"
BEL_adriaan_martens_crisis_desc:	"Die scheinbar einfache Ernennung von Adriaan Martens zum Mitglied der Königlichen Akademie für Medizin hat sich inzwischen zu einer ausgewachsenen politischen Krise ausgeweitet. Denn es kam ans Licht, dass Martens ein Kollaborateur im letzten Krieg war und unverblümt faschistische Ansichten vertritt. Dies könnte durchaus zum Sturz der Regierung Spaak führen."
BEL_benelux_union:	"Benelux-Union"
BEL_benelux_union_desc:	"Premierminister Spaak hat den Vorschlag gemacht, die BeNeLux-Staaten [BEL.GetNameDef], [HOL.GetNameDef] und [LUX.GetNameDef] in einer einzigen Zollunion zu vereinen, mit dem Endziel einer möglichen vollständigen Vereinigung zu einem Super-Unionsstaat. Dies könnte sogar die Blaupause für eine zukünftige Europäische Union sein."
BEL_benelux_union_tt:	"Wenn sie demokratisch oder blockfrei sind, werden §Y[HOL.GetNameWithFlag]§! und §Y[LUX.GetNameWithFlag]§! zur §Y$BEL_benelux_union_faction$§! eingeladen."
BEL_tripartite_government:	"Dreigliedrige Regierung"
BEL_tripartite_government_desc:	"Wie bei den vorangegangenen Regierungen der nationalen Einheit ist es Premierminister Pierlot gelungen, mehrere demokratische Parteien in einem Zeichen der belgischen Solidarität zu vereinen. Mit dieser politisch geeinten Front hat er endlich die Macht, radikalere Gesetze durchzusetzen."
BEL_the_council_of_europe:	"Der Europarat"
BEL_the_council_of_europe_desc:	"Es wird immer deutlicher, dass die Neutralität kein Schutz gegen den militärischen Expansionismus aggressiver Nachbarn ist. Der einzige Weg, den Frieden in Europa zu sichern, ist daher Einigkeit. Wir sollten die Diplomaten und Staatsoberhäupter an einen einzigen Tisch bringen und so den Europarat gründen."
BEL_the_council_of_europe_tt:	"Schaltet Entscheidungen zu §YEinladung anderer Länder zu $BEL_european_union$§! frei."
BEL_broken_neutrality:	"Gebrochene Neutralität"
BEL_broken_neutrality_desc:	"Unsere Neutralitätserklärung hat unserer Nation gute Dienste geleistet und es uns ermöglicht, in eine Position der Stärke zu gelangen. Jetzt können wir diese Fesseln ablegen und [BEL.GetNameDef] in eine neue Ära führen."
BEL_degrelle:	"Degrelle"
BEL_degrelle_desc:	"Leon Degrelle, Führer der Rexisten und einer der führenden Faschisten in [BEL.GetName], agitiert schon seit einiger Zeit gegen die derzeitige Führung und hat deren Korruption erfolgreich öffentlich gemacht. Nachdem die Regierung von Van Zealand gestürzt war, schritt der König ein und ernannte Degrelle zum neuen Premierminister."
BEL_support_the_rexists:	"Unterstützen Sie die Rexisten"
BEL_support_the_rexists_desc:	"Nun, da Degrelle seinen Platz als Premierminister eingenommen hat, ist es an der Zeit, dass die Partei, die ihn bei der Erlangung dieser Position unterstützt hat, für ihre Dienste belohnt wird und hochrangige Mitglieder in Kabinettspositionen befördert werden."
BEL_dissolve_political_parties:	"Lösen Sie die politischen Parteien auf"
BEL_dissolve_political_parties_desc:	"Die Schwäche der Demokratie liegt auf der Hand: Sie ist nichts weiter als ein Brutkasten für Korruption und Gier. Die Menschen brauchen keine Wahlmöglichkeiten, sie müssen geführt werden, und nur die [ROOT.GetRulingPartyLong] sind dazu in der Lage."
BEL_the_flemish_question:	"Die Flämische Frage"
BEL_the_flemish_question_desc:	"Die andauernde Spaltung innerhalb der [BEL.GetName] verursacht weiterhin eine Kluft zwischen unserem Volk. Wir sollten diese Frage ein für alle Mal klären und selbst entscheiden, was der richtige sprachliche Standard sein soll. Die Menschen werden tun, was man ihnen sagt, schließlich sind wir alle [BEL.GetAdjective], und das übertrumpft jede einzelne Spitzfindigkeit wie die Sprache."
BEL_christian_corporatism:	"Christlicher Korporatismus"
BEL_christian_corporatism_desc:	"Wir haben mit Interesse den italienischen Korporatismus studiert, das Konzept der kollektiven, staatlich geführten Arbeitnehmerorganisationen, die alle auf die gleichen wirtschaftlichen Ziele hinarbeiten. Wir haben die Absicht, diesem Modell zu folgen, aber christliche Ethik und Ideale anzuwenden, um etwas zu schaffen, das einzigartig in Belgien ist."
BEL_legacy_of_the_soldier_king:	"Das Erbe des Soldatenkönigs"
BEL_legacy_of_the_soldier_king_desc:	"König Albert, der Soldatenkönig, Kriegsheld und Retter Belgiens. Es gibt viel, was wir von diesem großen Mann lernen können, und sein Beispiel ist eines, von dem alle in unseren Streitkräften, ja in unserer ganzen Nation lernen können. Wir werden jedem Eindringling Widerstand leisten und ihn bis zum Letzten bekämpfen."
BEL_the_lost_tribe:	"Der verlorene Stamm"
BEL_the_lost_tribe_desc:	"Ein Makel, den [BEL.GetName] ertragen musste, war, mit den eroberten und versklavten gallischen Völkern zusammengewürfelt zu werden. Wir sind unser eigener verlorener Stamm der Germanen. Wir sind diejenigen, die Widerstand leisten. Wir sind diejenigen, die kämpfen. Wir sind diejenigen, die erobern."
BEL_invite_german_tank_organization:	"Laden Sie [GER.GetAdjective] Panzerentwickler ein"
BEL_invite_german_tank_organization_desc:	"Da die meisten unserer bisherigen Panzerkontakte für uns nicht mehr zugänglich sind, müssen wir neue Partner suchen, mit denen wir zusammenarbeiten können, um Panzer unter die Leute zu bringen."
BEL_the_walloon_legion:	"Die Wallonische Legion"
BEL_the_walloon_legion_desc:	"Nachdem unsere wahre Abstammung geklärt ist, ist es an der Zeit, dass wir an diese glorreiche Tradition anknüpfen und der Welt zeigen, was wir wirklich drauf haben."
BEL_the_new_ruhr:	"Das neue Ruhrgebiet"
BEL_the_new_ruhr_desc:	"Das Ruhrgebiet in Deutschland ist für seine rohe Industrieproduktion so bekannt, dass es von den anderen Großmächten beneidet wird. Auch Belgien hat einen Anspruch auf industrielle Größe und ein Potenzial, das das unseres Nachbarn bei weitem übertreffen kann. Wir haben die Möglichkeit, wir haben die Ressourcen, wir haben den Antrieb und vor allem haben wir die Menschen. Wir haben die Menschen."
BEL_traditional_family_values:	"Traditionelle Familienwerte"
BEL_traditional_family_values_desc:	"Die katholische Kirche hat uns in Bezug auf eine angemessene Familienethik immer gut geführt, und an diese Lehren sollten wir uns auch weiterhin halten. Nur so können wir die Stabilität und das Wachstum gewährleisten, die wir für die weitere Expansion und den Wohlstand in der Zukunft benötigen."
BEL_the_french_horse_and_the_red_rider:	"Das französische Pferd und der rote Reiter"
BEL_the_french_horse_and_the_red_rider_desc:	"Belgien ist schon zu lange unter die Hufe der Franzosen geraten, einer Bestie, die von kommunistischen Reitern kommandiert wird. Wir müssen uns erheben und uns gegen diese heimtückische Invasion behaupten. Nur wenn wir unser Selbstvertrauen und unsere Stärke zeigen, wird die Kreatur zurückschrecken und sich einschüchtern lassen."
BEL_nationalize_the_banks:	"Verstaatlichen Sie die Banken"
BEL_nationalize_the_banks_desc:	"Viel zu lange wurden die Banken von gierigen kleinen Männern geleitet, die nichts anderes im Sinn hatten als Profit. Die Banken sind eine Institution, die im Dienste aller steht. Daher ist es nur gerecht, dass wir die Kontrolle über sie ergreifen und ihre Finanzinstrumente zu unserem kollektiven Nutzen lenken."
BEL_abandon_neutrality:	"Geben Sie die Neutralität auf"
BEL_abandon_neutrality_desc:	"Die Rufe nach Neutralität waren die Worte der Schwachen. In dieser Welt ist die einzige Diplomatie, die zählt, die der Stärke."
BEL_international_stipend:	"Internationales Stipendium"
BEL_international_stipend_desc:	"Andere faschistische Nationen haben uns ein Stipendium angeboten, um unsere anhaltende Neutralität in ihren eigenen Angelegenheiten zu erkaufen. Wenn dies der Preis für die Nichteinmischung sein soll, dann können wir ihn akzeptieren. Immerhin scheinen sie vergessen zu haben, ein Enddatum anzugeben."
BEL_civil_service_purge:	"Säuberung des öffentlichen Dienstes"
BEL_civil_service_purge_desc:	"Der Makel der Korruption blieb zu lange unbehandelt und hat alle Ränge der Regierung gründlich infiltriert. Radikale Krankheiten brauchen radikale Heilmittel, und in diesem Fall ist dieses Heilmittel die vollständige Säuberung von jedem, den wir der Korruption verdächtigen."
BEL_royal_commander_in_chief:	"Königlicher Oberbefehlshaber"
BEL_royal_commander_in_chief_desc:	"König Leopold III. stammt aus gutem, soldatischem Hause. König Albert war ein Kriegsheld, er stand der Nation in ihren dunkelsten Stunden zur Seite und führte uns zum glorreichen Sieg. Alles, was Leopold will, ist, sich zu beweisen und aus dem Schatten seines Vaters herauszutreten. Wir müssen ihm nur die Gelegenheit dazu geben."
BEL_the_european_crusade:	"Der europäische Kreuzzug"
BEL_the_european_crusade_desc:	"An den Grenzen Europas kreisen Geier, die mit ihren barbarischen Ideologien die Schwäche der zivilisierten Nationen in Europa suchen. Es ist unsere Berufung, als Bollwerk für Ordnung und Fortschritt zu stehen. Unsere Nation hat ihre unvergleichliche Entschlossenheit bewiesen und steht zu Recht an der Spitze dieses Kampfes."
BEL_belgian_renaissance:	"Belgische Renaissance"
BEL_belgian_renaissance_desc:	"Wir sind geschlagen worden, wir sind geschlagen worden, aber niemals sind wir gebrochen worden. Nur durch das außergewöhnliche Beispiel der [ROOT.GetRulingPartyLong] ist dies möglich gewesen. Nur durch unsere kontinuierliche Führung wird diese belgische Renaissance weitergehen können, auf dem Weg zu einem weiteren goldenen Zeitalter."
BEL_support_the_vnv:	"Unterstützen Sie den VNV"
BEL_support_the_vnv_desc:	"Bei den letzten Wahlen hat sich der Vlaamsch Nationaal Verbond, die Flämische Nationale Union, mit der Partei Rex verbündet, um einen korporatistischen Staat zu schaffen. Nun, da Degrelle an die Macht gekommen ist, ist es an der Zeit, seine Verbündeten zu belohnen und Schritte in Richtung eines expansionistischen faschistischen Staates zu unternehmen, der die Wiedervereinigung mit den Niederlanden fest im Blick hat."
BEL_vnv_dominant_tt:	"§Y[BEL.GetName]§! wird bekannt sein als §YVlaanderen§!"
BEL_revitalize_nederlands:	"Wiederbelebung des Niederländischen"
BEL_revitalize_nederlands_desc:	"Unsere Sprache ist praktisch verschwunden! Sogar die Gerichte verkünden ihre Urteile auf Französisch, und nur die lokalen Dialekte sind in Erinnerung geblieben. Der erste Schritt zur Wiederherstellung der flämischen Größe besteht darin, dafür zu sorgen, dass unsere Regierung und unser Volk die richtige Sprache sprechen. Nederlands!"
BEL_flanders_ascendant:	"Flandern auf dem Vormarsch"
BEL_flanders_ascendant_desc:	"Jetzt, wo der Stolz auf die flämischen Traditionen und die flämische Geschichte wieder zunimmt, ist es an der Zeit, dass wir dieses neu entfachte Nationalgefühl nutzen und unsere Nation ihrem Schicksal entgegenführen - der Vereinigung mit den Niederlanden."
BEL_dietsland:	"Dietsland"
BEL_dietsland_desc:	"Unsere Bemühungen, den Rest der niederländischsprachigen Länder in Europa zu sichern, waren erfolgreich, aber es scheint, dass sich nicht alle unsere Brüder so gut an diese neue Zukunft angepasst haben, wie wir erwartet hatten. Wir sollten sie an die Kultur und Sprache erinnern, die wir teilen."
BEL_dietsland_tt:	"§Y[BEL.GetName]§! wird bekannt sein als §YDietsland§!"
BEL_demand_calais:	"Fordern Sie Calais"
BEL_demand_calais_desc:	"Obwohl unser Projekt der Wiedervereinigung der Nation fast abgeschlossen ist, befindet sich ein wichtiger Teil Flanderns immer noch in fremder Hand: Kales. Ursprünglich gehörte es vor tausend Jahren zur Grafschaft Flandern, und deshalb ist es jetzt nur angemessen, dass es uns zurückgegeben wird."
treaty_of_calais:	"Der Vertrag von Calais ist unterzeichnet worden."
BEL_demand_calais_tt:	"Unsere Optionen hierfür reichen von dem Versuch, Calais§! zu kaufen, über den Tausch eines Teils des Kongos gegen Calais§! bis hin zu einer Forderung§! und dem Kampf darum§!, falls dies notwendig sein sollte."
BEL_belgian_east_indies:	"Belgisch-Ostindien"
BEL_belgian_east_indies_desc:	"Die Niederländer hatten bedeutende koloniale Besitztümer im Ausland, insbesondere in Ostindien. Unsere eigenen imperialen Ambitionen sind nie verschwunden, und es gibt immer Raum, um unserer Krone ein paar weitere Juwelen hinzuzufügen."
BEL_burgundy_rising:	"Das aufstrebende Burgund"
BEL_burgundy_rising_desc:	"Das goldene Zeitalter der flämischen Macht und des flämischen Einflusses war die Zeit, als wir das Herzogtum Burgund beherrschten. Wenn wir jemals unser weltweites Ansehen wiederherstellen wollen, müssen wir die kriegerischen und finanziellen Traditionen unserer Vorfahren aufrechterhalten. Der erste Schritt dazu ist natürlich die Rückeroberung dieser Territorien."
BEL_burgundy_tt:	"§Y[BEL.GetName]§! wird als §YBurgundy§! bekannt sein."
BEL_join_axis:	"Achse beitreten"
BEL_join_axis_desc:	"Wir waren zu lange isoliert. Es ist an der Zeit, dass wir uns mit unseren germanischen Brüdern zusammentun und ein Bündnis zwischen uns schließen, um unsere gemeinsamen Ambitionen zu schützen und auszubauen."
BEL_strength_and_brotherhood:	"Stärke und Brüderlichkeit"
BEL_strength_and_brotherhood_desc:	"Wir werden uns diejenigen suchen, deren Ideale von Stärke und Brüderlichkeit mit den unseren übereinstimmen, und wie der Löwe unser eigenes Rudel bilden. Auf diese Weise können wir das, was uns mächtig macht, weiterführen und diejenigen, die in Geist und Seele schwächer sind, wie die Beute zerreißen, die sie sind."
BEL_demand_further_gallic_concessions:	"Fordern Sie weitere gallische Zugeständnisse"
BEL_demand_further_gallic_concessions_desc:	"Es ist an der Zeit, dass wir den Mantel der Intrige abwerfen und unsere wahren Absichten zum Vorschein kommen lassen. Die Gräben zwischen uns waren nie ein Geheimnis, aber wir müssen unsere Überlegenheit ein für alle Mal unter Beweis stellen. Es ist an der Zeit, unser Schicksal in die Hand zu nehmen, komme was wolle."
BEL_demand_further_gallic_concessions_tt:	"Schaltet Entscheidungen zu §YGewinnen Sie Kerne auf den gallischen Claims§! frei, nachdem wir die Kontrolle über sie erlangt haben."
BEL_belgica:	"Belgica"
BEL_belgica_desc:	"Belgica war eines der nördlichsten Territorien des Römischen Reiches, so genannt wegen der einflussreichsten Bevölkerungsgruppe, die in diesem Gebiet lebte. Wenn die Römer in der Lage waren, die Macht des belgischen Volkes zu erkennen, dann ist es nur recht und billig, dass wir uns ein Beispiel an ihnen nehmen und es weiter bringen, als die Römer es sich je hätten träumen lassen."
BEL_belgica_tt:	"§Y[BEL.GetName]§! wird bekannt sein als §YBelgica§!"
BEL_constitutional_crisis:	"Verfassungskrise"
BEL_constitutional_crisis_desc:	"Hubert Pierlot, ein ausgesprochener Kritiker des Faschismus und Leon Degrelle, hat sich lautstark gegen die Entscheidung des Königs ausgesprochen, letzteren zum Premierminister zu ernennen. Er hat sich im Parlament Unterstützung geholt und ein Notgesetz durchgesetzt, das den König für vorübergehend regierungsunfähig erklärt und damit die Ernennung für ungültig erklärt, bevor sie die königliche Zustimmung erhalten konnte."
BEL_kings_abdication:	"Abdankung des Königs"
BEL_kings_abdication_desc:	"Nach dem öffentlichen Abbruch der Beziehungen zwischen dem Parlament und dem Monarchen wurde Druck auf König Leopold ausgeübt, abzudanken. Man hofft, dass er friedlich abdanken wird."
BEL_kings_abdication_tt:	"§Ohne König Leopold wird Belgien weitaus widerstandsfähiger gegen eine Invasion sein.§!"
BEL_snap_election:	"Schnellwahlen"
BEL_snap_election_desc:	"Nachdem die Verfassungskrise vorerst eingedämmt ist, ist es an der Zeit, der Regierung wieder ihre Legitimität zu verleihen, denn sonst ist sie nicht anders als die, die sie gerade abgesetzt hat. Im Moment sind Paul-Henri Spaak von den Sozialisten und Hubert Pierlot von der Katholischen Partei die Vorreiter."
BEL_auto_complete_snap_election_tt:	"Dieser Fokus wird durch das Ergebnis der §YSnap Election§! Veranstaltung automatisch vervollständigt."
BEL_liberal_victory:	"Liberaler Sieg"
BEL_liberal_victory_desc:	"Die wirtschaftsliberale Katholische Partei hat bei den letzten Wahlen den ersten Platz belegt, und Hubert Pierlot wird [BEL.GetName] anführen und verspricht, sie und das belgische Volk bis zum Schluss zu verteidigen."
BEL_socialist_victory:	"Sieg der Sozialisten"
BEL_socialist_victory_desc:	"Paul-Henri Spaak führte die Arbeiterpartei zum Sieg bei den vorgezogenen Neuwahlen und versprach, alles in seiner Macht Stehende zu tun, um die Integrität der belgischen Grenzen zu bewahren, unabhängig davon, ob sie sich dafür mit den Kommunisten oder den Demokraten verbünden."
BEL_expression_of_belgian_unity:	"Ausdruck der belgischen Einheit"
BEL_expression_of_belgian_unity_desc:	"Die Kulturen, aus denen sich die [BEL.GetAdjective] Identität zusammensetzt, sind unsere größte Stärke, denn nur durch unterschiedliche Ideale, Perspektiven und sogar Sprachen können wir wahres Verständnis finden. Das, was uns trennt, eint uns."
BEL_anti_corruption_taskforce:	"Taskforce zur Korruptionsbekämpfung"
BEL_anti_corruption_taskforce_desc:	"Die Korruption hat im Staat schon zu lange um sich gegriffen. Jetzt, da wir uns von der Fäulnis an der Spitze befreit haben, ist es an der Zeit, gegen den Rest vorzugehen. Wir werden eine Sonderermittlungsgruppe mit weitreichenden Befugnissen einrichten, um diejenigen, die sich auf Kosten der Steuerzahler bereichert haben, aufzudecken und aus dem Weg zu räumen."
BEL_diplomatic_rapprochment:	"Diplomatische Annäherung"
BEL_diplomatic_rapprochment_desc:	"Unsere Neutralitätsbekundung war angesichts der politischen und diplomatischen Realitäten der damaligen Zeit notwendig, aber das hat sich nun geändert. Wir haben nie aufgehört, mit unseren Freunden in anderen Ländern zu sprechen, aber wir sollten dies jetzt offener und öffentlicher tun."
BEL_belgian_maginot:	"Belgischer Maginot"
BEL_belgian_maginot_desc:	"Belgien ist ein Pufferstaat zwischen zwei mächtigen, militärischen Nationen und wurde im Laufe seiner Geschichte von beiden bedroht. Als solches sind wir Meister der defensiven Kriegsführung geworden. Die französische Maginot-Linie reicht bis an unsere Grenze, und wir müssen sie verlängern, um unser eigenes Land zu verteidigen. Wenn wir uns unbesiegbar machen, werden wir nicht einmal angegriffen werden."
BEL_belgian_maginot_available_tt:	"Kontrolliert und kann mindestens §Y3 Landforts§! in einer Provinz in §Y[980.GetName]§!, §Y[6.GetName]§!, §Y[34.GetName]§! oder §Y[977.GetName]§! an der §Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§! Grenze bauen"
BEL_belgian_maginot_bypass_tt:	"Kontrolliert §RNOT§! oder kann nicht mindestens §Y3 Landforts§! in einer Provinz in §Y[980.GetName]§!, §Y[6.GetName]§!, §Y[34.GetName]§! oder §Y[977.GetName]§! an der §Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§! Grenze bauen"
BEL_belgian_maginot_tt:	"Fügen Sie §YLand Forts§! entlang der §Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§!Grenze hinzu"
BEL_soviet_guarantee:	"Sowjetische Garantie"
BEL_soviet_guarantee_desc:	"Trotz unserer eher demokratischen Tendenzen haben wir den sozialistischen Weg eingeschlagen und wir haben viel zu bieten [SOV.GetNameDef]. Solange wir die richtigen Plattitüden von uns geben und uns an ihre weitreichenden diplomatischen Angebote halten, könnten wir den russischen Bären zu einem Freund machen."
BEL_soviet_guarantee_tt:	"Es ist wahrscheinlicher, dass sie §Gaccept§! akzeptieren, wenn wir §Y$BEL_raise_the_red_flag$§! abgeschlossen haben."
BEL_expedite_fort_construction:	"Beschleunigen Sie den Bau der Festung"
BEL_expedite_fort_construction_desc:	"Dies ist eine gefährliche Welt, die von feindlichen Mächten bedrängt wird. Wir müssen sicherstellen, dass wir bereit sind, und mehr in unsere Festungen und unser Ingenieurwesen investieren, damit wir die Vorbereitungen getroffen haben, bevor sie gebraucht werden."
BEL_democratization_of_education:	"Demokratisierung der Bildung"
BEL_democratization_of_education_desc:	"Unsere Gesellschaft hat eine Tradition der Fürsorge füreinander, die am besten durch den Sozialvertrag zwischen unseren Arbeitern und den Unternehmen verkörpert wird. In ähnlicher Weise sollte der Staat versuchen, jedem die gleichen Chancen zu geben und die Bedeutung einer guten Bildung hervorheben."
BEL_invite_soviet_tank_makers:	"Laden Sie [SOV.GetAdjective] Tankentwickler ein"
BEL_invite_soviet_tank_makers_desc:	"In der Vergangenheit haben wir uns bei Panzereinheiten immer auf unsere Verbündeten verlassen, und auch wenn sich unsere Freunde geändert haben, hat sich diese Politik nicht geändert. Dank unserer freundschaftlichen Beziehungen zur Sowjetunion können wir sie vielleicht überzeugen, uns mit einigen Erkenntnissen zu unterstützen."
BEL_join_allies:	"Verbünden Sie sich mit den Verbündeten"
BEL_join_allies_desc:	"Im Großen Krieg haben wir schon einmal als Verbündete zusammengestanden, und gemeinsam haben wir der Invasion getrotzt. Wir werden wieder zusammenstehen, gegen alle, die uns Schaden zufügen wollen."
BEL_unity_makes_strength:	"Einigkeit macht stark"
BEL_unity_makes_strength_desc:	"Ursprünglich das Motto der Niederländischen Republik, als sie sowohl die Niederlande als auch Belgien regierte. Nach der Revolution von 1830, die zu unserer Unabhängigkeit führte, wurde es vom belgischen Staat formell übernommen. Es wurde durch die Einheit von liberalen Progressiven und katholischen Konservativen, die im Zentrum der belgischen Politik standen, wirklich verankert und verkörpert seither das belgische Ideal."
BEL_join_comintern:	"Treten Sie der Komintern bei"
BEL_join_comintern_desc:	"Die Komintern unterstützt seit jeher diejenigen, die für den sozialistischen Weg eintreten, und da wir auf allen Seiten von denen bedrängt werden, die die aufkeimende Befreiung unserer Arbeiter unterdrücken wollen, müssen wir im Osten nach neuen Freunden suchen."
BEL_better_than_maginot:	"Besser als Maginot"
BEL_better_than_maginot_desc:	"Unsere Befestigungen müssen von weltweit führend zu weltweit schlagend werden. Wir wissen nie, woher der nächste Angriff kommen wird, also müssen wir auf alles vorbereitet sein. Wir müssen Schützengräben bauen, die von Schützengräben gestützt werden, Bunker über Bunker, und vor allem. Wir brauchen mehr Geschütze. Viel mehr Geschütze. Und zwar große."
BEL_vandervelde_minority:	"Vandervelde-Minderheit"
BEL_vandervelde_minority_desc:	"Émile Vandervelde hat die Wahl gewonnen, allerdings konnte seine Labour Party nur mit einer Minderheit gewinnen. Nachdem die Koalitionsverhandlungen gescheitert sind, hat er sich für einen Alleingang entschieden, obwohl der vor ihm liegende politische Weg hart sein wird."
BEL_problem_of_language:	"Das Problem der Sprache"
BEL_problem_of_language_desc:	"Belgien ist schon viel zu lange durch die Sprache gespalten. Wenn die Arbeiterpartei die Hoffnung hat, die Nation hinter sich zu vereinen, sollte sie ihre Haltung zum Primat der Sprache deutlich machen - oder sogar die Bemühungen um eine offizielle Zweisprachigkeit, wie sie in Brüssel praktiziert wird, anführen."
BEL_trade_union_support:	"Unterstützung der Gewerkschaften"
BEL_trade_union_support_desc:	"Unsere natürlichen Verbündeten im politischen Kampf sind die Gewerkschaften, aber bisher war ihre Unterstützung für unsere Bewegung nur lauwarm. Wir können unsere Versprechen an sie verstärken, und sie werden im Gegenzug ihre Mitglieder für uns mobilisieren."
BEL_cooperative_cooperation:	"Kooperative Zusammenarbeit"
BEL_cooperative_cooperation_desc:	"Genossenschaften sind schon seit geraumer Zeit Teil der belgischen Gesellschaft, und ihr Geschäftsmodell ist sehr gut mit dem Wirtschaftsideal vereinbar, für das wir eintreten. Wir sollten mit den bereits etablierten Genossenschaften zusammenarbeiten und ihr Fachwissen nutzen, um eine neue Generation von sozialbewussten Unternehmen auszubilden."
BEL_aid_for_spain:	"Hilfe für Spanien"
BEL_aid_for_spain_desc:	"Die spanischen Republikaner kämpfen für ihre demokratischen Ideale gegen gefährliche faschistische und anarchistische Radikale. Wir sollten ihnen im Stillen Unterstützung in ihrem Kampf anbieten, aber darauf achten, dass wir den Anschein der Neutralität wahren."
BEL_the_grand_place:	"Der Grand-Place"
BEL_the_grand_place_desc:	"Der Grand-Place im Zentrum von Brüssel ist seit langem eine Brutstätte des sozialistischen Denkens. Am berühmtesten ist, dass Karl Marx hier das Kommunistische Manifest geschrieben hat. Anschließend fand hier der 3. Kongress der Ersten Internationale statt, und schließlich wurde hier die erste sozialistische Partei, die Belgische Arbeiterpartei, gegründet."
BEL_la_belgique_et_le_congo:	"La Belgique et le Congo"
BEL_la_belgique_et_le_congo_desc:	"Belgien hat im Kongo lange Zeit eine Rolle gespielt, die von Ausbeutung und Verfolgung geprägt war, obwohl es sich eigentlich für Gleichheit und Chancen einsetzen sollte. Mit unserer erneuten Betonung sozialistischer Ideale im eigenen Land ist es höchste Zeit, dass wir beginnen, unsere kolonialen Brüder in dieser Philosophie zu unterrichten und in ihre sozialistische Zukunft zu investieren."
BEL_spanish_intervention:	"Spanische Intervention"
BEL_spanish_intervention_desc:	"Die Lage der Republikaner in Spanien ist prekär, und es ist klar, dass diejenigen, denen die Demokratie am Herzen liegt, ihre Unterstützung für diejenigen, die für sie kämpfen, verstärken müssen, damit sie sich durchsetzen kann."
BEL_spanish_intervention_tt:	"Schaltet Entscheidungen für weitere §Y$BEL_intervention_in_spain_cat$§! frei. Wir werden in der Lage sein, Ausrüstung zu schicken, die Auswanderung zu fördern, um ihre Bemühungen zu unterstützen, und sie politisch zu begleiten."
BEL_contradictions_in_socialism:	"Widersprüche im Sozialismus"
BEL_contradictions_in_socialism_desc:	"Unsere jüngsten Erfolge bei der Verbreitung sozialistischer Ideale im Kongo haben eindeutig Früchte getragen, denn die Menschen dort sind wohlhabender denn je. Daher ist uns klar, dass wir diese sozialistische Mission auf ganz Afrika ausweiten müssen! "
BEL_contradictions_in_socialism_tt:	"Gewinne §YTake Claimed State§! Kriegsziele gegen Länder, die derzeit Ansprüche erheben, die sich aus diesem Fokus ergeben."
BEL_growing_threat_of_fascism:	"Wachsende Bedrohung durch den Faschismus"
BEL_growing_threat_of_fascism_desc:	"Das Erstarken des radikalen Faschismus in ganz Europa, ja in der ganzen Welt, ist ein sehr besorgniserregender Trend, und wir sollten bereit sein, alles zu tun, was wir tun müssen, um seine Ausbreitung zu verhindern. Selbst wenn diese Maßnahmen präventiv sein müssen."
BEL_peacekeeping_missions:	"Friedenssichernde Missionen"
BEL_peacekeeping_missions_desc:	"Die anhaltenden Konflikte in der ganzen Welt geben uns weiterhin Anlass zur Sorge. Um jedoch nach außen hin den Anschein der Neutralität zu wahren, können wir nur Truppen im Rahmen genehmigter Friedensmissionen ins Ausland schicken."
BEL_international_socialist_bureau:	"Internationales Sozialistisches Büro"
BEL_international_socialist_bureau_desc:	"Die Zweite Internationale hatte ein ständiges Sekretariat in Brüssel, und obwohl diese Organisation 1916 aufgelöst wurde, geht der sozialistische Kampf weiter. Jetzt, da wir auf der internationalen Bühne wieder Fuß gefasst haben, sollten wir die Institution wieder einrichten und innerhalb der Sozialistischen Internationale wieder eine Führungsrolle übernehmen."
BEL_raise_the_red_flag:	"Hissen Sie die rote Flagge"
BEL_raise_the_red_flag_desc:	"Bisher haben wir uns vor allem für das gemäßigte sozialistische Ideal eingesetzt. Um uns jedoch stärker an den Sowjetblock anzunähern, müssen wir möglicherweise unsere Unterstützung für die Kommunistische Partei verstärken. Der erste Schritt dazu wäre die Unterstützung von Le Drapeau Rouge (Die Rote Fahne), der kommunistischen Zeitung in Belgien."
BEL_raise_the_red_flag_tt:	"Schaltet die Entscheidungen zu §Y$BEL_rekindle_the_red_flame_cat$§! frei und wird [BEL.GetNameDef] §YCommunist§!."
BEL_support_the_european_project:	"Unterstützen Sie das europäische Projekt"
BEL_support_the_european_project_desc:	"In einer Welt, die von Krieg und Konflikten beherrscht wird, ist uns sehr deutlich geworden, dass Neutralität keine Garantie für Frieden ist. Deshalb sollten wir den europäischen Staaten die Hand reichen und ein Gremium schaffen, das sich der gegenseitigen Sicherheit und der wirtschaftlichen Stabilität widmet, damit wir gemeinsam erfolgreich sein können."
BEL_european_community:	"Europäische Gemeinschaft"
BEL_european_community_desc:	"Die Anfänge des europäischen Projekts sind gut verlaufen, so dass wir eine Erweiterung unserer Mitgliedschaft und die Ratifizierung einer Reihe von Verträgen in Betracht ziehen sollten, die die Zukunft unserer Gemeinschaft regeln. Wir könnten sogar erwägen, uns auf ein stärker föderales Modell zuzubewegen, in dessen Zentrum Belgien eine führende Rolle einnehmen würde."
BEL_european_community_tt:	"Schaltet Entscheidungen frei, die §Y$BEL_closer_european_union_cat$§! verfolgen"
BEL_the_king_surrenders:	"Der König kapituliert"
BEL_the_king_surrenders_desc:	"Überraschend hat König Leopold III. von seinen Befugnissen als Oberbefehlshaber Gebrauch gemacht und dem Feind die bedingungslose Kapitulation aller belgischen Militäreinheiten angeboten. Angeblich, um so viele Menschenleben wie möglich zu retten, aber es gibt Gerüchte über ein dunkleres Motiv."
BEL_unfit_to_reign:	"Untauglich zum Regieren"
BEL_unfit_to_reign_desc:	"Angesichts der bedingungslosen Kapitulation, die König Leopold III. ohne Zustimmung des Parlaments angeboten hat, hat die Zivilregierung ihn für regierungsunfähig erklärt und geschworen, den Krieg aus dem Ausland fortzusetzen."
BEL_prisoner_king:	"Der gefangene König"
BEL_prisoner_king_desc:	"König Leopold III., der seine Strafe an der Seite seines Volkes verbüßen möchte, hat sich entschieden, als Gefangener in [BEL.GetNameDef] zu bleiben. Sein Volk, das nun als 'Gefangenenkönig' bezeichnet wird, hat diese Aktion mit Zustimmung aufgenommen und sich in diesen schwierigen Zeiten um sein Beispiel geschart."
BEL_government_in_exile:	"Regierung im Exil"
BEL_government_in_exile_desc:	"Die überlebende [BEL.GetAdjective] politische Elite ist nun in der Hauptstadt ihres Gastlandes angekommen, darunter eine Reihe wichtiger Minister wie Hubert Pierlot, Paul-Henri Spaak, Camille Gutt und Albert van Vleeshauwer. Gemeinsam haben sie die Regierung der Vier gebildet und geschworen, den Krieg bis zu seinem siegreichen Ende zu führen."
BEL_la_dame_blanche:	"La Dame Blanche"
BEL_la_dame_blanche_desc:	"Die Dame Blanche oder die Weiße Dame war die Untergrundorganisation des Widerstands während des Großen Krieges. Walthère Dewé, der damalige Anführer der Bewegung, hat im Stillen die erneute Besetzung Belgiens vorbereitet, und es ist nun an der Zeit, die Fähigkeiten dieser Organisation ein zweites Mal zu entfesseln."
BEL_government_in_exile_tt:	"Schaltet §Y$BEL_government_in_exile_cat$§! frei, um die Legitimität und den Widerstand von [ROOT.GetName] zu stärken."
BEL_moi_dabord:	"Moi d'abord"
BEL_moi_dabord_desc:	"Moi d'abord! Ich zuerst! Spaaks berühmter Ausruf, als der feindliche Botschafter mit der Kriegserklärung kam. Spaak war bereits wütend über den Ausbruch der Feindseligkeiten und wollte, dass der Überraschungsangriff in den internationalen Akten vermerkt wird, bevor die Kriegserklärung abgegeben werden konnte. Dieser Spruch ist seitdem zu einem Schlachtruf für die Anhänger der Exilregierung geworden."
BEL_v_for_victory:	"V für Sieg"
BEL_v_for_victory_desc:	"Victoire! Vryheid! Zwei Worte, Sieg und Freiheit, die in den belgischen Sprachen vorkommen und durch denselben Buchstaben gekennzeichnet sind. Der erhobene Zeige- und Mittelfinger ist in der belgischen Bevölkerung zu einem Symbol des Trotzes und der Entschlossenheit geworden, bevor er sich auch im Ausland verbreitet hat und sogar von ähnlich trotzigen nationalen Führern übernommen wird."
BEL_democratic_homecoming:	"Demokratische Heimkehr"
BEL_democratic_homecoming_desc:	"Es war nicht das Königtum, das uns unser Heimatland zurückgegeben hat, sondern unsere demokratischen Institutionen und der Prozess, die fähigsten unserer Bürger an die Spitze zu bringen. Wir sollten ihren wertvollen Beitrag zu diesem Moment anerkennen und ihre Erfolge für künftige Generationen festhalten."
BEL_charles_count_of_flanders:	"Karl, Graf von Flandern"
BEL_charles_count_of_flanders_desc:	"Es ist klar, dass man Leopold nicht zutrauen kann, den Thron wieder zu besteigen, denn er hat sich seiner Verantwortung entzogen, sobald er die Nation aufgegeben hat. Zum Glück hat er einen jüngeren Bruder, Prinz Charles, den Grafen von Flandern, der ein hervorragender Regent wäre, bis wir früher entscheiden können, was mit dem 'König' geschehen soll."
BEL_leopolds_return:	"Leopolds Rückkehr"
BEL_leopolds_return_desc:	"König Leopold III. ist der rechtmäßige Herrscher von [BEL.GetNameDef], und er sollte seinen Thron wieder besteigen, nachdem Belgien wieder an uns zurückgegeben wurde."
BEL_secretaries_general:	"Generalsekretäre"
BEL_secretaries_general_desc:	"Obwohl wir alles tun würden, um unsere Nation zu verteidigen, mussten wir mit Blick auf unsere viel größeren Nachbarn realistisch sein und die harte Entscheidung treffen, Gesetze für den Fall unserer Kapitulation zu schaffen. Deshalb haben wir die Generalsekretäre gegründet. Das sind Beamte, die gesetzlich befugt sind, mit jedem Besatzer zusammenzuarbeiten und dafür zu sorgen, dass die lokale Regierung weiterarbeiten kann."
BEL_the_secret_army:	"Die Geheimarmee"
BEL_the_secret_army_desc:	"Jetzt, da unser Land besetzt ist, müssen wir mit dem Aufbau des Widerstands beginnen, um Sabotageakte und Störungen zu begehen. Die Geheimarmee, die von einer Reihe von Offizieren unserer besiegten Armee gegründet wurde, verfügt über die organisatorischen und logistischen Fähigkeiten, die wir brauchen, um dies in die Wege zu leiten. Alles, was wir tun müssen, ist, den Befehl zu geben."
BEL_the_belgian_legion:	"Die Belgische Legion"
BEL_the_belgian_legion_desc:	"Die Belgische Legion ist eine Ansammlung von konservativen und royalistischen Loyalisten, die bereit sind, im Namen ihres Königs zu den Waffen zu greifen. Wir sollten so viele wie möglich aus dem Land schmuggeln und sie für einen guten Zweck einsetzen."
BEL_develop_home_support:	"Entwickeln Sie Unterstützung im Inland"
BEL_develop_home_support_desc:	"Auch wenn der größte Teil der Kriegsanstrengungen von unserem Exil aus koordiniert wird, genießen wir zu Hause immer noch breite Unterstützung. Dies ist vor allem der Arbeit der Generalsekretäre zu verdanken, die sich als fähig erwiesen haben, zivile Bemühungen zu organisieren, ohne die Besatzer übermäßig zu verärgern."
BEL_military_service_for_all_in_exile:	"Militärdienst für alle im Exil"
BEL_military_service_for_all_in_exile_desc:	"Es gibt sehr viele [BEL.GetAdjective]s, die überall auf der Welt leben. Wir sollten anordnen, dass sie alle sofort zum Dienst für die Befreiung unseres Heimatlandes herangezogen werden. Der patriotische Eifer ist groß, und wir können einen großen Zustrom an Unterstützung erwarten."
BEL_consolidate_resistance_groups:	"Konsolidieren Sie die Widerstandsgruppen"
BEL_consolidate_resistance_groups_desc:	"Es gibt eine große Anzahl von Widerstandsorganisationen innerhalb von [BEL.GetNameDef], die alle unsere Befreiung unterstützen wollen, aber durch eine Fülle von unterschiedlichen Ideologien, Meinungen, Idealen, Interessengruppen und Unterstützern gespalten sind. Als Exilregierung liegt es in unserer Macht, die zentrale organisatorische Initiative zu ergreifen, um sie alle auf unser gemeinsames Ziel hinzuführen."
BEL_free_belgian_forces:	"Freie belgische Streitkräfte"
BEL_free_belgian_forces_desc:	"Unsere Präsenz im Ausland ist jetzt so stark, dass wir mit richtigen militärischen Aktionen gegen unsere Besatzer beginnen können. Auch wenn der Kampf vielleicht nicht sofort um Belgien selbst geführt wird, so können wir doch endlich den Kampf zu unseren Feinden bringen und mit [BEL.GetAdjective] Blut und Stahl direkter zu den Kriegsanstrengungen beitragen."
BEL_free_belgian_forces_tt:	"2 §YDivision d'Infanterie§! wird in einem zufälligen Staat im Heimatland des Exilanten spawnen."
BEL_king_law_freedom:	"König, Recht, Freiheit"
BEL_king_law_freedom_desc:	"Ein guter Belgier kämpft für den König, das Recht und die Freiheit. Wir sollten beachten, dass der König vor allen anderen steht, so wie Leopold III. unser König sein sollte. Denn es sind seine Gesetze, die wir verteidigen, und seine Freiheit, für die wir kämpfen."
BEL_king_of_the_belgians:	"König der Belgier"
BEL_king_of_the_belgians_desc:	"Ich schwöre, die Verfassung und die Gesetze des belgischen Volkes zu achten, die nationale Unabhängigkeit und die Unversehrtheit des Territoriums zu bewahren, so lauten die Worte, mit denen ein Mann zum König wird, und die in drei Sprachen gesprochen werden: Französisch, Niederländisch und Deutsch."
BEL_rally_to_the_king:	"Kundgebung für den König"
BEL_rally_to_the_king_desc:	"Der König ist mehr als nur ein Gefangener, er ist zu einem Symbol für unsere kämpfende Nation geworden. Wir sind sicher, dass wir mit seiner Führung, seinem Geschick, seiner Intelligenz und seiner Entschlossenheit diese dunklen Tage überstehen und als eine stärkere, wohlhabendere Nation hervorgehen werden."
BEL_van_overstraeten_on_the_home_front:	"Van Overstraeten an der Heimatfront"
BEL_van_overstraeten_on_the_home_front_desc:	"Er ist bei weitem der intelligenteste aller Militärs, doch der Nachteil ist, dass er es weiß. Van Overstraeten hat vor Ausbruch des Krieges als militärischer Berater des Königs gedient, und obwohl sein Charakter die Zusammenarbeit mit ihm zu einer Herausforderung macht, müssen wir ihn unter den gegebenen Umständen bitten, das Feld zu betreten und unsere Nation zum Sieg zu führen."
BEL_expand_the_belgian_legion:	"Erweitern Sie die belgische Legion"
BEL_expand_the_belgian_legion_desc:	"Immer mehr Menschen strömen zum Banner des Königs und sind bereit, ihr Bestes im Dienste der Krone zu geben. Wir müssen nur den Befehl geben, und sie werden marschieren, wo wir es ihnen befehlen."
BEL_expand_the_belgian_legion_tt:	"3 §YDivision d'Infanterie§! spawnen in einem zufälligen Staat im Heimatland des verbannten Heeres."
BEL_the_price_to_pay:	"Der zu zahlende Preis"
BEL_the_price_to_pay_desc:	"Der König führt schon seit einiger Zeit Gespräche mit unseren Besatzern und hat sich durch seinen Charakter ihr Vertrauen erworben. So ist es möglich, dass wir die in Belgien verlorenen Ländereien zurückerhalten. Der Preis, den sie dafür verlangen, ist einfach. Knien Sie nieder."
BEL_monetary_reconstruction:	"Monetärer Wiederaufbau"
BEL_monetary_reconstruction_desc:	"Nach dem Ersten Weltkrieg lag die belgische Wirtschaft in Trümmern. Um den Wiederaufbau zu erleichtern und die massiven Schulden zu tilgen, begann das belgische Finanzministerium, Geld zu drucken. Sehr viel Geld. Das hat zwar damals geholfen, aber jetzt droht uns eine Hyperinflation, die wir in den Griff bekommen müssen, bevor weitere Reformen durchgeführt werden können."
BEL_rebuild_wallonian_industry:	"Wallonische Industrie wiederaufbauen"
BEL_rebuild_wallonian_industry_desc:	"Wallonien war das Gebiet, das während der deutschen Besatzung im Ersten Weltkrieg am stärksten betroffen war, da ein Großteil der Industrie und der Ressourcen von den Besatzern geplündert wurde. Der Wiederaufbau ist in der Zwischenzeit gut vorangekommen, aber die Region könnte mehr Investitionen gebrauchen, um ihr wahres Potential als [ROOT.GetAdjective] industrielles Kernland auszuschöpfen."
BEL_gold_reserves:	"Goldreserven"
BEL_gold_reserves_desc:	"Glücklicherweise unterhält der [ROOT.GetAdjective] Staat eine beträchtliche Goldreserve. Dies bietet uns derzeit eine stabile Grundlage für die Kreditaufnahme und -vergabe innerhalb unseres Landes, obwohl wir uns auch dafür entscheiden könnten, unser Gold zu verkaufen, um die Entwicklung und den Bau vorübergehend anzukurbeln."
BEL_social_partners:	"Sozialpartner"
BEL_social_partners_desc:	"Unsere Regierung hat die Nationale Arbeitskonferenz einberufen, um Gewerkschafts- und Unternehmensvertreter zusammenzubringen. Das Ergebnis war die Einführung des Mindestlohns und von sechs Tagen bezahltem Urlaub pro Jahr."
BEL_revive_coal_mining:	"Kohlebergbau wiederbeleben"
BEL_revive_coal_mining_desc:	"Der Eckpfeiler der wallonischen Industrie war schon immer der Stahl. Um diesen wichtigen Werkstoff besser produzieren zu können, müssen wir unsere Kohleminen in der Region aggressiv ausbauen."
BEL_40_hour_workweek:	"40-Stunden-Woche"
BEL_40_hour_workweek_desc:	"Ein weiteres Ergebnis der Nationalen Arbeitskonferenz war die radikale Einführung der 40-Stunden-Woche. Obwohl wir anfangs skeptisch waren, haben wir einen Anstieg der Produktivität und der Zufriedenheit der Arbeitnehmer festgestellt."
BEL_cockerill:	"Cockerill"
BEL_cockerill_desc:	"Cockerill ist der führende Stahlhersteller in [ROOT.GetNameDef], mit riesigen Anlagen, die alles von Motoren bis hin zu Artillerie produzieren können. Da die Nachfrage nach all diesen Produkten steigt, sind wir in einer erstklassigen Position, um für ihre weitere Expansion zu sorgen."
BEL_cockerill_tt:	"§GReduces§! die Kosten für die Zuweisung von §Y$BEL_cockerill_industrial$§! als Industrieunternehmen"
BEL_railway_expansion:	"Ausbau der Eisenbahn"
BEL_railway_expansion_desc:	"Die Arterien, die [ROOT.GetAdjective] Handel und Industrie versorgen, sind die Eisenbahnen. Während sich unsere Wirtschaft erholt und erholt, müssen wir sicherstellen, dass die Infrastruktur, die wir haben, Schritt hält."
BEL_corporate_social_responsibility:	"Soziale Verantwortung der Unternehmen"
BEL_corporate_social_responsibility_desc:	"Trotz der bedeutenden Industrialisierung und Urbanisierung von [ROOT.GetNameDef] haben die Gewerkschaften überraschenderweise nie so viel Macht gehabt, wie man erwarten könnte. Das liegt daran, dass es eine kulturelle Tradition gibt, dass Unternehmen eine soziale Verantwortung gegenüber ihren Arbeitnehmern haben - obwohl es nicht schadet, sie von Zeit zu Zeit daran zu erinnern."
BEL_val_benoit_institutes:	"Val-Benoît-Institute"
BEL_val_benoit_institutes_desc:	"Wir sollten die Val-Benoît-Institute an der Universität von Lüttich einrichten und auf den Ruinen der alten Abtei von Val-Benoît mehrere neue wissenschaftliche Abteilungen schaffen."
BEL_stk:	"STK gründen"
BEL_stk_desc:	"Wir wollen das Studiecentrum voor de Toepassingen van de Kernenergie (STK) gründen, eine Einrichtung, die sich mit den wissenschaftlichen Möglichkeiten der Atomenergie beschäftigt."
BEL_embrace_export_economy:	"Umarmung der Exportwirtschaft"
BEL_embrace_export_economy_desc:	"Obwohl nicht so berühmt dafür wie unser nördlicher Nachbar, hat [ROOT.GetNameDef] eine stolze Tradition für den Handel, dessen Zentrum die Stadt Antwerpen ist. Lassen Sie uns dieses Gewinnpotenzial stärker ausschöpfen - schließlich ist es ein gutes Geschäft."
BEL_engine_of_the_economy:	"Motor der Wirtschaft"
BEL_engine_of_the_economy_desc:	"Züge haben einen besonderen Platz im Herzen der [ROOT.GetAdjective], sie beflügeln neue Innovationen, halten die Produktion am Laufen und sind der Treibstoff für weiteres Wachstum. Vor allem aber sind sie der Motor der Wirtschaft."
BEL_belgian_miracle:	"Das belgische Wunder"
BEL_belgian_miracle_desc:	"Es ist schwer vorstellbar, dass Belgien vor zwei Jahrzehnten in Trümmern lag und von vielen nur als ein weiteres europäisches Schlachtfeld betrachtet wurde. Vergleichen Sie das mit dem, was wir heute sind: ein Leuchtturm der Produktivität und Innovation. Das verdanken wir der Tapferkeit unserer Soldaten, der Hartnäckigkeit unserer Arbeiter und der Loyalität unserer Verbündeten und Freunde."
BEL_belgian_air_force:	"[ROOT.GetAdjective] Luftwaffe"
BEL_belgian_air_force_desc:	"[ROOT.GetNameDef] war ein früher Anwender der Luftwaffe und hat im letzten Krieg eine Streitmacht aufgebaut, die sich sehr gut bewährt hat. Leider haben Haushaltszwänge die Innovation seitdem gebremst. Da die Spannungen zunehmen, müssen wir sicherstellen, dass unsere Luftabschreckung stark bleibt."
BEL_develop_belgian_air_industry:	"Entwicklung der belgischen Luftfahrtindustrie"
BEL_develop_belgian_air_industry_desc:	"Wir haben nicht viel Erfahrung in der Entwicklung eigener Flugzeuge, denn die Flugzeugindustrie ist seit dem letzten Krieg bedauerlicherweise unterentwickelt. Es gibt eine Reihe sehr innovativer junger Konstrukteure und Start-up-Unternehmen, die wir subventionieren und entwickeln lassen könnten."
BEL_renard_constructions_aeronautiques:	"Renard Constructions Aéronautiques"
BEL_renard_constructions_aeronautiques_desc:	"Einer der vielversprechendsten Designer der letzten Zeit ist Alfred Renard. Er hat einige sehr innovative Entwürfe, und wir sollten diese Bemühungen und sein Unternehmen unterstützen."
BEL_stampe_et_vertrongen:	"Stampe et Vertrongen"
BEL_stampe_et_vertrongen_desc:	"Obwohl Stampe et Vertrongen auf Trainingsflugzeuge spezialisiert ist, sollten wir in diese einheimische Firma investieren und ihre Entwürfe für zusätzliche Aufgaben an der Front anpassen."
BEL_relocate_air_production:	"Verlagerung der Flugzeugproduktion"
BEL_relocate_air_production_desc:	"Die Herstellung von Flugzeugen erfordert große Mengen spezialisierter Komponenten und ist auf schwer zu ersetzende Luftfahrtingenieure angewiesen. Einmal hergestellt, können die Flugzeuge jedoch praktisch überall eingesetzt werden. Wir sollten Verträge mit ausländischen Firmen abschließen, um unsere Flugzeuge im Ausland zu produzieren, damit unsere Produktionslinien geschützt sind."
BEL_pressurized_cabin_development:	"Entwicklung der Druckkabine"
BEL_pressurized_cabin_development_desc:	"In dem Bemühen, die Qualität des Flugverkehrs zwischen Belgien und dem Kongo zu verbessern, haben wir an Druckkabinen gearbeitet, die es uns ermöglichen, viel höher zu fliegen, als es normalerweise möglich ist. Wenn wir diese Technologie auch auf unsere Kriegsflugzeuge anwenden, wird sich deren Leistungsfähigkeit erheblich verbessern."
BEL_foreign_plane_purchases:	"Käufe von ausländischen Flugzeugen"
BEL_foreign_plane_purchases_desc:	"Leider sind wir aufgrund des Zustands der [ROOT.GetAdjective] Luftfahrtindustrie gezwungen, uns beim Kauf von Flugzeugen im Ausland umzusehen. Lassen Sie uns einen Wettbewerb ausschreiben und andere Nationen sich um die Aufträge bewerben lassen."
BEL_aviation_school:	"Flugschule"
BEL_aviation_school_desc:	"Unsere Piloten brauchen einen Ort, an dem sie ihr Handwerk lernen können. Wir sollten unsere Ausbildungseinrichtungen entsprechend ausbauen."
BEL_polish_licences:	"Polnische Lizenzen"
BEL_polish_licences_desc:	"[POL.GetNameDef] hat angeboten, uns einige ihrer Flugzeugdesigns in Lizenz zur Verfügung zu stellen. Sie können uns für weit unter dem Marktpreis zur Verfügung gestellt werden."
BEL_early_helicopters:	"Frühe Hubschrauber"
BEL_early_helicopters_desc:	"Nicolas Florine ist nach dem russischen Bürgerkrieg nach [ROOT.GetNameDef] ausgewandert und hat Interesse an einer radikal neuen Form des Fliegens mit schnell drehenden Rotoren gezeigt. Wir sollten diese Entwicklung finanzieren und abwarten, wohin uns dieser neue Bereich der Luftfahrtwissenschaft führt!"
BEL_air_doctrine:	"Luft-Doktrin"
BEL_air_doctrine_desc:	"Die moderne Kriegsführung verändert und entwickelt sich ständig weiter. Wir sollten eine Studie über die aktuellen Doktrinen anderer Militärmächte finanzieren und sehen, welche Lehren daraus gezogen und auf unsere eigene Luftwaffe übertragen werden können."
BEL_legacy_of_the_belgian_airforce:	"Das Vermächtnis der belgischen Luftwaffe"
BEL_legacy_of_the_belgian_airforce_desc:	"Unsere Piloten gehörten zu den tapfersten derjenigen, die über den Schlachtfeldern des Großen Krieges kämpften, und diese stolze Tradition wird auch heute noch aufrechterhalten."
BEL_re_establish_belgian_navy:	"Wiederaufbau der belgischen Marine"
BEL_re_establish_belgian_navy_desc:	"Obwohl Belgien nach dem Ersten Weltkrieg im Vertrag von Versailles mehrere Schiffe von Deutschland erhalten hatte, wurde die Marine 1927 aufgrund von Haushaltszwängen abgeschafft. Angesichts der sich abzeichnenden Bedrohungen im Ausland und der Notwendigkeit, die strategische Kommunikation und den Handel, insbesondere mit dem Kongo, aufrechtzuerhalten, müssen wir sicherstellen, dass wir unsere Flotte wieder aufstellen."
BEL_re_build_the_fleet:	"Wiederaufbau der Flotte"
BEL_re_build_the_fleet_desc:	"Der erste Schritt zur Wiederherstellung unserer Seemacht besteht darin, tatsächlich eine neue Marine aufzubauen. Dies erfordert erhebliche Investitionen in neue Werften und Schiffbaukapazitäten."
BEL_allied_donations:	"Spenden der Alliierten"
BEL_allied_donations_desc:	"Die Umstände, unter denen wir unsere maritime Präsenz verstärken müssen, sind noch dringlicher geworden. Wir sollten uns daher an unsere Verbündeten wenden und sehen, ob sie uns beim Wiederaufbau unserer Marinekapazitäten unterstützen können."
BEL_port_of_antwerp:	"Der Hafen von Antwerpen"
BEL_port_of_antwerp_desc:	"Antwerpen ist eine Stadt, die für ihre Handelsvergangenheit bekannt ist, und der Hafen ist auch heute noch wichtig. Lassen Sie uns diesen Ruf nutzen, um günstige Handelsvereinbarungen zu ermöglichen."
BEL_corvette_fleet:	"Korvettenflotte"
BEL_corvette_fleet_desc:	"Der Bau von Schiffen dauert lange, besonders bei großen Kapitalschiffen. Angesichts der dringenden Notwendigkeit, unsere Flotte zu erweitern, sollten wir uns stattdessen auf kleine, leicht zu produzierende Schiffe konzentrieren, die sich auf das spezialisieren, wofür wir sie am meisten brauchen: den Schutz unserer Handelsinteressen."
BEL_boelwerf:	"Boelwerf"
BEL_boelwerf_desc:	"Die Boelwef ist eine der größten Werften in Antwerpen. Wir sollten ihre Fähigkeiten nutzen und stärker in den Ausbau ihrer Docks investieren, damit wir unsere Marinestärke leichter verstärken können."
BEL_cockerill_shipyards:	"Cockerill-Werften"
BEL_cockerill_shipyards_desc:	"Cockerill Shipyards, eine Tochtergesellschaft des größeren Cockerill-Konglomerats, ist die Art von industriellen Verbindungen, auf die wir wirklich bauen sollten. Kriegsschiffe dieser Zeit werden aus Stahl gebaut, und niemand kann besser mit Stahl umgehen als Cockerill."
BEL_antwerp_maritime_academy:	"Antwerpener Schifffahrtsakademie"
BEL_antwerp_maritime_academy_desc:	"Obwohl sie sich mehr der zivilen und kommerziellen Schifffahrt widmet, können wir das Fachwissen der Lehrer hier nutzen, um unsere Marinepräsenz auf See zu trainieren und auszubauen. Sie werden besonders nützlich sein, wenn es darum geht, unseren Offizieren zu zeigen, wie sie am besten mit der Handelsschifffahrt zusammenarbeiten können, die unseren Handel am Laufen hält."
BEL_naval_doctrine:	"Marinedoktrin"
BEL_naval_doctrine_desc:	"Unsere zivilen Ausbilder können uns nur sehr wenig beibringen. Um unser Verständnis von Marineangelegenheiten wirklich zu erweitern, müssen wir einige ausländische Talente anheuern und so unser Wissen und unsere Ausbildungsfähigkeiten stärken."
BEL_convoy_protection_duties:	"Defensiv ausgerüstete Handelsschiffe"
BEL_convoy_protection_duties_desc:	"In Zeiten großer Gefahr und Not ist es vertretbar, Handelsschiffe zu bewaffnen und sie mit den Waffen und dem Marinezubehör auszustatten, die für ihren eigenen Schutz sorgen. Auf diese Weise werden diejenigen, die unsere Kaufleute jagen, feststellen, dass die Beute plötzlich Zähne hat."
BEL_maritime_phoenix:	"Maritimer Phönix"
BEL_maritime_phoenix_desc:	"Aus dem Nichts ist unsere Flotte aufgeblüht. In unseren Werften brennt das Feuer der Industrie, während immer mehr neue Schiffe die Helling verlassen, und unsere strategischen Interessen im Ausland werden von unseren Flotten unter der Flagge [ROOT.GetAdjective] wahrgenommen."
BEL_government_resigns_complete_national_unity_tt:	"§Die Wahl der Regierung der Nationalen Einheit im Rahmen des Ereignisses Rücktritt der Regierung wird diesen Schwerpunkt vervollständigen.§!"
BEL_government_resigns_complete_vandervelde_tt:	"§Die Wahl der Vandervelde-Minderheit im Ereignis Rücktritt der Regierung wird diesen Fokus vervollständigen.§!"
BEL_royal_intervention_complete_janson_tt:	"§Die Wahl von Janson im Ereignis Königliche Intervention schließt diesen Fokus ab.§!"
BEL_royal_intervention_complete_degrelle_tt:	"§Die Wahl von Degrelle im Ereignis Königliche Intervention vervollständigt diesen Fokus.§!"
BEL_royal_intervention_tt:	"Der König wird eingreifen, um die kollabierende Regierung zu stürzen."
BEL_snap_election_tt:	"Es wird eine vorgezogene Wahl stattfinden, um die zukünftige politische Richtung zu bestimmen."
BEL_royal_intervention_complete_pierlot_tt:	"§Die Wahl von Pierlot im Ereignis Schnellwahl vervollständigt diesen Fokus.§!"
BEL_royal_intervention_complete_spaak_tt:	"§Die Wahl von Spaak bei den vorgezogenen Neuwahlen vervollständigt diesen Fokus.§!"
BEL_investigate_pm_tt:	"Auch die Anschuldigungen gegen den Premierminister selbst werden gründlicher untersucht werden."
BEL_relocate_air_production_tt:	"Gewährt §G2§! Off-Map-Militärfabriken, wenn Sie in einen Krieg eintreten."
BEL_unlock_gold_reserve_decisions_tt:	"Schaltet Entscheidungen zu §Y$BEL_gold_reserves_cat$§! frei."
BEL_legacy_of_the_soldier_king_tt:	"§YKing Leopold§! wird sich nicht mehr dem militärischen Druck beugen und das Land bei einer Invasion aufgeben."
BEL_anti_tank_guns_tt:	"Ermöglicht §HExzellente Panzerabwehrkanonen§!\nUnterstützen Sie Panzerabwehrangriffe: §G+10%§!\nUnterstützung Panzerabwehr-Piercing: §G+10%§!\nLinie Harter Panzerabwehr-Angriff: §G+10%§!\nLine Panzerabwehr-Piercing: §G+10%§!\nMotorisierte Panzerabwehr Harter Angriff: §G+10%§!\nMotorisierte Panzerabwehr durchdringend: §G+10%§!\nPanzerzerstörer Harter Angriff: §G+10%§!\nPanzerzerstörer durchdringend: §G+10%§!\n"
BEL_chasseurs_ardennais_tt:	"§Y$mountaineers$§!:\n§YForest§!:\nBewegung Effektive Veränderung: §G+10%§!\n Angriff Effektive Veränderung: §G+20%§!\n Verteidigung Effektive Änderung: §G+20%§!\n§YMountain§!:\n Bewegung Effektive Änderung: §R-10%§!\n Angriff Effektive Änderung: §R-20%§!"
BEL_the_european_crusade_tt:	"Die Auswirkungen von §YDer Europäische Kreuzzug§! hängen davon ab, ob §YRexists§! oder §YVNV§! an die Macht kam."
BEL_european_crusade_no_focus_tt:	"§YRexists§! profitiert vom Faktor Rekrutierbare Bevölkerung \nWenn der §YVNV§!"
BEL_the_king_surrenders_tt:	"§RKapitulieren Sie mit dem König, der noch an der Macht ist, wird dieser Fokus vervollständigt.§!"
BEL_royal_commander_in_chief_tt:	"§YKönig Leopold III§! wird ein §YFeldmarschall§!"
BEL_lucien_lippert_tt:	"§YLucien Lippert§! wird ein §YGeneral§!"
BEL_lambert_chardome_tt:	"§YLambert Chardome§! wird ein §YGeneral§!"
BEL_eddy_blondeel_tt:	"§YEddy Blondeel§! wird ein §YGeneral§!"
BEL_scars_of_ww1_ns_fake_tt:	"Abteilung Organisation: §R-15%§! \nRecruitable Population Factor: §R-15%§! \nKriegsunterstützung: §R-30%§! \n§YMilitärische Fabrik§! Baugeschwindigkeit: §R-20%§!"
BEL_corruption_ns_fake_tt:	"Täglicher politischer Machtzuwachs: §R-0.25%§! \nStabilität: §R-20%§! \nBaugeschwindigkeit: §R-20%§! \nTägliche Unterstützung des Faschismus: §G+0.10%§!"
CONGO_belgian_congo:	"Belgisch-Kongo"
CONGO_belgian_congo_desc:	"Die Kolonie wurde 1908 gegründet, nachdem der Freistaat Kongo von der belgischen Regierung annektiert wurde, um der Ausbeutung durch die belgische Krone zu entgehen. Belgisch-Kongo bleibt das Juwel im Herzen der belgischen Kolonialpolitik. "
CONGO_expand_villages:	"Dörfer ausbauen"
CONGO_expand_villages_desc:	"Der Kongo verfügt über ein großes Potenzial, das jedoch nur durch eine große und lebendige Erwerbsbevölkerung ausgeschöpft werden kann. Wir sollten neue Dörfer in den Gebieten errichten, die wir entwickeln wollen, um dieses Wachstum zu fördern."
CONGO_free_enterprise_fund:	"Fonds für freies Unternehmertum"
CONGO_free_enterprise_fund_desc:	"Die belgische Kolonialverwaltung ist sich sehr wohl bewusst, dass sie investieren muss, um das Beste aus dem Kongo herauszuholen. Daher bietet sie kleinen Unternehmen finanzielle Zuschüsse an, um ihnen den Start zu erleichtern. "
CONGO_secure_international_funding:	"Internationale Finanzierung sichern"
CONGO_secure_international_funding_desc:	"Die belgische Kolonialbehörde ist nicht die einzige Macht, die sich des Potenzials des Kongo bewusst ist. Wir sollten uns nach internationalen Partnern für Investitionen umsehen, mit denen wir mit oder ohne [BEL.GetName] Geschäfte machen können."
CONGO_secure_international_funding_tt:	"Entscheiden Sie sich für §YInvestitionen internationaler Gelder in die kongolesische Infrastruktur und Industrie§!"
CONGO_weapon_repair_workshops:	"Reparaturwerkstätten für Waffen"
CONGO_weapon_repair_workshops_desc:	"Obwohl der Großteil der militärischen Produktion in Belgien abgewickelt wird, gibt es immer noch eine Reihe von kleinen Werkstätten, die alte militärische Ausrüstung reparieren und umfunktionieren können. Wir sollten dafür sorgen, dass sie über die nötigen Mittel verfügen, falls wir in Zukunft auf diese Ausrüstung zurückgreifen müssen."
CONGO_rawji_group:	"Rawji-Gruppe"
CONGO_rawji_group_desc:	"Aus bescheidenen Anfängen heraus hat sich die Rawji-Gruppe zu einem Unternehmen entwickelt, das eine Vielzahl verschiedener Branchen und Unternehmen im gesamten Kongo umfasst."
CONGO_the_heart_of_africa:	"Das Herz von Afrika"
CONGO_the_heart_of_africa_desc:	"Das riesige Gebiet des Kongo liegt in der Mitte Afrikas und obwohl es relativ arm und unterentwickelt ist, verbirgt sich in seinem Inneren ein enormer Reichtum an Ressourcen und Möglichkeiten. Wir müssen uns nur auf den Weg machen und sie finden."
CONGO_establish_university_of_louvain:	"Die Lovanium Universität gründen"
CONGO_establish_university_of_louvain_desc:	"Ursprünglich als medizinische Hochschule mit dem Ziel gegründet, Tropenmedizin zu studieren, haben wir die Möglichkeit, das Institut um eine Abteilung für Agrarwissenschaften zu erweitern. Wenn wir es dann zur Universität erklären, wird es sicherlich zum Neid Afrikas werden."
CONGO_congo_investments:	"Investitionen im Kongo"
CONGO_congo_investments_desc:	"Die belgische Zentralregierung ist sich der Reichtümer des Kongo sehr wohl bewusst. Wir könnten diesen Reichtum nutzen und ihn für die weitere Erholung der belgischen Wirtschaft einsetzen. Alles, was es dazu braucht, ist eine kleine Vorabinvestition."
CONGO_societe_generale_de_belgique:	"Societe Generale de Belgique"
CONGO_societe_generale_de_belgique_desc:	"Das megalithische Unternehmen im Herzen eines Großteils der belgischen Wirtschaft. Wenn wir die organisatorische und finanzielle Stärke benötigen, um ein ganzes Land zu entwickeln, gibt es niemanden, an den wir uns besser wenden könnten, um unsere Interessen im Kongo zu stärken."
CONGO_ccci:	"CCCI"
CONGO_ccci_desc:	"Compagnie du Congo pour le Commerce et l'Industrie ist ein großes Bergbaukonglomerat, das im Kongo tätig ist. Das Unternehmen kontrolliert zwar eine Vielzahl von Mineralien, aber wir möchten ihm vor allem bei der Erschließung seiner metallurgischen Ressourcen helfen."
CONGO_forminiere:	"Forminière"
CONGO_forminiere_desc:	"Die Société internationale forestière et minière du Congo ist eine Organisation, die sich vor allem für die Forstwirtschaft und den Mineralienabbau im Kongo interessiert. Ihre Erfahrung in der Forstwirtschaft ist zwar wertvoll, aber nichts ist vergleichbar mit der Lukrativität ihres Diamantenmonopols in Kasai. Das müssen wir verstärken und ausbauen!"
CONGO_ruanda_urundi:	"Ruanda-Urundi"
CONGO_ruanda_urundi_desc:	"Einst Teil von Deutsch-Ostafrika, wurde es nach dem Großen Krieg vom Völkerbund treuhänderisch an [BEL.GetName] abgetreten. Es handelt sich um eine Region mit Zugang zu einigen wertvollen Ressourcen wie Baumwolle, Kaffee und Wolfram."
COG_approached_ruanda_urundi_governor_flag:	"Sprechen Sie den Gouverneur von Ruanda-Urundi an"
CONGO_jungle_industry:	"Dschungel-Industrie"
CONGO_jungle_industry_desc:	"Investoren stehen oft ratlos vor dem Wert eines riesigen Dschungels, aber man muss nur wissen, wo man suchen muss. Wir müssen dieses Fachwissen finden und ihnen die Werkzeuge an die Hand geben, um diese verborgenen Reichtümer zu erschließen."
CONGO_jungle_industry_available_tt:	"Kontrolliert jeden §YDschungelstaat§! im §YGroßen Kongobecken§!"
CONGO_belgian_devaluation:	"Belgische Abwertung"
CONGO_belgian_devaluation_desc:	"Die [BEL.GetAdjective] Regierung hat eine Abwertungspolitik betrieben, die es dem Generalgouverneur ermöglicht hat, die Zölle auf Importe zu senken und die auf Exporte zu erhöhen. Dies sollte den kolonialen Haushalt deutlich verbessern."
CONGO_french_congo:	"Französischer Kongo"
CONGO_french_congo_desc:	"Die Franzosen haben sich ein Stück des Kongobeckens unter den Nagel gerissen und unser Volk von uns getrennt. Jetzt ist der richtige Zeitpunkt, um diese historische Ungerechtigkeit rückgängig zu machen. Es kann nur einen geben!"
CONGO_force_publique:	"Force Publique"
CONGO_force_publique_desc:	"Ursprünglich als Kolonialpolizei gedacht, wurde sie während des Ersten Weltkriegs militarisiert und kämpfte unter großem Beifall gegen Deutsch-Afrika. Lassen Sie uns diese Ermächtigung fortsetzen und diese koloniale Truppe auf modernere Standards bringen."
COG_force_publique_reformed_flag:	" Die Force Publique wurde in die Armée Nationale Congolaise umgewandelt."
COG_comitted_to_our_overlords_war_flag:	"Wir haben uns entschlossen, uns voll und ganz dem Krieg unseres Oberherrn zu verschreiben"
CONGO_symbiotic_industrialization:	"Symbiotische Industrialisierung"
CONGO_symbiotic_industrialization_desc:	"Das eine befeuert das andere, denn mit der Entwicklung der belgischen Industrie steigt auch der Bedarf an Ressourcen. Diese können wir aus dem Kongo importieren und eine noch schnellere Industrialisierung vorantreiben, wodurch noch mehr Ressourcen benötigt werden. Der Wohlstand von beiden ist eng miteinander verbunden."
CONGO_prince_leopold_mine:	"Prinz-Leopold-Mine"
CONGO_prince_leopold_mine_desc:	"In der Region Kipushi wird seit Jahrhunderten Kupfer abgebaut, und obwohl wir hier schon seit geraumer Zeit arbeiten, wird der potenzielle Wert von Kupfer im Einklang mit den globalen Spannungen voraussichtlich steigen. Lassen Sie uns auf diese Nachfrage vorbereitet sein, wenn sie kommt."
CONGO_bakwanga_mine:	"Bakwanga-Mine"
CONGO_bakwanga_mine_desc:	"Es wurde entdeckt, dass die Region Bakwanga besonders reich an Diamanten ist. Zwar handelt es sich dabei nicht um die großen Edelsteine, die in Südafrika und Indien gefunden werden, aber es handelt sich um ein außergewöhnlich großes Vorkommen des härtesten Minerals der Welt, das für eine Vielzahl von industriellen Zwecken erschlossen werden könnte."
CONGO_expand_tungsten_mines:	"Erweitern Sie die Wolframminen"
CONGO_expand_tungsten_mines_desc:	"Angesichts des wachsenden Interesses an Wolframkernmunition war es wichtig, dass wir unsere eigene Quelle für dieses wichtige Metall sichern. Glücklicherweise wurde es in unserem Mandatsgebiet Ruanda-Urundi gefunden."
CONGO_rubber_plantations:	"Kautschuk-Plantagen"
CONGO_rubber_plantations_desc:	"Belgien hat eine besonders schlechte Geschichte, wenn es um den Abbau von Kautschuk im Kongo geht. Trotzdem müssen wir die Produktion dieses Materials weiter ausbauen, wohl wissend, dass wir unter dem wachsamen Auge der internationalen Gemeinschaft stehen."
CONGO_interfaith_school_subsidies:	"Interreligiöse Schulsubventionen"
CONGO_interfaith_school_subsidies_desc:	"Es gibt bereits eine Reihe von katholischen Missionsschulen im ganzen Land. Wenn wir jedoch das Bildungsniveau der Bevölkerung wirklich kostengünstig verbessern wollen, müssen wir mehr Organisationen in unseren Grenzen fördern."
CONGO_colonial_ambitions:	"Koloniale Ambitionen"
CONGO_colonial_ambitions_desc:	"Der Kongo ist ein beeindruckendes Stück Land, aber dieser Kontinent ist groß. Wir sollten den anderen Kolonialnationen zeigen, dass das Gerangel um Afrika noch nicht wirklich vorbei ist."
CONGO_congo_army:	"Die Armee des Kongo"
CONGO_congo_army_desc:	"Es wird immer deutlicher, dass es ausländische Mächte gibt, die daran interessiert sind, den Kongo einzunehmen. Deshalb sollten wir stärker in das Militär investieren, damit der Kongo sich besser verteidigen kann und vielleicht dazu beiträgt, dass [BEL.GetName] seinen Einfluss im Ausland geltend machen kann."
CONGO_modernize_force_publique:	"Modernisieren Sie die Force Publique"
CONGO_modernize_force_publique_desc:	"Obwohl sie bewundernswerte Leistungen erbracht hat, ist es kein Geheimnis, dass die Force Publique dringend modernisiert werden muss. Dies scheint der günstigste Zeitpunkt zu sein, um Investitionen zu diesem Zweck zurückzustellen."
CONGO_cheap_labor:	"Billige Arbeitskräfte"
CONGO_cheap_labor_desc:	"Es gibt eine Reihe von Techniken zur Manipulation der Arbeitskräfte, die eingesetzt werden können, um das Beste aus ihnen herauszuholen. Zum Beispiel kann man dafür sorgen, dass es so wenig Arbeitsschutz wie möglich gibt, damit das Risiko, entlassen zu werden, ständig präsent ist, und dass sie von den Unternehmen abhängig bleiben, um ihren Lebensunterhalt zu sichern."
CONGO_societe_miniere_de_bakwanga:	"Minière-Gesellschaft von Bécéka"
CONGO_societe_miniere_de_bakwanga_desc:	"Der Markt für Diamanten ist zwar außerordentlich lukrativ, aber im Zeitalter der großen Industrialisierung gibt es zahlreiche neue Verwendungsmöglichkeiten für dieses harte Material, zum Beispiel für Sägen und Bohrer. "
CONGO_kasai_secessionist_state:	"Kasaï Sezessionsstaat"
CONGO_kasai_secessionist_state_desc:	"Die Region Kasai wurde schon immer eher locker von [BEL.GetAdjective] Kräften kontrolliert. Mit den richtigen Verbindungen könnten wir uns eine Hochburg sichern, sollte der Kongo die Unabhängigkeit anstreben."
CONGO_regional_specialization:	"Regionale Spezialisierung"
CONGO_regional_specialization_desc:	"Der Kongo ist eine große Nation mit einer vielfältigen Geographie, die eine Reihe verschiedener Biome durchquert. Wir sollten sicherstellen, dass die richtigen Ressourcen, Fachkenntnisse und Werkzeuge in die Gebiete geschickt werden, in denen sie am besten eingesetzt werden können."
CONGO_expanded_rubber_plantations:	"Ausgedehnte Kautschuk-Plantagen"
CONGO_expanded_rubber_plantations_desc:	"Die Nachfrage nach Kautschuk ist so groß geworden, dass es inzwischen finanziell machbar ist, die Plantagen erheblich auszuweiten. Wir können spezialisierte Farmen errichten und moderne Ausrüstung importieren, um die Produktion wirklich in Gang zu bringen."
CONGO_separate_corporations_from_politics:	"Trennen Sie Konzerne von der Politik"
CONGO_separate_corporations_from_politics_desc:	"Schon seit dem Freistaat Kongo steht der Kongo in der Verfügungsgewalt von Großkonzernen. Infolgedessen haben die Interessen der Konzerne die politische Ebene infiltriert. Wir müssen Maßnahmen ergreifen, um diese Konzerne von der Macht zu entbinden."
CONGO_belgian_officer_corps:	"Belgisches Offizierskorps"
CONGO_belgian_officer_corps_desc:	"Gegenwärtig wird die Force Publique von einem belgischen Offizierskader geführt, aber da die Truppe größer geworden ist, ist das Offizierskorps nicht entsprechend gewachsen. Wir sollten zusätzliches [BEL.GetAdjective] Personal anfordern, um sicherzustellen, dass all diese neuen Rekruten richtig geführt werden."
CONGO_appoint_van_overstraeten:	"Ernennen Sie van Overstraeten"
CONGO_appoint_van_overstraeten_desc:	"Raoul van Overstraeten ist wahrscheinlich einer der fähigsten Männer in der [BEL.GetAdjective] Armee - das Problem ist, dass er es selbst weiß. Seine Persönlichkeit hat ihn in seinem Heimatland unbeliebt gemacht, aber er hat während des Großen Krieges im Kongo gedient. Wir können diese Nostalgie nutzen, um diesen äußerst talentierten Offizier zurückzuholen."
CONGO_fuel_for_belgium:	"Treibstoff für Belgien"
CONGO_fuel_for_belgium_desc:	"Unsere Bemühungen, den Rohstoffabbau im Kongo auszuweiten, waren so erfolgreich, dass [BEL.GetAdjective] Unternehmen diese billigen Materialien schamlos als Treibstoff für ihre eigenen Fabriken in Belgien verwenden... und dabei einen beträchtlichen Gewinn erzielen."
CONGO_antwerp_diamond_district:	"Antwerpener Diamantenviertel"
CONGO_antwerp_diamond_district_desc:	"Ein willkommenes Nebenprodukt der Tatsache, dass Antwerpen einer der führenden Diamantenproduzenten ist, hat dazu geführt, dass die Stadt zum Hauptumschlagplatz für den Vertrieb und Verkauf dieses Minerals geworden ist, was uns wiederum eine sehr greifbare Einnahmequelle verschafft."
CONGO_shinkolobwe_mine:	"Shinkolobwe-Mine"
CONGO_shinkolobwe_mine_desc:	"Die Shinkolobwe-Mine ist eine der sehr, sehr wenigen bekannten Quellen von hochgradigem Uran auf der Welt. Leider wurden die unteren Ebenen der Mine stark überflutet, was zur Schließung der Mine führte. Es bedarf erheblicher Investitionen und Anstrengungen, um sie wieder zu öffnen und die Produktion wieder aufzunehmen."
CONGO_chefs_coutumiers:	"Chefs Coutumiers"
CONGO_chefs_coutumiers_desc:	"Die Chefs Coutumiers sind eine Klasse von Stammeshäuptlingen, die von der [BEL.GetAdjective]-Verwaltung mit der Überwachung der lokalen Verwaltung betraut sind. Da in letzter Zeit verstärkt in die Region investiert wird, müssen wir sicherstellen, dass unsere Verbündeten aus den Stämmen einen angemessenen Anreiz erhalten und bei der Ausübung dieser wichtigen Rolle unterstützt werden."
COG_evolue_in_politics:	"Die §YÉvolué§! sind in die §Y[COG.GetAdjective]§! Politik eingetreten"
CONGO_chefs_coutumiers_tt:	"Eine §YÉvolué§! Mittelklasse wird sich zu bilden beginnen."
CONGO_humanitarian_aid:	"Humanitäre Hilfe"
CONGO_humanitarian_aid_desc:	"Im Kongo gibt es viele Gebiete, in denen Armut und Hunger herrschen. Wir haben eine Reihe von Kontakten zu humanitären Organisationen und sollten ihnen daher Zugang gewähren, um einen Teil des Leids zu lindern."
CONGO_purchasing_commission:	"Einkaufskommission"
CONGO_purchasing_commission_desc:	"Da der Kongo zunehmend auf moderne Ausrüstung und Hardware angewiesen ist, ist es klar geworden, dass wir eine Abteilung einrichten müssen, die sich um den Import solcher Güter kümmert."
CONGO_expand_force_publique_recruitment:	"Erweiterung der Force Publique Rekrutierung"
CONGO_expand_force_publique_recruitment_desc:	"Die Anforderungen an die Force Publique werden immer größer, und damit auch der Bedarf an neuen Rekruten. Wir sollten mehr Anreize schaffen, um neue Rekruten aus der lokalen Bevölkerung zu gewinnen."
CONGO_jungle_fighting:	"Dschungelkämpfe"
CONGO_jungle_fighting_desc:	"Große Teile des Kongo sind von einem scheinbar undurchdringlichen Dschungel bedeckt, und doch leben und gedeihen sie dort. Wir sollten solche Menschen als Führer und Ausbilder rekrutieren, um unsere Streitkräfte besser für den Einsatz in solchem Terrain zu rüsten."
CONGO_jungle_figthing_random_generals_tt:	"§Zwei§! zufällig ausgewählte Armeeführer erhalten §YDschungelratte§!"
CONGO_requisition_funds:	"Anforderungsfonds"
CONGO_requisition_funds_desc:	"Auch wenn es nicht unbedingt der beliebteste Schachzug ist, gibt es im Kongo immer noch ungenutzte Reichtümer für diejenigen, die wissen, wie man sie abbaut. "
CONGO_gold_and_diamonds:	"Gold und Diamanten"
CONGO_gold_and_diamonds_desc:	"Wir sind in der recht glücklichen Lage, einen großen Vorrat an Gold und Diamanten zu kontrollieren. Wir sollten diese Ressourcen nutzen, um Vorräte, Fachwissen und Werkzeuge dort zu kaufen, wo sie am dringendsten benötigt werden."
CONGO_uranium_development_trust:	"Uranium Development Trust"
CONGO_uranium_development_trust_desc:	"Da Uran für eine Reihe von Interessenten immer wichtiger wird, sollten wir mit unseren internationalen Partnern zusammenarbeiten und die Gründung des Uranium Development Trust unterstützen. Dies wird ein Gremium sein, das mit der ordnungsgemäßen Ausbeutung und Zuteilung dieser Ressource beauftragt wird."
CONGO_smuggle_uranium:	"Uran schmuggeln"
CONGO_smuggle_uranium_desc:	"Wir haben etwas Wertvolles, das viele Menschen wirklich haben wollen, aber wir können es nicht immer frei anbieten. Wir sollten uns an einige Hinterzimmerkontakte wenden und sehen, welche Geschäfte im Verborgenen gemacht werden können."
CONGO_develop_infrastructure:	"Infrastruktur entwickeln"
CONGO_develop_infrastructure_desc:	"Wir müssen uns seit langem mit der Realität auseinandersetzen, dass der Kongo einfach zu groß und zu undurchdringlich ist, um gute Infrastrukturverbindungen zu ermöglichen. Das heißt aber nicht, dass wir es nicht versuchen sollten."
CONGO_new_vegetable_produce_markets:	"Neue Gemüsemärkte"
CONGO_new_vegetable_produce_markets_desc:	"Obwohl der Schwerpunkt der kongolesischen Wirtschaft auf dem Abbau von Bodenschätzen und Cash Crops liegt, haben wir immer noch einen starken und gesunden Agrarsektor. Da die weltweite Nahrungsmittelknappheit immer ernster wird, war die Nachfrage nach einfachen Lebensmitteln noch nie so groß. "
CONGO_congolese_generals:	"Kongolesische Generäle"
CONGO_congolese_generals_desc:	"Die Force Publique ist so stark gewachsen, dass wir uns nicht auf koloniale Importe verlassen können, um sie richtig zu führen. Afrikaner sind mehr als fähig, dies selbst zu tun. Deshalb sollten wir die ausgrenzende Politik, die sie einschränkt, abschaffen und besonders talentierte Einheimische in das Offizierskorps aufnehmen."
CONGO_even_a_hospital_can_do_better:	"Auch ein Krankenhaus kann es besser"
CONGO_even_a_hospital_can_do_better_desc:	"Eine Reihe kleinerer kongolesischer Einheiten hat an verschiedenen Schauplätzen in der ganzen Welt Dienst getan. Vor allem die Anstrengungen des medizinischen Korps sind zu einer Art Legende geworden, selbst an der Front angesichts der überwältigenden Übermacht, und zwar in einem solchen Ausmaß, dass ein lokaler Kommandeur seine Truppen schimpfen hörte, dass sogar ein Krankenhaus es besser machen kann!"
CONGO_expand_metallurgical_industry:	"Metallurgische Industrie ausbauen"
CONGO_expand_metallurgical_industry_desc:	"Belgien ist seit langem für seine hervorragende metallurgische Industrie bekannt, die jedoch nicht immer über die nötigen Rohstoffe verfügte, um richtig zu florieren. Mit den importierten Rohstoffen aus dem Kongo verfügen sie nun über die Mittel, um zu florieren."
CONGO_smuggle_diamonds:	"Diamanten schmuggeln"
CONGO_smuggle_diamonds_desc:	"Diamanten sind eine wertvolle, praktisch nicht zurückverfolgbare Währung und als solche in bestimmten Kreisen äußerst begehrt. Wir sollten einige unserer eigenen Diamanten in diese Untergrundbewegung einbringen und die Früchte dafür ernten."
CONGO_smuggle_diamonds_tt:	"Schaltet Entscheidungen frei, die unsere §YAutonomie§! im Austausch für §YPolitische Macht§! verringern."
CONGO_office_des_transports_coloniaux:	"Office des Transports Coloniaux"
CONGO_office_des_transports_coloniaux_desc:	"Die Abteilung, die für den Transport und die Logistik der Kolonien zuständig ist, ist seit langem überlastet und steckt zwischen den riesigen Entfernungen und dem furchtbaren Terrain fest, mit dem sie zurechtkommen muss. Lassen Sie uns die dringend benötigten Mittel dorthin umleiten und den Kongo zu einem besser vernetzten Ort machen."
CONGO_improved_employment_contracts:	"Bessere Arbeitsverträge"
CONGO_improved_employment_contracts_desc:	"Die Nachfrage nach Rohstoffen hat ein solches Ausmaß erreicht, dass wir den Arbeitsmarkt nicht mehr so manipulieren können, wie wir es früher getan haben. Die Bergleute selbst sind zu einer wertvollen Ware geworden, und das wissen sie auch. Um ihre anhaltende Produktivität zu sichern, müssen wir ihnen bessere Beschäftigungsaussichten bieten."
CONGO_compagnie_belge_maritime_du_congo:	"Compagnie Belge Maritime du Congo"
CONGO_compagnie_belge_maritime_du_congo_desc:	"Die Compagnie Belge Maritime du Congo ist das Unternehmen, das für den Materialtransport zwischen dem Kongo und [BEL.GetNameDef] verantwortlich ist. Wir sollten ihnen Subventionen anbieten, um sicherzustellen, dass die Arterien, über die unser lebenswichtiger Handel läuft, offen bleiben."
CONGO_heat_resistant_cobalt:	"Hitzebeständiges Kobalt"
CONGO_heat_resistant_cobalt_desc:	"Im Kongo wird seit langem Kobalt abgebaut. Das hier gefundene Material ist jedoch von besonders hoher Qualität und hitzebeständig, was für die Entwicklung der neuen Düsentriebwerke unerlässlich ist."
CONGO_copper_cartridges:	"Kupfer-Patronen"
CONGO_copper_cartridges_desc:	"Patronenhülsen. Kein moderner Krieg kann ohne sie geführt werden, und zufälligerweise ist Kupfer das beste Material, um sie herzustellen. Kupfer ist korrosionsbeständig und weich genug, um biegsam zu sein. Was für ein Glück, dass wir auf einem wahren Berg von diesem Material sitzen!"
CONGO_research_grants:	"Forschungsgelder"
CONGO_research_grants_desc:	"Der Kongo ist nicht nur reich an Ressourcen, sondern auch an Intelligenz. Diese wertvollste Ressource ist noch nicht richtig erschlossen worden. Wir sollten Forschungsstipendien anbieten, um die Entwicklung der geistigen Industrie zu fördern."
CONGO_congos_place_in_the_world:	"Der Platz des Kongo in der Welt"
CONGO_congos_place_in_the_world_desc:	"Der bisherige Weg war voller Irrungen und Wirrungen, aber es ist an der Zeit, dass der Kongo seinen Platz in der Welt einnimmt. Wie viel Einfluss wird die Vergangenheit auf unsere Zukunft haben? Jetzt ist es an der Zeit zu entscheiden."
CONGO_legacy_of_lake_tanganyika:	"Das Vermächtnis des Tanganjikasees"
CONGO_legacy_of_lake_tanganyika_desc:	"Eine der erstaunlichsten Heldentaten der Force Publique ereignete sich während des Ersten Weltkriegs, als eine Reihe von Schiffen zerlegt, durch den Dschungel getragen und auf dem See im Herzen Afrikas neu stationiert wurde, um die dort stationierten deutschen Schiffe zu besiegen."
CONGO_soviet_interest:	"Sowjetisches Interesse"
CONGO_soviet_interest_desc:	"Es gibt eine Reihe von konkurrierenden Großmächten, die alle nach Einfluss im Kongo streben, keine mehr als die [SOV.GetNameDef]. Wir sollten uns zumindest anhören, was sie zu bieten haben!"
CONGO_whispers_of_independence:	"Geflüster von Unabhängigkeit"
CONGO_whispers_of_independence_desc:	"Wir haben sie nun schon seit einiger Zeit gehört. Das kursierende Gemurmel der Unzufriedenen. Der Hauch von Rebellion liegt in der Luft. Ein leises Summen der Begeisterung für eine andere Zukunft. Wir sollten also hellhörig werden und sehen, wohin uns diese Unterströmung der Unzufriedenheit führt."
CONGO_congo_free_state:	"Freistaat Kongo"
CONGO_congo_free_state_desc:	"Die Kolonialverwaltung hat jeden Traum von Freiheit so effektiv vereitelt, dass die Zukunft des Kongo so gut wie feststeht - eine Zukunft, die einmal mehr unter der Fuchtel der absoluten Herrschaft aus Brüssel erstickt wird."
CONGO_overseas_department_of_belgium:	"Das belgische Überseedepartement"
CONGO_overseas_department_of_belgium_desc:	"Das Experiment der Musterkolonie hat sich besser entwickelt, als man es sich erhoffen konnte. Der Kongo hat sich zu einem Musterbeispiel an Effizienz und Fortschritt entwickelt, so dass er eine offiziellere Bezeichnung verdient hat."
CONGO_dominion_of_congo:	"Dominion von Kongo"
CONGO_dominion_of_congo_desc:	"Unsere Position als Modellkolonie hat sich gut bewährt, und die Nation ist durch die gemeinsamen Härten zwischen Kongo und [BEL.GetName] gereift. Damit ist ein gewisses Maß an Gleichberechtigung erreicht worden."
CONGO_republic_of_congo:	"Republik Kongo"
CONGO_republic_of_congo_desc:	"Die berauschende Luft der Freiheit ist in der ganzen neuen Republik zu spüren. Ob die Zukunft neben der belgischen oder in Opposition zum ehemaligen Kolonialherrn liegt, ist nur eines sicher. Die Entscheidung über diese Zukunft liegt allein bei der Republik Kongo."
CONGO_african_union:	"Afrikanische Union"
CONGO_african_union_desc:	"Die Ideen des Panafrikanismus haben sich auf dem gesamten Kontinent verbreitet, und viele freie afrikanische Völker wollen sich für eine gemeinsame Sache einsetzen. Wir sollten dies unterstützen und eine Organisation gründen, die alle unsere Nationen näher zusammenbringen kann."
CONGO_great_war_of_africa:	"Großer Krieg in Afrika"
CONGO_great_war_of_africa_desc:	"Es ist an der Zeit, dass sich alle Völker des großen Kongobeckens unter einem Banner vereinigen. Wir müssen die willkürlichen Grenzen, die von den europäischen Mächten gezogen wurden, aufheben und uns das nehmen, was uns gehört."
CONGO_aviation_militaire_de_la_force_publique:	"Aviation Militaire de la Force Publique"
CONGO_aviation_militaire_de_la_force_publique_desc:	"Es ist kein Geheimnis, dass die schiere Größe des Kongo die militärische und polizeiliche Kontrolle des Gebiets zu einer großen Herausforderung macht. Es gibt jedoch ein Transportmittel, mit dem die Entfernungen mit Leichtigkeit überwunden werden können: Flugzeuge. Es wäre ratsam, in dieses Mittel zu investieren und sicherzustellen, dass wir die Kontrolle über den Luftraum behalten."
CONGO_expand_matadi_seaport:	"Erweitern Sie den Seehafen von Matadi"
CONGO_expand_matadi_seaport_desc:	"Matadi ist der wichtigste Seehafen für Leopoldville und dient als Tor zum Inneren des Kontinents über die vielen Flüsse. Wir sollten die maritimen Einrichtungen an diesem Standort entsprechend seiner wachsenden Bedeutung ausbauen."
CONGO_expand_ndolo_and_elisabethville_airports:	"Die Flughäfen N'Dolo und Elisabethville ausbauen"
CONGO_expand_ndolo_and_elisabethville_airports_desc:	"Einer der Vorteile des Kongo als Herzstück Afrikas ist, dass er das Potenzial hat, zu einem wichtigen Luftverkehrsknotenpunkt für diejenigen zu werden, die die afrikanischen Weiten durchqueren wollen."
CONGO_establish_cometro:	"Cométro einrichten"
CONGO_establish_cometro_desc:	"Die Force Publique hat eine wichtige Rolle bei der Sicherung der [BEL.GetAdjective] Interessen im Kongo gespielt. Allerdings handelt es sich dabei nicht um eine professionelle militärische Einrichtung, die den strengen Standards der europäischen Streitkräfte entspricht. Es ist an der Zeit, dass eine echte Armee ins Spiel kommt."
COG_congolese_bussinessowners:	"Kongolesische Geschäftsleute"
COG_congolese_bussinessowners_desc:	"Damit sich unsere Gesellschaft von der jahrelangen institutionalisierten Unterdrückung erholen und Fortschritte auf dem Weg zu einer gerechteren Gesellschaft machen kann, müssen wir die kongolesischen Bürger dazu ermutigen, eigene Unternehmen zu gründen, in der Hoffnung, dass sie sich auf dem Markt durchsetzen können."
COG_desgregate_the_universites:	"Die Entmischung der Universitäten aufheben"
COG_desgregate_the_universites_desc:	"Es gibt viele kluge Köpfe in unserem Land, die durch die Politik der Universitäten, die es bestimmten Menschen nicht erlaubt, über einen bestimmten Bildungsgrad hinauszukommen, unterdrückt und mit Füßen getreten werden. Wir müssen dem sofort ein Ende setzen, denn es gibt viele, die unserem Land helfen wollen, es aber nicht können."
COG_shatter_the_roof:	"Zerschmettern Sie das Dach"
COG_shatter_the_roof_desc:	"Es ist an der Zeit, das unsichtbare Dach über den Köpfen so vieler Menschen zu zerschlagen und ihnen endlich die Freiheit zu geben, selbst zu entscheiden, wie sie ihr Leben gestalten wollen!"
COG_establish_the_anc:	"Die Armée Nationale Congolaise gründen"
COG_establish_the_anc_desc:	"Wir haben viele Forderungen gestellt, aber erst jetzt sind sie endlich erfüllt worden. Heute ist der Tag, an dem wir eine richtige kongolesische Armee gründen können, eine Armee, die sich gegen alle zukünftigen Feinde behaupten kann."
COG_marine_nationale:	"Marine Nationale"
COG_marine_nationale_desc:	"Auch wenn wir bisher nicht viel investiert haben, ist eine Marinestreitkraft für die meisten modernen Nationen eine Notwendigkeit. Die Frage ist nur, ob wir sie mit dem Ziel aufbauen wollen, sie in den Atlantischen Ozean zu schicken, oder ob wir sie so strukturieren wollen, dass sie besser auf den vielen Flüssen im Kongobecken operieren kann."
COG_expand_shipping_industry:	"Ausbau der Schifffahrtsindustrie"
COG_expand_shipping_industry_desc:	"Viele Orte in unserem Land sind nur schwer zu erreichen, ohne entweder den Luftweg oder die Flüsse zu benutzen. Ein weiterer wichtiger Punkt wären Verbindungen zum Ausland über die Meere. Daher müssen wir unsere Schifffahrtsindustrie ausbauen, um den Anforderungen unserer sich modernisierenden Nation gerecht zu werden."
COG_south_atlantic_navy:	"Eine südatlantische Marine"
COG_south_atlantic_navy_desc:	"Wenn wir unsere Unabhängigkeit wirklich sichern wollen, müssen wir dafür sorgen, dass Kolonialmächte nie wieder an unseren Küsten landen können."
COG_brown_water_navy:	"Eine Braune-Wasser-Marine"
COG_brown_water_navy_desc:	"Das Meer ist für uns von geringer Bedeutung. Unsere riesigen Flüsse und Seen müssen jedoch ordnungsgemäß patrouilliert werden, wenn wir die Sicherheit unserer Nation gewährleisten wollen."
COG_coastal_defence_fleet:	"Entwickeln Sie eine Küstenverteidigungsflotte"
COG_coastal_defence_fleet_desc:	"Boma und Matadi müssen angemessen geschützt werden. Dies kann nur durch den Bau leistungsfähiger Schiffe erreicht werden, deren Hauptzweck es ist, in der Nähe unserer Küste zu bleiben."
COG_supply_line_disruption_tactics:	"Taktik der Unterbrechung der Nachschublinien"
COG_supply_line_disruption_tactics_desc:	"Die feindlichen Nachschublinien können mit einem einzigen Präzisionsschlag unterbrochen werden. Dies wird von unseren U-Booten durchgeführt und wird ein entscheidender Bestandteil aller zukünftigen Kriege sein, an denen wir teilnehmen."
COG_command_post_matadi:	"Gefechtsstand Matadi"
COG_command_post_matadi_desc:	"Wir müssen einen Kommandoposten in Matadi einrichten, um unsere westlichen Flüsse besser überwachen zu können."
COG_command_post_albertville:	"Gefechtsstand Albertville"
COG_command_post_albertville_desc:	"Wir müssen einen Gefechtsstand in Albertville einrichten, um unsere südöstlichen Flüsse besser überwachen zu können."
COG_command_post_goma:	"Gefechtsstand Goma"
COG_command_post_goma_desc:	"Wir müssen einen Gefechtsstand in Goma einrichten, um unsere nordöstlichen Flüsse besser patrouillieren zu können."
COG_force_arienne_congolaise:	"Force Aérienne Congolaise"
COG_force_arienne_congolaise_desc:	"Um mit unseren Feinden mithalten zu können, müssen wir unsere Luftwaffen reorganisieren und eine eigene Luftwaffenabteilung in unserem neu gegründeten Militär einrichten."
COG_procure_foriegn_equipment:	"Ausländische Ausrüstung beschaffen"
COG_procure_foriegn_equipment_desc:	"Da wir weder über das technische Know-how noch über die Industrie verfügen, um unsere eigenen Flugzeuge zu entwickeln und zu produzieren, wäre es klug, sich stattdessen auf das Anleihen von Designs und den Kauf von Flugzeugen von unseren Verbündeten zu konzentrieren."
COG_aeronautical_research_department:	"Abteilung für Luft- und Raumfahrtforschung"
COG_aeronautical_research_department_desc:	"Es mag etwas sein, in das wir bisher nicht viel investiert haben, aber wir dürfen nicht vergessen, dass wir uns nicht zu sehr auf ausländische Akteure verlassen können. Wir müssen versuchen, unsere eigenen Flugzeuge zu entwickeln und zu produzieren, ganz gleich, welche Kosten damit verbunden sind."
COG_scouting_the_terrain:	"Das Terrain auskundschaften"
COG_scouting_the_terrain_desc:	"Unsere ausgedehnten Dschungel machen es schwer, unser Terrain zu durchqueren, und darüber hinaus wird es schwierig, den Feind auszumachen, bevor er zu nahe an unsere wichtigen Städte herankommt. Daher wird die Luftwaffe eine große Rolle bei der Luftaufklärung spielen müssen."
COG_expand_production_facilities:	"Produktionsanlagen ausbauen"
COG_expand_production_facilities_desc:	"Wir müssen unsere Produktion von militärischer Ausrüstung erhöhen, und die einzige Möglichkeit, dies zu tun, ist der Bau neuer Anlagen, die dazu in der Lage sind."
COG_forces_terrestres:	"Terrestrische Streitkräfte"
COG_forces_terrestres_desc:	"Der wichtigste Teil einer jeden Armee ist die Landkriegskomponente, und unsere lässt viel zu wünschen übrig. Wir müssen in sie investieren, damit sie sich gegen unsere Feinde behaupten kann."
COG_from_a_gendarmerie_to_a_fighting_force:	"Von einer Gendarmerie zu einer Kampftruppe"
COG_from_a_gendarmerie_to_a_fighting_force_desc:	"Es ist höchste Zeit, dass wir unsere Force Publique-Wurzeln hinter uns lassen und unsere Armee so umstrukturieren, dass sie weniger wie die Gendarmerie aussieht, die sie einmal war, und mehr wie eine richtige Kampftruppe."
COG_academie_militaire_de_kananga:	"Militärakademie von Kananga"
COG_academie_militaire_de_kananga_desc:	"Nicht nur die regulären Soldaten müssen ausgebildet werden, sondern auch die Offiziere und Generäle. Wir müssen in die Académie Militaire de Kananga investieren, damit unsere Armee für die anstehenden Aufgaben besser ausgebildet wird."
COG_standardize_military_production:	"Standardisierung der Militärproduktion"
COG_standardize_military_production_desc:	"Mit unserem derzeitigen Sammelsurium an ausländischer und selbst hergestellter Ausrüstung kann unsere Industrie nicht schnell genug den notwendigen Ersatz produzieren. Wir müssen daher daran arbeiten, die von unseren Streitkräften verwendete Ausrüstung zu standardisieren."
COG_societe_africaine_dexplosifs_congo:	"Société Africaine d'Explosifs Congo"
COG_societe_africaine_dexplosifs_congo_desc:	"Um unsere eigenen Waffen besser zu beschaffen, brauchen wir außerdem ein staatliches Unternehmen, das innerhalb unserer eigenen Grenzen angesiedelt ist und unsere Anforderungen erfüllen kann. Zu diesem Zweck sollten wir die Société Africaine d'Explosifs Congo gründen, damit sie Munition für uns und nur für uns produzieren kann."
COG_triga_i_project:	"TRIGA I Projekt"
COG_triga_i_project_desc:	"Die Zukunft der Energie liegt in der Kernenergie, und deshalb arbeiten unsere Wissenschaftler hart daran, das erste Kernkraftwerk Afrikas zu bauen, TRIGA I. Wenn es fertig ist, sollten wir in der Lage sein, seine Energie für unser Militär umzuwidmen, wenn wir das für notwendig erachten."
COG_military_service_for_citizenship:	"Militärdienst für die Staatsbürgerschaft"
COG_military_service_for_citizenship_desc:	"Es gibt viele in unserem Land, die keine Staatsbürgerschaft oder keinen Pass besitzen. Wir sollten es daher wie einst die Römer machen und sie jedem anbieten, der eine gewisse Zeit lang Teil unserer Streitkräfte war, um so hoffentlich neue potenzielle Rekruten anzulocken."
COG_guerilla_tactics_drills:	"Guerilla-Taktik-Übungen"
COG_guerilla_tactics_drills_desc:	"Unser Terrain eignet sich perfekt für Überfalltaktiken. Daher sollten wir unsere Soldaten darin schulen, diese Techniken zu ihrem Vorteil einzusetzen und sicherzustellen, dass wir jeden Angreifer zurückschlagen können."
COG_french_as_martial_language:	"Französisch als Kriegssprache"
COG_french_as_martial_language_desc:	"Traditionell hat die Force Publique Französisch als Hauptsprache im Militär verwendet. Dieses Konzept hat sich als erfolgreich erwiesen und es gibt keinen Grund, es in nächster Zeit zu ändern."
COG_adopt_lingala_and_swahili_as_martial_languages:	"Lingála und Suaheli als Kriegssprachen"
COG_adopt_lingala_and_swahili_as_martial_languages_desc:	"Obwohl die Force Publique Französisch als Hauptsprache verwendet hat, müssen wir in dem Bemühen, uns von unseren früheren Oberherren zu distanzieren, versuchen, in unseren Armeen einheimische kongolesische Sprachen einzuführen. Die Hauptabteilungen werden Lingála und Suaheli verwenden, da sie im Moment die beiden größten sind."
COG_31e_brigade_parachutiste:	"31e Brigade Parachutiste"
COG_31e_brigade_parachutiste_desc:	"Wir sollten versuchen, eine Fallschirmjäger-Eliteeinheit zu bilden, die in der Lage ist, schnell Siedlungen einzunehmen und Feinde darin zu vernichten, und die auch als Elitewache des Führers unserer Nation fungieren kann, sollte dieser jemals bedroht sein."
COG_peacekeeping_forces:	"Friedenssicherungstruppen"
COG_peacekeeping_forces_desc:	"Auch wenn im Kongo derzeit kein Krieg herrscht, so wütet er doch in vielen Teilen der Welt weiter. Wir müssen für eine bessere Zukunft kämpfen, auch wenn das bedeutet, dass wir Truppen für fremde Mächte in fernen Ländern in den Kampf schicken müssen."
COG_governor_general_pierre_ryckmans:	"Generalgouverneur Pierre Ryckmans"
COG_governor_general_pierre_ryckmans_desc:	"Auch wenn die Minister in [BEL.GetNameDef] viele Pläne für unseren Staat haben, sind sie nicht die einzigen. Auch Pierre Ryckmans hat eine große Vision, und es wäre klug, seine administrativen Kenntnisse zu nutzen, um den Zustand der Nation zu verbessern."
COG_invest_in_urban_centers:	"Investieren Sie in die urbanen Zentren"
COG_invest_in_urban_centers_desc:	"Unser Land ist groß, und unsere Menschen sind zahlreich. Es gibt jedoch nicht genug Geld für alle, und wenn wir irgendwo investieren sollten, würde das Land vernachlässigt werden. Das wird uns jedoch nicht davon abhalten, in unsere beiden größten Städte, Léopoldville und Élisabethville, zu investieren."
COG_uplift_the_apostolic_vicar_of_leopoldville:	"Aufwertung des Apostolischen Vikariats von Léopoldville"
COG_uplift_the_apostolic_vicar_of_leopoldville_desc:	"Das Apostolische Vikariat von Belgisch-Kongo wurde 1888 von Papst Leo XIII. errichtet und ist die wichtigste katholische Einrichtung in unserem Staat. Es wird von seinem Ordinarius, dem Apostolischen Vikar von Léopoldville, geleitet; Joris Six, sollte in der Regierung vertreten sein, wenn wir die Unterstützung der Kirche gewinnen wollen."
COG_promote_marcel_maquet_to_provincial_commisioner:	"Beförderung von Maquet zum Provinzkommissar"
COG_promote_marcel_maquet_to_provincial_commisioner_desc:	"Marcel Maquet hat uns als Junior-Kolonialverwalter und Bezirkskommissar gute Dienste geleistet. Es wäre daher klug, seine Aufgaben auf ein größeres Gebiet auszuweiten, indem er zum Provinzkommissar befördert wird."
COG_cooperate_with_the_comite_special_du_katanga:	"Das Sonderkomitee von Katanga"
COG_cooperate_with_the_comite_special_du_katanga_desc:	"Auguste Tilkens, der frühere Gouverneur von Belgisch-Kongo, leitet heute das Comité Spécial du Katanga, ein 1900 gegründetes halbstaatliches Gremium, das für die Verwaltung und Ausbeutung der Ressourcen der Provinz Katanga zuständig ist. Es wäre klug, diese Organisation in vollem Umfang zu nutzen."
COG_lecho_du_katanga:	"L'Écho du Katanga"
COG_lecho_du_katanga_desc:	"Das Echo von Katanga ist eine Zeitung, die von Élisabethville aus von dem sozialkolonialistischen Gründer Jean Decoster und dem Herausgeber Albert Decoster herausgegeben wird. Gemeinsam werben sie für die europäische Ansiedlung im Kongo, etwas, an das man anknüpfen könnte, um unsere wachsende Nation schneller zu entwickeln."
COG_strengthen_the_banque_du_congo_belge:	"Stärken Sie die Banque du Congo Belge"
COG_strengthen_the_banque_du_congo_belge_desc:	"Kein Land kann ohne eine ordentliche Bank effizient arbeiten, und das ist bei uns nicht anders. Um die monetäre Situation in unserem Land besser in den Griff zu bekommen, sollten wir die belgische Staatsbank Banque du Congo Belge stärken."
COG_contract_the_empain_group:	"Vertrag mit der Empain-Gruppe"
COG_contract_the_empain_group_desc:	"Die Empain-Gruppe wurde 1881 von Édouard Empain gegründet und ist einer der größten Konzerne unserer Zeit. Sie ist unter anderem für Straßenbahnen, Eisenbahnen, Stromerzeugung, Bauwesen und Bergbau zuständig und ist in Belgien, Frankreich, Russland, Ägypten und China tätig. Sie hat bereits eine große Rolle bei der Entwicklung des Ostkongos gespielt. Ihre Dienste werden dringend benötigt!"
COG_invest_in_geomines:	"Investieren Sie in Géomines"
COG_invest_in_geomines_desc:	"Die Compagnie Géologique et Minière des Ingénieurs et Industriels Belges hat eine große Rolle bei der Förderung und Ausbeutung der riesigen Metallerzvorkommen im Südosten unseres Landes gespielt und ist einer der größten Zinnproduzenten der Welt. Sie können unserer Wirtschaft sicherlich langfristig helfen, wenn wir jetzt in sie investieren."
COG_attempt_to_centralize_the_state:	"Versuch der Zentralisierung des Staates"
COG_attempt_to_centralize_the_state_desc:	"Unsere riesige Nation lässt sich unmöglich von einem zentralen Ort aus kontrollieren. Zumindest wenn wir keine besseren Kommunikations- und Transporttechnologien erfinden können. Wir sollten jedoch tun, was wir im Moment können, um den Staat besser um unsere Hauptstadt herum zu zentralisieren."
COG_allow_local_autonomy:	"Erlauben Sie lokale Autonomie"
COG_allow_local_autonomy_desc:	"Da es praktisch unmöglich ist, den Staat wirklich zu zentralisieren, sollten wir uns stattdessen bemühen, den Regionen lokale Autonomie zu gewähren, damit die vielen Menschen in unserem Land uns besser unterstützen, obwohl wir keine so große Kontrolle über sie haben."
COG_closer_cooperation_with_eugene_jungers:	"Engere Zusammenarbeit mit Eugène Jungers"
COG_closer_cooperation_with_eugene_jungers_desc:	"Eugène Jungers ist der derzeitige Gouverneur der Kolonie Ruanda-Urundi. Wenn es uns gelingt, seine Gunst zu gewinnen, können wir vielleicht enger zusammenarbeiten und die in der Kolonie vorhandenen Ressourcen zu unserem Vorteil nutzen."
COG_found_the_congolese_national_movement:	"Die kongolesische Nationalbewegung gründen"
COG_found_the_congolese_national_movement_desc:	"Damit der Kongo trotz der interethnischen und interreligiösen Kämpfe, die er erlebt, zusammenarbeiten kann, müssen wir eine Einheitsfrontorganisation gründen, die sich dafür einsetzt, dass der Kongo das Beste wird, was er sein kann. Zu diesem Zweck hat Patrice Lumumba die Gründung des Mouvement national Congolais vorgeschlagen."
COG_formally_recognize_the_kimbanguist_church:	"Die Kimbanguistische Kirche formell anerkennen"
COG_formally_recognize_the_kimbanguist_church_desc:	"Simon Kimbangu, selbsternannter Sondergesandter von Jesus Christus persönlich, ist unserer Regierung seit vielen Jahren ein Dorn im Auge. Angesichts des großen Rückhalts, den seine Bewegung in der Bevölkerung genießt, ist es vielleicht an der Zeit, die Kirche Jesu Christi auf Erden, die von seinem Sondergesandten Simon Kimbangu gegründet wurde, formell als legitime religiöse Gruppe in unserem Land anzuerkennen."
COG_found_the_parti_solidaire_africain:	"Gründen Sie die Parti Solidaire Africain"
COG_found_the_parti_solidaire_africain_desc:	"Die panafrikanistische Bewegung wird von Tag zu Tag stärker, und als einer der größten Staaten Afrikas dürfen wir nicht hinter diese Entwicklungen zurückfallen. Daher müssen wir die Afrikanische Partei auf Gegenseitigkeit gründen, mit dem Ziel, die Zusammenarbeit zwischen sozialistischen und demokratischen Staaten auf unserem Kontinent zu fördern."
COG_the_intore_lion_dancers:	"Die Intore Lion Dancers"
COG_the_intore_lion_dancers_desc:	"Die Löwentänzer von Intore sind die königliche Elitewache der ruandischen Mwami und werden oft als die Auserwählten innerhalb der traditionellen ruandischen Armee bezeichnet. Es wäre das Beste, wenn diese Streitkräfte unter dem Kommando der Zentralregierung stünden."
COG_improve_colonial_lawmaking:	"Koloniale Gesetzgebung verbessern"
COG_improve_colonial_lawmaking_desc:	"Unsere Gesetze sind zahlreich und die meisten von ihnen sind stark veraltet, da sie noch aus den Zeiten des Freistaats stammen. Es wäre das Beste, den renommierten Kolonialrechtler Robert de Mûelenaere zu beauftragen, viele der veralteten Gesetze in unserem Land neu zu schreiben."
COG_establish_new_sabena_air_routes:	"Neue SABENA Flugrouten einrichten"
COG_establish_new_sabena_air_routes_desc:	"Die Societé Anonyme Belge d'Exploitation de la Navigation Aérienne ist uns schon seit langem nützlich, indem sie den Lufttransport zwischen den großen Bevölkerungszentren unserer riesigen Nation sicherstellt. Vielleicht könnten wir versuchen, neue Flugrouten zu einigen der abgelegeneren Regionen des Landes einzurichten, so dass Transport und Kommunikation viel einfacher zu bewerkstelligen wären."
COG_congo_and_the_war_in_europe:	"Der Kongo und der Krieg in Europa"
COG_congo_and_the_war_in_europe_desc:	"Unser Oberherr wird von einer fremden Macht angegriffen, und der Krieg könnte sich schließlich bis zu unseren Grenzen ausbreiten. Es ist an der Zeit, dass wir uns auf den Kampf vorbereiten und versichern, dass wir uns niemals ergeben werden, auch wenn sie es tun!"
COG_emergency_powers_for_pierre_ryckmans:	"Notfallbefugnisse für den Kolonialgouverneur"
COG_emergency_powers_for_pierre_ryckmans_desc:	"Unsere Verwaltung ist völlig zum Erliegen gekommen, seit die Kommunikation mit der Regierung in Belgien abgebrochen ist. Wir müssen daher Ryckmans und Vleeschauwer Notstandsvollmachten erteilen, damit wir mit mehr Autorität handeln können."
COG_an_independent_colonial_cabinet:	"Ein unabhängiges Kolonialkabinett"
COG_an_independent_colonial_cabinet_desc:	"Um das Land ordnungsgemäß verwalten zu können, müssen wir ein vorläufiges Ministerkabinett und ein eigenes Parlament in Leopoldville einrichten. In der Zwischenzeit wird Vleeschauwer Staatsbesuche bei unseren verschiedenen Verbündeten machen, in der Hoffnung, günstige Handelsabkommen mit ihnen abzuschließen."
COG_acquire_american_investments:	"Akquirieren Sie amerikanische Investitionen"
COG_acquire_american_investments_desc:	"Die Amerikaner haben großes Interesse daran, unser riesiges Land als Drehscheibe für den Transport von Nachschub und Waffen zu nutzen, da wir strategisch günstig im Zentrum Afrikas liegen und gleichzeitig in der Nähe des amerikanischen Kontinents. Wir sollten dies zu unserem Vorteil nutzen und versuchen, amerikanische Investoren anzuziehen."
COG_make_use_of_the_british_proposal:	"Nutzen Sie den britischen Vorschlag"
COG_make_use_of_the_british_proposal_desc:	"Die Briten haben angeboten, dass sie angesichts der Schwäche der belgischen Regierung einen unabhängigen kongolesischen Staat als Teil ihrer Allianz zulassen würden, wenn wir ihnen Rechte an mehreren Minen und Kautschukplantagen einräumen. Es wäre klug, auf dieses Angebot einzugehen!"
COG_prepare_for_offensive_action:	"Bereiten Sie sich auf eine Offensivaktion vor"
COG_prepare_for_offensive_action_desc:	"Die Politiker zu Hause sind unentschlossen, was unsere Rolle in diesem Krieg angeht, aber wir dürfen nicht vergessen, dass wir ihre Rettung sein können und durch heldenhaftes Handeln unsere Unabhängigkeit durch diesen Krieg gewinnen können. Jeder Mann an die Front!"
COG_utilize_sabena_for_military_purposes:	"Nutzen Sie SABENA für militärische Zwecke"
COG_utilize_sabena_for_military_purposes_desc:	"SABENA wurde bisher nur für zivile Transportzwecke genutzt. Da sich der Krieg jedoch unserem Hinterhof nähert, müssen wir sie nutzen, um Piloten zu trainieren und ihre Flugzeuge für den Luftkampf umzurüsten."
COG_raf_and_saaf_cooperation:	"Zusammenarbeit zwischen RAF und SAAF"
COG_raf_and_saaf_cooperation_desc:	"Viele unserer Piloten haben sich der Royal Airforce angeschlossen. Auch wenn es uns schmerzt, weiter mit dem britischen Commonwealth zusammenzuarbeiten, wird es uns sehr helfen, ihr Fachwissen zu lernen und ihre Taktiken auf dem Schlachtfeld zu erleben."
COG_enter_the_sterling_area:	"Betreten Sie das Sterling-Gebiet"
COG_enter_the_sterling_area_desc:	"Die Briten haben verlangt, dass wir im Gegenzug dafür, dass wir unsere Unabhängigkeit von ihnen aufrechterhalten dürfen, während unser Overlord unter fremder Besatzung steht, der Sterling Area beitreten und Subventionen an sie zahlen sowie ihre kolonialen Marktpreise befolgen. Das wird wirtschaftlich nicht gut für uns sein, aber es ist ein Preis, den wir zahlen müssen."
COG_safeguard_cabinda:	"Portugiesisch-Kongo bewahren"
COG_safeguard_cabinda_desc:	"Die Provinz Cabinda war einst Teil des Königreichs Kongo, und da der Krieg auf der ganzen Welt weiter wütet, ist es höchste Zeit, dass wir eingreifen und unsere unschuldigen Brüder vor weiterem Schaden bewahren. Den derzeitigen Besatzern mag dieser Schritt nicht gefallen, aber er ist notwendig, um die Zukunft Afrikas zu schützen."
COG_central_bank_of_congo_ruanda_urundi:	"Zentralbank von Kongo und Ruanda-Urundi"
COG_central_bank_of_congo_ruanda_urundi_desc:	"Es ist höchste Zeit, dass wir eine eigene Bank gründen, die nicht von ausländischen Mächten kontrolliert wird oder in Übersee liegt!"
COG_national_committee_for_liberation:	"Nationales Komitee für die Befreiung"
COG_national_committee_for_liberation_desc:	"Die schwachen Zentristen der kongolesischen Nationalbewegung scheinen sich mit dem Kompromiss einer Unabhängigkeit zu begnügen, die vielleicht nie kommen wird, indem sie teilweise dem Dreißig-Jahres-Plan für die Emanzipation des belgischen Afrikas von Jef Van Bilsen zustimmen. Wir müssen gegen die Kolonialbehörden vorgehen, bevor sie die Chance haben, unsere Flammen zu ersticken!"
COG_alliance_de_bakongo:	"Die Allianz von Bakongo"
COG_alliance_de_bakongo_desc:	"Die Allianz der Bakongo wird von dem großen Denker Joseph Kasa-Vubu angeführt, einem Mann, der mit Sicherheit ein Leitstern für einen unabhängigen Kongo sein wird. Wir sollten dafür sorgen, dass die ABAKO ohne Einmischung der Regierung arbeiten kann."
COG_progressive_congolese_students:	"Fortschrittliche kongolesische Studenten"
COG_progressive_congolese_students_desc:	"Da viele in unserem Land beginnen, der sozialistischen Rhetorik Glauben zu schenken, könnte es sich als klug erweisen, Jugendorganisationen zu gründen, in denen diese Ideen verbreitet und weiterentwickelt werden können. Die Jugend ist die Zukunft, und als solche muss ihr beigebracht werden, was sie braucht, um uns zu führen, wenn ihre Zeit gekommen ist."
COG_manifeste_convience_africaine:	"Le Manifeste de Conscience Africaine"
COG_manifeste_convience_africaine_desc:	"Das kongolesische Nationalbewusstsein nimmt allmählich Gestalt an, und die évolué sind vom Dreißig-Jahres-Plan von Jef Van Bilsen desillusioniert. Es ist an der Zeit, dass sich die kongolesischen Intellektuellen Gehör verschaffen und der Welt zeigen, wohin der Kongo steuert!"
COG_endorse_force_publique_mutinies:	"Befürworten Sie die Meutereien der Force Publique"
COG_endorse_force_publique_mutinies_desc:	"Obwohl die Force Publique ein Werkzeug der Kolonialbehörden ist, gibt es innerhalb der Organisation viele, die die zivilisatorische Mission als das sehen, was sie wirklich ist. Wir sollten sie davon überzeugen, dass eine Meuterei der beste Weg ist und dass wir nur so die volle Unabhängigkeit erlangen können."
COG_encourage_unionism:	"Ermutigen Sie die Unionisten"
COG_encourage_unionism_desc:	"Im Kongo gibt es viele, die nicht annähernd den gleichen Lohn erhalten wie ihre theoretisch Gleichgestellten. Um dieses Problem zu lösen, müssen wir unsere Leute ermutigen, sich gewerkschaftlich zu organisieren, denn nur gemeinsam können wir eine bessere Zukunft erreichen!"
COG_make_contact_with_irving_brown:	"Nehmen Sie Kontakt mit Irving Brown auf"
COG_make_contact_with_irving_brown_desc:	"Der amerikanische Gewerkschafter und Führer der American Federation of Labor, Irving Brown, unterhält seit langem Beziehungen zu Cyrille Adoula. Als Leutnant der US-Armee könnte es sich durchaus lohnen, ihn auf unsere Seite zu ziehen. Wenn wir ihn als Kontaktperson nutzen, könnten wir versuchen, Investitionen von Amerikanern mit Verbindungen zu den Gewerkschaften zu erhalten."
COG_invite_the_general_labour_federation_of_belgium:	"Der Allgemeine Gewerkschaftsbund von Belgien"
COG_invite_the_general_labour_federation_of_belgium_desc:	"Der Allgemeine Gewerkschaftsbund von Belgien wurde als Ersatz für die Gewerkschaftskommission gegründet und versucht, seinen Einfluss über das belgische Festland hinaus auszudehnen. Dank unserer Kontakte konnten wir dafür sorgen, dass sie sich im Kongo verwurzeln und unseren Leuten eine einheitliche Organisation bieten, an der sie sich beteiligen können."
COG_union_nationale_des_travailleurs_du_congo:	"Union Nationale des Travailleurs du Congo"
COG_union_nationale_des_travailleurs_du_congo_desc:	"Wir müssen eine Gewerkschaft im Kongo gründen, die sowohl von unserer Regierung als auch von der Regierung eines anderen Landes unabhängig ist."
COG_approach_the_disfavored_mwami:	"Annäherung an die benachteiligten Mwami"
COG_approach_the_disfavored_mwami_desc:	"Es gibt viele, die sich über die belgischen Besatzer ärgern. Einer von ihnen ist Yuhi V Musinga, der ehemalige Mwami von Ruanda. Wir könnten seine Gunst gewinnen und dafür sorgen, dass er und seine Anhänger sich uns bei unserem Aufstand anschließen, wenn die Zeit reif ist."
COG_the_simba_movement:	"Die Simba-Bewegung"
COG_the_simba_movement_desc:	"Der beste Weg, unsere kolonialen Oberherren zu stürzen, ist, bodenständig zu sein und die Unterstützung der einfachen Bevölkerung zu gewinnen. Zu diesem Zweck organisiert Christophe Gbenye eine Gruppe, die als Simbas bekannt ist und die die Wildheit eines großen Löwen darstellen soll, mit der sie ihre Feinde niederschlagen. Sie wären unsere beste Chance, die Unabhängigkeit zu erlangen!"
COG_attempt_to_sway_moise_thsombe:	"Versuch, Moïse Tshombe zu beeinflussen"
COG_attempt_to_sway_moise_thsombe_desc:	"Die Provinz Katanga scheint von unseren Ideen der Abspaltung nicht sehr angetan zu sein und würde sich wahrscheinlich selbst abspalten, wenn wir unseren Aufstand starten würden. Wir müssen daher die Unterstützung eines ihrer prominentesten Politiker, Moïse Tshombe, gewinnen und ihn von unserer gemeinsamen Sache überzeugen."
COG_secure_soviet_aid:	"Sowjetische Hilfe sichern"
COG_secure_soviet_aid_desc:	"Es gibt viele Mächte, die uns gerne unabhängig sehen würden, oder zumindest unsere belgischen Oberherren geschwächt sehen möchten. Die Sowjetunion könnte unsere beste Chance sein, wenn wir einen Verbündeten gewinnen wollen, auf den wir uns auch nach dem Krieg verlassen können."
COG_secure_german_aid:	"Deutsche Hilfe sichern"
COG_secure_german_aid_desc:	"Es gibt viele Mächte, die uns gerne unabhängig sehen würden oder zumindest unsere belgischen Oberherren geschwächt sehen möchten. Obwohl sie wenig bis gar kein Interesse an unserer Unabhängigkeit haben, wünschen sich die Deutschen nichts sehnlicher, als dass Belgien geschwächt wird. Sie werden also ein starker Verbündeter sein, zumindest während des Krieges."
COG_approach_the_barotse_litunga:	"Annäherung an die Barotse Litunga"
COG_approach_the_barotse_litunga_desc:	"Der Litunga des Barotse-Volkes in unserem Süden, Yeta II, teilt viele unserer Ziele, wenn es um den Antiimperialismus geht. Vielleicht wäre es klug, sein Vertrauen zu gewinnen, damit seine Krieger uns bei der Befreiung helfen?"
COG_slander_the_colonial_authorities:	"Verleumdung der kolonialen Autoritäten"
COG_slander_the_colonial_authorities_desc:	"Was wir jetzt tun müssen, ist eine groß angelegte Propagandakampagne gegen die Kolonialbehörden zu starten und die Öffentlichkeit über alles aufzuklären, was sie uns angetan haben und immer noch antun. Nur so können wir wirklich die Unterstützung des Volkes gewinnen."
COG_strike_while_the_rion_is_hot:	"Schlagen Sie zu, solange das Eisen heiß ist"
COG_strike_while_the_rion_is_hot_desc:	"Die Zeit ist jetzt gekommen. Jetzt oder nie. Wir werden unsere Feinde jetzt mit aller Härte niederschlagen, damit unser Land ein für alle Mal von der kolonialistischen Unterdrückung befreit werden kann!"
COG_the_lion_roars:	"Der Löwe brüllt"
COG_the_lion_roars_desc:	"Die Menschen in Afrika sehnen sich nach der Befreiung von ihren Unterdrückern, so wie wir es einst taten. Die Simba's haben in letzter Zeit massiv an Popularität gewonnen, und zum jetzigen Zeitpunkt kann man nichts tun, um sie daran zu hindern, die nationale Führung zu übernehmen."
COG_proclaim_the_peoples_republic:	"Rufen Sie die Volksrepublik Kongo aus"
COG_proclaim_the_peoples_republic_desc:	"Wenn Sie unser Volk vor Jahren gefragt hätten, ob es geglaubt hätte, dass wir diesen Tag jemals erreichen würden, hätten sie mit Nein geantwortet. Aber wir haben es geschafft. Heute ist der Tag, an dem wir die Gründung unserer lang ersehnten Volksrepublik verkünden können. Es lebe der Vorsitzende und es lebe der Staat!"
COG_the_arme_populaire_de_liberation:	"Armée Populaire de Libération"
COG_the_arme_populaire_de_liberation_desc:	"Der revolutionäre Arm muss alle erreichen und stark genug sein, um unsere Bürger zu schützen. Zu diesem Zweck müssen wir unsere eigene Armée Populaire de Libération gründen, damit unser Volk nie wieder um seine Sicherheit fürchten muss!"
COG_nationalization_of_foreign_industrial_assets:	"Verstaatlichen Sie ausländische Industrieanlagen"
COG_nationalization_of_foreign_industrial_assets_desc:	"Im Laufe unserer Geschichte sind viele ausländische Unternehmen und Konzerne in unser Land gekommen, um unsere Ressourcen und Menschen auszubeuten. Wir müssen diese Industrien verstaatlichen und sie zu unseren eigenen machen."
COG_form_the_gecamines:	"Bilden Sie die Gécamines"
COG_form_the_gecamines_desc:	"Der nächste Schritt besteht darin, die Géomines zu verstaatlichen, indem wir sie in unser neu gegründetes staatliches Unternehmen La Générale des Carrières et des Mines einbringen. Auf diese Weise werden die Ressourcen unseres Landes endlich uns gehören."
COG_societe_nationale_chemins_du_congo:	"Société Nationale des Chemins de fer du Congo"
COG_societe_nationale_chemins_du_congo_desc:	"In Anbetracht der Größe unseres Landes wäre es wichtig, eine nationale Agentur zu gründen, die sich um unsere zahlreichen Eisenbahnen kümmert, von denen ein großer Teil derzeit verfallen ist, damit unser Land besser vernetzt ist als je zuvor."
COG_cooperate_with_the_congolese_churches:	"Mit den kongolesischen Kirchen zusammenarbeiten"
COG_cooperate_with_the_congolese_churches_desc:	"Die Kirchen sind zwar konservativ, aber nicht gegen uns und stellen keine große Bedrohung für unsere Herrschaft dar. Daher wäre es am besten, wenn wir uns stattdessen auf ihre Seite schlagen und sie in unseren Staatsapparat einbinden würden."
COG_strict_anti_clericalism:	"Strikter Anti-Klerikalismus"
COG_strict_anti_clericalism_desc:	"Die Priester der katholischen und kimbanguistischen Kirche sind gierige Männer, die nur an sich selbst denken. Wir müssen uns bemühen, ihren Einfluss aus unserer Gesellschaft zu verbannen, wenn unser Volk jemals gedeihen soll."
COG_invite_kwame_to_the_capital:	"Laden Sie Kwame Nkrumah in die Hauptstadt ein"
COG_invite_kwame_to_the_capital_desc:	"Kwame Nkrumah ist ein einflussreicher und beliebter panafrikanistischer ghanaischer Politiker. Wir sollten ihn in unsere Hauptstadt einladen, um gute Beziehungen zur Bewegung aufzubauen. Vielleicht kann er uns in mehr als einer Hinsicht nützlich sein."
COG_liberation_by_force:	"Befreiung mit Gewalt"
COG_liberation_by_force_desc:	"Die Menschen in Afrika haben nicht die Kraft, sich selbst zu befreien. Wir müssen uns stattdessen bemühen, sie von ihren Unterdrückern zu befreien, damit sie wieder die Freiheit erleben können, wie sie es vor langer Zeit getan haben."
COG_hold_the_pan_african_congress:	"Halten Sie den Panafrikanischen Kongress ab"
COG_hold_the_pan_african_congress_desc:	"Alle einflussreichen afrikanischen Politiker müssen sich versammeln und gemeinsam über die Zukunft des Kontinents entscheiden. Auf der Tagesordnung muss die Rebellion gegen die Kolonialstaaten und die Emanzipation der afrikanischen Völker stehen."
COG_establish_the_west_african_national_secretariat:	"Das Afrikanische Nationale Sekretariat"
COG_establish_the_west_african_national_secretariat_desc:	"Die Zeit ist gekommen, das umzusetzen, was auf dem Panafrikanischen Kongress beschlossen wurde. Wir müssen die Revolutionäre mit Waffen versorgen und den weltweiten antikolonialistischen Kampf unterstützen, damit dieses dunkle Zeitalter ein für alle Mal beendet werden kann!"
COG_socialist_education_reforms:	"Sozialistische Bildungsreformen"
COG_socialist_education_reforms_desc:	"Die Menschen müssen richtig ausgebildet werden, damit sie selbständig denken können, ohne in die Fallen des Tribalismus und der Barbarei zurückzufallen. Wir müssen uns daher bemühen, die Bildungssysteme und Lehrpläne so zu gestalten, dass sie unseren Vorstellungen entsprechen."
COG_foster_a_personality_cult:	"Fördern Sie einen Personenkult"
COG_foster_a_personality_cult_desc:	"Es gibt niemanden außer [ROOT.GetLeader], der den Menschen in Afrika Wohlstand bringen kann. Er ist der große Führer, der das Fundament für unsere Unabhängigkeit bildet, und muss entsprechend behandelt werden."
COG_join_the_comitern:	"Treten Sie der Komintern bei"
COG_join_the_comitern_desc:	"Wir haben in der Sowjetunion ideologische Verbündete, die sich nichts sehnlicher wünschen, als der Ära des Kolonialismus ein Ende zu setzen. Wir sollten daher engere diplomatische Beziehungen zu ihnen aufbauen und vielleicht sogar ein Bündnis anstreben."
COG_african_research_and_development_department:	"Afrikanische FTE-Abteilung"
COG_african_research_and_development_department_desc:	"Um voranzukommen, müssen wir eine gemeinsame afrikanische Forschungs- und Technologieentwicklungseinheit einrichten, die das technische Know-how der vielen afrikanischen Staaten bündeln kann."
COG_organization_of_african_unity:	"Die Organisation für Afrikanische Einheit"
COG_organization_of_african_unity_desc:	"Bisher wurde die Befreiung von der europäischen Kolonialisierung als eine Frage der einfachen Erlangung der Unabhängigkeit angesehen. In den Augen vieler Staatsoberhäupter außerhalb Afrikas scheinen wir jedoch alle noch immer potenzielle Eroberungsziele zu sein. Nur wenn wir zusammenstehen und zusammenarbeiten, können die Menschen in Afrika darauf hoffen, nicht wieder als Untertanen zu enden."
COG_mutual_defense:	"Gegenseitige Verteidigung"
COG_mutual_defense_desc:	"Die Menschen in Afrika werden niemals dauerhaften Frieden haben, solange die Nationen der Welt nicht erkennen, dass die Kosten für den Versuch, uns zu kolonisieren, zu hoch sind. Um dies zu erreichen, sollten die Mitglieder der Organisation für Afrikanische Einheit ein gegenseitiges Verteidigungsabkommen schließen, in dem sie versprechen, sich gegenseitig zu schützen, falls einer von uns angegriffen wird."
COG_central_african_bank:	"Die Zentralafrikanische Bank"
COG_central_african_bank_desc:	"Mit der Gründung einer [ETH_GetCentralBankName] könnten wir den Prozess der Integration der Volkswirtschaften innerhalb der Organisation für Afrikanische Einheit einleiten. Dies würde es uns ermöglichen, unsere Ressourcen und unsere Infrastruktur zum Wohle aller Mitgliedsstaaten effizienter zu nutzen."
COG_the_executive_council:	"Der Exekutivrat"
COG_the_executive_council_desc:	"Wir sollten uns für eine stärkere Zusammenarbeit in der Organisation für Afrikanische Einheit einsetzen, indem wir ein Exekutivorgan schaffen, das den Willen der Menschen umsetzt und schnell auf Bedrohungen der Stabilität in unserer Region reagieren kann."
COG_the_african_union:	"Die Afrikanische Union"
COG_the_african_union_desc:	"Es ist an der Zeit, dass sich die Menschen in Afrika in einer Afrikanischen Union zusammenschließen. Nie wieder werden wir von Imperialisten oder Faschisten bedroht werden, während wir danach streben, Afrikas erste Supermacht zu werden."
COG_kasa_vubus_first_cabinet:	"Das erste Kabinett von Kasa-Vubu"
COG_kasa_vubus_first_cabinet_desc:	"Die ersten freien Wahlen sind abgeschlossen und Joseph Kasa-Vubu hat sie für sich entschieden. Jetzt arbeitet er hart daran, das erste kongolesische Ministerkabinett zusammenzustellen. Da er im ganzen Land sehr beliebt ist und seine Arbeit hervorragend macht, wird er sicher noch vielen Generationen als großer Präsident in Erinnerung bleiben."
COG_national_insitute_of_agronomic_study:	"Nationales Institut für agronomische Studien"
COG_national_insitute_of_agronomic_study_desc:	"Wir müssen eine Organisation gründen, die sich mit der Analyse und Verbesserung unserer landwirtschaftlichen Methoden und Böden befasst. Auf diese Weise können wir unsere Nation wirklich zum Blühen bringen."
COG_the_ten_year_plan:	"Der Zehnjahresplan"
COG_the_ten_year_plan_desc:	"Um unsere Industrie wieder in Gang zu bringen, sollten wir den Zehnjahresplan für die wirtschaftliche und soziale Entwicklung des Kongo auf den Weg bringen."
COG_expanded_peasantry_program:	"Erweiterte Programme für die Bauernschaft"
COG_expanded_peasantry_program_desc:	"Unser Landwirtschaftssektor ist der größte in unserem Land und es muss stark in ihn investiert werden, um ihn zu modernisieren, und genau das werden wir tun."
COG_declaration_of_congolese_unity:	"Erklärung zur kongolesischen Einheit"
COG_declaration_of_congolese_unity_desc:	"Das Volk der Bakongo lebt derzeit durch internationale Grenzen getrennt. Wir müssen uns bemühen, unser Volk so schnell wie möglich zu vereinen und zu diesem Zweck sicherstellen, dass die Bakongo noch Jahrhunderte lang gedeihen können."
COG_improve_the_civil_administration:	"Verbessern Sie die Zivilverwaltung"
COG_improve_the_civil_administration_desc:	"Die Verwaltung in vielen unserer entlegenen Regionen lässt viel zu wünschen übrig. Wir müssen uns bemühen, diese zu verbessern, wenn unser Land jemals so reibungslos und nahtlos funktionieren soll, wie wir es uns wünschen."
COG_mend_the_linguistic_divides:	"Überbrücken Sie die sprachlichen Gräben"
COG_mend_the_linguistic_divides_desc:	"Eine der größten ist die sprachliche Kluft zwischen unseren Hauptsprachen Kikongo, Lingala, Suaheli, Tshiluba und Französisch und Hunderten kleinerer Sprachen, die in unserem Land existieren. Wir müssen vielen von ihnen einen offiziellen Status zuerkennen, wenn wir echte Gleichberechtigung erreichen wollen."
COG_women_in_the_military:	"Erlauben Sie Frauen im Militär"
COG_women_in_the_military_desc:	"Im Moment dürfen die Frauen unseres Landes nicht am Militärdienst teilnehmen, obwohl es viele patriotische Frauen gibt, die dies wünschen. Wir müssen unsere Gesetze so ändern, dass sie dies zulassen, damit möglichst viele fähige Soldaten in unsere Streitkräfte eintreten können."
COG_assemble_a_regency_council:	"Setzen Sie einen Regentschaftsrat ein"
COG_assemble_a_regency_council_desc:	"Eine Lösung für unsere politischen Kämpfe ist nicht in Sicht. Keine Partei und kein Politiker hat genügend Rückhalt in der Bevölkerung, um die nationale Führung zu übernehmen, und so kann es nicht weitergehen. Wir müssen einen Rat zusammenstellen, der versucht, bestimmten Stammesführern und Monarchen eine Führungsrolle anzubieten, um so viel Legitimität wie möglich für unsere neue Regierung zu erhalten."
COG_the_kingdom_of_kongo_focus:	"Das Haus von Água Rosada"
COG_the_kingdom_of_kongo_focus_desc:	"Das Haus Água Rosada war das letzte Herrscherhaus des Königreichs Kongo im 19. und 20. Jahrhundert und war auch eine der Hauptfraktionen während des kongolesischen Bürgerkriegs. Dom Pedro VII., sein derzeitiger Anwärter, ist nun erneut zum König von Kongo gekrönt worden."
COG_the_nyim_of_kuba_focus:	"Die Nyim von Kuba"
COG_the_nyim_of_kuba_focus_desc:	"Das Königreich Kuba besteht seit 1625 und wurde 1884 in ein regionales Häuptlingstum in der Internationalen Vereinigung des Kongo umgewandelt. Ihr Herrscher ist der Nyim, derzeit Mbóp Mábíínc maMbéky, und er wird in der Lage sein, unsere Nation zu ihrem früheren Ruhm zurückzuführen!"
COG_the_ma_loango_focus:	"Die Mâ Loango"
COG_the_ma_loango_focus_desc:	"Der Mâ Loango ist der traditionelle Herrscher des Königreichs Loango. Jetzt, da wir diesen Titel angenommen haben, sollten wir uns um die Wiedereingliederung der alten Territorien bemühen, die das Königreich einst besaß."
COG_the_mwami_of_burundi_focus:	"Der Mwami von Burundi"
COG_the_mwami_of_burundi_focus_desc:	"Mit der Thronbesteigung von Mwambutsa IV Bangiricenge können wir nun den Titel des Königreichs Burundi beanspruchen. Damit können wir unseren Anspruch auf das kleine Königreich im Osten legitimieren, und vielleicht können wir sogar noch weiter gehen."
COG_the_umwami_of_rwanda_focus:	"Die Umwami von Ruanda"
COG_the_umwami_of_rwanda_focus_desc:	"Mit der Thronbesteigung von Mutara III. Rudahigwa können wir nun den Titel des Königreichs Ruanda beanspruchen. Auf diese Weise können wir unseren Anspruch auf das kleine Königreich im Osten legitimieren und vielleicht sogar noch weiter gehen."
COG_the_pro_german_mwami_focus:	"Der pro-deutsche Mwami"
COG_the_pro_german_mwami_focus_desc:	"Der deutsche Kollaborateur Yuhi V Musinga von Ruanda hat nun die Kontrolle über das Land übernommen, nachdem er von unserem Regentschaftsrat gewählt wurde. In einer unerwarteten Wendung der Ereignisse hat er jedoch den Kongo zur Fortsetzung des deutschen Kolonialreichs erklärt und erklärt, er sei der Herrscher des Mittelafrikanischen Königreichs!"
COG_uniao_dos_povos_do_norte_de_angola:	"União dos Povos do Norte de Angola"
COG_uniao_dos_povos_do_norte_de_angola_desc:	"União dos Povos do Norte de Angola ist eine Guerillabewegung, die derzeit im Norden Angolas operiert und das Ziel verfolgt, unsere ehemaligen Territorien wieder in das Königreich Kongo einzugliedern. Es wäre klug, diese Gruppe zu unterstützen."
COG_bundu_dia_kongo:	"Bundu dia Kongo"
COG_bundu_dia_kongo_desc:	"Damit unser Staat wieder zu dem wird, was er einmal war, müssen wir die Fesseln des Christentums ablegen, die uns die Portugiesen vor all den Jahren angelegt haben. Es ist an der Zeit, Bukongo wieder zu umarmen!"
COG_devout_catholic_kingdom:	"Ein frommes katholisches Königreich"
COG_devout_catholic_kingdom_desc:	"Als eines der ersten katholischen Königreiche in Afrika wissen wir um die Bedeutung der Religion und die Legitimität des Papstes. Wenn wir uns von den jahrhundertelangen Unruhen erholen wollen, müssen wir unseren christlichen Idealen treu bleiben."
COG_reestablish_the_royal_council:	"Wiedereinsetzung des Königlichen Rates"
COG_reestablish_the_royal_council_desc:	"Der Königliche Rat des Königreichs Kongo, der oft als die Spitze der Spitze bezeichnet wird, war früher das Führungsgremium der Beamten und Adligen. Wir sollten ihn wieder einführen, denn kein König kann wirklich allein regieren."
COG_bakongo_military_might:	"Bakongo Militärische Macht"
COG_bakongo_military_might_desc:	"Nun, da wir die Lage in unserem Königreich wieder stabilisiert haben, ist es an der Zeit, dass wir alles, was uns gehört, für uns beanspruchen und erobern und Afrika unter unsere Herrschaft bringen!"
COG_royal_university_of_higher_education:	"Königliche Universität für höhere Bildung"
COG_royal_university_of_higher_education_desc:	"Um als Nation voranzukommen, müssen wir unser Volk so ausbilden, dass es in der Lage ist, wissenschaftliche Durchbrüche zu erzielen. Zu diesem Zweck sollten wir eine Universität für höhere Bildung gründen."
COG_invest_in_the_textile_industry:	"Investieren Sie in die Textilindustrie"
COG_invest_in_the_textile_industry_desc:	"Um unsere Nation zum Wohlstand zu führen, müssen wir in die Herstellung traditioneller Kuba-Textilien investieren und sie auf dem internationalen Markt verkaufen."
COG_traditional_masks_and_armor:	"Traditionelle Masken und Rüstungen"
COG_traditional_masks_and_armor_desc:	"Um die Moral unserer Truppen zu stärken, sollten wir sie mit traditionellen Kuba-Rüstungen ausstatten. Außerdem können wir unsere Feinde mit unseren traditionellen Masken einschüchtern."
COG_children_of_woot:	"Die Kinder von Woot"
COG_children_of_woot_desc:	"Woot ist ein übernatürliches Wesen, das den Tieren und anderen Lebewesen ihren Namen gegeben hat und auch der erste Mensch und Bringer der Zivilisation war. Wir sind ihre Kinder und müssen so handeln, dass wir ihren Erwartungen gerecht werden."
COG_spirit_of_loko_yima:	"Der Geist von Loko Yima"
COG_spirit_of_loko_yima_desc:	"[ROOT.GetLeader] trägt den Geist des reinen weißen Loko Yima, des Gottes auf der Erde, der vom Himmelsvater Bumba während der Schöpfung ausgespuckt wurde, in sich. Daher müssen alle dem Willen von [ROOT.GetLeader] folgen."
COG_a_society_of_trade:	"Eine auf Handel aufgebaute Gesellschaft"
COG_a_society_of_trade_desc:	"Unsere Gesellschaft hat sich dank der Handelsrouten, die durch den Kongo führen, lange halten können. Wir müssen dies beibehalten, wenn wir eine stärkere wirtschaftliche Grundlage schaffen wollen."
COG_a_multiethnic_conglomeration:	"Ein multiethnisches Konglomerat"
COG_a_multiethnic_conglomeration_desc:	"Unsere Gesellschaft bestand schon immer aus mehreren ethnischen und sprachlichen Gruppen, und das war auch gut so. Wir sollten dieses Verhalten weiter fördern und das Verhältnis zwischen Eroberern und Eroberten ändern."
COG_reclaim_loango:	"Loango zurückfordern"
COG_reclaim_loango_desc:	"Auch wenn dies derzeit nicht der Fall ist, liegt unsere wahre Hauptstadt Loango in [772.GetName] und muss in eine große Stadt umgewandelt werden, wie sie die Welt noch nie gesehen hat. Der erste Schritt wird jedoch sein, sie zu sichern."
COG_the_kings_divine_power:	"Die göttliche Macht des Königs"
COG_the_kings_divine_power_desc:	"Der König hat das göttliche Recht zu regieren, und es muss ihm erlaubt sein, dies zu tun. Er weiß, was das Beste für seine treuen Untertanen ist, und wird mit eiserner Faust regieren."
COG_appoint_a_royal_council:	"Ernennen Sie einen königlichen Rat"
COG_appoint_a_royal_council_desc:	"Der König mag viel wissen, aber nicht alles. Deshalb braucht er einen königlichen Rat von Beratern, die ihm bei der Herrschaft über das Königreich zur Seite stehen."
COG_occupy_cabinda:	"Besetzen Sie Cabinda"
COG_occupy_cabinda_desc:	"Die Provinz Cabinda liegt zwischen unseren Provinzen Loango und Boma, und da der Krieg auf der ganzen Welt wütet, ist es höchste Zeit, dass wir eingreifen und unsere unschuldigen Brüder vor weiterem Schaden bewahren. Den derzeitigen Besatzern mag dieser Schritt nicht gefallen, aber er ist notwendig, um die Zukunft Afrikas zu schützen."
COG_reestablish_the_bouvandji:	"Stellen Sie die Bouvandji wieder her"
COG_reestablish_the_bouvandji_desc:	"Im 11. Jahrhundert waren die Bouvandji eine Bruderschaft von Schmieden aus dem Volk der Woyo. Sie beherrschten Feuer und Eisen und führten den Staat der Ngoyo zur Vorherrschaft über uns. Mit unserem Triumph in den letzten Jahren könnte es jedoch an der Zeit sein, dass wir uns stattdessen ihrer bedienen."
COG_invest_in_rubber_plantations:	"Investieren Sie in Kautschuk-Plantagen"
COG_invest_in_rubber_plantations_desc:	"Kautschuk ist der Treibstoff unserer Wirtschaft und kann uns helfen, vorteilhafte Handelsabkommen mit ausländischen Mächten abzuschließen. Es ist daher ein Sektor, in den wir stark investieren müssen."
COG_friendship_with_france:	"Freundschaftsvertrag mit [FRA.GetName]"
COG_friendship_with_france_desc:	"[FRA.GetNameDefCap] haben uns zwar kolonisiert, aber sie haben unsere nominelle Unabhängigkeit ermöglicht, und dafür sind wir dankbar. Wir sollten versuchen, vergangenes Unrecht wiedergutzumachen und ein Bündnis mit ihnen einzugehen."
COG_attempt_to_ally_the_portuguese:	"Versuchen Sie, die [POR.GetAdjective] zu verbünden"
COG_attempt_to_ally_the_portuguese_desc:	"Unsere Beziehung zu [POR.GetNameDef] und ihren Entdeckern war ein Hin und Her, aber es ist an der Zeit, die Vergangenheit zu bereinigen und nach vorne zu schauen. Wir sollten daher versuchen, ein Bündnis mit ihnen einzugehen."
COG_reclaim_bujumbura:	"Bujumbura zurückerobern"
COG_reclaim_bujumbura_desc:	"Wir können uns unmöglich als das neue Königreich Burundi bezeichnen, wenn wir unsere alte Hauptstadt nicht kontrollieren. Wir müssen alles in unserer Macht stehende tun, um die Region zurückzuerobern!"
COG_the_embodiment_of_god:	"Die Verkörperung Gottes"
COG_the_embodiment_of_god_desc:	"[ROOT.GetLeader] ist die Verkörperung Gottes selbst und hat das alleinige göttliche Recht, über alle Länder rund um die Großen Seen zu herrschen. Lang lebe seine Majestät!"
COG_claim_the_great_lakes:	"Beanspruchen Sie die Königreiche der Großen Seen"
COG_claim_the_great_lakes_desc:	"Die verschiedenen Königreiche der Großen Seen, zu denen auch wir einst gehörten, sind inzwischen alle von fremden Mächten unterworfen worden. Da wir eines dieser alten Königreiche sind, haben wir einen viel legitimeren Anspruch auf das Gebiet als alle imperialistischen Mächte und müssen es daher so schnell wie möglich für uns beanspruchen."
COG_new_empire_of_kitara:	"Das neue Reich von Kitara"
COG_new_empire_of_kitara_desc:	"Viele Bewohner unserer östlichen Region sprechen von dem großen und alten Reich von Kitara. Indem wir den Mantel dieses mystischen und legendären Staates übernehmen, können wir unsere Ansprüche auf die großen Seenkönigreiche voll und ganz legitimieren."
COG_south_to_lake_malawi:	"Nach Süden zum Malawi-See"
COG_south_to_lake_malawi_desc:	"Ein letzter Vorstoß muss in Richtung eines anderen großen Sees unternommen werden, der für das alte Reich der Kitara nicht auf der Landkarte stand. Dieser See ist der Malawi-See, den wir für uns beanspruchen werden, genau wie alle anderen großen Seen in der Region."
COG_reclaim_kigali:	"Kigali zurückfordern"
COG_reclaim_kigali_desc:	"Wir können uns unmöglich als das neue Königreich Ruanda bezeichnen, wenn wir unsere alte Hauptstadt nicht kontrollieren. Wir müssen alles in unserer Macht stehende tun, um die Region zurückzuerobern!"
COG_centralize_military_structure:	"Militärische Struktur zentralisieren"
COG_centralize_military_structure_desc:	"Um unsere Armeen besser koordinieren zu können, müssen wir eine zentralisierte Militärstruktur aufbauen, so wie wir früher alle unsere Nachbarkönigreiche problemlos erobern konnten."
COG_an_expansionist_state:	"Ein expansionistischer Staat"
COG_an_expansionist_state_desc:	"Jeder Staat muss ständig wachsen, wenn er mit den Anforderungen seiner Bevölkerung Schritt halten will, und das ist bei uns nicht anders. Wir müssen unsere Grenzen schnell ausweiten, um die Menschen zu befriedigen, die ständig nach mehr streben."
COG_great_military_chiefs:	"Große Militärchefs"
COG_great_military_chiefs_desc:	"Was uns früher auszeichnete, waren unsere großartigen militärischen Befehlshaber. Wir sollten ein strenges Trainingsprogramm durchsetzen, damit unsere heutigen Kommandeure denen der Vergangenheit gerecht werden können."
COG_great_cattle_chiefs:	"Große Rinderhäuptlinge"
COG_great_cattle_chiefs_desc:	"Was uns damals auszeichnete, waren unsere großen Häuptlinge, die ein Händchen für Organisation und Verwaltung hatten. Sie konnten unsere Landwirtschaft stärker machen als alle anderen, und das ist etwas, das wir dringend zurückholen müssen."
COG_expand_banana_plantations:	"Bananenplantagen ausbauen"
COG_expand_banana_plantations_desc:	"Bananen sind das Lebenselixier jeder gesunden Wirtschaft. Wir sollten uns bemühen, unsere Bananenproduktion zu verzehnfachen, damit sowohl unsere Bevölkerung als auch unsere Wirtschaft zufrieden sein können."
COG_tutsi_warrior_training:	"Ausbildung von Tutsi-Kriegern"
COG_tutsi_warrior_training_desc:	"Unsere großen Tutsi-Krieger haben uns vor vielen Jahren bei der Eroberung der benachbarten Königreiche geholfen. Wir sollten unsere Wehrpflicht verschärfen, damit nur die fittesten und am besten ausgebildeten Männer in unsere Streitkräfte aufgenommen werden."
COG_unify_east_africa:	"Ostafrika vereinen"
COG_unify_east_africa_desc:	"Jetzt können wir endlich die Träume der ruandischen Könige von einst verwirklichen, indem wir versuchen, Ostafrika zu vereinen. Das ist eine große Leistung und wird uns großen Ruhm einbringen!"
COG_a_german_protectorate:	"Ein deutsches Protektorat"
COG_a_german_protectorate_desc:	"Um unserem neuen Staat Legitimität zu verleihen und ihn vor hungrigen Aasgeiern wie den Briten und Franzosen zu schützen, sollten wir versuchen, ein Protektorat unserer alten Freunde, [GER.GetNameDef], zu werden."
COG_invite_german_kasierist_exiles:	"Deutsche Monarchisten einladen"
COG_invite_german_kasierist_exiles_desc:	"Es scheint, als hätten die Deutschen ihren glorreichen Kaiser aufgegeben und sich mit echter Mittelmäßigkeit zufrieden gegeben. Wir sollten uns bemühen, loyale deutsche Monarchisten in unser Land einzuladen, und versuchen, ein wahres Mittelafrika zu errichten!"
COG_colonial_administration:	"Koloniale Verwaltung"
COG_colonial_administration_desc:	"Wir sollten das, was wir von der deutschen Kolonialverwaltung über unser Land damals gelernt haben, nutzen, um Afrika selbst besser zu verwalten."
COG_prussia_of_africa:	"Das Preußen von Afrika"
COG_prussia_of_africa_desc:	"Wir, Mittelafrika, sind wahre Eroberer, die ganz Afrika unter unsere Herrschaft bringen werden. Unsere Armee ist stark preußisch geprägt, und es ist nicht ungewöhnlich, dass man uns als das Preußen Afrikas bezeichnet."
COG_german_west_africa:	"Deutsch-Westafrika"
COG_german_west_africa_desc:	"Wir müssen in die alten Gebiete Deutsch-Westafrikas vordringen, um sie wieder unter unsere Herrschaft zu bringen!"
COG_german_east_africa:	"Deutsch-Ostafrika"
COG_german_east_africa_desc:	"Wir müssen auf die alten Gebiete von Deutsch-Ostafrika zugehen, damit sie wieder in den Schoß der Gemeinschaft zurückkehren können!"
COG_german_south_west_africa:	"Deutsch-Südwestafrika"
COG_german_south_west_africa_desc:	"Wir müssen auf die alten Gebiete von Deutsch-Südwestafrika zugehen, damit sie wieder in den Schoß der Gemeinschaft zurückgeführt werden können!"
CONGO_bakwanga_mine_tt:	"Entriegelt Entscheidungen zur §YErweiterung der Minen§!"
CONGO_kasai_secessionist_state_tt:	"Sollte es zu einem §YUnabhängigkeitskrieg§! gegen unseren Overlord kommen, würden wir 2 §YInfanterie§! Einheiten mit 5 Bataillonen in §Y[888.GetName]§! gewinnen."
CONGO_kasai_secessionist_state_2_tt:	"Sollte es zu einem kongolesischen §YKrieg für die Unabhängigkeit§! kommen, gewinnen sie 2 §YInfanterie§!-Einheiten mit 5 Bataillonen in §Y[888.GetName]§!"
