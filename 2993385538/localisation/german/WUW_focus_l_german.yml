CONGO_at_least_fourteen_focuses_done_tt:	"Mindestens §Y14§! Schwerpunkte aus §YSociété Générale de Belgique§! und §YThe Heart of Africa§! wurden abgeschlossen"
CONGO_cobalt_mine_tt:	"Schaltet die Entscheidungen zum §YAusbau der Kobaltminen§! frei"
CONGO_requisition_funds_tt:	"Schaltet eine wiederholbare Entscheidung zur Erlangung von §YPolitischer Macht§! im Austausch für mehr §YKongolesische Autonomie§! frei"
CONGO_gold_and_diamonds_tt:	"Schaltet Entscheidungen zur §YNutzung von kongolesischem Gold und Diamanten§! für §YInvestitionen§! und §YAufbau§! frei"
CONGO_establish_cometro_tt:	"Sollte es zu einem §YUnabhängigkeitskrieg§! gegen unseren Overlord kommen, würde sich §Y[KAT.GetNameDef]§! auf die Seite unseres Overlords stellen und er würde 2 §YInfanterie§!-Einheiten mit 5 Bataillonen in §Y[889.GetName]§! erhalten"
CONGO_establish_cometro_2_tt:	"Wenn ein kongolesischer §YUnabhängigkeitskrieg§! stattfindet, würde §Y[KAT.GetNameDef]§! sich auf unsere Seite schlagen und 2 §YInfanterie§! Einheiten mit 5 Bataillonen in §Y[889.GetName]§! gewinnen"
CONGO_overseas_department_of_belgium_tt:	"§Y[COG.GetNameDefCap]§! werden nicht mehr in der Lage sein, §Yihre Autonomiestufe§! zu erhöhen"
CONGO_overseas_department_of_belgium_2_tt:	"Wir werden nicht mehr in der Lage sein, §YUnser Autonomieniveau§! zu erhöhen"
