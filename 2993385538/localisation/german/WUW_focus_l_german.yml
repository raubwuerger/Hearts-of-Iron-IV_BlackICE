l_german:
HABSBURG_is_subject_puppeteer_faction_leader_or_member_trigger_tt:	"Ist entweder §Y[AUS.GetNameDef]§! oder §Y[HUN.GetNameDef]§! und hat einen beliebigen §YAustralisch-Ungarischen Kontingentsstaat§! als Untertan, ist Untertan eines dieser Staaten, ist Fraktionsführer als §Y[AUS.GetNameDef]§! oder §Y[HUN.GetNameDef]§!, oder ist mit ihnen in einer Fraktion als beliebiger §YAustralisch-Ungarischer Kontingentsstaat§!."
HABSBURG_is_originator_country:	"§Y[ROOT.GetName]§! ist der §YUrsprungsstaat§!"
HABSBURG_part_of_something_bigger:	"Unteilbar und untrennbar"
HABSBURG_part_of_something_bigger_desc:	"Alle Menschen wissen, dass sie ihr eigenes Zuhause verteidigen müssen, aber unsere neu gegründete Föderation wird mit Sicherheit untergehen, wenn sie nicht auch die Bedeutung der grenzüberschreitenden Zusammenarbeit und der Hilfe beim Schutz dessen, was dem Nachbarn lieb und teuer ist, erkennen."
HABSBURG_economic_cooperation_policy:	"Politik der wirtschaftlichen Zusammenarbeit"
HABSBURG_economic_cooperation_policy_desc:	"Derzeit regeln unsere Föderationsmitglieder ihre Wirtschaft vollständig selbst. Das lässt zwar jedem so viel Freiheit wie möglich, behindert aber auch die Wirtschaftskraft der Föderation. Durch die Einführung einer Politik der Zusammenarbeit können wir sicherstellen, dass die Mitglieder bei größeren wirtschaftlichen Problemen gemeinsam handeln."
HABSBURG_joint_consumer_goods_endeavors:	"Die Danubische Zentralbank"
HABSBURG_joint_consumer_goods_endeavors_desc:	"Die wirtschaftlichen Möglichkeiten der einzelnen Staaten innerhalb der Föderation sind sehr unterschiedlich. Auch unsere Zentralbanken haben eine sehr unterschiedliche Wirtschaftskraft. Zwar sollte jedes Land seine eigene Zentralbank behalten dürfen, doch die Gründung einer Zentralbank für die Föderation wird sicherstellen, dass wir eine Instanz haben, die sich in erster Linie um den übergreifenden wirtschaftlichen Status der Föderation kümmert."
HABSBURG_technology_sharing:	"Wissenschaftliche Zusammenarbeit"
HABSBURG_technology_sharing_desc:	"In unserer Föderation gibt es viele kluge Köpfe. Wir müssen sie zusammenbringen, um die Entwicklung unserer Region zu fördern und unsere Föderation in die Zukunft zu führen, die sie verdient."
HABSBURG_increase_scientific_cooperation:	"Gemeinsame Forschungseinrichtungen einrichten"
HABSBURG_increase_scientific_cooperation_desc:	"Es ist an der Zeit, gemeinsam neue Labore und geheime Forschungseinrichtungen zu finanzieren, in denen unsere Wissenschaftler enger zusammenarbeiten können, um das Tempo ihrer Forschung zu erhöhen und uns zu neuen Horizonten zu führen."
HABSBURG_simplify_economic_lawmaking:	"Vereinfachen Sie die wirtschaftliche Gesetzgebung"
HABSBURG_simplify_economic_lawmaking_desc:	"Unsere Mitglieder verfügen derzeit über sehr unterschiedliche Gesetze in Bezug auf Handel und Wirtschaft. Es besteht zwar keine Notwendigkeit, zentral zu kontrollieren, dass die Gesetze in allen Mitgliedsländern gleich sind, aber der Prozess der dynamischen Änderung von Gesetzen aufgrund der jeweiligen Erfordernisse könnte von einer Vereinfachung profitieren."
HABSBURG_securing_the_consumer_rights:	"Wohlstand für die Menschen"
HABSBURG_securing_the_consumer_rights_desc:	"Auch wenn es überall Befürworter des Krieges gibt, müssen wir uns daran erinnern, wer diese Föderation möglich macht. Es sind die Menschen, und als solche müssen wir dafür sorgen, dass sie immer mit ihrer Situation zufrieden sind."
HABSBURG_discounted_licenses:	"Schließen Sie vorteilhafte Waffenverträge ab"
HABSBURG_discounted_licenses_desc:	"Wir verfügen vielleicht nicht über die modernsten Waffen, aber das ist kein Problem, denn unsere Politiker unterhalten Kontakte zu Leuten, die uns helfen können, besseren Zugang zu ausländischer Technologie für die Produktion in unseren eigenen Einrichtungen zu erhalten. Indem wir dieses weitreichende Netzwerk nutzen, werden wir Produktionsrechte für die besten Ausrüstungen erhalten und durch die Nutzung unserer riesigen Industrie werden wir Zugang zu überlegener Ausrüstung für unsere Truppen haben."
HABSBURG_reform_gemeinsame_armee:	"Die Reformierung der gemeinsamen Armee"
HABSBURG_reform_gemeinsame_armee_desc:	"In der Vergangenheit unterhielt Österreich-Ungarn eine große Gemeinsame Armee, zu der alle Länder für unsere gemeinsame Sache beitrugen. Ungeachtet unserer derzeitigen ideologischen Unterschiede und Gemeinsamkeiten würde uns ein gemeinsames militärisches Vorhaben nur stärker machen."
HABSBURG_motorizing_the_armies:	"Motorisierung der Armeen"
HABSBURG_motorizing_the_armies_desc:	"Im modernen Krieg geht es vielleicht immer noch um Infanterieoffensiven, aber selbst wenn das der Fall ist, sollten wir dafür sorgen, dass die Infanterie so schnell und effizient wie möglich von einem Punkt der Föderation zum anderen gelangen kann. Indem wir eine Motorisierung einleiten, um mehr unserer Truppen per LKW zu transportieren, werden wir sicherstellen, dass unsere Truppen immer rechtzeitig dort sind, wo sie gebraucht werden."
HABSBURG_mechanized_initiative:	"Mechanisierte Initiativen"
HABSBURG_mechanized_initiative_desc:	"Es gibt Wissenschaftler, die über die Möglichkeit von Halbkettenfahrzeugen diskutieren, die Truppen transportieren und stärker gepanzert werden können. Diese Option wäre wahrscheinlich billiger als ein Panzer, aber robuster als ein Lastwagen und in der Lage, auch schwierigeres Gelände zu bewältigen. Vielleicht sollten wir eine Finanzierung für dieses Projekt anbieten."
HABSBURG_armor_initiative:	"Initiativen zur Panzerung"
HABSBURG_armor_initiative_desc:	"Die Zukunft der Kriegsführung wird durch gepanzerte Fahrzeuge entschieden werden, so wie das Ende des Großen Krieges, den unser Vorgänger verloren hat. Wir müssen diese Fehler wiedergutmachen und uns darauf konzentrieren, damit wir nicht noch einmal untergehen."
HABSBURG_effectivizing_the_motorized_troops:	"Effektiver Treibstoffverbrauch"
HABSBURG_effectivizing_the_motorized_troops_desc:	"Unser Treibstoffverbrauch ist in die Höhe geschnellt, seit wir mehr motorisierte, mechanisierte und gepanzerte Einheiten in unsere Armee integriert haben. Der Treibstoff selbst ist zu einem bedenklichen Engpass geworden, der unsere militärischen Fähigkeiten einschränkt. Wir sollten uns um eine bessere Nutzung des Treibstoffs bemühen, denn das wird uns sowohl militärisch als auch wirtschaftlich zugute kommen."
HABSBURG_the_strength_of_the_common_man:	"Die Stärken des einfachen Mannes"
HABSBURG_the_strength_of_the_common_man_desc:	"Selbst die größte Organisation stützt sich auf die kleinsten Teile. Für uns und insbesondere für unsere Armeen bedeutet dies, dass wir auf den einfachen Mann, unsere Soldaten, angewiesen sind. Wir müssen sicherstellen, dass jeder Soldat innerhalb unserer militärischen Organisation sowohl die Last versteht, die auf seinen Schultern liegt, als auch, dass er die Kraft hat, sie zu tragen, und dass dies seine Pflicht ist."
HABSBURG_joint_training_initiative:	"Das kaiserliche und königliche Kriegsministerium"
HABSBURG_joint_training_initiative_desc:	"Die Gemeinsame Armee wurde damals von einem bestimmten Ministerium regiert. Rückblickend betrachtet wurde das Ministerium schlecht verwaltet und war vom Geschehen auf dem Schlachtfeld abgekoppelt. Die Idee war jedoch gut. Wenn wir gemeinsam operieren wollen, müssen auch unsere Planung und Organisation gemeinsam geregelt werden."
HABSBURG_organizational_exercises:	"Gemeinsame organisatorische Übungen"
HABSBURG_organizational_exercises_desc:	"Manöver werden die Kriege der Zukunft entscheiden. Da der Krieg mit immer höherem Tempo geführt wird, steigt der Bedarf an hoher Geschwindigkeit und einwandfreier Organisation. Keine noch so große Feuerkraft wird uns retten, wenn unsere Truppen nicht wissen, wie sie sich schnell bewegen können, ohne ihr Ziel aus den Augen zu verlieren. Da unsere Armee immer mehr Männer verschiedener Nationalitäten umfasst, müssen wir Anstrengungen unternehmen, um unsere Truppen zu koordinieren und zu organisieren."
HABSBURG_meeting_the_logistical_challenge:	"Bewältigung der logistischen Herausforderung"
HABSBURG_meeting_the_logistical_challenge_desc:	"Die logistische Herausforderung wächst mit unserer Föderation. Der Nachschub braucht jetzt länger, um unsere Truppen zu erreichen, und wir befürchten, dass dies in Zukunft zu einem Problem werden könnte, wenn wir uns nicht darum kümmern. Unsere Truppen müssen darauf trainiert werden, mit weniger mehr zu erreichen, und die Versorgung der Truppen muss verbessert werden."
HABSBURG_bring_back_royal_and_imperial_hussars:	"Bringen Sie die königlichen und kaiserlichen Husaren zurück"
HABSBURG_bring_back_royal_and_imperial_hussars_desc:	"Früher gab es im alten Österreich-Ungarn die kaiserlichen und königlichen Husaren. Der Geist der Husaren ist bis heute lebendig, obwohl die meisten Husareneinheiten schon lange aufgelöst wurden. Einheiten, die sowohl bei unserer eigenen Bevölkerung als auch bei unseren Feinden einen solchen Respekt genießen, würden uns auch heute noch von großem Nutzen sein."
HABSBURG_defensive_hussars:	"Nach dem Vorbild der ungarischen Husaren"
HABSBURG_defensive_hussars_desc:	"Unsere wiederbelebte Husarenstreitmacht muss einige Änderungen erfahren, um sich nahtlos in unsere nun modernere Armee einzufügen. Die derzeitige ungarische leichte Kavallerie, ihre Vorstellung von einem modernen Husaren, sollte das Vorbild sein, nach dem wir unsere neue Husarenarmee gestalten. Wenn wir uns ihre Erfahrung zunutze machen und danach streben, ihre Beweglichkeit und Schnelligkeit zu erreichen, können wir eine Streitmacht aufbauen, mit der man rechnen muss."
HABSBURG_offensive_hussars:	"Vorbild sind die polnischen Husaren"
HABSBURG_offensive_hussars_desc:	"Unsere wiederbelebte Husarenarmee muss einige Änderungen erfahren, um sich nahtlos in unsere nun modernere Armee einzufügen. Die derzeitige schwere polnische Kavallerie, ihre geflügelten Husaren, haben ihren Feinden sowohl Angst als auch Respekt eingeflößt. In Anbetracht dieser Tatsachen scheint es glasklar, dass unsere Husaren nach dem gleichen Modell operieren sollten."
HABSBURG_the_modern_hussar:	"Der moderne Husar"
HABSBURG_the_modern_hussar_desc:	"Die Zeit bleibt für niemanden stehen, nicht einmal für unsere tapferen Husaren. Obwohl diese tapferen Männer nach wie vor eine Bereicherung für unsere Gemeinsame Armee sind, müssen wir modernisieren, was ein Husar wirklich ist. Die Zukunft unserer angesehenen Husaren wird vielleicht nicht immer auf dem Pferderücken liegen, aber das ist nicht so wichtig. Was zählt, ist, dass der Geist der Husaren weiterlebt!"
HABSBURG_for_the_glory_of_the_empire:	"Für den Ruhm des Reiches"
HABSBURG_for_the_glory_of_the_empire_desc:	"Jetzt, da unsere Armeen wieder als tipptopp gelten können, ist es an der Zeit, unseren Bürgern ein patriotisches Pflichtgefühl einzuflößen, damit sie erkennen, dass sie es sind, die die Heimat jedes Einzelnen vor dem Feind schützen."
HABSBURG_joint_industry_spirit:	"Gemeinsame industrielle Planung"
HABSBURG_joint_industry_spirit_desc:	"Jedes Land innerhalb unserer Föderation muss seinen Teil in Sachen Industrie leisten. Gegenwärtig arbeiten wir jedoch alle nach unterschiedlichen Plänen, was zu Schwierigkeiten führt, während wir sehen, wie eine umfassendere Zusammenarbeit Gestalt annimmt. Indem wir unsere industriellen Bemühungen gemeinsam planen, können wir ein Maximum an Effizienz sicherstellen."
HABSBURG_supplying_the_federation:	"Die Versorgung der Föderation"
HABSBURG_supplying_the_federation_desc:	"Da unsere Föderation wächst, muss auch unser Versorgungs- und Schienennetz mitwachsen. Wir müssen uns anstrengen, sonst laufen wir Gefahr, über unsere eigene Infrastruktur hinauszuwachsen und einen ebenso schmerzhaften wie demütigenden Sturz zu erleiden."
HABSBURG_optimizing_the_land_usage:	"Optimierung der Landnutzung"
HABSBURG_optimizing_the_land_usage_desc:	"Bei so vielen Ländern, die in einer Föderation zusammenarbeiten, ist es keine Überraschung, dass unsere Landnutzung keineswegs perfekt ist. Wenn wir unser Wissen darüber, wie wir unsere Industriegebiete am besten nutzen können, zusammenlegen, können wir wahrscheinlich die Art und Weise, wie wir Fabriken bauen, optimieren."
HABSBURG_joint_ventures_in_resource_extraction:	"Joint Ventures bei der Ressourcengewinnung"
HABSBURG_joint_ventures_in_resource_extraction_desc:	"Es ist unvermeidlich, dass einige Ressourcen unbemerkt bleiben oder aus anderen Gründen nicht abgebaut werden, in der Regel aus Kosten- oder Zeitgründen oder aus beiden Gründen. Jetzt, da alle diese Ressourcen unter der Föderation zusammengefasst sind, können wir unsere größere Wirtschaft und unser erweitertes Wissen darüber, wie man diese Ressourcen am besten abbaut, nutzen!"
HABSBURG_industrializing_our_capitals:	"Industrialisierung der Hauptstädte"
HABSBURG_industrializing_our_capitals_desc:	"Die meisten Hauptstädte in unserer Föderation sind alte, historische Städte. Das ist zwar gut und zeugt von einer langen und starken Geschichte unserer Mitglieder, aber sie lassen uns den Wunsch nach mehr industrieller Entwicklung. Gemeinsame Anstrengungen zur weiteren Industrialisierung dieser Städte könnten sich als sehr nützlich erweisen."
HABSBURG_specializing_in_civilian_logistics:	"Spezialisierung auf die zivile Logistik"
HABSBURG_specializing_in_civilian_logistics_desc:	"Der Fluss von Werkzeugen und Ausrüstung in der gesamten Föderation leidet unter einer schlechten Infrastruktur und korrupten Fabrikbesitzern. Wir müssen uns stark auf diesen Sektor konzentrieren und ihn so schnell wie möglich verbessern."
HABSBURG_specializing_in_the_arms_industry:	"Spezialisierung auf die Rüstungsindustrie"
HABSBURG_specializing_in_the_arms_industry_desc:	"Wenn wir jemals mit den Kolossen [GER.GetAdjective], [SOV.GetAdjective], [ENG.GetAdjective] oder [FRA.GetAdjective] konkurrieren wollen, müssen wir unsere Rüstungsindustrie massiv ausbauen!"
HABSBURG_industrial_effectivization:	"Industrielle Effektivierung"
HABSBURG_industrial_effectivization_desc:	"Unsere Fabriken müssen nicht nur in Kriegszeiten funktionieren, sondern natürlich auch in Friedenszeiten. In einer perfekten Welt wäre Letzteres viel wichtiger als Ersteres, aber leider ist diese Welt nicht perfekt. Dennoch können wir unsere industriellen Bemühungen in Friedenszeiten nicht vernachlässigen."
HABSBURG_reinforced_industry:	"Verstärkte Industrie"
HABSBURG_reinforced_industry_desc:	"Es ist zwar wichtig, dass unsere Fabriken auch in Friedenszeiten arbeiten können, aber jetzt ist nicht die Zeit, sich mit diesem Thema zu beschäftigen. Unser Industriesektor muss in der Lage sein, einem auf heimischem Boden geführten Krieg standzuhalten, und bevor das nicht erreicht ist, haben wir keine Zeit, über den Betrieb in Friedenszeiten nachzudenken."
HABSBURG_improved_production_methods:	"Verbesserte Produktionsmethoden"
HABSBURG_improved_production_methods_desc:	"Jetzt, da unsere Industrien effizient zusammenarbeiten, können wir uns bemühen, unsere Produktionsmethoden zu verbessern und die wahre Kraft und das Potenzial unserer Menschen und ihrer harten Arbeit zu nutzen."
HABSBURG_call_the_imperial_diet:	"Berufen Sie den Reichstag ein"
HABSBURG_call_the_imperial_diet_desc:	"Endlich ist die Zeit gekommen, den Reichstag wieder einzuberufen. Für uns, als Führer dieser Föderation, war die Vision dieser Föderation immer klar. Das Ziel war immer die Wiedereingliederung des Imperiums, und es ist an der Zeit, dass wir dieses Ziel verfolgen."
HABSBURG_united_in_the_face_of_danger:	"Vereint im Angesicht der Gefahr"
HABSBURG_united_in_the_face_of_danger_desc:	"Es heißt Tod oder Schande, und unser Volk weiß das sehr gut. Wir werden jeder Bedrohung, die sich gegen uns erheben könnte, geschlossen entgegentreten! "
HABSBURG_an_empire_not_just_in_name:	"Eine Tausendjährige Föderation"
HABSBURG_an_empire_not_just_in_name_desc:	"Unsere Föderation wird wahrlich tausend Jahre bestehen, und nichts kann uns und unserer Zukunft jetzt noch im Wege stehen. Es soll bekannt werden, dass der Donauraum der reichste und ehrfurchtgebietendste der Welt ist!"
