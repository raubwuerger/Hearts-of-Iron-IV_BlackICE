COG_the_invisible_roof_tt:	"Hat nationalen Geist §YYDas Unsichtbare Dach§!"
COG_establish_the_anc_locking_tt:	"§RLocks any Force Publique focuses from being taken in the future§!"
COG_establish_the_anc_modifier_tt:	"Entfernt den Nationalgeist §YForce Publique§! und ersetzt ihn durch den §YArmée Nationale Congolaise§!, wobei etwa die Hälfte der zuvor erhaltenen Boni erhalten bleibt"
COG_closer_cooperation_with_eugene_jungers_tt:	"Schaltet die Schwerpunkte §YRuanda-Urundi§! und §YErweiterung der Wolframminen§! frei"
COG_intore_infantry_recruitment:	"Gewinnen Sie eine Eliteeinheit mit 7 §YInfanterie§! Bataillonen"
COG_contract_the_empain_group_tt:	"Schaltet Entscheidungen für §YErweiterung der Minen§! und §YInvestitionen in Unternehmen§! der Empain Group frei"
COG_increased_powers_for_colonial_governors:	"Erhöhte Befugnisse für Kolonialgouverneure"
COG_make_use_of_the_british_proposal_tt:	"Wenn Belgien den Fokus §YKönig der Belgier§! nicht abgeschlossen hat, erhalten wir die Möglichkeit, britische Unterstützung zu nutzen, wenn wir unsere Unabhängigkeit von Belgien aushandeln. Wenn sie jedoch den Kollaborateur-König§! ermächtigt haben, können wir mit britischer Unterstützung sofort die Unabhängigkeit erklären. \n\nAktuelle Auswirkungen:"
COG_make_use_of_the_british_proposal_in_negotations:	"Wir werden in der Lage sein, §YBritische Unterstützung§! zu nutzen, um bei zukünftigen Verhandlungen mit unseren kolonialen Oberherren im Austausch für Ressourcenrechte an §Y[538.GetName]§! und §Y[890.GetName]§! auf die Unabhängigkeit zu drängen."
COG_occupy_cabinda_tt:	"§Dies könnte zu einem Krieg mit dem Besitzer von [796.GetName] führen!"
COG_national_committee_for_liberation_tt:	"§RWir werden nicht mehr versuchen können, unsere Unabhängigkeit friedlich auszuhandeln, und werden zu einer bewaffneten Revolution gezwungen sein§!"
COG_endorse_force_publique_mutinies_tt:	"Wenn die Meutereien entweder vorbei sind oder noch andauern, wenn der Fokus §YStrike While the Iron is Hot§! abgeschlossen ist, wird der Geist unseren Feind im Bürgerkrieg ernsthaft beeinträchtigen"
COG_the_simba_movement_tt:	"Wenn der Befreiungskrieg beginnt, werden wir 3 §YSimba Movement Divisions§! gewinnen, und sie werden in der Lage sein, die Regierung zu putschen und die nationale Führung zu übernehmen, wenn die Popularität des §YCommunism§! groß genug wird"
COG_approach_the_disfavored_mwami_tt:	"Wenn der Befreiungskrieg beginnt, werden wir 2 §YRwandan Divisions§! gewinnen, und die monarchistischen Gefühle in unserem Land werden mit der Zeit stärker werden"
COG_approach_the_barotse_litunga_tt:	"Wenn der Krieg für die Befreiung beginnt, werden wir 2 §YBarotse Divisionen§! gewinnen, und einen Kern an §Y[981.GetName]§! gewinnen"
COG_slander_the_colonial_authorities_tt:	"§RDieser nationale Geist wird nach Abschluss unseres Unabhängigkeitskrieges beseitigt sein!§!"
COG_strike_while_the_iron_is_hot_tt:	"Unsere Truppen werden ihren Marsch auf Léopoldville beginnen und damit offiziell den Unabhängigkeitskrieg beginnen. Wir werden in der Lage sein, den Frieden mit unseren ehemaligen Oberherren zu erzwingen und die volle Unabhängigkeit zu erlangen, wenn wir §YLéopoldville§!, §YÉlisabethville§! und §YStanleyville§! kontrollieren, oder wenn wir unseren Feind ordnungsgemäß kapitulieren und einen Frieden erzwingen können. \n\nGleichermaßen werden sie in der Lage sein, Frieden mit uns zu erzwingen und die Kontrolle über unser Land zu behalten, indem sie §YLéopoldville§!, §YÉlisabethville§! und §YStanleyville§! kontrollieren."
COG_when_the_war_for_independence_starts_tt:	"Wenn der §YWar for Independence§! beginnt:"
COG_the_lion_roars_1_tt:	"Wir werden §YCommunist§!, und können wählen, ob wir §YCyrille Adoula§! oder §YChristophe Gbenye§! zum Führer unseres Landes wählen."
COG_the_lion_roars_2_tt:	"Wir werden wählen können, ob wir §YCyrille Adoula§! als Führer unseres Landes behalten wollen, oder ob wir ihn durch §YChristophe Gbenye§! ersetzen wollen"
CONGO_expanded_rubber_plantations_available_tt:	"Ein Feind von uns hat die Kontrolle über ganz §YFrench Indochina§! übernommen."
CONGO_expanded_rubber_plantations_available_malaya_tt:	"Ein Feind von uns hat die Kontrolle über §YMalaya§! erlangt."
CONGO_expand_ndolo_and_elisabethville_airports_tt:	"Dieser Effekt wird noch verstärkt, wenn der Fokus in einer Fraktion mit §Y[USA.GetNameDef]§! abgeschlossen wird."
CONGO_appoint_van_overstraeten_tt:	"§YRaoul van Overstraeten§! wird als §YFeldmarschall§! in den §YBelgischen Kongo§! entsandt"
congo_more_options_to_threaten_tt:	"Sollten wir zuvor ausländische Unterstützung erhalten haben, könnten wir in den Verhandlungen eine aggressivere Haltung einnehmen."
COG_BEL_negotiations_ongoing_flag:	" Kongolesische Unabhängigkeitsverhandlungen Laufend"
CONGO_independence_war_ongoing:	" Kongolesischer Unabhängigkeitskrieg Fortlaufend"
COG_african_union_faction:	"Organisation der Afrikanischen Einheit"
COG_pan_african_congress:	"Der Panafrikanische Kongress"
COG_kasa_vubus_first_cabinet_1_tt:	"Wir werden §YDemokratisch§!, und §YJoseph Kasa-Vubu§! erhält den Titel §YGründungsvater der kongolesischen Nation§!."
COG_kasa_vubus_first_cabinet_2_tt:	"§YJoseph Kasa-Vubu§! erhält die Eigenschaft §YGründungsvater der kongolesischen Nation§!, und wir erhalten §YStabilität§! und §YPolitische Macht§!"
COG_declaration_of_congolese_unity_tt:	"Schaltet Entscheidungen zur §YIntegration besetzter kongolesischer Territorien§! frei."
COG_assemble_a_regency_council_tt:	"Sobald ein Anführer gewählt wurde, erscheinen §YNeue Schwerpunkte§! unter §YAbhängig davon, wer gewählt wurde§!"
COG_assemble_a_regency_council_2_tt:	"Der Rat wird mit der Suche nach Kandidaten für die Führung unserer Nation beginnen und dabei denjenigen den Vorrang geben, die die größte Legitimität besitzen."
COG_monarchism_didnt_work_out_flag:	"Der Rat konnte sich nicht für einen Herrscher entscheiden"
COG_uniao_dos_povos_do_norte_de_angola_tt:	"Wenn der abtrünnige Staat seine Unabhängigkeit erlangt, wird er §YIntegriert§! in uns"
COG_to_be_annexed_angola_flag:	"Loyalisten des Königreichs Kongo"
COG_time_until_annex_angola_rebellion:	"Die Unterstützung für die Separatistenbewegung festigt sich weiter"
COG_days_left_for_rebellion_tt:	"Die aktuellen Tage sind: [?COG_time_until_annex_angola_rebellion:days|Y0]"
COG_boma_accords_faction:	"Das Boma-Abkommen"
COG_south_to_lake_malawi_tt:	"Enthält Beschlüsse zur §YIntegration von Malawi und Zambezia-Moçambique§!"
COG_invite_german_kasierist_exiles_tt:	"§YCarl Friedrich Goerdeler§!, §YPaul von Lettow-Vorbeck§! und §YAlfred Hugenberg§! reisen zu uns nach Afrika"
COG_colonial_administration_tt:	"Ermöglicht Entscheidungen zur §YIntegration von Staaten§! in §YMittleres Afrika§!"
FOCUS_ICON_SET_HISTORICAL_KEY_FOCUS:	"Historischer Schwerpunkt"
GER_prioritize_economic_growth:	"Wirtschaftswachstum priorisieren"
GER_prioritize_economic_growth_desc:	"Jahre der nachlässigen Finanzpolitik haben unsere Wirtschaft fast ruiniert. Wir müssen Traktoren statt Panzer bauen, Schaufeln statt Gewehre verteilen und dem Wirtschaftswachstum Priorität einräumen, anstatt die Rüstungsindustrie auszubauen!"
GER_currency_reforms:	"Währungsreformen"
GER_currency_reforms_desc:	"Der erste Schritt zur wirtschaftlichen Erholung und Wiederbelebung ist die Durchführung umfassender Währungsreformen."
GER_lower_taxes:	"Steuern senken"
GER_lower_taxes_desc:	"Die Steuerlast für unser Volk ist allmählich immer höher geworden, um das Aufrüstungsprogramm zu finanzieren. Wenn wir diese Belastung verringern, verlieren wir zwar kurzfristig an Staatseinnahmen, aber die Menschen werden später mehr von ihrem hart verdienten Geld ausgeben können."
GER_workers_rights:	"Rechte der Arbeitnehmer "
GER_workers_rights_desc:	"Die Gewerkschaften haben sich in den letzten Jahren grundlegend verändert und sind nicht mehr das, was sie einmal waren. Wenn wir sie reformieren, können wir die Arbeiter mobilisieren und die Früchte ernten."
GER_abolish_price_controls:	"Abschaffung der Preiskontrollen"
GER_abolish_price_controls_desc:	"Die Preiskontrollen, die eingeführt wurden, um die Aufrüstung zu unterstützen, lähmen die Wirtschaft. Die Abschaffung dieser Maßnahmen mag die Mittel des Staates schmälern, aber sie wird es den Menschen ermöglichen, neue Unternehmen zu gründen und die Wirtschaft anzukurbeln."
GER_increased_trade:	"Verstärkter Handel"
GER_increased_trade_desc:	"Wenn es dem deutschen Volk gut gehen soll, müssen wir importieren, was wir nicht im eigenen Land abbauen oder herstellen können. Wir müssen den Blick nach außen richten und neue Handelsabkommen mit anderen Nationen abschließen - Abkommen, die uns begünstigen, versteht sich."
GER_housing_developments:	"Entwicklung des Wohnungsbaus"
GER_housing_developments_desc:	"Wir können unsere Wirtschaft wiederbeleben, indem wir ein Wohnungsbauprogramm auflegen, das darauf abzielt, moderne Wohnungen zu renovieren und zu schaffen und einen neuen Lebensstandard zu schaffen."
GER_invest_in_vereinigte_stahlwerke:	"Investieren Sie in Vereinigte Stahlwerke"
GER_invest_in_vereinigte_stahlwerke_desc:	"Die Vereinigten Stahlwerke sind einer unserer größten und wichtigsten Stahlproduzenten. Investitionen in das Unternehmen werden mit Sicherheit zu einer höheren Produktivität führen und die deutsche Stahlindustrie verändern."
GER_industrial_expansion:	"Industrielle Expansion"
GER_industrial_expansion_desc:	"Eine starke Industrie, die international wettbewerbsfähig ist und neue Technologien vorantreibt, wird für unser weiteres Wachstum entscheidend sein. [ROOT.GetNameDefCap] wird zum Synonym für Qualität werden."
GER_agricultural_reforms:	"Landwirtschaftliche Reformen"
GER_agricultural_reforms_desc:	"Unser Agrarsektor besteht zumeist aus kleinen, familiengeführten Betrieben, die viel Handarbeit leisten. Wir können den gesamten Agrarsektor reformieren, indem wir moderne Geräte einführen und die Produktionsleistung jedes einzelnen Betriebs steigern. Davon wird unser ganzes Land profitieren!"
GER_urbanization:	"Urbanisierung"
GER_urbanization_desc:	"Die Einführung moderner Maschinen in der Landwirtschaft hat viele Menschen freigesetzt, die nun auf der Suche nach neuen Arbeitsplätzen in die Städte strömen. Diese Menschen können in unseren Fabriken eingesetzt werden, wo sie unsere Wirtschaft zu einer der stärksten der Welt machen können."
GER_wirtschaftswunder:	"Wirtschaftswunder"
GER_wirtschaftswunder_desc:	"All unsere Programme und Initiativen zur Wiederbelebung der Wirtschaft haben sich endlich ausgezahlt! Menschen auf der ganzen Welt bewundern unseren finanziellen und industriellen Aufschwung und nennen ihn 'Wirtschaftswunder' - ein Wirtschaftswunder."
GER_mass_production:	"Massenproduktion"
GER_mass_production_desc:	"Bei all den industriellen Fortschritten, die wir in letzter Zeit gemacht haben, haben wir eine Menge über die Produktionsmittel gelernt. Wir sollten all dieses neu gewonnene Wissen und Verständnis in die Rationalisierung unserer Fließbänder und die Produktion von Material in einem noch nie dagewesenen Umfang stecken."
GER_build_defense_industry:	"Aufbau einer Verteidigungsindustrie"
GER_build_defense_industry_desc:	"Nachdem es uns endlich gelungen ist, unsere Wirtschaft zu stabilisieren und sogar um ein Vielfaches zu stärken, können wir uns nun der Sicherung der Souveränität unserer Nation und dem Aufbau einer angemessenen Verteidigungsindustrie zuwenden, um den Fleiß und das Streben des deutschen Volkes nach Fortschritt und Spitzenleistungen zu schützen."
GER_war_production:	"Kriegsproduktion"
GER_war_production_desc:	"Der Krieg hat uns wieder einmal überrollt, aber wir werden nicht einknicken und wir werden nicht fallen! Wir werden unsere industrielle Macht mobilisieren und jeden Feind ausstechen, der so unklug ist, zu glauben, er könne den unbeugsamen Willen des deutschen Volkes brechen!"
GER_construct_the_reichsautobahn:	"Bauen Sie die [GetAutobahnName]"
GER_autobahn_fascism:	"Reichsautobahn"
GER_autobahn_neutral:	"Kaiserliche Autobahn"
GER_autobahn_democratic:	"Autobahn"
GER_autobahn_communism:	"Volksautobahn"
GER_construct_the_reichsautobahn_desc:	"$GER_autobahn_desc$"
GER_kdf_wagen_factories:	"[GetKfdWagenNames]"
GER_kdf_wagen_factories_fascist:	"KdF-Wagenfabriken"
GER_kdf_wagen_factories_neutral:	"Wilhelm-Wagen-Fabriken"
GER_kdf_wagen_factories_volkswagen:	"Volkswagen Fabriken"
GER_kdf_wagen_factories_desc:	"[GetKDFFactoriesText]"
GER_kdf_wagen_factories_autarky_text:	"$GER_kdf_wagen_desc$ "
GER_kdf_wagen_factories_economic_growth_text:	"Wenn wir unsere neuen [GetAutobahnName]s gebaut haben, müssen wir sie mit Autos füllen. Um eine wirklich wohlhabende und moderne Wirtschaft zu werden, müssen wir Fabriken bauen, die diese Autos produzieren können - und gleichzeitig Arbeitsplätze und Beschäftigung schaffen."
GER_expand_the_reichsautobahn_south:	"Erweitern Sie das [GetAutobahnName] nach Süden"
GER_expand_the_reichsautobahn_south_desc:	"Der Ausbau des Autobahnnetzes nach Süden wird das Wirtschaftswachstum und die Entwicklung in der Region ankurbeln. Es wird auch unsere militärischen Fähigkeiten stärken, indem es schnelle Truppentransporte in Richtung Alpen ermöglicht."
GER_expand_the_reichsautobahn_south_tt:	"Fügen Sie §G1§! §Y$infrastructure$§! in §Y[53.GetName]§!, §Y[52.GetName]§!, §Y[152.GetName]§! ein, §Y[4.GetName]§! und eine Ebene §Y1§! Eisenbahn von §Y[53.GetName]§! bis §Y[4.GetName]§!, wenn §Y[ROOT.GetName]§! oder ein deutsches Subjekt die Staaten kontrolliert. Aktuelle Auswirkung:"
GER_expand_the_reichsautobahn_east:	"Ausweitung des [GetAutobahnName] Ost"
GER_expand_the_reichsautobahn_east_desc:	"Der Ausbau des Autobahnnetzes in Richtung Ostpreußen wird die Entschlossenheit unserer Nation demonstrieren, unsere östlichste Region wieder mit dem Rest von [ROOT.GetNameDef] zu verbinden und zu vereinen. Es wird uns auch ermöglichen, bei Bedarf stärker und schneller nach Osten vorzustoßen."
GER_expand_the_reichsautobahn_east_tt:	"Fügen Sie §G1§! §Y$infrastructure$§! in §Y[68.GetName]§!, §Y[63.GetName]§!, §Y[807.GetName]§! ein, §Y[85.GetName]§! und eine Ebene §Y1§! Eisenbahn von §Y[63.GetName]§! bis §Y[85.GetName]§!, wenn §Y[ROOT.GetName]§! oder ein deutsches Subjekt die Staaten kontrolliert. Aktueller Effekt:"
GER_develop_heraeus_facilities:	"Heraeus Forschungseinrichtungen ausbauen"
GER_develop_heraeus_facilities_desc:	"Investitionen in neue Einrichtungen können den Zugang zu der wachsenden Nachfrage nach Edelmetallen sichern, die ein modernes Militär benötigt. Diese spezialisierten Materialien sind für die Elektronik und hochwertige Rüstungsgüter unerlässlich."
GER_build_the_rur_dam:	"Bauen Sie den Rur-Damm"
GER_build_the_rur_dam_desc:	"Der Bau des Rur-Damms ist mehr als nur eine technische Meisterleistung - er ist eine Investition in die Zukunft. Der Damm würde nicht nur die wirtschaftliche Entwicklung in der Region fördern, sondern auch unsere industriellen Anstrengungen und unsere Produktionsleistung ankurbeln."
GER_trade_deal_with_sweden:	"Handelsabkommen mit Schweden"
GER_trade_deal_with_sweden_desc:	"$GER_swedish_trade_agreement_desc$ "
GER_the_four_year_plan:	"Der Vier-Jahres-Plan"
GER_the_four_year_plan_desc:	"$GER_four_year_plan_desc$ "
GER_autarky_efforts:	"Autarkie-Bemühungen"
GER_autarky_efforts_desc:	"$GER_autarky_desc$ "
GER_gain_autarkic_economy_lock_free_trade_tt:	"§RLock§! §Y$free_trade$§! und §Y$export_focus$§!. Gewinnen Sie §Y$autarkic_economy$§!."
GER_improve_trade_relations_tt:	"Verbessern Sie §YHandelseinfluss§! bei aktuellen und zukünftigen §YFraktionsmitgliedern§!."
GER_institute_price_controls:	"Preiskontrollen einführen"
GER_institute_price_controls_desc:	"Wir müssen verschiedene Maßnahmen ergreifen, um unsere Kontrolle über die Finanzen zu stärken, damit sie nicht unter unseren ehrgeizigen Zielen, autark zu werden, einknicken. Wir müssen in der Lage sein, die Preise für Importe, lebenswichtige Güter und die Löhne der Arbeiter zu regulieren, um die Inflation einzudämmen und die wirtschaftliche Stabilität zu sichern."
GER_unlock_price_controls_decision_tt:	"Schaltet die Entscheidung frei: §Y$GER_price_controls_cat$§!, die §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! reduzieren kann."
GER_industrial_consumer_goods_factor_limit_tt:	"§Y[GetIndustrialModifier]§! haben §Rless§! als $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y90%§!"
GER_establish_the_reichswerke:	"Legen Sie die $GER_reichswerke$ fest"
GER_establish_the_reichswerke_desc:	"$GER_hermann_goring_werke_desc$ "
GER_unlock_reichswerke_tt:	"Entriegelt den Industriekonzern §Y$GER_reichswerke$§!"
GER_seize_foreign_industries:	"Ausländische Industrien ergreifen"
GER_seize_foreign_industries_desc:	"Indem wir ausländische Industrien in unsere Wirtschaft integrieren, sichern wir uns lebenswichtige Ressourcen, die unsere Kriegsanstrengungen und unsere Produktion unterstützen."
GER_coal_liquefaction:	"Kohleverflüssigung"
GER_coal_liquefaction_desc:	"$GER_coal_liquidization_desc$ "
GER_subsidize_hoesch_benzin:	"Hoesch-Benzin subventionieren"
GER_subsidize_hoesch_benzin_desc:	"Früher sagte man, dass eine Armee auf dem Bauch marschiert, aber eine moderne Armee läuft mit Treibstoff. Um unsere militärischen Fähigkeiten aufrechtzuerhalten, müssen wir unsere Anstrengungen zur Herstellung synthetischer Kraftstoffe verstärken."
GER_establish_buna_werke:	"Buna-Werke gründen"
GER_establish_buna_werke_desc:	"Für die groß angelegte Motorisierung und Luftfahrt werden große Mengen an Kautschuk benötigt, von denen wir in Deutschland selbst keine Quellen besitzen. Um unabhängiger vom Außenhandel zu werden, müssen wir Fabriken errichten, die synthetischen Kautschuk herstellen können."
GER_autarky_achieved:	"Die Autarkie ist erreicht"
GER_autarky_achieved_desc:	"Wir haben endlich unser ehrgeiziges Ziel erreicht, völlig autark zu werden! Unsere Nation ist reich an natürlichen Ressourcen geworden, was uns nur noch mehr stärken wird - und uns unaufhaltsam macht!"
GER_improve_autarkic_economy_tt:	"Verbessern Sie §Y$autarkic_economy$§!"
GER_accelerate_the_rearmament_program:	"Beschleunigen Sie das Aufrüstungsprogramm "
GER_accelerate_the_rearmament_program_desc:	"Wir müssen die Fesseln des Versailler Vertrags sprengen und die Ambosse der Industrie ein glorreiches Schicksal für [ROOT.GetNameDef] schmieden lassen. Jeder produzierte Panzer, jedes gebaute Flugzeug wird ein Zeugnis für den unbeugsamen Willen des deutschen Volkes sein."
GER_concentrated_armament_program:	"Konzentriertes Rüstungsprogramm"
GER_concentrated_armament_program_desc:	"Unsere Industrien müssen unsere militärischen Bedürfnisse unterstützen, um unsere Nation wieder aufzurüsten. Ein umfassendes Aufrüstungsprogramm zur schnellen Modernisierung und zum Ausbau unserer Streitkräfte muss auf den Weg gebracht werden!"
GER_establish_production_targets:	"Legen Sie Produktionsziele fest"
GER_establish_production_targets_desc:	"Bevor wir irgendwelche militärischen Kampagnen starten können, müssen wir zunächst unsere Streitkräfte modernisieren und ausrüsten. Um die Produktionsleistung zu steigern, müssen wir Quoten und ehrgeizige Produktionsziele festlegen."
GER_prioritize_the_army:	"Setzen Sie Prioritäten für die Armee"
GER_prioritize_the_army_desc:	"Deutschland, und davor Preußen, war immer eine Landmacht und verließ sich auf die Armee, um unsere Souveränität und Sicherheit zu gewährleisten. Wir müssen unsere industriellen Anstrengungen umlenken, um sicherzustellen, dass unsere Armee gut ausgerüstet und in der Lage ist, jeden Feind zu bezwingen."
GER_prioritize_the_navy:	"Priorisieren Sie die Marine"
GER_prioritize_the_navy_desc:	"Die Kontrolle über die Meere ist von entscheidender Bedeutung, wenn wir unsere Reichweite über unsere derzeitigen Grenzen hinaus ausdehnen wollen. Wir müssen der Marine Priorität einräumen, damit sie es mit jeder feindlichen Flotte an Größe und Macht aufnehmen kann."
GER_extra_funds_to_waffenamt:	"Zusätzliche Mittel für das Waffenamt"
GER_extra_funds_to_waffenamt_desc:	"Das Waffenamt überwacht den Entwurf und die Entwicklung von militärischer Ausrüstung. Es arbeitet mit Waffenherstellern und Forschungsinstituten zusammen. Wenn wir es mit zusätzlichen Mitteln ausstatten, können wir das Tempo des Fortschritts erhöhen."
GER_zentrale_planung:	"Bilden Sie die Zentrale Planung"
GER_zentrale_planung_desc:	"Der Krieg hat Defizite in unseren Rüstungsbemühungen aufgedeckt, Defizite, die wir beheben müssen! Durch die Bildung einer Zentralen Planung mit Mitgliedern der Regierung, der Industrie und des Militärs können wir die Wirtschaftspolitik koordinieren und die Ressourcen effizient umleiten, um unsere Rüstungsproduktion zu steigern und unsere nationalen Ziele und unsere militärische Vorherrschaft zu unterstützen."
GER_criteria_for_economy_laws_tt:	"Wenn Sie §Y$partial_economic_mobilisation$§! aktiviert haben, wird das Wirtschaftsgesetz auf §Y$war_economy$§! geändert, sofern es verfügbar ist."
GER_create_rustungsstab:	"Erstellen Sie den Rüstungsstab"
GER_create_rustungsstab_desc:	"Unsere Bemühungen, die Waffenherstellung zu rationalisieren, haben sich als erfolgreich erwiesen, aber es sind weitere Verbesserungen nötig! Die Schaffung eines Rüstungsstabs würde es uns ermöglichen, Strategien für die Zuweisung von Ressourcen zu entwickeln und Projekte zu priorisieren, um unsere Waffenproduktion zu steigern."
GER_armament_rationalization:	"Rationalisierung der Rüstung"
GER_armament_rationalization_desc:	"Unsere Produktionslinien können kaum mit dem Bedarf unserer Streitkräfte Schritt halten. Wir müssen Maßnahmen zur Rationalisierung der Rüstung ergreifen, um die Effizienz und Effektivität unserer industriellen Kriegsmaschine zu erhöhen."
GER_totaler_krieg:	"Totaler Krieg"
GER_totaler_krieg_desc:	"Um den totalen Sieg zu erringen, müssen wir unsere gesamte Gesellschaft mobilisieren und den totalen Krieg bis vor die Haustür unseres Feindes bringen. Es ist Zeit für [ROOT.GetNameDef], sich zu erheben und den Sturm losbrechen zu lassen!"
GER_gain_totaler_krieg_remove_total_mob_tt:	"§RRemove§! §Y$tot_economic_mobilisation$§!. Gewinnen Sie §Y$totaler_krieg_economy$§!."
GER_develop_modern_maneuver_warfare:	"Moderne Manöverkriegsführung entwickeln"
GER_develop_modern_maneuver_warfare_desc:	"Wir müssen die sich entwickelnde Natur der modernen Kriegsführung erkennen und eine neue Doktrin entwickeln, die die Integration von Infanterie und neuen Technologien betont, um unsere militärische Effektivität auf dem Schlachtfeld zu maximieren."
GER_fortify_the_vaterland:	"Das Vaterland befestigen"
GER_fortify_the_vaterland_desc:	"Um [GER.GetNameDef] zu sichern, müssen wir überall dort, wo es nötig ist, Festungen errichten. Wenn wir unsere Verteidigung verstärken, können wir die Grenzen mit weniger Männern halten und so Divisionen freisetzen, die sich an möglichen Offensiven anderswo beteiligen können."
GER_fortify_the_vaterland_unlock_decision_tt:	"Schaltet die Entscheidung frei: §Y$GER_fortify_the_vaterland_cat$§!"
GER_all_terrain_military_motorcycle:	"Geländegängiges Militärmotorrad"
GER_all_terrain_military_motorcycle_desc:	"Die Bedeutung einer schnellen Aufklärung kann gar nicht hoch genug eingeschätzt werden. Die Investition in Motorrad-Einheiten liefert entscheidende Informationen über das Schlachtfeld, die eine strategische Entscheidungsfindung ermöglichen und die operative Effizienz erhöhen."
GER_salvage_captured_equipment:	"Bergung erbeuteter Ausrüstung"
GER_salvage_captured_equipment_desc:	"Durch die Einrichtung von Anlagen zur Bergung und Wiederverwendung erbeuteter feindlicher Ausrüstung für unser Militär können wir erbeutete Waffen, Fahrzeuge und Maschinen aufarbeiten und integrieren, um unsere Streitkräfte zu stärken."
GER_unlock_operational_planning_blitzkrieg_tt:	"Schaltet die Entscheidung frei: §Y$GER_operational_planning_category$§!, der, wenn er aktiviert wird, für §Y45 Tage§! gewährt:"
GER_unlock_operational_planning_bewegungskrieg_tt:	"Schaltet die Entscheidung frei: §Y$GER_operational_planning_category$§!, der, wenn er aktiviert wird, für §Y90 Tage§! gewährt:"
GER_the_prussian_legacy:	"Das preußische Erbe"
GER_the_prussian_legacy_desc:	"'Wo manche Staaten eine Armee haben, hat die preußische Armee einen Staat', sagte Voltaire einst. Wir werden dies verkörpern, indem wir die alte deutsche Doktrin des Bewegungskriegs weiterentwickeln, um rasche und überwältigende Siege auf dem Schlachtfeld zu gewährleisten."
GER_improve_motorized_troops:	"Verbessern Sie die motorisierten Truppen"
GER_improve_motorized_troops_desc:	"In der modernen Kriegsführung geht es um Geschwindigkeit und schnelle offensive Fähigkeiten. Wir müssen sicherstellen, dass unsere Schnelltruppen, unsere motorisierten Einheiten, bereit und in der Lage sind, den Angriff anzuführen und einen schnellen und entscheidenden Sieg zu erringen."
GER_lessons_of_the_great_war:	"Lehren aus dem Großen Krieg"
GER_lessons_of_the_great_war_desc:	"Unsere Misserfolge im Großen Krieg bieten unschätzbare Erkenntnisse, die für unsere zukünftigen Konflikte von entscheidender Bedeutung sind. Wir haben die Vergangenheit eingehend studiert und müssen nun die Lehren aus der Geschichte umsetzen."
GER_stormtroopers:	"Stosstruppen"
GER_stormtroopers_desc:	"Die Stosstruppen des Grossen Krieges waren Elite-Schocktruppen, die Angriffe auf die gegnerischen Schützengräben führen und Durchbrüche schaffen sollten, die die Hauptinfanterie ausnutzen konnte. Wir sollten diese Idee wiederbeleben und neue Eliteschocktruppen ausbilden, die auf dem Schlachtfeld für Schnelligkeit, Beweglichkeit und rücksichtslose Effizienz stehen."
GER_sturmtruppe_battalion_tt:	"Schaltet das Unterstützungsbataillon §Y$sturmtruppe_battalion$§! frei."
GER_artillery_bombardment:	"Artillerie-Bombardement"
GER_artillery_bombardment_desc:	"Die Infanterie ist das Rückgrat unserer Armee, und damit sie sich auszeichnen kann, braucht sie die richtige Unterstützung. Wir müssen stark in die Artillerie investieren, damit unsere Infanterie jeden Vorteil ausnutzen und jeden Feind besiegen kann."
GER_instill_auftragstaktik:	"Auftragstaktik einführen"
GER_instill_auftragstaktik_desc:	"Unser Militär praktiziert seit langem die Auftragstaktik, die auf dezentraler Führung und Eigeninitiative beruht. Dies hat zu Flexibilität und Autonomie geführt und unsere Fähigkeit verbessert, uns anzupassen und in unvorhergesehenen Situationen erfolgreich zu sein. Es ist von größter Wichtigkeit, dass wir diese Praxis fortsetzen, damit unsere Streitkräfte immer siegreich sind!"
GER_establish_the_afrikakorps:	"Stellen Sie das Afrikakorps auf"
GER_establish_the_afrikakorps_desc:	"Um die Nachschublinien unseres Feindes zu unterbrechen und lebenswichtige Ressourcen und strategische Positionen zu sichern, müssen wir den Krieg aus Europa heraus und an fremde Küsten tragen!"
GER_unlock_operational_planning_in_africa_tt:	"Schaltet die Entscheidung frei: §YOperationsplanung in Afrika§!"
GER_revive_the_schutztruppe:	"Wiederbelebung der Schutztruppe"
GER_revive_the_schutztruppe_desc:	"Die Schutztruppen waren die Kolonialtruppen, die wir in den afrikanischen Gebieten unseres Kolonialreichs eingesetzt haben. Sie haben uns im Ostafrika-Feldzug des Ersten Weltkriegs und in früheren kleineren Konflikten gute Dienste geleistet. Da unser Blick nun wieder nach Afrika und Asien gerichtet ist, ist es vielleicht an der Zeit, die Kolonialbüros wieder einzurichten und eine neue und verbesserte Schutztruppe in Betracht zu ziehen."
GER_revive_the_schutztruppe_tt:	"Schaltet §YSchutztruppe§! koloniale Milizen und Entscheidungen zu §YRecruit§! und §YImprove§! sie frei"
GER_establish_the_skijager:	"Etablierung der Skijäger"
GER_establish_the_skijager_desc:	"Um sicherzustellen, dass unsere Streitkräfte unter allen Wetterbedingungen effektiv und anpassungsfähig bleiben, müssen wir die Kunst des Winterkriegs beherrschen. Zu diesem Zweck werden wir spezialisierte Gebirgsjäger ausbilden und ausrüsten, die in verschneitem und gebirgigem Terrain effektiv operieren können."
GER_panzergrenadier:	"Panzergrenadiere"
GER_panzergrenadier_desc:	"Unsere Militärdoktrin beruht auf der Mobilität und wird davon abhängen, wie gut unsere motorisierten Truppen funktionieren. Weder Infanterie- noch Panzerdivisionen werden ohne angemessene Unterstützung erfolgreich vorrücken können. Indem wir die mechanisierte Infanterie in unsere Speerspitzen integrieren, stellen wir sicher, dass unsere Streitkräfte bei offensiven Operationen die Überlegenheit behalten."
GER_modify_bewegungskrieg_or_blitzkrieg_tt:	"Ändern Sie §Y$GER_blitzkrieg_modifier$§! oder §Y$GER_bewegungskrieg_modifier$§! um:"
GER_heavy_armored_car_recon_company_tt:	"\n§Y$armored_car_recon$§!:\n§YArmor§!: §G+5%§!\n§YForest§!:\n Bewegung Effektive Veränderung: §G+5%§!\n§YWüste§!:\n Bewegung Effektive Änderung: §G+10%§!\n§YPlains§!:\n Bewegung Effektive Änderung: §G+10%§!\n"
GER_nationalize_ford_factories:	"Ford-Fabriken verstaatlichen"
GER_nationalize_ford_factories_desc:	"Die Kontrolle über die Ford-Fabriken in [51.GetName] zu übernehmen und sie unter staatliche Kontrolle zu stellen, würde unsere industriellen Kapazitäten stärken und eine stetige Versorgung mit lebenswichtigen Ausrüstungen und Fahrzeugen zur Unterstützung unserer Streitkräfte und der Logistik sicherstellen."
GER_kriegslokomotiven:	"Kriegslokomotiven"
GER_kriegslokomotiven_desc:	"Die logistischen Herausforderungen der Kriegsführung machen die Produktion von Kriegslokomotiven erforderlich. Diese Züge werden auf unsere wirtschaftlichen Gegebenheiten und die Notwendigkeit einer schnellen, billigen Massenproduktion zugeschnitten sein."
GER_improve_the_logistics_system:	"Verbessern Sie das Logistiksystem."
GER_improve_the_logistics_system_desc:	"Zu viele unserer Generäle im Oberkommando haben eine ablehnende Haltung gegenüber Logistik und Versorgungsketten, weil sie die Probleme unseres derzeitigen Systems nicht verstehen. Sie müssen für die überragende Bedeutung einer effizienten Logistik in der modernen Kriegsführung sensibilisiert werden, während wir eine umfassende Initiative zur Verbesserung unseres Logistiksystems einleiten."
GER_defend_the_vaterland:	"Verteidigen Sie das Vaterland"
GER_defend_the_vaterland_desc:	"Angesichts der Bedrohungen, die sich an unseren Grenzen abzeichnen, müssen wir das Vaterland standhaft verteidigen! Um das deutsche Volk zu schützen, müssen wir unsere Stellungen befestigen und unsere Truppen zusammenziehen - [ROOT.GetNameDef] wird durchhalten und siegen!"
GER_uranverein:	"Uranverein"
GER_uranverein_desc:	"Unsere Nation muss Pionierarbeit bei der Erforschung der Atomenergie leisten und ihr Potenzial für uns nutzen. Wir haben einige der schärfsten Köpfe der Erde, um dies zu verfolgen und zum Zerstörer von Welten zu werden."
GER_adopt_new_panzer_doctrine:	"Neue Panzer-Doktrin verabschieden"
GER_adopt_new_panzer_doctrine_desc:	"$GER_army_innovation_desc$ "
GER_panzer_troops_school:	"Panzertruppen-Schule"
GER_panzer_troops_school_desc:	"Die Panzerdivisionen werden in jedem modernen Konflikt eine zentrale Rolle spielen, und wir müssen sicherstellen, dass unsere Panzertruppen an der Spitze der militärischen Innovation stehen. Durch eine rigorose Ausbildung und erfahrene Ausbilder werden wir die für den Sieg notwendigen Elite-Panzertruppen heranziehen."
GER_advanced_panzer_research:	"Fortschrittliche Panzerforschung"
GER_advanced_panzer_research_desc:	"Die Bereitstellung von Ressourcen für die Erforschung und Entwicklung modernster Panzertechnologien wird zu neuen Erkenntnissen und bahnbrechenden Ergebnissen führen. Dies wird unsere Kampffähigkeiten verbessern und unsere Panzer noch tödlicher machen."
GER_expand_kummersdorfs_capacity:	"Erweitern Sie die Kapazität von Kummersdorf"
GER_expand_kummersdorfs_capacity_desc:	"Wir müssen bei der Panzerentwicklung die Führung übernehmen und Innovationen vorantreiben, um unsere Dominanz auf dem Schlachtfeld zu sichern. Durch das Studium feindlicher Panzerkonstruktionen in den Einrichtungen in Kummerdorf und den Einsatz von Spitzentechnologie werden wir Fortschritte erzielen, die alle Rivalen übertreffen."
GER_combined_arms:	"Kombinierte Bewaffnung"
GER_combined_arms_desc:	"Die rasanten technologischen Fortschritte haben die Art und Weise der Kriegsführung verändert, was wir uns zunutze machen sollten. Indem wir uns das Prinzip der kombinierten Waffen zu eigen machen und eine umfassende Strategie zur Synchronisierung von Infanterie, Panzerung und Luftunterstützung entwickeln, werden wir eine beeindruckende Kampftruppe schaffen und ihre Vorherrschaft sichern."
GER_expanding_the_luftwaffe:	"Ausweitung der Luftwaffe"
GER_expanding_the_luftwaffe_desc:	"$air_innovation_desc$ "
GER_aeronautical_research_institute:	"Luftfahrttechnisches Forschungsinstitut"
GER_aeronautical_research_institute_desc:	"Die Luftkriegsführung hat seit dem Ersten Weltkrieg an Bedeutung und Komplexität zugenommen, und da der Versailler Vertrag uns verbot, eine Luftwaffe aufzustellen, sind wir in der Entwicklung von Flugzeugen im Rückstand. Um hier Abhilfe zu schaffen, müssen wir eine Luftfahrtforschungsanstalt aufbauen, um innovative Flugzeugzellen, Triebwerke und Waffen zu entwickeln, die uns die Vorherrschaft in der Luft sichern."
GER_dive_bombers:	"Sturzkampfbomber"
GER_dive_bombers_desc:	"$GER_tactical_air_effort_desc$ "
GER_tactical_bombers:	"Taktische Bomber"
GER_tactical_bombers_desc:	"$GER_strategic_air_effort_desc$ Die Nivellierung aller Fabriken außerhalb unserer Grenzen mit dem Boden wird garantieren, dass nur wir ein effektives Militär aufstellen können. "
GER_uralbomber_program:	"Uralbomber-Programm"
GER_uralbomber_program_desc:	"Wir werden den Sieg erringen, wenn wir unsere Feinde erreichen können, wo auch immer sie sich befinden. Die Entwicklung eines Flugzeugs, das bis zum Uralgebirge fliegen kann, würde fast jeden potenziellen Feind in unsere Reichweite bringen. "
GER_aerodynamic_research_institute:	"Aerodynamisches Forschungsinstitut"
GER_aerodynamic_research_institute_desc:	"[ROOT.GetNameDefCap] ist in letzter Zeit zum Synonym für Innovation in der Luftfahrt geworden, da wir stark in unsere Luftwaffe investiert haben. Wir müssen weiterhin Ressourcen in diesen Bereich stecken, um der Konkurrenz voraus zu sein. Die Finanzierung des Aerodynamischen Forschungsinstituts und seiner Entwicklung neuer Antriebstechniken wird sicherlich neue Innovationen in unserem Streben nach der Beherrschung des Himmels hervorbringen."
GER_aerodynamic_research_institute_tt:	"Schaltet die MIO-Eigenschaft §Y$GER_mio_trait_aerodynamic_research_insitute$§! für alle §YPlane Designers§! frei. §RIt kann jedoch nur auf einen von ihnen angewendet werden§!."
GER_fallschirmjager:	"Fallschirmjäger"
GER_fallschirmjager_desc:	"Die strategische Bedeutung der Luftlandetruppen, der Fallschirmjäger, ist uns nicht entgangen. Die Ausbildung dieser Elite-Fallschirmjäger für den schnellen Einsatz hinter den feindlichen Linien wird ihre Vielseitigkeit und Kampffähigkeit verbessern und unsere Offensivfähigkeiten insgesamt stärken."
GER_unlocks_eben_emael_raid_tt:	"Schaltet §YFallschirmjäger Kommandounternehmen§! auf §YEben Emael§! frei"
GER_form_the_jagdwaffe:	"Bilden Sie die Jagdwaffe"
GER_form_the_jagdwaffe_desc:	"Wir sollten eine Jagdwaffe aufstellen, eine spezielle Truppe von Kampfflugzeugen, um die Luftüberlegenheit zu sichern. Mit einer Kombination aus rigorosem Training, fortschrittlicher Taktik und modernster Technologie werden wir den Himmel beherrschen und es unseren Landstreitkräften ermöglichen, über das Schlachtfeld zu rollen und den Boden zu erschüttern wie ein Donnerschlag."
GER_reorganize_the_luftwaffe:	"Reorganisieren Sie die Luftwaffe"
GER_reorganize_the_luftwaffe_desc:	"Obwohl unsere Luftwaffe erst vor wenigen Jahren gegründet wurde, hat sie sich zu einem beeindruckenden Instrument der nationalen Macht entwickelt. Allerdings haben die schnelle Gründung und der rasche Ausbau der Luftwaffe zu einigen strukturellen Mängeln in der Organisation geführt. Die Übertragung von mehr Verantwortung und die Eindämmung von Konkurrenzdenken und internen Machtkämpfen wird unsere Luftwaffe in die Lage versetzen, eine größere operative Effizienz und Effektivität zu erreichen."
GER_solve_the_logistical_bottlenecks:	"Lösen Sie die logistischen Engpässe"
GER_solve_the_logistical_bottlenecks_desc:	"Nachdem die Reorganisation der Luftwaffe abgeschlossen ist, können wir unsere Aufmerksamkeit auf das ineffektive Logistiksystem und die Lieferketten richten. Die Rationalisierung dieser Bereiche wird mehr Personal für andere Aufgaben freisetzen und eine schnellere Reparatur unserer Flugzeuge ermöglichen."
GER_experimental_rotorcrafts:	"Experimentelle Drehflügler"
GER_experimental_rotorcrafts_desc:	"Durch Investitionen in modernste Designs und die Entwicklung neuer Technologien streben wir die Entwicklung früher Prototypen an, die die Mobilität aus der Luft auf dem Schlachtfeld revolutionieren werden. Wir streben danach, die Möglichkeiten des senkrechten Starts und der senkrechten Landung mit sogenannten Hubschraubern effizient zu verändern."
GER_develop_the_knickebein:	"Entwickeln Sie das Knickebein"
GER_develop_the_knickebein_desc:	"Durch den Einsatz eines ausgeklügelten Funknavigationssystems haben wir einen Weg gefunden, unsere Flugzeuge so zu steuern, dass sie genauere Präzisionsbombardements durchführen können. Durch den Einsatz dieser neuen Technologien könnten wir in der Lage sein, die Fabriken des Feindes effektiver dem Erdboden gleichzumachen - sogar bei Nacht."
GER_defense_of_the_reich:	"Verteidigung des [GetDefenseofGermanyName]"
GER_defense_of_the_reich_fascism:	"des Reiches"
GER_defense_of_the_reich_neutral:	"des Reiches"
GER_defense_of_the_reich_democratic:	"[GER.GetName]"
GER_defense_of_the_reich_communism:	"der proletarischen Revolution"
GER_defense_of_the_reich_desc:	"Wir müssen das Vaterland vor feindlichen Luftangriffen schützen. Die Sicherung des Luftraums über [ROOT.GetNameDef] und der Schutz der Industrien am Boden müssen Vorrang vor allem anderen haben!"
GER_construct_the_kammhuber_line:	"Bauen Sie die Kammhuber-Linie auf"
GER_construct_the_kammhuber_line_desc:	"Wir können nicht zulassen, dass feindliche Bomber und Jäger frei am Himmel über [ROOT.GetNameDef] umherstreifen. Wir müssen eine Verteidigungslinie entlang der französischen Küste errichten, um sie abfangen zu können, bevor sie unser Kernland erreichen."
GER_controls_atlantic_coast_brittany_finnmark_tt:	"§Y[ROOT.GetName]§! oder ein deutscher Untertan kontrolliert vollständig einen nicht-deutschen Staat entlang der §YAtlantikküste§! von §Y[14.GetName]§! bis §Y[925.GetName]§!."
GER_controls_atlantic_coast_brittany_finnmark_effects_tt:	"Jeder kontrollierte Staat entlang der §YEuropäischen Atlantikküste§!: Fügen Sie §G1§! §Y$anti_air_building$§! hinzu. Aktuelle Auswirkung:"
GER_establish_night_fighter_squadrons:	"Nachtjagdstaffeln aufstellen"
GER_establish_night_fighter_squadrons_desc:	"Als nächsten Schritt in unserer Verteidigung des Vaterlandes sollten wir Nachtjagdgeschwader aufstellen. Durch den Einsatz von luftgestützten Radargeräten werden sie Tag und Nacht effektiv arbeiten, um unseren Himmel vom Feind frei zu halten."
GER_torpedobomber:	"Torpedobomber"
GER_torpedobomber_desc:	"$naval_air_effort_desc$ "
GER_establish_carrier_groups:	"Trägergruppen aufstellen"
GER_establish_carrier_groups_desc:	"Da wir entschlossen sind, eine unübertroffene Flugzeugträgerflotte zu schaffen, müssen wir unsere Piloten darauf vorbereiten, von diesen Decks aus zu operieren. Unsere Flugzeuge werden den Himmel über Meer und Land beherrschen!"
GER_rocketry_innovations:	"Innovationen in der Raketentechnik"
GER_rocketry_innovations_desc:	"Der nächste große Sprung in der Luftfahrtentwicklung ist zum Greifen nah! Unsere Ingenieure haben unermüdlich an der Perfektionierung des Raketenantriebs gearbeitet, der für unser Streben nach der Beherrschung des Himmels von großer Bedeutung und Nutzen sein könnte."
GER_amerikabomber:	"Amerikabomber"
GER_amerikabomber_desc:	"Wir müssen uns voll und ganz dem ehrgeizigen Ziel verschreiben, den Himmel zu beherrschen und ein Langstreckenflugzeug zu entwickeln, das in der Lage ist, unsere Feinde zu schockieren, indem es Ziele tief in ihrem Territorium angreift - oder den Atlantik zu überqueren, um allen zu zeigen, dass niemand vor unserer Reichweite sicher ist."
GER_war_with_american_country_tt:	"Im Krieg mit einem §YAmerican§! Land"
GER_unlocks_statue_of_liberty_raid_tt:	"Schaltet §YLuftangriff§! auf §Ydie Freiheitsstatue§! frei, wenn Sie sich im Krieg mit §Y[USA.GetNameWithFlag]§! befinden"
GER_strengthen_the_kriegsmarine:	"Verstärken Sie die Kriegsmarine"
GER_strengthen_the_kriegsmarine_desc:	"$GER_naval_rearmament_desc$ "
GER_expand_kriegsmarinewerft:	"Erweitern Sie die [GetKriegsmarinewerftName] "
GER_expand_kriegsmarinewerft_fascism:	"Kriegsmarinewerft "
GER_expand_kriegsmarinewerft_neutrality:	"Kaiserliche Marinewerft "
GER_expand_kriegsmarinewerft_democratic:	"Marinewerft "
GER_expand_kriegsmarinewerft_communism:	"Volksmarinewerft "
GER_expand_kriegsmarinewerft_desc:	"Wir müssen unsere Anstrengungen verdoppeln, um eine Marine aufzubauen, die es mit der unserer Feinde aufnehmen kann. Durch den Einsatz von Spitzentechnologien im Schiffbau und den Bau von hochmodernen Kriegsschiffen werden wir unseren Feinden die Kontrolle über die hohe See entreißen. "
GER_construct_aircraft_carriers:	"Flugzeugträger konstruieren"
GER_construct_aircraft_carriers_desc:	"Jede große und moderne Marine, die ihren Namen verdient, muss Flugzeugträger in ihrer Flotte haben. Diese Schiffe werden für die Beherrschung der Meere immer wichtiger. Um also nicht hinter unsere Feinde zurückzufallen, müssen wir ein ehrgeiziges Programm zum Bau von Flugzeugträgern starten."
GER_carrier_variants_tt:	"Erstellen Sie Flugzeugträger §YVariante§! und §YProduktionslinie§! je nach §Y$early_ship_hull_carrier$§!, §Y$basic_ship_hull_carrier$§!, oder §Y$ship_hull_carrier_2$§! Technologie. Aktueller Effekt:\n"
GER_grosskampfschiff_construction:	"Großkampfschiff Construction"
GER_grosskampfschiff_construction_desc:	"$GER_pride_of_the_modern_germany_desc$ "
GER_high_seas_fleet:	"Die Hochseeflotte"
GER_high_seas_fleet_desc:	"Unser ehrgeiziges Ziel kann nicht weniger sein, als [ROOT.GetNameDef] zu einer echten Weltmacht zu machen. Zu diesem Zweck müssen wir die Hochseeflotte wiederbeleben, die es einst fast mit der Dominanz der Royal Navy auf den Weltmeeren aufnehmen konnte."
GER_unlock_trade_interdiction_tt:	"Schaltet §Y$GER_trade_interdiction$§! Fokus frei."
GER_re_establish_the_seekriegsleitung:	"Wiedererrichtung der Seekriegsleitung"
GER_re_establish_the_seekriegsleitung_desc:	"Die Wiedereinführung der Seekriegsleitung, des Marinekommandos, wird die Planung und Umsetzung von Marinebefehlen und den direkten Einsatz effektivieren."
GER_marinestosstrupp:	"Bilden Sie den Marine-Stosstrupp"
GER_marinestosstrupp_desc:	"Wir müssen eine Marine-Infanterie-Einheit bilden, die so genannten Marine-Stosstruppen, die in der Lage sind, waghalsige Marine-Invasionen durchzuführen und die gegnerische Küstenverteidigung zu durchbrechen, wenn wir unsere Macht in Übersee ausbauen wollen."
GER_atlantic_naval_bases:	"Atlantische Marinestützpunkte"
GER_atlantic_naval_bases_desc:	"In Anerkennung der strategischen Bedeutung der atlantischen Küstenregionen und als Teil unserer Bemühungen, die Vorherrschaft über den Atlantischen Ozean zu erlangen, müssen wir dem Ausbau und der Modernisierung der Marinestützpunkte im Streben nach maritimer Überlegenheit Vorrang einräumen."
GER_naval_bases_along_atlantic_coast_tt:	"Jeder §Y[ROOT.GetName]§! oder von Deutschland kontrollierte Staat mit einem §Y$naval_base$§! entlang der §YEuropäischen Atlantikküste§!: Fügen Sie §G1§! §Y$naval_base$§! hinzu. Fügen Sie §G1§! §Y$coastal_bunker$§! hinzu. Aktuelle Auswirkung:"
GER_atlantic_naval_dominance:	"Dominanz der Atlantikflotte"
GER_atlantic_naval_dominance_desc:	"Um unsere Dominanz im Atlantischen Ozean zu sichern, müssen wir unseren Aktionsradius noch weiter ausdehnen und unsere Marinepräsenz von Küste zu Küste ausbauen."
GER_controls_an_atantic_island_tt:	"§Y[ROOT.GetName]§! oder deutsche Untertanen eine Insel im Nordatlantik vollständig kontrollieren"
GER_naval_bases_on_atlantic_islands_tt:	"Jede §Y[ROOT.GetName]§! oder von deutschen Untertanen kontrollierte Insel mit einem §Y$naval_base$§! im §YNordatlantik§!: Fügen Sie §G1§! §Y$naval_base$§! hinzu. Hinzufügen von §G1§! §Y$coastal_bunker$§!. Aktueller Effekt:"
GER_cruiser_warfare:	"Kreuzer-Kriegsführung"
GER_cruiser_warfare_desc:	"Unsere leichten Kreuzer können nützlicher sein, als nur als Eskorte eingesetzt zu werden. Wir müssen sie auf die offene See schicken, um die Konvois unserer Feinde zu stören und ihre industriellen Kapazitäten zu lähmen."
GER_panzerschiff_raiders:	"Panzerschiff-Jäger"
GER_panzerschiff_raiders_desc:	"Wir sollten unsere schwereren Schiffe in unserer Handelsverhinderungsstrategie einsetzen. Diese Schiffe können hart zuschlagen und sich zurückziehen, bevor die Hauptkampfflotte des Gegners überhaupt die Chance hat, den Hafen zu verlassen."
GER_wolfpack_tactics:	"Wolfsrudel-Taktik"
GER_wolfpack_tactics_desc:	"Die Idee, Konvois mit U-Booten anzugreifen, ist nicht neu und wurde bereits im Ersten Weltkrieg eingesetzt, aber es wurde eine neue Taktik vorgeschlagen. Dieser neue Ansatz sieht vor, dass unsere U-Boote in einem Rudel zusammenarbeiten, um Handelsschiffe aufzuspüren und zu versenken. Dies könnte der Schlüssel dazu sein, dem Feind die Rohstoffe zu entziehen und ihm die Möglichkeit zu nehmen, den Krieg fortzusetzen."
GER_u_boat_efforts:	"U-Boot-Bemühungen"
GER_u_boat_efforts_desc:	"Die Erfolge der Wolfpack-Taktik haben das Oberkommando der Marine davon überzeugt, diesen Ansatz zu verdoppeln und sich auf den Bau von mehr und besseren U-Booten zu konzentrieren, um unseren Sieg auf hoher See zu sichern."
GER_unrestricted_convoy_raiding:	"Uneingeschränkte Konvoiüberfälle"
GER_unrestricted_convoy_raiding_desc:	"Wir müssen die Effizienz unserer Konvoiüberfälle verdoppeln und unsere Planungsbemühungen verdreifachen, um die Meere vollständig unter unsere Kontrolle zu bringen!"
GER_unlock_plan_z_tt:	"Schaltet §Y$GER_plan_z$§! Fokus frei."
GER_with_panzerschiff_completed_tt:	"Mit §Y$GER_panzerschiff_raiders$§! abgeschlossen:"
GER_with_u_boat_efforts_completed_tt:	"Mit §Y$GER_u_boat_efforts$§! abgeschlossen:"
GER_seeherrschaft:	"Seeherrschaft"
GER_seeherrschaft_desc:	"Wir sind auf dem besten Weg, die unbestrittenen Herren der Ozeane zu werden und unsere Vision der Seeherrschaft zu verwirklichen. Jetzt regiert [ROOT.GetNameDef] die Wellen!"
GER_remilitarize_the_rhineland:	"Remilitarisieren Sie das Rheinland"
GER_remilitarize_the_rhineland_desc:	"$GER_rhineland_desc$"
GER_legion_condor:	"Legion Kondor"
GER_legion_condor_desc:	"Während der Bürgerkrieg auf der iberischen Halbinsel tobt, bietet sich uns eine große Chance. Indem wir ihnen so viele Freiwillige wie möglich schicken, können wir nicht nur sicherstellen, dass die richtige Seite gewinnt, sondern unseren Truppen auch Erfahrung auf dem Schlachtfeld bieten und die [SPR.GetAdjective] Menschen, die unsere Ideale teilen, näher an uns binden."
GER_reorganize_secret_services:	"Geheimdienste reorganisieren"
GER_reorganize_secret_services_desc:	"$GER_wilhelm_canaris$ haben sich als ineffizient erwiesen, oder sogar als absolut illoyal gegenüber der aktuellen Regierung, wenn man den Gerüchten trauen darf. Wir müssen ihn absetzen und die Abwehr zu einer kompetenteren Institution umstrukturieren."
GER_fuhrerprinzip:	"Führerprinzip"
GER_fuhrerprinzip_desc:	"Der Führer erwartet von denjenigen, die ihm am nächsten stehen, volle Loyalität. Diejenigen, die zu den wenigen gehören, denen er vertraut, müssen jedoch bedenken, dass keiner von ihnen mehr zählt als die Steine, auf denen er steht. Ein einziger Schritt, der aus der Reihe tanzt, oder das Versäumnis, nach den Wünschen des Führers zu handeln, kann schlimme Folgen haben. Der Führer allein wird unseren Kurs bestimmen."
GER_party_chancellor_hess:	"Parteikanzler Heß"
GER_party_chancellor_hess_desc:	"Rudolf Hess ist seit langem ein aktives Mitglied der Partei. Er genießt das Vertrauen mehrerer hochrangiger Mitglieder der politischen Elite, darunter auch des Führers selbst. Es ist nur recht und billig, dass ihm das Amt des Parteikanzlers übertragen wird."
GER_party_chancellor_bormann:	"Parteikanzler Bormann"
GER_party_chancellor_bormann_desc:	"Martin Bormann hat sich in seiner Position als Privatsekretär des stellvertretenden Führers als äußerst geeignet erwiesen. Da er früher die Hilfskasse der NSDAP geleitet hat, verfügt er auch über ein umfangreiches Finanzwissen und wäre der perfekte Parteikanzler."
GER_mega_reichskommissariats:	"Mega-Reichskommissariat"
GER_mega_reichskommissariats_desc:	"Da sich die Reichskommisariate als äußerst nützlich erwiesen haben, ist es nicht verwunderlich, dass unser Führer [ROOT.GetLeader] viel Zeit damit verbracht hat, über weitere Verbesserungen nachzudenken. Eines der Probleme mit den Reichskommisariaten ist die wachsende Zahl von ihnen und damit auch der wachsende Verwaltungsaufwand, der für ihre Verwaltung erforderlich ist. Sicherlich könnten einige von ihnen zusammengelegt werden..."
GER_optimize_reich_labour_service:	"Optimieren Sie den Reichsarbeitsdienst"
GER_optimize_reich_labour_service_desc:	"Der Reichsarbeitsdienst erfüllt einen wichtigen Zweck, indem er unsere Bevölkerung beschäftigt, aber wir glauben, dass er für mehr genutzt werden kann. Wir könnten unsere Nutzung des RAD optimieren, um sicherzustellen, dass wir in allen Bereichen, Arbeit, Propaganda und Kriegsvorbereitung, das Beste aus ihm herausholen."
GER_ascension_of_himmler:	"$GER_inner_circle_member_title$ Himmler"
GER_ascension_of_himmler_desc:	"Unter der Organisation und Führung von Heinrich Himmler hat sich die SS von ihren eher kleinen Anfängen zu einer bedeutenden Kraft in unserem Land entwickelt. Seine Beförderung würde es uns ermöglichen, seine Fähigkeiten weiter zu nutzen und die SS in ihrer jetzigen Form besser einzusetzen."
GER_expand_ss_recruitment:	"SS-Rekrutierung ausweiten"
GER_expand_ss_recruitment_desc:	"Die Anforderungen, um der SS beizutreten, sind hoch, und der Prozess selbst wurde als durch ein Nadelöhr gehen beschrieben. Während die Anforderungen hoch bleiben müssen, um eine qualitativ hochwertige Truppe zu gewährleisten, kann die Rekrutierung auf andere Weise erweitert werden, ohne dass wir unsere Standards senken müssen."
GER_create_four_militia_units_tt:	"Erstellen Sie §Y4 Deutsche Miliz§! Einheiten"
GER_create_two_motorized_units_tt:	"Erstellen Sie §Y2 Deutsche Motorisierte§! Einheiten"
GER_SS_recruitment_tt:	"Schaltet die Entscheidung frei: §Y$SS_recruitment$§!"
GER_strengthen_the_waffen_ss:	"Verstärken Sie die Waffen-SS"
GER_strengthen_the_waffen_ss_desc:	"Die Waffen-SS, der Kampfverband der SS, hat sich im Kampf als wertvoller Aktivposten für uns erwiesen. Obwohl es sich technisch gesehen um eine paramilitärische Einheit handelt, sind wir der festen Überzeugung, dass sie mit mehr Mitteln genauso effektiv operieren könnte wie unsere reguläre Armee."
GER_create_two_militia_units_tt:	"Erstellen Sie §Y2 Deutsche Miliz§! Einheiten"
GER_create_one_motorized_units_tt:	"Erstellen Sie §Y1 Deutsche Motorisierte§! Einheit"
GER_create_two_light_panzer_units_tt:	"Erstellen Sie §Y2 Deutsche Leichte Panzer§! Einheiten"
GER_create_two_medium_panzer_units_tt:	"Erstellen Sie §Y2 Deutsche Mittlere Panzereinheiten§! Einheiten"
GER_expand_ss_security_duties:	"Ausweitung der SS-Sicherheitsaufgaben"
GER_expand_ss_security_duties_desc:	"Da die SS unter Heinrich Himmlers Führung stetig wächst, ist es an der Zeit, dass sie eine größere Verantwortung für unsere Sicherheit übernimmt. Indem wir ihre Aufgaben ausweiten, können wir Ressourcen für andere Zwecke freisetzen."
GER_hegemony_of_the_ss:	"Hegemonie der SS"
GER_hegemony_of_the_ss_desc:	"Dank verstärkter Rekrutierung und besserer Ausrüstung ist die SS heute eine beeindruckende Macht auf dem Schlachtfeld. Unter der Führung von Himmler hat sich die Gruppe zu einem unserer wichtigsten Aktivposten entwickelt, der zu weitaus mehr fähig ist, als wir erwarten. Es war eine weise Entscheidung, ihnen die Macht anzuvertrauen, die sie jetzt haben. Wir müssen sie auch in Zukunft mit den Mitteln ausstatten, die für den Erfolg notwendig sind."
GER_expand_gestapo:	"Gestapo ausbauen"
GER_expand_gestapo_desc:	"Die Gestapo hat sich im Umgang mit der politischen Opposition und anderen Unruhestiftern als besonders geeignet erwiesen. Wenn wir sie ausbauen, können wir sicherstellen, dass unsere Bevölkerung im Einklang mit den geltenden Gesetzen und Erwartungen handelt."
GER_absorb_the_abwehr:	"Absorbieren Sie die Abwehr"
GER_absorb_the_abwehr_desc:	"Die Trennung der Abwehr von der Armeeführung war eine Entscheidung, die zu dem Zeitpunkt, als sie getroffen wurde, sinnvoll war. In der aktuellen Situation scheint es, dass das Gegenteil der Fall sein könnte. Wir sollten die Übernahme der Abwehr in Betracht ziehen."
GER_innovative_warfare:	"Innovative Kriegsführung"
GER_innovative_warfare_desc:	"Unsere Methoden der Kriegsführung müssen sich ständig weiterentwickeln, sonst laufen wir Gefahr, zu stagnieren. Nur durch ständige Weiterentwicklung und Veränderung können wir verhindern, dass unsere Feinde unsere Taktiken und Technologien durchschauen."
GER_form_organization_todt:	"Organisation bilden Todt"
GER_form_organization_todt_desc:	"Es gibt zwar einige große Bauprojekte, die der Führer gerne verwirklicht sehen würde, aber die meisten müssen warten. Vor allem [ROOT.GetNameDef] braucht dringend mehr Militärindustrie. Wenn die Planung in den Händen von Fritz Todt liegt, sind wir sicher, dass das Ergebnis gut sein wird."
GER_employ_philipp_holzmann:	"Arbeitgeber Philipp Holzmann"
GER_employ_philipp_holzmann_desc:	"Albert Speer hat die Idee eingebracht, die Philipp Holzmann AG für die verschiedenen großen Bauprojekte zu beauftragen, die der Führer in Angriff nehmen möchte. Das Unternehmen hat einen guten Ruf und eine lange Geschichte, da es architektonische Meisterwerke wie das Hamburger Rathaus und den ursprünglichen Reichstag gebaut hat. Sie werden gut zu unseren Bedürfnissen passen!"
GER_prioritize_the_four_year_plan:	"Setzen Sie Prioritäten für den Vierjahresplan"
GER_prioritize_the_four_year_plan_desc:	"Wir wussten von Anfang an, dass der Vierjahresplan von [ROOT.GetLeader] ein notwendiger Schritt sein würde, um die Nation auf den Krieg vorzubereiten. Da der Führer selbst ein sehr beschäftigter Mann ist, wird jemand gebraucht, der die erforderlichen Maßnahmen überwacht und koordiniert."
GER_plenipotentiary_of_the_four_year_plan:	"Bevollmächtigter des Vierjahresplans"
GER_plenipotentiary_of_the_four_year_plan_desc:	"Es hat sich gezeigt, dass die Arbeit zur Überwachung und Umsetzung des Vierjahresplans umfangreicher war als ursprünglich angenommen. Indem wir Hermann Göring zum Reichsbevollmächtigten machen, geben wir einem einzelnen Mann viel Macht, aber was seine großen Ergebnisse angeht, ist sich der Führer sicher. Hermann Göring ist zu nützlich, als dass wir ihm in dieser Angelegenheit nicht die vollen diplomatischen Rechte einräumen würden."
GER_autonomous_organization_todt:	"Autonome Organisation Todt"
GER_autonomous_organization_todt_desc:	"Die Initiative von Fritz Todt, die Organisation Todt, hat sich als äußerst effektiv erwiesen. Die Bauprojekte werden in einem Maße zügig abgeschlossen, dass sogar der Führer selbst zufrieden ist. Mit dem Status eines Reichsbevollmächtigten für Rüstung und Kriegsproduktion könnte Todt ein echter Gewinn für unser Land werden."
GER_plenipotentiary_of_armaments:	"Bevollmächtigter für Rüstung"
GER_plenipotentiary_of_armaments_desc:	"Es wird immer deutlicher, dass jemand die übergreifende Verantwortung für die Versorgung der Wehrmacht mit dem Notwendigen übernehmen muss. Albert Speer hat bei seinen Bemühungen um die Versorgung der Wehrmacht vielversprechende Ergebnisse vorzuweisen. Angesichts seines Status als Reichsbevollmächtigter für Rüstung und Kriegsproduktion könnte dieser Mann wunderbare Ergebnisse erzielen!"
GER_integration_of_puppet_economies:	"Integration von Marionettenwirtschaften"
GER_integration_of_puppet_economies_desc:	"Wenn wir uns ansehen, wie es unseren Untertanen geht, wird deutlich, wie schlecht sie ihre Wirtschaft führen. Das betrifft natürlich in erster Linie sie selbst, aber im Umkehrschluss ziehen sie auch unsere Wirtschaft nach unten. Der Führer verlangt, dass etwas gegen dieses Problem unternommen wird!"
GER_ministry_of_public_enlightenment:	"Ministerium für Volksaufklärung"
GER_ministry_of_public_enlightenment_desc:	"Das Propagandaministerium hat uns in letzter Zeit gute Dienste geleistet. Durch die Umbenennung des Propagandaministeriums in Ministerium für Volksaufklärung sollten wir in der Lage sein, seine Aufgaben zu erweitern und die Mittel aufzustocken, ohne dass es zu Problemen kommt."
GER_fund_the_film_department:	"Finanzieren Sie die Filmabteilung"
GER_fund_the_film_department_desc:	"Der Film hat sich als mächtiges Instrument zur Inspiration und Führung des Volkes erwiesen. Indem wir patriotische Filme produzieren und fördern, werden wir unser Volk anspornen, sich voll und ganz unserem glorreichen [ROOT.GetName] zu widmen!"
GER_the_triumphant_will:	"Der triumphale Wille"
GER_the_triumphant_will_desc:	"$GER_improve_national_spirit_desc$"
GER_propaganda_master:	"Meister der Propaganda"
GER_propaganda_master_desc:	"Wir hatten keine Zweifel, als wir Joseph Goebbles zu unserem Propagandaminister ernannten. Er war bereits ein versierter Redner und Schriftsteller. Jetzt, da er Ideen zur Verbesserung unserer Geheimdienstorganisation äußert, haben wir volles Vertrauen, dass die Umsetzung dieser Ideen in unserem besten Interesse liegt."
GER_bribe_senior_officers:	"Bestechung hoher Offiziere"
GER_bribe_senior_officers_desc:	"Um die Loyalität unserer Führungsoffiziere gegenüber dem Führer sicherzustellen, sollten wir erwägen, Loyalität und Gehorsam zu belohnen. Indem wir ihnen Geld, Land und Steuerbefreiungen anbieten, stellen wir sicher, dass sie nicht nur loyal bleiben, sondern auch, dass sie in ihrer Spur bleiben und ihren Führer nicht in Frage stellen."
GER_army_indoctrination:	"Indoktrination der Armee"
GER_army_indoctrination_desc:	"Bestechung und monetäre Anreize sind für unsere hochrangigen Offiziere und ausgewählte Personen in der Wehrmacht sehr hilfreich. Aber für den einfachen Soldaten können wir uns nicht auf Bestechungsgelder verlassen, sonst liegt unsere Wirtschaft in Trümmern. Sie durch Propaganda dazu zu bringen, unseren Entscheidungen voll und ganz zuzustimmen, könnte die sinnvollere Vorgehensweise sein."
GER_autonomy_in_the_kriegsschulen:	"Autonomie in den Kriegsschulen"
GER_autonomy_in_the_kriegsschulen_desc:	"Die Kriegsschulen haben in unserem Land eine lange Tradition. Auch wenn es verlockend ist, die Ausbildung an den Akademien bis ins kleinste Detail zu steuern und zu reglementieren, wäre es vielleicht besser, wenn wir den Schulen die Möglichkeit geben, die bestmögliche Ausbildung für unsere zukünftigen Offiziere zu gewährleisten."
GER_strafbataillon:	"Strafbataillon"
GER_strafbataillon_desc:	"Nachdem wir Maßnahmen zur Indoktrination in der Armee ergriffen haben, können wir sie nun nicht nur dazu nutzen, unsere Soldaten loyal zu machen. Durch den Einsatz von Strafbataillonen können wir die gewünschten nationalistischen Gefühle in diesen Individuen fördern, indem wir sie sowohl indoktrinieren als auch dem Vaterland dienen lassen!"
GER_expand_the_truppenschulen:	"Erweitern Sie die Truppenschulen"
GER_expand_the_truppenschulen_desc:	"Um dem steigenden Bedarf an spezialisierten Offizieren gerecht zu werden, müssen unsere Truppenschulen erheblich ausgebaut werden. Die bestmögliche Ausbildung unserer Offiziersanwärter wird unseren Erfolg auf dem Schlachtfeld sicherstellen."
GER_demonstration_of_military_achievements:	"Demonstration militärischer Errungenschaften"
GER_demonstration_of_military_achievements_desc:	"Unsere Geschichte ist durchdrungen von großen militärischen Erfolgen. Indem wir anerkennen, dass das, was unsere Truppen derzeit erreicht haben, eine weitere dieser großen militärischen Leistungen sein wird, könnten wir die Moral steigern und ihre Loyalität uns gegenüber weiter erhöhen."
GER_demonstration_of_military_achievements_trigger:	"Einer der folgenden Punkte muss zutreffen:\n Mehr als §Y2§! Untertanenstaaten\n Mehr als §Y19§! besetzte Staaten in §YEurope§! "
GER_country_leader_change_blocks_progress_demonstration_military_achievement_tt:	"§Y$GER_demonstration_of_military_achievements$§! nach Abschluss von §Y$GER_an_invincible_army$§! zu ändern, blockiert §Y$GER_an_invincible_army$§! und §Y$GER_the_supreme_leader$§!."
GER_an_invincible_army:	"Deutsche Armee, unbesiegbar"
GER_an_invincible_army_desc:	"Durch die vielen Errungenschaften und Siege, die unsere Armee auf dem Schlachtfeld errungen hat, haben wir der Welt bewiesen, dass die [ROOT.GetAdjective] Armee wirklich unbesiegbar ist, egal was feindliche Demagogen sagen!"
GER_country_leader_change_blocks_progress_invincible_army_tt:	"§Wenn Sie nach Abschluss von §Y$GER_an_invincible_army$§! den Anführer des Landes abhängen, kann §Y$GER_the_supreme_leader$§! nicht abgeschlossen werden§!"
GER_an_invincible_army_trigger:	"Eine der folgenden Aussagen muss wahr sein:\n Mehr als §Y5§! Subjektstaaten\n Mehr als §Y49§! besetzte Staaten in §YEurope§!"
GER_the_supreme_leader_trigger:	"[ROOT.GetNameDefCap] hat §YCapitulated§! mehr als §Y2 Major§! Countries"
GER_the_supreme_leader:	"Der Oberste Führer"
GER_the_supreme_leader_desc:	"Durch gezielte Reformen und Wiederbelebungsprogramme hat die Loyalität der Wehrmacht gegenüber [ROOT.GetLeader] und seiner Sache einen neuen Höhepunkt erreicht. Dieser Trend der vollen Unterstützung für unseren Führer und unser Vaterland muss fortgesetzt werden."
GER_a_strong_successor:	"Ein starker Nachfolger"
GER_a_strong_successor_desc:	"Eine Wachablösung steht an und ein neuer Führer muss aufsteigen. Wir haben die Gelegenheit, einen neuen Führer zu installieren, der unsere Bestrebungen für [ROOT.GetNameDef] widerspiegelt. Dieser Wechsel wird unseren Bemühungen um eine bessere Zukunft für das deutsche Volk neuen Schwung verleihen."
GER_loyalty_to_the_fuhrer:	"Loyalität gegenüber dem Führer"
GER_loyalty_to_the_fuhrer_desc:	"Wie bei der Volksabstimmung von 1934, als die Funktionen des Präsidenten und des Kanzlers zusammengelegt wurden, sind wir uns der immensen Unterstützung bewusst, die Hitler in unserer Bevölkerung genießt. Wir haben keine Anzeichen dafür gesehen, dass sich die politische Landschaft verändert hat, und deshalb werden wir den Führer weiterhin unterstützen."
GER_heed_von_neuraths_concerns:	"Beachten Sie von Neuraths Bedenken"
GER_heed_von_neuraths_concerns_desc:	"Einige hochrangige Mitglieder unseres Militärs, allen voran Konstantin von Neurath, haben Bedenken hinsichtlich unserer derzeitigen militärischen Taktik und Politik geäußert. Sie sind der Meinung, dass die recht aggressiven Pläne des Führers für das Militär nicht haltbar sind und dass unsere Armee angesichts des Risikos eines totalen Krieges, das sich ergeben könnte, wenn wir sie weiterverfolgen, noch nicht stark genug ist."
GER_reorganize_the_wehrmacht:	"Reorganisieren Sie die Wehrmacht"
GER_reorganize_the_wehrmacht_desc:	"Damit wir die ehrgeizigen Pläne des Führers verwirklichen können, muss innerhalb der Wehrmacht eine umfassende Reorganisation stattfinden. Zu viele der derzeitigen Führer verbringen ihre Zeit damit, kleinliche und unbegründete Bedenken zu äußern, anstatt die Befehle des Führers auszuführen. Nur wenn wir diese Personen beseitigen, können wir unsere Ziele erreichen!"
GER_anschluss_desc:	"Trotz der Worte von [AUS.GetAdjective] Politikern ist es klar, dass die größtenteils [GER.GetAdjective] sprechende Bevölkerung von [AUS.GetNameDef] sich nach der Wiedervereinigung mit dem Vaterland sehnt. Wir sollten Druck auf den korrupten Führer [AUS.GetLeader] ausüben, damit er zurücktritt und der Wille des Volkes durchgesetzt werden kann."
GER_anschluss_army_trigger_tt:	"Die §Y[ROOT.GetAdjective]§! Armee ist mindestens §Y[?global.deployed_manpower_ratio_needed_for_anschluss]§! mal größer als die §Y[AUS.GetAdjective]§! Armee, wenn man nur die gut ausgerüsteten Einheiten zählt.\n\nWir schätzen, dass wir [GetAnschlussProgress] dies"
GER_antischluss_progress_minimal:	"§RMinimal§! Fortschritte gemacht haben"
GER_antischluss_progress_moderate:	"made §OModerate§! headway towards"
GER_antischluss_progress_significant:	"made §YSignificant§! headway towards"
GER_antischluss_progress_complete:	"§GAchieved§!"
GER_austrian_army_does_not_exist:	"Derzeit hat §Y[AUS.GetnameDef]§! kein stehendes Heer."
GER_befriend_czechoslovakia:	"$GER_czech_friend$"
GER_befriend_czechoslovakia_desc:	"$GER_czech_friend_desc$"
GER_war_preparations:	"Kriegsvorbereitungen"
GER_war_preparations_desc:	"Um die Nation vollständig auf einen bevorstehenden Krieg vorzubereiten, müssen wir sicherstellen, dass nicht nur in der Wehrmacht, sondern auch in der Industrie und in der Infrastruktur Vorbereitungen getroffen werden."
GER_prepare_for_the_next_blockade_ww:	"Bereiten Sie sich auf die nächste Blockade vor"
GER_prepare_for_the_next_blockade_ww_desc:	"Wenn andere Länder das Ausmaß unserer Vorbereitungen erkennen, ist es unvermeidlich, dass einige Einwände erheben werden. Wir waren schon früher mit Blockaden konfrontiert und wissen, wie man damit umgeht. Wenn wir uns entsprechend vorbereiten, werden ihre Blockaden wenig bis gar keine Auswirkungen auf uns haben."
GER_subversive_infiltrators:	"Subversive Infiltratoren"
GER_subversive_infiltrators_desc:	"Intelligenz und Informationen über den Feind sind entscheidend für eine erfolgreiche Invasion. Da wir unsere Ausgaben in so vielen Bereichen erhöhen, ist es nur logisch, dass wir auch in die Verbesserung unserer Informationsbeschaffung investieren."
GER_integrate_czechoslovakia:	"Integrieren Sie die Tschechoslowakei"
GER_integrate_czechoslovakia_desc:	"Je mehr wir darüber erfahren, wie [CZE.GetNameDef] geführt wurde, desto deutlicher wird, dass sich die Menschen nach einer Veränderung sehnen. Die Integration in [GER.GetNameDef] würde diese dringend benötigte Veränderung bringen. Wir sollten eine Delegation mit einem Ultimatum losschicken."
GER_fate_of_czechoslovakia:	"$GER_end_of_czechoslovakia$"
GER_fate_of_czechoslovakia_desc:	"$GER_end_of_czechoslovakia_desc$"
GER_support_a_coup_in_liechtenstein:	"Unterstützen Sie einen Coup in Liechtenstein"
GER_support_a_coup_in_liechtenstein_desc:	"Wir haben erfahren, dass Gleichgesinnte in Liechtenstein planen, den Regenten des Kleinstaates zu stürzen. Ein Mann namens Alfons Goop ist gekommen, um uns um Unterstützung zu bitten, und versichert uns, dass auch wir davon profitieren werden."
GER_reassert_eastern_claims:	"$GER_demand_memel$"
GER_reassert_eastern_claims_desc:	"$GER_demand_memel_desc$"
GER_expand_claims_in_baltic:	"Claims im Baltikum ausbauen"
GER_expand_claims_in_baltic_desc:	"Historisch gesehen gibt es eine beträchtliche [ROOT.GetAdjective] Diaspora im Baltikum. Es ist in ihrem besten Interesse, genau wie in unserem, sie zurück nach [ROOT.GetNameDef] zu holen! "
GER_influence_the_baltics:	"Beeinflussen Sie das Baltikum"
GER_influence_the_baltics_desc:	"Die baltischen Staaten befinden sich in einer prekären Lage zwischen uns und [SOV.GetNameDef]. Mit einigen diplomatischen Bemühungen und für beide Seiten vorteilhaften Angeboten sollten wir in der Lage sein, sie näher an uns heranzuführen, ohne dass es zu Konflikten kommt."
GER_danzig_for_slovakia:	"$GER_danzig_vs_slovakia$"
GER_danzig_for_slovakia_desc:	"$GER_danzig_vs_slovakia_desc$"
GER_befriend_poland:	"$GER_poland_friend$"
GER_befriend_poland_desc:	"$GER_poland_friend_desc$ $GER_poland_friend_desc$"
GER_subjugate_romanian_economy:	"Unterwerfung der rumänischen Wirtschaft"
GER_subjugate_romanian_economy_desc:	"[ROM.GetNameDefCap] ist ein wichtiger Handelspartner für uns geworden. Die riesigen Mengen an Rohöl, die im Land gefördert werden, haben die Wirtschaft des Landes angekurbelt und sie beginnen nun, ihre Preise zu erhöhen. Sicherlich könnten wir etwas Druck ausüben, um einem alten, wiederkehrenden Kunden wie uns die besten Preise zu sichern?"
GER_influence_the_benelux:	"Beeinflussen Sie die Benelux-Länder"
GER_influence_the_benelux_desc:	"Die Benelux-Länder sind nicht nur für unsere weiteren Kriegsanstrengungen wichtig, sondern auch wegen ihrer industriellen Fähigkeiten und ihrer geografischen Lage. Obwohl wir sie wahrscheinlich leicht überrennen könnten, warum sollten wir sie nicht stattdessen auf unsere Seite ziehen?"
GER_operation_weserubung:	"$GER_weserubung$"
GER_operation_weserubung_desc:	"$GER_weserubung_desc$"
GER_utilize_the_nordliche_gesellschaft:	"Nutzen Sie die Nordische Gesellschaft "
GER_utilize_the_nordliche_gesellschaft_desc:	"Skandinavien ist traditionell neutral. Es hat keinen Sinn, eine weitere Front zu eröffnen, um zu versuchen, ihnen ihre Ressourcen zu nehmen, wenn wir sie auf diplomatischem Wege erlangen können. Daher sollten wir Alfred Rosenbergs Nordische Gesellschaft, eine Vereinigung zur Stärkung der deutsch-nordischen kulturellen und politischen Zusammenarbeit, nutzen, um gegenüber den nordischen Nationen positiv aufzutreten."
GER_form_rome_berlin_axis:	"Bilden Sie die Rom-Berlin-Achse"
GER_form_rome_berlin_axis_desc:	"$GER_italy_ally_desc$"
GER_invade_italy:	"Operation Alaric"
GER_invade_italy_desc:	"Während [ITA.GetNameDef] auf den ersten Blick ein guter potenzieller Verbündeter für uns zu sein scheint, kennen wir ihr wahres Gesicht. Zu Beginn des Ersten Weltkriegs weigerten sie sich, an unserer Seite zu kämpfen, und wandten sich 1915 sogar gegen uns, trotz unseres früheren Bündnisses. Wir haben damals unsere Lektion gelernt und werden den Fehler, ihnen zu vertrauen, nicht noch einmal begehen."
GER_alliance_with_spain:	"$GER_nationalist_spain_ally$"
GER_alliance_with_spain_desc:	"$GER_nationalist_spain_ally_desc$"
GER_operation_felix:	"Operation Felix"
GER_operation_felix_desc:	"Nachdem der Spanische Bürgerkrieg endlich vorbei ist, ist es an der Zeit, dass wir [118.GetName] aus dem [ENG.GetAdjective] herausreißen. Da wir jedoch nicht vom Meer aus angreifen können, müssen wir uns zunächst der Loyalität der [SPR.GetAdjective] versichern, damit wir ihr Territorium passieren können. In Anbetracht unserer Ideologien sollte es nicht schwer sein, sie zur Unterwerfung zu bewegen."
GER_secure_spain_desc:	"[SPR.GetNameDef] hat sich als ein äußerst unbeständiges Land erwiesen. Während sie mit ihrer Verwaltung kämpfen, sollten wir ihnen vielleicht eine helfende Hand anbieten? Zum jetzigen Zeitpunkt ist es sicher besser, unsere Marionettenregierung zu sein als das Chaos, an das sie gewöhnt sind."
GER_alliance_with_portugal:	"Allianz mit Portugal"
GER_alliance_with_portugal_desc:	"In der Vergangenheit hatten wir nicht die besten Beziehungen zu [POR.GetNameDef]. Doch obwohl wir im Ersten Weltkrieg erbitterte Feinde waren, scheinen sie ihre Meinung geändert zu haben. Nachdem wir die Nationalisten in Spanien unterstützt haben, glauben wir, dass es ideologische Gemeinsamkeiten geben könnte und dass wir mit den [POR.GetAdjective] zu einer Einigung kommen könnten."
GER_operation_isabella:	"Operation Isabella"
GER_operation_isabella_desc:	"Da nur noch [POR.GetNameDef] zwischen uns und der vollständigen Kontrolle über die Iberische Halbinsel steht, muss unser nächster Schritt darin bestehen, sie dazu zu bringen, sich uns zu unterwerfen. Die Beibehaltung der lokalen Regierung, aber die Sicherstellung ihrer Loyalität uns gegenüber sollte uns alles ermöglichen, was wir von ihnen in Bezug auf Land, Infrastruktur und militärische Strukturen benötigen."
GER_secure_portugal_desc:	"Während des Großen Krieges haben sich die [POR.GetAdjective] von der Propaganda unserer Gegner beeinflussen lassen und sich gegen uns gewandt. Einige unserer alten Schiffe liegen noch immer in ihren Häfen, und es wurde kein Wort über ihre Rückgabe verloren. Auch wenn sie jetzt freundlich genug erscheinen, können wir ihnen nicht trauen und wir sollten ihnen klar machen, dass es an der Zeit ist, sich unserer Herrschaft zu unterwerfen, wenn sie keinen Krieg wollen."
GER_operation_sea_lion:	"Operation Seelöwe"
GER_operation_sea_lion_desc:	"Die geografische Lage von [ENG.GetNameDef] hat sich als komplizierter Faktor in unseren derzeitigen Kriegsbemühungen erwiesen. Eine offensive Operation aus der Luft und von der See aus scheint die beste Vorgehensweise zu sein, um die [ENG.GetAdjective] endlich zu brechen!"
GER_operation_green:	"Operation Grün"
GER_operation_green_desc:	"Zur Unterstützung der Operation Sea Lion sollte unser operatives Kommando für die westliche Flanke eine umfassende Operation in Irland planen und die Besetzung der Insel vorbereiten, um sicherzustellen, dass die britischen Inseln vollständig unter unsere Kontrolle fallen können. Hierfür hat unser Oberkommando Fall Grün als detaillierten Operationsplan entworfen."
GER_challenge_the_monroe_doctrine:	"Stellen Sie die Monroe-Doktrin in Frage"
GER_challenge_the_monroe_doctrine_desc:	"Obwohl sie weit von uns entfernt sind, stehen uns einige der Länder in Mittel- und Südamerika ideologisch sehr nahe. Durch den Aufbau und die Pflege guter Beziehungen zu ihnen könnten wir beide sehr profitieren. Außerdem könnte es sich für die Zukunft als äußerst wertvoll erweisen, auf einem weiteren Kontinent Fuß zu fassen."
GER_shatter_usas_hegemony:	"Zerschlagen Sie [USA.GetAdjective] Hegemonie"
GER_shatter_usas_hegemony_desc:	"Die [USA.GetAdjective] haben lange Zeit viel zu viel Macht auf der internationalen Bühne erhalten. Während wir stärker werden, ist es jetzt an der Zeit, dass sie abtreten."
GER_challenge_the_monroe_doctrine_tt:	"Schaltet Entscheidungen zur §YDestabilisierung der Monroe-Doktrin§! frei. \n\nBenachrichtigt §Y[USA.GetNameDef]§! und erlaubt ihnen, zu versuchen, §RIntervene§!."
GER_challenge_the_monroe_doctrine_tt_2:	"Mindestens 7 Länder haben die §YMonroe-Doktrin§! noch aktiv"
GER_establish_protectorates_in_america:	"Errichten Sie Protektorate in Amerika"
GER_establish_protectorates_in_america_desc:	"Die Länder auf dem amerikanischen Kontinent werden schon zu lange auf eine Weise regiert, die nicht mit unseren Idealen übereinstimmt. Eine umfassende Reorganisation wird notwendig sein, um diese Gebiete nach einer langen Zeit der suboptimalen Verwaltung wieder gerade zu rücken."
GER_demands_to_sweden:	"Forderungen an Schweden"
GER_demands_to_sweden_desc:	"Die Stahlminen im Norden [SWE.GetNameDef] sind für unsere Militärindustrie lebenswichtig. Wir können es nicht dem Zufall überlassen, ob wir den Handel mit den [SWE.GetAdjective] aufrechterhalten können oder nicht. Diese Handelsroute muss so schnell wie möglich gesichert werden."
GER_the_swiss_gold:	"Das Schweizer Gold"
GER_the_swiss_gold_desc:	"Da die [SWI.GetAdjective] beschlossen haben, sich vorerst aus allen globalen Konflikten herauszuhalten, bieten sie eine perfekte Gelegenheit für Handel und Spionage. Wir sollten sicherstellen, dass wir Agenten in ihrem Land stationieren und ihr Potenzial voll ausschöpfen, wenn es darum geht, das Gold zu lagern, das wir erlangt haben."
GER_secure_finland:	"Sicheres Finnland"
GER_secure_finland_desc:	"[FIN.GetNameDefCap] hat eine lange Landgrenze mit [SOV.GetNameDef]. Der Zugang zu dieser Grenze gewährt uns eine weitere potentielle Front gegen die Rote Bedrohung im Osten und könnte sich als sehr wertvoll erweisen, sollten wir jemals gegen die [SOV.GetAdjective] kämpfen müssen."
GER_befriend_china:	"$GER_china_friend$"
GER_befriend_china_desc:	"$GER_china_friend_desc$"
GER_befriend_japan:	"$GER_japan_friend$"
GER_befriend_japan_desc:	"$GER_japan_friend_desc$"
GER_reclaim_former_african_colonies:	"Ehemalige afrikanische Kolonien zurückgewinnen"
GER_reclaim_former_african_colonies_desc:	"Asien ist nicht der einzige Ort, an dem wir früher Besitzungen hatten, die inzwischen verloren gegangen sind. Unsere Territorien in Afrika sind immer noch von Interesse für uns und wir sollten alles daran setzen, sie zurückzugewinnen und wieder zu integrieren."
GER_mittelafrika:	"Mittelafrika"
GER_mittelafrika_desc:	"Es gibt noch mehr Gebiete in Afrika, die für uns von Interesse sind, als die, die wir früher besaßen. Mit ihrem immensen natürlichen Reichtum würde die Region, die wir Mittelafrika nennen, [ROOT.GetNameDef] sehr profitieren."
GER_mittelafrika_revive_the_schutztruppe_tt:	"Schaltet §YSchutztruppe§! koloniale Milizen frei und entscheidet, §YRecruit§! und §YImprove§! sie in §YAfrika§! zu rekrutieren"
GER_asia_revive_the_schutztruppe_tt:	"Schaltet §YSchutztruppe§! koloniale Milizen und Entscheidungen zu §YRecruit§! und §YImprove§! sie in §YAsia§! frei"
GER_re_establish_german_control_over_qingdao:	"Wiederherstellung der deutschen Kontrolle über Qingdao"
GER_re_establish_german_control_over_qingdao_desc:	"1898 handelten wir einen Pachtvertrag für Qingdao aus. Dieses Pachtverhältnis wurde 1914 durch die [JAP.GetAdjective] Besetzung kurz nach Beginn des Großen Krieges beendet. Da das Gebiet heute nicht mehr besetzt ist, ist es vielleicht an der Zeit, dass wir sie an die Vereinbarung erinnern."
GER_claim_old_colonies_in_the_east:	"Alte Kolonien im Osten beanspruchen"
GER_claim_old_colonies_in_the_east_desc:	"Durch den Vertrag von Versailles wurden wir unserer Kolonien beraubt und diese an die alliierten Nationen verteilt. Unser Volk hat deutlich gemacht, dass es, genau wie wir, dies für unrechtmäßig hält. Im Rahmen der Aufnahme diplomatischer Beziehungen im Osten sollten wir auch den Versuch in Betracht ziehen, unsere Kolonien zurückzubekommen."
GER_ally_chiang_kai_shek:	"Verbündeter Chiang Kai-Shek"
GER_ally_chiang_kai_shek_desc:	"Unsere derzeitigen Unternehmungen in Ostasien können sich nicht nur für uns als nützlich erweisen. Indem wir uns mit [CHI.GetLeader] von [CHI.GetNameDef] verbünden und ihn auf unsere Seite ziehen, erweitern wir unseren Einflussbereich und erleichtern das koloniale Wachstum in dem Gebiet."
GER_japanese_naval_cooperation:	"Zusammenarbeit mit der japanischen Marine"
GER_japanese_naval_cooperation_desc:	"Wir haben viel von den [JAP.GetAdjective] zu lernen, insbesondere in Bezug auf die Marine. Durch den Aufbau einer gemeinsamen Technologie können wir sicherstellen, dass wir das Beste aus dem Wissen des anderen herausholen und weniger Zeit darauf verwenden, das neu zu erfinden, worauf wir als gemeinsame Streitmacht bereits Zugriff haben."
GER_negotiate_old_colonies_in_the_east:	"Alte Kolonien im Osten verhandeln"
GER_negotiate_old_colonies_in_the_east_desc:	"Viele unserer Kolonialbesitzungen in Ostasien wurden uns während des Großen Krieges von den [JAP.GetAdjective] abgenommen. Da wir uns jetzt aktiv um die Verbesserung unserer diplomatischen Beziehungen bemühen, könnten wir in der Lage sein, einige dieser Kolonien auf diplomatischem Wege zurückzuerobern."
GER_claim_old_colonies_in_the_east_tt:	"Schickt ein Ereignis an §YFaction Members§! und §Y[CHI.GetNameWithFlag]§! mit der Bitte um Kontrolle über ehemalige [GER.GetAdjective] Kolonien in §YSouth-East Asia§!. Sollten sie ablehnen oder das Gebiet von einem Land kontrolliert werden, das wir nicht als Verbündeten betrachten, erheben Sie §Yclaims§! auf die umstrittenen Staaten."
GER_negotiate_old_colonies_in_the_east_tt:	"Jeder der folgenden Staaten, den sie kontrollieren, wird an uns übertragen:\n§Y[684.GetName]\n[647.GetName]\n[646.GetName]\n[633.GetName]\n[743.GetName]\n[979.GetName]\n[737.GetName]\n[726.GetName]\n[725.GetName]\n[634.GetName]§!"
GER_sentinels_of_the_pacific:	"Wächter des Pazifiks"
GER_sentinels_of_the_pacific_desc:	"Unsere Stützpunkte im Pazifik sind im Allgemeinen unterentwickelt und schlecht ausgerüstet, um für unsere eigene Kriegsmarine oder die unserer Verbündeten von Nutzen zu sein. Es müssen erhebliche Anstrengungen unternommen werden, um sicherzustellen, dass in den relevanten Gebieten im Pazifik eine angemessene Infrastruktur für die Marine aufgebaut wird."
GER_sentinels_of_the_pacific_tt:	"Jeder kontrollierte Zustand der folgenden: §Y\n[336.GetName]\n[335.GetName]\n[743.GetName]\n[633.GetName]\n[646.GetName]§!"
GER_create_asian_reichskommissariat:	"Asiatische Reichskommisariate schaffen"
GER_create_asian_reichskommissariat_desc:	"Eine gewöhnliche Kolonie hat viele Vorteile, aber unser Führer hat noch größere Pläne für unsere Kolonien in Asien. Die Umsetzung seines Kolonialgesetzes sollte sich für alle Beteiligten als vorteilhaft erweisen!"
GER_south_east_asian_natural_wealth:	"Der natürliche Reichtum Südostasiens"
GER_south_east_asian_natural_wealth_desc:	"Die südostasiatische Region ist reich an natürlichen Ressourcen, von denen wir sehr profitieren würden. Die gegenwärtigen Besitzer entwickeln diese Länder nicht optimal, und obwohl die Länder nie uns gehörten, haben solche Gefühle die so genannten Demokratien nicht davon abgehalten, Kolonien zu stehlen, die rechtmäßig uns gehörten, und sie werden uns auch nicht aufhalten!"
GER_south_east_asian_natural_wealth_tt:	"Schaltet §YOn-Map Decisions§! frei, um unsere südostasiatischen Territorien zu verbessern"
GER_the_proud_eagle_and_the_resurgent_dragon:	"Der stolze Adler und der wiederauferstandene Drache"
GER_the_proud_eagle_and_the_resurgent_dragon_desc:	"Die Bedrohung durch eine [JAP.GetAdjective]-Invasion unserer Freunde in [CHI.GetNameDef] schwebt ständig über uns. Es hat keinen Sinn, passiv darauf zu warten, dass sie angreifen. Wir müssen uns auf einen Krieg gegen die Krieger von [JAP.GetNameDef] vorbereiten, auf unserem Territorium oder auf ihrem."
GER_blitzkrieg_across_the_pacific:	"Blitzkrieg über den Pazifik"
GER_blitzkrieg_across_the_pacific_desc:	"Einen Krieg im Pazifik zu führen, ist anders als das, wofür unsere Truppen meist ausgebildet wurden. Außerdem muss unsere Taktik möglicherweise etwas angepasst werden. Wir halten das nicht für eine Schwäche, sondern glauben, dass uns das sogar stärker macht. Die Verteidigung des Feindes baut auf dem auf, was er kennt, und wenn wir uns eine neue Art der Kriegsführung im Pazifik ausdenken, können wir ihn überrumpeln."
GER_molotov_ribbentrop_pact:	"$GER_mol_rib_pact$"
GER_molotov_ribbentrop_pact_desc:	"$GER_mol_rib_pact_desc$"
GER_treaty_with_the_ussr:	"$GER_soviet_treaty$"
GER_treaty_with_the_ussr_desc:	"$GER_soviet_treaty_desc$"
GER_support_finland:	"Unterstützen Sie Finnland"
GER_support_finland_desc:	"Die [FIN.GetAdjective] haben seit langem einen Konflikt über [146.GetName] mit den [SOV.GetAdjective]s. Da die Spannungen in der Region nun zunehmen, liegt es in unserem besten Interesse, sie zu unterstützen und sie im Gegenzug enger an uns zu binden."
GER_alliance_with_the_ussr:	"$GER_soviet_ally$"
GER_alliance_with_the_ussr_desc:	"$GER_soviet_ally_desc$ $GER_soviet_ally_desc$"
GER_war_with_the_ussr:	"$GER_ussr_war_goal$ $GER_ussr_war_goal$"
GER_war_with_the_ussr_desc:	"$GER_ussr_war_goal_desc$"
GER_puppet_turkey:	"$GER_turkey_puppet$"
GER_puppet_turkey_desc:	"$GER_turkey_puppet_desc$"
GER_befriend_turkey:	"$GER_turkey_friend$"
GER_befriend_turkey_desc:	"$GER_turkey_friend_desc$"
GER_influence_the_middle_east:	"Einflussnahme auf den Nahen Osten"
GER_influence_the_middle_east_desc:	"Auch wenn wir historisch gesehen wenig mit dem Nahen Osten gemein haben, kann niemand leugnen, dass die Region für uns von Interesse ist. Wir sollten unseren Einfluss in der Region ausweiten, um sicherzustellen, dass wir ein gewisses diplomatisches Gewicht in der Region haben, wenn es nötig sein sollte."
GER_the_final_blow_to_communism:	"Der letzte Schlag gegen den Kommunismus"
GER_the_final_blow_to_communism_desc:	"Der Umgang mit [SOV.GetNameDef] kann nicht das Ende unseres Kreuzzuges gegen den Kommunismus in Europa sein. Solange kommunistische Nationen in unserer Nähe existieren, müssen wir den Kampf fortsetzen. Wir können nicht eher ruhen, bis die rote Bedrohung vollständig ausgerottet ist!"
GER_war_against_communism_tt:	"Erreichen Sie §YAnnex§! Kriegsziele gegen jede §YCommunist§! Nation der Welt. Aktuelle Ziele:"
GER_war_against_european_communism_tt:	"Erreichen Sie das Kriegsziel §YAnnex§! gegen jede §YCommunist§!-Nation in §YEurope§!. Aktuelle Ziele:"
GER_crossing_the_atlantic_dockyards_tt:	"Fügen Sie §Y2 $dockyard$s§! in europäischen Küstenstaaten hinzu, die vollständig von [ROOT.GetNameWithFlag] kontrolliert werden, und entfernen Sie §Y1 $arms_factory$§! pro gebauter Werft. \n(Die Auswirkungen gelten für maximal [?crossing_the_atlantic_max_states_for_dockyards|Y0] Staaten, wobei Küstenstaaten mit mindestens einem $arms_factory$ in ihnen Vorrang haben)"
GER_inner_circle_member_title:	"Reichsleiter"
GER_ascension_of_todt:	"$GER_inner_circle_member_title$ Todt"
GER_ascension_of_todt_desc:	"Als ausgebildeter Ingenieur mit militärischer Erfahrung hat sich Fritz Todt als kompetenter Berater des Führers erwiesen. Wenn man ihm relative Handlungsfreiheit gibt, glauben wir, dass er für [ROOT.GetNameDef] von großem Nutzen sein könnte."
GER_ascension_of_speer:	"$GER_inner_circle_member_title$ Speer"
GER_ascension_of_speer_desc:	"Als ausgebildeter Architekt verfügt Albert Speer über Fähigkeiten, die für den weiteren Wohlstand des Landes sehr wertvoll sind. Wenn wir ihm relative Handlungsfreiheit gewähren, können wir sowohl von seinen Fähigkeiten als auch von seinen Kontakten zu den größeren Akteuren der [ROOT.GetAdjective] Bauindustrie profitieren."
GER_ascension_of_goring:	"$GER_inner_circle_member_title$ Göring"
GER_ascension_of_goring_desc:	"Ein fähiger Befehlshaber hat einen bestimmten Platz im Inneren Kreis des Führers. Da Hermann Göring nicht nur ein fähiger Befehlshaber, sondern auch ein langjähriger Komplize des Führers ist, sollte es sich als geringes Risiko und große Belohnung erweisen, ihm relative Handlungsfreiheit zu gewähren."
GER_ascension_of_goebbels:	"$GER_inner_circle_member_title$ Goebbels"
GER_ascension_of_goebbels_desc:	"Der Führer hat in seinem engsten Kreis immer Platz für diejenigen, die ihm helfen können, die Unterstützung des Volkes zu erhalten. Als enger Gefolgsmann und geschickter öffentlicher Redner sollte es sich für uns als äußerst vorteilhaft erweisen, Joseph Goebbels relative Handlungsfreiheit zu gewähren."
GER_rally_the_industrialists:	"Versammeln Sie die Industriellen"
GER_rally_the_industrialists_desc:	"Die Industriellen haben eine große Macht in unserem Land. Sie auf unsere Seite zu ziehen, wird eine gewisse Zeit in Anspruch nehmen, aber Rudolf Hess hat uns versichert, dass es sich lohnen wird."
GER_glorify_party_rallies:	"Parteiversammlungen glorifizieren"
GER_glorify_party_rallies_desc:	"Ohne unseren politischen Kern wird das Land ins Wanken geraten. Martin Borman hat uns darauf aufmerksam gemacht, dass unsere Parteiversammlungen verbessert werden könnten, um mehr Unterstützung in der Öffentlichkeit zu gewinnen und uns dadurch mehr Handlungsfreiheit bei der Zusammensetzung der Regierung zu geben."
GER_total_control_over_domestic_affairs:	"Totale Kontrolle über die Innenpolitik"
GER_total_control_over_domestic_affairs_desc:	"Die Aussicht, unsere innenpolitischen Angelegenheiten völlig loszulassen und sie dem Parteikanzler zu überlassen, mag ein gewagter Schritt erscheinen. Der Führer ist sich jedoch sicher. Die Aufgaben, die der Parteikanzler bisher wahrgenommen hat, haben die Erwartungen bei weitem übertroffen und [ROOT.GetLeader] fühlt sich wohl dabei, ihm diese Aufgabe zu überlassen, um sich auf wichtigere Dinge zu konzentrieren."
GER_fuhrerprinzip_inner_circle_tt:	"Aktiviert den §YInner Circle§! Mechanic.\n\n"
GER_rally_the_industrialists_hess_tt:	"Verhindert, dass die Ereigniskette §Y$germany.107.t$§! eintritt."
GER_wunderwaffe_dornberger_trait_tt:	"§Y$GER_walter_dornberger$§! ($high_command$): \nErsetzen Sie die Eigenschaft §Y$GER_head_of_the_missile_department$§! durch §Y$GER_head_of_experimental_weapons$§! \nWirksame Änderung: \nForschungseinrichtung Nachschubverbrauch: §G-10.00§! \n$specialization_naval_speed_factor$: §G+10%§! \n$specialization_nuclear_speed_factor$: §G+10%§!"
GER_rally_the_industrialists_hess_stays_tt:	"Hindert §Y$GER_rudolf_hess$§! daran, seine berüchtigte Flucht zu unternehmen."
unlock_decision_category_explained:	"Schaltet §Y$CATEGORY$§!Entscheidungen frei. $DESC$"
GER_integration_of_puppet_economies_decisions_tt:	"Diese Entscheidungen ermöglichen es uns, die Wirtschaft unserer Marionetten zu entwickeln oder auszunutzen."
GER_a_strong_successor_trigger_tt:	"Alle §Y3§! Aufgestiegenen Berater innerhalb des §YInner Circle§! haben ihren Capstone-Fokus abgeschlossen."
GER_a_strong_successor_tt:	"Erhält das Ereignis '§Y$GER_inner_circle.02.t$§!'. \nEiner der derzeitigen Aufgestiegenen $GER_inner_circle_member_title$s innerhalb des §YInner Circle§! kann §Y[ROOT.GetLeader]§! als Country Leader ersetzen."
GER_a_strong_successor_current_advisors_tt:	"Derzeitige Aufgestiegene Berater: §Y[GetAscendedAdvisorName1]§!, §Y[GetAscendedAdvisorName2]§! oder §Y[GetAscendedAdvisorName3]§!."
GER_focus_can_only_be_completed_by_advisor_tt:	"Dieser Fokus kann nur von §Y$CHARACTER$§! gestartet werden, nachdem er den Fokus §Y$FOCUS$§! abgeschlossen hat."
GER_focus_can_only_be_completed_by_advisor_multiple_tt:	"Dieser Fokus kann nur von §Y$CHARACTER$§! oder §Y$CHARACTER_2$§! gestartet werden, nachdem Sie den Fokus §Y$FOCUS$§! oder §Y$FOCUS_2$§! abgeschlossen haben."
GER_ascension_of_character_focus_tt:	"§Y$CHARACTER$§! wird im Laufe der Zeit mit der Arbeit an den Schwerpunkten in seinem Zweig beginnen."
GER_ascension_of_character_tt:	"§Y$CHARACTER$§! wird zum §YReichsleiter§! ernannt und steigt innerhalb des §YInner Circle§! auf als:"
GER_ascended_character_trait_swap_tt:	"§Y$CHARACTER$§! steigt innerhalb des §YInneren Kreises§! auf:"
GER_total_control_over_domestic_affairs_chancellors_tt:	"Basierend auf dem ernannten Parteikanzler innerhalb des §YInner Circle§!:"
GER_event_to_replace_ascended_advisor_tt:	"Erhält das Ereignis '§YDer Aufstieg von $CHARACTER$§!': \n§Y$CHARACTER$§! kann §Y[GetAscendedAdvisorName1]§!, §Y[GetAscendedAdvisorName2]§! oder §Y[GetAscendedAdvisorName3]§! innerhalb des §YInner Circle§! ersetzen."
replace_ascended_advisor_tt:	"§RRemove from§! §YInner Circle§!: \n§Y$CHARACTER$§! als $TRAIT$"
GER_stop_progress_on_advisor_focus_tt:	"§Y$CHARACTER$§! wird nicht mehr auf den Fokus §Y$FOCUS$§! wirken."
GER_advisor_will_continue_focus_tt:	"§Y$CHARACTER$§! herrscht innerhalb des §YInner Circle§! und wird die Arbeit an dem Fokus §Y$FOCUS$§! fortsetzen."
GER_inner_circle_industrial_me_focuses_tt:	"(Das Abschließen dieses Fokus wird §Rlock§! §Y$FOCUS_1$§! und §Y$FOCUS_2$§! für ihre jeweiligen $GER_inner_circle_member_title$)"
GER_intrigue_replacing_advisor_already_ascended_tt:	"§Y$CHARACTER$§! herrscht innerhalb des §YInner Circle§! und wird in der Lage sein, den Fokus §Y$FOCUS$§! abzuschließen. \n\n§Y$CHARACTER_2$§! und §Y$CHARACTER_3$§! werden nicht mehr versuchen, ihren jeweiligen sich gegenseitig ausschließenden Fokus zu vollenden."
GER_inner_circle_event_pending_flag:	" Es gibt ein ausstehendes §YInner Circle§! Event.\n"
GER_intrigue_replacing_advisor_new_ascending_tt:	"§Y$CHARACTER$§! steigt innerhalb des §YInner Circle§! auf als: \n$IDEA$ \n§Y$CHARACTER$§! in der Lage sein, den Fokus §Y$FOCUS$§! abzuschließen. \n§Y$CHARACTER_2$§! und §Y$CHARACTER_3$§! werden nicht mehr versuchen, ihren jeweiligen sich gegenseitig ausschließenden Fokus abzuschließen."
GER_inner_circle_cd_flag:	" Hat einen anderen §Y$GER_inner_circle_member_title$§! ernannt"
GER_inner_circle_cd_days_tt:	"Tage, bis der nächste §Y$GER_inner_circle_member_title$§! ernannt werden kann: [?GER_inner_circle_cd_flag:days_left|Y0]"
GER_inner_circle_focus_in_progress_tt:	"§Y$CHARACTER$§! arbeitet an diesem Fokus. \nFortschritt: §Y$FLAG_DAYS$§!/[?temp_focus_days] days"
GER_industrialists_intrigue_prevailed_tt:	"§Y$PREVAILED_CHARACTER$§! wurde mit der Leitung der industriellen Bemühungen betraut und ist der Einzige, der an dem sich gegenseitig ausschließenden Fokus arbeiten kann.\n\n"
GER_inner_circle_title_text:	"INNERER ZIRKEL"
GER_inner_circle_hide_button_tt:	"[!hide_button] BLABLA"
GER_fuhrer_name_text:	"§Y[ROOT.GetLeader]§!"
GER_fuhrer_title_text:	"Führer"
GER_fuhrer_title_text_female:	"Führerin"
GER_ascended_advisor_1_name_text:	"§Y[GetAscendedAdvisorName1]§!"
GER_ascended_advisor_2_name_text:	"§Y[GetAscendedAdvisorName2]§!"
GER_ascended_advisor_3_name_text:	"§Y[GetAscendedAdvisorName3]§!"
GER_fuhrer_tooltip:	"Die [GetFuhrerGenderedName] §Y[GetFuhrerName]§!."
remove_character_as_tt:	"§RRemove§! §Y$CHARACTER$§! als §Y$ROLE$§!.\n"
GER_oppose_hitler_ww:	"Versammlung der Wehrmacht"
GER_oppose_hitler_ww_desc:	"Hitlers Herrschaft muss zu Ende gehen. Er will die Westmächte durch die Remilitarisierung des Rheinlandes provozieren, aber das wird uns den Vorwand liefern, mit Hilfe loyaler Elemente in der Wehrmacht die Macht zu übernehmen und das deutsche Volk gegen ihn aufzubringen."
GER_rally_the_nation:	"Die Nation mobilisieren"
GER_rally_the_nation_desc:	"Es gibt viele in unserer Nation, die bereit sind, sich gegen die Nazis zu stellen, jetzt, wo sich die Gelegenheit bietet. Wir sollten das Volk mobilisieren und vielleicht sogar Kontakt zu paramilitärischen Organisationen aufnehmen, die bereits seit den Tagen der Weimarer Republik Erfahrung im Kampf gegen die Nazis haben."
GER_rally_the_nation_tt:	"Wir werden einen nationalen Geist wählen können, der nach dem Ende des Bürgerkriegs entweder §YAlter§! oder §RRemoved§! sein muss."
GER_denazification_campaigns:	"Entnazifizierungs-Kampagnen"
GER_denazification_campaigns_desc:	"Um uns wirklich von der Naziseuche zu befreien, die das Herz von [GER.GetNameDef] infiziert hat, müssen wir uns intensiv um die Entnazifizierung bemühen und Nazis oder diejenigen, die ihnen Unterschlupf gewähren, verhaften, sobald wir sie aufspüren."
GER_rebuild_the_nation_ww:	"Wiederaufbau der Nation"
GER_rebuild_the_nation_ww_desc:	"Wir müssen alle unsere Anstrengungen auf einen raschen Wiederaufbau konzentrieren, wenn wir uns von der Beseitigung der Nazi-Plage erholen wollen. Die Menschen werden in der Zwischenzeit bescheiden leben und hart arbeiten müssen, aber sie werden dies mit dem Versprechen auf eine bessere Zukunft tun."
GER_revitalize_the_nation:	"Die Nation wiederbeleben"
GER_revitalize_the_nation_desc:	"Nach den Verwüstungen des Bürgerkriegs müssen wir uns um den Wiederaufbau unserer Nation kümmern. Wir werden die Menschen bitten, eine Zeit lang auf ihre persönlichen Annehmlichkeiten zu verzichten, damit wir alle unsere Ressourcen auf die Erreichung dieses Ziels konzentrieren können."
GER_rebuild_the_nation_ww_tt:	"Schaltet die Entscheidung frei: §Y$GER_public_works_modifier$§!"
GER_tend_to_the_future_of_germany:	"Kümmern Sie sich um die Zukunft von Deutschland"
GER_tend_to_the_future_of_germany_desc:	"Jetzt, da Deutschland erfolgreich vor den Nazis gerettet wurde, müssen wir uns neuen Horizonten zuwenden und den künftigen Weg unserer Nation bestimmen. Für Einigkeit, Gerechtigkeit und Freiheit!"
GER_tend_to_the_future_of_germany_tt:	"Jeder Versuch einer §YSeparatistischen Rebellion§! wird erfolgreich umgangen werden"
GER_start_the_proletarian_revolution:	"Die proletarische Revolution beginnen"
GER_start_the_proletarian_revolution_desc:	"Wir hatten gehofft, dass nach dem ersten Bürgerkrieg die Stimme der Arbeiter mehr Gehör finden würde. Es scheint jedoch nicht so zu sein. Das Proletariat hat etwas Besseres verdient, und wenn wir ihm erlauben, sich zu erheben, können wir vielleicht endlich die Macht ein für alle Mal denjenigen sichern, die das Proletariat begünstigen."
GER_start_the_proletarian_revolution_civil_war_tt:	"Das wird zu einem §RBürgerkrieg§! führen, wenn die Mission scheitert!"
GER_states_with_proletarian_uprising_joins_cw_tt:	"Staaten mit dem Modifikator §Y$GER_proletariat_uprising_modifier$§! werden sich im Falle eines Bürgerkriegs auf die Seite der §YCommunist§! stellen."
GER_the_proletarian_revolution_flag:	"Die proletarische Revolution ist im Gange."
GER_formalize_the_intelligence_wing:	"Formalisieren Sie den Geheimdienstflügel"
GER_formalize_the_intelligence_wing_desc:	"Das Land hat sehr unter Herrschern gelitten, die nicht das Interesse des Volkes im Sinn hatten. Um sicherzustellen, dass wir die Nation wieder aufbauen können, müssen wir zunächst wissen, womit wir arbeiten können. Ein funktionierender Geheimdienst ist ein guter Anfang!"
GER_propaganda:	"Landesweite Propaganda"
GER_propaganda_desc:	"Wir haben die Macht der Propaganda schon früher beobachtet und können ihre Wirksamkeit nicht leugnen. Indem wir Ressourcen für die Unterstützung unserer glorreichen Führer bereitstellen, sorgen wir dafür, dass unsere Bevölkerung genau dort bleibt, wo wir sie haben wollen."
GER_form_the_stasi:	"Bilden Sie die Stasi"
GER_form_the_stasi_desc:	"Der Nachrichtendienst war ein großer Erfolg und wir haben nun begonnen, die Möglichkeit zu prüfen, ein Ministerium zu schaffen, das sich mit der Staatssicherheit befasst. Es mag nicht die populärste Entscheidung in der Bevölkerung sein, aber sie ist notwendig."
GER_effective_operations:	"Effektive Operationen"
GER_effective_operations_desc:	"Da die Stasi weiter wächst, müssen wir ihr Einsatzgebiet ausweiten. Missionen jenseits der [ROOT.GetAdjective] Grenzen sind für die Sicherheit unseres Staates ebenso wichtig wie solche, die innerhalb des Landes begonnen werden."
GER_assemble_red_orchestra:	"Stellen Sie das Rote Orchester zusammen"
GER_assemble_red_orchestra_desc:	"Das Rote Orchester war nie eine feste Gruppe, sondern nur eine Reihe von Leuten, die sich um ein paar findige Individuen scharten. Einige der Mitglieder dieser so genannten Organisation waren jedoch sehr geschickt und wir sollten erwägen, sie zu rekrutieren."
GER_ressurect_the_red_front_fighters_league:	"Lassen Sie den Rotfrontkämpferbund wieder auferstehen"
GER_ressurect_the_red_front_fighters_league_desc:	"Der Rotfrontkämpferbund war eine paramilitärische Organisation, die während der Weimarer Republik mit der Bewegung verbunden war. Unter dem faschistischen Regime wehrten sie sich tapfer gegen die Polizei und andere Unterdrücker. Auf die gleiche Art und Weise, wie es unser altes Regime gewöhnlich tat, wurden die Rotfrontkämpfer dafür verboten. Es ist an der Zeit, dass wir sie zurückholen!"
GER_spawn_more_communist_militias_in_civil_war_tt:	"Wenn ein weiterer §YYBürgerkrieg§! ausbricht, schaffen Sie §Y2 German§! Einheiten in drei Kernstaaten, die von §Y$GER_proletariat_uprising_modifier$§! betroffen sind."
GER_ressurect_the_red_front_fighters_league_tt:	"§Y2 Milizeinheiten§! werden in §Ydrei zufälligen Staaten§! gespawnt, die derzeit von §Y$GER_proletariat_uprising_modifier$§! betroffen sind oder von §Y[ROOT.GetAdjective] Kommunisten§! kontrolliert werden."
GER_reorganize_nationale_volksarmee:	"Reorganisieren Sie die Nationale Volksarmee"
GER_reorganize_nationale_volksarmee_desc:	"Korruption und faschistische Gesinnung sind in unserer Armee immer noch weit verbreitet. Um Uneinigkeit und Meuterei zu verhindern, müssen wir diejenigen ausmerzen, die uns schaden wollen. Um die Sicherheit unseres Volkes zu gewährleisten, müssen wir neue, loyale Generäle ernennen, die unsere tapferen Soldaten in die Schlacht führen, falls dies erforderlich sein sollte."
GER_cannot_join_oppossing_civil_war_side_tt:	"Diese Charaktere werden sich in einem möglichen Bürgerkrieg nicht der gegnerischen Seite anschließen können:"
GER_ensure_army_loyalty:	"Die Loyalität der Armee sicherstellen"
GER_ensure_army_loyalty_desc:	"Es gibt einige in den Reihen der Armee, die noch für unsere Sache gewonnen werden können und nicht für die Torheit, zu der sie gezwungen wurden, sich zu bekennen. Es wird einige Arbeit erfordern, aber wenn wir unseren Soldaten einen guten Gemeinschaftsgeist einimpfen, können wir ihre Loyalität für die nächsten Jahre sicherstellen."
GER_political_commissars:	"Politische Kommissare"
GER_political_commissars_desc:	"Es gibt einige in den Reihen der Soldaten, die noch für unsere Sache gewonnen werden können und nicht für die Torheit, der sie gezwungen wurden, sich anzuschließen. Wir müssen Offiziere ernennen, deren Aufgabe es ist, die einfachen Soldaten über die Vorteile des Kommunismus aufzuklären und sie zu organisieren, um ihre Loyalität sicherzustellen."
GER_rapid_army_expansion:	"Rascher Ausbau der Armee"
GER_rapid_army_expansion_desc:	"Unsere Armee ist nach den notwendigen Veränderungen nicht mehr so schnell gewachsen wie zuvor. Wir brauchen immer noch eine große Armee, um unser Volk in einer immer feindlicheren Welt zu schützen. Ein erheblicher Mobilisierungs- und Ausbildungsschub sollte dieses Problem lösen."
GER_the_peoples_victory:	"Der Sieg des Volkes"
GER_the_peoples_victory_desc:	"Das Volk hat gesprochen, und das Volk wurde erhört. Unsere alte und korrupte Regierung hat Anzeichen von Schwäche gezeigt und wir müssen die Gelegenheit ergreifen, ihren Rücktritt zu fordern und die Macht für uns selbst zu übernehmen, im Namen des Volkes!"
GER_legacy_of_the_spartacus_league:	"Das Vermächtnis des Spartakusbundes"
GER_legacy_of_the_spartacus_league_desc:	"Der Spartakusbund hörte 1919 auf zu existieren, als die Kommunistische Partei Deutschlands gegründet wurde, aber einige ihrer Ideen sind es wert, wieder aufgegriffen zu werden. Der Bund hatte die Vision, eine sozialistische Republik zu schaffen, deren Grundlage demokratische Wahlen und der Wille des Volkes sind, die jedoch revolutionäre Gruppen zulässt, wenn es nötig ist. Es ist an der Zeit, dass wir wieder auf dieses Ziel hinarbeiten."
GER_social_ownership:	"Soziale Eigenverantwortung"
GER_social_ownership_desc:	"Wir haben gesehen, was passiert, wenn man zulässt, dass wichtige staatliche Dienste von Leuten geleitet werden, deren Ziel nicht mit dem Besten für die Menschen übereinstimmt. Um zu verhindern, dass dies jemals wieder geschieht, sollten wir unsere Industrie in öffentliches Eigentum überführen."
GER_civil_liberties:	"Bürgerliche Freiheiten"
GER_civil_liberties_desc:	"Unter unseren Genossen herrscht der Irrglaube, dass der Staat, um effizient und sicher zu funktionieren, jeden Einzelnen zur Konformität zwingen muss. Aber das widerspricht den Zielen des Sozialismus. Nur durch den Schutz der bürgerlichen Freiheiten werden die Menschen dem Staat gegenüber wirklich loyal sein."
GER_embrace_democratic_institutions:	"Umarmen Sie demokratische Institutionen"
GER_embrace_democratic_institutions_desc:	"Die liberale Demokratie ist nichts anderes als eine Fassade für die Bourgeoisie. Wahre Demokratie erfordert sowohl wirtschaftliche als auch soziale Gleichheit. Nur wir sind in der Lage, den Willen des Volkes in den Prozess der Staatsführung einzubeziehen."
GER_establish_volkskommissariats:	"Volkskommissariate einrichten"
GER_establish_volkskommissariats_desc:	"Eine ausländische Besatzung ist inakzeptabel, aber um legitime, von den Arbeitern geführte Regierungen bei unseren neu befreiten Nachbarn zu etablieren, werden wir die schwierige Verantwortung der Führung übernehmen und sie zum sozialistischen Ideal führen."
GER_establish_volkskommissariats_tt:	"Entfesselt Entscheidungen zur §YEinrichtung von Volkskommissariaten§! in allen gegenwärtigen und zukünftigen §YNachbarn Untertanenstaaten§!, die unsere Ideologie teilen."
GER_industrialize_volkskommissariats:	"Volkskommissariate industrialisieren"
GER_industrialize_volkskommissariats_desc:	"Der ineffiziente Einsatz von Arbeitskräften aufgrund mangelnder Ausrüstung führt dazu, dass die Industrien der Volkskommissariate hinter ihren [ROOT.GetAdjective] Pendants zurückbleiben. Wir müssen in Industrialisierungsprogramme investieren, um dieses Ungleichgewicht zu korrigieren."
GER_industrialize_volkskommissariats_tt:	"Entschließt sich, §YIndustrialisierungsbemühungen§! in §YVolkskommissariaten§! zu erlassen"
GER_protect_the_revolution:	"Schützen Sie die Revolution"
GER_protect_the_revolution_desc:	"Auch wenn einige unsere Interventionen im Ausland als einen Trick ansehen, um Einfluss zu gewinnen, wissen wir, dass es unsere Aufgabe ist, das Proletariat auch außerhalb unserer Grenzen zu schützen."
GER_protect_the_revolution_tt:	"Schaltet die Entscheidung frei, die Unterwerfung von Nachbarländern zu fordern, in denen ein Bürgerkrieg durch [ROOT.GetNameDef] ausgelöst wurde."
GER_instill_german_discipline:	"Deutsche Disziplin einführen"
GER_instill_german_discipline_desc:	"Wenn man sich die Armeen der Volkskommissariate ansieht, wird schmerzlich deutlich, dass es ihnen an [ROOT.GetAdjective] Disziplin und Effizienz mangelt. Wir müssen sie in diesen Dingen erziehen, damit sie sich besser gegen unsere Gegner verteidigen können."
GER_integrate_subjects_economies:	"Integrieren Sie die Volkswirtschaften der Subjekte"
GER_integrate_subjects_economies_desc:	"Die Volkskommissariatswirtschaften haben unter unserer Leitung große Fortschritte gemacht. Um die Effizienz noch weiter zu steigern, werden wir unsere Industrien zu einem einzigen Wirtschaftsblock zusammenfassen."
GER_current_future_volkskommisariats_tt:	"Alle derzeitigen und zukünftigen §YVolkskommissariate§!:"
GER_integrate_volkskommissariats:	"Volkskommissariate integrieren"
GER_integrate_volkskommissariats_desc:	"Die Volkskommissariate sollten die befreiten Völker Europas zum Sozialismus führen. Mit der Verflechtung unserer Volkswirtschaften und Kulturen hat sich jedoch ein neues Identitätsgefühl herausgebildet, das für eine Erweiterung dessen eintritt, was es bedeutet, [ROOT.GetAdjective] zu sein. Von nun an sind wir ein Volk, ein Land."
GER_integrate_volkskommissariats_tt:	"Schaltet die Entscheidungen zur §YIntegration der Volkskommissariate§! frei. Sobald §Y[ROOT.GetNameWithFlag]§! das erste §YVolkskommissariat§! integriert hat, wird das Land als §Y$GER_german_socialist_union_communism$§! bekannt sein."
GER_expand_social_welfare:	"Soziale Wohlfahrt ausbauen"
GER_expand_social_welfare_desc:	"Nach dem Ersten Weltkrieg begannen wir, ein Wohlfahrtssystem zu entwickeln, das den Menschen zugute kommt, aber nach der Großen Depression wurde dieses System immer mehr eingeschränkt. Wir sollten Ressourcen in den Wiederaufbau dieser Einrichtung stecken und sie zu einem Ehrenzeichen für jeden Deutschen machen, um der Welt die Überlegenheit des Kommunismus zu beweisen."
GER_liberate_austria:	"Befreien Sie Österreich"
GER_liberate_austria_desc:	"Unsere Nachbarn im Süden haben lange unter schrecklichen Bedingungen für die Menschen gelebt. Obwohl sie ein anderes Land ihre Heimat nennen, sind wir uns sehr ähnlich und haben sogar eine gemeinsame Sprache. Zum Wohle des [AUS.GetAdjective] Volkes werden wir eine Bitte, nein, ein Angebot aussprechen, sich uns anzuschließen!"
GER_spark_the_flame_of_revolution:	"Entfachen Sie die Flamme der Revolution"
GER_spark_the_flame_of_revolution_desc:	"Die Situation für die Arbeiter in den Nachbarländern ist nicht so gut, wie wir sie uns wünschen. Langfristig wird eine bewaffnete Revolution in diesen Ländern unvermeidlich sein, aber im Moment sollten wir zumindest versuchen, das Wort vom Kommunismus in diesen Ländern zu verbreiten."
GER_spark_the_flame_of_revolution_tt:	"Schaltet Entscheidungen zur §YVerstärkung kommunistischer Gefühle§! in §Yunbedeutenden Nachbarländern§! frei. Sobald die Kommunisten die Mehrheit in dem beeinflussten Land haben, wird ein §YBürgerkrieg§! ausbrechen, um das Land §YKommunistisch§! zu machen."
GER_proletarian_international_alliance:	"Proletarische Internationale"
GER_support_the_proletarian_uprising:	"Unterstützen Sie den proletarischen Aufstand"
GER_support_the_proletarian_uprising_desc:	"Da wir eine starke Zunahme von Bürgerkriegen in unserer unmittelbaren Umgebung voraussehen, müssen wir unseren Standpunkt zur bestmöglichen Unterstützung aufständischer Arbeiter aktualisieren. Diese Arbeiter sind möglicherweise schlecht auf ein solches Unterfangen vorbereitet, und indem wir dafür sorgen, dass sie zumindest gut ausgerüstet sind, können wir sicherstellen, dass eine rote Welle über unseren Teil Europas schwappt."
GER_support_the_proletarian_uprising_tt:	"Schaltet §YEntscheidungen§! zur Entsendung von §YInfanterieausrüstung§! in Länder frei, die derzeit in einen Bürgerkrieg verwickelt sind, weil §Y[ROOT.GetAdjective]§! die §Ykommunistische§! Stimmung anheizt."
GER_the_proletarian_legion:	"Die Proletarische Legion"
GER_the_proletarian_legion_desc:	"Wir müssen die Verantwortung für die Aufstände übernehmen, die wir ausgelöst haben. Das Proletariat in diesen vom Bürgerkrieg heimgesuchten Ländern braucht unsere Hilfe, um den korrupten Regimen so schnell wie möglich ein Ende zu setzen. Wir müssen in Erwägung ziehen, ihnen Truppen zu Hilfe zu schicken!"
GER_the_proletarian_legion_tt:	"Sobald §YAjedes Land§!, das §Y[ROOT.GetNameWithFlag]§! den §YKommunismus§! angestachelt hat, in einen §YBürgerkrieg§! eintritt:"
GER_strengthen_the_proletarian_international:	"Proletarische Internationale stärken"
GER_strengthen_the_proletarian_international_desc:	"Da sich die Arbeiter in unseren Nachbarländern für ihre Rechte erheben, sehen wir eine gute Gelegenheit, unsere Position als zuverlässiges Bündnis zu stärken. Indem wir diese neu gegründeten kommunistischen Staaten in die Proletarische Internationale einladen, können wir alle stärker werden."
GER_strengthen_the_proletarian_international_tt:	"Jedes Land in §YEuropa§!, das §Y[GER.GetNameWithFlag]§! in Richtung §YKommunismus§! beeinflusst hat, wird in die §YProletarische Internationale§! eingeladen werden. Dieser Effekt wird auch für Länder gelten, die §Ynach diesem Fokus§! in Richtung Kommunismus beeinflusst werden."
GER_proletarian_solidarity:	"Proletarische Solidarität"
GER_proletarian_solidarity_desc:	"Wir haben viel Zeit und Ressourcen in unsere Bemühungen gesteckt, Europa auf den Weg des Kommunismus zu bringen. Ist es nicht nur fair, dass wir jetzt die Früchte unserer Arbeit ernten?"
GER_proletarian_solidarity_decision_tt:	"Beschluss entriegeln: §Ermutigen Sie die Proletarische Solidarität§!, den Rohstoffhandel mit Ländern zu verstärken, die [GER.GetName] geholfen haben, kommunistisch zu werden"
GER_liberate_italy:	"Befreien Sie Italien"
GER_liberate_italy_desc:	"Die [ITA.GetAdjective] haben lange unter der Herrschaft von [ITA.GetLeader] gelitten. Einst waren sie der vermeintliche Verbündete unserer eigenen früheren Regierung, und nun, da wir uns zum Besseren gewandelt haben, muss es unsere Pflicht sein, sie mit uns zu vereinen!"
GER_the_end_to_fascist_europe:	"Das Ende des faschistischen Europas"
GER_the_end_to_fascist_europe_desc:	"Auch jetzt gibt es noch Länder in Europa, die unter faschistischer Herrschaft stehen. Da wir wissen, welche Belastung dies für die Bevölkerung bedeutet, müssen wir dafür sorgen, dass diese Länder sofort befreit werden!"
GER_bypass_end_to_fascist_europe_tt:	"Nein: Jedes andere Land:\n Hauptstadtstaat: Liegt in §YEurope§!\n Derzeitige Regierungspartei ist §YFascist§!. "
GER_war_against_fascism_tt:	"Gewinnen Sie §YAnnex§! Kriegsziel gegen jede §YFascist§! Nation in §YEurope§!, gegen die [GER.GetNameDef] nicht bereits ein Kriegsziel hat. Aktueller Effekt:"
GER_red_europe:	"Ein rotes Europa"
GER_red_europe_desc:	"Wir können unsere Bemühungen, die Arbeiter zu ermutigen, zu den Waffen zu greifen und die rote Flagge zu hissen, nicht auf unsere unmittelbaren Nachbarländer beschränken. Wir müssen die proletarische Revolution in ganz Europa verbreiten!"
GER_spark_the_flame_of_revolution_red_europe_tt:	"Ermöglicht Entscheidungen zur §YVerstärkung kommunistischer Gefühle§! in §Ykleineren europäischen Ländern§!. Sobald die Kommunisten die Mehrheit in dem beeinflussten Land haben, wird ein §YBürgerkrieg§! ausbrechen, um das Land §YKommunistisch§! zu machen."
GER_root_out_imperialism:	"Imperialismus ausrotten"
GER_root_out_imperialism_desc:	"Die Wurzeln des Imperialismus wachsen tief in den Böden Afrikas und Asiens und fesseln die dortigen Arbeiter. Diese Menschen haben schon viel zu lange unter dem Kolonialismus gelitten. Wir müssen die Ausbeutung beenden und den unterdrückten Massen die Mittel geben, sich zu erheben, ihr Schicksal in die Hand zu nehmen und unsere Feinde abzulenken."
GER_root_out_imperialism_tt:	"Schaltet §YEntscheidungen§! für mehr Widerstand und Autonomiegewinn in §YAfrikanischen§! und §YAsiatischen§! Ländern frei."
GER_strengthen_the_proletarian_international_internationally_tt:	"Jedes Land §Yaußerhalb Europas§!, das §Y[GER.GetNameWithFlag]§! in Richtung §YKommunismus§! beeinflusst hat, wird in die §YProletarische Internationale§! eingeladen werden. Dieser Effekt wird auch für Länder gelten, die in Richtung Kommunismus beeinflusst werden, nachdem dieser Fokus genommen wurde."
GER_hegemony_over_europe:	"Hegemonie über Europa"
GER_hegemony_over_europe_desc:	"Das alte, imperiale Europa zerbröckelt. Wir werden an seiner Stelle eine neue sozialistische Ordnung errichten, wobei die Arbeiter Europas auf uns schauen, um sie gegen die bürgerliche Tyrannei zu führen. Ein proletarischer Sieg wird unsere Hegemonie auf dem gesamten Kontinent begründen."
GER_war_against_major_countries_in_europe_tt:	"Erreichen Sie §YAnnex§! Kriegsziel gegen alle §YMajor§! Nationen, die mindestens einen Staat in §YEurope§! kontrollieren. Aktueller Effekt:"
GER_align_south_america:	"Südamerika ausrichten"
GER_align_south_america_desc:	"Die südamerikanischen Arbeiter haben lange genug unter dem Joch des Kapitalismus gelitten. Wenn wir sie auf unsere Seite ziehen, werden wir sicherlich auf dem ganzen Kontinent treue Verbündete finden."
GER_communist_propaganda_south_america_decision_tt:	"Ermöglicht Entscheidungen zur §YVerstärkung kommunistischer Gefühle§! in §Yweniger südamerikanischen Ländern§!. Sobald die Kommunisten die Mehrheit in dem betroffenen Land haben, wird ein §YBürgerkrieg§! ausbrechen, um das Land §YKommunistisch§! zu machen."
GER_wage_war_on_capitalism:	"Führen Sie Krieg gegen den Kapitalismus"
GER_wage_war_on_capitalism_desc:	"Der Kapitalismus ist der natürliche Feind des Kommunismus und muss notfalls mit Gewalt zerschlagen werden. Wir werden diesen Angriff gegen [USA.GetNameDef] führen, das Symbol des Kapitalismus schlechthin, und den Weg für eine neue sozialistische Ära ebnen."
GER_instigate_middle_eastern_revolutions:	"Revolutionen im Nahen Osten anzetteln"
GER_instigate_middle_eastern_revolutions_desc:	"Der Nahe Osten wird seit langem von ausländischen Mächten unterdrückt und ist reif für eine sozialistische Revolution. Wir sollten den unterschwelligen Wunsch der Menschen wecken, sich endlich von der Ausbeutung zu befreien und die rote Fahne des Sozialismus zu hissen."
GER_communist_propaganda_middle_east_decision_tt:	"Entfesselt Entscheidungen zur §YStärkung kommunistischer Gefühle§! in §YMinderen Ländern des Nahen Ostens§!. Sobald die Kommunisten die Mehrheit in dem beeinflussten Land haben, bricht ein §YBürgerkrieg§! aus, um das Land §YKommunistisch§! zu machen."
GER_intervene_in_spain:	"Intervenieren Sie in Spanien"
GER_intervene_in_spain_desc:	"Es ist unsere Pflicht, unseren Kameraden in Spanien auf jede erdenkliche Weise gegen die faschistischen Kräfte zu helfen. Die Entsendung von kampferprobten Truppen wird sicherlich begrüßt werden."
GER_assist_our_eastern_comrades:	"Unterstützen Sie unsere östlichen Kameraden"
GER_assist_our_eastern_comrades_desc:	"Die Kämpfe unserer fernöstlichen Kameraden haben ihren Tribut gefordert. Wir sollten sie so gut wir können unterstützen. Die Entsendung kampferprobter Truppen könnte das Blatt zu ihren Gunsten wenden."
GER_strike_at_the_rising_sun:	"Streik bei der aufgehenden Sonne"
GER_strike_at_the_rising_sun_desc:	"[JAP.GetNameDefCap] ist nach wie vor eine Bastion des Imperialismus, die jeden unterdrückt, der sich Gleichheit und Sozialismus wünscht. Es ist höchste Zeit, dass die Japaner in die Knie gezwungen werden und die neue proletarische Weltordnung akzeptieren."
GER_nationalize_industries:	"Industrien verstaatlichen"
GER_nationalize_industries_desc:	"Nachdem wir das positive Ergebnis unserer staatlichen Zentralisierung der Wirtschaft gesehen haben, könnten wir dasselbe für unsere Industrie in Betracht ziehen. So wie es jetzt ist, ist die Industrie unter vielen privaten Eigentümern aufgeteilt, die unterschiedliche Verfahren und Methoden zur Herstellung ihrer Waren anwenden. Durch die Verstaatlichung der Industrie hätten wir viel mehr Kontrolle über den Output und die Effizienz der Produktion."
GER_form_agricultural_cooperatives:	"Landwirtschaftliche Genossenschaften gründen"
GER_form_agricultural_cooperatives_desc:	"Der Agrarsektor ist für uns von größter Bedeutung. Mehrere Industriezweige sind von den 'Landarbeitern und ihrer Arbeit abhängig, und sie allein zu lassen, ist kaum eine verantwortungsvolle Maßnahme. Durch die Bildung von Genossenschaften können wir sicherstellen, dass der Agrarsektor gemeinsam, mit maximaler Effizienz und minimalen Verlusten arbeitet."
GER_effectivize_the_volkswerke:	"Effektivierung der Volkswerke"
GER_effectivize_the_volkswerke_desc:	"Die so genannten Volkswerke sind eine der wenigen Ideen, die unsere Vorgänger hatten. Als staatlich kontrolliertes Industriekonglomerat, das das Wachstum und die Produktion in der Bergbau- und Stahlindustrie überwacht, sind die Volkswerke alle Verbesserungen wert, die wir an ihnen vornehmen können."
GER_womens_rights_and_equality:	"Rechte der Frauen und Gleichberechtigung"
GER_womens_rights_and_equality_desc:	"Das Geschlecht war lange Zeit ein entscheidender Faktor dafür, wo ein Mensch seinem Land dienen sollte, sei es an der Front, in den Fabriken oder zu Hause. Indem wir eine gleichmäßigere Verteilung der Lasten anstreben, ermöglichen wir eine größere Zahl von Arbeitskräften und eine größere Armee, wenn der Bedarf besteht."
GER_locks_women_in_workforce_decision_tt:	"Die §Y$women_in_the_workforce$§! Entscheidung wird §Yunavailable§!"
GER_labor_rights_and_union_stuff:	"Gewerkschaften gründen"
GER_labor_rights_and_union_stuff_desc:	"Die Möglichkeit für Arbeitnehmer, sich gewerkschaftlich zu organisieren, um gemeinsam ihre Anliegen vorzubringen und ihre Arbeitsbedingungen festzulegen, wurde in unserem Land lange vernachlässigt. Es ist an der Zeit, dass der Staat die Bildung von Arbeitergewerkschaften nicht nur zulässt, sondern fördert!"
GER_proletarian_dictatorship:	"Proletarische Diktatur"
GER_proletarian_dictatorship_desc:	"Um unserem Volk die besten Möglichkeiten und den besten Lebensstandard zu bieten, müssen wir für eine stabile Führung sorgen, die im Einklang mit den Menschen und ihren Bedürfnissen steht. Als langjähriger Kämpfer für das Proletariat erfüllt [ROOT.GetLeader] alle Voraussetzungen und hat bewiesen, dass er nur das Beste für die Arbeiter im Sinn hat."
GER_state_controlled_economy:	"Staatlich kontrollierte Wirtschaft"
GER_state_controlled_economy_desc:	"Unsere Wirtschaft ist viel zu brüchig, um sie Menschen zu überlassen, die nicht wissen, wie man sie am besten verwaltet. Um eine Wirtschaftskrise zu vermeiden, die langfristige Auswirkungen auf unsere Bevölkerung hätte, muss der Staat die Kontrolle über unsere Wirtschaft übernehmen."
GER_central_planning:	"Zentrale Planung"
GER_central_planning_desc:	"Da unsere Wirtschaft nun in den Händen des Staates liegt, erscheint es nur richtig, dass auch unsere Wirtschaftsplanung zentralisiert wird. Nur wer einen Überblick über die Wirtschaft des Landes hat, kann die besten Entscheidungen darüber treffen, wo investiert werden soll und wie die Ressourcen am besten verteilt werden."
GER_the_german_stakhanovite_movement:	"Die deutsche Stachanow-Bewegung"
GER_the_german_stakhanovite_movement_desc:	"Die Sachonow-Bewegung entstand in [SOV.GetName] unter der kommunistischen Herrschaft, als die Arbeiter begannen, stolz darauf zu sein, härter zu arbeiten und mehr zu produzieren, als man eigentlich von ihnen erwartete. Diese Bewegung ließ die Produktion in die Höhe schnellen und gab den Arbeitern ein stärkeres Gefühl der Zielstrebigkeit. Wir sollten in Erwägung ziehen, ähnliche Gefühle hier in [ROOT.GetNameDef] zu fördern."
GER_the_german_stakhanovite_movement_tt:	"Wenn Sie entweder §Y$GER_establish_the_reichswerke$§! oder §Y$GER_invest_in_vereinigte_stahlwerke$§! abschließen, wird dieser Fokus die Menge der Ressourcen verändern, die durch §G5%§! gewonnen werden."
GER_spheres_of_influence:	"Einflusssphären"
GER_spheres_of_influence_desc:	"Da zwei gleichgesinnte Länder so nahe beieinander liegen, müssen wir gleiche Bedingungen für uns und [SOV.GetAdjective] schaffen. Indem wir eine Einflusssphäre einrichten und eine für unsere Kameraden im Osten bestimmen, begrenzen wir das Risiko eines bewaffneten Konflikts."
GER_spheres_of_influence_tt:	"Wir und §Y[SOV.GetNameWithFlag]§! werden unsere Einflusssphären in §YEuropa§! einrichten. \n\nUnsere §YSphere of Influence§! wird umfassen:\n§Y[SWE.GetNameWithFlag]\n[NOR.GetNameWithFlag]\n[DEN.GetNameWithFlag]\n[POL.GetNameWithFlag]§! (Westen)\n§Y[CZE.GetNameWithFlag]§! (Westen)\n§Y[HUN.GetNameWithFlag]§!\n\nIhre §YSphere of Influence wird umfassen§!: \n§Y[FIN.GetNameWithFlag]\n[EST.GetNameWithFlag]\n[LAT.GetNameWithFlag]\n[LIT.GetNameWithFlag]\n[SLO.GetNameWithFlag]\n[POL.GetNameWithFlag]§! (Osten)\n§Y[ROM.GetNameWithFlag]\n[BUL.GetNameWithFlag]\n[YUG.GetNameWithFlag]§!"
GER_czechoslovakia:	"Befreit die Arbeiter in [CZE.GetName]"
GER_czechoslovakia_desc:	"Gleich jenseits der Grenze im Süden, in [CZE.GetNameDef], gibt es immer noch Arbeiter, die von den Fesseln des Kapitalismus befreit werden müssen. Sie müssen erst noch das Licht der richtigen Form des Kommunismus erblicken, und wir müssen dafür sorgen, dass wir es ihnen bringen, auf welche Weise auch immer. Das ist unsere Pflicht als gute Kameraden."
GER_poland:	"Beschützen Sie das [POL.GetAdjective] Proletariat"
GER_poland_desc:	"Das Proletariat in [POL.GetNameDef] genießt noch nicht die gleichen Rechte wie unsere [ROOT.GetAdjective] Arbeiter. Da sie unter ihrer derzeitigen Führung nicht gedeihen, könnte es an der Zeit sein, dass wir uns für ihre Befreiung und ihren Schutz einsetzen."
GER_hungary:	"Beenden Sie die Unterdrückung von [HUN.GetAdjective] Arbeitern"
GER_hungary_desc:	"Die Arbeiter in [HUN.GetNameDef] kämpfen immer noch für Rechte, die eine Grundlage sein sollten. Die Regierung des Landes hat es eindeutig versäumt, ihre Bedürfnisse zu erkennen. Deshalb müssen wir eingreifen, um sicherzustellen, dass das Proletariat in ganz [HUN.GetName] fair und mit dem Respekt behandelt wird, den es verdient."
GER_the_northern_shield:	"Der Nordische Schild"
GER_the_northern_shield_desc:	"Die nordischen Länder sind reich an Ressourcen, aber trotz ihrer Bemühungen, ihre Arbeiter gewerkschaftlich zu organisieren, leidet das Proletariat immer noch unter den kapitalistischen Interessen. Wir sind der Meinung, dass die Arbeiter nicht nur etwas Besseres verdient haben, sondern dass auch wir diese Ressourcen viel besser nutzen könnten. Die Ausbeutung der nordischen Arbeiter muss ein Ende haben!"
GER_sign_the_second_treaty_of_berlin:	"Unterzeichnen Sie den Zweiten Vertrag von Berlin"
GER_sign_the_second_treaty_of_berlin_desc:	"Wir sind uns unserer großen Armee bewusst, aber wir sind uns auch bewusst, dass [SOV.GetNameDef] eine Armee hat, mit der wir uns nicht anlegen wollen. Indem wir uns die Hand reichen und sicherstellen, dass wir auf derselben Seite stehen, um Feindseligkeiten zu vermeiden, können wir eine bessere Zukunft für alle Arbeiter in unseren jeweiligen Ländern sicherstellen."
GER_defense_treaty_with_the_soviet:	"Verteidigungsabkommen mit der Sowjetunion"
GER_defense_treaty_with_the_soviet_desc:	"Jetzt, da wir mit den [SOV.GetAdjective]s vereinbart haben, keine Feindseligkeiten zu führen, sollten wir erwägen, die diplomatischen Beziehungen einen Schritt weiter zu führen. Wir halten sie unseres Schutzes für würdig und gehen davon aus, dass sie das Gleiche empfinden und dass ein gegenseitiger Verteidigungsvertrag ebenso in ihrem Interesse liegt wie in unserem."
GER_industrial_cooperation:	"Industrielle Zusammenarbeit"
GER_industrial_cooperation_desc:	"Unsere Zusammenarbeit mit den [SOV.GetAdjective]s hat sich bisher auf militärische Angelegenheiten beschränkt. In Anbetracht der Tatsache, dass [SOV.GetNameDef] ein Verbündeter von uns ist, wäre es nur sinnvoll, wenn wir auch in anderen Bereichen zusammenarbeiten würden. Unsere Industriephilosophien sind sich bereits so ähnlich, dass gemeinsame Anstrengungen im industriellen Bereich nicht schwer zu erreichen sein sollten."
GER_tech_sharing:	"Gemeinsame Nutzung industrieller Technologie"
GER_tech_sharing_desc:	"Der Austausch von Technologien zwischen uns und anderen gleichgesinnten Ländern sollte etwas sein, das wir anstreben sollten. Die [SOV.GetAdjective]s für dieses Vorhaben anzusprechen, scheint die vernünftigste Vorgehensweise zu sein."
GER_resource_trade:	"Handel mit Ressourcen"
GER_resource_trade_desc:	"Auch wenn wir danach streben, uns so weit wie möglich selbst zu versorgen, müssen wir uns erlauben, mit Ländern zu handeln, die unsere Ideale teilen. Wenn wir [SOV.GetNameDef] eine gewisse Gegenleistung in Form von Industriekapazitäten anbieten, sollten wir in der Lage sein, uns einen sehr vorteilhaften Handel mit ihnen zu sichern."
GER_factories_for_resources:	"Fabriken für Ressourcen"
GER_factories_for_resources_desc:	"Wir haben eine Fülle von ziviler Industrie in [ROOT.GetNameDef], die besser genutzt werden könnte. Wir sind uns bewusst, dass [SOV.GetNameDef] in einigen Regionen eher unterentwickelt ist, zufälligerweise sind diese Regionen auch oft reich an wertvollen Ressourcen. Ein Vorschlag, einige Industrien im Gegenzug für einige dieser Ressourcen anzusiedeln, könnte sich für uns als lukrative Möglichkeit erweisen."
GER_factories_for_resources_tt:	"Schaltet §YDecisions§! frei, um im Gegenzug für Ressourcen Industrien nach §Y[SOV.GetNameWithFlag]§! zu verlagern."
GER_monarchist_sentiment:	"Monarchistische Gesinnung"
GER_monarchist_sentiment_desc:	"Die Menschen wollen eine Monarchie, und das werden sie auch bekommen. Auch wenn die konkrete Regierungsform noch nicht feststeht, so ist doch klar, dass das deutsche Volk seinen Kaiser zurückhaben will."
GER_the_monarchy_compromise_ww:	"$GER_the_monarchy_compromise$"
GER_the_monarchy_compromise_ww_desc:	"$GER_the_monarchy_compromise_desc$"
GER_re_establish_free_elections_ww:	"$GER_reestablish_free_elections$"
GER_re_establish_free_elections_ww_desc:	"$GER_reestablish_free_elections_desc$ $GER_reestablish_free_elections_desc$"
GER_re_ratify_the_locarno_treaty:	"Den Vertrag von Locarno erneut ratifizieren"
GER_re_ratify_the_locarno_treaty_desc:	"Die Locarno-Verträge wurden 1925 unterzeichnet. Mit ihnen versuchte die Entente, die Beziehungen zu uns zu normalisieren und gleichzeitig die territoriale Integrität in Europa zu sichern. Auch wenn er uns gegenüber als repressiv empfunden wurde, ist es klar, dass es das Beste ist, Hitlers Fehler, sich ihm zu widersetzen, rückgängig zu machen."
GER_re_ratify_the_locarno_treaty_tt:	"§Y[FRA.GetNameDefCap]§! wird eher bereit sein, diplomatische Maßnahmen zu akzeptieren, die wir ergreifen."
GER_franco_germanic_pact:	"Deutsch-französischer Pakt"
GER_franco_germanic_pact_desc:	"Nach der kürzlichen Normalisierung unserer Beziehungen zu den [FRA.GetAdjective] wäre es klug, unsere Beziehungen zu vertiefen und einen Pakt der Freundschaft und des gegenseitigen Beistands zu schließen, damit wir gemeinsam gegen die [SOV.GetAdjective] im Osten bestehen können."
GER_request_the_return_of_french_held_colonies:	"Fordern Sie die Rückgabe der von Frankreich gehaltenen Kolonien"
GER_request_the_return_of_french_held_colonies_desc:	"Am Ende des Großen Krieges wurden wir unserer kolonialen Besitztümer beraubt. Da die Deutsche Kolonialgesellschaft unter Adenauer wieder an Popularität gewinnt, ist es vielleicht an der Zeit, unsere alten Kolonien Kamerun und Togoland zurückzufordern. Je besser unsere Beziehungen zu Frankreich sind, desto größer ist die Wahrscheinlichkeit, dass sie uns erlauben, das Gebiet zurückzugewinnen."
GER_offer_trade_proposal:	"Handelsangebot unterbreiten"
GER_offer_trade_proposal_desc:	"Es gibt viele Staaten mit reichhaltigen natürlichen Ressourcen, mit denen sich der Handel als äußerst profitabel erweisen würde. Die indonesischen und kongolesischen Territorien sind reich an Kautschuk und seltenen Metallen. Handelsabkommen mit [BEL.GetNameDEF] und [HOL.GetNameDef] würden es uns ermöglichen, die reichen Ressourcen ihrer Kolonien für unsere Industrien zu nutzen."
GER_reverse_the_brain_drain_ww:	"$GER_reverse_the_brain_drain$"
GER_reverse_the_brain_drain_ww_desc:	"$GER_reverse_the_brain_drain_desc$"
GER_shared_rd_programs_ww:	"$GER_shared_rd_programs$"
GER_shared_rd_programs_ww_desc:	"$GER_shared_rd_programs_desc$ $GER_shared_rd_programs_desc$"
GER_shared_rd_programs_ww_tt:	"Der Forschungsgeschwindigkeitsbonus von §Y$GER_rnd_programs_modifier$§! erhöht sich um §G1%§! für jedes neue Fraktionsmitglied, bis zu einem Maximum von §G10%§!"
GER_shared_rd_programs_2_tt:	"Jede §YNation§! in unserer §YFaction§! wird auch Mitglied der §YCentral European Research§! Sharing Group."
GER_pool_technical_know_how_ww:	"$GER_pool_technical_know_how$"
GER_pool_technical_know_how_ww_desc:	"$GER_pool_technical_know_how_desc$"
GER_the_mannheim_project_ww:	"Das Mannheimer Projekt"
GER_the_mannheim_project_ww_desc:	"Wir sollten unsere Anstrengungen verdoppeln, um die Geheimnisse des Atoms zu entschlüsseln und es als Waffe gegen die [SOV.GetAdjective] einzusetzen. Dank unserer neu gewonnenen Verbündeten, die vielleicht bereit sind, alle Informationen, die sie zu diesem Thema haben, mit uns zu teilen, wird dies einfacher sein."
GER_ban_political_uniforms:	"Verbieten Sie politische Uniformen"
GER_ban_political_uniforms_desc:	"Die Weimarer Zeit war geprägt von paramilitärischen Organisationen und politischen Gruppen, die ihren Kampf auf die Straße trugen. Um Stabilität für die Zukunft zu gewährleisten, sollten wir diese offene Zurschaustellung der politischen Zugehörigkeit verbieten."
GER_embrace_liberal_leanings:	"Umfassen Sie liberale Tendenzen"
GER_embrace_liberal_leanings_desc:	"Der Konservatismus hat sich als überholt erwiesen, als unser Kaiser nicht das tun konnte, was unsere Politiker am Ende des Krieges tun konnten. Wir sollten immer nach vorne schauen und nach einem besseren Morgen streben!"
GER_strive_for_conservative_values:	"Streben Sie nach konservativen Werten"
GER_strive_for_conservative_values_desc:	"Liberale Ideen haben in unserem Land zu lange um sich gegriffen, den Verstand unserer Männer geschwächt und unsere Politiker korrumpiert. Wir müssen zu unseren guten, altmodischen Werten zurückkehren, damit das Chaos der Weimarer Republik nie wiederkehren kann."
GER_strengthen_the_welfare_state:	"Stärken Sie den Wohlfahrtsstaat"
GER_strengthen_the_welfare_state_desc:	"Unser Land hat eine lange Geschichte als Wohlfahrtsstaat, und wir haben nicht vor, dies jetzt zu ändern. Wir müssen an unseren Prinzipien festhalten und dafür sorgen, dass unsere Bürger ein so gutes Leben führen, wie wir es ihnen ermöglichen können."
GER_democratic_shield:	"Demokratischer Schutzschild"
GER_democratic_shield_desc:	"Die Demokratie ist überall auf der Welt in Gefahr, so wie sie es einst auch in unserem Land war. Wir kennen die Schrecken der autoritären und totalitären Populisten und müssen dafür sorgen, dass die Menschen in anderen Nationen nicht das durchmachen müssen, was wir einst erlebt haben."
GER_send_military_support_democratic_shield_tt:	"Schaltet die Entscheidung frei, §YSend Military Equipment§! to §YDemocratic§! countries at war"
GER_revive_the_kaiserreich_ww:	"$GER_revive_the_kaiserreich$"
GER_revive_the_kaiserreich_ww_desc:	"$GER_revive_the_kaiserreich_desc$"
GER_return_of_the_kaiser_ww:	"Die Rückkehr des Kaisers"
GER_return_of_the_kaiser_ww_desc:	"Das Kaiserreich braucht einen Kaiser, und Wilhelm II. lebt noch immer im niederländischen Exil. Wir werden sein Exil aufheben und ihn einladen, zurückzukehren und den Thron zu besteigen, ungeachtet dessen, was die westlichen Demokratien denken mögen."
GER_military_dictatorship:	"Militärdiktatur"
GER_military_dictatorship_desc:	"Der Große Krieg hat uns gezeigt, dass der Kaiser allein nicht ausreicht, um unsere Nation in die bestmögliche Richtung zu lenken. Wie damals muss die neue Oberste Heeresleitung erneut diktatorische Befugnisse übernehmen und zur einzigen politischen Instanz im Reich werden."
GER_military_dictatorship_tt:	"§YDas Deutsche Reich§! wird als §YDas Deutsche Kaiserreich§! bekannt sein.\n"
GER_invite_scientists_back:	"Die Kaiserliche Wissenschaftsinitiative"
GER_invite_scientists_back_desc:	"Als die Nazis die Macht übernahmen, flohen viele kluge Köpfe aus dem Land, und das aus gutem Grund. Jetzt jedoch, da unser glorreiches Reich wiederhergestellt ist, könnten viele bereit sein, wieder zu uns zurückzukehren."
GER_glorious_mechanical_machinations:	"Glorreiche mechanische Machinationen"
GER_glorious_mechanical_machinations_desc:	"Unser Kaiser ist seit langem von großartigen Maschinen fasziniert und hat unseren Wissenschaftlern befohlen, der Erforschung von Kreationen, die man bisher nur in Träumen gesehen hat, Priorität einzuräumen. Dazu gehören massive Eisenbahnkanonen, Flugzeuge, die den Atlantik überqueren können, und Schiffe, deren Silhouetten den Horizont überdecken."
GER_prussian_artillery:	"Die preußische Artillerie-Doktrin"
GER_prussian_artillery_desc:	"Früher konnten wir dank unserer überlegenen Doktrinen Schlacht um Schlacht gewinnen. Qualität und Feuerkraft haben einen großen Anteil daran, dass diese Taktik so erfolgreich war, und wir müssen wieder versuchen, sie nachzuahmen!"
GER_fan_prussian_militarism:	"$GER_fan_the_prussian_militarism$"
GER_fan_prussian_militarism_desc:	"$GER_fan_the_prussian_militarism_desc$"
GER_fan_prussian_militarism_tt:	"Schaltet §YRupprecht von Wittelsbach§! als Feldmarschall der Stufe 4 frei"
GER_re_form_the_freikorps:	"Stellen Sie das Freikorps wieder her"
GER_re_form_the_freikorps_desc:	"Die Freikorps haben uns lange Zeit im Kampf gegen unsere ideologischen Gegner unterstützt. Sie halfen uns unter anderem bei der Niederschlagung der Bayerischen Räterepublik in der Weimarer Zeit. Wir sollten versuchen, eine solche paramilitärische Truppe wieder aufzubauen, damit weder die Kommunisten noch die Nazis in unserem Land wieder Fuß fassen können."
GER_freikrops_militia_recruitment_tt:	"Gewinnen Sie fünf Freikorps §YMilitia§! Einheiten"
GER_re_form_the_freikorps_generals_tt:	"§YFranz Ritter von Epp§! und §YHermann Erhardt§! werden als Generäle verfügbar"
GER_re_establish_the_landwehr:	"Wiedereinführung der Landeswehr"
GER_re_establish_the_landwehr_desc:	"Die Landwehr ist seit 1813 ein nützliches Instrument der Selbstverteidigung und hat sich für die Weimarer Republik als sehr nützlich erwiesen. Wir sollten uns auch darum bemühen, die Männer unserer Nation nützlich zu machen und unsere eigenen Landwehr- und Landesschützenbataillone aufzustellen."
GER_all_for_the_front:	"Alle für die Front!"
GER_all_for_the_front_desc:	"Jeder Mann muss sein Herz, sein Blut und seine Seele für die deutsche Nation geben, wenn er möchte, dass sein Vaterland seinen früheren Ruhm zurückgewinnt. Alles, was wir machen, sollte für die Front sein, und das ist eine Realität, die unser Volk mit der Zeit verstehen muss."
GER_expatriate_the_communists_ww:	"$GER_expatriate_the_communists$"
GER_expatriate_the_communists_ww_desc:	"$GER_expatriate_the_communists_desc$"
GER_demand_the_return_of_southern_jutland:	"Fordern Sie die Rückgabe von Südjütland"
GER_demand_the_return_of_southern_jutland_desc:	"Der Besitz des Herzogtums Schleswig ist seit langem eine strittige Angelegenheit zwischen uns und den Dänen. Am Ende des Ersten Weltkriegs hat die Entente Nordschleswig an die Dänen verschenkt, obwohl sie gar nicht daran teilgenommen hat. Wir müssen diese historische Ungerechtigkeit ungeschehen machen und von der dänischen Regierung verlangen, dass sie uns das Land zurückgibt."
GER_glory_to_the_imperial_army:	"Ruhm für die kaiserliche Armee"
GER_glory_to_the_imperial_army_desc:	"Die kaiserliche Armee hat Schlacht um Schlacht gewonnen und dafür gesorgt, dass Preußen und Deutschland ihren Platz in Europa gefunden haben. Trotz des Verrats durch die Politiker am Ende des Weltkriegs wird die Armee ihren verlorenen Glanz zurückgewinnen können."
GER_glory_to_the_imperial_army_tt:	"Schaltet §YPrinz Eitel Friedrich§! als General der Stufe 2 frei"
GER_restore_the_holy_roman_empire:	"Stellen Sie das Heilige Römische Reich wieder her"
GER_restore_the_holy_roman_empire_desc:	"Viele bezweifelten, dass ein Tag wie dieser jemals kommen würde, aber nun ist er da. Nachdem die alten Grenzen des Reiches zurückerobert wurden, können wir vielleicht wieder einen Kaiser des Heiligen Römischen Reiches krönen, dieses Mal jedoch in Form einer vereinten Nation. Ruhm für das Reich!"
GER_weltpolitik:	"Weltpolitik"
GER_weltpolitik_desc:	"Wir werden erst dann als Großmacht ernst genommen werden, wenn wir unser Weltreich wiederhergestellt oder ein neues aufgebaut haben. Wir müssen also anfangen, nach außen zu blicken und nicht mehr nur den europäischen Kontinent im Auge haben."
GER_prepare_for_the_next_naval_blockade:	"Bereiten Sie sich auf die nächste Seeblockade vor"
GER_prepare_for_the_next_naval_blockade_desc:	"Wir wissen, was das letzte Mal passiert ist, als wir gegen Feinde mit einer größeren Flotte als der unseren gekämpft haben. Dank des Wissens, das wir jetzt besitzen, können wir versuchen, viele der Probleme, mit denen wir einst konfrontiert waren, durch sorgfältige Vorbereitungen zu umgehen, bevor der Krieg überhaupt begonnen hat."
GER_accept_british_naval_dominance_ww:	"$GER_accept_british_naval_dominance$"
GER_accept_british_naval_dominance_ww_desc:	"$GER_accept_british_naval_dominance_desc$"
GER_carve_up_congo:	"Zerstückeln Sie den Kongo"
GER_carve_up_congo_desc:	"Der Kongo ist reif für eine Kolonialisierung und reich an natürlichen Ressourcen. Vielleicht könnten wir uns mit den britischen Beschwichtigern darauf einigen, dieses riesige Gebiet untereinander aufzuteilen, als großen Schritt zur Reform unseres Kolonialreiches."
GER_anglo_germanic_defense_pact:	"Deutsch-britischer Verteidigungspakt"
GER_anglo_germanic_defense_pact_desc:	"Die Briten sind seit langem unsere Feinde, aber angesichts der jüngsten Entwicklungen könnten wir mit ihnen ein Verteidigungsabkommen schließen, das besagt, dass, wenn jemand einen von uns angreift, er beide angreift. Dies wäre ein großer Schritt zur Normalisierung der Beziehungen zu ihrem Staat."
GER_signed_the_anglo_german_defence_pact_opm:	"Unterzeichnung des deutsch-britischen Verteidigungspaktes"
GER_anglo_germanic_cooperation_program:	"Deutsch-Britisches Kooperationsprogramm"
GER_anglo_germanic_cooperation_program_desc:	"Die Royal Navy verfügt über ein enormes Wissen in den Bereichen Schiffbau und Seekampf. Dank unserer engen Zusammenarbeit werden wir möglicherweise in der Lage sein, Wissen zu erlangen und zu nutzen, das die Briten bisher als streng gehütetes Geheimnis gehütet haben."
GER_carte_blanche_for_alsace_and_french_colonies_ww:	"$GER_carte_blanche_for_alsace_and_french_colonies$"
GER_carte_blanche_for_alsace_and_french_colonies_ww_desc:	"$GER_carte_blanche_for_alsace_and_french_colonies_desc$"
GER_petition_for_the_return_of_old_colonies:	"Petition für die Rückgabe der alten Kolonien"
GER_petition_for_the_return_of_old_colonies_desc:	"Unsere neu gewonnenen britischen Freunde könnten bereit sein, über die Rückgabe unserer Kolonien zu diskutieren, die sie am Ende des Großen Krieges übernommen haben. Sie werden vielleicht eine Art von Entschädigung verlangen, aber wir wären dazu bereit, wenn dies die Wiederherstellung unserer alten Ansprüche bedeuten würde."
GER_unify_west_africa:	"Südwestafrika vereinigen"
GER_unify_west_africa_desc:	"Unsere Träume von Mittelafrika werden derzeit durch die Existenz der angolanischen Region behindert. Um unsere Gebiete in Südwestafrika mit unseren kongolesischen Besitztümern zu verbinden, müssen wir ein Ultimatum stellen, in dem wir die sofortige Anerkennung unserer Herrschaft über dieses Gebiet fordern."
GER_expand_pacific_holdings:	"Pazifische Holdings ausbauen"
GER_expand_pacific_holdings_desc:	"Mit einem blutigen Zahn für ein Imperium im Pazifischen Ozean setzen sich unsere Politiker für die Ausweitung unserer Reichweite in der Region ein, mit dem Ziel, [ROOT.GetAdjective] Hegemonie im Fernen Osten zu errichten. Wir sollten diese Initiative unterstützen und in die Offensive gehen."
GER_closer_sino_germanic_relations:	"Engere deutsch-chinesische Beziehungen"
GER_closer_sino_germanic_relations_desc:	"Die [CHI.GetAdjective] sind seit langem unsere Verbündeten. Viele hielten es damals für wahrscheinlich, dass die [CHI.GetAdjective] Regierung auf unserer Seite in den Großen Krieg eintreten würde. Wir sollten unsere Beziehung zu ihnen schätzen und versuchen, das Band zwischen unseren Nationen zu stärken."
CHI_has_accepted_german_overtures:	"China hat [ROOt.GetAdjective] Angebote angenommen"
GER_industrial_investments:	"Industrielle Investitionen"
GER_industrial_investments_desc:	"[CHI.GetNameDefCap] ist sehr unterentwickelt und verfügt nicht über die Industrialisierung, die es bräuchte, um auf der Weltbühne als Großmacht zu bestehen. Wir sollten Ingenieure entsenden, um bei der Industrialisierung zu helfen, und aufstrebende [CHI.GetAdjective] Unternehmen finanzieren, um ihnen bei ihrem industriellen Wachstum zu helfen."
GER_launch_sino_germanic_joint_research_program:	"Starten Sie ein gemeinsames chinesisch-deutsches Forschungsprogramm"
GER_launch_sino_germanic_joint_research_program_desc:	"Die [CHI.GetAdjective] verfügen über Wissen, das für sie wertvoll wäre, und wir wissen eine Menge, das auch für sie nützlich wäre. Daher sollten wir uns bemühen, ein gemeinsames Forschungs- und Entwicklungsteam aufzubauen, das den Fortschritt unserer beiden Nationen gemeinsam fördern kann."
GER_send_military_aid:	"Senden Sie militärische Hilfe"
GER_send_military_aid_desc:	"Unsere Freunde in [CHI.GetNameDef] sind von Feinden umgeben, von denen viele versuchen, die Existenz ihres Staates zu bedrohen. Wir müssen ihnen Munition und Ausrüstung schicken, damit sie ihre Grenzen sichern und uns in den kommenden Jahren nützlich sein können."
GER_send_volunteers:	"Die Fernöstliche Legion"
GER_send_volunteers_desc:	"Viele [ROOT.GetAdjective]s sehnen sich nach Abenteuern und wollen für eine gute Sache kämpfen. Wir sollten daher eine Legion von 'Freiwilligen' aufstellen, die unseren [CHI.GetAdjective] Freunden in ihren Kriegen helfen."
GER_request_the_return_of_qingdao:	"Fordern Sie die Rückgabe von Qingdao"
GER_request_the_return_of_qingdao_desc:	"Tsingtao war einer der vielen Vertragshäfen, die China in seinem Jahrhundert der Demütigung erobert hat. Obwohl wir die Stadt und das Ende des Großen Krieges verloren haben, eine Stadt, die uns vor so vielen Jahren abgetreten wurde, könnten wir jetzt die Gelegenheit finden, sie von [CHI.GetNameDef] zurückzufordern, vorausgesetzt, wir haben die richtigen Entschädigungen bereit."
GER_the_sino_germanic_pact:	"Der deutsch-chinesische Pakt"
GER_the_sino_germanic_pact_desc:	"Es ist endlich an der Zeit, die [CHI.GetAdjective] Regierung offiziell als Verbündeten anzuerkennen. Wir sollten dieses Bündnis sofort formalisieren, damit wir uns gemeinsam gegen all diejenigen stellen können, die uns unterdrücken wollen!"
GER_divide_and_conquer:	"Teile und herrsche"
GER_divide_and_conquer_desc:	"Wir und die [CHI.GetAdjective] haben unsere gewünschten Einflusssphären im Fernen Osten, und irgendwann müssen die Grenzen gezogen und respektiert werden. Deshalb sollten wir das so schnell wie möglich tun, damit unsere beiden imperialen Träume anerkannt werden können."
GER_asian_spheres_of_influence_tt:	"Wir und §Y[CHI.GetNameWithFlag]§! werden unsere Einflusssphären in §YAsia§! einrichten und dabei die Kosten für die Einnahme von Staaten innerhalb und außerhalb der jeweiligen Sphäre des anderen anpassen. \n\nUnsere §YSphere of Influence§! wird umfassen:\n§Y[MAL.GetNameWithFlag]§!\n§Y[INS.GetNameWithFlag]§!\n§Y[PHI.GetNameWithFlag]§!\n§Y[AST.GetNameWithFlag]§!\n§Y[NZL.GetNameWithFlag]§!\nAlle §YSouth Pacific Islands§!\n\nIhre §YSphere of Influence§! wird umfassen: \n§Y[SIA.GetNameWithFlag]\n[VIN.GetNameWithFlag]\n[CAM.GetNameWithFlag]\n[LAO.GetNameWithFlag]\n[CHI.GetNameWithFlag]\n[RAJ.GetNameWithFlag]\n[TIB.GetNameWithFlag]\n[NEP.GetNameWithFlag]\n[BHU.GetNameWithFlag]\n[KOR.GetNameWithFlag]\n[JAP.GetNameWithFlag]\n[MON.GetNameWithFlag]§!"
GER_the_second_naval_race:	"Das zweite Seewettrennen"
GER_the_second_naval_race_desc:	"Wir sind schon viel zu lange von den Briten und Franzosen gedemütigt worden! Es ist höchste Zeit, dass wir unsere Flotten wiederherstellen und offiziell erklären, dass wir uns nicht länger vor ihnen beugen werden. Bald werden sie feststellen, dass die Meere uns gehören und niemandem sonst."
GER_rebuild_the_high_seas_fleet_ww:	"$GER_rebuild_the_high_seas_fleet$"
GER_rebuild_the_high_seas_fleet_ww_desc:	"$GER_rebuild_the_high_seas_fleet_desc$"
GER_break_anglo_french_colonial_hegemony_ww:	"$GER_break_the_anglo_french_colonial_hegemony$"
GER_break_anglo_french_colonial_hegemony_ww_desc:	"$GER_break_the_anglo_french_colonial_hegemony_desc$"
GER_break_anglo_french_colonial_hegemony_ww_tt:	"Wenn wir einen Vertrag über gegenseitige Zusammenarbeit mit §YFrance§! unterzeichnet haben, werden wir kein Kriegsziel gegen sie erreichen"
GER_asian_allies:	"Asiatische Verbündete"
GER_asian_allies_desc:	"Es gibt viele kleinere Nationen in Asien, die nicht unter die Kontrolle unserer Feinde geraten sind. Wenn man ihnen eine sichere Zukunft und territoriale Gewinne verspricht, sind sie vielleicht bereit, uns in unserem globalen Konflikt zu unterstützen."
GER_our_place_in_the_sun_ww:	"Unser Platz an der Sonne"
GER_our_place_in_the_sun_ww_desc:	"Lassen Sie alle wissen, dass [ROOT.GetNameDef] einmal mehr sein Recht auf einen Platz an der Sonne einfordert! Unser Volk wird nicht länger im Schatten gedemütigt werden, unter der Fuchtel des Imperiums, über dem die Sonne niemals untergeht!"
GER_realize_mittelafrika:	"Verwirklichen Sie Mittelafrika"
GER_realize_mittelafrika_desc:	"Unser Kolonialreich wird sich weit ausdehnen, und die Reichtümer Mittelafrikas waren schon immer verlockend. Wir sollten unsere Träume von einem deutschen Mittelafrika so schnell wie möglich verwirklichen, damit wir uns das Herz Afrikas zunutze machen können."
GER_realize_mittelafrika_tt:	"Erhebt Anspruch auf alle §YCongolese§!, §YKenyan§!, §YAngolan§! und §YMozambican§! Staaten."
GER_african_allies:	"Afrikanische Verbündete"
GER_african_allies_desc:	"Die Menschen in Afrika sehnen sich nach der Befreiung von den Europäern. Vielleicht können wir sie mit dem Versprechen von Autonomie auf unsere Seite ziehen, wenn sie sich uns anschließen."
GER_african_allies_tt:	"Schaltet Entscheidungen zur §YSUnterstützung der Unabhängigkeit§! der §YAfrican§! Länder frei"
GER_asian_allies_faction_tt:	"Unabhängige asiatische Minderjährige, die derzeit nicht in einer Fraktion sind, erhalten das folgende Ereignis:"
GER_african_allies_faction_tt:	"Unabhängige afrikanische Minderjährige, die derzeit keiner Fraktion angehören, erhalten das folgende Ereignis:"
GER_asian_allies_tt:	"Schaltet Entscheidungen zur §YSUnterstützung der Unabhängigkeit§! von §YAsian§! Ländern frei"
GER_expand_african_reach:	"Erweitern Sie die Reichweite Afrikas"
GER_expand_african_reach_desc:	"Es gibt Regionen in Afrika, auf die wir Anspruch erheben, die nicht unter der Kontrolle unserer derzeitigen Feinde stehen. Wir sollten sicherstellen, dass unsere Ansprüche deutlich gemacht werden, und diese Gebiete sofort von ihnen einfordern."
GER_realpolitik:	"Realpolitik"
GER_realpolitik_desc:	"Es ist an der Zeit, dass wir einen Blick auf das übrige Europa werfen und sehen, in welche Richtung der Wind weht. Wenn sich Gelegenheiten für Bündnisse oder Eroberungen ergeben, müssen wir sie sofort ergreifen."
GER_restore_the_brest_litovsk_borders:	"Die Grenzen von Brest-Litowsk wiederherstellen"
GER_restore_the_brest_litovsk_borders_desc:	"Die im Vertrag von Brest-Litowsk festgelegten Grenzen sind durch den Vertrag von Versailles längst unrechtmäßig aufgehoben worden, obwohl die Russen den Großen Krieg verloren und das Land an uns abgetreten haben. Wir müssen uns bemühen, unsere verlorenen östlichen Besitztümer wiederzuerlangen, auch wenn dies in Zukunft zu einem Krieg führen könnte."
GER_demand_further_polish_concessions:	"Fordern Sie weitere polnische Zugeständnisse"
GER_demand_further_polish_concessions_desc:	"Wir haben die Polen dazu gebracht, die wesentlichen Teile des alten Reiches an uns abzutreten, aber wir werden nicht dabei stehen bleiben. Die Grenzen von Brest-Litowsk sind noch nicht wiederhergestellt, und Polen steht uns bei der Verwirklichung unserer Träume noch im Weg."
GER_restore_eastern_imperial_possessions:	"Östliche kaiserliche Besitztümer wiederherstellen"
GER_restore_eastern_imperial_possessions_desc:	"Länder, die zu unserem Reich gehören, werden uns derzeit von fremden Mächten vorenthalten. Um die Grenzen von Brest-Litowsk zu verwirklichen, müssen wir uns zunächst um Posen, Westpreußen und Schlesien kümmern."
GER_incorporate_the_polish_rump_state:	"Den polnischen Rumpfstaat eingliedern"
GER_incorporate_the_polish_rump_state_desc:	"Auch die letzten verbliebenen Teile Polens gehören zum Reich, wie es im Vertrag von Brest-Litowsk festgelegt wurde. Wir müssen diese Gebiete zurückfordern, wenn nötig mit Gewalt."
GER_memel_ultimatum:	"Memel-Ultimatum"
GER_memel_ultimatum_desc:	"Wenn wir etwas aus dem Großen Krieg gelernt haben, dann, dass wir uns auf einen Angriff auf unsere entlegenen östlichen Besitzungen vorbereiten müssen. Diese Besitztümer müssen wiederhergestellt und gegen eine Invasion befestigt werden. Dies kann jedoch nicht ohne die Kontrolle über das strategisch wichtige Memelland geschehen, das wir zurückerobern müssen."
GER_demand_lithuanian_integration:	"Fordern Sie die Integration Litauens"
GER_demand_lithuanian_integration_desc:	"Das litauische Königreich sollte einst ein halbautonomer Teil unserer Nation sein, und das wird es auch bleiben. Wir müssen die Annexion der litauischen Ländereien anstreben und Mindaugas zum Herzog der Territorien krönen."
GER_establish_eastern_grand_duchies:	"[GetEasternDuchiesName]"
GER_establish_eastern_grand_duchies_desc:	"Das gesamte Gebiet, das der Vertrag umfasst, kann nicht direkt von uns gehalten werden. Wir haben jedoch Pläne für Großherzogtümer und Satellitenkönigreiche im Osten, die in der Lage sein werden, diese Gebiete für uns zu halten."
GER_eastern_duchies_name_democratic:	"Östliche autonome Staaten"
GER_eastern_duchies_name_neutrality:	"Östliche Großherzogtümer errichten"
GER_subduing_the_baltic_states:	"Unterwerfung der baltischen Staaten"
GER_subduing_the_baltic_states_desc:	"Die baltischen Staaten sind unrechtmäßig und beanspruchen die Territorien unseres Vereinigten Baltischen Herzogtums. Wir müssen sie unterwerfen und die Ländereien an die baltisch-deutsche Aristokratie abtreten."
GER_subduing_the_baltic_states_tt:	"Gewinnen Sie drei Einheiten der Baltischen Landeswehr §YInfanterie§!.\nWenn §YPolen§! die §YBermontians§! nicht wiederhergestellt hat, wird sich §YRüdiger von der Goltz§! uns als Feldmarschall der Stufe 3 anschließen."
GER_strike_eastward:	"Nach Osten vorstoßen"
GER_strike_eastward_desc:	"Nachdem die Grenzen gesichert sind, ist es an der Zeit, dass wir unseren größten Rivalen niederschlagen, denjenigen, der den Vertrag von Brest-Litowsk gebrochen hat und der die Stabilität Osteuropas bedroht, nämlich [SOV.GetNameDef]. Es ist an der Zeit, Moskau zu erobern und den Giganten [SOV.GetAdjective] wirklich in die Knie zu zwingen."
GER_unlocks_kremlin_raid_tt:	"Schaltet §YLuftangriff§! auf §YKremlin§! frei, wenn Sie sich im Krieg mit §Y[SOV.GetNameWithFlag]§! befinden."
GER_end_european_communism:	"Beenden Sie den europäischen Kommunismus"
GER_end_european_communism_desc:	"Jetzt, da die größte Bedrohung für unsere Nation vernichtet wurde, ist es an der Zeit, das Chaos zu beseitigen, das sie in Europa hinterlassen haben. Der Kommunismus ist eine fundamentale Bedrohung für unsere Werte und muss endgültig ausgelöscht werden."
GER_strike_eastward_eq_trigger_tt:	"Mehr als §Y100.000§! Infanterieausrüstung in der Armee"
GER_second_vienna_award_eq_trigger_tt:	"Mehr als §Y60.000§! Infanterieausrüstung in der Armee"
GER_sea_lion_eq_trigger_tt:	"Mehr als §Y90.000§! Infanterie-Ausrüstung in der Armee"
GER_puppet_finland:	"Sicherstellen [FIN.GetAdjective] Loyalität"
GER_puppet_finland_desc:	"[GetFinlandpuppetDescription]"
GER_finland_puppet_description_democratic:	"Die [FIN.GetAdjective] Menschen mögen unsere Waffenbrüder sein, aber wir können nie sicher sein, ob nicht ein Tag kommt, an dem sie uns verraten und die Seiten wechseln. Wir müssen dafür sorgen, dass ein solcher Tag niemals kommt, koste es, was es wolle!"
GER_finland_puppet_description_neutrality:	"Das Volk von [FIN.GetAdjective] hat unser Angebot, einen König einzusetzen, in der Vergangenheit abgelehnt, aber wir werden nicht zulassen, dass sie es wieder tun. Es ist an der Zeit, dass Prinz Wolfgang von Hessen seinen Platz auf dem Thron einnimmt, ob sie es wollen oder nicht."
GER_see_to_the_eastern_front_ww:	"An die Ostfront sehen"
GER_see_to_the_eastern_front_ww_desc:	"Unsere Aktionen im letzten Krieg sind vielen noch in frischer Erinnerung. Wir müssen die Ängste des Kontinents auf die wahre Gefahr lenken: die große [GER.GetGreatRedMenaceDesc], die sich im Osten abzeichnet. Wir werden eine massive Propagandakampagne starten, um die Augen des Kontinents zu öffnen."
GER_the_eastern_threat:	"Die östliche Bedrohung"
guardian_against_the_eastern_threat:	"Wächter gegen die östliche Bedrohung"
existential_threat:	"Existenzielle Bedrohung"
GER_seeks_to_restore_brest_litovsk:	"Streben nach Wiederherstellung von Brest-Litowsk"
GER_seeks_to_restore_brest_litovsk_worse:	"$GER_seeks_to_restore_brest_litovsk$"
GER_safeguard_the_baltic_ww:	"$GER_safeguard_the_baltic$"
GER_safeguard_the_baltic_ww_desc:	"$GER_safeguard_the_baltic_desc$ $GER_safeguard_the_baltic_desc$"
GER_tributes_for_guarantees:	"Tribute für Garantien"
GER_tributes_for_guarantees_desc:	"Wir sollten die baltischen Staaten vor dem Bären im Osten schützen, aber wir werden dies nicht umsonst tun. Da sich diese Nationen in einer so verwundbaren Lage befinden, wäre es ein Leichtes, eine Entschädigung für den Schutz zu verlangen."
tributes_from_lithuania_tt:	"Wenn §Y[LIT.GetNameWithFlag]§! annimmt:"
tributes_from_latvia_or_estonia_tt:	"Wenn §Y[LAT.GetNameWithFlag]§! oder §Y[EST.GetNameWithFlag]§! annimmt:"
GER_will_also_recieve_trade_and_civs_tt:	"Wir werden auch einen kleinen Teil ihrer Ressourcen und der zivilen Industrie erhalten. \n Die Höhe von §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! wird davon abhängen, wie viele Nationen unsere Forderungen akzeptieren"
GER_support_the_finns_ww:	"$GER_support_the_finns$"
GER_support_the_finns_ww_desc:	"Die Finnen befinden sich in der Schußlinie des [GER.GetRussiansDemonym]. Wir werden ihnen eine Garantie gegen die östliche Bedrohung anbieten und ihnen eine bescheidene Industriehilfe gewähren."
GER_danzig_for_guarantees_ww:	"$GER_danzig_for_guarantees$"
GER_danzig_for_guarantees_ww_desc:	"$GER_danzig_for_guarantees_desc$"
GER_safeguard_poland:	"Polen absichern"
GER_safeguard_poland_desc:	"Die Polen sind durch Angriffe aus dem Osten verwundbar. Wir müssen sie um jeden Preis schützen, um einen Pufferstaat zwischen uns und den [SOV.GetAdjective]s zu erhalten."
GER_safeguard_poland_tt:	"Wenn §YPolen§! entweder in unserer Fraktion ist oder von uns garantiert wird, wenn wir §YHold Joint Military Drills§! abschließen, erhalten wir zusätzlich §G25§! §YArmy Experience§! und §G15§! §YAir Experience§!"
GER_offer_military_production_support:	"Bieten Sie militärische Produktionsunterstützung an"
GER_offer_military_production_support_desc:	"Den östlichen Pufferstaaten fehlt die starke industrielle Basis, die wir haben. Wir sollten ihnen Unterstützung bei der Produktion von Waffen und Munition anbieten, damit sie sich hoffentlich eine Zeit lang behaupten können, wenn sie von der [SOV.GetNameDef] angegriffen werden."
GER_offer_military_production_support_tt:	"Alle osteuropäischen Staaten, die unter unserem Schutz stehen, erhalten für §Y730§! Tage den folgenden Schub für ihre §YMilitärische Produktion§!:"
GER_liberate_oppressed_people:	"Befreit unterdrückte Menschen"
GER_liberate_oppressed_people_desc:	"Es gibt viele Menschen in [SOV.GetNameDef], die uns wohlgesonnen sind und sich mehr als alles andere eine Befreiung wünschen. Vielleicht sollten wir sie von ihren Unterdrückern befreien und sie zu unseren neu gefundenen Verbündeten im Osten machen."
GER_liberate_oppressed_people_tt:	"Es wird §G40%§! billiger, sie zu befreien und §G20%§! billiger, sie zu Marionetten von §Y[SOV.GetNameDef]§!-Staaten zu machen."
GER_liberate_oppressed_people_cossacks_tt:	"Ermöglicht die Wiedereinführung der südrussischen §YCossack-Republiken§!."
GER_build_the_eastern_bulwark:	"Bauen Sie das östliche Bollwerk"
GER_build_the_eastern_bulwark_desc:	"Die Länder in unserem Osten haben eine viel zu schwache Verteidigung, um sich gegen die [SOV.GetAdjective] Bedrohung zu wehren. Wir müssen in die Befestigungen dieser Länder investieren, damit der Versuch, sie einzunehmen, für den Feind so kostspielig wie möglich wird."
GER_build_the_eastern_bulwark_tt:	"Baut Stufe 2 §YLand Forts§! in allen Staaten, die §Y[ROOT.GetNameDef]§! gehören, oder in jedem Land, das von §Y[ROOT.GetNameDef]§! garantiert wird oder in einer Fraktion mit §Y[SOV.GetNameDef]§! ist, an der Grenze zu §Y[SOV.GetNameDef]§!."
GER_build_the_eastern_bulwark_ns_tt:	"Wenn wir in den Krieg mit §Y[SOV.GetNameDef]§! eintreten, werden wir gewinnen:"
GER_ally_white_russian_forces:	"Verbündeter der Russischen Weißen Bewegung"
GER_ally_white_russian_forces_desc:	"Es gibt viele Russen, die ins Ausland geflohen sind, nachdem die Roten den russischen Bürgerkrieg gewonnen haben. Wir sollten auf sie zugehen und herausfinden, ob sie bereit sind, bei der Rückeroberung ihrer Heimat zu kooperieren, auch wenn sie dafür ihre Ansprüche auf das Land aufgeben müssen, das uns oder unseren Verbündeten im Vertrag von Brest-Litowsk zugesprochen wurde."
GER_hold_joint_military_drills:	"Halten Sie gemeinsame Militärübungen ab"
GER_hold_joint_military_drills_desc:	"Unsere östlichen Verbündeten haben die [SOV.GetAdjective]s in jüngerer Zeit bekämpft als wir und verfügen möglicherweise über wertvolles Wissen darüber, wie man sie besiegen kann. Wir sollten gemeinsam militärische Übungen veranstalten, damit dieses Wissen weitergegeben werden kann."
GER_hold_joint_military_drills_tt:	"Wir und alle osteuropäischen Länder, für die wir garantieren oder die unserer Fraktion angehören, werden den folgenden Nationalgeist gewinnen:"
GER_extend_mitteleuropas_bounderies:	"Erweitern Sie Mitteleuropas Grenzen nach Osten"
GER_extend_mitteleuropas_bounderies_desc:	"Die Nationen in unserem Osten sind mehr als nur Pufferstaaten. Wir sollten sie in Mitteleuropa einladen und dafür sorgen, dass sie auch dazu beitragen, dass unser Bündnis und unsere Zollunion stärker werden."
GER_extend_mitteleuropas_bounderies_tt:	"Lädt garantiert osteuropäische Staaten in §YMitteleuropa§! ein"
GER_reach_out_to_scandinavia:	"Die Hand nach Skandinavien ausstrecken"
GER_reach_out_to_scandinavia_desc:	"Berge und Kälte sind kein Schutz gegen die [GER.GetGreatRedMenaceName] Bedrohung, und die Skandinavier müssen das wissen. Wir werden ihnen Mitgliedschaft und Schutz gegen die Bedrohung durch die [SOV.GetAdjective] anbieten."
GER_mitteleuropa:	"Mitteleuropa"
GER_mitteleuropa_desc:	"Das Hauptinteressengebiet des deutschen Volkes liegt in Mitteleuropa, das ursprünglich von den Preußen als pangermanistisches, staatszentriertes Imperium geplant war. Diese Ideen könnten noch etwas Feinschliff vertragen, sind aber eine gute Basis, auf der wir die neue Ordnung in Europa aufbauen könnten."
GER_mitteleuropa_tt:	"Schaltet die Entscheidung frei, §A die öffentliche Meinung in Österreich auf unsere Seite zu ziehen§!, was die Bereitschaft erhöht, sowohl ein Bündnis als auch eine Unterwerfung zu akzeptieren."
GER_mitteleuropa_alliance:	"Mitteleuropa"
GER_brothers_in_arms:	"Brüder in den Waffen"
GER_brothers_in_arms_desc:	"Unsere österreichischen Brüder haben als Teil der Mittelmächte zusammen mit uns hart gekämpft. Wir sollten ihnen ein Angebot unterbreiten, zu dem sie nicht nein sagen können, damit wir wieder Seite an Seite kämpfen können."
GER_carve_up_czechoslovakia:	"Zerteilen Sie die Tschechoslowakei"
GER_carve_up_czechoslovakia_desc:	"Der [CZE.GetAdjective] Staat steht nicht nur unseren Ambitionen im Weg, sondern auch denen unserer Verbündeten im Süden. Wir sollten sie zwischen uns aufteilen, damit Mitteleuropa verwirklicht werden kann."
GER_rekindle_imperial_sentiment_ww:	"$GER_rekindle_imperial_sentiment$"
GER_rekindle_imperial_sentiment_ww_desc:	"$GER_rekindle_imperial_sentiment_desc$"
GER_the_first_berlin_award:	"Der erste Berliner Preis"
GER_the_first_berlin_award_desc:	"Die Polen besetzen nicht nur unser Land, sondern auch österreichisch-ungarisches Land. Wir sollten versuchen, sie einzuschüchtern, damit sie diese Gebiete an Mitteleuropa zurückgeben, damit sie nicht den Zorn der deutschen Armeen auf sich ziehen."
GER_the_first_berlin_award_hun_tt:	"Wenn wir in einer Fraktion mit §Y[HUN.GetNameDef]§! sind:"
GER_the_first_berlin_award_aus_tt:	"Wenn wir in einer Fraktion mit §Y[AUS.GetNameDef]§! sind:"
GER_the_second_berlin_award:	"Der Zweite Berliner Preis"
GER_the_second_berlin_award_desc:	"Die Rumänen und Slawen besetzen auch rechtmäßig österreichisch-ungarisches Land. Wir müssen sie auffordern, diese sofort zurückzugeben!"
GER_trade_agreements:	"Handelsabkommen"
GER_trade_agreements_desc:	"Mitteleuropa ist nicht nur ein Machtbündnis, sondern auch eine Union, die zu besseren Handelsbeziehungen und wirtschaftlicher Zusammenarbeit beitragen soll. Wir sollten diese Rolle betonen und sie nutzen, um denjenigen die Hand zu reichen, die reich an natürlichen Ressourcen sind."
GER_trade_agreements_tt:	"Alle Verbündeten werden den §YNational Spirit§! erhalten:"
GER_mitteleuropa_cooperation_sphere:	"Kooperationsraum Mitteleuropa"
GER_mitteleuropa_cooperation_sphere_desc:	"Mitteleuropa verfügt über viele kluge Köpfe. Trotzdem sind sie nicht in der Lage zu kooperieren, weil die verschiedenen Regierungen ihr Wissen für sich behalten wollen. Wir müssen eine engere wissenschaftliche Zusammenarbeit mit unseren Verbündeten fördern."
GER_conquer_italy:	"Erobern Sie Italien"
GER_conquer_italy_desc:	"Die Italiener haben uns während des Großen Krieges verraten, als sie Österreich-Ungarn angriffen und sich auf die Seite der Entente stellten. Das werden wir nie vergessen und nie verzeihen. Es ist an der Zeit, dass wir ihnen beibringen, wozu Verrat und Verräterei letztlich führen."
GER_align_italy:	"Italien verbünden"
GER_align_italy_desc:	"Italien mag uns während des Großen Krieges verraten haben, aber wir dürfen nicht vergessen, dass es über eine beeindruckende Marine verfügt, die es mit unseren Feinden aufnehmen könnte. Wir sollten daher versuchen, unser altes Bündnis mit ihnen wiederherzustellen."
GER_the_austrian_question:	"Die österreichische Frage"
GER_the_austrian_question_desc:	"Die kleine deutsche Lösung war ein Fehler, den wir sofort beheben müssen. Wir sollten die Österreicher zwingen, sich unserer Nation anzuschließen, vielleicht sogar die Gelegenheit nutzen, das Burgenland im Austausch für ein Bündnis mit [HUN.GetNameDef] anzubieten."
GER_the_austrian_question_more_likely_to_accept_tt:	"Sie werden _RLESS§! wahrscheinlich akzeptieren, wenn sie derzeit eine Fraktion anführen."
GER_align_czechoslovakia:	"Verbünden Sie sich mit der Tschechoslowakei"
GER_align_czechoslovakia_desc:	"Der tschechoslowakische Staat ist reich an industriellen Fähigkeiten und natürlichen Ressourcen, da er eines der Kernländer der Industrialisierung in Österreich-Ungarn war. Wir sollten sie Mitteleuropa beitreten lassen, damit wir von ihren Reichtümern profitieren können."
GER_sway_the_balkans:	"Beeinflussen Sie den Balkan"
GER_sway_the_balkans_desc:	"Es gibt viele Nationen auf dem Balkan, die sich von ausländischen Mächten bedroht fühlen. Wir sollten ihnen einen Platz in Mitteleuropa anbieten, damit unsere Union immer stärker werden kann."
GER_sway_the_balkans_tt:	"Entschließt sich, die [ROOT.GetRulingIdeology] Ideologie§! in den Nationen des Balkans§! zu stärken und sie in Mitteleuropa§! einzubinden."
GER_establish_a_customs_union:	"Eine Zollunion gründen"
GER_establish_a_customs_union_desc:	"Wie schon im Septemberprogramm vorgesehen, sollten wir jetzt die Zollunion Mitteleuropa gründen und die europäischen Volkswirtschaften langsam aber sicher zu einer einzigen starken Kraft vereinen."
GER_integrated_economies:	"Integrierte Volkswirtschaften"
GER_integrated_economies_desc:	"Die Integration der Volkswirtschaften unserer Verbündeten mit der unseren und die Einrichtung einer deutschen Zentralbank, die die wirtschaftliche Lage der anderen Staaten überwachen und unterstützen kann, wird langfristig sehr vorteilhaft für uns sein und nicht nur uns stärken, sondern auch ihre Abhängigkeit von uns erhöhen, so dass wir schließlich die Kontrolle über ihre auswärtigen Angelegenheiten übernehmen können."
GER_integrated_economies_tt:	"Jedes §YFaction Mitglied§! erhält das §YEvent:§! [GER.GetNameDefCap] Wünsche für die weitere Integration unserer Wirtschaft"
GER_european_confederation:	"Europäische Konföderation"
GER_european_confederation_desc:	"Da sich unsere Verbündeten nun in hohem Maße auf uns verlassen, ist es an der Zeit, sie weiter zu integrieren, mit dem Traum, eine Europäische Konföderation zu gründen."
GER_bring_turkey_into_the_fold:	"Holen Sie [TUR.GetNameDef] zurück in den Schoß"
GER_bring_turkey_into_the_fold_desc:	"Die Türken haben Ansprüche außerhalb ihrer derzeitigen Grenzen und lassen sich leicht dazu zwingen, sich unserer Fraktion anzuschließen. Es ist an der Zeit, dass wir sie wieder in den Schoß der Nation zurückholen."
GER_german_hegemony_in_the_middle_east:	"Deutsche Hegemonie im Nahen Osten"
GER_german_hegemony_in_the_middle_east_desc:	"Der Nahe Osten ist reif für eine Eroberung, und viele der Staaten könnten bereit sein, sich mit uns zu verbünden, in der Hoffnung, dass wir uns gegen das britische oder französische Imperium stellen. Es ist an der Zeit, dass wir unsere Hegemonie im Nahen Osten festigen."
GER_sway_the_middle_east_decisions_tt:	"Entscheiden Sie, die [ROOT.GetRulingIdeology] Ideologie§! in den Nationen des Nahen Ostens§! zu stärken und sie in Mitteleuropa§! einzubinden."
GER_reject_the_locarno_treaty:	"Den Vertrag von Locarno ablehnen"
GER_reject_the_locarno_treaty_desc:	"Der Vertrag von Locarno wurde eindeutig geschaffen, um uns daran zu hindern, Gebiete zurückzugewinnen, die uns zu Unrecht entrissen wurden. Wir sollten diesen Vertrag rundweg ablehnen und uns auf die Rückeroberung unserer alten Staaten vorbereiten."
GER_backdoor_negotiations:	"Verhandlungen durch die Hintertür"
GER_backdoor_negotiations_desc:	"Wir könnten versuchen, die Einmischung des Westens in den Niederungen zu umgehen, indem wir nicht alle angreifen, sondern einen von ihnen dazu bringen, den anderen anzugreifen, und uns dann auf die Seite eines von ihnen stellen, was effektiv zu einer Spaltung zwischen den alten Nationen in der Region der Großen Niederlande führt."
GER_backdoor_negotiations_tt:	"Diese Entscheidungen ermöglichen es uns, eine der Zielnationen in unsere Fraktion aufzunehmen und gleichzeitig die andere anzugreifen."
GER_schlieffen_once_more_ww:	"$GER_schlieffen_once_more$"
GER_schlieffen_once_more_ww_desc:	"$GER_schlieffen_once_more_desc$"
GER_bypass_maginot_in_the_south_ww:	"$GER_bypass_maginot_in_the_south$"
GER_bypass_maginot_in_the_south_ww_desc:	"$GER_bypass_maginot_in_the_south_desc$"
GER_reinstate_imperial_possessions_ww:	"$GER_reinstate_imperial_possessions$"
GER_reinstate_imperial_possessions_ww_desc:	"$GER_reinstate_imperial_possessions_desc$"
GER_establish_western_grand_duchies:	"[GetWesternDuchiesName]"
GER_western_duchies_name_democratic:	"Westliche Autonome Staaten"
GER_western_duchies_name_neutrality:	"Westliche Großherzogtümer gründen"
GER_establish_western_grand_duchies_desc:	"Wie im Septemberprogramm vorgesehen, sollten wir versuchen, unsere Kontrolle über die westlichen Regionen zu etablieren, indem wir eigene Klientelstaaten gründen und die Grenzen nach unserem Gutdünken aufteilen."
GER_integrate_western_german_speakers:	"Westliche Deutschsprachige integrieren"
GER_integrate_western_german_speakers_desc:	"Das Septemberprogramm sah vor, den Großraum Luxemburg in den deutschen Staat zu integrieren. Sowohl diese Region als auch die Schweiz waren einst Teil des Heiligen Römischen Reiches, dessen alleiniger rechtmäßiger Nachfolger wir sind. Diese germanischen Gebiete müssen so schnell wie möglich wieder in unser Reich eingegliedert werden."
