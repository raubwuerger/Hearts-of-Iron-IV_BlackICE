 BEL_CAS_equipment_1936_desc:0 "Dieses Luftunterstützungsflugzeug litt 1940 unter seiner unzureichenden Geschwindigkeit, die es zu einem leichten Ziel machte, und unter seiner unzureichenden Nutzlast, die die Zerstörung der Brücken des Albert-Kanals für die armen Piloten, die mit diesen letzten Einsätzen beauftragt waren, unmöglich machte."
