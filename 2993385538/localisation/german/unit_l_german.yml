CHI_protected_cruiser_1:0	"Hairong Klasse"
CHI_protected_cruiser_desc:0	"Die Hairong Klasse war eine Serie von drei geschützten Kreuzern, die in den späten 1890er Jahren von Deutschland für China gebaut wurden. Die Schiffe ähnelten anderen geschützten Kreuzern und späteren leichten Kreuzern, die um die Jahrhundertwende für China gebaut wurden. Hai Yung verdrängte knapp 2.700 Tonnen und war mit einer Hauptbewaffnung von drei 5,9-Zoll-QF-Kanonen und einer Nebenbewaffnung von acht 4,1-Zoll-Kanonen ausgestattet."


