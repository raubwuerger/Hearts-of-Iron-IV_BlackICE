GER_paratrooper_desc:0	"Durch die Einbindung von Luftlandetruppen in unsere Armee können wir gewaltsame Einbrüche durchführen und wichtige Truppen in zuvor unzugänglichen Gebieten positionieren, was neue taktische Möglichkeiten eröffnet."
USA_paratrooper:0	"Luftlandetruppen"
USA_paratrooper_desc:0	"Durch die Einbindung von Luftlandetruppen in unsere Armee können wir gewaltsame Vorstöße durchführen und wichtige Truppen in zuvor unzugänglichen Gebieten positionieren, was neue taktische Möglichkeiten eröffnet."
JAP_marine_desc:0	"Spezielle Marine-Landungstruppen. Truppen, die auf amphibische Kriegsführung spezialisiert sind, werden immer unverzichtbarer. Improvisierte Methoden und Ausrüstung gehören der Vergangenheit an, da unsere Marineinfanterie durch spezialisierte Landungsboote und Ausbildung unterstützt wird."
GER_marine:0	"Marine-Infanterie"
GER_marine_desc:0	"Truppen, die auf amphibische Kriegsführung spezialisiert sind, werden immer unverzichtbarer. Improvisierte Methoden und Ausrüstung gehören der Vergangenheit an, da unsere Marineinfanterie durch spezialisierte Landungsboote und Ausbildung unterstützt wird."
