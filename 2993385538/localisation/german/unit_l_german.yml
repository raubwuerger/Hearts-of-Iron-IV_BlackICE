GER_mountaineers_desc:0	"Kämpfe in Gebirgsregionen setzen Truppen vielen Gefahren aus, sind aber manchmal unvermeidbar. Indem wir unseren Soldaten eine spezielle Ausbildung für dieses Umfeld bieten, können wir diese Risiken minimieren."
