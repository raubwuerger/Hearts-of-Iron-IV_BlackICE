DIV_HQ:0	"Stabsabteilung" [Cav.]"
DIV_HQ_desc:0	"Kommandoeinheit."\nEine Division ist eine große militärische Einheit oder Formation, die in der Regel aus 10.000 bis 20. 000 Soldaten. Infanteriedivisionen zählten während der Weltkriege in der Regel 30.000 oder mehr Soldaten.\nIn den meisten Armeen setzt sich eine Division aus mehreren Regimentern oder Brigaden zusammen; mehrere Divisionen bilden wiederum typischerweise ein Korps. In den meisten modernen Streitkräften ist eine Division in der Regel die kleinste kombinierte Waffeneinheit, die zu eigenständigen Operationen fähig ist; dies ist auf ihre autarke Rolle als Einheit mit einer einer Reihe von Kampftruppen und geeigneten Kampfunterstützungskräften, die in verschiedenen organischen Kombinationen angeordnet werden können.\nTypen während des Zweiten Weltkriegs:\nKavallerie-, Panzer-, Infanterie- und Fallschirmjäger-/Luftlandedivision. "
DIV_HQ_airborne:0	"Stabsabteilung [Airb.]"
DIV_HQ_airborne_desc:0	"Kommandoeinheit".\nEine Division ist eine große militärische Einheit oder Formation, die in der Regel aus 10.000 bis 20.000 Soldaten besteht. Fallschirmjäger-/Luftlandedivisionen zählten während der Weltkriege in der Regel 30.000 oder mehr Soldaten. \nIn den meisten Armeen setzt sich eine Division aus mehreren Regimentern oder Brigaden zusammen; wobei wiederum mehrere Divisionen typischerweise ein Korps bilden. In den meisten modernen Streitkräften ist eine Division in der Regel die kleinste kombinierte Waffengattungseinheit, die zu eigenständigen Operationen fähig ist; dies ist auf ihre autarke Rolle als Einheit mit einer Reihe von Kampftruppen und geeigneten Kampfunterstützungskräften zurückzuführen, die in verschiedenen organischen Kombinationen angeordnet werden können.\nArten während des Zweiten Weltkriegs: \nKavallerie-, Panzer-, Infanterie- und Fallschirmjäger-/Luftlandedivision."
DIV_HQ_car:0	"Stabsabteilung" [Car]"
DIV_HQ_car_desc:0	"Kommandoeinheit".\nEine Division ist eine große militärische Einheit oder Formation, die in der Regel aus 10.000 bis 20.000 Soldaten besteht. Infanteriedivisionen zählten während der Weltkriege in der Regel 30.000 oder mehr Soldaten.\nIn den meisten Armeen setzt sich eine Division aus mehreren Regimentern oder Brigaden zusammen; mehrere Divisionen bilden wiederum typischerweise ein Korps. In den meisten modernen Streitkräften ist eine Division in der Regel die kleinste kombinierte Waffeneinheit, die zu eigenständigen Operationen fähig ist; dies ist auf ihre -Versorgungsfunktion als Einheit mit einer Reihe von Kampftruppen und geeigneten Kampfunterstützungskräften, die in verschiedenen organischen Kombinationen angeordnet werden können.\nTypen während des Zweiten Weltkriegs:\nKavallerie-, Panzer-, Infanterie- und Fallschirmjäger-/Luftlandedivision. "
DIV_HQ_mech:0	"Stabsabteilung [Mech.]"
DIV_HQ_mech_desc:0	"Kommandoeinheit.\nEine Division ist eine große militärische Einheit oder Formation, die in der Regel aus 10.000 bis 20.000 Soldaten besteht. Infanteriedivisionen zählten während der Weltkriege in der Regel 30.000 oder mehr Soldaten.\nIn den meisten Armeen setzt sich eine Division aus mehreren Regimentern oder Brigaden zusammen; wobei wiederum mehrere Divisionen typischerweise ein Korps bilden. In den meisten modernen Streitkräften ist eine Division in der Regel die kleinste kombinierte Waffengattungseinheit, die zu eigenständigen Operationen fähig ist; dies ist auf ihre autarke Rolle als Einheit mit einer Reihe von Kampftruppen und geeigneten Kampfunterstützungskräften zurückzuführen, die in verschiedenen organischen Kombinationen angeordnet werden können.\nTypen während des Zweiten Weltkriegs: \nKavallerie-, Panzer-, Infanterie- und Fallschirmjäger-/Luftlandedivision."
DIV_HQ_arm:0	"Stabsabteilung [Arm.]"
DIV_HQ_arm_desc:0	"Kommandoeinheit.\nEine Division ist eine große militärische Einheit oder Formation, die in der Regel aus 10.000 bis 20.000 Soldaten besteht. Infanteriedivisionen zählten während der Weltkriege in der Regel 30.000 oder mehr Soldaten.\nIn den meisten Armeen setzt sich eine Division aus mehreren Regimentern oder Brigaden zusammen; mehrere Divisionen bilden wiederum typischerweise ein Korps. In den meisten modernen Streitkräften ist eine Division in der Regel die kleinste kombinierte Waffeneinheit, die zu eigenständigen Operationen fähig ist; dies liegt an ihrer autarken Rolle als Einheit mit einer Reihe von Kampftruppen und geeigneten Kampfunterstützungskräften, die in verschiedenen organischen Kombinationen angeordnet werden können.\nTypen während des Zweiten Weltkriegs:\nKavallerie-, Panzer-, Infanterie- und Fallschirmjäger-/Luftlandedivision."
