panzer_iii_art_desc:0	"Sturmhaubitzen übernahmen die Rolle der Infanterieunterstützung, als Sturmgeschütze zunehmend in die Rolle von Panzerjägern übergingen"
panzer_iv_desc:0	"Die erste Serienversion des Panzer IV war die Ausführung A (abgekürzt Ausf. A, was "Variante A" bedeutet), im Jahr 1936. Er wurde von Maybachs HL 108TR mit 250 PS (183,87 kW) angetrieben und verfügte über das SGR 75-Getriebe mit fünf Vorwärtsgängen und einem Rückwärtsgang, wodurch eine Höchstgeschwindigkeit von 31 km/h erreicht wurde. Als Hauptbewaffnung trug das Fahrzeug die kurzläufige, haubitzenähnliche Kampfwagenkanone 37 L/24 (KwK 37 L/24) 75-mm-Panzerkanone, bei der es sich um eine Langsamfeuerkanone handelte, die hauptsächlich für den Abschuss von hochexplosiven Granaten konzipiert war"
