combat_engineer:0	"Pionierkompanie"
combat_engineer_desc:0	"Der Bau von Befestigungen und das Überwinden von Hindernissen machen Kampfingenieure im Einsatz unverzichtbar. Indem wir unseren Ingenieuren eine vielseitige Rolle zuweisen, können wir sie in den vielfältigen Situationen einsetzen, in denen sie benötigt werden."
