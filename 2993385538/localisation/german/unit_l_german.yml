light_tank_destroyer_brigade_axis:0	"Leichter Panzerjäger der Achsenmächte"
light_tank_destroyer_brigade_axis_desc:0	"Panzerjäger sind Panzer mit einer überdurchschnittlich großen Kanone in einer festen Lafette anstelle eines Turms. Leichte Panzerjäger basieren auf dem Fahrgestell von leichten Panzern, was bedeutet, dass sie relativ mobil sind, aber im Vergleich zu schwereren Panzerjägern keine besonders starken Kanonen mitführen."
medium_tank_destroyer_brigade_axis:0	"Mittlerer Panzerjäger der Achsenmächte"
medium_tank_destroyer_brigade_axis_desc:0	"Panzerjäger sind Panzer mit einer überdurchschnittlich großen Kanone in einer festen Lafette anstelle eines Turms. Mittlere Panzerjäger basieren auf dem Fahrgestell von mittleren Panzern, was bedeutet, dass sie recht mobil sind und über eine beachtliche Feuerkraft verfügen."
heavy_tank_destroyer_brigade_axis:0	"Schwerer Panzerjäger der Achsenmächte"
heavy_tank_destroyer_brigade_axis_desc:0	"Bei einem schweren Panzerjäger wurde der Turm entfernt, um eine noch größere Kanone in einer festen Lafette zu tragen."
super_heavy_tank_destroyer_brigade_axis_desc:0	"Ein superschweres Panzerchassis mit einer noch größeren Kanone in einer festen Halterung anstelle eines Turms."
modern_tank_destroyer_brigade_axis:0	"Moderner Panzerjäger der Achsenmächte"
