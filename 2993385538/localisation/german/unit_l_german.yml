medium_tank_destroyer_brigade_desc:0	"Jagdpanzer sind Panzer mit einer überdurchschnittlich großen Kanone in fester Montage anstelle eines Turms. Mittlere Jagdpanzer basieren auf dem Fahrgestell von mittleren Panzern, sind also recht mobil und verfügen über eine respektable Feuerkraft."
heavy_tank_destroyer_brigade:0	"Schwerer Jagdpanzer der Alliierten"
heavy_tank_destroyer_brigade_desc:0	"Bei einem schweren Jagdpanzer wurde der Turm entfernt, um eine noch größere Kanone in einer festen Halterung zu tragen."
