French_Dismay:0	"Kriegsmüdigkeit"
French_Dismay_desc:0	"Nach den Verheerungen und Verlusten des Ersten Weltkriegs sind die Franzosen nicht bereit, erneut einen langen Krieg zu führen. Viele ihrer Männer sind kriegsmüde und die Führung der Nation ist defätistisch. Es bedarf einiger Anstrengungen, um dieses Unbehagen zu überwinden."
