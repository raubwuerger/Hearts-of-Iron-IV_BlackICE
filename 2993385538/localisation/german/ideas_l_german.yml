superior_firepower_academy_spirit_tt:1	"§G50% Wahrscheinlichkeit§! dass neue Offiziere mit der Eigenschaft §Y "Ingenieuroffizier"§! erstellt werden."
theatre_training_spirit:0	"Kriegsschauplatzspezialisierung"
theatre_training_spirit_desc:1	"Einige Offiziere können "einheimisch" werden, aber Eingeborene sind sehr gut darin, auf dem von ihnen gewählten Terrain zu kämpfen.\n\n§GDieser Geist ist aufgrund unserer Doktrinen verfügbar.§!"
theatre_training_academy_spirit_tt:0	"§G50% Wahrscheinlichkeit§! dass neue Offiziere mit der Eigenschaft §Y "Brillanter Stratege"§! oder §Y "Unflexibler Stratege"§! erstellt werden."
mass_assault_academy_spirit:0	"Die Königin der Schlacht"
mass_assault_academy_spirit_desc:1	"Die Infanterie ist die Königin der Schlacht, und die Königin geht, wohin sie will.\n\n§GDieser Geist ist dank unserer Doktrinen vorhanden.§!"
underfunded_academy_spirit:0	"Unterfinanzierte Akademie"
underfunded_academy_spirit_desc:0	"Es gibt bessere Dinge, für die man Geld ausgeben kann, als Menschen beizubringen, wie sie sich gegenseitig effizienter töten können."
nepotism_academy_spirit:0	"Vetternwirtschaft"
nepotism_academy_spirit_desc:0	"Mein Onkel leitet die Armee, und er sagt, ich kann mein eigenes Divisionskommando bekommen, wann immer ich will!"
professional_officer_corps_spirit_desc:0	"Wir sind Profis, und der Krieg ist unser Beruf."
elevated_engineering_corps_spirit_desc:0	"Die Fähigkeiten und der Charakter eines Menschen lassen sich am besten beurteilen, wenn man ihm eine Schaufel und einen Tag Zeit gibt, etwas Nützliches damit zu tun."
quick_improvisation_spirit_desc:0	"Schneller begreifen, schneller denken, schneller handeln - das ist der Schlüssel zum Sieg."
relief_of_command_spirit:0	"Entlastung des Kommandos"
relief_of_command_spirit_desc:1	"Die Armee existiert nicht, um das Ego ihrer Generäle zu füttern.\n\n§GDieser Geist ist aufgrund unserer Ideologie vorhanden."§!
ideological_loyalty_spirit:0	"Ideologische Loyalität"
ideological_loyalty_spirit_desc:1	"Von jemandem, der nicht die richtige Ideologie hat, kann nicht erwartet werden, dass er im Kampf das richtige Ergebnis erzielt.\n\n§GDieser Geist ist aufgrund unserer Ideologie vorhanden.§!"
state_serves_the_military_spirit:0	"Der Staat dient dem Militär"
state_serves_the_military_spirit_desc:2	"Der Zweck des Staates ist es, Krieg gegen andere Staaten zu führen. Alles andere ist entweder eine Unterstützung dessen oder eine nutzlose Ablenkung.\n\n§GDieser Geist ist aufgrund unserer Ideologie vorhanden.§!"
superior_firepower_army_spirit_desc:1	"Wenn du mit Artillerie keine Schlachten gewinnst, setzt du nicht genug davon ein.\n\n§GDieser Geist ist aufgrund unserer Doktrinen verfügbar.§!"
grand_battleplan_army_spirit:0	"Kommandospezialisierung"
entrenched_old_guard_spirit:0	"Eingesessene alte Garde"
doctrinal_orthodoxy_spirit:0	"Doktrinäre Orthodoxie"
doctrinal_orthodoxy_spirit_desc:0	"So haben wir das früher nicht gemacht, als ich noch dabei war."
excessive_parade_drill_spirit_desc:0	"Das Hauptziel eines Soldaten ist es, bei einer Parade gut auszusehen."
flexible_organization_spirit_desc:0	"Was zählt, ist die Erfüllung der Aufgabe, nicht die buchstabengetreue Befolgung von Befehlen."
victory_or_death_spirit:0	"Sieg oder Tod"
smoke_and_fire_spirit_desc:1	"Ein rollendes Sperrfeuer aus Granaten ist überraschend effektiv, um den Feind davon abzuhalten, zurückzuschießen.\n\n§GDiese Einstellung ist aufgrund unserer Doktrinen verfügbar.§!"
