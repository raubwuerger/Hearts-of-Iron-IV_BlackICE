bra_exercito:0	"Die brasilianische Armee"
bra_exercito_desc:0	"Aufgrund der geringen Alphabetisierung in Brasilien ist die Armee weniger gut organisiert, was die Ausbildung erschwert. Das Fehlen einer modernen Medizin schränkt die Zahl der Soldaten ein. Das raue brasilianische Klima und der raue Lebensstil machen die Soldaten widerstandsfähiger gegen den Einsatz an unwirtlichen Orten."
bra_infraestructure:0	"Ein wirklich großes Land"
bra_infraestructure_desc:0	"Brasilien ist ein riesiges Land mit sehr unterschiedlichen geografischen Formationen und einem gewaltigen Netz von Flüssen. Jedes Infrastrukturprojekt benötigt mehr Ressourcen, um fertiggestellt zu werden."
bra_exports:0	"Kaffee für Kanonen und Maschinen"
bra_exports_desc:0	"Historisch gesehen exportiert Brasilien gerade tonnenweise Kaffee und andere Primärgüter, die in diesem Spiel nicht vertreten sind, in entwickelte Länder und kauft im Gegenzug militärische und zivile Güter und Technologien, um sie vor Ort zu produzieren."
