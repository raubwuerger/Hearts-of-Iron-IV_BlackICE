USA_beyond_reach_desc:0	"Die Vereinigten Staaten sind durch einen Ozean von den zunehmenden Spannungen und jedem ernsthaften Gegner getrennt."\n\n"Diese Vorstellung wird bei einem Kapitulationsfortschritt von mehr als §Y5 %§! entfernt."
