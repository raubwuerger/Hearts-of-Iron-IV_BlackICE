desenvolvimentismo:0	  "Entwicklungsismus"
desenvolvimentismo_desc:0	"Entwicklungsismus ist die Idee, dass der Staat die Grundlage des industriellen Wachstums sein muss. Im Jahr 1936 stand Brasilien vor einer schweren Wirtschaftskrise; seine auf nicht Exportgütern, bricht zusammen; darüber hinaus führen die Wirtschaftskrise und die wachsenden weltweiten Spannungen zu einem Mangel an industriellen Importgütern, unsere Bevölkerung ist arbeitslos und die Reichen können ihr Geld nicht ausgeben; diese Katastrophe lässt dem Staat und seinem Volk keine andere Wahl als die vollständige Industrialisierung des Landes"
desco:0	"Industrialisierungsbemühungen"
desco_desc:0	"Da Importe und Exporte weiter zurückgingen, griff die brasilianische Regierung direkt in die Wirtschaft ein und beendete damit Jahrzehnte des Liberalismus. Die erste Maßnahme bestand darin, den Preis für Kaffee (Brasiliens wichtigstes Exportgut) zu stabilisieren, indem der gesamte Produktionsüberschuss verbrannt wurde, um das Angebot zu verringern. Die zweite Maßnahme war die Gründung zahlreicher staatlicher Fabriken und Unternehmen, um Arbeitsplätze zu schaffen und die Arbeitslosigkeit zu senken. Drittens sollte die neue industrielle Expansion brasilianische Güter für den Export herstellen und den Binnenmarkt versorgen, der von Importen abhängig war; viertens ging es darum, die brasilianische Rüstungsindustrie angesichts der wachsenden weltweiten Spannungen zu stärken, um entweder Waffen und Ressourcen exportieren zu können oder für den Fall eines Krieges gewappnet zu sein."
urba:0	"Urbanisierung"
urba_desc:0	"Zu diesem Zeitpunkt gab es in Brasilien viele, wenn auch kleine, städtische Zentren. Da neue Fabriken gebaut werden und Bauern zu Fabrikarbeitern werden, müssen wir unsere Städte erweitern, um sowohl die Arbeiter als auch die neuen Fabriken unterzubringen."
urbaii:0	"Urbanisierung II"
urbaii_desc:0	"Zu diesem Zeitpunkt verfügte Brasilien über viele, wenn auch kleine städtische Zentren. Da neue Fabriken gebaut werden und Bauern zu Fabrikarbeitern werden, müssen wir unsere Städte erweitern, um sowohl die Arbeiter als auch die neuen Fabriken unterzubringen."
urbaiii:0	"Industriezentrum"
urbaiii_desc:0	"Wir sollten die Einrichtung eines Industriezentrums in einem unserer Bundesstaaten in Betracht ziehen, um weiteres industrielles Wachstum zu ermöglichen"
end_desenvolvimentismo:0	"Wirtschaftlicher Realismus"
end_desenvolvimentismo_desc:0	"Es ist uns gelungen, mit unseren staatlichen Unternehmen und Fabriken viele Arbeitsplätze für Arbeitslose zu schaffen, doch dies ist untragbar geworden, da die hohe Zahl der vom Staat bezahlten Arbeitskräfte bei geringer Produktivität unsere Wirtschaft zerreißt und die Bevölkerung nicht in der Lage sein wird, die enormen Steuerbeträge weiterhin zu zahlen; wir müssen realistisch sein und unseren Fabriken und Unternehmen erlauben, pragmatisch zu handeln. "
urbaiv:0	"Großes Industriezentrum"
urbaiv_desc:0	"Da wir nun eine regionale Industriemacht sind, sollten wir den Bau eines größeren Industriezentrums in Betracht ziehen, um dem weiteren industriellen und militärischen Wachstum gerecht zu werden"
armyi:0	"Militärischer Entwicklungsismus"
armyi_desc:0	"Da unser Land seine Industrie ausbaut, kann unser Militär davon profitieren"
armyii:0	"Nationale Rüstungsindustrie"
armyii_desc:0	"Mit zunehmender weltweiter Spannung wuchs auch Brasiliens Waffenproduktion"
armyiv:0	"Nationale Rüstungsindustrie III"
armyiv_desc:0	"Brasilianische Generäle beobachteten aufmerksam Argentiniens wachsendes Militär und dessen Tendenzen zur Achse; das brasilianische Militär übte Druck auf die Regierung aus, sich auf einen Krieg vorzubereiten, was zu einem Wettrüsten in Südamerika führte."
armyiii_desc:0	"Entgegen der landläufigen Meinung war das brasilianische Militär, auch wenn es technologisch unterlegen war, riesig und verfügte über einen ansehnlichen Vorrat an Waffen und Lastwagen; Zwischen 1930 und 1932 hatte Brasilien bereits eine Reihe von Panzerwagen, leichten Panzern und sogar einen schweren Panzer für sechs Mann entwickelt und produziert, der mit vier schweren Maschinengewehren und als Hauptgeschütz: einem riesigen Flammenwerfer ausgestattet war"
valeriodoce_i:0	"Natürliche Ressourcen"
valeriodoce_iii:0	"VALE"
valeriodoce_iii_desc:0	"Im Jahr 1911 erwarb der amerikanische Unternehmer Percival Farquhar alle Anteile des brasilianischen Hematite Syndicate und änderte dessen Namen in Itabira Iron Ore Company ( "Iron Ore Company of Itabira" "). Percival Farquhar plante, dass die Itabira Iron Ore Co. jährlich 10 Millionen Tonnen Eisenerz in die Vereinigten Staaten exportieren sollte, und zwar mit Schiffen im Besitz ihres Verbandes, die US-Kohle nach Brasilien befördern würden, wodurch der Transport wirtschaftlichst gestaltet würde. Dieser Plan nahm mehr als 40 Jahre im Voraus ein Konzept vorweg, das – modifiziert und aktualisiert – unter der Leitung von Eliezer Batista in den 1960er Jahren, als der Hafen von Tubarão eröffnet wurde. Percival Farquhar blieb der Erfolg verwehrt. Obwohl er auf die Unterstützung von Präsident Pessoa zählen konnte, der ihm eine Konzession gewährte, die als "Itabira-Abkommen von 1920" bekannt ist, stieß Farquhar auf heftigen Widerstand gegen sein Projekt, unter anderem seitens des Gouverneurs des Bundesstaates Minas Gerais (damals fast autonom), Artur Bernardes, der später zum Präsidenten gewählt wurde. Es folgten Jahrzehnte hitziger Debatten, in denen das Land praktisch zwischen den Anhängern der beiden Positionen gespalten war, ohne dass das Farquhar-Projekt jemals über das Reißbrett hinauskam. Dieser Plan wurde zunichte gemacht, als Getúlio Vargas an der Spitze der Revolution von 1930 die Macht übernahm und die Eisenvorkommen, die Farquhar gehörten, in Besitz nahm, um daraus 1942 die Companhia Vale do Rio Doce als staatliches Unternehmen zu gründen, wofür er im Rahmen der Washingtoner Abkommen die Zustimmung der Vereinigten Staaten und Englands erhielt. "
valeriodoce_iv:0	"Wolfram"
valeriodoce_iv_desc:0	"Brasilien verfügt über 2 % der weltweiten Wolframreserven … das ist immerhin etwas! "
valeriodoce_v:0	"Erdöl"
valeriodoce_v_desc:0	"In Brasilien wurde bereits zu Zeiten des Kaiserreichs mit dem Vorhandensein von Erdöl gerechnet. Damals übertrug der Marquis von Olinda José de Barros Pimentel das Recht, am Ufer des Flusses Marau in Bahia Bitumen zu fördern. Bis in die ersten Jahrzehnte des 20. Jahrhunderts versuchten einige Gelehrte und anonyme Entdecker erfolglos, Ölbohrungen durchzuführen. Im Jahr 1930 änderte jedoch der Agronom Manoel Inácio de Basto diese Situation. Aufgrund einer Volkssage hatte er Informationen erhalten, dass die Bewohner von Lobato, einem Vorort von Salvador, einen "schwarzen Schlamm" als Brennstoff für ihre Lampen verwendeten. Angeregt durch diese Berichte führte er Tests und Experimente durch, die das Vorhandensein von Öl an diesem Ort bestätigten. Allerdings verfügte er nicht über einflussreiche Kontakte, die in seine Entdeckung investieren konnten. Er gab jedoch nicht auf und gelangte 1932 dazu, Präsident Getúlio Vargas einen technischen Bericht zu überreichen, der seinen Fund bestätigte. "
valeriodoce_vi:0	"Aluminium I"
valeriodoce_vi_desc:0	"Etwa 7 % der Erdkruste bestehen aus Aluminium, was dieses chemische Element nach Sauerstoff und Silizium zum dritthäufigsten auf der Erde macht. Die Aluminiumproduktion beginnt mit dem Rohstoff Bauxit. Bauxit, ein Gestein, das meist in der Nähe des Äquators vorkommt, enthält 15–25 % Aluminium und ist heute das einzige Erz, das für die kommerzielle Aluminiumgewinnung genutzt wird. Bauxit kommt hauptsächlich in den Tropen vor und liegt in horizontalen Schichten meist nur wenige Meter unter der Erdoberfläche. Die Schichten sind meist mit Tonmineralien, Eisenoxiden und Titandioxid vermischt. Das in der Mischung enthaltene Eisen ist für die rötliche Färbung des Bauxits verantwortlich."
valeriodoce_vii:0	"Chrom"
valeriodoce_viv:0	"Aluminium II"
clt_desc:0	"Das CLT entstand als institutionelle Notwendigkeit nach der Gründung des Arbeitsgerichts im Jahr 1939. Im Januar 1942 tauschten Präsident Getúlio Vargas und Minister Alexandre Marcondes Filho erste Ideen über die Notwendigkeit einer Konsolidierung des Arbeitsrechts aus. Die ursprüngliche Idee war die Schaffung der "Kodifizierung der Arbeits- und Sozialversicherungsgesetze". Zur Mitarbeit an dem Projekt wurden die Anwälte Joseph Segadas Viana, Oscar Saraiva, Luis Augusto Rego Monteiro, Dorval Lacerda Marcondes und Arnaldo Lopes Süssekind eingeladen. Bei der ersten Sitzung wurde beschlossen, den Ausschuss in die Bereiche Arbeit und Soziales zu unterteilen und zwei getrennte Kodifizierungen zu erstellen. Wesentliche Quellen der CLT waren zum einen die Schlussfolgerungen des 1. brasilianischen Kongresses für Sozialrecht, der im Mai 1941 in São Paulo zur Feier des fünfzigsten Jahrestags der Enzyklika Rerum Novarum stattfand und von Professor Cesarino Junior und dem Rechtsanwalt Rui Azevedo Sodre organisiert wurde. Die zweite Quelle waren die internationalen Arbeitsübereinkommen. Die dritte war die Enzyklika Rerum Novarum selbst und schließlich die Stellungnahmen der Rechtsberater V ianna und Oscar Saraiva, die vom Arbeitsminister gebilligt wurden. Im November 1942 wurde ihm der Entwurf des Arbeitsgesetzbuchs vorgelegt, der anschließend im Amtsblatt zur Stellungnahme veröffentlicht wurde. Nach Prüfung des Entwurfs beauftragte Getúlio Vargas die Mitverfasser, die Stellungnahmen zu prüfen und den endgültigen Entwurf zu verfassen, der schließlich am 1. Mai 1943 unterzeichnet wurde. Die CLT wird als "Konsolidierung der Arbeitsgesetze" bezeichnet und nicht als "Arbeitsgesetzbuch", da ihr Ziel lediglich darin bestand, die damals vereinzelten arbeitsrechtlichen Vorschriften zusammenzufassen und zu konsolidieren. Daher ihr Name. Er konnte nicht den Namen "Kodex" erhalten, da es sich nicht um ein neues Gesetz handelt, sondern lediglich um eine Zusammenstellung. Es ist auch klar, dass ein Gesetz als "Kodex" bezeichnet wird, wenn die gesetzlichen Bestimmungen im Gesetzestext einzeln und gleichzeitig vom Kongress verabschiedet werden. Das bedeutet, dass Artikel für Artikel abgestimmt werden muss."
newconstitution:0	"Neue Verfassung"
demosiii:0	"Politische Reform"
demosiii_desc:0	"Mit dem Aufschwung der Industrie und der Bedrohung der Kaffeeoligarchen wich die alte Ordnung des Café com Leite und des Coronelismo schließlich den politischen Bestrebungen der neuen städtischen Gruppen: Freiberufler, Regierungs- und Angestellte, Kaufleute, Bankiers und Industrielle. Die zunehmende Unterstützung für den industriellen Protektionismus prägte die brasilianische Politik der 1920er Jahre, wobei die von den Kaffeeinteressen dominierte Zentralregierung kaum Rückhalt bot. Unter erheblichem Druck der Mittelschicht passte sich ein aktiverer, zentralistischerer Staat an, um die Interessen zu vertreten, die die neue Bourgeoisie seit Jahren gefordert hatte – ein Staat, der eine interventionistische Politik nutzen konnte, bestehend aus Steuererleichterungen, gesenkten Zöllen und Importquoten, um die inländische Kapitalbasis zu erweitern. Industrielle, Angestellte und das städtische Proletariat hatten zuvor gleichermaßen von der durch den Ersten Weltkrieg bedingten Atempause im Welthandel profitiert. Die Kaffeeoligarchen jedoch, die sich auf eine dezentrale Machtstruktur stützten, welche die Macht an ihre eigenen patrimonialen Herrscheroligarchien delegierte, waren sicherlich nicht daran interessiert, Brasiliens personalistische Politik zu regulieren oder die Macht zu zentralisieren. Getúlio Vargas, Staatschef von 1930 bis 1945 und später für kurze Zeit in den 1950er Jahren, sollte später auf diese Forderungen reagieren."
militaryschool_ii:0	"Militärschule II"
industrialtech_i:0	"Industrielle Anstrengungen"
mona_iii_desc:0	"Die Streitkräfte des Kaiserreichs Brasilien waren die gesamten vereinigten Streitkräfte des Kaiserreichs Brasilien. Das brasilianische Militär wurde ursprünglich von Kaiser Dom Pedro I. gegründet, um die neue Nation im brasilianischen Unabhängigkeitskrieg gegen die Portugiesen zu verteidigen. Die Armee und die Armada (wie die Marine damals genannt wurde) wurden 1822 mit dem Ziel ins Leben gerufen, die portugiesischen Truppen zu besiegen und aus brasilianischem Gebiet zu vertreiben. Von ihrer Gründung an spielte das Militär eine entscheidende Rolle in der Geschichte des Kaiserreichs Brasilien. Aus dem siegreichen Paraguay-Krieg entstand ein Gefühl der nationalen Einheit und Identität. Der Kaiser war Oberbefehlshaber des Militärs, wobei das Kriegs- und das Marineministerium die wichtigsten Organe zur Umsetzung der Militärpolitik darstellten. DAS KAISERREICH BRAUCHT MEHR ALS NUR EIN PAAR GUTE MÄNNER"
expand_military_i_desc:0	 "Wir sollten uns um den Ausbau der Streitkräfte bemühen, um unser geliebtes Land besser zu schützen"
fria_indu_i_desc:0	 "In den frühen 50er Jahren wies die brasilianische Industrie zwei herausragende Merkmale auf: Einerseits konzentrierten sich die Unternehmen auf die Produktion von verderblichen und halbdauerhaften Gütern, wobei der Schwerpunkt insbesondere auf den Bereichen Textil, Lebensmittel, Druck, Verlagswesen, Bekleidung, Tabak, Leder und Pelz lag; andererseits handelte es sich um rein inländische Unternehmen, die in der Regel vom Familienoberhaupt geführt wurden."
fria_indu_ii:0	"Industrielle Expansion II"
fria_indu_ii_desc:0	" Anfang der 1950er Jahre war die Regierung jedoch davon überzeugt, dass die einzige Hoffnung auf schnelles Wachstum in einer Veränderung der Struktur der brasilianischen Wirtschaft lag, und verfolgte daher eine explizite Politik der Importsubstitutionsindustrialisierung. Ein wichtiges Instrument dieser Politik war der Einsatz von Devisenkontrollen, um ausgewählte Segmente der heimischen Industrie zu schützen und die Einfuhr von Ausrüstung und Vorleistungen für diese zu erleichtern. Doch führte die Umstellung auf feste Wechselkurse in Verbindung mit Einfuhrlizenzen zu einer drastischen Einschränkung der Exporte, und das Problem der Zahlungsbilanz spitzte sich zu. Das System wurde nahezu unkontrollierbar, und 1953 wurde ein flexibleres System mit mehreren Wechselkursen eingeführt. Im Rahmen dieses Systems wurden als unverzichtbar angesehene Importe zu einem Vorzugskurs eingeführt; Importe von Gütern, die im Inland beschafft werden konnten, unterlagen hohen Zöllen und erhielten nur geringe Anteile der verfügbaren Devisen. Ebenso wurden bestimmte Exporte durch einen höheren Wechselkurs als bei traditionellen Exportgütern gefördert. Dieses System blieb das wichtigste Instrument zur Förderung der importsubstituierenden Industrialisierung, doch verbesserte sich die Leistung des Exportsektors nur geringfügig."
fria_indu_iii_desc:0	"In der zweiten Hälfte der 1950er Jahre verabschiedete die Regierung eine Reihe von Sonderprogrammen, die darauf abzielten, den Industrialisierungsprozess besser zu steuern, Engpässe zu beseitigen und die vertikale Integration in bestimmten Branchen zu fördern. Besondere Aufmerksamkeit widmete die Regierung den Branchen, die als grundlegend für das Wachstum angesehen wurden, insbesondere der Automobil-, Zement-, Stahl-, Aluminium-, Zellstoff-, Schwermaschinen- und Chemieindustrie."
fria_indu_iv_desc:0	" Zwischen 1957 und 1961 nahm die Regierung mehrere Änderungen am Devisenkontrollsystem vor, von denen die meisten darauf abzielten, dessen Unzulänglichkeiten zu verringern oder dessen Funktionsweise im Zuge der fortschreitenden importsubstituierenden Industrialisierung zu verbessern. Zu diesem Zweck führte die Regierung zudem mehrere ergänzende Maßnahmen ein, darunter die Verabschiedung des Zollgesetzes von 1957, die Ausweitung und Festigung des Schutzes für die heimische Industrie sowie die Schaffung starker Anreize für ausländische Direktinvestitionen. "
fria_ii:0	"Globale Wirtschaftsmacht"
fria_ii_desc:0	"Infolge der importsubstituierenden Industrialisierung verzeichnete die brasilianische Wirtschaft ein rasantes Wachstum und eine beträchtliche Diversifizierung. Zwischen 1950 und 1961 lag die durchschnittliche jährliche Wachstumsrate des Bruttoinlandsprodukts bei über 7 %. Die Industrie war der Motor des Wachstums. Sie verzeichnete zwischen 1950 und 1961 eine durchschnittliche jährliche Wachstumsrate von über 9 Prozent, verglichen mit 4,5 % in der Landwirtschaft. Darüber hinaus erfuhr die Struktur des verarbeitenden Gewerbes erhebliche Veränderungen. Traditionelle Industriezweige wie Textilien, Lebensmittel und Bekleidung verloren an Bedeutung, während die Transportmittel-, Maschinen-, Elektrogeräte- und Haushaltsgeräte- sowie die chemische Industrie expandierten."
fria_army_i_desc:0	"E. R. Amantino & Cia. Ltda. oder Boito ist ein brasilianischer Hersteller von Schusswaffen mit Sitz in Veranópolis im Bundesstaat Rio Grande do Sul. Das Flaggschiff des Unternehmens sind Jagdwaffen. Das Unternehmen exportiert etwa 70 % seiner gesamten Produktion ins Ausland, davon etwa 40 % in die Vereinigten Staaten. Die Gründung des Unternehmens erfolgte um 1921 durch den italienischen Einwanderer John Boito in der damaligen Stadt Alfredo Chaves, dem heutigen Veranópolis, als die erste Waffe vollständig in Handarbeit und ausschließlich zu seinem eigenen Vergnügen hergestellt wurde. Jahre später, im Jahr 1955, schlossen sich Elias Streets Amantino und sein Bruder Abram Street Amantino der Familie Boito an und begannen am 22. Juni mit der Serienfertigung von Gewehren"
fria_army_ii:0	"Modernisierung der Rüstungsindustrie"
fria_army_ii_desc:0	"Wir sollten unsere Rüstungsindustrie modernisieren, um neue Waffen besser herstellen zu können"
fria_vale_i:0	"V ale II"
fria_vale_i_desc:0	"Nach ihrer Gründung konnte die Vale nach und nach ihre Eisenerzproduktion ausweiten, wenn auch noch sehr langsam. Brasilien verfügte über große Mineralvorkommen, doch die Nachfrage war gering. Die Vale versorgte fast ausschließlich die heimischen Stahlwerke mit Rohstoffen, wobei die Companhia Siderúrgica Nacional damals der größte Abnehmer war. Im Dezember 1952 wurde Francisco de Sá Lessa, von Haus aus Bauingenieur, Präsident der Companhia Vale do Rio Doce (CVRD) und blieb bis 1960 im Amt. In dieser Zeit modernisierte das Unternehmen seine Anlagen und erschloss neue Märkte. Sá Lessa weihte die ersten Niederlassungen des Unternehmens im Ausland ein."
fria_vale_ii:0	"Petrobras"
fria_vale_ii_desc:0	" Das Unternehmen wurde durch das Gesetz Nr. 2004 gegründet, das am 3. Oktober 1953 vom damaligen Präsidenten Getulio Vargas unterzeichnet wurde. Das Gesetz regelte die nationale Ölpolitik, legte die Aufgaben des Nationalen Erdölrats (CNP) fest, führte das staatliche Ölmonopol ein und sah die Gründung von Petrobras vor. Die Aktivitäten des Unternehmens begannen mit dem vom ehemaligen Nationalen Erdölrat übernommenen Bestand, der die Aufsichtsfunktion für den Sektor behielt. Die Exploration und Ölförderung sowie andere Aktivitäten im Zusammenhang mit Erdgas und Erdölprodukten, Erdgas und Erdölprodukten, mit Ausnahme des Großhandels und des Einzelhandels über Tankstellen, wurden von 1954 bis 1997 von Petrobras durchgeführt; in diesem Zeitraum entwickelte sich das Unternehmen zu einem führenden Anbieter von Erdölprodukten im Land. In den Anfangsjahren enttäuschte das Unternehmen die Erwartungen mit Funden, die zunächst als vielversprechend galten: 1955 sprudelte Öl in Nova Olinda do Norte, am Ufer des Flusses Madeira"
##### |___KY030196 ___|„1955 sprudelte Öl in Nova Olinda do Norte am Ufer des Flusses Madeira. Es wurden drei Bohrlöcher erschlossen, die jedoch nicht kommerziell genutzt werden konnten. Ein weiterer Fundort befand sich im Tucano-Becken in Maranhão, der ebenfalls nicht produktiv war. Auch wenn die Vorkommen nicht riesig oder für den internationalen Handel rentabel waren, konnte das Öl dennoch für militärische Zwecke genutzt werden“
fria_vale_iv:0	"Aluminiumfabriken"
fria_vale_iv_desc:0	"Unsere industrielle Expansion ermöglicht es uns, mehr Fabriken zu errichten, um unsere riesigen Mineralvorkommen in Aluminium umzuwandeln"
fria_indutech_i:0	"Technologische Expansion"
fria_indutech_i_desc:0	"Unsere industrielle Expansion ermöglicht es uns, unsere Technologie auszubauen"
