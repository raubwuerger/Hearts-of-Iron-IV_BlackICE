ENG_the_war_to_end_all_wars_desc:0	" Da der Erste Weltkrieg noch in frischer Erinnerung ist, zögern sowohl die Bevölkerung als auch die Führung des Landes, eine weitere Generation in den Schützengräben sterben zu lassen.\n\n§YSollte es doch zum Krieg kommen, werden neue nationale Schwerpunkte freigeschaltet, die diese Stimmung abschwächen oder beseitigen."
