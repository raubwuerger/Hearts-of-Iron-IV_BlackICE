vittoria_mutilata_desc:0	"§LUnsere Verbündeten haben Italien verraten und uns in den Rücken gefallen, als sie den Pakt von London brachen. Wir haben am Isonzo so viel Blut für ihren Sieg geopfert, und sie haben uns im Gegenzug verweigert, was uns von Rechts wegen zusteht. Nun wird Italien sein Schicksal selbst in die Hand nehmen und dafür sorgen, dass der Gerechtigkeit Genüge getan wird.§!"
stiff_upper_lip_desc:0	"Wenn du einen kühlen Kopf bewahren kannst, wenn alle um dich herum den ihren verlieren und dir die Schuld geben,\n\n Wenn du Triumph und Desaster ertragen und diese beiden Betrüger genauso behandeln kannst,\n\nDein ist die Erde und alles, was in ihr ist,\n Und - was mehr ist - du wirst ein Mann sein, mein Sohn. "
