Goering_four_year_plan_38:0	"Göring-Plan Jahr 2"
Goering_four_year_plan_38_desc:0	"Das dritte Jahr des Vierjahresplans war eine wirtschaftliche Initiative, die Hitler startete. Sie beinhaltete unter anderem die Verringerung der Arbeitslosigkeit und die Durchführung öffentlicher Bauprojekte wie die deutschen Autobahnen. Hermann Göring wurde ausgewählt, um die Umsetzung des Plans zu überwachen."
Goering_four_year_plan_39:0	"Göring-Plan Jahr 3"
Goering_four_year_plan_39_desc:0	"Das vierte und letzte Jahr des Vierjahresplans war eine wirtschaftliche Initiative, die Hitler startete. Es ging unter anderem darum, die Arbeitslosigkeit zu verringern und öffentliche Bauvorhaben wie die deutschen Autobahnen in Angriff zu nehmen. Hermann Göring wurde ausgewählt, um den Plan in die Tat umzusetzen."
Goering_four_year_plan_40_desc:0	"Das vierte und letzte Jahr des Vierjahresplans war eine wirtschaftliche Initiative, die Hitler startete. Es ging unter anderem darum, die Arbeitslosigkeit zu verringern und öffentliche Bauvorhaben wie die deutschen Autobahnen in Angriff zu nehmen. Hermann Göring wurde ausgewählt, um die Umsetzung des Plans zu überwachen."
