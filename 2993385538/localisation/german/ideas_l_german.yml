trotsky_rallies_desc:0	"Das Monster lebt! Es gehen Berichte ein, dass er Anhänger mobilisiert und seine Gefolgschaft organisiert. Wenn wir ihn nicht bald wieder ins Exil schicken, könnten wir in große Schwierigkeiten geraten. Wählen Sie einen Schwerpunkt mit dem Exil-Trotzki-Nationalgeist – einen Säuberungsschwerpunkt – oder arbeiten Sie auf den Schwerpunkt "Trotzki ermorden" hin, um ihn endgültig zu beseitigen. Wenn Sie den Effekt "Trotzki mobilisiert" auslaufen lassen, wird dies dazu führen, dass Trotzki auf Moskau marschiert und möglicherweise ein Bürgerkrieg ausbricht."
trotsky_marches_desc:0	"Der böse Freak selbst marschiert an der Spitze einer Armee aus Unglücklichen, verzweifelten Kriminellen und Vagabunden auf Moskau zu. Wir müssen jetzt handeln, um ihn ins Exil zu schicken, bevor er versucht, die Macht zu ergreifen. Wählen Sie einen Schwerpunkt mit dem Exil-Trotzki-Nationalgeist – einen Säuberungsschwerpunkt – oder arbeiten Sie auf den Schwerpunkt "Trotzki ermorden" hin, um ihn endgültig auszuschalten.  Wenn der "Trotzki Marsch auf Moskau" ausläuft, wird in der UdSSR ein Bürgerkrieg ausbrechen."
