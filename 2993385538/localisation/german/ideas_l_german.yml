FRA_disjointed_government_desc:0	"Der Zustand der französischen Politik ist alles andere als stabil. Reformen sind zwar notwendig und willkommen, aber die Nation ist gespalten, und eine Verwicklung in einen Konflikt würde sie in große Gefahr bringen."
