ENG_stagnant_aviation_industry_reduced_desc:0	"Die britische Luftfahrtindustrie ist zwar innovativ, kommt aber aus einer Phase der Stagnation in den frühen 1930er Jahren heraus."
ENG_king_edward:0	"Edward VIII."
ENG_king_edward_desc:	"Edward VIII., Nachfolger des verstorbenen George V., hält nicht viel von etablierten Regeln und Normen, was sowohl die Bevölkerung als auch seine eigene Regierung verärgert."
ENG_king_edward_fascism:0	"Eduard VIII."
