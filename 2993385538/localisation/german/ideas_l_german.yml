FRA_protected_by_the_maginot_line_desc:0	"Die Befestigung der Grenze gibt Frankreich die Möglichkeit, sorgfältig zu planen und sich vorzubereiten, aber sie opfert eine gewisse Flexibilität für den Fall, dass etwas Unerwartetes eintritt."
