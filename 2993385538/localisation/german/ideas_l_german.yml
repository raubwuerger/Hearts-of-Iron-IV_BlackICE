canada_tepid_war_response_desc:0	 "Die kanadische Bevölkerung ist größtenteils nicht bereit, sich freiwillig zum Krieg zu melden. Sie muss auf die eine oder andere Weise überzeugt werden."
canada_minor_war_response_desc:0	"Die kanadische Bevölkerung folgt langsam dem Ruf zu den Waffen. Ihr Zögern ist jedoch nach wie vor spürbar."
