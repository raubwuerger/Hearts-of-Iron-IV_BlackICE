IRE_neutral_desc:0	"Irland bleibt im Krieg neutral, respektiert gleichzeitig Deutschland, bewahrt seine Souveränität gegenüber Großbritannien und unterstützt beide Kriegsanstrengungen."
IRE_ira_desc:0	"Obwohl Irland mit dem Anglo-Irischen Vertrag von 1921 seine Unabhängigkeit erlangte, widersetzt sich die gegen den Vertrag eingestellte IRA der Regierung und den Briten und schwächt den irischen Staat weiterhin."
