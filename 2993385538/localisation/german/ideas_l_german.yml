the_long_lance:0	"Die Lange Lanze"
the_long_lance_desc:0	"§LDer Typ-93-Torpedo, allgemein als "Die Lange Lanze" bekannt, war der fortschrittlichste Torpedo seiner Zeit. Er wurde von Japan entwickelt und vom Westen nie wirklich erreicht, wodurch kleinere Schiffe eine wirksame Möglichkeit erhielten, größere, besser gepanzerte Kriegsschiffe aus der Distanz zu treffen.§!"
