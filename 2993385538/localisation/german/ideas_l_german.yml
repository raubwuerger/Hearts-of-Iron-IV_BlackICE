ENG_commonwealth_wealth_desc:0	"Der Reichtum des Commonwealth fließt nicht gleichmäßig, in der Tat bekommen wir den Löwenanteil \n§YDie Befreiung anderer Nationen oder die Zunahme des Automatismus wird diesen Geist drastisch verringern§!"
ENG_british_sugar:	"Britischer Zucker"
ENG_the_colonies:	"Das Britische Reich"
ENG_the_colonies_desc:	"§LDas Britische Empire, das größte Imperium, das die Welt je gesehen hat, verhalf Großbritannien zu unangefochtener globaler Vorherrschaft und Reichtum. Seine zahlreichen Kolonien, Dominions und Überseegebiete setzen sich alle dafür ein, das Vereinigte Königreich gegen jede Bedrohung zu unterstützen, erwarten dafür aber Schutz. §!\n\n§YFolgendes führt zu einer Schwächung der Wirkung dieses Geistes:§!§W\n - Ein Untertan kapituliert\n - Verlust der Kontrolle über einen der folgenden Staaten: \n[118.GetENGTerritoryControl]\n[116.GetENGTerritoryControl]\n[446.GetENGTerritoryControl]\n[269.GetENGTerritoryControl]\n[547.GetENGTerritoryControl]\n[336.GetENGTerritoryControl]\n[326.GetENGTerritoryControl]\n[636.GetENGTerritoryControl]\n[422.GetENGTerritoryControl]\n[281.GetENGTerritoryControl]§!"
ENG_the_colonies_state_lost:	"        §R[This.GetName]§!, besetzt von [This.Controller.GetFlag]§Y[This.Controller.GetName]§!"
ENG_Power:	"Fonds Power Jets"
ENG_stagnant_aviation_industry:0	"Stagnierende Luftfahrtindustrie"
