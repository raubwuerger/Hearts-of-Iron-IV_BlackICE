exercito_i:0	"Streitkräfte"
exercito_i_desc:0	"Die brasilianischen Streitkräfte sind die vereinigte militärische Organisation, bestehend aus der brasilianischen Armee (einschließlich der brasilianischen Heeresfliegertruppe), der brasilianischen Marine (einschließlich des brasilianischen Marinekorps und der brasilianischen Marinefliegertruppe) sowie der brasilianischen Luftwaffe."
exercito_ii:0	"Brasilianische Armee"
moto:0	"Motorisierung"
mecha_desc:0	" Zur zweiten Gruppe, den Kampfmitteln, gehören gepanzerte Fahrzeuge zweier Kategorien: automatische Maschinengewehre, die für Aufklärungs- und Sicherheitsmissionen konzipiert sind, sowie automatische Kampfgeschütze, die zu ernsthaften Gefechten fähig sind und bei Einsatzaktionen zum Einsatz kommen; siehe Mechanisierung."
especial:0	"Spezialeinheiten"
especial_desc:0	"Spezialeinheiten und Spezialeinsatzkräfte sind militärische Einheiten, die für die Durchführung unkonventioneller Missionen ausgebildet sind. Spezialeinheiten entstanden zu Beginn des 20. Jahrhunderts und erlebten während des Zweiten Weltkriegs einen bedeutenden Aufschwung, als \"jede größere Armee, die an den Kämpfen beteiligt war\", Formationen schuf, die sich speziellen Operationen hinter den feindlichen Linien widmeten."
naval_desc:0	"Die brasilianische Marine ist der Marinezweig der brasilianischen Streitkräfte und für die Durchführung von Marineoperationen zuständig. Die brasilianische Marine ist die größte Marine Südamerikas und Lateinamerikas und nach der US-Marine die zweitgrößte Marine Amerikas. Die Marine war am Unabhängigkeitskrieg Brasiliens gegen Portugal beteiligt. Der Großteil der portugiesischen Seestreitkräfte und Stützpunkte in Südamerika wurde an das neu unabhängige Land übertragen. In den ersten Jahrzehnten nach der Unabhängigkeit unterhielt das Land eine große Seestreitmacht, und die Marine war später am Cisplatinenkrieg, den Konflikten am Río de la Plata, dem Paraguay-Krieg sowie anderen sporadischen Aufständen beteiligt, die die brasilianische Geschichte prägten. In den 1880er Jahren war die brasilianische Kaiserliche Marine die mächtigste in Südamerika. Nach der Marineaufstand von 1893 kam es zu einer Unterbrechung in der Entwicklung der Marine bis zum Jahr 1905, als Brasilien zwei der mächtigsten und modernsten Dreadnoughts jener Zeit erwarb, was einen Dreadnought-Wettlauf mit Brasiliens südamerikanischen Nachbarn auslöste. Die brasilianische Marine nahm sowohl am Ersten als auch am Zweiten Weltkrieg teil und führte U-Boot-Abwehrpatrouillen im Atlantik durch."
cruzador:0	"Kreuzer"
cruzador_desc:0	" Etwa 1.100 Brasilianer kamen während der Schlacht um den Atlantik ums Leben, als Folge des Untergangs von 32 brasilianischen Handelsschiffen und einem Kriegsschiff. Unter den 972 Toten auf den Handelsschiffen waren 470 Besatzungsmitglieder und 502 zivile Passagiere.  Darüber hinaus starben 99 Seeleute beim Untergang der Vital de Oliveira, als diese von deutschen U-Booten angegriffen wurde, sowie etwa 350 Menschen bei Unfällen ums Leben kamen, die am 21. Juli 1944 zum Untergang der Korvette Camaquã führten. Der Kreuzer Bahia wurde am 4. Juli 1945 durch eine Explosion versenkt, wobei über 300 Männer ums Leben kamen."
capiatania:0	"Dreadnought"
capitania_desc:0	"Am 30. Dezember 1905 wurde das Gesetz Nr. 1452 verabschiedet, das £4,214,550 den Bau neuer Kriegsschiffe genehmigte, £1,685,820. Im Jahr 1906 wurden drei kleine Schlachtschiffe, drei Panzerkreuzer, sechs Zerstörer, zwölf Torpedoboote, drei U-Boote und zwei Flussmonitore in Auftrag gegeben. Obwohl die brasilianische Regierung später die Panzerkreuzer aus Kostengründen strich, unterzeichnete der Marineminister, Admiral Júlio César de Noronha, am 2. 3. Juli 1906. Britische Werften erhielten den Auftrag, zwei Dreadnought-Schlachtschiffe, die "Minas Gerais" und die "São Paulo", zu bauen; dies löste ein Wettrüsten mit Argentinien und Chile aus. Später wurde die "Rio de Janeiro" in Auftrag gegeben und verkauft, während ein weiteres Schiff, die "Riachuelo", infolge des Ersten Weltkriegs nie fertiggestellt wurde. Später wurden beide Schiffe vor dem Zweiten Weltkrieg zweimal modernisiert, einmal durch die Vereinigten Staaten und einmal durch die belgische Marine"
large_navio:0	"Flugzeugträger"
large_navio_desc:0	"Brasiliens erster Flugzeugträger wurde 1960 gebaut. Er kam zum Einsatz und versetzte die Franzosen im Hummerkrieg von 1961 bis 1963 in die Flucht. Als einige Gruppen französischer Fischer, die vor der Küste Mauretaniens sehr profitabel fischten, beschlossen, ihre Suche auf die andere Seite des Atlantiks auszuweiten, ließen sie sich an einer Stelle vor der Küste Brasiliens nieder, wo Hummer auf unter Wasser liegenden Felsvorsprüngen in Tiefen von 250–650 Fuß zu finden sind. Doch lokale Fischer beklagten sich, dass große Boote aus Frankreich kamen, um vor der Küste des Bundesstaates Pernambuco Hummer zu fangen, weshalb der brasilianische Admiral Arnoldo Toscano befehligte zwei Korvetten, in das Gebiet zu fahren, in dem sich die französischen Fischereiboote befanden. Da er die Forderung der Fischer für berechtigt hielt, forderte der Kapitän des brasilianischen Schiffes daraufhin die französischen Boote auf, sich in tiefere Gewässer zurückzuziehen und den Kontinentalschelf den kleineren brasilianischen Schiffen zu überlassen. Die Lage spitzte sich zu, als die Franzosen diese Forderung zurückwiesen und per Funk die französische Regierung um die Entsendung eines Zerstörers zur Begleitung der Hummerboote baten, woraufhin die brasilianische Regierung ihre zahlreichen Schiffe in Alarmbereitschaft versetzte. Die französische Regierung entsandte am 21. Februar den Zerstörer der T-53 -Klasse zur Überwachung der Fischereiboote, doch dieser wurde umgehend von einem brasilianischen Kriegsschiff und dem Flugzeugträger Minas Gerais zurückgedrängt."
aereo_desc:0	 "Die brasilianische Luftwaffe ist der Luftwaffenzweig der brasilianischen Streitkräfte und einer der drei nationalen uniformierten Dienste. Die FAB entstand, als die Luftwaffenzweige der Armee und der Marine 1941 zu einer einzigen Streitkraft zusammengelegt wurden, die ursprünglich den Namen "Nationale Luftstreitkräfte" trug. Beide Luftwaffenzweige übertrugen ihre Ausrüstung, Einrichtungen und ihr Personal auf die neue Streitkraft. "
interceptador:0	"Kampfflugzeuge"
nave:0	"FAB"
nave_desc:0	"Formell wurde das Luftfahrtministerium am 20. Januar 1941 gegründet, und so wurde sein militärischer Zweig, der "Nationale Luftstreitkräfte" hieß, am 22. Mai in "Brasilianische Luftwaffe" (Força Aérea Brasileira – FAB). Die Luftwaffenzweige der Armee ("Aviação Militar") und der Marine ("Aviação Naval") wurden aufgelöst, und das gesamte Personal, die Flugzeuge, Anlagen und sonstige zugehörige Ausrüstung wurden an die FAB übertragen"
experiencia_i_desc:0	"Wir können Kriegsspiele durchführen, um unsere militärische Erfahrung mit den modernen Kriegswaffen zu erweitern"
militarismo:0	"Militarismus"
militarismo_desc:0	"Unsere große Nation ist bereit"
educa:0	"Technische Ausbildung"
educa_desc:0	"Zwischen 1950 und 1960 verzeichnete das Land den stärksten Anstieg der Alphabetisierungsrate. Dies ist darauf zurückzuführen, dass ab 1947 in den meisten Gemeinden Zusatzunterrichtsklassen eingerichtet wurden. In gewisser Weise förderte dieser Unterricht die Einschreibung in berufsvorbereitende Kurse oder die Grundstufe der Berufsausbildung. Die Klassen der ergänzenden und berufsvorbereitenden Bildung (préprofissional und professional) wurden zusammen dreizehn Jahre lang jedes Jahr von mehr als 400.000 Schülern besucht. Somit umfasste die ergänzende Bildung zwischen 1947 und 1959 zwei Schulstufen und ermöglichte die Alphabetisierung von etwa 5,2 Millionen Schülern."
