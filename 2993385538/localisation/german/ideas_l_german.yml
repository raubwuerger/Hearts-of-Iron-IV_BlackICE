ENG_continuation_of_politics:0	"Fortsetzung der Politik"
ENG_continuation_of_politics_desc:0	"Es hat sich als einfach erwiesen, die Unterstützung der Bevölkerung für Interventionen in wichtigen Ländern zu gewinnen, in denen die politische Ausrichtung von unserer eigenen abweicht. Dies können wir zu unserem Vorteil nutzen."
Naval_range_speed:0	"Verbesserte Reichweite und Geschwindigkeit"
