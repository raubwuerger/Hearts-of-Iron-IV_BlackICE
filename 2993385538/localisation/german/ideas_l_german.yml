idea_can_paratroopers:0	"Die Black Devils"
idea_can_paratroopers_desc:0	"Durch die Zusammenarbeit mit unseren Verbündeten haben wir die Fähigkeiten unserer Spezialeinheiten verbessert."
idea_d_day_desc:0	"Da wir umfassende Pläne und Vorbereitungen für mögliche Seelandungen getroffen haben, sind wir bereit, bei amphibischen Angriffen schneller zuzuschlagen."
idea_can_vickers:0	"Schlacht um den Atlantik"
idea_can_vickers_desc:0	"Wir müssen bereit sein, unsere Konvois zu schützen, indem wir die feindliche Marine angreifen."
