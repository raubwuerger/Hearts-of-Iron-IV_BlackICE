IRE_king_desc:0	"Der britische Monarch fungiert trotz unserer vielen Siege im Unabhängigkeitskrieg immer noch als Staatsoberhaupt Irlands. Aufgrund der Kurzsichtigkeit der Wählerschaft im Jahr 1922 war die Regierung gezwungen, den Anglo-Irischen Vertrag zu unterzeichnen, der unseren Mitgliedern der Regierung und des öffentlichen Dienstes den repressiven Treueid auferlegte. Darüber hinaus bleibt der König (wenn auch mit Abstand) immer noch das Oberhaupt des irischen Freistaats. Seit der Wahl von 1932 hat Fianna Fáil stets geschworen, solche Bestimmungen aus der Verfassung des Freistaats zu streichen und schließlich den Übergang zu einer vollwertigen Republik herbeizuführen. Obwohl bereits Schritte unternommen wurden, wie etwa die Abschaffung des Treueeids im Jahr 1932, bleiben viele verachtete Verbindungen zu Großbritannien bestehen – die symbolischste davon ist die Übernahme des Oberhauptes unseres großen Landes durch den britischen Monarchen."
