ENG_commonwealth_officers:0	 "Britische Offiziere"
ENG_commonwealth_officers_desc:0	"Als Mitglied des Commonwealth haben die Briten die Kontrolle über unsere Außen- und Militärangelegenheiten. Obwohl sie kompetent sind, führen sie oft nicht-britische Streitkräfte in gefährliche Situationen \n§Y Eine Stärkung Ihrer Autonomie wird diesen Geist verbessern oder beseitigen§!"
ENG_stagnant_aviation_industry_desc:0	"Die britische Luftfahrtindustrie ist zwar innovativ, hat jedoch eine Phase der Stagnation in den frühen 1930er Jahren hinter sich. Es sind weitere Investitionen in die RAF erforderlich, um sie auszubauen und für zukünftige Herausforderungen zu rüsten."
ENG_colonial_elite:0	"Koloniale Elite"
ENG_colonial_elite_desc:	"Wissenschaftler im gesamten Empire arbeiten zusammen, um Großbritannien als weltweit führende Nation in der Wissenschaft zu erhalten."
ENG_george_vi_desc:0	"Der erste Oberhaupt des Commonwealth und letzte Kaiser von Indien gilt nach wie vor als Erbe eines großen Vermächtnisses. Wie schon sein Vater vor ihm ist er eine beliebte Symbolfigur und einigender Faktor für das britische Volk."
