home_of_revolution:0	 "Heimat der Revolution"
home_of_revolution_desc:0	"Genossen, mit der Niederlage der abscheulichen trotzkistischen Konterrevolutionäre konnten wir uns auf die Verteidigung der Revolution konzentrieren. Unser Ziel, unsere Hoffnung, unser Slogan ist der Sozialismus in einem Land. Wir werden hier in der Sowjetunion eine üppige sozialistische Utopie errichten, und der Rest der Welt wird sie unweigerlich annehmen."
en_svensk_tiger:0	"En Svensk Tiger"
en_svensk_tiger_desc:0	" Wenn Schweden wie ein lauernder Tiger sein soll, dürfen diejenigen, die uns ausspionieren, nicht wissen, was wir tun. In diesen Zeiten des Konflikts und der Unruhen ist es die patriotische Pflicht jedes Schweden, zu schweigen."
state_shintoism_desc:0	"Seit der Meiji-Restauration haben wir versucht, die Verehrung in den Shinto-Schreinen zu nutzen, um die Loyalität gegenüber dem Kaiser zu fördern und den Aufbau der Nation zu unterstützen. Dies hat es uns ermöglicht, ein Land aufzubauen, das bereit ist, im Namen des Staates große Opfer zu bringen."
daitoakyoeiken_desc:0	"Die Großostasiatische Wohlstandssphäre demonstrierte die Überlegenheit der Japaner gegenüber anderen asiatischen Völkern und liefert den Beweis dafür, dass die Sphäre von Natur aus hierarchisch aufgebaut war, einschließlich der wahren Absicht des japanischen Kaiserreichs, den asiatischen Kontinent und den Pazifik zu beherrschen"
