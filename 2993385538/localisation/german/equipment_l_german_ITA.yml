g55_cannon_upgrade:0	"Kanonen"
g55_range_upgrade:0	"Reichweite"
g55_range_upgrade_desc:0	"Rüstet Zusatztanks aus, um die Reichweite unserer Flugzeuge zu erhöhen."
g55s_naval_bomber_equipment:0	"Marinebomber"
g55s_naval_bomber_equipment_1:0	"Fiat G.55S "Silurante""
tech_g55s_naval_bomber_equipment_1_desc:0	"Die Fiat G.55S ist eine Torpedobomber-Entwicklung des Fiat G.55-Jägers."
g56_fighter_equipment_desc:0	"Jäger sind Flugzeuge, die dazu bestimmt sind, feindliche Flugzeuge zu zerstören"
g56_fighter_equipment_1:0	"Fiat G.56"
g56_fighter_equipment_1_short:0	"G.56-Jäger"
tech_g56_fighter_equipment_1:0	"G.56"
re2006_multirole_equipment_1:0	"Reggiane Re.2006"
re2006_multirole_equipment_1_desc:0	"Die Reggiane Re.2006 war eine Weiterentwicklung des Jagdflugzeugs Re.2005, die für den Einsatz des deutschen Daimler-Benz-Motors DB 603 konzipiert war. Ein Prototyp wurde fertiggestellt und überstand dank großer Anstrengungen das Kriegsende, wurde jedoch während des Krieges von Partisanen und nach dem Krieg von den alliierten Behörden am Fliegen gehindert. Seine Geschwindigkeit kann verbessert werden. "
tech_re2006_multirole_equipment_1:0	"Re.2006 "
tech_re2006_multirole_equipment_1_desc:0	"Die Reggiane Re.2006 war eine Weiterentwicklung des Jagdflugzeugs Re.2005, das für den Einsatz des deutschen Daimler-Benz-Motors DB 603 konzipiert war. Ein Prototyp wurde fertiggestellt und überstand das Kriegsende unter großen Anstrengungen, wurde jedoch während des Krieges von Partisanen und nach dem Krieg von den alliierten Behörden am Fliegen gehindert. Seine Geschwindigkeit kann verbessert werden. "
re2006_radiator_upgrade_desc:0	"Die Serienversion der Re.2006 sollte über Kühler in den Tragflächen verfügen, um die Geschwindigkeit des Flugzeugs zu erhöhen."
exported_interceptor_equipment_1_short:0	"Export-Abfangjäger"
ca114_interceptor_equipment_1:0	"Caproni Ca.114"
ca114_interceptor_equipment_1_short:0	"Ca.114 Abfangjäger"
ca114_interceptor_equipment_1_desc:0	"Italien entwarf und exportierte zahlreiche Jagdflugzeuge wie die Caproni Ca.114, die im Ausland eingesetzt wurden."
ba27m_interceptor_equipment_1_short:0	"Ba.27M Abfangjäger"
ro41_interceptor_equipment_desc:0	"Abfangjäger sind Flugzeuge, die ausschließlich zur Bekämpfung feindlicher Flugzeuge konzipiert sind."
ro41_interceptor_equipment_1_short:0	"Ro.41-Jäger"
ro41_interceptor_equipment_1_desc:0	"Die IMAM Ro.41 ist ein Doppeldecker-Trainingsflugzeug, das auch als leichter Jäger eingesetzt wird. Es ist deutlich untermotorisiert."
ca165_interceptor_equipment_1:0	"Caproni Ca.165"
ca165_interceptor_equipment_1_desc:0	"Die Caproni Ca.165 war ein italienischer Doppeldecker-Jäger, der nie über das Prototypenstadium hinauskam. Seine Flugleistung wurde als derjenigen der Fiat C.R.42 überlegen eingeschätzt. "
ss4_fighter_equipment_desc:0	"Leichte Jagdflugzeuge sind kostengünstige Maschinen mit geringer Panzerung und Bewaffnung. Sie sind oft die erste Wahl für Nationen, denen die strategischen Ressourcen und die Zeit zum Bau robusterer Flugzeuge fehlen, sowie für Nationen, die nicht mit ernsthaftem Widerstand rechnen. "
ss4_fighter_equipment_1_short:0	"S.S.4 Leichtjäger"
ss4_fighter_equipment_1_desc:0	"Die SAI Ambrosini S.S.4 war ein ungewöhnlicher Jagdflugzeug-Prototyp aus Italien. Die S.S.4 verfügte über Canards, wobei sich Motor und Propeller hinter dem Piloten befanden. Leider führte eine fehlerhafte Konstruktion dazu, dass der Prototyp bei seinem zweiten Flug abstürzte, wobei sowohl der Pilot als auch das Programm ums Leben kamen. Er kann seine Bewaffnung aufrüsten."
tech_ss4_fighter_equipment_1:0	"S.S.4"
ss4_cannon_upgrade:0	"Kanone"
sai207_fighter_equipment_1:0	"Ambrosini SAI.207"
sai207_fighter_equipment_1_desc:0	 "Die SAI.207, eine Weiterentwicklung der SAI.107 (selbst eine Weiterentwicklung des Trainingsjägers SAI.7), war ein leichtes Kampfflugzeug. Es kann seine Bewaffnung aufrüsten."
tech_sai207_fighter_equipment_1:0	"SAI.207"
tech_sai207_fighter_equipment_1_desc:0	"Die SAI.207 wurde aus der SAI.107 (einer Weiterentwicklung des Jagdtrainers SAI.7) entwickelt und war ein leichtes Jagdflugzeug. Ihre Bewaffnung kann aufgerüstet werden."
sai207_gun_upgrade_desc:0	"Installieren Sie zwei 20-mm-Kanonen vom Typ MG 151/20. Dies wird die Leistung erheblich beeinträchtigen."
sai403_fighter_equipment_1_short:0	"SAI.403 Leichtjäger"
tech_sai403_fighter_equipment_1:0	"SAI.403"
tech_sai403_fighter_equipment_1_desc:0	"Die Ambrosini SAI.403 "Dardo" war ein italienischer Leichtjäger, der aus der SAI.107 entwickelt wurde. Seine Bewaffnung und Reichweite können verbessert werden."
sai403_gun_upgrade:0	"Kanone"
sai403_range_upgrade:0	"Reichweite"
cr25_fighter_equipment_1:0	"Fiat C.R.25"
cr25_fighter_equipment_1_desc:0	"Die Fiat C.R.25 war ein in Italien entwickelter schwerer Jäger. Sie wurde vor allem als Langstrecken-Begleit- und Seeaufklärungsflugzeug eingesetzt. Ihre Kanonen, Bombenlast und Reichweite können verbessert werden. "
tech_cr25_fighter_equipment_1:0	"C.R.25"
tech_cr25_fighter_equipment_1_desc:0	"Die Fiat C.R.25 war ein in Italien entwickelter schwerer Jäger. Sie wurde vor allem als Langstrecken-Begleit- und Seeaufklärungsflugzeug eingesetzt. Es können die Bordwaffen, die Bombenlast und die Reichweite verbessert werden."
cr25_bombs_upgrade_desc:0	"Es wurden Untersuchungen zur Erhöhung der Bombenlast der C.R.25 auf 400 kg durchgeführt, doch da das Flugzeug in dieser Rolle nur selten zum Einsatz kam, wurden diese nicht weiterverfolgt."
cr25_guns_upgrade_desc:0	"Installiert ein zusätzliches, nach vorne feuerndes 12,7-mm-Maschinengewehr vom Typ Breda-SAFAT."
ro57_fighter_equipment_desc:0	"Schwere Jäger sind zweimotorige Flugzeuge, die für Angriffe auf Luft- und Bodenziele ausgelegt sind."
ro57_fighter_equipment_1:0	"IMAM Ro.57"
ro57_fighter_equipment_1_short:0	"Ro.57 Schwerer Jäger"
tech_ro57_fighter_equipment_1:0	"IMAM Ro.57"
ro57_cannon_upgrade:0	"Kanone"
ro57_bomb_upgrade:0	"Bomben"
ro57_bomb_upgrade_desc:0	"Die Ro.57bis konnte standardmäßig bis zu 500 kg Bomben tragen. Sie war zudem in der Lage, 820- oder 1000-kg-Bomben zu transportieren."
ro58_fighter_equipment:0	"Schwerer Jäger"
ro58_fighter_equipment_1:0	"IMAM Ro.58"
tech_ro58_fighter_equipment_1_desc:0	"Die IMAM Ro.58 war ein von Italien entwickelter schwerer Jäger. Sie kann einen Teil ihrer Kanonen durch Bomben ersetzen."
ca_183_fighter_equipment_desc:0	"Jäger sind Flugzeuge, die dazu bestimmt sind, feindliche Flugzeuge zu zerstören"
ca_183_fighter_equipment_1:0	"Caproni Ca.183bis"
ca_183_fighter_equipment_1_short:0	"Ca.183bis Motorjet-Jäger"
tech_ca_183_fighter_equipment_1:0	"Caproni Ca.183bis"
ba201_cas_equipment_1:0	"Breda Ba.201"
ba201_cas_equipment_1_desc:0	"Die Breda Ba.201 war ein italienischer Prototyp eines Sturzkampfbombers. Obwohl sie eine hervorragende Leistung erbrachte, verwendete sie den Daimler-Benz DB 601-Motor, der für Kampfflugzeuge benötigt wurde, sodass sie nie über das Prototypenstadium hinauskam."
tech_ba201_cas_equipment_1:0	" Ba.201"
tech_ba201_cas_equipment_1_desc:0	"Die Breda Ba.201 war ein italienischer Prototyp eines Sturzkampfbombers. Obwohl sie eine hervorragende Leistung erbrachte, verwendete sie den Daimler-Benz-Motor DB 601, der für Jagdflugzeuge benötigt wurde, sodass sie nie über das Prototypenstadium hinauskam."
bz308_transport_plane_equipment_desc:0	"Große Transportflugzeuge mit großer Reichweite. Sie werden zum Abwerfen von Fallschirmjägern eingesetzt."
tech_bz308_transport_plane_equipment_1:0	"BZ.308"
z501_flying_boat_equipment:0	"Leichter Marinebomber"
z501_flying_boat_equipment_desc:0	"Leichte Marinebomber, die für Angriffe auf feindliche Schiffe vorgesehen sind."
z501_flying_boat_equipment_1:0	"CANT Z.501 "Gabbiano""
z501_flying_boat_equipment_1_desc:0	"Die CANT Z.501 war ein italienisches Flugboot, das weit verbreitet war. Trotz ihrer geringen Geschwindigkeit blieb das Flugzeug auch nach dem Ende des Zweiten Weltkriegs im Einsatz. Ihr Triebwerk kann aufgerüstet werden."
z506b_naval_bomber_equipment_1_short:0	"Z.506B Schwerer Marinebomber"
tech_z506b_naval_bomber_equipment_1:0	"CANT Z.506B"
tech_z506b_naval_bomber_equipment_1_desc:0	"Die CANT Z.506B war ein dreimotoriges Wasserflugzeug, das ursprünglich für zivile Langstreckenflüge entwickelt wurde. Das Modell B wurde für den militärischen Einsatz entwickelt und fand in vielen Bereichen breite Anwendung."
mc77_flying_boat_equipment:0	"Flugboot"
mc77_flying_boat_equipment_1:0	"Macchi MC.77"
tech_mc77_flying_boat_equipment_1_desc:0	"Die Macchi MC.77 war ein italienischer Flugboot-Prototyp. Die italienische Regierung lehnte es ab, das Flugzeug in Serie zu geben."
mc99_flying_boat_equipment_desc:0	"Große Marinebomber, die für Angriffe auf feindliche Schiffe vorgesehen sind."
mc99_flying_boat_equipment_1:0	"Macchi MC.99"
mc99_flying_boat_equipment_1_short:0	"MC.99-Flugboot"
z1007_bomber_equipment:0	"Leichter Bomber"
z1007_bomber_equipment_1_desc:0	"Die CANT Z.1007 war ein italienischer Bomber, der auf hohe Leistungsfähigkeit ausgelegt war. Ihre Triebwerke können aufgerüstet werden."
tech_z1007_bomber_equipment_1_desc:0	"Die CANT Z.1007 war ein italienischer Bomber, der auf hohe Leistung ausgelegt war. Seine Triebwerke können aufgerüstet werden."
z1007_engine_upgrade:0	"Triebwerke"
z1007_engine_upgrade_desc:0	"Rüsten Sie die Triebwerke auf den Piaggio P.XI RC.40 auf."
z1007bis_bomber_equipment_desc:0	"Leichte Bomber sind mehrmotorige Flugzeuge, die für Angriffe auf feindliche Boden- und strategische Ziele konzipiert sind."
tech_z1007bis_bomber_equipment_1:0	"Z.1007bis"
z1007bis_engine_upgrade:0	"Triebwerke"
z1007bis_engine_upgrade_desc:0	"Rüsten Sie die Motoren auf den Piaggio P.XIX RC.45 auf."
z1007bis_bomb_upgrade:0	"Bomben"
z1007bis_gun_upgrade:0	"Kanonen"
z1007ter_bomber_equipment_desc:0	"Leichte Bomber sind mehrmotorige Flugzeuge, die für Angriffe auf feindliche Boden- und strategische Ziele konzipiert sind. "
z1007ter_bomber_equipment_1_short:0	"Leichter Bomber Z.1007ter"
z1007ter_bomber_equipment_1_desc:0	"Die CANT Z.1007ter war eine späte Version der Z.1007 mit deutlich erhöhter Motorleistung."
tech_z1007ter_bomber_equipment_1:0	"Z.1007ter"
p108_gun_upgrade:0	"Kanonen"
z1018a_bomber_equipment_desc:0	"Mittlere Bomber sind mehrmotorige Bomber, die zum Angriff auf feindliche Boden- und strategische Ziele eingesetzt werden."
z1018a_bomber_equipment_1_short:0	"Z.1018A Schneller Bomber"
z1018a_bomber_equipment_1_desc:0	"Die CANT Z.1018A war ein italienischer mittelschwerer Bomber aus Holz, der eine hohe Leistungsfähigkeit bot. Aufgrund eines langwierigen Entwicklungszyklus wurde schließlich beschlossen, die Serienversion aus Metall zu bauen, wobei nur die Vorserie aus Holz gefertigt wurde. Die Bombenlast und die Reichweite können verbessert werden. Er kann zum Torpedobomber Z.1018A Silurante umgerüstet werden."
tech_z1018a_bomber_equipment_1:0	"CANT Z.1018A"
z1018a_range_upgrade:0	"Reichweite"
z1018_bomber_equipment:0	"Mittlerer Bomber"
z1018_bomber_equipment_1:0	"CANT Z.1018 "Leone I""
z1018_bomber_equipment_1_short:0	"Z.1018 Schnellbomber"
z1018_bomber_equipment_1_desc:0	"Als Metallversion der CANT Z.1018A entwickelt, konnte die Leone I eine schwerere Nutzlast tragen als ihr Vorgänger aus Holz. Obwohl die Flugleistung geringer war, wurde sie als ausreichend angesehen, um sowohl Torpedobomber- als auch Nachtjäger-Versionen des Flugzeugs zu entwickeln, und sie diente zudem als Grundlage für die Projekt- und Prototypenreihe BZ.301-4. Es kann seine Kanonen, Bomben und Reichweite aufrüsten. Es kann in den Nachtjäger Z.1018M "Lince" und den Torpedobomber Z.1018 Silurante umgerüstet werden."
tech_z1018_bomber_equipment_1_desc:0	" Als Metallversion der CANT Z.1018A entwickelt, konnte die Leone I eine schwerere Nutzlast tragen als ihr Vorgänger aus Holz. Obwohl die Flugleistung geringer war, wurde dies als ausreichend akzeptabel angesehen, um sowohl Torpedobomber- als auch Nachtjäger-Versionen des Flugzeugs zu entwickeln, und es diente zudem als Grundlage für die Projekt- und Prototypenreihe BZ.301-4. Es kann seine Kanonen, Bomben und Reichweite aufrüsten. Es kann zum Nachtjäger Z.1018M "Lince" und zum Torpedobomber Z.1018 Silurante umgerüstet werden."
z1018_range_upgrade_desc:0	"Es wurden Untersuchungen zur Anbringung von zwei 500-Liter-Zusatztanks an dem Flugzeug durchgeführt. Historische Flugdaten fehlen."
z1018_bomb_upgrade_desc:0	"Ermöglicht den Transport von bis zu 2000 kg Bomben an der Außenseite des Flugzeugs."
z1018a_naval_bomber_equipment_1:0	"CANT Z.1018A Silurante"
z1018a_naval_bomber_equipment_1_short:0	"Z.1018A S. Marinebomber"
tech_z1018a_naval_bomber_equipment_1:0	"Z.1018A Silurante"
z1018_naval_bomber_equipment_1_desc:0	"Mindestens eines der Serienflugzeuge (Metallbauweise) des Typs Z.1018, MM.24826, wartete vor dem Zusammenbruch Italiens auf die Erprobung als Torpedobomber. Historische Flugleistungsdaten fehlen."
tech_z1018_naval_bomber_equipment_1_desc:0	"Mindestens eines der Serienflugzeuge (Metallbauweise) des Typs Z.1018, MM.24826, wartete vor dem Zusammenbruch Italiens auf Tests als Torpedobomber. Historische Flugleistungsdaten fehlen."
z1018_night_fighter_equipment:0	"Nachtjäger"
z1018_night_fighter_equipment_desc:0	"Nachtjäger sind Flugzeuge, die dazu ausgelegt sind, feindliche Flugzeuge, die nachts operieren, aufzuspüren und zu zerstören. Oft handelt es sich dabei um umgebaute Bomber."
tech_z1018_night_fighter_equipment_1:0	"CANT Z.1018M "Lince""
italian_early_light_bomber_equipment:0	"Leichtbomber"
ca101_bomber_equipment_1:0	"Caproni Ca.101"
ca101_bomber_equipment_1_short:0	"Ca.101 Leichter Bomber"
ca101_bomber_equipment_1_desc:0	"Die Caproni Ca.101 ist ein leichter Bomber, der ursprünglich als ziviles Transportflugzeug entwickelt wurde."
ca101_bomber_equipment_2_short:0	"Ca.101 bis Leichter Bomber"
ca101_bomber_equipment_3_desc:0	"Die Caproni Ca.101 D2 ist ein leichter Bomber, der ursprünglich als ziviles Transportflugzeug entwickelt wurde. Die D2-Version verfügt über leistungsstärkere Triebwerke und eine schwerere Bewaffnung."
ca102_bomber_equipment_1_short:0	"Ca.102 Leichter Bomber"
ca102_bomber_equipment_1_desc:0	"Die Caproni Ca.102 ist ein leichter Bomber, der ursprünglich als ziviles Transportflugzeug entwickelt wurde."
br3_bomber_equipment_1:0	"Fiat B.R.3"
br3_bomber_equipment_1_desc:0	"Die Fiat B.R.3 ist ein leichter Bomber."
ca111idro_naval_bomber_equipment_1_desc:0	" Als Weiterentwicklung des Ca.111-Bombers war die Ca.111 Idro ein Wasserflugzeug, das einen Torpedo zum Angriff auf Schiffe tragen konnte. Sie kann in den Ca.111-Bomber oder den Ca.111-Transporter umgerüstet werden."
ca111_light_bomber_equipment_desc:0	"Leichte Bomber sind mehrmotorige Flugzeuge, die für den Angriff auf feindliche Boden- und strategische Ziele konzipiert sind."
ca111_bomber_equipment_1:0	"Caproni Ca.111"
