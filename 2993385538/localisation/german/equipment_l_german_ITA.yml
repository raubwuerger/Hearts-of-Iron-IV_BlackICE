 tech_mediumengine1_desc:0 "Um fortschrittlichere Flugzeuge herstellen zu können, müssen wir einen Motor nach dem Vorbild des Fiat A.76 entwickeln oder einen Motor wie den DB 601 lizenzieren."
 tech_heavyengine1_desc:0 "Unsere Flugzeuge brauchen einen noch leistungsfähigeren Motor. Wir können entweder die Entwicklung des Isotta Fraschini Zeta-Motors fortsetzen oder einen Motor wie den DB 605 lizenzieren."
 tech_italianmotorjet1_desc:0 "Secondo Campini entwickelt seit einigen Jahren einen so genannten Thermojet. Diese Antriebsmethode könnte zu Hochleistungsflugzeugen führen, die nicht das gleiche Maß an fortschrittlichen Materialien und Konstruktionen benötigen wie herkömmliche Strahltriebwerke."
