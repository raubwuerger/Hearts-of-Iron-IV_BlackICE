ca111_bomb_upgrade_desc:0	"Ermöglicht es dem Flugzeug, entweder zwei 250-kg-Bomben oder zwei 500-kg-Bomben unter dem Rumpf zu tragen."
ca111_guns_upgrade_desc:0	"Die Bewaffnung der Ca.111 konnte durch den Austausch des einzelnen Maschinengewehrs im Rückenturm gegen ein Doppelmaschinengewehr, den Einbau eines Unterflurturms sowie die Installation eines feststehenden, nach vorne feuernden Maschinengewehrs erweitert werden."
ca111_engine_upgrade:0	"Triebwerk"
ca111_transport_plane_equipment_desc:0	"Transportflugzeuge sind Flugzeuge, die zum Abwerfen von Fallschirmjägern eingesetzt werden."
ca111_transport_plane_equipment_1_desc:0	"Obwohl die Ca.111 als leichter Bomber konzipiert war, wurde das Flugzeug zunehmend für Transportaufgaben eingesetzt, als es veraltet war. In dieser Funktion wurde es von Peru eingesetzt. Es kann in Bezug auf Motor und Bewaffnung aufgerüstet werden. Es kann entweder zum Torpedobomber Ca.111 Idro oder zum leichten Bomber Ca.111 umgebaut werden."
