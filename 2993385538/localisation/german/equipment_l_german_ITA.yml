guided_aircraft_bombs_equipment_desc:0	"Gelenkte Bomben sind Flugzeuge, die ferngesteuert in feindliche Schiffe eindringen können. In der Regel handelt es sich dabei entweder um veraltete Bomber oder um billige, speziell entwickelte Flugzeuge."
sm79_guided_equipment_1:0	"Savoia-Marchetti SM.79-Lenkbombe"

sm79_guided_equipment_1_desc:0	"Ein abgespeckter SM.79-Bomber, der so modifiziert wurde, dass er ferngesteuert und mit Sprengstoff gefüllt werden kann. Er ist für unbemannte Kamikaze-Angriffe gegen Schiffe vorgesehen. Er kann aus dem SM.79-Bomber umgebaut werden."
