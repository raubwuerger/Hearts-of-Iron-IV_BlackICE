ar4_guided_equipment_1_desc:0	"Die A.R. war eine italienische gelenkte Anti-Schiffs-Waffe. Sie war so konzipiert, dass sie mit einem Piloten (und Platz für einen Techniker) startete, der später abspringen würde; während des Endanflugs wurde die A.R. von einem anderen Flugzeug aus gesteuert. Sie wurde nie operativ eingesetzt; ein halbes Dutzend Exemplare wurden fertiggestellt oder befanden sich im Bau."
