tech_ca135bis_bomber_equipment_1_desc:0	"Die Ca.135bis ist eine Überarbeitung der Ca.135 zur Behebung von Problemen mit der Steuerung und Sicherheit und stellt einen italienischen mittleren Bomber dar. Ihre Kanonen und Triebwerke können aufgerüstet werden."
