ITA_infantry_equipment_0_short:0	" Carcano 91"
ITA_infantry_equipment_0_desc:0	"Das Carcano Modello 1891 war das Standardgewehr und eine Ikone der Königlichen Italienischen Armee in allen Konflikten, an denen die R.E. beteiligt war – von den Kolonialkriegen bis zum Zweiten Weltkrieg"
ITA_infantry_equipment_1_short:0	"Carcano 38"
ITA_infantry_equipment_1_desc:0	"Die 6,5-mm-Munition des Carcano schien angesichts der neuen Zeiten mittlerweile veraltet zu sein, und das war eine Lektion, die man während des Krieges gegen Äthiopien gelernt hatte. Daher führte die Armee 1938 die neuen 7,35 x 51-mm-Patronen ein, zusammen mit überholten Gewehren mit abgenutzten Läufen."
ITA_infantry_equipment_2:0	"Carcano Modello 91/38"
ITA_infantry_equipment_2_desc:0	"Es kamen Zweifel auf, dass die beiden unterschiedlichen Standards in einem möglichen bevorstehenden Krieg zu Verwirrung in der Logistik geführt hätten; daher wurde die Produktion des Mod. 38 eingestellt, nachdem nur 285.000 Exemplare des Mod. 38 hergestellt worden waren, die bald ausgemustert und verkauft wurden. Das Modell wurde auf das Kaliber 6,5 mm umgestellt."
ITA_infantry_equipment_3:0	"Carcano Modello 91/41"
ITA_infantry_equipment_3_desc:0	"Das Mod. 91/41 war die letzte große Weiterentwicklung der Serie und wurde entwickelt, um die Divisionen der Armee auszurüsten, die an die Ostfront entsandt wurden. Dieses auf das Kaliber 6,5 mm abgestimmte Gewehr verzichtete auf die mit dem Mod. 38 eingeführten Änderungen und sieht dem ersten Mod. 91 sehr ähnlich."
