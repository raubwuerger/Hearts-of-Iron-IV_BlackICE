 ITA_mortar_equipment_0:0 "Mörser von 45mm Brixia Modello 35"
 ITA_mortar_equipment_0_desc:0 "Mörser sind die primäre explosive Unterstützungswaffe des Zuges. Wo größere Artilleriegeschütze für einen flexiblen taktischen Einsatz zu schwerfällig sein könnten, kann der Mörser den Soldaten in der Nähe organische Feuerunterstützung bieten. Die hohe Flugbahn der Mörsergranaten macht sie ideal für die Landung in Schützengräben, den Einschlag in die verwundbaren Dächer von Gebäuden oder das Umgehen von Mauern."
