ca133_undercarriage_upgrade_desc:0	"Die Ca.142 war ein Versuch, die Flugleistung der Ca.133 durch die Einführung eines einziehbaren Fahrwerks zu verbessern. Aufgrund von Zuverlässigkeitsproblemen wurde der einzige Prototyp schließlich wieder auf ein festes Fahrwerk umgerüstet."
