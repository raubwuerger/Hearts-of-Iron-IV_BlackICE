cr_series_fighter_equipment:0	"Jäger"
cr_series_fighter_equipment_1:0	"Fiat C.R.1 Asso"
cr_series_fighter_equipment_2_short:0	"Fiat C.R.20 Leichtjäger"
cr_series_fighter_equipment_3:0	" Fiat C.R.20 Asso"
cr_series_fighter_equipment_3_short:0	"Fiat C.R.20 Asso Leichtjäger"
cr_series_fighter_equipment_3_desc:0	"Die Doppeldecker der Fiat C.R.-Serie waren Hochleistungsjäger, die von Celestino Rosatelli für Fiat entworfen wurden."
cr_series_fighter_equipment_4_short:0	"Fiat C.R.30 Leichtjäger"
cr_32_fighter_equipment_desc:0	"Leichtjäger sind kostengünstige Flugzeuge mit geringer Panzerung und Bewaffnung. Sie sind oft die erste Wahl für Nationen, denen die strategischen Ressourcen und die Zeit fehlen, um robustere Flugzeuge zu bauen, sowie für Nationen, die nicht mit ernsthaftem Widerstand rechnen."
cr_32_fighter_equipment_1_short:0	"C.R.32 Leichtjäger"
cr_32_fighter_equipment_1_desc:0	"Die Fiat C.R.32 war ein italienischer Doppeldecker-Jäger. Sie war sehr erfolgreich und wurde als Jäger, Bodenangriffsflugzeug und Nachtjäger eingesetzt. Sie ist mit zwei 12,7-mm-Breda-SAFAT-Maschinengewehren bewaffnet. Er kann aufgerüstet werden, um zusätzliche Waffen zu tragen, die Flugzeugzelle zu verstärken und die Geschwindigkeit geringfügig zu erhöhen."
cr_32_fighter_equipment_2:0	"Fiat C.R.32 bis"
cr_32_fighter_equipment_2_desc:0	"Die Fiat C.R.32 bis war ein italienischer Doppeldecker-Jäger. Er war sehr erfolgreich und wurde als Jagdflugzeug, Bodenangriffsflugzeug und Nachtjäger eingesetzt. Er ist mit zwei 12,7-mm-Breda-SAFAT-Maschinengewehren bewaffnet. Er kann aufgerüstet werden, um zusätzliche Waffen zu tragen, die Flugzeugzelle zu verstärken und eine leichte Geschwindigkeitssteigerung zu erzielen."
cr_32_structure_upgrade:0	"Flugzeugzelle"
cr_32_quater_upgrade:0	 "Quater"
cr_32_quater_upgrade_desc:0	"Der C.R.32 Quater wies gegenüber dem Ter eine leichte Geschwindigkeitssteigerung auf. Die zusätzlichen Maschinengewehre des Bis wurden nicht beibehalten."
cr_41_fighter_equipment:0	"Leichtjäger"
cr_41_fighter_equipment_1:0	"Fiat C.R.41"
tech_cr_41_fighter_equipment_1_desc:0	"Die Fiat C.R.-Serie der Doppeldecker-Jäger ist bereits sehr erfolgreich. Der Einsatz eines leistungsstärkeren Motors wird ihre Leistung steigern."
cr_33_fighter_equipment_1_short:0	"C.R.33 Leichtjäger"
cr_33_fighter_equipment_1_desc:0	"Die C.R.33 war ein von Fiat entwickelter Prototyp eines Doppeldecker-Jägers. Basierend auf der C.R.32 wurde sie modifiziert, um den Fiat A.33 RC 35-Motor nutzen zu können. Es gibt keine Upgrades."
tech_cr_33_fighter_equipment_1:0	"Fiat C.R.33"
cr_42_fighter_equipment:0	"Leichtjäger "
cr_42_fighter_equipment_1_desc:0	"Die Fiat C.R.42 Falco, die oft als der ultimative Doppeldecker-Jäger angesehen wird, bewährte sich bis weit in die Ära der Eindecker-Jäger hinein. Sie kann ihre Bewaffnung, Bombenlast, Panzerung und Reichweite aufrüsten."
tech_cr_42_fighter_equipment_1_desc:0	"Fiat ist überzeugt, die Entwicklung des Doppeldecker-Jägers bis an die Grenzen vorantreiben zu können. Er kann seine Bewaffnung, Bombenlast, Panzerung und Reichweite verbessern."
cr42_guns_upgrade:0	"Kanonen"
cr42_guns_upgrade_desc:0	"Rüstet zwei zusätzliche Breda-SAFAT-12,7-mm-Maschinengewehre aus."
cr42_armor_upgrade_desc:0	"Rüstet 23 kg Panzerung für den Piloten aus."
cr42_bombs_upgrade_desc:0	"Ermöglicht es dem Flugzeug, bis zu zwei 160-kg-Bomben zu tragen."
cr_42_daimler_fighter_equipment_1_short:0	"C.R.42 DB Leichtjäger"
cr_42_daimler_fighter_equipment_1_desc:0	"Durch den Einbau eines deutschen DB 601-Motors wurde die C.R.42 zum schnellsten Doppeldecker-Jäger. Ihre Bewaffnung, Bombenlast, Panzerung und Reichweite können verbessert werden."
mc200_fighter_equipment:0	"Abfangjäger"
mc200_fighter_equipment_1:0	"Macchi C.200 " Saetta""
tech_mc200_fighter_equipment_1_desc:0	"Der Macchi C.200 war ein italienischer Eindecker. Er kann seinen Motor und seine Bewaffnung aufrüsten."
mc200_engine_upgrade_desc:0	"Rüsten Sie den Motor auf den Fiat A.74 R.C. 38 auf."
mc200_guns_upgrade:0	"Bordwaffen"
mc200_guns_upgrade_desc:0	"Installiert zwei zusätzliche Breda-SAFAT-7,7-mm-Maschinengewehre in den Tragflächen."
mc202_fighter_equipment_desc:0	"Abfangjäger sind Flugzeuge, die ausschließlich für den Kampf gegen feindliche Flugzeuge konzipiert sind."
tech_mc202_fighter_equipment_1:0	"Macchi C.202"
mc202_cannon_upgrade:0	"Kanone"
mc202_cannon_upgrade_desc:0	"Obwohl im Flugzeug nicht genügend Platz für den Einbau einer Motorkanone vorhanden ist, gibt es andere Möglichkeiten, Bewaffnung an einem Flugzeug anzubringen. Unterflügelgondeln beeinträchtigen zwar die Flugleistung, ermöglichen es der Folgore jedoch, zwei 20-mm-MG-151/20-Kanonen zu tragen."
mc202_guns_upgrade:0	"Kanonen"
mc202_bomb_upgrade:0	"Bomben"
mc202_armor_upgrade:0	"Panzerung"
mc205_fighter_equipment:0	"Abfangjäger"
mc205_fighter_equipment_desc:0	"Abfangjäger sind Flugzeuge, die ausschließlich für den Kampf gegen feindliche Flugzeuge konzipiert sind."
mc205_fighter_equipment_1:0	"Macchi C.205V "Veltro""
mc205_fighter_equipment_1_desc:0	"Die Macchi C.205V ist ein italienisches Jagdflugzeug. Im Wesentlichen handelt es sich um eine C.202 mit einem DB 605 A-Motor. Ihre Bewaffnung kann aufgerüstet werden, um 20-mm-Kanonen zu tragen. Sie kann aus der C.202 umgebaut werden."
mc205_cannon_upgrade_desc:0	"Rüsten Sie zwei der 12,7-mm-Maschinengewehre auf 20-mm-MG-151/20-Kanonen auf."
mc205n_fighter_equipment_desc:0	"Abfangjäger sind Flugzeuge, die ausschließlich zur Bekämpfung feindlicher Flugzeuge konzipiert sind."
mc205n_fighter_equipment_1:0	"Macchi C.205N "Orione""
mc205n_fighter_equipment_1_short:0	"C.205N Abfangjäger"
tech_mc205n_fighter_equipment_1:0	"Macchi C.205N "Orione""
mc206_fighter_equipment:0	"Abfangjäger"
mc206_fighter_equipment_1:0	"Macchi C.206"
mc206_fighter_equipment_1_short:0	"C.206 Interceptor"
mc206_fighter_equipment_1_desc:0	"Die Macchi C.206 war eine Weiterentwicklung der C.205N, die darauf abzielte, die Leistung des Flugzeugs in der Höhe durch eine Vergrößerung der Flügel zu steigern. Der Prototyp wurde zunächst durch eine Explosion und anschließend durch alliierte Bombenangriffe zerstört."
tech_mc206_fighter_equipment_1_desc:0	"Die Macchi C.206 war eine Weiterentwicklung der C.205N, mit der durch eine Vergrößerung der Flügelfläche die Leistung des Flugzeugs in der Höhe gesteigert werden sollte. Der Prototyp wurde zunächst durch eine Explosion und anschließend durch alliierte Bombenangriffe zerstört."
tech_mc207_fighter_equipment_1:0	"Macchi C.207"
old_multirole_equipment:0	"Mehrzweck"
old_multirole_equipment_desc:0	"Mehrzweckjäger sind in der Lage, sowohl feindliche Flugzeuge als auch feindliche Bodenziele anzugreifen."
m41_boat_fighter_equipment_1:0	"Macchi M.41bis"
m41_boat_fighter_equipment_1_desc:0	"Die Macchi M.41bis war ein Flugboot-Jäger, der eine geringe Bombenlast tragen konnte."
ap1_multirole_equipment_1_short:0	"A.P.1 Multirole"
ap1_engine_upgrade:0	"Motor"
ap1_engine_upgrade_desc:0	"Rüsten Sie den Motor auf den Alfa Romeo 126 R.C.34 auf."
ap1_bomb_upgrade:0	"Bomben"
ap1_floats_upgrade:0	"Schwimmer"
ba64_multirole_equipment_1:0	"Breda Ba.64"
ba64_multirole_equipment_1_desc:0	"Die Breda Ba.64 war ein Versuch, einen Mehrzweckjäger zu entwickeln. Sie war untermotorisiert und von Unfällen geplagt. Die erhalten gebliebenen Flugzeuge wurden später zu Schulflugzeugen umgebaut."
ba65_multirole_equipment:0	"Mehrzweck"
ba65_multirole_equipment_desc:0	"Mehrzweckjäger sind in der Lage, sowohl feindliche Flugzeuge als auch feindliche Bodenziele anzugreifen."
ba65_multirole_equipment_1_short:0	"Ba.65 Mehrzweck"
ba65_engine_upgrade:0	"Triebwerk"
ba65_bomb_upgrade:0	"Bomben"
ba65_bomb_upgrade_desc:0	"Erhöht die Bombenlast der Ba.65 auf maximal 500 kg. "
tech_g50_fighter_equipment_1:0	"Fiat G.50-Jäger"
g50_fighter_equipment_1:0	"Fiat G.50 "Freccia""
g50_multirole_equipment_desc:0	" MR-Jäger sind Flugzeuge, die für verschiedene Aufgaben konzipiert sind. Dazu gehören Luftnahunterstützung, Bombardierung und Abfangjagd. Aufgrund dieser unterschiedlichen Rollen ist ihre Leistung bei diesen Aufgaben geringer als bei einem Flugzeug, das speziell für diese spezifischen Aufgaben entwickelt wurde."
g50_multirole_equipment_1_short:0	"G.50 bis Multirole"
g50_multirole_equipment_1_desc:0	"Die Fiat G.50 "Freccia" war ein italienisches Mehrzweckkampfflugzeug des Zweiten Weltkriegs. Es kann in Bezug auf Verteidigung, Reichweite, Triebwerk und Bewaffnung aufgerüstet werden. "
tech_g50_multirole_equipment_1:0	"Fiat G.50 Multirole"
g50_cockpit_upgrade:0	"Cockpit"
g50_armor_upgrade:0	"Panzerung"
g50_engine_upgrade:0	"Triebwerk"
g50_engine_upgrade_desc:0	"Rüsten Sie das Triebwerk auf den Fiat A.76 R.C.40 auf, um die Flugleistung zu steigern. Leider ist das Triebwerk etwas störanfällig."
g50_guns_upgrade:0	"Kanonen"
g50_bombs_upgrade:0	"Bomben"
ca335_multirole_equipment_1:0	"Caproni Ca.335 "Maestrale""
ca335_multirole_equipment_1_desc:0	" Die Caproni Ca.335 war ein Jagdbomber, der auf Wunsch Belgiens entwickelt wurde. Obwohl das Flugzeug in Italien entworfen und gebaut wurde, sollten der Motor und die Bewaffnung von Belgien bereitgestellt werden, wohin das Flugzeug 1939 geliefert und erfolgreich getestet wurde. Die Produktion wurde von SABCA vor dem deutschen Einmarsch in Belgien nie aufgenommen, und der Prototyp kehrte nie nach Italien zurück. Die italienischen Behörden zeigten wenig Begeisterung für die Aussicht, das Flugzeug für den Einbau italienischer Motoren umbauen zu müssen, und abgesehen von einem weiteren Prototyp einer Sturzbomber-Variante fand die Geschichte der Ca.335 ihr Ende. Sie kann ihre Geschwindigkeit und Reichweite verbessern."
ca335_bombs_upgrade:0	"Geschwindigkeit"
ca335_bombs_upgrade_desc:0	" Durch das Entfernen der externen Bombenlast des Flugzeugs können wir dessen Flugleistung steigern."
ca335_fuel_upgrade_desc:0	"Durch das Ersetzen der internen Bombenlast durch zusätzlichen Treibstoff können wir die Reichweite unseres Flugzeugs erhöhen."
re2000_engine_upgrade_desc:0	"Ein leistungsstärkerer Motor wird die Flugleistung unseres Flugzeugs steigern."
re2000_range_upgrade_desc:0	"Erhöhte Reichweite."
re2000_multirole_equipment:0	"Mehrzweck"
re2000_multirole_equipment_desc:0	"Mehrzweckjäger sind in der Lage, sowohl Angriffe auf feindliche Flugzeuge als auch auf feindliche Bodenziele durchzuführen."
re2000_multirole_equipment_1_short:0	"Re.2000 Multirole"
g50v_fighter_equipment:0	"Jäger"
g50v_fighter_equipment_1:0	"Fiat G.51"
g50v_fighter_equipment_1_short:0	"G.51-Jäger"
g50v_fighter_equipment_1_desc:0	"Die Fiat G.51 war eine Weiterentwicklung des Fiat G.50-Jägers, die sich durch einen leistungsstärkeren Motor und ein neues Flügeldesign auszeichnete. Da sie nie über das Prototypenstadium hinauskam, verfügt sie über keine Upgrades."
tech_g50v_fighter_equipment_1_desc:0	" Die Fiat G.51 war eine Weiterentwicklung des Jagdflugzeugs Fiat G.50, die sich durch einen stärkeren Motor und ein neues Flügeldesign auszeichnete. Da sie nie über das Prototypenstadium hinauskam, gibt es keine Upgrades."
g50v_multirole_equipment_1_short:0	"G. 50V MR-Jäger"
tech_g50v_multirole_equipment_1:0	"Fiat G.50V"
tech_g50v_multirole_equipment_1_desc:0	"Die Fiat G.50V war eine Weiterentwicklung des Fiat G.50-Jägers, die sich durch einen stärkeren Motor und ein neues Flügeldesign auszeichnete. Da sie nie über das Prototypenstadium hinauskam, verfügt sie über keine Upgrades."
re2001_multirole_equipment:0	 "Multirole"
re2001_multirole_equipment_1:0	"Reggiane Re.2001 "Falco II""
tech_re2001_multirole_equipment_1_desc:0	"Die Reggiane Re.2001 ist eine Weiterentwicklung der Re.2000 mit dem leistungsstärkeren Alfa Romeo R.A.1000 R.C.41 Monsoon, einem in Lizenz gebauten Daimler-Benz DB 601. Der Einbau dieses Triebwerks erforderte eine Neukonstruktion des vorderen Rumpfes. Als leistungsstarker Jagdbomber wurden Derivate des Flugzeugs für den Einsatz als Trägerjäger, Bomber und Torpedobomber produziert. Es kann seine Bombenlast, seine Kanonen und seine Geschwindigkeit verbessern."
re2001_bomb_upgrade_desc:0	"Rüsten Sie das Flugzeug so auf, dass es bis zu 630 kg Bomben tragen kann."
re2001_cannon_upgrade:0	"Kanonen"
re2001_cannon_upgrade_desc:0	"Ersetzen Sie die beiden 7,7-mm-Maschinengewehre in den Tragflächen durch 20-mm-MG-151/20-Kanonen. "
re2001_speed_upgrade_desc:0	"Durch den Ausbau der beiden 7,7-mm-Breda-SAFAT-Maschinengewehre in den Tragflächen können wir das Flugzeug leichter machen und die Flugleistung steigern."
re2002_multirole_equipment_1_short:0	"Re.2002 Light CAS"
tech_re2002_multirole_equipment_1:0	"Re.2002"
tech_re2002_multirole_equipment_1_desc:0	"Die Reggiane Re.2002 war ein Flugzeug, das Teile sowohl der Re.2000 als auch der Re.2001 zu einem Angriffsflugzeug kombinierte. Seine Reichweite kann verbessert werden."
re2004_multirole_equipment:0	"Lt Close Air Support"
re2004_multirole_equipment_1:0	"Reggiane Re.2004"
tech_re2004_multirole_equipment_1_desc:0	" Die Reggiane Re.2004 war ein Angriffsflugzeug, das auf der Re.2005 basierte."
re2002_range_upgrade_desc:0	"Erhöht die Reichweite unserer Flugzeuge."
ca355_cas_equipment:0	"Lt Close Air Support"
ca355_cas_equipment_desc:0	"Einmotorige Flugzeuge für die Luftnahunterstützung, die für den Angriff auf feindliche Bodenziele ausgelegt sind."
ca355_cas_equipment_1_short:0	"Ca.355 Light CAS"
old_flying_boat_equipment:0	"Lt Naval Bombers"
m18ar_flying_boat_equipment_1:0	"Macchi M.18 AR"
m18ar_flying_boat_equipment_1_short:0	"M.18 AR Marinebomber"
m18ar_flying_boat_equipment_1_desc:0	"Die Macchi M.18 war ein 1920 für den Einsatz in Italien entwickeltes Flugboot. Die AR-Version verfügte über einklappbare Tragflächen zur Lagerung. Mitte der 1930er Jahre war sie nur noch in Spanien und Paraguay im Einsatz."
m71_fighter_equipment_1_short:0	"M.71 Multirole"
g50_cv_fighter_equipment_1_desc:0	"Eine Weiterentwicklung des Jagdflugzeugs Fiat G.50 bis, das für den Einsatz von Flugzeugträgern vorgesehen war."
tech_g50_cv_fighter_equipment_1_desc:0	"Eine Weiterentwicklung des Jagdflugzeugs Fiat G.50 bis, das für den Einsatz von Flugzeugträgern vorgesehen war."
re2000_cv_fighter_equipment_1:0	"Reggiane Re.2000 Catapultabile"
re2000_cv_fighter_equipment_1_short:0	"Re.2000 Carrier Fighter"
tech_re2000_cv_fighter_equipment_1:0	"Re.2000 Catapultabile"
re2001_cv_fighter_equipment_1_desc:0	"Die Reggiane Re.2001 O.R. war eine Weiterentwicklung der Re.2001, die für den Einsatz vom italienischen Flugzeugträger Aquila vorgesehen war. Zusätzlich zur Ausrüstung für den Schiffsbetrieb wurden die beiden 7,7-mm-Breda-SAFAT-Maschinengewehre aus den Tragflächen entfernt. Historische Leistungsdaten für dieses Flugzeug liegen nicht vor. "
tech_re2001_cv_fighter_equipment_1_desc:0	"Die Reggiane Re.2001 O.R. war eine Weiterentwicklung der Re.2001, die für den Einsatz vom italienischen Flugzeugträger Aquila vorgesehen war. Zusätzlich zur Ausrüstung für den Schiffeinsatz wurden die beiden 7,7-mm-Breda-SAFAT-Maschinengewehre aus den Tragflächen entfernt."
re2001_cv_CAS_equipment_1:0	"Reggiane Re.2001 GV"
re2001_cv_CAS_equipment_1_short:0	"Re.2001 GV Carrier CAS"
tech_re2001_cv_CAS_equipment_1:0	"Re.2001 GV"
re2001_cv_nav_bomber_equipment_1_desc:0	" Die Reggiane Re.2001G war eine Weiterentwicklung der Re.2001, die als Torpedobomber an Bord des italienischen Flugzeugträgers Aquila eingesetzt werden sollte. Historische Flugleistungsdaten für dieses Flugzeug liegen nicht vor."
tech_re2001_cv_nav_bomber_equipment_1_desc:0	"Die Reggiane Re.2001G war eine Weiterentwicklung der Re.2001, die als Torpedobomber an Bord des italienischen Flugzeugträgers Aquila eingesetzt werden sollte."
g55_fighter_equipment:0	"Jäger"
