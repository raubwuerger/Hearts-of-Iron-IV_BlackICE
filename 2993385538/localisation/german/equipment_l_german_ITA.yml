tech_ca309_light_bomber_equipment_1:0	"Ca.309 "Ghibli""
tech_ca309_light_bomber_equipment_1_desc:0	"Die Caproni Ca.309 Ghibli war ein italienischer Aufklärungsbomber des Zweiten Weltkriegs. Die Ghibli wurde ursprünglich als ziviles Transportflugzeug entwickelt, war sehr beliebt und wurde intensiv eingesetzt. Ihr vorderes, schwenkbares Lewis-Maschinengewehr kann auf ein 12,7-mm-Breda-SAFAT-Maschinengewehr und auf eine 20-mm-Breda-Kanone Modell 35 aufgerüstet werden."
ca309_mg_upgrade_desc:0	"Rüsten Sie die 7,7-mm-Lewis-Maschinengewehrposition in der Nase auf ein 12,7-mm-Breda-SAFAT-Maschinengewehr auf."
ca309_cannon_upgrade:0	"Kanone"
ca310_light_bomber_equipment_desc:0	"Mehrmotorige Flugzeuge zur Luftnahunterstützung, die für den Angriff auf feindliche Bodenziele konzipiert sind."
ca310_light_bomber_equipment_1_desc:0	"Die Ca.310 Libeccio wurde aus dem leichten Bomber Ca.309 entwickelt. Obwohl sie oft nicht als ebenso erfolgreich angesehen wird wie ihr Vorläufer oder sogar ihre eigenen Derivate, erhielt das Flugzeug bedeutende Exportaufträge. Aufgrund widersprüchlicher Daten gibt es derzeit keine Upgrades für dieses Flugzeug."
