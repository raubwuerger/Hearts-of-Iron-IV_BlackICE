 ITA_mountain_artillery_equipment_0_desc:0 "Unter Gebirgsartillerie versteht man leichtkalibrige Waffen wie Kanonen und Haubitzen, die von Besatzungen bedient werden und Munition weit über die effektive Reichweite von Personenwaffen hinaus verschießen können. Sie sind für den Einsatz in Hügeln und Bergen spezialisiert."
