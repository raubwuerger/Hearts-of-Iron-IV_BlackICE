tech_italiannavy_sub:0	"U-Boot-Flotte der Regia Marina"
tech_rm_coastal_submarine_1_desc:0	"Die Argo- und Sirena-Klasse waren kleine Küsten-U-Boote, die für die Regia Marina gebaut wurden. Insgesamt wurden 12 Boote der Sirena-Klasse und 2 der Argo-Klasse gebaut, ursprünglich für Portugal. Die Hauptbewaffnung der Klasse bestand aus sechs 533-mm-Torpedorohre."
tech_rm_patrol_submarine_1_desc:0	"Die Klassen Fratelli Bandiera und Squalo waren mittelgroße U-Boot-Konstruktionen, die sich durch eine geringe Reichweite in Verbindung mit einer schweren Torpedobewaffnung aus acht 533-mm-Torpedorohre und 12 Nachschüssen auszeichneten. Sie hatten eine Verdrängung von knapp über 1000 Langtonnen; insgesamt wurden vier Boote jeder Klasse gebaut."
tech_rm_patrol_submarine_2:0	" Archimede-/Glauco-Klasse"
tech_rm_patrol_submarine_2_desc:0	"Die Archimede- und Glauco-Klasse waren große Langstrecken-U-Boot-Konstruktionen der Regia Marina, die sich durch eine gute Höchstgeschwindigkeit in Verbindung mit einer schweren Torpedobewaffnung aus acht 533-mm-Rohren auszeichneten. Sie waren für Langstreckeneinsätze und die Konvoijagd konzipiert."
rm_coastal_submarine_1_desc:0	"Das Projekt wurde vom Werftbauer unter Nutzung der Erfahrungen aus dem früheren deutschen U-Boot-Dienst entwickelt, die Italien nach dem Ersten Weltkrieg erhalten hatte. Teilweise doppelwandig. Insgesamt erfolgreiche Boote, die zum Vorbild für nachfolgende U-Boote der italienischen Flotte wurden. Unzureichende Stabilität war der einzige nennenswerte Mangel dieser Klasse. Um dies zu beheben, erhielten alle vier Schiffe kurz nach der Fertigstellung externe Ausbuchtungen. "
rm_coastal_submarine_1c_desc:0	"Dies ist Text"
rm_coastal_submarine_2_desc:0	"Die italienische U-Boote der Argonauta-Klasse waren eine Serie von 600-Tonnen-U-Booten, die für die Regia Marina gebaut und von ihr betrieben wurden. Sie kamen im Zweiten Weltkrieg zum Einsatz. Insgesamt wurden 7 Schiffe dieser Klasse gebaut."
rm_coastal_submarine_3:0	"Argo-Klasse"
rm_coastal_submarine_3_desc:0	"Dies ist Text"
rm_coastal_submarine_4_desc:0	"Dies ist Text"
rm_coastal_submarine_6_desc:0	" Die U-Boote der Adua-Klasse waren die vierte Unterklasse der 600er-Serie von Küsten-U-Booten, die für die Königliche Italienische Marine gebaut wurden. Es gab 17 U-Boote dieser Klasse, die fast alle nach Orten in Äthiopien benannt waren, das seit 1936 eine italienische Kolonie war. Die U-Boote der Adua-Klasse waren im Wesentlichen eine Wiederholung des Designs der vorangegangenen Perla-Klasse. Die Boote waren mit sechs internen 53,3-cm- (21,0 Zoll) Torpedorohren, vier im Bug und zwei im Heck. Für jedes Rohr wurde ein Ersatztorpedo mitgeführt, insgesamt also zwölf."
rm_coastal_submarine_7_desc:0	"Das italienische U-Boot der Acciaio-Klasse (manchmal auch als Platino-Klasse bezeichnet) war die fünfte Unterklasse der 600er-Serie von Küsten-U-Booten, die von der Regia Marina gebaut wurden. Sie wurden in den frühen 1940er Jahren fertiggestellt und kamen im Zweiten Weltkrieg zum Einsatz. Die italienischen U-Boote der Acciaio-Klasse (manchmal auch als Platino-Klasse bezeichnet) waren die fünfte Unterklasse der von der Regia Marina gebauten Küsten-U-Boote der 600er-Serie. Sie wurden in den frühen 1940er Jahren fertiggestellt und kamen im Zweiten Weltkrieg zum Einsatz. "
rm_coastal_submarine_8:0	"Flutto-Klasse"
rm_coastal_submarine_8_desc:0	"Die Flutto-Klasse war eine große Klasse von U-Booten, die für die italienische Königliche Marine gebaut wurden. Die Flutto-U-Boote waren eine Weiterentwicklung der 600er-Serie mittelgroßer, bzw. seetüchtiger, U-Booten. Sie wurden nach einem teilweise doppelhülligen Bernardis-Entwurf gebaut, der von den Erfahrungen aus dem Krieg geprägt war und für die Serienfertigung angepasst wurde. Die Flutto-Klasse waren seetüchtige Boote mit verbesserter Innenausstattung, Rumpfstärke, Flugabwehrbewaffnung und Tauchzeiten. Sie gelten als die besten U-Boote mittlerer Verdrängung, die Italien bis zu diesem Zeitpunkt gebaut hatte. Insgesamt wurden 48 U-Boote in Auftrag gegeben."
rm_coastal_submarine_9_desc:0	"Verbesserte Version der ursprünglichen Flutto-Klasse, die viele der Erfahrungen aus dem Krieg einbezog und deren Bau 1943 beginnen sollte. Aufgrund der damaligen Kriegsentwicklung Italiens wurde kein einziges U-Boot fertiggestellt."
rm_patrol_submarine_2_desc:0	"Dies ist Text"
rm_patrol_submarine_3_desc:0	"Dies ist Text"
rm_patrol_submarine_4:0	"Archimede-Klasse"
rm_patrol_submarine_4_desc:0	"Dies ist Text"
rm_patrol_submarine_5_desc:0	"Dies ist Text" "
rm_patrol_submarine_7_desc:0	"Die Marcello-Klasse war eine Klasse von neun U-Booten, die 1937 und 1938 von CRDA in Triest für die Königliche Italienische Marine gebaut wurden. Die besten italienischen Groß-U-Boote der Zeit des Zweiten Weltkriegs: schnell und mit guter Manövrierfähigkeit unter Wasser. Sie waren mit acht 533-mm-Torpedorohre mit 16 Nachladungen ausgerüstet."
rm_patrol_submarine_8_desc:0	"Die Marconi-Klasse war eine Klasse von sechs U-Booten, die für die Regia Marina gebaut wurden. Die U-Boote wurden alle zwischen 1939 und 1940 vom Stapel gelassen, und bis auf eines, die Luigi Torelli, gingen alle während des Zweiten Weltkriegs im Atlantik verloren. Sie verfügten über eine größere Reichweite, trugen jedoch im Vergleich zur vorangegangenen Marcello-Klasse etwas weniger Torpedos."
rm_lr_patrol_submarine_1:0	"Balilla-Klasse"
rm_lr_patrol_submarine_1_desc:0	"Die Balilla-Klasse war die erste U-Boot-Klasse, die nach dem Ende des Ersten Weltkriegs für die italienische Marine gebaut wurde. Es handelte sich um große, hochseetüchtige Kreuzer-U-Boote, die für den Einsatz im Indischen Ozean mit Stützpunkt in den italienischen Kolonien in Ostafrika konzipiert waren. Die Boote hatten eine Verdrängung von 1. 427 Tonnen über Wasser und 1874 Tonnen unter Wasser. Die Boote galten zu Beginn des Zweiten Weltkriegs als instabil und veraltet."
rm_lr_patrol_submarine_2_desc:0	"Die Ettore Fieramosca war ein italienisches U-Boot, das im Zweiten Weltkrieg bei der Regia Marina im Einsatz stand. Sie wurde nach Ettore Fieramosca benannt, einem italienischen Condottiero des 16. Jahrhunderts. Die Ettore Fieramosca wurde von der Firma Bernardis entworfen und sollte ein Kreuzer-U-Boot sein, das ein Wasserflugzeug in einem wasserdichten Hangar sowie eine 203 mm (8 Zoll) Kanone; ein solches Design war von der ähnlichen (wenn auch größeren) Surcouf inspiriert, die damals in Frankreich im Bau war. Es wurden mehrere Prototypen von Wasserflugzeugen entworfen, jedoch nie eingesetzt, und der Hangar wurde 1931 entfernt. Die Deckkanone war ursprünglich ein 120-mm- (5-Zoll-) OTO-Modell von 1924 mit 27 Kalibern, wurde jedoch später durch ein 120-mm- OTO-Modell von 1931 mit 45 Kalibern ersetzt."
rm_lr_patrol_submarine_4_desc:0	"Die Klassen Pietro Micca und Calvi waren U-Boot-Konstruktionen der Regia Marina in der Zwischenkriegszeit und vor dem Zweiten Weltkrieg. Sie zeichneten sich durch eine sehr große Reichweite aus und verdrängten fast 2000 Langtonnen, was sie ideal für Einsätze über große Entfernungen machte. Die Klassen waren mit sechs Torpedorohren für 533-mm-Torpedos, zwei 100-mm-Schiffsdeckgeschützen sowie verschiedenen Flugabwehrgeschützen ausgerüstet."
rm_lr_patrol_submarine_5_desc:0	"Die Klassen Pietro Micca und Calvi waren U-Boot-Konstruktionen der Regia Marina in der Zwischenkriegszeit und vor dem Zweiten Weltkrieg. Sie zeichneten sich durch eine sehr große Reichweite aus und hatten eine Verdrängung von fast 2000 Langton, ideal für Einsätze über große Entfernungen. Die Klassen waren mit sechs Torpedorohre für 533-mm-Torpedos sowie zwei 100-mm-Schiffsdeckgeschützen und verschiedenen Flugabwehrgeschützen ausgerüstet."
rm_lr_patrol_submarine_6:0	"Foca-Klasse"
rm_lr_patrol_submarine_6_desc:0	"Die U-Boote der Foca-Klasse waren verbesserte Versionen der vorangegangenen Micca-Klasse. Die Boote waren mit sechs internen 53,3-cm-Torpedorohre (21,0 Zoll) bewaffnet, vier im Bug und zwei im Heck. Sie trugen keine Torpedos mit sich und konnten diese auch nicht nachladen. Sie waren zudem mit einer 100-mm-Deckkanone (4 Zoll) für den Kampf an der Oberfläche ausgerüstet. Die leichte Flugabwehrbewaffnung bestand aus zwei Paaren von 13,2-mm-Maschinengewehren (0, 52 Zoll) Maschinengewehre."
rm_lr_patrol_submarine_7_desc:0	"Die Liuzzi-Klasse war eine Klasse von vier U-Booten, die von Tosi in Taranto für die Königliche Italienische Marine gebaut wurden. Die Hauptbewaffnung besteht aus acht 533-mm-Torpedorohre sowie 2x 100-mm-Deckgeschützen und zusätzlich 4x 13,2-mm-Flugabwehrgeschützen.Die sehr große Reichweite der Liuzzi-Klasse machte sie perfekt für die Handelsblockade und die Jagd auf Konvois."
ITA_coastal_submarine_1:0	"Holland-602-Klasse"
ITA_coastal_submarine_2:0	"Argonauta-Klasse"
ITA_coastal_submarine_2_desc:0	"Die italienischen U-Boote der Argonauta-Klasse waren eine Serie von 600-Tonnen-U-Booten, die für die Regia Marina gebaut und von ihr betrieben wurden. Sie kamen im Zweiten Weltkrieg zum Einsatz. Insgesamt wurden 7 Boote dieser Klasse gebaut. "
ITA_coastal_submarine_3:0	"Perla-Klasse"
ITA_coastal_submarine_4_desc:0	"Die U-Boote der Adua-Klasse waren die vierte Unterklasse der 600er-Serie von Küsten-U-Booten, die für die Königliche Italienische Marine gebaut wurden. Es gab 17 U-Boote dieser Klasse, die fast alle nach Orten in Äthiopien benannt waren, das seit 1936 eine italienische Kolonie war. Die U-Boote der Adua-Klasse waren im Wesentlichen eine Wiederholung des vorhergehenden Entwurfs der Perla-Klasse. Die Boote waren mit sechs internen 53,3-cm- (21,0 Zoll) Torpedorohre, vier im Bug und zwei im Heck. Für jedes Rohr wurde ein Ersatztorpedo mitgeführt, insgesamt also zwölf."
ITA_coastal_submarine_5:0	"Acciaio-Klasse"
ITA_lr_patrol_submarine_1:0	"Balilla-Klasse "
ITA_lr_patrol_submarine_1_desc:0	"Die Balilla-Klasse war die erste U-Boot-Klasse, die nach dem Ende des Ersten Weltkriegs für die italienische Marine gebaut wurde. Es handelte sich um große, hochseetüchtige Kreuzer-U-Boote, die für den Einsatz im Indischen Ozean mit Stützpunkten in den italienischen Kolonien in Ostafrika konzipiert waren. Die Boote hatten eine Verdrängung von 1.427 Tonnen über Wasser und 1.874 Tonnen unter Wasser. Die Boote galten als instabil und waren zu Beginn des Zweiten Weltkriegs als veraltet."
ITA_submarine_1:0	"Mameli-Klasse"
ITA_submarine_1_desc:0	"Die Geoffredo-Mameli-Klasse ist eine Klasse mittlerer U-Boote der Regia Marina, die zwischen 1926 und 1928 vom Stapel liefen. Sie hatten eine Verdrängung von knapp 800 Tonnen und eine Tauchtiefe von 100 m. Sie bildeten die Grundlage für nachfolgende Modelle wie die Klassen Pisani, Bandiera und Squalo."
ITA_submarine_2:0	"Glauco-Klasse"
ITA_submarine_3_desc:0	"Die Marconi-Klasse war eine Klasse von sechs U-Booten, die zwischen 1939 und 1940 gebaut wurden und die früheren Luizzi-U-Boote ablösten. Die U-Boote beider Klassen hatten eine Verdrängung von etwa 1.000 Tonnen und verfügten über acht 533-mm-Torpedorohre. Nur ein einziges Schiff aus beiden Klassen überlebte den Krieg."
ITA_submarine_4:0	"Pietro-Calvi-Klasse"
ITA_submarine_4_desc:0	"Die Pietro-Calvi-Unterklasse wies gegenüber der vorangegangenen Flutto-Klasse, einer Klasse mittelgroßer U-Boote, nur geringfügige Verbesserungen auf. Es wurden nur wenige Schiffe vom Stapel gelassen, da die meisten Rümpfe nach dem italienischen Waffenstillstand von den Deutschen erbeutet wurden. Eine überarbeitete Version der Pietro Calvi wurde schließlich 1961 in Dienst gestellt."
ITA_torpedo_boat_1:0	"Torpedoboot der Spica-Klasse"
ITA_patrol_boat_1:0	"Giuseppe-Sirtori-Klasse"
ITA_destroyer_1b:	"Zerstörer der Palestro-Klasse"
ITA_destroyer_1c_desc:0	"Die Zerstörer der Curtatone-Klasse waren die ersten Zerstörer, die nach dem Ende des Ersten Weltkriegs in Italien gebaut wurden, und sie waren die ersten Zerstörer, die Doppelgeschützstellungen einsetzten. Die Schiffe wurden ursprünglich zeitgleich mit den Zerstörern der Palestro-Klasse in Auftrag gegeben, doch der Bau wurde aufgrund von Stahlknappheit verschoben. Sie verzeichneten eine Verdrängung von knapp 1.000 Tonnen und waren mit vier 102-mm-Kanonen von Schneider-Armstrong ausgerüstet."
ITA_destroyer_1d:	"Zerstörer der Leone-Klasse"
ITA_destroyer_1e:	"Zerstörer der Sella-Klasse"
ITA_destroyer_1g:	"Turbine-Klasse DD"
ITA_destroyer_1j_desc:0	"Die Folgore-Klasse war eine Gruppe von vier Zerstörern, die in den 1930er Jahren für die italienische Marine gebaut wurden. Sie waren eine modifizierte Version der Zerstörer der Freccia-Klasse, wiesen jedoch eine verringerte Breite auf, um die Geschwindigkeit zu erhöhen, was zu Stabilitätsproblemen und einer geringeren Reichweite führte. Ihre Hauptbewaffnung bestand aus zwei doppelten 120-mm-Geschütztürmen, zwei 40-mm-Kanonen, vier 13,2-mm-Maschinengewehren und sechs 533-mm-Torpedorohre."
ITA_destroyer_1k_desc:0	"Die vier Zerstörer der Maestrale-Klasse waren eine vergrößerte Version der Zerstörer der Folgore-Klasse. Sie waren 10 Meter (33 ft) länger. Sie bildeten die Grundlage für nachfolgende italienische Zerstörerentwürfe: die Oriani- und Soldati-Klassen."
ITA_destroyer_1l:	" Zerstörer der Oriani-Klasse"
ITA_destroyer_1l_desc:0	"Die vier Zerstörer der Oriani-Klasse waren eine Wiederholung der Maestrale-Klasse, verfügten jedoch über eine höhere Maschinenleistung und eine andere Flugabwehrbewaffnung, die die zuvor installierte veraltete Bewaffnung ersetzte. Leider fiel die Leistungssteigerung nicht so hoch aus wie erwartet."
ITA_destroyer_2_desc:0	" Die Soldati-Klasse war eine Gruppe von Zerstörern, die Ende der 1930er Jahre gebaut wurden. Es gab zwei Bauchargen. Zwölf Schiffe bildeten die erste Charge in den Jahren 1938–39. Fünf Schiffe wurden in der zweiten Charge im Jahr 1941 -42 fertiggestellt. Die Schiffe der ersten Serie hatten eine Verdrängung von etwas über 1.800 Tonnen und waren mit vier 120-mm-Ansaldo-Kanonen bewaffnet."
ITA_destroyer_4_desc:0	"Die Comandanti-Medaglie-d’Oro-Klasse war eine Gruppe von Zerstörern, die für die Regia Marina geplant waren, jedoch bis zum italienischen Waffenstillstand nie vom Stapel liefen. Die Schiffe waren deutlich größer als frühere italienische Zerstörer mit einer Verdrängung von fast 2.100 Tonnen. Sie waren zudem mit den größeren 135-mm-Ansaldo-Kanonen bewaffnet und verfügten über verbesserte Maschinen. "
ITA_light_cruiser_1_desc:0	"Die Kreuzer Taranto und Bari waren Kreuzer aus der Zeit des Ersten Weltkriegs, die als Reparationsleistungen von Deutschland erhalten wurden. Beide hatten eine Verdrängung zwischen 4.500 und 5.100 Tonnen und waren mit deutschen 150-mm-SK/45-Kanonen bewaffnet."
ITA_light_cruiser_1b:	"Pillau-Klasse CL"
ITA_light_cruiser_1c:	"Giussano-Klasse CL"
ITA_light_cruiser_1e:	"Montecuccoli-Klasse CL"
ITA_light_cruiser_3_desc:0	 "Die Duca-degli-Abruzzi-Klasse war die fünfte Unterklasse der leichten Kreuzer der Condottieri-Klasse. Sie wurden vor dem Zweiten Weltkrieg gebaut, um die Vorherrschaft im Mittelmeer zu erlangen. Mit einer Verdrängung von über 9.400 Tonnen waren sie die größten italienischen leichten Kreuzer, die während des Krieges in Dienst gestellt wurden. Sie waren gut gepanzert und mit zehn 152-mm-Ansaldo-Kanonen ausgerüstet."
ITA_light_cruiser_4_desc:0	"Dies war ein Entwurf, der nie rechtzeitig gebaut wurde. Das Projekt UP90 sollte der Regina Marina einen schweren leichten Kreuzer mit überlegener Feuerkraft, Flugabwehrbewaffnung und Panzerschutz liefern. "
ITA_destroyer_leader_1:0	"Projekt OTO DL"
ITA_destroyer_leader_1_desc:0	" Die Comandanti-Medaglie-d’Oro-Klasse war eine Gruppe von Zerstörern, die während des Zweiten Weltkriegs für die italienische Marine geplant war. Zwanzig Schiffe wurden in Auftrag gegeben, doch bis zum italienischen Waffenstillstand wurde keines davon vom Stapel gelassen. Die Schiffe sollten deutlich größer sein als die früheren italienischen Zerstörer, wie beispielsweise die Soldati-Klasse. Die Bewaffnung wurde auf vier einzelne 135-mm-Kanonen in Doppelfunktionslafetten erhöht. Zwölf 37-mm-Kanonen (1,5 Zoll)/54 bildeten die leichte Flugabwehrbewaffnung, und zwei Feuerleitgeräte sollten mit Radarausrüstung ausgestattet werden."
ITA_destroyer_leader_2_desc:0	"Die leichten Kreuzer der Capitani-Romani-Klasse waren im Wesentlichen darauf ausgelegt, die großen neuen französischen Zerstörer der späten 1930er Jahre an Geschwindigkeit und Feuerkraft zu übertreffen. Ende 1939 wurden zwölf Rümpfe bestellt, doch nur drei wurden vor dem italienischen Waffenstillstand 1943 fertiggestellt. Sie waren leicht gepanzert und verdrängten nur 3.700 Tonnen, waren jedoch recht schnell. Sie trugen acht 135-mm-OTO/Ansaldo-Geschütze."
ITA_heavy_cruiser_1:0	"Schwerer Kreuzer der Trento-Klasse"
ITA_heavy_cruiser_2:	"Schwerer Kreuzer der Zara-Klasse"
ITA_heavy_cruiser_2_desc:0	"Die Zara-Klasse war eine Gruppe von vier schweren Kreuzern, die für die italienische Regia Marina gebaut wurden; die Klasse umfasste die Schiffe Zara, Fiume, Gorizia und Pola. Sie trugen eine Hauptbatterie von acht 203-mm-Kanonen und erreichten eine Höchstgeschwindigkeit von 32 Knoten (59 km/h; 37 mph). Als einige der am besten gepanzerten schweren Kreuzer, die , konnte die schwere Panzerung nur durch einen Verstoß gegen die Bestimmungen des Washingtoner Flottenabkommens erreicht werden, das die Verdrängung von Kreuzern auf 10.000 Langtonnen (10.160 t) begrenzte."
ITA_heavy_cruiser_3:0	"Bolzano-Klasse CA"
ITA_heavy_cruiser_4:0	"Projekt UP102 CA "
ITA_battleship_1:0	"Schlachtschiffe der Conte-di-Cavour-Klasse"
ITA_battleship_2:0	"Schlachtschiffe der Caio-Duilio-Klasse"
ITA_battleship_2_desc:0	"Die Schlachtschiffe der Caio-Duilio-Klasse wurden ursprünglich zu Beginn des Ersten Weltkriegs in Dienst gestellt. Beide Schiffe zwischen 1937 und 1940 einer vollständigen Neukonstruktion unterzogen. Dieses Modell stellt die überarbeitete Version dar. Die Bewaffnung wurde auf zehn 320-mm-Geschütze vom Typ M1934 aufgerüstet, die Verdrängung beträgt nun 29.000 Tonnen, und die Geschwindigkeit reicht aus, um sie als "schnelle" Schlachtschiffe einzustufen. "
ITA_battleship_3:0	"Schlachtschiffe der Littorio-Klasse"
ITA_battleship_3b:0	"Schlachtschiffe der Roma-Klasse"
ITA_carrier_1:0	"Flugzeugträger der Aquila-Klasse"
ITA_light_carrier_1:0	"Leichte Flugzeugträger der Sparviero-Klasse"
ITA_light_carrier_1_desc:0	 "Die Sparviero war ebenfalls eine geplante Umrüstung eines Ozeandampfers, der Augustus. Die Umrüstung begann Ende 1942, kam jedoch nicht weit. Deutschland versenkte das Schiff nach dessen Eroberung im Anschluss an den italienischen Waffenstillstand. Der Flugzeugträger hätte eine Verdrängung von 30.400 Tonnen gehabt, wäre recht gut gepanzert gewesen und hätte über eine starke Flugabwehrbatterie verfügt."
