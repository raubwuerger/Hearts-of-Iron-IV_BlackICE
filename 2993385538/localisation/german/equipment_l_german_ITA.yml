tech_heavyengine2:0	"Experimenteller Flugzeugmotor"
tech_heavyengine2_desc:0	"Leistungsstärkere Flugzeugmotoren, wie beispielsweise der DB 603, müssen entweder entwickelt oder lizenziert werden, um die Grenzen der Flugzeugleistung zu erweitern. Wir müssen entweder Konstruktionspläne dafür von unseren Verbündeten erwerben oder die Entwicklung des Fiat A.38 fortsetzen."
