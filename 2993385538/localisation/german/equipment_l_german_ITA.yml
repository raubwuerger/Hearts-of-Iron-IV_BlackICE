tech_sm79_guided_equipment_1_desc:0	"Ein abgespeckter S.M.79-Bomber, der für die Fernsteuerung umgerüstet und mit Sprengstoff beladen wurde. Er ist für den Einsatz bei unbemannten Kamikaze-Angriffen auf Schiffe konzipiert. Er kann aus dem S.M.79-Bomber umgebaut werden."
