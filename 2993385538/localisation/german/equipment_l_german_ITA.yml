 ITA_infantry_equipment_0:0 "Carcano Modello 1891"
 ITA_infantry_equipment_1:0 "Carcano Modello 91/38"
 ITA_infantry_equipment_0_desc:0 "The Carcano Modello 1891 was the standard and iconic rifle used by the Royal Italian Army in all the conflicts that saw the R.E. from the ones for the colonies to the Second World War"##### NOT TRANSLATED #####
 ITA_infantry_equipment_2_short:0 "Karabiner 91/41"
 ITA_infantry_equipment_1_desc:0 "The 6,5 mm munitions of the Carcano appeared to be now outdated with the new times, and that was a lesson learned during the war against Ethiopia. So, in 1938 the army presented the new 7,35 x 51 mm rounds, with refurbished rifles with worn barrels."##### NOT TRANSLATED #####
 ITA_infantry_equipment_3_short:0 "Armaguerra M39"
 ITA_infantry_equipment_2_desc:0 "Doubts emerged that in a possible upcoming war the two different standards would have created confusions in the logistic, so the production of the Mod. 38 was stopped with only 285k Mod. 38 produced, soon retired and sold. The model was rescaled on the 6.5 mm caliber."##### NOT TRANSLATED #####

 ITA_infantry_equipment_3_desc:0 "The Mod. 91/41 was the latest big development of the series, created to equip the divisions of the Armir sent to fight to the east. Calibrated in 6.5 mm, this rifle abandoned the changes introduced with the Mod. 38 and looks very similar to the first Mod. 91."##### NOT TRANSLATED #####
