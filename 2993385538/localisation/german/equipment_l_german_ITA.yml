sm95b_heavy_bomber_equipment_1:0	"Savoia-Marchetti S.M.95B"
sm95b_heavy_bomber_equipment_1_desc:0	"Als Weiterentwicklung des zivilen Transportflugzeugs S.M.95 war die S.M.95B ein italienischer schwerer Bomber. Im Gegensatz zu den meisten italienischen Flugzeugprojekten, die durch den Waffenstillstand gestoppt wurden, durfte die S.M.95 nach dem Krieg weiterentwickelt werden. Mehrere Exemplare der Transportversion wurden gebaut und in der Nachkriegszeit etwa ein Jahrzehnt lang sowohl von Fluggesellschaften als auch von der italienischen Luftwaffe eingesetzt, während nur eine einzige S.M.95B fertiggestellt wurde."
