italian_med_td_equipment_2_desc:0 "Einheit Typ: Mittlerer Jagdpanzer \nKann umgerüstet werden von: M15/42 \n\nDie Semovente 75/34 ist ein verbessertes Design gegenüber der früheren 75/18, diesmal mehr auf einen Jagdpanzer ausgelegt. Er hat zwar weniger Möglichkeiten, Panzerstücke zu zerstören als der 90/53, aber die Besatzung ist viel besser geschützt und besser ausgerüstet, um auch weiche Ziele zu bekämpfen."
