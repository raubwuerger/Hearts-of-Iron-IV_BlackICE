 cr_41_fighter_equipment_1_desc:0 "Der Fiat CR.41 war ein Prototyp eines Doppeldecker-Jägers, der einen in Lizenz gebauten Mistral-Motor verwendete. Er verfügt über keine Verbesserung."
 tech_cr_41_fighter_equipment_1:0 "Fiat CR.41"
 cr_33_fighter_equipment_1:0 "Fiat CR.33"
 tech_cr_33_fighter_equipment_1_desc:0 "Die CR.33 war ein von Fiat entwickelter Prototyp eines Doppeldecker-Jagdflugzeugs. Er basiert auf der CR.32 und wurde für den Einsatz des Fiat A.33 RC 35-Motors modifiziert. Sie hat keine Verbesserungen."
 cr_42_fighter_equipment_desc:0 "Leichte Jagdflugzeuge sind billige Flugzeuge mit wenig Panzerung oder Bewaffnung. Sie sind oft die erste Wahl von Nationen, denen es an strategischen Materialien und Zeit fehlt, um robustere Flugzeuge zu bauen, sowie von Nationen, die keine ernsthafte Opposition erwarten."
