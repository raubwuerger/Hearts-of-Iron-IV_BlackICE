 ITA_SMG_equipment_1_desc:0 "Mit Maschinenpistolen ausgerüstete Infanterieeinheiten mit Schwerpunkt Nahkampf und Ausbildung im unwegsamen Gelände; diese Einheiten opfern schwere Waffen für die Feuerkraft im Nahbereich. "
