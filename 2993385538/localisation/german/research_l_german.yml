tech_kr_basic_sonar_cl_desc:0	"Der Einsatz von Schall zum Aufspüren von Schiffen unter Wasser war (und ist) eine komplexe Wissenschaft, und die Sonarsysteme wurden zwischen dem Ende des Ersten und dem Ende des Zweiten Weltkriegs mehrfach weiterentwickelt"



tech_kr_advanced_sonar_cl_desc:0	"Diese Geräte sind die fortschrittlichsten Sonargeräte, die in dieser Zeit entwickelt wurden. Sie sind besser in der Lage, getauchte Angreifer aufzuspüren, und sind wichtig, um den immer besser werdenden U-Boot-Konstruktionen zu begegnen."
tech_kr_cl_interwar_torpedoes:0	"Torpedos der Zwischenkrieg"


tech_kr_cl_magnetic_detonators_desc:0	"Obwohl sie anfangs recht unzuverlässig waren, wurden die Torpedos nach ihrer Weiterentwicklung durch magnetische Annäherungszünder effektiver."
tech_kr_cl_electric_torpedoes:0	"Elektrische Torpedos"
tech_kr_cl_electric_torpedoes_desc:0	"Elektrische Torpedos waren leiser und hinterließen weitaus weniger Kielwasser (was es dem Ziel erschwerte, die herannahende Gefahr zu erkennen) und stellten einen weiteren bedeutenden Fortschritt in der Torpedotechnologie dar."
tech_kr_cl_advanced_torpedoes:0	"Fortschrittliche Torpedos"
tech_kr_cl_advanced_torpedoes_desc:0	"Verbesserungen bei der Zuverlässigkeit, der Zielgenauigkeit (einschließlich rudimentärer Zielsuchgeräte) und in anderen Bereichen machten die Torpedos, die gegen Ende des Krieges in Dienst gestellt wurden, in der Tat sehr gefährlich."
tech_kr_Interwar_AA_cl:0	"Zwischenkriegsschiff FLAK"
tech_kr_Interwar_AA_cl_desc:0	"Zwar hatten die Seestreitkräfte schon vor dem Ende des Ersten Weltkriegs damit begonnen, ihre Schiffe mit Flugabwehrkanonen auszustatten, doch in den 1920er Jahren investierten viele Seestreitkräfte verstärkt in die Flugabwehr und entwickelten schnell feuernde Waffen mittleren Kalibers, die in erster Linie zur Bekämpfung von Flugzeugen gedacht waren."




tech_kr_Late_War_AA_cl:0	"Fortschrittliche Schiffs-FLAK-Systeme"
tech_kr_Late_War_AA_cl_desc:0	"Verbesserte Feuerleiteinrichtungen und motorisierte Trainings- und Elevationsanlagen in Verbindung mit Innovationen wie Munition mit Annäherungszündern verbesserten die Wirksamkeit der Schiffs-FLAK-Systeme erheblich."







tech_kr_surface_fc_radar_cl_desc:0	"Es dauerte nicht lange, bis das Radar zur Unterstützung der Feuerleitung und der Entfernungsmessung eingesetzt wurde, wodurch größere Kriegsschiffe auf Entfernung und bei Nacht effektiver wurden."
tech_kr_advanced_fc_radar_cl:0	"Radar zur Feuerleitung gegen Luftangriffe"
tech_kr_advanced_fc_radar_cl_desc:0	"Weitere Verbesserungen der Radargeräte führten dazu, dass sie die Zielerfassung für die Flugabwehrwaffen der Schiffe unterstützten und so ein wesentlich präziseres Flakfeuer gegen ankommende Flugzeuge ermöglichten."

tech_kr_ca:0	"Hipper Klasse"
tech_kr_ca2:0	"Prinz-Eugen Klasse"
tech_kr_ca3:0	"P Klasse"

tech_kr_early_sonar_ca_desc:0	"Das am Ende des Ersten Weltkriegs entwickelte und zunächst als ASDIC bekannte Sonar wurde damals so eingeschätzt, dass es U-Boote in zukünftigen Kriegen wahrscheinlich unwirksam machen würde.  Obwohl dies eine drastische Überschätzung der Fähigkeiten des Sonars war, waren diese frühen Geräte dennoch nützlich, um Überwasserschiffe in die Lage zu versetzen, untergetauchte Feinde zu bekämpfen."
tech_kr_depth_charge_throwers_ca:0	"Wasserbomben-Werfer"
tech_kr_depth_charge_throwers_ca_desc:0	"Die Hauptwaffe gegen U-Boote in der Zwischenkrieg und während des größten Teils des Zweiten Weltkriegs war die Wasserbombe.  Wasserbomben konnten vom Heck eines Schiffes auf die erwartete Position eines U-Bootes gerollt werden, aber die Entwicklung von Wasserbombenwerfern ermöglichte es den Schiffen, Wasserbombenmuster über einen größeren Bereich zu werfen, was ihre Wirksamkeit erhöhte."





tech_kr_advanced_sonar_ca_desc:0	"Diese Geräte sind die fortschrittlichsten Sonargeräte, die in dieser Zeit entwickelt wurden. Sie sind besser in der Lage, getauchte Angreifer aufzuspüren, und sind wichtig, um den immer besser werdenden U-Boot-Konstruktionen zu begegnen."





