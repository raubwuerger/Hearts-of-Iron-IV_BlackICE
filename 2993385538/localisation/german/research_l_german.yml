improved_medical_research:0	"Medizinische Forschung"
improved_medical_research_desc:0	"Verbesserungen in der Medizintechnik werden dazu führen, dass unsere Kommandeure weniger lange außer Gefecht gesetzt sind."



immunization_advances_desc:0	"Die Möglichkeit, unsere Bevölkerung zu immunisieren, führt langfristig zu geringeren Kosten"





