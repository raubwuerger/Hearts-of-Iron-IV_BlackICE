landing_craft:0	"Frühe Landungsboote"
landing_craft_desc:0	"Die Ergänzung von Transportschiffen durch frühe Landungsboote ermöglicht ein schnelleres Entladen der Truppen."
landing_craft_improved_desc:0	"Spezielle Landungsboote machen die Landung in feindlichem Gebiet etwas weniger problematisch."
