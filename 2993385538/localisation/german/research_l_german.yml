sub_ijn_late_1930s_AA_tech_desc:0	"Im Zuge der Weiterentwicklung der Luftfahrt verfeinerten die Marinen ihrerseits ihre Flugabwehrsysteme (auch wenn sich mit Ausbruch des Krieges herausstellen sollte, dass diese der Aufgabe nicht gewachsen waren) – mit schnelleren Mehrrohrsystemen und frühen Flugabwehr-Feuerleitsystemen."
sub_ijn_early_War_AA_tech:0	"Ausbau der Flugabwehr während des Krieges"
sub_ijn_early_War_AA_tech_desc:0	"Die Erfahrungen des Krieges machten deutlich, dass größere Flugabwehranlagen auf bestehenden und neuen Schiffen erforderlich waren, um der Bedrohung durch Flugzeuge entgegenzuwirken."
sub_ijn_late_War_AA_tech:0	"Fortschrittliche Flugabwehrsysteme"
sub_ijn_late_War_AA_tech_desc:0	"Verbesserte Feuerleitung sowie motorisierte Richt- und Höhenverstellung, kombiniert mit Innovationen wie Munition mit Annäherungszündern, verbesserten die Wirksamkeit der maritimen Flugabwehrsysteme erheblich."
sub_ijn_magnetic_detonators_desc:0	"Obwohl sie anfangs recht unzuverlässig waren, machten magnetische Zünder, sobald sie weiterentwickelt worden waren, Torpedos effektiver."
sub_ijn_electric_torpedoes:0	"Elektrische Torpedos"
sub_ijn_electric_torpedoes_desc:0	"Elektrische Torpedos waren leiser und hinterließen weitaus weniger Wellenspur (was es dem Ziel erschwerte, die herannahende Gefahr zu erkennen) und stellten einen weiteren bedeutenden Fortschritt in der Torpedotechnologie dar."
sub_ijn_advanced_torpedoes:0	"Fortschrittliche Torpedos"
sub_ijn_advanced_torpedoes_desc:0	"Verbesserungen hinsichtlich Zuverlässigkeit, Zielerfassung (einschließlich rudimentärer Zielsuchvorrichtungen) und anderer Bereiche machten die Torpedos, die gegen Ende des Krieges in Dienst gestellt wurden, in der Tat sehr gefährlich."
ijn_interwar_AA_tech:0	"Flugabwehr in der Zwischenkriegszeit"
ijn_interwar_AA_tech_desc:0	"Zwar hatten die Marinen bereits vor dem Ende des Ersten Weltkriegs damit begonnen, ihre Schiffe mit Flugabwehrgeschützen auszustatten, doch viele Marinen weiteten ihre Investitionen in die Marine-Flugabwehr in den 1920er Jahren aus und entwickelten mittelkalibrige Schnellfeuerwaffen, die in erster Linie zur Bekämpfung von Flugzeugen bestimmt waren."
ijn_early_War_AA_tech:0	"Ausbau der Fliegerabwehr während des Krieges"
ijn_early_War_AA_tech_desc:0	"Die Erfahrungen während des Krieges machten deutlich, dass bestehende und neue Schiffe mit umfangreicheren Fliegerabwehranlagen ausgestattet werden mussten, um der Bedrohung durch Flugzeuge entgegenzuwirken."
ijn_surface_search_radar:0	"Oberflächen-Suchradar"
ijn_surface_search_radar_desc:0	" Die frühen Radargeräte waren sperrig und benötigten viel Strom, sodass sie praktisch nur auf größeren Schiffen installiert werden konnten.  Sie erwiesen sich als wertvoll für die taktische Lageerkennung der Schiffe, insbesondere bei schlechter Sicht."
ijn_air_warning_radar:0	"Luftwarnradar"
ijn_air_warning_radar_desc:0	"Mit der Weiterentwicklung der Radargeräte wurden diese zur Frühwarnung vor Luftangriffen eingesetzt. Dadurch konnten sich Schiffe auf die Flugzeuge vorbereiten und eine stärkere Luftabwehr aufbauen."
ijn_advanced_surface_search_radar:0	"Fortschrittliches Oberflächen-Suchradar"
ijn_advanced_surface_search_radar_desc:0	"Die Entwicklung des Zentimeterwellenradars ermöglichte den Einbau weitaus leistungsstärkerer, aber auch weitaus kleinerer Radargeräte.  Dies bedeutete, dass größere Schiffe über ein noch besseres taktisches Bewusstsein verfügten und auch kleinere Schiffe Radar einsetzen konnten."
ijn_surface_fc_radar:0	"Oberflächen-Feuerleitradar"
ijn_early_sonar_desc:0	"Das am Ende des Ersten Weltkriegs entwickelte und ursprünglich als ASDIC bekannte Sonar galt damals als Mittel, das U-Boote in künftigen Kriegen wahrscheinlich unwirksam machen würde.  Zwar war dies eine drastische Überschätzung der Fähigkeiten des Sonars, doch waren diese frühen Geräte dennoch nützlich, um Überwasserschiffen den Kampf gegen untergetauchte Feinde zu ermöglichen."
ijn_depth_charge_throwers_desc:0	" Die Hauptwaffe gegen U-Boote in der Zwischenkriegszeit und während des größten Teils des Zweiten Weltkriegs war die Wasserbombe.  Wasserbomben konnten vom Heck eines Schiffes auf die vermutete Position eines U-Boots geworfen werden, doch die Entwicklung von Wasserbombenwerfern ermöglichte es den Schiffen, Wasserbomben in einem größeren Gebiet abzustürzen, was ihre Wirksamkeit erhöhte."
ijn_basic_sonar:0	" Grundlegendes Sonar"
ijn_asw_mortars_desc:0	 "Ein wesentlicher Nachteil des Sonars bestand darin, dass der Kontakt abbrach, sobald das angreifende Schiff das Ziel überfuhr, wodurch das U-Boot ein Zeitfenster erhielt, in dem es manövrieren konnte, um dem bevorstehenden Wasserbombenangriff zu entgehen. Die Erfindung von U-Boot-Abwehrmörsern wie Hedgehog und Mousetrap ermöglichte es den Begleitschiffen, auf Ziele vor ihnen zu feuern, und stellte eine wichtige Ergänzung der U-Boot-Abwehr dar. "
ijn_advanced_sonar:0	"Fortgeschrittenes Sonar"
ijn_interwar_torpedoes:0	"Torpedos der Zwischenkriegszeit"
ijn_interwar_torpedoes_desc:0	"Torpedos wurden nach dem Ersten Weltkrieg weiterentwickelt, und die meisten Großmächte des Zweiten Weltkriegs setzten Torpedos ein, die in den 1920er und frühen 1930er Jahren konstruiert und erstmals in Dienst gestellt worden waren"
ijn_magnetic_detonators:0	"Magnetische Zünder"
tech_usn:0	"US-Marine"
tech_usn_transport_desc:0	"Ein Schiff, das ausschließlich für den Truppentransport konzipiert ist und über keinerlei Verteidigungsfähigkeiten verfügt."
