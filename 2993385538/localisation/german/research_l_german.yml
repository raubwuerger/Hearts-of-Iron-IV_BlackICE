GER_early_coastal_submarine_1_desc:0	"Das moderne U-Boot ist weit entfernt von den plumpen Booten des Großen Krieges. Es ist leistungsfähiger als je zuvor und kann selbst das größte Schiff bedrohen - und das zu sehr moderaten Kosten. Die frühen Modelle aus dem Großen Krieg ebnen den Weg für neue Methoden der Seekriegsführung."


GER_early_coastal_submarine_3:0	"Küsten-U-Boot Typ IIB"
GER_early_coastal_submarine_3_desc:0	"U-Boote sind getarnte Schiffe, die dazu bestimmt sind, unverteidigte Konvois auszuschalten. Die frühen Modelle aus dem Ersten Weltkrieg ebneten den Weg für neue Methoden der Seekriegsführung."
tech_kr_early_sonar_dd_desc:0	"Das am Ende des Ersten Weltkriegs entwickelte und zunächst als ASDIC bezeichnete Sonar wurde damals als Mittel angesehen, das U-Boote in zukünftigen Kriegen wahrscheinlich unwirksam machen würde.  Obwohl dies eine drastische Überschätzung der Fähigkeiten des Sonars war, waren diese frühen Geräte dennoch nützlich, um Überwasserschiffe in die Lage zu versetzen, untergetauchte Feinde zu bekämpfen."
tech_kr_early_sonar_ca_desc:0	"Das am Ende des Ersten Weltkriegs entwickelte und zunächst als ASDIC bekannte Sonar wurde damals so eingeschätzt, dass es U-Boote in zukünftigen Kriegen wahrscheinlich unwirksam machen würde.  Obwohl dies eine drastische Überschätzung der Fähigkeiten des Sonars war, waren diese frühen Geräte dennoch nützlich, um Überwasserschiffe in die Lage zu versetzen, untergetauchte Feinde zu bekämpfen."
tech_kr_early_sonar_bc:0	"Frühes Sonar"
tech_kr_early_sonar_bc_desc:0	"Das am Ende des Ersten Weltkriegs entwickelte und zunächst als ASDIC bekannte Sonar wurde damals so eingeschätzt, dass es U-Boote in zukünftigen Kriegen wahrscheinlich unwirksam machen würde.  Obwohl dies eine drastische Überschätzung der Fähigkeiten des Sonars war, waren diese frühen Geräte dennoch nützlich, um Überwasserschiffe in die Lage zu versetzen, untergetauchte Feinde zu bekämpfen."

ijn_early_sonar:0	"Frühes Sonar"

