rail_infra5_desc:0	"Die Zukunft des effizienten Bauens erfordert eine umfassendere Planung für einzelne Projekte sowie standardisierte Lösungen, wo immer dies möglich ist, um die für die Herstellung ziviler und militärischer Güter erforderlichen Güter möglichst effizient zu liefern."


air_infra5:0	"Luftwaffenstützpunkt V"
