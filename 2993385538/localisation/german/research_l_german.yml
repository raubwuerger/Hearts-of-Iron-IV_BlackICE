interwar_AA_tech_rn:0	"Zwischenkriegs-Flugabwehr"
interwar_AA_tech_rn_desc:0	"Zwar hatten die Marinen bereits vor dem Ende des Ersten Weltkriegs damit begonnen, ihre Schiffe mit Flugabwehrgeschützen auszustatten, doch viele Marinen weiteten ihre Investitionen in die Marine-Flugabwehr in den 1920er Jahren aus und entwickelten mittelkalibrige Schnellfeuerwaffen, die in erster Linie zur Bekämpfung von Flugzeugen bestimmt waren."
late_1930s_AA_tech_rn_desc:0	"Im Zuge der Weiterentwicklung der Luftfahrt verfeinerten die Marinen ihrerseits ihre Flugabwehrsysteme (auch wenn sich mit Ausbruch des Krieges herausstellte, dass diese der Aufgabe nicht gewachsen waren) und führten Systeme mit höherer Geschossgeschwindigkeit, Mehrlaufgeschütze sowie frühe Flugabwehr-Feuerleitsysteme ein."
early_war_AA_tech_rn:0	"Ausbau der Flugabwehr während des Krieges"
early_war_AA_tech_rn_desc:0	"Die Erfahrungen des Krieges machten deutlich, dass auf bestehenden und neuen Schiffen umfangreichere Flugabwehranlagen erforderlich waren, um der Bedrohung durch Flugzeuge entgegenzuwirken."
advanced_surface_search_rn_radar:0	"Fortschrittliches Oberflächen-Suchradar"
advanced_surface_search_rn_radar_desc:0	"Die Entwicklung des Zentimeterwellenradars ermöglichte die Installation weitaus leistungsfähigerer, aber auch weitaus kleinerer Radargeräte. Dies bedeutete, dass größere Schiffe über ein noch besseres taktisches Bewusstsein verfügten und auch kleinere Schiffe Radar einsetzen konnten."
surface_fc_radar_rn:0	"Oberflächen-Feuerleitradar"
early_sonar_rn:0	"Frühe Sonarsysteme"
basic_sonar_rn:0	"Einfaches Sonar"
basic_sonar_rn_desc:0	"Die Ortung von Schiffen unter Wasser mithilfe von Schall war (und ist) eine komplexe Wissenschaft, und Sonarsysteme wurden zwischen dem Ende des Ersten und dem Zweiten Weltkrieg mehrfach weiterentwickelt"
asw_mortars_rn:0	" U-Boot-Abwehrmörser"
advanced_sonar_rn_desc:0	"Als die fortschrittlichsten Sonarsysteme, die in dieser Zeit entwickelt wurden, sind diese Geräte besser in der Lage, getauchte Angreifer aufzuspüren, und spielen eine wichtige Rolle bei der Bekämpfung der sich ständig verbessernden U-Boot-Konstruktion."
sub_rn_late_1930s_AA_tech_desc:0	"Im Zuge der Weiterentwicklung der Luftfahrt verfeinerten die Marinen ihrerseits ihre Flugabwehrsysteme (auch wenn sich mit Ausbruch des Krieges herausstellte, dass diese der Aufgabe nicht gewachsen waren) durch Systeme mit höherer Geschwindigkeit und mehreren Läufen sowie frühe Flugabwehr-Feuerleitsysteme."
sub_rn_late_war_AA_tech:0	"Fortschrittliche Flugabwehrsysteme"
sub_rn_late_war_AA_tech_desc:0	"Verbesserte Feuerleitung sowie motorisierte Richt- und Höhenverstellung, kombiniert mit Innovationen wie Munition mit Annäherungszündern, verbesserten die Wirksamkeit der maritimen Flugabwehrsysteme erheblich."
sub_rn_interwar_torpedoes:0	"Torpedos der Zwischenkriegszeit"
sub_rn_interwar_torpedoes_desc:0	" Die Entwicklung von Torpedos setzte sich nach dem Ersten Weltkrieg fort, und die meisten der großen Nationen im Zweiten Weltkrieg setzten Torpedos ein, die in den 1920er und frühen 1930er Jahren entworfen und erstmals in Dienst gestellt worden waren.\nFür Großbritannien wurden in der Zwischenkriegszeit der 18-Zoll- und der 21-Zoll-Torpedo entwickelt. Die Nelson-Klasse verfügte über einen eigenen Torpedotyp, den 24-Zoll-Mark-I. Es wurde sogar ein von Flugzeugen abgefeuerter Torpedo entwickelt, der 18-Zoll-Mark-XI. "
sub_rn_magnetic_detonators:0	"Magnetische Zünder"
sub_rn_advanced_torpedoes:0	"Fortschrittliche Torpedos"
sub_rn_advanced_torpedoes_desc:0	"Verbesserungen hinsichtlich Zuverlässigkeit, Zielerfassung (einschließlich rudimentärer Zielsuchvorrichtungen) und anderer Bereiche machten die Torpedos, die gegen Ende des Krieges in Dienst gestellt wurden, in der Tat sehr gefährlich."
tech_rf_transport_desc:0	"Ein Schiff, das ausschließlich für den Truppentransport konzipiert ist und über keinerlei Verteidigungsfähigkeiten verfügt."
