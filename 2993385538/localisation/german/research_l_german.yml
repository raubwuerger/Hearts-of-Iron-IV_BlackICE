mtg_transport_desc:0	"Diese Schiffe sind kaum mehr als Fracht- oder Passagierschiffe mit provisorischen Unterkünften für Truppen und stellen die einfachste Form des Truppentransports auf See dar."
mtg_landing_craft:0	"Frühe Landungsboote"
mtg_landing_craft_desc:0	"Die Hinzufügung früher Landungsboote zu Transportschiffen ermöglicht ein schnelleres Entladen von Truppen."
mtg_landing_craft_improved_desc:0	"Spezielle Invasionsboote machen die Landung in feindlichem Gebiet etwas weniger mühsam."
