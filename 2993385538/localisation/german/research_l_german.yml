tech_usn_sub:0	"U-Boot-Dienst der US-Marine"
tech_usn_sub_desc:0	"Während des Krieges waren U-Boote der US-Marine für 55 % der Verluste der japanischen Handelsflotte verantwortlich. Der Krieg gegen die Schifffahrt war der entscheidende Faktor für den Zusammenbruch der japanischen Wirtschaft"
tech_usn_patrol_submarine_1_desc:1	"Die V-Boote waren eine Gruppe von neun U-Booten der United States Navy, die zwischen dem Ersten und dem Zweiten Weltkrieg von 1921 bis 1934 gebaut wurden. Es handelte sich dabei nicht um eine Schiffsklasse im üblichen Sinne einer Serie nahezu identischer Schiffe, die nach demselben Entwurf gebaut wurden, sondern um Schiffe, die im Rahmen des "Fleet Boat"-Programms gemeinsam genehmigt wurden. Der Begriff "V-Boote" umfasst fünf separate U-Boot-Klassen. Diese gliederten sich in drei große, schnelle Flotten-U-Boote (V-1 bis V-3), drei große Langstrecken-U-Boote (V-4 bis V-6) und drei mittelgroße U-Boote (V-7 bis V-9). Diese Technologie bezieht sich auf V-1 bis V-3."
tech_usn_patrol_submarine_1b:0	"Programm für Langstrecken-Flotten-U-Boote"
tech_usn_patrol_submarine_1c_desc:0	" Die V-Boote waren eine Gruppe von neun U-Booten der United States Navy, die zwischen dem Ersten und dem Zweiten Weltkrieg von 1921 bis 1934 gebaut wurden. Es handelte sich dabei nicht um eine Schiffsklasse im üblichen Sinne einer Serie nahezu identischer Schiffe, die nach demselben Entwurf gebaut wurden, sondern um Schiffe, die im Rahmen des "Flottenboot"-Programms gemeinsam genehmigt wurden. Der Begriff "V-Boote" umfasst fünf separate U-Boot-Klassen. Diese gliederten sich in drei große, schnelle Flotten-U-Boote (V-1 bis V-3), drei große Langstrecken-U-Boote (V-4 bis V-6) und drei mittelgroße U-Boote (V-7 bis V-9). Diese Technologie bezieht sich auf die Klassen V-7 bis V-9."
tech_project_kayo:0	"Projekt Kayo"
tech_project_kayo_desc:0	"Projekt Kayo war ein Forschungs- und Entwicklungsprojekt, das unmittelbar nach dem Zweiten Weltkrieg von der United States Navy ins Leben gerufen wurde, um "das Problem des Einsatzes von U-Booten zum Angriff und zur Zerstörung feindlicher U-Boote zu lösen"."
tech_guppy:0	"Greater Underwater Propulsion Power Program (GUPPY)"
tech_guppy_desc:0	"Das Greater Underwater Propulsion Power Program (GUPPY) wurde nach dem Zweiten Weltkrieg von der US-Marine ins Leben gerufen, um die Unterwassergeschwindigkeit, Manövrierfähigkeit und Ausdauer ihrer U-Boote zu verbessern. (Das "Y" im Akronym wurde aus Gründen der Aussprechbarkeit hinzugefügt.) Die Marine begann das Programm mit der Untersuchung und dem Reverse Engineering zweier erbeuteter deutscher U-Boote des Typs XXI: U-2513 und U-3008. Diese Analyse führte zu vier Zielen: Erhöhung der Batteriekapazität der U-Boote, Straffung der Bootsstrukturen, Einbau von Schnorcheln und Verbesserung der Feuerleitsysteme. Die Marine konzentrierte sich sofort auf die Entwicklung einer neuen U-Boot-Klasse, doch das Bureau of Ships war der Ansicht, dass die Flotte der bestehenden U-Boote der Gato-, Balao- und Tench-Klasse so umgerüstet werden könne, dass die gewünschten Verbesserungen integriert würden."
tech_usn_patrol_submarine_8_guppy:0	"Balao-Klasse (GUPPY)"
tech_usn_patrol_submarine_8_guppy_desc:0	"Das Greater Underwater Propulsion Power Program (GUPPY) wurde nach dem Zweiten Weltkrieg von der US-Marine ins Leben gerufen, um die Unterwassergeschwindigkeit, Manövrierfähigkeit und Ausdauer ihrer U-Boote zu verbessern. (Das "Y" im Akronym wurde aus Gründen der Aussprechbarkeit hinzugefügt.) Die Marine begann das Programm mit der Untersuchung und dem Reverse Engineering zweier erbeuteter deutscher U-Boote des Typs XXI: U-2513 und U-3008. Diese Analyse führte zu vier Zielen: Erhöhung der Batteriekapazität der U-Boote, Straffung der Bootsstrukturen, Hinzufügen von Schnorcheln und Verbesserung der Feuerleitsysteme. Die Marine konzentrierte sich sofort auf die Konstruktion einer neuen U-Boot-Klasse, doch das Bureau of Ships war der Ansicht, dass die Flotte der bestehenden U-Boote der Balao- und Tench-Klasse so modifiziert werden könne, dass die gewünschten Verbesserungen integriert würden."
