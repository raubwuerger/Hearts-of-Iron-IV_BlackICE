FOREIGN_ARMOR_DESC:0	"Da der Bestand an feindlichen gepanzerten Fahrzeugen wächst, fordert unser Armeekommando deren Entsendung an die Front an. Unsere Pioniere werden ausländische Panzer automatisch umbauen, doch das vollständige Reverse Engineering ausländischer Panzer ist kostspielig, sodass der Ersatz von Verlusten zum Problem werden kann, wenn wir keine weiteren erbeuten können.\n\n\n\n"
ENG_captured_armor_tech_desc:0	"Rüsten Sie erbeutete und geleihte Panzer zu ausländischen Panzerbataillonen um, die Sie in Vorlagen verwenden können. Es werden in regelmäßigen Abständen Ereignisse ausgelöst, die es Ihnen ermöglichen, die Panzerung entsprechend dem Spielverlauf zu verbessern."
USA_captured_armor_tech_desc:0	"Wandeln Sie erbeutete und im Rahmen des Leih- und Pachtvertrags erhaltene Panzer in ausländische Panzerbataillone um, die Sie in Vorlagen verwenden können. Es werden in regelmäßigen Abständen Ereignisse ausgelöst, die es Ihnen ermöglichen, die Panzerung entsprechend dem Spielverlauf zu verbessern."
FRA_captured_armor_tech_desc:0	"Wandeln Sie erbeutete und ausgeliehene Panzer in ausländische Panzerbataillone um, die Sie in Vorlagen verwenden können. Es werden regelmäßig Ereignisse ausgelöst, die es Ihnen ermöglichen, die Panzer entsprechend dem Spielverlauf aufzurüsten."
ITA_captured_armor_tech_desc:0	"Wandeln Sie erbeutete und ausgeliehene Panzer in ausländische Panzerbataillone um, die Sie in Vorlagen verwenden können. Es werden regelmäßig Ereignisse ausgelöst, die es Ihnen ermöglichen, die Panzerung entsprechend dem Spielverlauf zu verbessern."
JAP_captured_armor_tech_desc:0	"Wandeln Sie erbeutete und geleihte Panzer in ausländische Panzerbataillone um, die Sie in Vorlagen verwenden können. Es werden regelmäßig Ereignisse ausgelöst, die es Ihnen ermöglichen, die Panzerung entsprechend dem Spielverlauf zu verbessern."
