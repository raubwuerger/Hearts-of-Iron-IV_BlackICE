night_patrols:0	"Nachtangriffe"
dispersed_infantry_attacks_desc:0	"Konzentriertes feindliches Abwehrfeuer ist für angreifende Truppen tödlich. Indem wir unsere Angriffe streuen, können wir versuchen, unsere Chancen zu erhöhen, eine Schwachstelle zu finden und bestimmte Positionen auszunutzen."
offensive_trenches:0	"Offensivgräben"
defensive_trenches_desc:0	"Tief und gut ausgebaute Gräben, die darauf ausgelegt sind, das Gelände über einen langen Zeitraum zu halten."
reserve_trenches:0	"Reserveschützengräben"
reserve_trenches_desc:0	"Hinter den Frontgräben befindet sich ein Netz aus Gräben der 2. und 3. Linie, um Verstärkung und Gegenangriffe von dort aus starten zu können"
communication_trenches_desc:0	"Schmale Gräben, über die unsere Boten von der Front zu den Kommandoposten gelangen können"
barbed_wire:0	"Stacheldrahtbefestigungen"
barbed_wire_desc:0	"Ausgedehnte Barrieren und Felder aus Stacheldraht mit Rasierklingenhaken, um Infanterieangriffe zu verlangsamen und einzufangen"
pillboxes:0	"Bunkeranlagen"
sniper_pits:0	"Scharfschützengruben"
sniper_pits_desc:0	"Befinden sich oft im Niemandsland, besetzt von kleinen Teams oder einzelnen Scharfschützen, um Unachtsame zu bedrängen und zu töten"
nomans_land_saps_desc:0	"In das Niemandsland gegrabene Schützengräben, um die angreifende Infanterie näher an den Feind heranzubringen"
tunnel_mines:0	"Tunnelminen"
tunnel_mines_desc:0	"Ein langer Tunnel, der durch das Niemandsland gegraben wurde und unter den feindlichen Schützengräben endete, wo Sprengstoff gelagert und gezündet wurde. Dadurch wurde ein Krater in die feindlichen Frontlinien gesprengt."
fortress_trenches:0	"Festungsverteidigung"
fortress_trenches_desc:0	"Miteinander verbundene, tief in das Niemandsland reichende Verteidigungsanlagen aus Betonbunker, Maschinengewehrnestern, Tunneln, Kommandoposten und Schützengräben, die sich über mehrere Kilometer erstreckten." "
basic_MG_defences:0	"Grundlegende MG-Stellungen"
multiple_MG_nests:0	"Mehrere MG-Nester"
multiple_MG_nests_desc:0	"Die Wirksamkeit von Maschinengewehren bei der Verteidigung von Stellungen ist bemerkenswert. Die Armee sollte ihr Arsenal erweitern und es den eigenen Streitkräften ermöglichen, frontale Infanterieangriffe entlang der gesamten Frontlinie abzuwehren und abzuwehren."
infantry_MG_coordination_desc:0	"Es wird erwartet, dass Maschinengewehre und Infanterietrupps zusammenarbeiten."
MG_support_infantry_doctrine_desc:0	"Maschinengewehre werden eingesetzt, um Infanterie-Gewehrtrupps mit Sperrfeuer und Verteidigung zu unterstützen."
Infantry_support_MG_doctrine:0	"Infanterie-Unterstützungs-MG"
ww1_artillery_malus:0	"Artillerie des Ersten Weltkriegs"
offensive_prep_fire:0	"Offensives Vorbereitungsfeuer"
rear_area_bombardment_desc:0	"Es ist nicht besonders fair, aber ein gut platzierter Artilleriefeuerhagel im Rücken des Feindes kann Wunder wirken"
standing_barrage:0	"Stehender Sperrfeuer"
standing_barrage_desc:0	"In der Verteidigung können wir vorab festgelegte, dichte Feuervorhänge einsetzen, um dem Feind den Zugang zu einer bestimmten Vorstoßachse zu verwehren. Dies verschafft den eigenen Truppen die nötige Zeit, um sich einzugraben, neu zu formieren oder sich zurückzuziehen."
box_barrage:0	"Kastenfeuer"
block_barrage:0	"Blockfeuer"
creeping_barrage_desc:0	"Indem Artillerieangriffe in kleinen Schritten direkt vor den eigenen Truppen erfolgen, hat der Feind keine Zeit, sich vollständig zu erholen und aus seinen Verteidigungsstellungen hervorzutreten."
rolling_barrage:0	"Rolling Barrage"
rolling_barrage_desc:0	"Dank neuer Fortschritte in der Kommunikationstechnologie können vorrückende Truppen sich mit der eigenen Artillerie abstimmen, um während eines laufenden Angriffs die nächstgelegene Linie unbesetzter feindlicher Stellungen anzugreifen."
artillery_observers_desc:0	" Die Treffsicherheit unserer Artillerie lässt sich verbessern, wenn Männer an der Front den Einschlag der Geschosse beobachten."
balloon_observers:0	"Ballon-Artilleriebeobachter"
aircraft_observers:0	"Flugzeug-Artilleriebeobachter"
aircraft_observers_desc:0	"Diese seltsamen Fluggeräte erweisen sich als nützlich für die Verbesserung der Artillerie-Treffsicherheit."
foot_runners:0	"Boten"
foot_runners_desc:0	"Soldaten zu Fuß sind unsere beste Hoffnung, um Nachrichten zwischen den Frontlinien und den Kommandoposten sowie der Artillerie zu übermitteln"
carrier_pidgeons:0	 "Brieftauben"
carrier_pidgeons_desc:0	"Brieftauben sind eine schnelle Möglichkeit, Nachrichten an die Kommandoposten und die Artillerie zu übermitteln."
telephone_communications_desc:0	"Unsere fortschrittlichste Methode zur Nachrichtenübermittlung sind Telefonleitungen."
mobile_doctrines:0	"Mobile Doktrinen vor dem Ersten Weltkrieg"
cavalry_charges_desc:0	"Schockkavallerie-Taktiken können sich auch im modernen Kampf noch als nützlich erweisen. Durch schnelle Angriffe mit mobilen Truppen können wir feindliche Stellungen durchbrechen und den Weg für schwerere Streitkräfte ebnen."
cavalry_dismounting_desc:0	"Im modernen Kampf müssen Truppen verschanzte Stellungen nutzen, um feindliche Angriffskräfte abzuwehren. Abgesessene Kavallerie mit modernsten Waffen verschafft mobilen Einheiten einen größeren Aktionsradius bei Verteidigungsoperationen."
cavalry_exploitation:0	"Ausnutzung der Kavallerie"
infantry_tank_coordination:0	"Koordination von Infanterie und Panzern"
infantry_tank_artillery_coordination_desc:0	"Panzer versuchen gemeinsam mit der Infanterie, den Spuren unseres Artilleriefeuers zu folgen"
motorcycle_liaison:0	"Verbindungsmotorräder"
staff_officer_vehicles_desc:0	"Unsere befehlshabenden Offiziere können sich schnell von Kommandoposten zu Kommandoposten bewegen"
ww1_battlefield_support:0	"Unterstützung auf dem Schlachtfeld vor dem Ersten Weltkrieg"
ww1_battlefield_support_desc:0	"Obwohl sie sich zunehmend als veraltet erweisen, werden die Strategien zur Beobachtung und medizinischen Versorgung im taktischen Linienkrieg in den kommenden Jahren die Grundpfeiler der Unterstützung am Schlachtfeld bilden. Die Armee und ihr Stab im Hinterland müssen sich anpassen oder werden überflüssig."
battlefield_commissions:0	"Beförderungen am Schlachtfeld"
weather_reporting_desc:0	"Diese rund um die Uhr andauernde Kriegsführung erfordert eine bessere Wetterüberwachung, damit wir wissen, unter welchen Bedingungen unsere Truppen kämpfen"
terrain_mapping:0	"Informationen zur Geländekartierung"
terrain_mapping_desc:0	"Die alten Karten sind nicht immer zuverlässige Mittel, um zu wissen, in welcher Art von Gelände wir kämpfen"
camouflage_positions_desc:0	"Die jüngsten weltweiten Entwicklungen hinsichtlich der Beobachtungs- und Aufzeichnungsfähigkeiten einer Armee haben viele unserer Streitkräfte der Gefahr feindlicher Angriffe ausgesetzt. Durch den Einsatz verschiedener Tarnungsmaßnahmen werden die eigenen Stellungen weniger sichtbar und sind weniger anfällig für Angriffe durch feindliche Luft- und Artillerieeinheiten."
AA_positions:0	"Errichtung von Flugabwehrstellungen"
first_aid_stations:0	"Erste-Hilfe-Stationen "
first_aid_stations_desc:0	"Verwundeten-Sammelstellen in der Nähe der Frontlinie können Leben retten und dafür sorgen, dass Leichtverletzte schneller wieder einsatzfähig sind."
tactic_infantry_advance:0	"Frontaler Angriff auf Schützengräben"
tactic_infantry_advance_desc:0	" "
tactic_dispersed_infantry:0	"Streuangriff"
tactic_infiltration_infantry:0	"Infiltrationsangriff"
tactic_infiltration_infantry_desc:0	"Die ersten Infanteriewellen sollten so weit wie möglich vordringen und die feindlichen Stellungen den nachfolgenden Wellen überlassen"
tactic_tunnel_mine_desc:0	" "
tactic_barbed_wire_desc:0	" "
tactic_sniper:0	" Vordere Scharfschützenstellungen"
tactic_harassment_fire:0	"Störfeuer"
tactic_rear_area_fire_desc:0	" "
tactic_standing_barrage:0	"Stehendes Sperrfeuer"
tactic_block_barrage:0	"Blockierendes Sperrfeuer"
tactic_creeping_barrage_desc:0	" "
tactic_assault_march:0	"Angriffsmarsch"
tactic_assault_march_desc:0	" "
tactic_rolling_barrage_desc:0	" "
tactic_infantry_artillery_armor:0	"Vollständige Bodenkoordination"
tactic_infantry_artillery_armor_desc:0	" "
tactic_ambush_adv:0	"Hinterhalt"
WW1_air_power:0	"Taktische Luftmacht"
WW1_air_power_desc:0	"Die jüngste Erfindung des Flugzeugs entwickelt sich rasch zu einem zuverlässigen und wirksamen Mittel. Die Armee könnte Flugzeuge einsetzen, um feindliche Stellungen und Truppenbewegungen zu beobachten und anzugreifen."
WW1_air_survey_desc:0	"Nachrichtendienst, Überwachung und Aufklärung haben sich als entscheidend für den Sieg in Kriegen erwiesen. Durch die Entwicklung von Flugzeugen und die Ausbildung von Piloten speziell für diesen Zweck können Kommandeure vor Ort fundiertere taktische Entscheidungen treffen."
WW1_air_control:0	"Luftüberlegenheit"
WW1_air_bomb:0	"Spezialisierte Bomberstaffeln"
WW1_air_bomb_desc:0	"Die Bildung von Bomberstaffeln mit spezialisierten Flugzeugen und Waffen wird massive strategische Angriffe auf die Städte, die Industrie und die Versorgungsstrukturen eines feindlichen Landes ermöglichen."
WW1_air_ground:0	"Jagdflugzeug-Bodenangriffe"
WW1_air_naval:0	"Torpedobombardement"
WW1_air_naval_desc:0	"Torpedoboote werden in der Marine aufgrund ihrer Wirksamkeit bei der Zerstörung großer Kriegsschiffe in großem Umfang eingesetzt. Durch die Entwicklung von Flugzeugen, die solche Torpedos transportieren können, sind Armee- und Marineflugzeuge in der Lage, feindliche Marinen effektiver anzugreifen und zu bedrängen"
hmg_2:0	"Verbessertes MG"
hmg_3:0	"Allzweck-MG"
hmg_3_desc:0	"Während wir die Zuverlässigkeit von Maschinengewehren aufrechterhalten und verbessern, können wir auch mit höheren Feuerraten experimentieren, um die Durchschlagskraft des konstanten Kugelhagels sicherzustellen."
mortars_desc:0	"Automatische Waffen werden immer tragbarer. Maschinenpistolen haben sich bereits bewährt, und die Entwicklung von handgeführten Unterstützungswaffen muss fortgesetzt werden."
mortars_3:0	"Verbessertes Mörserteam"
mortars_4_desc:0	"Angesichts des zunehmenden Einsatzes von Sturmgewehren ist die Entwicklung zuverlässiger automatischer Waffen, die von allen Soldaten in jeder Umgebung eingesetzt werden können, eine Priorität für eine moderne Armee."
explosives_team_desc:0	"Durch die Integration spezialisierter Sprengstoffteams in unsere Pionierkompanien werden wir unsere Fähigkeit verbessern, befestigte Stellungen zu durchbrechen, Hindernisse zu räumen und feindliche Stellungen präzise zu zerstören. Diese Teams werden mit Sprengstofftaschen, Sprengpaketen und Flammenwerfern ausgerüstet, um Bunker, Panzerabwehrhindernisse und eingegrabene Verteidigungsanlagen unschädlich zu machen. Ausgebildet in der schnellen Platzierung und Zündung von Sprengladungen unter Kampfbedingungen, werden sie eine entscheidende Rolle bei der Stadtkriegsführung, der Säuberung von Schützengräben und Durchbruchoperationen spielen. Ihr Fachwissen im Bereich Sprengtechnik wird sicherstellen, dass unsere Angriffstruppen auch gegen die am stärksten befestigten feindlichen Stellungen ihren Vorstoß aufrechterhalten können. \n"Stahltüren, Betonmauern, Stacheldraht – all das spielt keine Rolle. Geben Sie uns dreißig Sekunden und eine Sprengladung, und wir sprengen uns den Weg frei."
tech_Headquarters_cars:0	"Motorisierte Stabskompanie"
tech_Headquarters_cars_desc:0	"Für Formationen auf Bataillonsniveau und darüber hinaus ist eine eigene Stabskompanie für den effizienten Betrieb der Einheit unerlässlich. Die Stabskompanie umfasst den Kommandeur, die Stabsoffiziere sowie weitere Offiziere und Personal, die für Schlüsselbereiche der Einheit zuständig sind, wie Ausbildung, Operationen, Nachrichtendienst, Logistik und Kommunikation. \n\nDie Motorisierung der Stabskompanie verbessert deren Effizienz in Bezug auf Transport und Kommunikation."
tech_Headquarters2:0	"Verbesserte Stabskompanie"
tech_Headquarters3:0	"Fortgeschrittene Stabskompanie"
