christie_suspension:0	"Christie-Federung"
christie_suspension_desc:0	"Die Christie-Federung ist ein von dem Ingenieur J. Walter Christie für Panzer entwickeltes Federungssystem. Sie ermöglichte einen deutlich größeren Federweg als die damals üblichen Blattfedersysteme, wodurch Panzer eine wesentlich höhere Geländegeschwindigkeit erreichen konnten"
torsion_suspension_desc:0	" Eine Torsionsstabfederung, auch als Torsionsfederung bekannt, ist jede Fahrzeugfederung, die einen Torsionsstab als tragende Hauptfeder verwendet. Ein Ende einer langen Metallstange ist fest am Fahrzeugchassis befestigt; das gegenüberliegende Ende endet in einem Hebel, dem Torsionsschlüssel, der senkrecht zur Stange angebracht ist und an einem Aufhängungsarm, einer Spindel oder der Achse befestigt ist. Vertikale Bewegungen des Rades bewirken, dass sich die Stange um ihre Achse verdreht, was durch den Torsionswiderstand der Stange aufgehalten wird. Die effektive Federrate der Stange wird durch ihre Länge, ihren Querschnitt, ihre Form, ihr Material und ihren Herstellungsprozess bestimmt. "
bolted_armor_desc:0	""
welded_armor:0	"Fortschrittliche Panzerungsbauweise"
hfdf_tech:0	"Signalaufklärung"
hfdf_tech2_desc:0	"Die Adcock-Antenne ist eine Anordnung von vier Monopolmasten, die als zwei rechtwinklig angeordnete virtuelle Rahmenantennen fungieren. Durch den Vergleich der auf den beiden virtuellen Schleifen empfangenen Signale lässt sich die Richtung des Signals mithilfe bestehender RDF-Techniken bestimmen. Forscher hatten die Antenne bereits 1919 aufgebaut, sie jedoch zugunsten kleinerer Konstruktionen vernachlässigt. Diese erwiesen sich aufgrund der elektrischen Eigenschaften der Region Slough als sehr leistungsschwach, was es schwierig machte, festzustellen, ob ein Signal auf einer geraden Linie oder vom Himmel herab empfangen wurde. Smith-Rose und Barfield wandten ihre Aufmerksamkeit wieder der Adcock-Antenne zu, die keine horizontale Komponente aufwies und somit die "Himmelswellen" herausfilterte. In einer Reihe von Folgeexperimenten gelang es ihnen, den Standort von Sendern im ganzen Land genau zu bestimmen."
hfdf_tech3:0	"Hochfrequenz-Peilung"
hfdf_tech3_desc:0	" HF/DF (Huffduff) nutzte einen Satz von Antennen, um dasselbe Signal an leicht unterschiedlichen Standorten oder Winkeln zu empfangen, und verwendete dann diese geringfügigen Unterschiede im Signal, um die Peilung zum Sender auf einem Oszilloskop-Display anzuzeigen. Frühere Systeme verwendeten eine mechanisch gedrehte Antenne (oder einen Solenoid) und einen Bediener, der auf Spitzen oder Nullstellen im Signal achtete, was die Bestimmung erheblich verzögerte, oft um eine Minute oder mehr. Die Anzeige von HF/DF führte dieselbe Messung im Wesentlichen augenblicklich durch, wodurch es möglich war, flüchtige Signale, wie beispielsweise solche der U-Boot-Flotte, zu erfassen. "
hfdf_tech_lar:0	"Signals Intelligence"
hfdf_tech_lar_desc:0	"Eine mechanisch drehbare Rahmenantenne. Der Bediener stellte einen bekannten Radiosender ein und drehte dann die Antenne, bis das Signal verschwand. Dies bedeutete, dass die Antenne nun im rechten Winkel zum Sender stand, obwohl dieser sich auf beiden Seiten der Antenne befinden konnte. Durch mehrere solcher Messungen oder unter Verwendung anderer Navigationsdaten zur Ausschaltung einer der mehrdeutigen Richtungen konnte die Peilung zum Sender bestimmt werden."
hfdf_tech2_lar_desc:0	"Die Adcock-Antenne besteht aus vier Monopolmasten, die als zwei rechtwinklig angeordnete virtuelle Rahmenantennen fungieren. Durch den Vergleich der auf den beiden virtuellen Rahmen empfangenen Signale lässt sich die Richtung des Signals mit Hilfe bestehender RDF-Techniken bestimmen. Forscher hatten die Antenne 1919 aufgebaut, sie jedoch zugunsten kleinerer Konstruktionen vernachlässigt. Diese erwiesen sich aufgrund der elektrischen Eigenschaften des Gebiets um Slough als sehr leistungsschwach, was es schwierig machte, festzustellen, ob ein Signal auf einer geraden Linie oder vom Himmel herab empfangen wurde. Smith-Rose und Barfield wandten ihre Aufmerksamkeit wieder der Adcock-Antenne zu, die keine horizontale Komponente aufwies und somit die "Himmelswellen" herausfilterte. In einer Reihe von Folgeexperimenten gelang es ihnen, den Standort von Sendern im ganzen Land genau zu bestimmen."
hfdf_tech3_lar:0	"Hochfrequenz-Peilung"
