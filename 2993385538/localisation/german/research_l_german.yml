improved_glass_optics:0	"Glasoptik"
modern_microscopes:0	"Moderne Mikroskope"
environmental_recognition:0	"Industrielle Landwirtschaft"
early_pesticides:0	"Frühe Pestizide"
industral_farms_i:0	"Mischbetriebe"
crop_farms_ii:0	"Dreipunktaufhängung"
crop_farms_ii_desc:	"Durch die Einführung des Dreipunktaufhängungssystems werden wir die Effizienz von Traktoren revolutionieren, da landwirtschaftliche Geräte schneller und vielseitiger angebracht werden können. Diese Innovation wird die Arbeiten beim Pflügen, Säen und Ernten verbessern und unseren Agrarsektor weiter mechanisieren."
crop_farms_iii:0	"Industriedünger"
vacuum_sealed_food_desc:	"Durch den Einsatz der Vakuumversiegelungstechnologie werden wir die Möglichkeiten der Lebensmittelkonservierung drastisch erweitern. Das Entfernen von Luft aus der Verpackung verhindert Verderb, ermöglicht eine sicherere Langzeitlagerung und den Transport von Verpflegung und gewährleistet frischere Vorräte für Soldaten und Zivilisten gleichermaßen."
waste_management_desc:	"Durch die Einführung moderner Abfallwirtschaftssysteme werden wir die Ausbreitung von Krankheiten eindämmen und die sanitären Verhältnisse sowohl in städtischen als auch in ländlichen Gebieten verbessern. Eine effiziente Abwasserbehandlung, die kontrollierte Entsorgung von Industrieabfällen und verbesserte Initiativen zur öffentlichen Hygiene werden zu einer gesünderen Bevölkerung beitragen."
industral_farms_iii_desc:	"Durch den Einsatz mechanisierter Mähdrescher werden wir den Prozess des Mähens, Dreschens und Reinigens von Getreidekulturen rationalisieren. Dieser Fortschritt wird den Bedarf an manueller Arbeit verringern, die Effizienz steigern und eine Getreideproduktion in größerem Maßstab ermöglichen, um die wachsende Nachfrage zu decken."
meat_farms_ii:0	"Fortschrittliche Tierhaltung "
meat_farms_ii_desc:	"Durch die Verfeinerung wissenschaftlicher Zuchttechniken und Programme zur Krankheitsprävention werden wir maximale Effizienz in der Viehzucht sicherstellen. Genetische Selektion, kontrollierte Fütterungsprogramme und eine verbesserte tierärztliche Versorgung werden die Tiergesundheit und Produktivität steigern und eine stetige Versorgung mit hochwertigem Fleisch und Milchprodukten gewährleisten."
meat_farms_iii:0	"Veterinärmedizin"
anti_air_tech:	"Luftabwehr"
polymerization_theories:0	"Polymerisationstheorien"
polymerization_theories_desc:0	"Bahnbrechende Fortschritte in den Polymerisationstheorien und im Verständnis der Polymerisation. Die Erforschung molekularer Strukturen und chemischer Reaktionen ebnet den Weg für die Entwicklung neuer Polymere."
plastics_i_desc:0	"Fortschritte in der Polymerisationstheorie haben zur Entwicklung von Baupolymeren geführt, die eine verbesserte Festigkeit und Haltbarkeit sowie innovative Lösungen für Design- und Bauanwendungen bieten."
plastics_iii_desc:0	"Fortschrittliche Textilpolymere bieten überlegene Festigkeit, Elastizität und Haltbarkeit und treiben Innovationen in der Gewebeproduktion für militärische, industrielle und alltägliche Anwendungen voran."
plastics_iv:0	"Spezialkunststoffe"
plastics_iv_desc:0	"Fortschritte in der Polymertechnologie haben zu einer vielfältigen Palette an Spezialkunststoffen geführt, die für militärische, industrielle und wissenschaftliche Anwendungen optimiert sind und leichte, langlebige und vielseitige Lösungen für verschiedene anspruchsvolle Umgebungen bieten."
direct_chill_casting_desc:0	" Wir können Techniken erforschen, um die Kühlung bestimmter flüssiger Metalle zu verbessern. Indem wir Wasser direkt nur in einen Teil der Form mit einer zusätzlichen Außenschicht sprühen. Auf diese Weise können wir die inneren Spannungen des gekühlten Materials reduzieren, da dies eine gleichmäßige Kontraktion auf allen Seiten ermöglicht."
aluminium_industry_i:0	"Verbesserungen in der Aluminiumindustrie"
aluminium_industry_ii_efficient:0	"Effiziente Aluminiumoxidgewinnung"
aluminium_industry_ii_output:0	"Aluminiumoxidgewinnung mit hoher Kapazität"
aluminium_industry_iv_desc:	"Durch die vollständige Integration automatisierter Gewinnungsverfahren, hocheffizienter Raffinerien und optimierter Lieferketten werden wir die Aluminiumproduktion auf ein beispielloses Niveau maximieren. Dies wird sicherstellen, dass unsere Rüstungsindustrie Zugang zu reichlich vorhandenen Leichtbaumaterialien für hochmoderne Flugzeuge und Fahrzeuge hat."
steel_industry_i_new_desc:	"Durch den Bau von Stahlwerken der nächsten Generation werden wir die neuesten Fortschritte in der Metallurgie und Automatisierung von Grund auf integrieren. Diese neuen Anlagen werden schneller stärkeren und gleichmäßigeren Stahl produzieren und so sicherstellen, dass unser Militär über die für die moderne Kriegsführung notwendigen Materialien verfügt."
steel_industry_i_upgrade:0	"Pläne zur Modernisierung von Stahlwerken"
steel_industry_i_upgrade_desc:	"Durch die Modernisierung bestehender Stahlwerke werden wir die Effizienz und Produktionsleistung steigern, ohne umfangreiche Neubauten zu erfordern. Modernisierte Hochöfen, ein besseres Wärmemanagement und verbesserte Walzwerke werden eine stetige Versorgung mit hochwertigem Stahl für militärische und industrielle Zwecke gewährleisten."
steel_industry_ii:0	"Stahlindustrie in Kriegszeiten"
electric_arc_furnace_desc:	"Durch den Einsatz von Lichtbogenöfen werden wir die Stahlveredelung verbessern, indem wir eine bessere Temperaturkontrolle und die Wiederverwertung von Altmetall zu hochwertigem Stahl ermöglichen. Diese Technologie wird für mehr Flexibilität und Effizienz bei der Stahlproduktion in Kriegszeiten sorgen."
steel_industry_iii:0	"Optimierte Stahlindustrie in Kriegszeiten"
steel_industry_iv_iron:0	 "Hochkohlenstoffstahl"
steel_industry_iv_iron_desc:	"Durch die Erhöhung des Kohlenstoffgehalts im Stahl werden wir härteres, verschleißfesteres Metall für Schneidwerkzeuge, Federn und hochfeste militärische Anwendungen herstellen. Diese Verfeinerung wird die Haltbarkeit und Leistungsfähigkeit in hochbelastenden Kampfsituationen verbessern."
steel_industry_iv_coal:0	"Kohlenstoffarmer Stahl"
submerged_arc_weld:0	"Unterpulverschweißen"
submerged_arc_weld_desc:	"Durch die Entwicklung von Unterpulverschweißtechniken werden wir die Effizienz und Haltbarkeit der großtechnischen Stahlfertigung verbessern. Diese Methode wird insbesondere im Schiffbau und bei der Herstellung schwerer Panzer von großem Wert sein und für eine stabilere, widerstandsfähigere Konstruktion sorgen."
heliarc_welding:0	 "Heliarc-Schweißen"
heliarc_welding_desc:	"Durch die Einführung des Heliarc-Schweißens (Wolfram-Inertgas-Schweißen) werden wir Präzisionsschweißtechniken verfeinern, die für Flugzeuge, Panzer und hochentwickelte Maschinen unerlässlich sind. Dieses Verfahren ermöglicht sauberere und festere Schweißnähte und verbessert damit die strukturelle Integrität kritischer Kriegsausrüstung. "
improved_power_plant_desc:	"Durch die Modernisierung von Kohle- und Wasserkraftwerken werden wir die nationale Energieproduktion und Versorgungssicherheit steigern. Verbesserte Turbinenkonstruktionen, eine optimierte Brennstoffverbrennungseffizienz und bessere Kühlsysteme werden es den Kraftwerken ermöglichen, mit weniger Ressourcen mehr Strom zu erzeugen."
improved_power_plant_ii_new_desc:	"Durch den Bau von Kraftwerken der nächsten Generation werden wir von Anfang an modernste Konstruktionsverbesserungen in neue Anlagen integrieren. Hochleistungsturbinen, verbesserte Brennstoffumwandlungsverfahren und automatisierte Steuerungssysteme werden eine deutlich höhere Energieausbeute ermöglichen."
improved_power_plant_ii_upgrade:0	" Pläne zur Modernisierung von Kraftwerken"
improved_power_plant_ii_upgrade_desc:	"Durch die Nachrüstung bestehender Kraftwerke mit modernen Turbinen, Wärmetauschern und Brennkammern werden wir deren Betriebsdauer verlängern und die Effizienz verbessern. Dieser Ansatz legt den Schwerpunkt auf die Modernisierung der bestehenden Infrastruktur statt auf den Bau völlig neuer Anlagen."
improved_power_plant_iii:	"Fortschrittliche Kraftwerke"
improved_power_grid_i:0	"Verbessertes Stromnetz"
improved_power_grid_i_desc:	"Durch den Ausbau unseres nationalen Stromverteilungsnetzes werden wir Übertragungsverluste reduzieren und eine stabilere Energieversorgung gewährleisten. Verbesserte Umspannwerke und Stromleitungen mit höherer Kapazität werden es Industrie und städtischen Zentren ermöglichen, effizienter auf Strom zuzugreifen."
improved_power_grid_ii:0	"Modernes Stromnetz"
improved_power_grid_ii_desc:	"Durch die Standardisierung von Hochspannungsleitungen und die Modernisierung von Umspannwerken werden wir Stromverluste weiter reduzieren und den zuverlässigen Zugang zu Strom auf neue Industriezentren und militärische Einrichtungen ausweiten."
improved_power_grid_iii_efficient:0	"Modernes Stromnetz"
improved_power_grid_iii_efficient_desc:	"Durch die Stärkung des nationalen Stromnetzes mit Hochleistungs-Übertragungsleitungen, verbesserten Schaltanlagen und redundanten Ausfallsicherungen werden wir eine unterbrechungsfreie Stromversorgung für kritische Industriezweige, Forschungseinrichtungen und militärische Anlagen gewährleisten."
improved_power_grid_iv_efficient:0	"Hochspannungsnetz"
improved_power_grid_iv_efficient_desc:	"Durch den Aufbau eines nationalen Hochspannungsübertragungsnetzes werden wir die Stromverteilung über große Entfernungen erheblich verbessern. Dies wird Stromverluste reduzieren, einen stabilen Energiefluss zu abgelegenen Industriezentren gewährleisten und die Expansion energieintensiver Fertigungssektoren ermöglichen."
improved_power_grid_iii_output:0	"Ausbau des ländlichen Stromnetzes"
improved_power_grid_iii_output_desc:	"Durch die Ausweitung der Strominfrastruktur auf ländliche Regionen werden wir die Effizienz der Landwirtschaft steigern, neue Industriezweige mit Strom versorgen und das allgemeine Wirtschaftswachstum fördern. Elektrifizierte landwirtschaftliche Betriebe und Dörfer werden zur Nahrungsmittelproduktion und zur Mobilisierung von Arbeitskräften beitragen."
