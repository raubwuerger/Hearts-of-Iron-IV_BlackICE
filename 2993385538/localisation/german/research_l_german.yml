artillery_industry_desc:	"Durch die Einrichtung von Artilleriewerkstätten werden wir die Wartung und Produktion von Feldgeschützen verbessern und sicherstellen, dass die Einheiten an der Front zuverlässige Feuerunterstützung erhalten. Diese kleinen Einrichtungen werden kleinere Reparaturen und eine begrenzte Fertigung ermöglichen."
ship_industry_desc:	"Durch die Einrichtung spezieller Schiffswerkstätten werden wir die Instandhaltung und begrenzte Produktion von Marineschiffen verbessern. Diese kleinen Einrichtungen werden kleinere Reparaturen und Aufrüstungen unserer Flotte ermöglichen."
sub_industry_desc:	"Durch die Einrichtung kleinerer U-Boot-Werkstätten werden wir die Wartung und kleinere Reparaturen für unsere Unterwasserflotte verbessern. Diese Einrichtungen werden sicherstellen, dass die U-Boote auch bei längeren Kampagnen einsatzfähig bleiben."
artillery_industry2_desc:	"Durch die Ausweitung der Artillerieproduktion in großem Maßstab werden wir die Herstellungsgeschwindigkeit beschleunigen und die Qualität der Waffen insgesamt verbessern. Standardisierte Entwürfe und Fließbandproduktion werden eine konstante Versorgung mit Feldartillerie und schweren Geschützen gewährleisten."
Ltaircraft_industry2:	"Flugzeugfabrik"
Ltaircraft_industry2_desc:	"Durch die Umstellung auf eine groß angelegte Flugzeugproduktion werden wir die Effizienz und den Ausstoß verbessern und gleichzeitig die Konsistenz des Designs sicherstellen. Spezielle Produktionslinien und erweiterte Ressourcen werden einen schnellen Einsatz von Jagdflugzeugen, Bombern und Unterstützungsflugzeugen ermöglichen."

sub_industry2_desc:	"Durch die Ausweitung der U-Boot-Produktion in vollem Umfang werden wir die Fertigungseffizienz und den Ausstoß erhöhen. Eine rationalisierte Rumpfmontage, bessere Logistik und verfeinerte Bautechniken werden eine schnellere Bereitstellung neuer U-Boote ermöglichen."
artillery_industry3_desc:	"Durch die Entwicklung großer Artillerieproduktionszentren werden wir die Produktionskapazität und die technologische Innovation maximieren. Gießereien mit hohem Durchsatz und Präzisionsbearbeitung werden die Massenproduktion schwerer Artillerie ermöglichen und so eine anhaltende Feuerkraft in langen Gefechten gewährleisten."
ship_industry3_desc:	"Durch die Entwicklung großer Schiffbauanlagen werden wir die Produktionskapazität und Effizienz maximieren. Hochleistungswerften, optimierte Montagetechniken und fortschrittliche Technik werden sicherstellen, dass wir schnell eine moderne Seestreitmacht einsetzen und unterhalten können."
sub_industry3:	"Große U-Boot-Fabriken"

aa_emplacement_construction2_desc:	"Durch die Verfeinerung von Bautechniken und die Integration von modularen Konstruktionsprinzipien werden wir die Entwicklung von Luftabwehrstellungen beschleunigen. Vorgefertigte Strukturen und standardisierte Montageverfahren werden es uns ermöglichen, Verteidigungsnetze mit größerer Effizienz zu errichten und die Anfälligkeit für plötzliche Luftangriffe zu verringern."
aa_emplacement_construction4_desc:	"Durch den Einsatz spezieller technischer Einheiten für die Luftverteidigung und die Bevorratung wichtiger Materialien werden wir die Ausfallzeiten für beschädigte Luftabwehrstellungen minimieren. Notfallteams sorgen für eine schnelle Wiederherstellung der statischen Verteidigung, um Lücken in der Abdeckung zu verringern und eine anhaltende Bedrohung für feindliche Bomber und Jäger aus der Luft zu gewährleisten."
aa_emplacement_construction5_desc:	"Durch die vollständige Koordinierung von Logistik, Bau und Reparaturprotokollen für die Luftverteidigung werden wir ein sich selbst tragendes Netz von Luftabwehrstellungen aufbauen. Automatisierte Überwachungssysteme und zentralisierte Kommandostrukturen werden eine nahtlose Wartung und Erweiterung gewährleisten, so dass wir neue Verteidigungsanlagen errichten oder beschädigte Anlagen mit beispielloser Effizienz reparieren können. Diese Fortschritte werden einen nahezu undurchdringlichen Schutzschild über unseren strategischen Anlagen schaffen."
fluoridated_water_supply_desc:	"Durch die Einführung der Fluoridbehandlung in öffentlichen Wassersystemen werden wir die Zahngesundheit und das allgemeine Wohlbefinden der Bevölkerung erheblich verbessern. Die Verringerung von Karies und anderen damit zusammenhängenden Krankheiten wird zu einer gesünderen Belegschaft, weniger medizinischen Belastungen und einer stärkeren nationalen Moral führen. Eine Bevölkerung, die frei von vermeidbaren Gesundheitsproblemen ist, wird natürlich auch langfristig von der Produktivität und der Stabilität der Gesellschaft profitieren!"
improved_military_logistics_desc:	"Durch die Verbesserung unserer Versorgungsketten, Transportnetze und Verteilungsmethoden werden wir sicherstellen, dass Truppen, Ausrüstung und Ressourcen effizienter an die Front gelangen. Standardisierte Nachschubverfahren, bessere Lagermöglichkeiten und eine bessere Koordination zwischen Schienen-, Straßen- und Seetransport werden Verzögerungen minimieren und Verschwendung reduzieren. Diese Fortschritte werden die operative Ausdauer erhöhen, so dass unsere Streitkräfte längere Einsätze mit zuverlässiger logistischer Unterstützung durchhalten können."
military_production_i_desc:	"Durch den Ausbau unserer industriellen Kapazitäten und die Zentralisierung der militärischen Beschaffung werden wir die Grundlage für eine groß angelegte Waffenproduktion schaffen. Standardisierte Montageprozesse und ein verbessertes Management der Versorgungskette werden es uns ermöglichen, die Ausrüstung effizienter herzustellen und einen stetigen Fluss von Waffen, Fahrzeugen und Nachschub für unsere Streitkräfte zu gewährleisten."

military_production_ii_desc:	"Durch die vollständige Umsetzung von Skaleneffekten werden wir die Geschwindigkeit und Effizienz der militärischen Produktion erheblich steigern. Rationalisierte Fabriklayouts, Massenproduktionstechniken und die Spezialisierung der Arbeitskräfte werden die Kosten senken und Engpässe beseitigen, so dass wir Kriegsmaterial in noch nie dagewesenen Mengen produzieren können, ohne Abstriche bei der Qualität zu machen."
military_production_iii:	"Totale Kriegsindustrialisierung"
military_production_iii_desc:	"Indem wir die Vorteile unserer für den Krieg mobilisierten Wirtschaft nutzen, werden wir die Produktionsleistung durch optimierte Ressourcenzuweisung, erweiterte Arbeitskräftepools und unerbittliche Effizienzsteigerungen maximieren. Die Umrüstung von Fabriken, Rund-um-die-Uhr-Schichten und kampforientierte Innovationen werden sicherstellen, dass unsere Streitkräfte schneller versorgt werden, als der Feind sie aufbrauchen kann. Dieses Maß an industriellem Engagement sorgt für die materielle Überlegenheit, die für eine anhaltende Kriegsführung erforderlich ist."
sp_allow_assault_rifle_early_tt:0	"Reduziert die Technologieanforderungen für das Sonderprojekt §YAssault Rifle§! erheblich."
improved_glass_optics_desc:	"Durch die Verfeinerung von Präzisionsglasherstellungstechniken werden wir die optische Qualität von Teleskopen, Mikroskopen und militärischen Entfernungsmessern verbessern. Dies wird die Genauigkeit von Fernzielen, die wissenschaftliche Forschung und die industriellen Inspektionsmöglichkeiten verbessern."
modern_microscopes_desc:	"Durch die Entwicklung fortschrittlicher Mikroskope werden wir unsere Fähigkeit verbessern, metallurgische Strukturen zu analysieren, Fertigungsprozesse zu verfeinern und medizinische Forschung zu betreiben. Eine verbesserte optische Vergrößerung wird Durchbrüche in der Chemie, im Ingenieurwesen und in der Kernphysik beschleunigen."
environmental_recognition_desc:	"Durch die Umstellung von der kleinbäuerlichen auf die großindustrielle Landwirtschaft werden wir die Effizienz der Nahrungsmittelproduktion drastisch steigern. Mechanisierte Geräte, größere Anbauflächen und verbesserte Bewässerungsmethoden werden den Arbeitsaufwand verringern und eine stabile Nahrungsmittelversorgung sowohl für den zivilen als auch den militärischen Bedarf sicherstellen."
early_tractors_desc:	"Durch die Einführung der ersten benzin- und dieselbetriebenen Traktoren werden wir die von Tieren gezogenen Pflüge ersetzen und die Geschwindigkeit und Effizienz der Feldarbeit erheblich steigern. Diese Maschinen werden es den Landwirten ermöglichen, größere Flächen mit weniger Arbeitskräften zu bewirtschaften und so die landwirtschaftliche Gesamtleistung zu verbessern."
early_pesticides_desc:	"Durch die Entwicklung frühzeitiger chemischer Pestizide werden wir die Pflanzen vor Insektenbefall und Krankheiten schützen und so eine stabile landwirtschaftliche Produktion gewährleisten. Diese Behandlungen sind zwar noch unausgereift, aber sie werden die durch Schädlinge verursachten Verluste verringern und es den Landwirten ermöglichen, auch in Kriegszeiten und darüber hinaus hohe Ernteerträge zu erzielen."
industral_farms_i_desc:	"Indem wir ein Gleichgewicht zwischen Ackerbau und Viehzucht herstellen, werden wir widerstandsfähigere und sich selbst erhaltende Betriebe schaffen. Der Dung aus der Viehhaltung wird den Boden anreichern und die Abhängigkeit von Kunstdünger verringern, während eine diversifizierte Landwirtschaft sowohl Ernährungssicherheit als auch wirtschaftliche Stabilität für ländliche Gemeinschaften bietet."
crop_farms_i_desc:	"Indem wir ertragreiche Fruchtfolgetechniken bevorzugen, werden wir die Bodenfruchtbarkeit maximieren und eine konstante Nahrungsmittelproduktion gewährleisten. Die Umsetzung strategischer Anbauzyklen wird die Erschöpfung der Böden verringern, die Erträge steigern und eine zuverlässige Versorgung mit Grundnahrungsmitteln zur Unterstützung unserer Bevölkerung und unserer Kriegsanstrengungen gewährleisten."
meat_farms_i_desc:	"Durch selektive Zucht und verbesserte Futtermittelprogramme werden wir die Produktivität der Viehzucht steigern. Dieser Ansatz wird zu größeren und gesünderen Herden führen und die Produktion von Fleisch, Milch und anderen wichtigen tierischen Produkten zur Unterstützung der Kriegswirtschaft und der Zivilbevölkerung steigern."


industral_farms_ii_desc:	"Durch die Einführung von Elektrozäunen werden wir die Viehhaltung und die Sicherheit der landwirtschaftlichen Betriebe verbessern. Diese Zäune werden die Verluste durch Raubtiere und umherstreunende Tiere verringern und gleichzeitig die Notwendigkeit einer ständigen menschlichen Überwachung minimieren, was zu effizienteren und kontrollierteren landwirtschaftlichen Betrieben führt."

meat_farms_iii_desc:	"Durch die Ausweitung der Veterinärmedizin werden wir die Gesundheit und Langlebigkeit des Viehbestands verbessern, den Ausbruch von Krankheiten verringern und die landwirtschaftliche Produktivität erhöhen. Fortschritte in der Parasitenbekämpfung, bei Impfungen für Tiere und in der Ernährungswissenschaft werden für eine gesündere und widerstandsfähigere Viehwirtschaft sorgen."
aluminium_industry_i_desc:	"Durch Investitionen in frühe Aluminiumproduktionsmethoden werden wir die Kapazitäten erweitern, um die wachsende militärische und industrielle Nachfrage zu decken. Dies wird eine ständige Versorgung mit leichtem Metall für den Flugzeug- und Fahrzeugbau sicherstellen."
aluminium_industry_ii_efficient_desc:	"Durch die Verfeinerung der Bauxitverarbeitung und der Elektrolyseverfahren werden wir die Energiekosten senken und die Aluminiumausbeute erhöhen. Dieser Fortschritt wird die Produktionsraten verbessern und eine nachhaltigere Versorgung mit wichtigen Leichtmetallen sicherstellen."
aluminium_industry_ii_output_desc:	"Durch die Entwicklung von Verfahren zur Raffination von Aluminiumoxid mit hoher Ausbeute werden wir die Effizienz der Gewinnung von Rohaluminium steigern. Größere Anlagen und verbesserte Raffinerietechniken werden sicherstellen, dass unsere Aluminiumindustrie mit der Nachfrage in Kriegszeiten Schritt halten kann."
aluminium_industry_iii_desc:	"Durch die Umstrukturierung unserer Aluminiumproduktionsanlagen werden wir Ineffizienzen beseitigen, den Betrieb vergrößern und ertragreiche Raffinationstechniken einführen. Dies wird sicherstellen, dass Aluminiumengpässe die Flugzeug- und Fahrzeugproduktion nicht behindern."
 


steel_industry_ii_desc:	"Indem wir der militärischen Stahlproduktion Priorität einräumen, werden wir die Effizienz der Schmelz- und Raffinationsprozesse erhöhen. Die strategische Zuteilung von Ressourcen, die Erweiterung der Belegschaft und der optimierte Betrieb der Hochöfen werden die Stahlproduktion für die Kriegsanstrengungen maximieren."
alloy_steel_desc:	"Durch die Entwicklung von Hochleistungsstahllegierungen werden wir stärkere und haltbarere Materialien für moderne militärische Anwendungen herstellen. Diese neuen Legierungen werden Panzerungen, Flugzeugrahmen und Schiffsrümpfe verbessern und unsere Kriegsmaschinen widerstandsfähiger gegen feindliches Feuer machen."
steel_industry_iii_desc:	"Indem wir unsere Stahlproduktion für den Krieg vollständig modernisieren und skalieren, werden wir die Automatisierung, die hocheffiziente Verhüttung und die Strategien für das Ressourcenmanagement integrieren, um die Stahlproduktion an ihre absoluten Grenzen zu bringen. Dies wird sicherstellen, dass unsere Fabriken, Werften und Waffenproduktionslinien niemals unter Engpässen leiden."
steel_industry_iv_coal_desc:	"Durch die Verfeinerung der Produktion von kohlenstoffarmem Stahl werden wir zähere und leichter zu bearbeitende Materialien herstellen. Diese Art von Stahl ist ideal für das Bauwesen, Fahrzeugrahmen und leichte militärische Anwendungen."
improved_power_plant_iii_desc:	"Durch den Einsatz der neuesten Dampf- und Wasserturbinentechnologien werden wir hocheffiziente Kraftwerke schaffen, die den nationalen Energiebedarf auch in Kriegszeiten decken können. Verbesserte Automatisierung und Hochdruckreaktoren werden die Zuverlässigkeit und Leistung erhöhen und unseren industriellen und militärischen Energiebedarf sichern."
improved_power_grid_iv_output_desc:	"Indem wir der Stromversorgung von Industriezweigen Priorität einräumen, ermöglichen wir es Hochleistungsproduktionsanlagen, mit höchster Effizienz zu arbeiten. Die erhöhte Verfügbarkeit von Energie wird die Waffenproduktion beschleunigen, die Schwerindustrie ankurbeln und die technologische Forschung unterstützen."
artillery_industry_desc:	"Durch die Einrichtung von Artilleriewerkstätten werden wir die Wartung und Produktion von Feldgeschützen verbessern und sicherstellen, dass die Einheiten an der Front zuverlässige Feuerunterstützung erhalten. Diese kleinen Einrichtungen werden kleinere Reparaturen und eine begrenzte Fertigung ermöglichen."
Ltaircraft_industry2_desc:	"Durch die Umstellung auf eine groß angelegte Flugzeugproduktion werden wir die Effizienz und den Ausstoß verbessern und gleichzeitig die Konsistenz des Designs sicherstellen. Spezielle Produktionslinien und erweiterte Ressourcen werden einen schnellen Einsatz von Jagdflugzeugen, Bombern und Unterstützungsflugzeugen ermöglichen."
sub_industry2_desc:	"Durch die Ausweitung der U-Boot-Produktion in vollem Umfang werden wir die Fertigungseffizienz und den Ausstoß erhöhen. Eine rationalisierte Rumpfmontage, bessere Logistik und verfeinerte Bautechniken werden eine schnellere Bereitstellung neuer U-Boote ermöglichen."
ship_industry3_desc:	"Durch die Entwicklung großer Schiffbauanlagen werden wir die Produktionskapazität und Effizienz maximieren. Hochleistungswerften, optimierte Montagetechniken und fortschrittliche Technik werden sicherstellen, dass wir schnell eine moderne Seestreitmacht einsetzen und unterhalten können."
sub_industry3_desc:	"Indem wir unsere U-Boot-Industrie vollständig modernisieren, werden wir die Produktion durch spezialisierte Werften und fortschrittliche Konstruktionsmethoden maximieren. Fließbänder mit hoher Kapazität werden die schnelle Bereitstellung größerer, leistungsfähigerer U-Boot-Flotten gewährleisten."
aa_emplacement_construction4_desc:	"Durch den Einsatz spezieller technischer Einheiten für die Luftverteidigung und die Bevorratung wichtiger Materialien werden wir die Ausfallzeiten für beschädigte Luftabwehrstellungen minimieren. Notfallteams sorgen für eine schnelle Wiederherstellung der statischen Verteidigung, um Lücken in der Abdeckung zu verringern und eine anhaltende Bedrohung für feindliche Bomber und Jäger aus der Luft zu gewährleisten."
 #EOF

