defence_works4:0	"Verteidigungsanlagen IV"
on_site4_desc:0	"Ein höherer Grad an Mechanisierung und bessere Routinen verbessern die Baukonstruktionen für eine noch schnellere Verschanzung."
pre_fab4:0	"Vorfabrikation IV"
infra_works4_desc:0	"Ein höherer Grad an Mechanisierung und bessere Routinen verbessern die Geschwindigkeit beim Bau von Gebäuden und ermöglichen den Bau von Infrastruktur, sowohl zivil als auch militärisch, mit einer noch höheren Geschwindigkeit."
 ### Level III construction
road_infra4:0	"Straßennetz IV"
road_infra4_desc:0	"Ein höherer Grad an Mechanisierung und bessere Routinen verbessern den Bau von Straßen, was unsere militärischen Bewegungen schneller und weniger schwierig macht."
air_infra4_desc:0	"Ein höherer Grad an Mechanisierung und bessere Routinen verbessern die Baugeschwindigkeit von Luftwaffenstützpunkten weiter."
port_infra4:0	"Werften IV"
civ_works4_desc:0	"Ein höherer Grad an Mechanisierung und bessere Routinen verbessern die Baugeschwindigkeit unserer zivilen Bauten weiter."
housing_work4:0	"Wohnungsbau IV"
hospital_work4:0	"Krankenhaus IV"
schools_work4_desc:0	"Ein höherer Grad an Mechanisierung und bessere Routinen verbessern die Baugeschwindigkeit unserer Schul- und Ausbildungszentren für das Militär, damit sie die Soldaten noch besser und effizienter lehren, lernen und ausbilden können."
defence_works5:0	"Verteidigungsanlagen V"
on_site5:0	"Verschanzungsgeschwindigkeit V"
rail_infra5:0	"Schienennetz V"
