GER_early_coastal_submarine_2_desc:0	"U-Boote sind getarnte Schiffe, die dazu bestimmt sind, ungeschützte Konvois anzugreifen. Die frühen Modelle aus dem Ersten Weltkrieg ebnen den Weg für neue Methoden der Seekriegsführung."
