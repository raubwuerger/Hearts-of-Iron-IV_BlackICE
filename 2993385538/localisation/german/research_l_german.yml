 ### Level I construction
road_infra2_desc:0	"Die Modernisierung unserer Werkzeuge und Ausrüstungen wird unsere Bauanstrengungen weiter unterstützen, um noch bessere Straßen zu bauen, die unsere militärischen Bewegungen weniger schwierig und schneller machen."
air_infra2:0	"Luftwaffenstützpunkt II"
port_infra2_desc:0	"Die Modernisierung unserer Werkzeuge und Ausrüstungen wird uns helfen, Werften noch schneller zu bauen."
civ_works2:0	"Zivile Bauwirtschaft II"
civ_works2_desc:0	"Die Modernisierung unserer Werkzeuge und Ausrüstungen wird uns dabei helfen, zivile Bauten mit höherer Geschwindigkeit zu errichten."
hospital_work2:0	"Krankenhaus II"
hospital_work2_desc:0	"Durch die Modernisierung unserer Werkzeuge und Ausrüstungen werden wir unsere Bemühungen zur Verbesserung der Krankenhäuser weiter vorantreiben."
schools_work2_desc:0	"Die Modernisierung unserer Werkzeuge und Ausrüstungen wird uns dabei helfen, den Bau von Schulen und Ausbildungsstätten für das Militär weiter zu verbessern."
aa_emplacement_construction3:0	"Luftverteidigungsinitiative III"
on_site3_desc:0	"Durch den Einsatz moderner Fahrzeuge und die Erfahrung aus unseren Fortschritten im Bauwesen können Reparaturen erheblich beschleunigt werden."
pre_fab3:0	"Vorfabrikation III"
infra_works3_desc:0	"Der Einsatz moderner Fahrzeuge und die Erfahrung aus unseren Fortschritten im Bauwesen können genutzt werden, um Reparaturen erheblich zu beschleunigen und die zivile und militärische Infrastruktur noch schneller zu errichten."
 ### Level II construction
rail_infra3_desc:0	"Der Einsatz moderner Fahrzeuge und die Erfahrung aus unseren Fortschritten im Bauwesen können genutzt werden, um Reparaturen erheblich zu beschleunigen und die für die Produktion von zivilen und militärischen Gütern benötigten Güter zu liefern."
road_infra3:0	"Straßennetz III"
air_infra3:0	"Luftwaffenstützpunkt III"
port_infra3:0	"Werften III"
port_infra3_desc:0	"Durch den Einsatz moderner Fahrzeuge und die Erfahrung aus unseren Fortschritten im Bauwesen können Reparaturen wesentlich schneller durchgeführt und Werften mit noch höherer Geschwindigkeit gebaut werden."
civ_works3_desc:0	"Durch den Einsatz moderner Fahrzeuge und die Erfahrung aus unseren Fortschritten im Bauwesen können Reparaturen an unseren zivilen Bauten wesentlich schneller durchgeführt werden."
housing_work3:0	"Wohnungsbau III"
