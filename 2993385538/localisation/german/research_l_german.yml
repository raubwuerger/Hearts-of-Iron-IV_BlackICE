heavy_industry2:0	"Gummifabrik"
heavy_industry2_desc:0	"Ein Netzwerk von Fabriken zur synthetischen Destillation und Raffination von Erdölprodukten ist der nächste Schritt zur Sicherung der Kraftstoffversorgung unseres Landes."
heavy_industry3_desc:0	"Die Übertragung bisher experimenteller Destillationsmethoden auf den großtechnischen Betrieb wird es uns ermöglichen, uns besser an die verfügbaren Materialien und den Bedarf anzupassen."
oil_plant:0	"Ölanlage"
oil_plant_desc:0	"Ein Netzwerk von Fabriken zur synthetischen Destillation und Raffination von Ölprodukten ist der nächste Schritt zur Sicherung der Treibstoffversorgung unseres Landes."
advanced_oil_plant:0	"Fortgeschrittene Ölfabrik"
aa_emplacement_construction_desc:	"Durch die Zuweisung von Ressourcen für die Luftabwehrinfrastruktur werden wir die Geschwindigkeit verbessern, mit der stationäre Luftabwehrstellungen und deren unterstützende Einrichtungen errichtet werden. Eine optimierte logistische Planung und die Ausbildung spezialisierter Arbeitskräfte werden einen schnelleren Einsatz wesentlicher Verteidigungsanlagen ermöglichen und so sicherstellen, dass kritische militärische und industrielle Standorte besser vor feindlichen Luftangriffen geschützt sind."
on_site:0	"Digin Speed I"
pre_fab_desc:0	"Verbesserte Methoden und Materialien ermöglichen es uns, Land- und Küstenfestungen schneller zu errichten."
infra_works:0	" Infrastrukturarbeiten I"
infra_works_desc:0	"Verbesserte Methoden und Materialien ermöglichen es uns, zivile und militärische Infrastruktur schneller zu errichten."
road_infra:0	"Straßennetz I"
road_infra_desc:0	"Verbesserte Methoden und Materialien ermöglichen es uns, Straßen schneller zu bauen."
air_infra_desc:0	"Dank verbesserter Methoden und Materialien können wir Luftwaffenstützpunkte schneller errichten."
civ_works_desc:0	"Dank verbesserter Methoden und Materialien können wir zivile Bauwerke schneller errichten."
housing_work_desc:0	"Verbesserte Methoden und Materialien ermöglichen es uns, zivile Wohnhäuser schneller zu errichten."
hospital_work:0	"Krankenhaus I"
schools_work_desc:0	"Verbesserte Methoden und Materialien ermöglichen es uns, bessere Schulen und Ausbildungszentren zu errichten."
defence_works2:0	"Verteidigungsanlagen II"
defence_works2_desc:0	"Verbesserte Methoden ermöglichen es uns, mehr Soldaten zu verschanzen."
on_site2_desc:0	"Die Modernisierung unserer Werkzeuge und Ausrüstung wird unsere Bauarbeiten weiter unterstützen, um die Verschanzung der Soldaten noch schneller voranzutreiben."
pre_fab2:0	"Vorfertigung II"
infra_works2:0	"Infrastrukturarbeiten II"
infra_works2_desc:0	"Die Modernisierung unserer Werkzeuge und Ausrüstung wird unsere Bauarbeiten weiter unterstützen, um sowohl zivile als auch militärische Infrastruktur schneller zu errichten." "
rail_infra2:0	"Eisenbahnnetz II"
rail_infra2_desc:0	"Die Modernisierung unserer Werkzeuge und Ausrüstung wird unsere Bauarbeiten weiter unterstützen, um Eisenbahnstrecken schneller zu errichten, damit wir die Güter liefern können, die zur Herstellung ziviler und militärischer Güter benötigt werden."
road_infra2:0	"Straßennetz II"
air_infra2_desc:0	"Die Modernisierung unserer Werkzeuge und Ausrüstung wird unsere Bauarbeiten zum schnelleren Bau von Luftwaffenstützpunkten weiter unterstützen."
port_infra2:0	"Werften II"
housing_work2:0	"Wohnungsbau II"
housing_work2_desc:0	"Die Modernisierung unserer Werkzeuge und Ausrüstung wird unsere Bauarbeiten zum schnelleren Bau von zivilen Wohngebäuden weiter unterstützen."
schools_work2:0	"Schulen II"
defence_works3:0	"Verteidigungsanlagen III"
defence_works3_desc:0	"Der Einsatz moderner Fahrzeuge und die Erfahrungen aus unseren Fortschritten im Bauwesen können genutzt werden, um Reparaturen an Verteidigungsanlagen wesentlich schneller durchzuführen."
aa_emplacement_construction3_desc:	"Durch die Verstärkung unserer Luftabwehrinfrastruktur werden wir sowohl die Widerstandsfähigkeit als auch die Reparatureffizienz steigern. Verstärkte Bunker, verstärkte Geschützplattformen und verbesserte Tarntechniken werden unsere Verteidigungsanlagen schwerer zu neutralisieren machen, während verbesserte Wartungsverfahren dafür sorgen, dass sie auch unter anhaltendem Beschuss einsatzfähig bleiben."
on_site3:0	"Digin Speed III"
pre_fab3_desc:0	"Der Einsatz moderner Fahrzeuge und die Erfahrungen aus unseren Fortschritten im Bauwesen können genutzt werden, um Reparaturen erheblich zu beschleunigen und Land- sowie Küstenfestungen noch schneller zu errichten."
infra_works3:0	"Infrastrukturarbeiten III"
rail_infra3:0	"Eisenbahnnetz III"
road_infra3_desc:0	"Der Einsatz moderner Fahrzeuge und die Erfahrungen aus unseren Fortschritten im Bauwesen können genutzt werden, um Reparaturen an noch besseren Straßen erheblich zu beschleunigen, was unsere militärischen Bewegungen schneller und weniger schwierig macht."
air_infra3_desc:0	"Der Einsatz moderner Fahrzeuge und die Erfahrungen aus unseren Fortschritten im Bauwesen können genutzt werden, um Reparaturen wesentlich schneller durchzuführen und Luftwaffenstützpunkte noch schneller zu errichten."
civ_works3:0	"Zivile Bauvorhaben III"
schools_work3:0	"Schulen III"
schools_work3_desc:0	"Der Einsatz moderner Fahrzeuge und die Erfahrungen aus unseren Fortschritten im Bauwesen können genutzt werden, um die Ausbildung und das Training des Militärs noch besser und effizienter zu gestalten."
defence_works4_desc:0	"Ein höherer Grad an Mechanisierung und bessere Abläufe verbessern den Bau unserer Verteidigungsanlagen weiter. "
