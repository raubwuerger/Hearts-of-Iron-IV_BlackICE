tech_usn_patrol_submarine_1:1	"Schnelles U-Boot-Programm V-boat"


tech_usn_patrol_submarine_1b_desc:0	"Die V-Boote waren eine Gruppe von neun U-Booten der United States Navy, die zwischen dem Ersten und dem Zweiten Weltkrieg von 1921 bis 1934 gebaut wurden. Es handelte sich dabei nicht um eine Schiffsklasse im üblichen Sinne einer Reihe von nahezu identischen Schiffen, die nach demselben Entwurf gebaut wurden, sondern um eine gemeinsame Zulassung im Rahmen des "Flottenboot"-Programms. Der Begriff "V-Boote" wird für fünf verschiedene U-Boot Klassen verwendet. Sie gliedern sich in drei große, schnelle Flotten-U-Boote (V-1 bis V-3), drei große Langstrecken-U-Boote (V-4 bis V-6) und drei mittelgroße U-Boote (V-7 bis V-9). Diese Technologie steht für V-4 bis V-6."
tech_usn_patrol_submarine_1c:0	"Flotten-U-Boot-Programm für mittlere Reichweite V-Boot"







tech_usn_patrol_submarine_9_guppy:0	"Tench Klasse (GUPPY)"
tech_usn_patrol_submarine_9_guppy_desc:0	"Das Greater Underwater Propulsion Power Program (GUPPY) wurde von der US-Marine nach dem Zweiten Weltkrieg initiiert, um die Unterwassergeschwindigkeit, Manövrierfähigkeit und Ausdauer ihrer U-Boote zu verbessern. (Das "Y" in der Abkürzung wurde aus Gründen der Aussprechbarkeit hinzugefügt.) Die Marine begann das Programm, indem sie zwei erbeutete deutsche U-Boote vom Typ XXI testete und nachbaute: U-2513 und U-3008. Aus dieser Analyse ergaben sich vier Ziele: die Erhöhung der Batteriekapazität der U-Boote, die Verschlankung der Bootsstruktur, der Einbau von Schnorcheln und die Verbesserung der Feuerleitanlagen. Die Marine konzentrierte sich sofort auf den Entwurf einer neuen U-Boot Klasse, aber das Bureau of Ships war der Meinung, dass die bestehenden U-Boote der Balao und Tench Klasse so modifiziert werden könnten, dass sie die gewünschten Verbesserungen enthielten."
