bicycle_infantry:0	"Fahrrad-Infanterie"
bicycle_infantry_desc:0	"Regelmäßige Infanterie mit Fahrrädern ist mobiler als ihre marschierenden Gegenstücke, und das zu einem sehr bescheidenen Preis."
amphibious_mechanized_infantry:0	"Amphibische Fahrzeuge"
amphibious_mechanized_infantry_2_desc:0	"Diese Amtracs weisen einige Verbesserungen gegenüber der Basisversion auf, wie z. B. eine hintere Laderampe, die das Entladen am Strand erleichtert."
amphibious_tank_2:0	"Verbesserter amphibischer Panzer"
NAVAL_TITLE_MINES:0	"MINENKRIEGSFÜHRUNG"
basic_naval_mines:0	"Kontaktmine"
improved_naval_mines_desc:0	"Diese hochentwickelte Mine explodiert, wenn sie Veränderungen im Magnetfeld eines vorbeifahrenden Schiffes feststellt."
modern_naval_mines:0	"Druckmine"
modern_naval_mines_desc:0	"Diese hochmoderne Mine erkennt kleine Veränderungen des Wasserdrucks, die durch ein vorbeifahrendes Schiff verursacht werden."
degaussing_desc:0	"Durch den Einbau leistungsfähiger elektromagnetischer Spulen kann die magnetische Signatur eines Schiffes drastisch reduziert werden, so dass es weit weniger anfällig für Magnetminen ist."
submarine_mine_laying:0	"Minenlegendes U-Boot"
improved_submarine_mine_laying_desc:0	"Durch die Umgestaltung von Minen, die in Torpedorohre passen, kann jedes U-Boot zu einem Minenleger werden, wenn auch auf Kosten der mitgeführten Torpedos."
airsweep_mines:0	"Minenräumung aus der Luft"
airsweep_mines_desc:0	"Flugzeuge können mit spezieller Ausrüstung ausgestattet werden, um Seeminen aus der Luft aufzuspüren und sicher zur Explosion zu bringen."
concentrated_industry_category:0	"Konzentrierte Industrie"
dispersed_industry_category:0	"Dislozierte Industrie"
NAVAL_TITLE_DAMAGE_CONTROL:0	"SCHADENSKONTROLLE"
early_ship_hull_carrier_short:0	"Flugzeugträger-Rumpf (früh)"
cruiser_submarines:0	"Kreuzer U-Boot-Rumpf"
improved_fire_control_system:0	"Verbessertes Feuerleitsystem"
improved_fire_control_system_desc:0	"Durch Eingabe von Kurs, Geschwindigkeit und Entfernung eines Ziels kann ein mechanischer Computer genau vorhersagen, wo sich das Ziel befinden wird, wenn die nächste Salve feuerbereit ist."
sonar:0	"Frühes Hydrophon"
improved_sonar_desc:0	"Verbesserungen der Hydrophontechnik ermöglichen eine einfachere Erkennung und Ortung von Schallquellen."
smoke_generator:0	"Raucherzeuger"
basic_depth_charges:0	"Einfache Wasserbomben"
basic_depth_charges_desc:0	"Ein einfacher Sprengstoffbehälter mit einem druckempfindlichen Auslöser explodiert, wenn er eine bestimmte Tiefe erreicht."
advanced_depth_charges:0	"Wasserbomben-Mörser (Depth Charge Mortar)"
modern_depth_charges_desc:0	"Eine größere Treibladung wirft eine richtige, auf eine bestimmte Tiefe eingestellte Wasserbombe aus größerer Entfernung auf ein U-Boot."
improved_airplane_launcher:0	"Verbessertes Flugzeugkatapult"
basic_cruiser_armor_scheme:0	"Grundlegende Kreuzer Panzerungsentwürfe"
basic_cruiser_armor_scheme_desc:0	"Ein Panzerungsentwurf, das die Aufteilung zwischen Gürtel- und Deckspanzerung der Großkampfschiffe kopiert und einen gewissen Schutz gegen Splitter und kleinkalibrige Geschütze bietet."
advanced_cruiser_armor_scheme:0	"Fortgeschrittener Kreuzer Panzerungsentwurf"
basic_heavy_armor_scheme_desc:0	"Die Analyse und Erprobung früherer Panzerungssysteme hat zur Entwicklung alternativer Systeme geführt, die eine Reihe von Vorteilen bieten dürften."
improved_heavy_armor_scheme:0	"Fortgeschrittenes schwere Panzerungsentwürfe"
basic_torpedo:0	"Grundlegende Torpedo"
basic_torpedo_desc:0	"Eine selbstangetriebene Waffe mit einem explosiven Sprengkopf, der auf einem vorbestimmten Kurs läuft, bis er das Ziel unterhalb der Wasserlinie trifft. Der Torpedo ermöglicht es kleineren Überwasserschiffen und Tauchbooten, größere Schiffe zu beschädigen oder zu zerstören, ohne dass schwere Geschütze benötigt werden."
homing_torpedo:0	"Muster laufender Torpedo"
electric_torpedo_desc:0	"Ein Torpedo mit elektrischem Antrieb hinterlässt keine leicht zu entdeckende Luftblasenspur, sondern bleibt praktisch unsichtbar, bis er einschlägt. Das bedeutet auch, dass es keine Spur gibt, die zum abschießenden U-Boot zurückführt."
improved_ship_torpedo_launcher:0	"Verbesserte Torpedoabschussgeräte"
advanced_ship_torpedo_launcher:0	"Verbesserte Torpedos"
advanced_ship_torpedo_launcher_desc:0	"Entwicklungen in der Torpedotechnologie ermöglichen eine größere Reichweite und stärkere Sprengköpfe."
basic_submarine_snorkel_sub:0	"Grundlegender U-Boot-Schnorchel"
improved_submarine_snorkel_sub_desc:0	"Ein verbessertes Design verhindert, dass Wasser in die Motoren gesaugt wird, und reduziert außerdem das Radarecho des Schnorchelkopfes."
basic_battery:0	"Marine-Schützenwesen"
basic_light_battery:0	"Leichte Grundbatterie"
basic_light_battery_desc:0	"Eine offene, angetriebene Lafette für ein kleinkalibriges Geschütz zur Verwendung auf kleineren Schiffen."
advanced_light_battery:0	"Fortgeschrittene 70-115-mm-Batterie"
basic_light_shell_desc:0	"Ein Kompromiss zwischen panzerbrechender Wirkung und Sprengkraft. Diese Granate richtet deutlich mehr Schaden an, wenn sie die schwache Panzerung von leichten Schiffen durchschlägt."
improved_light_shell:0	"Kleinkalibrige panzerbrechende Granate"
basic_medium_battery:0	"Mittlere Grundbatterie"
basic_medium_battery_desc:0	"Ein angetriebener Geschützturm mit zwei oder drei Kanonen mittleren Kalibers für den Einsatz auf schweren Kreuzern."
advanced_medium_battery:0	"Erweiterte 135-160-mm-Batterie"
basic_medium_shell_desc:0	"Durch das Anbringen einer ballistischen Haube können die Geschosse aerodynamischer gestaltet werden, während ihre panzerbrechende Wirkung erhalten bleibt."
improved_medium_shell:0	"Mittelkalibrige panzerbrechende Granate"
basic_heavy_battery:0	"Schwere Grundbatterie"
basic_heavy_battery_desc:0	"Ein gigantischer Geschützturm mit massiven Kanonen unter schwerer Panzerung."
advanced_heavy_battery:0	"Erweiterte 250-310-mm-Batterie"
basic_heavy_shell_desc:0	"Durch das Anbringen einer ballistischen Haube können die Geschosse aerodynamischer gestaltet werden, ohne ihre panzerbrechende Wirkung zu verlieren."
improved_heavy_shell:0	"Schwere panzerbrechende Granate"
basic_secondary_battery:0	"Kasematten-Sekundärbatterie"
basic_secondary_battery_desc:0	"Diese kleineren Geschütze sind in Öffnungen entlang der Hülle untergebracht und bieten dem Schiff einen gewissen Schutz gegen kleinere Schiffe, haben aber nur ein begrenztes Schussfeld."
dp_secondary_battery:0	"Doppelt verwendbare Sekundärbatterie"
damage_control_1_desc:0	"Jedes Mitglied der Schiffsbesatzung, vom Kapitän bis hin zum einfachen Matrosen, muss in der Lage sein, bei der Eindämmung und Bekämpfung von Bränden an Bord des Schiffes mitzuhelfen."
damage_control_2:0	"Getrennte Feuerlöschleitungen"
damage_control_3:0	"Dieselgetriebene Notpumpen"
damage_control_3_desc:0	"Da die schweren Pumpen in der Regel von den Hauptmaschinen angetrieben werden, kann ein einziger, relativ leichter Treffer im Maschinenraum dazu führen, dass sich das Schiff nicht mehr über Wasser halten kann."
fire_control_methods_2:0	"Annäherungsschießen"
fire_control_methods_3_desc:0	"Durch das Hinzufügen kleiner Farbpakete zu den Granaten beim Abfeuern werden die Einschläge um das Ziel herum gefärbt, so dass mehrere Schiffe dasselbe Ziel bekämpfen können, ohne durch die Einschläge der anderen Schiffe verwirrt zu werden."
fuel_silos:0	"Treibstoffspeicher"
fuel_silos2:0	"Treibstofflagerung II"
fuel_silos2_desc:0	"Die Massenlagerung von Treibstoff erfordert ein komplexes System von Tanks, Rohrleitungen und Ventilen, um sowohl die Sicherheit als auch die Verfügbarkeit des Treibstoffs zu gewährleisten."
fuel_silos4:0	"Brennstofflagerung IV"
fuel_silos5_desc:0	"Die Massenlagerung von Kraftstoffen erfordert ein komplexes System von Tanks, Rohrleitungen und Ventilen, um sowohl die Sicherheit als auch die Verfügbarkeit des Kraftstoffs zu gewährleisten."
fuel_cans:0	"Tragbare Kraftstoffkanister"
fuel_refining:0	"Kraftstoffraffination I"
fuel_refining_desc:0	"Fortschritte beim chemischen Cracken ermöglichen eine bessere Ausbeute an leichten Kraftstoffen aus Öl."
fuel_refining3:0	"Kraftstoffraffination III"
fuel_refining4_desc:0	"Neue Entwicklungen in der Chemietechnik ermöglichen die Raffination von Kraftstoffen aus neuen Quellen."
fuel_refining5:0	"Kraftstoffraffination V"
######## BICE ############### ""
Interwar_AA_tech:0	"Luftabwehr in der Zwischenkrieg"
Late_1930s_AA_tech_desc:0	"Mit der Weiterentwicklung der Flugzeuge verbesserten die Seestreitkräfte ihre Flugabwehrsysteme (auch wenn sich diese bei Kriegsausbruch als unzureichend herausstellten), indem sie Systeme mit höherer Geschwindigkeit und mehreren Läufen sowie frühe Feuerleitsysteme zur Luftabwehr einsetzten."
######## BICE ###############
Late_War_AA_tech:0	"Fortschrittliche Flak-Systeme"
Late_War_AA_tech_desc:0	"Verbesserte Feuerleiteinrichtungen, motorisierte Ausbildung und Elevation in Verbindung mit Innovationen wie Munition mit Annäherungszünder verbesserten die Wirksamkeit der Flaksysteme der Marine erheblich."
Surface_search_radar_desc:0	"Die ersten Radargeräte waren sperrig und brauchten viel Strom, so dass sie praktisch nur auf größeren Schiffen installiert werden konnten.  Sie erwiesen sich als wertvolle Hilfe für die taktische Wahrnehmung der Schiffe, insbesondere bei schlechter Sicht."
air_warning_radar:0	"Luftwarnradar"
advanced_surface_search_radar_desc:0	"Die Entwicklung des Zentimeterwellen Radars ermöglichte die Installation von wesentlich leistungsfähigeren, aber auch wesentlich kleineren Radargeräten.  Dadurch verfügten größere Schiffe über ein noch besseres taktisches Bewusstsein, und kleinere Schiffe konnten ebenfalls Radar einsetzen."
advanced_fc_radar:0	"Radar zur Feuerleitung gegen Luftangriffe"
advanced_fc_radar_desc:0	"Weitere Verbesserungen des Radars führten dazu, dass es die Zielerfassung für die Flugabwehrwaffen der Schiffe unterstützte und so ein wesentlich präziseres Flakfeuer gegen ankommende Flugzeuge ermöglichte."
early_sonar_desc:0	"Das gegen Ende des Ersten Weltkriegs entwickelte und zunächst als ASDIC bezeichnete Sonar wurde damals als Mittel angesehen, das U-Boote in künftigen Kriegen unschädlich machen sollte.  Obwohl dies eine drastische Überschätzung der Fähigkeiten des Sonars war, waren diese frühen Geräte dennoch nützlich, um Überwasserschiffe in die Lage zu versetzen, untergetauchte Feinde zu bekämpfen."
depth_charge_throwers:0	"Wasserbomben-Werfer"
basic_sonar_desc:0	"Der Einsatz von Schall zum Aufspüren von Schiffen unter Wasser war (und ist) eine komplexe Wissenschaft, und die Sonarsysteme wurden zwischen dem Ende des Ersten und dem Ende des Zweiten Weltkriegs mehrfach weiterentwickelt"
advanced_sonar:0	"Fortschrittliches Sonar"
advanced_sonar_desc:0	"Diese Geräte sind die fortschrittlichsten Sonargeräte, die in dieser Zeit entwickelt wurden. Sie sind besser in der Lage, getauchte Angreifer aufzuspüren, und sind wichtig, um den immer besser werdenden U-Boot-Konstruktionen zu begegnen."
interwar_torpedoes_desc:0	"Nach dem Ersten Weltkrieg wurden die Torpedos weiterentwickelt, und die meisten der großen Nationen im Zweiten Weltkrieg verwendeten Torpedos, die in den 1920er und frühen 1930er Jahren entwickelt und erstmals in Dienst gestellt wurden."
magnetic_detonators:0	"Magnetische Annäherungszünder"
electric_torpedoes_desc:0	"Elektrische Torpedos waren leiser und hinterließen weitaus weniger Kielwasser (was es dem Ziel erschwerte, die herannahende Gefahr zu erkennen) und stellten einen weiteren bedeutenden Fortschritt in der Torpedotechnologie dar."
soviet_air_tech:0	"Woyenno-Wosduschnyje Sily"
soviet_air_tech_desc:0	"Die sowjetischen Luftstreitkräfte (russ: Военно-воздушные силы, tr. Voyenno-Vozdushnye Sily, wörtlich \"Militärische Luftstreitkräfte\") war die offizielle Bezeichnung einer der Luftstreitkräfte der Sowjetunion. Die andere waren die sowjetischen Luftverteidigungsstreitkräfte. Die Luftstreitkräfte wurden 1917 aus Teilen des kaiserlich-russischen Luftdienstes gebildet und erlebten ihre größte Bewährungsprobe während des Zweiten Weltkriegs."
