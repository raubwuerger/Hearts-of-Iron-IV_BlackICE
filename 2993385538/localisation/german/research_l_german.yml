on_site4:0	"Digin Speed IV"
pre_fab4_desc:0	"Ein höherer Mechanisierungsgrad und bessere Abläufe verbessern die Baugeschwindigkeit weiter und ermöglichen den Bau von Land- und Küstenfestungen mit noch höherer Geschwindigkeit."
infra_works4:0	"Infrastrukturarbeiten IV"
rail_infra4:0	"Eisenbahnnetz IV"
rail_infra4_desc:0	"Ein höherer Mechanisierungsgrad und bessere Arbeitsabläufe verbessern die Baugeschwindigkeit weiter, sodass wir die für die Produktion ziviler und militärischer Güter benötigten Materialien noch schneller und effizienter liefern können."
air_infra4:0	"Flugplatz IV"
port_infra4_desc:0	"Ein höherer Mechanisierungsgrad und verbesserte Arbeitsabläufe beschleunigen den Bau von Werften weiter."
civ_works4:0	"Zivile Bauvorhaben IV"
housing_work4_desc:0	"Ein höherer Mechanisierungsgrad und verbesserte Arbeitsabläufe steigern die Baugeschwindigkeit weiter."
hospital_work4_desc:0	"Ein höherer Mechanisierungsgrad und verbesserte Arbeitsabläufe steigern die Baugeschwindigkeit weiter, um unsere Krankenhäuser noch besser und effizienter zu machen." "
schools_work4:0	"Schulen IV"
defence_works5_desc:0	"Die Zukunft des effizienten Bauwesens erfordert eine umfassendere Planung für einzelne Projekte sowie, wo immer möglich, standardisierte Lösungen für unsere Verteidigungsanlagen."
aa_emplacement_construction5:0	"Initiative zur integrierten Luftverteidigung"
on_site5_desc:0	"Die Zukunft des effizienten Bauwesens erfordert eine umfassendere Planung für einzelne Projekte sowie standardisierte Lösungen, wo immer dies möglich ist."
pre_fab5:0	"Vorfertigung V"
pre_fab5_desc:0	"Die Zukunft des effizienten Bauwesens erfordert eine umfassendere Planung für einzelne Projekte sowie standardisierte Lösungen, wo immer dies möglich ist, damit Land- und Küstenfestungen noch schneller errichtet werden können."
infra_works5:0	"Infrastrukturarbeiten V"
infra_works5_desc:0	"Die Zukunft des effizienten Bauwesens erfordert eine umfassendere Planung für einzelne Projekte sowie standardisierte Lösungen, wo immer dies möglich ist, und den Bau von ziviler und militärischer Infrastruktur selbst bei höchster Geschwindigkeit."
road_infra5:0	"Straßennetz V"
road_infra5_desc:0	"Die Zukunft des effizienten Bauwesens erfordert eine umfassendere Planung für einzelne Projekte sowie, wo immer möglich, standardisierte Lösungen für Straßen, die unsere militärischen Bewegungen mit der höchstmöglichen Geschwindigkeit ermöglichen."
civ_works5:0	"Zivile Bauvorhaben V"
civ_works5_desc:0	"Die Zukunft des effizienten Bauwesens erfordert eine umfassendere Planung für einzelne Projekte sowie standardisierte Lösungen, wo immer dies möglich ist."
hospital_work5:0	"Krankenhaus V"
schools_work5_desc:0	"Die Zukunft des effizienten Bauwesens erfordert eine umfassendere Planung für einzelne Projekte sowie, wo immer möglich, standardisierte Lösungen für unsere Ausbildungs- und Trainingszentren des Militärs, damit dort die Soldaten möglichst effizient unterrichtet, ausgebildet und trainiert werden können."
small_ship_radar_desc:0	"Das Aufspüren feindlicher Flotten oder Flugzeuge auf See ist stets schwierig. Neue RADAR-Geräte bieten unseren Zerstörern und anderen kleinen Schiffen die Möglichkeit, den Feind aus großer Entfernung zu erkennen und ihn nach eigenem Ermessen anzugreifen oder ihm auszuweichen. Die Erforschung dieses RADAR-Geräts bedeutet, dass wir unsere Zerstörer und Fregatten aufrüsten und ihnen bessere Chancen beim Aufspüren von Schiffen, U-Booten und Flugzeugen verschaffen können."
medium_ship_radar:0	"Radar für alle Kreuzer"
big_ship_radar_desc:0	"Es ist stets schwierig, feindliche Flotten oder Flugzeuge auf See aufzuspüren. Neue RADAR-Geräte bieten unseren Großkampfschiffen und Flugzeugträgern die Möglichkeit, den Feind aus großer Entfernung zu erkennen und ihn nach eigenem Ermessen anzugreifen oder ihm auszuweichen. Die Erforschung dieses RADAR-Geräts bedeutet, dass wir unsere Großkampfschiffe aufrüsten und ihnen bessere Chancen beim Aufspüren von Schiffen und Flugzeugen verschaffen können."
electronic_computing_machine_desc:0	"Mechanische Rechenmaschinen sind langsam und können Fehler aufweisen, wenn ihre Teile klemmen oder verrutschen. Wenn wir elektronische Komponenten für unsere Rechenmaschinen entwickeln, werden diese effizienter arbeiten. Dies wird alle unsere anderen Forschungsprojekte beschleunigen. Der Bau dieser Maschinen, die zu fortgeschrittener Differentialanalyse fähig sind, wird die Art der maschinengestützten Berechnungen, die durchgeführt werden können, radikal verändern."
interwar_medartillery_desc:0	"Große, leistungsstarke Lastwagen zum Transport schwerer Waffen wie großer Artilleriegeschütze"
interwar_Hvartillery:0	"Antriebsmaschinen"
interwar_Hvartillery_desc:0	" Große Traktoren und Kettenfahrzeuge zum Transport sehr schwerer Ausrüstung wie schwerer Artillerie"
medartillery2_desc:0	"Die Aufrüstung alter Geschütze bringt uns nur bis zu einem gewissen Punkt weiter. Es werden neue Haubitzenkonstruktionen benötigt, die neue hydraulische Rückstoßvorrichtungen und längere Läufe nutzen."
medartillery5_desc:0	"Artilleriekonstruktionen mit niedrigerer Silhouette werden für den Feind schwieriger zu treffen sein."
Hvartillery1:0	"Grundlegende schwere Artillerie"
Hvartillery2_desc:0	"Die Aufrüstung alter Geschütze bringt uns nur bis zu einem gewissen Punkt weiter. Es werden neue Haubitzenkonstruktionen benötigt, die neue hydraulische Rückstoßvorrichtungen und längere Läufe nutzen."
Hvartillery3:0	"Verbesserung des Laufs schwerer Artilleriegeschütze"
Hvartillery3_desc:0	"Um schwerere Geschütze auf leichteren Lafetten zu ermöglichen, können Mündungsbremsen in die Haubitzenkonstruktionen integriert werden."
Hvartillery4:0	"Verbesserte schwere Artillerie"
Hvartillery5_desc:0	"Artilleriekonstruktionen mit niedrigerer Silhouette sind für den Feind schwieriger zu treffen."
superartillery1:0	"Küstenartillerie"
superartillery2:0	"Eisenbahnartillerie"
