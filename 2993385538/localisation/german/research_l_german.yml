tech_kr_cl_electric_torpedoes_desc:0	"Elektrische Torpedos waren leiser und hinterließen weitaus weniger Kielwasser (was es dem Ziel erschwerte, die herannahende Gefahr zu erkennen) und stellten einen weiteren bedeutenden Fortschritt in der Torpedotechnologie dar."
tech_kr_cl_advanced_torpedoes:0	"Fortschrittliche Torpedos"
tech_kr_cl_advanced_torpedoes_desc:0	"Verbesserungen bei der Zuverlässigkeit, der Zielgenauigkeit (einschließlich rudimentärer Zielsuchgeräte) und in anderen Bereichen machten die Torpedos, die gegen Ende des Krieges in Dienst gestellt wurden, in der Tat sehr gefährlich."
 ### Ships Luftabwehrgeschütz CL ""
tech_kr_Interwar_AA_cl:0	"Zwischenkriegsschiff FLAK"
tech_kr_Interwar_AA_cl_desc:0	"Zwar hatten die Seestreitkräfte schon vor dem Ende des Ersten Weltkriegs damit begonnen, ihre Schiffe mit Flugabwehrkanonen auszustatten, doch in den 1920er Jahren investierten viele Seestreitkräfte verstärkt in die Flugabwehr und entwickelten schnell feuernde Waffen mittleren Kalibers, die in erster Linie zur Bekämpfung von Flugzeugen gedacht waren."

 ### Torpedo CL
tech_kr_Late_War_AA_cl:0	"Fortschrittliche Schiffs-FLAK-Systeme"
tech_kr_Late_War_AA_cl_desc:0	"Verbesserte Feuerleiteinrichtungen und motorisierte Trainings- und Elevationsanlagen in Verbindung mit Innovationen wie Munition mit Annäherungszündern verbesserten die Wirksamkeit der Schiffs-FLAK-Systeme erheblich."

 ### Ships Anti-Air CL
tech_kr_surface_fc_radar_cl_desc:0	"Es dauerte nicht lange, bis das Radar zur Unterstützung der Feuerleitung und der Entfernungsmessung eingesetzt wurde, wodurch größere Kriegsschiffe auf Entfernung und bei Nacht effektiver wurden."
tech_kr_advanced_fc_radar_cl:0	"Radar zur Feuerleitung gegen Luftangriffe"
tech_kr_advanced_fc_radar_cl_desc:0	"Weitere Verbesserungen der Radargeräte führten dazu, dass sie die Zielerfassung für die Flugabwehrwaffen der Schiffe unterstützten und so ein wesentlich präziseres Flakfeuer gegen ankommende Flugzeuge ermöglichten."


