tech_coastal_sub_Early_War_AA:0	"20-mm-Flak"
tech_coastal_sub_Early_War_AA_desc:0	"Die von Rheinmetall Borsig entwickelte 2-cm-Flak 30 wurde Anfang der 1930er Jahre in Dienst gestellt und war im Grunde ein großes Maschinengewehr. Es handelte sich um eine rückstoßbetriebene Waffe mit zwei nebeneinander angeordneten Abzügen: der rechte für Einzelschüsse und der linke für den Automatikmodus. Sie verschoss eine Vielzahl von Munitionsarten, von panzerbrechenden bis hin zu Sprenggeschossen, und wurde in der Regel mit Leuchtspurgeschossen kombiniert. Die effektive Feuerrate betrug 120 Schuss pro Minute."
tech_coastal_sub_Interwar_AA:0	"20-mm-Doppel-Flak"
tech_coastal_sub_Interwar_AA_desc:0	 "Die von Rheinmetall Borsig entwickelte 2-cm-Doppel-Flak 30 wurde Anfang der 1930er Jahre in Dienst gestellt und war im Grunde ein großes Maschinengewehr. Es handelte sich um eine rückstoßbetriebene Waffe mit zwei nebeneinander angeordneten Abzügen: der rechte für Einzelschüsse und der linke für den Automatikmodus. Sie verschoss eine Vielzahl von Munitionsarten, von panzerbrechenden bis hin zu Sprenggeschossen, und wurde in der Regel mit Leuchtspurgeschossen kombiniert. Die effektive Feuerrate betrug 120 Schuss pro Minute. Der Typ IIA verfügte über 850 Schuss"
tech_coastal_sub_Late_War_AA:0	"20-mm-Vierlings-Flak"
tech_coastal_sub_Late_War_AA_desc:0	"Die von Rheinmetall Borsig entwickelte 2-cm-Zwillings-Flak 30 wurde Anfang der 1930er Jahre in Dienst gestellt und war im Grunde ein großes Maschinengewehr. Es handelte sich um eine rückstoßbetriebene Waffe mit zwei nebeneinander angeordneten Abzügen; der rechte für Einzelschüsse und der linke für den Automatikmodus. Sie verschoss eine Vielzahl von Munitionsarten, von panzerbrechenden bis hin zu Sprenggeschossen, und wurde in der Regel mit Leuchtspurgeschossen kombiniert. Die effektive Feuerrate betrug 120 Schuss pro Minute. Dies ist eine Doppelkanonen-Anordnung."
tech_coastal_sub_AA_ammo:0	"Munition"
tech_coastal_sub_AA_ammo_desc:0	"Zusätzliche Patronen verfügbar. 150 weitere für Typ II. Insgesamt: 1000 Patronen."
tech_patrol_submarine_desc:0	""
tech_patrol_submarine6:0	"U-Boot Typ VIIC/42"
tech_patrol_submarine6_desc:0	""
tech_patrol_submarine7_desc:0	""
tech_patrol_sub_Early_War_AA:0	"20-mm-Flak"
tech_patrol_sub_Early_War_AA_desc:0	"Die von Rheinmetall Borsig entwickelte 2-cm-Vierlings-Flak 30 wurde Anfang der 1930er Jahre in Dienst gestellt und war im Grunde ein großes Maschinengewehr. Es handelte sich um eine rückstoßbetriebene Waffe mit zwei nebeneinander angeordneten Abzügen: der rechte für Einzelschüsse und der linke für den Automatikmodus. Sie verschoss eine Vielzahl von Munitionsarten, von panzerbrechenden bis hin zu Sprenggeschossen, und wurde in der Regel mit Leuchtspurgeschossen kombiniert. Die effektive Feuerrate betrug 120 Schuss pro Minute. Hier handelt es sich um eine Vierlingsanlage."
tech_patrol_sub_Interwar_AA:0	"20-mm-Doppel-Flak"
tech_patrol_sub_Interwar_AA_desc:0	"Die von Rheinmetall Borsig entwickelte 2-cm-Flak 30 wurde Anfang der 1930er Jahre in Dienst gestellt und war im Grunde ein großes Maschinengewehr. Es handelte sich um eine rückstoßbetriebene Waffe mit zwei nebeneinander angeordneten Abzügen; der rechte für Einzelschüsse und der linke für den Automatikmodus. Sie verschoss eine Vielzahl von Munition, von panzerbrechenden bis hin zu Sprenggeschossen, und wurde in der Regel mit Leuchtspurgeschossen kombiniert. Die effektive Feuerrate betrug 120 Schuss pro Minute. Der Typ IIA verfügte über 850 Schuss"
tech_patrol_sub_Interwar_AA2:0	"20-mm-Vierlings-Flak"
tech_patrol_sub_Interwar_AA2_desc:0	"Diese von Mauser entwickelte Waffe entsprach im Wesentlichen der 20-mm-Flak 30, verfügte jedoch über einen verbesserten Verschluss, der ihre Feuerrate nahezu verdoppelte. Diese Version wurde in Doppel- (Flakzwilling) und Vierfachkonfigurationen (Flakvierling) installiert und hatte eine Feuerrate von 400 bzw. 800 Schuss pro Minute."
tech_patrol_sub_interwar_torpedoes_desc:0	"Die Entwicklung von Torpedos setzte sich nach dem Ersten Weltkrieg fort, und die meisten großen Nationen im Zweiten Weltkrieg setzten Torpedos ein, die in den 1920er und frühen 1930er Jahren konstruiert und erstmals in Dienst gestellt worden waren."
tech_patrol_sub_hulldesign:0	"Rumpfkonstruktion I SS"
tech_patrol_sub_hulldesign_desc:0	"Als verbesserte Version des Typs VIIA verfügte der VIIB über einen leicht verlängerten Rumpf und größere Satteltanks. Dies ermöglichte eine größere Treibstoffkapazität, wodurch sich die Reichweite von 4.300 nm auf 6.500 nm erhöhte. Die Dieselmotoren wurden mit Aufladern ausgestattet, wodurch sich die Geschwindigkeit über Wasser um etwa 1 Knoten erhöhte."
tech_patrol_sub_hulldesign2:0	"Rumpfkonstruktion II SS"
tech_patrol_sub_hulldesign3:0	"Rumpfkonstruktion III SS"
tech_patrol_sub_hulldesign3_desc:0	"Die Notwendigkeit, noch tiefer abzutauchen, um Wasserbombenangriffen zu entgehen, gewann zunehmend an Bedeutung. Beim Typ VIIC/41 wurde die Bruchtiefe von 200 m auf 250 m erhöht.\nUm die Bruchtiefe zu erhöhen, wurden alle nicht essenziellen Ausrüstungsgegenstände entfernt und viele andere durch neuere, leichtere Materialien ersetzt. Die Gewichtsersparnis wurde genutzt, um die Rumpfwandstärke von 0,73 Zoll (18,5 mm) auf 0,83 Zoll (21 mm) zu erhöhen, wodurch sich die Bruchtiefe auf 820 Fuß (250 m) erhöhte."
tech_patrol_sub_hulldesign4:0	"Rumpfkonstruktion IV SS"
tech_patrol_sub_hulldesign4_desc:0	"Der Typ VIIC/42 war als weitere Verbesserung des VIIC/41 geplant. Es wurde ein Auftrag über 165 dieser neuen Boote erteilt, doch keines davon wurde jemals auf Kiel gelegt, geschweige denn fertiggestellt.\nDieser Entwurf hätte einen zusätzlichen Kompressor vorgesehen, wodurch sich der Wirkungsgrad des Motors und die Reichweite über Wasser auf 10.000 Seemeilen erhöht hätten. Die Geschwindigkeit über Wasser wäre um 1,6 Knoten auf 18,6 Knoten gestiegen. Der Druckrumpf wurde sowohl verlängert als auch im Durchmesser vergrößert, um zusätzliche Ausrüstung unterzubringen. Die bedeutendste Verbesserung dieses Entwurfs bestand jedoch darin, dass der Rumpf aus panzerqualitativem Stahl gefertigt werden sollte. Mit der geplanten Erhöhung der Wandstärke auf 1,1 Zoll (28 mm) hätte die Druckfestigkeit dieses Bootes erstaunliche 1.640 Fuß (500 m) betragen."
tech_torpedo_quantity:0	"Anzahl der Torpedos erhöhen"
tech_torpedo_quantity_desc:0	"Die Torpedokapazität wurde von 11 auf 14 Torpedos erhöht – zwei wurden extern in druckdichten Behältern unter dem Oberdeck gelagert."
tech_torpedo_quantity3_desc:0	"Die Torpedokapazität wurde von 22 auf 24 Torpedos erhöht – zwei wurden extern in druckdichten Behältern unter dem Oberdeck gelagert."
