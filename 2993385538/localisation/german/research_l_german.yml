torpedo_cruiser_mtg:0	"Entwurf für Torpedokreuzer"
panzerschiffe:0	"Entwurf für Panzerschiffe"
amphibious_mechanized_infantry_desc:0	"Amphibische Traktoren, auch Amtracs genannt, ermöglichen es den Marines, unter Panzerschutz an einem Strand an Land zu gehen."
amphibious_mechanized_infantry_2:0	"Verbesserte amphibische Traktoren"
amphibious_tank_2_desc:0	"Die zweite Generation amphibischer Panzer bietet besseren Schutz und erhöhte Feuerkraft. "
basic_naval_mines_desc:0	"Eine einfache schwimmende Bombe, die am Meeresboden verankert ist. Die Mine explodiert, wenn sie mit einem Schiff in Kontakt kommt."
improved_naval_mines:0	"Magnetmine"
advanced_naval_mines:0	"Akustikmine"
advanced_naval_mines_desc:0	"Dieser Typ von Seemine detoniert, wenn ihre Sensoren das Geräusch eines in der Nähe befindlichen Schiffes wahrnehmen."
degaussing:0	"Entmagnetisierung"
submarine_mine_laying_desc:0	"Durch den Einbau spezieller Ausrüstung zum Halten und Ausbringen von Minen kann ein speziell konstruiertes U-Boot Minen unter Wasser und hoffentlich unentdeckt ausbringen. "
improved_submarine_mine_laying:0	"Minenausbringen über Torpedorohre"
airdrop_mines:0	"Luftminenausbringen"
airdrop_mines_desc:0	"Durch die Ausstattung der Minen mit einem kleinen Fallschirm können diese sicher aus Flugzeugen abgeworfen werden, was eine schnelle und effiziente Errichtung von Minenfeldern ermöglicht."
naval_mines:0	"Technologien der Minenkriegsführung"
tool_tech:0	"Werkzeugtechniken"
NAVAL_TITLE_ARMAMENT:0	"Bewaffnung"
NAVAL_TITLE_FIRE_CONTROL:0	"Feuerleitung"
early_ship_hull_carrier:0	"Trägerrumpf (frühe Version)"
coastal_defense_ships:0	"Entwurf von Küstenschutzschiffen"
advanced_fire_control_system:0	"Fortgeschrittenes Feuerleitsystem"
advanced_fire_control_system_desc:0	"Weitere Verfeinerungen der Richt- und mechanischen Computertechnologie ermöglichen eine höhere Genauigkeit."
sonar_desc:0	"Ein Basis-Hydrophonsatz ermöglicht die Ortung von Unterwasserzielen durch Erfassung der von ihnen erzeugten Geräusche."
improved_sonar:0	"Verbessertes Hydrofon"
smoke_generator_desc:0	"Einige geringfügige Modifikationen an den Motoren und Schornsteinen leichter und mittlerer Schiffe ermöglichen es ihnen, viel Rauch zu erzeugen, um dem Feind auszuweichen oder den Kontakt zu ihm abzubrechen."
improved_depth_charges:0	"Wasserbombenwerfer"
improved_depth_charges_desc:0	" Eine einfache mechanische Vorrichtung, die eine Wasserbombe in einer festgelegten Entfernung vom Schiff abwirft. Das bedeutet, dass der Zerstörer nicht mehr direkt über das Ziel fahren muss, um es zu treffen."
advanced_depth_charges_desc:0	"Ein Mörser an Bord des Zerstörers kann eine Sprengladung viel weiter werfen, wodurch das Schiff während des gesamten Angriffs den Sonarkontakt mit dem U-Boot aufrechterhalten kann und dessen Treffsicherheit drastisch erhöht wird."
modern_depth_charges:0	"Verbesserter Wasserbombenwerfer"
improved_airplane_launcher_desc:0	"Ein verbesserter pneumatischer Mechanismus ermöglicht es, wesentlich größere Flugzeuge per Katapult zu starten. Dies vergrößert deren Suchradius."
improved_cruiser_armor_scheme:0	"Panzerungskonzept für Kreuzer der Zwischenkriegszeit"
improved_cruiser_armor_scheme_desc:0	"Weitere Verfeinerungen des Panzerungskonzepts sowie ein schwereres Deck sind erforderlich, um der zunehmenden Reichweite und Feuerkraft der Geschütze gerecht zu werden."
advanced_cruiser_armor_scheme_desc:0	"Durch die schräge Anordnung der Gürtelpanzerung lassen sich Panzerungen mit gleichem Gewicht und gleicher Dicke wesentlich schwerer durchschlagen."
basic_heavy_armor_scheme:0	"Verbessertes Panzerungskonzept für Großkampfschiffe"
improved_heavy_armor_scheme_desc:0	"Weitere Verfeinerungen der Panzerungskonzepte ermöglichen es uns, die lebenswichtigen Teile des Schiffes noch effizienter zu schützen. "
magnetic_detonator:0	"Magnetischer Zünder"
magnetic_detonator_desc:0	"Ein neuer Zünder erkennt die Verschiebung des Erdmagnetfelds, wenn der Torpedo unter dem Ziel hindurchfliegt. Eine Explosion direkt unter einem Schiff verursacht weitaus größeren Schaden und bricht oft den Kiel des Ziels, wodurch es sofort sinkt."
homing_torpedo_desc:0	"Durch die Modifizierung des Gyrosystems an Torpedos können wir diese so programmieren, dass sie andere Kurslinien als eine gerade Linie verfolgen."
electric_torpedo:0	"Elektrischer Torpedo"
improved_ship_torpedo_launcher_desc:0	"Leistungsstärkere Motoren ermöglichen es, mehr Abschussrohre in einer einzigen Halterung zu installieren und diese schneller auf das Ziel auszurichten."
modern_ship_torpedo_launcher:0	"Fortschrittliche Torpedos"
modern_ship_torpedo_launcher_desc:0	"Fortschrittliche Torpedomotoren und Sprengstoffmischungen erhöhen die Durchschlagskraft von Torpedos noch weiter."
basic_submarine_snorkel_sub_desc:0	"Ein einfacher Luftschlauch, der vom Maschinenraum zum Kommandoturm verläuft. Durch seine Verlängerung ermöglicht es dem U-Boot, seine Motoren zu betreiben und aufzuladen, während es noch unter Wasser ist."
improved_submarine_snorkel_sub:0	"Verbesserter U-Boot-Schnorchel"
basic_battery_desc:0	"Grundkonstruktion für die Richt- und Höhenmechanik von Schiffsgeschützen."
improved_light_battery:0	"Verbesserte 70–115-mm-Batterie"
improved_light_battery_desc:0	""
advanced_light_battery_desc:0	""
basic_light_shell:0	"Kleinkalibrige halbpanzerbrechende Granate"
improved_light_shell_desc:0	"Eine geeignete panzerbrechende Granate für kleinkalibrige Geschütze verschafft Zerstörern und anderen leichten Schiffen eine Chance im Kampf gegen gepanzerte Gegner."
improved_medium_battery:0	"Verbesserte 135–160-mm-Batterie"
improved_medium_battery_desc:0	""
advanced_medium_battery_desc:0	""
basic_medium_shell:0	"Panzerbrechende Mittelgranate mit Panzerungsdurchschlag"
improved_medium_shell_desc:0	"Als Kompromiss zwischen Panzerungsdurchschlag und Sprengkraft verursacht diese Granate deutlich mehr Schaden, nachdem sie die schwache Panzerung leichter Schiffe durchschlagen hat."
improved_heavy_battery:0	"Verbesserte 250–310-mm-Batterie"
improved_heavy_battery_desc:0	""
advanced_heavy_battery_desc:0	""
basic_heavy_shell:0	"Panzerbrechende Geschosse mit Panzerungsbegrenzer"
improved_heavy_shell_desc:0	"Mit einem Gewicht von weit über einer Tonne schlagen diese massiven Geschosse mit beispielloser Kraft zu und stellen selbst für die schwerste Panzerung eine ernsthafte Bedrohung dar."
improved_secondary_battery:0	"Sekundärbatterie mit Geschütztürmen"
improved_secondary_battery_desc:0	"Durch die Unterbringung der Sekundärgeschütze in motorisierten Geschütztürmen erhalten diese ein wesentlich größeres Schussfeld, allerdings auf Kosten eines höheren Gewichts und einer geringeren Stabilität bei schwerer See."
dp_secondary_battery_desc:0	"Die Kombination von Schiffsabwehr- und Flugabwehrgeschützen in einer einzigen Lafette ermöglicht mehr Flexibilität und spart Gewicht."
damage_control_1:0	"Feuerlöschübungen"
damage_control_2_desc:0	"Durch die Aufteilung der Hauptwasserleitungen im Schiff wird die Wahrscheinlichkeit, dass ein Treffer das Schiff vollständig kampfunfähig macht, erheblich verringert. "
fire_control_methods_1:0	"Bracket-Schießen"
fire_control_methods_1_desc:0	"Um das Ziel zu treffen, besteht der erste Schritt darin, es zu überbrücken, indem man jeweils mehrere Geschütze gleichzeitig abfeuert, bis die Einschläge auf beiden Seiten des Ziels einschlagen."
fire_control_methods_2_desc:0	"Anstatt über das Ziel hinaus zu schießen und den Überblick über die Einschläge hinter dem feindlichen Schiff zu verlieren, werden die Schüsse bewusst vor dem Ziel abgefeuert und die Entfernung zwischen Einschlag und Ziel gemessen, um die Reichweite zu bestimmen."
fire_control_methods_3:0	"Granatfarbstoffe"
fuel_silos_desc:0	"Die Massenspeicherung von Treibstoff erfordert ein komplexes System aus Tanks, Rohrleitungen und Ventilen, um sicherzustellen, dass er sowohl sicher gelagert als auch jederzeit verfügbar ist."
fuel_silos3:0	" Treibstofflagerung III"
fuel_silos3_desc:0	"Die Massenspeicherung von Treibstoff erfordert ein komplexes System aus Tanks, Rohrleitungen und Ventilen, um sicherzustellen, dass er sowohl sicher gelagert als auch jederzeit verfügbar ist."
fuel_silos4_desc:0	"Die Massenspeicherung von Treibstoff erfordert ein komplexes System aus Tanks, Rohrleitungen und Ventilen, um sicherzustellen, dass er sowohl sicher gelagert als auch jederzeit verfügbar ist."
fuel_silos5:0	"Kraftstofflagerung V"
fuel_cans_desc:0	"Ein robuster Flüssigkeitsbehälter aus gepresstem Stahl. Er wurde für militärische Zwecke entwickelt, um 20 Liter Kraftstoff aufzunehmen. Die Entwicklung stellte eine erhebliche Verbesserung gegenüber früheren Konstruktionen dar, für deren Verwendung Werkzeuge und Trichter erforderlich waren, und wies zahlreiche innovative Merkmale auf, die der Benutzerfreundlichkeit und Robustheit dienten."
fuel_refining2:0	"Kraftstoffraffination II"
fuel_refining2_desc:0	"Eine bessere Planung der Raffinerieanlagen verringert den Kraftstoffverlust."
fuel_refining3_desc:0	"Verbesserte Rückgewinnungsmethoden ermöglichen die Raffination von Kraftstoff aus Nebenprodukten."
fuel_refining4:0	"Verbesserte Leistung der Ölraffinerie"
fuel_refining5_desc:0	"Durch den Einsatz hocheffizienter Destillations- und Hydrocracking-Verfahren werden wir die Kraftstoffgewinnung aus Rohöl maximieren. Diese Fortschritte ermöglichen höhere Kraftstoffausbeuten, verringern Versorgungsengpässe und gewährleisten langfristige Energiesicherheit angesichts der Anforderungen in Kriegszeiten."
Interwar_AA_tech_desc:0	"Zwar hatten die Marinen bereits vor dem Ende des Ersten Weltkriegs damit begonnen, ihre Schiffe mit Flugabwehrgeschützen auszustatten, doch viele Marinen weiteten ihre Investitionen in die Marine-Flugabwehr in den 1920er Jahren aus und entwickelten mittelkalibrige Schnellfeuerwaffen, die in erster Linie zur Bekämpfung von Flugzeugen bestimmt waren."
Late_1930s_AA_tech:0	"Flugabwehr vor dem Krieg"
Early_War_AA_tech:0	"Ausbau der Flugabwehr während des Krieges"
Early_War_AA_tech_desc:0	"Die Erfahrungen des Krieges machten deutlich, dass auf bestehenden und neuen Schiffen umfangreichere Flugabwehranlagen erforderlich waren, um der Bedrohung durch Flugzeuge entgegenzuwirken."
Surface_search_radar:0	"Oberflächen-Suchradar"
air_warning_radar_desc:0	"Mit der Weiterentwicklung der Radargeräte wurden diese zur Frühwarnung vor Luftangriffen eingesetzt. Dies ermöglichte es den Schiffen, sich auf die Flugzeuge vorzubereiten und eine stärkere Luftabwehr aufzubauen."
advanced_surface_search_radar:0	"Fortschrittliches Oberflächen-Suchradar"
surface_fc_radar:0	"Oberflächen-Feuerleitradar"
surface_fc_radar_desc:0	"Es dauerte nicht lange, bis Radar zur Unterstützung der Feuerleitung und Entfernungsmessung eingesetzt wurde, wodurch größere Kriegsschiffe auf große Entfernungen und bei Nacht effektiver wurden."
early_sonar:0	"Frühe Sonaranlagen "
depth_charge_throwers_desc:0	"Die Hauptwaffe gegen U-Boote in der Zwischenkriegszeit und während des größten Teils des Zweiten Weltkriegs war die Wasserbombe. Wasserbomben konnten vom Heck eines Schiffes auf die vermutete Position eines U-Boots geworfen werden, doch die Entwicklung von Wasserbombenwerfern ermöglichte es den Schiffen, Wasserbomben über einen größeren Bereich zu streuen und so ihre Wirksamkeit zu erhöhen."
basic_sonar:0	"Grundlegendes Sonar"
asw_anti_sub_mortars:0	"U-Boot-Abwehrmörser"
asw_anti_sub_mortars_desc:0	"Ein wesentlicher Nachteil des Sonars bestand darin, dass der Kontakt abbrach, sobald das angreifende Schiff das Ziel überfuhr, was dem U-Boot ein Zeitfenster verschaffte, in dem es manövrieren konnte, um dem bevorstehenden Wasserbombenangriff zu entgehen. Die Erfindung von U-Boot-Abwehrmörsern wie Hedgehog und Mousetrap ermöglichte es Begleitschiffen, auf Ziele vor ihnen zu feuern, und stellten eine wichtige Ergänzung der U-Boot-Bekämpfung dar."
interwar_torpedoes:0	"Torpedos der Zwischenkriegszeit"
magnetic_detonators_desc:0	"Zwar waren sie anfangs recht unzuverlässig, doch sobald sie weiterentwickelt worden waren, machten magnetische Zünder die Torpedos effektiver."
electric_torpedoes:0	"Elektrische Torpedos"
advanced_torpedoes:0	"Fortschrittliche Torpedos"
advanced_torpedoes_desc:0	"Verbesserungen hinsichtlich Zuverlässigkeit, Zielerfassung (einschließlich rudimentärer Zielsuchvorrichtungen) und anderer Bereiche machten die Torpedos, die gegen Ende des Krieges in Dienst gestellt wurden, in der Tat sehr gefährlich."
