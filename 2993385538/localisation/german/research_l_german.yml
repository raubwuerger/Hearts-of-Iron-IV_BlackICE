tech_kr_Early_War_AA_shbb_desc:0	"Die Erfahrungen des Krieges machten deutlich, dass auf bestehenden und neuen Schiffen umfangreichere Flak-Anlagen erforderlich waren, um der Bedrohung durch Flugzeuge entgegenzuwirken."
