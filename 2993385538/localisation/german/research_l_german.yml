tech_patrol_sub_Late_war_AA:0	"37-mm-Zwillingsflak"
tech_patrol_sub_Late_war_AA_desc:0	"Dies war die letzte für U-Boote entwickelte Flugabwehrkanone. Sie wurde von der 37-mm-Flak 42 der deutschen Armee übernommen, hatte eine größere Reichweite und verschoss eine wesentlich stärkere Granate. Die Feuerrate war mit 50 Schuss pro Minute etwas geringer."
tech_patrol_sub_interwar_torpedoes:0	"Torpedo G7a - T1"

tech_patrol_sub_magnetic_detonators:0	"Torpedo G7e - T3"
tech_patrol_sub_magnetic_detonators_desc:0	"Ursprünglich recht unzuverlässig, wurden die Torpedos nach ihrer Verfeinerung durch magnetische Zünder effektiver."
tech_patrol_sub_electric_torpedoes:0	"Torpedo G7e - T4 'Falke'"
tech_patrol_sub_electric_torpedoes_desc:0	"Die elektrischen Torpedos waren leiser und hinterließen weitaus weniger Kielwasser (was es dem Ziel erschwerte, die herannahende Gefahr zu erkennen) und stellten einen weiteren bedeutenden Fortschritt in der Torpedotechnologie dar."
tech_patrol_sub_advanced_torpedoes:0	"Torpedo G7s - T5 Zaunkönig"
tech_patrol_sub_advanced_torpedoes_desc:0	"Verbesserungen bei der Zuverlässigkeit, der Zielgenauigkeit (einschließlich rudimentärer Zielsuchgeräte) und in anderen Bereichen machten die Torpedos, die gegen Ende des Krieges in Dienst gestellt wurden, in der Tat sehr gefährlich."



tech_patrol_sub_hulldesign2_desc:0	"Da zusätzlicher Platz für das neue aktive Sonargerät benötigt wurde, wurde der Rumpf unmittelbar vor und hinter dem Periskop um zwei Fuß verlängert. Weitere kleinere mechanische Verbesserungen wurden vorgenommen, wie z. B. ein neues Ölfiltersystem, ein Luftkompressor und ein aktualisiertes elektrisches Steuersystem."






