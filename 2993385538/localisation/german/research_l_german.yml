antibiotics_desc:0	"Ein Antibiotikum ist eine antimikrobielle Substanz, die gegen Bakterien wirkt und das wichtigste antibakterielle Mittel zur Bekämpfung bakterieller Infektionen darstellt. Antibiotische Medikamente werden in großem Umfang zur Behandlung und Vorbeugung solcher Infektionen eingesetzt. Sie können Bakterien entweder abtöten oder ihr Wachstum hemmen."
