tech_kr_tank_landing_craft_desc:0	"Mit fortschrittlichen Landungsbooten können unsere Jungs bei einer Invasion schneller und effektiver an den Strand gelangen."

GER_early_coastal_submarine_1_desc:0	"Das moderne U-Boot ist weit entfernt von den plumpen Booten des Großen Krieges. Es ist leistungsfähiger als je zuvor und kann selbst das größte Schiff bedrohen - und das zu sehr moderaten Kosten. Die frühen Modelle aus dem Großen Krieg ebnen den Weg für neue Methoden der Seekriegsführung."


GER_early_coastal_submarine_3:0	"Küsten-U-Boot Typ IIB"
GER_early_coastal_submarine_3_desc:0	"U-Boote sind getarnte Schiffe, die dazu bestimmt sind, unverteidigte Konvois auszuschalten. Die frühen Modelle aus dem Ersten Weltkrieg ebneten den Weg für neue Methoden der Seekriegsführung."





