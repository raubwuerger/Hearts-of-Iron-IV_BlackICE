TRADE_INTERDICTION_DESC:0	"Gegen einen stärkeren maritimen Gegner können wir uns darauf konzentrieren, dessen Flotte zu binden und Versorgungslinien zu zerstören, um dessen Kriegsmaschinerie auszuhungern."
AIR_SUPERIORITY_DESC:0	" Unsere Kampfflugzeuge sind das Rückgrat der Luftwaffe und verteidigen unseren Luftraum, eskortieren Bomber und räumen den Luftraum für unsere Bodentruppen."
