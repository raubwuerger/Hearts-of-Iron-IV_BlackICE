tech_lr_sub_Interwar_AA:0	"20-mm-Doppel-Flak"
tech_lr_sub_Interwar_AA_desc:0	"Die von Rheinmetall Borsig entwickelte 2-cm-Doppel-Flak 30 wurde Anfang der 1930er Jahre in Dienst gestellt und war im Grunde ein großes Maschinengewehr. Es handelte sich um eine rückstoßbetriebene Waffe mit zwei nebeneinander angeordneten Abzügen; der rechte für Einzelschüsse und der linke für den Automatikmodus. Sie verschoss eine Vielzahl von Munitionsarten, von panzerbrechenden bis hin zu Sprenggranaten, und wurde in der Regel mit Leuchtspurgeschossen kombiniert. Die effektive Feuerrate betrug 120 Schuss pro Minute."
tech_lr_sub_Late_War_AA_desc:0	"Dies war die letzte für U-Boote entwickelte Flugabwehrkanone. Sie war eine Weiterentwicklung der 37-mm-Flak 42 der deutschen Wehrmacht, hatte eine größere Reichweite und verschoss eine wesentlich stärkere Granate. Die Feuerrate war mit 50 Schuss pro Minute etwas geringer."
tech_lr_sub_electric_torpedoes_desc:0	"Elektrische Torpedos waren leiser und hinterließen weitaus weniger Wellenschlag (was es dem Ziel erschwerte, die herannahende Gefahr zu erkennen) und stellten einen weiteren bedeutenden Fortschritt in der Torpedotechnologie dar."
tech_lr_sub_hulldesign:0	"Rumpfkonstruktion I LSS"
tech_lr_sub_hulldesign_desc:0	"Der Rumpf musste neu konstruiert werden, um die Treibstoffkapazität von 154 Tonnen auf 165 Tonnen zu erhöhen und damit die Reichweite von 8.100 Seemeilen auf 8.700 Seemeilen leicht zu vergrößern. "
tech_lr_sub_hulldesign2_desc:0	"Der Rumpf musste erneut überarbeitet werden, um die Treibstoffkapazität auf 208 Tonnen zu erhöhen, was eine Reichweitenverlängerung auf 11.000 Seemeilen ermöglichte.\nAb dieser Unterklasse verfügte das Schiff über zwei Periskope, die beide im Kommandoturm untergebracht waren."
tech_lr_sub_hulldesign3:0	"Rumpfkonstruktion III LSS"
tech_lr_sub_hulldesign3_desc:0	"Der Rumpf musste weiter überarbeitet werden, um die Treibstoffkapazität auf 214 Tonnen zu erhöhen, was ihm eine erweiterte Reichweite von bis zu 11.700 Seemeilen verleiht. \nAb dieser Unterklasse verfügte das Schiff über zwei Periskope, die beide im Kommandoturm untergebracht waren."
tech_lr_sub_hulldesign4:0	"Rumpfkonstruktion IV LSS"
tech_lr_sub_hulldesign5:0	"Rumpfkonstruktion V LSS"
tech_lr_sub_hulldesign5_desc:0	"Der Typ XXI verfügte über einen vollständig stromlinienförmigen Außenrumpf und ein völlig aufgeräumtes Deck. Das vordere Wasserflugzeug wurde bei Nichtgebrauch eingefahren, es gab keine Deckgeschütze, die beiden 20-mm-Flakgeschütze waren in stromlinienförmigen Gehäusen montiert, und alle ausfahrbaren Vorrichtungen wie Schnorchel, Antenne und Peilantenne wurden bei Nichtgebrauch in den Aufbau eingefahren. Anstelle des traditionellen offenen Kommandoturms befanden sich drei kleine Öffnungen an der Spitze der Brücke, eine für den Wachoffizier und die beiden anderen für die Ausgucke."
