tech_panzer_iv_equipment_2_desc:0	"Die Ausf. D des Panzer IV wurde 1939 eingeführt und erhielt eine verstärkte Panzerung an den Seiten und am Turm. Nach dem Überfall auf Polen wurde beschlossen, die Produktion des Panzer IV zu steigern. Ein Plan, einige Fahrzeuge mit 50-mm-Panzerabwehrkanonen auszustatten, wurde getestet, aber verworfen. Die Produktion der Ausf. E, mit noch stärkerer Panzerung und einer verbesserten Kommandantenkuppel, begann 1940."
