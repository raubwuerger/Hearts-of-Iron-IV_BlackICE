coal_liquid2_desc:0	"Durch die Weiterentwicklung der Fischer-Tropsch-Synthese werden wir die Effizienz der Umwandlung von Kohle in flüssige Brennstoffe verbessern. Dieses Verfahren wird synthetischen Brennstoff von höherer Qualität hervorbringen, wodurch die Versorgungssicherheit erhöht und die Abhängigkeit von ausländischem Öl verringert wird."
