aa_emplacement_construction2:0	"Luftverteidigungsinitiative II"
aa_emplacement_construction2_desc:	"Durch die Verfeinerung von Bautechniken und die Integration von modularen Konstruktionsprinzipien werden wir die Entwicklung von Luftabwehrstellungen beschleunigen. Vorgefertigte Strukturen und standardisierte Montageverfahren werden es uns ermöglichen, Verteidigungsnetze mit größerer Effizienz zu errichten und die Anfälligkeit für plötzliche Luftangriffe zu verringern."
on_site2:0	"Verschanzungsgeschwindigkeit II"


pre_fab2_desc:0	"Die Modernisierung unserer Werkzeuge und Ausrüstungen wird uns dabei helfen, bessere Landforts und Küstenforts mit höherer Geschwindigkeit zu bauen."





road_infra2_desc:0	"Die Modernisierung unserer Werkzeuge und Ausrüstungen wird unsere Bauanstrengungen weiter unterstützen, um noch bessere Straßen zu bauen, die unsere militärischen Bewegungen weniger schwierig und schneller machen."
