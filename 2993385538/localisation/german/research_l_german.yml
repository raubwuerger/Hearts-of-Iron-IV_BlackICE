tech_kr_depth_charge_throwers_ca:0	"Wasserbomben-Werfer"
tech_kr_depth_charge_throwers_ca_desc:0	"Die Hauptwaffe gegen U-Boote in der Zwischenkrieg und während des größten Teils des Zweiten Weltkriegs war die Wasserbombe.  Wasserbomben konnten vom Heck eines Schiffes auf die erwartete Position eines U-Bootes gerollt werden, aber die Entwicklung von Wasserbombenwerfern ermöglichte es den Schiffen, Wasserbombenmuster über einen größeren Bereich zu werfen, was ihre Wirksamkeit erhöhte."

