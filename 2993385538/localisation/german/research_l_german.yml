tech_kr_Late_1930s_AA_bc_desc:0	"Im Zuge der Weiterentwicklung der Luftfahrt verfeinerten die Marinen ihrerseits ihre Flugabwehrsysteme (auch wenn sich mit Ausbruch des Krieges herausstellte, dass diese der Aufgabe nicht gewachsen waren) – mit schnelleren Mehrrohrsystemen und frühen Flugabwehr-Feuerleitsystemen."
tech_kr_Early_War_AA_bc:0	"Ausbau der Schiffs-Flak während des Krieges"
tech_kr_Early_War_AA_bc_desc:0	"Die Erfahrungen des Krieges machten deutlich, dass größere Flugabwehranlagen auf bestehenden und neuen Schiffen erforderlich waren, um der Bedrohung durch Flugzeuge entgegenzuwirken."
tech_kr_Late_War_AA_bc:0	"Fortschrittliche Schiffs-Flak-Systeme"
tech_kr_Late_War_AA_bc_desc:0	"Verbesserte Feuerleitung sowie motorisierte Richt- und Höhenverstellung, kombiniert mit Innovationen wie Munition mit Annäherungszündern, verbesserten die Wirksamkeit der Fliegerabwehrsysteme der Marine erheblich."
tech_kr_air_warning_radar_bc:0	"Luftüberwachungsradar"
tech_kr_air_warning_radar_bc_desc:0	"Mit der Weiterentwicklung der Radargeräte wurden diese zur Frühwarnung vor Luftangriffen eingesetzt. Dadurch konnten Schiffe sich auf die Flugzeuge vorbereiten und eine stärkere Luftabwehr aufbauen."
tech_kr_advanced_surface_search_radar_bc:0	"Fortschrittliches Oberflächen-Suchradar"
tech_kr_advanced_surface_search_radar_bc_desc:0	"Die Entwicklung des Zentimeterwellenradars ermöglichte den Einbau weitaus leistungsstärkerer, aber auch weitaus kleinerer Radargeräte.  Dies bedeutete, dass größere Schiffe über ein noch besseres taktisches Bewusstsein verfügten und auch kleinere Schiffe Radar einsetzen konnten."
tech_kr_surface_fc_radar_bc:0	"Oberflächen-Feuerleitradar"
tech_kr_surface_fc_radar_bc_desc:0	"Es dauerte nicht lange, bis Radar zur Unterstützung der Feuerleitung und Entfernungsmessung eingesetzt wurde, wodurch größere Kriegsschiffe auf große Entfernungen und bei Nacht effektiver wurden."
