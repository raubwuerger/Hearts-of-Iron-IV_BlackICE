SUPERIOR_FIREPOWER_DOCTRINE_DESC:0	"Diese Doktrin konzentriert sich darauf, Granaten auf den Feind zu werfen, nicht Menschen. Unsere Arbeitskräfte sind kostbar, Kugeln sind billig."
GRAND_BATTLEPLAN_DOCTRINE_DESC:0	"Umfassende Planung und Vorbereitung vor dem Kampf sind der Schlüssel zum Erfolg."
MASS_ASSAULT_DOCTRINE_DESC:0	""Perfekte" Waffen werden überbewertet, eine große Anzahl "gut genug"er Waffen ist der Weg zum Sieg!"
