static_antiair1:0	"Einfache Flugabwehrstellungen"
static_antiair1_desc:0	" Durch den Einsatz stationärer Flugabwehrstellungen schaffen wir eine grundlegende Verteidigung gegen feindliche Luftangriffe. Diese Stellungen basieren auf manuell bedienten Geschützen mit direkter visueller Zielerfassung, was ihre Wirksamkeit gegen schnell fliegende oder hoch fliegende Flugzeuge einschränkt. Sie bieten zwar eine gewisse Abschreckung, doch ihre Reichweite und Genauigkeit sind nach wie vor rudimentär."
static_antiair3:0	"Schwere Flugabwehrstellungen"
static_antiair3_desc:0	"Durch den Ausbau unserer Luftabwehrkapazitäten mit großkalibrigen Langstreckenwaffen werden wir eine beeindruckende Verteidigung gegen feindliche Luftangriffe schaffen. Mehrfachgeschützstellungen mit sich überschneidenden Schussfeldern werden den Himmel mit tödlichem Flakfeuer überziehen und selbst schwer gepanzerte Bomber abwehren. Mit diesen Verteidigungsanlagen werden strategische Bombenangriffe auf unsere Streitkräfte für den Feind zunehmend kostspielig."
static_antiair4_desc:0	"Durch die Entwicklung überlegener Flugabwehrmunition werden wir die Durchschlagskraft unserer Luftabwehr erheblich verbessern. Die Einführung von Annäherungszündern wird die Wirksamkeit jedes Schusses erhöhen, indem die Granaten in der Nähe feindlicher Flugzeuge detonieren, wodurch direkte Treffer nicht mehr erforderlich sind. Darüber hinaus sorgen verbesserte Spreng- und Splittergranaten für größeren Schaden beim Aufprall, wodurch der Luftraum über unseren Stellungen für feindliche Piloten weitaus gefährlicher wird."
HVantiair2:0	"Grundlegende schwere Flugabwehr"
HVantiair3:0	"Upgrades für schwere Flugabwehr I"
HVantiair3_desc:0	 "Durch die Verfeinerung der Laufmetallurgie und die Einführung hochenergetischer Treibstoffformulierungen werden wir die Mündungsgeschwindigkeit und die Feuerrate unserer schweren Flugabwehrgeschütze deutlich erhöhen. Verbesserte Züge und verstärkte Verschlussmechanismen ermöglichen den Einsatz leistungsstärkerer Granaten, wodurch die effektive Reichweite vergrößert und die Durchschlagskraft gegen Hochgeschwindigkeitsflugzeuge erhöht wird. Diese Verbesserungen werden sicherstellen, dass unsere Flugabwehrbatterien eine gewaltige Bedrohung für feindliche Bomber und Bodenangriffsflugzeuge bleiben."
HVantiair5_desc:0	""
HVantiair_direct1:0	"Schwere Luftabwehr zur direkten Unterstützung"
HVantiair_direct1_desc:0	"Durch die Anpassung unserer schweren Flugabwehrgeschütze für den Direktbeschuss werden wir eine verheerende Waffe zur Unterstützung auf dem Schlachtfeld schaffen. Mit verbesserter Geschützstabilisierung, verstärkten Lafetten und speziellen panzerbrechenden Hochgeschwindigkeitsgeschossen werden diese Waffen als Mehrzweckartillerie dienen, die in der Lage ist, schwer gepanzerte Fahrzeuge auf extreme Entfernungen auszuschalten und gleichzeitig ihre Wirksamkeit gegen Flugzeuge beizubehalten. Diese Modifikationen werden unsere Flugabwehr-Einheiten zu einem unverzichtbaren Bestandteil sowohl bei defensiven als auch bei offensiven Operationen machen."
HVantiair_direct2_desc:0	"Durch die weitere Verfeinerung unserer schweren Flugabwehrplattformen werden wir sicherstellen, dass sie sowohl in der Luftabwehr als auch in der Panzerabwehr hervorragende Leistungen erbringen, ohne dabei an Wirksamkeit einzubüßen. Neue Feuerleitsysteme, automatische Zündereinstellungen und verbesserte optische Entfernungsmesser ermöglichen es den Schützen, nahtlos zwischen Luft- und Bodenzielen zu wechseln. Diese Entwicklung wird die Flexibilität unserer schweren Flugabwehr-Einheiten maximieren und sicherstellen, dass sie jede Bedrohung bekämpfen können, die in ihre Reichweite gelangt."
interwar_antitank:0	"Gezogene leichte Panzerabwehrkanone"
interwar_antitank_desc:0	" Artillerie, die auf die Bekämpfung gepanzerter Ziele wie Panzer spezialisiert ist; sie feuert in der Regel panzerbrechende Geschosse ab."
HVantitank1:0	"Schwere Panzerabwehrkanonen"
HVantitank1_desc:0	"HEAT-Geschosse (High-Explosive Anti-Tank) können in der Panzerabwehrartillerie eingesetzt werden, um die begrenzte Mündungsgeschwindigkeit auszugleichen."
HVantitank3:0	"Verbesserte schwere Panzerabwehrkanonen"
HVantitank3_desc:0	" Durch die Kombination verschiedener neuer Munitionstechnologien mit Geschützen mit höheren Mündungsgeschwindigkeiten können wir auf jede neue Panzerung vorbereitet sein, die unsere Feinde entwickeln mögen."
