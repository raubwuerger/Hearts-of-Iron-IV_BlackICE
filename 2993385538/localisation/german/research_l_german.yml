wood_engines2_desc:0	"Weitere Verbesserungen führen dazu, dass mehr Menschen die neue Technologie nutzen werden"
wood2_tt:0	"Reduziert den Treibstoffverbrauch der Zivilbevölkerung auf 75 % des Gesamtverbrauchs"
char_engines:0	"Holzkohlemotoren"
char_engines_desc:0	"Durch die Umstellung auf Holzkohle als Brennstoff sind die neuen Motoren leicht genug, um einen begrenzten militärischen Einsatz zu ermöglichen"
quality_control_desc:0	"Ein Fokus auf Qualitätskontrolle wird langfristig zu Effizienzsteigerungen führen"
fluorescent_lighting:0	"Leuchtstoffbeleuchtung"
fluorescent_lighting_desc:0	"Dank dieser Weiterentwicklung der einfachen Glühbirne können Fabriken länger arbeiten und dabei Energiekosten einsparen"
improved_blood_transfusions:0	"Verbesserte Bluttransfusionen"
improved_blood_transfusions_desc:0	"Das Wissen, dass Verwundungen im Kampf nicht mehr die düstere Bedrohung darstellen, die sie im letzten Krieg darstellten, verbessert die Moral unter den Truppen"
immunization_advances:0	"Fortschritte bei der Immunisierung"
multiple_vaccines:0	"Mehrere Impfstoffe"
multiple_vaccines_desc:0	"Neue Durchbrüche haben nicht nur die Wirksamkeit unserer Impfstoffe verbessert, sondern auch ermöglicht, dass sie in einer einzigen Dosis verabreicht werden können"
antimicrobial_sulfa_drugs:0	"Antimikrobielle Sulfonamide"
antimicrobial_sulfa_drugs_desc:0	""
vaccine_research_improvements:	"Fortschrittliche Impfstoffforschung"
polio_vaccines_desc:	"Durch die Förderung der Forschung zur Immunität gegen das Poliovirus werden wir den ersten erfolgreichen Impfstoff gegen diese verheerende Krankheit entwickeln. Massenimpfprogramme werden künftige Generationen schützen und einen bedeutenden Meilenstein in der Medizin und im Gesundheitswesen darstellen"
antibiotics:0	"Antibiotika"
commercial_food_processing:0	"Kommerzielle Lebensmittelverarbeitung"
commercial_food_processing_desc:0	"Durch den Aufbau groß angelegter Lebensmittelverarbeitungsanlagen werden wir die Haltbarkeit verderblicher Waren verlängern und die Lebensmittelverteilung verbessern. Konserven, Trockenrationen und standardisierte Verpackungen werden es uns ermöglichen, sowohl Streitkräfte als auch die Zivilbevölkerung in Krisenzeiten zuverlässig mit Nahrungsmitteln zu versorgen."
automated_assembly_lines_desc:0	"Durch die Einführung automatisierter Fertigungsstraßen werden wir ein beispielloses Maß an Effizienz in der Massenproduktion erreichen. Mechanisierte Arbeitsabläufe werden die Abhängigkeit von Handarbeit verringern, die Produktionszeit pro Einheit minimieren und eine gleichbleibende Qualität aller hergestellten Güter gewährleisten. Diese Innovation wird es uns ermöglichen, unsere Feinde in der Produktion zu übertreffen und langwierige militärische Kampagnen aufrechtzuerhalten."
commercial_catalytic_cracking:0	"Kommerziell nutzbares katalytisches Cracken"
fluid_catalytic_cracking_desc:0	" Durch die Weiterentwicklung der Wirbelschichtkatalysator-Technologie werden wir die Geschwindigkeit und Effizienz von Raffinerieprozessen weiter verbessern. Diese Innovation ermöglicht eine kontinuierliche Kraftstoffproduktion und stellt sicher, dass unser Militär und unsere Industrie bei kritischen Operationen niemals mit Engpässen konfrontiert werden."
chemical_industry_i:0	"Chemische Industrie"
chemical_industry_iv:0	"Chemische Industrie IV"
military_production_ii:	"Fortschrittliche militärische Produktion"
basic_particle_accelerators_desc:0	""
improved_particle_sources:0	"Verbesserte Teilchenquellen"
synchrotron_particle_accelerators:0	"Synchrotron-Teilchenbeschleuniger"
nuclear_reactor_designs:0	"Reaktorkonstruktionen"
nuclear_reactor_designs_desc:0	""
nuclear_reactor_tech_heavy_water_desc:0	""
avionics_improvements:0	"Verbesserungen in der Avionik"
avionics_improvements_desc:0	"Durch die Vereinheitlichung der unseren Piloten zur Verfügung gestellten Instrumente verringern wir die Wahrscheinlichkeit eines katastrophalen Unfalls, der durch Fehlinterpretationen dieser Instrumente verursacht wird"
advanced_avionics:0	"Fortschrittliche Avionik"
advanced_avionics_desc:0	"Durch die Ausstattung unserer Flugzeuge mit Funknavigationsgeräten können wir unseren Piloten helfen, nachts zu ihren Flugplätzen zurückzukehren. Wir können auch eine Anzeige einbauen, um unseren Piloten die Landung bei Nacht mithilfe unserer ILS-Systeme zu erleichtern"
basic_land_launched_rockets_desc:0	"Durch die Entwicklung einfacher, ungelenkter, bodengestützter Raketen legen wir den Grundstein für die moderne Raketentechnik. Diese primitiven Waffen, die von mobilen oder stationären Abschussrampen abgefeuert werden, bieten eine kostengünstige und effektive Möglichkeit, explosive Sprengladungen gegen feindliche Stellungen einzusetzen. Obwohl es ihnen an Reichweite und Präzision mangelt, bieten sie bei massenhaftem Einsatz verheerende Feuerkraft."
basic_missile_concepts_desc:0	"Der Übergang von ungelenkten Raketen zu echten Flugkörpern beginnt mit der Erforschung von Stabilität und kontrolliertem Flug. Durch den Einbau primitiver Steuerflügel, aerodynamischer Formgebung und früher gyroskopischer Stabilisatoren werden wir präzisere Langstreckenwaffen herstellen. Auch wenn sie noch ungenau sind, markieren diese frühen Entwürfe den ersten Schritt hin zu wirklich eigenständigen Flugkörpersystemen. "
ballistic_missile_concepts:0	"Konzepte für ballistische Raketen"
liquid_fueled_rockets_desc:0	"Durch die Weiterentwicklung der Flüssigtreibstofftechnologie werden wir über Feststoffkonstruktionen hinausgehen und Raketensysteme mit hohem Schub und großer Reichweite erforschen. Flüssigtreibstoffraketen verbrennen effizienter und lassen sich für den Transport größerer Nutzlasten skalieren, wodurch sie den Grundstein für fortschrittliche Raketensysteme der Zukunft legen. Dieser Durchbruch wird entscheidend sein, um echte Langstrecken-Feuerkraft zu erreichen."
experimental_rockets:0	"Experimentelle Raketen"
experimental_rockets_desc:0	"Die Weiterentwicklung der Raketenwissenschaft durch die Verbesserung der Reichweite und Zuverlässigkeit von Flüssigtreibstoffraketen wird uns genügend Erkenntnisse über die Technologie liefern, um den Bau von Startplätzen für fortschrittlichere Modelle zu ermöglichen."
rocket_engines_desc:0	"Die Weiterentwicklung von Hochleistungsraketentriebwerken wird es uns ermöglichen, zuverlässigere und leistungsstärkere Antriebssysteme zu entwickeln. Durch Experimente mit Schubvektorsteuerung, Verbrennungseffizienz und Kühltechniken werden wir Triebwerke herstellen, die sowohl an Flugzeugen montierte als auch bodengestützte Raketen auf beispiellose Geschwindigkeiten beschleunigen können."
improved_rocket_engines:0	" Verbesserte Raketentriebwerke"
improved_rocket_engines_desc:0	"Durch die Integration fortschrittlicher Treibstoffgemische, präzisionsgefertigter Triebwerkskomponenten und verstärkter Düsen werden wir die Schubeffizienz und die Brenndauer drastisch verbessern. Diese Verbesserungen werden die Reichweite unserer Raketen erweitern und die Grundlage für komplexere Raketenkonstruktionen bilden."
early_guidance_systems:0	"Frühe Lenksysteme"
early_guidance_systems_desc:0	"Durch die Integration von gyroskopischer Stabilisierung, rudimentären Bordcomputern und aerodynamischen Steuerflächen werden wir die ersten Schritte in Richtung präzisionsgelenkter Raketen unternehmen. Diese frühen Systeme sind zwar noch unausgereift, ermöglichen jedoch eine höhere Genauigkeit bei ballistischen Raketen und Marschflugkörpern und gewährleisten so effektivere Angriffe auf kritische feindliche Infrastruktur und militärische Einrichtungen."
