chemical_industry_i_desc:0	"Die chemische Industrie bietet die Möglichkeit, die landwirtschaftliche, industrielle und militärische Produktion zu verbessern, so dass mehr Güter des täglichen Bedarfs vor Ort hergestellt werden können."
chemical_industry_ii:0	"Chemische Industrie II"
chemical_industry_ii_desc:0	"Die chemische Industrie bietet die Möglichkeit, die landwirtschaftliche, industrielle und militärische Produktion zu verbessern, so dass wir vor Ort mehr Güter des täglichen Bedarfs herstellen können."
chemical_industry_iii:0	"Chemische Industrie III"
chemical_industry_iii_desc:0	"Die chemische Industrie bietet die Möglichkeit, die landwirtschaftliche, industrielle und militärische Produktion zu verbessern, so dass wir vor Ort mehr Güter des täglichen Bedarfs herstellen können."

chemical_industry_iv_desc:0	"Die chemische Industrie bietet die Möglichkeit, die landwirtschaftliche, industrielle und militärische Produktion zu verbessern, so dass vor Ort mehr Güter des täglichen Bedarfs hergestellt werden können."
military_production_i:0	"Militärische Produktion"
military_production_i_desc:	"Durch den Ausbau unserer industriellen Kapazitäten und die Zentralisierung der militärischen Beschaffung werden wir die Grundlage für eine groß angelegte Waffenproduktion schaffen. Standardisierte Montageprozesse und ein verbessertes Management der Versorgungskette werden es uns ermöglichen, die Ausrüstung effizienter herzustellen und einen stetigen Fluss von Waffen, Fahrzeugen und Nachschub für unsere Streitkräfte zu gewährleisten."

military_production_ii_desc:	"Durch die vollständige Umsetzung von Skaleneffekten werden wir die Geschwindigkeit und Effizienz der militärischen Produktion erheblich steigern. Rationalisierte Fabriklayouts, Massenproduktionstechniken und die Spezialisierung der Arbeitskräfte werden die Kosten senken und Engpässe beseitigen, so dass wir Kriegsmaterial in noch nie dagewesenen Mengen produzieren können, ohne Abstriche bei der Qualität zu machen."
military_production_iii:	"Totale Kriegsindustrialisierung"
military_production_iii_desc:	"Indem wir die Vorteile unserer für den Krieg mobilisierten Wirtschaft nutzen, werden wir die Produktionsleistung durch optimierte Ressourcenzuweisung, erweiterte Arbeitskräftepools und unerbittliche Effizienzsteigerungen maximieren. Die Umrüstung von Fabriken, Rund-um-die-Uhr-Schichten und kampforientierte Innovationen werden sicherstellen, dass unsere Streitkräfte schneller versorgt werden, als der Feind sie aufbrauchen kann. Dieses Maß an industriellem Engagement sorgt für die materielle Überlegenheit, die für eine anhaltende Kriegsführung erforderlich ist."
