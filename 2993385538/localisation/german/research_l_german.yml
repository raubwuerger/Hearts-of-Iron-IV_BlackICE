leaf_suspension:0	"Blattaufhängung"
leaf_suspension_desc:0	" Eine Blattfeder hat die Form eines schlanken, bogenförmigen Stücks Federstahl mit rechteckigem Querschnitt. In der gängigsten Konfiguration ist die Achse in der Mitte des Bogens untergebracht, während die Schlaufen an beiden Enden für die Befestigung am Fahrzeugrahmen sorgen. Bei sehr schweren Fahrzeugen kann eine Blattfeder aus mehreren Blättern bestehen, die in mehreren Lagen übereinander gestapelt sind, oft mit zunehmend kürzeren Blättern. Blattfedern können neben der Federungsfunktion auch eine Positionierungs- und bis zu einem gewissen Grad eine Dämpfungsfunktion haben. Die Reibung zwischen den Blättern hat zwar eine dämpfende Wirkung, ist aber nicht gut kontrollierbar und führt zu einer Reibung in der Bewegung der Aufhängung"
horstmann_suspension:0	"Horstmann-Federung"
horstmann_suspension_desc:0	"Das wichtigste Konstruktionsmerkmal ist, dass zwei oder mehr Räder an einem gemeinsamen Rahmen befestigt sind. Jedes Rad ist an einer L-förmigen Schwinge befestigt, die einen Umlenkhebel bildet, so dass die Aufwärtsbewegung des Rades in eine Seitwärtsbewegung des oberen Teils des Kurbels umgewandelt wird. Die beiden Arme können auf einer gemeinsamen Drehachse oder, was häufiger der Fall ist, auf zwei eng beieinander liegenden Wellen gelagert sein. Die beiden Räder teilen sich eine Schraubenfeder, die horizontal zwischen den oberen Enden der Kurbelarme verläuft. Wenn sich also ein Rad über ein Hindernis bewegt, wird die Feder gegen die Schwinge des anderen Rades gedrückt."
torsion_suspension:0	"Torsionsfederung"
duck_bills:0	"Entenschnäbel"
duck_bills_desc:0	"Hierbei handelte es sich um einen Endverbinder mit einem angeschweißten Stahlblechfuß, der, wenn er auf die Kette aufgeschraubt wurde, die Breite der Kette in weichem Gelände um einige Zentimeter erhöhte. Der einzige Nachteil war, dass sie ziemlich leicht abbrachen, aber leicht genug zu ersetzen waren."
bolted_armor:0	"Verbesserte Panzerkonstruktion"
welded_armor_desc:0	""
rotating_turret:0	"Angetriebene Geschütztürme"
rotating_turret_desc:0	""
gun_stabilization:0	"Stabilisierung der Kanone"
gun_stabilization_desc:0	"Der Mechanismus umfasst in der Regel eine Winkelreferenzvorrichtung wie einen mechanischen oder optischen Kreisel und Servomechanismen. Bei einem Panzer gibt es ein Servo zur Stabilisierung des Turms und ein weiteres für die Höhenverstellung der Kanone. Die Zieleinstellung erfolgt dann durch Steuereingaben in den Mechanismus und nicht direkt an der Kanone."
tank_radio2:0	"Verbesserte Panzerfunkgeräte"
tank_radio2_desc:0	"Der Einbau von Funkgeräten in einen Panzer gibt dem Kommandanten die Möglichkeit, seine Aktionen noch schneller und besser zu koordinieren, so dass er schneller auf Feindbewegungen reagieren kann. Dadurch werden 2 zusätzliche Funkgeräte für jedes Bataillon benötigt."
tank_radio3:0	"Erweiterte Panzerfunkgeräte"
tank_radio3_desc:0	""
corps_communications:0	"Korps-Hauptquartier-Funkgerät"
corps_communications_desc:0	"Durch den Einsatz von Funkgeräten hat das Hauptquartier mehr Kontrolle über die Operationen. Sogar die Korps-Ebene wird über eine direkte taktische Kommunikation mit den Einheiten im Feld verfügen, um Manöver zu koordinieren. Die Divisionshauptquartiere benötigen zusätzlich 2 Funkgeräte."
hfdf_tech_desc:0	"Eine Rahmenantenne, die mechanisch gedreht werden kann. Der Bediener stellt einen bekannten Radiosender ein und dreht dann die Antenne, bis das Signal verschwindet. Das bedeutete, dass die Antenne nun im rechten Winkel zum Sender stand, obwohl sich dieser auf beiden Seiten der Antenne befinden konnte. Durch mehrere solcher Messungen oder die Verwendung einer anderen Form von Navigationsinformation, um eine der unklaren Richtungen zu eliminieren, konnte die Peilung zum Sender bestimmt werden."
hfdf_tech2:0	"Watson-Watt-Antenne"
hfdf_tech2_lar:0	"Watson-Watt-Antenne"
hfdf_tech3_lar_desc:0	"HF/DF (Huffduff) nutzte eine Reihe von Antennen, um das gleiche Signal in leicht unterschiedlichen Positionen oder Winkeln zu empfangen, und nutzte dann diese leichten Unterschiede im Signal, um die Peilung zum Sender auf einem Oszilloskop-Display anzuzeigen. Frühere Systeme arbeiteten mit einer mechanisch gedrehten Antenne (oder einem Solenoid) und einem Bediener, der nach Spitzen oder Nullen im Signal lauschte, was eine beträchtliche Zeit in Anspruch nahm, oft in der Größenordnung von einer Minute oder mehr. Das HF/DF-Display führte die gleiche Messung im Wesentlichen sofort durch, wodurch es flüchtige Signale, wie die der U-Boot-Flotte, erfassen konnte. "

