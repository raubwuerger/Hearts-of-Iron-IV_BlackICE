tech_sub_torpedo_tubes2_desc:0	"Der Typ VIIC/43 war ein geplantes, dem VIIC/42 ähnliches Design, jedoch mit verbesserter Feuerkraft. Er sollte sechs Torpedorohranlagen im Bug und vier im Heck beherbergen. Dieses Design wurde im Mai 1943 verworfen."
