armor_chassis_tt:0	"§CPanzerfahrgestell-Technologie§!\n"
cat_medium_armor_tt:0	" §CTechnologie für mittlere Panzer§!\n"
cat_medium_armor_component_tt:0	"§CTechnologie für Komponenten von mittleren Panzern§!\n"
cat_heavy_armor_component_tt:0	"§CTechnologie für schwere Panzer-Komponenten§!\n"
armor_tech_transmission_tt:0	" §CGetriebetechnik für Panzer§!\n"
armor_tech_engine_diesel_tt:0	"§CTechnologie für Panzerdieselmotoren§!\n"
armor_tech_armor_tt:0	"§CPanzer-Panzerungstechnik§!\n"
flexiable_armour_desc:0	"Es könnte eine Zeit kommen, in der unsere mobilen Streitkräfte gemäß dem Gesamtplan rasch von einer Position zur anderen verlegt werden müssen; daher müssen wir genau darauf vorbereitet sein."
assault_operations:0	"Angriffsoperationen"
assault_operations_desc:0	"Angriff ist die beste Verteidigung. Niemand hat jemals etwas erfolgreich verteidigt, es gibt nur Angriff und Angriff und noch mehr Angriff."
ambush_tactics:0	"Hinterhaltstaktiken"
ambush_tactics_desc:0	 "Indem wir unsere Streitkräfte in Erwartung des Feindes sorgfältig positionieren, können wir den Überraschungseffekt perfekt nutzen und ihn ausschalten, bevor er überhaupt begreift, was ihn getroffen hat."
unconventional_warfare:0	"Unkonventionelle Kriegsführung"
unconventional_warfare_desc:0	"Die Verbesserung der Kampfkraft irregulärer Militäreinheiten sowie derjenigen, die als veraltet gelten, wird unsere Feinde unweigerlich in ein falsches Gefühl der Sicherheit wiegen, da sie die wahren Fähigkeiten unserer irregulären Truppen nicht kennen."
local_knowledge:0	"Ortskenntnis"
home_defense_desc:0	"Kein Haushalt in unserem Land darf ohne Waffen, grundlegende Verteidigungsmaßnahmen und Befestigungen sein. Der Feind wird jeden blutigen Meter erkämpfen müssen, um auch nur den geringsten Vormarsch zu erzielen."
impassible_line:0	"Unüberwindbare Linie"
strongpoint_focus_desc:0	"Zwar müssen unsere Verteidigungskräfte stets bereit sein, sich je nach Lage zu bewegen, doch bietet es Vorteile, wenn man"
tactical_withdrawal_desc:0	"Geländeverluste sind ein akzeptabler Kompromiss für eine taktisch bessere Verteidigungsposition: Behalten Sie die Männer, verlieren Sie Land – Land kann wieder erobert werden."
medicine_doctrine_desc:0	"Durch die Integration von spezialisierten Sanitätern auf Kompanieebene stellen wir sofortige medizinische Versorgung auf dem Schlachtfeld sicher, senken die Verlustraten und verbessern den Zusammenhalt der Einheit. Indem sie Erste Hilfe leisten und verwundete Soldaten vor der Evakuierung stabilisieren, erhöhen unsere Sanitäter die Überlebensfähigkeit auf dem Schlachtfeld und sichern die Einsatzfähigkeit unter Beschuss. \n"Ein Schütze kämpft für den Mann neben ihm, aber ein Sanitäter kämpft für sie alle. Ohne sie ist eine Kompanie nur einen einzigen missglückten Gefechtseinsatz davon entfernt, auseinanderzufallen."
combat_medicine_desc:0	"Fortschritte in der Feldmedizin werden die Überlebensraten verwundeter Soldaten erheblich steigern. Die Einführung von Sulfonamid-Medikamenten, Calciumhypochlorit (Calox-Pulver) zur Wundsterilisation sowie verbesserte Feldverbände verringerten das Infektionsrisiko, die häufigste Ursache für Todesfälle im Kampf. Der weitverbreitete Einsatz von Morphiumspritzen sorgte für schnelle Schmerzlinderung, während verbesserte Triage-Protokolle und der Ausbau spezieller Vorwärtssanitätsposten eine schnellere Behandlung und Evakuierung ermöglichten. Diese Innovationen stellten sicher, dass mehr Soldaten lebend in den Kampf – oder nach Hause – zurückkehrten.\n"Der Mut eines Soldaten kann Schlachten gewinnen, aber nur das Können eines Sanitäters kann ihn zurückbringen, um an einem anderen Tag weiterzukämpfen." "
medical_evacuation_desc:0	"Durch die Steigerung unseres Motorisierungsgrades werden wir die Versorgung von Verwundeten auf dem Schlachtfeld revolutionieren und die Zeit zwischen Verletzung und Behandlung drastisch verkürzen. Spezielle Sanitätskompanien, ausgestattet mit für den Feldeinsatz umgebauten Lastwagen und speziell angefertigten Sanitätsfahrzeugen, werden die Abhängigkeit von Pferdegespannen ersetzen und eine schnellere und effizientere Evakuierung von der Front gewährleisten. Die Einrichtung von Sammelstellen für Verwundete und Triage-Stationen entlang des Straßennetzes wird den Patientenfluss optimieren, während eine verbesserte Koordination zwischen Sanitätern und Transportteams sicherstellt, dass die Verwundeten rechtzeitig in Feldlazarette gelangen, um lebensrettende Maßnahmen zu erhalten. Diese Mechanisierung der medizinischen Evakuierung wird eine entscheidende Rolle bei der Senkung der Sterblichkeitsrate im Krieg spielen.\n"Die beste Chance für einen verwundeten Soldaten ist nicht nur ein guter Sanitäter – es ist, rechtzeitig zu einem zu gelangen." "
interservice_hq_tt:0	"\nAn alle Einheitsführer: \n    Ersetzt §Y$basic_hq$§! durch §Y$interservice_hq$§!, wirksame Änderung:|___NL0 05961___|    $MODIFIER_ARMY_LEADER_MAX_ARMY_GROUP_SIZE$: §G+1§!\n"
interservice_hq_desc:0	"Die Koordination zwischen Infanterie, Panzern und Luftwaffe erfordert eine komplexe und leistungsfähige Kommando- und Kontrollstruktur"
corps_hq:0	"Verbessertes Korps-Hauptquartier"
corps_hq_desc:0	"Das Korps ist für groß angelegte Kampfhandlungen zuständig. Hier werden Städte und Brückenköpfe gewonnen oder verloren."
army_hq:0	"Verbessertes Armeehauptquartier"
army_hq_desc:0	"Auf dieser Ebene werden Operationen organisiert; hier werden Regionen gewonnen oder verloren."
supreme_hq:0	"Verbessertes Oberkommando"
medicine_doctrine:0	"Kompanie-Sanitäter"
medical_evacuation:0	"Medizinische Evakuierung"
pilot_rescue:0	"Pilotenrettung"
strategic_redeployment2:0	"Strategische Umgruppierung II"
strategic_redeployment_desc:0	"Optimierung der Beschaffung von Zügen und der Einsatzbereitschaft von Lastwagen für den Truppentransport"
strategic_redeployment2_desc:0	"Wir müssen in der Lage sein, Truppen bei Bedarf über einen ganzen Kontinent zu verlegen."
supply_transportation_doc_desc:0	"Eine Armee marschiert auf dem Magen. Die Versorgung muss mit einer Armee auf dem Vormarsch Schritt halten können"
supply_organisation_doc:0	"Versorgungsorganisation"
supply_organisation_doc_desc:0	" Es muss bekannt sein, was wohin geht. Verzögerungen und Verwechslungen dürfen nicht toleriert werden."
brigade_doctrine:0	"Regimentsdoktrinen"
infantry_training_doc:0	"Ausbildungstechniken der Infanterie"
infantry_training_doc_desc:0	"Durch die Weiterentwicklung der Infanteriedoktrin erhöhen wir die Kampfkraft, den Zusammenhalt der Einheiten und die Anpassungsfähigkeit auf dem Schlachtfeld. Die Truppen werden in modernen Taktiken für kleine Einheiten, im Häuserkampf und in der Verteidigungsbefestigung ausgebildet, um die Einsatzbereitschaft für jede Gefechtssituation sicherzustellen. Diese Fortschritte werden unsere Infanterie zum Rückgrat jeder Kampagne machen.\n'Kriege mögen von Politikern begonnen werden – doch gewonnen werden sie von den Männern, die mit Feuer im Bauch und Eisen im Herzen durch den Schlamm kriechen. '"
infantry_command_doc:0	"Verbessertes Infanterie-Kommando"
infantry_command_doc_desc:0	"Durch die Weiterentwicklung der Doktrin für das Infanterie-Kommando werden wir den Zusammenhalt der Einheiten, die Flexibilität auf dem Schlachtfeld und die Reaktion auf dynamische Bedrohungen verbessern. Klarere Befehlsketten, eine bessere Delegation von Befugnissen und eine effektivere Nutzung der Feldkommunikation werden sicherstellen, dass jeder Trupp diszipliniert und zielgerichtet kämpft. Diese Fortschritte werden unsere Infanterie unter Beschuss widerstandsfähiger machen.\n"Eine gut geführte Kompanie kämpft wie ein Bataillon. Ein schlecht geführtes Bataillon kämpft wie ein Mob.""
infantry_combined_doc:0	" Infanterie-Kombinierte Waffen"
mobile_training_doc:0	"Mobile Ausbildungstechniken"
mobile_training_doc_desc:0	"Durch die Weiterentwicklung der Ausbildung für motorisierte und mechanisierte Verbände werden wir die Mobilität, die Koordination und die Fähigkeiten zum schnellen Einsatz verbessern. Die Truppen werden lernen, Geschwindigkeit und Flexibilität zu nutzen, um Durchbrüche zu maximieren und gleichzeitig die Versorgungssicherheit aufrechtzuerhalten. Diese Verbesserungen werden unsere mobilen Einheiten zur Speerspitze jeder Offensivoperation machen.\n"Der ultimative Sieg besteht darin, den Feind so gründlich auszumanövrieren, dass er bereits besiegt ist, noch bevor die Schlacht überhaupt begonnen hat."
mobile_command_doc:0	"Verbessertes mobiles Kommando"
mobile_command_doc_desc:0	"Durch die Modernisierung der Kommandostrukturen für motorisierte und mechanisierte Streitkräfte werden wir Reaktionszeiten, die Koordination der Einheiten und die Anpassungsfähigkeit verbessern. Klare Führungshierarchien und optimierte Bewegungsbefehle werden es mobilen Einheiten ermöglichen, schnell auf sich ändernde Gegebenheiten auf dem Schlachtfeld zu reagieren, die Dynamik aufrechtzuerhalten und präzise zuzuschlagen.\n"Im Krieg sterben die Langsamen zuerst. Erfahrene Offiziere und schnelle Fahrzeuge sorgen dafür, dass wir nie zu spät kommen."
mobile_combined_doc:0	"Mobile kombinierte Waffen"
recon_training_doc_desc:0	"Durch die Optimierung der Aufklärungsausbildung werden wir das Lagebewusstsein auf dem Schlachtfeld, die Überlebensfähigkeit der Einheiten und die Genauigkeit der nachrichtendienstlichen Informationen verbessern. Durch die Betonung von Tarnung, schneller Berichterstattung und Taktiken der tiefen Durchdringung können Aufklärungseinheiten Bedrohungen und Chancen erkennen, bevor der Feind reagiert. Diese Fortschritte verschaffen unseren Streitkräften einen entscheidenden Vorteil bei der Einsatzplanung.\n"Zu wissen, wo sich der Feind befindet, ist wichtig. Zu wissen, wo er sich befinden wird, ist noch wichtiger"
recon_command_doc:0	"Verbessertes Aufklärungskommando"
armor_command_doc:0	"Verbessertes Panzerkommando"
armor_combined_doc:0	"Panzer-Kombinierte Waffen"
artillery_training_doc:0	"Artillerie-Ausbildungstechniken"
artillery_command_doc_desc:0	"Durch die Verbesserung der Artillerie-Führung und -Kontrolle werden wir die Feuerkoordination, die Zielpriorisierung und die Reaktionszeiten verbessern. Fortgeschrittene Zielerfassungstechniken und verfeinerte Verfahren zur Feuerunterstützung werden sicherstellen, dass jeder Sperrfeuerangriff präzise und vernichtend ist. Eine bessere Integration mit den Frontverbänden ermöglicht schnelle Anpassungen, wodurch die feindlichen Streitkräfte unter ständigem Druck gehalten werden.\n"Die Artillerie ist die Stimme des Schlachtfeldes. Befehligen Sie sie gut, und der Feind wird nie wieder sprechen."
artillery_combined_doc:0	"Artillerie im kombinierten Waffeneinsatz"
license_equipment:0	"Anpassungen ausländischer Konstruktionen"
license_equipment_desc:0	"Ausländische Konstruktionen könnten die richtige Idee haben. Wir sollten in der Lage sein, unsere eigenen Versionen herzustellen."
airhead_doc:0	"Luftlandeeinheiten"
airhead_doc_desc:0	"Die Landezone muss schnell gesichert werden, um zu verhindern, dass sofortige Gegenangriffe die Formation aufbrechen."
