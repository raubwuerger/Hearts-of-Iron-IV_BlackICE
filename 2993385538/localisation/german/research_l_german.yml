tech_kr_basic_sonar_dd_desc:0	"Die Ortung von Schiffen unter Wasser mithilfe von Schall war (und ist) eine komplexe Wissenschaft, und Sonarsysteme wurden zwischen dem Ende des Ersten und dem Zweiten Weltkrieg mehrfach weiterentwickelt"
tech_kr_asw_mortars_dd:0	"U-Boot-Abwehrmörser"
tech_kr_advanced_sonar_dd:0	"Fortgeschrittenes Sonar"
tech_kr_advanced_sonar_dd_desc:0	"Als Vertreter des fortschrittlichsten Sonars, das in dieser Zeit entwickelt wurde, sind diese Systeme besser in der Lage, getauchte Angreifer aufzuspüren, und spielen eine wichtige Rolle bei der Bekämpfung der sich ständig verbessernden U-Boot-Konstruktion."
tech_kr_Interwar_AA_dd:0	"Flugabwehrgeschütze auf Schiffen der Zwischenkriegszeit"
tech_kr_Interwar_AA_dd_desc:0	"Zwar hatten die Marinen bereits vor dem Ende des Ersten Weltkriegs damit begonnen, ihre Schiffe mit Flugabwehrgeschützen auszustatten, doch viele Marinen weiteten ihre Investitionen in die Marine-Flugabwehr in den 1920er Jahren aus und entwickelten mittelkalibrige Schnellfeuerwaffen, die in erster Linie zur Bekämpfung von Flugzeugen bestimmt waren."
tech_kr_Early_War_AA_dd_desc:0	"Die Erfahrungen aus dem Krieg machten deutlich, dass bestehende und neue Schiffe mit umfangreicheren Flugabwehranlagen ausgestattet werden mussten, um der Bedrohung durch Flugzeuge entgegenzuwirken."
tech_kr_advanced_fc_radar_dd:0	"Flugabwehr-Feuerleitradar"
tech_kr_cl:0	"Leipzig-Klasse"
tech_kr_cl2:0	"M-Klasse"
tech_kr_cl4:0	"Spähkreuzer-Klasse"
tech_kr_early_sonar_cl:0	"Frühe Sonaranlagen"
tech_kr_early_sonar_cl_desc:0	"Das Sonar, das am Ende des Ersten Weltkriegs entwickelt wurde und ursprünglich als ASDIC bekannt war, galt damals als Mittel, das U-Boote in zukünftigen Kriegen wahrscheinlich unwirksam machen würde.  Obwohl dies eine drastische Überschätzung der Fähigkeiten des Sonars darstellte, waren diese frühen Geräte dennoch nützlich, um Überwasserschiffen den Kampf gegen untergetauchte Feinde zu ermöglichen."
tech_kr_depth_charge_throwers_cl:0	"Wasserbombenwerfer"
tech_kr_depth_charge_throwers_cl_desc:0	"Die Hauptwaffe gegen U-Boote in der Zwischenkriegszeit und während des größten Teils des Zweiten Weltkriegs war die Wasserbombe.  Wasserbomben konnten vom Heck eines Schiffes auf die vermutete Position eines U-Boots geworfen werden, doch die Entwicklung von Wasserbombenwerfern ermöglichte es den Schiffen, Wasserbomben in einem größeren Gebiet abzustürzen, was ihre Wirksamkeit erhöhte."
tech_kr_basic_sonar_cl:0	"Einfaches Sonar"
tech_kr_asw_mortars_cl:0	"U-Boot-Abwehrmörser"
tech_kr_asw_mortars_cl_desc:0	"Ein wesentlicher Nachteil des Sonars bestand darin, dass der Kontakt abbrach, sobald das angreifende Schiff das Ziel überfuhr, was dem U-Boot ein Zeitfenster verschaffte, in dem es manövrieren konnte, um dem bevorstehenden Wasserbombenangriff zu entgehen.  Die Erfindung von U-Boot-Abwehrmörsern wie Hedgehog und Mousetrap ermöglichte es den Begleitschiffen, auf Ziele vor ihnen zu feuern, und stellte eine wichtige Ergänzung der U-Boot-Abwehr dar."
tech_kr_advanced_sonar_cl:0	"Fortschrittliches Sonar"
tech_kr_cl_interwar_torpedoes_desc:0	"Torpedos wurden nach dem Ersten Weltkrieg weiterentwickelt, und die meisten Großmächte des Zweiten Weltkriegs setzten Torpedos ein, die in den 1920er und frühen 1930er Jahren entwickelt und erstmals in Dienst gestellt worden waren"
tech_kr_cl_magnetic_detonators:0	"Magnetische Zünder"
tech_kr_Late_1930s_AA_cl:0	"Flugabwehrgeschütze auf Schiffen vor dem Krieg"
tech_kr_Late_1930s_AA_cl_desc:0	"Mit der fortschreitenden Entwicklung der Luftfahrt verfeinerten die Marinen ihrerseits ihre Flugabwehrsysteme (auch wenn sich mit Ausbruch des Krieges herausstellen sollte, dass diese der Aufgabe nicht gewachsen waren) durch Systeme mit höherer Geschwindigkeit, Mehrfachrohren und frühe Flugabwehr-Feuerleitsysteme."
tech_kr_Early_War_AA_cl:0	"Ausbau der Schiffs-Flugabwehr während des Krieges"
tech_kr_Early_War_AA_cl_desc:0	"Die Erfahrungen des Krieges machten deutlich, dass größere Flugabwehranlagen auf bestehenden und neuen Schiffen erforderlich waren, um der Bedrohung durch Flugzeuge entgegenzuwirken."
tech_kr_Surface_search_radar_cl:0	"Oberflächen-Suchradar"
tech_kr_Surface_search_radar_cl_desc:0	"Die frühen Radargeräte waren sperrig und benötigten viel Strom, sodass sie praktisch nur auf größeren Schiffen installiert werden konnten. Sie erwiesen sich als wertvoll für die taktische Lageerkennung der Schiffe, insbesondere bei schlechter Sicht."
tech_kr_air_warning_radar_cl:0	"Luftwarnradar"
tech_kr_air_warning_radar_cl_desc:0	"Mit der Weiterentwicklung der Radargeräte wurden diese zur Frühwarnung vor Luftangriffen eingesetzt. Dies ermöglichte es den Schiffen, sich auf die Flugzeuge vorzubereiten und eine stärkere Luftabwehr aufzubauen."
tech_kr_advanced_surface_search_radar_cl:0	"Fortschrittliches Oberflächen-Suchradar"
tech_kr_advanced_surface_search_radar_cl_desc:0	"Die Entwicklung des Zentimeterwellenradars ermöglichte den Einbau weitaus leistungsstärkerer, aber auch weitaus kleinerer Radargeräte.  Dadurch verfügten größere Schiffe über ein noch besseres taktisches Bewusstsein, und auch kleinere Schiffe konnten Radar einsetzen."
tech_kr_surface_fc_radar_cl:0	"Oberflächen-Feuerleitradar"
tech_kr_pbb:0	"Deutschland-Klasse"
tech_kr_early_sonar_ca:0	"Frühe Sonaranlagen"
tech_kr_basic_sonar_ca:0	"Einfache Sonaranlagen"
tech_kr_basic_sonar_ca_desc:0	" Die Ortung von Schiffen unter Wasser mithilfe von Schall war (und ist) eine komplexe Wissenschaft, und Sonarsysteme wurden zwischen dem Ende des Ersten und dem Zweiten Weltkrieg mehrfach weiterentwickelt"
tech_kr_asw_mortars_ca:0	"U-Boot-Abwehrmörser"
tech_kr_asw_mortars_ca_desc:0	"Ein wesentlicher Nachteil des Sonars bestand darin, dass der Kontakt abbrach, sobald das angreifende Schiff das Ziel überfuhr, wodurch das U-Boot ein Zeitfenster erhielt, in dem es manövrieren konnte, um dem bevorstehenden Wasserbombenangriff auszuweichen.  Die Erfindung von U-Boot-Abwehrmörsern wie Hedgehog und Mousetrap ermöglichte es Begleitschiffen, auf Ziele vor ihnen zu feuern, und stellte eine wichtige Ergänzung der U-Boot-Abwehr dar."
tech_kr_advanced_sonar_ca:0	"Fortschrittliches Sonar"
tech_kr_ca_interwar_torpedoes:0	"Torpedos der Zwischenkriegszeit"
tech_kr_ca_interwar_torpedoes_desc:0	"Torpedos wurden nach dem Ersten Weltkrieg weiterentwickelt, und die meisten Großmächte des Zweiten Weltkriegs setzten Torpedos ein, die in den 1920er und frühen 1930er Jahren konstruiert und erstmals in Dienst gestellt worden waren"
tech_kr_ca_magnetic_detonators:0	"Magnetische Zünder"
tech_kr_ca_magnetic_detonators_desc:0	"Obwohl sie anfangs recht unzuverlässig waren, machten magnetische Zünder, sobald sie weiterentwickelt worden waren, Torpedos effektiver."
tech_kr_ca_electric_torpedoes:0	"Elektrische Torpedos"
tech_kr_ca_advanced_torpedoes_desc:0	"Verbesserungen hinsichtlich Zuverlässigkeit, Zielerfassung (einschließlich rudimentärer Zielsuchvorrichtungen) und anderer Bereiche machten die Torpedos, die gegen Ende des Krieges in Dienst gestellt wurden, in der Tat sehr gefährlich."
tech_kr_Early_War_AA_ca:0	"Ausbau der Schiffs-Flugabwehr während des Krieges"
tech_kr_Early_War_AA_ca_desc:0	"Die Erfahrungen des Krieges machten deutlich, dass auf bestehenden und neuen Schiffen umfangreichere Flugabwehranlagen erforderlich waren, um der Bedrohung durch Flugzeuge entgegenzuwirken."
tech_kr_Late_War_AA_ca:0	"Fortschrittliche Schiffs-Flugabwehrsysteme"
tech_kr_air_warning_radar_ca:0	"Luftüberwachungsradar"
tech_kr_air_warning_radar_ca_desc:0	"Mit der Weiterentwicklung der Radargeräte wurden diese zur Frühwarnung vor Luftangriffen eingesetzt. Dies ermöglichte es den Schiffen, sich auf die Flugzeuge vorzubereiten und eine stärkere Luftabwehr aufzubauen."
tech_kr_advanced_surface_search_radar_ca_desc:0	"Die Entwicklung des Zentimeterwellenradars ermöglichte den Einbau weitaus leistungsfähigerer, aber auch weitaus kleinerer Radargeräte. Dies bedeutete, dass größere Schiffe über ein noch besseres taktisches Lagebild verfügten und auch kleinere Schiffe Radar einsetzen konnten."
tech_kr_surface_fc_radar_ca:0	"Oberflächen-Feuerleitradar"
tech_kr_surface_fc_radar_ca_desc:0	"Es dauerte nicht lange, bis Radar zur Unterstützung der Feuerleitung und Entfernungsmessung eingesetzt wurde, wodurch größere Kriegsschiffe auf große Entfernungen und bei Nacht effektiver wurden."
tech_kr_advanced_fc_radar_ca:0	"Flugabwehr-Feuerleitradar"
tech_kr_advanced_fc_radar_ca_desc:0	"Weitere Verbesserungen der Radartechnik führten dazu, dass diese bei der Zielerfassung für die Flugabwehrwaffen der Schiffe halfen, was ein deutlich präziseres Flugabwehrfeuer gegen anfliegende Flugzeuge ermöglichte."
