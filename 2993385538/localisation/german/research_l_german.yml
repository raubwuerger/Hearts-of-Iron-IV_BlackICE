tech_cav_recon2_desc:0	""
tech_cav_recon3_desc:0	""
tech_cav_recon4:0	"Kavallerie-Aufklärung während des Krieges"
tech_cav_recon4_desc:0	""
tech_cav_recon5_desc:0	""
subtech_recon_mot_1:0	"Motorrad-Aufklärungseinheiten"
tech_mot_recon1:0	"Motorrad-Aufklärungseinheiten"
tech_mot_recon2:0	"Mobile Aufklärung vor dem Krieg"
tech_mot_recon2_desc:0	""
tech_mot_recon4_desc:0	"Durch die Ausstattung unserer mobilen Aufklärungseinheiten mit verbesserten Aufklärungsfahrzeugen und Geländewagen werden wir ihre Einsatzfähigkeit in einem breiteren Spektrum von Umgebungen verbessern. Die Fahrzeuge werden über bessere Funkgeräte für eine schnelle Kommunikation sowie über verbesserte Panzerung und Maschinengewehrhalterungen für eine erhöhte Überlebensfähigkeit verfügen. Diese Fortschritte werden es den Aufklärungsteams ermöglichen, tiefere und länger andauernde Aufklärungsmissionen durchzuführen und gleichzeitig die für einen schnellen Rückzug erforderliche Geschwindigkeit und Beweglichkeit beizubehalten."
semi_motorised_infantry:0	"Halbmotorisierte Infanterie"
commando_team_desc:0	"Eine spezialisierte, hochqualifizierte Einheit, die für schnelle, aggressive und oft unkonventionelle Operationen hinter den feindlichen Linien konzipiert ist."
tech_combat_engineers2_desc:0	"Mit moderner Ausrüstung, hochexplosiven Sprengstoffen und hoher Mobilität können unsere Pioniere über ihre traditionellen Aufgaben hinausgehen und den Feind zu Lande und zu Wasser mit ihrem Einfallsreichtum überraschen.\nPioniere [ARM] sind darauf spezialisiert, Fahrzeuge selbst unter Beschuss vom Schlachtfeld zu bergen."
armor_industry:0	"Panzerwerkstätten"
armor_industry_desc:0	"Durch die Einrichtung kleinerer Panzerwerkstätten werden wir unsere Fähigkeiten zur Reparatur und Wartung gepanzerter Fahrzeuge verbessern. Diese Einrichtungen werden dafür sorgen, dass beschädigte Panzer schneller wieder einsatzbereit sind, wodurch unnötige Verluste aufgrund mechanischer Ausfälle verhindert werden."
vehicle_industry_desc:0	" Durch die Einrichtung spezieller Motorenwerkstätten werden wir die Wartung und Montage von Motoren für alle militärischen Anwendungen verbessern. Diese kleinen Einrichtungen werden einen stetigen Nachschub an Ersatzteilen und die Durchführung kleinerer Reparaturen gewährleisten, wodurch unsere Fahrzeuge und Flugzeuge einsatzfähig bleiben."
smallarms_industry_desc:0	""
uniform_industry:0	"Uniformwerkstätten"
uniform_industry_desc:0	""
Jetaircraft_industry_desc:0	""
Ltaircraft_industry:0	"Flugzeugwerkstatt"
Hvaircraft_industry:0	"Bomberwerkstätten"
Hvaircraft_industry_desc:0	""
sub_industry:0	"U-Boot-Werkstätten"
armor_industry2:0	"Panzerfabriken"
armor_industry2_desc:0	"Durch den Übergang zur Serienfertigung von Panzern werden wir die Produktionsleistung steigern und die Effizienz der Panzerfahrzeugfertigung verbessern. Optimierte Fertigungsstraßen und eine zentralisierte Logistik ermöglichen einen schnelleren Einsatz neuer Panzer in den Frontdivisionen."
vehicle_industry2_desc:0	"Durch den Ausbau unserer Motorenproduktionskapazitäten zu vollwertigen Fabriken werden wir die Fertigungsprozesse standardisieren, die Qualitätskontrolle verbessern und die Produktionsleistung steigern. Dies ermöglicht die schnelle Produktion von Hochleistungsmotoren und gewährleistet eine zuverlässige Versorgung unserer mechanisierten Streitkräfte."
artillery_industry2:0	" Artilleriefabriken"
smallarms_industry2:0	"Fabriken für einfache Handfeuerwaffen"
uniform_industry2_desc:0	""
Jetaircraft_industry2_desc:0	""
Hvaircraft_industry2_desc:0	""
sub_industry2:	"U-Boot-Fabriken "
armor_industry3_desc:0	"Durch die vollständige Industrialisierung unserer Panzerproduktionsanlagen werden wir die Produktionsleistung maximieren und die Einheitlichkeit der Konstruktion verbessern. Automatisierte Fertigungsstraßen und Produktionszentren mit hoher Kapazität ermöglichen die Massenproduktion moderner gepanzerter Fahrzeuge und gewährleisten, dass unsere Streitkräfte ihre Überlegenheit auf dem Schlachtfeld bewahren."
artillery_industry3:0	"Große Artilleriefabriken"
uniform_industry3:0	"Große Uniformfabriken"
Hvaircraft_industry3:0	"Große Bomberfabriken"
RPG_weapons:0	"Raketenbetriebene Panzerabwehrwaffen"
RPG_weapons_desc:0	 "RPG-Werfer wie die US-amerikanische Bazooka sowie die deutsche Panzerfaust und der Panzerschreck. Dank eines Feststoffraketenantriebs ermöglichten sie den Einsatz von hochexplosiven Panzerabwehrsprengköpfen (HEAT) gegen gepanzerte Fahrzeuge, Maschinengewehrnester und befestigte Bunker auf Entfernungen, die über die Reichweite einer gewöhnlichen Handgranate oder Mine hinausgingen."
tech_recon5_desc:0	"Durch die vollständige Modernisierung unserer Fußaufklärungskräfte werden wir diese mit den neuesten Errungenschaften in den Bereichen Mobilität, Optik und Feldtechnik ausstatten. Aufklärer werden mit leichten Periskopen, leistungsstarken Ferngläsern und Infrarot-Nachtsichtgeräten ausgestattet, um unter allen Bedingungen eine hervorragende Beobachtung zu gewährleisten. Verbesserte Tarntechniken, Ghillie-Anzüge und geräuscharme Ausrüstung werden die Tarnung verbessern, sodass Teams unbemerkt tiefer in die feindlichen Linien vordringen können. Mit spezieller Ausbildung in Ausweichen, Überleben und schneller Fortbewegung in schwierigem Gelände werden diese Elite-Aufklärungseinheiten unvergleichliche Informationen vom Schlachtfeld liefern, während sie für feindliche Streitkräfte nahezu unentdeckbar bleiben."
