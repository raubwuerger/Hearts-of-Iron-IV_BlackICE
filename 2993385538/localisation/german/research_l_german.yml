ASYMMETRIC_WARFARE_DESC:0	"Unsere Armeen müssen gerissen und einfallsreich sein und in der Lage, den Feind mit dem wenigen, was sie haben, hart zu treffen."


BRIGADE_DOCTRINE_DESC:0	"Regimentseigener Drill und Disziplin bilden einen gehärteten Kern, der jedem Feind die Stirn bietet."
OPERATIONAL_SUPPORT_DOCTRINE_DESC:0	"Die drei B's: Bohnen, Verbandszeug und Kugeln. Gib den Truppen, was sie brauchen, und sie werden den Rest erledigen."
ATTRITIONAL_CONTAINMENT_DOCTRINE_DESC:0	"Belästigen Sie den Feind ständig, um ihn davon abzuhalten, eigene Offensiven zu starten."
ELASTIC_DEFENCE_DOCTRINE_DESC:0	"Es ist unmöglich, den Feind daran zu hindern, an Boden zu gewinnen. Seien Sie bereit für einen vernichtenden Gegenangriff, wenn er in Bedrängnis gerät."


