tech_panzer_ii_equipment_1:0	"Panzer II A/B"
tech_panzer_ii_equipment_1_desc:0	"Um die Lücke bis zur Einführung des Panzer III und IV zu überbrücken, gab die deutsche Militärführung 1934 ein Übergangsfahrzeug in Auftrag. Nach Erprobungen setzte sich das MAN-Modell durch und wurde als Panzer II bekannt. Leicht gepanzert und nur mit Maschinengewehren sowie einer 20-mm-Autokanone bewaffnet, eignete er sich eher für Ausbildungs- und Aufklärungsaufgaben als für den Frontkampf. Dennoch bildete er das Rückgrat der deutschen Panzerdivisionen in der Schlacht um Frankreich, wobei etwa 1.000 Fahrzeuge an der Front im Einsatz standen. Der Panzer II sollte bis zur Verfügbarkeit ausreichender besserer Panzer weiterhin in Nordafrika und in der Sowjetunion dienen.\nDer Panzer II Ausf. A war das erste Serienmodell, das 1935 ausgeliefert wurde. Frühe Tests zeigten, dass sein Motor unterdimensioniert war, und die Variante Ausf. B erhielt einen stärkeren Motor sowie eine dickere Frontpanzerung."
