subtech_light_panzer_td_equipment_1:0	"Panzerjäger I"
subtech_light_panzer_td_equipment_1_desc:0	"Leichter Panzerjäger"\nDie deutsche Militärführung kam schon früh zu dem Schluss, dass eine Art mobiles Panzerabwehrgeschütz eine große Bereicherung für Panzerabwehr-Einheiten darstellen würde, die andernfalls gezogene Waffen einsetzen müssten. Eine Gelegenheit, dieses Konzept zu erproben, ergab sich 1940, nachdem der Panzer I aus dem Frontkampfeinsatz genommen worden war. Eine 37-mm-Pak-Kanone, die später durch eine schlagkräftige tschechische 47-mm-Kanone ersetzt wurde, wurde auf ein turmloses Panzer-I-Fahrgestell montiert und als Panzerjäger I bezeichnet. Das Ergebnis war vielversprechend, wenn auch noch etwas unausgereift. Der Panzerjäger I kam in Nordafrika und an der Ostfront zum Einsatz. Er war in der Lage, gegnerische Panzer zu besiegen, bot der Besatzung jedoch keinen ausreichenden Schutz. Er wurde bis 1945 eingesetzt."
