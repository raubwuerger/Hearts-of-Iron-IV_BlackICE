RESEARCH_INSTANT_DESC:0	"Die Forschung erfolgt sofort, wenn der Baum gewechselt wird und im aktuellen Baum bereits mehr als eine Technologie erforscht wurde."
support_folder_desc:0	"Aufklärung, Pioniere, Feldlazarette und andere Unterstützungsbataillone oder -kompanien."
armour_folder:0	"Alliierte Panzer"
armour_folder_desc:0	"Alliierte Standardpanzer und deren Varianten"
land_doctrine_folder_desc:0	"Landdoktrin, die Kampfweisen Ihrer Bodentruppen"
naval_folder:0	"Marine"
naval_folder_desc:0	"Schiffe und U-Boote"
mtg_navaltechs_folder_desc:	"Verbesserungen für Marineeinheiten"
mtgnavalfolder:0	"Marine"
mtgnavalfolder_desc:0	"Überwasserschiffe. Erforschen Sie neue Module, um Ihre Schiffe anzupassen."
naval_doctrine_folder_desc:0	"Marinedoktrin, wie Ihre Marine kämpft"
air_techs_folder:0	"Luftwaffe"
air_techs_folder_desc:0	"Flugzeuge"
industry:0	"Industrie"
industry_folder_desc:0	"Industrie und Produktionsentwicklung"
electronics_folder:0	"Technik und fortschrittliche Technologie"
mobile_warfare:0	"Mobile Kriegsführung"
mobile_warfare_desc:0	"Mobile Kriegsführung legt den Schwerpunkt auf Geschwindigkeit und Manövrierfähigkeit, um feindliche Streitkräfte abzuschneiden und zu desorganisieren."\n\n"
delay:0	"Verzögerung"
mobile_infantry:0	"Mobile Infanterie"
mobile_infantry_desc:0	" Herkömmliche Infanterie ist oft zu langsam, um mit sich schnell bewegenden Panzertruppen Schritt zu halten, auf sie zu reagieren oder ihnen zu entkommen. Die Lösung besteht darin, sich auf motorisierte oder mechanisierte Infanterie zu konzentrieren, die mit dem Tempo der modernen Kriegsführung mithalten kann.\n\n"
mass_motorization:0	"Massive Motorisierung"
armored_spearhead:0	"Panzerspitze"
armored_spearhead_desc:0	"Um das volle Potenzial von Panzern auszuschöpfen, dürfen diese nicht zur Unterstützung der Infanterie gebunden werden. Stattdessen müssen sie zu schnell beweglichen, unabhängigen Einheiten formiert werden, die Angriffe anführen können."\n\n"
schwerpunk:0	"Schwerpunkt"
kampfgruppe:0	"Kampfgruppe"
kampfgruppe_desc:0	"Eine Kampfgruppe war eine Ad-hoc-Formation, die zur Durchführung einer bestimmten Aufgabe organisiert wurde."
firebrigades:0	"Feuerwehren"
modern_blitzkrieg:0	"Moderner Blitzkrieg"
modern_blitzkrieg_desc:0	" Als Höhepunkt der mobilen Kriegsführung vereint der moderne Blitzkrieg die neuesten technologischen Errungenschaften und die Lehren aus früheren Doktrinen"
volkssturm:0	"Volkssturm"
werwolf_guerillas:0	"Werwolf-Guerillas"
werwolf_guerillas_desc:0	"Die Werwölfe waren eine geplante deutsche Widerstandsgruppe, die nach dem Verlust des Krieges den Kampf gegen die Besatzungsmächte fortsetzen sollte."
superior_firepower:0	"Überlegene Feuerkraft"
mobile_defence:0	"Mobile Verteidigung"
mobile_defence_desc:0	"Mobile Streitkräfte können eingesetzt werden, um die Verteidigung überall dort zu verstärken, wo der Feind angreifen könnte."
intergrated_support:0	"Integrierte Unterstützung"
dispersed_support:0	"Verteilte Unterstützung"
dispersed_support_desc:0	"Durch die Verteilung unserer Unterstützungseinheiten können diese ein größeres Gebiet abdecken, während sie sich außerhalb der Schusslinie aufhalten, was zu Divisionen mit besserer Verteidigung führt. \n\n"
overwhelming_firepower:0	"Überwältigende Feuerkraft"
concentrated_fire_plans:0	"Konzentrierte Feuerpläne"
concentrated_fire_plans_desc:0	" Durch die Bündelung des Feuers verschiedener Batterien zu einem synchronisierten Beschuss kann dem Feind weitaus größerer Schaden zugefügt werden.\n\n"
combined_arms:0	"Kombinierte Waffen"
air_land_battle:0	"Air-Land-Battle"
air_land_battle_desc:0	"Da die Bodentruppen bereits in Formationen der kombinierten Waffen operieren, legt AirLand Battle nun auch besonderen Wert auf eine enge Koordination zwischen Land- und Luftstreitkräften, wodurch die Luft- und Landschlachtfelder zu einem nahtlosen Ganzen verschmelzen."
centralized_fire_control:0	"Zentralisierte Feuerleitung"
advanced_firebases:0	"Vorgerückte Feuerbasen"
advanced_firebases_desc:0	"Artillerielager können in befestigten Stützpunkten nahe der Frontlinie positioniert werden, um vorrückenden Truppen größtmögliche Unterstützung zu bieten."
shock_and_awe:0	"Schock und Ehrfurcht"
trench_warfare:0	"Grabenkrieg"
trench_warfare_desc:0	"Eine Schaufel ist oft die beste Waffe der Infanterie. Einheiten lernen den Wert der Verschanzung in jeder Position, die sie einnehmen."
prepared_defense:0	"Vorbereitete Verteidigung"
grand_mechanized_offensive:0	"Mechanisierte Offensive"
grand_mechanized_offensive_desc:0	"Motorisierte Truppen sind gut und schön, aber um Offensiven zu führen, brauchen wir Infanterie, die in gepanzerten Transportfahrzeugen in die Schlacht fahren kann, die sie schützen und schwere Waffen transportieren."\n\n"
assault_concentration:0	"Angriffskonzentration"
assault_breakthrough:0	"Angriffsdurchbruch"
assault_breakthrough_desc:0	"Anstatt einen groß angelegten Angriff über die gesamte Front zu starten, kann es weitaus effektiver sein, den Angriff auf nur einen oder wenige Punkte der feindlichen Linie zu konzentrieren und dort einen Durchbruch zu erzielen."
central_planning:0	"Zentrale Planung"
infantry_offensive:0	"Infanterieoffensive"
infantry_offensive_desc:0	"Der Offensivgeist der Infanterie ist das entscheidende Element für den Sieg in Schlachten. Unsere Infanterie muss den Weg weisen."\n\n"
armored_operations:0	"Panzeroperationen"
night_assault_tactics:0	"Nachtangriffstaktiken"
night_assault_tactics_desc:0	"Soldaten, die es gewohnt sind, sich nachts zu bewegen und zu kämpfen, können sich entweder für einen Angriff in Stellung bringen oder ahnungslose feindliche Truppen direkt angreifen."
attritional_containment:0	"Zermürbende Eindämmung"
mass_assault:0	"Massenangriff"
mass_assault_desc:0	""Perfekte" Waffen werden überbewertet, eine große Anzahl "gut genug"er Waffen ist der Weg zum Sieg! \n\n"
pocket_defence:0	"Pocket Defense"
large_front_operations:0	"Operationen an der breiten Front"
large_front_operations_desc:0	"Kämpfe an einer breiten Front erfordern die Koordination der Einsätze mehrerer Einheiten über große Entfernungen hinweg: auf operativer Ebene, nicht auf taktischer.\n\n"
deep_operations:0	"Tiefangriffe"
vast_offensives:0	"Großoffensiven"
vast_offensives_desc:0	"Wenn ein Durchbruch erzielt werden kann, muss er so intensiv wie möglich ausgenutzt werden: Eine groß angelegte Offensive, die so tief wie möglich durch die feindlichen Linien vordringt, wird die Verteidigung der feindlichen Front erschweren, unmöglich machen oder irrelevant werden lassen."
breakthrough_priority:0	"Priorität des Durchbruchs"
continuous_offensive:0	"Kontinuierliche Offensive"
continuous_offensive_desc:0	"Zwar sind Durchbrüche, wenn sie richtig ausgenutzt werden, oft sehr wirksam, doch früher oder später ist der Angreifer stets erschöpft, und der Verteidiger kann sich neu organisieren und neue Verteidigungslinien aufstellen. Mit ausreichenden Reserven und der richtigen Organisation könnte eine Offensive jedoch bis in weitere Tiefen fortgesetzt werden, was für den Feind verheerende Folgen hätte."
human_wave_offensive:0	"Menschenwellenoffensive"
large_front_offensive:0	"Großfrontoffensive"
large_front_offensive_desc:0	"Durch die Durchführung oder Androhung von Menschenwellenoffensiven an mehreren Stellen der Front können wir den Feind daran hindern, seine Feuerkraft auf einen einzelnen Angriff zu konzentrieren."
peoples_army:0	"Volksarmee"
infantry_weapons2:0	"Verbesserte Infanteriewaffen I"
infantry_weapons2_desc:0	"Persönliche und Mannschaftswaffen für die Infanterie sowie die verschiedenen anderen Ausrüstungsgegenstände, die ein Soldat benötigt. Verbesserte Waffenmodelle und spezialisiertere Ausrüstung."
infantry_weapons2_ger:0	"Verbesserte Infanteriewaffen I"
infantry_weapons2_usa:0	"Verbesserte Infanteriewaffen I"
infantry_weapons2_usa_desc:0	"Einzel- und Mannschaftswaffen für die Infanterie sowie die verschiedenen anderen Ausrüstungsgegenstände, die ein Soldat benötigt. Verbesserte Waffenmodelle und spezialisiertere Ausrüstung."
GER_motorcycle_infantry_unit:0	"Kradschützen-Truppen"
GER_motorcycle_infantry_unit_desc:0	" Kradschützen-Truppen waren motorisierte, leicht bewaffnete und hochmobile Infanterieeinheiten der deutschen Wehrmacht und der Waffen-SS, die in der Regel in die Panzerdivisionen eingegliedert waren. Die Wehrmacht entwickelte die Kradschützen ab 1936 als schnelle, mobile Angriffs- und Aufklärungskräfte; sie wurden in der Anfangsphase des Zweiten Weltkriegs im Rahmen der deutschen Blitzkrieg-Erfolge und der Operation Barbarossa, der Invasion Russlands, intensiv eingesetzt."
improved_infantry_weapons:	"Verbesserte Infanteriewaffen"
improved_infantry_weapons_2:0	"Verbesserte Infanteriewaffen II"
infantry_at_desc:0	"Die Ausrüstung unserer Infanterieeinheiten mit Panzerabwehrgewehren ermöglicht es ihnen, leichtere gepanzerte Fahrzeuge auszuschalten und dabei ihre Mobilität zu bewahren."
infantry_at_2:0	"Forschung und Konstruktionsverbesserung für Infanterie-Panzerabwehrwaffen"
infantry_at_2_desc:0	"Es kann eine Technologie entwickelt und getestet werden, die die Entwicklung eines neuen Systems von Infanterie-Panzerabwehrwaffen ermöglicht – RPG-Werfer"
support_weapons:0	"Unterstützungswaffen I"
support_weapons3_desc:0	" Während wir die Zuverlässigkeit von Maschinengewehren aufrechterhalten und verbessern, können wir auch mit höheren Feuerraten experimentieren, um die Durchschlagskraft des konstanten Kugelhagels sicherzustellen."
support_weapons4:0	"Unterstützungswaffen IV"
support_weapons4_desc:0	"Angesichts des vermehrten Einsatzes von Sturmgewehren ist die Entwicklung zuverlässiger automatischer Waffen, die von allen Soldaten in jeder Umgebung eingesetzt werden können, eine Priorität für eine moderne Armee."
paratroopers:0	"Fallschirmjäger I"
paratroopers3_desc:0	"Das Erlernen der Anpassung von Fallschirmabwürfen an die Wetterbedingungen, die Standardisierung der Ausrüstung wie Sprungstiefel und eine erweiterte Spezialausbildung werden die Verwirrung und die Risiken minimieren, die mit diesen gefährlichen Missionen verbunden sind. "
para_supply_tech:0	"Koordinierte Nachschubabwürfe"
marines:0	"Marines"
marines_desc:0	"Truppen, die auf amphibische Kriegsführung spezialisiert sind, werden immer unverzichtbarer. Improvisierte Methoden und Ausrüstung gehören der Vergangenheit an, da unsere Marineinfanterie durch spezialisierte Landungsboote und Ausbildung unterstützt wird."
tech_mountaineers:0	"Gebirgsinfanterie I"
tech_mountaineers_desc:0	"Kämpfe in Gebirgszügen setzen Truppen vielen Gefahren aus, sind aber manchmal unvermeidbar. Wir können diese Risiken minimieren, indem wir unseren Soldaten eine spezielle Ausbildung für dieses Umfeld bieten."
tech_mountaineers2:0	"Gebirgsinfanterie II"
tech_mountaineers2_desc:0	"Über das reine Überleben hinaus können unsere Streitkräfte darauf trainiert werden, die Berge zu ihrem Vorteil zu nutzen. Mit leichter Ausrüstung und Maultiertransporten können sie sich in diesem Gelände besser bewegen als andere Infanterieeinheiten."
advanced_special_forces:0	"Fortgeschrittenes Spezialkräfte-Training"
advanced_special_forces_desc:0	"Durch umfangreiches Training können wir sicherstellen, dass unsere Spezialkräfte Leistungen erbringen, die weit über das hinausgehen, wozu normale Soldaten fähig sind."
improved_special_forces:1	"Erweitertes Programm für Spezialeinheiten"
improved_special_forces_desc:1	"Spezialeinheiten sind in der Lage, Missionen durchzuführen, die gewöhnliche Soldaten nicht bewältigen können. Wir müssen die Ausbildungsprogramme ausweiten, um mehr unserer Soldaten zu qualifizieren."
elite_forces:0	"Elitetruppen"
elite_forces_desc:0	"Nur die Besten der Besten werden zu Spezialeinheiten. Die Soldaten, die die Ausbildung bestehen, werden stärker, schneller und kampfstärker sein als alle anderen."
jungle_warfare:0	"Dschungelkriegsführung"
jungle_warfare_desc:0	"Spezialausbildung, um unsere Soldaten im Dschungel einsatzfähig zu machen."
tech_recon2:0	"Aufklärungskompanie II"
tech_recon2_desc:0	"Aufklärungsmissionen sind oft gefährlich und die Verluste hoch. Die Vorbereitung unserer Patrouillen auf schnelles Vorrücken und Rückziehen sowie ihre Ausrüstung zur Beseitigung feindlicher Hindernisse erhöhen ihre Chancen, lebend zurückzukehren."
tech_recon3:0	"Aufklärungskompanie III"
tech_recon3_desc:0	"Verbesserungen in der Funktechnologie verändern die Art und Weise, wie Aufklärungsmissionen durchgeführt werden können, und ermöglichen eine schnelle Übermittlung der gesammelten Informationen."
tech_engineers2:0	"Pionierkompanie II"
tech_engineers2_desc:0	"Durch die Aufrechterhaltung der lokalen Mobilität bei gleichzeitigem Bau von Anlagen, die früher als permanente Befestigungen und Versorgungssysteme gegolten hätten, werden die Pioniere der Zukunft sicherstellen, dass unsere Truppen, egal wo sie angegriffen werden, darauf vorbereitet sind."
tech_engineers3:0	"Pionierkompanie III"
tech_engineers3_desc:0	"Militärische Pionierprojekte nehmen an Umfang zu. Der Bau fortschrittlicher infrastruktureller Hilfsmittel ermöglicht Operationen, die einen Nachschubbedarf erfordern, der über das hinausgeht, was normalerweise im Feld verfügbar ist."
recon_tech:0	"Aufklärungskompanie"
tech_field_hospital:0	"Feldlazarett I"
tech_field_hospital_desc:0	"Ein Verwundeter muss nicht gleichbedeutend mit einem gefallenen Soldaten sein. Die sofortige medizinische Versorgung unserer Verwundeten, die ins Hinterland zurückgebracht werden, ist der erste Schritt, um dies sicherzustellen."
tech_field_hospital2:0	"Feldlazarett II"
tech_field_hospital4_desc:0	"Obwohl in der Feldmedizin viele Verbesserungen erzielt wurden, sind viele Fortschritte improvisiert, und es fehlt uns an einer etablierten Doktrin. Mit mehr Erfahrung können wir die Rolle dieser Einheiten klarer erläutern und improvisierte Innovationen zu festen Bestandteilen machen."
tech_logistics_company:0	"Logistikkompanie I"
tech_logistics_company_desc:0	"Spezialisierte Logistikoffiziere in unseren Reihen werden sicherstellen, dass Unterstützungsnetzwerke genutzt werden, um Verschwendung zu minimieren."
tech_logistics_company2:0	"Logistikkompanie II"
tech_logistics_company4_desc:0	 "Die Entwicklung standardisierter Klassifizierungen für Nachschubgüter wird Verwirrung minimieren und die Planung effizienter gestalten."
tech_military_police:0	"Militärpolizei I"
tech_military_police_desc:0	"Reguläre Truppen mögen in der Lage sein, die Besatzung für einen kürzeren Zeitraum zu bewältigen, doch sie sind in erster Linie Soldaten. Die Integration der Militärpolizei in unsere Streitkräfte wird sicherstellen, dass wir vor Ort Personal haben, um auf Widerstand zu reagieren und Sabotage zu untersuchen. "
tech_military_police2:0	"Militärpolizei II"
tech_military_police4_desc:0	"Die sichere Polizeiarbeit in besetzten Gebieten dient ebenso der Rückkehr zur Normalität wie der rücksichtslosen Ausschaltung der Opposition. Unsere Militärpolizei muss sicherstellen, dass dieser Prozess frühzeitig beginnt, um die Sicherheit sowohl der Soldaten als auch der Zivilbevölkerung zu gewährleisten."
tech_improved_suppression:0	"Verbesserte Polizeiarbeit"
tech_improved_suppression_desc:0	"Indem wir dafür sorgen, dass die Ausbildung in polizeilichen Techniken flächendeckend erfolgt, können wir die Effektivität unserer Streitkräfte in dieser Rolle steigern."
tech_signal_company:0	"Funkkompanie I"
tech_signal_company3_desc:0	"Die zunehmend tragbare Kommunikationstechnologie lässt sich besser als Rucksack mitführen. Diese gesteigerte Mobilität des Fernmeldekorps muss genutzt werden."
tech_signal_company4:0	"Funkkompanie IV"
tech_signal_company4_desc:0	"Unter unseren Funkspezialisten befinden sich Personen mit unvergleichlichen Erfahrungen aus erster Hand hinsichtlich des Einsatzes dieser Ausrüstung im Feld. Indem wir sie in die Erforschung neuer Kommunikationstechnologien einbeziehen, können wir ihr Fachwissen nutzen."
tech_maintenance_company:0	"Instandhaltungskompanie I"
tech_maintenance_company3_desc:0	"Indem wir sicherstellen, dass unsere Truppen im Feld stets über die grundlegenden Materialien für gängige Reparaturen verfügen, verhindern wir den weiteren Einsatz von Ausrüstung, von der bekannt ist, dass sie beschädigt ist."
tech_maintenance_company4:0	"Wartungskompanie IV"
tech_maintenance_company4_desc:0	"Erfahrungen mit der Konstruktion aktiver Redundanz aus dem Ersten Weltkrieg können auf modernere Ausrüstung übertragen werden, um die Wartung zu vereinfachen."
motorised_infantry:0	"Motorisierte Infanterie"
night_vision2_desc:0	"Frühe Infrarot-Zielfernrohre, die ursprünglich für Scharfschützen gedacht waren, hatten eine begrenzte Sichtreichweite. Da sich sowohl die Tragbarkeit als auch die Sichtqualität verbessern, können diese Geräte von mehr Truppen eingesetzt werden, die nachts operieren."
basic_machine_tools:0	"Grundlegende Werkzeugmaschinen"
basic_machine_tools_desc:0	"Eine Vielzahl neu entwickelter Fräsmaschinen kann in der militärischen Produktion eingesetzt werden, von den kleinen und vielseitigen Modellen, die in jeder Maschinenwerkstatt verfügbar sind, bis hin zu den großformatigen, fortschrittlichen Modellen, die die technologischen Grenzen erweitern."
improved_machine_tools:0	"Verbesserte Werkzeugmaschinen"
assembly_line_production_desc:0	"Die motorisierte Fließbandfertigung, die bereits in vielen Industriezweigen zum Einsatz kommt, kann den Kriegsverlauf verändern, indem sie eine beispiellose Produktionsflut ermöglicht."
flexible_line:0	"Flexible Fertigungslinie"
flexible_line_desc:0	" So gut geölt eine Maschine wie das Fließband auch sein mag, sie wird immer noch von Menschen bedient, was bei Bedarf Anpassungen ermöglicht. Dies sollten wir in unserer industriellen Produktion nutzen."
streamlined_line:0	"Optimierte Fertigungslinie"
tool_maintenance_desc:0	"Durch die Einführung regelmäßiger Wartungsprotokolle für Werkzeuge verlängern wir die Lebensdauer wichtiger Fertigungsanlagen und reduzieren Produktionsausfälle. Planmäßige Inspektionen, standardisierte Ersatzteile und eine angemessene Schulung der Mitarbeiter stellen sicher, dass die Werkzeuge in einem optimalen Zustand bleiben, was die Effizienz steigert und kostspielige Ausfälle minimiert."
worker_training:0	"Fortschritte bei Fertigungskompetenzen und Schulungen"
worker_training_desc:0	"Durch Investitionen in die Ausbildung der Belegschaft und spezialisierte Schulungsprogramme werden wir die Gesamtproduktivität und Präzision in der militärischen Fertigung verbessern. Qualifizierte Arbeitskräfte werden Fehler reduzieren, die Ressourceneffizienz maximieren und die Produktionszeiten verkürzen. Diese Fortschritte werden für eine leistungsfähigere und anpassungsfähigere industrielle Belegschaft sorgen."
worker_colleges:0	"Zünfte und Hochschulen für die Industrie"
foriegn_labour_desc:0	"Durch die Einbindung ausländischer Arbeitskräfte in unsere Belegschaft werden wir unsere industriellen Kapazitäten erweitern und den inländischen Arbeitskräftemangel lindern. Effiziente Integrationsprogramme und eine angemessene Aufsicht werden sicherstellen, dass die Produktivität hoch bleibt, während die Produktion in allen Sektoren gesteigert wird. Diese Politik wird es uns ermöglichen, den Produktionsbedarf in Kriegszeiten aufrechtzuerhalten, ohne unsere bestehende Belegschaft zu überlasten."
improved_equipment_conversion:0	"Verbesserte Umrüstung der Ausrüstung"
improved_equipment_conversion_desc:0	"Fortschritte in der Technik ermöglichen es uns, die bei früheren Modellen festgestellten Probleme zu beheben und diese an unsere aktuellen Bedürfnisse anzupassen."
advanced_equipment_conversion:0	"Fortgeschrittene Umrüstung der Ausrüstung"
concentrated_industry2_desc:0	"Eine weitere Konzentration der Fertigung wird dazu beitragen, die Kosten zu senken."
concentrated_industry3:0	"Konzentrierte Industrie III"
concentrated_industry3_desc:0	"Infrastrukturkosten können gesenkt werden, indem wir die Netzwerke an unsere stärker fokussierte Industrie anpassen."
concentrated_industry4:0	"Konzentrierte Industrie IV"
dispersed_industry_desc:0	"Durch die Streuung unserer Industriezweige können wir sicherstellen, dass es für den Feind im Kriegsfall schwierig wird, diese ins Visier zu nehmen."
dispersed_industry2:0	"Verteilte Industrie II"
dispersed_industry2_desc:0	"Eine weitere Dezentralisierung unserer Produktion erschwert es, bestimmte Teile davon anzugreifen."
dispersed_industry3:0	"Verteilte Industrie III"
dispersed_industry5_desc:0	"Indem wir nicht nur unsere Industrie, sondern auch die sie verbindende Infrastruktur im Verborgenen betreiben, können wir es noch schwieriger machen, sie durch Luftangriffe zu zerstören."
synth_oil_experiments:0	"Experimente mit synthetischem Öl"
synth_oil_experiments_desc:0	"Um die Abhängigkeit vom Öl zu verringern, können Verfahren zur Herstellung von Ersatzstoffen aus anderen Substanzen und Materialien erforscht werden."
early_refining:0	"Frühe Raffination"
improved_oil_processing_desc:0	"Die Übertragung bisher experimenteller Destillationsmethoden auf den großtechnischen Betrieb wird es uns ermöglichen, uns besser an die verfügbaren Materialien und den Bedarf anzupassen."
advanced_oil_processing:0	"Fortgeschrittene Ölverarbeitung"
advanced_oil_processing_desc:0	"Neue experimentelle Reinigungstechniken wie die Hydrotreating-Verfahren können in der Ölherstellung eingesetzt werden, um das Endprodukt erheblich zu verbessern."
modern_oil_processing:0	"Moderne Ölverarbeitung"
improved_rubber_processing_desc:1	"Die großtechnische Herstellung von Synthesekautschuk ist mit neuen Verfahren zur Beschleunigung von Dehydrierungsreaktionen möglich."
advanced_rubber_processing:0	"Fortschrittliche Kautschukverarbeitung"
advanced_rubber_processing_desc:1	"Eine Allzweck-Rezeptur für synthetischen Kautschuk mit verbesserten Verfahren, wie beispielsweise Dodecylmercaptan-Polymerisationsmodifikatoren, wird es uns ermöglichen, die Produktion von synthetischem Kautschuk auszuweiten."
modern_rubber_processing:0	"Moderne Kautschukverarbeitung"
POWERED_BUILDING:	"Motorisierte Bauindustrie: $VAL|+=%2$"
POWERED_DOCKYARD:	"Motorisierte Werftproduktion: $VAL|+=%2$"
POWERED_FACTORY:	"Produktionsleistung der Fabriken: $VAL|+=%2$"
construction2_desc:0	"Die Modernisierung unserer Werkzeuge und Ausrüstung wird unsere Bauvorhaben weiter unterstützen."
construction4_desc:0	"Ein höherer Mechanisierungsgrad und bessere Arbeitsabläufe verbessern die Geschwindigkeit beim Hochbau weiter."
construction5:0	"Bauwesen V"
construction5_desc:0	"Die Zukunft des effizienten Bauwesens erfordert eine umfassendere Planung einzelner Projekte sowie standardisierte Lösungen, wo immer dies möglich ist."
excavation1_desc:0	"Fortschritte bei den Bohrtechniken ermöglichen es uns, Ressourcen abzubauen, die zuvor unerreichbar waren."
excavation2:0	"Abbau I"
excavation2_desc:0	"Neue Techniken helfen uns, Ressourcen effizienter zu gewinnen. Wir verunreinigen die Ressourcen bei der Gewinnung nicht mehr, was zu einem höheren Ertrag führt."
excavation4_desc:0	"Die Automatisierung wichtiger Prozesse und Fortschritte in der Mechanik machen alle unsere Rohstoffstandorte wesentlich effizienter."
excavation_tech:0	"Abbau-Technologien"
electronic_mechanical_engineering:0	"Elektronische Maschinenbau"
electronic_mechanical_engineering_desc:0	"Wir leben in einem Zeitalter, in dem elektrische Maschinen uns nicht mehr nur wärmen und beleuchten, sondern uns auch beim Denken und Kommunizieren helfen. Die Elektronik wird im kommenden Jahrhundert der Schlüssel zur militärischen Aufklärung sein."
consumer_electronics_desc:0	"Moderne Wunder für jedes Zuhause"
consumer_tv:0	"Massenmedien"
consumer_tv_desc:0	"Radios mit Ventilempfänger ermöglichen es unserer Bevölkerung, organisierte Nachrichtenmeldungen und die neueste Musik zu hören. Sie können auch dazu genutzt werden, unsere Propaganda in die Häuser unserer Bevölkerung zu tragen"
radio_detection_desc:0	"Die Entwicklung von RADAR (Radio Detection and Ranging) ermöglicht die Nutzung von Radiowellen zur Erkennung physischer Objekte. Die Forschung ist streng geheim, angesichts der Auswirkungen, die diese Erfindungen auf die Ortung von Einheiten haben könnten."
decimetric_radar_desc:0	"Die Entwicklung eines verbesserten Radars, das auf Dezimeterwellenlängen arbeitet, wird die Entfernungsmessung und Erkennung ermöglichen."
improved_decimetric_radar:0	"Verbessertes Dezimeterradar"
improved_decimetric_radar_desc:0	"Der Einsatz von Radar hat sich bereits als entscheidend erwiesen, doch unsere Dezimeterradargeräte sind zu wenige, um eine gute Abdeckung zu gewährleisten. Die Ausstattung weiterer Einheiten mit Radar wird es uns ermöglichen, unseren technologischen Vorsprung zu maximieren."
centimetric_radar_desc:0	"Neue Radarsysteme, die im Mikrowellenbereich arbeiten, ermöglichen es uns, Objekte zu erkennen, die für bisherige Radarsysteme zu klein waren."
improved_centimetric_radar:0	"Verbessertes Zentimeterwellen-Radar"
improved_centimetric_radar_desc:0	"Die Einführung modernster Radartechniken wie Monopulsradare in Schlüsseloperationen wird eine extrem hohe Ortungsgenauigkeit ermöglichen."
mechanical_computing_desc:0	"Der Bau von Maschinen, die zu fortgeschrittener Differentialanalyse fähig sind, wird die Art der maschinengestützten Berechnungen, die durchgeführt werden können, radikal verändern."
improved_computing_machine_desc:0	"Es können nun programmierbare elektronische Digitalrechner hergestellt werden. Obwohl diese Maschinen noch teuer und groß sind, ermöglichen sie eine Informationsanalyse, die weit über die menschlichen Fähigkeiten hinausgeht."
advanced_computing_machine:0	"Fortschrittliche Rechenmaschine"
advanced_computing_machine_desc:0	"Weitere Verfeinerungen des Computers vereinfachen die Verarbeitung größerer Datenmengen. "
semimodern_computing_machine_desc:0	"Die ersten Arbeiten an Computern, die Programme speichern und Transistoren nutzen können, werden uns auf den Weg zu einer digitalen Revolution bringen, in der diese Maschinen in nahezu jedem Bereich eingesetzt werden können."
basic_encryption:1	"Verschlüsselung – Polyalphabetische Chiffren"
basic_encryption_desc:0	"Mit neuen Kommunikationsmethoden gehen neue Risiken der Abhörung einher. Rotor-Chiffriermaschinen können für eine schnelle, komplexe Verschlüsselung eingesetzt werden."
advanced_encryption_desc:0	"Technologische Verbesserungen und hart erarbeitete Erfahrungen ermöglichen es uns, mehr Sicherheitsmaßnahmen für den Datenverkehr in unserer Kommunikation zu implementieren."
improved_decryption_desc:0	"Die Entwicklung immer leistungsfähigerer Computer ermöglicht neue Anwendungen von Kryptoanalyse-Methoden wie der Differenzierung, die in Kombination mit neuen manuellen Entschlüsselungsmethoden dazu genutzt werden können, fortgeschrittene Chiffren zu knacken. "
advanced_decryption:1	"Entschlüsselung – Automatisierte Ableitung"
advanced_decryption_desc:0	"Die gesteigerte Rechenleistung, die unsere Kryptoanalyse bisher verbessert hat, droht in Zukunft nahezu unknackbare Verschlüsselungen hervorzubringen. Um den Vorsprung zu halten, müssen wir bereit sein, noch intensiver daran zu arbeiten, Insiderinformationen über die Technologie zu gewinnen."
basic_encryption_lar_desc:0	"Mit neuen Kommunikationsmethoden gehen neue Risiken der Abhörung einher. Rotor-Chiffriermaschinen können für eine schnelle, komplexe Verschlüsselung eingesetzt werden."
improved_encryption_lar:1	"Verschlüsselung – Zyklische Permutationen"
improved_encryption_lar_desc:0	"Einschränkungen bei der Zufallsgenerierung von Chiffre-Maschinen können ausgenutzt werden, um die Chiffren zu knacken. Durch die Verbesserung der Zufälligkeit der Rotormechanik können wir diese Art der Kryptoanalyse erschweren."
basic_decryption_lar_desc:0	"Kryptoanalyse entwickelt sich zunehmend zu einer fortgeschrittenen mathematischen Wissenschaft. Systeme wie Karteikartenkataloge und Geräte wie Zyklometer können die erforderliche Arbeit unterstützen."
advanced_decryption_lar_desc:0	"Die gesteigerte Rechenleistung, die unsere Kryptoanalyse bisher verbessert hat, droht in Zukunft nahezu unknackbare Verschlüsselungen hervorzubringen. Um den Vorsprung zu behalten, müssen wir bereit sein, noch intensiver daran zu arbeiten, Insiderinformationen über die Technologie zu erlangen."
atomic_research_desc:0	"Bei der Kernspaltung setzt die Spaltung des Atoms enorme Energiemengen und grenzenlose Zerstörungskraft frei."
rocket_interceptor_desc:0	"Raketenangetriebene Abfangjäger auf Basis von Segelflugzeugen können für kurze Zeit schneller fliegen als jedes andere Flugzeug. Zwar birgt die Unbeständigkeit des Treibstoffs Risiken für die Flugzeuge, doch können sie schneller starten und auf Angriffe reagieren, als es der Feind erwarten würde."
rocket_interceptor_1_desc:0	" Raketenangetriebene Abfangjäger auf Segelflugzeugbasis können für kurze Zeit schneller fliegen als jedes andere Flugzeug. Zwar birgt die Explosionsgefahr des Treibstoffs Risiken für die Flugzeuge, doch können sie schneller starten und auf Angriffe reagieren, als es der Feind erwarten würde. "
rocket_interceptor_2_desc:0	"Obwohl ihr Einsatz nach wie vor als äußerst gefährlich gilt, werden die raketenbetriebenen Kampfflugzeuge nun durch Autopiloten und das Abschleppen durch andere Flugzeuge unterstützt, um ihre extreme Geschwindigkeit bei gleichzeitig begrenzter Treibstoffverfügbarkeit optimal zu nutzen."
rocket_interceptor_3_desc:0	"Neue Landetechniken und sicherere Treibstoffsysteme haben die Erfolgs- und Überlebenschancen der Raketenjäger erheblich verbessert und damit das einst theoretische Potenzial dieser hochmodernen Flugzeuge ausgeschöpft."
nukes_desc:0	"Ein Projekt zum Bau einer Atombombe wird eine der geheimsten und schwierigsten Aufgaben sein, die eine Nation übernehmen kann, doch im Erfolgsfall könnte es nicht nur den Verlauf der heutigen Kriege, sondern auch die Zukunft der Welt verändern." "
interwar_artillery_desc:0	"Seit jeher bewährte Transportmittel für Soldaten, Ausrüstung und Nachschub"
artillery0_desc:0	"Mit moderneren Materialien und Mechanismen können Haubitzen und Feldgeschütze aus dem Ersten Weltkrieg umgerüstet und für die moderne Kriegsführung modernisiert werden."
artillery1_desc:0	"Mit moderneren Materialien und Mechanismen können Haubitzen und Feldgeschütze aus dem Ersten Weltkrieg umgerüstet und für die moderne Kriegsführung modernisiert werden."
artillery2_desc:0	"Die Aufrüstung alter Geschütze bringt uns nur bis zu einem gewissen Punkt weiter. Es werden neue Haubitzenkonstruktionen benötigt, die neue hydraulische Rückstoßvorrichtungen und längere Läufe nutzen."
artillery3_desc:0	"Um schwerere Geschütze auf leichteren Lafetten zu ermöglichen, können Mündungsbremsen in die Konstruktion von Haubitzen integriert werden."
artillery4_desc:0	"Die Entwicklung von leichter Artillerie, die für den Transport zerlegt werden kann, wird es ermöglichen, Artillerieunterstützung in Gebiete zu bringen, die bisher schwer zu erreichen waren."
artillery5_desc:0	"Artilleriekonstruktionen mit niedrigerer Silhouette sind für den Feind schwieriger zu treffen."
mountain_gun_desc:0	"Das bergige Gelände Nordindiens führte zur Entwicklung einer Artilleriewaffe, die zerlegt und auf Maultieren dorthin transportiert werden konnte, wo sie benötigt wurde."
mntartillery1_desc:0	""
mntartillery2_desc:0	"Durch die Modernisierung der Konstruktion von Rucksackartillerie werden wir deren Mobilität, Feuerkraft und Anpassungsfähigkeit für den Krieg in großen Höhen verbessern. Leichtere und dennoch festere Legierungen werden das Gesamtgewicht reduzieren, wodurch sich die Geschütze leichter über unwegsames Gelände transportieren lassen. Verbesserte Rückstoßsysteme und hochwirksame Granatendesigns werden die Durchschlagskraft erhöhen und gleichzeitig eine stabile Leistung auf unebenem Boden gewährleisten. Diese Verbesserungen werden sicherstellen, dass unsere Gebirgstruppen selbst unter den härtesten Einsatzbedingungen eine überlegene Feuerunterstützung aufrechterhalten können."
rocket_artillery2_desc:0	"Selbstfahrende Artillerie mit Mehrfachraketenwerfern wird in der Lage sein, rasch großflächige Zerstörungen zu verursachen und gleichzeitig ihre Mobilität zu bewahren, um Gegenfeuer zu entgehen."
rocket_artillery3_desc:0	"Indem wir Reichweite zugunsten der Durchschlagskraft opfern, können wir schwerere Raketen auf größeren Fahrzeugen montieren. Diese Artillerie-Batterien können im Team operieren und zusammenarbeiten, um schnell nachzuladen und ihre Position zu wechseln."
rocket_artillery4_desc:0	"Durch Drallstabilisierung können Raketen die Reichweite leichterer Artillerie-Batterien erhöhen."
antiair1_desc:0	"Dank schnellerer Nachlademechanismen können Flugabwehrgeschütze mit großen Geschossen weiterhin die erforderliche Feuerrate aufrechterhalten."
antiair2_desc:0	"Um hochfliegende Flugzeuge zu bekämpfen, werden bei Flugabwehrgeschützen längere Patronen und Läufe benötigt."
antiair3_desc:0	"Mit der Verbesserung der Radarsysteme wird der Einsatz von radargesteuerten Flugabwehrgeschützen immer praktikabler. Wenn wir mit dieser Technologie Schritt halten, können wir einige der präzisesten Flugabwehrsysteme entwickeln, die es gibt."
antiair4_desc:0	"Die Kombination moderner Systeme aus Radar, Computertechnik und automatischen Ladevorrichtungen wird notwendig sein, um schnell auf schnellere Flugzeuge reagieren zu können."
antiair5_desc:0	"Boden-Luft-Raketen sind die Zukunft der Flugabwehr. Die Entwicklung einer mobilen Plattform für diese sollte unser nächstes Ziel sein."
antitank1_desc:0	"Die Bedeutung effektiver Panzerabwehrwaffen hat sich im Ersten Weltkrieg gezeigt. Die Einführung einer neuen Generation dieser Waffen wird notwendig sein, um moderne Panzerkonstruktionen zu bekämpfen."
improved_antitank_desc:0	"Die Verbesserung unserer leichten Panzerabwehrkanonen kann deren Wirksamkeit steigern, während ihr geringes Gewicht und ihre Flexibilität erhalten bleiben."
antitank2_desc:0	" Die meisten Panzerabwehrkanonen sind bislang relativ leicht. Kanonen mit größerem Kaliber werden benötigt, um schwerere Panzer mit geneigter Panzerung zu bekämpfen."
antitank3_desc:0	"HEAT-Geschosse (High-Explosive Anti-Tank) können in der Panzerabwehrartillerie eingesetzt werden, um die begrenzte Mündungsgeschwindigkeit auszugleichen."
antitank4_desc:0	" Neue, vielseitige Panzerabwehrkanonen, die panzerbrechende Sabotgeschosse verwenden, können die Panzerung fast jedes Panzers durchschlagen."
antitank5_desc:0	" Durch die Kombination verschiedener neuer Munitionstechnologien mit Geschützen mit höheren Mündungsgeschwindigkeiten können wir auf jede neue Panzerung vorbereitet sein, die unsere Feinde entwickeln mögen."
air_superiority_desc:0	"Die Erlangung der Luftüberlegenheit wird es feindlichen Bombern erschweren, gegen unser Land eingesetzt zu werden, und es unseren Bombern ermöglichen, gegen unsere Feinde eingesetzt zu werden."
formation_flying_desc:0	"Durch das Fliegen in Formation können sich Flugzeuge gegenseitig unterstützen oder gemeinsam Feinde angreifen."
air_offense_desc:0	"Da wir uns auf Tagesbombardements konzentrieren, müssen wir unsere Bomber vor abfangenden Jagdflugzeugen schützen. Die Ausbildung unserer Jagdpiloten auf eine enge Zusammenarbeit mit den Bombern wird ihre Kampffähigkeiten verbessern, wenn sie die Bomber im feindlichen Luftraum schützen."
fighter_baiting_desc:0	"Indem sie sich verwundbar zeigen, können unsere Jagdflugzeuge feindliche Flugzeuge in Hinterhalte locken."
dogfighting_experience_desc:0	"Es ist nicht einfach, im hektischen Wirbel eines Luftkampfs den Überblick über die relativen Positionen von Freunden und Feinden zu behalten, aber mit zunehmender Erfahrung werden unsere Piloten darin immer geschickter."
fighter_ace_initiative_desc:0	" Die Vergabe von besonderen Auszeichnungen und einem besonderen Status an Piloten, die durch den Abschuss von fünf Gegnern den Status eines Asses erreichen, fördert Risikobereitschaft und schafft ein Gefühl der Exklusivität bei Ass-Piloten – auch wenn dies dazu führt, dass erfahrene Piloten eher in Kampfpositionen verbleiben."
multialtitude_flying_desc:0	"Luftkämpfe finden in drei Dimensionen statt, doch den meisten Piloten fällt es schwerer, Flugzeuge im Blick zu behalten, die über oder unter ihnen fliegen. Wir können uns dies zunutze machen, indem wir unsere Formationen vertikal ausbreiten."
offensive_formations_desc:0	"Das Training in eher offensiv ausgerichteten Formationen macht unsere Kampfflugzeuge im Kampf tödlicher."
fighter_sweeps_desc:0	"Aggressive Patrouillen von Kampfflugzeugen über feindlichem Gebiet können deren Flugzeuge beim Start oder bei der Landung erwischen, wenn sie besonders verwundbar sind, oder feindliche Trainingsflüge stören."
force_rotation_desc:0	"Kampfhandlungen oder einfach nur lange Phasen intensiver Konzentration sind anstrengend, doch durch den Einsatz frischer Kräfte, wann immer dies möglich ist, können wir Fehler aufgrund von Pilotenmüdigkeit reduzieren."
air_defence_desc:0	"Indem wir unsere Piloten darauf trainieren, stets wachsam zu sein, selbst wenn scheinbar keine Gefahr besteht, erhöhen sich ihre Chancen, feindliche Flugzeuge abzufangen."
dispersed_fighting_desc:0	"Durch eine stärker gestreute Formation kann dieselbe Anzahl an Flugzeugen ein größeres Gebiet überwachen."
forward_interception_desc:0	"Durch den Einsatz näher am feindlichen Luftraum steigt die Wahrscheinlichkeit, dass unsere Kampfflugzeuge feindliche Flugzeuge abfangen können, bevor diese ihre Ziele erreichen."
fighter_veteran_initiative_desc:0	"Die Fokussierung auf das langfristige Überleben der Piloten – sowohl durch umsichtige Taktiken als auch durch die Rotation erfahrener Piloten in Ausbildungspositionen – bedeutet, dass sie ihre gewonnenen Erkenntnisse an neue Piloten weitergeben können."
formation_fighting_desc:0	"Das Fliegen in den richtigen Formationen ermöglicht es unseren Piloten, die toten Winkel der anderen abzudecken, was zu einer erhöhten Fähigkeit führt, feindliche Flugzeuge zu entdecken."
air_skirmish_desc:0	"Leider ist es nicht immer möglich, jedes einzelne feindliche Flugzeug zu zerstören, das über unserem Land gesichtet wird, aber es ist möglich, sie vom Moment ihrer Sichtung bis zu ihrem Abflug zu bedrängen und sie so kontinuierlich zu zermürben."
home_defence_desc:0	"Beobachter am Boden sowie Aufklärungs- und Abhörposten arbeiten eng mit unserer Luftwaffe zusammen, um feindliche Übergriffe aufzuspüren und zu vernichten."
battlefield_destruction_desc:0	"Die Luftwaffe kann zwar weit entfernte feindliche Länder angreifen, ist aber auch von großem Nutzen, wenn es darum geht, die Armee direkt in Schlachten zu unterstützen."
dive_bombing_desc:0	"Sturzflüge ermöglichen eine höhere Treffgenauigkeit, erfordern jedoch für optimale Ergebnisse Spezialflugzeuge, die sowohl ihre Sturzflüge verlangsamen als auch die Belastungen beim Ausleiten überstehen können."
direct_ground_support_desc:0	"Durch die enge Abstimmung zwischen CAS-Piloten und Bodenbeobachtern kann die Luftfeuerkraft präzise gelenkt werden, um den Truppen im Kampf bestmöglich zu helfen."
bomber_veteran_initiative_desc:0	"Eine Politik, bei der erfahrene Piloten ihr Wissen an neue Rekruten weitergeben, trägt erheblich zu deren Überlebenschancen bei."
bomber_ace_initiative_desc:0	"Die formelle Anerkennung und Belohnung von Spitzenpiloten bei den Bombern fördert Wagemut und Eigeninitiative."
cas_veteran_initiative_desc:0	"Eine Politik, bei der erfahrene Piloten ihr Wissen an neue Rekruten weitergeben, trägt erheblich zu deren Überlebenschancen bei."
cas_ace_initiative_desc:0	"Die offizielle Anerkennung und Belohnung von CAS-Ass-Piloten fördert Wagemut und Eigeninitiative."
hunt_and_destroy_desc:0	"Neben der direkten Feuerunterstützung können CAS-Einheiten eigenständig nach Zielen suchen und oft feindliche Bodentruppen unerwartet angreifen, während diese sich auf die Frontlinien zubewegen."
naval_strike_torpedo_tactics_desc:0	"Die Ausbildung von Piloten für präzisere Torpedoangriffe wird unsere Luftangriffe auf feindliche Schiffe effizienter machen."
naval_strike_torpedo_tactics_oi_desc:0	"Die Ausbildung von Piloten für präzisere Torpedoangriffe wird unsere Luftangriffe auf feindliche Schiffe effizienter machen."
naval_strike_tactics_desc:0	"Die Ausbildung der Piloten in der Vorhersage von Schiffsbewegungen und der Koordinierung von Angriffen wird unsere Luftangriffe auf feindliche Schiffe effizienter machen."
low_echelon_support_desc:0	"Durch die direkte Zuweisung von CAS-Einheiten zu kleinen Bodeneinheiten wird sichergestellt, dass diese stets auf zusätzliche Feuerkraft zurückgreifen können, selbst wenn sie sich außerhalb der Reichweite herkömmlicher Artillerie befinden."
combat_unit_destruction_desc:0	"Die Schulung unserer CAS-Piloten, dasselbe Ziel so lange anzugreifen, bis dessen Zerstörung bestätigt ist, stellt sicher, dass Ziele nach einem Beinahetreffer nicht unberührt bleiben."
operational_destruction_desc:0	"Der Angriff auf die Versorgungslinien feindlicher Bodentruppen behindert deren Fähigkeit, sich zwischen den Schlachtfeldern zu bewegen. Dies verschafft unserer Armee einen Vorteil bei Einsätzen in Gebieten, in denen wir die Luftüberlegenheit besitzen."
infrastructure_destruction_desc:0	"Die Schulung unserer Piloten in den besten Methoden zum Angriff auf Infrastruktur wie Eisenbahnstrecken und Brücken sorgt für effektivere taktische Bombardements."
logistical_bombing_desc:0	"Eine stärkere Konzentration auf den Angriff auf die Versorgungslinien des Feindes aus der Luft verschafft unseren eigenen Bodentruppen in dem Gebiet einen größeren Vorteil."
battlefield_support_desc:0	" Für taktische Bomber ist es schwierig, Ziele in der Nähe der Einsatzgebiete unserer Bodentruppen anzugreifen, da Horizontalbombardements weniger präzise sind als Sturzflüge; doch mehr Training und die Zusammenarbeit mit Bodenbeobachtern können helfen, diese Probleme zu überwinden."
carousel_bombing_desc:0	"Bomber wollen oft einfach nur ihre gesamte Bombenlast abwerfen, sobald sie ihr Zielgebiet erreichen, und dann so schnell wie möglich nach Hause fliegen. Während dies bei Flächenbombardements funktionieren kann, ist es bei der Bekämpfung kleiner Ziele effektiver, über dem Ziel zu verweilen und jeweils nur einen Teil der Bombenlast abzuwerfen, um maximale Genauigkeit zu erzielen."
keypoint_bombing_desc:0	"Das präzise Bombardieren ausgewählter Schlüsselpunkte auf dem Schlachtfeld zur Unterstützung unserer Bodentruppen kann diesen erheblich dabei helfen, den Feind zu besiegen."
ground_support_integration_desc:0	 "Die vollständige Integration unserer taktischen Bomberflotte mit bodengestützten Beobachtern erhöht sowohl deren Genauigkeit als auch ermöglicht es ihnen, unsere Bodentruppen im Kampf direkt zu unterstützen."
strategic_destruction_desc:0	"Unsere Piloten können strategische Ziele viel schneller erreichen als unsere See- oder Landstreitkräfte. Da wir keine Mittel haben, unsere neuen Rekruten auszurüsten, werden wir die feindlichen Streitkräfte bald zahlenmäßig übertreffen."
high_level_bombing_desc:0	"Aus größeren Höhen können wir einige Luftkämpfe und Flugabwehrwaffen vermeiden. Das Abwerfen von Bomben aus größerer Höhe erfordert mehr Präzision, ist aber sicherer."
massed_bomber_formations_desc:0	"Indem sie in Formation bleiben, können unsere Bomber ihre Gruppe verteidigen und unsere Chancen auf erfolgreiche Bombenabwürfe erhöhen. "
night_bombing_desc:0	"Da die feindliche Verteidigung geschwächt ist und unsere Bomber durch die Dunkelheit geschützt sind, können wir rund um die Uhr offensiv und effizient bleiben. Zeigen wir unserem Feind, wie hartnäckig wir sind.\n\n"
dead_reckoning_bombing_desc:0	 "Indem wir Geschwindigkeit, Richtung und Abdrift von früheren Positionen aus messen, können wir selbst bei Nacht präzisere Bombenabwürfe berechnen."
infiltration_bombing_desc:0	"Sich feindlichen Formationen anzuschließen oder ihnen bis zur Heimatbasis zu folgen, mag wie Wahnsinn erscheinen. Mit genügend Übung ist dies jedoch durchaus möglich."
pathfinder_groups_desc:0	"Erfahrene Piloten sind mit den besten Mitteln ausgestattet, um Zielpositionen zu beleuchten. Weder Rauch noch schlechtes Wetter können die Bomber daran hindern, ihre Mission auszuführen."
day_bombing_desc:0	"Konzentrierte Angriffe am Tag sind aufgrund des großen Sichtvorteils verheerend. Die Demonstration von Stärke ist ein willkommener Nebeneffekt."\n\n"
escort_relay_system_desc:0	"Von Jagdflugzeugen eskortierte Bomber verbessern unsere Fähigkeit, auf feindliches Feuer zu reagieren, erheblich."
flying_fortress_desc:0	"Die Ausrüstung unserer hochfliegenden schweren Bomber mit Geschützen zur Selbstverteidigung und mit ausreichender Panzerung, um Beschuss zu überstehen und dennoch nach Hause zurückzukehren."
mass_destruction_desc:0	"Bomber sind in großer Zahl mit den verheerendsten Waffen ausgerüstet. Dies garantiert Ergebnisse, selbst wenn nur wenige unserer Piloten durchkommen."
fleet_in_being_desc:0	"Schiffe bleiben im Hafen, wo sie sicherer sind, und greifen Feinde nur zu günstigen Zeitpunkten an. Die Präsenz unserer Schiffe wird Feinde davon abhalten, unsere Häfen anzugreifen."\n\n"
battlefleet_concentration_desc:0	"Rufen Sie nahegelegene Schiffe herbei, sobald ein feindliches Schiff gesichtet wird. Koordiniertes, konzentriertes Feuer macht feindliche Schiffe schnell kampfunfähig. Jagen Sie sie einzeln nieder."
battlefleet_concentration_ti_desc:0	"Rufen Sie nahegelegene Schiffe herbei, sobald ein feindliches Schiff gesichtet wird. Koordiniertes, konzentriertes Feuer macht feindliche Schiffe schnell kampfunfähig. Jagen Sie sie einzeln nieder."
subsidiary_carrier_role_desc:0	"Flugzeugträger unterstützen Schlachtschiffe und verbessern deren Bereitschaft beim Wechsel von der Verteidigung zum Angriff. Die Vielseitigkeit des Flugzeugträgers als Auge in der Luft und als mächtige Schnellangriffstruppe ergänzt die langsameren Schlachtschiffe gut."
subsidiary_carrier_role_ti_desc:0	"Flugzeugträger unterstützen Schlachtschiffe und verbessern deren Bereitschaft beim Wechsel von der Verteidigung zum Angriff. Die Vielseitigkeit des Flugzeugträgers als Auge am Himmel und als mächtige Schnellangriffstruppe ergänzt die langsameren Schlachtschiffe gut. "
hunter_killer_groups_desc:0	"Zerstörer bilden Gruppen, um feindliche U-Boote aufzuspüren. Die gemeinsamen Anstrengungen von Aufklärungs- und Jagd-Spezialisten ergeben ein fantastisches Team."
floating_fortress_desc:0	"Mit Schlachtschiffen in höchster Alarmbereitschaft sind wir stets bereit zu reagieren, sollte der Feind es wagen, unsere Gewässer zu bedrohen. Jede Flotte benötigt ein solides Fundament, und die Macht des Schlachtschiffs ist unübertroffen."
floating_fortress_ti_desc:0	"Mit Schlachtschiffen in höchster Alarmbereitschaft sind wir stets bereit zu reagieren, sollte der Feind es wagen, unsere Gewässer zu bedrohen. Jede Flotte benötigt ein solides Fundament, und die Macht des Schlachtschiffs ist unübertroffen."
floating_fortress_bs_desc:0	"Mit Schlachtschiffen in höchster Alarmbereitschaft sind wir stets bereit zu reagieren, sollte der Feind es wagen, unsere Gewässer zu bedrohen. Jede Flotte braucht ein solides Fundament, und die Schlagkraft des Schlachtschiffs ist unübertroffen."
floating_airfield_desc:0	"Die verbesserte Integration von Flugzeugträgern in unsere Flotte sorgt dafür, dass wir bereit sind, sowohl vom Meer als auch aus der Luft zuzuschlagen. Es ist entscheidend, dass wir die Lufthoheit überall dort sichern, wo wir uns bewegen. "
floating_airfield_ti_desc:0	"Die verbesserte Integration von Flugzeugträgern in unsere Flotte hält uns bereit, sowohl vom Meer als auch aus der Luft zuzuschlagen. Es ist entscheidend, dass wir die Lufthoheit behalten, wo immer wir hingehen."
floating_airfield_bs_desc:0	"Die verbesserte Integration von Flugzeugträgern in unsere Flotte hält uns bereit, sowohl vom Meer als auch aus der Luft zuzuschlagen. Es ist entscheidend, dass wir die Lufthoheit behalten, wo immer wir hingehen."
grand_battlefleet_desc:0	"Führungstrainings ermöglichen es unseren Kommandanten, auch im Eifer des Gefechts die Ruhe zu bewahren, selbst wenn sie riesige Flotten befehligen. Unsere Flotte wird jeden Gegner frontal vernichten."
convoy_sailing_desc:0	"Die Einführung der obligatorischen Konvoifahrt wird es einfacher machen, feindliche Überfälle zu erkennen und rechtzeitig zu reagieren. Sicherheit durch Zahlen ist der richtige Weg."
convoy_sailing_ti_desc:0	"Die Einführung der obligatorischen Konvoifahrt wird es einfacher machen, feindliche Überfälle zu erkennen und rechtzeitig zu reagieren. Sicherheit durch Zahlen ist der richtige Weg."
convoy_sailing_bs_desc:0	"Die Einführung der obligatorischen Konvoifahrt wird es einfacher machen, feindliche Überfälle zu erkennen und rechtzeitig zu reagieren. Sicherheit durch Zahlen ist der richtige Weg. "
convoy_escorts_desc:0	"Schnelle Überwasserschiffe als Teil unserer Konvois werden es uns ermöglichen, feindliche U-Boote zu entdecken und rechtzeitig zu reagieren. Die Erkennung ist der Schlüssel zur Beseitigung der U-Boot-Bedrohung."
convoy_escorts_bs_desc:0	"Schnelle Überwasserschiffe als Teil unserer Konvois werden es uns ermöglichen, feindliche U-Boote zu entdecken und rechtzeitig zu reagieren. Die Erkennung ist der Schlüssel zur Beseitigung der U-Boot-Bedrohung."
escort_carriers_desc:0	"Der von Flugzeugträgern abgedeckte Bereich erleichtert die Begleitung von Handelskonvois erheblich. Die Sicherung des Ressourcenflusses ist unerlässlich."
integrated_convoy_defence_desc:0	"Eine bessere Koordination zwischen Marine und Luftwaffe ermöglicht es uns, Feinde aus großer Entfernung anzugreifen, bevor sie sich unseren Handelskonvois nähern. Dies wird die Effektivität der Konvoifahrten drastisch steigern."
integrated_convoy_defence_bs_desc:0	"Eine bessere Koordination zwischen Marine und Luftwaffe ermöglicht es uns, Feinde aus großer Entfernung anzugreifen, bevor sie sich unseren Handelskonvois nähern. Dies wird die Effektivität der Konvoifahrten drastisch steigern."
submarine_operations_desc:0	"Wir müssen nicht frontal gegen die feindliche Flotte vorgehen, um den Krieg zu gewinnen. Schlagen Sie auf ihre Handelskonvois ein, bevor sie reagieren und wieder unter der Oberfläche verschwinden können. Man kann nicht gegen das kämpfen, was man nicht sehen kann."
submarine_operations_bs_desc:0	" Wir müssen nicht frontal gegen die feindliche Flotte vorgehen, um den Krieg zu gewinnen. Greifen Sie ihre Handelskonvois an, bevor sie reagieren und wieder unter der Oberfläche verschwinden können. Man kann nicht gegen das kämpfen, was man nicht sieht."
undersea_blockade_desc:0	"U-Boote sind das perfekte Mittel, um den Zufluss wichtiger Rohstoffe zum Feind zu unterbrechen. Wir werden die Produktion des Feindes lahmlegen und gewinnen, indem wir ihn aushungern."
undersea_blockade_bs_desc:0	"U-Boote sind das perfekte Mittel, um den Zufluss wichtiger Rohstoffe zum Feind zu unterbrechen. Wir werden die Produktion des Feindes lahmlegen und ihn durch Aushungern besiegen."
convoy_interdiction_desc:0	"Eine verbesserte Koordination unserer U-Boote wird es ihnen ermöglichen, Handelskonvois auf ihrer Route anzugreifen. Die Unterbrechung der feindlichen Versorgungslinien verschafft uns den strategischen Vorteil."
convoy_interdiction_ti_desc:0	"Eine verbesserte Koordination unserer U-Boote ermöglicht es ihnen, Handelskonvois auf ihrer Route anzugreifen. Die Unterbrechung der feindlichen Versorgungslinien verschafft uns den strategischen Vorteil."
convoy_interdiction_bs_desc:0	"Eine verbesserte Koordination unserer U-Boote ermöglicht es ihnen, Handelskonvois auf ihrer Route anzugreifen. Die Unterbrechung der feindlichen Versorgungslinien verschafft uns den strategischen Vorteil."
submarine_offensive_desc:0	"Wenn wir die Kommunikation zwischen unseren U-Booten auf ein Höchstmaß bringen, können diese in die Offensive gehen. Lassen Sie uns die feindlichen Handelskonvois schneller zerstören, als sie diese ersetzen können."
submarine_offensive_bs_desc:0	"Wenn wir die Kommunikation zwischen unseren U-Booten auf ein Höchstmaß bringen, können diese in die Offensive gehen. Lassen Sie uns die feindlichen Handelskonvois schneller zerstören, als sie diese ersetzen können. "
trade_interdiction_desc:0	"Je früher wir die feindlichen Schiffe entdecken, desto eher können wir sie zerstören. Greifen Sie ihre Handelskonvois an und entkommen Sie, bevor sie Zeit haben zu reagieren.\n\n"
unrestricted_submarine_warfare_desc:0	" Lassen Sie unsere U-Boote jedes Schiff ohne Vorwarnung versenken, ob zivil oder nicht. Auch wenn manche dies als Verstoß gegen die Kriegsregeln betrachten, lässt sich seine Wirksamkeit nicht leugnen."
wolfpacks_desc:0	"Da unsere U-Boote in Gruppen organisiert sind, ist die Koordination zwischen ihnen erheblich verbessert. Sobald ein Feind ausgemacht wurde, liegt unser U-Boot auf der Lauer, bis der Rest der Gruppe eintrifft, und greift erst an, wenn die Chancen überwältigend zu unseren Gunsten stehen. "
advanced_submarine_warfare_desc:0	"Eine massive Verbesserung der Kommunikation zwischen unseren U-Booten ermöglicht es ihnen, Angriffe perfekt zu timen. Wenn sie uns schließlich sehen, dann erst von einem sinkenden Schiff aus."
combined_operations_raiding_desc:0	"Alle Ressourcen werden für die Jagd auf feindliche Handelskonvois eingesetzt. Die Koordination zwischen unserer Hauptflotte und den U-Booten hält unsere Flotte stets in Alarmbereitschaft. Kein Schiff wird in unseren Gewässern unbemerkt bleiben."
raider_patrols_desc:0	"Patrouillen aus schnellen und schwer bewaffneten Schiffen lassen den feindlichen Handelskonvois keinen Platz zum Verstecken. \nNicht nur U-Boote können jagen."
capital_ship_raiders_desc:0	"Da unsere mächtigsten Schiffe auf der Jagd nach Handelskonvois sind, wird der Feind in der Masse keine Sicherheit mehr finden. Sie sind leichte Beute und beten, dass wir sie nicht finden."
carrier_operations_desc:0	"Flugzeugträger ermöglichen es unseren Piloten, auf See schneller und einfacher zuzuschlagen als von unseren Luftwaffenstützpunkten an Land aus. Wir werden zuschlagen, bevor sie Zeit haben zu reagieren."
naval_air_operations_desc:0	"Piloten, die für Einsätze von Flugzeugträgern ausgebildet sind, eröffnen uns neue Möglichkeiten, die Meere zu beherrschen. Flugzeuge sind ein effizientes Mittel, um die feindliche Flotte zu dezimieren."
base_strike_desc:0	"Angriffe auf die feindlichen Häfen werden deren Fähigkeit zum Wiederaufbau ihrer Flotte lähmen. Dies wird es uns ermöglichen, die Meere durch schiere Überzahl zu beherrschen.\n\n"
carrier_primacy_desc:0	"Moderne Flugzeuge verfügen über eine größere Reichweite und Präzision als gewöhnliche Schiffsgeschütze. Integrieren Sie Flugzeugträger in unsere Flotte und beherrschen Sie die Meere aus der Luft."
carrier_task_forces_desc:0	"Organisierte Einsatzverbände mit Flugzeugträgern und leichten Kreuzern stellen sicher, dass der Feind uns niemals unvorbereitet erwischen wird."
massed_strikes_desc:0	"Piloten, die für Einsätze auf Flugzeugträgern ausgebildet sind, sorgen dafür, dass selbst ein überfüllter Flugzeugträger reibungslos funktioniert, den Feind überrannt und die Effektivität in Seeschlachten erheblich verbessert. Ein Flugzeugträger muss wie eine gut geölte Maschine laufen, in der jeder seine Rolle kennt. "
carrier_battlegroups_desc:0	"Flugzeugträger können den Feind aus größerer Entfernung angreifen als jede Marinekanone, und mit unseren Augen am Himmel werden wir niemals überrascht werden. Eine große Flotte von Flugzeugträgern ist eine Macht, mit der man rechnen muss."
escort_patrols_desc:0	"Eine verbesserte Ortung macht unsere Konvoieskorten für U-Boote weitaus tödlicher. Da sie sich nirgendwo verstecken können, stellen sie keine echte Bedrohung dar."
HQ_communications_desc:0	"Die Aufrechterhaltung einer hochwertigen Kommunikation mit unterstellten Einheiten ist für jede Operation unerlässlich. Neue Wege zu finden, dies schneller zu bewerkstelligen, ist entscheidend, um uns einen Vorteil gegenüber den feindlichen Streitkräften zu verschaffen."
HQ_radio_desc:0	"Durch die Ausstattung unserer Kommandeure im Feldhauptquartier mit Funkgeräten erhalten diese weitaus mehr Kontrolle über ihre eigenen Streitkräfte, wodurch unsere Truppen dynamischer agieren können und die Kommandeure einen besseren Überblick über das Schlachtfeld erhalten."
vehicle_radio_desc:0	"Die Ausstattung eines Lastwagens mit einem Funkgerät gibt dem Kommandeur die Möglichkeit, seine Aktionen noch schneller und koordinierter zu steuern, sodass er schneller auf die Bewegungen des Feindes reagieren kann."
tank_radio_desc:0	"Durch die Ausstattung aller unserer Panzer an der Front mit Funkgeräten geben wir unseren Besatzungen die bestmögliche Chance, auf eine Veränderung der taktischen Lage zu reagieren."
recon_radio_desc:0	"Durch die Ausstattung der Aufklärungseinheiten mit Funkgeräten kann die Aufklärung dem Kommandanten Informationen noch schneller liefern, als der Feind reagieren kann."
infantry_radio_desc:0	"Durch die Ausstattung der Infanterie mit Funkgeräten kann diese Angriffe und Verteidigungsmaßnahmen mit konzentrierterem Feuer durchführen."
artillery_radio_desc:0	"Durch die Ausstattung der Artillerie mit Funkgeräten kann diese Angriffe und Verteidigungsmaßnahmen noch besser und schneller durch koordiniertes Feuer unterstützen."
