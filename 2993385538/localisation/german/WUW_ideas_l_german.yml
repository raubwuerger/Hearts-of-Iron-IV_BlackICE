BEL_societe_generale_de_belgique_industrial:	"Allgemeine Gesellschaft von Belgien"
BEL_distrigaz:	"Distrigaz"
BEL_inflation_controls_ns:	"Kontrolle der Inflation"
BEL_inflation_controls_ns_desc:	"Um die Auswirkungen der Inflation zu verringern, haben wir damit begonnen, Geld aufzukaufen und keine Ersatzscheine für beschädigtes Geld auszugeben, die Zinssätze zu ändern und die Ausgaben in der Wirtschaft zu fördern."
BEL_language_barriers_ns:	"Sprachliche Barrieren"
BEL_language_barriers_ns_desc:	"Belgien ist in zwei Sprachgruppen aufgeteilt: Französisch, das von den wallonischen Regionen gesprochen wird, und Niederländisch, das von den Flamen praktiziert wird. Beide Seiten sind außerordentlich stolz auf ihre Kultur und ihr Erbe, und die Sprache ist eng damit verbunden, so dass keine der beiden Seiten ihre Sprache aufgeben oder sie der anderen unterordnen möchte."
BEL_language_barriers_fas_nl_ns:	"Vorrang der niederländischen Sprache"
BEL_language_barriers_fas_nl_ns_desc:	"Die niederländische Sprache wurde als Hauptsprache für [ROOT.GetName] ausgewählt, wobei die flämische Kultur gefördert und die wallonische im Namen der Einheit unterdrückt wird."
BEL_language_barriers_fas_fr_ns:	"Primat der französischen Sprache"
BEL_language_barriers_fas_fr_ns_desc:	"Die französische Sprache wurde als Hauptsprache innerhalb von [ROOT.GetName] ausgewählt, wobei die wallonische Kultur gefördert und die flämische im Namen der Einheit unterdrückt wird."
BEL_traditional_family_values_ns:	"Traditionelle Familienwerte"
BEL_traditional_family_values_ns_desc:	"Die Familie ist einer der wichtigsten Aspekte im Leben eines Menschen, und wir halten uns an eine Reihe von Normen, die dies betreffen. Es gibt definierte Geschlechterrollen und Erwartungen innerhalb der familiären Einheit, und dies ist auf das Wachstum und die Stabilität unserer Bevölkerung ausgerichtet."
BEL_defensive_neutrality_capstone_ns:	"Defensive Umstrukturierung"
BEL_defensive_neutrality_capstone_ns_desc:	"Wir haben getan, was wir können, um uns auf eine Invasion vorzubereiten. Das Einzige, was noch zu tun ist, sind strategische und hochrangige Änderungen der Doktrinen, die sich an den modernsten Denkweisen der Verteidigung orientieren."
BEL_lack_of_junior_officers_ns:	"Mangel an Nachwuchsoffizieren"
BEL_lack_of_junior_officers_ns_desc:	"Die rasche Mobilisierung unserer Streitkräfte ist im Allgemeinen gut vorangekommen, bis auf ein Problem: Es fehlt an Nachwuchsoffizieren, um unsere neuen Rekruten zu organisieren! Es wird noch eine Weile dauern, bis sich die militärische Hierarchie neu geordnet hat."
BEL_legacy_of_the_great_war_ns:	"Das Erbe des Großen Krieges"
BEL_legacy_of_the_great_war_ns_desc:	"Auf den Feldern von Flandern fanden einige der härtesten Kämpfe der Westfront statt, ein Gebiet, das von König Albert, seinen tapferen belgischen Soldaten und durch die Opfer unserer Verbündeten erbittert verteidigt wurde. Wir sollten dieses Andenken in Ehren halten und uns bemühen, ihrem Beispiel zu folgen."
BEL_pressurized_cabins_ns:	"Kabinen mit Druckausgleich"
BEL_pressurized_cabins_ns_desc:	"Um die Distanz zwischen Belgien und unseren kolonialen Besitztümern im Kongo zu verringern, haben wir Pionierarbeit bei der Verwendung von Druckkabinen für unsere Flugzeuge geleistet."
BEL_license_air_idea:	"Fluglizenzen"
BEL_license_air_idea_desc:	"Wir mussten schnell Flugzeuge beschaffen und haben daher eine Reihe von Verträgen mit ausländischen Unternehmen abgeschlossen."
BEL_license_POL_air_idea:	"Polnische Fluglizenz"
BEL_license_POL_air_idea-desc:	"Durch die guten Beziehungen zu unseren polnischen Partnern konnten wir eine Reihe von Militärlizenzen zu sehr günstigen Konditionen erwerben."
BEL_legacy_of_the_belgian_airforce_ns:	"Das Erbe der belgischen Luftwaffe"
BEL_legacy_of_the_belgian_airforce_ns_desc:	"Belgien war eine der ersten Nationen, die sich die Luftwaffe zu eigen gemacht haben, und unsere Piloten haben im Großen Krieg sehr tapfer gekämpft. Ihr Vermächtnis wird von unserer heutigen Generation von Piloten anerkannt, die nichts mehr wollen, als in ihre Fußstapfen zu treten."
BEL_re_build_the_fleet_ns:	"Die Flotte wiederaufbauen"
BEL_re_build_the_fleet_ns_desc:	"Unsere Marine wurde 1927 aufgelöst, aber die globale Situation erfordert, dass wir wieder in unsere Flotte investieren, um unsere Handelsverbindungen zum Kongo offen zu halten und unsere maritimen Interessen zu verfolgen."
BEL_maritime_support_ns:	"Maritime Unterstützung"
BEL_maritime_support_ns_desc:	"Jetzt, da wir die militärische Infrastruktur der Marine zunehmend in Betrieb nehmen, wurden die Fähigkeiten unserer Flotte erheblich erweitert."
BEL_convoy_protection_duties_ns:	"Aufgaben zum Schutz von Konvois"
BEL_convoy_protection_duties_ns_desc:	"Die Seewege sind immer gefährlicher geworden. Deshalb haben wir die Seeleute unserer Handelsmarine bewaffnet, damit unsere Konvois im Falle eines Angriffs einigermaßen geschützt sind, und sei es nur, um ihre Flucht wahrscheinlicher zu machen."
BEL_maritime_phoenix_ns:	"Maritimer Phönix"
BEL_maritime_phoenix_ns_desc:	"So wie der Phönix aus der Asche aufsteigt, so erhebt sich auch unsere Flotte aus den Schalen der abgewrackten Schiffe."
BEL_economic_recovery_ns:	"Wirtschaftliche Erholung"
BEL_economic_recovery_ns_desc:	"Unsere geschwächte Wirtschaft zeigt die ersten Anzeichen einer Erholung. Die Ausgaben steigen, die Verschuldung sinkt, und die Spekulanten zeigen mehr Vertrauen in den Markt."
BEL_collapsing_government_ns:	"Kollabierende Regierung"
BEL_collapsing_government_ns_desc:	"Korruptionsvorwürfe haben die Regierung so erschüttert, dass die Ratten aus dem sinkenden Schiff fliehen. Fast täglich gibt es Rücktritte, und es ist klar, dass dieses Kabinett nicht mehr lange zu leben hat."
BEL_the_kings_surrender_ns:	"Die Kapitulation des Königs"
BEL_the_kings_surrender_ns_desc:	"König Leopold III. hat bereits die Kapitulation unserer Nation angeboten. Das hat die Moral unserer Truppen erschüttert und unsere Fähigkeit, den Kampf fortzusetzen, dramatisch beeinträchtigt."
BEL_prisoner_king_ns:	"Der Gefangenenkönig"
BEL_prisoner_king_ns_desc:	"König Leopold III. blieb nach der Kapitulation unseres Landes bei seinem Volk. Er fungiert nun als Sammelpunkt, um den sich alle Belgier versammeln und auf die Wiederherstellung der belgischen Herrschaft vorbereiten können."
BEL_dame_blanche_ns:	"Dame Blanche"
BEL_dame_blanche_ns_desc:	"Die während des Ersten Weltkriegs gegründete Widerstandsorganisation scheint gerade in den Winterschlaf gefallen zu sein, denn jetzt, da Belgien erneut bedroht ist, ist sie wieder aktiv geworden. Aus dem Verborgenen versorgt diese Gruppe unsere Verbündeten mit Informationen und koordiniert die Widerstandsaktivitäten."
BEL_king_law_freedom_ns:	"König, Recht, Freiheit"
BEL_king_law_freedom_ns_desc:	"Das Motto Belgiens bringt die belgische Psyche gut auf den Punkt. König, derjenige, der uns zum Sieg führen wird. Recht, das Schwert, das das Chaos des Krieges zerschlägt. Freiheit, für Belgien und die Belgier."
BEL_chasseurs_ardennais_ns:	"Chasseurs Ardennais"
BEL_chasseurs_ardennais_ns_desc:	"Die Chasseurs Ardennais sind erfahrene Verteidiger der belgischen Ardennen, sehr erfahren und ausgebildet im Waldkrieg."
BEL_dissolve_political_parties_ns:	"Lösen Sie die politischen Parteien auf"
BEL_dissolve_political_parties_ns_desc:	"Unser Premierminister hat erklärt, dass die politischen Parteien der verfaulte Kern unseres korrupten politischen Systems sind. Um diese Krankheit zu heilen, müssen die Parteien aufgelöst werden."
BEL_the_walloon_legion_ns:	"Die Wallonische Legion"
BEL_the_walloon_legion_ns_desc:	"Die Wallonische Legion wurde von französischsprachigen Freiwilligen gegründet, die den Wert ihres Beitrags zu den Kriegsanstrengungen unter Beweis stellen wollten, weil sie befürchteten, von ihren flämischen Brüdern in den Schatten gestellt zu werden."
BEL_surrender_tt:	"§Wenn Sie diese Option wählen, kapituliert Ihre Nation!§! \n\nWenn Sie einer Fraktion angehören, kämpfen Sie als Regierung im Exil weiter."
BEL_scars_of_ww1_ns_fake:	"$BEL_scars_of_ww1_dynamic_modifier$"
BEL_scars_of_ww1_ns_fake_desc:	"$BEL_scars_of_ww1_dynamic_modifier_desc$"
BEL_corruption_ns_fake:	"$BEL_corruption_dynamic_modifier$ $BEL_corruption_dynamic_modifier$"
BEL_corruption_ns_fake_desc:	"$BEL_corruption_dynamic_modifier_desc$"
BEL_democratization_of_education_ns:	"Demokratisierung der Bildung"
BEL_democratization_of_education_ns_desc:	"Unsere Gesellschaft hat eine Tradition der Fürsorge füreinander, die am besten durch den Sozialvertrag zwischen unseren Arbeitnehmern und den Unternehmen verkörpert wird. In ähnlicher Weise sollte der Staat versuchen, jedem die gleichen Chancen zu geben und die Bedeutung einer guten Bildung hervorheben."
BEL_scars_of_ww1_dynamic_modifier:	"Die Narben des Großen Krieges"
BEL_scars_of_ww1_dynamic_modifier_desc:	"[BEL.GetName] hat im Großen Krieg sehr gelitten, da ein großer Teil des Schlachtfeldes an der Westfront lag, und es trägt noch immer diese Narben."
BEL_social_partners_dynamic_modifier:	"Soziale Partner"
BEL_social_partners_dynamic_modifier_desc:	"[ROOT.GetName] brachte Gewerkschaften und Unternehmensvertreter zusammen und vermittelte einen Kompromiss, der unter anderem die Einführung des Mindestlohns und sechs Tage bezahlten Urlaub vorsah."
BEL_engine_of_the_economy_dynamic_modifier:	"Motor der Wirtschaft"
BEL_engine_of_the_economy_dynamic_modifier_desc:	"Alle an Bord des Schnellzuges zum Wohlstand, während sich die Räder der Industrie drehen, gewinnen wir an Schwung, dampfen vorwärts und signalisieren den Beginn einer neuen Ära."
BEL_belgian_miracle_dynamic_modifier:	"Belgisches Wunder"
BEL_belgian_miracle_dynamic_modifier_desc:	"Die Politik von [ROOT.GetLeader] hat sich wirklich ausgezahlt und [ROOT.GetName] ist auf der Weltbühne zu einer Größe aufgestiegen, die von vielen der so genannten Großmächte bewundert wird."
BEL_neutrality_dynamic_modifier:	"Ewige Neutralität"
BEL_neutrality_dynamic_modifier_desc:	"Belgien ist ein unabhängiger und immerwährend neutraler Staat und wird diese Neutralität auch gegenüber allen anderen Staaten wahren."
BEL_defensive_neutrality_dynamic_modifier:	"Verteidigungsneutralität"
BEL_defensive_neutrality_dynamic_modifier_desc:	"Um unsere Neutralität zu schützen, müssen wir sicherstellen, dass unsere Verteidigungsanlagen so beschaffen sind, dass kein Angreifer uns angreifen möchte."
BEL_austrian_resistance_active_state_dynamic_modifier:	"Österreichische Freiheitsfront"
BEL_austrian_resistance_active_state_dynamic_modifier_desc:	"Die Österreichische Freiheitsfront ist im Land aktiv und sorgt für ein größeres Rekrutierungspotenzial und mehr Widerstand, sollte das Land jemals besetzt werden."
BEL_mobilize_the_nation_dynamic_modifier:	"Mobilisieren Sie die Nation"
BEL_mobilize_the_nation_dynamic_modifier_desc:	"Unser Volk ist unser größtes Kapital. Lassen Sie es uns mobilisieren, um so viele Truppen wie möglich aufzustellen."
BEL_defensive_reorganization_dynamic_modifier:	"Defensive Umstrukturierung"
BEL_defensive_reorganization_dynamic_modifier_desc:	"Wir haben weitere strategische und hochrangige Änderungen in der Doktrin vorgenommen und sind weltweit führend in der modernen Defensivtheorie."
BEL_royal_military_academy_dynamic_modifier:	"Königliche Militärakademie"
BEL_royal_military_academy_dynamic_modifier_desc:	"Wir schicken unsere besten und klügsten Köpfe an die Königliche Militärakademie, wo die nächste Generation von Offizieren eine erstklassige militärische Ausbildung in einer Vielzahl von Spezialgebieten erhalten kann."
BEL_corruption_dynamic_modifier:	"Korruption"
BEL_corruption_dynamic_modifier_desc:	"In unserer Regierung grassiert die Korruption mit einer Reihe von Skandalen, die eine Reihe von Verbrechen wie Bestechung und Veruntreuung betreffen. Das Vertrauen der Bevölkerung in unsere demokratischen Institutionen war noch nie so gering wie heute."
BEL_economic_downturn_dynamic_modifier:	"Wirtschaftlicher Abschwung"
BEL_economic_downturn_dynamic_modifier_desc:	"Unsere Wirtschaft liegt in Trümmern, seit der letzte Krieg unser Land in ein Schlachtfeld verwandelt hat. Die Erholung wurde durch die Auswirkungen der weltweiten Depression, von der wir uns immer noch nicht erholt haben, nur noch weiter erschwert."
BEL_belgian_legion_dynamic_modifier:	"Die Belgische Legion"
BEL_belgian_legion_dynamic_modifier_desc:	"Eine Ansammlung von konservativen und royalistischen Loyalisten ist bereit, im Namen ihres Königs zu den Waffen zu greifen."
BEL_gold_reserves_dynamic_modifier:	"[BEL.GetAdjective] Goldreserve"
BEL_rexist_legion_dynamic_modifier:	"Rexistische Legion"
BEL_rexist_legion_dynamic_modifier_desc:	"Die Vereinigung von Kirche und Staat in der rexistischen Bewegung hat es uns ermöglicht, eine militärische Bewegung nach dem Vorbild der alten Militärorden zu gründen."
BEL_european_crusade_dynamic_modifier:	"Der Europäische Kreuzzug"
BEL_european_crusade_dynamic_modifier_desc:	"Wir sind das schlagende Herz des europäischen Ideals, und angesichts der Geier, die über seinen Grenzen kreisen, liegt es an unserer unerschütterlichen Entschlossenheit, den barbarischen Bedrohungen Einhalt zu gebieten, in welcher Form auch immer dies geschehen mag."
BEL_socialism_on_the_rise_dynamic_modifier:	"Sozialistische Gesinnung"
BEL_socialism_on_the_rise_dynamic_modifier_desc:	"Nach dem relativen Wahlsieg von Vandervelde hat die sozialistische Gesinnung in [ROOT.GetNameDef] stetig zugenommen."
BEL_academies_of_belgium_dynamic_modifier:	"Akademien von Belgien"
BEL_academies_of_belgium_dynamic_modifier_desc:	"Die Akademien von Belgien sind eine kollektive Organisation der höheren Bildungseinrichtungen im ganzen Land und stehen im Zentrum der belgischen technologischen Durchbrüche."
BEL_belgian_resistance_state_dynamic_modifier:	"Belgischer Widerstand"
BEL_belgian_resistance_state_dynamic_modifier_desc:	"Unserem Volk ist die Besatzung nicht fremd. Viele haben während des letzten Krieges die Lektionen des zivilen Ungehorsams und des Widerstands gelernt. "
BEL_flooded_tank_barriers_dynamic_modifier:	"Überflutete Panzersperren"
BEL_flooded_tank_barriers_dynamic_modifier_desc:	"In dieser Region gibt es verstreute Panzersperren, die unter Wasserhindernissen versteckt sind und die Bewegung der feindlichen Divisionen verlangsamen und die Verteidigung Belgiens unterstützen sollen."
BEL_secretaries_general_tt:	"Der §YBesatzer§! erhält ein spezielles §Yberufliches Recht§!, das nur in §Ybelgischen Heimatprovinzen§! verfügbar ist."
BEL_international_stipend_ns:	"Internationales Stipendium"
