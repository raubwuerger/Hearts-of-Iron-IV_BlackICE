HUN_state_protection_authority_ns:	"Államvédelmi Hatóság"
HUN_state_protection_authority_ns_desc:	"Unser Geheimdienst wird dazu beitragen, ausländische Spionageangriffe gegen uns abzuwehren und unsere eigenen internationalen Ambitionen zu steigern."
