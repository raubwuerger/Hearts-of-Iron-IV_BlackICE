GER_aufrusting_modifier_desc:	"Jede gebaute Fabrik, jede ausgegebene Mark und jede investierte Ressource nährt unser ehrgeiziges Ziel, eine gewaltige Kriegsmaschine zu schmieden. Aufrüstung ist entscheidend, um die Zukunft unserer Nation zu sichern und die deutsche Souveränität zu festigen."

GER_recovering_economy_modifier_desc:	"Unsere Wirtschaft und Industrie stehen am Rande des Zusammenbruchs, nachdem wir rücksichtslos Ressourcen, die wir uns nicht leisten können, für die Aufrüstung ausgegeben haben. Mit einer umsichtigen Finanzpolitik und schierer Entschlossenheit werden wir unsere Nation wieder aufbauen und stärker werden als je zuvor!"
GER_wirtschaftswunder_modifier:	"Wirtschaftswunder"

GER_kriegsproduktion_modifier:	"Kriegsproduktion"
GER_kriegsproduktion_modifier_desc:	"Wir müssen unsere hochqualifizierten Arbeitskräfte mobilisieren und sie in der Rüstungsproduktion einsetzen, um die [GER.GetAdjective] Unabhängigkeit zu sichern und die notwendigen militärischen Vorräte anzulegen. "

GER_wunderwaffen_modifier_desc:	"Die Wunderwaffenprogramme sind eine kühne Initiative, die darauf abzielt, die Zukunft der Kriegsführung durch radikale technologische Durchbrüche zu gestalten. Unsere Wissenschaftler und Ingenieure verschieben die Grenzen des Möglichen und entwickeln revolutionäre Waffen, die Deutschlands Vorherrschaft in der Luft, über der See und an Land sichern werden. Diese Innovationen haben das Potenzial, den Lauf der Welt zu verändern und jedem Gegner, der es wagt, sich uns zu widersetzen, einen entscheidenden Schlag zu versetzen!"

GER_army_modifier:	"Deutsches Heer"




