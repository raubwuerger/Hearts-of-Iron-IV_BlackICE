GER_politburo_modifier_desc:	"Das Politbüro ist die Avantgarde unseres Volkes und fungiert als Sprachrohr des Proletariats. Beauftragt mit der Regierungsführung, den Sozialismus umzusetzen und die Revolution zu sichern, ist es das höchste Regierungsorgan in [GER.GetNameDef]."
