generic_secret_weapons_ns_desc:	"Auch wenn es verlockend ist, alle zusätzlichen Ressourcen in die Entwicklung von Panzern und Flugzeugen zu stecken, liegt das Geheimnis des Sieges in ganz neuen Wissenschaftsbereichen: Elektronik, Raketentechnik und Kernforschung. "
