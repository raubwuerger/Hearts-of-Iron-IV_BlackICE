fallout_thermonuclear:	"Starker nuklearer Fallout"
sp_land_stronghold_network_collapse_workers_drafted_desc:	"Eine große Anzahl von Arbeitern wurde für Rettungsmaßnahmen und den sofortigen Wiederaufbau abgezogen, was die regulären Bau- und Reparaturarbeiten sowie die Rohstoffgewinnung in der Region erheblich verlangsamt hat."
