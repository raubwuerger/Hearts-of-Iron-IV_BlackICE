 #DESIGNERS (IDEAS)
GER_alfred_rosenberg_modifier:	"Alfred Rosenberg"
GER_collect_scrap_metal_ns_desc:	"Wir haben eine landesweite Kampagne gestartet, um so viel Metallschrott wie möglich zu sammeln, um unsere Wiederaufrüstungsbemühungen zu unterstützen."
GER_import_tariffs_ns_desc:	"Die Einführung von Einfuhrzöllen ist ein notwendiges Übel, um das Wachstum der heimischen Fertigung und Produktion zu fördern, aber noch wichtiger ist, dass wir dadurch wertvolles Geld sparen, da wir die wenigen Devisen, die uns zur Verfügung stehen, nicht ausgeben müssen."
GER_knickebein:	"Knickebein"
GER_knickebein_desc:	"Unser Durchbruch mit dem Knickebein-Navigationssystem hat es uns ermöglicht, die Genauigkeit unserer Bomber zu verfeinern und feindliche Stellungen mit beispielloser Präzision anzuvisieren - selbst bei nächtlichen Angriffen."
GER_defense_of_the_reich_ns_desc:	"Wir werden den Himmel über [ROOT.GetNameDef] sichern und seine Industrien und Menschen schützen. Kein feindlicher Bomber wird unsere himmlische Mauer aus eifrigen Kämpfern durchbrechen!"
GER_the_kammhuber_line:	"Kammhuber-Linie"
GER_the_kammhuber_line_desc:	"Wir können nicht zulassen, dass feindliche Bomber und Jäger frei am Himmel über [ROOT.GetNameDef] umherstreifen. Durch den Aufbau eines ausgeklügelten Systems sich überschneidender Radarsignale werden wir sie abfangen, bevor sie unser Kernland erreichen."
GER_nachtjagdgeschwader:	"Nachtjagdgeschwader"

GER_tragergruppen_ns:	"Trägergruppen"
GER_tragergruppen_ns_desc:	"Die Ausbildung und Ausrüstung spezieller Trägergruppen sichert unsere Vorherrschaft am Himmel über den endlosen Meeren."

 #NATIONAL SPIRITS
GER_rudeltaktik_ns:	"Rudeltaktik"
GER_rudeltaktik_ns_desc:	"Unsere U-Boot-Wolfsrudel durchkämmen die Meere auf der Suche nach neuer Beute, die sie jagen können. Durch den Einsatz der Rudeltaktik können sie sich besser koordinieren und den Feind an der Wurzel packen: der Abhängigkeit von den offenen Wellen."
GER_german_trade_ns:	"Deutscher Handel"
GER_german_trade_offshore_tt:	"([ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!) Fügen Sie §G1§! offmap §Y$industrial_complex$§! hinzu."
GER_development_of_economic_relations_ns:	"Entwicklung der Wirtschaftsbeziehungen"
GER_german_development_aid:	"Deutsche Entwicklungshilfe"
GER_the_inner_circle_dm_desc:	"Der Innere Kreis des Führers umfasst die politische Elite von [GER.GetNameDef], glühende Loyalisten, die bereit sind, [GER.GetLeader]s Vision voranzutreiben. Voller Ehrgeiz streben sie alle danach, innerhalb des Inneren Kreises aufzusteigen und Reichsleiter zu werden. Ihr Einfluss prägt militärische, industrielle und politische Entscheidungen gleichermaßen und bestimmt die deutsche Politik. Ihr Ehrgeiz ist auch eine Quelle von Spannungen, denn er führt zu Intrigen und Verrat."
GER_the_inner_circle_tt_ascended_advisor_2:	"§Y[GetAscendedAdvisorName2]§! als [GetAscendedAdvisorDesc2] \n"
GER_war_preparations_tt:	"Das nächste Mal ist §Y[ROOT.GetNameDef]§! bei §YWar§!:"
GER_strengthened_supply_lines_ns:	"Gestärkte Nachschublinien"
GER_nordische_legion_ns_desc:	"Viele [ROOT.GetAdjective] sehnen sich nach Abenteuern und wollen für eine gute Sache kämpfen. Zu diesem Zweck haben wir eine Legion von Freiwilligen aufgestellt, die unseren nordischen Brüdern in ihren Kriegen beistehen werden."
GER_fernostliche_legion_ns:	"Fernöstliche Legion"
GER_fernostliche_legion_ns_desc:	"Viele [ROOT.GetAdjective]s sehnen sich nach Abenteuern und möchten für eine gute Sache kämpfen. Zu diesem Zweck haben wir eine Legion von Freiwilligen aufgestellt, die unseren [CHI.GetAdjective] Freunden in ihren Kriegen beistehen werden."
GER_expatriated_communists_return_home_ns:	"Ausgebürgerte Kommunisten kehren heim"
GER_expatriated_communists_return_home_ns_desc:	"Viele deutsche Kommunisten, die während der Naziherrschaft aus dem Land vertrieben wurden, kehren nun massenhaft zurück, um gegen ihre ehemaligen Unterdrücker zu kämpfen."
GER_expatriated_communists_return_home_supressed_ns:	"Ausgebürgerte Kommunisten kehren zurück"
GER_expatriated_communists_return_home_supressed_ns_desc:	"Viele deutsche Kommunisten, die während der Naziherrschaft aus dem Land vertrieben wurden, kehren nun massenhaft nach Deutschland zurück, obwohl die Militärregierung offen antikommunistisch eingestellt ist."
GER_bismarckjugend_idea:	"Bismarckjugend"
GER_bismarckjugend_idea_desc:	"Die Deutschnationale Volkspartei hat die Bismarckjugend reformiert, um mehr Menschen als Teil eines paramilitärischen Flügels in die Armee zu bringen."
GER_eiserne_front_idea:	"Eiserne Front"
GER_eiserne_front_idea_desc:	"In dem Bemühen, den Feind zu besiegen, hat der deutsche Staat beschlossen, die Eiserne Front, eine sozialdemokratische paramilitärische Organisation, offiziell einzustellen und zu fördern."
GER_pacific_blitzkrieg:	"Pazifischer Blitzkrieg"
GER_proud_eagle_that_ate_the_sun:	"Der stolze Adler, der die Sonne fraß"
GER_chi_ger_trade:	"[CHI.GetAdjective]-[GER.GetAdjective] Handelsabkommen"
GER_shatter_USA_hegemony:	"Zerschlage die [USA.GetAdjective] Hegemonie"
GER_eben_emael_partial_success_ns:	"Teilweise erfolgreiches Kommandounternehmen auf Eben Emael"
GER_eben_emael_partial_success_ns_desc:	"$GER_eben_emael_success_ns_desc$"
GER_eben_emael_success_ns:	"Erfolgreiches Kommandounternehmen auf Eben Emael"
GER_eben_emael_success_ns_desc:	"Ein sorgfältig geplanter Angriff auf die Festung in Eben Emael hat die [BEL.GetAdjective]s für unsere Angriffe verwundbar gemacht. Jetzt ist ein guter Zeitpunkt für eine groß angelegte Offensive."
