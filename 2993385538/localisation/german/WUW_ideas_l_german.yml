GER_proletarian_legion_ns_desc:	"Viele [ROOT.GetAdjective]sehnen sich nach Abenteuern und möchten für eine gute Sache kämpfen. Zu diesem Zweck haben wir eine Legion von Freiwilligen aufgestellt, die ausziehen wird, um unseren proletarischen Brüdern in ihren Kriegen beizustehen."
