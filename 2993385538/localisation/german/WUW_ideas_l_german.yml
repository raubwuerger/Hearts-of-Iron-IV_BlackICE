HUN_state_protection_authority_ns_vanilla_desc:	"Unser Nachrichtendienst wird dazu beitragen, ausländische Spionageangriffe gegen uns abzuschrecken und unsere eigenen internationalen Ambitionen zu steigern."
HUN_great_bulwark_against_the_west_ns:	"Das große Bollwerk"
HUN_habsburg_restored_desc:	"Seit 1526 wird unser Land von der Habsburger-Dynastie regiert, die einen göttlichen Anspruch auf unsere Ländereien erhebt. Mit der Wiedereinführung der Monarchie ist es höchste Zeit, dafür zu sorgen, dass diese Dynastie bleibt und unser Land nicht erneut in republikanische Verderbtheit verfällt."
