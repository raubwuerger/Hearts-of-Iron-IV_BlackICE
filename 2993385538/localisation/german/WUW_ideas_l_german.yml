COG_urban_area_investments_modifier:	"Investitionen in städtische Gebiete"
COG_urban_area_investments_modifier_desc:	"Die kongolesische Regierung hat beschlossen, Investitionen hauptsächlich auf diesen Bereich zu konzentrieren, damit sie mit den wenigen Mitteln, die ihnen zur Verfügung stehen, mehr erreichen können."
