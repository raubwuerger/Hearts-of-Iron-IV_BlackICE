GER_safeguard_finland_idea_desc:	"Finnland war bis vor wenigen Jahrzehnten Teil des Russischen Reiches, und es liegt nahe, dass [GER.GetRussiansDemonym] erneut versuchen könnte, das Land zu annektieren. Daher hat Deutschland seine volle Unterstützung gegen die Bedrohung aus dem Osten angeboten."
