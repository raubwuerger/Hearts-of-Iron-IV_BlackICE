GER_bewegungskrieg_modifier:	"Bewegungskrieg"
GER_bewegungskrieg_modifier_desc:	"Die moderne Kriegsführung mit modernen Maschinen hat es [GER.GetNameDef]s ermöglicht, seine Bewegungskrieg-Doktrin der Bewegung und Flexibilität auf dem Schlachtfeld voll auszuschöpfen. Mit den schnellen Vorstößen der [GER.GetAdjective] Truppen, unterstützt durch schweren Artilleriebeschuss, werden sie jeden Feind schnell überwältigen und vernichten."
