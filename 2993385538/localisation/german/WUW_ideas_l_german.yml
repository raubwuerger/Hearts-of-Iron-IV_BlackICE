GER_communist_intel_modifier:	"Geheimdienstabteilung"
GER_communist_intel_modifier_desc:	"Ein guter Geheimdienst wird unsere Informationsbeschaffung, -verarbeitung und -analyse effizienter machen."
GER_stasi_modifier_desc:	"Das Ministerium für Staatssicherheit (Stasi) wird dafür sorgen, dass wir Informationen zur nationalen Sicherheit effizient und schnell sammeln, verarbeiten und analysieren können. Die Stasi wird unseren Staat vor Bedrohungen aus dem Inneren und aus dem Ausland schützen und als Schild und Schwert der Partei fungieren."


GER_communist_influence:	"Kommunistische Einflüsse von [GER.GetNameDef]"







 #Democratic/Kaiserreich
GER_mitteleuropa_integrated_customs_union_member_tt:	"§Y[GER.GetNameDefCap]§! wird in der Lage sein §RAversuchen, uns diplomatisch zu unterwerfen!§!"
GER_alpine_warfare_idea:	"Alpine Kriegsführung"
GER_uncertain_future:	"Ungewisse Zukunft"
GER_uncertain_future_desc:	"Nach dem Ende des Bürgerkriegs baut sich die deutsche Nation langsam wieder auf, aber die Menschen sehnen sich nach Stabilität und Sicherheit. Das Volk sehnt sich jedoch nach Stabilität und Sicherheit. [ROOT.GetLeader] hat keine Anstrengungen unternommen, um voranzukommen und scheint kein Interesse daran zu haben, zu entscheiden, wie die Zukunft des neuen deutschen Staates aussehen soll. Das hat in der Bevölkerung große Besorgnis ausgelöst, die sich unbedingt von ihrer zerrütteten Vergangenheit lösen möchte."
GER_august_von_mackensen_must_retire_tt:	"§Y$GER_uncertain_future$§! wird §Yentfernt§! sein, sobald §Y$GER_august_von_mackensen$§! als Regierungschef zurückgetreten ist"
