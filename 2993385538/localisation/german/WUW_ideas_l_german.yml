GER_economy_of_conquest_modifier:	"Wirtschaft der Eroberung"
GER_economy_of_conquest_modifier_desc:	"Trotz der ungerechten Bestimmungen des Versailler Vertrags erheben wir uns mit unerschütterlicher Entschlossenheit aus der Asche. Durch unermüdliche Aufrüstung haben wir uns verpflichtet, eine konkurrenzlose Militärindustrie aufzubauen, um unseren Aufstieg zum Ruhm voranzutreiben. Das wird unsere Wirtschaft belasten, aber mit dem Sieg kommt die Gelegenheit, die Beute der Eroberung zu ernten und den Reichtum anderer Nationen zur Stärkung unserer Streitkräfte zu nutzen. Wehe den Besiegten!"
GER_aufrusting_modifier:	"Aufrüstung"
GER_aufrusting_modifier_desc:	"Jede gebaute Fabrik, jede ausgegebene Mark und jede investierte Ressource nährt unser ehrgeiziges Ziel, eine gewaltige Kriegsmaschine zu schmieden. Aufrüstung ist entscheidend, um die Zukunft unserer Nation zu sichern und die deutsche Souveränität zu festigen."
GER_recovering_economy_modifier:	"Wirtschaft im Aufschwung"
GER_recovering_economy_modifier_desc:	"Unsere Wirtschaft und Industrie stehen am Rande des Zusammenbruchs, nachdem wir rücksichtslos Ressourcen, die wir uns nicht leisten können, für die Aufrüstung ausgegeben haben. Mit einer umsichtigen Finanzpolitik und schierer Entschlossenheit werden wir unsere Nation wieder aufbauen und stärker werden als je zuvor!"
GER_wirtschaftswunder_modifier:	"Wirtschaftswunder"
GER_wirtschaftswunder_modifier_desc:	"Wir haben es geschafft, eine Wirtschaft, die in Trümmern lag, in eine der führenden Industriemächte der Welt zu verwandeln. Dieser bemerkenswerte Aufschwung kann nur als Wirtschaftswunder bezeichnet werden."
GER_kriegsproduktion_modifier:	"Kriegsproduktion"
GER_kriegsproduktion_modifier_desc:	"Wir müssen unsere hochqualifizierten Arbeitskräfte mobilisieren und sie in der Rüstungsproduktion einsetzen, um die [GER.GetAdjective] Unabhängigkeit zu sichern und die notwendigen militärischen Vorräte anzulegen. "
GER_wunderwaffen_modifier:	"Wunderwaffen"
GER_wunderwaffen_modifier_desc:	"Die Wunderwaffenprogramme sind eine kühne Initiative, die darauf abzielt, die Zukunft der Kriegsführung durch radikale technologische Durchbrüche zu gestalten. Unsere Wissenschaftler und Ingenieure verschieben die Grenzen des Möglichen und entwickeln revolutionäre Waffen, die Deutschlands Vorherrschaft in der Luft, über der See und an Land sichern werden. Diese Innovationen haben das Potenzial, den Lauf der Welt zu verändern und jedem Gegner, der es wagt, sich uns zu widersetzen, einen entscheidenden Schlag zu versetzen!"
GER_wehrwirtschaft_modifier:	"Wehrwirtschaft"
GER_wehrwirtschaft_modifier_desc:	"Wir können nicht zulassen, dass ausländische Mächte unseren Wohlstand oder unsere Zukunft diktieren. Das Erreichen der Autarkie wird [ROOT.GetNameDef] wirtschaftliche Unabhängigkeit sichern, die Abhängigkeit von ausländischen Ressourcen verringern und die Selbstversorgung unseres Volkes gewährleisten. "
GER_army_modifier:	"Deutsches Heer"
GER_army_modifier_desc:	"[GER.GetNameDefCap] hat eine lange und stolze Militärgeschichte mit einer Tradition des innovativen Denkens. Seit der demütigenden Niederlage im Großen Krieg hat sich der Generalstab bemüht, unsere Streitkräfte noch weiter zu verbessern. Mit diesem Fachwissen ist unsere Armee in der Lage, jeden Feind zu bekämpfen, der unser stolzes Volk unterwerfen will."
GER_army_communist_modifier:	"Volksarmee"
GER_army_communist_modifier_desc:	"Die Volksarmee ist der Schild des Sozialismus, bereit, die proletarische Revolution zu schützen und zu verbreiten. Das innovative Denken des Generalstabs der Volksarmee stellt sicher, dass jede imperialistische Aggression den revolutionären Geist des deutschen Volkes nicht auslöschen wird."
GER_navy_fascist_modifier:	"Kriegsmarine"
GER_navy_fascist_modifier_desc:	"Durch Modernisierung und kühne Strategie fordern wir die Weltmeere heraus und jagen unseren Feinden Angst ein. Unsere mächtigen Schlachtschiffe werden die Wellen beherrschen und unsere U-Boote werden unter ihnen herrschen."
GER_navy_democratic_modifier:	"Deutsche Marine"
GER_navy_democratic_modifier_desc:	"Die Deutsche Marine fordert die Meere heraus, um unsere maritimen Interessen zu schützen und sicherzustellen, dass unser Einfluss über den ganzen Globus reicht."
GER_navy_imperial_modifier:	"Kaiserliche Marine"
GER_navy_imperial_modifier_desc:	"Unsere mächtige Kaiserliche Marine wird die Wellen des Ozeans durchschneiden, um unsere globalen Ambitionen anzuführen und unsere Dominanz auf hoher See zu behaupten."
GER_navy_communist_modifier:	"Volksmarine"
GER_navy_communist_modifier_desc:	"Die Volksmarine ist stets wachsam gegenüber imperialistischer Aggression. Sie wird die Revolution des Proletariats über die Meere verbreiten und eine neue Weltordnung einführen."
GER_airforce_modifier:	"Luftwaffe"
GER_airforce_modifier_desc:	"Mit unübertroffenen Fähigkeiten und technischem Können ist die Luftwaffe in der Lage, den Himmel zu beherrschen und unsere Macht auf jeden Feind zu übertragen, der dumm genug ist, uns herauszufordern. Mit hochmodernen Flugzeugen und bestens ausgebildeten Piloten ist unsere Luftwaffe bereit, den Himmel in Brand zu setzen, jede Armee zu vernichten und jede Marine zu versenken, die sich uns entgegenstellt."
GER_airforce_communist_modifier:	"Luftstreitkräfte"
GER_airforce_communist_modifier_desc:	"Unsere Luftwaffe fliegt durch die Lüfte, um den proletarischen Staat und die Zukunft des Sozialismus zu sichern. Jedes Flugzeug ist ein Zeugnis für den Erfindungsreichtum und den unermüdlichen Geist unseres Volkes, das bereit ist, es mit jedem Feind aufzunehmen."
GER_military_modifier_tt:	"[GetSubmarineMaxSpeed]"
GER_military_modifier_submarine_speed_big:	"$GER_military_modifier$"
GER_military_modifier_submarine_speed_big_desc:	"$GER_military_modifier_desc$"
GER_submarine_max_speed_small_tt:	"$ship_hull_submarine$ $STAT_NAVY_MAXIMUM_SPEED$: §G+5%§!"
GER_submarine_max_speed_big_tt:	"$ship_hull_submarine$ $STAT_NAVY_MAXIMUM_SPEED$: §G+10%§!"
GER_military_modifier_fascist_desc:	"[GER.GetNameDefCap] hat eine lange und stolze Militärgeschichte mit einer Tradition des innovativen Denkens, und unser Generalstab hat sich seit der demütigenden Niederlage des Großen Krieges bemüht, unsere Streitkräfte noch weiter zu verbessern. Mit diesem Know-how sind wir in der Lage, jeden Feind zu bekämpfen, der unser stolzes Volk unterjochen will."
GER_alfred_rosenberg_modifier:	"Alfred Rosenberg"
GER_collect_scrap_metal_ns_desc:	"Wir haben eine landesweite Kampagne gestartet, um so viel Metallschrott wie möglich zu sammeln, um unsere Wiederaufrüstungsbemühungen zu unterstützen."
GER_import_tariffs_ns_desc:	"Die Einführung von Einfuhrzöllen ist ein notwendiges Übel, um das Wachstum der heimischen Fertigung und Produktion zu fördern, aber noch wichtiger ist, dass wir dadurch wertvolles Geld sparen, da wir die wenigen Devisen, die uns zur Verfügung stehen, nicht ausgeben müssen."
GER_knickebein:	"Knickebein"
GER_knickebein_desc:	"Unser Durchbruch mit dem Knickebein-Navigationssystem hat es uns ermöglicht, die Genauigkeit unserer Bomber zu verfeinern und feindliche Stellungen mit beispielloser Präzision anzuvisieren - selbst bei nächtlichen Angriffen."
GER_defense_of_the_reich_ns_desc:	"Wir werden den Himmel über [ROOT.GetNameDef] sichern und seine Industrien und Menschen schützen. Kein feindlicher Bomber wird unsere himmlische Mauer aus eifrigen Kämpfern durchbrechen!"
GER_the_kammhuber_line:	"Kammhuber-Linie"
GER_the_kammhuber_line_desc:	"Wir können nicht zulassen, dass feindliche Bomber und Jäger frei am Himmel über [ROOT.GetNameDef] umherstreifen. Durch den Aufbau eines ausgeklügelten Systems sich überschneidender Radarsignale werden wir sie abfangen, bevor sie unser Kernland erreichen."
GER_nachtjagdgeschwader:	"Nachtjagdgeschwader"
GER_nachtjagdgeschwader_desc:	"Unsere Nachtjagdgeschwader werden jedes feindliche Flugzeug, das es wagt, unsere Grenzen zu überfliegen, jagen und zerstören. Diese Geschwader beherrschen den Nachthimmel und sichern unser Heimatland im Schutz der Dunkelheit vor feindlichen Bombern."
GER_tragergruppen_ns:	"Trägergruppen"
GER_tragergruppen_ns_desc:	"Die Ausbildung und Ausrüstung spezieller Trägergruppen sichert unsere Vorherrschaft am Himmel über den endlosen Meeren."
GER_cruiser_warfare_ns_desc:	"Unsere Kreuzer bringen die Handelsflotten unserer Feinde auf offener See in Bedrängnis. Das wird ihre Industrien mit Sicherheit in die Knie zwingen."
GER_panzerschiff_raiders_ns_desc:	"Unsere schweren Kreuzer stellen eine ernsthafte Bedrohung für die Flotten unserer Feinde dar. Ihre Kanonen haben eine enorme Durchschlagskraft, und ihre Geschwindigkeit erlaubt es ihnen, sich zu entfernen, bevor sie richtig angegriffen werden."
GER_rudeltaktik_ns:	"Rudeltaktik"
GER_rudeltaktik_ns_desc:	"Unsere U-Boot-Wolfsrudel durchkämmen die Meere auf der Suche nach neuer Beute, die sie jagen können. Durch den Einsatz der Rudeltaktik können sie sich besser koordinieren und den Feind an der Wurzel packen: der Abhängigkeit von den offenen Wellen."
GER_german_trade_ns:	"Deutscher Handel"
GER_german_trade_offshore_tt:	"([ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!) Fügen Sie §G1§! offmap §Y$industrial_complex$§! hinzu."
GER_development_of_economic_relations_ns:	"Entwicklung der Wirtschaftsbeziehungen"
GER_gestapo_ns:	"Gestapo"
GER_german_development_aid:	"Deutsche Entwicklungshilfe"
GER_german_exploitation:	"Deutsche Ausbeutung"
GER_the_inner_circle_dm:	"Der innere Kreis"
GER_the_inner_circle_dm_desc:	"Der Innere Kreis des Führers umfasst die politische Elite von [GER.GetNameDef], glühende Loyalisten, die bereit sind, [GER.GetLeader]s Vision voranzutreiben. Voller Ehrgeiz streben sie alle danach, innerhalb des Inneren Kreises aufzusteigen und Reichsleiter zu werden. Ihr Einfluss prägt militärische, industrielle und politische Entscheidungen gleichermaßen und bestimmt die deutsche Politik. Ihr Ehrgeiz ist auch eine Quelle von Spannungen, denn er führt zu Intrigen und Verrat."
