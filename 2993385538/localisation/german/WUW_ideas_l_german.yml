AUS_bankverein:	"Wiener Bankverein"
AUS_bbo:	"BBÖ"
AUS_alpen_elektrowerke_designer:	"Alpen-Elektrowerke"
AUS_doth_desc:	"Es ist die Pflicht eines jeden [AUS.GetAdjective], seinen Beitrag zur Verteidigung des Vaterlandes zu leisten, sei es in der Armee, in den Fabriken oder auf den Baustellen. Durch die gemeinsamen Anstrengungen der Nation wird das Vaterland geschützt werden!"
AUS_aggression_desc:	"Abwarten und darauf hoffen, nicht angegriffen zu werden, ist in Zeiten wie diesen ein unsicherer Ansatz. Um sicherzustellen, dass wir nicht unvorbereitet erwischt werden, müssen wir bereit sein, zuerst zuzuschlagen."
AUS_austromarxism:	"Austromarxismus"
AUS_austrostalinism:	"Austrostalinismus"
AUS_austrotrotskyism:	"Austrotrotzkismus"
AUS_austromarxism_desc:	"Die austromarxistische Agenda, die auf den Schriften von Otto Bauer basiert und einen Mittelweg zwischen Sozialdemokratie und sowjetischem Kommunismus befürwortet. Nach einer sehr bedeutenden Abkehr vom früheren Austrofaschismus orientiert sich das Land nun an den Grundsätzen des Kommunismus und der Demokratie."
AUS_austrostalinism_desc:	"Hat sich vom austromarxistischen Mittelweg abgewandt und den Austrofaschismus längst abgeschafft [AUS.GetNameDef] und folgt nun streng den stalinistischen Idealen."
AUS_austrotrotskyism_desc:	"Abgewichen vom austromarxistischen Mittelweg und nachdem der Austrofaschismus längst abgeschafft wurde [AUS.GetNameDef] folgt man nun einem strengen Satz trotzkistischer Ideen."
AUS_peoples_army:	"Die Volksarmee"
AUS_peoples_army_desc:	"Die Mobilisierung der Massen hat zu einer starken Präsenz von Milizen im Land geführt. Die Milizen sind für eine so schnelle Mobilisierung ungewöhnlich gut ausgebildet und ausgerüstet. Infolgedessen hat auch die Rekrutierung für die reguläre Armee einen Aufschwung erfahren."
AUS_empire_restored:	"Das österreichische Kaiserreich wiederhergestellt"
AUS_empire_restored_desc:	"Ein Kaiserreich war sie, ein Kaiserreich soll sie sein! Nachdem ein Großteil des alten [AUS.GetAdjective] zurückerobert wurde, ist das Kaiserreich wiederhergestellt."
AUS_airforce:	"Österreichische Luftstreitkräfte"
AUS_army_monarchy:	"Österreichische Landwehr"
