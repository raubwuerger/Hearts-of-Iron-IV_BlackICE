HUN_hungarian_national_defense_association_greenshirts_desc:	"Die rechtsextreme, weitgehend paramilitärische Organisation M.O.V.E., die 1919 gegründet wurde, ist im Großen und Ganzen ihrem Anführer und Gründer Gyula Gömbös treu. Da jedoch die Organisationen der Grünen Hemden und des Sichelkreuzes in sie eingegliedert wurden, ist ihre Loyalität zersplittert, und sie ist möglicherweise den Führern des Pfeilkreuzes treuer als irgendjemand anderem."
