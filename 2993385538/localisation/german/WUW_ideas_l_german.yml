BEL_inflation_controls_ns:	"Inflationsbekämpfung"
BEL_inflation_controls_ns_desc:	"Um die Auswirkungen der Inflation zu mildern, begannen wir, Geld aus dem Umlauf zu nehmen und keine Ersatzscheine für beschädigte Banknoten auszugeben, änderten die Zinssätze und förderten die Ausgaben innerhalb der Wirtschaft."
BEL_language_barriers_ns_desc:	"Belgien ist in zwei Sprachgruppen geteilt: Französisch, gesprochen von den Bewohnern der wallonischen Regionen, und Niederländisch, gesprochen von den Flamen. Jede Seite ist außerordentlich stolz auf ihre Kultur und ihr Erbe, und da die Sprache eng damit verbunden ist, möchte keine Seite ihre eigene aufgeben oder zusehen, wie ihre Sprache der anderen untergeordnet wird."
BEL_language_barriers_fas_nl_ns:	"Vorrang der niederländischen Sprache"
BEL_language_barriers_fas_nl_ns_desc:	"Die niederländische Sprache wurde als Hauptsprache innerhalb von [ROOT.GetName] ausgewählt, wobei die flämische Kultur gefördert und die wallonische im Namen der Einheit unterdrückt wird."
BEL_language_barriers_fas_fr_ns:	"Vorrang der französischen Sprache"
BEL_traditional_family_values_ns:	"Traditionelle Familienwerte"
BEL_traditional_family_values_ns_desc:	"Die Familie ist einer der wichtigsten Aspekte im Leben eines Menschen, und wir halten uns diesbezüglich an bestimmte Standards. Innerhalb der Familie gibt es festgelegte Geschlechterrollen und Erwartungen, die auf das Wachstum und die Stabilität unserer Bevölkerung ausgerichtet sind."
BEL_defensive_neutrality_capstone_ns:	"Defensive Umstrukturierung"
BEL_defensive_neutrality_capstone_ns_desc:	"Wir haben alles in unserer Macht Stehende getan, um uns auf eine Invasion vorzubereiten; nun bleibt nur noch, strategischere und grundlegendere Änderungen der Doktrin zu identifizieren, die sich an den modernsten Konzepten der Verteidigungsstrategie orientieren."
BEL_lack_of_junior_officers_ns:	"Mangel an Unteroffizieren"
BEL_lack_of_junior_officers_ns_desc:	"Die rasche Mobilisierung unserer Streitkräfte ist im Großen und Ganzen gut vorangekommen, abgesehen von einem Problem: dem Mangel an Unteroffizieren, die unsere neuen Rekruten organisieren könnten! Es wird eine Weile dauern, bis sich die militärische Hierarchie neu geordnet hat. "
BEL_legacy_of_the_great_war_ns:	"Das Erbe des Ersten Weltkriegs"
BEL_legacy_of_the_great_war_ns_desc:	"Auf den Feldern Flanderns fanden einige der heftigsten Kämpfe an der Westfront statt – ein Gebiet, das von König Albert, seinen tapferen belgischen Soldaten und dank der Opfer unserer Verbündeten verbissen verteidigt wurde. Wir sollten dieses Andenken ehren und danach streben, ihrem Beispiel zu folgen."
BEL_pressurized_cabins_ns:	"Druckkabinen"
BEL_pressurized_cabins_ns_desc:	"Um die Entfernung zwischen Belgien und unseren Kolonialbesitzungen im Kongo besser zu überbrücken, haben wir Pionierarbeit beim Einsatz von Druckkabinen in unseren Flugzeugen geleistet."
BEL_license_air_idea:	"Fluglizenzen"
BEL_license_air_idea_desc:	"Wir mussten schnell Flugzeuge beschaffen und haben daher eine Reihe von Verträgen mit ausländischen Unternehmen unterzeichnet."
BEL_license_POL_air_idea:	"Polnische Flugzeuglizenz"
BEL_legacy_of_the_belgian_airforce_ns:	"Das Erbe der belgischen Luftwaffe"
BEL_legacy_of_the_belgian_airforce_ns_desc:	"Belgien gehörte zu den ersten Nationen, die sich die Luftmacht zunutze machten, und unsere Piloten kämpften im Ersten Weltkrieg sehr tapfer. Ihr Vermächtnis wird von unserer heutigen Generation von Piloten gewürdigt, die nichts sehnlicher wünschen, als in ihre Fußstapfen zu treten."
BEL_re_build_the_fleet_ns:	"Wiederaufbau der Flotte"
BEL_re_build_the_fleet_ns_desc:	"Unsere Marine wurde 1927 aufgelöst, doch die globale Lage erfordert, dass wir erneut in unsere Flotte investieren, um unsere Handelsbeziehungen zum Kongo aufrechtzuerhalten und unsere maritimen Interessen zu verfolgen."
BEL_maritime_support_ns:	"Maritime Unterstützung"
BEL_convoy_protection_duties_ns:	"Konvoischutz"
BEL_maritime_phoenix_ns:	"Maritimer Phönix"
BEL_economic_recovery_ns:	"Wirtschaftlicher Aufschwung"
BEL_collapsing_government_ns:	"Zusammenbrechende Regierung"
BEL_the_kings_surrender_ns:	"Die Kapitulation des Königs"
BEL_prisoner_king_ns:	"Der gefangene König"
BEL_prisoner_king_ns_desc:	"König Leopold III. blieb nach der Kapitulation unseres Landes bei seinem Volk. Er fungiert nun als Sammelpunkt, um den sich alle Belgier versammeln und auf die Wiederherstellung der belgischen Herrschaft vorbereiten können."
BEL_dame_blanche_ns:	"Dame Blanche"
BEL_dame_blanche_ns_desc:	"Die während des Ersten Weltkriegs gegründete Widerstandsorganisation schien lediglich in den Winterschlaf versetzt worden zu sein, doch nun, da Belgien erneut bedroht ist, ist sie wieder aktiv geworden. Aus dem Verborgenen versorgt diese Gruppe unsere Verbündeten mit Informationen und koordiniert die Widerstandsaktivitäten."
BEL_king_law_freedom_ns:	"König, Gesetz, Freiheit"
BEL_king_law_freedom_ns_desc:	"Das Motto Belgiens fasst die belgische Mentalität gut zusammen. König, derjenige, der uns zum Sieg führen wird. Gesetz, das Schwert, das gegen das Chaos des Krieges schlägt. Freiheit, für Belgien und die Belgier."
BEL_chasseurs_ardennais_ns:	"Chasseurs Ardennais"
BEL_chasseurs_ardennais_ns_desc:	"Die Chasseurs Ardennais sind erfahrene Verteidiger der belgischen Ardennen, äußerst routiniert und in der Waldkriegsführung geschult."
BEL_dissolve_political_parties_ns:	"Politische Parteien auflösen"
BEL_the_walloon_legion_ns:	"Die Wallonische Legion"
BEL_the_walloon_legion_ns_desc:	"Die Wallonische Legion wurde aus französischsprachigen Freiwilligen gebildet, die den Wert ihres Beitrags zum Kriegseinsatz unter Beweis stellen wollten, aus Angst, von ihren flämischen Brüdern in den Schatten gestellt zu werden."
BEL_democratization_of_education_ns_desc:	"Unsere Gesellschaft hat eine Tradition der gegenseitigen Fürsorge, die am besten durch den Sozialvertrag zwischen unseren Arbeitnehmern und den Unternehmen verkörpert wird. Ebenso sollte der Staat bestrebt sein, jedem gleiche Chancen zu bieten und die Bedeutung einer guten Bildung hervorzuheben. "
BEL_scars_of_ww1_dynamic_modifier:	"Narben des Ersten Weltkriegs"
BEL_engine_of_the_economy_dynamic_modifier:	"Motor der Wirtschaft"
BEL_engine_of_the_economy_dynamic_modifier_desc:	"Alle an Bord des Expresszuges zum Wohlstand: Während sich die Räder der Industrie drehen, gewinnen wir an Schwung, dampfen voran und läuten den Beginn einer neuen Ära ein."
BEL_neutrality_dynamic_modifier:	"Dauerhafte Neutralität"
BEL_neutrality_dynamic_modifier_desc:	"Belgien ist ein unabhängiger und dauerhaft neutraler Staat und wird diese Neutralität gegenüber allen anderen Staaten wahren."
BEL_mobilize_the_nation_dynamic_modifier:	"Mobilisieren Sie die Nation"
BEL_mobilize_the_nation_dynamic_modifier_desc:	"Unser Volk ist unser größtes Kapital. Lassen Sie uns es mobilisieren, um eine so große Streitmacht wie möglich aufzustellen."
BEL_royal_military_academy_dynamic_modifier:	"Königliche Militärakademie"
BEL_corruption_dynamic_modifier_desc:	"In unserer Regierung grassiert die Korruption, und es gibt eine Reihe von Skandalen, die eine Vielzahl von Straftaten wie Bestechung und Unterschlagung umfassen. Das Vertrauen der Bevölkerung in unsere demokratischen Institutionen war noch nie so gering."
BEL_economic_downturn_dynamic_modifier:	"Wirtschaftlicher Abschwung"
BEL_european_crusade_dynamic_modifier_desc:	"Wir sind das schlagende Herz des europäischen Ideals, und da Geier an seinen Grenzen kreisen, liegt es an unserer unerschütterlichen Entschlossenheit, die barbarischen Bedrohungen abzuwehren, in welcher Form auch immer diese auftreten mögen."
BEL_socialism_on_the_rise_dynamic_modifier_desc:	"Nach Vanderveldes relativem Wahlsieg haben sozialistische Tendenzen in [ROOT.GetNameDef] stetig zugenommen."
BEL_academies_of_belgium_dynamic_modifier:	"Akademien Belgiens"
BEL_belgian_resistance_state_dynamic_modifier:	"Belgischer Widerstand"
BEL_belgian_resistance_state_dynamic_modifier_desc:	"Unser Volk ist mit Besatzung vertraut; viele haben während des letzten Krieges die Lektionen des zivilen Ungehorsams und des Widerstands gelernt."
BEL_flooded_tank_barriers_dynamic_modifier:	"Überflutete Panzersperren"
BEL_flooded_tank_barriers_dynamic_modifier_desc:	"In dieser Region befinden sich verstreute Panzersperren, die unter Wasserhindernissen verborgen sind und dazu dienen, die Bewegung feindlicher Divisionen zu verlangsamen und zur Verteidigung Belgiens beizutragen."
