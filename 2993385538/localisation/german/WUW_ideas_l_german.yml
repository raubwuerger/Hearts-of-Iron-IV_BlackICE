COG_force_publique:	"Öffentliche Gewalt (Force Publique)"
COG_force_publique_desc:	"Die Force Publique ist die Gendarmerie und Militärtruppe des Kongo, die 1877 unter dem Kongo-Freistaat gegründet wurde. Ihre Offiziere sind ausschließlich Europäer, seien es Belgier oder Söldner, während die einfachen Soldaten größtenteils aus dem Kongo stammen. Die Truppe ist sehr effektiv, wenn es darauf ankommt, aber die Ungleichheit und das schlechte Management sorgen für große Unzufriedenheit."
COG_the_invisible_roof:	"Das unsichtbare Dach"
COG_the_invisible_roof_desc:	"Obwohl es keine Gesetze gibt, die dies offiziell regeln, verbieten die meisten, wenn nicht sogar alle Institutionen und Unternehmen in [ROOT.GetNameDef] einheimischen Kongolesen den Aufstieg über bestimmte Posten hinaus, und sie haben keinen Zugang zu höherer Bildung."
COG_belgian_congo_colonial_dynamic_modifier:	"Die Modellkolonie"
COG_belgian_congo_colonial_dynamic_modifier_desc:	"[ROOT.GetNameDefCap] ist die Musterkolonie ihres Oberherrn und erhält daher entsprechende Investitionen, da ihr Oberherr auch von ihrer Weiterentwicklung profitiert.\n§RThis spirit will be removed if Congo is no longer a subject of Belgium§!"
warning_this_idea_can_be_removed_tt:	"§ADieser Geist wird verschwinden, wenn [COG.GetNameDef] keine Kolonie mehr ist§!"
