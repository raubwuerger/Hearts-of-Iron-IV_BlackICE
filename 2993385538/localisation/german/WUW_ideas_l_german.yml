GER_blitzkrieg_modifier:	"Blitzkrieg"
GER_blitzkrieg_modifier_desc:	"Der Fokus von [GER.GetNameDefCap] auf schnelle und entschlossene Taktiken, um seine Feinde durch schnelle und überraschende Angriffe zu überwältigen, wird die moderne Kriegsführung neu definieren. Die Panzer zerschlagen jeden Widerstand, um einen schnellen Sieg zu erringen. Der Begriff 'Blitzkrieg' ist zwar eine grobe Vereinfachung, die von den Zeitungen popularisiert wurde, aber er beschreibt die Geschwindigkeit der [GER.GetAdjective] Truppen recht gut. "
