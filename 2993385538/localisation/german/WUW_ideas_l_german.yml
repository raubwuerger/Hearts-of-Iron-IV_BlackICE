GER_economy_of_conquest_modifier:	"Wirtschaft der Eroberung"
GER_economy_of_conquest_modifier_desc:	"Trotz der ungerechten Bestimmungen des Versailler Vertrags erheben wir uns mit unerschütterlicher Entschlossenheit aus der Asche. Durch unermüdliche Wiederaufrüstung haben wir uns verpflichtet, eine konkurrenzlose Rüstungsindustrie aufzubauen, um unseren Aufstieg zum Ruhm voranzutreiben. Dies wird unsere Wirtschaft belasten, doch mit dem Sieg kommt die Gelegenheit, die Beute der Eroberung einzustreichen und den Reichtum anderer Nationen zur Stärkung unserer Streitkräfte zu nutzen. Wehe den Besiegten!"
GER_aufrusting_modifier:	"Aufrüstung"
GER_recovering_economy_modifier:	"Wirtschaftlicher Aufschwung"
GER_wirtschaftswunder_modifier_desc:	"Es ist uns gelungen, eine Wirtschaft in Trümmern in eine der weltweit führenden Industriemächte zu verwandeln. Dieser bemerkenswerte Aufschwung kann nur als Wirtschaftswunder bezeichnet werden."
GER_wunderwaffen_modifier:	"Wunderwaffen"
GER_wehrwirtschaft_modifier:	"Wehrwirtschaft"
GER_wehrwirtschaft_modifier_desc:	"Wir dürfen nicht zulassen, dass ausländische Mächte unseren Wohlstand oder unsere Zukunft diktieren. Die Erreichung der Autarkie wird die wirtschaftliche Unabhängigkeit von [ROOT.GetNameDef] sichern, die Abhängigkeit von ausländischen Ressourcen verringern und die Selbstversorgung unseres Volkes gewährleisten."
GER_army_modifier_desc:	"[GER.GetNameDefCap] blickt auf eine lange und stolze Militärgeschichte mit einer Tradition innovativen Denkens zurück. Der Generalstab ist seit der demütigenden Niederlage im Großen Krieg bestrebt, unsere Streitkräfte noch weiter zu verbessern. Mit diesem Fachwissen ausgestattet ist unsere Armee bereit, gegen jeden Feind zuzuschlagen, der unser stolzes Volk unterwerfen will."
GER_army_communist_modifier:	"Volksarmee"
GER_army_communist_modifier_desc:	"Die Volksarmee steht als Schutzschild des Sozialismus bereit, die proletarische Revolution zu verteidigen und zu verbreiten. Das innovative Denken des Volksgeneralstabs stellt sicher, dass keine imperialistische Aggression den revolutionären Geist des deutschen Volkes brechen kann. "
GER_navy_fascist_modifier:	"Kriegsmarine"
GER_navy_fascist_modifier_desc:	"Durch Modernisierung und kühne Strategie trotzen wir den Ozeanen und flößen unseren Feinden Furcht ein. Unsere mächtigen Schlachtschiffe werden über den Wellen herrschen und unsere U-Boote unter ihnen."
GER_navy_democratic_modifier:	"Deutsche Marine"
GER_navy_democratic_modifier_desc:	"Die Deutsche Marine trotzt den Meeren, um unsere maritimen Interessen zu schützen, und sorgt dafür, dass unser Einfluss den gesamten Globus erreicht."
GER_navy_imperial_modifier:	"Kaiserliche Marine"
GER_navy_imperial_modifier_desc:	"Unsere mächtige Kaiserliche Marine wird die Meereswellen durchschneiden, um unsere globalen Ambitionen voranzutreiben und unsere Vorherrschaft auf hoher See zu behaupten. "
GER_navy_communist_modifier:	"Volksmarine"
GER_navy_communist_modifier_desc:	"Die Volksmarine steht stets wachsam gegen imperialistische Aggressionen. Sie wird die proletarische Revolution über die Meere verbreiten und eine neue Weltordnung einläuten."
GER_airforce_modifier:	"Luftwaffe"
GER_airforce_modifier_desc:	"Mit unübertroffener Geschicklichkeit und technischer Überlegenheit ist die Luftwaffe bereit, den Himmel zu beherrschen und unsere Macht jedem Feind zu demonstrieren, der töricht genug ist, uns herauszufordern. Mit modernsten Flugzeugen und fachkundig ausgebildeten Piloten steht unsere Luftwaffe bereit, den Himmel in Flammen zu setzen, jede Armee zu vernichten und jede Marine zu versenken, die sich uns entgegenstellt."
GER_airforce_communist_modifier:	" Luftstreitkräfte"
GER_airforce_communist_modifier_desc:	" Unsere Luftwaffe schwebt durch die Lüfte, um den proletarischen Staat und die Zukunft des Sozialismus zu schützen. Jedes Flugzeug fliegt als Zeugnis für den Einfallsreichtum und den unerbittlichen Geist unseres Volkes und ist bereit, es mit jedem Feind aufzunehmen, dem es gegenübersteht."
GER_military_modifier_tt:	"[GetSubmarineMaxSpeed]"
GER_military_modifier_submarine_speed_big:	" $GER_military_modifier$"
GER_military_modifier_submarine_speed_big_desc:	"$GER_military_modifier_desc$"
GER_submarine_max_speed_small_tt:	"$ship_hull_submarine$ $STAT_NAVY_MAXIMUM_SPEED$: §G+5 %§!"
GER_submarine_max_speed_big_tt:	"$ship_hull_submarine$ $STAT_NAVY_MAXIMUM_SPEED$: §G+10 %§!"
GER_military_modifier_fascist_desc:	"[GER.GetNameDefCap] blickt auf eine lange und stolze Militärgeschichte mit einer Tradition innovativen Denkens zurück, und unser Generalstab ist seit der demütigenden Niederlage im Großen Krieg bestrebt, unsere Streitkräfte noch weiter zu verbessern. Mit diesem Fachwissen sind wir bereit, gegen jeden Feind zuzuschlagen, der unser stolzes Volk unterwerfen will."
GER_nachtjagdgeschwader_desc:	"Unsere Nachtjagdgeschwader werden jedes feindliche Flugzeug aufspüren und vernichten, das töricht genug ist, unsere Grenzen zu überschreiten. Diese Geschwader beherrschen den Nachthimmel und schützen unser Heimatland vor feindlichen Bombern, die sich hinter der Dunkelheit verstecken."
GER_cruiser_warfare_ns_desc:	"Unsere Kreuzer richten auf offener See verheerenden Schaden an den Handelsflotten unserer Feinde an. Dies wird ihre Industrien mit Sicherheit in die Knie zwingen."
GER_panzerschiff_raiders_ns_desc:	"Unsere schweren Kreuzer stellen eine ernsthafte Bedrohung für die Marinen unserer Feinde dar. Ihre Geschütze verfügen über eine beachtliche Durchschlagskraft, während ihre Geschwindigkeit es ihnen ermöglicht, sich zu entziehen, bevor sie ernsthaft angegriffen werden. "
GER_gestapo_ns:	"Gestapo"
