GER_all_for_the_front_idea:	"Alle für die Front!"
GER_fan_prussian_militarism_idea:	"Fan des preußischen Militarismus"
GER_safeguard_finland_idea:	"Schutz gegen den Bolschewismus"
GER_safeguard_finland_idea_desc:	"Finnland war bis vor einigen Jahrzehnten Teil des Russischen Reiches, und es liegt nahe, dass die [GER.GetRussiansDemonym] erneut versuchen könnten, es zu annektieren. Deshalb hat Deutschland seine volle Unterstützung gegen die östliche Bedrohung angeboten."
