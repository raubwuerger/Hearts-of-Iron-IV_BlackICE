AUS_austrofascism:	"Austrofaschismus"
AUS_austrofascism_desc:	"Die Vaterländische Front lehnt den westlich-demokratischen Parlamentarismus ab und agiert als Konzernstaat. Sie ist die einzige Regierungspartei. Die Verfassung wurde neu gefasst, um Österreich in Richtung Korporatismus, Autoritarismus und Nationalismus zu lenken."
AUS_habsburg_monarchy_restored:	"Die Habsburger Monarchie wiederhergestellt"
AUS_austrian_monarchy_restored:	"Die österreichische Monarchie wird wiederhergestellt"
AUS_habsburg_monarchy_restored_desc:	"Als Monarchie war [AUS.GetNameDef] eine Großmacht auf dem europäischen Kontinent. Mit der Wiedereinführung der Monarchie werden wir das wieder sein!"
AUS_farr:	"Erste österreichische Republik wiederbelebt"
AUS_farr_desc:	"Durch die Abschaffung der Maiverfassung, die Wiederzulassung politischer Parteien und die Abhaltung von Wahlen hat [AUS.GetNameDef] das wiederbelebt, was man für eine längst verlorene Republik hielt."
AUS_doth:	"Verteidigung des Vaterlandes"
AUS_doth_desc:	"Es ist die Pflicht eines jeden [AUS.GetAdjective], seinen Teil zur Verteidigung des Vaterlandes beizutragen, in der Armee, in den Fabriken oder auf den Baustellen. Mit der gemeinsamen Anstrengung der Nation wird das Vaterland geschützt werden!"
AUS_aggression:	"Österreichische Aggression"
AUS_aggression_desc:	"Auf der Lauer zu liegen und zu hoffen, nicht angegriffen zu werden, ist in Zeiten wie diesen ein unsicherer Ansatz. Um sicherzustellen, dass wir nicht auf der Hut sind, müssen wir darauf vorbereitet sein, zuerst zuzuschlagen."
AUS_austromarxism:	"Austromarxismus"
AUS_austrostalinism:	"Austrostalinismus"
AUS_austrotrotskyism:	"Austrotrotzkismus"
AUS_austromarxism_desc:	"Die austromarxistische Agenda, die auf den Schriften von Otto Bauer basiert und für einen Mittelweg zwischen Sozialdemokratie und Sowjetkommunismus eintritt. Das Land hat sich vom früheren Austrofaschismus deutlich abgewendet und bewegt sich nun auf der Grenze zwischen Kommunismus und Demokratie."
AUS_austrostalinism_desc:	"Vom austromarxistischen Mittelweg abgekommen und den Austrofaschismus längst abgeschafft, folgt [AUS.GetNameDef] nun einem strengen stalinistischen Gedankengut."
AUS_austrotrotskyism_desc:	"Vom austromarxistischen Mittelweg abgekommen und seit der Abschaffung des Austrofaschismus [AUS.GetNameDef] folgen sie nun strikt trotzkistischen Ideen."
AUS_peoples_army:	"Die Volksarmee"
AUS_peoples_army_desc:	"Die Mobilisierung der Massen hat zu einer starken Präsenz der Milizen im Lande geführt. Die Milizen sind ungewöhnlich gut ausgebildet und gut ausgerüstet, um so schnell mobilisiert werden zu können. Infolgedessen hat auch die Rekrutierung in die reguläre Armee einen Aufschwung erfahren."
AUS_empire_restored:	"Österreichisches Kaiserreich wiederhergestellt"
AUS_empire_restored_desc:	"Ein Kaiserreich war es, ein Kaiserreich wird es sein! Nachdem ein Großteil des alten [AUS.GetAdjective] zurückerobert wurde, hat sich das Kaiserreich neu formiert."
AUS_airforce:	"Österreichische Luftstreitkräfte"
AUS_army:	"Österreichisches Bundesheer"
AUS_army_monarchy:	"Österreichische Landwehr"
AUS_navy:	"Österreichische Kriegsmarine"
AUS_compensation_for_guarantee:	"Kompensation für ausländische Unterstützung"
AUS_compensation_for_guarantee_desc:	"Die Unterstützung durch andere Länder war nicht billig. Indem wir ihnen angeboten haben, einen Teil ihrer Konsumgüterproduktion zu übernehmen, haben wir es geschafft, uns ihre Unterstützung zu erkaufen, falls das Schlimmste eintreten sollte."
