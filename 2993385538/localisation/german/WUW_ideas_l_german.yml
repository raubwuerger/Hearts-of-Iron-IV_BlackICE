COG_vast_decentralized_state_idea:	"Eine unkontrollierbar riesige Nation"
COG_vast_decentralized_state_idea_desc:	"Unser Staat ist größer als die meisten anderen, trotz unserer mangelnden Wirtschaft und administrativen Schwierigkeiten. Die Ecken des Staates sind für unsere Zentralregierung schwer zu erreichen und zu kontrollieren, und die Kommunikation und Logistik zwischen den Städten kann Wochen, wenn nicht Monate dauern."
