AUS_austrofascism:	"Austrofaschismus"
AUS_austrofascism_desc:	"Die Vaterländische Front lehnt den westlich-demokratischen Parlamentarismus ab und agiert als Konzernstaat. Sie ist die einzige Regierungspartei. Die Verfassung wurde neu gefasst, um Österreich in Richtung Korporatismus, Autoritarismus und Nationalismus zu lenken."
AUS_habsburg_monarchy_restored:	"Die Habsburger Monarchie wiederhergestellt"
AUS_austrian_monarchy_restored:	"Die österreichische Monarchie wird wiederhergestellt"
AUS_habsburg_monarchy_restored_desc:	"Als Monarchie war [AUS.GetNameDef] eine Großmacht auf dem europäischen Kontinent. Mit der Wiedereinführung der Monarchie werden wir das wieder sein!"
AUS_farr:	"Erste österreichische Republik wiederbelebt"
AUS_farr_desc:	"Durch die Abschaffung der Maiverfassung, die Wiederzulassung politischer Parteien und die Abhaltung von Wahlen hat [AUS.GetNameDef] das wiederbelebt, was man für eine längst verlorene Republik hielt."
