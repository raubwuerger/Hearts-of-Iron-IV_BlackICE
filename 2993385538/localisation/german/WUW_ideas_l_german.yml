COG_burundian_separatism_modifier:	"Burundischer Separatismus"
COG_burundian_separatism_modifier_desc:	"In dieser Region herrscht eine ausgeprägte separatistische Stimmung, und es ist wahrscheinlich, dass sie versuchen wird, einen eigenen Staat zu gründen, sollte der Kongo unabhängig werden."
COG_kasai_separatism_modifier:	"Separatismus in Kasai"
COG_katanga_separatism_modifier:	"Separatismus in Katanga"
COG_katanga_separatism_modifier_desc:	"Diese Region wird sich im Falle eines kongolesischen Unabhängigkeitskrieges wahrscheinlich als eigenständiger Staat auf die Seite der Belgier stellen."
COG_state_loyal_to_belgium_modifier:	"Belgien-treuer Staat"
COG_state_loyal_to_free_congo_modifier_desc:	"Dieser Staat wird sich im Falle eines versuchten Unabhängigkeitskrieges der Seite der Freien Kongolesen anschließen."
COG_long_term_debt_payment:	"Langfristige Unabhängigkeitsschulden"
COG_long_term_debt_recieved:	"Zahlungen für langfristige Unabhängigkeitsschulden"
COG_short_term_massive_debt_recieved:	"Zahlungen für kurzfristige Unabhängigkeitsschulden"
COG_armee_nationale_congolaise_modifier:	"Armée Nationale Congolaise"
COG_armee_nationale_congolaise_modifier_desc:	"Die Streitkräfte des Kongo wurden aus der als Force Publique bekannten Kolonialgarnison reformiert und werden derzeit zu einer für den kongolesischen Staat nützlicheren Einheit umgestaltet."
idea_COG_river_navy_desc:	"Wir verfügen über die größte Flussmarine aller Länder in der Region, wodurch feindliche Einfälle in unser Land verzögert oder sogar verhindert werden. Auch wenn sie mit Hochseemarinen nicht mithalten kann, ist sie doch ein Schlüssel zur Sicherheit unseres Landes. "
