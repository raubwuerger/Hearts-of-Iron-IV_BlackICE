GER_war_preparations_tt:	"Das nächste Mal ist §Y[ROOT.GetNameDef]§! bei §YWar§!:"
GER_strengthened_supply_lines_ns:	"Gestärkte Nachschublinien"
GER_nordische_legion_ns:	"Nordische Legion"
GER_nordische_legion_ns_desc:	"Viele [ROOT.GetAdjective] sehnen sich nach Abenteuern und wollen für eine gute Sache kämpfen. Zu diesem Zweck haben wir eine Legion von Freiwilligen aufgestellt, die unseren nordischen Brüdern in ihren Kriegen beistehen werden."
GER_fernostliche_legion_ns:	"Fernöstliche Legion"
GER_fernostliche_legion_ns_desc:	"Viele [ROOT.GetAdjective]s sehnen sich nach Abenteuern und möchten für eine gute Sache kämpfen. Zu diesem Zweck haben wir eine Legion von Freiwilligen aufgestellt, die unseren [CHI.GetAdjective] Freunden in ihren Kriegen beistehen werden."
GER_expatriated_communists_return_home_ns:	"Ausgebürgerte Kommunisten kehren heim"
GER_expatriated_communists_return_home_ns_desc:	"Viele deutsche Kommunisten, die während der Naziherrschaft aus dem Land vertrieben wurden, kehren nun massenhaft zurück, um gegen ihre ehemaligen Unterdrücker zu kämpfen."
GER_expatriated_communists_return_home_supressed_ns:	"Ausgebürgerte Kommunisten kehren zurück"
GER_expatriated_communists_return_home_supressed_ns_desc:	"Viele deutsche Kommunisten, die während der Naziherrschaft aus dem Land vertrieben wurden, kehren nun massenhaft nach Deutschland zurück, obwohl die Militärregierung offen antikommunistisch eingestellt ist."
GER_bismarckjugend_idea:	"Bismarckjugend"
GER_bismarckjugend_idea_desc:	"Die Deutschnationale Volkspartei hat die Bismarckjugend reformiert, um mehr Menschen als Teil eines paramilitärischen Flügels in die Armee zu bringen."
GER_eiserne_front_idea:	"Eiserne Front"
GER_eiserne_front_idea_desc:	"In dem Bemühen, den Feind zu besiegen, hat der deutsche Staat beschlossen, die Eiserne Front, eine sozialdemokratische paramilitärische Organisation, offiziell einzustellen und zu fördern."
GER_pacific_blitzkrieg:	"Pazifischer Blitzkrieg"
GER_proud_eagle_that_ate_the_sun:	"Der stolze Adler, der die Sonne fraß"
GER_chi_ger_trade:	"[CHI.GetAdjective]-[GER.GetAdjective] Handelsabkommen"
GER_shatter_USA_hegemony:	"Zerschlage die [USA.GetAdjective] Hegemonie"
GER_eben_emael_partial_success_ns:	"Teilweise erfolgreiches Kommandounternehmen auf Eben Emael"
GER_eben_emael_partial_success_ns_desc:	"$GER_eben_emael_success_ns_desc$"
GER_eben_emael_success_ns:	"Erfolgreiches Kommandounternehmen auf Eben Emael"
GER_eben_emael_success_ns_desc:	"Ein sorgfältig geplanter Angriff auf die Festung in Eben Emael hat die [BEL.GetAdjective]s für unsere Angriffe verwundbar gemacht. Jetzt ist ein guter Zeitpunkt für eine groß angelegte Offensive."
GER_battle_for_air_superiority:	"Kampf um die Luftherrschaft"
GER_the_shield_of_democracy_idea:	"Der Schild der Demokratie"
GER_the_shield_of_democracy_idea_desc:	"Unsere Nation steht als stolzer Schild der westlichen demokratischen Werte und ist bereit, ihr Volk und ihre Verbündeten gegen jede autoritäre Tyrannei zu schützen."
reaffirmed_the_locarno_treaty:	"Den Vertrag von Locarno bekräftigt"
