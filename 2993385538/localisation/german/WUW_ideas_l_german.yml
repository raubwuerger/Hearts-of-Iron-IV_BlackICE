HUN_gombos_trade_treaty:	"Gömbös Handelsvertrag"
HUN_gombos_trade_treaty_desc:	"Der Handelsvertrag, den Gyula Gömbös 1934 mit Deutschland unterzeichnete, ist wichtig für die Ankurbelung unserer Wirtschaft und die Erholung von der großen Depression, aber er hat auch große Nachteile. Obwohl das Abkommen uns einen günstigen Preis für den Verkauf von Weizen einräumt, muss das verdiente Geld auf einem Konto in Deutschland verbleiben und darf nur für den Kauf deutscher Industriegüter verwendet werden. Wenn das so weitergeht, wird Deutschland in der Lage sein, die wirtschaftliche Vorherrschaft über unser Land zu erlangen."
HUN_hungarian_national_defense_association:	"Ungarische Nationale Verteidigungsvereinigung"
HUN_hungarian_national_defense_association_desc:	"Die rechtsextreme, weitgehend paramilitärische Organisation M.O.V.E., die 1919 gegründet wurde, ist ihrem Anführer und Gründer Gyula Gömbös weitgehend treu. Trotzdem haben sie auch großen Respekt vor Miklós Horthy, aufgrund seiner starken antikommunistischen Haltung."
HUN_levente_associations:	"Levente Vereinigungen"
HUN_levente_associations_desc:	"Unser Volk hat paramilitärische Jugendorganisationen gegründet, die als Levente bekannt sind. Unter dem Deckmantel der körperlichen und gesundheitlichen Ertüchtigung bereiten sie die ungarische Jugend innerhalb und außerhalb unserer Grenzen auf den Kampf und die Rückeroberung unseres rechtmäßigen Landes vor."
HUN_forceful_industrial_revitalization:	"Zwangsweise industrielle Wiederbelebung"
HUN_forceful_industrial_revitalization_desc:	"Die Regierung hat drastische Maßnahmen ergriffen, um sicherzustellen, dass die nationalen Industrien wieder auf die Beine kommen können. Ob sich diese Maßnahmen als erfolgreich erweisen, wird sich erst mit der Zeit zeigen."
HUN_revaluing_the_pengo:	"Aufwertung des Pengő"
HUN_revaluing_the_pengo_desc:	"Die Währung [HUN.GetAdjective], der Pengő, wird derzeit in einem verzweifelten Versuch, die Wirtschaft zu stärken und die Inflationskrise zu lösen, aufgewertet, obwohl dies eine unpopuläre Maßnahme ist."
HUN_hungarian_autarky_idea:	"Ungarische Autarkie"
HUN_hungarian_autarky_idea_desc:	"Wenn eine Nation auf sich allein gestellt und von Feinden umgeben überleben will, muss sie lernen, alles, was sie braucht, selbst zu produzieren, trotz der hohen Kosten, die mit dieser Produktion verbunden sind."
HUN_agrarian_tradition:	"Ungarische landwirtschaftliche Tradition"
HUN_agrarian_tradition_desc:	"Unsere stolzen landwirtschaftlichen Traditionen reichen weit zurück, noch bevor wir an diesem Ort, den wir heute unser Zuhause nennen, angekommen sind. Wir sollten diese Traditionen schätzen und sie so weit wie möglich fördern."
wuw_HUN_not_has_trianon_for_laws_tt:	"Hat nicht den nationalen Geist §YVertrag von Trianon§!"
HUN_rapid_army_expansion:	"Rasche Expansion der Armee"
HUN_rapid_army_expansion_desc:	"Angesichts des herannahenden Krieges in Europa muss jeder Mann bereit sein, sein Heimatland zu verteidigen, wenn es darauf ankommt. Es ist an der Zeit, dass der [HUN.GetAdjective] Mann dieses Gefühl versteht und bereit ist, uns in Zeiten der Not zu helfen."
HUN_modify_academy_of_sciences_ns_intro:	"Ändern Sie §Y$HUN_academy_of_sciences$§! von"
HUN_academy_of_sciences:	"Die Ungarische Akademie der Wissenschaften"
HUN_academy_of_sciences_desc:	"Mit Investitionen in den Ausbau der [ROOT.GetAdjective] Akademie der Wissenschaften wird unsere Nation in der Lage sein, sich technologisch schneller als unsere Konkurrenten zu entwickeln."
HUN_gombos_trade_treaty_tt:	"Der Gömbös-Handelsvertrag ermöglicht uns den Handel mit Deutschland"
HUN_hungarian_gendarmerie:	"Magyar Királyi Csendőrség"
HUN_hungarian_gendarmerie_desc:	"Um unsere Grenzen sowie unsere Führer vor Gefahren zu schützen, muss unsere paramilitärische Gendarmerie ausgebaut und mit mehr Befugnissen ausgestattet werden, um eigenständig handeln zu können."
HUN_hungarian_gendarmerie_hussars:	"Gendarmerie der Schwarzen Legion"
HUN_hungarian_gendarmerie_hussars_desc:	"Um unsere Grenzen und unsere Führer vor Gefahren zu schützen, muss unsere paramilitärische Gendarmerie ausgebaut werden und mehr Befugnisse erhalten, um eigenständig zu handeln."
cat_air_bombs:	"Fliegerbomben"
cat_air_engine:	"Flugzeugtriebwerke"
mio_cat_artillery:	"Artillerie"
HUN_recon_airplane_focus:	"Aufklärungsflugzeuge Fokus"
HUN_recon_airplane_focus_desc:	"[ROOT.GetNameDefCap] investiert derzeit stark in die Entwicklung und den Einsatz von Aufklärungsflugzeugen, um seine Feinde richtig im Auge behalten zu können."
HUN_rapid_army_groups_idea:	"Schnelle Armeegruppen"
HUN_rapid_army_groups_idea_desc:	"Unsere Armee wurde so umorganisiert, dass sie jederzeit so schnell wie möglich an den Ort gelangen kann, an dem sie gebraucht wird."
HUN_pan_ugric_volunteer_force:	"[ROOT.GetAdjective] Freiwillige Streitkräfte"
HUN_pan_ugric_volunteer_force_desc:	"Unser jüngster Eifer, unseren finnisch-ugrischen Brüdern zu helfen, hat die Rekrutierung von [ROOT.GetAdjective] Freiwilligen, die sich dem Kampf im Ausland anschließen wollen, vorangetrieben."
HUN_GER_trade_modifier:	"Ungarisch-Deutsche Handelsvereinbarungen"
HUN_POL_friendship_modifier:	"Pole und Ungar - zwei gute Freunde, die sich streiten und am Ende trinken"
HUN_restricted_voting_rights:	"Eingeschränktes Wahlrecht"
HUN_restricted_voting_rights_desc:	"Die Einschränkung des Wahlrechts mag nicht populär sein, aber sie war notwendig, um den Aufstieg kommunistischer und liberaler Ideologien im Land einzudämmen."
HUN_crackdown_on_extremism:	"Hartes Durchgreifen gegen Extremismus"
HUN_crackdown_on_extremism_desc:	"Im Rahmen der neuen Anti-Extremismus-Reformen des neuen Premierministers Kálmán Darányi wurde Ferenc Szálasi verhaftet und die Partei des Nationalen Willens, seine nationalsozialistische politische Partei, wurde verboten."
HUN_power_to_the_regent_idea:	"Macht für den Regenten"
HUN_power_to_the_regent_idea_desc:	"Mit der Verabschiedung des Statuts XIX hat der Regent von [ROOT.GetNameDef] mehr Macht erhalten und die Loyalität des Volkes liegt bei seinem großen Führer Miklós Horthy."
HUN_turul_association_idea:	"Die Turanische Vereinigung"
turanist_connections_op_modifier:	"Turanistische Verbindungen"
HUN_old_hungary_reclaimed:	"Großungarn wiederhergestellt"
HUN_old_hungary_reclaimed_desc:	"Endlich haben wir die Demütigung, die uns durch den Vertrag von Trianon auferlegt wurde, rückgängig gemacht, denn es ist uns gelungen, das zurückzufordern, was uns gehört!"
HUN_promoted_hungarianism:	"Förderung des Ungarentums"
HUN_promoted_hungarianism_desc:	"Um unseren nationalen Interessen am besten zu dienen, sollten wir die ungarische Bewegung stärken und dafür sorgen, dass unser Volk weiß, wo unsere Zukunft liegt."
HUN_promises_of_peace:	"Versprechen des Friedens"
HUN_promises_of_peace_desc:	"Um die Mächte der Kleinen Entente zu besänftigen, mussten wir versprechen, nicht zu militarisieren oder aggressiv zu expandieren, was zu einer vorübergehend verkümmerten Armee führte."
HUN_supporting_carlists:	"Unterstützung für die karlistische Sache"
HUN_following_entente_stipulations:	"In Übereinstimmung mit den Bestimmungen der Kleinen Entente"
HUN_bastion_of_catholicism:	"Bastion des Katholizismus"
HUN_bastion_of_catholicism_desc:	"Unsere Nation ist zutiefst katholisch, und unsere Soldaten dienen als Hüter des großen Glaubens, als Diener seiner heiligen Hoheit selbst."
HUN_a_multi_ethnic_empire:	"Ein multiethnisches Reich"
HUN_a_multi_ethnic_empire_desc:	"Unser Reich umfasst viele verschiedene Völker und Kulturen, und wir haben dies voll und ganz angenommen, indem wir den verschiedenen Orten unseres Reiches weitgehende Autonomie zugestanden haben, so dass unser Volk gerne ein Teil von uns bleiben möchte."
HUN_revenge_for_brusilov_idea:	"Rache für die Brusilov-Offensive"
HUN_payments_from_hungary_idea:	"Zahlungen von [HUN.GetNameDef]"
HUN_apostolic_kingdom_idea:	"Das Apostolische Königreich"
HUN_apostolic_kingdom_idea_desc:	"Wie seit dem heiligen Stephanus durch die Jahrhunderte hindurch betitelt wurde, ist unsere Apostolische Majestät eindeutig ein Apostel des Christentums der Neuzeit, erhebt Anspruch auf alle christlichen Länder und hat das Recht, im Namen des Sohnes zu regieren. Wir müssen all das zurückfordern, was rechtmäßig unser ist!"
