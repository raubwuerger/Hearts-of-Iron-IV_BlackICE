BEL_burgundian_heritage_ns:	"Burgundisches Erbe"
BEL_burgundian_heritage_ns_desc:	"Unter Berufung auf den Wohlstand des goldenen burgundischen Zeitalters ist das militärische, politische und wirtschaftliche Potenzial der Nation wieder unübersehbar."
BEL_pax_belgica_ns:	"Pax Belgica"
BEL_pax_belgica_ns_desc:	"Unter der Schirmherrschaft einer imperialen Vergangenheit kann Belgica Völker und Territorien erobern, von denen man früher nur träumen konnte."
BEL_volunteer_effort1_ns:	"Ehrenamtliche Anstrengung"
BEL_volunteer_effort1_ns_desc:	"Wir müssen helfen, den Frieden in der Welt zu erhalten und dafür sorgen, dass faschistische Mächte nicht die Oberhand gewinnen. Es ist von größter Wichtigkeit, dass wir nicht in den Krieg ziehen, daher werden wir uns vorerst darauf beschränken, nur Freiwillige zu entsenden."
BEL_volunteer_effort2_ns_desc:	"Wir müssen helfen, den Frieden in der Welt zu erhalten und dafür sorgen, dass faschistische Mächte nicht die Oberhand gewinnen. Es ist von größter Wichtigkeit, dass wir nicht in den Krieg ziehen, daher werden wir uns vorerst darauf beschränken, nur Freiwillige zu entsenden."
