JAP_public_awareness_of_war_ns:	"Öffentliche Wahrnehmung des Krieges in China"
AUS_widespread_unemployment_desc:	"Nach dem Wirtschaftszusammenbruch hat Österreich mit Inflation und hoher Arbeitslosigkeit zu kämpfen. Die Unzufriedenheit mit der Politik ist groß. "
AUS_employment_efforts_desc:	"Es wurden beträchtliche Investitionen getätigt, um die aktuelle Beschäftigungskrise in Österreich zu beenden. Da Auszubildende in den Fabriken mittlerweile ein alltäglicher Anblick sind, scheinen sowohl die Bevölkerung als auch die Industrie zufrieden zu sein."
AUS_phonix_insurance:	"Phönix-Versicherung"
AUS_phonix_insurance_desc:	"Das Versicherungsprogramm von Phönix hat es unseren Soldaten ermöglicht, eine Lebensversicherung abzuschließen, die sie absichert, sollte das Schlimmste eintreten. Das Wissen, dass für ihre Familien gesorgt ist, hat die Zahl der Menschen, die bereit sind, in die Armee einzutreten, deutlich erhöht. "
AUS_covering_the_phonix_insurances:	"Überbrückung für die Phönix-Versicherung"
AUS_covering_the_phonix_insurances_desc:	"Die Bevölkerung darüber zu informieren, dass ihre geliebte Phönix-Versicherung nicht mehr existiert, hätte drastische Folgen für unsere Fähigkeit gehabt, eine Armee aufrechtzuerhalten und zu verbessern. Der Staat wird die Versicherung übernehmen, bis die Phönix-Versicherung wieder auf eigenen Beinen steht."
AUS_treaty_of_saint_germain_en_laye:	"Vertrag von Saint-Germain-en-Laye"
AUS_recovering_from_the_depression:	"Erholung von der Wirtschaftskrise"
AUS_recurrent_economic_depression:	"Die Wirtschaftskrise kehrt zurück"
AUS_recurrent_economic_depression_desc:	"Das Muster, dass kurzfristige Maßnahmen zwar Wirkung zeigen, die Wirtschaftskrise jedoch umso schlimmer zurückkehrt, sobald diese nachlassen, scheint Österreich wie ein Fluch zu verfolgen. Erneut steigen die Inflationsraten in die Höhe und die Wirtschaft liegt in Trümmern."
AUS_economic_boom:	"Wirtschaftsboom"
AUS_economic_boom_desc:	"Durch harte Arbeit und große Anstrengungen hat Österreich eine wirtschaftliche Katastrophe in eine schnell wachsende Wirtschaft verwandelt."
AUS_women_in_academia:	"Frauen in der Wissenschaft"
AUS_militia_support:	"Unterstützung der Miliz"
AUS_militia_is_undecided:	"Miliz"
AUS_emergency_measures_desc:	"Um in einer Welt, die immer aggressiver wird, eine Chance zu haben [AUS.GetNameDef] muss rasch eine respektable industrielle Kapazität aufgebaut werden, um den Bedarf des Landes zu decken."
AUS_host_of_communist_dissidents:	"Aufnahme kommunistischer Dissidenten"
AUS_host_of_communist_dissidents_desc:	"Durch die Einladung gleichgesinnter Menschen aus aller Welt [AUS.GetNameDef] entwickelt sich das Land zu einem Zentrum für kommunistische Exilanten."
AUS_devalued_the_schilling:	"Abwertung des Schillings"
AUS_devalued_the_schilling_desc:	"Um die Inflation einzudämmen, wurde die Währung abgewertet. Kurzfristig sind die Auswirkungen nicht gerade vorteilhaft, doch langfristig dürfte sich dies als Verbesserung für die Nation erweisen."
