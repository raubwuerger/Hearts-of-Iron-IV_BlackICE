BEL_construction_investments:	"Bauinvestitionen"
BEL_industrial_investments:	"Industrielle Investitionen"
BEL_burgundian_heritage_ns:	"Burgundisches Erbe"
BEL_burgundian_heritage_ns_desc:	"Unter Berufung auf den Wohlstand des goldenen burgundischen Zeitalters ist das militärische, politische und wirtschaftliche Potenzial der Nation wieder unübersehbar."
BEL_pax_belgica_ns:	"Pax Belgica"
BEL_pax_belgica_ns_desc:	"Unter der Schirmherrschaft einer imperialen Vergangenheit kann Belgica Völker und Territorien erobern, von denen man früher nur träumen konnte."
BEL_volunteer_effort1_ns:	"Ehrenamtliche Anstrengung"
BEL_volunteer_effort1_ns_desc:	"Wir müssen helfen, den Frieden in der Welt zu erhalten und dafür sorgen, dass faschistische Mächte nicht die Oberhand gewinnen. Es ist von größter Wichtigkeit, dass wir nicht in den Krieg ziehen, daher werden wir uns vorerst darauf beschränken, nur Freiwillige zu entsenden."
BEL_volunteer_effort2_ns:	"Friedenserhaltende Missionen"
BEL_volunteer_effort2_ns_desc:	"Wir müssen helfen, den Frieden in der Welt zu erhalten und dafür sorgen, dass faschistische Mächte nicht die Oberhand gewinnen. Es ist von größter Wichtigkeit, dass wir nicht in den Krieg ziehen, daher werden wir uns vorerst darauf beschränken, nur Freiwillige zu entsenden."
BEL_communism_in_congo:	"Belgische Investitionen in die Rechte von Arbeitnehmern"
BEL_belgian_immigration_ns:	"[BEL.GetAdjective] Einwanderung"
BEL_interpreters_ns:	"Belgische Dolmetscher"
BEL_powerful_unions_ns:	"Starke Gewerkschaften"
BEL_empowered_miner_unions_ns:	"Gestärkte Gewerkschaften der Minenarbeiter"
BEL_empowered_construction_unions_ns:	"Gestärkte Bauarbeitergewerkschaften"
BEL_empowered_factory_workers_unions_ns:	"Gestärkte Fabrikarbeitergewerkschaften"
BEL_emergency_measures:	"Notfallmaßnahmen"
BEL_corvette_fleet_ns:	"Korvettenflotte"
COG_colonial_maritime_company:	"Compagnie Belge Maritime du Congo"
BEL_colonial_maritime_company:	"Compagnie Belge Maritime du Congo"
COG_rawji_group:	"Rawji-Gruppe"
COG_ccci:	"Compagnie du Congo pour le Commerce et l'Industrie"
COG_forminiere:	"Société Internationale Forestière et Minière du Congo"
COG_transports_et_ports:	"Société Commerciale des Transports et des Ports"
COG_force_publique:	"Öffentliche Gewalt (Force Publique)"
COG_force_publique_desc:	"Die Force Publique ist die Gendarmerie und Militärtruppe des Kongo, die 1877 unter dem Kongo-Freistaat gegründet wurde. Ihre Offiziere sind ausschließlich Europäer, seien es Belgier oder Söldner, während die einfachen Soldaten größtenteils aus dem Kongo stammen. Die Truppe ist sehr effektiv, wenn es darauf ankommt, aber die Ungleichheit und das schlechte Management sorgen für große Unzufriedenheit."
COG_the_invisible_roof:	"Das unsichtbare Dach"
COG_the_invisible_roof_desc:	"Obwohl es keine Gesetze gibt, die dies offiziell regeln, verbieten die meisten, wenn nicht sogar alle Institutionen und Unternehmen in [ROOT.GetNameDef] einheimischen Kongolesen den Aufstieg über bestimmte Posten hinaus, und sie haben keinen Zugang zu höherer Bildung."
COG_belgian_congo_colonial_dynamic_modifier:	"Die Modellkolonie"
COG_belgian_congo_colonial_dynamic_modifier_desc:	"[ROOT.GetNameDefCap] ist die Musterkolonie ihres Oberherrn und erhält daher entsprechende Investitionen, da ihr Oberherr auch von ihrer Weiterentwicklung profitiert.\n§RThis spirit will be removed if Congo is no longer a subject of Belgium§!"
warning_this_idea_can_be_removed_tt:	"§ADieser Geist wird verschwinden, wenn [COG.GetNameDef] keine Kolonie mehr ist§!"
COG_forminiere_idea:	"Forminière Wirtschaftlicher Überschuss"
COG_copper_cartridges_idea:	"Kupfer-Patronen"
COG_copper_cartridges_small_idea:	"Kupfer-Patronen"
COG_heat_resistant_cobalt_idea:	"Hitzebeständiges Kobalt"
COG_heat_resistant_cobalt_small_idea:	"Hitzebeständiges Kobalt"
BEL_cog_gold_investment_into_infrastructure:	"Investitionen in die Infrastruktur mit [COG.GetAdjective] Gold"
BEL_cog_gold_investment_into_welfare:	"Investitionen in den Sozialbereich mit [COG.GetAdjective] Gold"
BEL_cog_diamond_investment_into_construction:	"Investitionen in den Bau mit [COG.GetAdjective] Diamanten"
COG_redirected_resources_to_food_production:	"Umgeleitete Ressourcen in die Nahrungsmittelproduktion"
COG_colonial_resource_aqciusition:	"Kolonialer Ressourcenerwerb"
COG_rwandan_separatism_modifier:	"Ruandischer Separatismus"
COG_rwandan_separatism_modifier_desc:	"In dieser Region gibt es viele separatistische Bestrebungen, und es ist wahrscheinlich, dass sie versuchen werden, einen eigenen Staat zu gründen, wenn der Kongo unabhängig werden sollte."
COG_burundian_separatism_modifier:	"Burundischer Separatismus"
COG_burundian_separatism_modifier_desc:	"In dieser Region gibt es viele separatistische Bestrebungen. Sollte der Kongo unabhängig werden, wird er wahrscheinlich versuchen, einen eigenen Staat zu gründen."
COG_kasai_separatism_modifier:	"Kasai-Separatismus"
COG_kasai_separatism_modifier_desc:	"In der Region Kasai gibt es viele separatistische Bestrebungen und die Bevölkerung wird sich im Falle eines kongolesischen Unabhängigkeitskrieges wahrscheinlich gegen ihre kolonialen Oberherren erheben und kämpfen."
COG_katanga_separatism_modifier:	"Katanga Separatismus"
COG_katanga_separatism_modifier_desc:	"Diese Region wird sich im Falle eines kongolesischen Unabhängigkeitskrieges wahrscheinlich als eigener Staat auf die Seite der Belgier stellen."
COG_state_loyal_to_belgium_modifier:	"Loyaler Staat gegenüber Belgien"
COG_state_loyal_to_belgium_modifier_desc:	"Dieser Staat wird sich im Falle eines kongolesischen Unabhängigkeitskrieges auf die Seite der Belgier stellen."
COG_state_loyal_to_free_congo_modifier:	"Loyaler Staat für den Freien Kongo"
COG_state_loyal_to_free_congo_modifier_desc:	"Dieser Staat wird sich im Falle eines versuchten Unabhängigkeitskrieges auf die Seite des Freien Kongo stellen."
COG_long_term_debt_payment:	"Langfristige Unabhängigkeit Verschuldung"
COG_long_term_debt_payment_desc:	"Um die Unabhängigkeit zu erlangen, musste der Kongo einen ziemlich grausamen Deal akzeptieren, dessen Auswirkungen er bis heute zu spüren bekommt."
