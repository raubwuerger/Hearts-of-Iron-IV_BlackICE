COG_kasai_separatism_modifier_desc:	"In der Region Kasai gibt es viele separatistische Bestrebungen und die Bevölkerung wird sich im Falle eines kongolesischen Unabhängigkeitskrieges wahrscheinlich gegen ihre kolonialen Oberherren erheben und kämpfen."
COG_state_loyal_to_belgium_modifier_desc:	"Dieser Staat wird sich im Falle eines kongolesischen Unabhängigkeitskrieges auf die Seite der Belgier stellen."
