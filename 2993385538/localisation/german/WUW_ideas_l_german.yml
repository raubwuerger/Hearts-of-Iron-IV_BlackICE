HUN_gombos_trade_treaty:	"Gömbös-Handelsvertrag"
HUN_gombos_trade_treaty_desc:	" Der Handelsvertrag, den Gyula Gömbös 1934 mit Deutschland unterzeichnete, ist wichtig für die Ankurbelung unserer Wirtschaft und die Bewältigung der Weltwirtschaftskrise, hat jedoch auch erhebliche Nachteile. Zwar gewährt uns das Abkommen einen günstigen Preis für den Verkauf von Weizen, doch muss das eingenommene Geld auf einem Konto in Deutschland verbleiben und darf ausschließlich für den Kauf deutscher Industriegüter verwendet werden. Wenn dies so weitergeht, wird Deutschland in der Lage sein, wirtschaftliche Vorherrschaft über unser Land zu erlangen."
HUN_hungarian_national_defense_association:	"Ungarischer Nationaler Verteidigungsverband"
HUN_hungarian_national_defense_association_desc:	"Die rechtsextreme, weitgehend paramilitärische Organisation M.O.V.E., die 1919 gegründet wurde, ist ihrem Anführer und Gründer Gyula Gömbös weitgehend treu ergeben. Dennoch hegen sie auch großen Respekt vor Miklós Horthy aufgrund seiner starken antikommunistischen Haltung."
HUN_levente_associations:	"Levente-Vereinigungen"
HUN_levente_associations_desc:	"Unser Volk hat paramilitärische Jugendorganisationen gegründet, die als Levente bekannt sind. Unter dem Deckmantel von Sport- und Gesundheitstraining bereiten sie ungarische Jugendliche sowohl innerhalb als auch außerhalb unserer Grenzen auf den Kampf und die letztendliche Rückeroberung unserer rechtmäßigen Gebiete vor."
HUN_forceful_industrial_revitalization_desc:	"Die Regierung hat drastische Maßnahmen ergriffen, um sicherzustellen, dass die nationale Industrie wieder auf die Beine kommt. Nur die Zeit wird jedoch zeigen, ob sich diese Maßnahmen als erfolgreich erweisen werden."
HUN_academy_of_sciences:	"Die Ungarische Akademie der Wissenschaften"
HUN_academy_of_sciences_desc:	"Durch Investitionen in den Ausbau der [ROOT.GetAdjective] Akademie der Wissenschaften wird unsere Nation in der Lage sein, technologisch schneller voranzukommen als unsere Konkurrenten."
HUN_gombos_trade_treaty_tt:	"Der Gömbös-Handelsvertrag ermöglicht uns den Handel mit Deutschland"
HUN_hungarian_gendarmerie:	"Magyar Királyi Csendőrség"
HUN_hungarian_gendarmerie_desc:	" Um unsere Grenzen sowie unsere Führer vor Gefahren zu schützen, muss unsere paramilitärische Gendarmerie ausgebaut und mit mehr Befugnissen zum eigenständigen Handeln ausgestattet werden."
HUN_hungarian_gendarmerie_hussars:	"Gendarmerie der Schwarzen Legion"
HUN_hungarian_gendarmerie_hussars_desc:	 "Um unsere Grenzen sowie unsere Führer vor Gefahren zu schützen, muss unsere paramilitärische Gendarmerie ausgebaut und mit mehr Befugnissen zum eigenständigen Handeln ausgestattet werden."
HUN_rapid_army_groups_idea_desc:	"Unsere Armee wurde neu organisiert, um jederzeit so schnell wie möglich an den Ort gelangen zu können, an dem sie benötigt wird."
HUN_pan_ugric_volunteer_force_desc:	"Unser jüngster Eifer, unseren finno-ugrischen Brüdern zu helfen, hat die Rekrutierung von [ROOT.GetAdjective] Freiwilligen beflügelt, die sich dem Kampf im Ausland anschließen möchten."
HUN_GER_trade_modifier:	"Ungarisch-deutsche Handelsabkommen"
HUN_POL_friendship_modifier:	" Polen und Ungarn – zwei gute Freunde, die streiten und am Ende gemeinsam trinken"
HUN_restricted_voting_rights:	"Eingeschränkte Wahlrechte"
HUN_restricted_voting_rights_desc:	"Die Einschränkung der Wahlrechte des Volkes mag kein populärer Schritt sein, doch sie war notwendig, um den aufkommenden kommunistischen und liberalen Ideologien im Land Einhalt zu gebieten."
HUN_crackdown_on_extremism:	"Vorgehen gegen Extremismus"
HUN_crackdown_on_extremism_desc:	"Im Rahmen der neuen antiextremistischen Reformen des neuen Ministerpräsidenten Kálmán Darányi wurde Ferenc Szálasi verhaftet und die Partei des Nationalen Willens, seine nationalsozialistische Partei, verboten."
HUN_power_to_the_regent_idea:	"Macht für den Regenten"
HUN_power_to_the_regent_idea_desc:	"Mit der Verabschiedung des Gesetzes XIX wurden dem Regenten von [ROOT.GetNameDef] mehr Befugnisse übertragen, und die Loyalität des Volkes gilt seinem großen Führer Miklós Horthy."
HUN_turul_association_idea:	"Der Turul-Verband"
HUN_supporting_carlists:	"Unterstützung für die carlistische Sache"
HUN_following_entente_stipulations:	"In Übereinstimmung mit den Bestimmungen der Kleinen Entente"
HUN_bastion_of_catholicism:	"Bastion des Katholizismus"
HUN_bastion_of_catholicism_desc:	"Unsere Nation ist streng katholisch, und unsere Soldaten sollen als Hüter des großen Glaubens und Diener Seiner Heiligen Hoheit selbst dienen."
HUN_a_multi_ethnic_empire:	"Ein multiethnisches Reich"
HUN_a_multi_ethnic_empire_desc:	"Unser Reich umfasst viele verschiedene Völker und Kulturen, und dies haben wir voll und ganz angenommen, indem wir den verschiedenen Regionen unseres Reiches weitgehende Autonomie gewähren, sodass unser Volk Teil von uns bleiben möchte."
HUN_payments_from_hungary_idea:	"Zahlungen von [HUN.GetNameDef]"
HUN_volksbund_good:	"Der Volksbund"
HUN_gombos_trade_treaty_arms_market_tt:	"Ermöglicht den Waffenhandel mit §YDeutschland§!"
HUN_resurgent_communist_party_idea:	"Eine wiederauflebende Kommunisták Magyarországi Pártja"
HUN_salami_slicing_tactics_idea:	"Salami-Taktik"
HUN_the_rakosi_battalion_idea:	"Rákosis Internationale Brigaden"
HUN_socialist_economy_idea:	"Eine sozialistische Wirtschaft"
HUN_socialist_revanchist_sentiment:	"Revanchistische Gefühle"
HUN_state_protection_authority_ns_vanilla_desc:	"Unser Geheimdienst wird dazu beitragen, ausländische Spionageangriffe gegen uns abzuwehren und unsere eigenen internationalen Ambitionen zu stärken."
HUN_habsburg_restored_desc:	"Seit 1526 wird unsere Nation von der Habsburger Dynastie regiert, da diese einen göttlichen Anspruch auf unser Land erhebt. Mit der Wiederherstellung der Monarchie ist es höchste Zeit, dass wir sicherstellen, dass sie hier bleibt und dass unsere Nation nicht erneut in republikanische Verderbtheit verfällt."
