GER_uncertain_future:	"Ungewisse Zukunft"
GER_uncertain_future_desc:	"Nach dem Ende des Bürgerkriegs baut sich die deutsche Nation langsam wieder auf, aber die Menschen sehnen sich nach Stabilität und Sicherheit. Das Volk sehnt sich jedoch nach Stabilität und Sicherheit. [ROOT.GetLeader] hat keine Anstrengungen unternommen, um voranzukommen und scheint kein Interesse daran zu haben, zu entscheiden, wie die Zukunft des neuen deutschen Staates aussehen soll. Das hat in der Bevölkerung große Besorgnis ausgelöst, die sich unbedingt von ihrer zerrütteten Vergangenheit lösen möchte."
