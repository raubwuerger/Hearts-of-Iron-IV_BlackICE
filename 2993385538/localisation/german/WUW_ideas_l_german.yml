 #### TOOLTIPS ###
 #INDUSTRIAL TOOLTIPS
BEL_language_barriers_ns:	"Sprachliche Barrieren"
BEL_language_barriers_fas_fr_ns_desc:	"Die französische Sprache wurde als Hauptsprache innerhalb von [ROOT.GetName] ausgewählt, wobei die wallonische Kultur gefördert und die flämische im Namen der Einheit unterdrückt wird."
BEL_license_POL_air_idea-desc:	"Durch die guten Beziehungen zu unseren polnischen Partnern konnten wir eine Reihe von Militärlizenzen zu sehr günstigen Konditionen erwerben."
 #MILITARY TOOLTIPS
BEL_maritime_support_ns_desc:	"Jetzt, da wir die militärische Infrastruktur der Marine zunehmend in Betrieb nehmen, wurden die Fähigkeiten unserer Flotte erheblich erweitert."
BEL_convoy_protection_duties_ns_desc:	"Die Seewege sind immer gefährlicher geworden. Deshalb haben wir die Seeleute unserer Handelsmarine bewaffnet, damit unsere Konvois im Falle eines Angriffs einigermaßen geschützt sind, und sei es nur, um ihre Flucht wahrscheinlicher zu machen."
BEL_maritime_phoenix_ns_desc:	"So wie der Phönix aus der Asche aufsteigt, so erhebt sich auch unsere Flotte aus den Schalen der abgewrackten Schiffe."
BEL_economic_recovery_ns_desc:	"Unsere geschwächte Wirtschaft zeigt die ersten Anzeichen einer Erholung. Die Ausgaben steigen, die Verschuldung sinkt, und die Spekulanten zeigen mehr Vertrauen in den Markt."
BEL_collapsing_government_ns_desc:	"Korruptionsvorwürfe haben die Regierung so erschüttert, dass die Ratten aus dem sinkenden Schiff fliehen. Fast täglich gibt es Rücktritte, und es ist klar, dass dieses Kabinett nicht mehr lange zu leben hat."
BEL_the_kings_surrender_ns_desc:	"König Leopold III. hat bereits die Kapitulation unserer Nation angeboten. Das hat die Moral unserer Truppen erschüttert und unsere Fähigkeit, den Kampf fortzusetzen, dramatisch beeinträchtigt."

 #ALFRED ROSENBERG

BEL_dissolve_political_parties_ns_desc:	"Unser Premierminister hat erklärt, dass die politischen Parteien der verfaulte Kern unseres korrupten politischen Systems sind. Um diese Krankheit zu heilen, müssen die Parteien aufgelöst werden."

BEL_surrender_tt:	"§Wenn Sie diese Option wählen, kapituliert Ihre Nation!§! \n\nWenn Sie einer Fraktion angehören, kämpfen Sie als Regierung im Exil weiter."
BEL_scars_of_ww1_ns_fake:	"$BEL_scars_of_ww1_dynamic_modifier$"
BEL_scars_of_ww1_ns_fake_desc:	"$BEL_scars_of_ww1_dynamic_modifier_desc$"
