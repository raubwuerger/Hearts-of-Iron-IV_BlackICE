BEL_corruption_ns_fake_desc:	"$BEL_corruption_dynamic_modifier_desc$"
BEL_democratization_of_education_ns:	"Demokratisierung der Bildung"

 #INTELLIGENCE
BEL_scars_of_ww1_dynamic_modifier_desc:	"[BEL.GetName] hat im Großen Krieg sehr gelitten, da ein großer Teil des Schlachtfeldes an der Westfront lag, und es trägt noch immer diese Narben."
BEL_social_partners_dynamic_modifier:	"Soziale Partner"
BEL_social_partners_dynamic_modifier_desc:	"[ROOT.GetName] brachte Gewerkschaften und Unternehmensvertreter zusammen und vermittelte einen Kompromiss, der unter anderem die Einführung des Mindestlohns und sechs Tage bezahlten Urlaub vorsah."

 #FAKE NATIONAL SPIRITS:
BEL_belgian_miracle_dynamic_modifier:	"Belgisches Wunder"
BEL_belgian_miracle_dynamic_modifier_desc:	"Die Politik von [ROOT.GetLeader] hat sich wirklich ausgezahlt und [ROOT.GetName] ist auf der Weltbühne zu einer Größe aufgestiegen, die von vielen der so genannten Großmächte bewundert wird."

 #OPINION MODIFIERS
BEL_defensive_neutrality_dynamic_modifier:	"Verteidigungsneutralität"
BEL_defensive_neutrality_dynamic_modifier_desc:	"Um unsere Neutralität zu schützen, müssen wir sicherstellen, dass unsere Verteidigungsanlagen so beschaffen sind, dass kein Angreifer uns angreifen möchte."
BEL_austrian_resistance_active_state_dynamic_modifier:	"Österreichische Freiheitsfront"
BEL_austrian_resistance_active_state_dynamic_modifier_desc:	"Die Österreichische Freiheitsfront ist im Land aktiv und sorgt für ein größeres Rekrutierungspotenzial und mehr Widerstand, sollte das Land jemals besetzt werden."

 #INNER CIRCLE
BEL_defensive_reorganization_dynamic_modifier:	"Defensive Umstrukturierung"
BEL_defensive_reorganization_dynamic_modifier_desc:	"Wir haben weitere strategische und hochrangige Änderungen in der Doktrin vorgenommen und sind weltweit führend in der modernen Defensivtheorie."
BEL_royal_military_academy_dynamic_modifier_desc:	"Wir schicken unsere besten und klügsten Köpfe an die Königliche Militärakademie, wo die nächste Generation von Offizieren eine erstklassige militärische Ausbildung in einer Vielzahl von Spezialgebieten erhalten kann."
BEL_corruption_dynamic_modifier:	"Korruption"
BEL_economic_downturn_dynamic_modifier_desc:	"Unsere Wirtschaft liegt in Trümmern, seit der letzte Krieg unser Land in ein Schlachtfeld verwandelt hat. Die Erholung wurde durch die Auswirkungen der weltweiten Depression, von der wir uns immer noch nicht erholt haben, nur noch weiter erschwert."
BEL_belgian_legion_dynamic_modifier:	"Die Belgische Legion"
BEL_belgian_legion_dynamic_modifier_desc:	"Eine Ansammlung von konservativen und royalistischen Loyalisten ist bereit, im Namen ihres Königs zu den Waffen zu greifen."
BEL_gold_reserves_dynamic_modifier:	"[BEL.GetAdjective] Goldreserve"
BEL_rexist_legion_dynamic_modifier:	"Rexistische Legion"
BEL_rexist_legion_dynamic_modifier_desc:	"Die Vereinigung von Kirche und Staat in der rexistischen Bewegung hat es uns ermöglicht, eine militärische Bewegung nach dem Vorbild der alten Militärorden zu gründen."
BEL_european_crusade_dynamic_modifier:	"Der Europäische Kreuzzug"
BEL_socialism_on_the_rise_dynamic_modifier:	"Sozialistische Gesinnung"
BEL_academies_of_belgium_dynamic_modifier_desc:	"Die Akademien von Belgien sind eine kollektive Organisation der höheren Bildungseinrichtungen im ganzen Land und stehen im Zentrum der belgischen technologischen Durchbrüche."



