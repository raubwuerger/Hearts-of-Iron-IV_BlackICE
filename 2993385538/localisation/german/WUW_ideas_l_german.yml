AUS_payment_for_alaska:	"Zahlung für den Verkauf Alaskas"
AUS_payment_for_alaska_desc:	" Der Verkauf Alaskas war in unserer Bevölkerung umstritten, doch niemand kann seine positiven Auswirkungen auf unser Land leugnen."
AUS_against_fascism:	"Österreichischer antifaschistischer Kreuzzug"
