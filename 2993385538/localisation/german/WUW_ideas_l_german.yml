FRA_maginot_line_dynamic_modifier:	"Maginot-Linie"
JAP_public_awareness_of_war_ns:	"Öffentliches Bewusstsein für den Krieg in China"
AUS_widespread_unemployment:	"Weit verbreitete Arbeitslosigkeit"
AUS_widespread_unemployment_desc:	"Nach dem Wirtschaftscrash hat Österreich mit Inflation und hoher Arbeitslosigkeit zu kämpfen. Die Ressentiments gegenüber den Politikern sind groß."
AUS_employment_efforts:	"Bemühungen um Beschäftigung"
AUS_employment_efforts_desc:	"Es wurden beträchtliche Investitionen getätigt, um die derzeitige Beschäftigungskrise in Österreich zu beenden. Mit den Lehrlingen, die jetzt in den Fabriken zu sehen sind, scheinen sowohl die Menschen als auch die Industrie zufrieden zu sein."
AUS_phonix_insurance:	"Phönix-Versicherung"
AUS_phonix_insurance_desc:	"Das Phönix-Versicherungsprogramm hat es unseren Rekruten ermöglicht, eine Lebensversicherung abzuschließen, die sie für den Fall des Falles absichert. Die Gewissheit, dass für ihre Familien gesorgt ist, hat die Bereitschaft, der Armee beizutreten, deutlich erhöht."
AUS_covering_the_phonix_insurances:	"Absicherung durch die Phönix Versicherung"
AUS_covering_the_phonix_insurances_desc:	"Die Bevölkerung wissen zu lassen, dass es ihre geliebten Phönix-Versicherungen nicht mehr gibt, hätte drastische Folgen für unsere Fähigkeit gehabt, eine Armee zu unterhalten und zu verbessern. Der Staat wird für die Versicherung aufkommen, bis die Phönix-Versicherung wieder auf die Beine kommt."
AUS_cannot_train_due_to_treaty_of_saint_germain_en_laye:	"Wir können keine neuen Einheiten ausbilden, solange der §Y$AUS_treaty_of_saint_germain_en_laye$§! aktiv ist."
AUS_treaty_of_saint_germain_en_laye:	"Vertrag von Saint-Germain-en-Laye"
AUS_treaty_of_saint_germain_en_laye_desc:	"Durch einen strengen Vertrag, der nach dem Ersten Weltkrieg unterzeichnet wurde, sind sowohl die österreichische Armee als auch die Militärindustrie nur noch ein Schatten dessen, was sie einmal waren."
AUS_treaty_of_saint_germain_en_laye_tt:	"Sie können Freiwillige entsenden: §Rno§!"
AUS_treaty_of_saint_germain_en_laye_tt_2:	"§A Solange der Nationale Geist aktiv ist, kann die Wehrpflicht nicht über 'Nur Freiwillige' hinaus erhöht werden. Einheiten können nicht ausgebildet, aufgelöst oder in ihren Vorlagen geändert werden§!"
AUS_revised_treaty_of_saint_germain_en_laye:	"Überarbeiteter Vertrag von Saint-Germain-en-Laye"
AUS_revised_treaty_of_saint_germain_en_laye_desc:	"Durch diplomatische Bemühungen wurden die Auswirkungen des ursprünglichen Vertrags von Saint-Germain-en-Laye abgeschwächt. Da [ROOT.GetNameDef] nicht mehr unter einer harten Beschränkung der Größe seiner Armee leidet, kann sie nun eine Aufrüstung in kleinerem Maßstab beginnen."
AUS_recovering_from_the_depression:	"Erholung von der wirtschaftlichen Depression"
AUS_recovering_from_the_depression_desc:	"Österreich erholt sich nur langsam von den wirtschaftlichen Einbrüchen der frühen 30er Jahre, aber es scheint, als ob es endlich auf bessere Zeiten zugeht."
AUS_recurrent_economic_depression:	"Die wirtschaftliche Depression kehrt zurück"
AUS_recurrent_economic_depression_desc:	"Das Muster, dass kurzfristige Wirkungen wirksam sind, die Wirtschaftskrise aber noch schlimmer zurückkehrt, sobald die Wirkung nachlässt, scheint Österreich wie ein Fluch zu verfolgen. Wieder steigen die Inflationsraten in die Höhe und die Wirtschaft liegt in Trümmern."
AUS_economic_boom:	"Wirtschaftlicher Aufschwung"
AUS_economic_boom_desc:	"Durch harte Arbeit und große Anstrengungen hat Österreich eine wirtschaftliche Katastrophe in eine schnell wachsende Wirtschaft verwandelt."
AUS_women_in_academia:	"Frauen in der akademischen Welt"
AUS_women_in_academia_desc:	"Durch die Zulassung von Frauen zur Hochschulbildung hat der wissenschaftliche Fortschritt in Österreich einen großen Sprung nach vorne gemacht."
AUS_militia_support:	"Unterstützung der Miliz"
AUS_militia_support_2:	"Unterstützung der Miliz"
AUS_militia_support_desc:	"Wir haben die Unterstützung der [GetMilitiaName] für unsere Sache angeworben. Diese paramilitärische Organisation ist schon lange verboten, aber in dieser Situation können wir ihre Wiedereinführung leicht rechtfertigen."
AUS_militia_is_schutzbund:	"Schutzbund"
AUS_militia_is_sturmscharen:	"Sturmscharen"
AUS_militia_is_heimwehr:	"Heimwehr"
AUS_militia_is_undecided:	"Miliz"
AUS_emergency_measures:	"Notfallmaßnahmen"
AUS_emergency_measures_desc:	"Um in einer Welt, die immer aggressiver wird, eine Chance zu haben, muss [AUS.GetNameDef] schnell eine respektable industrielle Kapazität aufbauen, um den Bedarf des Landes zu decken."
AUS_host_of_communist_dissidents:	"Kommunistische Dissidenten beherbergen"
AUS_host_of_communist_dissidents_desc:	"Gleichgesinnte aus der ganzen Welt einladen [AUS.GetNameDef] wird zu einer Drehscheibe für kommunistische Exilanten."
AUS_devalued_the_schilling:	"Abwertung des Schillings"
AUS_devalued_the_schilling_desc:	"Um die Inflation abzuwehren, wurde die Währung abgewertet. Kurzfristig sind die Auswirkungen nicht gerade vorteilhaft, aber langfristig sollte sich dies als eine Verbesserung für die Nation erweisen."
