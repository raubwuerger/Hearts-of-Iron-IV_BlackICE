HUN_hungarian_national_defense_association_greenshirts:	"Ungarische Nationale Verteidigungsvereinigung"
HUN_hungarian_national_defense_association_greenshirts_desc:	"Die rechtsextreme, weitgehend paramilitärische Organisation M.O.V.E., die 1919 gegründet wurde, ist im Großen und Ganzen ihrem Anführer und Gründer Gyula Gömbös treu. Da die Organisation jedoch mit den Grünhemden und dem Sensenkreuz verschmolzen ist, sind ihre Loyalitäten verstreut, und sie ist möglicherweise den Anführern des Pfeilkreuzes gegenüber loyaler als allen anderen."
