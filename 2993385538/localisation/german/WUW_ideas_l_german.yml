special_project_consumer_costs_high:	"Geheime Beschaffung von Ressourcen"
special_project_consumer_costs_high_desc:	"Leise Stimmen flüstern von einer enormen Menge an Vorräten, die von der Regierung an scheinbar harmlose Orte umgeleitet werden. Einige vermuten, dass die Ressourcen für geheime Forschungs- und Entwicklungsprojekte verwendet werden, doch es gibt kaum konkrete Beweise, die dies bestätigen ..."
