prospect_for_resources_desc:0	"Unsere Geologen haben eine Reihe von vielversprechenden Rohstoffvorkommen in unseren Territorien gefunden. Wir können etwas Kapital ausgeben, um diese Felder zu erschließen. Fortschritte in der Fördertechnik könnten weitere Vorkommen für die Ausbeutung nutzbar machen."
economy_decisions:0	"Wirtschaftspolitik"
#economy_decisions_desc:0 "Das Rückgrat unserer Wirtschaft, die Menschen, die in den Fabriken arbeiten, haben seit der industriellen Revolution gelitten und Probleme verursacht. Sie müssen ruhig gehalten werden, um sicherzustellen, dass unsere Wirtschaft richtig funktioniert und um §HStreiks§! zu verhindern.  \n\nAktuelle Arbeiterunruhen:  [?worker_mood_TT|2R] \nIndustry Size Factor: [?industry_factor|R2]\nWahrscheinlichkeit des Auftretens von §YStreiks§! [Root.GetStrikeChanceLevel] \n - Reduktion : [?modifier@production_speed_dummy_2_factor|2+%]"
 #economy_decisions_desc:0 "The backbone of our economy, the people working in the factories, have been suffering and causing trouble since the Industrial Revolution. They will need to be kept calm to ensure our economy functions correctly and to prevent §HStrikes§!.  \n\nCurrent Worker Unrest:  [?worker_mood_TT|2R] \nIndustry Size Factor: [?industry_factor|R2]\nChance of §YStrikes§! appearing: [Root.GetStrikeChanceLevel] \n    - Reduction : [?modifier@production_speed_dummy_2_factor|2+%]"
