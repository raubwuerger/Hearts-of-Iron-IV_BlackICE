 ### BICE
prepare_for_monarch_civil_war:0	"Bereiten Sie sich auf einen Bürgerkrieg vor"
prepare_for_monarch_civil_war_desc:1	"Wir haben keine Zeit, um auf die langsamen Veränderungen in den Köpfen der Menschen zu warten. Um ihrer selbst willen müssen wir die Angelegenheit rasch vorantreiben, auch wenn einige dabei ihr Leben verlieren. Im Gegensatz zu einem friedlichen Referendum wird ein Bürgerkrieg unsere Streitkräfte, die Industrie und die Infrastruktur des Landes stark in Mitleidenschaft ziehen, aber er ist auch schneller und stellt sicher, dass wir unseren Willen anschließend mit mehr Nachdruck durchsetzen können."
expand_civil_monarch_support:0	"Zivile Unterstützung ausbauen"
ensure_general_loyalty_for_monarch_civil_war:1	"Sicherstellung der Loyalität der unteren Armeekommandos"
ensure_general_loyalty_for_monarch_civil_war_desc:0	"Möglicherweise hegen einige Generäle geheime Sympathien für die Monarchie. Wir müssen auf sie zugehen und ihre Loyalität sicherstellen, wenn die Kämpfe beginnen."
ensure_marshal_loyalty_for_monarch_civil_war:0	"Sicherstellung der Loyalität der oberen Heeresleitung"
formulate_surprise_attack_plan_for_monarch_civil_war:0	"Plan für einen Überraschungsangriff ausarbeiten"
formulate_surprise_attack_plan_for_monarch_civil_war_desc:0	"Der Feind hat keine Ahnung von dem bevorstehenden Unheil. Wir müssen dafür sorgen, dass dies auch so bleibt, und gleichzeitig unsere Schlachtpläne so ausrichten, dass wir das Überraschungsmoment optimal nutzen können."
ignite_the_monarch_civil_war:0	"Bürgerkrieg entfachen"
open_up_political_discourse_monarchism:0	"Öffnung des politischen Diskurses"
open_up_political_discourse_monarchism_desc:1	"Wir müssen die Akzeptanz abweichender Standpunkte in der Regierung fördern. Vielleicht wird es dadurch möglich sein, einen friedlichen Wandel in der Politik unseres Landes herbeizuführen."
discredit_government_monarchism:0	"Regierung in Misskredit bringen"
TUR_hatay_start:0	"Fordern Sie eine Lösung für das Hatay-Problem"
TUR_hatay_start_desc:0	"Hatay ist unser Land. Wir müssen es von Frankreich zurückbekommen. Das können wir entweder durch Krieg oder auf diplomatischem Wege erreichen. Wir sollten Frankreich drohen, Maßnahmen zu ergreifen."
HAT_hatay_end:0	"Beitritt zur Türkei"
