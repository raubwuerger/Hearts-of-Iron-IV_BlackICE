form_scandinavia:0	"Stelle die Kalmarer Union wieder her"
form_nordic_league:0	"Proklamiere die Nordische Einheit"
form_gran_colombia:0	"Bolívars Erbe wiederbeleben"
form_austria_hungary:0	"Wiederherstellung des österreichisch-ungarischen Reiches"
reintegrate_austro_hungarian_empire:0	"Reintegrieren Sie das Kaiserreich"
reintegrate_austro_hungarian_empire_desc:0	"Wir haben genug zurückerobert, um die kaiserlichen österreichisch-ungarischen Länder wieder in unser Reich einzugliedern. Lasst uns dies unverzüglich tun."
form_commonwealth:0	"Den Commonwealth wiederherstellen"
form_united_netherlands:0	"Verwerfen Sie den Vertrag von London"
form_united_central_america:0	"Die Bundesrepublik wiederherstellen"
form_baltic_federation:0	"Einigung des Baltikums"
form_ottoman_empire:0	"Das Osmanische Reich wiederherstellen"
form_european_union:0	"Die europäische Einheit verwirklichen"
form_mutapa:0	"Das simbabwische Reich wiederherstellen"
form_roman_empire:0	"Verwirklichung der römischen Ambitionen"
form_persian_empire:0	"Das Persische Reich wiederherstellen"
form_byzantine_empire:0	"Byzanz wiederherstellen"
byz_triumph_for_italy:0	"Triumph für Italien"
byz_triumph_for_italy_desc:0	"Italien ist unter unsere Kontrolle geraten, und wir sollten es in einer glorreichen Zeremonie wieder in das Imperium eingliedern!"
byz_triumph_for_middle_east:0	"Triumph für die Levante"
byz_triumph_for_middle_east_desc:0	"Die Levante ist unter unsere Kontrolle geraten, und wir sollten sie in einer glorreichen Zeremonie wieder in das Imperium eingliedern!"
byz_triumph_for_egypt_and_tunis:0	"Triumph für Ägypten und Tunis"
byz_triumph_for_egypt_and_tunis_desc:0	"Ägypten und Tunis sind unter unsere Kontrolle geraten, und wir sollten sie in einer glorreichen Zeremonie wieder in das Imperium eingliedern!"
form_arabia:0	"Vereinige Arabien"
form_majapahit_empire:0	"Formt die Thalassokratie neu"
form_rattanakosin_kingdom:0	"Stärkt das Rattanakosin-Erbe"
form_hre:0	"Wiederbelebung des Heiligen Römischen Reiches"
form_scandinavia_category:0	"Wiederherstellung der Kalmarer Union"
form_scandinavia_category_desc:0	"Mit der Eroberung aller skandinavischen Territorien ist es an der Zeit, den Geist der Kalmarer Union wiederherzustellen. Ganz Skandinavien soll unter unserer Herrschaft gedeihen."
form_nordic_league_category:0	"Verkündet die nordische Einheit"
form_nordic_league_category_desc:0	"Die Nordländer fühlen sich seit langem miteinander verbunden. Jetzt, da wir alle Länder kontrollieren, die einst zu den nordischen Gliedstaaten gehörten, ist es möglich, diese Verwandtschaft zu neuen Höhen zu führen."
form_gran_colombia_category:0	"Bolívars Erbe wiederbeleben"
form_gran_colombia_category_desc:0	"Obwohl das Experiment Großkolumbien vor einem Jahrhundert nur von kurzer Dauer war, ist es uns nun erneut gelungen, die Kontrolle über die Gebiete zu erlangen, aus denen es besteht. Wir können Bolívars Traum noch einmal verwirklichen."
form_austria_hungary_category:0	"Wiederherstellung der österreichisch-ungarischen Monarchie"
form_austria_hungary_category_desc:0	"Die alten österreichisch-ungarischen Länder wurden erobert, und als ihr einziger verbliebener Nachfolgestaat hängt es von uns ab, das Reich wiederherzustellen. Wir sollten nicht zögern, sondern dies sofort tun."
form_commonwealth_category:0	"Neugestaltung des Commonwealth"
form_commonwealth_category_desc:0	"Es gibt eine lange Geschichte zwischen uns und Litauen. Jetzt, da wir wieder mit Waffengewalt vereint sind, ist es vielleicht an der Zeit, die glorreichsten Tage unserer Vergangenheit wieder aufleben zu lassen."
form_united_netherlands_category:0	"Den Vertrag von London ablehnen"
form_united_netherlands_category_desc:0	"Der Londoner Vertrag von 1839 hat den Norden und den Süden der Tiefebene nach einer allzu kurzen Zeit der Einheit auf schändliche Weise getrennt. Jetzt, unter unserer Führung, können wir diese Zeiten wiederherstellen und den uns zugedachten Platz als Gegengewicht zu Frankreich und Deutschland einnehmen."
form_united_central_america_category:0	"Die Bundesrepublik wiederherstellen"
form_united_central_america_category_desc:0	"Der mächtige Staat, dem unsere Nation vor einem Jahrhundert angehörte, hatte nur eine allzu kurze Lebensspanne. Jetzt, da wir die abtrünnigen Staaten, die seinen Untergang verursachten, besiegt haben, können wir uns um die Wiederherstellung der Bundesrepublik bemühen und damit beginnen, die Macht eines geeinten Mittelamerikas zu demonstrieren."
form_baltic_federation_category:0	"Das Baltikum vereinigen"
form_baltic_federation_category_desc:0	"Unsere früheren Erklärungen über regionale Solidarität und eine einheitliche Außenpolitik können nur noch verbessert werden, wenn wir das gesamte Baltikum unter unserer Kontrolle haben. Die Integration unserer ehemaligen Nachbarn wird angesichts der Gefahren im Westen und im Osten zu mehr Sicherheit für alle führen."
form_ottoman_empire_category:0	"Neugestaltung des Osmanischen Reiches"
form_ottoman_empire_category_desc:0	"Mit Waffengewalt ist es uns gelungen, die Verluste auszugleichen, die wir aufgrund unserer Schwäche im Ersten Weltkrieg erlitten haben. Nichts wäre besser geeignet, dieses historische Ereignis zu feiern, als die Wiederherstellung des Osmanischen Reiches zu proklamieren."
form_european_union_category:0	"Die europäische Einheit verwirklichen"
form_european_union_category_desc:0	"Obwohl das Konzept eines politisch geeinten Europas erst in den letzten Jahrzehnten ansatzweise Fuß gefasst hat, stellt unsere jüngste Eroberung der mächtigsten kontinentaleuropäischen Nationen uns vor diese unerwartete Realität. Vielleicht ist eine Umstrukturierung der Nation erforderlich, um die Chancen, die sich uns bieten, voll ausschöpfen zu können."
form_mutapa_category:0	"Das simbabwische Reich neu erschaffen"
form_mutapa_category_desc:0	"Nachdem wir den südlichen Teil des Kontinents von kolonialen Einflüssen befreit haben, ist es vielleicht an der Zeit, die Menschen hinter dem Konzept eines mächtigen Reiches aus unserer Vergangenheit zu versammeln. In dieser Region hat es mehrere gegeben, und wir brauchen nur einen Namen, der als Symbol dient."
form_roman_empire_category:0	"Römische Ambitionen verwirklichen"
form_roman_empire_category_desc:0	"Die Idee eines Imperiums, das den Mittelmeerraum umspannt, ist in den letzten Jahren im Bewusstsein der Bevölkerung wieder aufgelebt. Unsere Feldzüge haben die kühnsten Träume selbst unserer eifrigsten Befürworter übertroffen, und wir stehen an der Schwelle zur Verwirklichung dieser Ambitionen. Roma invicta!"
form_persian_empire_category:0	"Das Persische Reich neu erschaffen"
form_persian_empire_category_desc:0	"Unsere jüngsten Eroberungen haben die Ausmaße des alten persischen Reiches erreicht. Wie könnten wir angesichts der reichen Geschichte unserer Region diese Gelegenheit nicht nutzen, um unser Reich als Fortsetzung der alten Reiche zu bezeichnen?"
form_byzantine_empire_category:0	"Wiederherstellung von Byzanz"
form_byzantine_empire_category_desc:0	"Nachdem wir unsere alten Gebiete vom türkischen Joch befreit haben, können wir nun mit etwas Propaganda behaupten, unsere Nation sei die Nachfolgerin eben jenes Reiches, das die Türken vor fünf Jahrhunderten beendeten. Dieses Erbe wird unser internationales Prestige in die Höhe treiben!"
form_arabia_category:0	"Arabien vereinen"
form_arabia_category_desc:0	"Zu lange waren die arabischen Staaten durch regionale Rivalitäten geteilt. Jetzt, da wir die Halbinsel unter unserer Herrschaft vereinigt haben, können wir endlich die Bildung eines vereinten Arabiens verkünden!"
form_majapahit_empire_category:0	"Neuformierung der Thalassokratie"
form_majapahit_empire_category_desc:0	"Vor vielen Jahrhunderten erstreckte sich ein großes Reich über den indonesischen Archipel und beherrschte dessen Handel. Es ist uns gelungen, unsere Grenzen so weit auszudehnen, dass sie die Ausmaße dieses Reiches umfassen, und seine Wiederherstellung könnte durchaus als Symbol für die Einheit der Region dienen."
form_rattanakosin_kingdom_category:0	"Stärkung des Erbes von Rattanakosin"
form_rattanakosin_kingdom_category_desc:0	"In den letzten Jahren haben wir uns von den traditionellen Werten, auf denen unsere Nation ursprünglich gegründet wurde, entfernt. Jetzt, da wir die territoriale Ausdehnung unserer glorreichen Tage erreicht haben, ist es vielleicht an der Zeit, unsere Geschichte wieder stärker zu verinnerlichen."
form_hre_category:0	"Das Heilige Römische Reich wiederbeleben"
form_hre_category_desc:0	"Die Pracht unserer Kaiserin kennt keine Grenzen, ebenso wenig wie die Grenzen unserer Nation. Diese sind inzwischen auf die Grenzen des alten Heiligen Römischen Reiches angewachsen, und die Nationen, die sich uns in den Weg stellen, sind nicht mehr in der Lage, unserer Politik zu widersprechen. Die Kaiserin hat verfügt, dass die gegenwärtige Gelegenheit genutzt werden soll, und dass die Nation ihre Rolle als geistige Nachfolgerin des Heiligen Römischen Reiches annehmen soll. Aquila Elegit Iovis Omnia Vincit!"
form_greater_german_reich_category:0	"Großdeutsches Reich ausrufen"
form_greater_german_reich_category_desc:0	"Unsere Feinde sind vor uns niedergeschlagen worden, und unsere Ziele der Expansion in den Osten sind erreicht worden. Jetzt ist es an der Zeit, der Welt die Größe unserer Nation vor Augen zu führen und die Umwandlung unserer Hauptstadt in etwas zu beginnen, auf das alle mit Stolz blicken können."
form_greater_german_reich:0	"Großes Deutsches Reich ausrufen"
liberate_angola:0	"Befreie Angola"
liberate_angola_desc:0	"Dies wird etwa 6 Monate dauern."
liberate_mozambique:0	"Befreiung Mosambiks"
liberate_mozambique_desc:0	"Dies wird etwa 6 Monate dauern."
liberate_congo:0	"Befreiung des Kongo"
liberate_congo_desc:0	"Dies wird etwa 6 Monate dauern."
liberate_zimbabwe:0	"Befreiung Simbabwes"
liberate_zimbabwe_desc:0	"Dies wird etwa 6 Monate dauern."
liberate_kenya:0	"Befreiung Kenias"
liberate_kenya_desc:0	"Dies wird etwa 6 Monate dauern."
hold_fight_on_the_beaches_speech:0	"Halten Sie die "Wir werden an den Stränden kämpfen"-Rede"
hold_fight_on_the_beaches_speech_desc:0	"Wir werden bis zum Ende weitermachen. Wir werden in Frankreich kämpfen, wir werden auf den Meeren und Ozeanen kämpfen, wir werden mit wachsender Zuversicht und wachsender Stärke in der Luft kämpfen, wir werden unsere Insel verteidigen, was auch immer der Preis sein mag. Wir werden an den Stränden kämpfen, wir werden auf den Landungsplätzen kämpfen, wir werden auf den Feldern und auf den Straßen kämpfen, wir werden in den Bergen kämpfen; wir werden niemals kapitulieren..."
fight_on_the_beaches_speech:0	"Rede 'Wir werden an den Stränden kämpfen'"
operation_fork:0	"Operation Fork"
operation_fork_desc:0	"Das vor kurzem unabhängig gewordene Island befindet sich in einer strategisch äußerst wichtigen Lage im Nordatlantik. Ein Verlust Norwegens würde die wehrlose Insel in eine verwundbare Lage bringen. Wir müssen unseren Feinden bei der Invasion und Besetzung Islands zuvorkommen, damit sie sich nicht die strategischen Stützpunkte der Insel aneignen, von denen aus sie unsere Versorgungslinien gefährden könnten. Nur mit unserem Schutz werden die Isländer vor unseren Feinden sicher sein."
invade_ireland:0	"In Irland einmarschieren"
invade_ireland_desc:0	"Wir müssen die Sicherheit unserer Konvois mit allen notwendigen Mitteln gewährleisten. Eine Invasion Irlands mag einigen von uns nicht schmecken, aber wenn dies notwendig ist, um die Nutzung ihrer Luftwaffenstützpunkte zu erlangen, dann soll es so sein."
macdonald_proposal:0	"Der Macdonald-Vorschlag"
macdonald_proposal_desc:0	"Wir müssen die Sicherheit unserer Konvois gewährleisten, und um dies zu erreichen, sind irische Luft- und Marinestützpunkte von äußerster Wichtigkeit. Wir werden einen Abgesandten entsenden, der einen Handel mit Nordirland vorschlägt und im Gegenzug den sofortigen Eintritt Irlands in den Krieg auf unserer Seite fordert."
hold_blood_toil_tears_sweat_speech:0	"Halten Sie die 'Blut, Mühsal, Tränen und Schweiß'-Rede"
hold_blood_toil_tears_sweat_speech_desc:0	"Ich habe nichts zu bieten außer Blut, Mühsal, Tränen und Schweiß. [...] Sie fragen, was ist unsere Politik? Ich werde antworten: Wir führen Krieg, zu Wasser, zu Lande und in der Luft, mit all unserer Macht und mit all der Kraft, die Gott uns geben kann; wir führen Krieg gegen eine monströse Tyrannei, die im dunklen und beklagenswerten Katalog menschlicher Verbrechen nie übertroffen wurde. Das ist unsere Politik. Sie fragen, was ist unser Ziel? Ich kann die Frage mit einem Wort beantworten: Sieg. Sieg um jeden Preis - Sieg trotz aller Schrecken - Sieg, wie lang und hart der Weg auch sein mag, denn ohne Sieg gibt es kein Überleben."
blood_toil_tears_sweat_speech:0	"Blut, Mühsal, Tränen und Schweiß-Rede"
hold_this_was_their_finest_hour_speech:0	"Halten Sie die Rede "Dies war ihre letzte Stunde"."
hold_this_was_their_finest_hour_speech_desc:0	"Lasst uns daher unseren Pflichten nachkommen und uns so verhalten, dass, wenn das Britische Empire und sein Commonwealth tausend Jahre überdauern, die Menschen immer noch sagen werden: Dies war ihre schönste Stunde."
this_was_their_finest_hour_speech:0	"Rede 'Dies war ihre schönste Stunde'."
hold_thank_the_RAF_speech:	"Halten Sie die \"Thank the RAF\"-Rede"
hold_thank_the_RAF_speech_desc:	"Die Dankbarkeit jedes Hauses auf unserer Insel, in unserem Imperium und tatsächlich auf der ganzen Welt, außer in den Wohnstätten der Schuldigen, gilt den britischen Fliegern, die sich von Widrigkeiten nicht einschüchtern lassen, unermüdlich in ihrer ständigen Herausforderung und sterblich Gefahr, wenden durch ihr Können und ihre Hingabe das Blatt im Weltkrieg. Niemals auf dem Gebiet menschlicher Konflikte haben so viele so wenigen so viel zu verdanken."
mers_el_kebir_raid:1	"Operation Katapult"
mers_el_kebir_raid_desc:0	"Die französische Flotte ist in die Hände von Vichy-Frankreich gefallen, und wir können nicht zulassen, dass sie in deutsche Hände fällt. Wir müssen die unverzügliche Kapitulation der Marine unseres ehemaligen Verbündeten unter Androhung von Bombardierungen fordern, auch wenn es noch so widerlich ist."
FRA_vichy_france:0	"Vichy-Frankreich"
FRA_scuttle_the_fleet:0	"Zerstören Sie die Flotte"
FRA_scuttle_the_fleet_desc:0	"Ausländische Kräfte versuchen, die Kontrolle über unsere Seestreitkräfte zu erzwingen. Wir können dies nicht zulassen und müssen unsere Schiffe versenken!"
FRA_case_anton_mission:0	"Fall Anton im Gange"
case_anton:0	"Fall Anton"
FRA_case_anton_mission_tt:0	"Die Annektierung wird verhindert."
war_measures:0	"Kriegsmaßnahmen"
women_in_the_workforce:0	"Frauen als Arbeitskräfte"
women_in_the_workforce_desc:0	"Während die Männer in den Krieg ziehen, arbeiten Tausende von Frauen in den Fabriken, um die Kriegsmaschinerie am Laufen zu halten."
scientist_refuge:0	"Zuflucht von Wissenschaftlern"
scientist_refuge_desc:0	"Angesichts des derzeitigen politischen Klimas in Europa hat eine Reihe von Wissenschaftlern beschlossen, ihr Heimatland zu verlassen. Sie haben in unserem Land ein Einreisevisum beantragt. Die Gewährung eines solchen Visums wird uns einen Bonus für die Forschung verschaffen, aber auch einige Leute verärgern, die der Meinung sind, dass dies eine innere Angelegenheit ist, in die wir uns nicht einmischen sollten."
give_refuge_ger:0	"Deutschen Wissenschaftlern Zuflucht gewähren"
give_refuge_ita:0	"Italienischen Wissenschaftlern Zuflucht gewähren"
GER_weserubung_sud:0	"Weserübung-Süd"
GER_weserubung_sud_desc:0	"Um einen guten Aufmarschplatz für die Invasion Norwegens zu erhalten, müssen wir zuerst auf Dänemark vorrücken."
GER_case_yellow_netherlands:0	"Fall Gelb - Niederlande"
GER_case_yellow_netherlands_desc:0	"Ein Angriff über Belgien zwingt uns, eine zu enge Front zu durchbrechen. Wir müssen unseren Kriegsplan um die Niederlande erweitern, um die Fehler von 1914 zu vermeiden."
GER_polish_ultimatum:0	"Stellen Sie das Ultimatum an Polen"
