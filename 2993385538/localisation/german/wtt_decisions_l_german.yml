demob_conscription_mission:0	"Lockerung der Einberufungspolitik"
demobilization_desc:0	"Der drohende Krieg scheint in weite Ferne gerückt zu sein, und die Menschen sind nicht mehr bereit, die Härten der Kriegsgesetze hinzunehmen. Wir müssen unsere Gesetze überprüfen und eine Änderung in Betracht ziehen, um die Demonstranten zu beruhigen, bevor die Situation eskaliert."
demobilization_economic_desc:0	"Da die Gefahr eines Krieges in weiter Ferne zu liegen scheint, sind die Menschen nicht mehr bereit, die Härten einer Kriegswirtschaft hinzunehmen. Wir sollten unsere Wirtschaftsgesetze überdenken und in Erwägung ziehen, sie zu ändern, um mehr Konsumgüter zu produzieren, die ihren Ansprüchen genügen."
ENG_request_azores_lease:0	"Pacht der Azoren beantragen"
SOV_hold_stalingrad:0	"Stalingrad halten"
SOV_hold_leningrad:0	"Leningrad halten"
SOV_return_manchuria:0	"Rückgabe der Mandschurei"
SOV_return_manchuria_desc:0	"Wir werden die Mandschurei an das einzige rechtmäßige Volksregime in China zurückgeben."
fascism_on_the_rise:0	"Der Faschismus ist auf dem Vormarsch"
prepare_for_fascist_civil_war:0	"Bereiten Sie sich auf den Bürgerkrieg vor"
prepare_for_fascist_civil_war_desc:1	"Wir haben keine Zeit, auf die langsamen Veränderungen in den Köpfen der Menschen zu warten. Um ihrer selbst willen müssen wir die Angelegenheit rasch vorantreiben, auch wenn einige dabei ihr Leben verlieren. Im Gegensatz zu einem friedlichen Referendum wird ein Bürgerkrieg unsere Streitkräfte, die Industrie und die Infrastruktur des Landes stark in Mitleidenschaft ziehen, aber er ist auch schneller und stellt sicher, dass wir unseren Willen anschließend mit mehr Nachdruck durchsetzen können."
expand_civil_fascism_support:0	"Zivile Unterstützung ausbauen"
army_support_TT:0	"Jedes Mal, wenn die Unterstützung der Armee erhöht wird, wird die Stärke der eigenen Fraktion im Bürgerkrieg um 10% erhöht, bis zu einer maximalen Gesamtstärke von 70%.\n"
ensure_general_loyalty_for_fascist_civil_war:1	"Sicherstellung der Loyalität der unteren Heeresleitung"
ensure_general_loyalty_for_fascist_civil_war_desc:0	"Es ist möglich, dass einige Generäle heimlich dem Faschismus zugeneigt sind. Wir müssen sie ansprechen und ihre Loyalität sicherstellen, wenn die Kämpfe beginnen."
siphon_equipment_stockpiles_for_fascist_civil_war_desc:0	"Indem wir die Ausrüstungsbestände der Nation abschöpfen, können wir ein kleines Waffenarsenal anlegen, das uns in unserem zukünftigen Kampf helfen wird."
formulate_surprise_attack_plan_for_fascist_civil_war:0	"Plan für einen Überraschungsangriff ausarbeiten"
formulate_surprise_attack_plan_for_fascist_civil_war_desc:0	"Der Feind hat keine Ahnung von dem bevorstehenden Unheil. Wir müssen dafür sorgen, dass dies auch so bleibt, und gleichzeitig unsere Schlachtpläne so ausrichten, dass wir das Überraschungsmoment maximal nutzen können."
rebuild_the_nation_fascism:0	"Bauen Sie die Nation wieder auf"
rebuild_the_nation_fascism_desc:0	"Nach dem Bürgerkrieg ist es nun an der Zeit, unsere zerstörte Nation wieder aufzubauen."
open_up_political_discourse_fascism:0	"Öffnung des politischen Diskurses"
hold_the_fascist_national_referendum:0	"Nationales Referendum abhalten"
hold_the_fascist_national_referendum_desc:0	"Mit ausreichender Unterstützung können wir jetzt sicher ein Referendum abhalten, um einen Regierungswechsel ohne Blutvergießen herbeizuführen."
democratic_on_the_rise:0	"Die Demokratie ist auf dem Vormarsch"
expand_civil_democratic_support:0	"Zivile Unterstützung ausbauen"
expand_civil_democratic_support_desc:1	"Wir müssen dafür sorgen, dass sich die Unterstützung für unsere Sache in der Bevölkerung weiter ausbreitet, und sie dazu ermutigen, die Autorität der derzeitigen Regierung öffentlich in Frage zu stellen. In dem Maße, in dem die Position der Regierung zunehmend geschwächt wird und die zivilen Unruhen zunehmen, wird es für uns leichter werden, unsere Ziele zu erreichen. Dies gilt vor allem dann, wenn diese Ziele im Gegensatz zu einem legalen Regierungswechsel ein eher... unheilvolles Mittel des Regimewechsels beinhalten."
army_support_for_democratic_civil_war:0	"Militärische Unterstützung ausbauen"
ensure_marshal_loyalty_for_democratic_civil_war:0	"Sicherstellung der Loyalität der oberen Heeresleitung"
ensure_marshal_loyalty_for_democratic_civil_war_desc:0	"Es ist möglich, dass einige Feldmarschälle heimlich für den Faschismus sind. Wir müssen sie ansprechen und ihre Loyalität sicherstellen, wenn die Kämpfe beginnen."
siphon_equipment_stockpiles_for_democratic_civil_war:0	"Ausrüstung abschöpfen"
ignite_the_democratic_civil_war:0	"Bürgerkrieg entfachen"
ignite_the_democratic_civil_war_desc:0	"Die Zeit ist gekommen, um den Sprung zu wagen. Alle Vorbereitungen, die wir für notwendig erachtet haben, wurden getroffen. Jetzt gibt es kein Zurück mehr."
rebuild_the_nation_democratic:0	"Wiederaufbau der Nation"
discredit_government_democratic:0	"Regierung in Misskredit bringen"
discredit_government_democratic_desc:0	"Indem wir auf die vielen Fehler unserer derzeitigen Regierung hinweisen, können wir die Menschen zum Nachdenken über die ideologischen Ursachen dieser Fehler anregen."
hold_the_democratic_national_referendum:0	"Nationales Referendum abhalten"
prepare_for_communist_civil_war:0	"Bereiten Sie sich auf einen Bürgerkrieg vor"
prepare_for_communist_civil_war_desc:1	"Wir haben keine Zeit, um auf die langsamen Veränderungen in den Köpfen der Menschen zu warten. Um ihrer selbst willen müssen wir die Angelegenheit rasch vorantreiben, auch wenn einige dabei ihr Leben verlieren. Im Gegensatz zu einem friedlichen Referendum wird ein Bürgerkrieg unsere Streitkräfte, die Industrie und die Infrastruktur des Landes stark in Mitleidenschaft ziehen, aber er ist auch schneller und stellt sicher, dass wir unseren Willen anschließend mit mehr Nachdruck durchsetzen können."
expand_civil_communist_support:0	"Zivile Unterstützung ausbauen"
ensure_general_loyalty_for_communist_civil_war:1	"Sicherstellung der Loyalität der unteren Armeekommandos"
ensure_general_loyalty_for_communist_civil_war_desc:0	"Möglicherweise hegen einige Generäle geheime Gefühle für die Demokratie. Wir müssen auf sie zugehen und ihre Loyalität sicherstellen, wenn die Kämpfe beginnen."
ensure_marshal_loyalty_for_communist_civil_war:0	"Sicherstellung der Loyalität der oberen Heeresleitung"
formulate_surprise_attack_plan_for_communist_civil_war:0	"Plan für einen Überraschungsangriff ausarbeiten"
formulate_surprise_attack_plan_for_communist_civil_war_desc:0	"Der Feind hat keine Ahnung von dem bevorstehenden Unheil. Wir müssen dafür sorgen, dass dies auch so bleibt, und gleichzeitig unsere Schlachtpläne so ausrichten, dass wir das Überraschungsmoment optimal nutzen können."
ignite_the_communist_civil_war:0	"Bürgerkrieg entfachen"
open_up_political_discourse_communist:0	"Öffnung des politischen Diskurses"
open_up_political_discourse_communist_desc:0	"Wir müssen die Akzeptanz abweichender Standpunkte in der Regierung fördern. Vielleicht wird es dadurch möglich sein, einen friedlichen Wandel in der Politik unseres Landes herbeizuführen."
discredit_government_communism:0	"Regierung in Misskredit bringen"
military_support_for_fascist_civil_war:0	"Hat militärische Unterstützung für den Bürgerkrieg.\n"
military_support_for_democratic_civil_war:0	"Hat militärische Unterstützung für den Bürgerkrieg.\n"
military_support_for_communist_civil_war:0	"Hat militärische Unterstützung für den Bürgerkrieg.\n"
blow_panama_canal:0	"Sprengung des Panamakanals"
blow_panama_canal_desc:0	"Wir können unseren Feinden die Nutzung des strategisch wichtigen Panamakanals nicht gestatten. Wir müssen daher mit den Vorbereitungen beginnen, um dem Kanal so viel gezielten Schaden zuzufügen, dass er für längere Zeit außer Betrieb bleibt. Dies wird es dem Feind erheblich erschweren, Schiffe vom Pazifik zum Atlantik und umgekehrt zu bewegen."
rebuild_suez_canal:0	"Reparatur des Suezkanals"
border_war_with_from:0	"Grenzkrieg mit [From.GetNameDef]"
MAN_banditry_category:0	"Banditentum"
MAN_banditry_category_desc:0	"Die Kwantung-Armee zeigt wenig Interesse daran, den Bewohnern der Mandschurei zu helfen, da sie es eher als militärische Besatzung denn als Aufbau einer Nation betrachtet. Die Regierung von Mandschukuo, so wie sie ist, hat von den Japanern nur wenige Mittel zur Aufrechterhaltung der Ordnung erhalten. In dieses Machtvakuum strömen alle Arten von Banditen: manchmal selbsternannte "Freiheitskämpfer", die im Namen abstrakter Ideale wie "nationale Befreiung" oder "proletarischer Internationalismus" morden und stehlen, aber häufiger ohne eine erklärte Ideologie, die ihre Übergriffe verschleiert."
PRC_border_clashes_desc:0	"Das Terrain in China zwingt jeden dazu, seine Schlachten sorgfältig auszuwählen. Das gibt uns die Möglichkeit, einige verwundbare Gebiete zu erobern, ohne in einen totalen Krieg zu verwickeln."
MAN_pacify_bandits_mission_explanation:0	"Halten Sie die Divisionen im Land für [?Root.MAN_maintain_control_timer|H0] Tage aufrecht, um die Banditen in der Region zu befrieden.\n"
