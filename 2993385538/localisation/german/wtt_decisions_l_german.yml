PRC_border_defense_south:0	"Verstärkung der südlichen Grenze"
PRC_border_defense_south_desc:0	"Die KMT und ihre Verbündeten, die Warlords, bleiben eine ernsthafte Bedrohung für uns. Wir müssen sicherstellen, dass unsere Streitkräfte für jede Offensive aus dem Süden bereit sind."
PRC_border_defense_west:0	"Verstärkung der westlichen Grenze"
PRC_border_defense_west_desc:0	"Dem Kriegsherrn Ma ist nicht zu trauen, wir tun gut daran, unsere Grenze im Norden zu befestigen, um für alle seine Tricks gewappnet zu sein."
