enable_ss_inf_art_units:0	"Aktiviert SS-Infanterie und Artillerieeinheiten"
enable_ss_inf_art_units_desc:0	"Dies schaltet SS-Infanterie- und Artillerie-Einheiten im Divisions-Designer frei, die vor 1941 erforscht wurden. Alles, was nach 1941 noch erforscht werden muss, wird nicht aktiviert. Diese werden nach der benötigten Forschung freigeschaltet.\nAb diesem Zeitpunkt kann der Spieler (DEUTSCH) seine eigenen Divisionen mit SS-Infanterie- und Artillerie-Einheiten erstellen."
