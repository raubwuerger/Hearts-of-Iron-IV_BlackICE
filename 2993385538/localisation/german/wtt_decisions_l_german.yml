JAP_reorginized_china_instatement2_desc:0	"Richten Sie ein reorganisiertes nationalistisches China ein, um lokale Angelegenheiten in den neu erworbenen chinesischen Staaten zu regeln. Dies wird die Auswirkungen von Partisanenaktivitäten stark reduzieren und Japan dazu bringen, den National Spirit §RLure-Them-In Guerillas§! zu vermeiden."
