SOV_relocate_industry_from_moscow_outskirts_2:0	"Verlagerung der Industrie aus Serpuchos-Podolsk "
SOV_relocate_industry_from_moscow_outskirts_2_desc:0	"Die Evakuierung der schweren Maschinen unserer Moskauer Fabriken in den Ural ist ein gewaltiges Unterfangen, aber es ist notwendig, um unsere Kriegsproduktion zu sichern."
SOV_relocate_industry_from_kharkov_desc:0	"Die Evakuierung der schweren Maschinen unserer Charkower Fabriken in den Ural ist ein gewaltiges Unterfangen, aber es ist notwendig, um unsere Kriegsproduktion zu sichern."
