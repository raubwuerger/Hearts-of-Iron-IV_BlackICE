CHI_industrial_evacuations_remove_IC:0	"Entfernen Sie alle §YZivilen Fabriken§!.\n"
CHI_industrial_evacuations_add_AF:0	"Hinzufügen von 75% der §YWaffenfabriken§! entfernt.\n"
CHI_industrial_evacuations_add_IC:0	"Hinzufügen von 75% der §YZivilen Fabriken§! entfernt.\n"
MAN_recruit_bandits_north_desc:0	"Jede Kugel, die für die Jagd auf Banditen verschwendet wird, ist eine weniger, die für den kommenden Kampf zur Verfügung steht. Anstatt unsere eigenen Untertanen zu bekämpfen, sollten wir ihnen eine Möglichkeit bieten, sich durch den Dienst am Kaiser zu rehabilitieren."
MAN_recruit_bandits_west:0	"Rekrutiert die westlichen Banditen"
MAN_recruit_bandits_west_desc:0	"Jede Kugel, die für die Jagd auf Banditen ausgegeben wird, ist eine weniger, die für den nächsten Kampf zur Verfügung steht. Anstatt unsere eigenen Untertanen zu bekämpfen, sollten wir ihnen eine Möglichkeit bieten, sich durch den Dienst am Kaiser zu rehabilitieren."
MAN_recruit_bandits_generic_desc:0	"Unsere Gefängnisse und Arbeitslager sind voll mit denen, die einst gegen uns gekämpft haben. Wir brauchen jeden Soldaten und jedes Gewehr für den Kampf um unsere Freiheit. Der Imperator könnte seine legendäre Barmherzigkeit und Gnade zeigen, indem er diesen Verbrechern die Möglichkeit gibt, sich durch ihren Dienst zu rehabilitieren."
MAN_release_bandits:0	"Lasst die Banditen frei"
MAN_release_bandits_desc:0	"Die ehemaligen Kriminellen und zwielichtigen Gestalten haben gezeigt, dass sie bereit sind, sich für ihren Imperator zu opfern, und können nun sicher wieder in die Gesellschaft entlassen werden."
MAN_disband_the_banners:0	"Auflösung der Banner"
MAN_disband_the_banners_desc:0	"Nach Beendigung ihres Dienstes können die Mandschu-Banner wieder nach Hause zu ihren Familien geschickt werden - bis sie wieder gebraucht werden."
MAN_fund_underground_gun_shops:0	"Unterirdische Werkstätten errichten"
MAN_divert_machine_tools:0	"Umleitung von Werkzeugmaschinen"
MAN_divert_machine_tools_desc:0	"Da wir die Eisenbahnen unter unserer Kontrolle haben, können wir dafür sorgen, dass einige Lieferungen von Werkzeugmaschinen durch einen "Verwaltungsfehler" "verloren" gehen."
MAN_prepare_to_seize_arms:0	"Beschlagnahme der japanischen Waffendepots vorbereiten"
MAN_can_prepare_more_tt:0	"Es können noch weitere Vorbereitungen getroffen werden, um zusätzliche Depots zu beschlagnahmen.\n"
