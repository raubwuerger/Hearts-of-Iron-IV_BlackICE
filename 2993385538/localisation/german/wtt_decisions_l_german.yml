GER_aid_hun_democratic_civil_war:0	"Eingreifen in den ungarischen Bürgerkrieg"
GER_aid_rom_democratic_civil_war:0	"Eingreifen in den rumänischen Bürgerkrieg"
GER_mefo_bills_category_desc:0	"Um unsere wachsende Rüstungsindustrie zu finanzieren und dies vor den Augen der Briten und Franzosen geheim zu halten, waren wir gezwungen, unsere Zahlungen in Form von Schuldscheinen an einen Bilanzträger zu leiten. Wenn wir unsere politischen Verbindungen nicht nutzen, um die Fälligkeit dieser Wechsel zu verlängern, werden wir gezwungen sein, sie zurückzuzahlen, und wir werden nicht mehr in den Genuss ihrer Vorteile kommen."
GER_mefo_bills_mission:0	"Fällige MEFO-Rechnungen"
GER_extend_mefo_bills:0	"MEFO-Rechnungen"
GER_extend_mefo_bills_desc:0	"Verlängern Sie die Fälligkeit der MEFO-Rechnungen um weitere 3 Monate, so dass wir weiterhin in den Genuss ihrer Vorteile kommen. Dadurch erhöhen sich jedoch auch die Kosten für unsere eventuellen Zahlungen."
GER_mefo_bills_effect_in_days:1	"Folgendes wird in [?Root.days_mission_timeout@GER_mefo_bills_mission|H0] Tagen passieren:\n"
GER_mefo_bills_extension_timer:0	"Vor dem Fälligkeitsdatum der MEFO-Rechnungen."
GER_renew_mefos:0	"MEFO-Rechnungen verlängern"
GER_renew_mefos_desc:0	"Die Reichsbank ist entscheidend für den Wiederaufbau und die Wiederbewaffnung unserer Nation. Es ist klar, dass wir bei unserer Entscheidung, unsere Schulden zu tilgen, einen Fehler gemacht haben, und wir sollten die MEFO-Rechnungen um ein paar Monate verlängern."
GER_military_buildup:0	"Militärische Aufrüstung"
GER_military_buildup_desc:0	"In der deutschen Wehrmacht vor und während des Zweiten Weltkriegs wurden Infanteriedivisionen im Rahmen einer bestimmten Aufstellungswelle oder Welle aufgestellt, die manchmal mit "Einberufung" übersetzt wird. Das System der Aufstellungswelle wurde Ende 1938 von der Wehrmacht übernommen. Die erste Welle waren Friedenseinheiten, es folgten 34 weitere Wellen bis zur 35. Welle im April 1945. Es gab verschiedene Arten von Divisionen, die durch die Aufstellungswelle organisiert wurden, darunter Infanterie-, Sicherheits-, Schatten- und Volksgrenadierdivisionen."
GER_case_anton:1	"Ausführen von Fall Anton"
GER_case_anton_desc:0	"Unser Marionettenstaat in Frankreich hat seinen Nutzen überlebt. Wir werden sofort mit der Integration in die [Root.GetName] beginnen, und wenn wir schnell genug vorgehen, können wir vielleicht sogar die Reste der französischen Flotte beschlagnahmen."
GER_case_red:0	"Fall Rot"
GER_operation_marita:0	"Unternehmen Marita"
legalize_fascism_party:0	"Faschismus legalisieren"
legalize_fascism_party_desc:0	""
ban_fascist_party_tt:1	"Veränderung der Popularität des Faschismus: §G-§![?.Root.party_popularity@fascism|%0G].\n"
ban_democratic_party:1	"Demokratische Parteien verbieten"
ban_communist_party:0	"Kommunistische Parteien verbieten"
ban_communist_party_desc:0	"Die Kommunistische Partei hat bei jeder Gelegenheit gegen die Regierung protestiert, Unzufriedenheit gesät und das Regieren erschwert. Es ist an der Zeit, gegen sie vorzugehen."
ban_communist_party_tt:1	"Veränderung in der Popularität der Kommunisten: §G-§![?.Root.party_popularity@communism|%0G].\n"
anti_fascist_raids_desc:0	"Im Interesse der langfristigen inneren Stabilität müssen wir gegen faschistische Elemente in unserem Land vorgehen. Ihr Einfluss ist zu groß und kann zu einem Problem für die Regierung werden."
anti_democratic_raids:0	"Antidemokratische Razzien"
anti_democratic_raids_desc:0	"Wir müssen gegen demokratische Elemente in unserem Land vorgehen, um die langfristige Stabilität im Land zu gewährleisten. Ihr Einfluss ist zu groß und kann zu einem Problem für den Staat werden."
anti_monarchist_raids_desc:0	"Wir müssen gegen monarchistische Elemente in unserem Land vorgehen, um die langfristige innere Stabilität zu gewährleisten. Ihr Einfluss ist zu groß und kann zu einem Problem für die Regierung werden."
anti_agrarianism_raids:0	"Anti-Agrar-Razzien"
anti_agrarianism_raids_desc:0	"Wir müssen im Interesse der langfristigen innenpolitischen Stabilität gegen agrarische Elemente in unserem Land vorgehen. Ihr Einfluss ist zu groß und kann zu einem Problem für die Regierung werden."
anti_neutrality_raids_desc:0	"Wir müssen gegen monarchistische Elemente in unserem Land vorgehen, um die langfristige innere Stabilität zu gewährleisten. Ihr Einfluss ist zu groß und kann zu einem Problem für die Regierung werden."
anti_conservatism_raids:0	"Anti-Konservative Razzien"
anti_liberalism_raids:0	"Antiliberale Razzien"
object_to_attaches:0	"Einspruch gegen Attaché"
object_to_attaches_desc:0	"Unsere Feinde erhalten ausländische Hilfe! Wir müssen energisch Einspruch erheben und die Entfernung aller Attachés fordern."
infrastructure_building_slot:0	"Regionweite industrielle Integration"
special_projects:0	"Besondere Projekte"
CHI_xian_fired:0	"Chinesische Staatsoberhäupter nach Xi'an eingeladen"
JAP_intervene_in_china_level_down:0	"In China intervenieren Stufe verringern"
JAP_conquer_china:0	"Eroberung Chinas"
JAP_release_korea:0	"Koreanische Unabhängigkeit"
JAP_southern_expansion:0	"Südliche Expansion"
JAP_sue_for_peace_MAN:0	"Biete Kapitulationsbedingungen für [From.GetNameDef]"
JAP_sue_for_peace_MAN_desc:0	"Wir haben unseren Einfluss auf das Festland verloren. Das Militär hält es für unwahrscheinlich, dass wir in der Lage sein werden, die verlorenen Gebiete zurückzugewinnen. Die zivile Regierung schlägt vor, dass wir uns um Bedingungen bemühen sollten, um zumindest unsere Souveränität über die Inseln zu behalten."
JAP_sue_for_peace_nuke:0	"Bedingungslose Kapitulation anbieten"
JAP_request_soviet_support:0	"Bitte um sowjetische Unterstützung"
JAP_request_soviet_support_desc:0	"Wir benötigen Unterstützung in unserem derzeitigen Bürgerkrieg, und die nächsten wahrscheinlichen Unterstützer unserer Sache sind die Sowjets in unserem Norden. Vielleicht könnten wir die südliche Halbinsel Sachalin gegen eine Gruppe sowjetischer Freiwilligendivisionen eintauschen."
