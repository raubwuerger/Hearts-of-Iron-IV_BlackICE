AI_TECH_LIST_TT:0			"Wir arbeiten an der Implementierung von KI-Tech-Listen, ähnlich einer Fokusliste, denen die KI bei ihrer Forschung folgen wird. Wir hoffen, dass dies die KI-Forschung auf ein anspruchsvolles Niveau bringt und gleichzeitig die KI dazu zwingt, die Forschungsplatzbeschränkungen zu nutzen.\n\n Wie können Sie uns nun helfen? Wenn Sie der Meinung sind, dass Ihre Forschungsauswahl gut ist, können Sie ein Spiel spielen und uns Ihre Forschungsauswahl senden! Zu diesem Zweck haben wir eine kleine Veranstaltung hinzugefügt, die die in Ihrem Land erforschten Technologien rettet, wenn Sie §YSpeichere Technologie§! ankreuzen. Wenn Sie auf §YDrucken§! klicken, werden sie in der Datei "documents/PDX/HOI4/logs/game.txt" ausgedruckt."
