do_215_bomber_equipment:0	" Do-215B Leichter Bomber"
do_215_bomber_equipment_1:0	"Dornier 215 B"
do_215_bomber_equipment_1_desc:0	"Die Dornier Do 215 war ursprünglich als Exportversion der Dornier Do 17Z vorgesehen, doch eine Reihe von Exemplaren diente in der Luftwaffe als leichter Bomber, Aufklärer und Nachtjäger. Das Flugzeug erhielt neue Motoren, die DB 601 Ba-Reihenmotoren, die die Flugleistung des Flugzeugs erheblich steigerten. Das Flugzeug wurde in begrenzter Stückzahl produziert."
do_217_k_bomber_equipment:0	"Do-217K Leichtbomber"
do_217_k_bomber_equipment_desc:0	"Leichte Bomber sind zweimotorige Bomber, die zum Angriff auf feindliche Boden- und strategische Ziele eingesetzt werden."
do_217_bomber_equipment_1_short:0	"Do 217 E Leichter Bomber"
tech_do_217_bomber_equipment_1:0	"Do 217 E"
do_217_bomber_equipment_2:0	"Dornier 217 K"
do_217_bomber_equipment_2_desc:0	"Die Dornier Do 217 erhielt ein neues, stromlinienförmiges Cockpit mit stufenlosem Design, das erstmals in der Heinkel He 111 P zum Einsatz gekommen war. Durch diese Konstruktion entfielen die separaten Windschutzscheiben für den Piloten, was die Sicht verbesserte. Das neue Design machte das Flugzeug aerodynamischer und zum schnellsten Modell der Do 217-Serie.\n\nVeraltete Dornier Do 217 E können zu Do 217 K umgerüstet werden."
tech_do_217_bomber_equipment_2_desc:0	" Angesichts des Erfolgs des Level-Bomber-Designs der Do 217 sollten unsere Ingenieure das Design perfektionieren, um die Leistung und die defensive Bewaffnung zu verbessern."
do_217_gb_bomber_equipment_1_short:0	"Do 217 K-2 Marinebomber (Lenkbombe)"
tech_do_217_gb_bomber_equipment_1:0	"Do 217 K-2 (Lenkbombe)"
do_317_bomber_equipment:0	"Do-317 Mittelstreckenbomber"
do_317_bomber_equipment_1:0	"Dornier 317"
do_317_bomber_equipment_1_desc:0	"Die Dornier Do 317 war Dorniers Entwurf für das Projekt "Bomber B"; es gab zwei Versionen: eine vereinfachte A-Variante und ein weiterentwickeltes B-Modell. Die B-Variante verfügte über ferngesteuerte Geschütztürme, eine höhere Bombenlast, verlängerte Tragflächen und ein leistungsfähigeres Triebwerk. Die Flugzeugzelle war für eine Druckkabine ausgelegt, doch Versuche ergaben, dass gegenüber der Do 217 kaum Leistungsgewinne erzielt wurden; die sechs Prototypen wurden daher mit dem Funkleitsender FuG 203 Kehl ausgerüstet und als Trägerplattformen für die Henschel-Hs-293-Schiffsabwehrraketen eingesetzt."
tech_do_317_bomber_equipment_1_desc:0	" Die Do 317 ist ein mittelschwerer Bomber, der als Nachfolger der Do 217 gedacht war."
tech_ju_89_bomber_equipment_1_desc:0	"Ab 1933 erkannte General Walther Wever die Bedeutung, die strategische Bombardements in einem bevorstehenden Krieg spielen würden. Wever nahm Gespräche mit Dornier und Junkers über die Entwicklung eines Langstreckenbombers auf. Die vorgeschlagene Bewaffnung des Flugzeugs umfasste zwei 20-mm- MG-FF-Kanonen, zwei 7,92-mm-MG-15-Maschinengewehre und eine Nutzlast von 1.600 kg. Erste Prototypen der Junkers Ju 89 erwiesen sich als vielversprechend, doch nach General Wevers Tod im Jahr 1936 bevorzugten seine Nachfolger bei der Luftwaffe jedoch Sturzbomber und Bodenunterstützung."
do_217_fritz_upgrade_desc:0	"Einbau der notwendigen Ausrüstung, um Bomber mit Lenkbomben auszustatten."
do_217_engine_upgrade_desc:0	"Stärkere Motoren werden der Do 217 eine noch höhere Leistung verleihen."
do_217_gun_upgrade_desc:0	"Auf die Verteidigungsmaschinengewehre durch leistungsstärkere Waffen aufrüsten."
do_217_range_upgrade_desc:0	"Durch den Austausch von Bomben gegen Treibstofftanks können wir die Reichweite der Do 217 auf Kosten der Angriffskraft verlängern."
do_217_bombs_upgrade_desc:0	"Zusätzliche Bomben erhöhen die Angriffskraft unseres Flugzeugs."
do_217_armor_upgrade_desc:0	"Zusätzliche Panzerung schützt unser Flugzeug auf Kosten der Flugleistung."
do_217_k_engine_upgrade_desc:0	"Rüsten Sie die Motoren auf den DB 603A auf, um die Flugleistung zu steigern."
do_217_k_guns_upgrade_desc:0	"Leistungsstärkere Verteidigungsbewaffnung."
he_177_cannon_upgrade_desc:0	"Rüsten Sie die Verteidigungsgeschütze unseres Flugzeugs auf."
ju_89_bomber_equipment_desc:0	"Schwere Bomber sind Bomber mit vier oder mehr Triebwerken, die in erster Linie zum Angriff auf strategische Ziele des Feindes eingesetzt werden."
ju_89_bomber_equipment_1_short:0	"Ju 89 Schwerer Bomber"
he_177_bomber_equipment:0	"He-177A1 Schwerer Bomber"
he_177_bomber_equipment_1:0	" Heinkel 177 "Greif" A-1"
he_177_bomber_equipment_1_desc:0	"Die Heinkel He 177 wurde als Langstreckenbomber nach General Wevers Prinzip konzipiert, das Uralgebirge angreifen zu können. Im Gegensatz zu anderen Langstreckenbombern wurde die He 177 von zwei DB 606-Motoren angetrieben, die jeweils 2.000 PS leisteten. Diese Motoren waren neu und hatten zahlreiche Anlaufschwierigkeiten, wie zum Beispiel das Entzünden, was dem Flugzeug den Spitznamen "Reichsfeuerzeug" einbrachte . Trotz einer Reihe technischer Schwierigkeiten und vielfältiger Einsatzzwecke wurde die He 177 1942 in Dienst gestellt, war jedoch weiterhin von Problemen geplagt."
wever_bomber_equipment_desc:0	"Schwere Bomber sind vier- oder mehrmotorige Bomber, die in erster Linie zum Angriff auf strategische Ziele des Feindes eingesetzt werden."
