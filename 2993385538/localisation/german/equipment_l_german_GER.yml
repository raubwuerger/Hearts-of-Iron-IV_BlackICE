do_17_night_fighter_equipment:0	"Do-17Z-Nachtjäger"
do_17_night_fighter_equipment_1:0	"Dornier Do 17 Z-10"
do_17_night_fighter_equipment_1_desc:0	" Der Erfolg der Dornier Do 17 Z als Bomber war jedoch nur von kurzer Dauer; es wurden Entwürfe angefertigt, um das neue Flugzeug mit einer massiven Nase aus einer Junkers Ju 88 auszustatten, eine 20-mm-MG-FF-Kanone sowie drei 7,92-mm-MG17 hinzuzufügen und das Flugzeug in einen Nachtjäger umzuwandeln. Der Nachtjäger hatte drei Besatzungsmitglieder, verfügte über einen besseren Panzerschutz und war mit zusätzlichen Treibstofftanks ausgestattet."
ju_88_c6b_night_fighter_equipment_desc:0	"Die Junkers Ju 88 C-Serie war als Jagdbomber und schwerer Bomber konzipiert, indem feste, nach vorne feuernde Geschütze wie eine 20-mm-MG-FF-Kanone und drei 7,92-mm-MG17-Maschinengewehre hinzugefügt wurden. Die ersten Varianten wurden aus früheren A-Varianten (Bomber) umgebaut. Die Ju 88 C-Serie wurde durch ein FuG 202 Lichtenstein BC-Abfangradar im niedrigen UHF-Bereich weiter modifiziert. Zu den weiteren Modifikationen gehörte der Einbau von zwei zusätzlichen 20-mm-MG-FF-Kanonen."
ju_88_c6b_night_fighter_equipment_1_short:0	"Ju 88 C-6b Nachtjäger"
