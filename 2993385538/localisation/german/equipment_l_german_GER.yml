bv_238_equipment:0	"Bv-238 Flugboot"
bv_238_equipment_1:0	"Blohm & Voss 238"
bv_238_equipment_1_desc:0	"Die Blohm & Voss Bv 238 war ein gigantisches Flugboot, das voll beladen 100 Tonnen wog. Das Flugzeug wurde von sechs flüssigkeitsgekühlten DB 603-Motoren angetrieben. Es war mit einer breiten Palette an Bewaffnung ausgestattet, darunter zwanzig 13-mm-MG131 und zwei 20-mm-MG151/20-Maschinenkanonen. Die Nutzlast umfasste zwanzig 250-kg-Bomben und vier 1.000-kg-Bomben oder eine Kombination aus zwei 1.200-kg-Torpedos, vier Henschel Hs 293-Raketen oder zwei 1.000-kg-BV 143-Gleitbomben. Für die Besatzung des Flugzeugs waren zwölf Mann erforderlich. Als Landvariante wurde die Bv 250 für Transport-, Langstreckenbomber- und transatlantische Aufklärungsaufgaben vorgeschlagen. "
he_46_scout_equipment_1:0	"Heinkel 46 (Recon)"
he_46_scout_equipment_1_desc:0	"Ein speziell für die Fotoaufklärung entwickeltes Flugzeug. Verlässt sich in erster Linie auf Geschwindigkeit und Tarnung, um zu überleben, und wird in einem direkten Luftkampf in der Regel unterliegen."
he_70_scout_equipment_1:0	"Heinkel 70 F"
he_70_scout_equipment_1_desc:0	"Die Heinkel He 70 wurde ursprünglich als Post- und schnelleres Passagierflugzeug konzipiert, doch ihre Karriere als Verkehrsflugzeug war nur von kurzer Dauer. Das Flugzeug diente zunächst als Bomber, obwohl seine Nutzlast minimal war, und während des Spanischen Bürgerkriegs wurde es für Aufklärungsflüge eingesetzt. Aufgrund seiner Geschwindigkeit eignete es sich hervorragend für diese Art von Missionen, verfügte jedoch über kaum Verteidigungsmöglichkeiten, um sich vor feindlichen Flugzeugen zu schützen.\nVeraltete Heinkel He 70 E Fast Bombers können zu Heinkel He 70 F Aufklärungsflugzeugen umgebaut werden."
hs_126_scout_equipment_1:0	"Henschel 126 (Aufklärer)"
hs_126_scout_equipment_1_desc:0	"Die Henschel Hs 126 war ein zweisitziges Aufklärungs- und Beobachtungsflugzeug, das von der Henschel Hs 122 abgeleitet wurde. Das Flugzeug wurde für seine kurze Startstrecke und niedrige Geschwindigkeit gelobt, was zu jener Zeit von Vorteil war. Das Flugzeug diente als Kurzstrecken-Aufklärer und Beobachter, bevor es durch Mehrzweckflugzeuge wie die Fieseler Fi 156 Storch und die Mittelstrecken-Focke-Wulf Fw 189 Uhu ersetzt wurde."
do_17_scout_equipment_1:0	"Dornier 17 P"
do_17_scout_equipment_1_desc:0	"Die Dornier Do 17 begann ihre Karriere als schneller Bomber, wurde jedoch aufgrund ihrer geringen Nutzlast, kurzen Reichweite und langsamen Geschwindigkeit um 1940 aus dem Frontdienst genommen. Da Bedarf an Aufklärungsflugzeugen bestand, wurde die P-Variante mit leistungsstärkeren BMW 132N-Sternmotoren entwickelt, die die Leistung und Reichweite steigerten und den Treibstoffverbrauch senkten. Die Kameras des Flugzeugs wurden vom Cockpit aus ferngesteuert.\nAusgemusterte Dornier Do 17 E und M können zu Dornier Do 17 P umgebaut werden."
ju_86_scout_equipment_1:0	"Junkers 86 R"
ju_86_scout_equipment_1_desc:0	"Obwohl als Bomber unwirksam, erhielt die Junkers Ju 86 bald eine größere Spannweite, eine Druckkabine, einen neuen Junkers Jumo 207A-1-Turbomotor und eine zweiköpfige Besatzung. Das Flugzeug konnte eine Höhe von 12.000 Metern erreichen. Aufgrund seiner großen Flughöhe eignete sich das Flugzeug hervorragend für die Fernaufklärung. Die spätere Serie, die Ju 86 R, verwendete noch größere Tragflächen und einen leistungsstärkeren Motor und erreichte eine Dienstgipfelhöhe von 16.000 Metern.\n\nVeraltete Junker Ju 86 können zu Junker Ju 86 R umgerüstet werden."
fw_189_scout_equipment_1:0	"Focke-Wulf 189"
fw_189_scout_equipment_1_desc:0	"Die Focke-Wulf 189 wurde als dreisitziges Aufklärungsflugzeug mit guter Rundumsicht konzipiert, um die Bodentruppen zu unterstützen und die Henschel Hs 126 zu ersetzen. Das Flugzeug war mit zwei Argus As 410-Motoren ausgestattet, die nicht so gefragt waren wie die DB 600 und DB 601. Das Flugzeug war relativ langsam und wirkte zerbrechlich, verfügte jedoch über eine hervorragende Manövrierfähigkeit in Kurven und konnte feindliche Jäger durch enge Kreise hinter sich lassen."
ju_88_d_scout_equipment_1:0	"Junkers 88 D"
ju_88_d_scout_equipment_1_desc:0	"Es bestand Bedarf an Fern- und Höhenluftaufklärung. Die Ju 88 D verwendete A-4-Rümpfe mit leeren Bombenschächten. Der einzige Unterschied bestand in der Verwendung von Metallpropellern anstelle von Holzpropellern.\n\nVeraltete Ju 88 A-4 können zu Ju 88 D umgebaut werden."
ju_88_t_scout_equipment_1:0	"Junkers 88 T"
ju_88_t_scout_equipment_1_desc:0	"Die Junkers Ju 88 T basierte auf der Ju 88S-Serie und verfügte über eine glatte, verglaste Nase sowie einen zusätzlichen GM-1-Lachgas-Booster zur Geschwindigkeitssteigerung. Die T-Serie war eine dreisitzige Aufklärungsversion, und die Bombenschächte wurden mit zusätzlichen Treibstoff- und GM-1-Lachgas-Tanks ausgestattet.\n\nAufgrund erheblicher Änderungen können veraltete Ju 88 nicht zu Ju 88 T umgerüstet werden."
