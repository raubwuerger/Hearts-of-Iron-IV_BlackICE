bv_155_fighter_equipment:0	"Bv-155 Interceptor"
bv_155_fighter_equipment_1:0	"Blohm & Voss 155"
bv_155_fighter_equipment_1_desc:0	"Die Entwicklung der Bv 155 begann unter Messerschmitt, das einen einsitzigen einplätzigen Trägerjäger entwarf. 1943 übernahm Blohm & Voss die Konstruktion unter der Bedingung, dass völlige Gestaltungsfreiheit gewährt wurde. Die Ingenieure kamen zu dem Schluss, dass eine vollständige Neukonstruktion erforderlich sei. Das Flugzeug wurde als Höhenabfangjäger mit einem DB 603U-Motor mit Leistungs-Turbokompressor neu konzipiert. Die Dienstgipfelhöhe des Flugzeugs betrug 16.950 m. Die Bewaffnung durchlief verschiedene Entwürfe, darunter ein oder zwei 30-mm-MK-108-Kanonen sowie zwei 20-mm-MG-151/20-Kanonen. Das Flugzeug kam nie zum Kampfeinsatz."
tech_bv_155_fighter_equipment_1_desc:0	"Die Bf 155 ist ein Höhenjäger."
bf_110_fighter_equipment_desc:0	"Schwere Jäger sind zweimotorige Flugzeuge, die für Angriffe auf Luft- und Bodenziele ausgelegt sind."
bf_110_fighter_equipment_0_short:0	"Bf 110 A – Schwerer Jäger"
bf_110_fighter_equipment_1:0	"Bayerische Flugzeugwerke 110 B"
bf_110_fighter_equipment_1_desc:0	"Das Reichsluftfahrtministerium suchte nach einem Mehrzweckjäger mit großer Reichweite, internem Bombenschacht, drei Sitzen, zwei Motoren und einer Kanonenbewaffnung. Willy Messerschmitt reagierte darauf mit einem Entwurf, bei dem der Bombenschacht weggelassen und die Bewaffnung des Flugzeugs verstärkt wurde. Die Bf 110 übertraf die Konkurrenten Focke-Wulf und Henschel.  Das erste Modell, die Bf 110 A, war mit DB 600-Motoren untermotorisiert und nur mit vier 7,92-mm-MG 17 bewaffnet. Die Bf 110 B verfügte über denselben Motor, war jedoch mit vier MG 17 und zwei 20-mm-MG FF-Kanonen bewaffnet."
bf_110_c_fighter_equipment_desc:0	"Schwere Jäger sind zweimotorige Flugzeuge, die für Angriffe sowohl gegen Luft- als auch gegen Bodenziele durchzuführen. "
bf_110_c_fighter_equipment_1_short:0	"Bf 110 C Schwerer Jäger"
fw_187_fighter_equipment:0	"Fw-187 Schwerer Jäger"
fw_187_fighter_equipment_1:0	"Focke-Wulf 187"
fw_187_fighter_equipment_1_desc:0	"Die Focke-Wulf Fw 187 Falke (Falke) wurde von Kurt Tank als zweimotoriger Hochleistungsjäger ähnlich der Bf 110 entworfen. Die Luftwaffe betrachtete sie jedoch als Zwischenmodell zwischen der Bf 110 und ihrem geplanten Nachfolger, der Me 210. Die Bewaffnung des Flugzeugs sah vier 7,92-mm-MG17-Maschinengewehre und zwei 20-mm-MG-FF-Kanonen vor. Es wurden nur neun Prototypen gebaut."
bf_110_d_fighter_equipment_desc:0	"Schwere Jäger sind zweimotorige Flugzeuge, die für Angriffe sowohl auf Luft- als auch auf Bodenziele ausgelegt sind. "
bf_110_d_fighter_equipment_1_short:0	"Bf 110 D Schwerer Jäger"
bf_110_e_fighter_equipment:0	"Bf-110E Schwerer Jäger"
bf_110_e_fighter_equipment_1:0	"Bayerische Flugzeugwerke 110 E"
bf_110_e_fighter_equipment_1_desc:0	": Die Bf 110 E wurde als Jagdbomber konzipiert, indem unter den Tragflächen Halterungen angebracht wurden, die es dem Flugzeug ermöglichten, vier 50-kg-Bomben zu tragen, sowie eine Halterung in der Mitte des Rumpfes für eine 500-kg-Bombe. Der Motor, Panzerung und Rumpf wurden verbessert; viele Piloten empfanden das Flugzeug jedoch als langsam, träge und als eine der schlechtesten Varianten der Baureihe.\n\nVeraltete BF110Ds können zu BF110Es umgerüstet werden."
bf_110_f_fighter_equipment_1_short:0	"Bf 110 F Schwerer Jäger"
me_210_fighter_equipment:0	"Me-210 Schwerer Jäger"
me_210_fighter_equipment_1:0	"Messerschmitt 210"
me_210_fighter_equipment_1_desc:0	"Die Konstruktionsarbeiten an der Me 210, dem Nachfolger der Bf 110, begannen bereits, bevor die Serienversion der Bf 110 überhaupt ihren Erstflug absolviert hatte. Obwohl viele der gleichen Konstruktionskonzepte übernommen wurden, verfügte die Me 210 über einen kürzeren Rumpfbereich, einen internen Bombenschacht und Tragflächen, die für höhere Reisegeschwindigkeiten ausgelegt waren. Angetrieben von DB 601F-Motoren konnte das Flugzeug fast so schnell fliegen wie einige einmotorige Jagdflugzeuge. Eine Reihe von Konstruktionsmängeln verhinderte jedoch, dass die Me 210 vor 1943 in Dienst gestellt werden konnte."
bf_110_g_fighter_equipment_desc:0	"Schwere Jäger sind zweimotorige Flugzeuge, die für Angriffe auf Luft- und Bodenziele ausgelegt sind."
bf_110_g_fighter_equipment_1_short:0	"Bf 110 G Schwerer Jäger"
