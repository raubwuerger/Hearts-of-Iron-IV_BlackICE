tech_me_109_fighter_equipment_2:0	"Bf 109 C"
me_109_fighter_equipment_2:0	"Bayerische Flugzeugwerke 109 C"
me_109_fighter_equipment_2_desc:0	"Die BF 109 C erhielt verstärkte Tragflächen, die den Einbau von zwei zusätzlichen MG 17 ermöglichten, wodurch sich die Gesamtbewaffnung auf vier erhöhte. Zudem wurde ein leistungsstärkerer Motor, der Jumo 210G mit Direkteinspritzung, eingebaut.\nVeraltete BF109Bs können zu BF109Cs umgerüstet werden."
me_109_early_fighter_equipment_desc:0	"Jäger sind Flugzeuge, die dazu bestimmt sind, feindliche Flugzeuge zu zerstören"
me_109_early_fighter_equipment_1_short:0	"Bf 109 D Jagdflugzeug"
me_109_early_cannon_upgrade:0	"Flügelkanone"
me_109_early_engine_cannon_upgrade:0	"Triebwerkskanone"
me_109_prepare_daimler_upgrade:0	"Triebwerksaufhängung"
me_109_e_engine_upgrade:0	"Triebwerk DB 601 A"
tech_me_109_early_fighter_equipment_1:0	"Bf 109 D"
me_109_mid_fighter_equipment:0	"Bf-109E-Jäger"
me_109_mid_fighter_equipment_1:0	"Bayerische Flugzeugwerke 109 E"
me_109_mid_fighter_equipment_1_desc:0	"Da der neue DB 601A-Motor nun in größerem Umfang verfügbar war, wurde die Bf 109 E mit dem neuen Triebwerk ausgestattet, was die Leistung des Flugzeugs erheblich steigerte. Um dem längeren und größeren Motor Rechnung zu tragen, wurde die Flugzeugzelle grundlegend überarbeitet, um die Kühlung des Motors zu verbessern.  Einige Varianten der Bf 109 E wurden zu den ersten einsatzfähigen Jagdbombern mit einem ETC-500-Bombenhalter, der eine 250-kg-Bombe oder vier 50-kg-Bomben tragen konnte.\n\nAufgrund erheblicher Änderungen können veraltete Bf 109 nicht zu Bf 109 E umgerüstet werden."
me_109_mid_cannon_upgrade_desc:0	"Ersetzen Sie die beiden an den Tragflächen montierten Maschinengewehre durch 20-mm-MG-FF-Kanonen."
me_109_mid_mgffm_upgrade_desc:0	"Rüsten Sie die beiden an den Tragflächen montierten 20-mm-MG-FF-Kanonen auf 20-mm-MG-FF/M-Kanonen auf."
me_109_mid_armor_upgrade_desc:0	"Zusätzliche Panzerung ermöglicht es unserem Flugzeug, mehr Schaden durch den Feind zu überstehen."
me_109_mid_bomb_upgrade_desc:0	"Einbau eines ETC-500-Bombenhalters zum Transport von Bomben. Das Flugzeug kann bis zu 250 kg Bomben aufnehmen."
me_109_mid_injection_upgrade_desc:0	 "Einbau eines Lachgas-Einspritzsystems für kurze Leistungsschübe."
me_109_mid_engine_upgrade_desc:0	"Für mehr Leistung können wir den Motor gegen den DB 601N austauschen."
tech_me_109_mid_fighter_equipment_1_desc:0	"Wir verfügen nun über eine ausreichende Anzahl an Daimler-Benz-Motoren, um mit der Produktion einer Version der Bf 109 zu beginnen, die diesen Motor verwendet."
me_109_e_droptanks_upgrade_desc:0	"Die 109 wurde lange Zeit durch ihre geringe Reichweite beeinträchtigt. Unsere Ingenieure glauben, dass sie dies möglicherweise mit Zusatztanks beheben können."
me_109_t_fighter_equipment_1:0	"Bayerische Flugzeugwerke 109 T"
me_109_t_fighter_equipment_1_desc:0	"Angesichts des im Bau befindlichen Graf Zeppelin war der Bedarf an einem modernen, trägergängigen Jagdflugzeug von größter Bedeutung. Tests mit den Landvarianten der Bf 109 B, C, D und E hatten gezeigt, dass die Tragflächen des Flugzeugs vergrößert werden mussten und dass ein Fanghaken sowie Katapultvorrichtungen erforderlich waren. Die Konstruktionsarbeiten führten zur Entwicklung der Bf 109 T, wobei die Variante T-2 in ihren Fähigkeiten der Bf 109 E ähnelte. Als jedoch der Bau der Graf Zeppelin gestrichen wurde, ließ das Interesse an der Bf 109 T nach, und die vorhandenen Flugzeuge wurden in Norwegen stationiert, was der Fähigkeit des Flugzeugs, auf kurzen Landebahnen zu starten und zu landen, entgegenkam."
tech_me_109_t_fighter_equipment_1_desc:0	"Wenn wir die Graf Zeppelin bauen wollen, müssen wir einige Jagdflugzeuge entwickeln, die von ihr aus fliegen können. Doppeldecker sind in dieser Hinsicht nicht mehr akzeptabel."
me_109_late_fighter_equipment_desc:0	"Jäger sind Flugzeuge, die dazu bestimmt sind, feindliche Flugzeuge zu zerstören"
me_109_late_fighter_equipment_1_short:0	"Bf 109 F Jäger"
me_109_late_fighter_equipment_2:0	"Bayerische Flugzeugwerke 109 F-4"
me_109_late_fighter_equipment_2_desc:0	"Um den Bedenken des Piloten hinsichtlich der mangelnden Feuerkraft Rechnung zu tragen, wurde die Motorkanone durch ein neues 20-mm-Mauser-MG 151/20 mit 200 Schuss ersetzt. Zusätzliche Verbesserungen an Motor und Propeller verliehen dem Flugzeug eine höhere Geschwindigkeit und bessere Leistung in größeren Höhen.\n\nVeraltete BF109Fs können zu BF109F-4 umgerüstet werden. "
me_109_late_fighter_equipment_3_short:0	"Bf 109 G Fighter"
me_109_late_fighter_equipment_4:0	"Bayerische Flugzeugwerke 109 G-14"
me_109_late_fighter_equipment_4_desc:0	"Die Bf 109 G-14 war ein Versuch, die Produktion der G-Serie zu standardisieren, und übernahm viele der bisherigen Merkmale wie den DB 605A-Motor, die verbesserte Bewaffnung, ein besseres Cockpit und verbesserte Kommunikationsmöglichkeiten. Der Versuch der Standardisierung schlug fehl, hatte jedoch keinen Einfluss auf die Kampffähigkeiten.\n\nVeraltete BF 109 G können zu BF 109 G-14 umgerüstet werden."
me_109_late_fighter_equipment_5_short:0	"Bf 109 K Jäger"
