ju_290_bomber_equipment:0	"Ju-290 Marinebomber"
ju_290_bomber_equipment_1:0	"Junkers 290 A-2"
ju_290_bomber_equipment_1_desc:0	"Die Junkers Ju 290 wurde vom viermotorigen Zivilflugzeug Ju 90 abgeleitet, das bis zu 40 Passagiere befördern konnte. Das Flugzeug sollte die schwerfällige Focke-Wulf Fw 200 Condor ersetzen, das sich als anfällig gegenüber feindlichen Flugzeugen erwiesen hatte und über eine schwache Flugzeugzelle verfügte. Die Ju 290 kam aufgrund von Modifikationen zur Verteidigung nur langsam vom Band. Das Flugzeug war mit dem Suchradar FuG 200 Hohentwiel im niedrigen UHF-Band ausgestattet und konnte feindliche Konvois aus einer Entfernung von bis zu 80 km orten. Die Ju 290 wurde als Langstreckentransporter nach Japan in Betracht gezogen, führte jedoch nie einen solchen Einsatz durch. Für Hitler wurde eine spezielle Variante entwickelt, deren Abteil über eine 12-mm-Panzerung, 50-mm-Panzerglas sowie eine spezielle Notluke mit einem in den Sitz integrierten Fallschirm."
ju_290_gb_bomber_equipment_desc:0	"Marinebomber sind Flugzeuge, die dazu bestimmt sind, feindliche Marineziele aufzuspüren und zu zerstören."
ju_290_gb_bomber_equipment_1_short:0	"Ju 290 A-7"
ju_290_guns_upgrade:0	"Kanonen"
ju_52_bomber_equipment:0	"Ju-52/3mg Mittelstreckenbomber"
ju_52_bomber_equipment_1:0	"Junkers 52/3mg"
ju_52_bomber_equipment_1_desc:0	" Obwohl ursprünglich als Transportflugzeug konzipiert, wurden Bomberversionen der Ju 52 aufgrund der unerwarteten Lücke, die das problematische Do 11/13/23-Programm hinterlassen hatte, in den Dienst gestellt."
tech_ju_52_bomber_equipment_1_desc:0	"Umrüstung der Ju 52 zum leichten Bomber."
ju_52_bomb_upgrade_desc:0	"Transportieren Sie zusätzliche Nutzlast anstelle von Treibstoff. Dies verringert die Reichweite des Flugzeugs."
ju_52_gun_upgrade_desc:0	"Durch die Aufrüstung der Verteidigungsbewaffnung wird die Ju 52 weniger anfällig für feindliche Flugzeuge."
ju_52_engine_upgrade_desc:0	"Die Aufrüstung der Triebwerke verleiht unserem Flugzeug eine verbesserte Leistung. "
he_46_equipment_desc:0	"Nachtstörflugzeuge werden eingesetzt, um Störangriffe auf feindliche Truppen durchzuführen."
he_46_equipment_1_short:0	"He 46 C CAS"
he_46_gun_upgrade:0	"Kanonen"
he_46_engine_upgrade:0	"Triebwerk"
he_46_cowling_upgrade:0	"Motorhaube"
tech_he_50_equipment_1:0	"Heinkel 50 A"
he_50_equipment:0	"He-50A Nachtstörflugzeug"
he_50_equipment_1:0	"Heinkel 50 A"
he_50_equipment_1_desc:0	"Die Heinkel He 50 entstand auf Wunsch der Kaiserlich Japanischen Marine, die ein Flugzeug suchte, das den Spezifikationen eines zweisitzigen Sturzkampfbombers entsprach, 250 kg Bomben tragen konnte, von Katapulten gestartet wurde und sowohl mit Rad- als auch mit Schwimmerfahrwerk ausgestattet sein sollte. Das Flugzeug wurde zunächst auf Ausbildungsschulen beschränkt, bis es schließlich bei nächtlichen Störflügen an der Ostfront zum Einsatz kam."
he_50_cas_upgrade_desc:0	"Durch den Wegfall des zweiten Besatzungsmitglieds können wir die Bombenlast des Flugzeugs erhöhen."
he_45_equipment_desc:0	"Flugzeuge für nächtliche Störflüge werden eingesetzt, um feindliche Truppen zu stören."
he_45_equipment_1_short:0	"He 45 C CAS"
he_51:0	"He 51"
tech_he_51_equipment_1_desc:0	"Die Heinkel He 51 war ein einsitziger Doppeldecker-Jäger und eine Weiterentwicklung der Heinkel He 49. Das Flugzeug war mit zwei 7,92-mm-MG17 bewaffnet. Die Heinkel He 51 A war bereits bei ihrer Indienststellung veraltet, sodass das Design zur He 51B modifiziert wurde. Im Spanischen Bürgerkrieg erwies sich das Flugzeug als erfolgreich gegen ältere Doppeldecker der republikanischen Luftwaffe, hatte jedoch Schwierigkeiten gegen neuere Konstruktionen. Das Flugzeug wurde schließlich auf Bodenangriffe beschränkt.\n\nVeraltete Heinkel He 51 A können zu He 51B und He 51C CAS umgerüstet werden."
##### |___ KY023219___|„Die He 51 ist ein Doppeldecker-Kampfflugzeug.“
he_51_equipment_1_short:0	"He 51 A Fighter"
he_51_equipment_2:0	"Heinkel 51 B"
he_51_equipment_2_desc:0	"Die He 51 ist ein Doppeldecker-Kampfflugzeug."
tech_he_51_equipment_3_desc:0	"Die He 51 ist ein Doppeldecker-Jagdflugzeug. Die C-Version wurde für leichte Bodenangriffe umgerüstet."
he_51_equipment_3_short:0	"He 51 C Mehrzweck"
he_51_b_upgrade:0	"Zusatztank"
he_51_bomb_upgrade:0	"Bomben"
he_51_b2_s3_upgrade:0	"Schwimmer"
ar_68_equipment:0	"Ar-68-Jäger"
ar_68_equipment_1:0	 "Arado 68"
ar_68_equipment_1_desc:0	"Die Arado Ar 68 war ein einsitziger Doppeldecker-Jäger, bewaffnet mit zwei 7,92-mm-MG17 und in der Lage, sechs 10-Kilogramm-Splitterbomben zu tragen. Die Konstruktion sollte die Heinkel He 51 ersetzen. Mit einem leistungsstarken Junkers-Jumo-210-Motor verfügte das Flugzeug über eine beeindruckende Leistungsfähigkeit. Der Jäger kam im Spanischen Bürgerkrieg zum Einsatz, wo er jedoch der sowjetischen I-16 unterlegen war. Nach seiner Entlassung aus dem Frontdienst wurde das Flugzeug als Schulungsflugzeug genutzt."
ar_68_engine_upgrade_desc:0	"Rüsten Sie den Motor auf den BMW 132 auf, um die Flugleistung zu steigern."
ar_68_gun_upgrade_desc:0	"Rüsten Sie zwei zusätzliche Maschinengewehre ein."
tech_ar_68_equipment_1_desc:0	"Die Arado 68 ist ein fortschrittlicher Doppeldecker-Jäger."
ar_197_fighter_equipment_1_short:0	"Ar 197 Trägerjäger"
tech_ar_197_fighter_equipment_1:0	"Ar 197"
ta_152_fighter_equipment:0	"Ta-152C1 Mehrzweckjäger"
ta_152_fighter_equipment_1:0	"Focke-Wulf Ta 152 C-1"
ta_152h_fighter_equipment:0	"Ta-152H Abfangjäger"
ta_152_fighter_equipment_2:0	"Focke-Wulf Ta 152 H-1"
ta_152_fighter_equipment_2_desc:0	"Die Fw 190 war ein gutes Flugzeug, litt jedoch unter Leistungseinbußen oberhalb von 6.100 Metern. Die Ta 152 war eine Weiterentwicklung der Fw 190, die darauf abzielte, die Leistung in großen Höhen zu steigern. Der Rumpf wurde verlängert, die Tragflächen wurden erheblich vergrößert, was die Leistung in großen Höhen auf Kosten der Geschwindigkeit in niedrigeren Höhen steigerte. Ein Druckcockpit wurde hinzugefügt. Das Flugzeug war mit einer 30-mm-MK-108-Kanone und zwei 20-mm-MG151/20-Kanonen bewaffnet."
tech_ta_152_fighter_equipment_2_desc:0	"Die Leistung der Fw 190 D in großen Höhen reicht nicht aus; es wird ein neues Flugzeug benötigt, um Bomber in großen Höhen zu bekämpfen."
ta_152_engine_upgrade_desc:0	"Während die Ta 152 für den Einsatz des Jumo 215 E-Triebwerks konzipiert war, wird der Daimler-Benz DB 603 eine verbesserte Leistung in großen Höhen bieten."
ta_152_gun_upgrade_desc:0	"Ermöglicht den Transport von 500 kg Bomben."
hs_123_equipment_desc:0	"Nachtstörflugzeuge werden eingesetzt, um Störangriffe auf feindliche Truppen durchzuführen."
hs_123_equipment_1_short:0	" Hs 123 A-1 CAS"
tech_hs_123_equipment_1:0	"Henschel 123"
tech_do_11_bomber_equipment_1:0	"Dornier 11"
do_11_bomber_equipment:0	"Do-11 Mittelstreckenbomber"
do_11_bomber_equipment_1:0	"Dornier 11"
do_11_bomber_equipment_1_desc:0	"Die Dornier Do 11 galt ursprünglich als schwerer Bomber, der bis zu 1.000 kg Bomben tragen konnte. Das Flugzeug zeichnete sich dadurch aus, dass es nur zwei Motoren und ein einziehbares Fahrwerk hatte; allerdings funktionierte das Fahrwerk oft nicht und blieb ausgefahren. Das Flugzeug war bei den Piloten unbeliebt, und nach mehreren Versuchen, es zu modifizieren und zu reparieren, entstand die Dornier Do 13. Die Do 13 erlitt zahlreiche Abstürze und ging nie in Serienproduktion."
do_23_bomber_equipment_1_short:0	"Do 23 Mittlerer Bomber"
he_59_bomber_equipment:0	"He-59 Marinebomber"
he_59_bomber_equipment_1:0	"Heinkel 59"
he_59_bomber_equipment_1_desc:0	"Die Heinkel He 59 wurde als Zivilflugzeug getarnt, diente jedoch als Torpedobomber und Aufklärungsflugzeug, das sowohl mit einem Radfahrwerk als auch mit zwei Schwimmern operieren konnte. Das Flugzeug war mit drei 7,92-mm-MG15-Maschinengewehren bewaffnet und konnte zwei 500-kg-, vier 250-kg-, zwanzig 50-kg- oder einen 800-kg-Torpedo. Das Flugzeug diente in der Anfangsphase des Krieges als Torpedobomber, bevor es als Schulungsflugzeug eingesetzt wurde."
ar_95_bomber_equipment_desc:0	"Marinebomber sind Flugzeuge, die dazu bestimmt sind, feindliche Seeziele aufzuspüren und zu zerstören."
ar_95_bomber_equipment_1_short:0	"Ar 95 Marinebomber"
fi_167_bomber:0	" Fi 167"
fi_167_bomber_equipment_desc:0	"Die Fieseler Fi 167 war ein Doppeldecker-Torpedobomber, der für den Einsatz vom Flugzeugträger Graf Zeppelin entwickelt wurde. Es handelt sich um einen trägergestützten Torpedobomber."
fi_167_bomber_equipment_1_short:0	" Fi 167 Trägerbomber"
he_66:0	"He 66"
he_66_equipment_desc:0	"Die Heinkel He 66 wurde als Träger-Sturzkampfbomber für Japan auf der Grundlage des Sturzkampfbombers He 50 entwickelt."
he_66_equipment_1_short:0	"He 66 Träger-CAS"
tech_me_155_fighter_equipment_1:0	"Me 155"
me_155_fighter:0	"Me 155"
me_155_fighter_equipment_desc:0	"Die Me 155 war ein Entwurf für einen trägergängigen Jäger auf Basis der Bf 109 G."
me_155_fighter_equipment_1_short:0	"Me 155 Trägerjäger"
ju_87_cv_equipment_3:0	"Junkers Ju 87 E"
ju_87_cv_equipment_3_desc:0	" Die Junkers Ju 87 E war ein Entwurf für eine verbesserte, trägergängige Version der Stuka. Die E-Serie verfügt über zusätzliche Panzerung, Flügelkanonen und verlängerte Flügelausleger.\n\nVeraltete Junkers Ju 87 D können zu Junkers Ju 87 E umgerüstet werden. "
ju_87_cv_equipment_4_short:0	"Ju 87 E-1 Trägerbomber"
tech_ju_87_cv_equipment_3:0	"Ju 87 E"
tech_ju_87_cv_equipment_4:0	"Ju 87 E-1"
transport_ju_52_equipment_1:0	"Junkers Ju 52/3m "Tante Ju""
transport_ju_52_equipment_1_desc:0	 "Die Junkers Ju 52 wurde von Ernst Zindel entworfen und verfügte über eine gewellte Duraluminium-Außenhaut, ein für die damalige Zeit seltenes Merkmal, das die Flugzeughaut verstärkte. Der Spitzname des Flugzeugs "Tante Ju" bedeutet Tante Ju oder Iron Annie. Ursprünglich als einmotoriges Flugzeug konzipiert, wurde es später als Dreimotormodell produziert. Das Hauptserienmodell, die Junkers Ju 52/3m, wurde als Passagierflugzeug mit 17 Sitzplätzen eingesetzt. Das Flugzeug wurde kurzzeitig als mittlerer Bomber eingesetzt und war bis in die 1980er Jahre bei zivilen Betreibern im Einsatz.\n\nAusgemusterte mittlere Bomber vom Typ Junker Ju 52/3mg können zu Transportflugzeugen vom Typ Junker Ju 52/3m umgebaut werden."
transport_he_111_h20_equipment_1_short:0	"He 111 H-20/R1 Transport"
do_wal_equipment:0	"Do-16 Flugboot"
do_wal_equipment_1:0	"Dornier 16"
do_wal_equipment_1_desc:0	"Die Dornier Do 16 J oder Wal (Wal) war ein zweimotoriges Flugboot, das mit drei Maschinengewehren bewaffnet war. Das Flugzeug diente als Postflugzeug, Transportflugzeug und half bei der Erforschung der arktischen Regionen. Im militärischen Einsatz diente das Flugzeug der Luft-See-Rettung und der Feuerleitung für große Schiffe."
do_18_equipment_desc:0	"Flugboote sind Patrouillenflugzeuge, die auch Einsätze zur Bekämpfung feindlicher Seeziele durchführen."
do_18_equipment_1_short:0	"Do 18 Flugboot"
do_18_gun_upgrade:0	"Kanonen"
do_18_cannon_upgrade:0	"Kanone"
do_j_napier_upgrade:0	"Triebwerke"
do_24_equipment:0	"Do-24-Flugboot"
do_24_equipment_1:0	"Dornier 24"
do_24_equipment_1_desc:0	"Die Dornier Do 24 war ein dreimotoriges Flugboot, das für die Seeüberwachung sowie Such- und Rettungsaktionen konzipiert war. Das Flugzeug wurde erstmals 1936 von der Königlich-Niederländischen Marine eingesetzt, bevor es von der Luftwaffe im Vergleich zur BV 138 von Blohm & Voss getestet wurde. Laut Dornier wurden dem Flugzeug im Laufe seiner Lebensdauer über 12.000 gerettete Menschen zugeschrieben."
do_24_gun_upgrade_desc:0	"Rüstet die Verteidigungsmaschinengewehre auf MG 131 auf."
do_24_cannon_upgrade_desc:0	"Rüstet eines der Verteidigungsmaschinengewehre auf eine 20-mm-Kanone auf."
do_24_fuel_upgrade_desc:0	"Das Mitführen von zusätzlichem Treibstoff erhöht die Reichweite unseres Flugzeugs auf Kosten der Flugleistung."
do_24_engine_upgrade_desc:0	"Rüstet die Motoren auf BMW Bramo 323R-2 auf."
do_24_engine2_upgrade_desc:0	"Rüstet die Motoren auf Wright-Cyclone R 1820-G105A auf."
bv_138_equipment_desc:0	"Flugboote sind Patrouillenflugzeuge, die auch Einsätze zur Bekämpfung feindlicher Seeziele durchführen."
bv_138_equipment_1_short:0	"Bv 138 Flugboot"
