conversion_td_equipment_1:0	" Panzerjäger 35 R (f) Lt-TD"
conversion_td_equipment_1_desc:0	"Einheitentyp: Umgebauter Panzerjäger. Ein Umbau des französischen Infanteriepanzers Renault R35 zu einem Panzerjäger unter Verwendung der 4,7-cm-Kanone des Panzerjägers I. Aufgrund der Eigenschaften des R35 sehr langsam. Bitte beachten Sie, dass diese Einheit nur durch Ereignisse erstellt werden kann. "
marder_conversion_td_equipment_1:0	"Marder I (L) Marder I auf Lorraine-Schlepper SdKfz 135"
marder_conversion_td_equipment_1_desc:0	"Einheitentyp: Umgebauter Panzerjäger. Ein Umbau des französischen Lorraine-Panzertransporteurs zu einem Panzerjäger mit einer 7,5-cm-Panzerabwehrkanone. Bitte beachten Sie, dass diese Einheit nur im Rahmen von Ereignissen erstellt werden kann."
marder_conversion_td_equipment_2:0	"Marder I auf Hotchkiss H39"
marder_conversion_td_equipment_2_desc:0	"Einheitentyp: Umgebauter Panzerjäger. Eine Umrüstung des französischen Hotchkiss H39-Panzers zum Panzerjäger mit einer 7,5-cm-Panzerabwehrkanone. Bitte beachten Sie, dass diese Einheit nur durch Ereignisse erstellt werden kann."
conversion_art_equipment_1:0	"Geschützwagen Mk.VI (e)"
conversion_art_equipment_1_desc:0	"Einheitentyp: Selbstfahrende Artillerie. Der Geschützwagen Mk.VI(e) ist eine Umrüstung zu selbstfahrender Artillerie auf der Basis erbeuteter britischer Vickers-Leichtpanzer, die mit alten 10,5-cm-Haubitzen ausgerüstet ist. Bitte beachten Sie, dass diese Einheit nur durch Ereignisse erstellt werden."
conversion_art_equipment_2:0	"Geschützwagen Lorraine-Schlepper (f)"
conversion_art_equipment_2_desc:0	"Einheitentyp: Der Geschützwagen Lorraine-Schlepper (f) ist eine selbstfahrende Artillerie. Ein selbstfahrender Artillerie-Umbau auf Basis des französischen Panzerwagens Lorraine, der mit regulären 10,5-cm-Haubitzen ausgerüstet ist. Bitte beachten Sie, dass diese Einheit nur durch Ereignisse erstellt werden kann."
conversion_art_equipment_3:0	"Geschützwagen 39H (f)"
conversion_art_equipment_3_desc:0	"Einheitentyp: Selbstfahrende Artillerie. Der Geschützwagen 39H (f) ist eine Umrüstung zur selbstfahrenden Artillerie auf Basis des französischen Panzerwagens Lorraine, die mit regulären 10,5-cm-Haubitzen ausgerüstet ist. Bitte beachten Sie, dass diese Einheit nur durch Ereignisse erstellt werden kann."
