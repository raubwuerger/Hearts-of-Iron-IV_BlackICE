he_112_equipment_1:0	"Heinkel He 112 A"
he_112_equipment_1_desc:0	" : Im Jahr 1933 schloss das Reichsluftfahrtministerium eine Studie ab, in der ein Jagdflugzeug gefordert wurde, das eine Höchstgeschwindigkeit von 400 km/h in 6.000 m Höhe erreichen und mit einer einzelnen 20-mm-MGC/30 oder zwei 7,92-mm-MG 17 oder einer leichten 20-mm-MG FF-Kanone mit zwei MG 17 bewaffnet sein sollte. Die von Walter und Siegfried Günter entworfene Heinkel He 112 belegte den zweiten Platz. Das Flugzeug war schwerer als seine Konkurrenten, doch durch die vergrößerten Tragflächen wurde das Gewicht gleichmäßiger verteilt. Die ersten Serienmodelle waren mit zwei 7,92-mm-MG-17-Maschinengewehren und zwei 20-mm-MG-FF-Kanonen ausgerüstet. "
he_112_equipment_2_short:0	"He 112 B Multirole"
he_112_gun_upgrade:0	"Kanonen"
he_112_airframe_upgrade:0	"Bomben"
he_112_engine_upgrade:0	"Triebwerk"
tech_he_112_equipment_1:0	"He 112 A"
tech_he_112_equipment_2:0	"He 112 B"
he_100_equipment:0	"He-100 Abfangjäger"
he_100_equipment_1:0	"Heinkel He 100 D-1"
he_100_equipment_1_desc:0	"Die Heinkel He 100 wurde von Ernst Heinkel als neuer Jäger konzipiert, der die Leistungswerte der Bf 109, die die Doppeldecker jener Zeit weit übertroffen hatte, noch übertreffen sollte. In Zusammenarbeit mit Walter Günter entstand die He 100, die sich grundlegend von der He 112 unterschied. Die Konstruktion umfasste eine Reihe von Maßnahmen zur Verringerung des Luftwiderstands, darunter das während des Fluges vollständig eingekapselte Fahrwerk. Als Bewaffnung waren eine 20-mm-MG-FF-Kanone und zwei 7,92-mm-MG-17-Maschinengewehre vorgesehen, jeweils eines in jedem Flügel. Das Flugzeug wurde verworfen, um sich auf die Entwicklung der einsitzigen Jagdflugzeuge der Bf 109-Serie zu konzentrieren."
he_100_airframe_upgrade_desc:0	"Die Prototypen der He 100 wurden nur für einen einzigen Zweck gebaut: Geschwindigkeit. Als Jagdflugzeug sind jedoch auch andere Faktoren wichtig, und es müssen Änderungen am Design der He 100 vorgenommen werden."
tech_he_100_equipment_1_desc:0	"Obwohl die Leistung der He 112 enttäuschend war, haben wir Heinkel ermutigt, ein verbessertes Flugzeug zu entwickeln. Vielleicht könnte ihr Projekt mit mehr Unterstützung Früchte tragen."
bf_109_h_equipment_desc:0	"Abfangjäger sind Flugzeuge, die ausschließlich für den Kampf gegen feindliche Flugzeuge konzipiert sind."
bf_109_h_equipment_1_short:0	"Bf 109 H Abfangjäger"
tech_bf_109_h_equipment_1:0	"Bf 109 H"
fw_190_fighter_equipment:0	"Fw-190A Mehrzweckjäger"
fw_190_fighter_equipment_1:0	"Focke-Wulf 190 A"
fw_190_fighter_equipment_1_desc:0	" Als Kurt Tanks Entwurf, die Fw 159, den Wettbewerb um die Rolle als Rückgrat der Luftwaffe verlor, schwor er sich, ein besseres Flugzeug zu entwickeln, was schließlich zur Fw 190 führte. Der BMW 801-Sternmotor ermöglichte es dem Flugzeug, größere Lasten zu transportieren als die Bf 109, was zum Erfolg der Fw 190 als Tagesjäger, Jagdbomber, Bodenangriffsflugzeug und Nachtjäger führte. Die Fw 190 A war mit sechs 7, 92-mm-MG-17-Maschinengewehre, und ab der Variante A-2 verfügte sie über vier MG-17-Maschinengewehre und zwei 20-mm-MG-151/20E-Kanonen."
fw_190_fighter_equipment_2_short:0	"Fw 190 A-5 Multirole"
fw_190_fighter_equipment_3:0	"Focke-Wulf 190 A-8"
fw_190_fighter_equipment_3_desc:0	"Die Fw 190 A-8 war mit den leistungsstärkeren BMW 801-D2-Motoren, zusätzlicher Panzerung und einem Notdruckaufbausystem ausgestattet, das die Leistung des Flugzeugs für einige Minuten erhöhte. Spätere Varianten der A-8-Serie ersetzten die 20-mm-Kanonen in den Tragflächen durch 30-mm-MK-108-Kanonen.\n\nVeraltete FW 190 A-5 können zu FW 190 A-8 umgerüstet werden. "
fw_190_interceptor_equipment_1_short:0	"Fw 190 D Abfangjäger"
