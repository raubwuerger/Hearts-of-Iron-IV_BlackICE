GER_motorized_AC_equipment_06:0	"Kfz. 13"
GER_motorized_AC_equipment_06_desc:0	"Der Vertrag von Versailles erwähnte Panzerwagen nie, daher begann Deutschland sehr früh mit der Entwicklung einiger hochwirksamer Panzerwagen. Panzerwagen tauschen Panzerung und Feuerkraft gegen höhere Geschwindigkeit und Tarnung ein. Sie werden typischerweise als Aufklärungsfahrzeuge eingesetzt. Die früheren Sd.Kfz. waren in Ländern mit gutem Straßennetz recht leistungsfähig, während die früheren Modelle im unwegsamen Gelände Afrikas und an der Ostfront durch ihre schlechte Geländegängigkeit beeinträchtigt wurden."
GER_motorized_AC_equipment_07_short:0	"Sd.Kfz. 221"
GER_motorized_AC_equipment_08:0	"Sd.Kfz. 231 8-rad"
GER_motorized_AC_equipment_08_desc:0	"Die schlechte Leistung des ersten, "6-rad"-Modells (mit sechs Rädern) führte zu einer kompletten Neukonstruktion durch Büssing-NAG, die ein achträdriges Fahrzeug mit vollständig unabhängig voneinander lenkbaren Rädern und einem wesentlich leistungsstärkeren Motor hervorbrachte. Das Lkw-Fahrgestell des Büssing-NAG 8×8 war relativ komplex und kostspielig in der Herstellung, da jedes einzelne Rad unabhängig gelenkt und gefedert war. Tatsächlich war dies bei seiner Erstproduktion im Jahr 1937 der fortschrittlichste Panzerwagen der Welt. Obwohl einige Merkmale des früheren Fahrgestells und der abgeschrägten Karosserie grob beibehalten wurden, war die größte Änderung der Austausch der Positionen von Fahrer und Motor. Dies ermöglichte dem Fahrer eine bessere Sicht und Kontrolle, einen besseren Schutz für den Motor in einem geräumigeren, vollständig getrennten Abteil sowie die Mitnahme von mehr Treibstoff. Die Sitze für den Kommandanten und den Schützen waren an dem von Hand geschwenkten Turm befestigt, der zur Vergrößerung des Innenraums eine sechseckige Form aufwies, doch die Bewaffnung blieb identisch. Es gab weiterhin eine umgekehrte Anordnung von Fahrer und Funkern, doch das zusätzliche Radpaar sorgte für deutlich besseren Grip, und die vollständig unabhängig voneinander gelenkten Räder ermöglichten eine beispiellose Manövrierfähigkeit auf jedem Gelände. Insgesamt wurde der 8-Rad von den Aufklärungsverbänden der Armee gut angenommen und begann in einigen Einheiten, seinen Vorgänger zu ersetzen."
GER_motorized_AC_equipment_09_short:0	"Sd.Kfz. 234/1"
GER_motorized_AC_equipment_099:0	"Sd.Kfz. 234/2"
GER_motorized_AC_equipment_099_desc:0	"Der Sd.Kfz. 234/2, besser bekannt als \"Puma\", ersetzte die 20-mm-Autokanone seines Vorgängers durch eine 50-mm-Kanone, die ursprünglich für das eingestellte Aufklärungsfahrzeug \"Leopard\" vorgesehen war."
GER_motorized_equipment_1:0	"Steyr 1500A 1. 5-Tonnen-Infanterie-Lkw"
GER_motorized_equipment_1_desc:0	"Der Steyr 1500A war ein leichter Lastwagen, der von der Wehrmacht eingesetzt wurde. Die Produktion des 1500A begann 1941 bei der österreichischen Firma Steyr-Daimler-Puch, wobei spätere Aufträge auch an Audi und Auto Union vergeben wurden. Der 1500A wurde von einem 85 PS starken, 8-Zylinder luftgekühlten Steyr-3517-ccm-OHV-Benzinmotor und erreichte eine Höchstgeschwindigkeit von 90 km/h auf der Straße sowie 45 km/h im Gelände. Mit einer Nutzlast von 1,5 Tonnen bot er Platz für 6 bis 8 Passagiere. Bis Kriegsende wurden mehr als 18.000 Fahrzeuge produziert. "
