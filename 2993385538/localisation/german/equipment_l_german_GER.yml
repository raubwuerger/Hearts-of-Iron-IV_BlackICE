ju_88_c_engine_upgrade:0	"Triebwerke"
ju_88_c_guns_upgrade:0	"Kanonen"
ju_88_c_cannon_upgrade:0	"Kanonen"
do_217_night_fighter_equipment:0	"Do-217N-Nachtjäger"
do_217_night_fighter_equipment_1:0	"Dornier 217 N"
do_217_night_fighter_equipment_1_desc:0	" Angesichts zunehmender nächtlicher Angriffe und eines Mangels an den bevorzugten Bf 110 und Ju 88C wurde ein Plan ausgearbeitet, bestehende Do 217 zu Nachtjägern umzubauen. Die J-Serie war das erste Flugzeug dieser Baureihe und wurde mit einer neuen massiven Nase, vier 20-mm-MG-FF-Kanonen und vier 7,92-mm-MG17-Maschinengewehren ausgestattet. Die wesentliche Änderung der N-Serie bestand darin, die Waffen in einem Winkel von 70 Grad anzubringen; diese Methode wurde später als "Schräge Musik" bekannt und ermöglichte es den Flugzeugen, sich feindlichen Bombern von unten zu nähern. Die J-Serie erhielt zudem die leistungsstärkeren DB 603 A-1-Motoren. Aufgrund ihres Gewichts litt das Flugzeug unter Zuverlässigkeitsproblemen und war nicht sehr wendig."
he_219_night_fighter_equipment_desc:0	"Nachtjäger sind Flugzeuge, die dazu bestimmt sind, feindliche Flugzeuge, die nachts operieren, aufzuspüren und zu zerstören. Oft handelt es sich dabei um umgebaute Bomber."
he_219_night_fighter_equipment_1_short:0	"He 219 Nachtjäger"
ta_154_night_fighter_equipment:0	"Ta-154 Nachtjäger"
ta_154_night_fighter_equipment_1:0	"Focke-Wulf Ta 154 "Moskito""
ta_154_night_fighter_equipment_1_desc:0	"Ursprünglich als schneller Angriffsbomber mit der Bezeichnung Ta 211 geplant, sollte das Flugzeug hauptsächlich aus Sperrholz bestehen, das mit einem speziellen Phenolharzkleber verbunden wurde – ähnlich wie die britische DH.98 Mosquito. Das einzige Metall wurde im Druckcockpit verwendet. Das Flugzeug wurde von Jumo-213-Motoren angetrieben und war mit zwei 20-mm-MG151/20-Kanonen sowie zwei 30-mm-MK-108-Kanonen bewaffnet. Spätere Varianten sollten zwei am Rumpf montierte 30-mm-MK-108-Kanonen nach dem "Schräge-Musik"-Prinzip erhalten. Das Flugzeug litt unter Zuverlässigkeitsproblemen, da das Sperrholz und der Klebstoff chemische Korrosion verursachten und es zu einer Delaminierung des Sperrholzes kam."
ta_254_night_fighter_equipment_desc:0	"Nachtjäger sind Flugzeuge, die dazu bestimmt sind, feindliche Flugzeuge, die nachts operieren, aufzuspüren und zu zerstören. Oft handelt es sich dabei um umgebaute Bomber."
ta_254_night_fighter_equipment_1_short:0	"Ta 254 Nachtjäger"
