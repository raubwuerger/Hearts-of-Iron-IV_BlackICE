he_177a5_bomb_upgrade:0	"Bomben"
he_177a5_bomb_upgrade_desc:0	"Führen Sie zusätzliche Nutzlast anstelle von Treibstoff mit. Diese Waffen dienen dem Angriff auf Infrastruktur und verbessern weder Boden- noch Seeangriffe."
