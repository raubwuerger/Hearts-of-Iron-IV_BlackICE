GER_anti_air_equipment_2_desc:0	"Flakgeschütze mit längeren Patronen und Läufen, die hochfliegende Flugzeuge bekämpfen können."
GER_anti_air_equipment_3_desc:0	"Eine fortschrittliche mobile Flak mit größerer Reichweite und Feuerkraft, um selbst die schnellsten und am höchsten fliegenden feindlichen Flugzeuge zu bekämpfen."
GER_HVanti_air_equipment_1_desc:1	" Eine fortschrittliche mobile Flugabwehrkanone mit größerer Reichweite und Feuerkraft, um selbst die schnellsten und am höchsten fliegenden feindlichen Flugzeuge zu bekämpfen."
GER_HVanti_air_equipment_2_desc:0	"Kanonen größeren Kalibers zur Bekämpfung von Zielen in größerer Höhe, die jedoch auch in der Lage sind, Panzer mit geneigter Panzerung auszuschalten."
GER_HVanti_air_equipment_3_desc:0	"Durch die Kombination verschiedener neuer Munitionstechnologien mit Geschützen mit höherer Mündungsgeschwindigkeit sind diese Flugabwehrgeschütze auf alle neuen Luftstreitkräfte vorbereitet, die unsere Feinde entwickeln mögen. "
GER_rocket_artillery_equipment_1:0	"15-cm-Nebelwerfer 41"
GER_rocket_artillery_equipment_1_desc:0	"Raketenartillerie ist weniger präzise und hat eine deutlich geringere Dauerfeuerrate als Batterien traditioneller Artilleriegeschütze. Sie sind jedoch in der Lage, ein Ziel gleichzeitig mit mehreren Raketen zu treffen, was verheerende Auswirkungen hat."
GER_rocket_artillery_equipment_2_short:0	"30-cm-Nebelwerfer 42"
GER_garrison_equipment_0:0	"Ausrüstung für die Garnisonsinstandhaltung"
GER_assault_rifle:0	"Sturmgewehr 44"
GER_assault_rifle_desc:0	"Sturmgewehre vereinen die Durchschlagskraft von Gewehren, die Kompaktheit von Karabinern und die Feuerrate von Maschinenpistolen und sind somit ein guter Allrounder für Infanterieeinheiten."
GER_assault_rifle_equipment_0_short:0	"StG 44"
GER_infantry_equipment_desc:0	"Einzel- und Mannschaftswaffen für die Infanterie sowie die verschiedenen anderen Ausrüstungsgegenstände, die ein Soldat benötigt."
GER_infantry_equipment_0_short:0	"Gewehr 98"
GER_infantry_equipment_1:0	"Karabiner 98 kurz"
GER_infantry_equipment_1_desc:0	 "Der Karabiner 98 kurz ("kurz") ist ein Repetiergewehr, das die älteren Modelle Gewehr 98 und Karabiner 98b als Hauptdienstgewehr der Wehrmacht ablöste. Das Gewehr wurde 1934 unter der Leitung des Heereswaffenamtes entwickelt und basierte hauptsächlich auf dem Karabiner 98b und dem Standardmodell. Die Produktion lief von 1935 bis 1945, wobei über 14.000.000 Gewehre hergestellt wurden. Wie die Vorgängermodelle verschoss der Karabiner 98k die 7,92 x 57 mm Mauser-Patrone und verfügte über ein internes 5-Schuss-Magazin, das mit einem Ladestreifen geladen wurde. Zu den Varianten gehörten das Kriegsmodell, das zur Steigerung der Produktionsrate vereinfacht wurde, eine Scharfschützenvariante (mit einer Stückzahl von 132. 000 produzierten Exemplaren) sowie das experimentelle Gewehr 40k, eine kürzere und leichtere Version. \n\nObwohl der Name auf einen Karabiner hindeutet, der für die Kavallerie oder andere Unterstützungstruppen bestimmt war, war der  Karabiner 98k nur geringfügig kürzer (1.110 mm) und leichter (3,7 kg) als das Gewehr 98. \n\nAls äußerst präzises und zuverlässiges Modell wurde der Karabiner 98k sowohl während als auch nach dem Krieg von anderen Streitkräften (einschließlich des Wachbataillons der Bundeswehr) importiert, kopiert oder erbeutet."
GER_infantry_equipment_2_short:0	"Gewehr 41"
GER_infantry_equipment_3:0	"Gewehr 43 / Karabiner 43"
GER_infantry_equipment_3_desc:0	"Das Gewehr 43 war der letzte Schritt auf dem Weg zur Herstellung eines zuverlässigen halbautomatischen Gewehrs für die Wehrmacht. Die verschiedenen Probleme des Vorgängermodells, des Gewehrs 41, wurden durch die Entdeckung des sowjetischen SVT -40 gelöst. Die bei der Invasion der Sowjetunion erbeutete Waffe wurde von den Konstrukteuren untersucht und wies einen wesentlich zuverlässigeren Gasmechanismus auf, der über eine Öffnung im Lauf etwa ein Drittel vom Ende entfernt angetrieben wurde; zudem ersetzte sie das herkömmliche Ladestreifen-System durch ein modernes Kastenmagazin. Der Mechanismus war dem des Gewehrs 41 eindeutig überlegen und zudem einfacher. \n\nIm Jahr 1943 stellte Walther das endgültige Modell her, das den Namen Gewehr 43 trug. Der Name wurde 1944 in Karabiner 43 geändert, da der Lauf tatsächlich 2 cm kürzer war als der des Karabiner 98k. Das Gewehr wog 4,4 kg und hatte eine Länge von 1.115 mm. Bis zum Kriegsende wurden über 400.000 Exemplare produziert. Das Gewehr verwendete weiterhin die 7,92 x 57 mm Mauser-Patrone, verfügte über ein abnehmbares 10-Schuss-Kastenmagazin, konnte aber auch weiterhin mit Ladestreifen geladen werden. Zudem war das Gewehr mit Schienen für Zielfernrohre ausgestattet, was eine Verbesserung gegenüber dem Karabiner 98k darstellte, bei dem für deren Anbringung Umbauten erforderlich waren. \n\nZwischen 1943 und 1945 wurden über 400.000 Exemplare produziert."
GER_SMG_equipment_0_short:0	"MP35"
GER_SMG_equipment_1:0	" Maschinenpistole 38"
GER_SMG_equipment_1_desc:0	"Die Maschinenpistole 38 basiert auf dem früheren Modell Maschinenpistole 36, das von Berthold Geipel von den Erma Werken entwickelt wurde. Der Hauptunterschied zwischen der MP 38 und der MP 36 besteht im Wegfall des Feuerwahlmechanismus (nur vollautomatischer Feuermodus) zugunsten einer vereinfachten Konstruktion. Die MP 38 verwendete die 9×19-mm-Luger-Parabellum-Patrone und verfügte über ein abnehmbares Magazin mit einer Kapazität von 32 Schuss. Bei ihrem ersten Einsatz während des Polenfeldzugs 1939 zeigten sich bald einige Konstruktionsprobleme der MP 38. Vor allem war der Herstellungsprozess angesichts des Stahlbedarfs im kriegsführenden Deutschland noch recht ineffizient, was zur Forderung nach einem kostengünstigeren Serienmodell nach dem gleichen Konstruktionsprinzip führte. \n\nDie MP 38 wurde zwischen 1938 und 1940 produziert, wobei die Produktion nach der Einführung der MP 40 rasch auf diese kostengünstigere Waffe umgestellt wurde. "
GER_SMG_equipment_2_short:0	"MP 40"
GER_SMG_equipment_3:0	" Maschinenpistole 3008"
GER_SMG_equipment_3_desc:0	 "Die Maschinenpistole 3008 war eine von Ludwig Vorgrimler im Jahr 1944 entworfene Maschinenpistole. Die MP 3008 war eine Notlösung gegen Ende des Krieges, deren Hauptziel darin bestand, die Konstruktion weiter zu vereinfachen, um die Waffe schnell und ohne spezielle Fabrikausrüstung herstellen zu können. Die Konstruktion lehnte sich eng an die britische Maschinenpistole Sten MK II an, die ähnliche Konstruktionsmerkmale aufwies. \n\nDie MP 3008 war eine einfache Rückstoßlader-Konstruktion mit offenem Verschluss. Sie wurde in kleinen Maschinenwerkstätten grob gefertigt, und Abweichungen waren häufig. Typischerweise war das Magazin unten angebracht, im Gegensatz zur seitlich montierten Sten. Ursprünglich vollständig aus Stahl und ohne Handgriffe, war der Drahtschaft an den Rahmen geschweißt und hatte typischerweise eine dreieckige Form, doch änderte sich die Konstruktion, als sich die Lage in Deutschland verschlechterte, und bei den letzten Exemplaren finden sich Holzschäfte und andere Varianten. \n\nEs wird angenommen, dass etwa 10.000 Stück produziert wurden, die im Allgemeinen an Volkssturm-Formationen ausgegeben wurden, was zu dem anderen Namen der Waffe, "Volks-MP.3008", führte."
GER_HMG_equipment_0_desc:0	"Das Maschinengewehr 30 (abgekürzt MG 30) ist ein deutsches Maschinengewehr, das 1930 von Rheinmetall entwickelt wurde. Da Deutschland aufgrund des Versailler Vertrags die Herstellung von Maschinengewehren untersagt war, wurde die Waffe von einem in deutschem Besitz befindlichen Schweizer Hersteller in der Schweiz produziert. \n\nDas MG 30 verfügte über eine luftgekühlte, rückstoßbetriebene Konstruktion und verschoss die Standardmunition 7,92×57 mm Mauser, die aus einem leicht gebogenen 30-Schuss-Magazin zugeführt wurde, das auf der linken Seite der Waffe eingesetzt wurde. Das MG 30 feuerte sowohl im halbautomatischen als auch im vollautomatischen Modus, je nachdem, wie weit die beiden Zweistufenabzug betätigt wurde, wobei die Feuerrate im Vollautomatikmodus zwischen 600 und 800 Schuss pro Minute lag. Es verfügte über ein klappbares Zweibein, das an den unteren zwei Dritteln des Laufs angebracht war. \n\nDas MG 30 wurde letztendlich von der Reichswehr abgelehnt, stattdessen wurde das MG 13 eingeführt. Allerdings kam es in der Luftwaffe als Flugzeuggeschütz unter der Bezeichnung MG 15 zum Einsatz. Darüber hinaus erwarben sowohl die österreichische als auch die schweizerische Armee Lizenzen für die Konstruktion und setzten sie in ihren Streitkräften ein."
GER_HMG_equipment_1:0	"Maschinengewehr 34"
GER_HMG_equipment_1_short:0	" MG 34"
GER_HMG_equipment_2_desc:0	"Das Maschinengewehr 42 (abgekürzt MG 42) ist ein deutsches Maschinengewehr, das 1942 von Dr. Werner Gruner von der Großfuß AG entwickelt wurde. Während das frühere MG 34 ein erfolgreiches Design war, erforderten seine hohen Materialkosten und die Komplexität der Konstruktion im Verlauf des Krieges eine neuere Konstruktion, da die deutsche Kriegsindustrie an ihre Grenzen stieß. \n\nUnter den drei Unternehmen, die zur Einreichung von Entwürfen aufgefordert wurden, erwies sich der Entwurf der Großfuß AG als der mit Abstand beste. Die Konstruktion nutzte einen einzigartigen, rückstoßbetriebenen Rollverschlussmechanismus, während die anderen Entwürfe ein gasbetätigtes System verwendeten. Interessanterweise verfügte das Unternehmen über keinerlei vorherige Erfahrung in der Waffenherstellung, sondern auf gepresste und gestanzte Stahlkomponenten spezialisiert war. Dr. Werner Gruner, einer der führenden Konstrukteure bei Großfuß, wusste nichts über Maschinengewehre, als er mit der Mitarbeit an dem Projekt betraut wurde, obwohl er auf die Technologie der Massenproduktion spezialisiert war. Gruner besuchte einen Maschinengewehrkurs der Armee, um sich mit dem Nutzen und den Eigenschaften einer solchen Waffe vertraut zu machen, und holte sich Anregungen von Soldaten. \n|___NL0 02706___|Da das MG 42 größtenteils aus gestanztem, entsprechend gehärtetem Kohlenstoffstahl gefertigt wurde, erforderte es deutlich weniger maschinelle Bearbeitung und weniger hochwertige Stahllegierungen, die Metalle enthielten, die in Deutschland knapp geworden waren. Das MG 42 war wesentlich einfacher zu fertigen als andere Maschinengewehre – die Fertigstellung des neuen Gewehrs erforderte 75 Arbeitsstunden gegenüber 150 Arbeitsstunden für das MG 34 (eine Reduzierung um 50 %), 27,5 kg Rohmaterial gegenüber 49 kg für das MG 34 (eine Reduzierung um 44 %) – und kostete 250 RM gegenüber 327 RM (eine Reduzierung um 24 %). Um die Konstruktion zu vereinfachen, wurde zudem das Feuerwahlsystem des MG 34 entfernt. \n\nDie auf Kostensenkung ausgerichteten Konstruktionsziele des MG 42 beeinträchtigten weder die Wirksamkeit noch die Zuverlässigkeit der Waffe, und seine Feuerrate (1.200 Schuss pro Minute) war im Vergleich zu zeitgenössischen Konstruktionen extrem hoch. Die hohe Feuerrate hatte jedoch auch ihre Nachteile. Durch Dauerfeuer wurde die Munition schnell aufgebraucht, und der Lauf überhitzte sich und musste häufig ausgetauscht werden. \n\nDas MG 42 war eine sehr erfolgreiche Waffe, von der über 400.000 Stück hergestellt wurden. Ihre einfache und zuverlässige Konstruktion wurde zur Grundlage für viele andere Maschinengewehre verschiedener Länder."
GER_HMG_equipment_3:0	"Maschinengewehr 42V"
GER_HMG_equipment_3_short:0	"MG 42V"
GER_mortar_equipment_0_desc:0	"Mörser sind die wichtigste explosive Unterstützungswaffe im Zug. Wo größere Artilleriegeschütze für einen flexiblen taktischen Einsatz möglicherweise zu unhandlich sind, kann der Mörser den Soldaten in der Nähe organische Feuerunterstützung bieten. Die hohe, bogenförmige Flugbahn von Mörsergranaten macht sie ideal, um in Schützengräben einzuschlagen, die ungeschützten Dächer von Gebäuden zu treffen oder Mauern zu umgehen. \n\nDer 5-cm-leichter Granatwerfer 36 (5 cm leGrW 36) ist ein deutscher leichter Mörser, der 1934 von Rheinmetall entwickelt wurde. Die vorgesehene Aufgabe des 5 cm leGrW 36 bestand darin, Widerstandsnester zu bekämpfen, die sich außerhalb der Wurfweite einer Handgranate befanden. Die Konstruktion umfasste ein Zielfernrohr zur Erleichterung der Zielerfassung, das jedoch nach 1938 zur Vereinfachung der Produktion entfernt wurde. \n|___NL0 02714___|Bis 1941 galt der Granatwerfer 36 als zu komplex für seine vorgesehene Aufgabe. Er feuerte zu leichte Geschosse ab und hatte eine zu geringe Reichweite. Er wurde als Zugmörser eingesetzt und von einem 3-Mann-Team bedient. Die Produktion wurde 1941 eingestellt. Bis 1942 wurde er schrittweise aus dem Frontdienst abgezogen. Er blieb jedoch bis zum Ende des Zweiten Weltkriegs 1945 bei und Garnisonseinheiten bis zum Ende des Zweiten Weltkriegs im Jahr 1945 im Einsatz. \n\nBis 1943 wurden über 30.000 Einheiten und 22.000.000 5-cm-Granaten produziert."
GER_mortar_equipment_1:0	"8-cm-Granatwerfer 34"
GER_mortar_equipment_1_short:0	" 8 cm GrW 34"
GER_mortar_equipment_2_desc:0	"Der kurze 8 cm Granatwerfer 42 (kz 8 cm GrW 42) ist ein deutscher Mörser, der 1941 von Rheinmetall entworfen wurde. Er wurde als leichtere Version des deutschen Standard-Mittelmörsers 8 cm GrW 34 mit kürzerem Lauf für den Einsatz bei Fallschirmjägern entwickelt, ersetzte jedoch tatsächlich den unwirksamen 5 cm leGrW 36, als dessen Mängel offensichtlich wurden. \n\nDer kz 8 cm GrW 42 konnte eine 8-cm-Granate abfeuern (die über 3,5-mal schwerer war als die 5-cm-Granate) doppelt so weit wie die 5-cm-LeGrW 36 und war weniger als doppelt so schwer. Sie ließ sich für den Transport in die üblichen drei Teile zerlegen. Einige der kr 8 cm GrW 42 waren mit einem schnurbetätigten Lade-/Abzugsmechanismus für den ferngesteuerten Einsatz ausgestattet. \n\nBis zum Kriegsende wurden über 1.500 Exemplare produziert."
GER_mortar_equipment_3:0	"12 cm Granatwerfer 42"
GER_mortar_equipment_3_short:0	"12 cm GrW 42"
GER_mechanized_at_0:0	"Sonderkraftfahrzeug 251/10 3,7 cm Pak 36"
GER_mechanized_at_0_desc:0	"Das Sd.Kfz. 251/10 war die Panzerabwehrvariante des Sd.Kfz. 251. Es war mit der 3,7-cm-Pak-36-Kanone ausgerüstet, die eine effektive Reichweite von etwa 1200 m hatte. Während frühe Versionen die PaK 36 offen trugen, verwendeten spätere Versionen einen viel kleineren, halb so großen Geschützschutz, damit das Fahrzeug seine Feuerkraft nicht offen zeigte und eher wie ein reguläres Sd.Kfz. 251/ 1 aussah. \n\nDer 251/10 wurde in der Regel Zugführern als Feuerunterstützungsfahrzeug zugeteilt."
GER_mechanized_aa_0_short:0	"Sd.Kfz. 251/17"
GER_mechanized_hmg_0:0	 "Sonderkraftfahrzeug 251/21 Drilling MG151"
GER_mechanized_hmg_0_desc:0	"Sd.Kfz. 251/21 war die doppelt einsetzbare Variante des Sd.Kfz. 251 für Luftabwehr und Bodenunterstützung. Es war mit einer dreifach montierten (das deutsche Wort "Drilling" bedeutet "dreifach") MG151-Maschinenkanone ausgerüstet. Frühe Versionen des Sd.Kfz. 251/21 trugen die MG151/15-mm-Kanone auf einer Dreifachlafette der Kriegsmarine, die bei späteren Versionen durch die MG151/ 20-mm-Kanone der Luftwaffe ersetzt. \n\nZwar verfügte der Sd.Kfz. 251/21 über eine starke Feuerkraft, doch aufgrund seiner hohen Feuerrate konnte er seine gesamte Munitionsladung von 3000 Schuss in nur 90 Sekunden verschießen."
