ju_86_bomber_equipment_1:0	"Junkers 86 D"
ju_86_bomber_equipment_1_desc:0	"Die Junkers Ju 86 wurde ursprünglich als zweimotoriges ziviles Hochgeschwindigkeits-Passagierflugzeug für zehn Passagiere sowie als mittlerer Bomber konzipiert. Das Flugzeug war ursprünglich mit Jumo-205-Dieselmotoren ausgestattet, die sich jedoch bei ihrem Einsatz im Spanischen Bürgerkrieg als unzuverlässig erwiesen. Die Junkers Ju 86 D war mit zwei Siemens SAM 22 ausgestattet, die zusammen mit einem verbesserten Heck die Leistung und Stabilität des Flugzeugs erhöhten. Das Flugzeug erwies sich als der Heinkel He 111 unterlegen. "
