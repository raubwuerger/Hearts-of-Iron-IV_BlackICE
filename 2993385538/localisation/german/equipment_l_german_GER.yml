do_17_z_bomber_equipment_1:0	"Dornier 17 Z"
do_17_z_bomber_equipment_1_desc:0	"Die Dornier Do 17 Z-Serie wurde zum bekanntesten Flugzeug der Do 17-Reihe; der Rumpf wurde neu gestaltet, wobei das Cockpit tiefer gelegt wurde, um Platz für einen hinteren Schützenposten zu schaffen. Die Variante wurde ursprünglich mit zwei DB 600-Motoren getestet; da diese jedoch für einsitzige Jagdflugzeuge reserviert waren, kamen stattdessen Bramo Fafnir 323 P-Motoren zum Einsatz. Die Bombenlast des Flugzeugs wurde zunächst erhöht, dann jedoch aufgrund des zusätzlichen Gewichts durch verbesserte Ausstattungsmerkmale wie neue Maschinengewehre und ein weiteres Besatzungsmitglied wieder verringert. Die Tage der Do 17 als Bomber waren gezählt.\n\nVeraltete Dornier Do 17 Ms können zu Dornier Do 17 Zs umgebaut werden."
tech_do_17_z_bomber_equipment_1_desc:0	"Die Do 17 Z ist eine Weiterentwicklung der Do 17."
ju_86_p_bomber_equipment_desc:0	"Leichte Bomber sind mehrmotorige Flugzeuge, die für Angriffe auf feindliche Boden- und strategische Ziele konzipiert sind."
ju_86_p_bomber_equipment_1_short:0	"Ju 86 P Leichtbomber"
he_111_bomber_equipment:0	"He-111A Mittelbomber"
he_111_bomber_equipment_1:0	"Heinkel 111 A"
he_111_bomber_equipment_1_desc:0	"Die Heinkel He 111 tarnt sich zunächst als ziviles Verkehrsflugzeug, obwohl sie von Anfang an als schneller Mittelstreckenbomber konzipiert war. Der interne Hauptbombenschacht konnte 2.000 kg Bomben aufnehmen, und mit externen Halterungen konnten weitere 3.600 kg transportiert werden, was jedoch die Leistung des Flugzeugs erheblich beeinträchtigte. Das Flugzeug konnte schwere Schäden erleiden und dennoch in der Luft bleiben. Das Flugzeug sollte zum Arbeitspferd der Luftwaffe werden und diente als mittlerer Bomber, strategischer Bomber, Torpedobomber und Transportflugzeug. Die Heinkel He 111 A diente als erster Prototyp."
he_111_bomber_equipment_2_short:0	"He 111 B Mittlerer Bomber"
he_111_bomber_equipment_3:0	"Heinkel 111 E"
he_111_bomber_equipment_3_desc:0	"Die He 111 E verfügte über eine erhöhte Nutzlast."
he_111_f_bomber_equipment_desc:0	"Mittlere Bomber sind zweimotorige Bomber, die zum Angriff auf feindliche Boden- und strategische Ziele eingesetzt werden."
he_111_bomber_equipment_4_short:0	"He 111 F Mittelstreckenbomber"
he_111_p_bomber_equipment:0	"He-111P Mittelstreckenbomber"
he_111_bomber_equipment_5:0	"Heinkel 111 P"
he_111_bomber_equipment_5_desc:0	 "Die Heinkel He 111 P verfügte über neue, flüssigkeitsgekühlte DB 601A-1-Motoren und einen neu gestalteten Bugbereich, der die Montage eines zusätzlichen 7,92-mm-MG15 ermöglichte. Die glatte, verglaste Nase ermöglichte den Piloten eine bessere Sicht. Zu den weiteren Merkmalen gehörten ein verbessertes Funkgerät, selbstdichtende Treibstofftanks und halb einziehbare Fahrwerke zur Verringerung des Luftwiderstands.\n|___ NL002759___|Aufgrund umfangreicher Änderungen können veraltete Heinkel He 111 F nicht zu Heinkel He 111 P umgerüstet werden."
he_111_h_bomber_equipment_1_short:0	"He 111 H Mittelstreckenbomber"
he_111_h6_bomber_equipment_1:0	"Heinkel 111 H-6"
he_111_h6_bomber_equipment_1_desc:0	" Die Heinkel He 111 H-6 leitete umfassende Verbesserungen der H-Serie ein, indem Jumo 211 F-1-Triebwerke eingebaut wurden, die die Geschwindigkeit der Flugzeuge erhöhten. Die Steiggeschwindigkeit war höher und es wurde eine etwas größere Dienstgipfelhöhe erreicht. Die Verteidigungsbewaffnung der Flugzeuge wurde durch den Einbau einer 20-mm-MG-FF-Kanone und zusätzlicher 7,92-mm-MG15-Maschinengewehre weiter verstärkt. \n\nVeraltete Heinkel He 111 H können zu Heinkel He 111 H-6 umgerüstet werden."
