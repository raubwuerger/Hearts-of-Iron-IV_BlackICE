me_410_fighter_equipment:0	"Me-410 Schwerer Jäger"
me_410_fighter_equipment_1:0	" Messerschmitt 410 "Hornisse""
me_410_fighter_equipment_1_desc:0	"Die Me 410 war eine Weiterentwicklung der gescheiterten Me 210. Mit einer anderen Flügelkonfiguration, einem längeren Rumpf und leistungsstärkeren Triebwerken wurde das Flugzeug umbenannt. Das Flugzeug war mit zwei 7,92-mm-MG 17, zwei 20-mm-MG151/20-Kanonen und zwei defensive 13-mm-MG131-Maschinengewehre. Es konnten vier 21-cm-Werfer-Granaten 21 sowie bis zu 1.000 kg Bomben mitgeführt werden. Die Me 410 war Hitlers bevorzugter Bomberjäger, wurde jedoch nach Mitte 1944 überwiegend in Aufklärungsrollen eingesetzt"
me_410_gun_upgrade_desc:0	"Ersetzen Sie die 7,92-mm-Maschinengewehre durch 13-mm-Maschinengewehre."
me_410_cannon_upgrade_desc:0	"Eine schwerere Bewaffnung erhöht die Angriffskraft unseres Flugzeugs."
me_410_bombs_upgrade_desc:0	"Führen Sie zusätzliche Bomben mit."
me_410_torpedo_upgrade_desc:0	"Rüstet das Flugzeug für spezielle Schiffsabwehrmissionen aus."
me_410_fuel_upgrade_desc:0	"Eine geringere Nutzlast erhöht unsere Flugreichweite."
me_410_engine_upgrade_desc:0	"Leistungsstärkere Triebwerke ermöglichen es dem Flugzeug, schwerere Bewaffnung zu tragen, ohne an Leistung einzubüßen."
me_410_bfg_upgrade_desc:0	"Eine 50-mm-Kanone montieren. Werden Sie zum Narwhal."
tech_me_410_fighter_equipment_1_desc:0	"Während die Me 210 eine Blamage war, könnte die Weiterentwicklung des Entwurfs zu einem schweren Jäger führen, der in der Lage ist, umfangreiche Bewaffnung zu tragen."
ar_440_fighter_equipment_desc:0	" Schwere Jäger sind zweimotorige Flugzeuge, die für Angriffe auf Luft- und Bodenziele konzipiert sind. "
ar_440_fighter_equipment_1_short:0	"Ar 440 Schwerer Jäger"
tech_ar_440_fighter_equipment_1:0	"Ar 440"
bf_109_z_fighter_equipment:0	"Me-109Z Schwerer Jäger"
bf_109_z_fighter_equipment_1:0	"Bayerische Flugzeugwerke 109 Z"
bf_109_z_fighter_equipment_1_desc:0	"Die Bf 109 Z war ein Versuchsflugzeug, bei dem zwei Bf 109F-Rümpfe miteinander verbunden wurden, ähnlich wie bei der F-82 Twin Mustang. Es wurden mehrere Varianten vorgeschlagen, darunter ein Abfangjäger, der mit fünf 30-mm-Kanonen vom Typ MK 108 bewaffnet war, ein Jagdbomber mit zwei 30-mm-Kanonen und bis zu zwei 1.000-kg-Bomben. Es wurde nur eine Bf 109 Z gebaut, die jedoch nie die Erdoberfläche verließ, da sie in ihrem Hangar durch einen Bombenangriff beschädigt wurde. Das Projekt wurde kurz darauf aufgegeben."
tech_bf_109_z_fighter_equipment_1_desc:0	" Der Erfolg der He 111 Z hat gezeigt, dass die Idee, zwei Flugzeuge miteinander zu kombinieren, ihre Vorzüge hat."
do_335_fighter_equipment_desc:0	"Die Dornier 335 war ein einzigartiger schwerer Jäger mit einer "Push-Pull"-Triebwerkskonstruktion, die eine bessere Leistung ermöglichte. Es war der schnellste Kolbenmotor-Jäger der Luftwaffe."
do_335_fighter_equipment_1_short:0	"Do 335 A Schwerer Jäger"
do_335_fighter_equipment_2:0	"Dornier 335 B "Pfeil""
do_335_fighter_equipment_2_desc:0	"Für die Dornier Do 335 B wurden mehrere Varianten vorgeschlagen, die von längeren Tragflächen über zwei zusätzliche 30-mm-MK-103-Kanonen bis hin zu zusätzlichen Treibstofftanks und besseren Triebwerken reichten. Keine dieser Varianten verließ die Reißplatte.\n\nVeraltete Dornier Do 335 A können zu B umgerüstet werden."
tech_do_335_fighter_equipment_1_desc:0	"Die Do 335 ist ein schwerer Jäger."
tech_do_335_fighter_equipment_2_desc:0	"Die Do 335 ist ein schwerer Jäger."
tech_ar_234_c_fighter_equipment_1_desc:0	"Die Ar 234 C-4 ist eine Mehrzweckentwicklung des Ar 234 C-Strahlbomber."
tech_do_17_night_fighter_equipment_1_desc:0	 "Der Erfolg der Dornier Do 17 Z als Bomber war jedoch nur von kurzer Dauer; es wurden Entwürfe angefertigt, um das neue Flugzeug mit einer massiven Nase aus einer Junkers Ju 88 auszustatten, eine 20-mm-MG-FF-Kanone sowie drei 7,92-mm-MG-17-Maschinengewehre hinzuzufügen und das Flugzeug in einen Nachtjäger umzuwandeln. Der Nachtjäger hatte drei Besatzungsmitglieder, verfügte über einen besseren Panzerschutz und war mit zusätzlichen Treibstofftanks ausgestattet."
tech_ju_88_c6b_night_fighter_equipment_1_desc:0	"Die Junkers Ju 88 C-Serie war als Jagdbomber und schwerer Bomber konzipiert, indem feste, nach vorne feuernde Geschütze wie eine 20-mm-MG-FF-Kanone und drei 7,92-mm-MG17-Maschinengewehre hinzugefügt wurden. Die ersten Varianten wurden aus früheren A-Varianten (Bomber) umgebaut. Die Ju 88 C-Serie wurde zusätzlich mit einem FuG 202 Lichtenstein BC-Abfangradar im niedrigen UHF-Bereich ausgestattet. Zu den weiteren Modifikationen gehörte der Einbau von zwei zusätzlichen 20-mm-MG-FF-Kanonen."
tech_do_217_night_fighter_equipment_1_desc:0	"Die Do 217 N ist eine zum Nachtjäger umgebaute Version der Do 217."
tech_he_219_night_fighter_equipment_1_desc:0	"Die He 219 ist ein Nachtjäger."
tech_ta_154_night_fighter_equipment_1_desc:0	"Die Ta 154 ist ein Nachtjäger."
tech_ta_254_night_fighter_equipment_1_desc:0	"Die Ta 254 ist ein Nachtjäger."
tech_me_163_equipment_1_desc:0	"Die Me 163 ist ein raketenbetriebener Abfangjäger."
tech_me_163_equipment_2_desc:0	"Die Me 163 C verfügt über einen größeren Treibstofftank. "
do_335_gun_upgrade_desc:0	"Rüsten Sie die 15-mm-MG-151-Maschinengewehre auf 20-mm-MG-151/20-Kanonen auf."
do_335_cannon_upgrade_desc:0	"Installiert zwei zusätzliche 30-mm-MK-103-Kanonen."
do_335_engine_upgrade_desc:0	"Rüstet den Motor auf, um die Flugleistung zu steigern."
bf_109_z_upgrade_desc:0	"Die Zerstörer-Version der Bf 109 Z trug anstelle einer Bombenlast zusätzliche Kanonen."
ar_234_c_fighter_equipment_desc:0	"Ein Düsenflugzeug, das ähnlich wie ein schwerer Jäger konzipiert ist und in der Lage ist, feindliche Ziele zu bombardieren und feindliche Bomber abzufangen."
