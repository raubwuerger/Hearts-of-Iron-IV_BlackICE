do_22_bomber_equipment_1:0	"Dornier 22"
do_22_bomber_equipment_1_desc:0	" Die Dornier Do 22 wurde von der Schweizer Tochtergesellschaft von Dornier als dreisitziges, einmotoriges Flugzeug entwickelt, das einen 800-kg-Torpedo oder vier 50-kg-Bomben transportieren konnte. Trotz guter Leistungsdaten wurde das Flugzeug nur in geringer Stückzahl gebaut und nach Griechenland, Jugoslawien und Finnland exportiert."
do_22_guns_upgrade_desc:0	"Rüstet ein zusätzliches Verteidigungsmaschinengewehr aus."
do_22_land_upgrade_desc:0	"Die Umrüstung der Do 22 von einem Wasserflugzeug zu einem Landflugzeug erhöht die Flugleistung geringfügig."
he_115_bomber_equipment_desc:0	 "Die Heinkel He 115 war ein dreisitziges Wasserflugzeug, das als Torpedobomber eingesetzt wurde und Aufgaben wie Aufklärung und Minenlegung übernahm. Die Flugzeuge waren mit zwei 7,92-mm-Maschinengewehren gut bewaffnet. Einige Varianten verfügten über eine 20-mm-Kanone. Das Flugzeug konnte bis zu fünf 250-kg-Bomben, zwei 250-kg-Bomben und einen 800-kg-Torpedo oder eine 920-kg-Seemine transportieren. Norwegen bestellte sechs Heinkel He 115, die 1939 ausgeliefert wurden; vier davon gelangten bei der Invasion Norwegens nach Großbritannien."
he_115_bomber_equipment_1_short:0	"He 115 Marinebomber"
he_115_guns_upgrade:0	"Offensive Geschütze"
he_115_cannon_upgrade:0	"Defensive Geschütze"
