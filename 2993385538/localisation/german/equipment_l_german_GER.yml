heavy_panzer_equipment_1_desc:0	"Die deutsche Neubaufahrzeug-Serie von Panzerprototypen war ein erster Versuch, nach Adolf Hitlers Machtübernahme einen schweren Panzer für die Wehrmacht zu entwickeln. Mit mehreren Türmen, schwer und langsam, galten sie als nicht erfolgreich, weshalb nur fünf Exemplare hergestellt wurden. Diese wurden in erster Linie zu Propagandazwecken eingesetzt, obwohl drei von ihnen 1940 an der Schlacht um Norwegen teilnahmen."
