he_177_a5_bomber_equipment:0	"He-177A5 Schwerer Bomber"
he_177_bomber_equipment_3:0	"Heinkel 177 A-5"
he_177_bomber_equipment_3_desc:0	"Die A-5 war die Hauptserienversion, bei der die nun standardisierte Flugzeugzelle der A-3 zum Einsatz kam. Die Tragflächen wurden verstärkt, um den Einbau von ETC 2000/XII-Flügelgestellen zu ermöglichen. Die Verteidigungsbewaffnung wurde weiter ausgebaut, wobei bemannte Maschinengewehre durch ferngesteuerte Geschütze ersetzt wurden. \n\nVeraltete Heinkel He 177 A-3 können zu He 177 A-5 umgerüstet werden."
