me_163_interceptor_equipment:0	"Me-163 Punktabwehrjäger"
me_163_equipment_1:0	"Messerschmitt 163 B "Komet""
me_163_equipment_1_desc:0	"Die Messerschmitt Me 163 entstand aus einem 1937 unter der Leitung der Deutschen Forschungsanstalt für Segelflug begonnenen Entwurf. Aufgrund von Unterschieden bei der Konstruktion und der Prototypenfertigung verließ Alexander Lippisch das Projekt, um bei Messerschmitt zu arbeiten. Die durch diesen Wechsel verursachte Verzögerung erwies sich als vorteilhaft, da sie es ermöglichte, dass die Raketentriebwerkstechnologie aufholen konnte. Bei Prototypentests stellte die Me 163 V4 mit 1.004,5 km/h einen Geschwindigkeitsweltrekord auf. Das Flugzeug durchlief zahlreiche Weiterentwicklungen, bevor die B-Serie in Produktion ging, bewaffnet mit zwei 30-mm-MK-108-Kanonen, die nur auf kurze Distanz präzise waren. Die immense Geschwindigkeit des Flugzeugs, die kurze Reichweite der Waffen, die Steiggeschwindigkeit und der geringe Treibstoffvorrat beschränkten die Einsatzdauer auf etwa fünf Minuten."
me_163_gun_upgrade_desc:0	"Rüsten Sie die beiden 20-mm-Kanonen MG 151/20 auf 30-mm-MK-108-Kanonen auf."
me_163_engine_upgrade_desc:0	"Modifizieren Sie den Motor, um die Treibstoffeffizienz zu steigern und die Reichweite zu erhöhen."
me_163_c_interceptor_equipment_desc:0	"Punktabwehrjäger sind Kurzstreckenflugzeuge, die zur Verteidigung strategischer Ziele vor feindlichen Flugzeugen eingesetzt werden."
me_163_equipment_2_short:0	"Me 163 C Raketenabfangjäger"
he_162_fighter_equipment:0	"He-162 Punktabwehrjäger"
he_162_fighter_equipment_1:0	"Heinkel 162 A "Spatz""
he_162_fighter_equipment_1_desc:0	"Die Heinkel He 162, von Heinkel als "Spatz" oder "Volksjäger" (Volksjäger) oder Salamander, war ein einmotoriger Düsenjäger, der aufgrund des Mangels an strategischen Metallen größtenteils aus Holz gefertigt wurde. Das Flugzeug sollte leicht zu fliegen sein, idealerweise nach nur kurzer Ausbildung, vorzugsweise nach dem Fliegen eines Stummel-Habichts der Deutschen Forschungsanstalt für Segelflug Stummel-Habicht. Das Flugzeug wog schließlich 2.800 kg, erreichte Geschwindigkeiten zwischen 790 und 905 km/h und war mit zwei 20-mm-MG151/20-Kanonen bewaffnet, während frühere Varianten über zwei 30-mm-MK-108-Kanonen verfügten. Die Verwirklichung eines Volksjägers war zum Scheitern verurteilt, da das Flugzeug erfahrene Piloten erforderte, um es richtig zu beherrschen."
me_262_fighter_equipment_desc:0	"Düsenjäger sind Flugzeuge mit Strahltriebwerk, die zum Angriff auf feindliche Luft- und Bodenziele eingesetzt werden."
me_262_fighter_equipment_1_short:0	"Me 262 A – Mehrzweck-Düsenjäger"
me_262_cas_equipment_1:0	"Messerschmitt 262 A-2 "Sturmvogel""
me_262_cas_equipment_1_desc:0	"Die Messerschmitt Me 262 Schwalbe war das weltweit erste einsatzfähige Düsenflugzeug. Die Konstruktionsarbeiten begannen bereits vor Kriegsbeginn, doch Probleme mit Werkstoffen, Triebwerken und politische Einmischungen verhinderten, dass das Flugzeug vor Mitte 1944 einsatzbereit wurde. Die Me 262 wurde von einem Jumo 004B angetrieben, der nur eine minimale Menge strategischer Werkstoffe benötigte und einfacher herzustellen war. Die Betriebsdauer des Jumo 004B, das nach 25 Stunden eine Überholung erforderte, betrug weitere 10 Stunden, bevor ein neues Turbinenrad benötigt wurde. Der Me 262-Düsenjäger war mit sechs in der Nase montierten Geschützen bewaffnet: zwei 20-mm-MG151/20-Kanonen, zwei 30-mm-MK-103-Kanonen und zwei 30-mm-MK-108-Kanonen. "
me_262_gun_upgrade_desc:0	"Fügt zwei zusätzliche 30-mm-Kanonen vom Typ MK 108 hinzu."
me_262_rocket_upgrade_desc:0	"Installiert insgesamt 24 R4M-Raketen unter den Tragflächen. "
me_262_engine_upgrade_desc:0	"Installiert zwei Bombenhalterungen, die jeweils bis zu 500 kg Bomben tragen können."
go_229_fighter_equipment_desc:0	"Jagdflugzeuge sind Düsenflugzeuge, die zum Angriff auf feindliche Luft- und Bodenziele eingesetzt werden."
