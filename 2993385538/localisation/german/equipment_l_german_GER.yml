GER_motorized_lia_equipment_01_desc:0	"In Zugstärke, stellt kein einzelnes Fahrzeug dar. Kleine Fahrzeuge und andere Fahrzeuge, die für Verbindungs- und Transportaufgaben im Feld eingesetzt werden."
