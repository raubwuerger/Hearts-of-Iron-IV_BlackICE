GER_mechanized_equipment_1:0	"Sonderkraftfahrzeug 251/1 Ausf. A"
GER_mechanized_equipment_1_desc:0	"Der Halbkettenwagen Sd.Kfz. 251 war ein gepanzertes Kampffahrzeug, das während des Zweiten Weltkriegs von der Firma Hanomag auf der Grundlage ihres früheren Sd.Kfz. 11 entwickelt und erstmals gebaut wurde. Der Motor war derselbe Maybach TUKRM HL 42 (4,17 l) wie beim Sd.Kfz. 11, mit einer Durchschnittsgeschwindigkeit von 52 km/h auf Straßen oder sehr flachem Gelände und 21 km/h im Gelände. \n\nDas Gewicht des Sd.Kfz. 251 betrug bei voller Beladung 8,5 Tonnen oder mehr. Es verfügte über eine Nutzlast von 1,5 Tonnen und eine Anhängelast von 2,7 Tonnen. Die normale Besatzung bestand aus 12 Mann, darunter der Fahrer, der Zugführer sowie zehn Panzergrenadiere mit ihrer Ausrüstung. \n\nDie Ausf. A (Ausführung A oder "A-Version") erschien Mitte 1939 und wurde in geringer Stückzahl produziert. Die ersten Ausf. A wurden den Panzergrenadieren der 1. Panzerdivision zugeteilt – der am besten ausgerüsteten Division der Wehrmacht bei Ausbruch des Polenfeldzugs."
GER_mechanized_equipment_2_short:0	"Sd.Kfz. 251/1 Ausf. C"
GER_mechanized_equipment_3:0	"Sonderkraftfahrzeug 251/1 Ausf. D"
GER_mechanized_equipment_3_desc:0	"Als Weiterentwicklung des Sd. Kfz. 251, die Ausf. D (Ausführung D oder "D-Version"), wurde im Frühjahr 1943 als eine Reihe kleinerer Änderungen in einer kostengünstigeren Bauweise für eine bessere Massenproduktion eingeführt. Insgesamt wurden zwischen 1943 und 1945 10.602 Exemplare von Hanomag und anderen Unternehmen gebaut. \n\nDie Modifikationen umfassten zahlreiche Änderungen am Produktionsdesign. Die Anzahl der Panzerplatten wurde von 19 auf 9 reduziert, und es wurden fest eingebaute Staukästen mit vorhängeschlossgesicherten Zugangsklappen hinzugefügt, die die früheren hinteren Schalldämpfer ersetzten. Einfache Sichtschlitze, einfache flache Motorhaubenplatten mit verlegten Lufteinlässen unter dem Rumpf, ein vereinfachtes, nach hinten abfallendes Heck mit flachen Türverkleidungen sowie viele weitere kleinere Modifikationen ermöglichten eine Vereinfachung der Konstruktion bei gleichbleibendem Schutz und waren zudem weitaus weniger arbeitsintensiv."
