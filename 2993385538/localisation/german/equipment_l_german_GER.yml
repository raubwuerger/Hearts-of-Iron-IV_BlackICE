ar_65_equipment_1:0	"Arado Ar 65"
ar_65_equipment_1_desc:0	": Die Arado Ar 65 war mit zwei 7,92-mm-MG17-Maschinengewehren bewaffnet, verfügte über eine größere Spannweite und einen leistungsstärkeren Motor als frühere Arado-Ar-Modelle. Das Flugzeug wurde schnell auf eine Ausbildungsrolle beschränkt, wobei 1937 ein Dutzend Exemplare an die Königlich-Bulgarische Luftwaffe übergeben wurden."
ar_65_fighter_equipment_1_short:0	"Ar 65 F Abfangjäger "
ar_76_equipment:0	"Ar-76 Notjäger"
ar_76_equipment_1:0	"Arado Ar 76"
ar_76_equipment_1_desc:0	"Die Arado Ar 76 wurde als leichter Jäger konzipiert, der zusätzlich als Fortgeschrittenen-Trainingsflugzeug dienen sollte. Das Flugzeug war mit zwei 7,92-mm-MG17-Maschinengewehren bewaffnet."
tech_me_109_fighter_equipment_1_desc:0	"Obwohl die Entwicklung der Bf 109 bereits 1934 begann, befinden sich die Prototypen noch immer in der Testphase. Wir sollten den Bayerischen Flugzeugwerken einige unserer Ingenieure zur Verfügung stellen, um die Entwicklung einer Serienversion voranzutreiben."
me_109_fighter_equipment_desc:0	"Jäger sind Flugzeuge, die dazu bestimmt sind, feindliche Flugzeuge zu zerstören."
me_109_fighter_equipment_1_short:0	"Bf 109 B Jagdflugzeug"
