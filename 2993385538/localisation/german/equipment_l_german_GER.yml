ju_88_bomber_equipment:0	" Ju-88A1 Schnellbomber"
ju_88_bomber_equipment_1:0	"Junkers 88 A-1"
ju_88_bomber_equipment_1_desc:0	"Ursprünglich als dreisitziger Hochgeschwindigkeitsbomber mit einer Nutzlast von bis zu 800 kg konzipiert, wurde die Junker Ju 88 vor Produktionsbeginn grundlegend umgebaut; das Flugzeug wurde von einem Bomber zu einem schweren Sturzbomber umfunktioniert. Die Tragflächen des Flugzeugs wurden verstärkt, Sturzbremsen hinzugefügt, der Rumpf verlängert und die Besatzungsstärke von drei auf vier erhöht. Die ersten Serienmodelle verfügten über eine Seilschneidevorrichtung zur Bekämpfung von Sperrballons. Das Flugzeug war mit mehreren Verteidigungsmaschinengewehren bewaffnet und konnte bis zu 1.000 kg Bomben tragen."
ju_88_a4_bomber_equipment_desc:0	"Schnelle Bomber sind Flugzeuge, die darauf ausgelegt sind, ihre hohe Geschwindigkeit zu nutzen, um feindlichen Flugzeugen auszuweichen oder ihnen zu entkommen, während sie feindliche Bodenziele angreifen."
