ju_88_p_equipment_1:0	"Junkers 88 P-2"
ju_88_p_equipment_1_desc:0	" Die Junkers Ju 88 P war eine Panzerabwehr- und Bomberjäger-Variante, die mit einer 75-mm-, 50-mm- oder zwei 37-mm-Kanonen in einer konformen, unter dem Rumpf angeordneten Geschützlafette ausgestattet war. Das Flugzeug wurde in kleiner Stückzahl produziert und galt sowohl im Panzerabwehr- als auch im Bomberjäger-Einsatz als Fehlschlag. Die P-1-Variante verfügte über eine einzelne 75-mm-Kanone. Die P -2 und P-3 verfügten über zwei 37-mm-Kanonen, wobei die P-3 eine stärkere Panzerung aufwies. Die P-4-Variante war mit einer einzelnen 50-mm-Kanone ausgerüstet. Eine geplante P-5-Variante wäre mit einer einzelnen 88-mm-Kanone bewaffnet worden.\n Ausgemusterte Junkers Ju 88 As können zu Ju 88 Ps umgerüstet werden."
hs_132_equipment_desc:0	"Düsenflugzeug, das für die Rolle der Luftnahunterstützung konzipiert wurde. "
tech_hs_132_cas_equipment_1_desc:0	"Die Hs 132 ist ein strahlgetriebenes CAS-Flugzeug."
