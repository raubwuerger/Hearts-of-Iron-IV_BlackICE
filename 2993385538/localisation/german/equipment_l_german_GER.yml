me_264_bomber_equipment_1:0	"Messerschmitt 264"
me_264_bomber_equipment_1_desc:0	" : Die Ursprünge der Messerschmitt Me 264 liegen in einem Projekt für ein Langstreckenaufklärungsflugzeug, bevor sie zu einem schweren Bomber umgebaut wurde. Die Me 264 wurde als viermotoriger Ganzmetallbomber konzipiert; der Rumpf war sehr leicht gepanzert und verfügte über nur wenig Verteidigungsbewaffnung, da man die Treibstoffkapazität und Reichweite erhöhen wollte. Das Interesse an dem Flugzeug schwand, und das Projekt wurde im September 1944 eingestellt. Messerschmitt schlug daraufhin eine sechsmotorige Version vor, die Me 264/6m oder Me 364, doch diese blieb stets auf dem Reißbrett."
ju_488_bomber_equipment_1:0	"Junkers 488"
ju_488_bomber_equipment_1_desc:0	"Die Junkers Ju 488 wurde als Notlösung für einen Langstreckenbomber konzipiert, bei dem bestehende Konstruktionen unpassend miteinander kombiniert wurden. Die Flugzeugzelle basierte auf der Ju 188, das Heck stammte von der Ju 288. Die Tragflächen wurden verlängert, und der Rumpf erhielt einen zusätzlichen Mittelteil, wodurch zwei weitere Triebwerke eingebaut werden konnten, sodass insgesamt vier Triebwerke zur Verfügung standen. Die Verteidigungsbewaffnung bestand aus zwei 20-mm-MG151-Kanonen in ferngesteuerten Heckgeschütztürmen. Die Flugzeugproduktion wurde an französische Unternehmen vergeben, und der erste Prototyp wurde im Juli 1944 von der französischen Résistance zerstört."
ju_287_bomber_equipment_desc:0	"Die Ju 287 war ein großer Düsenbomber."
ju_287_bomber_equipment_1_short:0	" Ju 287 V1 Düsen-Schwerbomber"
ju_287_bomber_equipment_2:0	"Junkers 287 V3"
ju_287_bomber_equipment_2_desc:0	"Obwohl in Deutschland begonnen, wurde der Prototyp für die Serienproduktion des Ju 287-Bombers erbeutet. Er wurde unter der Aufsicht sowjetischer Streitkräfte fertiggestellt, und es wurde eine kleine Serie auf Basis des Flugzeugs gebaut."
ar_234_bomber_equipment_desc:0	"Die Arado 234 ist ein Hochgeschwindigkeits-Düsenbomber."
ar_234_equipment_1_short:0	"Ar 234 B-2 Düsenbomber"
ar_234_scout_equipment_1:0	"Arado 234 B-1 "Blitz""
ar_234_scout_equipment_1_desc:0	"Die Arado Ar 234 B-1 war die Aufklärungsversion und war mit zwei Rb 50/30- oder zwei Rb 75/30-Kameras ausgestattet. Das Flugzeug setzte auf seine Geschwindigkeit, da es über keine Verteidigungswaffen verfügte."
