fw_200_bomber_equipment:0	"Fw-200C Marinebomber"
fw_200_c8_bomber_equipment:0	"Fw-200C8 Marinebomber"
fw_200_bomber_equipment_1:0	"Focke-Wulf 200 C-1 "Condor""
fw_200_bomber_equipment_1_desc:0	"Die Focke-Wulf Fw 200 C-Serie wurde als Marinebomber konzipiert, der eine 1.000-kg-Bombe oder mehrere Seeminen transportieren konnte. Die zusätzlichen Treibstofftanks, die Panzerung, die Verteidigungsmaschinengewehre und die Nutzlast belasteten die Flugzeugzelle."
fw_200_bomber_equipment_2_short:0	"Fw 200 C-3 Schwerer Marinebomber"
fw_200_transport_equipment:0	"Fw-200 Transport"
fw_200_transport_equipment_1:0	"Focke-Wulf 200 "Condor""
fw_200_transport_equipment_1_desc:0	"Die Focke-Wulf 200 wurde als viermotoriges Langstreckentransportflugzeug für die zivile Luftfahrt konzipiert. Die Kaiserlich Japanische Marine forderte eine militärische Variante für Such- und Patrouilleneinsätze an, doch da in Europa der Krieg ausbrach, gelangte sie nie in japanische Hände. Die militärische Version verfügte über Maschinengewehrstellungen zur Verteidigung, Panzerung sowie einen zentralen Bombenschacht, der in erster Linie für zusätzliche Treibstofftanks genutzt wurde. Das Flugzeug wurde von der Luftwaffe vor allem für den Transport von Kriegsmaterial eingesetzt. Ein Prototyp, die Fw 200 V3, wurde zu Adolf Hitlers persönlichem Transportflugzeug umgebaut und ersetzte dessen alte Junkers Ju 52. Am 18. Juli 1944 wurde Hitlers Fw 200 bei einem Bombenangriff auf Berlin zerstört."
tech_fw_200_transport_equipment_1_desc:0	"Militärische Transportversion eines viermotorigen Eindeckers, der ursprünglich von Focke-Wulf als Langstrecken-Passagierflugzeug entwickelt wurde."
he_111_j_bomber_equipment_desc:0	"Marinebomber sind Flugzeuge, die dazu bestimmt sind, feindliche Marineziele aufzuspüren und zu zerstören."
he_111_j_bomber_equipment_1_short:0	"He 111 J Marinebomber"
ju_88_a17_bomber_equipment:0	"J-88A17 Marinebomber"
ju_88_a17_bomber_equipment_1_short:0	"Ju 88 A-17 Marinebomber"
fw_200_c8_bomber_equipment_1:0	"Focke-Wulf 200 C-8 "Condor""
fw_200_c8_bomber_equipment_1_desc:0	": Die Variante Fw C-8 war mit dem Suchradar FuG 200 Hohentwiel im niedrigen UHF-Band ausgestattet.  Einige wenige Flugzeuge wurden mit dem Raketensteuerungssender FuG 203b Kehl ausgerüstet, doch die schwache Flugzeugzelle und die Anfälligkeit gegenüber feindlichen Flugzeugen machten das Flugzeug nicht zu einem idealen Marinebomber. \n\nVeraltete Focke-Wulf 200 C-3 können zu Fw 200 C-8 umgerüstet werden."
tech_fw_200_bomber_equipment_2:0	"Fw 200 C-3"
tech_fw_200_bomber_equipment_1_desc:0	 "Die Japaner haben bereits Interesse an einer Langstreckenbomber-Version des Fw 200-Passagierflugzeugs bekundet. Wir könnten diese Möglichkeit selbst prüfen."
tech_fw_200_bomber_equipment_3_desc:0	"Eine spätere Weiterentwicklung der Fw 200 mit schwereren Verteidigungswaffen und Radar."
tech_he_111_j_bomber_equipment_1_desc:0	"Die He 111 J war eine Weiterentwicklung der He 111 J, die für den Einsatz als Marinebomber vorgesehen war."
tech_ju_88_a17_bomber_equipment_1_desc:0	"Die Ju 88 A-17 war eine Weiterentwicklung der Ju 88, die für den Einsatz als Marinebomber vorgesehen war."
