ju_388_bomber_equipment:0	"Ju-388 Leichter Bomber"
ju_388_bomber_equipment_1:0	"Junkers 388"
ju_388_bomber_equipment_1_desc:0	"Das Reichsluftfahrtministerium erfuhr Ende 1942 von der amerikanischen B-29. Die gemunkelte Flughöhe des Flugzeugs lag außerhalb der Reichweite der bestehenden Flugabwehrgeschütze der Luftwaffe, und nur die seltene 128-mm-FlaK 40 konnte bis zu 14.800 Meter hoch schießen. Die Junkers 88 hatte sich als vielseitiges Flugzeug bewährt, und weitere Konstruktionsarbeiten führten zur Ju 188 und schließlich zur Ju 388. Die Junkers Ju 388 wurde als schwerer Bomber, Nachtjäger, Torpedobomber, Aufklärungsflugzeug und Höhenbomber konzipiert. Die Ju 388 K konnte bis zu 3.000 kg Bomben tragen."
ju_388_engine_upgrade_desc:0	"Rüsten Sie die Triebwerke auf den Jumo 222 auf, um die Flugleistung zu steigern."
tech_ju_388_bomber_equipment_1_desc:0	"Die Ju 388 ist ein leichter Bomber."
he_70_bomber_equipment_desc:0	"Schnelle Bomber sind Flugzeuge, die darauf ausgelegt sind, ihre hohe Geschwindigkeit zu nutzen, um feindlichen Flugzeugen auszuweichen oder ihnen zu entkommen, während sie feindliche Bodenziele angreifen."
he_70_bomber_equipment_1_short:0	"He 70 E Schnellbomber"
he_70_bomber_equipment_2:0	"Heinkel 270"
he_70_bomber_equipment_2_desc:0	"Die He 270 war eine Weiterentwicklung der He 70. Es handelt sich um einen Schnellbomber."
tech_ju_88_bomber_equipment_1_desc:0	"Die Junkers 88 A ist ein schneller leichter Bomber. Sie kann auch Sturzflüge durchführen."
tech_ju_88_a4_bomber_equipment_1_desc:0	"Durch die Behebung zahlreicher Leistungsprobleme ist die A-4 zuverlässiger und schneller als ihre Vorgängermodelle."
tech_ju_88_s_bomber_equipment_1_desc:0	"Die Ju 88 S wurde aus der Ju 88 entwickelt und ist ein schneller Bomber."
tech_ju_288_bomber_equipment_1_desc:0	"Die Ju 288 ist ein schneller Bomber."
ju_87_equipment_desc:0	"Luftnahunterstützungsflugzeuge dienen dazu, feindliche Bodenziele anzugreifen. "
ju_87_equipment_1_short:0	"Ju 87 A CAS"
ar_81_equipment:0	"Ar-81 Luftnahunterstützung"
ar_81_equipment_1:0	"Arado 81"
ar_81_equipment_1_desc:0	"Obwohl sich die Junkers Ju 87 bereits im Prototypenstadium befand, hatte das Luftfahrtministerium alternative Entwürfe angefordert. Die Arado Ar 81 war ein Ganzmetall-Doppeldecker, der vorne mit einem einzigen 7,92-mm-MG17 und hinten mit einem defensiven 7,92-mm-MG15 bewaffnet war und 250 kg Bomben tragen konnte. Obwohl die Arado Ar 81 anfangs in Bezug auf Manövrierfähigkeit, Reichweite und Steigleistung der Junkers Ju 87 überlegen war, hatte sie aufgrund ihrer Doppeldeckerkonstruktion ein geringeres Entwicklungspotenzial."
he_118_equipment_desc:0	"Flugzeuge zur Luftnahunterstützung sind für den Angriff auf feindliche Bodenziele vorgesehen."
he_118_equipment_1_short:0	"He 118 CAS"
ju_87_b_equipment:0	"Ju-87B Luftnahunterstützung"
ju_87_equipment_2:0	" Junkers 87 B "Stuka""
ju_87_equipment_2_desc:0	"Der Hauptunterschied zwischen einer Junkers Ju 87 A und einer B bestand darin, dass letztere nun eine zweiköpfige Besatzung befördern konnte. Die Flugzeugzelle war in Abschnitte unterteilt, um den Transport per Bahn oder Lkw zu ermöglichen. Das Flugzeug behielt zwei 7,92-mm-MG17 bei, eines in jedem Flügel, sowie ein 7,92-mm-MG15 im Heck zu Verteidigungszwecken. Die Bombenlast bestand entweder aus einer 250-kg-Bombe oder vier 50-kg-Bomben.\nVeraltete Ju 87A können zu Ju 87B umgerüstet werden."
ju_87_equipment_3_short:0	"Ju 87 B-2 CAS"
ju_87_d_equipment:0	"Ju-87D Luftnahunterstützung"
ju_87_equipment_4:0	"Junkers 87 D "Stuka" "
ju_87_equipment_4_desc:0	"Die Ju 87 D-Serie war ein Versuch, die in den frühen Kriegsphasen zutage getretenen Schwachstellen zu beheben. Die Panzerung des Flugzeugs wurde verstärkt, und im Heck wurde ein doppelläufiges 7,92-mm-MG 81Z eingebaut. Ein neuer, leistungsstärkerer Motor, der Jumo 211J, wurde eingebaut, wodurch das Flugzeug bis zu 1. 800 kg Bomben zu transportieren. Zudem wurde die Treibstoffkapazität erhöht, und die Möglichkeit, Zusatztanks an den Tragflächen anzubringen, ermöglichte eine Flugzeit von vier Stunden.\n\nAufgrund der umfangreichen Änderungen können veraltete Ju 87 B-2 nicht zu Ju 87 D umgerüstet werden."
ju_87_d5_equipment_desc:0	"Luftnahunterstützungsflugzeuge sind für den Angriff auf feindliche Bodenziele vorgesehen."
ju_87_equipment_5_short:0	"Ju 87 D-5 CAS"
ju_cv_87:0	"Ju 87"
ju_87_cv_equipment_desc:0	"Ju 87-Sturzkampfbomber, modifiziert für den Einsatz von Flugzeugträgern aus."
ju_87_cv_equipment_1_short:0	"Ju 87 C Träger-CAS"
ju_87_cv_equipment_2:0	"Junkers 87 D-4 "Stuka""
ju_87_cv_equipment_2_desc:0	" Die Variante Ju 87 D-4 war ein geplanter Torpedobomber, der an Bord der Graf Zeppelin zum Einsatz kommen sollte. Das Flugzeug sollte einen 750–950 kg schweren Lufttorpedo tragen, der auf dem japanischen Typ-91-Entwurf basierte, der speziell für Schiffe in seichten Gewässern entwickelt worden war. Im Gegensatz zu anderen Varianten der D-Serie verfügte die D-4 über zwei 20-mm-MG151/20-Kanonen, und die Munition des Heckschützen wurde auf 2.000 Schuss erhöht.\nVeraltete Junkers Ju 87 D können zu Junkers Ju 87 D-4 umgebaut werden."
tech_ju_87_equipment_1_desc:0	" Während einige die Fähigkeit eines Piloten anzweifeln, Sturzflüge zuverlässig durchzuführen, ohne abzustürzen, spricht sich Ernst Udet sehr deutlich für diese Idee aus. Ein Junkers-Ingenieur entwirft bereits seit einiger Zeit einen Bomber speziell für diese Aufgabe, doch der Entwurf muss noch stark verfeinert werden."
tech_ju_87_equipment_2_desc:0	"Die ersten Versionen der Stuka haben die Wirksamkeit des Sturzflugbombenangriffs unter Beweis gestellt, doch das Flugzeug ist derzeit untermotorisiert und unterbewaffnet. Ein neueres Modell sollte diese Probleme beheben."
tech_ju_87_equipment_3_desc:0	"Der Einbau eines leistungsstärkeren Triebwerks wird eine Erhöhung der Bombenlast ermöglichen."
tech_ju_87_cv_equipment_1_desc:0	"Angesichts des Erfolgs der Stuka hat die Kriegsmarine Interesse an einer Version des Flugzeugs bekundet, die von einem Flugzeugträger aus eingesetzt werden kann."
tech_ju_87_cv_equipment_2_desc:0	"Die Variante Ju 87 D-4 war ein vorgeschlagener Torpedobomber, der an Bord der Graf Zeppelin eingesetzt werden sollte. Das Flugzeug sollte einen 750–950 kg schweren Lufttorpedo tragen, der auf dem japanischen Typ-91-Entwurf basierte, der speziell für Schiffe in seichten Gewässern entwickelt worden war. Im Gegensatz zu anderen Varianten der D-Serie verfügte die D-4 über zwei 20-mm-MG151/20-Kanonen, und die Munitionskapazität des Heckschützen Munition auf 2.000 Schuss erhöht.\n\nVeraltete Junker Ju 87 D können zu Junker Ju 87 D-4 umgerüstet werden."
tech_ju_87_equipment_4_desc:0	"Die Stuka ist nach wie vor untermotorisiert und kann ihr volles Potenzial noch nicht ausschöpfen. "
tech_ju_87_equipment_5_desc:0	"Die D-5 führt bei der Stuka einen größeren Flügel ein."
ju_87_torp_equipment:0	"Ju 87 D-4"
hs_129_equipment:0	"Hs-129 Luftnahunterstützung"
hs_129_equipment_1:0	" Henschel Hs 129 B1"
hs_129_equipment_1_desc:0	"Die Henschel Hs 129 wurde mit einer wesentlichen Einschränkung konzipiert: Sie konnte andere, gefragte Motoren wie den DB 600 und den DB 601 verwenden. Zunächst wurde das Flugzeug mit dem Argus As 410 ausgestattet, wodurch es stark untermotorisiert war und kaum fliegen konnte. Die überarbeitete B1-Version verwendete den französischen Gnome-Rhône 14M, wodurch das Flugzeug eine außergewöhnlich gute Leistung erbrachte. Ursprünglich mit zwei 7,92-mm-MG17-Maschinengewehren und zwei 20-mm-MG 151/20-Kanonen bewaffnet, wurden die Flugzeuge später mit einer 30-mm-MK 101-Kanone mit panzerbrechender Munition ausgerüstet."
tech_hs_129_equipment_1_desc:0	"Die Henschel Hs 129 wurde unter einer wesentlichen Einschränkung entwickelt: Sie konnte andere, gefragte Triebwerke wie den DB 600 und den DB 601 verwenden. Zunächst wurde das Flugzeug mit dem Argus As 410 ausgestattet, wodurch es stark untermotorisiert war und kaum fliegen konnte. Bei der Überarbeitung zur B1-Version kam der französische Gnome-Rhône 14M zum Einsatz, wodurch das Flugzeug eine außergewöhnlich gute Leistung erbrachte. Ursprünglich mit zwei 7,92-mm-MG17-Maschinengewehren und zwei 20-mm-MG 151/20-Kanonen bewaffnet, wurden die Flugzeuge später mit einer 30-mm-MK-101-Kanone mit panzerbrechender Munition ausgerüstet."
hs_129_equipment_2_short:0	"Hs 129 B2 Heavy CAS"
tech_hs_129_equipment_2:0	"Hs 129 B2"
