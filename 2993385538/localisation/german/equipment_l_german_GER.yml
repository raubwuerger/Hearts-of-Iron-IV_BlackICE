panzer_iii_td_equipment_1_desc:0	"\nKann vom Panzer III umgebaut werden \n\nDie ersten Versionen des Sturmgeschützes III, einer Sturmkanone zur Unterstützung der Infanterie gegen gepanzerte Ziele. Um im Vergleich zu einem Panzer Kosten zu sparen, wurde auf einen Turm verzichtet; stattdessen wurde die 7,5-cm-StuK-37-L/24-Kanone (die gleiche wie beim frühen Panzer IV) direkt in die Panzerung eingebaut."
