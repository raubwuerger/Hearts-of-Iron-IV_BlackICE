fw_190_f_equipment_1_desc:0	"Nach dem Erfolg der Fw 190 A-4 wurde eine echte Bodenangriffsversion entwickelt. Da bereits ein mittig montierter Bombenhalter für eine 250-kg-Bombe vorhanden war, wurden zusätzliche Halterungen unter den Tragflächen angebracht, die insgesamt vier 50-kg-Bomben aufnehmen konnten."
fw_190_g_equipment_desc:0	"Luftnahunterstützungsflugzeuge sind für den Angriff auf feindliche Bodenziele vorgesehen."
