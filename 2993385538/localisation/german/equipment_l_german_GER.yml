ju_88_s_bomber_equipment:0	"Ju-88S Schnellbomber"
ju_88_s_bomber_equipment_1:0	"Junkers 88 S"
ju_88_s_bomber_equipment_1_desc:0	" Die Junkers Ju 88 S war ein Hochgeschwindigkeitsbomber mit einer glatt verglasten Nase, die die aerodynamische Leistung des Flugzeugs steigerte. Es wurde ein GM-1-Lachgas-Boost-System eingebaut, das den Sauerstoffanteil im Kraftstoffgemisch erhöhte und zu einer besseren Leistung in großen Höhen führte. Weitere Varianten der S-Serie sollten über leistungsstärkere Triebwerke verfügen und die Bombenlast durch den Einsatz von Verlängerungen des Bombenschachts aus Holz erhöhen.\n|___ NL002745___|Aufgrund umfangreicher Änderungen können frühere Ju 88 nicht zu Ju 88 S umgerüstet werden."
ju_88s_gun_upgrade_desc:0	"Fügt eine zusätzliche Verteidigungsgeschützstellung mit einer MG 81Z-Installation hinzu. "
ju_88s_engine_upgrade_desc:0	"Ein leistungsstärkerer Motor wird die Flugleistung des Flugzeugs verbessern."
ju_88s_bomb_upgrade_desc:0	"Modifikationen am Flugzeug, um den Transport von zusätzlichen 1000 kg Bomben zu ermöglichen."
tech_ju_188_bomber_equipment_1_desc:0	"Die Ju 188 A ist ein leichter Bomber."
tech_ju_188_nav_bomber_equipment_1_desc:0	"Die Junkers Ju 188 E war mit einem UHF-Band-Seeaufklärungsradar vom Typ FuG 200 Hohentwiel ausgestattet -Band-Seeaufklärungsradar FuG 200 Hohentwiel, und die äußeren Bombenhalterungen an den Tragflächen wurden entfernt, um Platz für einen Torpedo zu schaffen. Die erhöhte Nutzlast an Bomben und Torpedos beeinträchtigte die Leistung des Flugzeugs.\n\nVeraltete Junkers Ju 188 A können zu Ju 188 E umgerüstet werden ."
ju_188_bomber_equipment_desc:0	"Leichte Bomber sind mehrmotorige Flugzeuge, die für Angriffe auf feindliche Boden- und strategische Ziele konzipiert sind."
ju_188_bomber_equipment_1_short:0	"Ju 188 A Leichter Bomber"
ju_188_nav_bomber_equipment:0	"Ju-188E Marinebomber"
ju_188_nav_bomber_equipment_1:0	"Junkers 188 E"
ju_188_nav_bomber_equipment_1_desc:0	"Die Junkers Ju 188 E war mit einem FuG 200 Hohentwiel-Seeaufklärungsradar im niedrigen UHF-Band ausgestattet, und die äußeren Bombenhalterungen an den Tragflächen wurden entfernt, um Platz für einen Torpedo zu schaffen. Die erhöhte Nutzlast an Bomben und Torpedos beeinträchtigte die Leistung des Flugzeugs."\n Veraltet Junkers Ju 188 A kann in eine Ju 188 E umgerüstet werden."
ju_188_engine_upgrade_desc:0	"Die für die Ju 188 benötigten Triebwerke werden auch in anderen Flugzeugen benötigt und sind nicht billig. Durch den Wechsel zum BMW 801 können wir die Produktionsbelastung verringern, wobei die Flugleistung nur geringfügig beeinträchtigt wird. "
ju_288_bomber_equipment_desc:0	"Schnelle Bomber sind Flugzeuge, die darauf ausgelegt sind, ihre hohe Geschwindigkeit zu nutzen, um feindlichen Flugzeugen auszuweichen oder ihnen zu entkommen, während sie feindliche Bodenziele angreifen."
ju_288_bomber_equipment_1_short:0	"Ju 288 Schneller Bomber"
ju_288_engine_upgrade:0	"Triebwerke"
ju_288_bomb_upgrade:0	"Bomben"
