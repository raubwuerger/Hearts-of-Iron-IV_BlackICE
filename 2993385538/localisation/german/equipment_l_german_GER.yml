ss_infantry_uniforms_2:0	"SS-Felduniformen Mod. 44 III"

ss_infantry_uniforms_2_desc:0	"SS Uniformen, Helme, Stiefel und Ausrüstungen für die Truppe"

ss_infantry_uniforms_3_short:0	"SS-Felduniformen M45"


