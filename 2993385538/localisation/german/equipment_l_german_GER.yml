GER_assault_rifle_short:0	"StG 44"

GER_assault_rifle_equipment_0:0	"Sturmgewehr 44"

GER_assault_rifle_equipment_0_desc:0	"Das Sturmgewehr 44 wurde von Hugo Schmeisser entwickelt, der 1916 auch die erste deutsche Maschinenpistole, die MP 18, entwickelt hatte. In seiner langen und bewegten Entwicklungsgeschichte wurde das StG 44 ursprünglich als MP 43 und später als MP 44 bezeichnet, aber aus Propagandazwecken geändert. Ziel des Entwurfs war es, die Leistung von Repetiergewehren, die Kompaktheit von Karabinern und die Feuergeschwindigkeit von Maschinenpistolen zu kombinieren. Diese Anforderungen entstanden während des Einmarsches in die Sowjetunion, wo die Rote Armee immer mehr halbautomatische Tokarew SVT-38 und SVT-40 einsetzte, während einige sowjetische Schützenkompanien komplett mit PPSh-41-Maschinenpistolen ausgerüstet waren. Nachdem die deutschen Befehlshaber die Erfahrung gemacht hatten, dass diese Waffen in großem Umfang automatisch schossen, überdachten sie ihren Bedarf an Handfeuerwaffen. Es wurden mehrere Versuche unternommen, leichte Maschinengewehre oder automatische Gewehre einzuführen, aber der Rückstoß der mächtigen 7,92×57-mm-Mauser-Patrone war bei automatischem Feuer zu schwer zu kontrollieren. \npätestens 1941 wurde klar, dass etwas unternommen werden musste. Obwohl zu diesem Zeitpunkt bereits verschiedene Versuchsgeschosse entwickelt worden waren, entschied sich die Armee stattdessen für eine neue Konstruktion, die Polte 8×33mm Kurzpatrone. Bei dieser Patrone wurden ein Spitzgeschoss und die Grundkonstruktion der Standardpatrone 7,92×57mm Mauser verwendet, wodurch die Patrone von der ursprünglichen 7,92×57mm Mauser auf 7,92×33mm Kurz gekürzt wurde. Man war sich darüber im Klaren, dass dies nicht ideal war, aber es würde die logistischen Probleme minimieren. \nie Produktions- und Logistikprobleme in der Spätphase des Krieges führten dazu, dass in Deutschland zwischen 1943 und 1945 in vier Werken nur über 400.000 Stück produziert wurden. Das waren weniger als die bestellten 1.500.000 und weit weniger als die geplanten 4.000.000."

GER_infantry_equipment_0:0	"Gewehr 98"

GER_infantry_equipment_0_desc:0	"Das Gewehr 98 ist ein Repetiergewehr, das von der Firma Mauser entwickelt wurde und das frühere Gewehr 1888 ablöste. Es wurde zwischen 1898 und 1918 hergestellt und war von 1898 bis 1935 das Hauptdienstgewehr der deutschen Streitkräfte. Das Gewehr 98 diente zum Verschießen der Mauser-Patrone 7,92 x 57 mm und hatte ein 5-Schuss-Magazin, das mit einem Abstreifer geladen wurde. Das Gewehr war 1.250 mm lang und 4,09 kg schwer. Das Repetiersystem war besonders innovativ und wurde von anderen Großmächten in ihre Konstruktionen übernommen. \nom Gewehr 98 gab es mehrere Varianten, wie das Scharfschützen-Gewehr 98, das kürzere und leichtere Kavalleriemodell Karabiner 98AZ (später in Karabiner 98a umbenannt) und den Karabiner 98b, der nur dem Namen nach ein Karabiner war und dem Versailler Vertrag entsprach (in dem Deutschland Produktionsbeschränkungen für Waffen festgelegt wurden). Mehr als 9.000.000 Gewehre wurden von verschiedenen deutschen Herstellern gebaut, und eine beträchtliche Anzahl wurde ins Osmanische Reich, nach Mexiko, Argentinien und China exportiert. Andere Länder, wie Polen und die Tschechoslowakei, produzierten ihre eigenen"

GER_infantry_equipment_1_short:0	"Karabiner 98k"

GER_infantry_equipment_2:0	"Gewehr 41(M) / Gewehr 41(W)"

GER_infantry_equipment_2_desc:0	"Nach dem Beginn der Feindseligkeiten und den Feldzügen in Polen und Frankreich wurde die Notwendigkeit eines halbautomatischen Gewehrs schnell erkannt. Nach der deutschen Doktrin für Handfeuerwaffen aus der Vorkriegszeit beruhte die Feuerkraft eines Trupps auf den Maschinengewehren, so dass die Rolle des Schützen hauptsächlich darin bestand, Munition zu transportieren und den Maschinengewehrschützen Feuerschutz zu geben. Es lag auf der Hand, dass eine Erhöhung der Feuerrate des Gewehrschützen einer Einheit die Kampfleistung der Infanterieeinheiten erheblich verbessern würde. \n1940 forderte die Armee einen Entwurf für ein halbautomatisches Gewehr mit drei Spezifikationen. Erstens durften keine Löcher in den Lauf gebohrt werden, um Gas für den Lademechanismus anzuzapfen. Zweitens durften die Gewehre keine beweglichen Teile an der Oberfläche haben. Drittens sollte für den Fall, dass der Selbstlademechanismus versagt, ein Repetierverschluss vorhanden sein. Die Waffenhersteller Mauser und Walther reichten Entwürfe für Gewehre ein, die dieselbe 7,92x57-mm-Mauser-Patrone mit Karabiner 98k verwendeten, aber das Bang-System (benannt nach seinem dänischen Konstrukteur Soren H. Bang) nutzten, um halbautomatisches Schießen zu ermöglichen. Sie hatte ein internes 10-Schuss-Magazin, das mit Abstreifern geladen wurde. \nDer Mauser-Entwurf mit der Bezeichnung Gewehr 41(M) erfüllte zwar alle Spezifikationen der Armee, war aber insgesamt sehr komplex, unzuverlässig, schwer (4,09 kg) und hatte Probleme mit der Präzision. Walthers Entwurf mit der Bezeichnung Gewehr 41(W) verzichtete auf die letzten beiden Spezifikationen, war aber im Vergleich zum Gewehr 41(M) weniger komplex. Allerdings gab es immer noch Probleme mit dem Gassystem, und das Gewehr war schwer zu warten. Dennoch war es vielversprechend genug für die weitere Entwicklung. \nÜber 140.000 Stück wurden zwischen 1941 und 1943 produziert."

GER_infantry_equipment_3_short:0	"Gewehr 43"

GER_SMG_equipment_0:0	"Maschinenpistole 35"

GER_SMG_equipment_0_desc:0	"Die Maschinenpistole 35 wurde 1932 von Emil Bergmann entworfen, dessen Firma auch eine der ersten Maschinenpistolen des Ersten Weltkriegs, die MP 18, herstellte. Die MP35 verwendete die 9×19-mm-Luger-Parabellum-Patrone und hatte ein abnehmbares Magazin für 24 oder 32 Schuss. Im Gegensatz zu vielen anderen Maschinenpistolen der damaligen Zeit wurde das Magazin der MP35 von der rechten Seite der Waffe aus eingelegt. Die MP35 war ein selektiv feuerndes Maschinengewehr mit Blowback-Funktion, das über einen offenen Verschluss abgefeuert wurde. Die Waffe verfügte über einen nicht umkehrbaren Spanngriff an der Rückseite des Gehäuses, der ähnlich wie beim Repetiergewehr eines Mauser-Gewehrs bedient wurde. Dazu musste der Waffenträger den Griff manuell nach oben ziehen, nach hinten ziehen, nach vorne drücken und wieder nach unten verriegeln. Wenn die Waffe dann abgefeuert wurde, blieb der Spannhebel stehen. \nwischen 1935 und 1944 wurden mehr als 40.000 Exemplare hergestellt, wobei der Hauptnutzer die Einheiten der Waffen-SS waren. Aufgrund der begrenzten Fertigungskapazitäten im Bergmann-Werk musste die Produktion in das Werk von Carl Walther in Zella-Mehlis verlagert werden. Bei Kriegsausbruch wurde die Produktion erneut von Walther auf das Werk Junker & Ruh verlagert."

GER_SMG_equipment_1_short:0	"MP 38"

GER_SMG_equipment_2:0	"Maschinenpistole 40"

GER_SMG_equipment_2_desc:0	"Die Maschinenpistole 40 basiert auf der Maschinenpistole 38, die nur zwei Jahre zuvor entworfen worden war. Ziel der MP 40 war es, die Produktionskosten der MP 38 weiter zu senken, indem gestanzter Stahl anstelle von gefrästem Stahl verwendet wurde. Für die Griffe wurde Bakelit anstelle von Holz- oder Ledergriffschalen verwendet. Die Längsrillen am Gehäuse und am Verschluss sowie die kreisförmige Öffnung am Magazingehäuse wurden ebenfalls aus der MP 40 entfernt. Die MP 40 verwendete die 9×19 mm Luger Parabellum-Patrone und hatte ein abnehmbares Magazin für 32 Schuss. Ein wesentlicher Konstruktionsfehler der MP 40 war das 32-Schuss-Magazin. Im Gegensatz zu den meisten anderen Maschinenpistolen der damaligen Zeit verfügte die MP 40 über einen zweispaltigen Einsatz mit Einzelzuführung. Der einspaltige Einsatz führte zu einer erhöhten Reibung zwischen den verbleibenden Patronen, die sich nach oben in Richtung der Zuführungslippen bewegten, was gelegentlich zu Zuführungsfehlern führte; dieses Problem wurde durch das Vorhandensein von Schmutz oder anderen Verunreinigungen noch verschärft. Ein weiteres Problem bestand darin, dass das Magazin manchmal auch als Griffstück missbraucht wurde. Dies konnte zu Fehlfunktionen der Waffe führen, wenn der Druck der Hand auf den Magazinkörper dazu führte, dass sich die Magazinlippen aus der Zuführungslinie bewegten, da der Magazinschacht das Magazin nicht fest verriegelt hielt. \nu den Varianten der MP 40 gehörte die unzuverlässige MP 40/I, die mit zwei Magazinen ausgestattet war, um die Munitionskapazität in die Nähe der sowjetischen PPSh-41 zu bringen. Zwischen 1940 und 1945 wurden mehr als 1.000.000 Stück produziert. Exportierte und erbeutete Einheiten wurden noch lange nach dem Krieg verwendet."

GER_SMG_equipment_3_short:0	"MP 3008"

GER_HMG_equipment_0:0	"Maschinengewehr 30"

GER_HMG_equipment_0_short:0	"MG 30"

GER_HMG_equipment_1_desc:0	"Das Maschinengewehr 34 (abgekürzt MG 34) ist ein deutsches Maschinengewehr, das 1934 von Heinrich Vollmer von Mauser entworfen wurde. Das MG 34 basierte auf dem früheren Maschinengewehr MG 30, übernahm aber auch Konstruktionselemente von anderen Maschinengewehren. \nas MG 34 war eine luftgekühlte, rückstoßbetriebene Konstruktion, die mit der Standardmunition 7,92×57 mm von Mauser verschossen wurde. Das MG 34 konnte mit einem Gürtelmagazin mit 50/250 Schuss oder einem Trommelmagazin mit 50/75 Schuss bestückt werden. Ähnlich wie das MG 30 verfügte es über eine Selektionsfunktion mit Hilfe eines einzigartigen Abzugs mit doppelter Krümmung. Wird der obere Teil des Abzugs gedrückt, erfolgt eine halbautomatische Schussabgabe, während das Halten des unteren Teils des Abzugs eine vollautomatische Schussabgabe bewirkt. Der Lauf des MG 34 konnte schnell gewechselt werden, um eine Überhitzung bei Dauerfeuer durch die Maschinengewehrbesatzung zu vermeiden. \nas MG 34 war eine erfolgreiche Konstruktion und wurde auch nach der Einführung des MG 42 noch bis zum Kriegsende produziert. Insgesamt wurden über 500.000 Stück produziert. Die meisten deutschen Panzer verwendeten das MG 34 als Sekundärbewaffnung, da das MG 42 aufgrund der Art des Rohrwechsels für die interne/koaxiale Montage ungeeignet war. Das Rohr des MG 42 musste entfernt und ersetzt werden, indem das Rohr in einem Winkel herausgeschoben wurde, so dass bei der Montage auf einem gepanzerten Fahrzeug die Panzerung und der Platz für die Waffe beeinträchtigt werden mussten."

GER_HMG_equipment_2:0	"Maschinengewehr 42"

GER_HMG_equipment_2_short:0	"MG 42"

GER_HMG_equipment_3_desc:0	"Das Maschinengewehr 42V (abgekürzt MG 42V), auch bekannt als MG 45, ist ein deutsches Maschinengewehr, das 1944 von Dr. Werner Gruner von der Großfuß AG entwickelt wurde. Die Entwicklung zielte auf eine weitere Vereinfachung der MG 42-Konstruktion aufgrund der schweren Materialknappheit in Deutschland in der Spätphase des Krieges. \nWährend viele Teile des MG 42V mit denen des MG 42 identisch waren, wie z.B. die Patrone 7,92×57mm, die Munitionszuführung, die Abzugsgruppe und Teile des Hinterschaftes, war der Bedienungsmechanismus völlig anders. Im Vergleich zum rückstoßbetätigten, rollengesperrten Mechanismus des MG 42 verwendete das MG 42V einen rollenverzögerten Rückstoßmechanismus. Dieser neue Mechanismus verriegelte den Verschluss vor dem Abfeuern nicht vollständig, wodurch die Feuergeschwindigkeit erhöht und gleichzeitig die Konstruktion vereinfacht wurde. Der Lauf war ein einfacheres Teil ohne Verschlussstück mit einer Lebensdauer von über 10.000 Schuss. Für das MG 42V wurde Stahl von geringerer Qualität verwendet, was das Gewicht auf 9 kg reduzierte. \nie Erprobung begann 1944 mit 10 Prototypen, wobei das MG 42V eine Feuerrate von 1.350 Umdrehungen pro Minute erreichte. Kriegsbedingte Produktionsprioritäten und andere Anforderungen verhinderten jedoch die Massenproduktion und die Übernahme der Waffe durch die Wehrmacht."

GER_mortar_equipment_0:0	"5 cm leichter Granatwerfer 36"

GER_mortar_equipment_0_short:0	"5 cm leGrW 36"

GER_mortar_equipment_1_desc:0	"Der 8 cm Granatwerfer 34 (8 cm GrW 34) ist ein deutscher Mörser, der 1934 von Rheinmetall entwickelt wurde. Der Mörser hatte eine konventionelle Bauweise und war für den Transport in drei Teile zerlegbar (Glattrohr, Zweibein, Bodenplatte). Am Zweibein war ein Handrad zum Verschieben und ein Handrad zum Nivellieren unterhalb des Hebemechanismus angebracht. Auf dem Joch des Verstellmechanismus war ein Panoramavisier zur Feinjustierung angebracht. Für die grobe Verlegung konnte eine Linie auf dem Rohr verwendet werden. \ner Mörser verwendete herkömmliche 8-cm Granaten von 3,5 kg (hochexplosiv oder Rauch) mit Perkussionszündern. Die Reichweite konnte durch die Anbringung von bis zu drei zusätzlichen Pulverladungen zwischen den Granatenheckrohren erhöht werden. \nie 8 cm GrW 34 zeichnete sich durch ihre Präzision und hohe Feuerrate aus. Bis zum Kriegsende wurden über 75.000 Stück und 74.000.000 8-cm Granaten produziert."

GER_mortar_equipment_2:0	"kurzer 8 cm Granatwerfer 42"

GER_mortar_equipment_2_short:0	"kz 8 cm GrW 42"

GER_mortar_equipment_3_desc:0	"Der 12 cm Granatwerfer 42 (12 cm GrW 42) ist ein deutscher Mörser aus dem Jahr 1942. Die Vergrößerung des Kalibers war ein Versuch, den deutschen Infanterieeinheiten eine Nahkampfwaffe zur Verfügung zu stellen, die leistungsfähiger war als die zu dieser Zeit allgemein verwendeten Mörser. Diese Waffe war dem von den sowjetischen Streitkräften an der Ostfront verwendeten Mörser sehr ähnlich, der wiederum eine verbesserte Version des französischen 120-mm Mörsers Brandt Mle 1935 war. \nDer GrW 42 verfügte über die übliche dreiteilige Konstruktion, bestehend aus einer kreisförmigen Grundplatte wie bei der früheren sowjetischen Konstruktion, dem Rohr selbst und dem tragenden Zweipfosten. Wegen des höheren Gewichts der Waffe (280 kg) wurde eine zweirädrige Achse verwendet, die es ermöglichte, den Mörser in den Einsatz zu schleppen. Die Achse konnte dann vor dem Abfeuern schnell entfernt werden. \nBis zum Kriegsende wurden über 8.000 Stück und 5.000.000 12-cm Granaten produziert."


GER_mechanized_at_0_short:0	"Sd.Kfz. 251/10"

GER_mechanized_aa_0:0	"Sonderkraftfahrzeug 251/17 2 cm KwK 38"

GER_mechanized_aa_0_desc:0	"Sd.Kfz. 251/17 war die Flugabwehrvariante des Sd.Kfz. 251. Es war mit der 2 cm KwK 38 (bzw. der 2 cm FlaK 38 für die Version der Luftwaffe) ausgestattet, die in einem kleinen Turm montiert war und eine Sockellafette hatte. Die Kanone war um 360 Grad schwenkbar und konnte gegen alle Flugzeuge mit Ausnahme der schwersten Panzer eingesetzt werden. \nas Sd.Kfz. 251/17 wurden in der Regel in Vierergruppen eingesetzt und von einer Führungsversion ohne Kanone, aber mit FU-10-Funkgerät und Rahmenantenne sowie zwei MG 34 oder 42 für die Nahverteidigung angeführt."

GER_mechanized_hmg_0_short:0	"Sd.Kfz. 251/21"

GER_mechanized_mortar_0:0	"Sonderkraftfahrzeug 251/2 8 cm GrW 34"

GER_mechanized_mortar_0_desc:0	"Sd.Kfz. 251/2 war die Mörserträger-Variante des Sd.Kfz. 251. Er war mit einem 8 cm GrW 34 Mörser ausgestattet und konnte 66 Schuss aufnehmen. Die Konstruktion war mit einem verstärkten Boden ausgestattet, um den Rückstoß des Mörsers abzufangen, und der Mörser selbst konnte bei Bedarf aus dem Fahrzeug entladen werden. \nas Sd.Kfz. 251/2 wurden im Allgemeinen paarweise in Zügen zur Unterstützung der Infanterie eingesetzt."

panzer_i_equipment_1:0	"Panzer I 

panzer_i_equipment_1_desc:0	"Der Panzer I war ein leichter Panzer, der in den 1930er Jahren in Deutschland hergestellt wurde.\nDer Name ist eine Abkürzung für den deutschen Panzerkampfwagen I, abgekürzt PzKpfw I.\nDie offizielle deutsche Bezeichnung des Panzers lautete SdKfz 101 (\"Spezialfahrzeug 101")"

light_panzer_td_equipment_1:0	"Leichter Panzerjäger"

light_panzer_td_equipment_1_desc:0	"Typ der Einheit: Leichter Panzerjäger. \ner Panzerjäger I war der erste der deutschen Panzerjäger, der im Zweiten Weltkrieg eingesetzt wurde. Er war mit einer tschechischen Škoda 4,7 cm PaK (t) Panzerabwehrkanone auf einem umgebauten Fahrgestell des Panzer I Ausf. B ausgestattet. Er sollte gegen schwere französische Panzer wie den Char B1 eingesetzt werden, die den Fähigkeiten der 3,7 cm PaK 36-Panzerabwehrkanone nicht gewachsen waren, und diente dazu, die Lebensdauer der veralteten Panzer I zu verlängern. 202 Panzer I wurden in den Jahren 1940 und 1941 zum Panzerjäger I umgebaut. Sie wurden in der Schlacht um Frankreich, im Nordafrika-Feldzug und an der Ostfront eingesetzt."

light_assault_panzer_equipment_1:0	"Leichtes Sturmgeschütz"

light_assault_panzer_equipment_1_desc:0	"Typ der Einheit: Leichtes Sturmgeschütz. \nann umgerüstet werden von: Panzer I \n\nDer Sturmpanzer trägt das 15cm schwere Infanteriegeschütz auf dem Fahrgestell des Panzer I, um den motorisierten Infanterieelementen der Panzerdivisionen Feuerunterstützung gegen Befestigungen zu geben."

panzer_spaa_equipment_1:0	"Selbstfahrende Luftabwehr"

panzer_spaa_equipment_1_desc:0	"Einheitstyp: Selbstfahrende Luftabwehr. \nann umgerüstet werden aus: Panzer I \n\nDie Luftabwehrartillerie ist in erster Linie dazu gedacht, feindliche Flugzeuge abzuschießen, obwohl die Schnellfeuerkanonen auch gegen Bodenziele wirksam sein können. Dieses Modell ist auf dem Fahrgestell eines leichten Panzers montiert."

panzer_ii_equipment_1:0	"Panzer II"

panzer_ii_equipment_1_desc:0	"Der Panzer II ist die allgemeine Bezeichnung für eine Familie deutscher Panzer, die im Zweiten Weltkrieg eingesetzt wurden. Obwohl das Fahrzeug ursprünglich als Notlösung für die Entwicklung größerer, fortschrittlicherer Panzer gedacht war, spielte es in den ersten Jahren des Zweiten Weltkriegs während des Polen- und Frankreichfeldzugs eine wichtige Rolle. Der Panzer II war der am häufigsten eingesetzte Panzer in den deutschen Panzerdivisionen ab dem Einmarsch in Frankreich. Er wurde sowohl in Nordafrika gegen die Briten als auch an der Ostfront gegen die Sowjetunion eingesetzt."

panzer_ii_equipment_2:0	"Panzer II"

panzer_ii_equipment_2_desc:0	"Der Panzer II ist die allgemeine Bezeichnung für eine Familie deutscher Panzer, die im Zweiten Weltkrieg eingesetzt wurden. Die offizielle deutsche Bezeichnung war Panzerkampfwagen II. Obwohl das Fahrzeug ursprünglich als Notlösung für die Entwicklung größerer, fortschrittlicherer Panzer gedacht war, spielte es in den ersten Jahren des Zweiten Weltkriegs während des Polen- und Frankreichfeldzugs eine wichtige Rolle. Der Panzer II war der am häufigsten eingesetzte Panzer in den deutschen Panzerdivisionen ab dem Einmarsch in Frankreich. Er wurde sowohl in Nordafrika gegen die Briten als auch an der Ostfront gegen die Sowjetunion eingesetzt."

panzer_ii_equipment_3:0	"Panzer II"

panzer_ii_equipment_3_desc:0	"Die Versionen D und E wurden als schnelle Panzer für den Einsatz bei der Leichte-Division entwickelt. Eine neue Drehstabfederung und weitere Änderungen am Fahrgestell ermöglichten eine Höchstgeschwindigkeit von 55 km/h, allerdings um den Preis einer drastisch reduzierten Geländegängigkeit, so dass künftige Versionen wieder auf der Grundlage älterer Konstruktionen entwickelt wurden."

light_panzer_td_equipment_2:0	"Leichter Jagdpanzer"

light_panzer_td_equipment_2_desc:0	"Typ der Einheit: Leichter Jagdpanzer. \nann aus Panzer II C, D und F umgerüstet werden. Frühe Marder-Konstruktion, die eine sowjetische 7,62-cm-Kanone auf einem Panzer II-Fahrgestell verwendet. Ein mobiler TD, dessen Schwächen in seiner sehr begrenzten Panzerung und hohen Silhouette liegen."

flammpanzer_equipment_1:0	"Flammpanzer"

flammpanzer_equipment_1_desc:0	"Typ der Einheit: Flammpanzer. \nann umgerüstet werden aus: Panzer II D und F \n\nDer Flamingo ist ein Flammenpanzer auf der Basis des Panzer II D/E. Er wird als Infanterie-Unterstützung gegen weiche Ziele eingesetzt."

panzer_amph_equipment_1:0	"Amphibischer Panzer"

panzer_amph_equipment_1_desc:0	"Typ der Einheit: Amphibischer Panzer. \ner Panzer II mit Schwimmkörper ist ein Panzer II, der mit Hilfe eines Schwimmkörpers auf dem Wasser schwimmen kann. Dieser Schwimmkörper kann entfernt werden, sobald er wieder an Land ist. Er wird zur Unterstützung von amphibischen Invasionen eingesetzt."

panzer_ii_equipment_4:0	"Panzer II"

panzer_ii_equipment_4_desc:0	"Der Panzer II F wurde mit der neuen 2-cm-KwK 38 bewaffnet, die ihm mehr Feuerkraft verlieh, aber immer noch nicht ausreichte, um es mit den mittleren Panzern seiner Zeit aufzunehmen. Auch die Panzerung wurde verbessert. Da die Produktion größerer Panzer langsam aufholte und die Fähigkeiten des Panzer II gegen die mittleren Panzer seiner Zeit nicht ausreichten, verlagerte sich die Rolle des Panzer II mehr in Richtung Aufklärung."

light_panzer_td_equipment_3:0	"Leichter Jagdpanzer"

light_panzer_td_equipment_3_desc:0	"Typ der Einheit: Leichter Jagdpanzer. \nann von Panzer II C, D und F umgerüstet werden. Eine Verbesserung gegenüber dem früheren Marder II Sd.Kfz 132. Der Sd.Kfz 131 war mit einer 7,5-cm-Pak 40/2 bewaffnet, die es ihm ermöglichte, mit allen zu seiner Zeit verfügbaren Panzern fertig zu werden. Die Panzerung war zwar nicht dicker, aber durch seine niedrigere Silhouette war er weniger leicht zu treffen."

light_panzer_art_equipment_1:0	"Leichte SP Artillerie"

light_panzer_art_equipment_1_desc:0	"Typ der Einheit: Leichte Artillerie auf Selbstfahrlafette. \nann von Panzer II D und F umgerüstet werden. Die Wespe trägt die 10,5 cm Haubitze auf einem Panzer II-Fahrgestell. Sie kombiniert die wichtigste deutsche Divisionsartillerie mit der notwendigen Mobilität für deutsche Panzer-Divisionen."

light_assault_panzer_equipment_2:0	"Leichtes Sturmgeschütz"

light_assault_panzer_equipment_2_desc:0	"Typ der Einheit: Leichtes Sturmgeschütz. \nann umgerüstet werden von: Panzer II D/E, Panzer II F \n\nDer Sturmpanzer II trägt das 15cm schwere Infanteriegeschütz auf dem Fahrgestell des Panzer II, um den motorisierten Infanterieelementen der Panzerdivisionen Feuerunterstützung gegen Befestigungen zu geben."

panzer_ii_equipment_5:0	"Panzer II"

panzer_ii_equipment_5_desc:0	"Der Luchs war eine erhebliche Umgestaltung des Panzer II. Er wurde auf die Aufklärungsrolle zugeschnitten, seine Reichweite wurde stark erhöht und er bot auch eine bessere Panzerung, die nun bis zu 50 mm betrug. Er war jedoch immer noch mit einer 2 cm KwK bewaffnet."

panzer_ii_equipment_6:0	"Panzer II"

panzer_ii_equipment_6_desc:0	"Der Leopard war als Aufklärungspanzer konzipiert. Seine Ketten ähnelten denen des Panzer II Luchs, obwohl das gesamte Design mit seiner stark geneigten Panzerung dem Panzer das Aussehen eines verkleinerten Panthers gab. Mit einer Panzerung von 50 mm (bis zu 80 mm an der Turmfront) und einer Bewaffnung mit der 5-cm-KwK 39/1 L/60, der gleichen Kanone wie bei den späten Panzer-III-Modellen, war er deutlich leistungsfähiger als frühere Panzer II."

panzer_iii_equipment_1:0	"Panzer III"

panzer_iii_equipment_1_desc:0	"Prototyp; einige wurden in Polen eingesetzt. Bewaffnet mit 3,7 cm KwK 36 L/46,5 Hauptkanone, 250 PS HL 108 Motor."

panzer_iii_equipment_2:0	"Panzer III"

panzer_iii_equipment_2_desc:0	"Erstes Serienmodell, das teilweise in Polen eingesetzt wurde.\nBewaffnet mit 3,7 cm KwK 36 L/46,5-Hauptkanone, 300 PS HL 120-Motor.\nÜberarbeitete Aufhängung, Wechsel von Blattfedern zu Drehstäben, jetzt mit 6 größeren Laufrädern pro Seite."

panzer_iii_equipment_3:0	"Panzer III"

panzer_iii_equipment_3_desc:0	"Verbessertes Getriebe, breitere Ketten und eine stärkere Panzerung. Meist bewaffnet mit der 5-cm-Hauptkanone KwK 38 L/42, bei späten Modellen wurde jedoch die stärkere 5-cm-KwK 39 L60 verwendet."

panzer_iii_td_equipment_1_short:0	"StuG III (früh)"


panzer_amph_equipment_2:0	"Amphibischer Panzer"

panzer_amph_equipment_2_desc:0	"Typ der Einheit: Amphibischer Panzer. \nann umgewandelt werden von: Panzer III \n\nDer Tauchpanzer ist in der Lage, sich unter Wasser bis zu einer Tiefe von 15 m zu bewegen. Er wird zur gepanzerten Unterstützung bei amphibischen Invasionen eingesetzt."

panzer_iii_equipment_4:0	"Panzer III"

panzer_iii_equipment_4_desc:0	"Umbenannt in Aus. J mit langer 5-cm-Kanone, 20-mm-Abstandspanzerung an Wanne und Turmfront, Wannen- und Turmfrontpanzerung auf 50-mm-Platte erhöht."

panzer_iii_td_equipment_2:0	"Sturmgeschütz III (Mittel)"

panzer_iii_td_equipment_2_desc:0	"\nann vom Panzer III umgerüstet werden. An den Seiten des Aufbaus wurden erweiterte rechteckige Panzerkästen für die Funkausrüstung angebracht. Der vergrößerte Raum bot Platz für sechs zusätzliche Schuss Munition für die Hauptkanone (also maximal 50) und ein Maschinengewehr. Ein MG 34 und sieben Trommelmagazine wurden in der rechten hinteren Seite des Kampfraums untergebracht, um das Fahrzeug vor feindlicher Infanterie zu schützen. Die Fahrzeugkommandanten wurden offiziell mit stereoskopischen Scherenperiskopen SF14Z ausgestattet. Stereoskopische Scherenperiskope für Artilleriebeobachter wurden von den Fahrzeugkommandanten möglicherweise von Anfang an verwendet."

light_assault_panzer_equipment_3:0	"Leichtes Sturmgeschütz"

light_assault_panzer_equipment_3_desc:0	"Typ der Einheit: Leichtes Sturmgeschütz. \nann umgerüstet werden von: Panzer III \n\nDer neueste Versuch, das schwere Infanteriegeschütz auf einem Panzerchassis zu verwenden. Das StuIG 33 ist durch eine Panzerung von bis zu 80 mm geschützt und damit weitaus widerstandsfähiger als der Sturmpanzer I oder II."

panzer_iii_equipment_5_short:0	"Panzer III M"


panzer_iii_td_equipment_3_short:0	"StuG III (spät)"


assault_panzer_equipment_1:0	"Sturmgeschütz"

assault_panzer_equipment_1_desc:0	"Typ der Einheit: Sturmgeschütz. \nann umgerüstet werden von: Panzer III \n\nDas StuH 42 wurde entwickelt, weil die regulären Sturmgeschütze mehr zur Panzerabwehr eingesetzt wurden und ihre 7,5-cm-Kanonen nicht immer stark genug gegen feindliche Befestigungen waren. Das StuH 42 ist mit dem stärkeren 10,5-cm-Geschütz StuH 42 bewaffnet, um besser gegen feindliche Festungen vorgehen zu können."

flammpanzer_equipment_2:0	"Flammenpanzer"

flammpanzer_equipment_2_desc:0	"Typ der Einheit: Flammpanzer. \ner Flammpanzer III ist ein Flammenpanzer, der auf dem Panzer III basiert. Er wird als Infanterie-Unterstützung gegen weiche Ziele eingesetzt."

panzer_iii_equipment_6:0	"Panzer III"

panzer_iii_equipment_6_desc:0	"Infanterie-Unterstützungspanzer, bewaffnet mit einer kurzläufigen 7,5 cm Kanone KwK 37 L/24."

panzer_iv_equipment_1:0	"Panzer IV"

panzer_iv_equipment_1_desc:0	"Die erste in Serie gefertigte Version des Panzer IV war die Ausführung A (abgekürzt Ausf. A) im Jahr 1936. Er wurde vom Maybach HL 108TR mit einer Leistung von 250 PS (183,87 kW) angetrieben und verfügte über das SGR 75-Getriebe mit fünf Vorwärts- und einem Rückwärtsgang, das eine Höchstgeschwindigkeit von 31 Stundenkilometern erreichte. Als Hauptbewaffnung war das Fahrzeug mit der kurzläufigen, haubitzenähnlichen Kampfwagenkanone 37 L/24 (KwK 37 L/24) mit 75 mm Durchmesser ausgerüstet, einer Niedriggeschwindigkeits-Kanone, die hauptsächlich für das Verschießen von hochexplosiven Granaten ausgelegt war."

panzer_amph_equipment_3:0	"Amphibischer Panzer"

panzer_amph_equipment_3_desc:0	"Typ der Einheit: Amphibischer Panzer. \nann umgerüstet werden aus: Panzer IV D und F \n\nDer Tauchpanzer ist in der Lage, sich unter Wasser bis zu einer Tiefe von 15 m zu bewegen. Er wird zur gepanzerten Unterstützung bei amphibischen Invasionen eingesetzt."

panzer_iv_equipment_2:0	"Panzer IV"

panzer_iv_equipment_2_desc:0	"Im Oktober 1940 wurde die Ausf. E eingeführt. Diese verfügte über eine 50 Millimeter dicke Panzerung auf der Bugplatte und eine 30 Millimeter dicke applizierte Stahlplatte auf der Glacis als Übergangslösung. Schließlich wurde die Kommandantenkuppel nach vorne in den Turm verlegt. Ältere Panzer IV-Modelle wurden mit diesen Merkmalen nachgerüstet, wenn sie zur Instandsetzung an den Hersteller zurückgegeben wurden. 206 Ausf. Sie wurden zwischen Oktober 1940 und April 1941 produziert. Er wurde vom Maybach HL 120TRM mit 300 PS (220,65 kW) angetrieben und verfügte über das SSG 75-Getriebe mit sechs Vorwärts- und einem Rückwärtsgang, das eine Höchstgeschwindigkeit von 39 Stundenkilometern erreichte. Als Hauptbewaffnung war das Fahrzeug mit der kurzläufigen, haubitzenartigen Kampfwagenkanone 37 L/24 (KwK 37 L/24) mit 75 mm Durchmesser ausgerüstet, einer Niedriggeschwindigkeits-Kanone, die hauptsächlich für das Verschießen von hochexplosiven Granaten ausgelegt war."

panzer_iv_equipment_3:0	"Panzer IV"

panzer_iv_equipment_3_desc:0	"Im April 1941 begann die Produktion des Panzer IV Ausf. F. Er verfügte über eine 50 mm starke Panzerung am Turm und an der Wanne (im Gegensatz zur Panzerung der Ausf. E) und eine auf 30 mm erhöhte Seitenpanzerung. Das Gewicht des Fahrzeugs betrug nun 22,3 Tonnen (24,6 Kurztonnen), was eine entsprechende Änderung der Spurweite von 380 auf 400 mm erforderte, um den Bodendruck zu verringern. Angetrieben wurde er vom Maybach HL 120TRM mit 300 PS (220,65 kW) und dem SSG 75-Getriebe mit sechs Vorwärts- und einem Rückwärtsgang, das eine Höchstgeschwindigkeit von 39 Stundenkilometern erreichte. Als Hauptbewaffnung war das Fahrzeug mit der kurzläufigen, haubitzenartigen Kampfwagenkanone 37 L/24 (KwK 37 L/24) mit 75 mm Durchmesser ausgerüstet, einer Niedriggeschwindigkeits-Kanone, die hauptsächlich für das Verschießen von hochexplosiven Granaten ausgelegt war."

panzer_iv_equipment_4:0	"Panzer IV"

panzer_iv_equipment_4_desc:0	"Am 26. Mai 1941, nur wenige Wochen vor der Operation Barbarossa, wurde auf einer Konferenz mit Hitler beschlossen, die Hauptbewaffnung des Panzer IV zu verbessern. Krupp erhielt den Auftrag, die 50-mm-Kanone Pak 38 L/60 wieder in den Turm zu integrieren. Im November 1941 wurde die Entscheidung, den Panzer IV auf die 50-Millimeter-Kanone aufzurüsten, fallen gelassen, und stattdessen wurde Krupp in einer gemeinsamen Entwicklung beauftragt, die von Rheinmetall geplante 75-mm-Panzerabwehrkanone, die 7,5 cm Pak 40 L/43, zu modifizieren."

heavy_panzer_td_fast_equipment_1:0	"Schneller Jagdpanzer"

heavy_panzer_td_fast_equipment_1_desc:0	"Typ der Einheit: Schneller Jagdpanzer. \nann umgerüstet werden aus: Panzer IV F, G, H und J. Ein dünn geschützter Jagdpanzer, bewaffnet mit der leistungsstarken 8,8-cm-Pak 43/1 L/71, der gleichen Waffe, die auch im späteren Tiger II verwendet wurde. Seine fehlende Panzerung ermöglicht eine gute Beweglichkeit."

heavy_panzer_art_equipment_1:0	"SP Artillerie"

heavy_panzer_art_equipment_1_desc:0	"Typ der Einheit: Selbstfahrende Artillerie. \n\nnKann aus Pz 38(t) A, Pz 38(t) G und Pz 38(t) umgerüstet werden \n\nDie Grille ist eine selbstfahrende Artillerie, die das 15cm sIG 33 trägt und als Divisionsunterstützungsartillerie für die 10,5cm Hauptgeschütze eingesetzt wird."

panzer_iv_equipment_5:0	"Panzer IV"

panzer_iv_equipment_5_desc:0	"die Ausf. H, begann im Juni 1943 mit der Produktion und erhielt die Bezeichnung Sd. Kfz. 161/2. Die Integrität der Glacis-Panzerung wurde verbessert, indem sie aus einer einzigen 80-Millimeter-Platte gefertigt wurde. Um das Anhaften von magnetischen Panzerabwehrminen zu verhindern, von denen die Deutschen befürchteten, dass sie von den Alliierten in großer Zahl eingesetzt würden, wurden alle vertikalen Flächen der Panzerung mit Zimmerit-Paste versehen. Die Seiten und der Turm des Fahrzeugs wurden durch zusätzliche 5-Millimeter-Seitenschürzen und 8-Millimeter-Turmschürzen zusätzlich geschützt."

medium_panzer_td_equipment_1:0	"Mittlerer Jagdpanzer"

medium_panzer_td_equipment_1_desc:0	"Typ der Einheit: Mittlerer Jagdpanzer. \nann umgerüstet werden von: Panzer IV \n\nPanzer IV-Version des StuG III-Sturmgeschützes."

assault_panzer_equipment_2:0	"Sturmgeschütz"

assault_panzer_equipment_2_desc:0	"Typ der Einheit: Sturmgeschütz. \nann konvertiert werden aus: Panzer IV F, G, H und J \n\nDer Brummbär ist ein schwer gepanzerter Sturmpanzer, der sich gegen Befestigungen richtet."

panzer_spaa_equipment_3:0	"Selbstfahrende Luftabwehr"

panzer_spaa_equipment_3_desc:0	"Typ der Einheit: Selbstfahrende Luftabwehr. \nann umgerüstet werden aus: Panzer IV F, G, H und J \n\nLuftabwehrpanzer auf Basis von Panzer IV, bewaffnet mit vier 2-cm-Geschützen in einem offenen Turm."

panzer_iv_equipment_6:0	"Panzer IV"

panzer_iv_equipment_6_desc:0	"Obwohl die endgültige Produktionsversion des Panzer IV - die Ausf. J - die Mobilitätsprobleme des Vorgängermodells behebt, gilt sie als Rückschritt gegenüber der Ausf. H. Sie entstand aus der deutschen Notwendigkeit, schwere Verluste zu ersetzen, und wurde zur Beschleunigung der Produktion stark vereinfacht."

medium_panzer_td_equipment_2:0	"Mittlerer Jagdpanzer"

medium_panzer_td_equipment_2_desc:0	"Typ der Einheit: Mittlerer Jagdpanzer. \nann umgewandelt werden von: Panzer IV J \n\n Ein auf Panzer IV basierender Jagdpanzer, der die gleichen 7,5 cm StuK 42 L/70 wie der Panther-Panzer verwendet."

heavy_panzer_art_equipment_2:0	"SP Artillerie"

heavy_panzer_art_equipment_2_desc:0	"Typ der Einheit: Selbstfahrende Artillerie. \nann umgerüstet werden von: Panzer IV F, G, H und J \n\nDie Hummel ist eine selbstfahrende Artillerie mit dem 15cm sFH 18/1, die als Divisionsunterstützungsartillerie für die 10,5cm Hauptkanonen eingesetzt wird."

panzer_spaa_equipment_4:0	"Selbstfahrende Luftabwehr"

panzer_spaa_equipment_4_desc:0	"Typ der Einheit: Selbstfahrende Luftabwehr. \nann umgerüstet werden aus: Panzer IV F, G, H und J. Der erste echte Luftabwehrpanzer, bewaffnet mit zwei 3-cm-Geschützen in einem gepanzerten halbkugelförmigen Turm."

medium_panzer_td_equipment_3:0	"Mittlerer Jagdpanzer"

medium_panzer_td_equipment_3_desc:0	"Typ der Einheit: Mittlerer Jagdpanzer. \ner E-25 ist ein verbesserter Jagdpanzer, der die gleiche 7,5-cm-L/70-Kanone wie der Panther-Panzer verwendet. Die E-Serie sollte die Kosten für Fahrzeuge senken und eine einfachere Massenproduktion ermöglichen."

panzer_v_equipment_1:0	"Panzer V"

panzer_v_equipment_1_desc:0	"Panther ist der allgemeine Name eines mittleren Panzers, der von Deutschland im Zweiten Weltkrieg von Mitte 1943 bis zum Ende des Krieges in Europa 1945 eingesetzt wurde. Er war als Gegenstück zum russischen T-34 und als Ersatz für den Panzer III und den Panzer IV gedacht. Obwohl er letzteren nie ersetzte, diente er ihm und den schwereren Tiger-Panzern bis zum Ende des Krieges. Die hervorragende Kombination aus Feuerkraft, Mobilität und Schutz des Panthers diente als Maßstab für die Panzerkonstruktionen anderer Nationen in der Kriegs- und Nachkriegszeit und gilt als einer der besten Panzer des Zweiten Weltkriegs. Die Ausf.D wurde von Zuverlässigkeitsproblemen geplagt."

heavy_panzer_td_fast_equipment_2:0	"Schneller Jagdpanzer"

heavy_panzer_td_fast_equipment_2_desc:0	"Typ der Einheit: Schneller Jagdpanzer. \ner Jagdpanther ist ein auf dem Panther basierender Jagdpanzer, der mit der gleichen 8,8 cm Kanone wie der Tiger II bewaffnet ist. Obwohl er gut gepanzert ist, verfügt er über die nötige Geschwindigkeit, um mit Panzerdivisionen mithalten zu können."

panzer_v_spaa_equipment_1:0	"Selbstfahrende Luftabwehr"

panzer_v_spaa_equipment_1_desc:0	"Typ der Einheit: Selbstfahrende Luftabwehr-Einheit. \nann umgewandelt werden von: Panther G"

panzer_v_equipment_2:0	"Panzer V"

panzer_v_equipment_2_desc:0	"Bei der Ausf. G wurden die meisten Zuverlässigkeitsprobleme der Ausf. D behoben. Im Allgemeinen wurde mehr Panzerung hinzugefügt, während eine Vielzahl kleinerer Änderungen das Gewicht etwas verringerte."

panzer_v_equipment_3:0	"Panzer V"

panzer_v_equipment_3_desc:0	"Die Ausf. F sollte mit dem neuen "Schmalturm" ausgestattet werden, einem dünneren Turm, der mehr Schutz bot und gleichzeitig das Gewicht reduzierte. Einige experimentelle "Schmaltürme" wurden 1944 mit modifizierten Versionen der 7,5 cm Standardkanone KwK 42 L/70 des Serien-Panthers gebaut, die die Bezeichnung KwK 44/1 erhielten."

panzer_v_equipment_4:0	"Panzer V"

panzer_v_equipment_4_desc:0	"Der Standardpanzer E-50 war als mittlerer Standardpanzer gedacht und sollte den Panther und den Tiger I sowie die auf diesen Panzern basierenden Umbauten ersetzen. Die Wanne des E-50 sollte länger sein als die des Panthers. Tatsächlich war er in den Gesamtabmessungen praktisch identisch mit dem Königstiger (Tiger II), mit Ausnahme der Anordnung der oberen und unteren Glacisplatte."

heavy_panzer_equipment_1_short:0	"Neubaufahrzeug"


panzer_vi_equipment_2:0	"Panzer VI"

panzer_vi_equipment_2_desc:0	"Der Tiger I war ein deutscher schwerer Panzer, der 1942 als Antwort auf die unerwartet beeindruckende sowjetische Panzerung entwickelt wurde, auf die man in den ersten Monaten der Invasion der Achsenmächte in der Sowjetunion traf, insbesondere auf den T-34 und den KV-1."

heavy_panzer_td_slow_equipment_1:0	"Schwerer Jagdpanzer"

heavy_panzer_td_slow_equipment_1_desc:0	"Typ der Einheit: Schwerer Jagdpanzer. \ner Elefant ist ein schwerer Jagdpanzer, der auf Ferdinand Porsches Entwurf für den Tiger basiert. Nachdem er gegen den Tiger-Entwurf von Henschel unterlegen war, wurde das Fahrgestell für den Einsatz als Panzerjäger umgestaltet. Bewaffnet mit der 8,8-cm-Pak 42 L/71 und geschützt durch eine bis zu 200 mm starke Panzerung, war er ein sehr leistungsfähiges Fahrzeug, das jedoch durch sein hohes Gewicht von 68 Tonnen sehr langsam und wenig mobil war."

assault_panzer_equipment_3:0	"Sturmgeschütz"

assault_panzer_equipment_3_desc:0	"Typ der Einheit: Sturmgeschütz. \nann umgewandelt werden von: Tiger I \n\nDer Sturmtiger ist ein schwerer Angriffspanzer zur Bekämpfung von Befestigungen. Zu diesem Zweck ist er mit einem 38-cm-Mörser bewaffnet und durch eine bis zu 150 mm dicke Panzerung geschützt."

panzer_vi_equipment_3:0	"Panzer VI"

panzer_vi_equipment_3_desc:0	"Der unter dem informellen Namen Königstiger bekannte Panzer, der von den alliierten Soldaten oft halbwörtlich als Königstiger übersetzt wurde, folgte demselben Konzept wie der Tiger I, sollte aber noch eindrucksvoller sein. Der Tiger II kombinierte die dicke Panzerung des Tiger I mit der schrägen Panzerung des mittleren Panzers Panther. Der Panzer wog fast siebzig Tonnen, war an der Vorderseite durch eine 100 bis 180 mm starke Panzerung geschützt und war mit der langläufigen 8,8 cm Kampfwagenkanone 43 L/71 bewaffnet."

heavy_panzer_td_slow_equipment_2:0	"Schwerer Jagdpanzer"

heavy_panzer_td_slow_equipment_2_desc:0	"Einheitstyp: Schwerer Jagdpanzer. \nas schwerste deutsche Panzerfahrzeug, das im Krieg eingesetzt wurde (72 t), verfügt über eine 12,8-cm-Kanone und ist durch eine Panzerung von bis zu 250 mm geschützt. Aufgrund seines hohen Gewichts mangelt es ihm etwas an Mobilität und Zuverlässigkeit, aber er kann jeden gegnerischen Panzer ausschalten und ist selbst außergewöhnlich gut gegen feindliche Geschütze geschützt."

panzer_vi_equipment_4:0	"Panzer VI"

panzer_vi_equipment_4_desc:0	"Der Standardpanzer E-75 war als schwerer Standardpanzer geplant, der den Tiger II und den Jagdtiger ersetzen sollte. Der E-75 sollte auf denselben Produktionslinien wie der E-50 gebaut werden, um die Herstellung zu vereinfachen, und die beiden Fahrzeuge sollten viele Komponenten gemeinsam haben, darunter denselben Maybach HL 234-Motor. Der E-75 hätte jedoch eine wesentlich dickere Panzerung gehabt, und tatsächlich hatte der E-75 im Vergleich zum Tiger II eine rundum verbesserte Rumpfpanzerung."

panzer_vii_equipment_1:0	"Panzer VII"

panzer_vii_equipment_1_desc:0	"Der Panzerkampfwagen VII Löwe war ein Entwurf für einen superschweren Panzer, der von Krupp für die deutsche Regierung während des Zweiten Weltkriegs entwickelt wurde. Das Projekt, das ursprünglich den Codenamen VK 70.01 (K) trug, verließ nie das Zeichenbrett und wurde am 5. und 6. März 1942 zugunsten des schwereren Panzer VIII Maus von Porsche fallen gelassen."

panzer_vii_equipment_2:0	"Panzer VII"

panzer_vii_equipment_2_desc:0	"Der Panzerkampfwagen VIII Maus war ein deutscher superschwerer Panzer des Zweiten Weltkriegs, der Ende 1944 fertiggestellt wurde. Er ist der schwerste vollständig geschlossene gepanzerte Kampfwagen, der jemals gebaut wurde. Die Hauptbewaffnung des Maus war eine 128 mm KwK 44 L/55 Kanone mit einer zusätzlichen 75 mm Koaxialkanone."

Landkreuzer_equipment_short:0	"Landkreuzer P. 1000 Ratte"

Landkreuzer_equipment_1:0	"Landkreuzer P. 1000 Ratte"

Landkreuzer_equipment_1_desc:0	""

czech_ger_panzer_equipment_desc:0	"Leichte Panzer sind kleine, wendige Panzer, die sowohl zum Aufklären als auch zur Bekämpfung leicht gepanzerter Gegner geeignet sind."

GER_czech_panzer_equipment_1_short:0	"Pz 35(t)"


GER_czech_panzer_equipment38_1_short:0	"Pz 38(t)"



czech_ger_panzer_equipment_1:0	"PzKpfw. 35(t) (tschechisch)"

czech_ger_panzer_equipment_1_desc:0	"Der Panzer 35(t) ermöglichte es der Wehrmacht, ihre Panzertruppen aufzustocken, während die Produktion des Panzers III und IV noch nicht den erforderlichen Umfang erreicht hatte. Bewaffnet mit einer 3,7-cm-Kanone bot er viel mehr Feuerkraft als die Panzer I und II bieten konnten. Sein größter Nachteil war die genietete Panzerung, die sich bei einem Treffer als Gefahr für die Besatzung erweisen konnte, selbst wenn die Panzerung nicht durchbrochen wurde."

czech_ger_panzer_equipment_2:0	"PzKpfw. 38(t) A (tschechisch)"

czech_ger_panzer_equipment_2_desc:0	"Mit einer verbesserten Kanone und einem verbesserten Motor wurde der 38(t) von der Wehrmacht in ähnlicher Kapazität wie der Panzer III eingesetzt. Der Nachteil der vernieteten Panzerung blieb jedoch bestehen."

czech_ger_panzer_equipment_3:0	"PzKpfw. 38(t) G (tschechisch)"

czech_ger_panzer_equipment_3_desc:0	"Um den Panzer 38(t) einigermaßen konkurrenzfähig zu halten, wurde die Panzerung auf bis zu 50 mm erhöht, obwohl der Panzer immer noch hauptsächlich genietet war, was den Wert seiner Panzerung etwas senkte."

czech_ger_panzer_equipment_4:0	"Aufklärungspanzer 38(t) (tschechisch)"

czech_ger_panzer_equipment_4_desc:0	"Da die Konstruktion des 38(t) immer mehr veraltet war, wurde geplant, den Panzer zu einem Aufklärungsfahrzeug umzubauen. Der Panzer war mit der gleichen 2-cm-Kanone wie der Panzer II Luchs ausgestattet und konnte sowohl gegen Boden- als auch gegen Luftziele eingesetzt werden."

light_panzer_td_equipment_4:0	"Leichter Jagdpanzer"

light_panzer_td_equipment_4_desc:0	"Typ der Einheit: Leichter Jagdpanzer. \nann aus Pz 38(t) A, Pz 38(t) G und Pz 38(t) umgerüstet werden. Basierend auf der neuesten Variante des Panzer 38(t) war der Marder III M der ausgewogenste Jagdpanzer unter den verschiedenen Mardern."

light_panzer_td_equipment_5:0	"Leichter Jagdpanzer"

light_panzer_td_equipment_5_desc:0	"Typ der Einheit: Leichter Jagdpanzer. \nann umgerüstet werden aus: Pz 38(t) A, Pz 38(t) G, Aufklärungspz 38(t) und Pz 38(t) \n\nDie Marder-Jagdpanzer hatten zwar die Feuerkraft, um mit den meisten Panzern der damaligen Zeit fertig zu werden, aber es fehlte ihnen an Panzerung und sie waren daher ziemlich verwundbar. Um dies zu verbessern, wurde der Hetzer entwickelt. Er bot eine Rundum-Panzerung in Kombination mit einer niedrigen Silhouette, ideal für einen Jagdpanzer."

light_panzer_td_equipment_6:0	"Leichter Jagdpanzer"

light_panzer_td_equipment_6_desc:0	"Typ der Einheit: Leichter Jagdpanzer. \ner 38 D basiert auf dem Hetzer und entstand aus dem Wunsch, die Produktion zu vereinfachen und die Kosten des Fahrzeugs zu senken."

light_panzer_td_equipment_7:0	"Leichter Jagdpanzer"

light_panzer_td_equipment_7_desc:0	"Typ der Einheit: Leichter Jagdpanzer. \niese Version des Jagdpanzers 38 D verfügt über einen Heckaufbau, der mit einer 10cm Glattrohrkanone, dem Panzerabwehrwerfer 1000, bestückt ist."

panzer_spaa_equipment_2:0	"Selbstfahrende Luftabwehr"

panzer_spaa_equipment_2_desc:0	"Typ der Einheit: Selbstfahrende Luftabwehr. \nann umgewandelt werden von: Pz 38(t)"

light_panzer_art_equipment_3:0	"Leichte Panzerartillerie"

light_panzer_art_equipment_3_desc:0	"Typ der Einheit: Selbstfahrende Artillerie. Der Mittlere Einheitswaffenträger I war Teil des allgemeinen Plans zur Vereinfachung und Standardisierung der Produktion. Er trug die 10,5-cm-Haubitze, die von der Divisionsartillerie verwendet wurde."

conversion_td_equipment_1_short:0	"Panzerjäger 35R"


marder_conversion_td_equipment_1_short:0	"Marder I (L) Lt-TD"


marder_conversion_td_equipment_2_short:0	"Marder I (H) Lt-TD"


conversion_art_equipment_1_short:0	"Geschützwagen Mk.VI (e) SPART"


conversion_art_equipment_2_short:0	"Geschützwagen Lorraine-Schlepper (f) SPART"


conversion_art_equipment_3_short:0	"Geschützwagen 39H (f) SPART"


