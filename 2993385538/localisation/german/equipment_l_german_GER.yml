GER_handheld_at_equipment_0:0	"Panzerbüchse 38"
GER_handheld_at_equipment_0_desc:0	" Die Entwicklung deutscher Panzerabwehrgewehre begann 1917, wobei das Mauser 1918 T-Gewehr das weltweit erste Panzerabwehrgewehr war. Die Entwicklung von Panzerabwehrgewehren wurde im Zuge der deutschen Wiederaufrüstung Ende der 1930er Jahre wieder aufgenommen. Im Jahr 1939 entwickelte der Konstrukteur B. Brauer bei den Gustloff Werken die Panzerbüchse 38 (PzB 38). \n\nDie PzB 38 war eine manuell geladene Einzelladerwaffe mit rückstoßbehaftetem Lauf. Sie verwendete eine speziell entwickelte Patrone mit einem Standardkaliber von 7,9 mm, jedoch einer sehr großen, 94 mm langen Hülse, die als 7,92x94-mm-Patrone bezeichnet wurde. Beim Abfeuern bewegte sich der Lauf etwa 9 cm zurück, wodurch sich der Verschluss öffnete und die verbrauchte Patronenhülse ausgeworfen wurde. Der Verschlussblock wurde daraufhin in der hinteren Position arretiert und blieb geöffnet, damit der Schütze manuell eine neue Patrone einlegen konnte. Anschließend löste der Schütze den gespannten Verschluss mit einem Hebel am Griff aus. Verschluss und Lauf bewegten sich daraufhin wieder nach vorne, und der Abzug wurde zur Vorbereitung des Schusses gespannt. Dieser recht komplizierte Mechanismus neigte Berichten zufolge zu Ladehemmungen, da das System im Feldeinsatz verschmutzte. \n|___ NL002680___|Obwohl aus gepressten und punktgeschweißten Stahlteilen gefertigt, war die Herstellung aufgrund des komplizierten vertikalen Verschlussmechanismus schwierig, sodass nur eine geringe Anzahl von (1.408) PzB-38-Gewehre zwischen 1939 und 1940 im Werk Gustloff Werke hergestellt. 62 dieser Waffen wurden von deutschen Truppen beim Einmarsch in Polen im Jahr 1939 eingesetzt."
GER_handheld_at_equipment_1_short:0	"Panzerfaust"
GER_handheld_at_equipment_2:0	"Raketenpanzerbüchse 54"
GER_handheld_at_equipment_2_desc:0	"Panzerschreck" (wörtlich "Panzerschreck", "Panzerschreck" oder "Panzerschreck") war der gebräuchliche Name für die Raketenpanzerbüchse 54 ("Raketenpanzerbüchse Modell 54", abgekürzt RPzB 54), einem von Deutschland entwickelten wiederverwendbaren 88-mm-Panzerabwehrraketenwerfer. Die Entwicklung des Panzerschrecks begann ursprünglich im November 1942 auf der Grundlage der in Tunesien erbeuteten amerikanischen Bazookas. Der Panzerschreck war größer und schwerer als sein amerikanisches Pendant – der Panzerschreck hatte ein Kaliber von 88 mm, verglichen mit dem 60-mm-Kaliber der Bazooka –, was bedeutete, dass er dickere Panzerungen durchschlagen konnte, beim Abfeuern jedoch auch mehr Rauch erzeugte. Das Kaliber von 88 mm wurde gewählt, da die bestehende Panzerabwehrrakete für den 8-cm-Raketenwerfer 43 für den Panzerschreck wiederverwendet wurde. \n\nIm Gegensatz zu den in amerikanischen Bazookas verwendeten Raketen, die erloschen, bevor sie das Rohr verließen, brannten die RPzB-Raketen nach dem Verlassen des Rohrs noch etwa 2 Meter weit weiter. Die Benutzer wurden angewiesen, schwere Handschuhe, einen Schutzponcho und eine Gasmaske ohne Filter zu tragen, um sich vor der Hitze des Rückstoßes beim Abfeuern der Waffe zu schützen. Zum Schutz des Bedieners wurden improvisierte Schutzschilde angefertigt, und im Februar 1944 wurde der RPzB 54 mit einem offiziellen Sprengschutzschild ausgestattet, der den Bediener schützte, wodurch die Waffe jedoch schwerer wurde und im leeren Zustand 11 Kilogramm wog. Das Abfeuern des RPzB erzeugte sowohl vor als auch hinter der Waffe große Mengen an Rauch. Aufgrund des Rohrs der Waffe und des erzeugten Rauchs wurde die Waffe in offiziellen Dokumenten als "Ofenrohr" ("Ofenrohr"). Dies bedeutete auch, dass Panzerabwehrteams nach dem Abfeuern sichtbar wurden, wodurch sie zur Zielscheibe wurden und daher nach dem Abfeuern ihre Position wechseln mussten. \n\nZwischen 1943 und 1945 wurden mehr als 300.000 Einheiten produziert."
