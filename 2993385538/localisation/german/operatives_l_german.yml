upgrade_economy_civilian_desc:0	"§LUnsere Agenten werden darauf geschult, sich als Zivilisten in feindlichem Gebiet zu tarnen und in dessen Industrie- und Zivilsektor zu operieren, um Informationen über die Industrie und Wirtschaft unseres Feindes zu sammeln.§!"
upgrade_army_department_desc:0	"§LInformationen über das feindliche Militär sind von größter Bedeutung, und es ist notwendig, eine Abteilung für militärische Aufklärung einzurichten. Unsere Agenten werden darauf geschult, in die feindlichen Streitkräfte einzudringen, dort als Soldaten und Generäle zu dienen und uns die Geheimnisse zu melden, die sie hinter den feindlichen Linien aufdecken.§!"
upgrade_naval_department_desc:0	"§LDie Seeschlacht ist ein entscheidender Faktor für den Sieg, und angesichts des Fortschritts der Marinetechnologien ist es unerlässlich geworden, eine Abteilung für Marineaufklärung einzurichten.§!"
upgrade_airforce_department_desc:0	"§LDie Abteilung für Luftnachrichtendienst wird ein nützlicher Zweig unserer Behörde sein; sie ist dafür zuständig, die feindliche Luftwaffe zu infiltrieren und Informationen über die Bewegungen feindlicher Flugzeuge zu sammeln.§!"
upgrade_passive_defense_desc:1	"§LDie Heimatgarde hat das Potenzial, ein unverzichtbares Instrument für unseren Nachrichtendienst zu werden. Indem wir unsere Heimatgarde und Garnisonstruppen in den Methoden der Spionage und Spionageabwehr ausbilden, stellen wir sicher, dass wir im eigenen Land stets über eine defensive Präsenz verfügen, selbst wenn unsere Experten anderweitig beschäftigt sind.§!"
upgrade_anti_partisan_desc:0	"§LPropaganda ist ein mächtiges Instrument, um die Loyalität unserer eigenen Bürger zu sichern, doch die Schaffung von Gehorsam in feindlichen Gebieten ist weitaus komplexer. Indem wir unsere Agenten darin schulen, feindliche Widerstandsbewegungen zu infiltrieren, könnten wir in der Lage sein, wirksame Verhaftungen vorzunehmen und deren störenden Aktivitäten ein Ende zu setzen. Sicherlich werden ausländische Partisanen dann jede Hoffnung auf eine Rückkehr zu ihrem alten Regime verlieren.§!"
upgrade_form_operations_desc:0	"§LOperationen sind ein aktiver Bestandteil der Geheimdienstarbeit – spezifische Missionen und Aufgaben, deren Durchführung Fachpersonal erfordert.§!"
upgrade_expand_operations_desc:0	"§LEin verbessertes Management und ein größerer Pool an Einsatzkräften verschaffen uns mehr Flexibilität, um Operationen in großem Maßstab durchzuführen.§!"
upgrade_blueprint_stealing_desc:0	"§LWir wissen, dass unser Feind geheime Projekte für experimentelle Waffen und Fahrzeuge verfolgt; was wir jedoch nicht wissen, ist, worum es bei diesen Projekten genau geht und was sie bauen. Durch die Infiltration der Abteilungen für experimentelle Waffen unserer Feinde erhalten wir nicht nur die Möglichkeit, genau zu erfahren, was sie gegen uns einsetzen wollen, sondern auch die einmalige Gelegenheit, diese Informationen zur Weiterentwicklung unserer eigenen Waffenabteilung zu nutzen.§!"
upgrade_portable_radios_desc:0	"§LHerkömmliche Funkgeräte sind viel zu groß und unbeweglich, um in einer verdeckten Umgebung von Nutzen zu sein; doch durch die Entwicklung kompakter Versionen dieser Technologie und deren Tarnung als gewöhnliche Alltagsgegenstände wie Aktentaschen werden unsere Agenten in der Lage sein, zu jeder Tageszeit zu kommunizieren, ohne Verdacht oder Alarm zu erregen. §!"
upgrade_invisible_ink_desc:0	"§LEin mit unsichtbarer Tinte geschriebener Brief erscheint dem bloßen Auge als bloßes leeres Blatt Papier, doch durch die Einwirkung von UV-Licht oder Chemikalien wie Ammoniak wird der Inhalt des Briefes sichtbar. Durch die Vereinheitlichung der Verwendung unsichtbarer Tinte durch alle unsere Agenten bleiben unsere Informationen geheim, selbst wenn sie von unseren Feinden abgefangen werden.§!"
upgrade_plastic_explosives_desc:0	"§LDie pastöse Konsistenz von Plastiksprengstoff macht ihn ideal für die Sabotage feindlicher Produktionsanlagen, daher ist es nur natürlich, dass wir ausländische Partisanen mit dieser Substanz ausrüsten. Die Bomben lassen sich leicht außer Sichtweite und an verwundbaren Stellen in feindlichen Fabriken platzieren, und die Formbarkeit der Substanz macht sie zu einer idealen Waffe für ein spektakuläres politisches Attentat...§!"
upgrade_suicide_pills_desc:0	 "§LAuch wenn es unerwünscht ist, ist es unvermeidlich, dass eine Handvoll Agenten von unserem Feind gefangen genommen wird. Wir müssen unseren Agenten eine Möglichkeit bieten, dem Schrecken zu entgehen, der sie im Verhörraum erwartet, und eine Cyanidkapsel anstelle eines Zahns wird ihnen diese Flucht ermöglichen, sollte es jemals dazu kommen.§!"
upgrade_training_centers_desc:0	"§LZwar sind unsere Agenten in der Lage, sich an jede Umgebung anzupassen, doch fallen die kulturellen Normen und Sprachen fremder Länder denjenigen leichter, die in dieser Kultur geboren und aufgewachsen sind. Wenn wir ein weltweites Spionagenetzwerk aufbauen wollen, müssen wir unsere Rekrutierungs- und Ausbildungszentren über den gesamten Globus ausweiten und Agenten aller Kulturen und Hintergründe rekrutieren. §!"
upgrade_commando_training_desc:1	"§LZwar befasst sich unsere Abteilung in der Regel mit den subtileren Aspekten der Kriegsführung, doch oft ist ein kleines Team schwer bewaffneter Soldaten erforderlich, um unsere Operationen zum Abschluss zu bringen. Indem wir alle unsere Agenten in den Methoden der Kommandokriegsführung ausbilden, werden sie bei Sabotageoperationen effektiver, weniger anfällig für die Entdeckung durch die feindliche Spionageabwehr und besser in der Lage, feindliche Verschlüsselungsgeräte zu erbeuten.§!"
upgrade_interrogation_techniques_desc:0	"§LOftmals ist es effektiver, den Geist eines feindlichen Agenten zu brechen als seinen Körper. Der Einsatz physischer Gewalt ist unzuverlässig und führt häufig zu falschen Informationen; ein wirklich geschickter Verhörer ist in der Lage, den Willen des Feindes ohne Gewalt zu brechen. Doch sollte es darauf ankommen, verfügen wir über Mittel, sie zum Reden zu bringen... §!"
upgrade_diplo_training_desc:0	"§LWenn wir unsere Agenten darin schulen, einigen ausländischen Investoren und Diplomaten ein Schmiergeld zu zahlen, können wir sie vielleicht von der Rechtschaffenheit unserer Sache überzeugen und ihre Interessen von den Staatsfeinden ablenken.§!"
upgrade_psycho_warfare_desc:0	"§LPropaganda war ein wirksames Mittel, um unsere ideologischen Interessen innerhalb unseres eigenen Staates zu sichern, doch kein Mittel war so wirksam wie die Verbreitung von Angst vor den feindlichen Regimes und dem, was diese dem Land bringen könnten. Indem wir unsere Agenten mit anti-ideologischen Bewegungen in fremden Nationen verbünden, werden wir bei der weltweiten Verbreitung unserer Ideologie weitaus effektiver sein...§!"
upgrade_form_department_desc:0	"§LKryptologie ist die Methode zur Erstellung von Codes und Chiffren zur Aufrechterhaltung geheimer Kommunikation. Ohne den erforderlichen Code ist eine mit einer Chiffre verfasste Nachricht fast unmöglich zu verstehen. Ebenso wichtig ist es, dass wir unsere Daten verschlüsseln, wie wir die unserer Feinde entschlüsseln.§!"
upgrade_decryption_boost_desc:0	"§LRadiowellen haben die Fernkommunikation über große Entfernungen ermöglicht, und Signale werden oft verschlüsselt, indem die Sendefrequenz in unregelmäßigen Abständen ständig geändert wird. Wenn wir feindliche Kommunikation abfangen wollen, müssen wir eine Abhörgruppe einrichten, die sich speziell mit dem Knacken feindlicher Funkverschlüsselung befasst.§!"
upgrade_decryption_boost_2_desc:0	"§LMaschinen haben sich bereits bei der Verschlüsselung von Daten als nützlich erwiesen, wobei maschinengestützte verschlüsselte Signale am schwierigsten zu entschlüsseln sind. Kryptoanalyse-Maschinen sind unverzichtbar, um Nachrichten zu knacken, deren Code uns noch unbekannt ist, und werden eine wertvolle Bereicherung für unser Entschlüsselungsteam darstellen.§!"
upgrade_crypto_strength_desc:0	"§LCodes und Chiffren haben sich bislang als das wirksamste Mittel erwiesen, um unsere Spionagenetzwerke im Ausland aufzubauen und zu schützen. Das Government Communication Headquarters wird sich der Entwicklung neuer und ausgefeilter Verschlüsselungsmethoden widmen, die unsere Feinde nicht entschlüsseln können.§!"
upgrade_crypto_strength_2_desc:0	"§LEs wird immer deutlicher, dass unsere Standardmethode zur Erstellung von Chiffren nicht ausreicht, um unsere Kommunikation vor feindlichen Blicken zu schützen. Unsere besten Köpfe haben eine Maschine konzipiert, die die Buchstaben des Alphabets durcheinanderwirbeln kann, um so regelmäßig wie gewünscht neue Chiffren zu generieren. Der Einsatz einer solchen Technologie würde unsere Verschlüsselungsmethoden für unsere Feinde zu einem völligen Rätsel machen.§!"
