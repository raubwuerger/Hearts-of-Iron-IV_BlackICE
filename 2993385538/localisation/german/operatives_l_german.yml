OPERATIVE_MISSION_DIPLOMATIC_PRESSURE_DESC:4	"§LBeeinflussen Sie eine KI-gesteuerte Nation, damit diese Ihre Fraktion und Nichtangriffspakte bevorzugt. Für Spielernationen gelten strengere Beschränkungen beim Beitritt zu anderen Fraktionen.§!\n\nErkennungsrate für Agenten ab dieser Mission: §G10 % §!\n\n§HTäglicher diplomatischer Druck: $BASE_ACCEPTANCE$§!\n  Basis: |___NE0 04037___|\n§HTägliche Anforderungen an die weltweite Spannung: -$BASE_TENSION|%$§!\n  Basis: §G-§!$BASE_TENSION|%G$"
