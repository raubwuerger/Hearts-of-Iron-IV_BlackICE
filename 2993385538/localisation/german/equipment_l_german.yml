horse_equipment_0_short:0	"Kavallerieausrüstung"
horse_equipment_0_desc:0	"Der Einsatz von Pferden in der Kriegsführung ist so alt wie die Geschichte selbst. Verbesserte Geschwindigkeit, Mobilität, Durchschlagskraft und Tragkraft waren wertvolle Ergänzungen für jede Armee. Während die Rolle der Pferde zunehmend von Kraftfahrzeugen übernommen wird, fehlen vielen Nationen die wirtschaftlichen Ressourcen, um ihre Streitkräfte vollständig zu motorisieren, und sie sind nach wie vor auf Pferde angewiesen. \n\nUnsere berittene Infanterie und anderes Personal, das Aufgaben wie Transport, Logistik und Aufklärung wahrnimmt, benötigt eine stetige Versorgung mit ausgebildeten Pferden, Futter und geeigneter Ausrüstung."
