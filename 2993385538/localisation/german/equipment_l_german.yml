garrison_equipment_0_desc:0	"Durch die Versorgung unserer Garnisonstruppen mit unverzichtbaren Befestigungswerkzeugen werden wir ihre Fähigkeit verbessern, Verteidigungsstellungen zu halten. Sandsäcke, Spaten, Stacheldraht und tragbare Flutlichtstrahler ermöglichen es den Einheiten, Feldbefestigungen zu errichten und städtische Stellungen zu verstärken. Diese Werkzeuge erhöhen die Sicherheit, verlangsamen das Vorrücken des Feindes und verbessern die Sichtbarkeit bei Nacht, wodurch sichergestellt wird, dass die Verteidigungsstellungen für längere Gefechte gut vorbereitet bleiben."
