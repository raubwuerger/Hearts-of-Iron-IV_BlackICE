infantry_uniforms_3_desc:0	"Von den Truppen benötigte Uniformen, Helme, Stiefel und Ausrüstung"
tech_infantry_uniforms_camo_desc:0	"Die Aufgabe einer Uniform besteht nicht nur darin, den einzelnen Soldaten zu tarnen, sondern auch Freund und Feind voneinander zu unterscheiden. Die Ausgabe der "Frogskin"-Uniformen an US-Truppen in Europa während des Zweiten Weltkriegs wurde eingestellt, da sie zu oft mit der deutschen Uniform der Waffen-SS verwechselt wurde, die ein störendes Muster aufwies. Tarnuniformen müssen hergestellt und an eine große Anzahl von Soldaten verteilt werden. Bei der Gestaltung von Tarnuniformen muss daher ein Kompromiss zwischen Tarnwirkung, Erkennbarkeit, Kosten und Herstellbarkeit gefunden werden.\nArmeen, die an verschiedenen Einsatzschauplätzen im Einsatz stehen, benötigen möglicherweise mehrere verschiedene Tarnuniformen. Die getrennte Ausgabe von Tarnuniformen für gemäßigtes Klima/Dschungel und Wüste ist üblich. Muster können bis zu einem gewissen Grad an unterschiedliche Geländearten angepasst werden, indem Mittel zur Befestigung von Pflanzenstücken an der Uniform hinzugefügt werden. Helme verfügen oft über Netzüberzüge; manche Jacken haben kleine Schlaufen für denselben Zweck. Die Fähigkeit, geeignete Tarnpflanzen zu finden oder die ausgegebene Kampfuniform auf andere Weise an das örtliche Gelände anzupassen, ist eine wichtige Fertigkeit für Infanteriesoldaten.\nLänder in borealen Klimazonen benötigen oft Schneetarnung, entweder durch wendbare Uniformen oder einfache Überziehkleidung. Solche einfachen Überziehkleidungsstücke können auch für andere Geländearten verwendet werden. Die österreichische und die israelische Armee verwenden einfarbige Felduniformen und setzen zur Tarnung auf einfache Überziehkleidung."
