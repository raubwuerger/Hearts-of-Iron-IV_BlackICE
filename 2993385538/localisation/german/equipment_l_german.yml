ITA_infantry_equipment_0_desc:0	"Das Carcano Modello 1891 war das Standardgewehr der Königlichen Italienischen Armee, das in allen Konflikten der R.E. eingesetzt wurde, von den Konflikten um die Kolonien bis hin zum Zweiten Weltkrieg."
ITA_infantry_equipment_1_desc:0	"Die 6,5-mm-Munition des Carcano schien mit der neuen Zeit überholt zu sein, und das war eine Lehre aus dem Krieg gegen Äthiopien. Also stellte die Armee 1938 die neuen 7,35 x 51 mm Geschosse vor, mit überarbeiteten Gewehren mit abgenutzten Läufen."
ITA_infantry_equipment_2_desc:0	"Es kamen Zweifel auf, dass die zwei unterschiedlichen Standards in einem möglicherweise bevorstehenden Krieg zu Verwirrungen in der Logistik geführt hätten, also wurde die Produktion der Mod. 38 gestoppt und nur 285k Mod. 38 produziert, bald ausgemustert und verkauft. Das Modell wurde auf das Kaliber 6,5 mm umskaliert."
ITA_infantry_equipment_3_desc:0	"Die Mod. 91/41 war die letzte große Entwicklung der Serie, die zur Ausrüstung der Divisionen der Armir geschaffen wurde, die in den Osten geschickt wurden. Dieses auf 6,5 mm kalibrierte Gewehr verzichtete auf die mit dem Mod. 38 eingeführt wurden, und ähnelt sehr stark dem ersten Mod. 91."
