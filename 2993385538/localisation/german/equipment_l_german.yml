gw_tank_equipment_axis_desc:0	"Die Panzer des Ersten Weltkriegs wurden vom Vereinigten Königreich und Frankreich getrennt und gleichzeitig entwickelt, um die festgefahrenen Grabenkämpfe an der Westfront zu durchbrechen. Der Name Panzer wurde von den Briten in der Anfangsphase ihrer Entwicklung als Sicherheitsmaßnahme eingeführt, um ihren Zweck zu verschleiern. Die frühen Panzer waren mit Maschinengewehren und kleinen Kanonen bewaffnet, bewegten sich langsam und waren nur so stark gepanzert, dass sie den Beschuss mit Handfeuerwaffen aufhalten konnten."
light_tank_equipment_axis_desc:0	"Leichte Panzer sind kleine, wendige Panzer, die sowohl zur Aufklärung als auch zur Bekämpfung leicht gepanzerter Gegner eingesetzt werden können."
