SLO_motorized_equipment_1_desc:0	"Die Motorisierung der Infanterie ist der zweite Schritt auf dem Weg zur Mechanisierung einer Armee. Zivile Lastkraftwagen lassen sich leicht für militärische Zwecke wie den Transport von Soldaten, das Abschleppen von Geschützen sowie den Transport von Ausrüstung und Nachschub anpassen. Dies erhöht die strategische Mobilität von Infanterieeinheiten erheblich, die andernfalls auf Fußmärsche angewiesen wären. "
