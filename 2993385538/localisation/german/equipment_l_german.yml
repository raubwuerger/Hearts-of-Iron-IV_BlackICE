SWI_mortar_equipment_0_desc:0	"Mörser sind die wichtigste explosive Unterstützungswaffe im Zug. Wo größere Artilleriegeschütze für einen flexiblen taktischen Einsatz möglicherweise zu unhandlich sind, kann der Mörser den Soldaten in der Nähe organische Feuerunterstützung bieten. Die hohe, bogenförmige Flugbahn der Mörsergranaten macht sie ideal, um in Schützengräben einzuschlagen, die ungeschützten Dächer von Gebäuden zu treffen oder Mauern zu umgehen. "
