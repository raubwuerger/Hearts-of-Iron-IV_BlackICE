jungle_equipment_short:0	"Ausrüstung für den Dschungelkrieg"
jungle_equipment_0:0	"Ausrüstung für den Dschungelkrieg"
jungle_equipment_0_desc:0	"Durch die Ausstattung unserer Streitkräfte mit spezieller Ausrüstung für den Dschungelkrieg verbessern wir ihre Kampffähigkeit in dichten und feuchten Umgebungen. Leichte Macheten, kompakte Schanzwerkzeuge und insektenabweisende Kleidung erhöhen die Mobilität und Überlebensfähigkeit in dichter Vegetation. Verbesserte Trinksysteme, atmungsaktive Uniformen und antimykotische Behandlungen sichern den Truppen den Durchhaltevermögen bei langwierigen Einsätzen unter extremen Dschungelbedingungen. Diese Fortschritte werden sicherstellen, dass unsere Streitkräfte in einigen der härtesten Kampfumgebungen einsatzfähig bleiben."
amph_equipment_short:0	"Ausrüstung für die amphibische Kriegsführung"
amph_equipment_0:0	"Grundausstattung für die amphibische Kriegsführung"
amph_equipment_0_desc:0	"Durch die Ausrüstung unserer Angriffstruppen mit Schlauchbooten, zusammenklappbaren Pontons und wasserdichter Ausrüstung werden wir ihre Fähigkeit zur Durchführung von Flussüberquerungen und Strandlandungen verbessern. Eine grundlegende amphibische Ausbildung sowie der Einsatz von Schwimmwesten und leichten Infanterie-Unterstützungswaffen, die für nasse Bedingungen angepasst sind, werden es den Truppen ermöglichen, bei Operationen an Küsten und Flussläufen Brückenköpfe zu errichten."
amph_equipment_1_short:0	"Ausrüstung für die amphibische Kriegsführung"
amph_equipment_2:0	"Fortgeschrittene amphibische Ausrüstung"
amph_equipment_2_desc:0	"Durch die vollständige Optimierung der persönlichen Ausrüstung unserer amphibischen Infanterie werden wir deren Ausdauer und Überlebensfähigkeit bei anspruchsvollen Küstenangriffen maximieren. Fortschrittliche selbstentwässernde Gurtzeuge, wasserdichte Munitionstaschen und schwimmfähige Kampfausrüstung ermöglichen eine schnelle Fortbewegung im Wasser, ohne die Kampfkraft zu beeinträchtigen. Taktische Schwimmwesten, leichte Brückenbau-Sets und verbesserte Enterhaken ermöglichen das schnelle Überwinden von Klippen und Hindernissen und stellen sicher, dass unsere Truppen unter härtesten Bedingungen Brückenköpfe sichern können."
mount_equipment_short:0	"Ausrüstung für den Gebirgskampf"
mount_equipment_0:0	"Grundausstattung für Bergsteiger"
mount_equipment_0_desc:0	" Durch die Ausstattung unserer Bergsteiger-Einheiten mit spezieller Kletterausrüstung werden wir ihre Einsatzfähigkeit in unwegsamem Gelände verbessern. Enterhaken, Eispickel, Kletterseile und verstärkte Stiefel werden die Mobilität auf steilen und vereisten Oberflächen erhöhen. Kälteschutzuniformen und kompakte Feldrationen werden den Einsatz unter Höhenbedingungen ermöglichen und sicherstellen, dass unsere Truppen das Gebirgsgelände effektiver durchqueren können als konventionelle Infanterie."
