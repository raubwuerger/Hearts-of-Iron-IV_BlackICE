arctic_equipment:0	"Ausrüstung für den Arktiskampf"
arctic_equipment_0:0	"Ausrüstung für den Arktiskampf I"
arctic_equipment_0_desc:0	"Arktische Kriegsführung umfasst militärische Operationen, die unter kalten Wetterbedingungen, in großer Höhe oder in Polarregionen durchgeführt werden. Daher umfasst die Ausrüstung für die arktische Kriegsführung Skier oder andere Ausrüstungsgegenstände, die die Fortbewegung unter diesen Bedingungen erleichtern, sowie Tarnung und für die Umgebung geeignete Kleidung. \n\nArktische Unterstützungskompanien bestehen aus Personal, das speziell für die Arktis-Kriegsführung ausgebildet und ausgerüstet ist."
