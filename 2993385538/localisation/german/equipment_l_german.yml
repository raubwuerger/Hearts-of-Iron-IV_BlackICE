gw_tank_equipment_short:0	"WW1 Panzerung"
gw_tank_equipment_desc:0	"Panzer wurden im Ersten Weltkrieg vom Vereinigten Königreich und Frankreich getrennt und gleichzeitig entwickelt, um die festgefahrenen Grabenkämpfe an der Westfront zu beenden. Der Name Panzer wurde von den Briten in der Anfangsphase ihrer Entwicklung als Sicherheitsmaßnahme eingeführt, um ihren Zweck zu verschleiern. Die frühen Panzer waren mit Maschinengewehren und kleinen Kanonen bewaffnet, bewegten sich langsam und waren nur so stark gepanzert, dass sie den Beschuss mit Handfeuerwaffen aufhalten konnten."
light_tank_equipment_desc:0	"Leichte Panzer sind kleine, wendige Panzer, die sowohl zur Aufklärung als auch zur Bekämpfung leicht gepanzerter Gegner eingesetzt werden können."
light_tank_equipment_0_desc:0	"Leichte Panzer aus dem Ersten Weltkrieg sind kleine, leicht bewaffnete Panzer, die in erster Linie zur Unterstützung der Infanterie mit MG-Feuer eingesetzt werden."
light_tank_equipment_1_short:0	"Leichter Panzer Vickers Mk.VI"
light_tank_equipment_1_desc:0	"Leichte Panzer sind kleine, wendige Panzer, die sowohl zum Aufklären als auch zur Bekämpfung leicht gepanzerter Gegner geeignet sind."
light_tank_equipment_2_short:0	"Leichter Panzer"
