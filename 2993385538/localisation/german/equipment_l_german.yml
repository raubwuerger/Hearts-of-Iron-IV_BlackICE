mechanized_equipment_desc:0	"Mechanisierte Infanterie ist Infanterie, die mit gepanzerten Mannschaftstransportwagen (APCs) oder Schützenpanzern (IFVs) für Transport und Kampf ausgerüstet ist. Mechanisierte Infanterie unterscheidet sich von motorisierter Infanterie dadurch, dass ihre Fahrzeuge einen gewissen Schutz vor feindlichem Feuer bieten, im Gegensatz zu ungeschützten Radfahrzeugen (Lkw oder Jeeps) der motorisierten Infanterie."
