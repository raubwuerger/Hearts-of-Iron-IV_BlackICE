mortar_equipment_0_desc:0	"Mörser sind die primäre explosive Unterstützungswaffe des Zuges. Wo größere Artilleriegeschütze für einen flexiblen taktischen Einsatz zu schwerfällig sein könnten, kann der Mörser den Soldaten in der Nähe organische Feuerunterstützung bieten. Die hohe Flugbahn der Mörsergranaten ist ideal, um in Gräben zu landen, die verwundbaren Dächer von Gebäuden zu treffen oder Mauern zu umgehen."
