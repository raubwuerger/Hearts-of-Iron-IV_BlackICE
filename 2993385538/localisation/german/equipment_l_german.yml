light_tank_artillery_equipment:0	"Leichte Artillerie auf Selbstfahrlafette"
light_tank_artillery_equipment_1_short:0	"Lt. Sfl. I"
light_tank_artillery_equipment_2_short:0	"Lt. Sfl. II"
light_tank_artillery_equipment_2_desc:0	"Eine kleine Artilleriekanone auf einem leichten Fahrgestell. Ein leichtes Sfl. verfügt nicht über die Feuerkraft seiner größeren Brüder, ist aber mobiler."
light_tank_artillery_equipment_3_short:0	"Lt. Sfl. III"
light_tank_artillery_equipment_3_desc:0	"Eine kleine Artilleriekanone auf einem leichten Fahrgestell. Ein leichtes Sfl. hat nicht die Feuerkraft seiner größeren Brüder, ist dafür aber mobiler."
light_tank_destroyer_equipment_desc:0	"Jagdpanzer sind Panzer mit einer überdurchschnittlich großen Kanone, die anstelle eines Turms fest montiert ist. Leichte Jagdpanzer basieren auf dem Fahrgestell von leichten Panzern, was bedeutet, dass sie recht mobil sind, aber im Vergleich zu den schwereren TDs keine besonders starken Geschütze tragen."
light_tank_destroyer_equipment_1_desc:0	"Jagdpanzer sind Panzer mit einer überdurchschnittlich großen Kanone in einem festen Aufbau anstelle eines Turms. Leichte Jagdpanzer basieren auf dem Fahrgestell von leichten Panzern, was bedeutet, dass sie ziemlich mobil sind, aber im Vergleich zu schwereren TDs keine besonders starken Geschütze tragen."
light_tank_destroyer_equipment_2:0	"Leichter Jagdpanzer II"
light_tank_destroyer_equipment_2_desc:0	"Jagdpanzer sind Panzer mit einer überdurchschnittlich großen Kanone in einem festen Aufbau anstelle eines Turms. Leichte Jagdpanzer basieren auf dem Fahrgestell von leichten Panzern, was bedeutet, dass sie ziemlich mobil sind, aber im Vergleich zu schwereren TDs keine besonders starken Geschütze tragen."
light_tank_destroyer_equipment_3:0	"Leichter Jagdpanzer III"
light_tank_aa_equipment:0	"Leichte Luftabwehr auf Selbstfahrlafette"
light_tank_aa_equipment_1_short:0	"Lt. SPAA I"
light_tank_aa_equipment_1_desc:0	"Die Luftabwehrartillerie ist in erster Linie für den Abschuss feindlicher Flugzeuge konzipiert, obwohl die Schnellfeuerkanonen auch gegen Bodenziele wirksam sein können. Dieses Modell ist auf dem Fahrgestell eines leichten Panzers montiert."
light_tank_aa_equipment_2_short:0	"Lt. SPAA II"
light_tank_aa_equipment_2_desc:0	"Die Luftabwehrartillerie ist in erster Linie für den Abschuss feindlicher Flugzeuge konzipiert, obwohl die Schnellfeuerkanonen auch gegen Bodenziele wirksam sein können. Dieses Modell ist auf dem Fahrgestell eines leichten Panzers montiert."
light_tank_aa_equipment_3_desc:0	"Die Luftabwehrartillerie ist in erster Linie für den Abschuss feindlicher Flugzeuge konzipiert, obwohl die Schnellfeuerkanonen auch gegen Bodenziele wirksam sein können. Dieses Modell ist auf dem Fahrgestell eines leichten Panzers montiert."
