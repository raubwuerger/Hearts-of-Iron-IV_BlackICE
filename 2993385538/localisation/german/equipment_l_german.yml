gw_artillery_desc:0	"Artillerieausrüstung aus der Zeit des Ersten Weltkriegs in verschiedenen Kalibern. In der Regel schwerer und weniger mobil als heutige Artilleriekonstruktionen. Meist so konstruiert und ausgerüstet, dass sie von Pferdegespannen gezogen werden können."
artillery_equipment_short:0	"Leichte Artillerie"
artillery_equipment_0_desc:0	"Artillerie des Ersten Weltkriegs bezieht sich auf Waffen mit kleinem Kaliber, wie Kanonen und Haubitzen, die von Besatzungen bedient werden und Munition weit über die effektive Reichweite von Handfeuerwaffen hinausschleudern können."
