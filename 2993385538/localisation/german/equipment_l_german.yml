amphibious_mechanized_equipment_desc:0	"Amphibische Traktoren, auch Amtracs genannt, ermöglichen es den Marines, unter gepanzertem Schutz am Strand zu landen. Dies geht jedoch auf Kosten einer schlechten Treibstoffeffizienz."
