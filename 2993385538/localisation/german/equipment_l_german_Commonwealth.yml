british_infantry_tank_equipment_3:0	"Infanteriepanzer"
british_infantry_tank_equipment_3_desc:0	"Einheitstyp: Infanteriepanzer"\n\n Der Valentine Mk II war ein Infanteriepanzer und einer der am häufigsten produzierten Panzer im Commonwealth. Die Serie umfasste mehrere Varianten, sowohl genietete als auch geschweißte, sowie Modelle mit Benzin- und Dieselmotor. Der Mk II war mit einer QF-2-Pfünder-Kanone und einem einzelnen 7,92-mm-Besa-Maschinengewehr bewaffnet, verfügte über eine ordentliche Panzerung von 8 bis 65 mm und war insgesamt zuverlässig, wenn auch mit einer Geschwindigkeit von 15 mph eher langsam. Der Valentine kam vor allem in Nordafrika zum Einsatz, bevor sein Fahrgestell für Spezialaufgaben verwendet wurde. Der Panzer wurde auch in der Sowjetunion eingesetzt."
