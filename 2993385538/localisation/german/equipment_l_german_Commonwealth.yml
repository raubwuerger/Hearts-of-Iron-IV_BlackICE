cruiser_tank_antiair_equipment_3_desc:0	" Einheitentyp: Flugabwehr-Kreuzerpanzer\n\n Der Centaur war ein Kreuzerpanzer und hieß ursprünglich Cromwell II mit einem Leyland-Motor. Um Verwechslungen mit dem geplanten Cromwell-Panzer zu vermeiden, wurde ein neuer Name gewählt: Centaur. Kein Centaur-Panzer kam zum Einsatz; stattdessen wurde eine Variante mit einer QF-75-mm-Flugabwehrkanone entwickelt . Es wurden weniger als 250 Centaur-Flugabwehrpanzer produziert.\n\nVeraltete Cavaliers können zu Centaur III umgebaut werden."
