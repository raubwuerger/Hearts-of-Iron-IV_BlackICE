churchill_tank_equipment_3_desc:0	 "Einheitentyp: Schwerer Infanteriepanzer\n\n Der Churchill Mk VII war die zweite größere Neukonstruktion des Panzers und verfügte über eine QF-75-mm-Kanone; er war breiter und besser gepanzert, wodurch er dem feindlichen Feuer besser standhalten konnte. Der Mk VII war zudem so konzipiert, dass er ohne größere Änderungen leicht zum Crocodile-Flammenwerfer , ohne dass größere Änderungen erforderlich waren. "
