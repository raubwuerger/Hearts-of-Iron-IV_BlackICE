QUE_tac_bomber_equipment_1944:0	"NA B25 Mitchell"
QUE_jet_tac_bomber_equipment_1946:0	"English Electric Canberra"
QUE_nav_bomber_equipment_1936:0	"Blackburn Shark"
QUE_nav_bomber_equipment_1936_desc:0	"Das 1933 eingeführte Modell weckte bald das Interesse der kanadischen Luftwaffe, die 1936 sieben Exemplare in ihren Bestand aufnahm. Insgesamt verfügte sie am Ende des Krieges über 26 oder mehr dieser Flugzeuge."
QUE_nav_bomber_equipment_1940_short:0	"Albacore"
