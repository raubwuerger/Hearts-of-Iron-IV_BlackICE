british_light_tank_equipment_2:0	"Leichter Panzer"
british_light_tank_equipment_2_desc:0	"Einheitstyp: Leichter Panzer"\n\n Der M3 Stuart war ein leichter Panzer, der im Rahmen des Leih- und Pachtgesetzes aus den Vereinigten Staaten von Amerika geliefert wurde. Er war mit einer 37-mm-Kanone bewaffnet und verfügte über eine dickere Panzerung als der M2A4. Die ersten Varianten waren mit einem Continental W-670- oder einem Guiberson T-1020-Dieselmotor ausgestattet. Obwohl er mit dem Panzer III Ausf. G vergleichbar und dem Fiat M13/40 überlegen war, wies der Panzer eine schlechte Kampfbilanz auf."
