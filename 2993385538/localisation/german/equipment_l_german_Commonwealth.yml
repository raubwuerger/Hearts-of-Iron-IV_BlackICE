rn_patrol_submarine:0	" U-Boot der Royal Navy-Flotte"
rn_lr_patrol_submarine_1_desc:0	"Das U-Boot HM X1 wurde als tauchfähiger Handelsraider für die Royal Navy konzipiert und konstruiert; zum Zeitpunkt seines Stapellaufs war es das größte U-Boot der Welt. Die Idee eines U-Boot-Kreuzers war bereits 1915 vorgeschlagen worden, wurde jedoch erst 1921 in die Praxis umgesetzt. Die X1 trug vier QF-5,2-Zoll-Mk-I-Kanonen in gepanzerten Doppeltürmen, einen vor und einen hinter dem Kommandoturm. Ihre sechs Torpedorohre stammten von einem gestrichenen U-Boot der L-Klasse, und sie war mit einer Nachladevorrichtung für jedes Rohr ausgestattet."
tech_rn_patrol_submarine_0_desc:0	"Die U-Boot-Entwürfe der H- und L wurden während des Ersten Weltkriegs entwickelt. Sie markierten den Beginn der U-Boot-Entwicklung in der Zwischenkriegszeit, die von der britischen Royal Navy initiiert wurde, und einige der Boote waren sogar noch zu Beginn des Zweiten Weltkriegs im Einsatz."
tech_rn_patrol_submarine_1_desc:0	"Die Klassen Odin, Oberon und Oxley wurden nach dem Ersten Weltkrieg für die Royal Navy entwickelt. Insgesamt wurden zwölf U-Boote der O-Klasse gebaut. Alle verfügten über eine schwere Torpedobewaffnung mit acht 533-mm-Torpedorohre. Sie wurden bis zum Beginn des Zweiten Weltkriegs als Patrouillen-U-Boote eingesetzt."
