british_mbt_equipment_3_desc:0	"Einheitstyp: Kampfpanzer"\n\n Beim Centurion Mk V wurde der 2-Zoll-Mörser entfernt und die Kommandantenkuppel mit Halterungen für das Browning-Maschinengewehr ausgestattet. Es wurden zusätzliche Staufächer hinzugefügt. Bei der Variante Mk V/1 wurde die Glacis-Panzerung verstärkt, und bei der Variante Mk V/2 wurde die 84-mm-Kanone (20-Pfünder) durch eine 105-mm-Kanone ersetzt. "
