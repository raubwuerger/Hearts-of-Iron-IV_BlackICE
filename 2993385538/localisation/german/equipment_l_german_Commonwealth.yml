cruiser_tank_equipment_5_desc:0	" Einheitentyp: Kreuzerpanzer\n\n Der Crusader war ein Kreuzerpanzer, dessen Fahrgestell als Basis für Flugabwehr-, Kommunikations-, Bulldozer-, Feuerunterstützungs- und Bergungsfahrzeuge. Der Panzer war wendig und schnell, obwohl die Panzerung bei den Modellen Mk I und Mk II nur 40 bzw. 49 mm betrug und er mit einer QF-2-Pfünder-Kanone ausgerüstet war. Beim Mk III wurde die Panzerung auf 51 mm erhöht und er verfügte über eine QF-6-Pfünder-Kanone als Hauptbewaffnung. Obwohl er in Serie produziert wurde und in der Nordafrika-Kampagne eine entscheidende Rolle spielte, kam der Crusader an anderen Fronten nicht zum Einsatz. "
