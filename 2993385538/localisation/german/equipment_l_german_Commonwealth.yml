 hawker_hart_equipment_1_desc:0 "Die Hawker Hart ist ein Hochleistungs-Doppeldecker-Bomber. Seine Leistung war so hoch, dass er alle damals bei der RAF im Einsatz befindlichen Jagdflugzeuge übertraf."
