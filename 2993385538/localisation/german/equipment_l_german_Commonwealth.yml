QUE_mechanized_equipment_1_desc:0	"Eine frühere Version des Halbkettenfahrzeugs, mit hoher Geschwindigkeit und geringer Kapazität. Wurde häufig bei den Commonwealth-Streitkräften eingesetzt."

QUE_mechanized_equipment_2_short:0	"C15TA"

QUE_mechanized_equipment_3:0	"Ram Kangaroo"

QUE_mechanized_equipment_3_desc:0	"Ein gepanzerter Mannschaftstransportwagen, der zum Ram-Panzer umgebaut wurde. Er war so erfolgreich, dass er von allen Commonwealth-Streitkräften übernommen wurde."

