QUE_fighter_equipment_1936:0	"Hawker Hurricane"

QUE_fighter_equipment_1936_desc:0	"Die Hawker Hurricane wurde von der Canadian Car & Foundry Co und anderen Betrieben in Lizenz hergestellt und war zu Beginn des Krieges ein beliebtes Jagdflugzeug."

