cruiser_tank_antiair_equipment_1_desc:0	"Einheitentyp: Anti -Luft-Kreuzerpanzer\n\n Es wurde das Fahrgestell eines Crusader-Panzers verwendet, die 6-Pfünder-Kanone wurde durch zwei 20-mm-Oerlikon-Kanonen und ein einzelnes .303-Vickers-GO-Maschinengewehr ersetzt. Der Turm war klein und polygonal, was den Platz einschränkte und die Sicht beeinträchtigte. Aufgrund der Luftüberlegenheit kamen die Flugabwehrfahrzeuge kaum zum Einsatz, es sei denn, sie wurden gegen Bodenziele wie Infanterie eingesetzt.\n\nAusgemusterte Crusader können zu AA Mk. III umgebaut werden."
