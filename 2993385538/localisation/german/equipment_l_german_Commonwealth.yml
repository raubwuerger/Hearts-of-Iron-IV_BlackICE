gauntlet_fighter_equipment:0	"Gauntlet Interceptor"
gauntlet_fighter_equipment_1:0	"Gloster Gauntlet"
gauntlet_fighter_equipment_1_desc:0	"Einheitstyp: Abfangjäger"\n\n Die Gloster Gauntlet war ein einsitziger Doppeldecker-Jäger und das letzte bei der Royal Air Force im Einsatz befindliche Flugzeug mit offenem Cockpit. Das Flugzeug löste die Bristol Bulldog als Hauptjäger ab und war 56 mph schneller als sein Vorgänger . Obwohl für einen Doppeldecker fortschrittlich, wurde der Gauntlet von Gloster Gladiators, Hawker Hurricanes und Supermarine Spitfires überflügelt und auf den Ausbildungsstatus verwiesen oder in Übersee-Kolonien eingesetzt. Der Gauntlet war mit zwei .303-Vickers-Maschinengewehren bewaffnet."
gladiator_fighter_equipment:0	"Gladiator Interceptor"
gladiator_fighter_equipment_1:0	"Gloster Gladiator"
gladiator_fighter_equipment_1_desc:0	"Einheitstyp: Abfangjäger"\n\n Die Gloster Gladiator war ein einsitziger Doppeldecker-Jäger, der als Abfangjäger konzipiert und stärker bewaffnet war als frühere Jäger. Die Gladiator war mit zwei .303-Vickers-Maschinengewehren und zwei . 303-Lewis-Maschinengewehre. Obwohl durch Eindeckerkonstruktionen überholt, kamen die Gladiator und ihre Marinevariante, die Sea Gladiator, während des Krieges auf allen Kriegsschauplätzen und von beiden Seiten zum Einsatz. Das Flugzeug wurde vom Commonwealth, von China, Finnland, Schweden, der Sowjetunion, Südafrika und der irakischen Luftwaffe eingesetzt."
defiant_fighter_equipment:0	"Defiant Interceptor"
defiant_fighter_equipment_1:0	" Boulton Paul Defiant"
defiant_fighter_equipment_1_desc:0	"Einheitentyp: Abfangjäger"\n\n Die Boulton Paul Defiant war ein Abfangjäger, der als "Turmjäger" konzipiert war, obwohl sie über keine nach vorne feuernden Geschütze verfügte. Das Design war darauf ausgelegt, feindlichen Bombern entgegenzuwirken, da die meisten Doppeldecker langsamer waren als die mehrmotorigen Eindecker-Bomber waren. Theoretisch sollte sich die Defiant feindlichen Flugzeugen von unten oder von der Seite nähern und ihr Feuer koordinieren. Zur Bewaffnung gehörte ein einzelner hydraulisch angetriebener Rückenturm mit vier .303-Browning-Maschinengewehren. Die Turmjäger waren zwar effektiv, doch das Fehlen von nach vorne feuernden Waffen machte sie sehr anfällig für feindliche Jäger."
griffon_fighter_equipment:0	"Spitfire Mk XIV Interceptor"
griffon_fighter_equipment_1:0	"Supermarine Spitfire Mk XIV"
griffon_fighter_equipment_1_desc:0	"Einheitstyp: Jäger \n\n Die Spitfire Mk XIV erhielt einen neuen Motor der Griffon-65-Serie mit einem zweistufigen -stufigen Kompressor. Die Mk XII waren die erste Variante mit einem Griffon-Motor, der nur über einen einstufigen Kompressor verfügte, was die Leistung des Flugzeugs in großen Höhen beeinträchtigte. Der Motor wurde zehn Zoll weiter nach vorne versetzt, und es wurden erhebliche Änderungen am Rumpf vorgenommen, um Platz für neue Komponenten zur Kühlung zu schaffen. Die Bewaffnung wurde auf zwei 20-mm-Hispano-Mk-II-Kanonen und vier .303-Browning-Mk-II-Maschinengewehre standardisiert.\n\nAufgrund der erheblichen Änderungen können veraltete Mk IX NICHT zu Mk XIV ."
martinbaker_fighter_equipment:0	"MB-5 Interceptor"
martinbaker_fighter_equipment_1:0	"Martin-Baker MB 5"
martinbaker_fighter_equipment_1_desc:0	"Einheitentyp: Abfangjäger"\n\n Die Martin-Baker MB 5 war ein Kampfflugzeug, das auf Wendigkeit, Robustheit, Geschwindigkeit und Feuerkraft ausgelegt war. Die MB 5 entstand aus einem privaten Gemeinschaftsprojekt von Sir James Martin und Captain Valentine Baker, die einen als MB 1 bekannten Tiefdecker entwarfen, wobei jedes nachfolgende Modell das vorherige übertraf. Die MB 3 war ein vorgeschlagenes Design mit sechs 20-mm-Hispano-Kanonen und einem 2.000-PS-Motor; doch kam es zu einer Tragödie, als der Prototyp abstürzte und Captain Baker ums Leben kam. Die MB 5 war eine Neukonstruktion und verfügte zwar über herausragende Leistungsmerkmale sowie einen für Wartungsarbeiten leicht zugänglichen Rumpf, doch die Einführung von Düsenflugzeugen verhinderte, dass das Flugzeug in Produktion ging. Später erfanden Sir Martin und die Firma Martin-Baker den Schleudersitz und trieben dessen Entwicklung weiter voran. "
hawker_demon_equipment:0	 "Demon Fighter"
hawker_demon_equipment_1:0	"Hawker Demon"
hawker_demon_equipment_1_desc:0	"Einheitstyp: Jäger\n\n Die Hawker Demon war eine Variante des leichten Bombers Hawker Hart, einem zweisitzigen -sitzigen Doppeldecker. Die Demon erhielt ein zweites .303-Vickers-Maschinengewehr im Bug, und das .303-Vickers-Maschinengewehr im Heck wurde an einer neuen Position angebracht, wodurch sich dessen Schussfeld verbesserte. Es wurde ein verbesserter Motor, ein Kestrel-IS-Motor mit Kompressor, eingebaut. Die Demon diente als Übergangsjäger, bis leistungsstärkere Jäger wie die Hawker Fury verfügbar waren. "
spitfire_equipment:0	"Spitfire Mk I Fighter"
spitfire_equipment_1:0	"Supermarine Spitfire Mk I"
spitfire_equipment_1_desc:0	"Einheitstyp: Jäger \n\n Die Supermarine Spitfire war ein einsitziger Jäger, der entwickelt wurde, um die Spezifikation F7/30 des Luftfahrtministeriums zu erfüllen, die einen modernen Jäger mit einer Fluggeschwindigkeit von 250 mph vorsah. Supermarines ursprünglicher Entwurf, der Typ 224, war eine völlige Enttäuschung und führte zu einem neuen Vorschlag, dem Typ 300, der ebenfalls scheiterte. Eine Reihe von Änderungen umfasste ein geschlossenes Cockpit, Sauerstoffversorgung, kleinere und dünnere Tragflächen sowie das neue Rolls-Royce PV-XII V-12 "Merlin"-Triebwerk. Das Flugzeug war mit vier .303-Browning-Mk-II-Maschinengewehren bewaffnet, die in Lizenz gefertigt wurden. Die britischen M2-Modelle verfügten über eine offene Gurtzuführung, die in Höhen über 15.000 Fuß zum Einfrieren neigte."
spitfire_equipment_2_short:0	"Spitfire Mk II Fighter"
tech_spitfire_equipment_1:0	"Supermarine Spitfire"
mid_spitfire_equipment:0	"Spitfire Mk V Fighter"
mid_spitfire_equipment_1:0	"Supermarine Spitfire Mk V"
mid_spitfire_equipment_1_desc:0	"Einheitstyp: Jagdflugzeug"\n\n Die Spitfire Mk V war eine Druckkabinenversion der Spitfire, die für lang andauernde Kämpfe gegen feindliche Bomber in großer Höhe vorgesehen war. Das Flugzeug wurde von einem neuen Triebwerk der Merlin-45-Serie angetrieben, das 1.440 PS leistete, sowie von einem neuen Kompressor, der es dem Flugzeug ermöglichte, Manöver in der Schwerelosigkeit durchzuführen, ohne den Kraftstofffluss zu beeinträchtigen. Die Mk-V-Serie umfasste mehrere Varianten mit unterschiedlichen Bewaffnungsanordnungen, Änderungen am Flügeldesign, Windschutzscheiben und tropischer Ausrüstung für den Wüstenkrieg. \n\nVeraltete Mk II können zu Mk V umgerüstet werden."
late_spitfire_equipment:0	"Spitfire Mk IX Fighter"
late_spitfire_equipment_1:0	"Supermarine Spitfire Mk IX"
late_spitfire_equipment_1_desc:0	"Einheitstyp: Jäger \n\n Die Spitfire Mk IX war mit einem neuen Merlin-61-Motor mit zweistufigem Kompressor ausgestattet und wurde von den Piloten als Quantensprung gegenüber früheren Triebwerken beschrieben. Das Flugzeug konnte schneller in größere Höhen steigen und dort seine Manövrierfähigkeit besser aufrechterhalten als frühere Versionen. Ursprünglich wurden Mk-V-Zellen zu Mk-IX-Modellen umgerüstet, bis neue, aerodynamischere und verstärkte Flugzeugzellen hergestellt werden konnten.\n\nVeraltete Mk V können zu Mk IX umgerüstet werden."
griffon_spitfire_equipment:0	"Spitfire Mk XIVe Jagdflugzeug"
griffon_spitfire_equipment_1:0	" Supermarine Spitfire Mk XIVe"
griffon_spitfire_equipment_1_desc:0	"Einheitstyp: Jäger \n\n Der Motor der Griffon-65-Serie verbrauchte pro Stunde mehr Treibstoff als die früheren Merlin-Motoren, was die Reichweite des Flugzeugs auf etwa 460 Meilen reduzierte. Die Spitfire Mk XIVe verfügte über tropfenförmige Cockpithauben und zusätzliche Zusatztanks, wodurch sich die Reichweite auf 610 Meilen bzw. 960 Meilen mit einem 90-Gallonen-Zusatztank.\n\nVeraltete Mk XIVs können zu Mk XIVes umgerüstet werden. "
griffon_spitfire_equipment_2:0	"Supermarine Spitfire Mk 21"
griffon_spitfire_equipment_2_desc:0	"Einheitstyp: Jagdflugzeug" \n\n Der Einbau der Motoren der Griffon-Serie hatte Bedenken hinsichtlich der Festigkeit der Flugzeugzelle und der Tragflächen aufkommen lassen. Die Tragflächen wurden mit einer neuen Struktur neu konstruiert und waren dicker. Die Fahrwerksbeine wurden verbreitert, um das Handling am Boden zu verbessern, und die Vierspeichenräder wurden verstärkt, um dem höheren Gewicht des Flugzeugs standzuhalten. Die Änderungen an der Mk-21-Serie machten das Flugzeug wesentlich leichter zu fliegen und sorgten im Vergleich zu früheren Griffon-Varianten für gute Flugeigenschaften in allen Höhen. \n\nVeraltete Mk XIVs können zu Mk 21 umgerüstet werden."
spiteful_equipment_1:0	"Supermarine Spiteful"
spiteful_equipment_1_desc:0	" Ein vorgeschlagener Nachfolger der Spitfire"
spitfire_24_equipment_desc:0	"Einheitstyp: Jäger \n\n Die Spitfire Mk 24 war die letzte Weiterentwicklung einer langen Reihe von Varianten. Im Vergleich zur Mk 22 wurde die Treibstoffkapazität durch zwei zusätzliche 33-Gallonen-Tanks am Heck des Rumpf. Das Heck des Flugzeugs wurde vergrößert, und Modifikationen an den Trimmklappen verbesserten die Flugeigenschaften. Die Bewaffnung des Flugzeugs wurde auf vier kurzläufige 20-mm-Hispano-Mk-5-Kanonen umgestellt, die die dickere Panzerung feindlicher Flugzeuge mühelos durchschlagen konnten. Es wurden Bombenhalterungen installiert, die den Einsatz einer 500-Pfund- und zweier 250-Pfund-Bomben ermöglichten. \n\nVeraltete Mk XXI können zu Mk 24 umgerüstet werden."
spitfire_24_equipment_1_short:0	"Spitfire Mk 24 Fighter"
tech_spitfire_24_equipment_1:0	"Supermarine Spitfire 24"
hawker_fury_equipment_desc:0	"Mehrzweckflugzeuge sind so konzipiert, dass sie sowohl die Aufgaben von Jagdflugzeugen beim Angriff auf feindliche Flugzeuge als auch die von CAS beim Angriff auf feindliche Bodentruppen und Schiffe erfüllen."
hawker_fury_equipment_1_short:0	" Fury Multirole"
tech_hawker_fury_equipment_1:0	"Hawker Fury"
hawker_hurricane_equipment_desc:0	"Einheitstyp: Mehrzweckjäger"\n\n Die Hawker Hurricane war ein einsitziger Eindecker-Jäger, der als Weiterentwicklung des Doppeldeckers Hawker Fury konzipiert wurde. Die neue Konstruktion verfügte über ein einziehbares Fahrwerk, einen Rolls-Royce-Merlin-Motor sowie eine einfache Bauweise und Wartungsfreundlichkeit. Im Vergleich zur Supermarine Spitfire, die die Fantasie der Öffentlichkeit beflügelte, erforderte die Hurricane 10.300 Arbeitsstunden gegenüber 15. 200, und erstere war während der Luftschlacht um England für mehr abgeschossene feindliche Flugzeuge verantwortlich. Die Mk I war mit acht .303-M1919-Browning-Maschinengewehren bewaffnet."
hawker_hurricane_equipment_1_short:0	"Hurricane Mk I Multirole"
tech_hawker_hurricane_equipment_1:0	"Hawker Hurricane I"
hawker_hurricane_equipment_2_short:0	"Hurricane Mk II Multirole"
tech_hawker_hurricane_equipment_2:0	"Hawker Hurricane II"
hawker_typhoon_equipment_desc:0	"Einheitstyp: Mehrzweckjäger"\n\n Die Hawker Typhoon war ursprünglich als Abfangjäger für mittlere bis große Höhen konzipiert, wurde jedoch aufgrund von Konstruktionsproblemen zu einem Jagdbomber -Bomber. Angetrieben von einem Napier-Sabre-Motor mit 2.180 PS verfügte das Flugzeug über eine überdurchschnittliche Geschwindigkeit und war, als die Focke-Wulf 190 auf den Markt kam, eines der wenigen Flugzeuge, die diese abfangen konnten. Der Typhoon war mit zwölf .303-M1919-Browning-Maschinengewehren bewaffnet, sechs in jedem Flügel."
hawker_typhoon_equipment_1_short:0	" Typhoon Mk Ia Multirole"
hawker_typhoon1b_equipment_1:0	"Hawker Typhoon Mk Ib"
hawker_typhoon1b_equipment_1_desc:0	"Einheitstyp: Mehrzweckjäger\n\n Der Bedarf an Bodenangriffsflugzeugen verwandelte den Typhoon in einen Jagdbomber -Bomber. Die aktuelle Flugzeugzelle wurde mit Aufhängepunkten ausgestattet, um den Transport von bis zu zwei 1.000-Pfund-Bomben zu ermöglichen. Die zwölf .303-Browning-Maschinengewehre vom Typ M1919 wurden durch vier 20-mm-Hispano-Mk-II-Kanonen ersetzt. \n\nVeraltete Mk Ias können zu Mk Ibs umgerüstet werden."
tech_hawker_typhoon1b_equipment_1:0	"Hawker Typhoon Ib"
hawker_typhoon1b_equipment_2:0	"Hawker Typhoon Mk Ib (Late) "
hawker_typhoon1b_equipment_2_desc:0	"Der Typhoon erhielt einen neuen Motor, den Napier Sabre IIB, mit 2.200 PS. Es wurden zusätzliche Aufhängepunkte hinzugefügt, die den Einbau von acht ungelenkten Luft-Boden-Raketen vom Typ RP-3 ermöglichten. Das Flugzeug behielt seine Bewaffnung von vier 20-mm-Hispano-Mk-II-Kanonen sowie die Fähigkeit bei, zwei 1.000-Pfund- Bomben zu transportieren.\n\nVeraltete Mk Ia und Mk Ibs können zu Mk Ib (Late) umgerüstet werden."
hawker_tempest_equipment_desc:0	" Typ: Mehrzweckjäger\n\n Die Hawker Tempest war ein Jagdflugzeug, das als Weiterentwicklung des Typhoon konzipiert wurde und die Leistungsabfall in großen Höhen zu beheben. Aufgrund erheblicher Änderungen wurde die Bezeichnung des Flugzeugs von Typhoon II in Tempest geändert. Die Bewaffnung bestand aus vier 20-mm-Hispano-Mk-II-Kanonen, die später durch Mk-V-Kanonen ersetzt wurden, zwei 500- oder 1.000-Pfund-Bomben sowie Optionen für bis zu zwei 90-Gallonen-Zusatztanks. Als die Tempest in Dienst gestellt wurde, wurde sie für die Abfangjagd in geringer Höhe und für Bodenangriffe eingesetzt und zeichnete sich in beiden Rollen aus."
hawker_tempest_equipment_1_short:0	"Tempest Mk V Multirole"
tech_hawker_tempest_equipment_1:0	"Hawker Tempest"
hawker_tempest_equipment_2_short:0	"Tempest Mk II Multirole"
hawker_monofury_equipment_1:0	"Hawker Fury"
hawker_monofury_equipment_1_desc:0	"Einheitstyp: Mehrzweckjäger"\n\n Die Hawker Fury war der evolutionäre Nachfolger der Hawker Typhoons und eines der schnellsten einmotorigen Propellerflugzeuge. Angetrieben von einem Bristol Centaurus mit 2.480 PS erreichte das Flugzeug eine Höchstgeschwindigkeit von 460 mph, verfügte über eine hervorragende Steigleistung und eine gute Dienstgipfelhöhe. Zur Bewaffnung gehörten vier 20-mm-Hispano-Mk-V-Maschinenkanonen, zwölf 3-Zoll-Raketen sowie eine Bombenlast von 2.000 Pfund. Obwohl es zu spät kam, um noch im Krieg zum Einsatz zu kommen, wurde es im Koreakrieg und von Kuba gegen die Invasion in der Schweinebucht eingesetzt."
bristol_blenheim_f_equipment:0	"Blenheim Heavy Fighter"
bristol_blenheim_f_equipment_1:0	"Bristol Blenheim Mk IF"
bristol_blenheim_f_equipment_1_desc:0	"Einheitentyp: Nachtjäger\n\n Die Blenheim Mk I war ein vielseitiges Flugzeug, und der Bedarf an Nachtjägern zur Abwehr feindlicher Bomberangriffe stieg. Die Mk I war mit einem AI Mk III- oder Mk IV-Bordabfangradar sowie einem Geschützpaket mit vier .303 Vickers-Maschinengewehren, die unter dem Rumpf montiert waren."
bristol_blenheim_f_equipment_2:0	"Bristol Blenheim Mk IVf"
bristol_blenheim_f_equipment_2_desc:0	"Einheitstyp: Nachtjäger\n\n Wie die Blenheim Mk IF war auch die Mk IVF mit einem Bordabfangradar und einem Geschützpaket mit vier unter dem Rumpf montierten .303-Vickers-Maschinengewehren ausgestattet. Dank einer größeren internen Treibstoffkapazität übertraf die Reichweite der Mk IVF die des Bombers und der vorherigen Mk IF."
bristol_beaufighter_equipment:0	"Beaufighter Heavy Fighter"
bristol_beaufighter_equipment_1:0	 "Bristol Beaufighter Mk IF"
bristol_beaufighter_equipment_1_desc:0	"Einheitstyp: Schwerer Jäger\n\n Die Bristol Beaufighter wurde als zweimotoriger schwerer Jäger und Variante der Bristol Beaufort konzipiert. Nach München wurde die Beaufort einer Bewertung unterzogen, und die strukturelle Festigkeit des Flugzeugs, die Tragflächen, das Fahrwerk und das Heck erwiesen sich als geeignet für eine verstärkte Bewaffnung und größere Treibstoffkapazität. Die Mk I F ist eine Nachtjäger-Variante, die mit einem sperrigen frühen Radargerät ausgestattet ist, das aufgrund des Gewichts und der Leistung des Flugzeugs dessen Kampffähigkeiten nicht beeinträchtigte. Zur Bewaffnung gehörten vier 20-mm-Hispano-Kanonen in der Nase und sechs an den Tragflächen montierte .303-M1919-Browning-Maschinengewehre."
bristol_beaufighter_equipment_2:0	"Bristol Beaufighter TF Mk X"
bristol_beaufighter_equipment_2_desc:0	"Einheitstyp: Schwerer Jäger\n\n Die Mk X war eine verbesserte Version der Beaufighter, die mit zwei neuen Hercules XVII- oder XVII-Motoren mit Kompressoren ausgestattet war. Die interne Treibstoffkapazität wurde erhöht, und wenn die an den Tragflächen montierten Maschinengewehre entfernt wurden, konnten zusätzliche externe Treibstofftanks angebracht werden. Das Flugzeug behielt seine vier an der Nase montierten 20-mm-Hispano-Mk-II-Kanonen , konnte nun aber acht RP-3-Raketen, zwei 250-Pfund-Bomben oder einen 18-Zoll-Torpedo bzw. einen amerikanischen Mark-13-Torpedo tragen.\n\nVeraltete Mk IFs können zu TF Mk Xs umgerüstet werden."
westland_whirlwind_equipment:0	" Whirlwind-Abfangjäger"
westland_whirlwind_equipment_1:0	"Westland Whirlwind"
westland_whirlwind_equipment_1_desc:0	"Einheitentyp: Abfangjäger\n\n Die Westland Whirlwind war ein zweimotoriger schwerer Jäger, dessen Konzeption auf der Idee beruhte, dass zur Bekämpfung eines feindlichen Flugzeugs , die Feuerkraft maximiert werden müsse. Das Flugzeug war von der Größe her mit einer Hawker Hurricane vergleichbar, wies jedoch eine geringere Frontfläche auf. Das Fahrwerk war vollständig einziehbar, und das Design zeichnete sich durch eine glatte Oberfläche mit wenigen Öffnungen oder Vorsprüngen aus, was dem Flugzeug eine gute Geschwindigkeit und einen geringen Luftwiderstand verlieh. Obwohl das Flugzeug mit vier 20-mm-Hispano-Kanonen bewaffnet war, hatte es eine geringe Reichweite von etwa 300 Meilen. Aufgrund von Testproblemen und Produktionsverzögerungen wurde die Whirlwind nur in begrenzter Stückzahl hergestellt und durch die Bristol Beaufighter ersetzt."
mosquito_hvf_equipment:0	"Mosquito Heavy Fighter"
mosquito_hvf_equipment_1:0	"De Havilland Mosquito FB Mk VI"
mosquito_hvf_equipment_1_desc:0	"Einheitstyp: Schwerer Jäger"\n\n Die De Havilland Mosquito FB Mk VI war mit einer speziellen imprägnierten Stoffbespannung ausgestattet, die die Aerodynamik des Flugzeugs Aerodynamik sowie die Festigkeit und Steifigkeit des Flugzeugs verbesserte. Durch den Einsatz von Bandklemmen, speziellen Laminaten und einer Mischung aus verschiedenen Hölzern wurden der Holzrumpf und die Tragflächen erheblich verstärkt.  In Kombination mit den neuen Merlin-Triebwerken vom Typ Mk 23 oder Mk 25, vier .303-Browning-Maschinengewehren, vier 20-mm-Hispano-Kanonen sowie der Fähigkeit, bis zu 2.000 Pfund Bombenlast oder acht ungelenkte RP-3-Raketen zu tragen, war die FB Mk VI ein effektiver schwerer Jäger und Bodenangriffsflugzeug."
mosquito_nf_equipment:0	"Mosquito Heavy Fighter"
mosquito_nf_equipment_1:0	"De Havilland Mosquito NF Mk II"
mosquito_nf_equipment_1_desc:0	"Einheitstyp: Nachtjäger"\n\n Die Mosquito Mk II hatte sich als effektives Flugzeug mit guter Nutzlastkapazität bewährt, obwohl sie größtenteils aus Holz gefertigt war. Es bestand ein dringender Bedarf an Nachtjägern, um feindlichen Bomberangriffen entgegenzuwirken, und die vorhandenen Mk II wurden mit einem Bordabfangradar ausgerüstet. Im Gegensatz der Bombervariante verfügte die NF Mk II über vier 20-mm-Hispano-Kanonen im Rumpfunterbau und vier .303-Browning-Maschinengewehre an der Nase. Das Flugzeug konnte keine Bomben oder Raketen als Nutzlast mitführen. "
mosquito_nf_equipment_2:0	 "De Havilland Mosquito NF Mk 30"
mosquito_nf_equipment_2_desc:0	"Einheitstyp: Nachtjäger\n\n Die Mosquito NF Mk 30 war eine Höhenvariante, die von zwei Rolls-Royce-Merlin-76-Motoren angetrieben wurde und über ein verbessertes Bordabfangradar verfügte. Die Bewaffnung blieb wie bei früheren Nachtjäger-Varianten mit vier 20-mm-Hispano-Kanonen und vier .303-Browning-Maschinengewehren.\n\nVeraltete Mk II können zu Mk 30 umgerüstet werden."
welkin_equipment:0	"Welkin Interceptor"
##### |___KY020 792___|„Westland Welkin“
welkin_equipment_1_desc:0	"Einheitstyp: Abfangjäger"\n\n Die Westland Welkin, was so viel wie "Himmelsgewölbe" bedeutet, war ein zweimotoriger schwerer Jäger, der für den Einsatz in großen Höhen konzipiert war. Das Flugzeug verfügte über eine große Spannweite von 70 Fuß, einen zweistufigen Rolls-Royce-Merlin-Motor und ein Druckcockpit. Ähnlich wie die Whirlwind, auf der die Welkin ursprünglich basierte, war das Flugzeug mit vier 20-mm-Hispano-Kanonen bewaffnet. Als die Gefahr von Bombenangriffen aus großer Höhe durch feindliche Flugzeuge ausblieb, wurde die Produktion der Welkin eingestellt."
hornet_equipment_desc:0	"Einheitstyp: Schwerer Jäger\n\n Die De Havilland Hornet war ein von zwei Kolbenmotoren angetriebenes Jagdflugzeug, das an die Holzbauweise der Mosquito anknüpfte. Angetrieben von zwei Rolls-Royce-Merlin-Motoren mit jeweils 2. 070 PS, erreichte eine hervorragende Höchstgeschwindigkeit von 475 mph. Das Flugzeug war mit vier 20-mm-Hispano-Mk-V-Maschinenkanonen, zwei 1.000-Pfund-Bomben (jeweils eine unter jedem Flügel) und bis zu acht ungelenkten RP-3-Raketen bewaffnet. Die Hornet wurde während des Malaya-Konflikts eingesetzt und ersetzte umgehend ältere Beaufighter und Spitfires, die zuvor Bodenangriffe durchgeführt hatten. "
hornet_equipment_1_short:0	"Hornet Heavy Fighter"
tech_welkin_equipment_1:0	"Westland Welkin"
gloster_meteor_equipment_desc:0	"Jagdflugzeuge sind Kampfflugzeuge, die von Strahltriebwerken angetrieben werden. Sie sind dafür ausgelegt, feindliche Flugzeuge anzugreifen und zu zerstören."
gloster_meteor_equipment_1_short:0	"Meteor F.1 Jet Fighter"
tech_gloster_meteor_equipment_1:0	"Gloster Meteor F.1"
gloster_meteor_equipment_2_short:0	"Meteor F.3 Mehrzweck-Düsenjäger"
tech_gloster_meteor_equipment_2:0	"Gloster Meteor F.3"
gloster_meteor_equipment_3_short:0	"Meteor F.4 Mehrzweck-Düsenjäger"
tech_gloster_meteor_equipment_3:0	 "Gloster Meteor F.4"
dehaviland_vampire_equipment_desc:0	"Düsenjäger sind Kampfflugzeuge, die von Düsentriebwerken angetrieben werden. Sie sind dafür ausgelegt, feindliche Flugzeuge anzugreifen und zu zerstören."
vampire_equipment_1_short:0	"Vampire F.1 Düsenjäger"
tech_vampire_equipment_1:0	"De Havilland Vampire F.1"
hawker_hind_equipment_desc:0	"Einheitentyp: CAS\n\n Die Hawker Hind war ein verbesserter leichter Doppeldecker-Bomber, der auf der Hawker Hart basierte. Die Hart war als Übergangslösung gedacht, bis moderne Eindecker-Bomber in Produktion gehen konnten. Im Vergleich zur Hart verfügte die Hind über ein neues Triebwerk, den Rolls-Royce Kestrel V, sowie einen Rumpf aus einer Mischung aus Stahl und Duraluminium, während die Tragflächen weiterhin aus Stoff bestanden. Die Hind war mit einem nach vorne feuernden 0,303-Vickers-Maschinengewehr, einem 0,303-Lewis-Maschinengewehr im hinteren Cockpit ausgerüstet und konnte bis zu 510 Pfund Bomben tragen. Das Flugzeug war bei der afghanischen Luftwaffe und im Iran im Einsatz, wurde jedoch in den Commonwealth-Staaten auf den Status eines Schulflugzeugs herabgestuft."
hawker_hind_equipment_1_short:0	"Hind CAS"
tech_hawker_hind_equipment_1:0	"Hawker Hind"
vickers_wellesley_equipment_desc:0	"Leichte Bomber sind zweimotorige Bomber zum Angriff auf feindliche Truppen, strategische Ziele und Schiffe. Sie fliegen in der Regel in geringer Höhe."
vickers_wellesley_equipment_1_short:0	"Wellesley-Leichtbomber"
tech_vickers_wellesley_equipment_1:0	"Vickers Wellesley"
fairey_battle_equipment_desc:0	"Einheitstyp: CAS"\n\n Die Fairey Battle war ein einmotoriger leichter Bomber und der Nachfolger der Hawker Hart und Hind als Eindecker. Obwohl sie von einem Rolls-Royce-Merlin-Motor angetrieben wurde, machten die dreiköpfige Besatzung, die 1.000 Pfund an Bomben im Inneren und 1.500 Pfund außen machten das Flugzeug schwer und langsam. Mit einem nach vorne feuernden .303 M1919 Browning-Maschinengewehr und einem .303 Vickers K-Maschinengewehr im hinteren Cockpit war das Flugzeug sehr anfällig für feindliche Jäger. Das Flugzeug wurde auf die Ausbildung von Einheiten in Übersee beschränkt."
fairey_battle_equipment_1_short:0	 "Battle CAS"
tech_fairey_battle_equipment_1:0	"Fairey Battle"
bristol_beaufighter_cas_equipment_desc:0	"Einheitstyp: Schwerer CAS\n\n Die Beaufighter war ein sehr anpassungsfähiges Flugzeugdesign, ursprünglich eine Variante des Torpedobombers Bristol Beaufort. Die Beaufighter wurde anschließend zu einem schweren Nachtjäger weiterentwickelt. Durch die Hinzufügung von Aufhängepunkten für Bomben, die es dem Flugzeug ermöglichten, zwei 250-Pfund-Bomben zu tragen, erhielt das Flugzeug die Bezeichnung "C" für das Coastal Command und wurde in Bodenangriffseinsätzen eingesetzt. "
bristol_beaufighter_cas_equipment_1_short:0	"Beaufighter Mk Ic Heavy CAS"
tech_bristol_beaufighter_cas_equipment_1:0	"Bristol Beaufighter Ic"
bristol_beaufighter_cas_equipment_2_short:0	"Beaufighter Mk VIc Heavy CAS"
tech_bristol_beaufighter_cas_equipment_2:0	"Bristol Beaufighter VIc"
hawker_hurricane_iic_equipment:0	"Hurricane II Close Air Support"
hawker_hurricane_iic_equipment_1:0	"Hawker Hurricane Mk IIc"
hawker_hurricane_iic_equipment_1_desc:0	" Einheitstyp: CAS\n\n Bei der Hawker Hurricane Mk IIc wurde das Flugzeug stärker auf eine Bodenangriffsrolle umgerüstet, indem die zwölf Maschinengewehre durch vier 20-mm-Hispano-Kanonen ersetzt wurden. Es wurde ein leicht modifizierter Flügel eingebaut, der Aufhängepunkte für eine 250- oder 500-Pfund-Bombe sowie zusätzliche Treibstofftanks ermöglichte. \n\nVeraltete Mk I und Mk II können zu Mk IIc umgerüstet werden."
hawker_hurricane_iv_equipment_1:0	"Hawker Hurricane Mk IV"
hawker_hurricane_iv_equipment_1_desc:0	"Einheitentyp: CAS\n\n Die Hawker Hurricane Mk IV führte einen Universalflügel ein, der es ermöglichte, an jedem Flügel zwei 250- oder 500-Pfund-Bomben, zwei 40-mm-Vickers-S-Kanonen, Zusatztanks oder acht "60-Pfund"-RP-3-Raketen zu tragen. Schließlich wurden zwei .303-Browning-Maschinengewehre vom Typ M1919 hinzugefügt.\n\nVeraltete Mk I, II und IIc können zu Mk IV umgerüstet werden."
mosquito_cas_equipment:0	"Mosquito Close Air Support"
mosquito_cas_equipment_1:0	"De Havilland Mosquito FB Mk XVIII"
mosquito_cas_equipment_1_desc:0	 "Einheitentyp: Schwerer Luftnahunterstützungseinsatz\n\n Die vielseitige Flugzeugzelle der Mosquito wurde mit einer 6-Pfünder-Kanone der Klasse M ausgerüstet, bei der es sich um eine modifizierte QF-6-Pfünder-Panzerabwehrkanone handelte, die mit einem automatischen Ladesystem ausgestattet war und über 25 Schuss verfügte. Zum Schutz der Besatzung wurden 900 Pfund Panzerung an den Triebwerksverkleidungen, um die Nase herum, unter dem Cockpit und am Boden angebracht. Die 20-mm-Hispano-Kanonen wurden entfernt, doch die vier .303-Browning-Maschinengewehre blieben in der Nase erhalten, um das Zielen der Hauptwaffe zu unterstützen. Die vorgesehene Rolle der FB Mk XVIII war die U-Boot-Bekämpfung."
vickers_valentia_equipment:0	 "Valentia Light Bomber"
vickers_valentia_equipment_1:0	"Vickers Valentia"
vickers_valentia_equipment_1_desc:0	"Einheitstyp: Leichter Bomber\n\n Die Vickers Valentia war ein Doppeldecker-Bomber und Transportflugzeug, das auf den Konstruktionsarbeiten der Vickers Victoria aufbaute. Der in der Victoria verwendete Napier-Lion-Motor war veraltet, und es wurden zwei neue Triebwerke, die Bristol Pegasus, eingebaut. Zunächst behielt das Flugzeug die Bezeichnung Victoria bei, doch nach einer zweiten, umfangreicheren Modernisierung, die eine Verstärkung der Flugzeugzelle und der Tragflächen sowie ein verbessertes Fahrwerk umfasste, wurde das Flugzeug zur Vickers Valentia Mk I. Es gab keine Verteidigungsbewaffnung, und das Flugzeug konnte bis zu 2.200 Pfund Bomben transportieren."
avro_anson_equipment_1:0	"Avro Anson"
avro_anson_equipment_1_desc:0	"Einheitstyp: Marinebomber"\n\n Die Avro Anson war ein zweimotoriges Flugzeug mit vielfältigen Einsatzmöglichkeiten. Ihre Hauptaufgabe bestand in der Aufklärung und der Seeüberwachung in Zusammenarbeit mit größeren Flugbooten. Mit Ausbruch des Krieges erwies sich das Flugzeug für den Fronteinsatz als veraltet und wurde zu einem zuverlässigen Schulflugzeug. Es wurden viele Varianten gebaut, meist mit unterschiedlichen Triebwerken, wobei lokal hergestellte Antriebe zum Einsatz kamen. Um den Stahlmangel zu lindern, verfügten die in Kanada gebauten Avro Anson Mk. V über einen Rumpf aus Holz."
bristol_bolingbroke_equipment:0	"Bolingbroke-Marinebomber"
bristol_bolingbroke_equipment_1:0	"Bristol Bolingbroke Mk IV"
bristol_bolingbroke_equipment_1_desc:0	" Typ: Marinebomber\n\n Die Bristol Bolingbroke war ein Seeaufklärungs- und Schulungsflugzeug, das von Fairchild-Canada hergestellt wurde, welches eine Lizenz für den Bristol Blenheim Mk IV-Bomber besaß. Das Flugzeug war mit Enteisungsstutzen, einem Beiboot sowie mit amerikanischen und kanadischen Instrumenten und Ausrüstung. Zur Bewaffnung gehörten ein nach vorne feuerndes .303-Browning-Maschinengewehr und ein .303-Browning in einem Rückenturm. Die Nutzlast umfasste zwei 500-Pfund-Bomben oder vier 250-Pfund-Bomben."
bristol_buckingham_equipment:0	"Buckingham Light Bomber"
bristol_buckingham_equipment_1:0	" Bristol Buckingham"
bristol_buckingham_equipment_1_desc:0	 "Einheitentyp: Leichter Bomber\n\n Die Bristol Buckingham war ein zweimotoriger mittlerer Bomber, der auf bestehenden Konstruktionen wie der Beaufort und der Beaufighter basierte. Aufgrund sich ändernder Anforderungen und einer geforderten Bombenlast von 4.000 Pfund war jedoch eine vollständige Neukonstruktion erforderlich. Die Tragflächen der Buckingham waren größer und verfügten über die leistungsstärkeren 2.250 PS starken Bristol Centaurus VII-Motoren. Zur Verteidigungsbewaffnung gehörten Geschütze in der Nase, in den Rücken- und Bauchgeschütztürmen sowie ein motorisierter Heckgeschützturm. Der Krieg überholte die Konstruktion, und die Buckingham wurde in erster Linie für Transport- und Verbindungseinsätze genutzt."
bristol_brigand_equipment:0	"Brigand Heavy CAS"
bristol_brigand_equipment_1:0	"Bristol Brigand "
bristol_brigand_equipment_1_desc:0	"Einheitentyp: Schweres CAS\n\n Die Bristol Brigand war ein zweimotoriges Flugzeug, das für Sturzflüge, Bodenangriffe und den Einsatz gegen Schiffe konzipiert war und die Bristol Beaufighter ersetzen sollte. Das Flugzeug war mit einer leistungsstarken Bewaffnung ausgestattet, darunter vier 20-mm-Hispano-Mk-V-Maschinenkanonen, sechzehn RP-3-Raketen und bis zu 2.000 Pfund Bomben. Obwohl es zu spät kam, um noch im Krieg zum Einsatz zu kommen, wurde das Flugzeug während des Malaya-Konflikts und in Kenia eingesetzt. Die Hydraulik des Flugzeugs erwies sich jedoch als unzuverlässig, und das Flugzeug wurde aus dem Dienst genommen."
bristol_blenheim_equipment:0	"Blenheim I"
bristol_blenheim_equipment_1:0	"Bristol Blenheim Mk I"
bristol_blenheim_equipment_1_desc:0	"Einheitstyp: Leichter Bomber"\n\n Die Bristol Blenheim war ein leichter Bomber, der auf dem zivilen Passagierflugzeug Typ 142 basierte. Das Flugzeug verfügte über eine Ganzmetall-Monocoque-Konstruktion mit einziehbarem Fahrwerk, Landeklappen, Propellern mit variabler Steigung und einem motorisierten Geschützturm. Bis zur Einführung besserer Eindecker-Jäger war die Blenheim schneller als die meisten Jäger. Zur Verteidigungsbewaffnung gehörten ein .303-Vickers-Maschinengewehr im linken Flügel sowie ein .303-Vickers-K-Maschinengewehr in einem Rückenturm. Die maximale Bombenlast betrug 1.000 Pfund."
bristol_blenheim_equipment_2:0	 "Bristol Blenheim Mk IV"
bristol_blenheim_equipment_2_desc:0	"Einheitstyp: Leichter Bomber\n\n Die Bristol Blenheim Mk IV war eine Weiterentwicklung der Mk I und verfügte über neue Triebwerke, den Bristol Mercury XV mit 905 PS. Die Verteidigungsbewaffnung wurde um ein . 303-Vickers-Maschinengewehr im linken Flügel, zwei .303-Vickers-K-Maschinengewehre in einem motorisierten Rückenturm sowie zwei ferngesteuerte, nach hinten feuernde .303-Vickers-Maschinengewehre, die unter der Nase montiert waren. Die Bombenlast wurde auf 1.000 Pfund intern und zwei 500-Pfund-Bomben extern, jeweils eine an jedem Flügel, erhöht. \n\nVeraltete Mk I können zu Mk IV umgerüstet werden."
mosquito_fsb_equipment:0	"Mosquito Fast Bomber "
mosquito_fsb_equipment_1:0	"De Havilland Mosquito B Mk IV"
mosquito_fsb_equipment_1_desc:0	" Einheitentyp: Schneller Bomber\n\n Die De Havilland Mosquito war ein zweimotoriges Flugzeug mit Schulterflügeln, das größtenteils aus Holz gefertigt war und über keine Verteidigungsbewaffnung verfügte. Die Rolle des Flugzeugs entwickelte sich im Laufe der Zeit vom schnellen Bomber hin zu Aufgaben wie Nachtbombardierung in großer Höhe, Aufklärung, Vorausflieger, Nachtjäger und Seeaufklärung. Die B Mk IV verfügte über ein verkürztes Heck, was eine erhöhte Nutzlast von vier 500-Pfund-Bomben anstelle von vier 250-Pfund-Bomben ermöglichte."
mosquito_fsb_equipment_2:0	"De Havilland Mosquito B Mk IX"
mosquito_fsb_equipment_2_desc:0	"Einheitstyp: Schnellbomber\n\n Die Mosquito B Mk IX folgte auf die in Kanada gebaute B Mk VII, die mit Rolls-Royce-Merlin-Motoren ausgestattet war. Dank der neuen, leistungsstarken Motoren stieg die Bombenlast auf bis zu 4.000 Pfund, wobei acht 500-Pfund-Bomben zum Einsatz kamen. Gegen Ende des Krieges wurde die B Mk IX so umgerüstet, dass sie die 4.000-Pfund-Bombe "Blockbuster" oder "Cookie" tragen konnte. "
heyford_bomber_equipment:0	"Mittlerer Bomber"
heyford_bomber_equipment_1:0	"Handley Page Heyford"
heyford_bomber_equipment_1_desc:0	"Die Handley Page Heyford war ein Doppeldecker-Bomber, der von der RAF eingesetzt wurde."
handley_harrow_bomber_equipment:0	"HP.54 Harrow Mittelstreckenbomber"
handley_harrow_bomber_equipment_1:0	 "Handley Page HP.54 Harrow"
handley_harrow_bomber_equipment_1_desc:0	"Einheitstyp: Mittlerer Bomber"\n\n Die HP.54 Harrow war ein zweimotoriger , hochflügeliges Eindeckerflugzeug mit festem Fahrwerk, das als schwerer Bomber konzipiert war. Das Flugzeug sollte über motorisierte Bug- und Heckgeschütztürme sowie einen Rückengeschützturm verfügen, die jeweils mit einem einzigen .303-Vickers-Maschinengewehr der mittleren Klasse bestückt waren, wobei das Heck zwei davon erhalten sollte. Die Nutzlast sollte bis zu 3.000 Pfund betragen. Die Entwicklungen im Bereich der Bomber führten jedoch dazu, dass die Harrow auf eine Transportrolle beschränkt wurde und riskante Flüge von England nach Gibraltar absolvierte."
vickers_wellington_bomber_equipment:0	"Wellington I Medium Bomber"
vickers_wellington_bomber_equipment_1:0	"Vickers Wellington Mk I"
vickers_wellington_bomber_equipment_1_desc:0	"Einheitstyp: Mittlerer Bomber\n\n Die Vickers Wellington war ein zweimotoriger, -Reichweite mit einem einzigartigen geodätischen Rumpf, der einen Raumrahmen nutzt und Torsionsbelastungen ausgleicht. Die ersten Bestellungen für die Wellington wurden aufgegeben, bevor die Produktionsdetails ausgearbeitet waren. Als Antrieb dienten zwei 1.050 PS starke Bristol Pegasus-Motoren. Zur Verteidigungsbewaffnung gehörten ein Bug- und ein Heckgeschützturm mit jeweils zwei . 303 M1919 Browning-Maschinengewehre sowie zwei Seitenkanonen. Die Bombenlast betrug bis zu 4.500 Pfund bei einer Reichweite von 2.550 Meilen."
vickers_wellington_bomber_equipment_2:0	 "Vickers Wellington B Mk III"
vickers_wellington_bomber_equipment_2_desc:0	"Einheitentyp: Mittelstreckenbomber\n\n Die Wellington B Mk III erhielt wesentliche Verbesserungen durch zwei neue Bristol Hercules III-Motoren mit 1. 375 PS. Der Heckgeschützturm mit zwei Kanonen wurde durch einen Turm mit vier Kanonen ersetzt. Die Nutzlast blieb unverändert bei 4.500 Pfund Bomben.\n\nVeraltete Mk I können zu Mk III umgerüstet werden."
vickers_wellington_bomber_equipment_3:0	"Vickers Wellington B Mk X"
vickers_wellington_bomber_equipment_3_desc:0	"Einheitentyp: Mittelstreckenbomber\n\n Die Wellington B Mk X war mit fast 4.000 gebauten Exemplaren die am häufigsten produzierte Variante. Das Flugzeug wies viele ähnliche Merkmale wie die B Mk III auf, verfügte jedoch über eine größere Spannweite und einen für den Flug in großer Höhe optimierten Rumpf. Die Verteidigungsbewaffnung und die Bombenlast blieben unverändert.\n\nAufgrund erheblicher Änderungen können Mk I und Mk III NICHT in Mk X umgerüstet werden."
vickers_wellington_gr_bomber_equipment_1:0	"Vickers Wellington GR Mk VIII"
vickers_wellington_gr_bomber_equipment_1_desc:0	"Einheitstyp: Marinebomber\n\n Die Vickers Wellington war ein zweimotoriger, Langstrecken-Mittelbomber mit einem einzigartigen geodätischen Rumpf, der einen Raumrahmen nutzte und Torsionsbelastungen ausglich. Die GR Mk VIII war die Variante des Coastal Command, die für Aufklärungs-, U-Boot-Abwehr- und Schiffsabwehr-Einsätze eingesetzt wurde. Eine Reihe von GR Mk VIIIs wurde mit einem Leigh Light, einem 24-Zoll-Suchscheinwerfer, ausgestattet. Zur Verteidigungsbewaffnung gehörten ein Bug- und ein Heckgeschützturm mit je zwei .303-M1919-Browning-Maschinengewehren sowie zwei Seitenkanonen. Die Bombenlast betrug bis zu 4.500 Pfund bei einer Reichweite von 2.550 Meilen.\n\nVeraltete Mk I und Mk III können zu GR Mk VIII umgerüstet werden."
vickers_wellington_gr_bomber_equipment_2:0	"Vickers Wellington GR Mk XIII"
vickers_wellington_gr_bomber_equipment_2_desc:0	"Einheitstyp: Marinebomber\n\n Die GR Mk XIII war die maritime Variante der B Mk X und verfügte über ein ASV Mk II-Radar. Die defensiven Mittelrumpfgeschütze wurden entfernt, das Flugzeug behielt jedoch den Bug- und Heckgeschützturm bei. Die Nutzlast blieb bei 4.500 Pfund Bomben bei einer hervorragenden Reichweite.\n\nAufgrund erheblicher Änderungen können veraltete Mk I, Mk III und GR Mk VIII NICHT in GR Mk XIII umgerüstet werden."
handley_hampden_bomber_equipment:0	"Hampden-Schwerbomber"
handley_hampden_bomber_equipment_1:0	"Handley Page HP.52 Hampden"
handley_hampden_bomber_equipment_1_desc:0	"Einheitstyp: Schwerer Bomber\n\n Die HP.52 Hampden war ein zweimotoriger mittlerer Bomber, der gemäß der Spezifikation B.3/34 des Luftfahrtministeriums entwickelt wurde. Die Hampden wurde wegen der beengten Platzverhältnisse für die Besatzung oft als "fliegender Koffer" bezeichnet. Das Flugzeug war mit einem nach vorne feuernden .303-Browning-Maschinengewehr sowie drei bis fünf .303-Vickers-K-Maschinengewehren bewaffnet, von denen eines flexibel in der Nase montiert war und die anderen in Rücken- und Bauchpositionen. Obwohl sie nur eine Bombenlast von 4.000 Pfund hatte, trug die HP. 52 Hampden trug die Hauptlast der Bombardements über Europa zu Beginn des Krieges und war das erste Flugzeug, das Berlin bombardierte. "
avro_manchester_bomber_equipment:0	"Manchester Heavy Bomber"
avro_manchester_bomber_equipment_1:0	"Avro Manchester"
avro_manchester_bomber_equipment_1_desc:0	"Einheitstyp: Schwerer Bomber"\n\n Die Avro Manchester war ein zweimotoriger mittlerer Bomber, der entwickelt wurde, um die Whitley, Hampden und Wellington ersetzen sollte und der Vorläufer der viermotorigen Avro Lancaster war. Die Manchester wurde von zwei Rolls-Royce-Vulture-Motoren angetrieben, die unterentwickelt, untermotorisiert und unzuverlässig waren. Die Verteidigungsbewaffnung umfasste acht .303-Browning-Maschinengewehre, zwei in der Nase, zwei in einem Rückenturm und vier in einem Heckturm. Die Manchester konnte eine schwere Bombenlast von bis zu 10.350 Pfund transportieren."
hendon_equipment:0	 "Hendon Heavy Bomber"
hendon_equipment_1:0	"Fairey Hendon"
hendon_equipment_1_desc:0	"Einheitstyp: Schwerer Bomber\n\n Die Fairey Hendon war ein zweimotoriger, Eindecker-Schwerbomber, der Ende der 1920er Jahre entwickelt wurde. Der Rumpf bestand aus Stahlrohren mit Stoffbespannung für den Piloten und den Funker/Navigator, während die Positionen für die Bordschützen in der offenen Nase, im Rückenbereich und im Heck untergebracht waren. Die Hendon wurde von zwei Rolls-Royce-Kestrel-VI-Motoren angetrieben und konnte bis zu 1.660 Pfund Bomben tragen. Vor Ausbruch des Krieges war die Hendon aus dem Dienst genommen und für die Bodenausbildung eingesetzt worden."
aw_whitley_equipment:0	"Whitley-Schwerbomber"
aw_whitley_equipment_1:0	"Armstrong Whitworth A.W.38 Whitley Mk V"
aw_whitley_equipment_1_desc:0	"Einheitstyp: Schwerer Bomber\n\n Die Armstrong Whitworth A.W. 38 Whitley war ein zweimotoriger mittlerer Bomber, der gemäß der Spezifikation B.3/34 des Luftfahrtministeriums entwickelt wurde und zu den ersten mittleren Bombern gehörte, die bei der Royal Air Force in den operativen Dienst gestellt wurden. Die Whitley Mk V war das Hauptserienmodell während des Krieges und wurde von zwei Rolls-Royce-Merlin-X-Motoren angetrieben; ihre Bewaffnung bestand aus einem einzelnen .303-Vickers-K-Maschinengewehr im Bug sowie vier . 303-Browning-Maschinengewehre. Der interne Bombenschacht konnte bis zu 7.000 Pfund Bomben aufnehmen, in der Regel in einer Anordnung von zwölf 250-Pfund- und zwei 500-Pfund-Bomben."
aw_whitley_gr_equipment_1:0	"Armstrong Whitworth Whitley A.W. Typ 217"
aw_whitley_gr_equipment_1_desc:0	" Einheitstyp: Schwerer Marinebomber\n\n Die Armstrong Whitworth A.W. 38 Whitley war ein zweimotoriger mittlerer Bomber, der gemäß der Spezifikation B.3/34 des Luftfahrtministeriums entwickelt wurde und zu den ersten mittleren Bombern gehörte, die bei der Royal Air Force in den operativen Dienst gestellt wurden. Die A.W. Typ 217 wurde für den Einsatz beim Coastal Command entwickelt. Das Flugzeug verfügte über ein sechstes Besatzungsmitglied, und verfügte über zusätzliche Treibstofftanks im Bombenschacht, wodurch die Reichweite von 1.250 auf 2.300 Meilen erhöht wurde. Der Typ 217 war mit einem ASV-Radar ausgestattet.\n\nAusgemusterte Armstrong Whitworth A.W.38 Whitley Mk V können zu A.W. Typ 217 umgerüstet werden. "
handley_halifax_equipment:0	"Halifax-Schwerbomber"
handley_halifax_equipment_1:0	" Handley Page Halifax"
handley_halifax_equipment_1_desc:0	"Einheitstyp: Schwerer Bomber"\n\n Die Handley Page Halifax war ein viermotoriger schwerer Bomber, der ursprünglich mit Rolls-Royce-Vulture-Motoren angetrieben werden sollte, jedoch vom Luftfahrtministerium auf Merlin-Motoren umgerüstet wurde. Zur Verteidigungsbewaffnung gehörten acht 0,303-Browning-Maschinengewehre, vier in einem Heckgeschützturm, vier in einem Rückengeschützturm und ein 0,303-Vickers-K-Maschinengewehr in der Nase. Das Flugzeug hatte eine Bombenlast von bis zu 13.000 Pfund, galt jedoch als unterlegen, da es nicht für den Transport der 4.000-Pfund-Bombe "Cookie" ausgerüstet werden konnte. Nach dem Krieg wurden 41 zivile Halifax-Frachtflugzeuge während der Berliner Luftbrücke eingesetzt."
handley_halifax_gr_equipment_1:0	"Handley Page Halifax GR"
handley_halifax_gr_equipment_1_desc:0	"Einheitstyp: Schwerer Marinebomber\n\n Die Handley Page Halifax war ein viermotoriger schwerer Bomber, der ursprünglich mit Rolls-Royce-Vulture-Motoren angetrieben werden sollte, jedoch vom Luftfahrtministerium auf Merlin-Motoren umgerüstet wurde. Zur Verteidigungsbewaffnung gehörten acht 0,303-Browning-Maschinengewehre, vier in einem Heckgeschützturm, vier in einem Rückengeschützturm und ein 0,303-Vickers-K-Maschinengewehr in der Nase. Die GR. V und GR.VI waren für das Coastal Command entwickelte Varianten und waren mit ASV-Radar ausgestattet.\n\nVeraltete Handley Page Halifax können zu Halifax GR umgerüstet werden."
short_stirling_equipment:0	"Stirling Schwerer Bomber"
short_stirling_equipment_1:0	"Short Stirling"
short_stirling_equipment_1_desc:0	"Einheitstyp: Schwerer Bomber\n\n Die Short Stirling war ein viermotoriger schwerer Bomber, der von den Short Brothers entworfen wurde. Piloten lobten das Flugzeug für seine Fähigkeit, feindliche Nachtjäger im Kurvenflug zu übertreffen, sowie für seine günstigen Flugeigenschaften, obwohl es eine geringe Dienstgipfelhöhe aufwies. Die Stirling war mit acht .303-Browning-Maschinengewehren bewaffnet, von denen sich zwei in einem motorisierten Bugturm, zwei in einem Rückenturm und vier in einem Heckturm befanden. Das Flugzeug konnte eine Nutzlast von 14.000 Pfund transportieren. Nach ihrer Ausmusterung aus dem strategischen Bombenabwurf wurde das Flugzeug für Minenlegeeinsätze der Marine und Transportaufgaben eingesetzt, bevor es durch die Avro York, eine Variante der Avro Lancaster, ersetzt wurde."
avro_lancaster_equipment:0	"Lancaster-Schwerbomber"
avro_lancaster_equipment_1:0	"Avro Lancaster"
avro_lancaster_equipment_1_desc:0	"Einheitstyp: Schwerer Bomber"\n\n Die Avro Lancaster war eine überarbeitete Version der Manchester, die zu einem viermotorigen schweren Bomber mit leistungsstärkeren und zuverlässigeren Rolls-Royce-Merlin-Motoren weiterentwickelt wurde. Im Gegensatz zu anderen Bombern verfügte die Lancaster über einen langen und ungehinderten Bombenschacht, der es ihr ermöglichte, einige der größten entwickelten Bomben zu transportieren, wie beispielsweise die 4.000-Pfund-Bombe "Cookie". Zur Verteidigungsbewaffnung gehörten zwei .303-Browning-Maschinengewehre in einem Bug-Turm, zwei in einem oberen Turm und vier Maschinengewehre in einem hinteren Turm. Die Lancaster hatte eine Bombenlast von bis zu 14.000 Pfund an Bomben. Nach Kriegsende wurde die Lancaster als provisorisches Transportflugzeug eingesetzt, um Tausende von Kriegsgefangenen in ihre Heimat zu befördern."
avro_lancaster_gr_equipment_1:0	"Avro Lancaster GR.3/MR.3"
avro_lancaster_gr_equipment_1_desc:0	"Einheitstyp: Schwerer Marinebomber\n\n Die Avro Lancaster war eine überarbeitete Version der Manchester, die zu einem viermotorigen schweren Bomber mit leistungsstärkeren und zuverlässigeren Rolls-Royce-Merlin-Motoren weiterentwickelt wurde. Die GR.3/MR.3 war eine Variante für den Einsatz beim Coastal Command. Zur Verteidigungsbewaffnung gehörten zwei . 303-Browning-Maschinengewehre in einem Bug-Turm, zwei in einem oberen Turm und vier Maschinengewehre in einem Heck-Turm. Die Lancaster hatte eine Bombenlast von bis zu 14.000 Pfund.\n\nVeraltete Avro Lancasters können zu Avro Lancaster GR.3/MR.3 umgerüstet werden."
avro_lincoln_equipment:0	"Lincoln-Schwerbomber"
avro_lincoln_equipment_1:0	"Avro Lincoln"
avro_lincoln_equipment_1_desc:0	"Einheitstyp: Schwerer Bomber"\n\n Die Avro Lincoln war ein viermotoriger schwerer Bomber, der ursprünglich eine Variante der Lancaster-Bomber darstellte. Zu den Verbesserungen zählten stärkere Flügel mit größerer Spannweite sowie zweistufige Rolls-Royce-Merlin-85-Motoren. Der Rumpf der Lincoln wurde vergrößert, um zusätzlichen Treibstoff und eine erhöhte Bombenlast aufzunehmen. Die Verteidigungsbewaffnung umfasste zwei .50-Kaliber-M2-Browning-Maschinengewehre in einem Bugturm, zwei .50-Kaliber-M2-Maschinengewehre in einem Heck-Turm und zwei 20-mm-Hispano-Mk-V-Maschinenkanonen in einem Rückenturm. Die Nutzlast betrug in der Regel 14.000 Pfund, konnte jedoch eine 22.000-Pfund-"Grand Slam"-Erdbebenbombe tragen, wenn die Waffen entfernt wurden."
avro_lancaster_special_equipment:0	"Lancaster (Special) Schwerer Bomber"
avro_lancaster_equipment_2:0	"Avro Lancaster (Special)"
avro_lancaster_equipment_2_desc:0	"Einheitentyp: Schwerer Bomber\n\n Die Avro Lancaster B. I Special wurde für den Einsatz der 12.000-Pfund-"Tallboy"-Blockbuster-Bomben und der 22.000-Pfund-"Grand Slam"-Erdbebenbomben umgerüstet. Das Flugzeug erhielt leistungsstärkere Triebwerke mit verbesserten Propellern mit Schaufelblättern, und durch den Wegfall der Geschütztürme wurde die Aerodynamik verbessert. Die B.III Special wurde mit einem Hydraulikmotor ausgestattet, um die "Upkeep"- Sprungbomben, die für den Dammbruch vorgesehen waren.\n\nVeraltete Lancasters können zu Lancaster (Special)s umgerüstet werden."
bristol_beaufort_equipment:0	"Beaufort-Leichtbomber"
bristol_beaufort_equipment_1:0	"Bristol Beaufort"
bristol_beaufort_equipment_1_desc:0	"Einheitentyp: Leichter Bomber"\n\n Die Bristol Beaufort war ein zweimotoriger Torpedobomber und wurde auf der Grundlage der Erfahrungen entwickelt, die bei der Konstruktion des leichten Bombers Bristol Blenheim gesammelt wurden. Obwohl als Torpedobomber konzipiert, war das Flugzeug vielseitig einsetzbar und wurde als konventioneller Mittelstreckenbomber genutzt, wobei Varianten zu schweren Jagdflugzeugen, Nachtjägern und Bodenangriffsflugzeugen weiterentwickelt wurden. Zur Verteidigungsbewaffnung gehörten drei 0,303-Vickers-K-Maschinengewehre und ein nach hinten feuerndes 0,303-M1919-Browning-Maschinengewehr. Als Munition konnte entweder ein 18-Zoll-Mk-XII-Torpedo oder eine 2.000-Pfund-Bombe bzw. ein Torpedo unter dem Rumpf sowie 1.000 Pfund Bomben im Bombenschacht und 500 Pfund Bomben oder Minen an jedem Flügel mitgeführt werden."
vickers_warwick_equipment:0	" Warwick-Marinebomber"
vickers_warwick_equipment_1:0	"Vickers Warwick"
vickers_warwick_equipment_1_desc:0	"Einheitstyp: Marinebomber\n\n Die Vickers Warwick war ein vielseitiges, zweimotoriges Flugzeug, das ursprünglich als schwerer Bomber konzipiert und wie andere schwere Bomber. Die Warwick sollte neben der Wellington zum Einsatz kommen, doch aufgrund fehlender leistungsstarker Triebwerke verzögerte sich dies. Es wurden zahlreiche Prototypen gebaut, an denen verschiedene Triebwerke getestet wurden, bis man sich für zwei 2.500-PS-Bristol-Centaurus-Triebwerke entschied. Die Warwick GR Mk II war die erste maritime Version mit Torpedos und Bomben. Die GR Mk V erhielt verbesserte Triebwerke, verfügte über sieben Maschinengewehre und konnte bis zu 6.000 Pfund an Bomben, Minen oder Wasserbomben tragen. Ein Leigh-Licht, ein 24-Zoll-Suchscheinwerfer, wurde rally."
supermarine_southampton_equipment_1:0	"Supermarine Southampton"
supermarine_southampton_equipment_1_desc:0	"Flugboote sind große Amphibienflugzeuge, die zur Aufklärung und zum Angriff auf feindliche Flotten eingesetzt werden. Obwohl sie oft eine größere Nutzlast und Bewaffnung mitführen als Marinebomber, sind Flugboote in der Regel anfällig für Abfangmanöver."
supermarine_scapa_equipment_1:0	"Supermarine Scapa"
supermarine_scapa_equipment_1_desc:0	 "Flugboote sind große Amphibienflugzeuge, die zur Aufklärung und zum Angriff auf feindliche Flotten eingesetzt werden. Obwohl sie oft eine größere Nutzlast und Bewaffnung mitführen als Marinebomber, sind Flugboote in der Regel anfällig für Abfangmanöver."
saro_london_equipment:0	"London Flying Boat"
saro_london_equipment_1:0	"Saro London"
saro_london_equipment_1_desc:0	"Flugboote sind große Amphibienflugzeuge, die zur Aufklärung und zum Angriff auf feindliche Flotten eingesetzt werden. Obwohl sie oft eine größere Nutzlast und Bewaffnung mitführen als Marinebomber, sind Flugboote in der Regel anfällig für Abfangmanöver."
short_sunderland_equipment:0	"Sunderland-Flugboot"
short_sunderland_equipment_1:0	"Short Sunderland"
short_sunderland_equipment_1_desc:0	"Einheitstyp: Flugboot\n\n Die Short Sunderland war ein viermotoriges Flugboot, das von den Brüdern Short entwickelt wurde, um die Anforderungen der Spezifikation R.2/33 des Luftfahrtministeriums zu erfüllen, die ein Flugboot für Langstreckenpatrouillen und Aufklärung vorsah. Das Flugzeug verfügte über eine schwere Verteidigungsbewaffnung aus .303-Browning-Maschinengewehren, vier in der Nase, vier im Heck, zwei in einem vorderen Turm und zwei in einem Rückenturm. Die Nutzlast umfasste bis zu 4.950 Pfund an Bomben, Minen und Wasserbomben. Die Sunderland half bei der Versorgung Berlins während der Berliner Luftbrücke."
short_sunderland_equipment_2:0	"Short Sunderland Mk III"
short_sunderland_equipment_2_desc:0	"Typ: Flugboot\n\n Die Sunderland Mk III verfügte über eine überarbeitete Rumpfkonfiguration, die die Seetüchtigkeit des Flugzeugs verbesserte. Ein neues ASV Mk III-Radar wurde installiert, das verschiedene Frequenzbänder nutzte, um einer Erkennung durch die auf feindlichen U-Booten eingesetzten passiven Metox-Empfänger zu entgehen. Die Munitionskapazität für die Maschinengewehre wurde von 500 auf 1.000 Schuss erhöht. Die Sunderland wurde mit kleinen Luken ausgestattet, die es der Besatzung ermöglichten, 10- und 25-Pfund-Antipersonenbomben abzuwerfen, um feindliche U-Boot-Besatzungen zu bedrängen, die versuchten, Flugabwehrgeschütze zu bedienen.\n\nVeraltete Sunderlands können zu Mk III umgerüstet werden."
short_seaford_equipment:0	"Seaford-Flugboot"
short_seaford_equipment_1:0	"Short Seaford"
short_seaford_equipment_1_desc:0	"Einheitstyp: Flugboot\n\n Die Short Seaford war ein Langstrecken-Seeaufklärungsbomber und Flugboot, das ursprünglich als verbesserte Version der Short Sunderland Mk IV konzipiert war. Es wurden wesentliche bauliche Änderungen vorgenommen: Der Rumpf wurde verlängert, die Tragflächen wurden verlängert und verdickt. Zur Bewaffnung gehörten zwei nach vorne feuernde .303-Browning-Maschinengewehre in der Nase, zwei .50-M2-Browning-Maschinengewehre in einem Nasenturm, zwei 20-mm-Hispano-Kanonen in einem Rückenturm, zwei .50-M2-Maschinengewehre in einem Heckturm sowie je ein .50-M2-Maschinengewehr auf jeder Seite des Flugzeugrumpfs. Die Nutzlast des Flugzeugs blieb dieselbe wie bei der Sunderland und betrug 4.950 Pfund an Bomben, Minen und Wasserbomben."
hawker_osprey_fighter_equipment_1:0	"Hawker Osprey"
hawker_osprey_fighter_equipment_1_desc:0	"Einheitstyp: Trägerjäger"\n\n Die Hawker Osprey war die trägergestützte Version des leichten Bombers Hawker Hart. Die Osprey war mit einem nach vorne feuernden . 303-Vickers-Maschinengewehr und einem .303-Vickers-Maschinengewehr mittlerer Kaliber auf einem Scarff-Ring im hinteren Cockpit. Die Nutzlast betrug bis zu 520 Pfund Bomben unter den Tragflächen. Während des Krieges wurde die Osprey hauptsächlich für die U-Boot-Abwehr und die Bekämpfung der Piraterie eingesetzt."
hawker_osprey_fighter_equipment_2:0	 "Hawker Osprey IV"
hawker_osprey_fighter_equipment_2_desc:0	"Einheitstyp: Trägerjäger\n\n Die Hawker Osprey war die trägergestützte Version des leichten Bombers Hawker Hart. Die Osprey war mit einem nach vorne feuernden .303-Vickers-Maschinengewehr und einem .303-Vickers-Maschinengewehr mittlerer Maschinengewehr auf einem Scarff-Ring im hinteren Cockpit. Die Nutzlast betrug bis zu 520 Pfund Bomben unter den Tragflächen. Während des Krieges wurde die Osprey hauptsächlich zur U-Boot-Bekämpfung und zur Piratenbekämpfung eingesetzt."
nimrod_fighter_equipment_1:0	"Hawker Nimrod"
nimrod_fighter_equipment_1_desc:0	"Jagdflugzeuge sind dafür ausgelegt, feindliche Flugzeuge abzufangen und zu zerstören. Trägerjäger sind Kampfflugzeuge, die für den Einsatz von Flugzeugträgern modifiziert oder konstruiert wurden."
sea_gladiator_equipment_1:0	"Gloster Sea Gladiator"
sea_gladiator_equipment_1_desc:0	" Einheitentyp: Trägerjäger\n\n Die Gloster Sea Gladiator war ein einsitziger Doppeldecker-Jäger und die Marineversion der Gladiator. Das Flugzeug war mit zwei 0,303-Vickers-Maschinengewehren und zwei 0,303-Lewis-Maschinengewehren bewaffnet. Das Flugzeug war mit Fanghaken und Vorrichtungen zur Verstauung von Beibooten ausgestattet. Die Sea Gladiator und ihre Landvariante kamen während des Krieges auf allen Kriegsschauplätzen und von beiden Seiten zum Einsatz. Das Flugzeug wurde vom Commonwealth, von China, Finnland, Schweden, der Sowjetunion, Südafrika und der irakischen Luftwaffe eingesetzt.\n\nAusgemusterte Gloster Gladiators können zu Sea Gladiators umgebaut werden."
blackburn_roc_equipment_1:0	"Blackburn B-25 Roc"
blackburn_roc_equipment_1_desc:0	"Einheitstyp: Trägerjäger\n\n Die Blackburn B-25 Roc, benannt nach dem Fabelvogel aus "Tausendundeiner Nacht", wurde parallel zur Blackburn B-24 Skua entwickelt. Die Roc war als trägergestützter, mit einem Boulton-Paul-Turm bewaffneter Jäger konzipiert, der vier .303-Browning-Maschinengewehre trug. Das Flugzeug behielt die an den Tragflächen angebrachten Bremsklappen sowie Bombenhalterungen unter jedem Flügel für zwei 250-Pfund-Bomben bei. Als Flugzeug für den Einsatz auf Flugzeugträgern musste es auch als Wasserflugzeug fungieren; die Auswirkungen der Schwimmer beeinträchtigten jedoch die Geschwindigkeit, weshalb das Flugzeugprojekt aufgegeben wurde."
fairey_fulmar_equipment_1:0	"Fairey Fulmar Mk I"
fairey_fulmar_equipment_1_desc:0	"Einheitstyp: Mehrzweck-Trägerjäger\n\n Die Fairey Fulmar war ein trägergestütztes Kampfflugzeug, das auf der früheren P.4/34 von Fairey basierte und die Fairey Battle ersetzen sollte. Die Fulmar galt als unspektakulär, war jedoch für ihre Zuverlässigkeit, Robustheit und große Reichweite bekannt. Die Mk I wurde von einem Rolls-Royce Merlin VIII mit 1.035 PS angetrieben und verfügte über acht .303-Browning-Maschinengewehre."
fairey_fulmar_equipment_2:0	"Fairey Fulmar Mk II"
fairey_fulmar_equipment_2_desc:0	"Einheitentyp: Mehrzweck-Trägerjäger\n\n Die Fairey Fulmar Mk II verfügte über einen neuen Merlin XXX mit 1.300 PS, einen neuen Propeller und tropentaugliche Ausrüstung für den Einsatz in Südostasien. Die Mk II behielt die gleiche Bewaffnung mit acht . 303-Browning-Maschinengewehren, wobei spätere Produktionsvarianten vier .50-M2-Browning-Maschinengewehre besaßen. Eine Handvoll Mk II wurden mit dem Luftabfangradar AI Mk. IV ausgerüstet und als Nachtjäger eingesetzt.\n\nVeraltete Mk I können zu Mk II umgerüstet werden."
hawker_sea_hurricane_equipment_1:0	"Hawker Sea Hurricane Ib"
hawker_sea_hurricane_equipment_1_desc:0	"Einheitstyp: Trägerjäger\n\n Die Hawker Sea Hurricane war eine modifizierte Hurricane Mk I und verfügte über Katapultrollen sowie einen Fanghaken. Der Propeller wurde gegen einen leichteren von de Havilland ausgetauscht, da die ursprünglichen Rotol-Propeller bei Landungen mit Fanghaken dazu führen konnten, dass die Nase absank und das Trägerdeck beschädigte. \n\nDie veraltete Hawker Hurricane Mk I kann zur Sea Hurricane Mk Ib umgerüstet werden."
supermarine_seafire_equipment_1:0	"Supermarine Seafire Mk IIc"
supermarine_seafire_equipment_1_desc:0	" Einheitstyp: Trägerjäger\n\n Die Supermarine Seafire, kurz für Sea Spitfire, war eine trägertaugliche Variante der Spitfire, obwohl anfangs Bedenken hinsichtlich der geringen Festigkeit des . Die Seafire Mk II war mit einem Merlin-32-Motor für den Einsatz in niedrigen Höhen ausgestattet, der speziell für den Marineeinsatz hergestellt wurde. Die Seafire Mk IIc war mit zwei 20-mm-Hispano-Kanonen und vier .303-Browning-Maschinengewehren bewaffnet.\n\nAufgrund erheblicher Änderungen können die Spitfire Mk I und II NICHT in Seafire Mk II umgerüstet werden."
supermarine_seafire_iii_equipment_1:0	"Supermarine Seafire Mk III"
supermarine_seafire_iii_equipment_1_desc:0	"Einheitentyp: Trägerjäger\n\n Die Seafire Mk III war die erste echte Trägeranpassung und verfügte über manuell einklappbare Tragflächen, was die Lager- und Deckfläche erheblich verbesserte. Als neues Triebwerk , der Merlin 55M, wurde eingebaut, der eine hervorragende Leistung in niedrigen Höhen und auf See bot. Die Bewaffnung blieb mit zwei 20-mm-Hispano-Kanonen und vier .303-Browning-Maschinengewehren unverändert, allerdings wurden Aufhängepunkte hinzugefügt, um zwei 250-Pfund-Bomben – eine unter jedem Flügel – oder eine 500-Pfund-Bombe unter dem Rumpf zu tragen. \n\nVeraltete Seafire Mk II können zu Mk III umgerüstet werden."
supermarine_seafire_xv_equipment_1:0	"Supermarine Seafire Mk XV"
supermarine_seafire_xv_equipment_1_desc:0	 "Einheitstyp: Trägerjäger\n\n Die Supermarine Seafire Mk XV erhielt einen neuen Motor, den Griffon VI mit einstufigem Kompressor. Die Mk-III-Zelle wurde verwendet, jedoch verstärkt; zusätzliche Treibstofftanks wurden in den Tragflächen eingebaut, ein einziehbares Spornrad und schließlich eine neue tropfenförmige Cockpit-Haube wurden installiert. Das Fahrwerk wurde nicht verstärkt, was zu einer Reihe von Sprüngen beim Start führte. In Verbindung mit der Neigung des Flugzeugs, nach links auszubrechen – im Gegensatz zu älteren Varianten, die nach rechts ausbrachen –, kam es zu einigen Kollisionen mit der Insel eines Flugzeugträgers. \n\nAufgrund erheblicher Änderungen können Mk IIIs NICHT in Mk XVs umgerüstet werden."
fairey_firefly_equipment_1:0	"Fairey Firefly"
fairey_firefly_equipment_1_desc:0	 "Einheitentyp: Mehrzweckjäger für Flugzeugträger\n\n Die Fairey Firefly war ein trägergestütztes Kampfflugzeug und Nachfolger der Fairey Fulmar. Die Firefly wurde von einem Rolls-Royce-Griffon-74-Triebwerk angetrieben und war mit vier 20-mm-Hispano-Mk.-V-Kanonen sowie sechzehn RP-3-Raketen bewaffnet und konnte zwei 1.000-Pfund-Bomben tragen. Aufgrund einer langwierigen Entwicklung kam die Firefly während des Krieges nicht zum Kampfeinsatz. Mit dem Aufkommen von Düsenflugzeugen wurde die Firefly während des Koreakriegs für andere Aufgaben wie Bodenangriffe und U-Boot-Abwehr eingesetzt."
hawker_seafury_equipment_1:0	"Hawker Sea Fury FB.11"
hawker_seafury_equipment_1_desc:0	"Einheitentyp: Mehrzweck-Trägerjäger\n\n Die Hawker Sea Fury war eine Marinevariante der Hawker Fury und diente als Jagdbomber. Angetrieben von einem Bristol-Centaurus-Motor mit 2.480 PS erreichte das Flugzeug eine Höchstgeschwindigkeit von 460 mph, verfügte über eine hervorragende Steigleistung und eine gute Dienstgipfelhöhe. Zur Bewaffnung gehörten vier 20-mm-Hispano-Mk-V-Maschinenkanonen, zwölf 3-Zoll-Raketen und eine Bombenlast von 2.000 Pfund. Die Sea Fury wurde von der Royal Navy, der Royal Australian Navy, der Royal Canadian Navy, der Royal Netherlands Navy und Pakistan eingesetzt."
tech_sea_fire45_equipment_1:0	"Supermarine Seafire 45"
sea_fire45_equipment_1_short:0	"Seafire Mk 45 Trägerjäger"
fairey_iiif_equipment_1:0	"Fairey IIIF "
fairey_iiif_equipment_1_desc:0	"CAS sind Flugzeuge zur Luftnahunterstützung, die dazu ausgelegt sind, verbündete Streitkräfte durch Angriffe auf feindliche Truppen oder Schiffe zu unterstützen. Träger-CAS wurden modifiziert oder speziell für den Einsatz von Flugzeugträgern aus entwickelt."
fairey_seal_equipment_1:0	"Fairey Seal"
fairey_seal_equipment_1_desc:0	"CAS sind Flugzeuge zur Luftnahunterstützung, die dazu bestimmt sind, verbündete Streitkräfte durch Angriffe auf feindliche Truppen oder Schiffe zu unterstützen. Träger-CAS wurden modifiziert oder speziell für den Einsatz von Flugzeugträgern aus entwickelt. "
blackburn_skua_equipment_1:0	"Blackburn B-24 Skua"
blackburn_skua_equipment_1_desc:0	" Einheitstyp: Träger-CAS\n\n Die Blackburn B-24 Skua wurde parallel zur Blackburn B-25 Roc entwickelt. Die Konstruktion war ein Tiefdecker in Ganzmetallbauweise mit einem geschlossenen Cockpit. Das Flugzeug verfügte über an den Tragflächen angebrachte Bremsklappen sowie Bombenhalterungen unter jedem Flügel für zwei 250-Pfund-Bomben. Die Skua hatte Klappflügel, eine große Treibstoffkapazität und eine schwere Bewaffnung; ihren Triebwerken fehlte es jedoch an Leistung, was dazu beitrug, dass sie gegenüber den damaligen feindlichen Jagdflugzeugen veraltet war. Der Skua wird der erste von einem Sturzkampfbomber versenkte Schiff, die KMS Königsberg, zugeschrieben."
fairey_barracuda_equipment_1:0	"Fairey Barracuda Mk I"
fairey_barracuda_equipment_1_desc:0	"Einheitstyp: Träger-CAS\n\n Die Fairey Barracuda war ein trägergestützter Torpedo- und Sturzkampfbomber und das erste Flugzeug der Fleet Air Arm der Royal Navy, das vollständig aus Metall gefertigt war. Der ursprüngliche Motor, ein Rolls-Royce Exe, wurde gestrichen, sodass ein weniger leistungsstarker Merlin-30-Motor zum Einsatz kam, was dazu führte, dass die Barracuda untermotorisiert war. Zur Verteidigungsbewaffnung gehörten zwei .303-Vickers-K-Maschinengewehre im hinteren Cockpit, und das Flugzeug konnte einen 1.620-Pfund-Lufttorpedo oder vier 450-Pfund-Wasserbomben oder sechs 250-Pfund-Bomben tragen."
fairey_barracuda_equipment_2:0	"Fairey Barracuda Mk II"
fairey_barracuda_equipment_2_desc:0	"Einheitentyp: Träger-CAS\n\n Die Fairey Barracuda Mk II erhielt einen neuen Merlin-32-Motor, wodurch die Probleme mit der Untermotorisierung behoben wurden. Die Mk II war die am häufigsten produzierte Variante und war mit einem Radar vom Typ "Air-to-Surface -Vessel (ASV) Mk II-Radar. Bewaffnung und Nutzlast blieben unverändert. Die Barracuda kam in allen Einsatzgebieten zum Einsatz, hatte jedoch in großen Höhen und in bergigen Gebieten Schwierigkeiten. Nach Kriegsende wurde das Flugzeug auf eine Ausbildungsrolle beschränkt.\n\nVeraltete Mk I können zu Mk II umgerüstet werden."
blackburn_firebrand_equipment_1:0	"Blackburn Firebrand T.F. IV"
blackburn_firebrand_equipment_1_desc:0	"Einheitentyp: Träger-CAS\n\n Die Blackburn Firebrand war ein Kampfflugzeug, sollte ursprünglich jedoch ein reiner Jäger sein. Die Produktions- und Entwicklungsarbeiten an der Firebrand verliefen schleppend und waren während der Prototypentests von zahlreichen Rückschlägen geprägt, was ihre Indienststellung bis nach Kriegsende verzögerte. Die Firebrand T.F. IV war die erste Hauptserienvariante mit einem 2.250 PS starken Centaurus-IX-Triebwerk. Zur Bewaffnung gehörten vier 20-mm-Hispano-Kanonen, sechzehn RP-3-Raketen sowie ein 1.850-Pfund-Torpedo oder zwei 2.000-Pfund-Bomben."
blackburn_baffin_equipment_1:0	"Blackburn Baffin"
blackburn_baffin_equipment_1_desc:0	"Marinebomber sind darauf ausgelegt, feindliche Schiffe zu versenken. Träger-Marinebomber wurden so umgerüstet oder konstruiert, dass sie von Flugzeugträgern aus operieren können."
blackburn_shark_equipment_1:0	"Blackburn Shark"
blackburn_shark_equipment_1_desc:0	"Marinebomber sind dafür ausgelegt, feindliche Schiffe zu versenken. Träger-Marinebomber wurden modifiziert oder speziell für den Einsatz von Flugzeugträgern aus entwickelt."
fairey_swordfish_equipment_1:0	"Fairey Swordfish"
fairey_swordfish_equipment_1_desc:0	"Einheitstyp: Trägerbomber\n\n Die Fairey Swordfish war ein Doppeldecker-Torpedobomber, der zu Beginn des Krieges bereits als veraltet galt. Obwohl sie den zeitgenössischen Flugzeugen unterlegen war, hatte die Swordfish mehr feindliche Schiffe versenkt als jedes andere Flugzeug. Das Flugzeug erreichte mit Nutzlast eine Geschwindigkeit von kaum 143 mph. Zur Verteidigungsbewaffnung gehörten ein nach vorne feuerndes .303-Vickers-Maschinengewehr und ein .303-Lewis- oder Vickers-K-Maschinengewehr im hinteren Cockpit. Die Nutzlast umfasste einen 1.670-Pfund-Torpedo oder eine 1.500-Pfund-Mine unter dem Rumpf oder 1.500 Pfund Bomben unter dem Rumpf und den Tragflächen."
fairey_albacore_equipment_1:0	" Fairey Albacore"
fairey_albacore_equipment_1_desc:0	"Einheitentyp: Trägerbomber\n\n Die Fairey Albacore war ein Doppeldecker-Torpedobomber, der als Ersatz für die Swordfish konzipiert wurde. Das Flugzeug verfügte über eine höhere Geschwindigkeit, war aerodynamisch ausgereifter und verfügte über ein geschlossenes und beheiztes Cockpit. Zur Verteidigungsbewaffnung gehörten ein nach vorne feuerndes .303-Vickers-Maschinengewehr im rechten Flügel sowie ein oder zwei .303-Vickers-K-Maschinengewehre im hinteren Cockpit. Die Albacore konnte einen 1.670-Pfund-Torpedo oder bis zu 2.000 Pfund Bomben tragen. Obwohl sie neben der Swordfish im Einsatz stand und diese ersetzen sollte, wurde die Albacore als erste aus dem Militärdienst genommen."
supermarine_dumbo_equipment_1:0	"Supermarine Typ 322"
supermarine_dumbo_equipment_1_desc:0	"Einheitstyp: Trägerbomber\n\n Der Supermarine Typ 322 war ein einmotoriger Eindecker-Torpedobomber, der als Ersatz für die Albacore konzipiert war, der noch nicht geflogen war. Der Typ 322 war größtenteils aus Holz gefertigt, ähnlich wie der Transportflugzeugtyp A.W.41 Albemarle, und sollte ursprünglich von einem Rolls-Royce-Exe-Motor angetrieben werden, bevor das Projekt gestrichen und durch einen Merlin-Motor ersetzt wurde. Die Produktion verzögerte sich aufgrund der hohen Priorität für Spitfires. Die Verteidigungsbewaffnung hätte eine .303 Browning im Flügel und eine .303 Vickers K im hinteren Cockpit umfasst. Die Nutzlast des Typs 322 bestand aus einem 18-Zoll-Torpedo mit 1.500 Pfund oder sechs 250-Pfund-Bomben. Der Typ 322 wurde als Versuchsflugzeug eingesetzt, während die Fairey Barracuda in Dienst gestellt wurde. "
fairey_spearfish_equipment_1:0	"Fairey Spearfish"
fairey_spearfish_equipment_1_desc:0	"Einheitstyp: Trägerbomber\n\n Die Fairey Spearfish war ein trägergestützter Torpedo- und Sturzkampfbomber, der für die großen Flugzeugträger der Malta -Klasse entwickelt wurde. Das Flugzeug wurde von einem Bristol Centaurus 57-Motor mit einem fünfblättrigen Propeller angetrieben. Die Verteidigungsbewaffnung bestand aus vier .50-M2-Browning-Maschinengewehren, eines in jedem Flügel und zwei in einer ferngesteuerten gesteuerter Rückenbarbette. Als Nutzlast waren sechzehn RP-3-Raketen auf Unterflügel-Schienen sowie ein Torpedo oder 2.000 Pfund Bomben oder Wasserbomben vorgesehen. Als die Flugzeugträger der Malta-Klasse gestrichen wurden, folgte die Spearfish diesem Beispiel."
sea_mosquito_equipment_1:0	"De Havilland Sea Mosquito"
sea_mosquito_equipment_1_desc:0	"Marinebomber sind darauf ausgelegt, feindliche Schiffe zu versenken. Träger-Marinebomber wurden modifiziert oder speziell für den Einsatz von Flugzeugträgern aus entwickelt."
