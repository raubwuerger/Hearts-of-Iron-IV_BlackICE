conqueror_equipment_1_desc:0	"Einheitentyp: Schwerer Infanteriepanzer"\n\n Der Conqueror wurde ursprünglich als Universalpanzer mit einem gemeinsamen Chassis konzipiert, der als FV-200-Serie bezeichnet wurde. Zu Beginn des Konstruktionsprozesses wurde eine Bewaffnung mit einer 120-mm-Kanone vorgeschlagen, was die Produktion bis Mitte der 1950er Jahre verzögerte. Zwanzig Mark 1 und 165 Mark 2 wurden gebaut, um den Centurion-Panzern Fernkampf-Panzerabwehrunterstützung zu bieten und schweren sowjetischen Panzerentwürfen entgegenzuwirken. Der Conqueror wurde jedoch eingestellt, sobald der Centurion auf die L7 105-mm-Kanone aufgerüstet wurde."
