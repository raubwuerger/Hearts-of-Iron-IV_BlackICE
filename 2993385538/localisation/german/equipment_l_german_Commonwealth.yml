churchill_tank_amph_equipment_1_desc:0	"Einheitentyp: Schwerer Amphibienpanzer"\n\n Der Churchill Mk I war mit einem Duplex-Antrieb oder einem Donald-Duck-Schwimmkörper ausgestattet, um die Amphibienfähigkeit der Panzer zu gewährleisten. Der Panzer wurde bei der Landung von Dieppe auf die Probe gestellt.\n\nVeraltete Churchill Mk.I können zu Mk.I Amphibious umgerüstet werden."
