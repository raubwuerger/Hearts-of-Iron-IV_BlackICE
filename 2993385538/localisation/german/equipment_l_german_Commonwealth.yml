ENG_motorized_equipment_1_short:0	"Morris 15cwt"

ENG_motorized_equipment_2:0	"Mittlere Infanterie-Lkw"

ENG_motorized_equipment_2_desc:0	"Die Motorisierung der Infanterie ist der zweite Schritt zur Mechanisierung einer Armee. Zivile Lastwagen lassen sich leicht für militärische Zwecke wie den Transport von Soldaten, das Ziehen von Geschützen und den Transport von Ausrüstung und Nachschub umrüsten. Dadurch wird die strategische Mobilität von Infanterieeinheiten, die sonst auf den Marsch angewiesen wären, erheblich gesteigert."

