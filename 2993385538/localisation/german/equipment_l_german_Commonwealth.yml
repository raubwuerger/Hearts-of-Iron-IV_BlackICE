cruiser_tank_art_equipment_1_desc:0	"Einheitentyp: Kreuzerpanzer zur Nahunterstützung"\n\n Eine Variante des Cromwell, bestückt mit einer QF-95-mm-Haubitze. Die Fahrzeuge waren mit Watvorrichtungen ausgestattet, um das Anlanden zu erleichtern, und wurden hauptsächlich bei den Royal Marines eingesetzt.\n\nAusgemusterte Cromwell Mk.IVs können zu Cromwell VIs umgebaut werden."
