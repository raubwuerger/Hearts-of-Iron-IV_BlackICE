ENG_cruiser_tank_equipment_3:0	"Cruiser Mk.IV"
AST_cruiser_tank_equipment_3:0	"Cruiser Mk.IV"
BUR_cruiser_tank_equipment_3:0	"Cruiser Mk.IV"
cruiser_tank_equipment_3:0	"Cruiser-Panzer"
cruiser_tank_equipment_3_desc:0	"Einheitstyp: Cruiser-Panzer\n\n Der Cruiser Mk III war ein Cruiser-Panzer und der erste, der das Christie-Federungssystem verwendete. Die Panzerung war zwischen 6 und 14 mm dick und er war mit einer QF-2-Pfünder-Kanone bewaffnet. Obwohl das neue Federungssystem die Geländegängigkeit verbesserte, war der Mk III mechanisch immer noch unzuverlässig und schlecht gepanzert."
CAN_cruiser_tank_equipment_4:0	"Covenanter"
