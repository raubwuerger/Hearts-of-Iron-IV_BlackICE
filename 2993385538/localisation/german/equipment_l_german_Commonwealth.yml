cruiser_tank_equipment_7_desc:0	"Einheitentyp: Kreuzerpanzer"\n\n Der Cromwell war ein Kreuzerpanzer, der hohe Geschwindigkeit, einen zuverlässigen Motor, Feuerkraft und eine gute Panzerung vereinte. Die Entwicklung ging auf die Panzer Cavalier und Centaur zurück, die ursprünglich den Namen Cromwell trugen. Der Panzer war mit einem Rolls-Royce-Meteor-Motor ausgestattet, verfügte anfangs über eine 76-mm-Panzerung, wobei spätere Varianten bis zu 100 mm erreichten, sowie über eine QF-75-mm-Kanone. Der Cromwell blieb auch nach dem Krieg im Einsatz und wurde in Korea sowie von Israel genutzt."
