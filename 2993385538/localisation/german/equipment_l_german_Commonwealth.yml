 british_infantry_tank_equipment_6_short:0 "Valentine Mk.X"
 ENG_churchill_tank_equipment_1:0 "Churchill Mk.I"
 AST_churchill_tank_equipment_1:0 "Churchill Mk.I"
 BUR_churchill_tank_equipment_1:0 "Churchill Mk.I"
 churchill_tank_equipment_1:0 "Schwerer Infanteriepanzer"
 churchill_tank_equipment_1_desc:0 "Einheitstyp: Schwerer Infanteriepanzer\n\n Der Churchill war ein schwerer Infanteriepanzer, der in der Erwartung entwickelt wurde, dass der nächste Krieg ähnlich verlaufen würde wie der vorhergehende, weshalb der Schwerpunkt auf einem Panzer lag, der Gräben relativ leicht überwinden konnte. Der Panzer verfügte über ein großes Längsfahrgestell, umlaufende Ketten und konnte steile Hänge erklimmen. Der Churchill war mit einem 2-Pfünder QF bewaffnet, und die erste Variante litt unter Zuverlässigkeitsproblemen, da sie übereilt in Dienst gestellt wurde. Ein Churchill Crocodile, eine Variante mit Flammenwerfer, kam im Koreakrieg zum Einsatz. "
 CAN_churchill_tank_equipment_2:0 "Churchill Mk.III"
 NZL_churchill_tank_equipment_2:0 "Churchill Mk.III"
 RAJ_churchill_tank_equipment_2:0 "Churchill Mk.III"
 churchill_tank_equipment_2_short:0 "Churchill Mk.III"
 ENG_churchill_tank_art_equipment_1:0 "Churchill Mk.V"
 AST_churchill_tank_art_equipment_1:0 "Churchill Mk.V"
 BUR_churchill_tank_art_equipment_1:0 "Churchill Mk.V"
 churchill_tank_art_equipment_1:0 "Schwerer Nahunterstützungspanzer"
 churchill_tank_art_equipment_1_desc:0 "Einheitstyp: Schwerer Nahunterstützungspanzer\n\n Der Churchill Mk.V war mit einer QF 95mm Haubitze in einem Gussturm ausgestattet. Von diesen Fahrzeugen wurden etwa 240 Stück produziert.\n\nVeraltete Churchill Mk.III können zu Mk.V umgerüstet werden."
 CAN_churchill_tank_amph_equipment_1:0 "Churchill Mk.I (Amph.)"
 NZL_churchill_tank_amph_equipment_1:0 "Churchill Mk.I (Amph.)"
 RAJ_churchill_tank_amph_equipment_1:0 "Churchill Mk.I (Amph.)"
 churchill_tank_amph_equipment_1_short:0 "Churchill Mk.I"
 ENG_churchill_tank_amph_equipment_2:0 "Churchill Mk.III (Amph.)"
 AST_churchill_tank_amph_equipment_2:0 "Churchill Mk.III (Amph.)"
 BUR_churchill_tank_amph_equipment_2:0 "Churchill Mk.III (Amph.)"
 churchill_tank_amph_equipment_2:0 "Schwerer amphibischer Panzer"
 churchill_tank_amph_equipment_2_desc:0 "Einheitstyp: Schwerer amphibischer Panzer\n\n Der Churchill Mk III war mit einem Duplex-Antrieb oder einer Donald-Duck-Schwimmvorrichtung ausgestattet, um den Panzer amphibisch zu machen. Der Panzer erlebte seine Feuerprobe beim Überfall von Dieppe.\n\nVeraltete Churchill Mk.III können zu Mk.III Amphibienpanzern umgebaut werden."
 CAN_churchill_tank_equipment_3:0 "Churchill Mk.VII"
 NZL_churchill_tank_equipment_3:0 "Churchill Mk.VII"
 RAJ_churchill_tank_equipment_3:0 "Churchill Mk.VII"
 churchill_tank_equipment_3_short:0 "Churchill Mk.VII"
 ENG_churchill_tank_equipment_4:0 "Black Prince (A43)"
 AST_churchill_tank_equipment_4:0 "Black Prince (A43)"
 BUR_churchill_tank_equipment_4:0 "Black Prince (A43)"
 churchill_tank_equipment_4:0 "Schwerer Infanteriepanzer"
 churchill_tank_equipment_4_desc:0 "Einheitstyp: Der Churchill Black Prince war ein experimenteller Panzer mit einer größeren und breiteren Wanne und einer Bewaffnung mit einem 17-Pfünder QF, wie er auch im Sherman Firefly und Archer eingesetzt wurde. Eine neue Aufhängung und längere Ketten wurden hinzugefügt, um die zusätzlichen zehn Tonnen der neuen Kanone sowie die verlängerte und verbreiterte Wanne aufzunehmen. Der Black Prince verfügte über eine 152-mm-Frontpanzerung, während der neue Centurion 76 mm aufwies und stark geneigt war, was ihm eine ähnliche Wirksamkeit verlieh. Der Versuchspanzer war neben den Centurions und Firefly-Panzern überflüssig und wurde eingestellt."
 CAN_churchill_tank_art_equipment_2:0 "Churchill Mk.VIII"
 NZL_churchill_tank_art_equipment_2:0 "Churchill Mk.VIII"
 RAJ_churchill_tank_art_equipment_2:0 "Churchill Mk.VIII"
 churchill_tank_art_equipment_2_short:0 "Churchill Mk.VIII"
 ENG_caernarvon_equipment_1:0 "Caernarvon Mk. II"
 AST_caernarvon_equipment_1:0 "Caernarvon Mk. II"
 BUR_caernarvon_equipment_1:0 "Caernarvon Mk. II"
 caernarvon_equipment_1:0 "Schwerer Infanteriepanzer"
 caernarvon_equipment_1_desc:0 "Einheitstyp: Schwerer Infanteriepanzer\n\n Der Caernarvon war ursprünglich als Universalpanzer mit einer gemeinsamen Halle konzipiert, die als Serie FV 200 bezeichnet wurde. Zu einem früheren Zeitpunkt des Entwurfsprozesses wurde die Bewaffnung der vorgesehenen Kanone auf 120 mm geändert. Die erste Prototypwanne war eine FV-Wanne mit einem QF 17-Pfünder und einem Centurion Mk 2-Turm, das Fahrzeug wurde in Caernarvon umbenannt. Einundzwanzig neue Wannen wurden produziert, die mit einem QF 20-Pfünder bewaffnet waren und als Caernarvon Mk II bezeichnet wurden. Es wurden weniger als zwei Dutzend Caernarvons hergestellt."
 CAN_conqueror_equipment_1:0 "Conqueror"
 NZL_conqueror_equipment_1:0 "Conqueror"
 RAJ_conqueror_equipment_1:0 "Conqueror"
 conqueror_equipment_1_short:0 "Conqueror"
 ENG_tortoise_equipment_1:0 "Tortoise"
 AST_tortoise_equipment_1:0 "Tortoise"
 BUR_tortoise_equipment_1:0 "Tortoise"
 tortoise_equipment_1:0 "Superschwerer Panzer"
 tortoise_equipment_1_desc:0 "Einheitstyp: Der Tortoise war ein schweres Sturmgeschütz, das gegen stark befestigte Gebiete eingesetzt werden sollte. Er war stark gepanzert und bewegte sich nur langsam. Die Bewaffnung bestand aus einem 32-Pfünder QF in einem festen Kasemattenaufbau. Das Fahrzeug sollte mit einer 7-köpfigen Besatzung bemannt werden, die durch eine 178 bis 228 mm starke Panzerung geschützt war. Der Krieg endete, bevor das Fahrzeug in Serie produziert werden konnte, und es wurden nur sechs Stück gebaut. Obwohl das Fahrzeug mechanisch zuverlässig und eine gute Geschützplattform war, war es mit 80 Tonnen schwer zu bewegen und mit 12 km/h auf der Straße und 4 km/h im Gelände langsam."
 CAN_british_mbt_equipment_1:0 "Centurion Mk.I"
 NZL_british_mbt_equipment_1:0 "Centurion Mk.I"
 RAJ_british_mbt_equipment_1:0 "Centurion Mk.I"
 british_mbt_equipment_1_short:0 "Centurion Mk.I"
 ENG_british_mbt_equipment_2:0 "Centurion Mk.III"
 AST_british_mbt_equipment_2:0 "Centurion Mk.III"
 BUR_british_mbt_equipment_2:0 "Centurion Mk.III"
 british_mbt_equipment_2:0 "Hauptkampfpanzer"
 british_mbt_equipment_2_desc:0 "Einheitstyp: Der Centurion Mk. III war der Nachfolger des Mk. II, der eine stärkere Panzerung, einen Geschützstabilisator und verbesserte Zielsysteme aufwies. Das neue Design vergrößerte die Bewaffnung des Panzers mit einem 20-Pfünder QF und einem Zwei-Zoll-Mörser, der vom Turm aus geladen und abgefeuert werden konnte. Der Centurion Mk III wurde im Koreakrieg eingesetzt, und der erste bestätigte Abschuss des Panzers war ein erbeuteter Cromwell-Panzer."
 CAN_british_mbt_equipment_3:0 "Centurion Mk.V"
 NZL_british_mbt_equipment_3:0 "Centurion Mk.V"
 RAJ_british_mbt_equipment_3:0 "Centurion Mk.V"
 british_mbt_equipment_3_short:0 "Centurion Mk.V"
 ENG_firefly_equipment_1:0 "Sherman Firefly"
 AST_firefly_equipment_1:0 "Sherman Firefly"
 RAJ_firefly_equipment_1:0 "Sherman Firefly"
 SAF_firefly_equipment_1:0 "Sherman Firefly"
 firefly_equipment_1:0 "Mittlerer Panzer"
 firefly_equipment_1_desc:0 "Einheitstyp: Mittlerer Panzer\n Der Sherman Firefly basierte auf dem mittleren Panzer M4 der United States Army. Der Panzer erhielt eine neue Waffe, den QF 17-Pfünder, der sich als effektive Verteidigungswaffe erwiesen hatte. Der Firefly war als Überbrückung gedacht, bis britische Konstruktionen wie der Archer und der Challenger fertiggestellt werden konnten. Der Sherman Firefly wurde jedoch schon bald in Serie produziert. Ausgediente M4A3 können zu Sherman Fireflys umgebaut werden."
 
