british_infantry_tank_equipment_1_desc:0	"Einheitentyp: Infanteriepanzer"\n\n Der Matilda war ein Infanteriepanzer, der dazu bestimmt war, die Infanterie bei ihrem Vorstoß im Angriff zu unterstützen. Der Panzer war langsam, beengt und mit einem einzigen .303-Vickers-Maschinengewehr bewaffnet, wobei einige Varianten mit einem .50-Vickers-Maschinengewehr ausgerüstet waren. Der Matilda I verfügte für die damalige Zeit über eine schwere Panzerung mit einer Schutzstärke von 10 bis 60 mm, die frühen Panzerabwehrwaffen gut standhielt. Der Panzer kam in den ersten Kriegsmonaten nur begrenzt zum Einsatz, bevor er ausgemustert wurde."
