british_mbt_equipment_1_desc:0	" Einheitentyp: Kampfpanzer\n\n Der Centurion war ein Kampfpanzer, dessen Entwicklung 1943 begann. Der Panzer wurde entwickelt, um die im Einsatz befindlichen Comet-, Cromwell- und Sherman-Firefly-Panzer zu ersetzen. Der Mk I verfügte über eine stark geneigte 76-mm-Panzerung im vorderen Glacis und war mit einer QF-17-Pfünder-Kanone als Hauptbewaffnung ausgestattet. Der Centurion wurde bis in die 1960er Jahre hinein produziert und blieb weitere zwanzig Jahre im Einsatz, wobei für Spezialaufgaben angepasste Fahrgestelle weiterhin im Einsatz sind. "
