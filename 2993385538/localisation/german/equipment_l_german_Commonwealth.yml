cruiser_tank_equipment_8_desc:0	" Einheitentyp: Kreuzerpanzer\n\n Der Challenger wurde auf Basis des Cromwell-Fahrgestells entwickelt. Die 75-mm-QF-Kanone des Cromwell war gegen die meisten feindlichen Panzer wirksam, doch schwerere Panzer waren nur schwer zu bekämpfen. Bei der neuen Konstruktion wurde zugunsten einer QF-17-Pfünder-Kanone, die eine bessere Durchschlagskraft gegen neuere feindliche Panzer bot, auf Panzerung verzichtet. Etwa 200 Challenger wurden hergestellt, bevor der Sherman Firefly, der einfacher zu produzieren und umzurüsten war, in Dienst gestellt wurde."
