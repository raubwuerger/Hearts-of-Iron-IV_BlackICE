british_infantry_tank_equipment_4_desc:0	"Einheitentyp: Infanteriepanzer"\n\n Beim Valentine Mk III wurde der Turm neu gestaltet und nach vorne versetzt, was dem Ladeschützen mehr Platz verschaffte und die Aufgaben des Panzerkommandanten erleichterte. Die Seitenpanzerung wurde von 60 auf 50 mm reduziert, um Gewicht zu sparen und die Geschwindigkeit zu erhöhen . "
