churchill_tank_equipment_2_desc:0	"Einheitentyp: Schwerer Infanteriepanzer"\n\n Der Churchill Mk III war eine grundlegende Neukonstruktion, bei der die Rumpfhaubitze entfernt und die Hauptbewaffnung durch eine QF-6-Pfünder-Kanone ersetzt wurde. Der Turm war geschweißt und wirkte dadurch klarer, und über den oberen Ketten wurden "Laufstege" angebracht, um diese besser zu schützen."
