hawker_hart_equipment_1_desc:0	"Die Hawker Hart ist ein Hochleistungs-Doppeldecker-Bomber. Seine Leistung war so hoch, dass er alle damals bei der RAF im Einsatz befindlichen Jagdflugzeuge übertraf."

hawker_audax_equipment_1_short:0	"Audax Sturzkampfbomber"

hawker_hartebeest_equipment_1:0	"Hawker Hartebeest"

hawker_hartebeest_equipment_1_desc:0	"Die Hawker Hartebeest ist ein Derivat der Hawker Audax und für die Zusammenarbeit mit dem Heer bestimmt."

