QUE_cv_CAS_equipment_1944:0	"Hawker Sea Fury"
QUE_cv_fighter_equipment_1933:0	"Gregor FDB1"
QUE_cv_fighter_equipment_1933_desc:0	"Die Gregor FDB1 war eine fortschrittliche und innovative Konstruktion. Entworfen von Michael Gregor und gebaut von der Canadian Car & Foundry. Gregor soll gesagt haben: "Sie werden diesen Krieg mit Eindeckern beginnen, aber sie werden ihn mit Doppeldeckern beenden.""
QUE_cv_fighter_equipment_1936_short:0	"Sea Hurricane"
QUE_cv_fighter_equipment_1940_short:0	"A27"
QUE_cv_fighter_equipment_1944_short:0	"Seafire"
NZL_motorized_lia_equipment_01:0	"Austin 7"
NZL_motorized_lia_equipment_01_desc:0	"Ein militärisches Verbindungsfahrzeug, das zur Koordination zwischen Einheiten im Feld und für leichte Transportaufgaben eingesetzt wurde. Es handelt sich um eine militärische Adaption eines späteren Modells einer der erfolgreichsten britischen Fahrzeugserien, des Austin 7. Die Modifikationen sind relativ geringfügig: Alles, was nicht unbedingt notwendig ist, wurde entfernt, dafür gibt es mehr Stauraum, Militärräder, Abschleppösen und einen geänderten Kraftstofftank. Historisch gesehen wurde der Austin 7 zwischen 1922 und 1939 produziert. Die britische Armee kaufte vor dem Krieg mehrere Chargen des Austin 7 für Verbindungszwecke. Die Montage von Austin- und Morris-Fahrzeugen in Neuseeland begann 1934. Zu Kriegsbeginn wurden Zivilfahrzeuge aller Art requiriert, und neuseeländische Infanteriebataillone verfügten ab 1941 offiziell über 6 zweisitzige Austin-Fahrzeuge."
NZL_motorized_lia_equipment_02_short:0	"Austin 8"
NZL_motorized_lia_equipment_03:0	"Lkw, Kommando- und Aufklärungsfahrzeug, 1/4 Tonne, 4x4 Ford GPW"
NZL_motorized_lia_equipment_03_desc:0	"Ein lokal gebautes oder umgebautes Modell des berühmten "Jeep", das unter Lizenz der Ford Motor Company of New Zealand nach Willys-Plänen hergestellt wurde. Die Konstruktion erfolgte Ende 1940, die Produktion begann Anfang 1941. Jeeps und andere Fahrzeuge wurden während des Pazifikkriegs in großer Zahl von Neuseeland repariert und überholt, und die neuseeländische Armee war die zweite Armee weltweit, die den Jeep einsetzte."
NZL_motorized_lia_equipment_04_short:0	"Jeep aus der Spätphase des Krieges"
NZL_motorized_AC_equipment_06:0	"Ford-Panzerwagen"
NZL_motorized_AC_equipment_06_desc:0	"Dieses hypothetische Modell ist eine schnelle Umrüstung eines lokal montierten 1/2-Tonnen-Lkw-Chassis mit leicht gepanzerter Karosserie und Turm. Bewaffnet mit einem einzigen Maschinengewehr entspricht es dem Rolls-Royce-Panzerwagen aus der Zeit des Ersten Weltkriegs. Historisch gesehen wurden die Rolls-Royce-Panzerwagen als Fordson-Panzerwagen bezeichnet, wenn sie unter Verwendung eines britischen Fordson-Chassis umgebaut wurden, da die Firma Rolls-Royce die Produktion des ursprünglichen "Silver Ghost"-Chassis von 1914 längst eingestellt hatte; einige blieben bis 1944 im Einsatz."
NZL_motorized_AC_equipment_07_short:0	"Beaverette (NZ)"
NZL_motorized_AC_equipment_08:0	"Transporter, Radfahrzeug, NZ Local Pattern Mk.II"
NZL_motorized_AC_equipment_08_desc:0	"Dies ist eine lokal produzierte Variante des India Pattern Wheeled Carrier. Sie bestehen aus einem Ford-Lkw-Chassis, das mit einer Karosserie aus Weichstahl ausgestattet ist. Historisch wurden 76 Exemplare von den Werkstätten der NZ Railways in Petone hergestellt."
NZL_motorized_AC_equipment_09_short:0	"Humber"
NZL_motorized_AC_equipment_099:0	"Coventry-Panzerwagen"
NZL_motorized_AC_equipment_099_desc:0	"Dies ist ein Gemeinschaftsprojekt, das als Nachfolger der erfolgreichen Panzerwagen von Humber und Daimler gedacht war. Historisch gesehen entschied sich Großbritannien dafür, die Produktion der früheren Modelle vor dem fortschrittlicheren Coventry-Modell fortzusetzen, und bis Kriegsende wurden nur 283 Exemplare fertiggestellt."
NZL_tankette_equipment_0_short:0	"Tankette Mk.IV"
NZL_tankette_equipment_1:0	"Carden-Loyd Tankette Mk.VI"
NZL_tankette_equipment_1_desc:0	"Ein späteres Modell der Carden-Loyd-Tankette. Diese Konstruktion diente als Grundlage für den erfolgreichen Universal Carrier, und viele Vorkriegspanzer basierten auf dessen Fahrgestellkonstruktion."
NZL_tankette_equipment_2_short:0	"Panzertransporter"
NZL_tankette_equipment_3:0	"Panzertransporter, NZ Local Pattern Mk.II (modifiziert)"
NZL_tankette_equipment_3_desc:0	"Dieses hypothetische Modell ist eine verbesserte, gepanzerte Variante des Universal Carrier, ausgestattet mit einem Boyes-Panzerabwehrgewehr. Historisch gesehen schnitt dieses Fahrgestell in der Angriffsrolle schlecht ab, war jedoch in vielen anderen Rollen erfolgreich."
NZL_gw_tank_equipment_short:0	"Bob Semple"
NZL_light_tank_equipment_1:0	"Schofield Mk.I"
NZL_light_tank_equipment_1_desc:0	"Dies ist ein weiterentwickeltes einheimisches Konzept auf Basis eines Universal Carrier-Fahrgestells. Es verfügte über eine ungewöhnliche Kombination aus Ketten und abnehmbaren Laufrädern, die ihm eine respektable strategische Geschwindigkeit verlieh. Das Design war in jeder anderen Hinsicht mittelmäßig, wäre aber besser gewesen als gar kein Panzer."
NZL_light_tank_equipment_2_short:0	"Vickers Light Mk.VI"
NZL_light_tank_equipment_3:0	"M3 Stuart"
NZL_light_tank_equipment_3_desc:0	" Lizenzversion des M3, eines amerikanischen Entwurfs, der eine verbesserte Weiterentwicklung des früheren leichten Panzers M2 darstellte. Historisch wurde dieser ab 1941 im Rahmen des Leih- und Pachtgesetzes geliefert und von der neuseeländischen Division in Nordafrika eingesetzt."
NZL_cavalry_tank_equipment_0_short:0	"Schofield II"
