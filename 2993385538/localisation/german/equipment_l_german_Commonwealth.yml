QUE_motorized_equipment_1:0	"Canadian Military Pattern"
QUE_motorized_equipment_1_desc:0	"Das CMP, hergestellt von Chevrolet, Ford Canada und staatlichen Unternehmen, war eine Bezeichnung für kanadische Lastwagen. Sie wurden für Transport, Versorgung und Versorgungsaufgaben eingesetzt. "
QUE_mechanized_equipment_1_short:0	"M3 White"
QUE_mechanized_equipment_2:0	"C15TA"
QUE_mechanized_equipment_2_desc:0	"Ein gepanzerter Lastwagen, der schweres Gerät und Infanterie transportieren konnte. Geplante Modifikationen umfassten eine Halbkettenvariante sowie eine Vollkettenvariante für unwegsames Gelände und den Norden Kanadas."
QUE_mechanized_equipment_3_short:0	"Kangaroo"
QUE_fighter_equipment_1933:0	"Grumman Goblin"
QUE_fighter_equipment_1933_desc:0	"Der Grumman Goblin oder G-5 wurde von der Canadian Car & Foundry Co. in Lizenz hergestellt und unter der Bezeichnung Goblin I. in den kanadischen Dienst gestellt."
QUE_fighter_equipment_1936_short:0	"Hurricane"
QUE_fighter_equipment_1940:0	"P40 Kittyhawk"
QUE_fighter_equipment_1940_desc:0	"Als erfolgreiches Jagdflugzeug wurde die Kittyhawk von den kanadischen Piloten, die sie einsetzten, sehr geschätzt. Sie wurden von den Kanadiern vor allem in den Feldzügen in Alaska und auf den Aleuten eingesetzt. Zur Leistungssteigerung wurden sie mit Rolls-Royce-Merlin-Motoren umgerüstet."
QUE_fighter_equipment_1944_short:0	"Spitfire"
QUE_heavy_fighter_equipment_1936_short:0	"Bolingbroke"
QUE_heavy_fighter_equipment_1940:0	"Lockheed Hudson"
QUE_heavy_fighter_equipment_1944:0	"de Havilland Mosquito BVII"
