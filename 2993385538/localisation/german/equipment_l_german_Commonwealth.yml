ENG_light_cruiser_1f:0	"Leander-Klasse CL If"
ENG_light_cruiser_1g_desc:	" Die Arethusa-Klasse war eine Klasse von vier 6.700-Tonnen-Leichtkreuzern, die zwischen 1933 und 1937 für die Royal Navy gebaut wurden. Sie waren mit sechs BL-6-Zoll-Mark-XXIII-Geschützen in drei Doppelgeschützstellungen vom Typ Mark XXI in den Positionen "A", "B" und "Y" bewaffnet. Dreifach-21-Zoll-Torpedorohre (530 mm) befanden sich nebeneinander am hinteren Schornstein. Es handelte sich um ein für die damalige Zeit leistungsstarkes Leichtkreuzer-Design, das keine Angst vor ähnlichen Leichtkreuzer-Konstruktionen potenzieller Feinde wie der deutschen Kriegsmarine oder der Kaiserlich Japanischen Marine haben musste."
ENG_light_cruiser_2_desc:0	"Die Leichtkreuzer der Southampton -Klasse waren eine Unterklasse der Town-Klasse und wurden als Gegengewicht zu den japanischen Kreuzern der Mogami-Klasse konzipiert. Diese Schiffe waren gut gepanzert, verfügten über eine gute Geschwindigkeit und Reichweite und trugen eine beeindruckende Bewaffnung von zwölf 6-Zoll-Kanonen in vier Dreifachtürmen. Sie bildeten die Grundlage für viele der nachfolgenden Entwürfe für leichte Kreuzer der Royal Navy während des Krieges."
ENG_light_cruiser_2b_desc:0	"Die Town-Klasse war eine aus zehn Schiffen bestehende Klasse leichter Kreuzer der Royal Navy. Die Schiffe der Town-Klasse wurden unter Berücksichtigung der durch den Londoner Flottenvertrag von 1930 auferlegten Beschränkungen entworfen. Die Schiffe wurden in drei unterschiedlichen Unterklassen gebaut, nämlich der Southampton-, der Gloucester- und der Edinburgh-Klasse, wobei jede Unterklasse über zusätzliche Bewaffnung verfügte. Die nachfolgenden Schiffe der Gloucester-Klasse hatten ein neu gestaltetes Deck und erhielten eine dickere Panzerung an den Geschütztürmen, während der Edinburgh-Unterklasse vier zusätzliche 4-Zoll-Geschütze (102 mm) vom Typ "High Angle Low Angle" sowie acht zusätzliche 2-Pfünder-Geschütze (40 mm) und weiterer Panzerschutz hinzugefügt wurden."
ENG_light_cruiser_2c_desc:0	"Die Town-Klasse war eine Klasse von 10 leichten Kreuzern der Royal Navy. Die Schiffe der Town-Klasse wurden unter Berücksichtigung der Beschränkungen des Londoner Flottenvertrags von 1930 entworfen. Die Schiffe wurden in drei unterschiedlichen Unterklassen gebaut, nämlich der Southampton-, der Gloucester- und der Edinburgh-Klasse, wobei jede Unterklasse über zusätzliche Bewaffnung verfügte. Die nachfolgenden Schiffe der Gloucester-Klasse verfügten über ein neu gestaltetes Deck und erhielten eine dickere Panzerung an den Geschütztürmen; bei der Edinburgh-Unterklasse wurden vier zusätzliche 4-Zoll-Geschütze (102 mm) vom Typ "High Angle Low Angle" sowie acht zusätzliche 2-Pfünder-Geschütze (40 mm) und weiterer Panzerschutz hinzugefügt."
ENG_light_cruiser_3_desc:0	 "Die 10.700 Tonnen schweren Kreuzer der Crown-Colony-Klasse waren eine Klasse leichter Kreuzer der Royal Navy, benannt nach den Kronkolonien des Britischen Empire. Die ersten acht sind als Fiji-Klasse bekannt, während die letzten drei gebauten Schiffe gemeinhin als Ceylon-Klasse bezeichnet werden und hinsichtlich Hauptbewaffnung, Flugabwehrgeschützen und Rumpfstruktur nach einem leicht modifizierten Entwurf gebaut wurden."
ENG_light_cruiser_3b_desc:0	" Die 10.700-Tonnen-Kreuzer der Crown-Colony-Klasse waren eine Klasse leichter Kreuzer der Royal Navy, benannt nach Kronkolonien des Britischen Empire. Die ersten acht sind als Fiji-Klasse bekannt, während die letzten drei gebauten Schiffe gemeinhin als Ceylon-Klasse bezeichnet werden und hinsichtlich Hauptbewaffnung, Flugabwehrgeschützen und Rumpfstruktur nach einem leicht modifizierten Entwurf gebaut wurden."
ENG_light_cruiser_4_desc:0	" Diese Kreuzer, auch als Swiftsure-Klasse bekannt, wurden als modifizierte Version der Crown-Colony-Klasse entworfen und enthielten Kriegsmodifikationen, die 1941 genehmigt worden waren. Sie verfügten über eine größere Reichweite und eine umfangreichere Flugabwehrbewaffnung als die Crown-Colony-Klasse, während die Hauptbewaffnung auf drei Dreifachtürme reduziert wurde. Da sie zu spät gebaut wurden, um den Kriegsausgang noch zu beeinflussen, wurden die meisten der bestellten Schiffe später storniert. "
ENG_AA_light_cruiser_1_desc:0	"Die Dido-Klasse war eine Klasse von sechzehn (einschließlich fünf der Bellona-Unterklasse) leichten Kreuzern, die für die Royal Navy gebaut wurden. Das Design war von den leichten Kreuzern der Arethusa-Klasse beeinflusst. Die erste Gruppe von drei Schiffen wurde 1940 in Dienst gestellt, die zweite Gruppe (sechs Schiffe) und die dritte Gruppe (zwei Schiffe) wurden 1941 –1942. Die Hauptbewaffnung sollte aus fünf 5,25-Zoll-Doppellafetten bestehen, jedoch verfügten sie nicht über die 4-Zoll-Kanone (102 mm). Die Schiffe der Bellona-Unterklasse wurden zwischen 1943 und 1944 in Dienst gestellt. Die Bellona-Unterklasse unterschied sich äußerlich etwas von ihren Vorgängern. Sie verfügten über acht 5, 25-Zoll- (133 mm) RP10MkII-Kanonen in vier Doppeltürmen und verfügten über eine erheblich verbesserte Flugabwehrbewaffnung mit zwölf 2-Pfünder-Kanonen und zwölf Oerlikon-20-mm-Kanonen."
ENG_AA_light_cruiser_2_desc:0	"Die Dido-Klasse war eine Klasse von sechzehn (einschließlich fünf der Bellona-Unterklasse) leichten Kreuzern, die für die Royal Navy gebaut wurden. Das Design war von den leichten Kreuzern der Arethusa-Klasse beeinflusst. Die erste Gruppe von drei Schiffen wurde 1940 in Dienst gestellt, die zweite Gruppe (sechs Schiffe) und die dritte Gruppe (zwei Schiffe) wurden 1941–1942 in Dienst gestellt. Die Hauptbewaffnung sollte aus fünf 5,25-Zoll-Doppellafetten bestehen, jedoch verfügten sie nicht über die 4-Zoll-Kanone (102 mm). Die Schiffe der Bellona-Unterklasse wurden zwischen 1943 und 1944 in Dienst gestellt. Die Bellona-Unterklasse unterschied sich äußerlich etwas von ihren Vorgängern. Sie verfügten über acht 5,25-Zoll- (133 mm) RP10MkII-Kanonen in vier Doppeltürmen und verfügten über eine erheblich verbesserte Flugabwehrbewaffnung mit zwölf 2-Pfünder-Kanonen und zwölf Oerlikon-20-mm-Kanonen."
ENG_heavy_cruiser_2:0	"Kent-Klasse CA II"
ENG_heavy_cruiser_4:0	"Norfolk-Klasse CA IV"
ENG_heavy_cruiser_5_desc:0	"Die York-Klasse war die zweite und letzte Klasse von schweren Kreuzern mit 8-Zoll-Kanonen (203 mm), die gemäß den Bestimmungen des Washingtoner Flottenvertrags von 1922 für die Royal Navy gebaut wurden. Die Klasse besteht aus der HMS York und der HMS Exeter, beides Kreuzer mit einer Verdrängung von 10.000 Tonnen. Neben der moderaten Hauptbatterie wurden zusätzlich 6 (2x3) Abschussrohre für 21-Zoll- (533 mm) Torpedos eingebaut. Die Klasse war entweder als Begleitschiffe für schwerere Schlachtschiffe oder für den gemeinsamen Einsatz zur Aufspürung deutscher Überwasser-Raider gleicher Tonnage, wie beispielsweise des deutschen Taschen-Schlachtschiffs Admiral Graf Spee, vorgesehen."
ENG_heavy_cruiser_6_desc:0	"Die modernisierte London-Klasse zeichnete sich durch einen insgesamt besseren Panzerschutz und Verbesserungen am Rumpf aus, gepaart mit einer erhöhten Anzahl an Flugabwehrgeschützen und zusätzlicher Sekundärbewaffnung. Dies machte die London-Klasse zu einer perfekten Eskorte für Flugzeugträgerkampfgruppen."
