cruiser_tank_equipment_1:0	"Cruiser-Panzer"
cruiser_tank_equipment_1_desc:0	" Einheitentyp: Kreuzerpanzer\n\n Das Konzept des Kreuzerpanzers wurde nach der Streichung des kostspieligen Medium Mk III entwickelt. Der Kreuzerpanzer verfügte über einen zentral angeordneten Turm und eine motorisierte Schwenkvorrichtung. Obwohl die Panzerung mit 14 mm dünn war, war der Panzer bei Produktionsbeginn im Jahr 1937 mit einer leistungsstarken QF-2-Pfünder-Kanone ausgerüstet."
CAN_cruiser_tank_equipment_2:0	"Cruiser Mk.II"
NZL_cruiser_tank_equipment_2:0	"Cruiser Mk.II"
