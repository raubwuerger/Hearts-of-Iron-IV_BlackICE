ENG_destroyer_1j_desc:0	"Die Zerstörer der E- und F-Klasse bildeten eine Gruppe von 18 1. 900-Tonnen-Zerstörer, die in den 1930er Jahren für die Royal Navy gebaut und ursprünglich der Home Fleet zur Eskorte der größeren Schlachtschiffe zugeteilt wurden. Die E-Klasse wurde im Rahmen des Marinebauprogramms von 1931 in Auftrag gegeben, die F-Klasse folgte 1932. Alle Schiffe verfügten über dieselbe Hauptbewaffnung: vier schnellfeuernde (QF) 4,7-Zoll- (120 mm) Mark-IX-Kanonen in Einzellafetten, und zur Flugabwehr (AA) verfügten sie über zwei Vierfachlafetten für das Schnellfeuer-0,5-Zoll-Vickers-Mk-III-Maschinengewehr auf Plattformen zwischen den Schornsteinen. Die Schiffe der E- und F-Klasse waren mit zwei Vierfachlafetten für 21-Zoll- (533 mm) Torpedorohre ausgestattet."
ENG_destroyer_1k_desc:0	"Insgesamt wurden in den 1930er Jahren 18 Zerstörer der G- und H-Klasse für die Royal Navy gebaut. Die G-Klasse wurde im Rahmen des Marinebauprogramms von 1933 in Auftrag gegeben, die H-Klasse folgte 1934. Diese Schiffe basierten auf der vorangegangenen F-Klasse, doch der Verzicht auf Kreuzfahrt-Turbinen und die Entwicklung kompakterer Maschinen ermöglichten eine Verdrängung leicht reduziert werden. Die H-Klasse war eine Wiederholung der G-Klasse mit einigen geringfügigen Unterschieden."
ENG_destroyer_2_desc:0	"Die Zerstörer der I-Klasse waren eine Gruppe von neun Zerstörern, darunter ein Flottillenführer, die in den 1930er Jahren für die Royal Navy gebaut wurden. Die I-Klasse war eine Wiederholung der vorangegangenen H-Klasse, mit der Ausnahme, dass sie über zehn Torpedorohre (zwei Batterien zu je fünf) anstelle von acht verfügten."
ENG_destroyer_2b_desc:0	"Die Tribal-Klasse, auch bekannt als Afridi-Klasse, war eine Zerstörerklasse, die für die Royal Navy, die Royal Canadian Navy und die Royal Australian Navy gebaut wurde. Insgesamt wurden 27 Schiffe gebaut. Die Tribal-Klasse entwickelte sich zu schnellen, leistungsstarken Zerstörern, bei denen im Gegensatz zu früheren Zerstörern der Schwerpunkt stärker auf Kanonen als auf Torpedos lag – als Reaktion auf neue Konstruktionen aus Japan, Italien und Deutschland. Die Tribal-Klasse gehörte zu den besten Begleitschiffen der Royal Navy. Dieser Entwurf sah ein 1.850-Tonnen-Schiff mit einer Geschwindigkeit von 36,25 Knoten (67,14 km/h; 41,72 mph), einer Reichweite von 5.500 Seemeilen (10.200 km; 6.300 Meilen) und fünf 4,7-Zoll-Doppellafetten als Hauptbewaffnung."
ENG_destroyer_3_desc:0	"Die J-, K- und N-Klasse war eine Bestellung von 24 Zerstörern der Royal Navy, die 1938 vom Stapel liefen. Sie stellten eine Rückkehr zu kleineren Schiffen mit schwererer Torpedobewaffnung dar, nachdem bei der Tribal-Klasse der Schwerpunkt eher auf Kanonen als auf Torpedos gelegen hatte. Die Schiffe wurden in drei Flottillen oder Gruppen gebaut, die jeweils aus acht Schiffen bestanden, deren Namen mit "J" , "K" und "N". Die Bewaffnung basierte auf der der Tribal-Klasse, ersetzte jedoch eine doppelläufige QF 4,7-Zoll-Kanone (120 mm) Mark XII (L/45) auf einer CP Mk. XIX durch eine zusätzliche Reihe von Torpedorohren ersetzt. Die Flugabwehrbewaffnung blieb unverändert und bestand aus einer vierläufigen QF-2-Pfünder-Kanone Mark VIII auf einer Mk.VII-Lafette sowie einem Paar vierläufiger 0,5-Zoll-Vickers-Maschinengewehre. Die Bewaffnung wurde weiter verbessert, indem die vierläufigen Maschinengewehre durch 20-mm-Oerlikons ersetzt wurden."
ENG_destroyer_3b_desc:0	" Die Hunt-Klasse war eine Klasse von Begleitzerstörern der Royal Navy. Die ersten Schiffe wurden Anfang 1939 in Auftrag gegeben, und die Klasse leistete im Zweiten Weltkrieg umfangreiche Dienste, insbesondere an der britischen Ostküste und bei Konvois im Mittelmeer.  Insgesamt wurden 86 Schiffe für die Royal Navy gebaut. Die Hunt-Klasse war in vier verschiedenen Unterklassen verfügbar, von denen jede unterschiedliche Konstruktionsschwerpunkte hinsichtlich U-Boot-Abwehr und Wasserbomben, Geschwindigkeit, Rumpfkonstruktion und Flugabwehrbewaffnung aufwies."
ENG_destroyer_3c_desc:0	"Die Hunt-Klasse war eine Klasse von Begleitzerstörern der Royal Navy. Die ersten Schiffe wurden Anfang 1939 in Auftrag gegeben, und die Klasse war im Zweiten Weltkrieg intensiv im Einsatz, insbesondere an der britischen Ostküste und bei Konvois im Mittelmeer.  Insgesamt wurden 86 Schiffe für die Royal Navy gebaut. Die Hunter-Klasse war in vier verschiedenen Unterklassen verfügbar, von denen jede unterschiedliche Konstruktionsschwerpunkte hinsichtlich U-Boot-Abwehr und Wasserbomben, Geschwindigkeit, Rumpfkonstruktion und Flugabwehrbewaffnung aufwies."
ENG_destroyer_3d_desc:0	"Die Hunt-Klasse war eine Klasse von Begleitzerstörern der Royal Navy. Die ersten Schiffe wurden Anfang 1939 in Auftrag gegeben, und die Klasse leistete im Zweiten Weltkrieg umfangreiche Dienste, insbesondere an der britischen Ostküste und bei Konvois im Mittelmeer. Insgesamt wurden 86 Schiffe für die Royal Navy gebaut. Die Hunter -Klasse war in vier verschiedenen Unterklassen verfügbar, von denen jede unterschiedliche Konstruktionsschwerpunkte hinsichtlich U-Boot-Abwehr und Wasserbomben, Geschwindigkeit, Rumpfkonstruktion und Flugabwehrbewaffnung aufwies."
ENG_destroyer_3e_desc:0	"Die Hunt-Klasse war eine Klasse von Begleitzerstörern der Royal Navy. Die ersten Schiffe wurden Anfang 1939 in Auftrag gegeben, und die Klasse leistete im Zweiten Weltkrieg umfangreiche Dienste, insbesondere an der britischen Ostküste und bei Konvois im Mittelmeer.  Insgesamt wurden 86 Schiffe für die Royal Navy gebaut. Die Hunter-Klasse war in vier verschiedenen Unterklassen erhältlich, von denen jede unterschiedliche Konstruktionsschwerpunkte hinsichtlich U-Boot-Abwehr und Wasserbomben, Geschwindigkeit, Rumpfkonstruktion und Flugabwehrbewaffnung aufwies."
ENG_destroyer_3f_desc:0	 "Die L- und M-Klasse war eine Klasse von sechzehn Zerstörern, die in der britischen Royal Navy dienten und eine Verdrängung von 2.600 Tonnen hatten. Gemäß der Bestellung sollten die Schiffe mit sechs QF Mark XI 4,7-Zoll-Kanonen (120 mm) ausgerüstet sein. Die L- und M-Klasse verfügte über eine bessere Flugabwehr- und Hauptbatterieausrüstung sowie ein verbessertes Rumpfdesign."
ENG_destroyer_3g_desc:0	 "Sechzehn Zerstörer der O- und P-Klasse wurden 1939 in Auftrag gegeben. Die Klasse diente während des Krieges hauptsächlich als Konvoieskorte. Bei der O- und P-Klasse lag der Schwerpunkt auf einer besseren Flugabwehrbewaffnung sowie einer besseren Ausrüstung für die U-Boot-Bekämpfung, die für die vorgesehene Rolle als Konvoieskorte geeignet war."
ENG_destroyer_3h_desc:0	"Sechzehn Zerstörer der O- und P-Klasse wurden 1939 in Auftrag gegeben. Die Klasse diente während des Krieges hauptsächlich als Konvoieskorte. Bei der O- und P-Klasse lag der Schwerpunkt auf einer besseren Flugabwehrbewaffnung sowie einer besseren U-Boot-Abwehr-Ausrüstung, die für die vorgesehene Rolle als Konvoieskorte geeignet war."
ENG_destroyer_3i_desc:0	"Sechzehn Zerstörer der O- und P-Klasse wurden 1939 in Auftrag gegeben. Die Klasse diente während des Krieges hauptsächlich als Konvoieskorte. Bei der O- und P-Klasse lag der Schwerpunkt auf einer besseren Flugabwehrbewaffnung sowie einer besseren U-Boot-Abwehr-Ausrüstung, die für die vorgesehene Rolle als Konvoieskorte geeignet war."
ENG_destroyer_3j_desc:0	" Die Q- und R-Klasse war eine Klasse von sechzehn Zerstörern des War Emergency Programme, die 1940 für die britische Royal Navy als 3. und 4. Emergency Flotilla in Auftrag gegeben wurden. Sie dienten während des Zweiten Weltkriegs als Konvoibegleiter. Die Q- und R-Klasse waren Wiederholungen der vorangegangenen O- und P-Klasse, kehrten jedoch zum größeren Rumpf der J-, K- und N-Klasse zurück, um dem unvermeidlichen Anstieg des Gesamtgewichts Rechnung zu tragen. Im Vergleich zu ihren Vorgängern wurden bei der Q- und R-Klasse im Vergleich zu ihrer Vorgängerin vorgenommen."
ENG_destroyer_3k_desc:0	"Die Q- und R-Klasse war eine Klasse von sechzehn Zerstörern des War Emergency Programme, die 1940 für die britische Royal Navy als 3. und 4. Emergency Flotilla bestellt wurden. Sie dienten während des Zweiten Weltkriegs als Konvoieskorte. Die Q- und R-Klasse waren Wiederholungen der vorangegangenen O- und P-Klasse, kehrten jedoch zum größeren Rumpf der J-, K- und N-Klasse zurück, um dem unvermeidlichen Anstieg des Gesamtgewichts Rechnung zu tragen. Im Vergleich zu ihren Vorgängern wurden bei der Q- und R-Klasse geringfügige Verbesserungen vorgenommen."
ENG_destroyer_3l_desc:0	"Sechzehn Zerstörer der S- und T-Klasse wurden in den Jahren 1942–1943 vom Stapel gelassen. Sie wurden als zwei Flottillen gebaut, die als 5. bzw. 6. Notfallflottille bekannt waren, und dienten im Zweiten Weltkrieg als Flotten- und Konvoieskorte. Diese Schiffsklassen waren mit zusätzlicher U-Boot-Abwehr- und Wasserbombenausrüstung ausgestattet, was sie zu einer ernstzunehmenden Bedrohung für feindliche U-Boote machte. Diese Begleitschiffe waren perfekt für den Konvoischutz ausgelegt."
ENG_destroyer_3m_desc:0	"Die U- und V-Klasse war eine Klasse von sechzehn Zerstörern der Royal Navy, die 1942–1943 vom Stapel liefen. Es handelte sich um zu bauende Nachbildungen der S- und T-Klassen mit höherer Ausweichmanövrierfähigkeit und etwas besserer Hauptbewaffnung. Die U- und V-Klasse diente während des Krieges ebenfalls als Konvoieskorte."
ENG_destroyer_3n_desc:0	" Nachbauten der vorangegangenen Zerstörer der U- und V-Klasse mit modifizierten Feuerleitsystemen. Die Z-Klasse war mit 4,5-Zoll-Kanonen bewaffnet; sowohl die W- als auch die Z-Klasse verfügten über langsamere Motoren und hatten eine Verdrängung von 2.600 Tonnen. "
ENG_destroyer_3o_desc:0	"Nachbauten der vorangegangenen Zerstörer der U- und V-Klasse mit modifizierten Feuerleitstrukturen. Die Z-Klasse war mit 4,5-Zoll-Kanonen bewaffnet; sowohl die W- als auch die Z-Klasse verfügten über langsamere Manövriermotoren und hatten eine Verdrängung von 2.600 Tonnen."
ENG_destroyer_3p_desc:0	"Die C-Klasse war eine Klasse von 32 Zerstörern der Royal Navy, die zwischen 1943 und 1945 vom Stapel liefen. Die Klasse wurde in vier Flottillen zu je 8 Schiffen gebaut. Sie wurden im Rahmen des War Emergency Programme auf Basis des Rumpfes und der Maschinen der vor Kriegszeit J-Klasse, wobei alle damals verfügbaren Fortschritte in den Bereichen Bewaffnung und Schiffsradar integriert wurden. Die Torpedobewaffnung bestand aus acht 21-Zoll-Torpedos (533 mm) in zwei Vierfachwerfern, während 70 Wasserbomben mitgeführt werden konnten."
ENG_destroyer_4_desc:0	" Die Zerstörer der Battle-Klasse bauten auf der Weiterentwicklung der während des gesamten Krieges eingesetzten britischen Zerstörer auf. Die Schiffe wurden im Rahmen der Marineprogramme von 1942 und 1943 in Auftrag gegeben. Sie waren sowohl hinsichtlich ihrer Geschütze als auch ihrer Torpedos gut bewaffnet. Ihre Flugabwehrbewaffnung, ihre U-Boot-Abwehrfähigkeiten, ihre Geschwindigkeit und ihre Reichweite machten sie zu vielseitigen Schiffen. Ihre späte Einführung in den Krieg führte jedoch zu einem minimalen Beitrag."
ENG_destroyer_4b_desc:0	"Dies war eine verbesserte Version der ursprünglichen Battle-Klasse mit geringerer U-Boot-Abwehrfähigkeit, aber besserer Torpedobewaffnung und höherer Geschwindigkeit."
ENG_destroyer_4c_desc:0	"Die Weapon-Klasse wurde gegen Ende des Zweiten Weltkriegs für die britische Royal Navy gebaut. Sie waren das kleinere Pendant zur Battle-Klasse (die ihnen folgte) und stellten die ersten neuen Zerstörerentwürfe für die Royal Navy seit dem Notfallprogramm des Zweiten Weltkriegs dar. Die Klasse wurde gebaut, um die schweren Verluste in der noch andauernden Atlantikschlacht auszugleichen."
ENG_destroyer_4d_desc:0	"Die Daring-Klasse war eine Klasse von elf Zerstörern, die für die Royal Navy (RN) und die Royal Australian Navy (RAN) gebaut wurden. Sie entstanden nach dem Zweiten Weltkrieg und traten in den 1950er Jahren in Dienst. Die Schiffe der Daring-Klasse waren sowohl die größten als auch die am schwersten bewaffneten Schiffe im Dienst der Commonwealth-Marinen, die als Zerstörer klassifiziert wurden. Die Daring-Schiffe waren die letzten konventionellen Kanonen-Zerstörer der RN und waren mit der QF 4,5-Zoll-/45 (113 mm) Mark V-Kanone in drei Doppelaffetten UD Mk.VI (später einfach in Mark N6 umbenannt) bewaffnet."
