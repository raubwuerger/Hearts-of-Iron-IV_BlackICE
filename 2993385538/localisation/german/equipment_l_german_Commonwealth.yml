rn_patrol_submarine_5_desc:0	"Die Parthian-Klasse wurde nach dem Ersten Weltkrieg für die Royal Navy entwickelt. Insgesamt wurden sechs U-Boote der Parthian-Klasse gebaut. Alle U-Boote verfügten über eine mäßige Geschwindigkeit von 17 Knoten an der Oberfläche und eine schwere Torpedobewaffnung mit acht 533-mm-Torpedorohre. Sie wurden zu Beginn des Zweiten Weltkriegs als Patrouillen-U-Boote eingesetzt."
rn_patrol_submarine_6_desc:0	"Die Rainbow-Klasse wurde nach dem Ersten Weltkrieg für die Royal Navy entwickelt. Insgesamt wurden vier U-Boote der Rainbow-Klasse gebaut. Alle U-Boote verfügten über eine mäßige Geschwindigkeit von 17 Knoten an der Oberfläche und eine schwere Torpedobewaffnung mit acht 533-mm-Torpedorohre. Sie wurden zu Beginn des Zweiten Weltkriegs als Patrouillen-U-Boote eingesetzt."
rn_patrol_submarine_7_desc:0	"Die U-Boote der S -Klasse der Royal Navy wurden ursprünglich während der Modernisierung der U-Boot-Flotte in den frühen 1930er Jahren entworfen und gebaut, um den Bedarf an kleineren Booten für die Patrouillen in den begrenzten Gewässern der Nordsee und des Mittelmeers zu decken und die britischen U-Boote der H-Klasse zu ersetzen. Als Teil des großen Schiffbauprogramms für die Royal Navy während des Zweiten Weltkriegs wurde die S-Klasse zur größten einzelnen Gruppe von U-Booten, die jemals für die Royal Navy gebaut wurde. Insgesamt 62 wurden über einen Zeitraum von 15 Jahren gebaut, wobei fünfzig der "verbesserten" U-Boote der S-Klasse zwischen 1940 und 1945 vom Stapel liefen."
rn_patrol_submarine_8_desc:0	" Die River-Klasse oder Thames-Klasse war eine für die Royal Navy gebaute U-Boot-Klasse. Die drei Boote dieser Klasse, die während des Zweiten Weltkriegs im Einsatz standen, waren die Thames, die Severn und die Clyde. Die River-Klasse war der letzte Versuch der Admiralität, "Flotten-U-Boote" zu bauen, U-Boote, die schnell genug waren, um als Teil einer Flotte zu operieren, was zu dieser Zeit bedeutete, dass sie an der Oberfläche eine Geschwindigkeit von etwa 20 Knoten (37 km/h) erreichen konnten. Es wurden nur drei U-Boote gebaut."
rn_patrol_submarine_9_desc:0	" Die U-Boote der Grampus-Klasse waren eine Gruppe von Minenleger-U-Booten, die Ende der 1930er Jahre für die Royal Navy gebaut wurden. Diese Boote werden manchmal als Porpoise-Klasse bezeichnet, nach dem einzigen Prototyp, der 1932 gebauten HMS Porpoise. Zwischen 1936 und 1938 wurden fünf Boote nach einem modifizierten Entwurf gebaut. Die Schiffe wurden alle nach Meeressäugetieren benannt. Insgesamt wurden sechs U-Boote gebaut."
rn_patrol_submarine_10_desc:0	"Die britischen U-Klasse-U-Boote (offiziell \ "War Emergency"-Programme von 1940 und 1941, kurzer Rumpf") waren eine Klasse von 49 kleinen U-Booten, die kurz vor und während des Zweiten Weltkriegs gebaut wurden. Die Klasse wird manchmal als "Undine"-Klasse bezeichnet, nach dem ersten gebauten U-Boot. Insgesamt wurden 49 U-Boote gebaut, die über eine moderate Bewaffnung von sechs 533-mm-Torpedorohre und eine mäßige Reichweite verfügten."
rn_patrol_submarine_11_desc:0	" Die T-Klasse (oder Triton-Klasse) der dieselelektrischen U-Boote der Royal Navy wurde in den 1930er Jahren als Ersatz für die O-, P- und R-Klassen entworfen. 53 Boote dieser Klasse wurden kurz vor und während des Zweiten Weltkriegs gebaut, wo sie eine wichtige Rolle bei den U-Boot-Einsätzen der Royal Navy spielten. Vier Boote, die bei der Königlich-Niederländischen Marine im Dienst standen, waren als Zwaardvisch-Klasse bekannt. Die Salve von zehn Torpedos war die größte, die jemals auf einem einsatzfähigen U-Boot der Royal Navy installiert wurde. 53 U-Boote der T-Klasse wurden vor und während des Krieges in drei unterschiedlichen Gruppen gebaut, wobei es geringfügige Unterschiede zwischen den Booten innerhalb derselben Gruppe gab."
rn_patrol_submarine_12_desc:0	"Diese sieben Schiffe wurden alle im Rahmen des Kriegsnotfallprogramms von 1939 in Auftrag gegeben. Das erste, die Thrasher, lief am 5. November 1940 vom Stapel. Die äußeren Bugtorpedorohranlagen wurden um sieben Fuß nach achtern verlegt, um die Seetüchtigkeit zu verbessern. Die beiden äußeren vorderen , die sich direkt vor dem Kommandoturm befanden, wurden hinter diesen verlegt und nach hinten geneigt, um nach achtern feuern zu können, und es wurde zudem ein externes Heck-Torpedorohr angebracht. Damit ergaben sich insgesamt acht nach vorne gerichtete und drei nach hinten gerichtete Rohre. Alle Boote der zweiten Gruppe wurden ins Mittelmeer entsandt, nur die Thrasher und die Trusty kehrten zurück."
rn_patrol_submarine_13_desc:0	"Verbesserte Version des U-Boots der S-Klasse. Die zweite Gruppe der U-Boote der S-Klasse bestand aus acht Booten. Sie waren größer als die vorangegangene erste Gruppe und benötigten mehr Besatzungsmitglieder, waren jedoch ähnlich bewaffnet. Der Bau erfolgte aufgeteilt zwischen der Chatham Dockyard und den Werften von Scotts in Greenock sowie Cammell Laird & Co Limited in Birkenhead. Alle Schiffe wurden zwischen 1934 und 1937 gebaut. "
rn_patrol_submarine_14_desc:0	"Verbesserte und letzte Version der U-Boote der T-Klasse der Royal Navy mit einer größeren Tauchtiefe von 107 m, in die die Erfahrungen aus dem Krieg mit den vorangegangenen U-Booten der Thrasher- und Triton-Klasse einflossen. "
rn_patrol_submarine_15_desc:0	"Das britische U-Boot der V-Klasse (offiziell \"U-Klasse Langrumpf 1941–42-Programm\") war eine Klasse von U-Booten, die während des Zweiten Weltkriegs für die Royal Navy gebaut wurden. 42 Schiffe wurden nach diesem Entwurf in Auftrag gegeben, die alle von Vickers-Armstrong entweder in Barrow-in-Furness oder in Walker-on-Tyne gebaut werden sollten, doch nur 22 wurden fertiggestellt. Die U-Boote der V-Klasse ähnelten stark den vorangegangenen U-Booten der U-Klasse (Kurzrumpf), von denen sie eine lineare Weiterentwicklung darstellten, verfügten jedoch über eine 3/4-Zoll-Druckhüllenbeplankung anstelle von 1/2-Zoll für tiefere Tauchgänge sowie über ein verlängertes Heck und eine Verjüngung am Bug, um Geräusche zu reduzieren und das Unterwassermanövrieren zu verbessern."
rn_patrol_submarine_16_desc:0	"Letzte und technisch ausgereifteste Version der S-Klasse. Die dritte und bei weitem zahlreichste Gruppe der U-Boote der S-Klasse umfasste 50 Boote. Sie waren die größten und am schwersten bewaffneten der S-Klasse und erforderten eine größere Besatzung. Sie waren an der Oberfläche einen Knoten schneller, unter Wasser jedoch zwei Knoten langsamer."
rn_patrol_submarine_17_desc:0	"Die Amphion-Klasse (auch bekannt als die \" A\"-Klasse und Acheron-Klasse) der britischen dieselelektrischen U-Boote wurde für den Einsatz im Pazifikkrieg konzipiert. Nur zwei wurden vor Kriegsende fertiggestellt, doch nach einer Modernisierung in den 1950er Jahren blieben sie bis in die 1970er Jahre im Dienst der Royal Navy. Sie galten bis Kriegsende als die modernsten U-Boote der Royal Navy. Die Erfahrungen aus der Kriegszeit hatten gezeigt, dass U-Boote weiter vom Vereinigten Königreichs und mit größeren Patrouillengebieten operieren mussten, als ursprünglich vorgesehen war – beispielsweise im Fernen Osten und im Mittelmeer. Daher wurde die schnellere und etwas größere A-Klasse so konzipiert, dass sie eine größere Reichweite als die T-Klasse hatte und über Unterkünfte verfügte, die für längere Einsätze geeignet waren."
